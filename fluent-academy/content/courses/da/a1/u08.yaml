unit: 8
title: På rejse
theme: Travel
description: Get around by train, bus, ferry and bike, talk about weekend plans with skal and vil, and book a room with clear questions.
objectives:
  - Buy a ticket and ask about times, tracks and changes, using transport phrases (med toget, på cykel)
  - Talk about future plans with skal, vil and the present tense
  - Book accommodation by asking yes/no and question-word questions
canDo:
  - I can buy a train ticket and ask when and where the train leaves.
  - I can say what I am going to do at the weekend and how I will travel.
  - I can book a room and ask about the price, breakfast and check-in.
review: |
  fill: Vi tager ___ til Bornholm. (the ferry — en færge) || færgen || Tage + transport, in the definite form: færge + n = færgen. || @tags da.definite
  mc: "By bike" in Danish is… || med cykel | *på cykel | i cykel || Bikes take på: på cykel. Trains and buses take med. || @tags da.prepositions-place
  fill: I weekenden ___ jeg besøge min farfar. || skal || Plans: skal + infinitive. || @tags da.future
