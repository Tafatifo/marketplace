  fill: ___ lang tid tager det? || Hvor || How long = hvor lang tid. || @tags da.question-words
  mc: Which question is correct? || Hvad det koster? | *Hvad koster det? | Koster hvad det? || Question word + verb + subject: Hvad koster det? || @tags da.question-words
  tr: When does the bus leave? || Hvornår kører bussen? | Hvornår går bussen? || Hvornår + verb + bussen. || @tags da.question-words
  tr: We're going to Skagen on Saturday. || Vi skal til Skagen på lørdag. | På lørdag skal vi til Skagen. | Vi tager til Skagen på lørdag. | På lørdag tager vi til Skagen. || Skal + til + place (no verb needed), or the present tense with a time word. || @tags da.future
