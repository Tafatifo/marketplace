  - title: Applying for a job
    summary: Understand a job ad, answer interview questions and write a short application — with at-clauses (Jeg tror, at jeg…) and ikke before the verb.
    minutes: 45
    skills: [writing, reading, speaking]
    tags: [da.subordinate-clauses, da.formal-writing, da.sentence-adverbs]
    objectives:
      - Understand a simple job ad
      - Say what you think, hope and know with at-clauses
      - Write a short application and answer typical interview questions
    intro: |
      Applying for a job in Denmark means writing a short application (**en ansøgning**) and then talking about yourself at an interview. You will need sentences like *Jeg tror, at jeg er god til…* and *Jeg håber, at I vil invitere mig til en samtale.* These are at-clauses, and they follow the same word-order rule as fordi. In this lesson you will read a job ad, practise an interview and write your own application.
    vocab: |
      en stilling | a position; a post | n | Jeg søger stillingen som receptionist. | I'm applying for the position as receptionist. | g: c | pl: stillinger | c: en ledig stilling (a vacancy)
      søge | to apply for; to look for | v | Hun har søgt fem job i denne måned. | She has applied for five jobs this month. | n: Past: søgte; perfect: har søgt. No preposition: søge et job.
      en ansøgning | an application | n | Send din ansøgning senest den 1. marts. | Send your application by 1 March at the latest. | g: c | pl: ansøgninger | n: The g is silent: "AN-sø-ning".
      et CV | a CV; a résumé | n | Husk at vedhæfte dit CV. | Remember to attach your CV. | g: n | pl: CV'er | n: Pronounced "se-ve".
      erfaring | experience | n | Jeg har tre års erfaring med kundeservice. | I have three years' experience in customer service. | g: c | c: erfaring med (experience with) | n: Usually without an article.
      en jobsamtale | a job interview | n | Jeg er inviteret til jobsamtale på torsdag. | I've been invited to an interview on Thursday. | g: c | pl: jobsamtaler | n: Often just en samtale.
      god til | good at | expr | Jeg er god til at lytte og løse problemer. | I'm good at listening and solving problems. | n: God til + noun or at + infinitive: god til tysk, god til at lave mad.
      en stærk side | a strength | n | Min stærke side er, at jeg har overblik. | My strength is that I keep the overview. | g: c | pl: stærke sider | n: The opposite: en svag side (a weakness).
      en arbejdsplads | a workplace | n | Jeg søger en arbejdsplads med et godt arbejdsmiljø. | I'm looking for a workplace with a good working environment. | g: c | pl: arbejdspladser
      tro | to think; to believe | v | Jeg tror, at jeg passer godt til jobbet. | I think I'm a good fit for the job. | n: Tro = think when you are not sure. Past: troede.
      håbe | to hope | v | Jeg håber, at I vil invitere mig til en samtale. | I hope you will invite me for an interview. | n: Past: håbede.
      fleksibel | flexible | adj | Jeg er fleksibel og kan godt arbejde i weekenden. | I'm flexible and happy to work at weekends. | n: Plural: fleksible.
      venlig hilsen | kind regards | expr | Venlig hilsen Amina Yusuf | Kind regards, Amina Yusuf | n: The standard ending of a formal email or letter. The g in venlig is silent.
    grammar:
      title: "At-clauses: Jeg tror, at…"
      body: |
        **At** (that) introduces what you say, think, hope or know: *Jeg tror, at… Jeg håber, at… Jeg ved, at… Hun siger, at…* The at-clause is a subordinate clause, so it follows the same rules as fordi: the subject comes before the verb, and **ikke** and other sentence adverbs come **before** the verb.

        - *Jeg har ikke meget erfaring.* → *Jeg ved, at jeg **ikke** har meget erfaring, men jeg lærer hurtigt.*
        - *Jeg er altid til tiden.* → *Min chef siger, at jeg **altid** er til tiden.*
        - *Jeg kan også arbejde om aftenen.* → *Jeg skriver, at jeg **også** kan arbejde om aftenen.*

        In speech and informal writing, Danes often leave out at: *Jeg tror, jeg passer godt til jobbet.* Both are correct. In fast speech you will sometimes hear ikke after the verb, but in writing — and in this course — it goes before the verb.

        After a verb in the past, the at-clause is usually in the past too, as in English: *Hun sagde, at hun ikke havde tid* (She said that she didn't have time).
      table: |
        Main clause | Inside an at-clause
        Jeg har ikke meget erfaring. | Jeg ved, at jeg ikke har meget erfaring.
        Jeg er altid til tiden. | Min chef siger, at jeg altid er til tiden.
        Jeg kan også tale tysk. | Jeg skriver, at jeg også kan tale tysk.
        Jeg har aldrig arbejdet i en butik. | Jeg siger ærligt, at jeg aldrig har arbejdet i en butik.
      examples: |
        Jeg tror, at jeg passer godt til stillingen. | I think I'm a good fit for the position.
        Jeg ved, at jeg ikke har meget erfaring, men jeg lærer hurtigt. | I know I don't have much experience, but I learn quickly. | ikke before har
        Min tidligere chef siger, at jeg altid er positiv. | My former boss says that I'm always positive. | altid before er
        Jeg tror, jeg kan begynde den 1. august. | I think I can start on 1 August. | at left out — common in speech
      tip: "After at and fordi, think \"subject – adverb – verb\": at jeg ikke har, at hun altid er, at vi også kan."
    dialogue:
      title: Jobsamtalen
      setting: A job interview at a hotel in Helsingør. The manager, Martin, interviews Daniela, who has applied for a job as a receptionist.
      speakers: M=Martin/m; D=Daniela/f
      lines: |
        M: Velkommen, Daniela. Fortæl lidt om dig selv. | Welcome, Daniela. Tell me a little about yourself.
        D: Jeg er fra Rumænien, og jeg har boet i Helsingør i fire år. | I'm from Romania, and I've lived in Helsingør for four years.
        M: Hvorfor søger du stillingen som receptionist? | Why are you applying for the receptionist position?
        D: Fordi jeg elsker at møde nye mennesker hver dag. | Because I love meeting new people every day.
        M: Har du erfaring fra hotelbranchen? | Do you have experience in the hotel industry?
        D: Ja, jeg arbejdede to år på et hotel i Bukarest. | Yes, I worked at a hotel in Bucharest for two years.
        M: Hvad er dine stærke sider? | What are your strengths?
        D: Jeg tror, at jeg er god til at bevare roen. | I think I'm good at keeping calm.
        D: Og mine kolleger siger, at jeg altid er positiv. | And my colleagues say that I'm always positive.
        M: Vi har tit vagter i weekenden. Er det et problem? | We often have weekend shifts. Is that a problem?
        D: Nej, slet ikke. Jeg er meget fleksibel. | No, not at all. I'm very flexible.
        M: Fint. Har du nogen spørgsmål til os? | Good. Do you have any questions for us?
    pronunciation:
      title: "Silent g and the ng sound"
      body: |
        In **ansøgning** the g before n is silent: "AN-sø-ning". The ending -ning has the same sound as English *sing*, and so do **stillingen** ("STIL-ling-en") and **erfaring** ("er-FA-ring").

        In **venlig** the g is silent too: *venlig hilsen* sounds like "VEN-li HIL-sen". Compounds like **jobsamtale** are stressed on the first part: "JOB-sam-ta-le". Listen and repeat.
      items: |
        ansøgning
        stillingen
        erfaring
        jobsamtale
        venlig hilsen
        Jeg søger stillingen.
    culture:
      title: Danish job applications
      body: |
        A Danish application is short: one page of **ansøgning** plus a CV of one or two pages. You usually start with *Kære* + first name (or *Hej*), explain why you want the job and what you can offer, and end with *Venlig hilsen*. Many jobs are advertised on Jobnet, the public job portal.

        At the interview, Danes value honesty, teamwork and a relaxed but serious tone. It's normal — even expected — to ask questions about the workplace, the team and the tasks at the end.
    mistakes: |
      Jeg tror, at jeg har ikke nok erfaring. => Jeg tror, at jeg ikke har nok erfaring. | In an at-clause, ikke comes before the verb.
      Jeg er god at lytte. => Jeg er god til at lytte. | "Good at" is god til, followed by at + infinitive.
      Jeg søger for stillingen. => Jeg søger stillingen. | Søge takes a direct object, with no preposition.
    task:
      title: Prepare for an interview
      mode: interaction
      body: |
        Find or imagine a job ad. Prepare answers to three questions: *Fortæl lidt om dig selv. Hvorfor søger du stillingen? Hvad er dine stærke sider?* Use at least two at-clauses and one fordi-clause. Then practise in the "Preparing for a job interview" scenario with the AI coach.
    exercises: |
      fill: Jeg tror, at jeg ___ ___ nok erfaring. (don't have) || ikke ; har || In an at-clause, ikke comes before the verb: at jeg ikke har. || @tags da.subordinate-clauses,da.negation
      fill: Jeg er god ___ at arbejde i team. || til || "Good at" = god til + at + infinitive. || @tags da.infinitive
      mc: Choose the correct sentence. || Hun siger, at hun kan ikke begynde før maj. | *Hun siger, at hun ikke kan begynde før maj. | Hun siger, at ikke hun kan begynde før maj. || In the at-clause, ikke comes after the subject and before the verb. || @tags da.subordinate-clauses,da.negation
      mc: Choose the correct sentence. || *Min chef siger, at jeg altid er til tiden. | Min chef siger, at jeg er altid til tiden. | Min chef siger, at altid jeg er til tiden. || Altid comes before the verb in an at-clause. || @tags da.subordinate-clauses,da.sentence-adverbs
      rw: Start with "Jeg tror, at" :: Jeg kan også arbejde om aftenen. || Jeg tror, at jeg også kan arbejde om aftenen. | Jeg tror, jeg også kan arbejde om aftenen. || Også moves before the verb (kan) in the at-clause. || @tags da.subordinate-clauses,da.sentence-adverbs
      rw: Start with "Hun skriver, at" :: Hun har aldrig arbejdet i en butik. || Hun skriver, at hun aldrig har arbejdet i en butik. | Hun skriver, hun aldrig har arbejdet i en butik. || Aldrig comes before har in the at-clause. || @tags da.subordinate-clauses
      mc: How do you end a formal application? || Knus, Amina | *Venlig hilsen Amina | Vi ses, Amina || Venlig hilsen is the formal ending. Knus (hugs) and Vi ses (see you) are for friends. || @tags da.formal-writing
      tf: Daniela has lived in Helsingør for four years. || true || "Jeg har boet i Helsingør i fire år." || @ctx dialogue
      short: What do Daniela's colleagues say about her? || kw: positiv/positive || "Mine kolleger siger, at jeg altid er positiv." || @ctx dialogue
      listen: @dialogue || What does Martin say about the shifts? || They are always at night | *They are often at weekends | They are only in summer || "Vi har tit vagter i weekenden." || @tags da.listening
      listen: Vi søger en ny medarbejder til vores café i Roskilde. Du skal have erfaring med kunder, og du skal kunne arbejde i weekenden. Send din ansøgning senest fredag. || What must applicants be able to do? || Speak English | *Work at weekends | Drive a car || "Du skal kunne arbejde i weekenden." || @tags da.listening
      order: Jeg ved, at jeg ikke har meget erfaring. || I know that I don't have much experience. || @tags da.subordinate-clauses,da.negation
      tr: I think that I'm good at solving problems. || Jeg tror, at jeg er god til at løse problemer. | Jeg tror, jeg er god til at løse problemer. | Jeg synes, at jeg er god til at løse problemer. || God til + at + infinitive inside an at-clause. || @tags da.subordinate-clauses
      ask: Answer the interview question "Hvorfor søger du stillingen?" Give a reason with fordi and add one sentence with at. || kw: fordi & at/tror/håber/ved || Jeg søger stillingen, fordi jeg elsker at arbejde med mennesker. Jeg tror, at jeg passer godt ind i jeres team.
      write: Write a short application (60–80 words) for a job as a café assistant. || min=50 || req: kære/hej | søger | erfaring | at | venlig hilsen || Kære Lotte. Jeg søger stillingen som caféassistent hos jer. Jeg har to års erfaring fra en café i Lyon, og jeg er god til at lave kaffe og tale med kunder. Mine kolleger siger, at jeg altid er glad og hjælpsom. Jeg er fleksibel og kan også arbejde i weekenden. Jeg håber, at I vil invitere mig til en samtale. Venlig hilsen Amélie Durand
      dict: Jeg tror, at jeg passer godt til jeres team.
