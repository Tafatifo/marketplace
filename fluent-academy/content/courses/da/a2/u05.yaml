unit: 5
title: Hjem og bolig
theme: Home and housing
description: Read flat ads and compare homes with comparatives, furnish a flat and share the chores with plural nouns, and get to know your neighbours with lige så … som and ikke så … som.
free: false
objectives:
  - Find a flat and compare homes with comparatives and end
  - Talk about furniture and chores with indefinite and definite plurals
  - Get to know your neighbours and compare with lige så … som
canDo:
  - I can understand the key information in a flat ad and ask a landlord simple questions.
  - I can compare two homes: bigger, cheaper, closer to the centre, more modern.
  - I can form plural nouns like stole, lamper, børn and stolene, lamperne, børnene.
  - I can talk to a neighbour and understand a notice in my building.
review: |
  fill: Lejligheden i Herning er ___ end lejligheden i Aarhus. (billig) || billigere || Billig + -ere: billigere. || @tags da.comparatives
  mc: What is the comparative of "gammel"? || gamlere | *ældre | mere gammel || Gammel is irregular: gammel → ældre → ældst. || @tags da.comparatives
  fill: Vi har købt tre nye ___. (en lampe) || lamper || Lampe takes -r in the plural: lamper. || @tags da.plural
  fill: Hvor har du lagt ___? (the books — en bog) || bøgerne || Bog is irregular: bøger, and the definite plural adds -ne: bøgerne. || @tags da.plural,da.definite
  mc: Choose the correct sentence. || *Der er flere naboer her end i Kolding. | Der er mere naboer her end i Kolding. | Der er flere naboer her som i Kolding. || Naboer can be counted, so use flere; "than" is end. || @tags da.comparatives,da.plural
  mc: Which plural is correct? || to stoler | *to stole | to stolene || Stol takes -e: stole. Stolene means "the chairs" and doesn't follow a number. || @tags da.plural
  rw: Use "lige så … som" :: Køkkenet er stort. Stuen er også stor. || Køkkenet er lige så stort som stuen. || Lige så + adjective + som; køkkenet is an et-word, so stort. || @tags da.comparatives,da.adjective-agreement
  tr: Our new flat is cheaper than our old one. || Vores nye lejlighed er billigere end vores gamle. | Vores nye lejlighed er billigere end den gamle. | Vores nye lejlighed er billigere end den gamle lejlighed. || Billig → billigere + end. || @tags da.comparatives
  listen: Lejligheden har tre værelser og en stor altan. Huslejen er 8.900 kroner, og den er ledig fra 1. juni. || When is the flat available? || *From 1 June | From 1 July | Right now || "Den er ledig fra 1. juni." || @tags da.listening
  listen: Hej, det er din nabo fra fjerde sal. Må jeg låne en stige? Jeg skal skifte nogle pærer. || What does the neighbour want to borrow? || A drill | *A ladder | Some light bulbs || En stige = a ladder. The pærer (light bulbs) are what he wants to change. || @tags da.listening
  ask: Describe your home to a friend — compare two rooms and say who does which chores. || kw: end/lige så/ikke så & støvsuger/vasker op/gør rent/vasker tøj/rydder op/tømmer || Stuen er større end soveværelset, men køkkenet er lige så lyst som stuen. Jeg støvsuger, og min kæreste vasker op.
  write: Write an email to a friend about your new flat — compare it with your old one and describe the furniture. || min=40 || req: end | større/mindre/billigere/dyrere/lysere/bedre/lige så/ikke så | stole/lamper/reoler/skabe/borde/senge/sofaer || Hej Sune! Nu bor vi i vores nye lejlighed i Randers. Den er større end den gamle, og den er meget lysere. Vi har købt fire stole og to reoler, men vi mangler stadig lamper. Køkkenet er ikke så moderne som før, men det er hyggeligt. Kom snart på besøg! Hilsen Maria
lessons:
  - title: Finding a flat
    summary: Read flat ads and compare homes — større, billigere, tættere på, mere moderne — with comparatives and end.
    minutes: 40
    skills: [reading, grammar, speaking]
    tags: [da.comparatives, da.adjective-agreement]
    objectives:
      - Understand the key words in a flat ad
      - Compare two homes with comparatives and end
      - Ask a landlord simple questions about rent and moving in
    intro: |
      Finding a place to live in a Danish city can take time, and you will compare a lot of options: Is it bigger? Cheaper? Closer to the station? In Danish, most adjectives add **-ere** (*billig → billigere*), a few common ones are irregular (*stor → større, god → bedre*), and long ones use **mere** (*mere moderne*). In this lesson you will read flat ads and compare homes.
    vocab: |
      en husleje | rent | n | Huslejen er 7.500 kroner om måneden. | The rent is 7,500 kroner a month. | g: c | pl: huslejer | n: Heating and water often come on top: plus varme og vand.
      et depositum | a deposit | n | Depositummet er tre måneders husleje. | The deposit is three months' rent. | g: n | pl: depositummer | n: Definite: depositummet.
      en udlejer | a landlord | n | Udlejeren viser lejligheden på torsdag. | The landlord is showing the flat on Thursday. | g: c | pl: udlejere
      en annonce | an ad; an advert | n | Jeg har set en annonce for en lejlighed i Valby. | I've seen an ad for a flat in Valby. | g: c | pl: annoncer
      kvadratmeter | square metres | n | Lejligheden er på 65 kvadratmeter. | The flat is 65 square metres. | g: c | pl: kvadratmeter | n: Written m² in ads. Er på = has a size of.
      en altan | a balcony | n | Vi drikker kaffe på altanen om morgenen. | We drink coffee on the balcony in the morning. | g: c | pl: altaner
      en elevator | a lift; an elevator | n | Der er ingen elevator, og vi bor på fjerde sal. | There's no lift, and we live on the fourth floor. | g: c | pl: elevatorer | c: på fjerde sal (on the fourth floor)
      lys | light; bright | adj | Stuen er meget lys om eftermiddagen. | The living room is very light in the afternoon. | n: Comparative: lysere.
      billig | cheap | adj | Lejligheden i Valby er billigere end den på Nørrebro. | The flat in Valby is cheaper than the one in Nørrebro. | n: billig → billigere → billigst.
      moderne | modern | adj | Køkkenet er mere moderne end i vores gamle lejlighed. | The kitchen is more modern than in our old flat. | n: Never changes. Comparative with mere: mere moderne.
      tæt på | close to | expr | Huset ligger tæt på stationen. | The house is close to the station. | n: Comparative: tættere på (closer to).
      ledig | available; vacant | adj | Lejligheden er ledig fra 1. maj. | The flat is available from 1 May. | n: About a person, ledig means unemployed.
      flytte ind | to move in | expr | Hvornår kan vi flytte ind? | When can we move in? | n: The opposite: flytte ud (move out).
    grammar:
      title: "Comparatives: større, billigere, mere moderne"
      body: |
        To compare two things, use the **comparative** and **end** (than): *Lejligheden er billigere end huset.*

        - Most adjectives add **-ere**: *billig → billigere, lys → lysere, ny → nyere, varm → varmere, lav → lavere.*
        - After a short vowel, a single final consonant is doubled: *tæt → tættere, smuk → smukkere.*
        - Some very common adjectives are **irregular**: *stor → større, lille → mindre, god → bedre, gammel → ældre, ung → yngre, lang → længere, mange → flere, meget → mere.*
        - Long adjectives, and those ending in **-isk** or **-e**, use **mere**: *mere moderne, mere praktisk, mere spændende.*

        The comparative **never changes** for en-words, et-words or plurals: *en større stue, et større køkken, større værelser.*

        Put **meget** (much) or **lidt** (a bit) in front to say how big the difference is: *meget større, lidt billigere.*
      table: |
        Adjective | Comparative | Example
        billig | billigere | Valby er billigere end Østerbro.
        lys | lysere | Stuen er lysere end soveværelset.
        tæt (på) | tættere (på) | Vi bor tættere på stranden nu.
        stor | større | Køkkenet er større.
        lille | mindre | Badeværelset er mindre.
        god | bedre | Beliggenheden er bedre.
        gammel | ældre | Huset er ældre end lejligheden.
        moderne | mere moderne | Køkkenet er mere moderne.
      examples: |
        Den nye lejlighed er større end den gamle. | The new flat is bigger than the old one. | irregular: større
        Huslejen i Aarhus er lavere end i København. | The rent in Aarhus is lower than in Copenhagen. | lav → lavere
        Badeværelset er mindre, men det er mere moderne. | The bathroom is smaller, but it's more modern. | mindre and mere moderne
        Vi har brug for et større værelse til børnene. | We need a bigger room for the children. | the comparative never changes
      tip: "Learn the irregular five like a little poem: stor – større, lille – mindre, god – bedre, gammel – ældre, mange – flere."
    dialogue:
      title: Fremvisning i Valby
      setting: A flat viewing in Valby, Copenhagen. Johanne and Hassan are looking for a bigger home, and the landlord, Bent, shows them a flat.
      speakers: B=Bent/m; J=Johanne/f; H=Hassan/m
      lines: |
        B: Velkommen! Kom bare ind. Lejligheden er på 75 kvadratmeter. | Welcome! Come on in. The flat is 75 square metres.
        J: Den er meget lysere end vores lejlighed nu. | It's much lighter than our flat now.
        H: Og stuen er større. Hvad er huslejen? | And the living room is bigger. What's the rent?
        B: 9.800 kroner om måneden plus varme. | 9,800 kroner a month plus heating.
        H: Hm, det er tusind kroner mere, end vi betaler nu. | Hmm, that's a thousand kroner more than we pay now.
        J: Men den ligger tættere på stationen. | But it's closer to the station.
        B: Ja, og køkkenet er helt nyt. | Yes, and the kitchen is brand new.
        J: Det er meget mere moderne end vores. | It's much more modern than ours.
        H: Er der en altan? | Is there a balcony?
        B: Ja, ud mod gården. Og der er elevator. | Yes, facing the courtyard. And there's a lift.
        J: Hvornår er lejligheden ledig? | When is the flat available?
        B: Fra 1. marts. Depositummet er tre måneders husleje. | From 1 March. The deposit is three months' rent.
    pronunciation:
      title: Comparatives with silent letters
      body: |
        Several comparatives hide silent letters. In **mindre** and **ældre** the d is silent: "MIN-re", "EL-re". In **bedre** the d is a soft d: "BETH-re". In **billigere** the g is silent: "BIL-li-e-re".

        **Større** has a long, open ø and a vocalised r: roughly "STUR-a". In **længere** you hear the ng of English *sing*: "LENG-e-re". Listen, repeat each word, then say the whole sentence.
      items: |
        mindre
        ældre
        bedre
        billigere
        større
        Stuen er større end køkkenet.
    culture:
      title: Finding a home in Denmark
      body: |
        In Copenhagen and Aarhus, rented flats go fast, and many people search on online housing portals every day. Ads often say **2 vær.** (two rooms) — Danes count the living room as a room. There are several types of housing: a privately rented **lejebolig**, an **almen bolig** (non-profit housing with a waiting list), an **andelsbolig** (a cooperative, where you buy a share) and an **ejerlejlighed** (a flat you own).

        When you rent, expect to pay a deposit of up to three months' rent, and often some rent in advance, before you get the keys.
    mistakes: |
      Lejligheden er mere billig. => Lejligheden er billigere. | Short adjectives add -ere. Mere is for long ones like moderne and praktisk.
      Huset er større som lejligheden. => Huset er større end lejligheden. | "Than" is end. Som goes with lige så: lige så stor som.
      Køkkenet er storere. => Køkkenet er større. | Stor is irregular: stor → større.
    task:
      title: Call a landlord
      mode: interaction
      body: |
        You have seen an ad for a flat. Phone the landlord: ask about the rent, the size, the deposit and when it's available, and compare it with where you live now (bigger, cheaper, closer to…). Record your side of the call in Speaking practice.
    exercises: |
      fill: Lejligheden i Valby er ___ end den på Østerbro. (billig) || billigere || Billig + -ere = billigere. || @tags da.comparatives
      fill: Det nye køkken er ___ end det gamle. (stor) || større || Stor is irregular: større. || @tags da.comparatives
      fill: Badeværelset er ___ moderne end i vores gamle lejlighed. || mere || Moderne is a long adjective, so it uses mere. || @tags da.comparatives
      mc: What is the comparative of "god"? || godere | *bedre | mere god || God is irregular: god → bedre → bedst. || @tags da.comparatives
      mc: Choose the correct sentence. || Huset er ældre som lejligheden. | *Huset er ældre end lejligheden. | Huset er mere gammel end lejligheden. || Gammel → ældre, and "than" is end. || @tags da.comparatives
      match: stor = større ; lille = mindre ; god = bedre ; gammel = ældre ; ung = yngre ; mange = flere || The most common adjectives have irregular comparatives. || @tags da.comparatives
      tf: The new flat is cheaper than Hassan and Johanne's flat now. || false || Hassan says: "Det er tusind kroner mere, end vi betaler nu." || @ctx dialogue
      short: Why does Johanne like the location? || kw: station/tættere/closer/close || "Den ligger tættere på stationen" — it's closer to the station. || @ctx dialogue
      listen: @dialogue || When is the flat available? || *From 1 March | From 1 May | Right now || "Fra 1. marts." || @tags da.listening
      listen: Til leje i Horsens. Lys toværelses lejlighed på 58 kvadratmeter. Husleje 6.200 kroner. Ledig fra 1. april. || How big is the flat? || 85 m² | *58 m² | 62 m² || "58 kvadratmeter" — otteoghalvtreds. 85 would be femogfirs. || @tags da.numbers,da.listening
      rw: Make one sentence with "end" :: Stuen er lys. Soveværelset er mørkt. || Stuen er lysere end soveværelset. || Lys → lysere + end. || @tags da.comparatives
      tr: Our new flat is bigger and closer to the centre. || Vores nye lejlighed er større og tættere på centrum. | Vores nye lejlighed er større og ligger tættere på centrum. | Vores nye lejlighed er større og tættere på byen. | Vores nye lejlighed er større og ligger tættere på byen. || Stor → større, tæt på → tættere på. || @tags da.comparatives
      ask: Compare where you live now with your dream home — use at least two comparatives. || kw: end & større/mindre/billigere/dyrere/lysere/bedre/tættere/mere || Min drømmebolig er større end min lejlighed nu, og den ligger tættere på vandet. Den er også mere moderne.
      write: Answer a flat ad — introduce yourself, say why the flat interests you (compare it with where you live now), and ask two questions. || min=40 || req: end | husleje/depositum/ledig/flytte ind | hvornår/hvad/er der/kan jeg || Hej Bent. Jeg hedder Lucía, og jeg har set din annonce. Lejligheden er større end mit værelse nu, og den ligger tættere på mit arbejde. Hvad er depositummet? Og hvornår kan jeg flytte ind? Jeg kan gerne komme og se den på torsdag. Venlig hilsen Lucía Romero
      dict: Den nye lejlighed er lysere og tættere på stationen.

  - title: Furniture and chores
    summary: Furnish a flat and share the housework — with plural nouns, indefinite and definite (stole, stolene; børn, børnene).
    minutes: 40
    skills: [vocabulary, grammar, writing]
    tags: [da.plural, da.definite]
    objectives:
      - Name furniture and things in the home
      - Form indefinite and definite plurals
      - Talk about chores and who does what
    intro: |
      When you move in, you count things: three chairs, two lamps, far too many boxes. Danish plurals come in three main patterns — **-er**, **-e** and **no ending** — plus a few irregular ones, and the definite plural adds **-ne** or **-ene**. In this lesson you will furnish a flat and divide the housework fairly.
    vocab: |
      en sofa | a sofa | n | Vi har købt en brugt sofa på nettet. | We've bought a second-hand sofa online. | g: c | pl: sofaer
      en reol | a bookcase; shelves | n | Reolerne i stuen er fulde af bøger. | The shelves in the living room are full of books. | g: c | pl: reoler
      et skab | a cupboard; a wardrobe | n | Glassene står i skabet over vasken. | The glasses are in the cupboard above the sink. | g: n | pl: skabe
      en lampe | a lamp | n | Vi mangler to lamper til soveværelset. | We need two lamps for the bedroom. | g: c | pl: lamper
      et tæppe | a rug; a blanket | n | Tæppet i stuen er fra min mormor. | The rug in the living room is from my grandmother. | g: n | pl: tæpper
      en flyttekasse | a moving box | n | Vi har stadig tyve flyttekasser i gangen. | We still have twenty moving boxes in the hall. | g: c | pl: flyttekasser
      en ting | a thing | n | Vi har alt for mange ting! | We have far too many things! | g: c | pl: ting | n: No ending in the plural: en ting, mange ting.
      støvsuge | to vacuum; to hoover | v | Jeg støvsuger hele lejligheden om lørdagen. | I vacuum the whole flat on Saturdays. | n: Past: støvsugede. The machine is en støvsuger.
      vaske op | to do the dishes | expr | Hvem vasker op i aften? | Who's doing the dishes tonight? | n: Past: vaskede op. Many Danes also say tage opvasken.
      gøre rent | to clean | expr | Vi gør rent på badeværelset hver fredag. | We clean the bathroom every Friday. | n: Irregular: gjorde rent, har gjort rent.
      vaske tøj | to do the laundry | expr | Jeg vasker tøj to gange om ugen. | I do the laundry twice a week.
      tømme | to empty | v | Kan du tømme skraldespanden? | Can you empty the bin? | n: Past: tømte.
      en skraldespand | a (rubbish) bin | n | Skraldespandene står i gården. | The bins are in the courtyard. | g: c | pl: skraldespande
    grammar:
      title: "Plural nouns: stole and stolene"
      body: |
        Danish has three main plural patterns. Dictionaries always show the plural, so learn it with the noun:

        1. **-er** — many en-words and most words ending in -e: *en lampe → lamper, en sofa → sofaer, en reol → reoler, et tæppe → tæpper, et vindue → vinduer.*
        2. **-e** — many one-syllable words: *en stol → stole, et bord → borde, en seng → senge, et skab → skabe, en skraldespand → skraldespande.*
        3. **No ending** — many short et-words and a few en-words: *et glas → glas, et rum → rum, et ben → ben, en ting → ting, en sko → sko.*

        A few very common nouns are **irregular**: *et barn → børn, en mand → mænd, en bog → bøger, en hånd → hænder, en fod → fødder.* Nouns ending in -er add -e: *en computer → computere, en lærer → lærere.*

        The **definite plural** (*the chairs*) adds **-ne** to plurals ending in -e or -er: *lamperne, stolene, reolerne*. Plurals with no ending add **-ene**: *tingene, børnene, glassene* — doubling a final consonant after a short vowel (*glas → glassene, rum → rummene*).

        After numbers and *mange*, use the indefinite plural: *to stole, mange ting.* Adjectives in the plural add -e: *store vinduer, nye lamper.*
      table: |
        Singular | Plural | Definite plural
        en lampe | lamper | lamperne
        en sofa | sofaer | sofaerne
        en stol | stole | stolene
        et bord | borde | bordene
        et glas | glas | glassene
        en ting | ting | tingene
        et barn | børn | børnene
        en bog | bøger | bøgerne
      examples: |
        Vi har fire stole, men kun to borde. | We have four chairs but only two tables. | -e plural after a number
        Lamperne i køkkenet er nye. | The lamps in the kitchen are new. | definite plural: -ne
        Hvem har vasket glassene? | Who has washed the glasses? | glas → glassene
        Børnene rydder op på deres værelser hver søndag. | The children tidy their rooms every Sunday. | barn → børn → børnene
      tip: "Learn every new noun in three forms: en stol – stole – stolene, et glas – glas – glassene. Say them aloud like a little rhythm."
    dialogue:
      title: Flyttedag i Holstebro
      setting: Moving day in a flat in Holstebro. Two friends, Ditte and Noah, have just moved in together and are looking at all their boxes.
      speakers: D=Ditte/f; N=Noah/m
      lines: |
        D: Puha! Hvor mange flyttekasser har vi egentlig? | Phew! How many moving boxes do we actually have?
        N: Toogtyve. Og alle bøgerne er i dem her. | Twenty-two. And all the books are in these ones.
        D: Hvor skal reolerne stå? | Where should the bookcases go?
        N: I stuen, ved siden af vinduerne. | In the living room, next to the windows.
        D: Og lamperne? Vi har kun to. | And the lamps? We only have two.
        N: Vi køber flere i weekenden. Og nogle stole. | We'll buy more at the weekend. And some chairs.
        D: Okay. Skal vi lave en plan for rengøringen? | Okay. Shall we make a plan for the cleaning?
        N: God idé. Jeg kan godt støvsuge og tømme skraldespandene. | Good idea. I'm happy to vacuum and empty the bins.
        D: Så vasker jeg op og gør rent på badeværelset. | Then I'll do the dishes and clean the bathroom.
        N: Og tøjet? Vi har ingen vaskemaskine. | And the laundry? We don't have a washing machine.
        D: Der er et fælles vaskeri i kælderen. Jeg har set skiltet. | There's a shared laundry room in the basement. I've seen the sign.
        N: Perfekt. Nu mangler vi bare en sofa! | Perfect. Now we just need a sofa!
    pronunciation:
      title: "Quick plural endings: -ne and -erne"
      body: |
        Definite plural endings are unstressed and quick — keep the stress on the first syllable. **Stolene** sounds like "STO-le-ne", and **tingene** like "TING-e-ne".

        In **-erne**, the r is vocalised, so **lamperne** sounds like "LAM-pa-ne" and **vinduerne** like "VIN-du-a-ne". In **børnene** the r is almost silent: "BØ-ne-ne". Listen and repeat, then ask the whole question.
      items: |
        stolene
        tingene
        lamperne
        vinduerne
        børnene
        Hvor er glassene?
    culture:
      title: Sharing the housework
      body: |
        Danish couples are among the most equal in Europe when it comes to sharing housework, and children often have small daily chores, **pligter**, such as laying the table or emptying the dishwasher. Many families make a weekly plan on the fridge.

        Sorting rubbish is a daily chore too: Danish households sort their waste into up to ten types — food waste, paper, cardboard, plastic, glass, metal, food and drink cartons, textiles, hazardous waste and the rest. And when you visit a Danish home, you usually take your shoes off at the door.
    mistakes: |
      Vi har to stoler. => Vi har to stole. | Stol takes -e in the plural: stole.
      Bogene står på reolen. => Bøgerne står på reolen. | Bog is irregular: en bog, bøger, bøgerne.
      Vi har mange tinger. => Vi har mange ting. | Ting has no ending in the plural.
    task:
      title: A cleaning plan
      mode: writing
      body: |
        You share a flat with two people. Write a message to your flatmates with a cleaning plan for the week: which chores, who does what and on which day, and three things you need to buy for the flat. Use at least four plural nouns.
    exercises: |
      fill: Vi har seks ___ i køkkenet. (en stol) || stole || Stol takes -e in the plural: stole. || @tags da.plural
      fill: Hvor er ___? Jeg kan ikke finde dem. (the lamps — en lampe) || lamperne || Lamper + -ne = lamperne. || @tags da.plural,da.definite
      fill: ___ leger i gården. (the children — et barn) || Børnene || Barn is irregular: børn, børnene. || @tags da.plural,da.definite
      mc: What is the plural of "en bog"? || boger | *bøger | boge || Bog is irregular: the vowel changes, and it adds -er: bøger. || @tags da.plural
      mc: "Glassene" means… || a glass | the glass | *the glasses || Glas has no plural ending; the definite plural adds -ene (with double s): glassene. || @tags da.plural,da.definite
      match: en sofa = sofaer ; et bord = borde ; et glas = glas ; en mand = mænd ; en fod = fødder ; en reol = reoler || Learn the plural together with each new noun. || @tags da.plural
      tf: Ditte and Noah have a washing machine in the flat. || false || "Vi har ingen vaskemaskine" — but there's a shared laundry room in the basement. || @ctx dialogue
      short: Which chores will Noah do? || kw: støvsuge/vacuum/hoover/skraldespand/skraldespandene/bins || "Jeg kan godt støvsuge og tømme skraldespandene." || @ctx dialogue
      listen: @dialogue || How many moving boxes do they have? || 12 | *22 | 32 || "Toogtyve" = 22 (two-and-twenty). || @tags da.numbers,da.listening
      listen: Kan du tømme skraldespandene og vaske glassene, før gæsterne kommer? || What should the person do before the guests arrive? || Vacuum and clean the bathroom | *Empty the bins and wash the glasses | Buy chairs and lamps || "Tømme skraldespandene og vaske glassene." || @tags da.plural,da.listening
      rw: Make it two lamps :: Jeg har købt en ny lampe. || Jeg har købt to nye lamper. || Plural noun (lamper) and plural adjective (nye). || @tags da.plural,da.adjective-agreement
