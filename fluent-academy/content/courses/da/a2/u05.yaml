  - title: Neighbours and community
    summary: Get to know your neighbours, understand notices in your building, and compare with lige så … som, ikke så … som, flere and mere.
    minutes: 40
    skills: [listening, speaking, writing]
    tags: [da.comparatives, da.plural, da.adjective-agreement]
    objectives:
      - Greet and talk to neighbours in your building
      - Understand notices about shared spaces
      - Compare with lige så … som, ikke så … som, flere and mere
    intro: |
      In a Danish apartment building you share a lot: the stairwell, the courtyard, the laundry room and the bike room. Neighbours meet at the residents' meeting or at a summer party in the courtyard. In this lesson you will talk to a new neighbour, understand notices in your building, and compare your old and new home with **lige så … som** (as … as) and **ikke så … som** (not as … as).
    vocab: |
      en nabo | a neighbour | n | Vores naboer på tredje sal er meget venlige. | Our neighbours on the third floor are very friendly. | g: c | pl: naboer
      en opgang | a stairwell (and the flats around it) | n | Vi bor i samme opgang som min søster. | We live in the same stairwell as my sister. | g: c | pl: opgange | n: In Danish blocks, each opgang has its own entrance and stairs.
      en gård | a courtyard | n | Børnene spiller fodbold i gården. | The children play football in the courtyard. | g: c | pl: gårde | n: Gård also means farm.
      en cykelkælder | a bike room (in the basement) | n | Du kan stille din cykel i cykelkælderen. | You can put your bike in the bike room. | g: c | pl: cykelkældre
      et vaskeri | a laundry room | n | Man skal booke en tid i vaskeriet. | You have to book a time in the laundry room. | g: n | pl: vaskerier
      et beboermøde | a residents' meeting | n | Der er beboermøde i fælleshuset på tirsdag. | There's a residents' meeting in the common house on Tuesday. | g: n | pl: beboermøder
      et opslag | a notice | n | Har du læst opslaget ved hoveddøren? | Have you read the notice by the front door? | g: n | pl: opslag
      larme | to make a noise | v | Undskyld, at vi larmede i går aftes. | Sorry that we made so much noise last night. | n: Past: larmede. The noun is larm (noise).
      sortere affald | to sort rubbish | expr | Vi sorterer affald i ti forskellige spande. | We sort our rubbish into ten different bins. | n: Affald = rubbish, waste.
      låne | to borrow | v | Må jeg låne din boremaskine? | May I borrow your drill? | n: Past: lånte. Kan du låne mig…? means "Can you lend me…?"
      en fællesspisning | a communal dinner | n | Vi har fællesspisning i gården en gang om måneden. | We have a communal dinner in the courtyard once a month. | g: c | pl: fællesspisninger
      lige så … som | as … as | expr | Gården er lige så grøn som en park. | The courtyard is as green as a park. | n: The negative: ikke så … som (not as … as).
      rolig | quiet; calm | adj | Det er et roligt kvarter med mange familier. | It's a quiet neighbourhood with lots of families. | n: Et-words: roligt. Comparative: roligere.
    grammar:
      title: "Lige så … som, ikke så … som, flere and mere"
      body: |
        Besides the comparative + **end**, Danish compares in two more ways:

        - **lige så + adjective + som** = *as … as*: *Gården er lige så stor som en fodboldbane.*
        - **ikke så + adjective + som** = *not as … as*: *Livet i byen er ikke så roligt som på landet.*

        The adjective keeps its normal agreement with the noun it describes: *Huset er lige så **gammelt** som kirken* (huset is an et-word). *Værelserne er ikke så **store** som i vores gamle lejlighed* (plural).

        **More and fewer.** With nouns you can count (plurals), *more* is **flere** and *fewer* is **færre**: *Der er flere børn i vores opgang end i jeres. Vi har færre naboer nu.* With things you can't count, *more* is **mere**: *Der er mere larm om sommeren. Vi har mere plads nu.*

        After *end* and *som*, Danes usually use the object form of a pronoun in speech: *Hun er ældre end mig. Han er lige så høj som dig.*
      table: |
        Pattern | Example | Meaning
        lige så … som | Vores gård er lige så stor som jeres. | as big as
        ikke så … som | Kvarteret er ikke så roligt som før. | not as quiet as
        flere + plural | Der er flere børn her end i Kolding. | more (things you count)
        færre + plural | Vi har færre naboer nu. | fewer
        mere + no plural | Der er mere larm om sommeren. | more (things you can't count)
      examples: |
        Gården er lige så stor som en fodboldbane. | The courtyard is as big as a football pitch. | lige så … som
        Livet i byen er ikke så roligt som på landet. | Life in the city isn't as quiet as in the countryside. | ikke så … som; roligt agrees with livet
        Der er flere cykler end mennesker i vores opgang! | There are more bikes than people in our stairwell! | flere + plural
        Der er mere støj om sommeren, fordi vinduerne er åbne. | There's more noise in summer because the windows are open. | mere + uncountable
      tip: "Flere for things you can count (flere naboer, flere cykler); mere for things you can't (mere larm, mere plads)."
    dialogue:
      title: Den nye nabo
      setting: The stairwell of an apartment building on Amager in Copenhagen. Josefine has just moved in and meets her neighbour Jørgen, a retired bus driver.
      speakers: J=Jørgen/m; F=Josefine/f
      lines: |
        J: Hej! Er du den nye nabo på anden sal? | Hi! Are you the new neighbour on the second floor?
        F: Ja, jeg hedder Josefine. Jeg flyttede ind i mandags. | Yes, I'm Josefine. I moved in last Monday.
        J: Velkommen til opgangen! Jeg hedder Jørgen. | Welcome to the building! I'm Jørgen.
        F: Tak! Undskyld, at vi larmede med flyttekasserne. | Thanks! Sorry we were so noisy with the moving boxes.
        J: Det er helt i orden. Hvor boede du før? | That's quite all right. Where did you live before?
        F: I Kolding. Der var ikke så travlt som her. | In Kolding. It wasn't as busy as here.
        J: Nej, men gården her er lige så grøn som en park. | No, but the courtyard here is as green as a park.
        F: Det er rigtigt. Hvor er cykelkælderen? | That's true. Where's the bike room?
        J: Under opgangen. Og vaskeriet er ved siden af. | Under the stairwell. And the laundry room is next to it.
        J: Husk at booke en tid på listen ved døren. | Remember to book a time on the list by the door.
        F: Tak for hjælpen. Er der mange børn i opgangen? | Thanks for your help. Are there many children in the building?
        J: Flere end før! Og på lørdag er der fællesspisning i gården. | More than before! And on Saturday there's a communal dinner in the courtyard.
    pronunciation:
      title: "Long compounds: stress the first part"
      body: |
        Danish loves long compound words. Stress the **first** part and say the rest more quietly: **cykelkælder** ("CY-kel-kæl-der"), **fællesspisning** ("FÆL-les-spis-ning"), **opgang** ("OP-gang").

        Two traps: in **beboermøde** the prefix be- is never stressed, so the stress falls on -bo-: "be-BO-er-mø-de". And **vaskeri** is not a compound — the ending -eri takes the stress: "vas-ke-RI". Listen and repeat.
      items: |
        cykelkælder
        fællesspisning
        opgang
        beboermøde
        vaskeri
        Hvor er cykelkælderen?
    culture:
      title: Life in a Danish apartment block
      body: |
        Many apartment buildings have a residents' association with a yearly **beboermøde**, where neighbours vote on things like a new bike room or a courtyard party. A caretaker, **en vicevært**, looks after the building. Most buildings have house rules — **en husorden** — for example about quiet hours in the evening and booking the laundry room.

        Neighbours often say hello on the stairs but keep some distance. A summer party in the courtyard, a **gårdfest**, or a communal dinner is the easiest way to get to know them — and a short note in the stairwell before your own party is always appreciated.
    mistakes: |
      Huset er lige så stor som kirken. => Huset er lige så stort som kirken. | The adjective still agrees with the noun: huset is an et-word, so stort.
      Der er mere børn her. => Der er flere børn her. | Countable plural nouns take flere; mere is for things you can't count.
      Min lejlighed er ikke så stor end din. => Min lejlighed er ikke så stor som din. | After så, use som — never end.
    task:
      title: A note for the stairwell
      mode: writing
      body: |
        You are having a birthday party on Saturday. Write a friendly note (et opslag) for your neighbours: say who you are and where you live, when the party is, apologise in advance for any noise, and invite them for a drink.
    exercises: |
      fill: Vores nye lejlighed er lige så lys ___ vores gamle. || som || Lige så … som = as … as. || @tags da.comparatives
      fill: Der er ___ børn i vores opgang end i jeres. (more) || flere || Børn can be counted, so "more" is flere. || @tags da.comparatives,da.plural
      fill: Om sommeren er der ___ larm i gården. (more) || mere || Larm (noise) can't be counted, so "more" is mere. || @tags da.comparatives
      mc: Choose the correct sentence. || Huset er lige så gammel som kirken. | *Huset er lige så gammelt som kirken. | Huset er lige så gammelt end kirken. || Huset is an et-word, so gammelt; lige så goes with som. || @tags da.comparatives,da.adjective-agreement
      mc: "Kvarteret er ikke så roligt som før" means… || The area is quieter than before. | *The area isn't as quiet as before. | The area is as quiet as before. || Ikke så … som = not as … as. || @tags da.comparatives
      mc: You want to use your neighbour's drill. You ask: || *Må jeg låne din boremaskine? | Må du låne min boremaskine? | Jeg låner din boremaskine. || Må jeg låne…? = May I borrow…? The other two ask about your own drill or simply take it. || @tags da.modal-verbs
      tf: Josefine moved in last Monday. || true || "Jeg flyttede ind i mandags." || @ctx dialogue
      short: Where is the laundry room? || kw: ved siden af/next to/cykelkælder/bike room/under || "Vaskeriet er ved siden af" — next to the bike room, under the stairwell. || @ctx dialogue
      listen: @dialogue || What happens on Saturday? || A residents' meeting | *A communal dinner in the courtyard | A party in Josefine's flat || "På lørdag er der fællesspisning i gården." || @tags da.listening
      listen: Beboermøde i fælleshuset tirsdag klokken nitten. Vi taler om den nye cykelkælder og sommerfesten. Alle er velkomne. || Where is the meeting? || In the courtyard | *In the common house | In the bike room || "Beboermøde i fælleshuset" — in the common house. || @tags da.listening
      rw: Use "ikke så … som" :: Min nye opgang er mindre end min gamle. || Min nye opgang er ikke så stor som min gamle. || Mindre end = ikke så stor som. || @tags da.comparatives
      tr: Our courtyard is as big as a football pitch. || Vores gård er lige så stor som en fodboldbane. | Vores gårdhave er lige så stor som en fodboldbane. || Lige så + stor (en gård) + som. || @tags da.comparatives
      ask: Tell a new neighbour where you lived before and compare it with your new home — use lige så … som or ikke så … som. || kw: lige så/ikke så & som || Før boede jeg i Vejle. Der var ikke så travlt som her, men min nye lejlighed er lige så hyggelig som min gamle.
      write: Write a note for your stairwell — you are having a party on Saturday. || min=35 || req: fest | lørdag | undskyld/beklager | velkommen/velkomne/kig forbi || Kære naboer! Jeg hedder Kiran og bor på tredje sal til venstre. På lørdag holder jeg fødselsdagsfest fra klokken otte. Undskyld på forhånd, hvis der bliver lidt larm. Kig gerne forbi til et glas vin – I er alle velkomne! Mange hilsner Kiran
      dict: Der er flere cykler end mennesker i vores cykelkælder.
