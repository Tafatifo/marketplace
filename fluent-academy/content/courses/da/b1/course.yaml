language: da
level: B1
title: "Danish B1 · Independence"
description: Describe people and tell stories, manage job interviews, emails and meetings, talk about learning, media, the environment, health and culture, and discuss travel and customs — the Danish you need to get by on your own.
hours: 100
summary: >-
  B1 learners can deal with most situations that come up in daily life, at work and while travelling in Denmark.
  They can describe people, experiences and events, tell an anecdote, explain their plans, give reasons and
  opinions, and write connected texts such as emails, reviews and short proposals. They follow the main points of
  clear standard Danish on familiar topics — at work, in the news, on the radio and in films and series. This
  course delivers around 100 hours of guided practice across 8 units, set across Denmark — from Aarhus, Odense and
  Esbjerg to Svendborg, Aalborg, Bornholm and the neighbourhoods of Copenhagen.
objectives:
  - Describe people's personality, talk about friendships and tell an anecdote with the past, the perfect and relative clauses
  - Handle a job interview, write formal emails, take part in meetings and explain career choices with connectors such as derfor and selvom
  - Talk about school and language learning, and give advice with the past forms of the modal verbs
  - Report what the news says, talk about digital habits and solve a tech problem with the past perfect, reported speech and indirect questions
  - Compare city and country life, describe green habits and propose solutions with the s-passive and definite adjective phrases
  - Talk about stress, food culture and sport, and use sin, sit and sine correctly next to hans, hendes and deres
  - Review films and series, talk about books and music, and retell a story with particle verbs and narrative connectors
  - Discuss responsible travel, customs and stereotypes, and imagine situations with hvis + past and ville
canDo:
  listening:
    - Understand the main points of clear standard speech on familiar matters at work, at school and in leisure time
    - Follow the main points of radio and TV news, podcasts and interviews on familiar topics when the delivery is clear
  reading:
    - Understand texts that consist mainly of everyday or job-related language, such as emails, notices and articles
    - Understand the description of events, feelings and wishes in personal messages, blogs and reviews
  spokenInteraction:
    - Deal with most situations likely to arise at work, in services and while travelling
    - Enter unprepared into conversation on familiar topics, agree and disagree politely and give advice
  spokenProduction:
    - Narrate a story or the plot of a book or film and describe your reactions
    - Briefly give reasons and explanations for opinions, plans and actions
  writing:
    - Write simple connected texts on familiar topics, such as a review, a forum post or a short proposal
    - Write formal and personal emails describing experiences, asking for information and giving your opinion
grammar:
  - Past or perfect? Duration up to now (har kendt i ti år), lige, siden and switching from perfect to past in a story
  - Relative clauses with som and der, the position of ikke and other adverbs, and prepositions at the end (som jeg stoler på)
  - Da, når and mens in stories, and the word order after a subordinate clause
  - Connectors of cause and result (fordi, derfor, så) and of contrast (selvom, alligevel)
  - Formal and neutral register in emails and meetings (Kære…, Med venlig hilsen, modtage, vedhæftet, du rather than De)
  - The past of the modal verbs (kunne, ville, skulle, måtte, burde) for the past, and for soft advice (du burde, du kunne)
  - The past perfect with havde and var (havde glemt, var gået) and narrative connectors (efter at, før, indtil, så snart)
  - Reported speech with a present reporting verb (hun siger, at…) and indirect questions with om and question words
  - The s-passive in the present and with modal verbs (sorteres, skal afleveres, kan genbruges) and der + passive
  - Definite adjective phrases (den store by, det gamle hus, de nye lejligheder; lille and små)
  - Reflexive possessives sin, sit and sine versus hans, hendes and deres, including man and hver
  - Particle verbs (finde ud af, give op, holde op med) and fused verbs (udgive, indspille)
  - Hypotheses with hvis + past and ville / kunne (Hvis jeg havde mere tid, ville jeg…) and wishes with ville ønske
vocabularyDomains:
  - Personality, friendship, conflict and anecdotes
  - Job interviews, emails, meetings and career change
  - School systems, language learning and advice
  - News, social media, digital life and technical problems
  - City and country life, recycling, energy and local solutions
  - Stress and wellbeing, Danish food culture, sport and exercise
  - Films, series, books, music and storytelling
  - Sustainable travel, hypothetical situations, customs and stereotypes
assessment: A 60-minute cumulative test covering grammar, vocabulary, listening and reading tasks from all eight units, with a short writing task. A score of 70% or more confirms the B1 level.
units:
  - title: Mennesker og relationer
    theme: People and relationships
    lessons: [Personality and character, Friendship and disagreements, Telling an anecdote]
  - title: Arbejde og karriere
    theme: Work and careers
    lessons: [The job interview, Emails and meetings, Changing careers]
  - title: Uddannelse og læring
    theme: Education and learning
    lessons: [School memories and systems, How we learn languages, Giving advice]
  - title: Medier og teknologi
    theme: Media and technology
    lessons: [News and how we follow it, Digital life, Solving a tech problem]
  - title: By og miljø
    theme: City and environment
    lessons: [City or countryside?, Green habits, Proposing solutions]
  - title: Sundhed og livsstil
    theme: Health and lifestyle
    lessons: [Stress and wellbeing, Food culture, Sport and fitness]
  - title: Kultur og underholdning
    theme: Culture and entertainment
    lessons: [Reviewing a film or series, Books and music, Recommending and retelling a story]
  - title: Samfund og rejser
    theme: Society and travel
    lessons: [Travelling responsibly, What would you do if…?, Customs and stereotypes]
assessmentItems: |
  mc: Which sentence is correct? || *Jeg har en kollega, der altid hjælper andre. | Jeg har en kollega, der hjælper altid andre. | Jeg har en kollega, altid der hjælper andre. || A relative clause is a subordinate clause, so altid (like ikke) comes before the verb: der altid hjælper. || @tags da.relative-clauses,da.sentence-adverbs @obj Describe people's personality, talk about friendships and tell an anecdote with the past, the perfect and relative clauses
  mc: "___ jeg kom hjem i går aftes, stod døren åben." || *Da | Når | Mens || Da is used for one single event in the past. Når is for repeated events (or the present and future), and mens means "while", which doesn't fit a short moment like coming home. || @tags da.subordinate-clauses,da.past
  mc: "Jeg elsker at arbejde med mennesker. Derfor ___ stillingen." || *søger jeg | jeg søger | søger at jeg || Derfor is an adverb, so when it starts the sentence the verb comes next (V2): Derfor søger jeg… || @tags da.connectors,da.word-order @obj Handle a job interview, write formal emails, take part in meetings and explain career choices with connectors such as derfor and selvom
  mc: You are writing to a company you have never been in contact with. Which closing is the most suitable? || *Med venlig hilsen | Knus | Hej hej || Med venlig hilsen is the neutral, polite closing for formal emails. Knus (hugs) and Hej hej are for friends and family. || @tags da.formal-writing,da.register
  fill: Da jeg gik i folkeskolen, ___ vi ikke bruge mobiltelefon i timerne. (were not allowed to) || måtte || Måtte is the past of må. Måtte ikke = was not allowed to. || @tags da.modal-verbs @obj Talk about school and language learning, and give advice with the past forms of the modal verbs
  mc: Which sentence means "You ought to go to bed earlier"? || *Du burde gå tidligere i seng. | Du burde at gå tidligere i seng. | Du burde går tidligere i seng. || Burde is a modal verb, so it is followed by the infinitive without at: burde gå. || @tags da.modal-verbs,da.infinitive
  fill: Da jeg kom hjem, ___ min søn allerede spist. || havde || The past perfect is havde + participle: havde spist (had eaten). Spise forms its perfect with have. || @tags da.past-perfect @obj Report what the news says, talk about digital habits and solve a tech problem with the past perfect, reported speech and indirect questions
  mc: Mette says: "Jeg kommer ikke i morgen." Which report is correct? || *Mette siger, at hun ikke kommer i morgen. | Mette siger, at hun kommer ikke i morgen. | Mette siger, at jeg ikke kommer i morgen. || In reported speech jeg becomes hun, and in the at-clause ikke comes before the verb: at hun ikke kommer. || @tags da.reported-speech,da.negation
  fill: Glas og metal ___ i den grønne container. (sortere — passive) || sorteres || The s-passive in the present: sorterer → sorteres (is sorted). || @tags da.passive @obj Compare city and country life, describe green habits and propose solutions with the s-passive and definite adjective phrases
  mc: Vi bor i ___ hus ved fjorden. || *det gamle | den gamle | det gammelt || Hus is an et-word, so the article is det, and after den/det/de the adjective always takes -e: det gamle hus. || @tags da.definite-adjectives
  mc: "Peter cykler i skole med ___ datter hver morgen." (his own daughter) || *sin | hans | sit || The daughter belongs to the subject, Peter, so Danish uses the reflexive sin. Datter is an en-word, so it is sin, not sit. Hans would mean another man's daughter. || @tags da.reflexive-possessive @obj Talk about stress, food culture and sport, and use sin, sit and sine correctly next to hans, hendes and deres
  mc: "Mine naboer har solgt ___ bil." (their own car) || sin | *deres | sine || Sin, sit and sine are only used with a third-person singular subject. With a plural subject like mine naboer, use deres. || @tags da.reflexive-possessive,da.possessives
  mc: Which sentence is correct? || *Hun gav ikke op, selvom det var svært. | Hun gav op ikke, selvom det var svært. | Hun ikke gav op, selvom det var svært. || In a main clause ikke comes after the verb and before the particle: gav ikke op. || @tags da.phrasal-verbs,da.negation @obj Review films and series, talk about books and music, and retell a story with particle verbs and narrative connectors
  fill: ___ vi havde spist, gik vi en tur langs stranden. (after) || Efter at / Efter || Efter at (or just efter) + past perfect: the eating happened before the walk. || @tags da.connectors,da.past-perfect
  mc: Hvis jeg ___ mere tid, ville jeg lære at spille klaver. || *havde | har | har haft || An imagined situation uses hvis + past and ville + infinitive: hvis jeg havde…, ville jeg… || @tags da.conditional @obj Discuss responsible travel, customs and stereotypes, and imagine situations with hvis + past and ville
  listen: Min søster har skiftet job, fordi hun var meget stresset. Nu arbejder hun tredive timer om ugen og cykler på arbejde hver dag. || Why did the sister change jobs? || She wanted more money | *She was very stressed | She moved to another city || "Fordi hun var meget stresset" — because she was very stressed. || @tags da.listening,da.perfect
  listen: Fra næste måned skal madaffald sorteres i de brune spande i gården. Pap afleveres stadig i containeren ved cykelkælderen. || Where does cardboard go? || In the brown bins in the courtyard | *In the container by the bike basement | Into the normal rubbish || "Pap afleveres stadig i containeren ved cykelkælderen." || @tags da.listening,da.passive
  listen: Hvis jeg kunne vælge, ville jeg tage toget til Rom. Det tager længere tid, men man ser meget mere af Europa. || Why would the speaker take the train? || It is cheaper | It is faster | *You see much more on the way || "Man ser meget mere af Europa" — you see much more of Europe. The speaker says it takes longer. || @tags da.listening,da.conditional
  short: You want to ask a stranger politely whether they know when the library opens. What do you say? || kw: ved du/ved De/kan du sige & hvornår & biblioteket & åbner || Undskyld, ved du, hvornår biblioteket åbner? In an indirect question the subject comes before the verb: hvornår biblioteket åbner. || @tags da.questions,da.subordinate-clauses
  tr: We have known each other for ten years. || Vi har kendt hinanden i ti år. | Vi har kendt hinanden i ti år nu. || Something that started in the past and is still true takes the perfect + i: har kendt … i ti år. || @tags da.perfect,da.prepositions-time
  rw: Make it an imagined situation :: Hvis jeg har tid, hjælper jeg dig. || Hvis jeg havde tid, ville jeg hjælpe dig. | Hvis jeg havde tid, kunne jeg hjælpe dig. || Imagined situations use hvis + past (havde) and ville or kunne + infinitive in the main clause. || @tags da.conditional,da.word-order
  write: Write a post for a Danish online forum about a habit you have changed (for example digital, green or healthy habits) — what you did before, why you changed it, what is better now and what you would recommend to others. || min=60 || req: før/tidligere/førhen | fordi/derfor | selvom | hvis || Hej alle sammen! For et år siden brugte jeg min telefon flere timer om dagen, også om aftenen i sengen. Jeg sov dårligt, og derfor besluttede jeg at lave en regel: ingen skærm efter klokken ni. Selvom det var svært i starten, har jeg holdt fast i det. Nu læser jeg en bog i stedet, og jeg sover meget bedre. Hvis jeg var jer, ville jeg prøve det i bare en uge. Det er det hele værd! Hilsen Sofie
