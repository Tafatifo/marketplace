unit: 2
title: Arbejde og karriere
theme: Work and careers
description: Answer questions at a job interview, write work emails and follow a meeting, and talk about changing careers — with fordi, derfor and så, a neutral and polite register, and selvom and alligevel.
free: true
objectives:
  - Answer typical job-interview questions and give reasons with fordi, derfor and så
  - Write and understand work emails and follow a meeting in a neutral, polite register
  - Talk about career changes and contrasts with selvom and alligevel
canDo:
  - I can present my experience and strengths at a job interview and explain why I want the job.
  - I can write a polite work email with the right opening, closing and fixed phrases.
  - I can follow the agenda of a meeting and say that I can't attend.
  - I can explain a big decision with selvom and alligevel.
review: |
  fill: Jeg har arbejdet som kok i ti år. ___ kender jeg branchen godt. || Derfor || Derfor gives the result, and the verb follows straight after it: Derfor kender jeg… || @tags da.connectors,da.word-order
  mc: Which sentence is correct? || *Jeg søger jobbet, fordi jeg ikke vil arbejde om natten. | Jeg søger jobbet, fordi jeg vil ikke arbejde om natten. | Jeg søger jobbet, fordi ikke jeg vil arbejde om natten. || After fordi, the order is subject + ikke + verb: fordi jeg ikke vil. || @tags da.subordinate-clauses,da.negation
  mc: You are writing to the customer service of a company. Which opening is suitable? || *Kære kundeservice | Hej skat | Halløjsa || Kære + the receiver is polite and neutral. Hej skat (hi darling) and halløjsa are only for people you know very well. || @tags da.formal-writing,da.register
  fill: Vi har ___ din ansøgning og vender tilbage i næste uge. (the formal word for "fået") || modtaget || Modtage is the formal word for få: har modtaget = have received. || @tags da.formal-writing,da.perfect
  fill: ___ det var en stor risiko, skiftede hun karriere. || Selvom / Selv om || Selvom introduces the surprise: she did it although it was risky. After the selvom-clause, the verb comes first: skiftede hun. || @tags da.connectors,da.subordinate-clauses
