      listen: I vores opgang skal alt affald sorteres. Papir og pap samles i kælderen, og glas afleveres i containeren ved parkeringspladsen. || Where do people take glass? || *To the container by the car park | To the basement | To the supermarket || "Glas afleveres i containeren ved parkeringspladsen." || @tags da.listening,da.passive
      rw: Make it passive :: Man sorterer plastik i den gule container. || Plastik sorteres i den gule container. || Man sorterer → sorteres; the object (plastik) becomes the subject. || @tags da.passive
      rw: Make it passive :: Du kan genbruge tøjet. || Tøjet kan genbruges. || Modal + passive infinitive: kan genbruges. || @tags da.passive,da.modal-verbs
      tr: Bottles with a deposit can be returned at the supermarket. || Flasker med pant kan afleveres i supermarkedet. | Pantflasker kan afleveres i supermarkedet. | Flasker med pant kan leveres tilbage i supermarkedet. || Can be returned = kan afleveres: modal + passive infinitive. || @tags da.passive
      ask: A new neighbour asks how waste is sorted in your building. Explain three rules with the s-passive. || kw: sorteres/afleveres/smides/samles/hentes/genbruges/lægges || Hos os sorteres madaffald i de grønne poser. Glas og metal afleveres i containeren i gården, og batterier må ikke smides i skraldespanden.
