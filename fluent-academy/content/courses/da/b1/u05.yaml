  - title: Proposing solutions
    summary: Read a letter to a local newspaper and make proposals for your own area with foreslå, at…, man kunne… and der + passive.
    minutes: 45
    skills: [reading, writing, grammar]
    tags: [da.passive, da.modal-verbs, da.subordinate-clauses]
    objectives:
      - Make proposals with foreslå, at… and hvad med at…?
      - Use man + modal and der + passive when the doer isn't important
      - Structure an argument with for det første, for det andet…
    intro: |
      Danes like to get involved locally: in residents' associations, at public meetings and in letters to the local newspaper. A good proposal names the problem, offers concrete solutions and sounds constructive. In this lesson you'll read a letter about making a street greener and learn the phrases you need: **Vi foreslår, at…**, **Man kunne…** and **Der bør plantes flere træer.**
    vocab: |
      foreslå | to propose; to suggest | v | Jeg foreslår, at vi mødes på torsdag. | I suggest that we meet on Thursday. | n: Irregular: foreslog, har foreslået. Often followed by at + clause.
      en løsning | a solution | n | Vi skal finde en løsning sammen. | We have to find a solution together. | g: c | pl: løsninger
      en beboer | a resident | n | Alle beboere er inviteret til mødet. | All residents are invited to the meeting. | g: c | pl: beboere | c: en beboerforening (a residents' association)
      kommunen | the municipality; the local council | n | Kommunen har lovet en ny cykelsti. | The council has promised a new cycle path. | g: c | pl: kommuner | n: Denmark has 98 municipalities.
      plante | to plant | v | Der bør plantes flere træer i byen. | More trees should be planted in the town. | n: Past: plantede.
      en skygge | a shade; a shadow | n | Træerne giver skygge om sommeren. | The trees give shade in summer. | g: c | pl: skygger
      frivillig | voluntary; a volunteer | adj | Hun arbejder som frivillig i en genbrugsbutik. | She works as a volunteer in a second-hand shop. | n: Also a noun: en frivillig, plural frivillige.
      reparere | to repair | v | Her kan du få repareret din cykel gratis. | Here you can get your bike repaired for free. | n: Past: reparerede.
      for det første | firstly | expr | For det første er det billigt. | Firstly, it's cheap. | n: Then for det andet, for det tredje. The verb comes next.
      tom | empty | adj | Den gamle butik har stået tom i et år. | The old shop has stood empty for a year. | n: With et-words: tomt; plural and definite: tomme.
      et løft | a lift; a boost | n | Gaden trænger til et grønt løft. | The street needs a green boost. | g: n | pl: løft
      hvad med at…? | how about…? | expr | Hvad med at holde et loppemarked? | How about holding a flea market? | n: Followed by the infinitive.
    grammar:
      title: "Proposals: foreslå, at…, man kunne… and der + passive"
      body: |
        When you propose a change for your street, school or town, you often talk about **what should be done**, not about who should do it. Three tools help:

        **1. Man + modal verb.** *Man kunne plante flere træer.* · *Man burde lukke gaden for biler.* With kunne and burde, the proposal sounds polite and open (unit 3).

        **2. Der + s-passive.** When there is no natural subject, **der** fills the subject position, and the passive verb follows: *Der **bruges** alt for meget plastik* (too much plastic is used). With a modal: *Der **bør plantes** flere træer.* · *Der **skal laves** en ny cykelsti.* After a first element, der comes after the verb: *For det andet **bør der** plantes træer.*

        **3. Foreslå, at…** (propose that) + a subordinate clause: *Vi foreslår, at kommunen **laver** en ny legeplads.* Ikke goes before the verb: *Jeg foreslår, at vi **ikke bruger** engangsservice.* In speech, *Hvad med at…?* + infinitive is a friendly alternative: *Hvad med at starte en byttecentral?*

        **Structure** your proposal with *for det første, for det andet, for det tredje* — each one is followed by the verb (V2).
      table: |
        Tool | Example | Meaning
        man + modal | Man kunne lave en fælleshave. | We could make a shared garden.
        der + passive | Der bruges for meget plastik. | Too much plastic is used.
        der + modal + passive | Der bør plantes flere træer. | More trees should be planted.
        foreslå, at | Vi foreslår, at gaden lukkes for biler. | We propose that the street is closed to cars.
        hvad med at…? | Hvad med at holde et loppemarked? | How about holding a flea market?
      examples: |
        Der smides alt for meget mad ud i Danmark. | Far too much food is thrown away in Denmark. | der + s-passive
        Der bør laves flere cykelstier i byen. | More cycle paths should be made in the town. | der + modal + passive
        Vi foreslår, at den gamle parkeringsplads bliver til en park. | We propose that the old car park becomes a park. | foreslå, at + subordinate clause
        Man kunne starte en reparationscafé på biblioteket. | You could start a repair café at the library. | man + kunne
      tip: "Name the problem in one sentence, then give two or three solutions with for det første, for det andet. Short and concrete works best in Danish."
    reading:
      title: "Læserbrev: Giv Torvegade et grønt løft"
      text: |
        Læserbrev: Giv Torvegade et grønt løft

        Jeg har boet på Torvegade i Viborg i tolv år, og jeg holder meget af vores lille gade. Men den har et problem: Der er næsten ingen træer, og den gamle parkeringsplads midt i gaden står tom det meste af dagen. Om sommeren bliver det meget varmt, og når det regner kraftigt, løber vandet ned i kældrene.

        Derfor har vi i beboerforeningen tre forslag.

        For det første foreslår vi, at parkeringspladsen bliver til en lille park med bænke, træer og blomster. I dag bruges kun omkring ti pladser om dagen, og bilerne kan parkere i p-huset 200 meter væk.

        For det andet bør der plantes træer langs hele gaden. Træer giver skygge, og de kan opsuge en del af regnvandet.

        For det tredje kunne man starte en reparationscafé i det tomme butikslokale på hjørnet. Her kan gamle cykler, lamper og tøj repareres i stedet for at ende i skraldespanden.

        Vi ved godt, at det koster penge. Men mange beboere har allerede sagt, at de gerne vil hjælpe som frivillige. Vi håber, at kommunen vil se på forslagene til foråret.

        Hanne Vestergaard, formand for Beboerforeningen Torvegade
      translation: |
        Letter to the editor: Give Torvegade a green boost

        I have lived on Torvegade in Viborg for twelve years, and I'm very fond of our little street. But it has a problem: there are almost no trees, and the old car park in the middle of the street stands empty most of the day. In summer it gets very hot, and when it rains heavily, the water runs down into the basements.

        That's why we in the residents' association have three proposals.

        Firstly, we propose that the car park becomes a small park with benches, trees and flowers. Today only about ten spaces are used a day, and the cars can park in the multi-storey car park 200 metres away.

        Secondly, trees should be planted along the whole street. Trees give shade, and they can soak up some of the rainwater.

        Thirdly, a repair café could be started in the empty shop on the corner. Here old bikes, lamps and clothes can be repaired instead of ending up in the bin.

        We know that it costs money. But many residents have already said that they would like to help as volunteers. We hope that the municipality will look at the proposals this spring.

        Hanne Vestergaard, chair of the Torvegade Residents' Association
    pronunciation:
      title: "The weak -e in den gamle, det tomme"
      body: |
        The -e ending of definite adjectives is weak — a short, relaxed vowel — but it must be heard: *den gamle* is "den GAM-le", not "den gam". Without it, the phrase sounds wrong to Danish ears.

        After a short vowel the consonant is doubled in writing — *tom → tomme*, *grøn → grønne* — but you say it only once and keep the vowel short: "TOM-me". *Lille* also ends in a weak e: "LIL-le". Listen and repeat the phrases, then the sentence.
      items: |
        den gamle parkeringsplads
        det tomme butikslokale
        de små gader
        den grønne park
        Vi foreslår, at den gamle parkeringsplads bliver til en park.
    culture:
      title: Getting involved locally
      body: |
        Denmark has 98 municipalities (**kommuner**), and they decide many things that affect daily life: schools, roads, parks and waste collection. Residents can take part in public meetings (*borgermøder*), send proposals by email, or write a **læserbrev** (letter to the editor) to the local newspaper — one of the most-read sections in many local papers.

        Voluntary work is a big part of Danish life: around four in ten adults do some kind of unpaid work for a club, an association or their local area. Repair cafés, shared gardens and swap boxes for books and clothes have popped up in many towns.
    mistakes: |
      Der plantes skal flere træer. => Der skal plantes flere træer. | The modal comes first, then the passive infinitive.
      Vi foreslår, at vi bruger ikke engangsservice. => Vi foreslår, at vi ikke bruger engangsservice. | The at-clause is a subordinate clause, so ikke goes before the verb.
      For det første det er billigt. => For det første er det billigt. | For det første is the first element, so the verb comes next (V2).
    task:
      title: A proposal for your area
      mode: writing
      body: |
        Think of a problem where you live — too much traffic, no place for young people, an empty building, litter in the park. Write a short letter to the editor (6–8 sentences): describe the problem, then give two or three proposals with for det første / for det andet, foreslå, at…, man kunne… and der + passive. Read it aloud afterwards and check the word order after each first element.
    exercises: |
      fill: Der ___ alt for meget mad ud i Danmark. (smide — passive) || smides || Der + present s-passive: der smides (is thrown away). || @tags da.passive
      fill: Der bør ___ flere træer i byen. (plante — passive) || plantes || Modal + passive infinitive: bør plantes (should be planted). || @tags da.passive,da.modal-verbs
      mc: "Der bruges for meget plastik." What does it mean? || *Too much plastic is used | Plastic is too expensive | Plastic is used too little || Der + passive: too much plastic is used — the sentence doesn't say by whom. || @tags da.passive
      mc: Which sentence is correct? || *Vi foreslår, at man ikke bruger engangsservice. | Vi foreslår, at man bruger ikke engangsservice. | Vi foreslår, man at ikke bruger engangsservice. || In the at-clause: subject + ikke + verb. || @tags da.subordinate-clauses,da.negation
      mc: Which sentence is correct? || *For det andet bør der plantes træer. | For det andet der bør plantes træer. | For det andet bør plantes der træer. || For det andet takes first place, so the modal comes next, then der, then the passive infinitive. || @tags da.passive,da.word-order
      tf: The car park on Torvegade is full most of the day. || false || It "står tom det meste af dagen" — it stands empty most of the day. || @ctx reading
      mc: What does the association want in the empty shop on the corner? || *A repair café | A new supermarket | A bike shop || "For det tredje kunne man starte en reparationscafé i det tomme butikslokale på hjørnet." || @ctx reading @skill reading @tags da.reading
      short: Give one reason why the association wants more trees. || kw: skygge/shade/regnvand/vandet/water/rain/varmt/hot || Trees give shade and can soak up some of the rainwater. || @ctx reading
      listen: Jeg foreslår, at vi holder et loppemarked i gården i maj. Pengene kan bruges til nye bænke og en grill til alle beboerne. || What would the money be used for? || *New benches and a barbecue | A new playground | Trees for the street || "Pengene kan bruges til nye bænke og en grill." || @tags da.listening,da.passive
      rw: Rewrite with der and the passive :: Man bruger for meget vand. || Der bruges for meget vand. || Man bruger → der bruges: der fills the subject position. || @tags da.passive
      rw: Make it a proposal with foreslå :: Kommunen skal lave flere cykelstier. → Vi foreslår, at … || Vi foreslår, at kommunen laver flere cykelstier. || After foreslå, at the verb is usually in the present: at kommunen laver. || @tags da.subordinate-clauses
      tr: More cycle paths should be made in the town. || Der bør laves flere cykelstier i byen. | Der skal laves flere cykelstier i byen. | Der burde laves flere cykelstier i byen. | Man bør lave flere cykelstier i byen. | Man burde lave flere cykelstier i byen. || Der + modal + passive infinitive, or man + modal + infinitive. || @tags da.passive,da.modal-verbs
      ask: At a residents' meeting, propose two things that could make your street greener. || kw: foreslår/kunne/bør/burde/hvad med at || Jeg foreslår, at vi laver en fælleshave i gården. Der kunne også plantes træer foran huset. Og hvad med at sætte en byttekasse op til bøger?
      write: Write a short letter to the editor (6–8 sentences) proposing solutions to a problem in your area. || min=60 || req: foreslå/foreslår | der | for det første/for det andet | kunne/bør/burde || Læserbrev: Mere liv i den gamle stationsbygning. Den gamle stationsbygning i vores by har stået tom i tre år. Det er synd, for den ligger midt i byen. For det første foreslår jeg, at der laves et værested for unge i stueetagen. For det andet kunne man åbne en lille café, som drives af frivillige. Der bør også plantes træer på pladsen foran bygningen. Jeg håber, at kommunen vil lytte. Mange hilsner Omar Said
      dict: For det første bør der plantes flere træer langs gaden.
