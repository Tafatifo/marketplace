  - title: Health and medicine in the news
    summary: Read a news article about young people's sleep and understand nominal style — stigningen i, brugen af, behov for — then retell it in plain spoken Danish.
    minutes: 50
    skills: [reading, grammar, writing]
    tags: [da.register, da.passive, da.reading]
    objectives:
      - Recognise nominal style in news and reports (-ning, -else, -hed and the prepositions that go with them)
      - Turn nominal phrases back into verbs when you retell a story
      - Understand a health news article and the limits of what a study shows
    intro: |
      Health stories fill the Danish news: new studies, new treatments, new warnings. News and official texts are full of nouns made from verbs — *stigningen i, brugen af, behandlingen af* — a style that packs a lot of information into few words. In this lesson you'll read an article about teenagers' sleep, learn to unpack its nominal style, and retell it the way you'd tell a friend.
    vocab: |
      en undersøgelse | a study; an examination | n | En ny undersøgelse viser, at unge sover for lidt. | A new study shows that young people sleep too little. | g: c | pl: undersøgelser | c: en undersøgelse af noget
      en stigning | a rise; an increase | n | Der er sket en stigning i antallet af søvnproblemer. | There has been a rise in the number of sleep problems. | g: c | pl: stigninger | c: en stigning i noget
      et fald | a fall; a decrease | n | Undersøgelsen viser et fald i antallet af rygere. | The study shows a fall in the number of smokers. | g: n | pl: fald | c: et fald i noget
      en sammenhæng | a connection; a correlation | n | Forskerne har fundet en sammenhæng mellem skærmtid og søvn. | The researchers have found a connection between screen time and sleep. | g: c | pl: sammenhænge | c: en årsagssammenhæng (a causal link)
      påvise | to demonstrate; to prove | v | Undersøgelsen kan ikke påvise en direkte årsag. | The study can't prove a direct cause. | n: Past: påviste. Formal.
      en trivsel | well-being | n | Søvn har stor betydning for børns trivsel. | Sleep is very important for children's well-being. | g: c | n: No plural. Verb: trives (to thrive).
      en indlæring | learning | n | Mangel på søvn går ud over indlæringen. | Lack of sleep affects learning. | g: c | n: No plural.
      en overlæge | a consultant (senior doctor) | n | Overlægen fra børneafdelingen udtaler sig i artiklen. | The consultant from the children's ward comments in the article. | g: c | pl: overlæger
      et behov | a need | n | Der er behov for flere undersøgelser. | There is a need for more studies. | g: n | pl: behov | c: behov for noget
      anbefale | to recommend | v | Eksperterne anbefaler otte til ti timers søvn. | The experts recommend eight to ten hours of sleep. | n: Past: anbefalede. En anbefaling = a recommendation.
      gå forrest | to lead by example; to go first | expr | De voksne må gå forrest. | The adults must lead by example.
    grammar:
      title: "Nominal style: stigningen i, brugen af"
      body: |
        News, reports and official texts often turn verbs and adjectives into nouns. This **nominal style** packs information into few words and sounds objective:

        - *Søvnproblemerne er steget.* → ***Stigningen i** søvnproblemer…*
        - *De unge bruger mobilen.* → *De unges **brug af** mobilen…*
        - *Man behandler patienterne.* → ***Behandlingen af** patienterne…*

        Common noun endings: **-ning / -ing** (behandling, stigning, forskning), **-else** (undersøgelse, forståelse), **-hed** (sundhed, mulighed), **-tion** (reaktion, produktion) — all en-words — and the bare verb stem (*et fald, et valg, en brug*).

        The preposition comes with the noun, so learn them together: *stigning **i**, fald **i**, brug **af**, behandling **af**, undersøgelse **af**, behov **for**, mangel **på**.*

        To understand a heavy sentence, turn it back into verbs and ask who does what: *Stigningen i antallet af patienter skyldes en ændring af reglerne.* → *Der er flere patienter, fordi man har ændret reglerne.* In conversation, the verbal version almost always sounds more natural.
      table: |
        Verb / adjective | Noun | With preposition
        stige (rise) | en stigning | stigningen i antallet af…
        falde (fall) | et fald | et fald i ledigheden
        bruge (use) | en brug | brugen af mobiltelefoner
        behandle (treat) | en behandling | behandlingen af patienter
        undersøge (examine) | en undersøgelse | en undersøgelse af søvnvaner
        mangle (lack) | en mangel | mangel på søvn
      examples: |
        Stigningen i søvnproblemer er bekymrende. | The rise in sleep problems is worrying. | nominal: stigning i
        Det er bekymrende, at flere unge sover dårligt. | It's worrying that more young people sleep badly. | the same idea with verbs
        Behandlingen af patienterne er blevet forbedret. | The treatment of the patients has been improved. | behandling af
        Der er behov for flere undersøgelser af sammenhængen. | There's a need for more studies of the connection. | behov for, undersøgelse af
      tip: When a news sentence feels heavy, find the -ning, -else and -hed nouns and ask — what is the verb behind each one, and who is doing it?
    reading:
      title: Unge sover for lidt – og skærmen får en del af skylden
      text: |
        Unge sover for lidt – og skærmen får en del af skylden

        Danske teenagere sover i gennemsnit næsten en time mindre om natten, end eksperterne anbefaler. Det viser en ny undersøgelse, hvor over tre tusind elever i ottende og niende klasse har svaret på spørgsmål om deres søvnvaner.

        Ifølge undersøgelsen er mangel på søvn tæt forbundet med brugen af mobiltelefon efter sengetid. Blandt de elever, der har telefonen liggende ved sengen, svarer hver tredje, at de ofte har svært ved at falde i søvn. Blandt dem, der lader telefonen ligge i et andet rum, gælder det kun hver tiende.

        "Stigningen i søvnproblemer blandt unge er bekymrende," siger en af forskerne bag undersøgelsen, overlæge Hanne Bech. "Søvn har stor betydning for både indlæring og trivsel. Når søvnen bliver forstyrret igen og igen, får det konsekvenser for koncentrationen i skolen og for humøret derhjemme."

        Forskerne understreger dog, at undersøgelsen ikke kan påvise en direkte årsagssammenhæng. "Det er også muligt, at unge, der i forvejen sover dårligt, bruger telefonen mere, fordi de ligger vågne," siger Hanne Bech. "Der er behov for flere undersøgelser af, hvordan sammenhængen præcis ser ud."

        Flere kommuner har allerede reageret på resultaterne. I en kommune på Sjælland er der i år blevet indført et frivilligt forsøg med "skærmfri sengetid", hvor forældre og elever i fællesskab aftaler, at telefonerne skal sove i køkkenet. Erfaringerne skal evalueres til sommer.

        Eksperterne anbefaler, at teenagere sover mellem otte og ti timer om natten, og at skærme slukkes mindst en time før sengetid. Men ifølge Hanne Bech handler det ikke kun om forbud. "Det vigtigste er, at de unge selv forstår, hvorfor søvnen betyder noget. Og at de voksne går forrest – også med deres egen telefon."
      translation: |
        Young people sleep too little – and the screen gets part of the blame

        On average, Danish teenagers sleep almost an hour less a night than the experts recommend. That is shown by a new study in which more than three thousand pupils in years eight and nine answered questions about their sleeping habits.

        According to the study, lack of sleep is closely linked to the use of mobile phones after bedtime. Among the pupils who keep their phone by the bed, one in three say they often find it hard to fall asleep. Among those who leave their phone in another room, this applies to only one in ten.

        "The rise in sleep problems among young people is worrying," says one of the researchers behind the study, consultant Hanne Bech. "Sleep is very important for both learning and well-being. When sleep is disturbed again and again, it has consequences for concentration at school and for the mood at home."

        The researchers stress, however, that the study cannot prove a direct causal link. "It's also possible that young people who already sleep badly use their phones more because they lie awake," says Hanne Bech. "There is a need for more studies of exactly what the connection looks like."

        Several municipalities have already reacted to the results. In a municipality on Zealand, a voluntary trial of "screen-free bedtime" has been introduced this year, in which parents and pupils agree together that the phones should sleep in the kitchen. The experience will be evaluated next summer.

        The experts recommend that teenagers sleep between eight and ten hours a night and that screens are switched off at least an hour before bedtime. But according to Hanne Bech, it isn't only about bans. "The most important thing is that young people themselves understand why sleep matters. And that the adults lead by example – with their own phones too."
    pronunciation:
      title: "Unstressed be- and for-: behandling, forbedring"
      body: |
        Many nouns in news Danish are built on verbs with the prefixes **be-** and **for-**. These prefixes are unstressed — the stress falls on the syllable after them: *be-HAND-ling, for-BED-ring, be-TYD-ning, be-KYM-ring, for-AN-dring*.

        English speakers often stress the first syllable, which makes the words hard to recognise. Keep be- and for- short and weak, and land firmly on the next syllable. Listen and repeat.
      items: |
        behandling
        forbedring
        betydning
        bekymring
        forandring
        Behandlingen er blevet forbedret.
    mistakes: |
      stigningen af søvnproblemer => stigningen i søvnproblemer | A rise or fall is in something: stigning i, fald i.
      brugen på mobiltelefoner => brugen af mobiltelefoner | Brug takes af: brugen af noget.
      Der er behov af flere undersøgelser. => Der er behov for flere undersøgelser. | Behov takes for.
    task:
      title: Tell a friend
      mode: writing
      body: |
        A friend with teenage children hasn't read the article. Write them a message (80–100 words) that explains the main points in everyday spoken Danish: replace the nominal phrases with verbs (stigningen i søvnproblemer → flere unge sover dårligt). Then read both versions aloud and notice the difference in style.
    exercises: |
      fill: Der er sket en kraftig stigning ___ antallet af elbiler. || i || Stigning i noget: a rise in something. || @tags da.register
      fill: Brugen ___ antibiotika skal reduceres. || af || Brug af noget: the use of something. || @tags da.register
      fill: Mange unge lider af mangel ___ søvn. || på || Mangel på noget: a lack of something. || @tags da.register
      rw: Rewrite in nominal style, starting "Der er sket en stigning…" :: Antallet af patienter er steget. || Der er sket en stigning i antallet af patienter. || The verb stige becomes the noun stigning + i. || @tags da.register
      rw: Rewrite in everyday spoken style :: Behandlingen af patienterne er blevet forbedret. || Patienterne bliver behandlet bedre nu. | Patienterne bliver behandlet bedre. | Man behandler patienterne bedre nu. | Man behandler patienterne bedre. | Patienterne får en bedre behandling nu. || Turn the noun behandling back into the verb behandle. || @tags da.register,da.passive
      mc: What is the noun from the verb undersøge? || *en undersøgelse | en undersøgning | et undersøg || Undersøge → en undersøgelse (-else). || @tags da.register @skill vocabulary
      tf: The study proves that mobile phones cause sleep problems. || false || "Undersøgelsen [kan] ikke påvise en direkte årsagssammenhæng." || @ctx reading
      mc: According to the article, how much less do teenagers sleep than recommended? || *Almost an hour | About two hours | Ten minutes || "…næsten en time mindre om natten, end eksperterne anbefaler." || @ctx reading @skill reading @tags da.reading
      short: What do the experts recommend about screens? || kw: time/hour/sluk/off/sengetid/bedtime || Screens should be switched off at least an hour before bedtime. || @ctx reading
      listen: Ifølge en ny rapport er der sket et fald i antallet af rygere blandt unge, men en stigning i brugen af nikotinposer. || What has increased? || *The use of nicotine pouches | The number of young smokers | The number of reports || "…en stigning i brugen af nikotinposer." Smoking has fallen. || @tags da.listening,da.register
      tr: There is a need for more research. || Der er behov for mere forskning. | Der er brug for mere forskning. || Behov for (or brug for) + noun. || @tags da.register
      ask: Retell a health story you've heard recently in plain spoken Danish — use verbs rather than heavy nouns. || kw: undersøgelse/forskere/viser/ifølge & fordi/så/at || Jeg hørte i radioen, at forskere har undersøgt, hvor meget unge sover. De sover næsten en time for lidt, og dem, der har telefonen ved sengen, sover dårligst. Men man ved ikke, om det er telefonen, der er skyld i det.
      write: Write a message to a friend (5–7 sentences) that sums up the article in everyday spoken style. || min=50 || req: sover/søvn | telefon/mobil/skærm || Hej Rasmus! Jeg har lige læst en artikel om unges søvn. Mange teenagere sover næsten en time for lidt hver nat. Dem, der har mobilen ved sengen, har sværere ved at falde i søvn. Forskerne ved dog ikke helt, om det er telefonen, der er problemet. De anbefaler, at man slukker skærmen en time før sengetid. Måske skulle vi prøve det med børnene — og os selv!
      dict: Stigningen i søvnproblemer blandt unge er bekymrende.
