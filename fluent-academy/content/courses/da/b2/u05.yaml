  - title: Writing an opinion piece
    summary: Read an opinion piece about local journalism and learn to argue in writing — add arguments, concede a point, counter it and conclude (hertil kommer, man kan indvende, ikke desto mindre, alt i alt).
    minutes: 55
    skills: [reading, writing, grammar]
    tags: [da.opinion, da.word-order, da.reading]
    objectives:
      - Structure an opinion piece with signposting phrases
      - Concede and rebut a counter-argument fairly
      - Emphasise with cleft sentences (Det var lokalavisen, der…)
    intro: |
      Danes love a good **debatindlæg** (opinion piece): local and national newspapers print thousands every year, written by teachers, students, pensioners and politicians. A convincing one takes the other side seriously before answering it. In this lesson you'll read a retired teacher's opinion piece arguing that local news is worth paying for, and learn the phrases that hold an argument together.
    vocab: |
      et debatindlæg | an opinion piece | n | Hun skrev et debatindlæg i lokalavisen om skolevejen. | She wrote an opinion piece in the local paper about the route to school. | g: n | pl: debatindlæg
      en betalingsmur | a paywall | n | Artiklen ligger bag betalingsmuren. | The article is behind the paywall. | g: c | pl: betalingsmure
      abonnere på | to subscribe to | v | Vi abonnerer på to aviser. | We subscribe to two newspapers. | n: Past: abonnerede. Et abonnement = a subscription.
      indvende | to object | v | Man kan indvende, at det er for dyrt. | One might object that it's too expensive. | n: Past: indvendte. En indvending = an objection.
      ikke desto mindre | nevertheless | expr | Ikke desto mindre er det det rigtige valg. | Nevertheless, it's the right choice. | n: In first position, followed by the verb.
      hertil kommer | in addition; on top of that | expr | Hertil kommer, at mange aviser giver rabat. | On top of that, many newspapers give a discount. | n: Followed by an at-clause.
      et lokalsamfund | a local community | n | Lokalavisen binder lokalsamfundet sammen. | The local paper holds the local community together. | g: n | pl: lokalsamfund
      et rygte | a rumour | n | Rygtet viste sig at være forkert. | The rumour turned out to be wrong. | g: n | pl: rygter
      afkræfte | to refute; to disprove | v | Journalisten fik afkræftet rygtet. | The journalist managed to disprove the rumour. | n: Past: afkræftede. Opposite: bekræfte.
      en magthaver | a person in power | n | Pressen skal holde øje med magthaverne. | The press must keep an eye on those in power. | g: c | pl: magthavere
      alt i alt | all in all | expr | Alt i alt er jeg tilfreds med forslaget. | All in all, I'm satisfied with the proposal. | n: In first position, followed by the verb.
    grammar:
      title: "Arguing in writing: concede, counter, conclude"
      body: |
        A Danish opinion piece usually presents the issue, gives arguments, deals with a counter-argument and ends with a clear position or a call to action. Learn the phrases for each move:

        - **Add an argument:** *For det første… For det andet…* · *Desuden…* · *Hertil kommer, at…* (in addition)
        - **Concede:** *Det er rigtigt, at…* · *Man kan indvende, at…* (one might object that) · *Andre vil sige, at…*
        - **Counter:** *Men…* · *Ikke desto mindre…* (nevertheless) · *Det ændrer dog ikke ved, at…* (that doesn't change the fact that)
        - **Conclude:** *Alt i alt…* · *Kort sagt…* · *Derfor vil jeg opfordre alle til at…*

        **Word order.** Most of these are first elements, so the verb comes next: ***Ikke desto mindre koster** abonnementet…* · ***Alt i alt mener** jeg…*

        **Emphasis with a cleft sentence.** *Det er / Det var + X + der/som…* puts the spotlight on X: *Det var lokalavisen, **der** fik afkræftet rygtet.* Use der when X is the subject of the following clause.
      table: |
        Move | Phrases
        add an argument | For det første… / Desuden… / Hertil kommer, at…
        concede | Det er rigtigt, at… / Man kan indvende, at… / Andre vil sige, at…
        counter | Men… / Ikke desto mindre… / Det ændrer dog ikke ved, at…
        emphasise | Det er netop… / Det var X, der…
        conclude | Alt i alt… / Kort sagt… / Derfor vil jeg opfordre alle til at…
      examples: |
        Man kan indvende, at sociale medier har overtaget rollen. | One might object that social media have taken over the role. | conceding
        Ikke desto mindre koster abonnementet mindre end to kopper kaffe. | Nevertheless, the subscription costs less than two cups of coffee. | V2 after ikke desto mindre
        Hertil kommer, at mange aviser giver rabat til studerende. | On top of that, many newspapers give students a discount. | adding an argument
        Det var lokalavisen, der fik afkræftet rygtet. | It was the local paper that got the rumour disproved. | cleft for emphasis
      tip: Present the strongest counter-argument fairly before you answer it — a Danish reader trusts a writer who takes the other side seriously.
    reading:
      title: Lokalavisen er mere værd end et klik
      text: |
        Debatindlæg: Lokalavisen er mere værd end et klik
        Af Birthe Kjær, pensioneret skolelærer, Ringkøbing

        Da jeg var barn, landede lokalavisen på måtten hver morgen. I dag læser jeg den på skærmen – når jeg ellers kan komme forbi betalingsmuren. Mange af mine naboer er holdt op med at abonnere. "Hvorfor betale for nyheder, når de findes gratis på nettet?" spurgte en af dem forleden. Det spørgsmål vil jeg gerne svare på.

        For det første er de gratis nyheder sjældent lokale. De landsdækkende medier sender ikke en journalist til byrådsmødet i Ringkøbing, når der skal tages stilling til skolernes budget eller en ny vindmøllepark. Hvis lokalavisen forsvinder, er der ingen, der holder øje med de beslutninger, der påvirker vores hverdag mest.

        For det andet er lokalavisen vores fælles opslagstavle. Her læser vi om den nye bager, om håndboldklubbens oprykning og om naboen, der fylder hundrede. Det lyder måske banalt, men det er netop den slags historier, der skaber et fællesskab i et lokalsamfund.

        Man kan selvfølgelig indvende, at de sociale medier har overtaget den rolle. Det er rigtigt, at de lokale grupper på nettet summer af liv. Men her er der ingen redaktør, der kontrollerer, om rygterne passer. For nylig gik der en historie om, at kommunen ville lukke svømmehallen – og den viste sig at være forkert. Det var lokalavisen, der fik afkræftet rygtet.

        Andre vil sige, at et abonnement er for dyrt. Det forstår jeg godt, især for familier med et stramt budget. Ikke desto mindre koster et digitalt abonnement om måneden mindre end to kopper kaffe på en café. Hertil kommer, at mange aviser giver rabat til studerende og pensionister.

        Alt i alt mener jeg, at en lokalavis er en investering i både demokratiet og fællesskabet. Den er ikke alene en kilde til nyheder, men også et redskab til at holde magthaverne fast på deres løfter. Derfor vil jeg opfordre alle, der har råd, til at tegne et abonnement.

        For hvis vi ikke betaler for journalistikken, betaler vi på en anden måde: med uvidenhed.
      translation: |
        Opinion: The local paper is worth more than a click
        By Birthe Kjær, retired schoolteacher, Ringkøbing

        When I was a child, the local paper landed on the doormat every morning. Today I read it on screen – when I can get past the paywall, that is. Many of my neighbours have stopped subscribing. "Why pay for news when you can get it for free online?" one of them asked the other day. I'd like to answer that question.

        Firstly, free news is rarely local. The national media don't send a journalist to the town council meeting in Ringkøbing when decisions are to be made about the schools' budget or a new wind farm. If the local paper disappears, nobody will keep an eye on the decisions that affect our everyday lives the most.

        Secondly, the local paper is our shared noticeboard. Here we read about the new baker, the handball club's promotion and the neighbour who is turning a hundred. That may sound trivial, but it is precisely stories like these that create a sense of community in a local area.

        One might of course object that social media have taken over that role. It's true that the local groups online are buzzing with life. But there is no editor there to check whether the rumours are true. Recently a story went round that the council was going to close the swimming pool – and it turned out to be wrong. It was the local paper that got the rumour disproved.

        Others will say that a subscription is too expensive. I understand that, especially for families on a tight budget. Nevertheless, a digital subscription costs less a month than two cups of coffee in a café. On top of that, many newspapers give a discount to students and pensioners.

        All in all, I believe that a local newspaper is an investment in both democracy and community. It is not only a source of news but also a tool for holding those in power to their promises. That is why I would urge everyone who can afford it to take out a subscription.

        Because if we don't pay for journalism, we pay in another way: with ignorance.
    pronunciation:
      title: "Signposts with late stress: desuden, hertil, alligevel"
      body: |
        Many of the little words that structure an argument are stressed late. *Desuden* is "de-SU-den", *hertil* is "her-TIL" (like *dertil*), and *alligevel* is "al-LI-e-vel" with a silent g. In *ikke desto mindre* the main stress falls on *mindre*.

        When you read an opinion piece aloud, make a short pause after each signpost so the listener can follow the structure. Listen and repeat.
      items: |
        desuden
        hertil kommer
        ikke desto mindre
        alligevel
        Alt i alt mener jeg, at det er pengene værd.
    mistakes: |
      Ikke desto mindre abonnementet er billigt. => Ikke desto mindre er abonnementet billigt. | Ikke desto mindre is the first element, so the verb comes next.
      Alt i alt jeg mener, at… => Alt i alt mener jeg, at… | V2: the verb follows alt i alt.
      Man kan indvende, at sociale medier har ikke overtaget… => Man kan indvende, at sociale medier ikke har overtaget… | In the at-clause, ikke goes before the verb.
    task:
      title: Your opinion piece
      mode: writing
      body: |
        Write a debatindlæg (180–220 words) for your local newspaper about an issue where you live — a library's opening hours, a new cycle path, mobile phones at school. Give it a clear headline, an introduction, two arguments, one counter-argument with your answer, and a conclusion with a call to action. Use at least one cleft sentence (Det er…, der…).
    exercises: |
      fill: Man kan ___, at sociale medier har overtaget rollen. (object) || indvende || Man kan indvende, at… introduces a counter-argument. || @tags da.opinion
      fill: Ikke desto ___ er abonnementet pengene værd. || mindre || The fixed expression is ikke desto mindre (nevertheless). || @tags da.opinion
      mc: Which sentence is correct? || *Alt i alt mener jeg, at forslaget er godt. | Alt i alt jeg mener, at forslaget er godt. | Alt i alt mener, jeg at forslaget er godt. || Alt i alt is the first element: verb (mener) + subject (jeg). || @tags da.opinion,da.word-order
      mc: What is "Hertil kommer, at…" used for? || *Adding another argument | Conceding a point | Concluding || Hertil kommer = in addition, on top of that. || @tags da.opinion
      tf: The writer thinks the local groups on social media can replace the local paper. || false || "Men her er der ingen redaktør, der kontrollerer, om rygterne passer." || @ctx reading
      mc: What happened with the rumour about the swimming pool? || *The local paper showed it was false | The pool was closed | The council started the rumour || "Det var lokalavisen, der fik afkræftet rygtet." || @ctx reading @skill reading @tags da.reading
      short: What does the writer compare the price of a subscription to? || kw: kaffe/coffee || "…mindre end to kopper kaffe på en café." || @ctx reading
      listen: Det er rigtigt, at cykelstien bliver dyr. Ikke desto mindre mener jeg, at den er pengene værd, fordi den gør skolevejen sikker. || What is the speaker's position? || *For the cycle path, despite the cost | Against the cycle path because of the cost | Undecided || Concession (det er rigtigt, at…) followed by the counter (ikke desto mindre…). || @tags da.listening,da.opinion
      rw: Rewrite as a cleft sentence that emphasises lokalavisen :: Lokalavisen afkræftede rygtet. || Det var lokalavisen, der afkræftede rygtet. | Det var lokalavisen, som afkræftede rygtet. || Det var + X + der/som + the rest of the sentence. || @tags da.opinion,da.relative-clauses
      tr: One might object that it is too expensive. || Man kan indvende, at det er for dyrt. | Man kunne indvende, at det er for dyrt. | Man kan indvende, at det er alt for dyrt. || Man kan indvende, at + subordinate clause. || @tags da.opinion
      ask: Give one argument for paying for local news, then answer a counter-argument. || kw: for det første/hertil kommer/desuden & man kan indvende/det er rigtigt/andre vil sige & ikke desto mindre/men || For det første får vi nyheder, som ingen andre dækker. Man kan indvende, at det er dyrt. Det er rigtigt, men ikke desto mindre koster det mindre end et streamingabonnement.
      write: Write an opinion piece (180–220 words) on a local issue. Include two arguments, a counter-argument and a conclusion. || min=150 || req: for det første/hertil kommer/desuden | man kan indvende/det er rigtigt/andre vil sige | ikke desto mindre/alt i alt/derfor || Lad biblioteket være åbent om søndagen. Kommunen vil spare penge ved at lukke biblioteket i weekenderne. Det er en dårlig idé. For det første er biblioteket et af de få steder, hvor man kan være sammen uden at købe noget. Hertil kommer, at mange studerende bruger det til at læse op til eksamen. Man kan indvende, at der kommer færre besøgende om søndagen. Det er rigtigt, men det er netop de besøgende, der har mest brug for det: ældre, der bor alene, og børnefamilier i små lejligheder. Ikke desto mindre forstår jeg, at kommunen skal spare. Men så kunne man holde åbent uden personale nogle timer. Alt i alt vil jeg opfordre byrådet til at tænke sig om. Det er biblioteket, der binder vores by sammen.
      dict: Ikke desto mindre koster abonnementet mindre end to kopper kaffe.
