unit: 8
title: Med blikket fremad
theme: Looking ahead
description: Speculate about the future and the past, talk about regrets and lessons learned, and give a structured presentation — with the future perfect (vil have gjort), deduction with må/kan/skal have + participle, regrets with hvis bare, gid, burde have and skulle have, and pseudo-clefts (Det, der …, er …).
objectives:
  - Make predictions with the future perfect and degrees of probability
  - Speculate about the past with må have, kan have and skal have + participle
  - Express regrets and present a structured argument with clear signposting
canDo:
  - I can say where I think I'll be in ten years and how sure I am.
  - I can suggest explanations for something that has happened.
  - I can talk about what I regret and what I have learned.
  - I can give a short, well-structured presentation and handle questions.
review: |
  fill: Inden sommer ___ vi have malet hele huset. (will — future perfect) || vil || Future perfect: vil + have + participle. || @tags da.future
  fill: Hun svarer ikke. Hun ___ have slukket telefonen. (must have) || må || Må have + participle = must have (a strong conclusion). || @tags da.modal-verbs,da.perfect
  mc: "Han skal have vundet i lotto." What does it mean? || *People say he has won the lottery | He has to win the lottery | He will win the lottery || Skal have + participle reports something you've heard. || @tags da.modal-verbs
  fill: Hvis bare jeg ___ ___ glemt hendes fødselsdag! (hadn't) || ikke ; havde || Hvis bare introduces a subordinate clause: ikke before havde. || @tags da.conditional,da.negation
  mc: Which sentence expresses regret? || *Jeg burde have ringet til hende. | Jeg skal ringe til hende. | Jeg ringer til hende i morgen. || Burde have + participle = should have (but didn't). || @tags da.modal-verbs
  rw: Rewrite as a pseudo-cleft, starting "Det, der…" :: Prisen er vigtigst. || Det, der er vigtigst, er prisen. | Det, som er vigtigst, er prisen. || Det, der + verb …, er + the key point at the end. || @tags da.relative-clauses
  tr: I wish I had travelled more. || Jeg ville ønske, jeg havde rejst mere. | Jeg ville ønske, at jeg havde rejst mere. | Gid jeg havde rejst mere. | Hvis bare jeg havde rejst mere. | Bare jeg havde rejst mere. || A regret about the past: the past perfect (havde rejst). || @tags da.conditional
  listen: Inden udgangen af næste år vil kommunen have renoveret alle skolernes toiletter, lover borgmesteren. || What does the mayor promise? || *All the school toilets will have been renovated by the end of next year | The schools will close next year | The renovation started last year || Vil have renoveret = will have renovated (by a point in the future). || @tags da.listening,da.future
  listen: Du skulle have været med til koncerten i går — de spillede alle de gamle sange! || What does the speaker mean? || *The listener missed a great concert | The listener had to go to the concert | The concert is tomorrow || "Du skulle have været med" = you should have been there. || @tags da.listening,da.modal-verbs
  ask: A colleague hasn't turned up for an important meeting. Suggest two possible explanations. || kw: må have/kan have/skal have & glemt/fået/misforstået/taget || Han må have glemt mødet — det står ikke i hans kalender. Eller også kan han have fået en akut opgave. Jeg har hørt, at hans søn skal have været syg i går.
  write: Write a short speech (8–10 sentences) for a farewell party or a graduation. Look back with one regret and look ahead with one prediction. || min=80 || req: burde have/skulle have/hvis bare/gid/ville ønske | vil have/vil være/om || Kære kolleger. I dag siger jeg farvel efter tolv gode år. Jeg ville ønske, jeg havde nået at lære jer alle bedre at kende. Og vi burde have holdt flere fester! Men jeg tager mange gode minder med mig. Om fem år vil I formentlig have flyttet til det nye hus ved havnen. Og jeg vil forhåbentlig have lært at sejle. Tak for alt — og husk at invitere mig til indvielsen.
lessons:
  - title: Predictions and speculation
    summary: Predict where you'll be in ten years with the future perfect, and speculate about the past with må have, kan have and skal have + participle.
    minutes: 50
    skills: [grammar, speaking, listening]
    tags: [da.future, da.modal-verbs, da.perfect]
    objectives:
      - Use the future perfect (vil have + participle) and the perfect with a future time
      - Draw conclusions about the past with må have, kan have and skal have
      - Show how certain you are with sandsynligvis, formentlig, næppe and similar adverbs
    intro: |
      Reunions are the perfect place for speculation: why hasn't so-and-so come, what has happened to them — and where will we all be in another ten years? In this lesson Ida and Sebastian meet at their ten-year reunion after the upper secondary exam. You'll learn to talk about what *will have happened* by a point in the future, and to make educated guesses about the past: *Han må have glemt det. Hun skal have åbnet en restaurant.*
    vocab: |
      en spådom | a prediction; a prophecy | n | Hans spådom om fremtiden slog ikke til. | His prediction about the future didn't come true. | g: c | pl: spådomme
      forudsige | to predict | v | Ingen kunne forudsige krisen. | Nobody could predict the crisis. | n: Irregular: forudsagde, har forudsagt.
      forhåbentlig | hopefully | adv | Forhåbentlig har vi fået et hus med have til den tid. | Hopefully we'll have got a house with a garden by then. | n: A sentence adverb.
      formentlig | presumably; probably | adv | Toget er formentlig forsinket på grund af sneen. | The train is presumably delayed because of the snow. | n: Slightly formal; everyday: nok, sikkert.
      næppe | hardly | adv | Det sker næppe i dette årti. | That will hardly happen this decade. | n: Already negative: no ikke.
      spekulere over | to speculate about; to wonder about | v | Vi spekulerede over, hvorfor hun ikke kom. | We wondered why she didn't come. | n: Past: spekulerede.
      et studenterjubilæum | a class reunion (after the upper secondary exam) | n | Vi holder tiårs studenterjubilæum i juni. | We're having our ten-year reunion in June. | g: n | pl: studenterjubilæer
      en fast stilling | a permanent position | n | Hun har endelig fået en fast stilling. | She has finally got a permanent position. | g: c | pl: faste stillinger
      færdiggøre | to complete; to finish | v | Han har færdiggjort sin uddannelse. | He has completed his education. | n: Irregular: færdiggjorde, har færdiggjort.
      til den tid | by then | expr | Til den tid er børnene flyttet hjemmefra. | By then the children will have left home.
      overtage | to take over | v | Robotterne overtager flere og flere opgaver. | The robots are taking over more and more tasks. | n: Irregular: overtog, har overtaget.
    grammar:
      title: "Future perfect and deduction: vil have gjort, må have glemt"
      body: |
        **Future perfect** — something that will be completed before a point in the future: **vil have + participle** (or **vil være + participle** with verbs that take er): *Om ti år **vil** jeg **have færdiggjort** min ph.d.* · *Inden jul **vil** vi **være flyttet**.* In everyday Danish the ordinary perfect plus a time expression is often enough: *Om ti år **har** du sikkert **fået** tre børn.*

        **Deduction about the past** — modal verb + **have** + participle:
        - **må have** — must have (a strong conclusion): *Han må have glemt det.*
        - **kan have** — may/might have (a possibility): *Han kan have fået en nattevagt.*
        - **kan ikke have** — can't have: *Hun kan ikke have set beskeden.*
        - **skal have** — is said to have (hearsay): *Hun skal have åbnet en restaurant.* Careful: this is a rumour, not an obligation.

        **How sure are you?** *helt sikkert, utvivlsomt* (definitely) > *sandsynligvis, formentlig, nok* (probably) > *måske, muligvis* (perhaps) > *næppe* (hardly). They are sentence adverbs: *Han har **formentlig** glemt det.*
      table: |
        Form | Meaning | Example
        vil have + participle | will have done | Om ti år vil jeg have færdiggjort min ph.d.
        vil være + participle | will have (være-verbs) | Inden jul vil vi være flyttet.
        må have + participle | must have | Han må have glemt det.
        kan have + participle | may have | Han kan have fået en nattevagt.
        kan ikke have + participle | can't have | Hun kan ikke have set beskeden.
        skal have + participle | is said to have | Hun skal have åbnet en restaurant.
      examples: |
        Inden for ti år vil byen have fordoblet antallet af cykelstier. | Within ten years the city will have doubled the number of cycle paths. | future perfect
        Hun må have taget det forkerte tog. | She must have taken the wrong train. | strong conclusion
        Forfatteren skal have skrevet bogen på bare tre uger. | The author is said to have written the book in just three weeks. | hearsay
        Det regner næppe i morgen. | It will hardly rain tomorrow. | probability adverb
      tip: "Skal have + participle usually means \"is said to have\": it passes on a rumour, not an obligation."
    dialogue:
      title: Ti år efter
      setting: A ten-year reunion at a gymnasium in Viborg. Ida, now a PhD student, and Sebastian, a carpenter, look around the old canteen.
      speakers: I=Ida/f; S=Sebastian/m
      lines: |
        I: Sebastian! Ti år siden studentereksamen — kan du tro det? Men hvor er alle de andre? | Sebastian! Ten years since our final exams — can you believe it? But where is everyone else?
        S: Halvdelen er her vist ikke. Malthe må have glemt det, for han svarer ikke på sine beskeder. | I think half of them aren't here. Malthe must have forgotten, because he isn't answering his messages.
        I: Eller også kan han have fået en nattevagt. Han er jo sygeplejerske nu. | Or he may have got a night shift. He's a nurse now, after all.
        S: Og Asma skal have åbnet en restaurant i Lissabon. Det har jeg hørt fra hendes bror. | And Asma is said to have opened a restaurant in Lisbon. I heard that from her brother.
        I: Det passer godt til hende. Hun lavede altid mad til hele klassen på vores studietur. | That suits her. She always cooked for the whole class on our study trip.
        S: Hvad med dig selv? Hvor tror du, du er, når vi mødes igen om ti år? | What about you? Where do you think you'll be when we meet again in ten years?
        I: Forhåbentlig vil jeg have færdiggjort min ph.d. og have fået en fast stilling på universitetet. | Hopefully I'll have finished my PhD and got a permanent position at the university.
        S: Ambitiøst. Jeg vil formentlig have flyttet ud på landet og købt et hus med plads til høns. | Ambitious. I'll probably have moved to the country and bought a house with room for chickens.
        I: Ha! Om ti år har du sikkert også fået tre børn og en hund. | Ha! In ten years you'll probably also have had three children and a dog.
        S: Næppe tre. Men til den tid har robotterne sandsynligvis overtaget halvdelen af vores job. | Hardly three. But by then the robots will probably have taken over half of our jobs.
        I: Så må vi jo mødes og klage over det. Skål for de næste ti år! | Then we'll just have to meet and complain about it. Cheers to the next ten years!
    pronunciation:
      title: "Probability words: sandsynligvis, formentlig, forhåbentlig"
      body: |
        Danish probability adverbs are long, but much of the spelling is silent. In *sandsynligvis* the d and the g are silent: "san-SYN-li-vis". In *formentlig* and *forhåbentlig* the final g is silent: "for-MEN-tli", "for-HÅ-bent-li". *Muligvis* is "MU-li-vis".

        These words are sentence adverbs, so they are usually unstressed in the middle of a sentence. Listen and repeat.
      items: |
        sandsynligvis
        formentlig
        forhåbentlig
        muligvis
        Han har formentlig glemt det.
    mistakes: |
      Om ti år vil jeg have færdiggøre min ph.d. => Om ti år vil jeg have færdiggjort min ph.d. | After have, use the past participle.
      Han må har glemt det. => Han må have glemt det. | After a modal verb, use the infinitive have.
      Hun skal have åbnet en restaurant. (meaning she has to open one) => Hun skal åbne en restaurant. | Skal have + participle reports a rumour; for a plan or obligation, use skal + infinitive.
    task:
      title: Ten years from now
      mode: speaking
      body: |
        Prepare a two-minute talk: where do you think you will be in ten years — work, home, family, languages? Use the future perfect at least three times and show how sure you are (sandsynligvis, forhåbentlig, næppe). Then speculate about a friend you've lost touch with: what must have happened, what may have happened, and what you've heard (skal have…).
    exercises: |
      fill: Om ti år ___ jeg have betalt mit studielån tilbage. (will — future perfect) || vil || Future perfect: vil + have + participle. || @tags da.future
      fill: Han svarer ikke på telefonen. Han ___ have glemt aftalen. (must have) || må || Må have + participle: a strong conclusion. || @tags da.modal-verbs,da.perfect
      fill: Hun ___ have åbnet en restaurant i Lissabon — det siger hendes bror. (is said to have) || skal || Skal have + participle passes on something you've heard. || @tags da.modal-verbs
      mc: "Han kan have fået en nattevagt." How sure is the speaker? || *It's a possibility | It's certain | It's impossible || Kan have = may have: one possible explanation. || @tags da.modal-verbs
      mc: Which sentence is correct? || *Inden jul vil vi være flyttet. | Inden jul vil vi er flyttet. | Inden jul vil vi være flytte. || Vil + være + participle (flytte takes er in the perfect). || @tags da.future,da.perfect-er
      tf: Sebastian heard about Asma's restaurant from Asma herself. || false || "Det har jeg hørt fra hendes bror." || @ctx dialogue
      short: What does Ida hope to have achieved in ten years? || kw: ph.d./phd/stilling/position/job/universitet/university || She hopes to have finished her PhD and got a permanent position at the university. || @ctx dialogue
      listen: @dialogue || What does Sebastian expect to have done in ten years? || *Moved to the country and bought a house | Finished a PhD | Opened a restaurant || "Jeg vil formentlig have flyttet ud på landet og købt et hus med plads til høns." || @tags da.listening
      listen: Ifølge prognosen vil over halvdelen af alle nye biler være elbiler, inden der er gået fem år. || What does the forecast say? || *More than half of all new cars will be electric within five years | Half of all cars are electric today | Electric cars will disappear within five years || "…vil over halvdelen af alle nye biler være elbiler, inden der er gået fem år." || @tags da.listening,da.future
      rw: Rewrite with må have :: Jeg er sikker på, at hun har misforstået det. || Hun må have misforstået det. || Må have + participle expresses a confident conclusion. || @tags da.modal-verbs,da.perfect
      tr: She must have taken the wrong train. || Hun må have taget det forkerte tog. | Hun må have taget forkert tog. || Må + have + taget. || @tags da.modal-verbs,da.perfect
      ask: Where do you think you'll be in ten years? Use the future perfect and at least one probability adverb. || kw: vil have/vil være/har & sandsynligvis/formentlig/forhåbentlig/måske/nok/næppe || Om ti år vil jeg forhåbentlig have fået mit eget værksted. Jeg vil sandsynligvis have flyttet til Aarhus, og jeg har nok også lært at tale flydende dansk.
      write: Write a short text (6–8 sentences) for a time capsule: what will have changed in your town or your life in twenty years? || min=60 || req: vil have/vil være/har | sandsynligvis/formentlig/forhåbentlig/næppe/måske || Kære læser om tyve år. Når du læser dette, vil jeg formentlig være gået på pension. Byen vil sandsynligvis have fået en letbane, og bilerne i centrum vil forhåbentlig være forsvundet. Mine børnebørn vil have lært at kode, før de kan cykle. Måske har vi også fået en firedagesuge. Men jeg håber, at folk stadig mødes til fællesspisning i forsamlingshuset.
      dict: Han må have glemt det, for han svarer ikke på sine beskeder.

  - title: Regrets and lessons learned
    summary: Talk about regrets and lessons learned at a farewell party, with hvis bare, gid, jeg ville ønske, burde have and skulle have.
    minutes: 50
    skills: [speaking, grammar, listening]
    tags: [da.conditional, da.modal-verbs, da.past-perfect]
    objectives:
      - Express regrets with hvis bare and gid + past perfect
      - Judge past actions with burde have and skulle have + participle
      - Talk about lessons learned and give advice based on experience
    intro: |
      Farewell receptions are a Danish workplace tradition: speeches, cake and a look back over many years. They're also a moment for honesty about what we would have done differently. In this lesson Karen, who is retiring after thirty-four years, talks to her young colleague Omar about regrets and lessons learned. You'll learn the many ways Danish expresses regret: *Hvis bare jeg havde turdet! Gid jeg havde taget kurset. Du burde have sagt ja.*
    vocab: |
      ærgre sig over | to be annoyed about; to regret | v | Jeg ærgrer mig stadig over, at jeg ikke tog af sted. | I still regret not going. | n: Reflexive. Past: ærgrede sig.
      gid | I wish; if only | conj | Gid jeg havde vidst det noget før! | I wish I'd known that sooner! | n: Followed by statement word order; for the past, the past perfect.
      en pension | a retirement; a pension | n | Hun går på pension til sommer. | She's retiring this summer. | g: c | pl: pensioner | c: gå på pension (retire)
      et udlandsophold | a stay abroad | n | Et udlandsophold kan styrke dit cv. | A stay abroad can strengthen your CV. | g: n | pl: udlandsophold
      turde | to dare | v | Jeg turde ikke sige noget. | I didn't dare say anything. | n: Irregular: tør, turde, har turdet.
      genkende | to recognise; to relate to | v | Det kan jeg godt genkende fra mit eget liv. | I can relate to that from my own life. | n: Past: genkendte.
      lad være med at | don't (do something) | expr | Lad være med at gøre min fejl. | Don't make my mistake. | n: Followed by the infinitive.
      arbejde over | to work overtime | v | Hun arbejdede over næsten hver dag. | She worked overtime almost every day. | n: Particle verb. Past: arbejdede over.
      et minde | a memory | n | Jeg har mange gode minder fra skolen. | I have lots of good memories from school. | g: n | pl: minder
      bedre sent end aldrig | better late than never | expr | Jeg begyndte at løbe som sekstiårig — bedre sent end aldrig. | I started running at sixty — better late than never.
    grammar:
      title: "Regrets: hvis bare, gid, burde have, skulle have"
      body: |
        To regret something in the past, Danish uses the past perfect or a modal + have + participle:

        - **Hvis bare / bare + past perfect** (if only): *Hvis bare jeg havde turdet!* Although it stands alone, it is a subordinate clause: subject first, ikke before the verb — *Hvis bare jeg **ikke havde** sagt det!*
        - **Gid + past perfect** (I wish): *Gid jeg havde taget kurset.* About the present or future, gid takes the present or past: *Gid det snart bliver forår.*
        - **Jeg ville ønske, (at) jeg havde…** — the neutral version: *Jeg ville ønske, jeg havde rejst mere.* (At B1 you used it with the past for present wishes.)
        - **burde have + participle** — should have, as a judgement: *Du burde have sagt ja.*
        - **skulle have + participle** — 1) should have (a little more colloquial): *Jeg skulle have lyttet til dig.* 2) you should have been there / seen it (something someone missed): *Du skulle have set hans ansigt!*

        Compare now and then: *Hvis bare jeg **havde** mere tid* (now) vs. *Hvis bare jeg **havde haft** mere tid* (then).
      table: |
        Form | Meaning | Example
        hvis bare / bare + past perfect | if only | Hvis bare jeg havde turdet!
        gid + past perfect | I wish (past) | Gid jeg havde taget kurset.
        jeg ville ønske, jeg havde… | I wish I had | Jeg ville ønske, jeg havde rejst mere.
        burde have + participle | should have | Du burde have sagt ja.
        skulle have + participle | should have / you should have seen | Du skulle have været med!
      examples: |
        Hvis bare jeg havde lært tysk ordentligt! | If only I had learned German properly! | hvis bare + past perfect
        Gid jeg ikke havde sagt det. | I wish I hadn't said that. | ikke before the verb
        Vi burde have bestilt billetter i god tid. | We should have booked tickets in good time. | burde have
        Du skulle have set udsigten fra toppen! | You should have seen the view from the top! | something the listener missed
      tip: "Hvis bare and gid behave like subordinate clauses even when they stand alone: Hvis bare jeg ikke havde… — never Hvis bare jeg havde ikke…"
    dialogue:
      title: Afskedsreceptionen
      setting: A farewell reception at an engineering company in Kolding. Karen, 66, is retiring after thirty-four years; her young colleague Omar comes over with a piece of cake.
      speakers: O=Omar/m; K=Karen/f
      lines: |
        O: Tillykke med pensionen, Karen. Fireogtredive år i samme firma — fortryder du noget? | Congratulations on your retirement, Karen. Thirty-four years in the same company — do you regret anything?
        K: Tak, Omar. Ja, lidt. Hvis bare jeg havde turdet søge den stilling i Hamborg, da jeg var i trediverne. | Thanks, Omar. Yes, a little. If only I'd dared to apply for that job in Hamburg when I was in my thirties.
        O: Hvorfor gjorde du ikke det? | Why didn't you?
        K: Jeg var bange for, at mit tysk ikke var godt nok. Gid jeg havde taget det kursus, min chef tilbød mig. | I was afraid my German wasn't good enough. I wish I'd taken the course my boss offered me.
        O: Det kan jeg godt genkende. Jeg sagde nej til et udlandsophold sidste år, og nu ærgrer jeg mig. | I can relate to that. I said no to a stay abroad last year, and now I regret it.
        K: Så lad være med at gøre min fejl. Du burde have sagt ja — men der kommer nye chancer. | Then don't make my mistake. You should have said yes — but new chances will come.
        O: Hvis du kunne give dit yngre jeg ét råd, hvad skulle det så være? | If you could give your younger self one piece of advice, what would it be?
        K: At sige nej oftere. Jeg burde have holdt fri, da børnene var små, i stedet for at arbejde over. | To say no more often. I should have taken time off when the children were small, instead of working overtime.
        O: Det siger mange. Men du har vel også gode minder herfra? | Lots of people say that. But I suppose you have good memories from here too?
        K: Masser! Du skulle have været med til julefrokosten i 1998 — den taler folk stadig om. | Loads! You should have been at the Christmas lunch in 1998 — people still talk about it.
        O: Den historie vil jeg gerne høre. Men hvad skal du så lave nu? | I'd love to hear that story. But what are you going to do now?
        K: Nu tager jeg det kursus i tysk. Bedre sent end aldrig — og Hamborg ligger der jo stadig. | Now I'm taking that German course. Better late than never — and Hamburg is still there, after all.
    pronunciation:
      title: "Sighs of regret: Gid…! Hvis bare…!"
      body: |
        Regrets are often exclamations, with a falling tone at the end. The stress falls on *gid* or *bare* and on the participle: *GID jeg havde TURdet!* · *Hvis BARE jeg havde VIDST det!* The d in *gid* is soft, and *havde* is short and weak in the middle.

        With burde have and skulle have, the stress goes on the participle: *Du burde have sagt JA.* Listen and repeat.
      items: |
        Gid jeg havde turdet!
        Hvis bare jeg havde vidst det!
        Du burde have sagt ja.
        Du skulle have været med!
        Bedre sent end aldrig.
    mistakes: |
      Hvis bare jeg havde ikke sagt det! => Hvis bare jeg ikke havde sagt det! | Hvis bare introduces a subordinate clause: ikke goes before the verb.
      Jeg burde har sagt ja. => Jeg burde have sagt ja. | After a modal verb, use the infinitive have.
      Gid jeg tog kurset dengang. => Gid jeg havde taget kurset dengang. | A regret about the past needs the past perfect.
    task:
      title: A letter to your younger self
      mode: writing
      body: |
        Write a letter (about 150 words) to yourself at eighteen. Mention three things you regret and three lessons you've learned. Use hvis bare, gid, jeg ville ønske, burde have and skulle have at least once each — and end on a positive note about the future.
    exercises: |
      fill: Hvis bare jeg ___ lyttet til dig! || havde || Hvis bare + past perfect: havde lyttet. || @tags da.conditional,da.past-perfect
      fill: Du ___ have sagt ja til jobbet. (should have) || burde / skulle || Burde (or skulle) + have + participle = should have. || @tags da.modal-verbs
      fill: Gid jeg ___ ___ sagt det! (hadn't) || ikke ; havde || Gid takes subordinate word order: ikke before havde. || @tags da.conditional,da.negation
      mc: Which sentence expresses a regret about the past? || *Gid jeg havde rejst mere, da jeg var ung. | Gid det bliver godt vejr i morgen. | Jeg rejser meget, når jeg er ung. || Gid + past perfect looks back; gid + present wishes for the future. || @tags da.conditional
      mc: "Du skulle have set hans ansigt!" What does the speaker mean? || *You missed something funny or remarkable | You were supposed to look at him | You must look at his face now || Skulle have set = you should have seen it — you missed it. || @tags da.modal-verbs
      tf: Karen applied for the job in Hamburg. || false || "Hvis bare jeg havde turdet søge den stilling i Hamborg…" — she didn't dare. || @ctx dialogue
      short: What is Karen going to do now that she has retired? || kw: tysk/German/kursus/course || "Nu tager jeg det kursus i tysk." || @ctx dialogue
      listen: @dialogue || What does Karen think she should have done when her children were small? || *Taken time off instead of working overtime | Moved to Hamburg | Learned German || "Jeg burde have holdt fri, da børnene var små, i stedet for at arbejde over." || @tags da.listening
      listen: Jeg ville ønske, jeg havde lært at spille et instrument som barn. Nu har jeg hverken tid eller tålmodighed. || What does the speaker regret? || *Not learning an instrument as a child | Playing an instrument as a child | Having too much free time || "Jeg ville ønske, jeg havde lært at spille et instrument som barn." || @tags da.listening,da.conditional
      rw: Express it as a regret, starting "Hvis bare…" :: Jeg sparede ikke op. || Hvis bare jeg havde sparet op! | Hvis bare jeg havde sparet op. || Hvis bare + past perfect; the regret turns the negative fact into a positive wish. || @tags da.conditional,da.past-perfect
      tr: I should have said no. || Jeg burde have sagt nej. | Jeg skulle have sagt nej. || Burde (or skulle) + have + participle. || @tags da.modal-verbs
      ask: Tell a friend about one decision you regret and one you don't regret at all. || kw: hvis bare/gid/burde have/skulle have/ville ønske/ærgrer/fortryder || Jeg ærgrer mig over, at jeg ikke tog et år i udlandet. Gid jeg havde gjort det, før jeg fik børn. Men jeg fortryder ikke, at jeg flyttede til Danmark — det var den bedste beslutning i mit liv.
      write: Write a letter to your younger self (about 150 words) with three regrets and three lessons. || min=100 || req: hvis bare/gid/ville ønske | burde have/skulle have || Kære atten-årige mig. Du tror, du har god tid, men den går hurtigere, end du aner. Hvis bare du havde lyttet til mor, da hun sagde, at du skulle spare op! Du burde også have ringet oftere til farmor, mens hun levede. Og gid du havde turdet tage det år i Australien. Men du lærer meget undervejs. Du lærer, at venner er vigtigere end karakterer. Du lærer, at det er okay at skifte retning. Og du lærer, at det aldrig er for sent at begynde på noget nyt. Du skulle have set dig selv, da du løb dit første maraton som fyrreårig! Kærlig hilsen dig selv.
      dict: Hvis bare jeg havde turdet søge den stilling i Hamborg.

  - title: Presenting an argument
    summary: Read the script of a short presentation arguing that everyone should refresh their first-aid skills, and learn to signpost a talk and focus your key point with pseudo-clefts (Det, der …, er …).
    minutes: 55
    skills: [reading, speaking, writing]
    tags: [da.relative-clauses, da.word-order, da.reading]
    objectives:
      - Signpost the structure of a presentation (mit oplæg består af, det bringer mig til, lad mig opsummere)
      - Focus a key point with a pseudo-cleft (Det, der reddede ham, var…)
      - Give a short, persuasive presentation and invite questions
    intro: |
      Giving an **oplæg** — a short talk or presentation — is something Danes do at school, at work, in associations and at public meetings. A good presentation tells the audience where it is going, gives concrete examples and ends with a clear message. In this lesson you'll read the script of a nurse's five-minute talk about first aid, and learn the phrases and structures that make a spoken argument easy to follow.
    vocab: |
      et oplæg | a presentation; a talk | n | Hun holdt et oplæg om førstehjælp på biblioteket. | She gave a talk on first aid at the library. | g: n | pl: oplæg | c: holde et oplæg
      en pointe | a point | n | Det er netop min pointe. | That's exactly my point. | g: c | pl: pointer
      opsummere | to sum up | v | Lad mig kort opsummere. | Let me briefly sum up. | n: Past: opsummerede.
      afgørende | decisive; crucial | adj | De første minutter er afgørende. | The first few minutes are crucial. | n: Same form for all genders and plural.
      et hjertestop | a cardiac arrest | n | Hvert år får tusindvis af danskere hjertestop uden for hospitalet. | Every year thousands of Danes have a cardiac arrest outside hospital. | g: n | pl: hjertestop
      en hjertestarter | a defibrillator | n | Der hænger en hjertestarter i klubhuset. | There's a defibrillator in the clubhouse. | g: c | pl: hjertestartere
      obligatorisk | compulsory | adj | Et førstehjælpskursus er obligatorisk, når man tager kørekort. | A first-aid course is compulsory when you take your driving test. | n: Et-words: obligatorisk; plural: obligatoriske.
      vedligeholde | to maintain; to keep up | v | Man skal vedligeholde sin viden. | You have to keep your knowledge up to date. | n: Irregular: vedligeholdt, har vedligeholdt.
      gøre en forskel | to make a difference | expr | Almindelige mennesker kan gøre en stor forskel. | Ordinary people can make a big difference.
      tak for ordet | thank you (at the end of a speech) | expr | Tak for ordet — er der nogen spørgsmål? | Thank you — are there any questions? | n: Said by a speaker who is finishing; literally "thanks for the floor".
    grammar:
      title: "Structuring a talk — and pseudo-clefts: Det, der …, er …"
      body: |
        A spoken argument needs clear **signposts**, because listeners can't go back and reread:

        - **Opening:** *Tak, fordi I er kommet.* · *I aften vil jeg tale om…* · *Mit oplæg består af tre dele.*
        - **Moving on:** *Lad mig starte med…* · *Derefter vil jeg…* · *Det bringer mig til…* · *Til sidst…*
        - **Evidence:** *Lad mig give et eksempel.* · *Erfaringen viser, at…*
        - **Summing up and closing:** *Lad mig opsummere.* · *Kort sagt…* · *Tak for ordet.*

        Signposts in first position are followed by the verb (V2): ***Derefter vil** jeg se på…*

        **Pseudo-clefts** put your key point at the end of the sentence, where it carries most weight: ***Det, der** reddede ham, **var** en tilskuer.* The pattern is *Det, der/som + clause, + er/var + key point*.
        - Use **der** (or som) when det is the subject of the clause: *Det, der holder os tilbage, er frygten.*
        - Use **som** or nothing when det is the object: *Det, (som) jeg vil foreslå, er et gratis kursus.*

        Don't translate English *what* as *hvad* here: ~~Det, hvad der reddede ham~~ is wrong.
      table: |
        Function | Phrases
        opening | I aften vil jeg tale om… / Mit oplæg består af tre dele.
        moving on | Lad mig starte med… / Det bringer mig til… / Til sidst…
        evidence | Lad mig give et eksempel. / Erfaringen viser, at…
        focus | Det, der er vigtigt, er… / Det, jeg vil foreslå, er…
        summing up | Lad mig opsummere. / Kort sagt…
        closing | Tak for ordet. / Er der nogen spørgsmål?
      examples: |
        Mit oplæg består af tre dele. | My talk has three parts. | opening
        Det bringer mig til min anden pointe. | That brings me to my second point. | moving on
        Det, der reddede ham, var en tilskuer. | What saved him was a spectator. | pseudo-cleft: der as subject
        Det, jeg vil foreslå, er et gratis kursus. | What I'd like to propose is a free course. | pseudo-cleft: object, no der
      tip: "Tell them what you're going to say, say it, then tell them what you said — signposting matters even more in speech than in writing."
    reading:
      title: Fem minutter, der kan redde et liv
      text: |
        Oplæg: Fem minutter, der kan redde et liv

        Godaften, og tak, fordi I er kommet. Jeg hedder Sofie Holm, og jeg er sygeplejerske på en akutmodtagelse. I aften vil jeg tale om noget, som jeg mener, at alle voksne bør kunne: førstehjælp.

        Mit oplæg består af tre dele. Først vil jeg fortælle, hvorfor de første minutter er afgørende. Derefter vil jeg se på, hvad der allerede er sket i Danmark. Og til sidst vil jeg komme med et konkret forslag.

        Lad mig starte med et eksempel. For to år siden faldt en mand om på en fodboldbane i Herning. Det, der reddede ham, var ikke ambulancen. Det var en tilskuer, der straks begyndte at give hjertemassage, og en anden, der hentede en hjertestarter i klubhuset. Da ambulancen kom efter ni minutter, havde hans hjerte allerede fået hjælp i otte.

        Det er netop min pointe: Ved hjertestop falder chancen for at overleve for hvert minut, der går uden hjælp. Det betyder, at det ofte er os – helt almindelige mennesker – der gør forskellen.

        Det bringer mig til min anden del. Danmark er faktisk kommet langt. Førstehjælp er obligatorisk, når man tager kørekort, og der hænger hjertestartere på skoler, stationer og i idrætshaller over hele landet. Samtidig er andelen af danskere, der overlever et hjertestop uden for hospitalet, steget markant de sidste tyve år.

        Alligevel er der et problem. Mange af os tog kurset for længe siden, og vi har glemt det meste. Spørger man en tilfældig gruppe voksne, om de tør give hjertemassage, svarer mange nej. Det, der holder os tilbage, er sjældent mangel på viden. Det er frygten for at gøre noget forkert.

        Hvad kan vi så gøre? Mit forslag er enkelt: et gratis genopfriskningskursus på arbejdspladsen hvert andet år – en time i arbejdstiden. Det koster næsten ingenting, og erfaringen viser, at folk, der har øvet sig for nylig, handler hurtigere og mere sikkert.

        Lad mig opsummere. De første minutter er afgørende. Danmark er godt på vej, men vores viden forsvinder, hvis vi ikke vedligeholder den. Og det, der skal til, er ikke mere end en time hvert andet år.

        Så mit spørgsmål til jer i aften er: Hvornår har du sidst øvet dig? Tak for ordet – jeg vil meget gerne høre jeres spørgsmål.
      translation: |
        Talk: Five minutes that can save a life

        Good evening, and thank you for coming. My name is Sofie Holm, and I'm a nurse in an emergency department. Tonight I want to talk about something that I believe all adults should be able to do: first aid.

        My talk has three parts. First, I'll explain why the first few minutes are crucial. Then I'll look at what has already happened in Denmark. And finally I'll make a concrete proposal.

        Let me start with an example. Two years ago a man collapsed on a football pitch in Herning. What saved him was not the ambulance. It was a spectator who immediately started heart massage, and another who fetched a defibrillator from the clubhouse. When the ambulance arrived after nine minutes, his heart had already been receiving help for eight.

        That is exactly my point: in a cardiac arrest, the chance of survival falls with every minute that passes without help. This means that it is often us – completely ordinary people – who make the difference.

        That brings me to my second part. Denmark has actually come a long way. First aid is compulsory when you take your driving test, and there are defibrillators at schools, stations and sports halls all over the country. At the same time, the proportion of Danes who survive a cardiac arrest outside hospital has risen significantly over the last twenty years.

        Even so, there is a problem. Many of us took the course a long time ago, and we've forgotten most of it. If you ask a random group of adults whether they would dare to give heart massage, many say no. What holds us back is rarely a lack of knowledge. It's the fear of doing something wrong.

        So what can we do? My proposal is simple: a free refresher course at the workplace every other year – one hour during working hours. It costs almost nothing, and experience shows that people who have practised recently act faster and more confidently.

        Let me sum up. The first few minutes are crucial. Denmark is well on the way, but our knowledge disappears if we don't keep it up. And what it takes is no more than one hour every other year.

        So my question to you tonight is: when did you last practise? Thank you – I'd love to hear your questions.
    pronunciation:
      title: "Pause and stress in a presentation"
      body: |
        In a talk, pauses are as important as words. Make a short pause after each signpost, so the audience hears the structure: *Det bringer mig til | min anden del.*

        In a pseudo-cleft, pause at the second comma and put the strongest stress on the key point at the end: *Det, der reddede ham, | var en TILSKUER.* Speak a little more slowly than in conversation. Listen and repeat.
      items: |
        Mit oplæg består af tre dele.
        Det bringer mig til min anden del.
        Lad mig opsummere.
        Det, der reddede ham, var en tilskuer.
        Tak for ordet.
    mistakes: |
      Derefter jeg vil se på tallene. => Derefter vil jeg se på tallene. | Derefter is the first element, so the verb comes next.
      Det, hvad der reddede ham, var en tilskuer. => Det, der reddede ham, var en tilskuer. | Don't use hvad after det; use der (or som).
      Mit oplæg består på tre dele. => Mit oplæg består af tre dele. | Bestå af = consist of.
    task:
      title: Your five-minute talk
      mode: speaking
      body: |
        Prepare a three- to five-minute presentation proposing one change at your workplace, school or in your town. Announce your three parts, give one concrete example, use at least two pseudo-clefts (Det, der…, er…) and finish with a summary, a question to the audience and "Tak for ordet". Then present your proposal in the "Taking part in a business meeting" scenario with the AI coach and answer its questions.
    exercises: |
      fill: Mit oplæg består ___ tre dele. || af || Bestå af = consist of. || @tags da.vocabulary
      fill: Det, ___ reddede ham, var en tilskuer. || der / som || Det is the subject of the relative clause, so der (or som) is needed. || @tags da.relative-clauses
      mc: Which sentence is correct? || *Derefter vil jeg se på tallene. | Derefter jeg vil se på tallene. | Derefter vil se jeg på tallene. || Derefter in first position: verb (vil) + subject (jeg). || @tags da.word-order
      mc: Which phrase do you use to move on to your next point? || *Det bringer mig til… | Tak for ordet. | Lad mig opsummere. || Det bringer mig til… introduces the next part; the others close or sum up. || @tags da.opinion
      tf: The ambulance arrived before anyone started heart massage. || false || A spectator started immediately; the ambulance arrived after nine minutes. || @ctx reading
      mc: According to Sofie, what most often holds people back from giving heart massage? || *Fear of doing something wrong | A lack of knowledge | A lack of defibrillators || "Det, der holder os tilbage, er sjældent mangel på viden. Det er frygten for at gøre noget forkert." || @ctx reading @skill reading @tags da.reading
      short: What does Sofie propose? || kw: kursus/course/arbejdsplads/workplace/hvert andet år/every other year/every two years || A free refresher course at the workplace every other year, one hour during working hours. || @ctx reading
      listen: Lad mig opsummere. Projektet er billigt, det kan gennemføres på et halvt år, og det, der er vigtigst, er, at det gavner alle beboere. || What is most important, according to the speaker? || *That it benefits all the residents | That it is cheap | That it takes six months || The pseudo-cleft puts the key point last: "det, der er vigtigst, er, at det gavner alle beboere." || @tags da.listening,da.relative-clauses
      rw: Rewrite as a pseudo-cleft, starting "Det, der…" :: Frygten holder os tilbage. || Det, der holder os tilbage, er frygten. | Det, som holder os tilbage, er frygten. || Det, der + verb …, er + the key point. || @tags da.relative-clauses
      tr: That brings me to my last point. || Det bringer mig til min sidste pointe. | Det bringer mig til mit sidste punkt. | Det leder mig hen til min sidste pointe. || Det bringer mig til… is the standard signpost. || @tags da.opinion
      ask: Give the opening of a short presentation proposing a change at your workplace or school: greet the audience, state your topic and outline your three parts. || kw: i dag vil jeg/i aften vil jeg/jeg vil tale om/mit oplæg & består af/først/derefter/til sidst || Godmorgen, og tak, fordi I er her. I dag vil jeg tale om vores kantine. Mit oplæg består af tre dele: Først ser jeg på problemet, derefter på løsningen, og til sidst på prisen.
      write: Write the script (150–200 words) for a short presentation proposing a change at your workplace, school or in your town. || min=120 || req: mit oplæg/i dag vil jeg/jeg vil tale om | det bringer mig til/derefter/til sidst | lad mig opsummere/kort sagt | tak for ordet || Godaften, og tak, fordi I er kommet. I aften vil jeg tale om vores bibliotek. Mit oplæg består af tre dele: problemet, mit forslag og økonomien. Lad mig starte med problemet. I dag lukker biblioteket klokken fem, og det betyder, at mange, der arbejder, aldrig kan komme der. Det bringer mig til mit forslag: et selvbetjent bibliotek, der er åbent fra syv morgen til ti aften. Det, der gør det muligt, er ny teknologi, som flere kommuner allerede bruger. Og til sidst økonomien: Ordningen koster mindre end en ekstra medarbejder. Lad mig opsummere. Det, vi får, er et bibliotek for alle — også for dem, der arbejder. Tak for ordet.
      dict: Det, der reddede ham, var ikke ambulancen.
