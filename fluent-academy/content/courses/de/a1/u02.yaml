      fill: Was ___ Sie von Beruf? || sind || The formal question is Was sind Sie von Beruf? || @tags de.sein,de.register
      mc: The female form of "der Arzt" is… || die Arztin | *die Ärztin | die Arztfrau || Arzt adds an umlaut and -in: die Ärztin. || @tags de.gender
      mc: What does Herr Nguyen do? || He's a nurse. | *He's a cook. | He's a student. || "Ich bin Koch. Ich arbeite in einem Restaurant." || @ctx dialogue @skill reading @tags de.reading
