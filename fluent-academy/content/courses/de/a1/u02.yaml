      tr: She's a doctor and works at the hospital. || Sie ist Ärztin und arbeitet im Krankenhaus. | Sie ist Ärztin und sie arbeitet im Krankenhaus. | Sie ist Ärztin und arbeitet in einem Krankenhaus. | Sie ist Ärztin und sie arbeitet in einem Krankenhaus. || No article before the job; im = in dem. || @tags de.articles,de.present-regular
      tr: What do you do for a living? (informal) || Was bist du von Beruf? | Was machst du beruflich? | Was machst du? || Informal: Was bist du von Beruf? or Was machst du beruflich? || @tags de.questions
      listen: Ich heiße Kerem. Ich bin Verkäufer und arbeite in Dortmund. || What is Kerem's job? || Cook | *Sales assistant | Teacher || Verkäufer = sales assistant. || @tags de.listening
