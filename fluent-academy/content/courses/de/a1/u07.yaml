      fill: Was ___ du gern? (lesen) || liest || Lesen changes e → ie, and the stem ends in s: du liest. || @tags de.present-irregular
      fill: Mein Sohn ___ gern Nudeln. (essen) || isst || Essen changes e → i: er isst. || @tags de.present-irregular
      fill: Was ___ du? – Ich nehme die Suppe. (nehmen) || nimmst || Nehmen has an irregular du-form: du nimmst. || @tags de.present-irregular
      mc: "Er ___ einen Film." (sehen) || seht | *sieht | siehst || Sehen changes e → ie: er sieht. Seht is ihr, siehst is du. || @tags de.present-irregular
      mc: A friend invites you, but you are busy. You say: || Ja, gern! Gute Idee! | *Leider nicht, ich habe keine Zeit. | Ich komme gern mit. || Leider nicht = unfortunately not. || @tags de.negation
