      rw: Change the subject to "er" :: Ich fahre gern Rad. || Er fährt gern Rad. | Er fährt gerne Rad. || With er, fahren becomes fährt. || @tags de.present-irregular
      tr: Are you coming along? (informal) || Kommst du mit? || Mitkommen is separable: Kommst du … mit? || @tags de.separable,de.questions
