      fill: ___ ich mit Karte bezahlen? (können) || Kann || Ich + können = ich kann; the verb comes first in a yes/no question. || @tags de.modal-verbs
      fill: ___ Sie das bitte wiederholen? (können) || Können / Koennen || Sie + können = Sie können. || @tags de.modal-verbs,de.register
      fill: Wir möchten ein Zimmer für drei ___. (Nacht) || Nächte / Naechte || The plural of die Nacht is die Nächte. || @tags de.plural
      mc: Which question is polite and correct? || *Können Sie das bitte buchstabieren? | Kann Sie das bitte buchstabieren? | Können Sie buchstabieren das bitte? || Sie + können; the infinitive buchstabieren goes to the end. || @tags de.modal-verbs,de.register
      mc: "Einzelzimmer" means… || a double room | *a single room | a youth hostel || Einzel- = single; Doppel- = double. || @skill vocabulary @tags de.vocabulary
      mc: How much does the room cost per night? || €19 | *€90 | €99 || "Das Zimmer kostet neunzig Euro pro Nacht." || @ctx dialogue @skill reading @tags de.reading
      tf: Breakfast costs extra. || false || Daniel asks "Ist das Frühstück inklusive?" and Frau Lorenz says yes. || @ctx dialogue
      short: Until what time is reception open? || kw: 23/elf/11/dreiundzwanzig/eleven || "Die Rezeption ist bis dreiundzwanzig Uhr offen" — until 11 p.m. || @ctx dialogue
      order: Wie viel kostet das Doppelzimmer pro Nacht? || How much is the double room per night? || @tags de.question-words
      tr: I'd like to book a single room for two nights. || Ich möchte ein Einzelzimmer für zwei Nächte reservieren. | Ich möchte ein Einzelzimmer für zwei Nächte buchen. | Ich möchte für zwei Nächte ein Einzelzimmer reservieren. | Ich möchte für zwei Nächte ein Einzelzimmer buchen. || Möchte in position 2, reservieren (or buchen) at the end. || @tags de.modal-verbs,de.ordering
      tr: Is there Wi-Fi in the room? || Gibt es im Zimmer WLAN? | Gibt es WLAN im Zimmer? | Hat das Zimmer WLAN? || Gibt es…? asks whether something exists; im Zimmer = in the room. || @tags de.questions
      listen: Das Doppelzimmer kostet achtzig Euro pro Nacht, mit Frühstück. || What do you learn about the double room? || *€80 a night, breakfast included | €18 a night, no breakfast | €80 a night, breakfast extra || Achtzig Euro pro Nacht, mit Frühstück = €80 a night with breakfast. || @tags de.numbers
      dict: Ich möchte ein Doppelzimmer für zwei Nächte.
      ask: Call a hotel — ask whether they have a room available and how much it costs. || kw: haben sie/ist & zimmer & kostet/kosten/preis || Guten Tag! Haben Sie ein Einzelzimmer frei? Wie viel kostet das Zimmer pro Nacht?
      write: Write a short email to a youth hostel to book a room — the dates, the room and one question. || min=30 || req: möchte/moechte | zimmer | nacht/nächte/naechte | kann ich/können sie/koennen sie/ist das/gibt es || Sehr geehrte Damen und Herren, ich möchte ein Doppelzimmer von Freitag bis Sonntag reservieren, also für zwei Nächte. Ist das Frühstück inklusive? Kann ich am Freitag erst um zehn Uhr abends ankommen? Mit freundlichen Grüßen, Maria Costa || @tags de.formal-writing
