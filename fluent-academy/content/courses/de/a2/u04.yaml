      dict: Im Anhang finden Sie meinen Lebenslauf.
      ask: In an interview you are asked "Warum möchten Sie bei uns arbeiten?" Answer with weil or dass. || kw: weil/dass & ist/bin/kann/arbeite/habe/finde/passt/macht/spreche || Ich glaube, dass die Arbeit sehr interessant ist. Und ich möchte hier arbeiten, weil ich gern im Team arbeite.
      write: Write a short application email (6–8 sentences) for a part-time job in a café, shop or library. || min=50 || req: sehr geehrte | dass | weil | mit freundlichen grüßen || Sehr geehrte Frau Hoffmann, mit großem Interesse habe ich Ihre Anzeige für eine Aushilfe im Café Lindenhof gelesen. Ich studiere seit zwei Jahren Germanistik und habe schon ein Jahr in einem Restaurant gearbeitet. Die Stelle passt sehr gut, weil ich abends und am Wochenende Zeit habe. Ich bin zuverlässig und freundlich, und ich glaube, dass ich gut in Ihr Team passe. Ich hoffe, dass Sie mich zu einem Gespräch einladen. Mit freundlichen Grüßen, Lucía Romero
