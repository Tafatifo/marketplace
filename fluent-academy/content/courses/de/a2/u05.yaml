      fill: In der Stadt gibt es ___ Verkehr als auf dem Land. (viel) || mehr || Viel → mehr; mehr never takes an ending. || @tags de.comparatives
      fill: Die Mieten sind hier ___ als in meiner Heimatstadt. (hoch) || höher || Hoch → höher: umlaut, and the c disappears. || @tags de.comparatives
      mc: "Ich wohne lieber in der Stadt." means… || *I prefer living in the city. | I lived in the city before. | I love the city more than anything. || Lieber = rather, preferably — it expresses a preference, not a superlative. || @tags de.comparatives,de.gern
      rw: Say that you prefer the balcony, using lieber :: Wir grillen gern im Hof. || Wir grillen lieber auf dem Balkon. | Wir grillen lieber auf dem Balkon als im Hof. || Gern → lieber; als names the other option. || @tags de.comparatives,de.gern
      tf: Herr Schulze has lived in the building for thirty years. || true || "Ich wohne schon seit dreißig Jahren in diesem Haus." || @ctx dialogue
      short: When does the rubbish collection come? || kw: dienstag/tuesday || "Am Dienstag." || @ctx dialogue
      listen: @dialogue || What does Herr Schulze offer to do? || Help Thanh carry boxes | *Take in her parcels | Water her plants || "Ich nehme gern Ihre Pakete an."
      listen: Liebe Nachbarn, am Samstag machen wir ein kleines Fest im Hof. Bitte bringt etwas zu essen mit! || What should the neighbours bring? || Something to drink | *Something to eat | Chairs || Bitte bringt etwas zu essen mit = please bring something to eat. || @tags de.listening
      tr: I'd rather live in the country. || Ich wohne lieber auf dem Land. | Ich lebe lieber auf dem Land. | Ich würde lieber auf dem Land wohnen. || Gern → lieber: Ich wohne lieber… || @tags de.comparatives,de.gern
      dict: Ab zweiundzwanzig Uhr ist im Haus Ruhezeit.
      ask: Introduce yourself to a new neighbour and ask one question about the house rules or the rubbish. || kw: ich heiße/ich bin/mein name/ich wohne & müll/hausordnung/ruhezeit/wann/wo/tonne/tonnen/fahrrad || Guten Tag, ich heiße Sam und wohne seit gestern im ersten Stock. Wann kommt hier die Müllabfuhr?
