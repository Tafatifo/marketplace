      fill: Rufen Sie ___ bitte zurück! (me) || mich || Zurückrufen takes the accusative: mich. || @tags de.accusative
      fill: Die Unterlagen? Ich schicke ___ ___ heute. (them – to you, formal) || sie ; Ihnen || Two pronouns: accusative (sie) before dative (Ihnen). || @tags de.dative,de.word-order
      mc: The address? Which order is correct? || Ich schicke dir sie gleich. | *Ich schicke sie dir gleich. | Ich schicke gleich dir sie. || Two pronouns: accusative (sie) before dative (dir). || @tags de.dative,de.word-order
      mc: How do you answer the phone at work? || Hallo, wer ist da? | *Firma Bauer, Petra Klein am Apparat, guten Tag. | Ja? Was ist? || At work you give the company name and your own name. || @tags de.register
      rw: Replace "die Nummer" with a pronoun :: Ich gebe ihm die Nummer. || Ich gebe sie ihm. || Two pronouns: accusative (sie) before dative (ihm). || @tags de.dative,de.word-order
