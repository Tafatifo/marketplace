unit: 6
title: Erledigungen im Alltag
theme: Services and errands
description: Run errands at the post office and the bank, return things that don't fit, and make and take phone calls — with dative pronouns and verbs that take a dative object.
objectives:
  - Use dative pronouns (mir, dir, ihm, ihr…) with verbs like geben, schicken and erklären
  - Use verbs with a dative object such as gefallen, passen, stehen, gehören and helfen
  - Make phone calls, leave and pass on messages, and put two objects in the right order
canDo:
  - I can send a parcel and ask for help at the bank.
  - I can return or exchange something and say what is wrong with it.
  - I can leave a phone message and pass one on.
  - I can ask people politely to help me or explain something to me.
review: |
  fill: Kannst du ___ morgen beim Umzug helfen? (me) || mir || Helfen always takes the dative: mir. || @tags de.dative,de.dative-verbs
  fill: Die Hose gefällt ___ Sohn nicht. (mein) || meinem || Gefallen + dative; der Sohn → meinem Sohn. || @tags de.dative-verbs,de.dative
  fill: Ich schicke ___ die Fotos heute Abend. (you, informal plural) || euch || The receiver is dative: ihr → euch. || @tags de.dative
  fill: Die Schuhe ___ mir leider nicht. Sie sind zu klein. (passen) || passen || The verb agrees with die Schuhe (plural): passen. || @tags de.dative-verbs
  mc: "Gehört dir das Fahrrad?" means… || *Is the bike yours? | Can you hear the bike? | Do you like the bike? || Gehören + dative = to belong to someone. || @tags de.dative-verbs
  mc: Which sentence is correct? || Ich rufe dir morgen an. | *Ich rufe dich morgen an. | Ich rufe du morgen an. || Anrufen takes the accusative: dich. || @tags de.accusative
  rw: Replace both objects with pronouns :: Ich gebe der Kundin den Schlüssel. || Ich gebe ihn ihr. || Two pronouns: accusative (ihn) before dative (ihr). || @tags de.dative,de.word-order
  tr: That colour suits you. (informal) || Die Farbe steht dir. | Die Farbe steht dir gut. | Diese Farbe steht dir. | Diese Farbe steht dir gut. || Stehen + dative = to suit someone. || @tags de.dative-verbs
  listen: Ihr Paket kommt leider nicht heute, sondern erst am Donnerstag. || When will the parcel arrive? || Today | Tomorrow | *On Thursday || Nicht heute, sondern erst am Donnerstag = not today, only on Thursday. || @tags de.listening
  listen: Die Jacke gefällt mir, aber sie ist zu weit. Haben Sie sie eine Nummer kleiner? || What does the customer want? || *A smaller size | A bigger size | A different colour || Zu weit = too loose; eine Nummer kleiner = one size smaller. || @tags de.listening,de.dative-verbs
  ask: Ask a shop assistant for help and say that something doesn't fit you. || kw: helfen/können sie & passt/passen/zu groß/zu klein/zu eng/zu weit || Entschuldigung, können Sie mir helfen? Die Hose passt mir nicht, sie ist zu eng.
  write: Write an email to an online shop: you want to return something. Say what you ordered, what is wrong and what you would like. || min=35 || req: sehr geehrte | mir | zurück/umtauschen/zurückgeben/zurückschicken || Sehr geehrte Damen und Herren, letzte Woche habe ich bei Ihnen einen Rucksack bestellt. Leider gefällt mir die Farbe nicht, und er ist auch zu klein. Ich möchte ihn zurückschicken und mein Geld zurückbekommen. Können Sie mir bitte ein Rücksendeetikett schicken? Mit freundlichen Grüßen, Tarik Benali
lessons:
  - title: At the bank and the post office
    summary: Send a parcel, ask for help at the bank and say who gets what — with dative pronouns and verbs with two objects.
    minutes: 35
    skills: [grammar, speaking, listening]
    tags: [de.dative]
    objectives:
      - Use the dative pronouns mir, dir, ihm, ihr, uns, euch, ihnen and Ihnen
      - Say who receives something with geben, schicken, zeigen and erklären
      - Handle simple errands at the post office and the bank
    intro: |
      At the post office you send something *to someone*; at the bank you ask someone to explain something *to you*. In German, the person who receives is in the **dative**: *Ich schicke **meiner Schwester** ein Paket. Können Sie **mir** das Formular erklären?* In this lesson you learn the dative pronouns and use them for everyday errands.
    vocab: |
      die Post | post office; post | n | Ich muss noch schnell zur Post. | I quickly need to go to the post office. | g: f | pl: (no plural) | n: The branch itself is die Postfiliale.
      schicken | to send | v | Ich schicke meiner Oma ein Paket zum Geburtstag. | I'm sending my grandma a parcel for her birthday. | c: per Post schicken; eine Nachricht schicken
      das Päckchen | small parcel | n | Ein Päckchen ist kleiner und billiger als ein Paket. | A small parcel is smaller and cheaper than a parcel. | g: n | pl: die Päckchen
      die Briefmarke | stamp | n | Ich brauche zwei Briefmarken für Briefe nach Italien. | I need two stamps for letters to Italy. | g: f | pl: die Briefmarken
      das Konto | (bank) account | n | Ich möchte ein Konto eröffnen. | I'd like to open an account. | g: n | pl: die Konten | c: ein Konto eröffnen; das Girokonto
      überweisen | to transfer (money) | v | Ich überweise dir das Geld morgen. | I'll transfer the money to you tomorrow. | n: Inseparable and irregular: hat überwiesen
      abheben | to withdraw (money) | v | Ich hebe am Automaten fünfzig Euro ab. | I'm withdrawing fifty euros at the cash machine. | n: Separable and irregular: hat abgehoben
      der Geldautomat | cash machine; ATM | n | Gibt es hier in der Nähe einen Geldautomaten? | Is there a cash machine near here? | g: m | pl: die Geldautomaten | n: Accusative and dative: den/dem Geldautomaten.
      das Formular | form | n | Füllen Sie bitte dieses Formular aus. | Please fill in this form. | g: n | pl: die Formulare | c: ein Formular ausfüllen
      der Ausweis | ID card | n | Für das Konto brauchen Sie Ihren Ausweis oder Ihren Pass. | For the account you need your ID card or your passport. | g: m | pl: die Ausweise | c: der Personalausweis
      erklären | to explain | v | Können Sie mir das bitte erklären? | Could you explain that to me, please? | n: Something (accusative) to someone (dative).
      zeigen | to show | v | Zeigen Sie mir bitte Ihren Ausweis. | Please show me your ID. | n: Something (accusative) to someone (dative).
    grammar:
      title: "Dative pronouns: mir, dir, ihm, ihr…"
      body: |
        Many verbs have two objects: a **thing** (accusative) and a **person who receives it** (dative): *Ich gebe **dem Kunden** (dative) **den Schlüssel** (accusative).* Typical verbs: *geben, schicken, schenken, zeigen, erklären, bringen, sagen*. The question for the dative is **wem?** (to whom?).

        The dative pronouns show the receiver: *Können Sie **mir** helfen? Ich schicke **dir** die Adresse. Zeigen Sie **uns** bitte den Weg.* With nouns, the article changes: *der/das → dem, die → der*, plural *die → den* + **-n** on the noun: *Ich schicke **meiner** Mutter ein Paket. Ich gebe **den** Kindern Schokolade.*

        When the thing is a noun, the dative comes first: *Ich schicke **dir** das Foto.* (When both objects are pronouns, the order changes — more in lesson 3.)
      table: |
        Nominative | Accusative | Dative
        ich | mich | mir
        du | dich | dir
        er | ihn | ihm
        sie | sie | ihr
        es | es | ihm
        wir | uns | uns
        ihr | euch | euch
        sie / Sie | sie / Sie | ihnen / Ihnen
      examples: |
        Können Sie mir bitte helfen? | Can you help me, please? | mir = (to) me
        Ich schicke meinem Bruder ein Päckchen. | I'm sending my brother a small parcel. | der Bruder → meinem Bruder
        Können Sie uns das Formular erklären? | Could you explain the form to us? | uns
        Der Bankberater zeigt ihr die App. | The bank adviser shows her the app. | ihr = to her
      tip: Ask "wem?" (to whom?) — the answer is the dative. "Wem schickst du das Paket? – Meiner Mutter."
    dialogue:
      title: Ein Paket nach Kanada
      setting: A post office in Erfurt. Darius wants to send a birthday parcel to his sister in Canada. Frau Hübner serves him at the counter.
      speakers: H=Frau Hübner/f; D=Darius/m
      lines: |
        H: Guten Tag, was kann ich für Sie tun? | Hello, what can I do for you?
        D: Ich möchte meiner Schwester dieses Paket schicken. Sie wohnt in Kanada. | I'd like to send my sister this parcel. She lives in Canada.
        H: Nach Kanada, gut. Was ist denn im Paket? | To Canada, fine. What's in the parcel?
        D: Ein Buch und ein Schal. Das ist ein Geschenk für sie. | A book and a scarf. It's a present for her.
        H: Dann füllen Sie mir bitte dieses Formular für den Zoll aus. | Then please fill in this customs form for me.
        D: Hm, das verstehe ich nicht ganz. Können Sie mir helfen? | Hm, I don't quite understand this. Can you help me?
        H: Natürlich. Hier schreiben Sie den Inhalt und hier den Wert. | Of course. Here you write the contents and here the value.
        D: Danke! Wie lange braucht das Paket? | Thanks! How long will the parcel take?
        H: Ungefähr eine Woche. Ich gebe Ihnen eine Sendungsnummer. | About a week. I'll give you a tracking number.
        D: Super, dann schicke ich ihr die Nummer per Nachricht. | Great, then I'll send her the number in a message.
        D: Ach, und ich brauche noch zehn Briefmarken für Deutschland. | Oh, and I also need ten stamps for Germany.
        H: Gern. Das macht zusammen 46 Euro 90. | Certainly. That's 46 euros 90 altogether.
    pronunciation:
      title: "ihm, ihn and ihr: the silent h"
      body: |
        In *ihm, ihn* and *ihr* the **h** is silent — it only shows that the vowel is long: [iːm], [iːn], [iːɐ]. The difference between *ihm* (dative) and *ihn* (accusative) is only the last sound, so close your lips clearly for the **m**.

        The same long i appears in *mir* and *dir*, where the r becomes a soft vowel: [miːɐ], [diːɐ].
      items: |
        ihm
        ihn
        ihr
        Ich schicke ihm ein Paket.
        Können Sie mir helfen?
        die Briefmarke
    culture:
      title: Post offices and paying
      body: |
        In many towns the post office is a counter inside a supermarket, a stationery shop or a kiosk, and parcel lockers let you collect parcels at any time. For parcels to countries outside the EU, you fill in a customs form.

        Card payments have become very common, but cash is still popular, and some small cafés and bakeries only take cash. To open a bank account you usually need your passport or ID card and proof of your address in Germany.
    mistakes: |
      Können Sie mich helfen? => Können Sie mir helfen? | Helfen always takes the dative: mir.
      Ich schicke meine Mutter ein Paket. => Ich schicke meiner Mutter ein Paket. | The receiver is in the dative: die Mutter → meiner Mutter.
      Ich gebe ihn das Formular. => Ich gebe ihm das Formular. | The receiver needs the dative ihm (to him); ihn is accusative.
    task:
      title: At the post office
      mode: interaction
      body: |
        Role-play with a partner or record both parts: send a parcel abroad — say who it is for and what is in it, ask how long it takes and how much it costs. Then ask a bank employee to explain to you how to open an account.
    exercises: |
      fill: Können Sie ___ bitte helfen? (me) || mir || Helfen takes the dative: mir. || @tags de.dative,de.dative-verbs
      fill: Ich schicke ___ das Foto per Nachricht. (you, informal) || dir || The receiver is dative: du → dir. || @tags de.dative
      fill: Wir schenken ___ Oma einen Kalender. (unsere) || unserer || Die Oma → dative unserer Oma. || @tags de.dative,de.possessives
      fill: Der Mitarbeiter erklärt ___ das Formular. (him) || ihm || Er → dative ihm. || @tags de.dative
      mc: "Ich überweise ihr das Geld." Who gets the money? || *a woman | a man | several people || Ihr here is the dative of sie (she): to her. || @tags de.dative
      rw: Replace the noun with a pronoun :: Ich schicke meinem Bruder ein Päckchen. || Ich schicke ihm ein Päckchen. || Meinem Bruder (dative, masculine) → ihm. || @tags de.dative
      tf: Darius is sending the parcel to his mother. || false || He's sending it to his sister in Canada. || @ctx dialogue
      short: What is in the parcel? || kw: buch/book & schal/scarf || "Ein Buch und ein Schal." || @ctx dialogue
      listen: @dialogue || How long will the parcel take? || Two days | *About a week | A month || "Ungefähr eine Woche."
      listen: Guten Tag, ich möchte ein Konto eröffnen. Was brauche ich für ein Konto? || What does the customer want? || To withdraw money | *To open an account | To send a parcel || Ein Konto eröffnen = to open an account. || @tags de.listening
      tr: Can you explain that to me? (formal) || Können Sie mir das erklären? | Können Sie mir das bitte erklären? | Könnten Sie mir das erklären? | Könnten Sie mir das bitte erklären? || Erklären + dative person (mir) + thing (das). || @tags de.dative
      dict: Ich brauche noch zehn Briefmarken für Deutschland.
      ask: At the bank, ask the employee politely to help you or explain something to you. || kw: können sie/könnten sie & mir & helfen/erklären/zeigen/sagen || Entschuldigung, können Sie mir bitte helfen? Ich verstehe dieses Formular nicht.

  - title: Returns and exchanges
    summary: Return or exchange things that don't fit or don't work, with verbs that take the dative — gefallen, passen, stehen, gehören.
    minutes: 35
    skills: [grammar, speaking, vocabulary]
    tags: [de.dative-verbs, de.dative]
    objectives:
      - Use verbs with a dative object such as gefallen, passen, stehen, gehören and helfen
      - Explain what is wrong with something you bought
      - Ask for an exchange or a refund
    intro: |
      The trousers don't fit, the colour doesn't suit you, the kettle doesn't work — returning things is part of everyday life. German expresses many of these ideas with verbs that take a **dative** object: *Die Hose **passt mir** nicht. Die Farbe **steht dir** gut.* In this lesson you learn these verbs and the phrases you need at the customer service desk.
    vocab: |
      umtauschen | to exchange | v | Kann ich die Schuhe umtauschen? | Can I exchange the shoes? | n: Separable: Ich tausche sie um. Perfekt: hat umgetauscht
      zurückgeben | to return; to give back | v | Ich möchte diesen Wasserkocher zurückgeben. | I'd like to return this kettle. | n: Separable and irregular: hat zurückgegeben
      der Kassenbon | receipt | n | Haben Sie den Kassenbon noch? | Do you still have the receipt? | g: m | pl: die Kassenbons | n: Also: die Quittung.
      das Geld zurückbekommen | to get your money back; to get a refund | expr | Bekomme ich mein Geld zurück? | Do I get my money back? | n: Perfekt: hat zurückbekommen
      die Größe | size | n | Welche Größe haben Sie? | What size are you? | g: f | pl: die Größen | n: For clothes people also say die Nummer: eine Nummer größer.
      gefallen | to please (= to like) | v | Der Pullover gefällt mir nicht mehr. | I don't like the jumper any more. | n: The thing is the subject, the person is dative. es gefällt; Perfekt: hat gefallen
      passen | to fit | v | Die Hose passt mir nicht, sie ist zu eng. | The trousers don't fit me; they're too tight. | n: passen + dative (person)
      stehen | to suit | v | Die Farbe steht dir gut! | The colour suits you! | n: In this meaning stehen takes a dative.
      gehören | to belong to | v | Gehört dir dieser Schirm? | Is this umbrella yours? | n: gehören + dative; Perfekt without ge-: hat gehört
      funktionieren | to work (machines, devices) | v | Der Föhn funktioniert nicht. | The hairdryer doesn't work.
      eng | tight; narrow | adj | Die Schuhe sind zu eng. | The shoes are too tight. | n: The opposite is weit (loose, wide).
      der Fehler | fault; defect; mistake | n | Das Gerät hat einen Fehler. | The device has a fault. | g: m | pl: die Fehler
    grammar:
      title: "Verbs with a dative object"
      body: |
        Some common verbs take a **dative** object instead of an accusative. Learn them as a group:

        - **gefallen** ("to please" = to like): *Die Jacke **gefällt mir**.* = I like the jacket. The thing you like is the subject; the person is dative.
        - **passen** (to fit): *Die Schuhe **passen mir** nicht.*
        - **stehen** (to suit — clothes, colours): *Rot **steht dir** gut.*
        - **gehören** (to belong to): *Das Fahrrad **gehört meinem** Bruder.*
        - **helfen**, **danken**, **antworten**: *Kann ich **Ihnen** helfen? Ich danke **dir**!*

        Because the thing is the subject, the verb agrees with it: *Die Jacke **gefällt** mir* (singular), *Die Schuhe **gefallen** mir* (plural). Gefallen changes its vowel with er/sie/es: *es gefällt*. In the Perfekt: *Die Jacke **hat** mir **gefallen**.*
      table: |
        Verb | Example | Meaning
        gefallen | Die Jacke gefällt mir. | I like the jacket.
        passen | Die Hose passt ihm nicht. | The trousers don't fit him.
        stehen | Die Farbe steht dir gut. | The colour suits you.
        gehören | Das Handy gehört ihr. | The phone is hers.
        helfen | Kann ich Ihnen helfen? | Can I help you?
        danken | Wir danken euch! | We thank you!
      examples: |
        Das Kleid gefällt mir, aber es passt mir nicht. | I like the dress, but it doesn't fit me. | two dative verbs
        Die Schuhe gefallen meiner Tochter nicht. | My daughter doesn't like the shoes. | plural subject: gefallen
        Wem gehört die Tasche? – Sie gehört dem Mann da. | Whose bag is this? – It belongs to that man there. | wem? = to whom?
        Der Mantel hat mir sofort gefallen. | I liked the coat straight away. | Perfekt: hat gefallen
      tip: Turn the English sentence around — not "I like the jacket" but "the jacket pleases me" — Die Jacke gefällt mir.
    dialogue:
      title: Beim Kundenservice
      setting: Greta bought a raincoat in a department store in Wiesbaden on Saturday. On Monday she takes it back to the customer service desk, where Herr Okoro helps her.
      speakers: O=Herr Okoro/m; G=Greta/f
      lines: |
        O: Guten Tag! Wie kann ich Ihnen helfen? | Hello! How can I help you?
        G: Ich habe am Samstag diese Regenjacke gekauft. Ich möchte sie umtauschen. | I bought this raincoat on Saturday. I'd like to exchange it.
        O: Gefällt Ihnen die Jacke nicht? | Don't you like the jacket?
        G: Doch, sie gefällt mir sehr gut. Aber sie passt mir nicht. | Yes, I like it very much. But it doesn't fit me.
        O: Was ist das Problem? Ist sie zu eng? | What's the problem? Is it too tight?
        G: Ja, an den Armen. Haben Sie sie eine Nummer größer? | Yes, on the arms. Do you have it one size bigger?
        O: Moment … Ja, in L haben wir sie noch, aber nur in Grau. | One moment… Yes, we still have it in L, but only in grey.
        G: Grau? Hm, ich weiß nicht. Steht mir Grau? | Grey? Hm, I don't know. Does grey suit me?
        O: Probieren Sie sie doch mal an. Die Kabine ist da hinten. | Why don't you try it on? The fitting room is back there.
        G: Okay, die passt perfekt. Und die Farbe gefällt mir auch. | Okay, this one fits perfectly. And I like the colour too.
        O: Super. Haben Sie noch den Kassenbon? | Great. Do you still have the receipt?
        G: Ja, hier, bitte. Vielen Dank für Ihre Hilfe! | Yes, here you are. Thank you very much for your help!
    pronunciation:
      title: "Stress: UMtauschen, but geFALlen"
      body: |
        Separable prefixes are always stressed: *UMtauschen, ZURÜCKgeben, ANprobieren*. Inseparable prefixes like **ge-** and **be-** are never stressed: *geFALlen, geHÖren, beKOMmen*.

        This helps you hear whether a verb is separable. Tap the stressed syllable as you repeat.
      items: |
        umtauschen
        zurückgeben
        gefallen
        gehören
        Das gefällt mir.
        Die Hose passt mir nicht.
    culture:
      title: Your rights when you return things
      body: |
        If something you bought is faulty, the shop must repair or replace it, or give you your money back — sellers in the EU are liable for defects for two years. If it simply doesn't fit or you don't like it, a shop doesn't have to take it back, but many do so as a gesture of goodwill (*Kulanz*), usually within 14 or 30 days and with the receipt.

        For online purchases in the EU you normally have 14 days to send things back without giving a reason.
    mistakes: |
      Ich gefalle die Jacke. => Die Jacke gefällt mir. | With gefallen, the thing is the subject and the person is dative.
      Die Hose passt mich nicht. => Die Hose passt mir nicht. | Passen takes the dative: mir.
      Die Schuhe gefällt mir. => Die Schuhe gefallen mir. | The verb agrees with the thing: die Schuhe (plural) → gefallen.
    task:
      title: Take it back
      mode: interaction
      body: |
        Practise with the AI coach in the "Returning an item in a shop" scenario: say what you bought and when, explain what is wrong — it doesn't fit, doesn't work or you don't like it — and ask for an exchange or a refund.
    exercises: |
      fill: Die Jacke ist schön, aber sie passt ___ nicht. (me) || mir || Passen + dative: mir. || @tags de.dative-verbs,de.dative
      fill: Die Farbe steht ___ super, Lena! (you, informal) || dir || Stehen (to suit) + dative: dir. || @tags de.dative-verbs,de.dative
      fill: Die Schuhe ___ mir nicht. (gefallen) || gefallen || The verb agrees with die Schuhe (plural): gefallen. || @tags de.dative-verbs
      fill: Wem gehört der Schirm? – Er gehört ___ Kollegin. (meine) || meiner || Gehören + dative; die Kollegin → meiner Kollegin. || @tags de.dative-verbs,de.dative
      mc: How do you say "I like the bag"? || Ich gefalle die Tasche. | *Die Tasche gefällt mir. | Die Tasche gefällt mich. || The thing is the subject; the person is dative (mir). || @tags de.dative-verbs
      rw: Rewrite with gefallen :: Ich finde das Hemd schön. || Das Hemd gefällt mir. | Das Hemd gefällt mir gut. | Mir gefällt das Hemd. || Das Hemd becomes the subject; ich → mir. || @tags de.dative-verbs
      tf: Greta doesn't like the raincoat. || false || She likes it very much — it just doesn't fit. || @ctx dialogue
      short: What colour is the bigger raincoat? || kw: grau/grey/gray || "In L haben wir sie noch, aber nur in Grau." || @ctx dialogue
      listen: @dialogue || What does Greta do in the end? || She gets her money back. | *She exchanges the jacket for a bigger one. | She buys a second jacket. || She tries on the grey jacket in L, it fits, and she exchanges it.
      listen: Der Föhn funktioniert leider nicht. Ich möchte ihn zurückgeben und mein Geld zurückbekommen. || What does the customer want? || To exchange the hairdryer | *A refund | A repair || Mein Geld zurückbekommen = to get my money back. || @tags de.listening
      tr: The trousers don't fit me. || Die Hose passt mir nicht. || Die Hose is singular in German; passen + dative mir. || @tags de.dative-verbs
      dict: Die Farbe gefällt mir, aber die Jacke ist zu eng.
      ask: At customer service, return something: say what you bought and what is wrong with it. || kw: gekauft/zurückgeben/umtauschen & passt/passen/gefällt/gefallen/funktioniert/kaputt/eng/fehler/klein/groß || Guten Tag, ich habe diese Schuhe gestern gekauft, aber sie passen mir nicht. Kann ich sie umtauschen?

  - title: Phone calls and messages
    summary: Make and answer phone calls, take and leave messages, and put two objects in the right order — Ich schicke sie Ihnen.
    minutes: 40
    skills: [listening, speaking, writing]
    tags: [de.dative, de.word-order, de.register]
    objectives:
      - Start, manage and end formal and informal phone calls
      - Take and pass on messages with dative pronouns
      - Put dative and accusative objects in the right order
    intro: |
      Phone calls are hard in a foreign language — no gestures, no faces, and sometimes a bad line. The good news: phone German is full of fixed phrases. In this lesson you learn them and practise passing on messages — *Kann ich **ihm** etwas ausrichten? Ich schicke **sie Ihnen** per E-Mail* — with two objects in the right order.
    vocab: |
      anrufen | to call; to phone | v | Ich rufe dich heute Abend an. | I'll call you this evening. | n: Separable, + accusative: jemanden anrufen. Perfekt: hat angerufen
      zurückrufen | to call back | v | Kann sie mich bitte zurückrufen? | Can she call me back, please? | n: Separable: Ich rufe Sie zurück.
      erreichen | to reach (by phone) | v | Ich kann Herrn Brückner nicht erreichen. | I can't reach Mr Brückner. | n: No ge-: hat erreicht
      die Nachricht | message | n | Kann ich ihm eine Nachricht hinterlassen? | Can I leave him a message? | g: f | pl: die Nachrichten | c: eine Nachricht schreiben; eine Nachricht hinterlassen
      ausrichten | to pass on (a message) | v | Kann ich ihr etwas ausrichten? | Can I give her a message? | n: Separable: Ich richte es ihm aus.
      Bescheid sagen | to let someone know | expr | Sag mir bitte bis Freitag Bescheid. | Please let me know by Friday. | n: + dative: jemandem Bescheid sagen
      die Mailbox | voicemail | n | Ich habe dir auf die Mailbox gesprochen. | I left you a voicemail. | g: f | pl: die Mailboxen | n: Also: der Anrufbeantworter (answering machine).
      besetzt | engaged; busy (phone line) | adj | Die Leitung ist schon wieder besetzt. | The line is busy again.
      verbinden | to connect; to put through | v | Einen Moment, ich verbinde Sie. | One moment, I'll put you through. | n: Irregular: hat verbunden
      am Apparat | speaking (on the phone) | expr | Hallo, Jana Weber am Apparat. | Hello, Jana Weber speaking. | n: Also common: Hier spricht… / Hier ist…
      die Durchwahl | direct line; extension | n | Meine Durchwahl ist die 245. | My extension is 245. | g: f | pl: die Durchwahlen
      Wie bitte? | Sorry? Pardon? | expr | Wie bitte? Die Verbindung ist sehr schlecht. | Sorry? The connection is very bad. | n: Also: Können Sie das bitte wiederholen?
    grammar:
      title: "Two objects: which comes first?"
      body: |
        Many phone phrases have a person in the dative and a thing in the accusative: *Ich schicke **Ihnen** die Unterlagen.* Their order follows a simple rule:

        1. **Two nouns**, or **a dative pronoun + an accusative noun**: the dative comes first — *Ich gebe **dem Kunden** die Nummer. Ich gebe **ihm** die Nummer.*
        2. **Two pronouns**: the accusative comes first — *Ich gebe **sie ihm**.* (sie = die Nummer)
        3. **An accusative pronoun + a dative noun**: the pronoun comes first — *Ich gebe **sie** dem Kunden.*

        In short: pronouns come before nouns, and when two pronouns meet, accusative goes before dative. Remember that **anrufen** and **zurückrufen** take the accusative: *Rufen Sie **mich** bitte zurück.* Useful dative phrases: *Kann ich Ihnen helfen? Kann ich ihr etwas ausrichten? Sagen Sie ihm bitte, dass…*
      table: |
        Objects | Order | Example
        two nouns | dative – accusative | Ich gebe dem Chef die Nachricht.
        dative pronoun + noun | dative – accusative | Ich gebe ihm die Nachricht.
        accusative pronoun + noun | pronoun first | Ich gebe sie dem Chef.
        two pronouns | accusative – dative | Ich gebe sie ihm.
      examples: |
        Kann ich Ihnen meine Nummer geben? | Can I give you my number? | dative pronoun + noun
        Ich schicke Ihnen die Unterlagen heute. | I'll send you the documents today. | dative first
        Die Adresse? Ich schicke sie dir gleich. | The address? I'll send it to you right away. | two pronouns: accusative first
        Sagen Sie ihr bitte, dass ich später komme. | Please tell her I'll be late. | dative + dass-clause
      tip: Pronouns are short and come early; when two pronouns meet, the accusative goes first — es mir, sie ihm, ihn dir.
    dialogue:
      title: Die Heizung ist kaputt
      setting: Niklas Hartwig phones the property management company of his building in Bonn. Frau Keller answers the phone.
      speakers: K=Frau Keller/f; N=Herr Hartwig/m
      lines: |
        K: Hausverwaltung Lindgren, Keller am Apparat. Guten Tag! | Lindgren Property Management, Keller speaking. Hello!
        N: Guten Tag, hier spricht Niklas Hartwig. Ich möchte bitte Herrn Brückner sprechen. | Hello, this is Niklas Hartwig. I'd like to speak to Mr Brückner, please.
        K: Herr Brückner ist leider gerade in einer Besprechung. | I'm afraid Mr Brückner is in a meeting at the moment.
        N: Oh. Kann ich ihm eine Nachricht hinterlassen? | Oh. Can I leave him a message?
        K: Natürlich. Was ist das Problem? | Of course. What's the problem?
        N: In meiner Wohnung ist die Heizung kaputt. Seit gestern ist es eiskalt! | The heating in my flat is broken. It's been freezing since yesterday!
        K: Oje. Wie ist Ihre Adresse? | Oh dear. What's your address?
        N: Rheinweg 14, dritter Stock. Meine Handynummer ist 0157 3366 2190. | Rheinweg 14, third floor. My mobile number is 0157 3366 2190.
        K: Ich richte es ihm aus. Er ruft Sie heute Nachmittag zurück. | I'll pass it on to him. He'll call you back this afternoon.
        N: Danke. Können Sie ihm auch sagen, dass ich ab 15 Uhr zu Hause bin? | Thank you. Can you also tell him that I'm at home from 3 p.m.?
        K: Gern. Ich schicke ihm die Nachricht sofort per E-Mail. | Certainly. I'll send him the message by email right away.
        N: Vielen Dank, Frau Keller. Auf Wiederhören! | Thank you very much, Ms Keller. Goodbye!
    pronunciation:
      title: Question intonation on the phone
      body: |
        On the phone, intonation does the work of gestures. Yes/no questions **rise** at the end: *Kann ich ihm etwas ausrichten? ↗* W-questions usually **fall**: *Wie ist Ihre Nummer? ↘*

        Say your name and numbers slowly and in small groups. And remember: on the phone, people say *Auf Wiederhören* ("until we hear each other again").
      items: |
        Kann ich ihm etwas ausrichten?
        Wie ist Ihre Nummer?
        Wie bitte?
        Ich rufe Sie zurück.
        Einen Moment, ich verbinde Sie.
        Auf Wiederhören!
    culture:
      title: Phone manners
      body: |
        At work, Germans usually answer the phone with the company name and their surname: *Firma Bauer, Klein am Apparat.* Many people also answer private calls with just their surname. Formal calls use Sie, and it's polite to say who you are before you ask for someone.

        Among friends, a short message before calling is common, and voice messages are very popular. Calling a private number late in the evening or early on a Sunday is considered impolite by many people.
    mistakes: |
      Ich rufe Ihnen morgen an. => Ich rufe Sie morgen an. | Anrufen takes the accusative: Sie, not Ihnen.
      Ich schicke ihm sie. => Ich schicke sie ihm. | With two pronouns, the accusative (sie) comes before the dative (ihm).
      Kann ich ihn eine Nachricht hinterlassen? => Kann ich ihm eine Nachricht hinterlassen? | The person who receives the message is dative: ihm.
    task:
      title: Leave a message
      mode: interaction
      body: |
        Role-play a call to a company: the person you want isn't available. Give your name, the reason for your call and your number, and ask for a call back. Then write a short note passing the message on to a colleague.
