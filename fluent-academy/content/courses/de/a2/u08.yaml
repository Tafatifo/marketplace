unit: 8
title: Pläne und Entscheidungen
theme: Plans and choices
description: Talk about your future plans, make arrangements that depend on conditions, and compare options to make a choice — with Futur I, wenn-clauses and superlatives.
objectives:
  - Talk about plans, predictions and promises with Futur I
  - Make arrangements with conditions using wenn-clauses
  - Compare three or more options and make a choice with superlatives
canDo:
  - I can talk about my plans for next year and beyond.
  - I can make an arrangement and say what we will do if plans change.
  - I can compare several options and say which one is best for me.
  - I can explain a decision in a short message.
review: |
  fill: Nächsten Sommer ___ wir nach Norwegen fahren. (werden) || werden || Wir + werden; the infinitive fahren goes to the end. || @tags de.futur
  fill: Wenn ich morgen Zeit ___, helfe ich dir beim Umzug. (haben) || habe || In a wenn-clause the verb goes to the end: wenn ich Zeit habe. || @tags de.subordinate-clauses
  fill: Der Sommer ist bei uns die ___ Jahreszeit. (schön) || schönste || Before a noun: die + schönste. || @tags de.comparatives
  fill: Am ___ fahre ich mit dem Rad. (gern) || liebsten || Gern → lieber → am liebsten. || @tags de.comparatives,de.gern
  mc: Which sentence is correct? || Wenn es schneit, wir bauen einen Schneemann. | *Wenn es schneit, bauen wir einen Schneemann. | Wenn schneit es, bauen wir einen Schneemann. || Verb at the end of the wenn-clause, then the main clause starts with its verb. || @tags de.subordinate-clauses,de.word-order
  mc: Choose the correct form. "Du ___ sicher eine gute Lehrerin." || wirdst | *wirst | werdest || Werden is irregular: du wirst, er wird. || @tags de.futur
  rw: Put into Futur I :: Wir ziehen nach Leipzig um. || Wir werden nach Leipzig umziehen. || Werden in position 2; the separable verb umziehen stays together at the end. || @tags de.futur,de.separable
  tr: If the train is late, I'll call you. (informal) || Wenn der Zug Verspätung hat, rufe ich dich an. | Wenn der Zug zu spät kommt, rufe ich dich an. | Wenn der Zug Verspätung hat, werde ich dich anrufen. | Ich rufe dich an, wenn der Zug Verspätung hat. | Ich rufe dich an, wenn der Zug zu spät kommt. || Verb at the end of the wenn-clause; the present tense is enough for the future. || @tags de.subordinate-clauses
  listen: Wenn es morgen nicht regnet, machen wir ein Picknick am See. Sonst gehen wir ins Museum. || What will they do if it rains? || *Go to the museum | Have a picnic by the lake | Stay at home || Sonst (otherwise) = if it rains, they go to the museum. || @tags de.listening,de.subordinate-clauses
  listen: Von den drei Hotels ist das Hotel am Bahnhof am billigsten, aber das Hotel am Park ist am ruhigsten. || Which hotel is the quietest? || The one at the station | *The one by the park | The one in the old town || Das Hotel am Park ist am ruhigsten. || @tags de.listening,de.comparatives
  ask: Talk about your plans for the next five years. || kw: werde/werden & jahr/jahren/zukunft/später/bald/dann || In fünf Jahren werde ich in Kanada leben. Ich werde dort als Ingenieurin arbeiten.
  write: Write a message to a friend (5–6 sentences): say what you will do next year, compare two or three options you have and arrange to meet with a wenn-clause. || min=40 || req: werde/werden | wenn | am besten/am liebsten/am schönsten/am billigsten/am schnellsten/am wichtigsten || Hallo Mina, nächstes Jahr werde ich in Leipzig studieren! Ich habe drei Wohnungen gesehen. Die WG ist am billigsten, aber die kleine Wohnung gefällt mir am besten. Wenn du am Sonntag Zeit hast, können wir sie zusammen ansehen. Ich lade dich danach zum Kaffee ein! Liebe Grüße, Elena
lessons:
  - title: Future plans
    summary: Talk about plans, predictions and promises with Futur I — werden + infinitive — and with the present tense plus a time expression.
    minutes: 35
    skills: [grammar, speaking, listening]
    tags: [de.futur]
    objectives:
      - Form Futur I with werden and the infinitive at the end
      - Choose between the present tense and Futur I for the future
      - Talk about your plans for next year and beyond
    intro: |
      "Was machst du nach dem Kurs?" — "Ich werde in Wien studieren." To talk about the future, German often simply uses the present tense with a time word. For plans further ahead, predictions and promises you also need **Futur I**: **werden** + infinitive. In this lesson you learn both and talk about your own plans.
    vocab: |
      die Zukunft | future | n | In Zukunft möchte ich mehr reisen. | In future I'd like to travel more. | g: f | pl: (no plural) | c: in Zukunft; in der Zukunft
      der Plan | plan | n | Hast du schon Pläne für den Sommer? | Have you got any plans for the summer yet? | g: m | pl: die Pläne | c: Pläne machen
      werden | will (future); to become | v | Ich werde nächstes Jahr in Wien studieren. | I'll study in Vienna next year. | n: du wirst, er wird. As a full verb it means to become: Sie wird Ärztin.
      vorhaben | to plan; to intend | v | Was hast du am Wochenende vor? | What are you planning to do at the weekend? | n: Separable: ich habe … vor. Perfekt: hat vorgehabt
      nächstes Jahr | next year | expr | Nächstes Jahr werden wir heiraten. | We're going to get married next year. | c: nächste Woche; nächsten Monat; in zwei Jahren
      bald | soon | adv | Ich werde dich bald besuchen. | I'll visit you soon.
      später | later | adv | Später möchte ich ein eigenes Café haben. | Later I'd like to have my own café.
      der Traum | dream | n | Mein Traum ist eine Reise um die Welt. | My dream is a trip around the world. | g: m | pl: die Träume
      versprechen | to promise | v | Ich verspreche dir, ich werde pünktlich sein. | I promise you I'll be on time. | n: Irregular: du versprichst; hat versprochen
      wahrscheinlich | probably | adv | Morgen wird es wahrscheinlich regnen. | It will probably rain tomorrow.
      sicher | certainly; surely | adv | Du wirst die Prüfung sicher bestehen. | You'll certainly pass the exam. | c: ganz sicher; ich bin sicher
      umziehen | to move (house) | v | Im Herbst ziehen wir nach Graz um. | In the autumn we're moving to Graz. | n: Separable; Perfekt: ist umgezogen
    grammar:
      title: "Futur I: werden + infinitive"
      body: |
        **Futur I** is formed with **werden** in position 2 and the **infinitive** at the end: *Ich **werde** nächstes Jahr in Wien **studieren**.* Werden is irregular: *du wirst, er/sie/es wird*. Separable verbs stay together at the end: *Wir werden im Mai umziehen.*

        In everyday German, the **present tense + a time expression** is the most common way to talk about the future, especially for fixed plans: *Morgen fahre ich nach Hause. Im Herbst ziehen wir um.* Use Futur I:

        - for **plans and intentions**, especially further ahead: *Nach dem Studium werde ich ein Jahr reisen.*
        - for **predictions**, often with *wahrscheinlich, sicher, bestimmt*: *Es wird morgen regnen.*
        - for **promises**: *Ich werde dich jeden Tag anrufen.*

        Don't confuse it with **werden** as a full verb, which means *to become*: *Sie wird Ärztin* (she's going to be a doctor).
      table: |
        Pronoun | werden | Example
        ich | werde | Ich werde viel reisen.
        du | wirst | Wirst du mich besuchen?
        er / sie / es | wird | Es wird bald regnen.
        wir | werden | Wir werden im Mai umziehen.
        ihr | werdet | Ihr werdet die Stadt lieben.
        sie / Sie | werden | Sie werden sicher Erfolg haben.
      examples: |
        Nach dem Abitur werde ich ein Jahr in Neuseeland arbeiten. | After the Abitur I'm going to work in New Zealand for a year. | plan
        Morgen wird es wahrscheinlich schneien. | It will probably snow tomorrow. | prediction
        Ich verspreche dir, ich werde nicht zu spät kommen. | I promise I won't be late. | promise
        Am Samstag besuche ich meine Eltern. | I'm visiting my parents on Saturday. | fixed plan: present tense
      tip: For tomorrow's fixed plans, the present tense is enough. Use werden for dreams, predictions and promises.
    dialogue:
      title: Was kommt nach der Schule?
      setting: A school playground in Gießen, two months before the Abitur exams. Zehra and Malte talk about their plans.
      speakers: Z=Zehra/f; M=Malte/m
      lines: |
        M: Zehra, in zwei Monaten haben wir Abitur. Was hast du danach vor? | Zehra, in two months we'll have our Abitur. What are you planning to do afterwards?
        Z: Ich werde zuerst ein Jahr als Au-pair in Kanada arbeiten. | First I'm going to work as an au pair in Canada for a year.
        M: Wow! Und danach? Wirst du studieren? | Wow! And after that? Will you go to university?
        Z: Ja, wahrscheinlich Medizin. Ich möchte Kinderärztin werden. | Yes, probably medicine. I'd like to become a paediatrician.
        M: Das passt zu dir! Du wirst sicher eine super Ärztin. | That suits you! You'll definitely be a great doctor.
        Z: Danke! Und du? Hast du schon Pläne? | Thanks! And you? Have you got any plans yet?
        M: Ich mache eine Ausbildung als Tischler. Im August fange ich an. | I'm doing an apprenticeship as a carpenter. I start in August.
        Z: Toll! Wirst du hier in Gießen bleiben? | Great! Will you stay here in Gießen?
        M: Nein, ich ziehe nach Freiburg um. Mein Onkel hat dort eine Werkstatt. | No, I'm moving to Freiburg. My uncle has a workshop there.
        Z: Oh, dann sehen wir uns nicht mehr so oft. | Oh, then we won't see each other so often any more.
        M: Doch! Ich werde dich in Kanada besuchen, versprochen! | Yes, we will! I'll visit you in Canada, I promise!
        Z: Super, ich nehme dich beim Wort! | Great, I'll hold you to that!
    pronunciation:
      title: "w, r and the final d in werden"
      body: |
        **w** is always [v]: *werden, wahrscheinlich, Wien*. After the vowel, the **r** in *werde, wirst, wird* is very soft, almost like a short *a*: [ˈveːɐdə], [vɪɐst].

        In *wird* the final **d** sounds like [t]: [vɪɐt] — exactly like *wirt*. Practise the three forms, then the full sentence.
      items: |
        ich werde
        du wirst
        es wird
        wahrscheinlich
        die Zukunft
        Ich werde dich besuchen.
    culture:
      title: A year off and good resolutions
      body: |
        Many young Germans take a year off after the Abitur before they start training or university: they work as au pairs abroad, travel, or do a voluntary year in a hospital, a school or an environmental project (*Freiwilliges Soziales Jahr*).

        At New Year, many people make *gute Vorsätze* (good resolutions): *Ich werde mehr Sport machen. Ich werde weniger Zeit am Handy verbringen.* Whether they keep them is another question!
    mistakes: |
      Ich werde nächstes Jahr studiere in Wien. => Ich werde nächstes Jahr in Wien studieren. | With werden, the infinitive goes to the very end.
      Er werdet Lehrer. => Er wird Lehrer. | Werden is irregular: er wird.
      Morgen es wird regnen. => Morgen wird es regnen. | The verb (wird) stays in position 2, so the subject follows it.
    task:
      title: My plans
      mode: speaking
      body: |
        Talk about your future for about a minute: one fixed plan for next month (present tense), two plans for next year with werden, one prediction with wahrscheinlich, and your big dream. Record yourself in Speaking practice.
    exercises: |
      fill: Nächstes Jahr ___ ich in Wien studieren. || werde || Ich + werden = ich werde; studieren goes to the end. || @tags de.futur
      fill: ___ du mich in Kanada besuchen? || Wirst || Du + werden = du wirst (irregular). || @tags de.futur,de.questions
      fill: Morgen ___ es wahrscheinlich schneien. || wird || Es + werden = es wird. || @tags de.futur
      fill: Wir werden im Mai nach Graz ___. (umziehen) || umziehen || The infinitive stays together at the end: umziehen. || @tags de.futur,de.separable
      mc: Which sentence is correct? || Ich werde arbeiten nächstes Jahr in Berlin. | *Ich werde nächstes Jahr in Berlin arbeiten. | Ich werde nächstes Jahr in Berlin arbeite. || Werden in position 2, the infinitive (arbeiten) at the very end. || @tags de.futur,de.word-order
      rw: Put into Futur I :: Ich besuche dich bald. || Ich werde dich bald besuchen. || Werde in position 2, besuchen at the end. || @tags de.futur
      tf: Malte is going to study medicine. || false || Zehra wants to study medicine; Malte is doing an apprenticeship as a carpenter. || @ctx dialogue
      short: Where is Malte moving to? || kw: freiburg || "Ich ziehe nach Freiburg um." || @ctx dialogue
      listen: @dialogue || What does Malte promise? || To write to Zehra every week | *To visit Zehra in Canada | To study medicine too || "Ich werde dich in Kanada besuchen, versprochen!"
      listen: In zehn Jahren werde ich wahrscheinlich in Spanien leben und eine kleine Sprachschule haben. || What does the speaker imagine in ten years? || *Living in Spain and running a language school | Studying Spanish at university | Spending holidays in Spain || In Spanien leben und eine kleine Sprachschule haben. || @tags de.listening,de.futur
      tr: I'll call you tomorrow, I promise. (informal) || Ich werde dich morgen anrufen, versprochen. | Ich rufe dich morgen an, versprochen. | Ich verspreche dir, ich werde dich morgen anrufen. | Ich verspreche dir, ich rufe dich morgen an. | Ich werde dich morgen anrufen, ich verspreche es. || A promise: werden + anrufen at the end (or the present tense). || @tags de.futur
      dict: Im Herbst werden wir nach Graz umziehen.
      ask: A friend asks "Was hast du nächstes Jahr vor?" Answer with two plans. || kw: werde/werden & nächstes jahr/im sommer/im herbst/im frühling/später/bald/dann || Nächstes Jahr werde ich einen Deutschkurs in Berlin machen. Im Sommer werde ich mit meiner Schwester nach Portugal fahren.

  - title: Making arrangements
    summary: Make arrangements that depend on conditions — Wenn es regnet, gehen wir ins Kino — with wenn-clauses and the verb at the end.
    minutes: 35
    skills: [grammar, speaking, listening]
    tags: [de.subordinate-clauses, de.word-order]
    objectives:
      - Form wenn-clauses with the verb at the end
      - Start a sentence with a wenn-clause and put the main-clause verb first
      - Make, confirm and change arrangements
    intro: |
      Plans often depend on something: the weather, work, the train. German uses **wenn** for real conditions and for "when(ever)": *Wenn du Zeit hast, treffen wir uns um sechs.* Like weil and dass, wenn sends the verb to the end — and when the wenn-clause comes first, the main clause starts with its verb.
    vocab: |
      sich verabreden | to arrange to meet | v | Wir haben uns für Freitag verabredet. | We've arranged to meet on Friday. | n: Perfekt: haben uns verabredet. Die Verabredung = the arrangement, the date.
      klappen | to work out | v | Klappt es bei dir am Freitag? | Does Friday work for you? | n: Very common in speech: Das klappt! = That works!
      passen | to suit (a time or plan) | v | Passt dir 18 Uhr? | Does 6 p.m. suit you? | n: + dative: Das passt mir gut.
      verschieben | to postpone; to move | v | Können wir das Treffen auf Montag verschieben? | Can we move the meeting to Monday? | n: Irregular: hat verschoben
      spontan | spontaneous; on the spur of the moment | adj | Wir fahren spontan an den See. | We're going to the lake on the spur of the moment.
      der Treffpunkt | meeting point | n | Unser Treffpunkt ist der Eingang vom Museum. | Our meeting point is the entrance of the museum. | g: m | pl: die Treffpunkte
      pünktlich | on time; punctual | adj | Bitte sei pünktlich, der Film beginnt um acht! | Please be on time, the film starts at eight!
      sich verspäten | to be late | v | Ich verspäte mich zehn Minuten, sorry! | I'm running ten minutes late, sorry! | n: Also: Ich komme zu spät.
      wenn | if; when(ever) | conj | Wenn es regnet, gehen wir ins Kino. | If it rains, we'll go to the cinema. | n: The verb goes to the end of the wenn-clause.
      falls | in case; if | conj | Falls du nicht kommen kannst, schreib mir. | In case you can't come, text me. | n: Like wenn, but only for conditions.
      stattdessen | instead | adv | Das Museum ist zu, wir gehen stattdessen in den Park. | The museum is closed; we're going to the park instead.
      der Vorschlag | suggestion | n | Ich habe einen Vorschlag: Wir treffen uns am Markt. | I have a suggestion: let's meet at the market. | g: m | pl: die Vorschläge | c: einen Vorschlag machen
    grammar:
      title: "wenn-clauses: conditions and arrangements"
      body: |
        **Wenn** introduces a condition (*if*) or a repeated or future time (*when, whenever*): *Wenn es regnet, bleiben wir zu Hause. Wenn ich in Berlin bin, besuche ich dich.* Like *weil* and *dass*, it sends the **conjugated verb to the end** of its clause.

        The wenn-clause often comes **first**. Then the whole clause counts as position 1, so the main clause **starts with its verb**: *Wenn du Zeit hast, **gehen** wir ins Kino.* This "verb, comma, verb" pattern is typical German. If the main clause comes first, it keeps its normal order: *Wir gehen ins Kino, wenn du Zeit hast.*

        For real conditions about the future, the **present tense** is enough in both parts: *Wenn der Zug pünktlich ist, bin ich um acht da.* **Falls** works like wenn, but only for conditions: *Falls es regnet, nehmen wir den Bus.*
      table: |
        wenn-clause (verb at the end) | Main clause (verb first)
        Wenn es regnet, | gehen wir ins Museum.
        Wenn du Zeit hast, | treffen wir uns um sechs.
        Wenn der Zug Verspätung hat, | rufe ich dich an.
        Wenn ich früher fertig bin, | komme ich vorbei.
        Wenn das Wetter schön ist, | fahren wir an den See.
      examples: |
        Wenn es dir passt, treffen wir uns um sieben am Treffpunkt. | If it suits you, we'll meet at seven at the meeting point. | wenn-clause first, then the verb
        Ich rufe dich an, wenn ich angekommen bin. | I'll call you when I've arrived. | Perfekt in the wenn-clause: bin at the end
        Wenn du willst, können wir das Treffen verschieben. | If you like, we can postpone the meeting. | modal at the end: willst
        Falls ich mich verspäte, schreibe ich dir. | In case I'm late, I'll text you. | falls = in case
      tip: Remember "verb, comma, verb" — Wenn du Zeit hast, gehen wir…
    dialogue:
      title: "Samstag? Mal sehen!"
      setting: Friday evening in Hildesheim. Katharina phones her friend Sami to make plans for Saturday — with a plan B for bad weather.
      speakers: K=Katharina/f; S=Sami/m
      lines: |
        K: Hallo Sami! Hast du morgen schon was vor? | Hi Sami! Have you got any plans for tomorrow yet?
        S: Noch nicht. Was schlägst du vor? | Not yet. What do you suggest?
        K: Wenn das Wetter schön ist, könnten wir eine Radtour machen. | If the weather's nice, we could go for a bike ride.
        S: Gute Idee! Und wenn es regnet? Der Wetterbericht ist nicht so gut. | Good idea! And if it rains? The weather forecast isn't great.
        K: Wenn es regnet, gehen wir stattdessen ins Kino. | If it rains, we'll go to the cinema instead.
        S: Okay. Passt dir elf Uhr? Ich muss vorher noch einkaufen. | Okay. Does eleven suit you? I have to do some shopping first.
        K: Elf klappt. Wo treffen wir uns? | Eleven works. Where shall we meet?
        S: Wenn wir Rad fahren, treffen wir uns am Brunnen am Markt. | If we go cycling, we'll meet at the fountain on the market square.
        K: Und wenn wir ins Kino gehen? | And if we go to the cinema?
        S: Dann direkt am Kino, um zwei. Der Film beginnt um Viertel nach zwei. | Then right at the cinema, at two. The film starts at quarter past two.
        K: Super. Falls ich mich verspäte, schreibe ich dir. | Great. In case I'm late, I'll text you.
        S: Du und pünktlich? Ich warte lieber gleich mit einem Kaffee! | You, on time? I'd better wait with a coffee right away!
    pronunciation:
      title: "Verb, comma, verb: rhythm in wenn-sentences"
      body: |
        In a sentence that starts with wenn, make a short pause at the comma — your voice rises slightly before it — and then start the main clause with the verb: *Wenn es regnet ↗ | gehen wir ins Kino ↘.*

        The two verbs meet at the comma (*regnet, gehen*). Saying them clearly helps the listener follow the condition and the result.
      items: |
        Wenn es regnet, gehen wir ins Kino.
        Wenn du Zeit hast, treffen wir uns.
        Passt dir elf Uhr?
        Das klappt!
        der Treffpunkt
        Ich verspäte mich.
    culture:
      title: Punctuality and planning
      body: |
        Many Germans plan social meetings in advance and expect people to be on time. If you are going to be late, even by ten minutes, send a short message: *Ich verspäte mich zehn Minuten, sorry!* Among young people, spontaneous plans are more common, but a quick message to confirm is still normal.

        At universities you may see *c.t.* (cum tempore) next to lecture times: it means the lecture starts a quarter of an hour later — the so-called *akademisches Viertel*.
    mistakes: |
      Wenn ich habe Zeit, komme ich. => Wenn ich Zeit habe, komme ich. | In a wenn-clause the conjugated verb goes to the end.
      Wenn es regnet, wir gehen ins Kino. => Wenn es regnet, gehen wir ins Kino. | After a wenn-clause, the main clause starts with its verb.
      Ruf mich an, wenn du willst kommen. => Ruf mich an, wenn du kommen willst. | The modal verb goes to the very end of the wenn-clause.
    task:
      title: Plan A, plan B
      mode: interaction
      body: |
        Arrange to meet a friend at the weekend: suggest an activity, agree on a time and a meeting point, and agree on a plan B with wenn in case of rain or a problem. Practise with the AI coach in the "Making weekend plans" scenario.
    exercises: |
      fill: Wenn du Lust ___, gehen wir heute Abend essen. (haben) || hast || In the wenn-clause the verb goes to the end: wenn du Lust hast. || @tags de.subordinate-clauses
      fill: Wenn der Zug pünktlich ist, ___ ich um acht da. (sein) || bin || After the wenn-clause, the main clause starts with its verb: bin ich. || @tags de.subordinate-clauses,de.word-order
      fill: Ich rufe dich an, wenn ich in Berlin ___ ___. (ankommen, Perfekt) || angekommen ; bin || Perfekt at the end of the wenn-clause: participle, then sein. || @tags de.subordinate-clauses,de.perfekt-sein
      mc: Which sentence is correct? || Wenn ich habe Zeit, ich komme. | Wenn ich Zeit habe, ich komme. | *Wenn ich Zeit habe, komme ich. || Verb at the end of the wenn-clause, then verb first in the main clause. || @tags de.subordinate-clauses,de.word-order
      rw: Join with wenn, starting with the wenn-clause :: Das Wetter ist schön. Wir grillen im Park. || Wenn das Wetter schön ist, grillen wir im Park. || Wenn + verb at the end, comma, then the main-clause verb. || @tags de.subordinate-clauses,de.word-order
      order: Wenn du Zeit hast, treffen wir uns um sechs. || If you have time, we'll meet at six. || Wenn-clause first, then the main clause starts with treffen. || @tags de.subordinate-clauses,de.word-order @alt Wir treffen uns um sechs, wenn du Zeit hast. | Um sechs treffen wir uns, wenn du Zeit hast.
      tf: If it rains, Katharina and Sami will go cycling anyway. || false || "Wenn es regnet, gehen wir stattdessen ins Kino." || @ctx dialogue
      short: Where will they meet if they go cycling? || kw: brunnen/fountain/markt/market || "Am Brunnen am Markt." || @ctx dialogue
      listen: @dialogue || What will Katharina do if she's late? || Call Sami | *Send Sami a message | Take a taxi || "Falls ich mich verspäte, schreibe ich dir."
      listen: Wenn ich heute früher Feierabend habe, komme ich noch zum Training. Sonst sehen wir uns am Donnerstag. || When will the speaker come to training? || *Today, if she finishes work early | Every Thursday and Saturday | Only next week || Wenn ich heute früher Feierabend habe = if I finish work early today. || @tags de.listening,de.subordinate-clauses
      tr: If it rains, we'll stay at home. || Wenn es regnet, bleiben wir zu Hause. | Wenn es regnet, bleiben wir daheim. | Wir bleiben zu Hause, wenn es regnet. | Wenn es regnet, werden wir zu Hause bleiben. || Verb, comma, verb: regnet, bleiben. || @tags de.subordinate-clauses
      dict: Falls ich mich verspäte, schreibe ich dir.
      ask: Arrange to meet a friend on Saturday — suggest a plan and a plan B with wenn. || kw: wenn & treffen/gehen/fahren/machen/kommen/bleiben || Wenn das Wetter schön ist, gehen wir schwimmen. Wenn es regnet, treffen wir uns im Café.

  - title: Comparing options
    summary: Compare three or more options — courses, hotels, ways to travel — with superlatives like am billigsten and am besten, and explain your choice.
    minutes: 40
    skills: [grammar, writing, speaking]
    tags: [de.comparatives]
    objectives:
      - Form superlatives with am …sten, including irregular forms such as am besten and am liebsten
      - Use der/die/das …ste before a noun in simple sentences
      - Compare options and explain a decision
    intro: |
      Which language course is the cheapest? Which train is the fastest? Which flat is best for us? When you compare three or more things, you need the **superlative**: *am billigsten, am schnellsten, am besten*. In this lesson you compare options, weigh them up and explain your choice — the final step of A2.
    vocab: |
      die Möglichkeit | possibility; option | n | Wir haben drei Möglichkeiten. | We have three options. | g: f | pl: die Möglichkeiten
      die Entscheidung | decision | n | Die Entscheidung ist nicht leicht. | The decision isn't easy. | g: f | pl: die Entscheidungen | c: eine Entscheidung treffen
      sich entscheiden | to decide | v | Ich kann mich nicht entscheiden. | I can't decide. | n: Irregular: hat sich entschieden. With a choice: sich für + accusative entscheiden.
      der Vorteil | advantage | n | Ein Vorteil vom Onlinekurs ist die freie Zeiteinteilung. | One advantage of the online course is that you can plan your own time. | g: m | pl: die Vorteile
      der Nachteil | disadvantage | n | Ein Nachteil ist der lange Weg. | One disadvantage is the long journey. | g: m | pl: die Nachteile
      der Intensivkurs | intensive course | n | Der Intensivkurs hat zwanzig Stunden pro Woche. | The intensive course has twenty hours a week. | g: m | pl: die Intensivkurse
      flexibel | flexible | adj | Meine Arbeitszeiten sind sehr flexibel. | My working hours are very flexible. | n: Comparative flexibler; superlative am flexibelsten.
      dauern | to last; to take (time) | v | Mit dem Bus dauert es sieben Stunden. | By bus it takes seven hours. | n: Perfekt: hat gedauert
      am besten | best | expr | Am besten nehmen wir den Zug. | It's best if we take the train. | n: Superlative of gut. Also for advice: Am besten fragst du…
      am liebsten | most of all (preference) | expr | Am liebsten lerne ich abends. | I like studying in the evening best. | n: Superlative of gern.
      am meisten | (the) most | expr | Wer spricht in der Gruppe am meisten? | Who talks the most in the group? | n: Superlative of viel.
      überlegen | to think about; to consider | v | Ich muss noch überlegen. | I still need to think about it. | n: Inseparable: hat überlegt
    grammar:
      title: "Superlatives: am schnellsten, der beste"
      body: |
        To compare three or more things, use the **superlative**. After a verb (usually *sein*), use **am + adjective + -sten**: *Der Zug ist **am schnellsten**. Der Abendkurs ist **am billigsten**.*

        The same changes as in the comparative apply: many short adjectives take an umlaut (*alt → am ältesten, warm → am wärmsten*), and adjectives ending in **-d, -t, -s, -z** add **-esten** so you can pronounce them: *am ältesten, am kürzesten*. Note the exception *groß → am größten*. Irregular forms: *gut → am besten, gern → am liebsten, viel → am meisten, hoch → am höchsten, nah → am nächsten*.

        Before a noun, use **der/die/das + …ste**: *der schnellste Zug, die beste Idee, das billigste Hotel*. In these nominative phrases the ending is just **-e**; you will learn all adjective endings at B1. Remember: two options → comparative (*besser als*); three or more → superlative.
      table: |
        Adjective | Comparative | Superlative
        billig | billiger | am billigsten
        schnell | schneller | am schnellsten
        groß | größer | am größten
        alt | älter | am ältesten
        gut | besser | am besten
        gern | lieber | am liebsten
        viel | mehr | am meisten
      examples: |
        Der Onlinekurs ist am flexibelsten. | The online course is the most flexible. | am …sten
        Am liebsten fahre ich mit dem Rad zur Arbeit. | Most of all I like cycling to work. | gern → am liebsten
        Das ist die beste Idee! | That's the best idea! | before a noun: die beste
        Der Intensivkurs kostet am meisten, aber man lernt am schnellsten. | The intensive course costs the most, but you learn the fastest. | viel → am meisten
      tip: Count the options — with two, use the comparative (besser als); with three or more, use the superlative (am besten).
    dialogue:
      title: Welcher Kurs ist der beste?
      setting: Valentina lives in Erlangen and needs a German course before she starts a new job. At home she asks her flatmate Lasse for help.
      speakers: V=Valentina/f; L=Lasse/m
      lines: |
        V: Lasse, hilf mir bitte! Ich kann mich nicht entscheiden. | Lasse, help me, please! I can't decide.
        L: Klar. Was ist denn los? | Sure. What's the matter?
        V: Ich brauche einen Deutschkurs, und es gibt drei Möglichkeiten. | I need a German course, and there are three options.
        V: Der Intensivkurs ist am schnellsten, aber er kostet am meisten. | The intensive course is the fastest, but it costs the most.
        L: Und was sind die anderen zwei Möglichkeiten? | And what are the other two options?
        V: Der Abendkurs ist am billigsten. Und der Onlinekurs ist am flexibelsten. | The evening course is the cheapest. And the online course is the most flexible.
        L: Was ist für dich am wichtigsten? Zeit oder Geld? | What's most important for you? Time or money?
        V: Am wichtigsten ist die Zeit. Ich fange im März eine neue Stelle an. | Time is most important. I'm starting a new job in March.
        L: Dann ist der Intensivkurs doch die beste Möglichkeit, oder? | Then the intensive course is the best option, isn't it?
        V: Ja, aber vormittags arbeite ich noch im Café. | Yes, but I still work at the café in the mornings.
        L: Und wenn du den Onlinekurs am Abend machst? | And what if you do the online course in the evenings?
        V: Stimmt, das ist am praktischsten! Danke, du bist der Beste! | True, that's the most practical! Thanks, you're the best!
    pronunciation:
      title: "-sten and -esten"
      body: |
        In the superlative ending, **st** is pronounced [st], as in English *best* — not [ʃt] as at the start of *Stelle*: *am besten, am billigsten*. Say the cluster cleanly and keep the final -en short: [ˈbɛstn̩].

        After -t, -d, -s and -z an extra e makes the word easier to say: *am kürzesten, am ältesten*. But *am größten* has no extra e.
      items: |
        am besten
        am schnellsten
        am billigsten
        am kürzesten
        am größten
        Das ist die beste Idee.
    culture:
      title: Choosing a German course
      body: |
        Adult learners in Germany have many options: adult education centres (*Volkshochschulen*) offer affordable evening and weekend courses, private language schools run intensive courses, and many people learn online. Newcomers can often join a state-funded integration course (*Integrationskurs*), which ends with a test at A2 or B1 level.

        Whatever you choose, regular practice counts most: a weekly language café, a tandem partner or German series with subtitles help you keep going after this course.
    mistakes: |
      Der Zug ist am schnellste. => Der Zug ist am schnellsten. | After am, the superlative ends in -sten.
      Das ist die am beste Idee. => Das ist die beste Idee. | Before a noun, use der/die/das + …ste, without am.
      Ich trinke am gernsten Tee. => Ich trinke am liebsten Tee. | The superlative of gern is irregular: am liebsten.
    task:
      title: Make a decision
      mode: writing
      body: |
        Compare three options — for example three ways to travel, three courses or three flats. Write one advantage and one disadvantage for each, using superlatives, and then write a short message to a friend explaining your choice with weil.
