      fill: Am ___ trinke ich Tee mit Honig. (gern) || liebsten || Gern → am liebsten (irregular). || @tags de.comparatives,de.gern
      fill: Das ist die ___ Idee! (gut) || beste || Before a noun: die + beste. || @tags de.comparatives
      mc: Which sentence is correct? || Mit dem Rad ist es am schnellste. | *Mit dem Rad ist es am schnellsten. | Mit dem Rad ist es der schnellsten. || After am, the ending is -sten. || @tags de.comparatives
      rw: Use the superlative :: Der Onlinekurs ist flexibler als die anderen Kurse. || Der Onlinekurs ist am flexibelsten. || Flexibel → am flexibelsten. || @tags de.comparatives
