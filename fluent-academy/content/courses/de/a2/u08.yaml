      dict: Am wichtigsten ist für mich die Zeit.
      ask: Compare three ways to get to work or school, and say which is best for you. || kw: am & besten/schnellsten/billigsten/liebsten/bequemsten/praktischsten/einfachsten/teuersten/langsamsten || Mit dem Auto ist es am schnellsten, aber mit dem Rad ist es am billigsten. Am liebsten fahre ich mit dem Rad.
      write: Compare three options (courses, hotels or ways to travel) and explain your choice to a friend in 5–6 sentences. || min=40 || req: am | weil | als/besser/billiger/schneller/teurer || Hallo Dario, ich fahre im Mai nach Wien und habe drei Möglichkeiten. Das Flugzeug ist am schnellsten, aber auch am teuersten. Der Bus ist am billigsten, aber die Fahrt dauert elf Stunden. Ich nehme den Nachtzug, weil er bequemer als der Bus ist und ich im Zug schlafen kann. Am besten finde ich: Ich komme morgens ganz entspannt an! Liebe Grüße, Ines
