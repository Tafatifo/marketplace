language: de
level: B1
title: "German B1 · Independence"
description: Become an independent user of German — describe people and tell stories, handle interviews, formal emails and meetings, talk about school and learning, follow the news and solve tech problems, discuss city life and the environment, wellbeing, food and sport, review films and books, and imagine what you would do if things were different.
hours: 100
summary: >-
  B1 learners can understand the main points of clear standard speech and writing on familiar matters, deal with most
  situations while travelling or living in a German-speaking country, produce simple connected text on topics of
  personal interest, and describe experiences, events, hopes and plans with brief reasons and explanations. This
  course builds on A1 and A2 with the big steps of the intermediate level — the Präteritum for stories, relative
  clauses, Konjunktiv II, infinitives with zu, the Plusquamperfekt, indirect questions, obwohl, adjective endings,
  verbs with prepositions and da-/wo-compounds — and delivers around 100 hours of guided practice across 8 units,
  set in places from Kiel to Konstanz.
objectives:
  - Describe people's personality with relative clauses and tell an anecdote in the Präteritum
  - Take part in a job interview, write formal emails and explain career decisions with deshalb and trotzdem
  - Talk about school and learning, and give advice with sollte, zu-infinitives and um … zu
  - Report what had happened with the Plusquamperfekt and ask for help politely with indirect questions
  - Compare city and country life, describe green habits with obwohl, and propose solutions using correct adjective endings
  - Talk about stress, food and sport with reflexive and prepositional verbs and da-/wo-compounds
  - Review a film, a series or a book, recommend it and retell a story with relative clauses in all cases
  - Talk about responsible travel, customs and stereotypes, and imagine situations with wenn + Konjunktiv II
canDo:
  listening:
    - Understand the main points of clear standard speech on familiar topics such as work, school, free time and travel
    - Follow radio interviews, podcasts and phone calls on everyday and personal topics when people speak relatively slowly and clearly
  reading:
    - Understand texts that consist mainly of high-frequency everyday or job-related language, such as blogs, formal emails and short reports
    - Understand the description of events, feelings and wishes in personal texts and reviews well enough to answer questions about them
  spokenInteraction:
    - Deal with most situations likely to arise while travelling, at work or when something goes wrong, for example with a technical problem
    - Enter unprepared into conversations on familiar topics, give and ask for advice, agree and disagree politely
  spokenProduction:
    - Narrate a story or an anecdote, describe a film or a book and give your reactions
    - Briefly give reasons and explanations for opinions and plans, and describe hypothetical situations
  writing:
    - Write simple connected texts on familiar topics, such as a review, a blog post or a short opinion text
    - Write formal emails and personal letters describing experiences and impressions, with appropriate greetings and closings
grammar:
  - Präteritum of regular, irregular and mixed verbs for written narration; Präteritum of the modal verbs
  - Relative clauses with relative pronouns in the nominative, accusative and dative, with prepositions, and with was and wo
  - Konjunktiv II — würde + infinitive and wäre, hätte, könnte, müsste, dürfte, wüsste, käme, ginge — for wishes, careful statements, advice and hypotheses
  - Formal register in emails and meetings (Sie, Ihnen, fixed phrases)
  - Connectors deshalb, deswegen, trotzdem, denn and obwohl
  - Infinitive clauses with zu after verbs, adjectives and nouns; um … zu
  - Giving advice with sollte and an deiner Stelle würde ich …
  - Plusquamperfekt; nachdem, bevor and als for the sequence of events
  - Indirect questions with ob and question words
  - Adjective endings after the definite article and dieser, jeder, welcher
  - Reflexive and non-reflexive verbs with prepositions; wo-compounds and da-compounds, including da-compounds before dass- and zu-clauses
  - Unreal conditions (wenn ich Zeit hätte, würde ich …) and unreal wishes (ich wünschte …, wenn … nur)
vocabularyDomains:
  - Personality, friendship, conflict and making up
  - Job interviews, emails, meetings and career changes
  - Schools, exams, ways of learning and study problems
  - News, social media, smartphones and computers
  - City and country life, the environment, recycling and neighbourhoods
  - Stress, relaxation, eating habits, sport and fitness
  - Films, series, books, music and stories
  - Travel, tourism, customs, politeness and stereotypes
assessment: A 60-minute cumulative test covering vocabulary, grammar, listening and reading tasks from all eight units, with a short writing task. A score of 70% or more confirms the B1 level.
units:
  - title: Menschen und Beziehungen
    theme: People and relationships
    lessons: [Personality and character, Friendship and disagreements, Telling an anecdote]
  - title: Arbeit und Karriere
    theme: Work and careers
    lessons: [The job interview, Emails and meetings, Changing careers]
  - title: Bildung und Lernen
    theme: Education and learning
    lessons: [School memories and systems, How we learn languages, Giving advice]
  - title: Medien und Technik
    theme: Media and technology
    lessons: [News and how we follow it, Digital life, Solving a tech problem]
  - title: Stadt und Umwelt
    theme: City and environment
    lessons: ["City or countryside?", Green habits, Proposing solutions]
  - title: Gesundheit und Lebensstil
    theme: Health and lifestyle
    lessons: [Stress and wellbeing, Food culture, Sport and fitness]
  - title: Kultur und Unterhaltung
    theme: Culture and entertainment
    lessons: [Reviewing a film or series, Books and music, Recommending and retelling a story]
  - title: Gesellschaft und Reisen
    theme: Society and travel
    lessons: [Travelling responsibly, "What would you do if…?", Customs and stereotypes]
assessmentItems: |
  fill: Das ist die Kollegin, ___ mir beim Umzug geholfen hat. || die || Die Kollegin is feminine and the subject of the relative clause, so the relative pronoun is die (nominative); the verb hat goes to the end. || @tags de.relative-clauses @obj Describe people's personality with relative clauses and tell an anecdote in the Präteritum
  fill: Als ich zehn war, ___ wir jeden Sommer an die Ostsee. (fahren) || fuhren || Fahren is irregular: wir fuhren. In written stories German uses the Präteritum. || @tags de.praeteritum
  mc: In an interview you want to say "I would like to take on more responsibility." || Ich werde gern mehr Verantwortung übernehmen. | *Ich würde gern mehr Verantwortung übernehmen. | Ich wurde gern mehr Verantwortung übernehmen. || Würde (with umlaut) + infinitive expresses a wish. Werde is the future; wurde is the past of werden. || @tags de.konjunktiv2 @obj Take part in a job interview, write formal emails and explain career decisions with deshalb and trotzdem
  mc: "Die Stelle ist schlecht bezahlt. ___ nehme ich sie, denn das Team ist toll." || Deshalb | *Trotzdem | Weil || Trotzdem introduces a contrast (in spite of that). Deshalb would mean "for that reason", which makes no sense here; weil would send the verb to the end. || @tags de.connectors
  tr: Could you please send me the documents by Friday? (formal) || Könnten Sie mir bitte die Unterlagen bis Freitag schicken? | Könnten Sie mir die Unterlagen bitte bis Freitag schicken? | Könnten Sie mir bitte bis Freitag die Unterlagen schicken? | Würden Sie mir bitte die Unterlagen bis Freitag schicken? | Könnten Sie mir bitte die Dokumente bis Freitag schicken? || A polite formal request: Könnten Sie … + infinitive at the end; mir is the dative object. || @tags de.konjunktiv2,de.formal-writing
  fill: Ich habe leider vergessen, dich ___. (anrufen) || anzurufen || With separable verbs, zu goes between the prefix and the stem: an-zu-rufen. || @tags de.infinitive-zu @obj Talk about school and learning, and give advice with sollte, zu-infinitives and um … zu
  mc: Your friend has an exam next week and hasn't started revising. The best advice is: || *Du solltest heute noch anfangen. | Du sollst heute noch anfangen. | Du solltest heute noch anzufangen. || Advice uses the Konjunktiv II of sollen: du solltest + infinitive (without zu). Du sollst passes on someone else's instruction. || @tags de.konjunktiv2,de.modal-verbs
  fill: Als wir am Bahnsteig ankamen, ___ der Zug schon abgefahren. || war || Abfahren takes sein, so the Plusquamperfekt is war + abgefahren: it happened before we arrived. || @tags de.plusquamperfekt @obj Report what had happened with the Plusquamperfekt and ask for help politely with indirect questions
  rw: Make it an indirect question :: Wann beginnt der Kurs? (Start: Können Sie mir sagen, …) || Können Sie mir sagen, wann der Kurs beginnt? || In an indirect question the question word starts the clause and the verb goes to the end. || @tags de.subordinate-clauses,de.questions
  listen: Guten Tag, ich rufe an, weil mein Internet seit gestern Abend nicht funktioniert. Ich habe den Router schon neu gestartet, aber das Licht blinkt immer noch rot. || What has the caller already done? || Bought a new router | *Restarted the router | Called a technician yesterday || "Ich habe den Router schon neu gestartet" — but the light is still flashing red. || @tags de.listening
  mc: Choose the correct sentence. || Obwohl es regnet, wir fahren mit dem Rad. | *Obwohl es regnet, fahren wir mit dem Rad. | Obwohl regnet es, fahren wir mit dem Rad. || Obwohl sends its verb to the end (es regnet); the main clause that follows starts with its verb: fahren wir. || @tags de.connectors,de.subordinate-clauses @obj Compare city and country life, describe green habits with obwohl, and propose solutions using correct adjective endings
  fill: Wir wohnen jetzt in der ___ Wohnung neben dem ___ Park. (klein; groß) || kleinen ; großen || After the definite article in the dative, the adjective always ends in -en: in der kleinen Wohnung, neben dem großen Park. || @tags de.adjective-endings
  fill: Seit einem Jahr interessiere ich mich sehr ___ Fotografie. || für || The fixed combination is sich interessieren für + accusative. || @tags de.reflexive,de.prepositions @obj Talk about stress, food and sport with reflexive and prepositional verbs and da-/wo-compounds
  mc: "Freust du dich auf den Urlaub?" – "Ja, ich freue mich sehr ___." || *darauf | dafür | auf ihn || Sich freuen auf + a thing → darauf (da + r + auf). Auf ihn would be used for a person; dafür belongs to other verbs. || @tags de.prepositions
  fill: Das ist der Nachbar, ___ ich meinen Schlüssel gegeben habe. || dem || Geben takes a dative person: ich habe dem Nachbarn den Schlüssel gegeben → masculine dative relative pronoun dem. || @tags de.relative-clauses,de.dative @obj Review a film, a series or a book, recommend it and retell a story with relative clauses in all cases
  mc: "That's the band I told you about." || Das ist die Band, von die ich dir erzählt habe. | *Das ist die Band, von der ich dir erzählt habe. | Das ist die Band, die ich dir von erzählt habe. || Erzählen von + dative; the preposition goes first, then the relative pronoun in the dative: von der (die Band, feminine). || @tags de.relative-clauses
  listen: Ich habe gestern einen Film gesehen, über den alle reden. Die Geschichte ist spannend, aber ehrlich gesagt war er mir eine halbe Stunde zu lang. || What does the speaker criticise? || The story | *The length of the film | The actors || "Er war mir eine halbe Stunde zu lang" — the story was exciting, but the film was too long. || @tags de.listening,de.relative-clauses
  fill: Wenn ich mehr Zeit ___, würde ich öfter mit dem Zug reisen. || hätte || An unreal condition in the present: wenn + Konjunktiv II (hätte) …, würde + infinitive. || @tags de.konjunktiv2 @obj Talk about responsible travel, customs and stereotypes, and imagine situations with wenn + Konjunktiv II
  listen: Wenn ich im Lotto gewinnen würde, würde ich nicht aufhören zu arbeiten. Ich würde nur weniger Stunden arbeiten und mehr reisen. || What would the speaker do with a lottery win? || Stop working completely | *Work fewer hours and travel more | Buy a house and stay at home || "Ich würde nicht aufhören zu arbeiten … nur weniger Stunden arbeiten und mehr reisen." || @tags de.listening,de.konjunktiv2
  short: In German, give one reason why someone might prefer the train to the plane for a trip of 600 km. Use deshalb or weil. || kw: weil/deshalb/deswegen/denn & umwelt/klima/co2/bequem/entspannt/arbeiten/lesen/zentrum/stadtmitte/billiger/günstiger || Ich fahre lieber mit dem Zug, weil er besser für das Klima ist und ich unterwegs lesen kann. || @tags de.connectors
  write: Write a short review (80–100 words) of a film, series or book you liked for a German-language website. Say what it is about, describe one character with a relative clause, give your opinion and say who you would recommend it to. || min=70 || req: der/die/das/den/dem/denen | geht es um/handelt von/erzählt | ich finde/meiner meinung nach/mir hat/mir gefällt | empfehle/empfehlen/würde || Die Serie „Hafenlichter“ spielt in Kiel und erzählt von einer jungen Lotsin, die nach zehn Jahren in ihre Heimatstadt zurückkommt. Ihr Vater, mit dem sie seit Jahren nicht spricht, ist plötzlich krank. Mir hat besonders die Hauptfigur gefallen, denn sie ist stark, aber nicht perfekt. Die Bilder vom Hafen sind wunderschön, und die Musik passt sehr gut. Manche Folgen sind etwas langsam, trotzdem habe ich alle an einem Wochenende geschaut. Ich würde die Serie allen empfehlen, die ruhige Familiengeschichten mögen.
