unit: 2
title: Arbeit und Karriere
theme: Work and careers
description: Answer interview questions with Konjunktiv II, write formal emails and take part in meetings, and explain career decisions with deshalb, trotzdem and denn.
free: true
objectives:
  - Express wishes, possibilities and careful statements in a job interview with Konjunktiv II
  - Write and understand formal emails and use polite phrases in meetings
  - Explain career decisions and their consequences with deshalb, trotzdem and denn
canDo:
  - I can answer typical questions in a job interview and ask my own questions.
  - I can write a formal email with the right greeting, requests and closing.
  - I can make a suggestion or add a point in a meeting.
  - I can explain why someone changes career and what the consequences are.
review: |
  fill: ___ Sie mir bitte die Unterlagen bis Freitag schicken? || Könnten / Würden || A polite formal request uses Konjunktiv II: Könnten Sie … / Würden Sie … + infinitive at the end. || @tags de.konjunktiv2,de.formal-writing
  fill: Ein Jahresgehalt von 48.000 Euro ___ für mich in Ordnung. (sein) || wäre || A careful statement in Konjunktiv II: das wäre (would be), not würde sein. || @tags de.konjunktiv2
  mc: You write to a company and don't know the name of the person who will read your email. You begin: || *Sehr geehrte Damen und Herren, | Liebe Damen und Herren, | Hallo zusammen, || Sehr geehrte Damen und Herren is the standard formal greeting when you don't know a name. || @tags de.formal-writing
  fill: Der Weg zur Arbeit ist sehr lang. ___ fahre ich jeden Tag gern hin, denn das Team ist super. || Trotzdem || Trotzdem shows a contrast: the journey is long, but in spite of that the speaker likes going. || @tags de.connectors
  mc: Choose the correct sentence. || Die Firma zieht nach Köln, deshalb ich suche eine neue Stelle. | *Die Firma zieht nach Köln, deshalb suche ich eine neue Stelle. | Die Firma zieht nach Köln, deshalb ich eine neue Stelle suche. || After deshalb the verb comes immediately, then the subject. || @tags de.connectors,de.word-order
  rw: Make it more polite :: Schicken Sie mir das Protokoll. || Könnten Sie mir bitte das Protokoll schicken? | Würden Sie mir bitte das Protokoll schicken? | Könnten Sie mir das Protokoll schicken? | Würden Sie mir das Protokoll schicken? || Turn the imperative into a question with Könnten Sie / Würden Sie and put the infinitive at the end. || @tags de.konjunktiv2,de.register
  tr: I would like to work in a team. || Ich würde gern im Team arbeiten. | Ich würde gerne im Team arbeiten. | Ich würde gern in einem Team arbeiten. | Ich möchte gern im Team arbeiten. | Ich möchte im Team arbeiten. || A wish: würde gern + infinitive at the end (or möchte). || @tags de.konjunktiv2
  listen: Guten Tag, Herr Lindner, hier ist Sabine Roth von der Firma Kessler. Leider müssen wir unser Gespräch am Mittwoch verschieben. Hätten Sie auch am Freitag um neun Uhr Zeit? || What does Ms Roth suggest? || Cancelling the interview | *Moving the interview to Friday | Meeting on Wednesday at nine || Verschieben = to postpone; she asks whether Mr Lindner has time on Friday at nine. || @tags de.listening,de.konjunktiv2
  listen: Ich habe zehn Jahre als Köchin gearbeitet, denn Kochen war immer meine Leidenschaft. Aber die Arbeitszeiten waren hart, deshalb mache ich jetzt eine Umschulung zur Erzieherin. || Why is the speaker retraining? || She no longer liked cooking. | *The working hours were hard. | She wanted to earn more money. || "Die Arbeitszeiten waren hart, deshalb mache ich jetzt eine Umschulung." || @tags de.listening,de.connectors
  ask: In an interview you are asked "Was sind Ihre Stärken?" Answer carefully with Konjunktiv II and give an example. || kw: würde/wäre/könnte & stärke/belastbar/teamfähig/zuverlässig/geduldig/flexibel/organisiert/kreativ/ruhig || Ich würde sagen, meine größte Stärke ist meine Geduld. Auch mit schwierigen Kunden bleibe ich ruhig.
  write: Write a formal email (60–80 words) to a company. You saw a job advert and would like more information about the working hours and the start date. || min=50 || req: sehr geehrte/sehr geehrter | würde/könnten/wäre/hätte | mit freundlichen grüßen || Sehr geehrte Damen und Herren, ich habe Ihre Anzeige für die Stelle als Projektassistentin gelesen und interessiere mich sehr für die Position. Ich hätte noch zwei Fragen: Wäre die Stelle auch in Teilzeit möglich? Und ab wann könnte ich anfangen? Ich würde mich über eine kurze Antwort freuen. Vielen Dank im Voraus. Mit freundlichen Grüßen Elif Kaya
lessons:
  - title: The job interview
    summary: Talk about your strengths, wishes and availability in a job interview with Konjunktiv II — würde, wäre, hätte and könnte.
    minutes: 40
    skills: [grammar, listening, speaking]
    tags: [de.konjunktiv2, de.register]
    objectives:
      - Form Konjunktiv II of sein, haben, werden and können in all persons
      - Express wishes and possibilities and make careful statements
      - Answer and ask typical interview questions
    intro: |
      In a job interview, *how* you say something matters as much as *what* you say. German speakers use **Konjunktiv II** to sound polite and careful: *Ich **würde** gern mehr Verantwortung übernehmen. Ich **könnte** im April anfangen. Das **wäre** kein Problem.* You already know *würde gern* and *hätte gern* from A2 — now you will use the full set of forms to talk about your strengths, wishes and plans.
    vocab: |
      die Stärke | strength | n | Was ist Ihrer Meinung nach Ihre größte Stärke? | In your opinion, what is your greatest strength? | g: f | pl: die Stärken | n: Opposite: die Schwäche.
      die Schwäche | weakness | n | Meine Schwäche ist, dass ich manchmal zu ungeduldig bin. | My weakness is that I'm sometimes too impatient. | g: f | pl: die Schwächen
      die Verantwortung | responsibility | n | In meiner neuen Stelle hätte ich mehr Verantwortung. | In my new job I would have more responsibility. | g: f | pl: (rarely used) | c: Verantwortung übernehmen; Verantwortung für etwas tragen
      übernehmen | to take on; to take over | v | Ich würde gern ein eigenes Projekt übernehmen. | I'd like to take on my own project. | n: Inseparable: übernahm, hat übernommen.
      teamfähig | good at working in a team | adj | Für diese Stelle suchen wir jemanden, der teamfähig ist. | For this position we're looking for someone who works well in a team.
      belastbar | able to cope with pressure | adj | Ich bin belastbar und bleibe auch unter Zeitdruck ruhig. | I can cope with pressure and stay calm even when time is short. | n: Typical word in job adverts; noun: die Belastbarkeit.
      die Herausforderung | challenge | n | Ich suche eine neue Herausforderung. | I'm looking for a new challenge. | g: f | pl: die Herausforderungen
      die Probezeit | probation period | n | Die Probezeit dauert sechs Monate. | The probation period lasts six months. | g: f | pl: die Probezeiten
      die Gehaltsvorstellung | salary expectation | n | Was ist Ihre Gehaltsvorstellung? | What are your salary expectations? | g: f | pl: die Gehaltsvorstellungen | n: Usually given as gross annual salary (brutto im Jahr).
      die Kündigungsfrist | period of notice | n | Meine Kündigungsfrist beträgt drei Monate. | My notice period is three months. | g: f | pl: die Kündigungsfristen | c: die Kündigungsfrist beträgt …
      der Arbeitgeber | employer | n | Mein jetziger Arbeitgeber ist eine Spedition in Dortmund. | My current employer is a haulage company in Dortmund. | g: m | pl: die Arbeitgeber | n: Feminine: die Arbeitgeberin. The employee is der Arbeitnehmer / die Arbeitnehmerin.
      sich vorstellen | to introduce oneself | v | Darf ich mich kurz vorstellen? | May I briefly introduce myself? | n: Also: sich etwas vorstellen = to imagine something (Ich kann mir das gut vorstellen).
    grammar:
      title: "Konjunktiv II: würde, wäre, hätte, könnte"
      body: |
        **Konjunktiv II** is the "would" form of German. It makes statements careful and polite, and it expresses wishes and possibilities. Most verbs use **würde + infinitive**: *Ich **würde** gern im Vertrieb **arbeiten**.*

        A few very common verbs have their own short forms, which you should use instead of würde: **sein → wäre**, **haben → hätte**, **können → könnte**, **müssen → müsste**, **dürfen → dürfte**. They are formed from the Präteritum plus an umlaut: *war → wäre, hatte → hätte, konnte → könnte*. Say *Das wäre schön*, not *Das würde schön sein*.

        Typical uses in an interview:

        - wishes: *Ich würde gern mehr Verantwortung übernehmen. Ich hätte gern einen Firmenwagen.*
        - possibilities and offers: *Ich könnte am ersten April anfangen.*
        - careful statements: *Ich würde sagen, ich bin sehr belastbar. Das wäre für mich kein Problem.*
        - polite questions: *Hätten Sie noch Fragen? Wäre auch Homeoffice möglich?*
      table: |
        Person | sein | haben | werden | können
        ich | wäre | hätte | würde | könnte
        du | wärst | hättest | würdest | könntest
        er/sie/es | wäre | hätte | würde | könnte
        wir | wären | hätten | würden | könnten
        ihr | wärt | hättet | würdet | könntet
        sie/Sie | wären | hätten | würden | könnten
      examples: |
        Ich würde gern mehr Verantwortung übernehmen. | I'd like to take on more responsibility. | wish: würde gern + infinitive
        Ich könnte am ersten April anfangen. | I could start on the first of April. | possibility: könnte
        Ein Tag Homeoffice pro Woche wäre für mich ideal. | One day working from home per week would be ideal for me. | sein → wäre
        Hätten Sie am Donnerstag Zeit für ein zweites Gespräch? | Would you have time for a second interview on Thursday? | polite question: hätten Sie
      tip: Start your answer with "Ich würde sagen, …" — it sounds confident but not arrogant.
    dialogue:
      title: Das Vorstellungsgespräch
      setting: A logistics company in Duisburg. Amara Mensah has applied for a job as a project coordinator. She talks to Ms Kowalski from HR and Mr Brandt, the team leader.
      speakers: K=Frau Kowalski/f; B=Herr Brandt/m; A=Amara Mensah/f
      lines: |
        K: Frau Mensah, erzählen Sie uns doch bitte kurz etwas über sich. | Ms Mensah, please tell us a little about yourself.
        A: Gern. Ich arbeite seit fünf Jahren als Disponentin bei einer Spedition in Dortmund. | Sure. For five years I've been working as a dispatcher for a haulage company in Dortmund.
        B: Und warum möchten Sie wechseln? Sie haben dort ja eine feste Stelle. | And why would you like to change? After all, you have a permanent job there.
        A: Ich würde gern mehr Verantwortung übernehmen und eigene Projekte leiten. | I'd like to take on more responsibility and lead my own projects.
        B: Was ist Ihrer Meinung nach Ihre größte Stärke? | In your opinion, what is your greatest strength?
        A: Ich würde sagen, ich bin sehr belastbar. Auch unter Zeitdruck bleibe ich ruhig. | I'd say I cope very well with pressure. Even when time is short, I stay calm.
        B: Die Stelle wäre ab März frei. Wann könnten Sie bei uns anfangen? | The position would be available from March. When could you start with us?
        A: Meine Kündigungsfrist beträgt drei Monate, ich könnte also am ersten April anfangen. | My notice period is three months, so I could start on the first of April.
        K: Das wäre für uns kein Problem. Haben Sie noch Fragen an uns? | That would be no problem for us. Do you have any questions for us?
        A: Ja: Wäre auch Homeoffice möglich, zum Beispiel an einem Tag pro Woche? | Yes: would working from home also be possible, for example one day a week?
        B: Nach der Probezeit auf jeden Fall. Das klären wir dann gemeinsam. | After the probation period, definitely. We'll sort that out together then.
    pronunciation:
      title: "wäre, hätte, würde: umlauts that change the meaning"
      body: |
        In Konjunktiv II the umlaut carries the meaning: *wurde* (became) – ***würde*** (would), *hatte* (had) – ***hätte*** (would have), *konnte* (could, past) – ***könnte*** (could, would be able to). Make the umlaut clearly audible.

        **ä** in *wäre* is long [ɛː], like a long *e* in English *bed*; in *hätte* it is short [ɛ] because two consonants follow. For **ü** in *würde*, say *i* and round your lips; for **ö** in *könnte*, say *e* and round your lips.
      items: |
        wäre
        hätte
        würde
        könnte
        Ich würde gern anfangen.
        Das wäre kein Problem.
    culture:
      title: Job interviews in Germany
      body: |
        Job interviews (*Vorstellungsgespräche*) in Germany are usually quite structured. Arrive five to ten minutes early, greet everyone with a handshake and use *Sie* unless you are offered *du*. Typical questions are about your experience, your strengths and weaknesses, your notice period and your *Gehaltsvorstellung* — given as gross annual salary, for example *55.000 Euro brutto im Jahr*.

        Most contracts start with a *Probezeit* of up to six months, during which both sides can end the contract at short notice. At the end of the interview you are expected to ask one or two questions yourself — it shows interest.
    mistakes: |
      Ich würde gern mehr Verantwortung zu übernehmen. => Ich würde gern mehr Verantwortung übernehmen. | Würde is followed by a plain infinitive, without zu.
      Ich wurde gern im Team arbeiten. => Ich würde gern im Team arbeiten. | Without the umlaut, wurde is the past of werden (became). "Would" is würde.
      Das würde kein Problem sein. => Das wäre kein Problem. | With sein and haben, use the short forms wäre and hätte instead of würde sein or würde haben.
    task:
      title: Your interview
      mode: interaction
      body: |
        Prepare for an interview for a job you would like. Answer three classic questions — "Erzählen Sie etwas über sich", "Was sind Ihre Stärken?" and "Wann könnten Sie anfangen?" — and ask one question of your own. Use at least four Konjunktiv II forms. Practise with the "Preparing for a job interview" scenario with the AI coach.
    exercises: |
      fill: Ich ___ gern mehr Verantwortung übernehmen. || würde || A wish: würde gern + infinitive at the end. || @tags de.konjunktiv2
      fill: ___ Sie am Montag um zehn Uhr Zeit? (haben) || Hätten / hätten || A polite question uses the short form of haben: Hätten Sie …? || @tags de.konjunktiv2
      fill: Ein Tag Homeoffice pro Woche ___ für mich ideal. (sein) || wäre || Sein → wäre (er/sie/es-form, no ending). || @tags de.konjunktiv2
      fill: Wir ___ Ihnen den Vertrag schon nächste Woche schicken. (können) || könnten || Können → könnten: the polite offer "we could". || @tags de.konjunktiv2
      mc: Which answer sounds confident but careful in an interview? || *Ich würde sagen, meine größte Stärke ist meine Geduld. | Ich wurde sagen, meine größte Stärke ist meine Geduld. | Ich werde sagen, meine größte Stärke ist meine Geduld. || Ich würde sagen = I would say. Wurde is the past of werden; werde refers to the future. || @tags de.konjunktiv2
      rw: Make it sound more careful (Konjunktiv II) :: Das ist für mich kein Problem. || Das wäre für mich kein Problem. | Das wäre kein Problem für mich. || Sein → wäre. || @tags de.konjunktiv2
      mc: What is a "Probezeit"? || A practice exam before an interview | *The trial period at the start of a new job | A short break during the working day || Die Probezeit is the probation period, usually up to six months. || @skill vocabulary @tags de.vocabulary
      tf: Amara could start the new job in March. || false || Her notice period is three months, so she could start on the first of April. || @ctx dialogue
      short: Why does Amara want to change jobs? || kw: verantwortung/responsibility/projekte/projects/leiten/lead || "Ich würde gern mehr Verantwortung übernehmen und eigene Projekte leiten." || @ctx dialogue
      listen: @dialogue || What does Amara ask at the end of the interview? || What the salary would be | *Whether working from home would be possible | Who would be in her team || "Wäre auch Homeoffice möglich, zum Beispiel an einem Tag pro Woche?"
      listen: Vielen Dank für Ihre Bewerbung. Wir würden Sie gern zu einem persönlichen Gespräch einladen. Hätten Sie am Donnerstag um 14 Uhr Zeit? || Why is the company calling? || To reject the application | *To invite the applicant to an interview | To offer a contract || "Wir würden Sie gern zu einem persönlichen Gespräch einladen." || @tags de.listening,de.konjunktiv2
      tr: When could you start? (formal) || Wann könnten Sie anfangen? | Ab wann könnten Sie anfangen? | Wann könnten Sie beginnen? | Ab wann könnten Sie beginnen? || Polite question with könnten Sie; the infinitive goes to the end. || @tags de.konjunktiv2,de.register
      dict: Ich würde gern eigene Projekte leiten.
      ask: The interviewer asks: "Warum möchten Sie bei uns arbeiten?" Answer with at least two Konjunktiv II forms. || kw: würde/wäre/hätte/könnte & gern/arbeiten/verantwortung/team/projekte/lernen/herausforderung || Ich würde gern in einem internationalen Team arbeiten. Bei Ihnen hätte ich mehr Verantwortung, und das wäre für mich eine neue Herausforderung.

  - title: Emails and meetings
    summary: Read and write formal emails with the right greeting, requests and closing, and use polite phrases in a meeting.
    minutes: 40
    skills: [reading, writing, speaking]
    tags: [de.formal-writing, de.register]
    objectives:
      - Start and end a formal email correctly
      - Make polite requests with Könnten Sie …, Würden Sie … and Ich wäre Ihnen dankbar, wenn …
      - Make suggestions and add points in a meeting
    intro: |
      At work, much of your German will be written: invitations, requests, replies. A formal email follows clear rules — *Sehr geehrte Frau …*, polite requests in Konjunktiv II and *Mit freundlichen Grüßen* at the end. In this lesson you will read a short email thread about a team meeting and learn the phrases you need to write your own emails and to speak up in meetings.
    vocab: |
      der Betreff | subject (of an email) | n | Bitte schreiben Sie das Datum in den Betreff. | Please put the date in the subject line. | g: m | pl: die Betreffe | n: AW: in a subject line = Antwort (reply), WG: = Weiterleitung (forward).
      die Tagesordnung | agenda | n | Was steht heute auf der Tagesordnung? | What's on the agenda today? | g: f | pl: die Tagesordnungen | c: auf der Tagesordnung stehen
      das Protokoll | minutes (of a meeting) | n | Frau Schneider schreibt das Protokoll. | Ms Schneider is taking the minutes. | g: n | pl: die Protokolle | c: das Protokoll schreiben/führen
      teilnehmen | to take part; to attend | v | Leider kann ich am Donnerstag nicht teilnehmen. | Unfortunately I can't attend on Thursday. | c: an einer Besprechung teilnehmen | n: Separable: nahm … teil, hat teilgenommen.
      verschieben | to postpone; to move | v | Könnten wir den Termin auf Freitag verschieben? | Could we move the appointment to Friday? | c: etwas auf + date verschieben | n: Irregular: verschob, hat verschoben.
      Bescheid geben | to let someone know | expr | Bitte geben Sie mir bis Dienstag Bescheid. | Please let me know by Tuesday. | n: Informal: Sag mir kurz Bescheid!
      ergänzen | to add (to); to complete | v | Darf ich kurz etwas ergänzen? | May I briefly add something? | n: Noun: die Ergänzung.
      der Anhang | attachment | n | Im Anhang finden Sie die Präsentation. | Please find the presentation attached. | g: m | pl: die Anhänge | c: im Anhang
      die Unterlagen | documents; paperwork | n | Die Unterlagen schicke ich Ihnen morgen. | I'll send you the documents tomorrow. | pl: die Unterlagen | n: Plural only.
      weiterleiten | to forward | v | Ich leite Ihre E-Mail an meinen Kollegen weiter. | I'll forward your email to my colleague. | n: Separable: hat weitergeleitet.
      dringend | urgent; urgently | adj | Wir brauchen dringend neue Laptops. | We urgently need new laptops.
      im Voraus | in advance | expr | Vielen Dank im Voraus! | Thank you in advance!
      die Frist | deadline | n | Die Frist für die Anmeldung endet am 31. Mai. | The deadline for registration is the 31st of May. | g: f | pl: die Fristen | c: eine Frist einhalten; die Frist verlängern
    grammar:
      title: "Formal register: greetings, requests and closings"
      body: |
        Formal German emails follow a fixed frame. They start with **Sehr geehrte Frau …,** or **Sehr geehrter Herr …,** (note the different endings) or, if you don't know a name, **Sehr geehrte Damen und Herren,**. After the comma, the first line starts with a **small letter** unless it is a noun: *vielen Dank für Ihre E-Mail.*

        The formal pronouns **Sie, Ihnen, Ihr** are always capitalised. Requests sound polite with Konjunktiv II: **Könnten Sie …?**, **Würden Sie …?** or the very formal **Ich wäre Ihnen dankbar, wenn Sie … könnten.** Instead of a direct *Ich will …*, say **Ich würde gern …** or **Ich hätte eine Bitte: …**

        Formal emails end with **Mit freundlichen Grüßen** (no comma after it) and your full name. Between colleagues who know each other, *Liebe Frau …* / *Lieber Herr …* and *Viele Grüße* or *Beste Grüße* are common.

        In meetings, the same polite forms help you take part: *Ich würde vorschlagen, dass wir …*, *Darf ich kurz etwas ergänzen?*, *Könnten Sie das bitte noch einmal erklären?*
      table: |
        Informal | Formal
        Hallo Jana, | Sehr geehrte Frau Krüger,
        Kannst du mir … schicken? | Könnten Sie mir bitte … schicken?
        Schick mir bitte … | Ich wäre Ihnen dankbar, wenn Sie mir … schicken könnten.
        Ich kann nicht kommen. | Leider kann ich nicht teilnehmen.
        Danke! | Vielen Dank im Voraus.
        Liebe Grüße | Mit freundlichen Grüßen
      examples: |
        Sehr geehrter Herr Yilmaz, vielen Dank für Ihre schnelle Antwort. | Dear Mr Yilmaz, thank you very much for your quick reply. | geehrter for a man; lowercase vielen
        Könnten Sie mir bitte die Unterlagen bis Freitag schicken? | Could you please send me the documents by Friday? | polite request
        Ich wäre Ihnen dankbar, wenn Sie mir das Protokoll weiterleiten könnten. | I would be grateful if you could forward the minutes to me. | very formal request
        Ich würde vorschlagen, dass wir mit Punkt drei anfangen. | I'd suggest that we start with item three. | suggestion in a meeting
      tip: Never write "MfG" for Mit freundlichen Grüßen — the abbreviation looks lazy and can even seem rude.
    reading:
      title: "AW: Teambesprechung am Donnerstag"
      text: |
        Betreff: Teambesprechung am Donnerstag – Tagesordnung

        Sehr geehrte Kolleginnen und Kollegen,

        am Donnerstag, dem 14. März, findet um 10 Uhr unsere monatliche Teambesprechung in Raum 2.14 statt. Auf der Tagesordnung stehen folgende Punkte:
        1. Rückblick auf die Messe in Hannover
        2. Planung: Sommerfest
        3. Neue Regeln für das Homeoffice

        Bitte geben Sie mir bis Dienstag Bescheid, wenn Sie nicht teilnehmen können. Wenn Sie weitere Themen besprechen möchten, schicken Sie mir diese bitte ebenfalls bis Dienstag.

        Mit freundlichen Grüßen
        Katrin Schneider
        Teamassistenz Vertrieb

        Betreff: AW: Teambesprechung am Donnerstag – Tagesordnung

        Sehr geehrte Frau Schneider,

        vielen Dank für die Einladung. Leider kann ich am Donnerstag nicht teilnehmen, weil ich an diesem Tag einen Kundentermin in Leipzig habe.

        Ich hätte eine Bitte: Könnten Sie den Punkt „Homeoffice“ vielleicht auf die nächste Besprechung verschieben? Das Thema ist für mein Team sehr wichtig, und ich würde gern selbst an der Diskussion teilnehmen. Falls das nicht möglich ist, wäre ich Ihnen dankbar, wenn Sie mir das Protokoll schicken könnten.

        Außerdem möchte ich ein Thema ergänzen: Wir brauchen dringend neue Laptops für die Auszubildenden. Ich könnte in der nächsten Besprechung kurz etwas dazu sagen.

        Vielen Dank im Voraus und viele Grüße
        David Adeyemi

        Betreff: AW: AW: Teambesprechung am Donnerstag – Tagesordnung

        Lieber Herr Adeyemi,

        kein Problem: Ich habe den Punkt „Homeoffice“ auf die Besprechung im April verschoben. Ihr Thema „Laptops“ steht dann auch auf der Tagesordnung.

        Beste Grüße
        Katrin Schneider
      translation: |
        Subject: Team meeting on Thursday – agenda

        Dear colleagues,

        our monthly team meeting will take place on Thursday, the 14th of March, at 10 a.m. in room 2.14. The following items are on the agenda:
        1. Review of the trade fair in Hanover
        2. Planning: summer party
        3. New rules for working from home

        Please let me know by Tuesday if you can't attend. If you would like to discuss other topics, please send them to me by Tuesday as well.

        Kind regards
        Katrin Schneider
        Sales team assistant

        Subject: RE: Team meeting on Thursday – agenda

        Dear Ms Schneider,

        thank you very much for the invitation. Unfortunately I can't attend on Thursday because I have a client appointment in Leipzig that day.

        I have a request: could you perhaps move the item "working from home" to the next meeting? The topic is very important for my team, and I would like to take part in the discussion myself. If that isn't possible, I would be grateful if you could send me the minutes.

        I would also like to add a topic: we urgently need new laptops for the trainees. I could say a few words about it at the next meeting.

        Thank you in advance and best wishes
        David Adeyemi

        Subject: RE: RE: Team meeting on Thursday – agenda

        Dear Mr Adeyemi,

        no problem: I have moved the item "working from home" to the meeting in April. Your topic "laptops" will then be on the agenda too.

        Best regards
        Katrin Schneider
    pronunciation:
      title: "Stress in compound nouns"
      body: |
        Office German is full of compound nouns: *die Tagesordnung, die Teambesprechung, der Kundentermin*. The main stress is almost always on the **first part**: *TA-ges-ord-nung, KUN-den-ter-min*. The second part keeps a weaker stress, so the word doesn't sound flat.

        Words borrowed from Latin or Greek often have their stress at the end: *das Proto**KOLL***, *die Diskus**SION***, *die Präsenta**TION***. Practise the items slowly, then at normal speed.
      items: |
        die Tagesordnung
        der Kundentermin
        die Teambesprechung
        das Protokoll
        Mit freundlichen Grüßen
        Vielen Dank im Voraus.
    culture:
      title: From "Sehr geehrte" to "Liebe"
      body: |
        The first email to someone you don't know is always formal. After a few emails, many people switch to the warmer *Liebe Frau Schneider* / *Lieber Herr Adeyemi* — still with *Sie* — and end with *Viele Grüße* or *Beste Grüße*. A good rule: copy the style of the person who writes to you.

        In many companies, especially in start-ups and in the IT sector, colleagues use *du* and first names from the start, and emails begin with *Hallo Katrin*. Meetings, however, still tend to be well organised: they start on time, follow the *Tagesordnung*, and someone writes the *Protokoll*.
    mistakes: |
      Sehr geehrte Herr Adeyemi, => Sehr geehrter Herr Adeyemi, | Geehrt takes an adjective ending: Sehr geehrter Herr …, but Sehr geehrte Frau …
      Sehr geehrte Frau Schneider, Vielen Dank für Ihre E-Mail. => Sehr geehrte Frau Schneider, vielen Dank für Ihre E-Mail. | After the comma in the greeting, the next line starts with a small letter unless it is a noun or Sie.
      Könnten sie mir bitte die Unterlagen schicken? => Könnten Sie mir bitte die Unterlagen schicken? | The formal Sie (and Ihnen, Ihr) is always written with a capital letter.
    task:
      title: Reply to a meeting invitation
      mode: writing
      body: |
        Your manager has invited the team to a meeting next Monday at 9 a.m. Write a formal reply (60–80 words): thank them for the invitation, say that you can't attend and why, ask them to send you the minutes or to move one item to the next meeting, and suggest a topic of your own.
    exercises: |
      fill: Sehr ___ Frau Dr. Weber, || geehrte || With Frau the ending is -e: Sehr geehrte Frau … || @tags de.formal-writing,de.adjective-endings
      fill: Sehr ___ Herr Yilmaz, || geehrter || With Herr the ending is -er: Sehr geehrter Herr … || @tags de.formal-writing,de.adjective-endings
      mc: Which closing fits a formal email to someone you have never met? || *Mit freundlichen Grüßen | Liebe Grüße | Bis bald! || Mit freundlichen Grüßen is the standard formal closing; the others are for friends. || @tags de.formal-writing
      rw: Make it formal :: Kannst du mir die Unterlagen schicken? || Könnten Sie mir die Unterlagen schicken? | Könnten Sie mir bitte die Unterlagen schicken? | Würden Sie mir die Unterlagen schicken? | Würden Sie mir bitte die Unterlagen schicken? | Können Sie mir bitte die Unterlagen schicken? || Du → Sie, and Konjunktiv II (könnten/würden) makes the request polite. || @tags de.register,de.konjunktiv2
      rw: Make it formal and polite :: Schick mir bitte das Protokoll! || Könnten Sie mir bitte das Protokoll schicken? | Würden Sie mir bitte das Protokoll schicken? | Könnten Sie mir das Protokoll schicken? | Schicken Sie mir bitte das Protokoll. || The du-imperative becomes a Sie-question (or a Sie-imperative with bitte). || @tags de.register,de.konjunktiv2
      mc: "Könnten wir das Meeting verschieben?" — what does the speaker want? || To cancel the meeting completely | *To move the meeting to another time | To prepare the meeting || Verschieben = to postpone or move to another time. || @skill vocabulary @tags de.vocabulary
      tf: Herr Adeyemi can't come to the meeting because he is on holiday. || false || He has a client appointment in Leipzig: "weil ich an diesem Tag einen Kundentermin in Leipzig habe." || @ctx reading
      mc: What does Herr Adeyemi ask Frau Schneider to do? || Cancel the meeting | *Move the home-office item to the next meeting | Book a bigger room || "Könnten Sie den Punkt „Homeoffice“ vielleicht auf die nächste Besprechung verschieben?" || @ctx reading @skill reading
      short: Which new topic does Herr Adeyemi want to add to the agenda? || kw: laptop/laptops/computer || New laptops for the trainees. || @ctx reading
      listen: Guten Morgen zusammen. Ich würde vorschlagen, dass wir heute mit Punkt zwei anfangen, weil Frau Ortiz um elf schon wieder gehen muss. || Why does the speaker want to change the order of the agenda? || The room is only free until eleven. | *A colleague has to leave early. | Item one isn't ready yet. || "Weil Frau Ortiz um elf schon wieder gehen muss." || @tags de.listening,de.konjunktiv2
      tr: Thank you in advance. || Vielen Dank im Voraus. | Danke im Voraus. | Herzlichen Dank im Voraus. || Im Voraus = in advance. || @tags de.formal-writing
      dict: Leider kann ich am Donnerstag nicht teilnehmen.
      say: Darf ich kurz etwas ergänzen? || May I briefly add something?
      write: Write a formal reply (60–80 words) to a meeting invitation. Say you can't attend and why, make one polite request and suggest one topic. || min=50 || req: sehr geehrte/sehr geehrter/liebe/lieber | leider | könnten/würden/wäre/hätte | mit freundlichen grüßen/viele grüße/beste grüße || Sehr geehrter Herr Braun, vielen Dank für die Einladung zur Besprechung am Montag. Leider kann ich nicht teilnehmen, weil ich an diesem Tag eine Fortbildung habe. Könnten Sie mir bitte das Protokoll schicken? Außerdem würde ich gern ein Thema ergänzen: die neue Software für die Buchhaltung. Ich könnte das nächste Mal kurz darüber sprechen. Mit freundlichen Grüßen Sofia Marquez

  - title: Changing careers
    summary: Explain why people change careers and what follows from their decisions, with deshalb, deswegen, trotzdem and denn.
    minutes: 40
    skills: [grammar, listening, speaking]
    tags: [de.connectors]
    objectives:
      - Link sentences with deshalb/deswegen (consequence) and trotzdem (contrast)
      - Give reasons with denn and weil and use the right word order
      - Talk about a career change and its risks
    intro: |
      More and more people change their job completely in the middle of their working life — from the bank to the workshop, from the classroom to software development. To explain such a decision you need to give reasons (*denn, weil*), consequences (*deshalb*) and contrasts (*trotzdem*). Each of these little words has its own effect on word order, and that is what this lesson is about.
    vocab: |
      kündigen | to hand in one's notice; to resign | v | Nach acht Jahren habe ich meine Stelle gekündigt. | After eight years I resigned from my job. | n: Also used when the employer dismisses someone: Die Firma hat ihm gekündigt. Noun: die Kündigung.
      die Umschulung | retraining | n | Sie macht eine Umschulung zur Pflegefachfrau. | She's retraining as a nurse. | g: f | pl: die Umschulungen | c: eine Umschulung machen; die Umschulung zum/zur …
      der Quereinsteiger | career changer | n | In der IT-Branche arbeiten viele Quereinsteiger. | Many career changers work in the IT sector. | g: m | pl: die Quereinsteiger | n: Feminine: die Quereinsteigerin.
      unzufrieden | dissatisfied; unhappy | adj | Ich war in meinem Job lange unzufrieden. | I was unhappy in my job for a long time. | n: Opposite: zufrieden.
      mutig | brave; courageous | adj | Ich finde deine Entscheidung sehr mutig. | I think your decision is very brave. | n: Noun: der Mut.
      der Schritt | step | n | Der Wechsel in einen neuen Beruf war ein großer Schritt. | Changing to a new profession was a big step. | g: m | pl: die Schritte | c: einen Schritt wagen; Schritt für Schritt
      das Risiko | risk | n | Natürlich ist eine Umschulung auch ein Risiko. | Of course, retraining is also a risk. | g: n | pl: die Risiken
      die Sicherheit | security; safety | n | Bei der Bank hatte ich viel Sicherheit, aber wenig Freude. | At the bank I had lots of security but little joy. | g: f | pl: die Sicherheiten | n: Plural mainly in finance (securities, guarantees).
      sparen | to save (money) | v | Wir haben zwei Jahre für diesen Schritt gespart. | We saved for two years for this step. | c: Geld sparen; für etwas sparen
      unterstützen | to support | v | Meine Familie unterstützt mich total. | My family supports me completely. | n: Inseparable: hat unterstützt. Noun: die Unterstützung.
      die Leidenschaft | passion | n | Holz ist seit Jahren meine große Leidenschaft. | Wood has been my great passion for years. | g: f | pl: die Leidenschaften
      sich selbstständig machen | to become self-employed; to start one's own business | expr | Nach der Ausbildung möchte ich mich selbstständig machen. | After my training I'd like to set up my own business. | n: Adjective: selbstständig (also spelled selbständig).
    grammar:
      title: "deshalb, trotzdem, denn: word order with connectors"
      body: |
        Connectors link two ideas, but they don't all behave the same way.

        - **deshalb**, **deswegen** and **darum** introduce a **consequence** ("that's why", "so"). They are adverbs: they take position 1, so the **verb comes immediately after them**, then the subject: *Ich war unzufrieden, **deshalb habe ich** gekündigt.*
        - **trotzdem** introduces a **contrast** ("nevertheless", "still"): something happens although you would expect the opposite. Same word order: *Das Gehalt ist niedrig, **trotzdem liebe ich** meinen Job.*
        - **denn** gives a **reason**, like weil, but it stands in "position 0" — like *und* and *aber* — and does **not** change the word order: *Ich mache eine Umschulung, **denn ich möchte** mit Menschen arbeiten.*
        - **weil** also gives a reason, but sends the verb to the **end**: *…, weil ich mit Menschen arbeiten **möchte**.*

        Deshalb and trotzdem can also stand after the verb: *Ich habe **deshalb** gekündigt. Ich bin **trotzdem** glücklich.*
      table: |
        Connector | Meaning | Word order | Example
        weil | because | verb at the end | …, weil ich mehr Zeit brauche.
        denn | because | no change (position 0) | …, denn ich brauche mehr Zeit.
        deshalb / deswegen | that's why; so | verb right after it | …, deshalb arbeite ich Teilzeit.
        trotzdem | nevertheless; still | verb right after it | …, trotzdem bin ich zufrieden.
      examples: |
        Ich war unzufrieden, deshalb habe ich gekündigt. | I was unhappy, so I resigned. | consequence: deshalb + verb
        Als Azubi verdiene ich weniger, trotzdem bin ich glücklicher. | As a trainee I earn less, but I'm still happier. | contrast: trotzdem + verb
        Sie macht eine Umschulung, denn sie möchte mit Kindern arbeiten. | She's retraining, because she'd like to work with children. | denn: normal word order
        Er hat lange gespart. Deswegen kann er jetzt ein Jahr Pause machen. | He saved for a long time. That's why he can now take a year off. | deswegen = deshalb
      tip: Check the logic — deshalb follows naturally from the first idea ("so"), trotzdem goes against it ("but still").
    dialogue:
      title: Von der Bank in die Werkstatt
      setting: A summer evening on a balcony in Freiburg. Dirk, 45, tells his old friend Ana about a big decision.
      speakers: D=Dirk/m; A=Ana/f
      lines: |
        A: Du siehst so zufrieden aus, Dirk. Gibt es gute Nachrichten? | You look so pleased, Dirk. Is there good news?
        D: Ja, ich habe heute gekündigt. Ab September mache ich eine Ausbildung als Tischler. | Yes, I handed in my notice today. From September I'm doing an apprenticeship as a carpenter.
        A: Wie bitte? Du verdienst doch bei der Bank richtig gut! | Pardon? But you earn really well at the bank!
        D: Stimmt, trotzdem bin ich seit Jahren unzufrieden. Ich sitze nur noch vor Tabellen. | True, but I've still been unhappy for years. All I do is sit in front of spreadsheets.
        A: Und warum ausgerechnet Tischler? Das ist ja ein ganz anderer Beruf. | And why a carpenter, of all things? That's a completely different job.
        D: Ich baue seit zwanzig Jahren Möbel für Freunde, denn Holz ist meine große Leidenschaft. | I've been building furniture for friends for twenty years, because wood is my great passion.
        A: Aber mit 45 noch mal Azubi? Ist das nicht schwierig? | But an apprentice again at 45? Isn't that difficult?
        D: Vielleicht, aber ich kann die Ausbildung verkürzen, denn ich habe ja schon einen Abschluss. | Maybe, but I can shorten the training, because I already have a qualification.
        A: Und das Geld? Als Azubi verdienst du doch viel weniger. | And what about money? As an apprentice you'll earn much less.
        D: Ja, deshalb haben wir lange gespart. Und meine Frau unterstützt mich total. | Yes, that's why we saved for a long time. And my wife supports me completely.
        A: Ich finde das richtig mutig. Ehrlich gesagt hätte ich Angst vor so einem Schritt. | I think that's really brave. To be honest, I'd be afraid of a step like that.
        D: Ein bisschen Angst habe ich auch. Trotzdem fühlt es sich genau richtig an. | I'm a bit scared too. Still, it feels exactly right.
    pronunciation:
      title: "Final devoicing: deshalb, trotzdem, Abschluss"
      body: |
        At the end of a word or syllable, German **b, d, g** lose their voice and sound like **p, t, k**: *deshal**b*** [ˈdɛshalp], *Hol**z***, *Schri**tt***, *Ta**g*** [taːk]. This also happens inside a word, at the end of a syllable: *A**b**-schluss* [ˈapʃlʊs], *Ar**b**eit* stays [b] because the b starts a syllable.

        In *trotzdem* the **tz** is [ts] and the **d** begins a new syllable, so it stays voiced: [ˈtrɔtsdeːm]. Put the stress on the first syllable of *deshalb*, *deswegen* and *trotzdem*.
      items: |
        deshalb
        deswegen
        trotzdem
        der Abschluss
        Ich habe gekündigt.
        Trotzdem fühlt es sich richtig an.
    culture:
      title: Umschulung and Quereinstieg
      body: |
        In Germany, a career change often means formal training. An *Umschulung* is a shortened vocational training for adults; in some cases — for example after unemployment or for health reasons — the *Agentur für Arbeit* or another public body pays for it. Adults can also do a regular *Ausbildung*, and with previous qualifications it can often be shortened.

        Many sectors, from the skilled trades (*Handwerk*) to care, education and IT, are looking for staff and welcome *Quereinsteiger*. A career change in your forties or fifties is no longer unusual — but it still needs good planning and, often, savings.
    mistakes: |
      Ich war unzufrieden, deshalb ich habe gekündigt. => Ich war unzufrieden, deshalb habe ich gekündigt. | After deshalb the conjugated verb comes immediately, then the subject.
      Ich lerne Deutsch, denn ich in Wien arbeiten will. => Ich lerne Deutsch, denn ich will in Wien arbeiten. | Denn doesn't change word order: the verb stays in position 2 — only weil sends it to the end.
      Es regnet, trotzdem bleiben wir zu Hause. => Es regnet, deshalb bleiben wir zu Hause. | Staying at home is the logical consequence of rain, so you need deshalb. Trotzdem means "in spite of that".
    task:
      title: A new start
      mode: speaking
      body: |
        Talk for about one minute about a career change — your own, one you dream of, or one made by someone you know. Explain the reasons (denn, weil), the consequences (deshalb) and the difficulties (trotzdem). Then discuss with the "Expressing an opinion" scenario with the AI coach whether it is better to have a secure job or a job you love.
    exercises: |
      fill: Die Arbeit macht mir keinen Spaß mehr, ___ suche ich eine neue Stelle. || deshalb / deswegen / darum || Looking for a new job is the consequence, and the verb suche follows directly. || @tags de.connectors
      fill: Das Gehalt ist niedrig. ___ liebe ich meinen Job. || Trotzdem || A contrast: the pay is low, but still … Trotzdem takes position 1, so liebe comes next. || @tags de.connectors
      fill: Ich mache eine Umschulung, ___ ich möchte mit Menschen arbeiten. || denn || The verb möchte is in position 2 after the gap, so you need denn (weil would send it to the end). || @tags de.connectors
      mc: "Er hat wenig Erfahrung, trotzdem …" || *hat er die Stelle bekommen. | er hat die Stelle bekommen. | er die Stelle bekommen hat. || Trotzdem is in position 1 of its clause, so the verb hat follows immediately. || @tags de.connectors,de.word-order
      mc: "Sie hat lange gespart, ___ kann sie jetzt ein Jahr reisen." || weil | trotzdem | *deshalb || Travelling is the result of saving, and the verb follows immediately: deshalb. Weil would need the verb at the end; trotzdem is illogical. || @tags de.connectors
      rw: Join the sentences with deshalb :: Ich brauche mehr Zeit für meine Kinder. Ich arbeite nur noch Teilzeit. || Ich brauche mehr Zeit für meine Kinder, deshalb arbeite ich nur noch Teilzeit. | Ich brauche mehr Zeit für meine Kinder. Deshalb arbeite ich nur noch Teilzeit. | Ich brauche mehr Zeit für meine Kinder, deshalb arbeite ich nur Teilzeit. || Deshalb + verb (arbeite) + subject (ich). || @tags de.connectors
      rw: Rewrite with denn instead of weil :: Er kündigt, weil er unzufrieden ist. || Er kündigt, denn er ist unzufrieden. || With denn the verb ist stays in position 2. || @tags de.connectors
      tf: Dirk's wife is against his career change. || false || "Meine Frau unterstützt mich total." || @ctx dialogue
      short: What is Dirk going to train as? || kw: tischler/schreiner/carpenter/joiner || "Ab September mache ich eine Ausbildung als Tischler." || @ctx dialogue
      listen: @dialogue || How did Dirk prepare for earning less money? || He sold his flat. | *He and his wife saved for a long time. | He found a well-paid apprenticeship. || "Ja, deshalb haben wir lange gespart."
      listen: Ich war zwölf Jahre lang Lehrerin. Trotzdem habe ich mit 40 noch einmal etwas Neues angefangen – heute arbeite ich als Programmiererin. || What is the speaker's job today? || Teacher | *Programmer | Trainer for teachers || "Heute arbeite ich als Programmiererin." || @tags de.listening,de.connectors
      tr: I earn less now, but I'm still happier. || Ich verdiene jetzt weniger, trotzdem bin ich glücklicher. | Ich verdiene jetzt weniger, aber trotzdem bin ich glücklicher. | Ich verdiene jetzt weniger, aber ich bin trotzdem glücklicher. | Ich verdiene jetzt weniger, trotzdem bin ich zufriedener. | Ich verdiene jetzt weniger, aber ich bin trotzdem zufriedener. || Trotzdem + verb + subject, or trotzdem after the verb. || @tags de.connectors
      dict: Ich war unzufrieden, deshalb habe ich gekündigt.
      ask: A friend asks: "Würdest du gern einen ganz anderen Beruf lernen?" Answer and give a reason and a consequence. || kw: deshalb/deswegen/darum/trotzdem/denn/weil & würde/möchte/will/könnte/wäre || Ja, ich würde gern Gärtnerin werden, denn ich bin am liebsten draußen. Trotzdem bleibe ich erst mal im Büro, denn das Gehalt ist gut.
