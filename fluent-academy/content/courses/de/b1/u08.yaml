unit: 8
title: Gesellschaft und Reisen
theme: Society and travel
description: Discuss responsible travel with unreal conditions (wenn ich Zeit hätte, würde ich …), play with hypothetical questions using käme, ginge, wüsste and gäbe, and talk about customs and stereotypes with unreal wishes.
objectives:
  - Express unreal conditions in the present with wenn + Konjunktiv II
  - Use the Konjunktiv II forms of common strong and modal verbs (käme, ginge, gäbe, wüsste, müsste)
  - Express unreal wishes with ich wünschte, … and wenn … nur …!
canDo:
  - I can compare ways of travelling and say what I would do in a different situation.
  - I can answer and ask imaginative "what would you do if…?" questions.
  - I can talk about customs and stereotypes and say what is true for me.
  - I can express wishes about things I would like to be different.
review: |
  fill: Wenn ich im Lotto gewinnen ___, würde ich ein Haus am Meer kaufen. || würde || In everyday German the wenn-clause can also use würde + infinitive; the conjugated verb würde goes to the end. || @tags de.konjunktiv2,de.subordinate-clauses
  fill: Wenn es keine Flugzeuge ___, würden wir viel langsamer reisen. (geben) || gäbe || The Konjunktiv II of es gibt is es gäbe — very common in hypotheses. || @tags de.konjunktiv2
  fill: Ich wünschte, ich ___ mehr Urlaub. (haben) || hätte || An unreal wish: ich wünschte + Konjunktiv II (hätte). || @tags de.konjunktiv2
  mc: How do you say "If I were you, …"? || *Wenn ich du wäre, … | Wenn ich dich wäre, … | Wenn ich du bin, … || Sein takes the nominative on both sides (ich – du), and an unreal situation needs Konjunktiv II: wäre. || @tags de.konjunktiv2
  mc: "Wenn ich mehr Zeit hätte, ___ ich öfter wandern." || *ginge | gehe | ging || The main clause of an unreal condition needs Konjunktiv II too: ginge (= würde gehen). Gehe is the present, ging the Präteritum. || @tags de.konjunktiv2
  rw: Make it an unreal condition :: Ich habe kein Fahrrad. Deshalb fahre ich mit dem Bus. || Wenn ich ein Fahrrad hätte, würde ich nicht mit dem Bus fahren. | Wenn ich ein Fahrrad hätte, würde ich mit dem Fahrrad fahren. | Wenn ich ein Fahrrad hätte, würde ich nicht mit dem Bus fahren müssen. || Turn the fact around (kein Fahrrad → ein Fahrrad) and use hätte … würde. || @tags de.konjunktiv2,de.subordinate-clauses
  tr: If the train were cheaper, I would take it. || Wenn der Zug billiger wäre, würde ich ihn nehmen. | Wenn der Zug günstiger wäre, würde ich ihn nehmen. | Wenn die Bahn billiger wäre, würde ich sie nehmen. | Wenn die Bahn günstiger wäre, würde ich sie nehmen. || Wenn + wäre (verb at the end), then the main clause starts with würde. || @tags de.konjunktiv2
  listen: Wenn ich noch einmal zwanzig wäre, würde ich ein Jahr in Neuseeland arbeiten. Damals hatte ich leider nicht den Mut dazu. || What would the speaker do if he were twenty again? || Study in Germany | *Work in New Zealand for a year | Travel round the world by bike || "Würde ich ein Jahr in Neuseeland arbeiten." || @tags de.listening,de.konjunktiv2
  listen: In Deutschland bringt man an seinem Geburtstag selbst Kuchen mit ins Büro. Das fand ich am Anfang komisch, aber jetzt finde ich es schön. || What is the custom the speaker describes? || Colleagues bake a cake for you. | *You bring cake to work on your own birthday. | You don't celebrate birthdays at work. || "An seinem Geburtstag bringt man selbst Kuchen mit ins Büro." || @tags de.listening
  short: Answer in German: What would you do if you had a free day tomorrow? Use Konjunktiv II. || kw: würde/wäre/hätte/könnte/ginge/käme || Wenn ich morgen frei hätte, würde ich lange schlafen und dann mit Freunden an den See fahren. || @tags de.konjunktiv2
  ask: A friend asks: "Wo würdest du am liebsten leben, wenn du frei wählen könntest?" Answer and give two reasons. || kw: würde/wäre/hätte/könnte/ginge & weil/denn/dort/da || Wenn ich frei wählen könnte, würde ich in Lissabon leben. Dort wäre es wärmer, und ich könnte jeden Tag am Meer spazieren gehen.
  write: Write a short text (70–90 words) with the title "Wenn ich ein Jahr frei hätte …". Say where you would go, how you would travel, what you would do and one thing you wish were different in your life now. || min=60 || req: wenn | würde/wäre/hätte/könnte/ginge | ich wünschte/wenn … nur || Wenn ich ein Jahr frei hätte, würde ich mit dem Zug durch Europa reisen. Ich würde nicht fliegen, denn langsam reisen ist schöner. Zuerst ginge ich nach Norwegen, weil ich die Fjorde sehen möchte. Danach würde ich ein paar Monate auf einem Bauernhof in Portugal arbeiten. Dort könnte ich auch Portugiesisch lernen. Leider habe ich nur dreißig Tage Urlaub im Jahr. Ich wünschte, ich hätte mehr Zeit zum Reisen!
lessons:
  - title: Travelling responsibly
    summary: Compare ways of travelling and talk about what you would do in a different situation, with wenn + Konjunktiv II.
    minutes: 40
    skills: [grammar, listening, speaking]
    tags: [de.konjunktiv2, de.subordinate-clauses]
    objectives:
      - Form unreal conditions in the present (Wenn ich Zeit hätte, würde ich …)
      - Distinguish real conditions (wenn ich Zeit habe) from unreal ones
      - Discuss the pros and cons of different ways of travelling
    intro: |
      Plane or train? Big hotel or small guesthouse? A long weekend far away or a week close to home? Responsible travel is full of "if"s — and many of them are not real: *Wenn wir eine ganze Woche Urlaub **hätten**, **wäre** der Zug perfekt.* In this lesson you will use Konjunktiv II in both parts of the sentence to talk about situations that are only imagined.
    vocab: |
      das Reiseziel | destination | n | Amsterdam ist ein beliebtes Reiseziel. | Amsterdam is a popular destination. | g: n | pl: die Reiseziele
      die Anreise | journey there | n | Die Anreise mit dem Zug dauert drei Stunden. | The journey there by train takes three hours. | g: f | pl: die Anreisen | n: The journey back is die Rückreise.
      der Nachtzug | night train | n | Mit dem Nachtzug kommt man ausgeschlafen in Wien an. | With the night train you arrive in Vienna well rested. | g: m | pl: die Nachtzüge
      der Kurzurlaub | short holiday; short break | n | Für einen Kurzurlaub ist Barcelona zu weit weg. | For a short break Barcelona is too far away. | g: m | pl: die Kurzurlaube
      die Unterkunft | accommodation | n | Wir suchen eine günstige Unterkunft in der Altstadt. | We're looking for cheap accommodation in the old town. | g: f | pl: die Unterkünfte
      die Pension | guesthouse; B&B | n | Wir könnten in einer kleinen Pension wohnen. | We could stay in a small guesthouse. | g: f | pl: die Pensionen | n: Also means pension (retirement money).
      vor Ort | on site; locally; there | expr | Vor Ort leihen wir uns Fahrräder. | Once we're there, we'll hire bikes. | n: Very common in travel and business German.
      die Einheimischen | locals | n | Die Einheimischen essen in diesem Restaurant. | The locals eat in this restaurant. | pl: die Einheimischen | n: An adjective used as a noun: ein Einheimischer, eine Einheimische.
      der Massentourismus | mass tourism | n | Viele Städte haben Probleme mit dem Massentourismus. | Many cities have problems with mass tourism. | g: m | pl: (no plural)
      Rücksicht nehmen auf | to be considerate of | expr | Als Touristen sollten wir Rücksicht auf die Anwohner nehmen. | As tourists we should be considerate of the residents. | n: auf + accusative. Adjective: rücksichtsvoll.
      verzichten auf | to do without; to give up | v | Ich verzichte dieses Jahr aufs Fliegen. | I'm doing without flying this year. | n: auf + accusative. Noun: der Verzicht.
      das Klima | climate | n | Fliegen ist besonders schlecht fürs Klima. | Flying is particularly bad for the climate. | g: n | pl: die Klimas (rarely used) | c: der Klimaschutz; klimafreundlich
    grammar:
      title: "Unreal conditions: Wenn ich mehr Zeit hätte, würde ich …"
      body: |
        A **real condition** describes something that can happen: *Wenn ich Zeit **habe**, **fahre** ich mit dem Zug.* An **unreal condition** describes something imagined or contrary to the facts — and German marks this with **Konjunktiv II in both clauses**: *Wenn ich mehr Zeit **hätte**, **würde** ich mit dem Zug **fahren**.* (But I don't have more time.)

        - In the **wenn-clause** the verb goes to the end: *wenn ich mehr Zeit hätte / wenn der Zug billiger wäre / wenn wir früher losfahren würden*.
        - In the **main clause** use **würde + infinitive** or the short forms **wäre, hätte, könnte, müsste**.
        - If the wenn-clause comes first, the main clause starts with the verb: *Wenn ich du **wäre**, **würde** ich sofort buchen.*

        With sein, haben and modal verbs, always prefer the short forms (wäre, hätte, könnte) — also in the wenn-clause. *Wenn ich du wäre …* is the classic way to give advice.
      table: |
        Type | wenn-clause | main clause
        real | Wenn ich Zeit habe, | fahre ich mit dem Zug.
        unreal | Wenn ich mehr Zeit hätte, | würde ich mit dem Zug fahren.
        unreal | Wenn der Zug billiger wäre, | würden mehr Leute ihn nehmen.
        unreal | Wenn wir eine Woche Urlaub hätten, | wäre der Zug perfekt.
        advice | Wenn ich du wäre, | würde ich den Nachtzug nehmen.
      examples: |
        Wenn wir eine ganze Woche Urlaub hätten, wäre der Zug perfekt. | If we had a whole week's holiday, the train would be perfect. | hätten … wäre
        Und dann hätten wir nur zwei Tage in Barcelona. | And then we'd only have two days in Barcelona. | main clause alone: hätten
        Mit dem Zug wären wir in drei Stunden dort. | By train we'd be there in three hours. | wären
        Wenn ich du wäre, würde ich gleich die Tickets buchen. | If I were you, I'd book the tickets straight away. | advice
      tip: Check the facts. If the situation is real or possible, use the present tense; if it's imagined or the opposite of reality, use Konjunktiv II in both clauses.
    dialogue:
      title: Barcelona oder Amsterdam?
      setting: The office kitchen of a company in Cologne. Ronja is planning a long weekend in May and asks her colleague Marek to come along.
      speakers: R=Ronja/f; M=Marek/m
      lines: |
        R: Ich fliege im Mai für ein langes Wochenende nach Barcelona. Kommst du mit? | I'm flying to Barcelona for a long weekend in May. Are you coming along?
        M: Gern, aber ich würde lieber mit dem Zug fahren. Fliegen ist so schlecht fürs Klima. | I'd love to, but I'd rather go by train. Flying is so bad for the climate.
        R: Mit dem Zug? Von Köln aus dauert das doch ewig! | By train? From Cologne that takes forever!
        M: Ungefähr zwölf Stunden. Wenn wir ganz früh losfahren würden, wären wir am Abend da. | About twelve hours. If we left really early, we'd be there in the evening.
        R: Und dann hätten wir nur zwei Tage in Barcelona. Das lohnt sich doch nicht. | And then we'd only have two days in Barcelona. That's not worth it.
        M: Stimmt. Wenn wir eine ganze Woche Urlaub hätten, wäre der Zug perfekt. | True. If we had a whole week's holiday, the train would be perfect.
        R: Und was wäre, wenn wir nach Amsterdam fahren würden? Das ist viel näher. | And what if we went to Amsterdam? That's much closer.
        M: Gute Idee! Mit dem Zug wären wir in ungefähr drei Stunden dort. | Good idea! By train we'd be there in about three hours.
        R: Und vor Ort könnten wir Fahrräder leihen. Das macht in Amsterdam ja jeder. | And once there we could hire bikes. Everybody does that in Amsterdam.
        M: Genau. Und wir könnten in einer kleinen Pension wohnen. Dann bleibt das Geld bei den Leuten vor Ort. | Exactly. And we could stay in a small guesthouse. Then the money stays with the local people.
        R: Okay, überzeugt! Wenn ich du wäre, würde ich gleich die Tickets buchen – du bist ja der Experte. | Okay, I'm convinced! If I were you, I'd book the tickets right away – you're the expert, after all.
        M: Mach ich! Und nächstes Jahr fahren wir mit dem Nachtzug nach Barcelona. | Will do! And next year we'll take the night train to Barcelona.
    pronunciation:
      title: "The melody of long if-sentences"
      body: |
        In a long sentence with a wenn-clause, the voice **rises slightly** at the end of the wenn-clause — it signals "there's more to come" — and **falls** at the end of the main clause: *Wenn ich mehr Zeit hätte ↗, | würde ich mit dem Zug fahren ↘.*

        Stress the important information in each part — usually the word just before the verb at the end: *Wenn ich mehr **ZEIT** hätte, würde ich mit dem **ZUG** fahren.*
      items: |
        der Nachtzug
        die Unterkunft
        vor Ort
        Wenn ich du wäre, …
        Wenn ich mehr Zeit hätte, würde ich mit dem Zug fahren.
        Mit dem Zug wären wir in drei Stunden dort.
    culture:
      title: The comeback of the night train
      body: |
        Rail travel in Europe is becoming popular again. Night trains connect German cities with destinations such as Vienna, Zurich, Amsterdam and Italy, and daytime trains take you from Cologne to Paris or Amsterdam in a few hours. Within Germany, the *Deutschlandticket* — a monthly subscription for all local and regional buses and trains — has made public transport simpler. Many travellers also try to avoid mass tourism by visiting popular cities outside the high season.
    mistakes: |
      Wenn ich mehr Zeit hätte, ich würde mit dem Zug fahren. => Wenn ich mehr Zeit hätte, würde ich mit dem Zug fahren. | After the wenn-clause, the main clause starts with the verb.
      Wenn ich hätte mehr Geld, würde ich mehr reisen. => Wenn ich mehr Geld hätte, würde ich mehr reisen. | In the wenn-clause the conjugated verb goes to the end.
      Wenn ich mehr Zeit habe, würde ich länger bleiben. => Wenn ich mehr Zeit hätte, würde ich länger bleiben. | In an unreal condition both clauses need Konjunktiv II.
    task:
      title: Plan a trip together
      mode: interaction
      body: |
        With a partner, plan a holiday for next year. Compare two destinations and two ways of travelling, and discuss what you would do if you had more time, more money or a smaller budget. Use at least four unreal conditions. Then book your accommodation with the "Booking a hotel room" scenario with the AI coach.
    exercises: |
      fill: Wenn ich mehr Zeit ___, würde ich mit dem Zug nach Spanien fahren. (haben) || hätte || Unreal condition: wenn + hätte (verb at the end). || @tags de.konjunktiv2,de.subordinate-clauses
      fill: Wenn der Zug billiger ___, würden mehr Leute ihn nehmen. (sein) || wäre || Sein → wäre in the wenn-clause. || @tags de.konjunktiv2,de.subordinate-clauses
      fill: Wenn wir eine Woche Urlaub hätten, ___ wir nach Barcelona fahren. || würden / könnten || Main clause of an unreal condition: würden or könnten + infinitive at the end. || @tags de.konjunktiv2
      fill: Wenn ich du ___, würde ich sofort buchen. (sein) || wäre || The fixed phrase for advice: Wenn ich du wäre, … || @tags de.konjunktiv2
      mc: Choose the correct sentence. || Wenn ich Zeit hätte, ich würde mitkommen. | *Wenn ich Zeit hätte, würde ich mitkommen. | Wenn ich hätte Zeit, würde ich mitkommen. || Hätte goes to the end of the wenn-clause; the main clause then starts with würde. || @tags de.konjunktiv2,de.word-order
      mc: "Ich habe leider keine Zeit." What can you add? || *Wenn ich Zeit hätte, würde ich mitkommen. | Wenn ich Zeit habe, komme ich mit. | Wenn ich Zeit hatte, kam ich mit. || You don't have time, so the condition is unreal: hätte … würde. || @tags de.konjunktiv2
      rw: Rewrite as an unreal condition :: Wenn ich Zeit habe, besuche ich dich. || Wenn ich Zeit hätte, würde ich dich besuchen. || Habe → hätte; besuche → würde … besuchen. || @tags de.konjunktiv2
      tf: Marek would rather fly to Barcelona. || false || "Ich würde lieber mit dem Zug fahren. Fliegen ist so schlecht fürs Klima." || @ctx dialogue
      short: Where do Ronja and Marek decide to go? || kw: amsterdam || They choose Amsterdam, because it's much closer by train. || @ctx dialogue
      listen: @dialogue || How long would the train journey to Amsterdam take? || *About three hours | About twelve hours | A whole day || "Mit dem Zug wären wir in ungefähr drei Stunden dort."
      listen: Wenn ich mehr Geld hätte, würde ich nicht öfter reisen, sondern länger an einem Ort bleiben. So lernt man ein Land viel besser kennen. || What would the speaker do with more money? || Travel more often | *Stay longer in one place | Fly to more countries || "Ich würde … länger an einem Ort bleiben." || @tags de.listening,de.konjunktiv2
      tr: If I were you, I would take the night train. || Wenn ich du wäre, würde ich den Nachtzug nehmen. | An deiner Stelle würde ich den Nachtzug nehmen. | Wenn ich du wäre, würde ich mit dem Nachtzug fahren. | An deiner Stelle würde ich mit dem Nachtzug fahren. || Wenn ich du wäre (or an deiner Stelle) + würde + infinitive at the end. || @tags de.konjunktiv2
      dict: Wenn wir eine ganze Woche Urlaub hätten, wäre der Zug perfekt.
      ask: How would you travel if you had a whole month off? Give two details. || kw: wenn & hätte/wäre/würde/könnte || Wenn ich einen ganzen Monat frei hätte, würde ich mit dem Nachtzug nach Italien fahren. Dort würde ich in kleinen Pensionen wohnen und viel wandern.

  - title: "What would you do if…?"
    summary: Answer and ask imaginative questions with the Konjunktiv II of common strong and modal verbs — käme, ginge, gäbe, wüsste, müsste.
    minutes: 40
    skills: [grammar, listening, speaking]
    tags: [de.konjunktiv2, de.modal-verbs]
    objectives:
      - Use the short Konjunktiv II forms of wissen, geben, kommen, gehen and the modal verbs
      - Ask "Was würdest du machen, wenn …?" and "Was wäre, wenn …?"
      - Talk about dreams and imaginary situations
    intro: |
      A million euros, a time machine, a day of being invisible — "what if" questions are a great way to get people talking. In this lesson a group of friends play a game of *Was wäre, wenn …?*. You will learn the short Konjunktiv II forms that German speakers use for very common verbs: *ich **wüsste**, es **gäbe**, ich **käme**, ich **ginge***.
    vocab: |
      das Gedankenspiel | thought experiment; mind game | n | Lass uns ein Gedankenspiel machen. | Let's do a thought experiment. | g: n | pl: die Gedankenspiele
      gewinnen | to win | v | Was würdest du machen, wenn du eine Million gewinnen würdest? | What would you do if you won a million? | n: Irregular: gewann, hat gewonnen. Lotto spielen = to play the lottery.
      spenden | to donate | v | Ich würde einen Teil des Geldes spenden. | I'd donate part of the money. | n: Noun: die Spende.
      eröffnen | to open (a business) | v | Sie möchte ein kleines Café eröffnen. | She'd like to open a little café. | n: Inseparable: hat eröffnet.
      die Weltreise | trip round the world | n | Nach dem Studium würde ich gern eine Weltreise machen. | After university I'd love to travel round the world. | g: f | pl: die Weltreisen
      unsichtbar | invisible | adj | Was würdest du tun, wenn du unsichtbar wärst? | What would you do if you were invisible?
      auswandern | to emigrate | v | Wenn ich auswandern müsste, ginge ich nach Kanada. | If I had to emigrate, I'd go to Canada. | n: Separable, with sein: ist ausgewandert.
      wählen | to choose; to vote | v | Wenn ich wählen müsste, würde ich Japanisch nehmen. | If I had to choose, I'd take Japanese. | n: Noun: die Wahl (choice; election).
      sich etwas vorstellen | to imagine something | expr | Stell dir vor, du könntest fliegen! | Imagine you could fly! | n: Dative reflexive: ich stelle mir vor, du stellst dir vor.
      die Zeitreise | journey through time | n | Wenn eine Zeitreise möglich wäre, wohin würdest du reisen? | If time travel were possible, where would you go? | g: f | pl: die Zeitreisen
      der Traum | dream | n | Mein großer Traum ist ein Haus am Meer. | My big dream is a house by the sea. | g: m | pl: die Träume | c: ein Traum wird wahr
      verrückt | crazy; mad | adj | Das wäre eine verrückte Idee! | That would be a crazy idea!
    grammar:
      title: "Konjunktiv II of strong and modal verbs: käme, ginge, wüsste, gäbe"
      body: |
        For most verbs, spoken German uses **würde + infinitive** in Konjunktiv II. But some very common verbs have short forms that you will hear and read all the time:

        - **modal verbs**: *könnte, müsste, dürfte, sollte, wollte* (sollte and wollte look like the Präteritum).
        - **wissen → wüsste**, **es gibt → es gäbe**, **kommen → käme**, **gehen → ginge**, **finden → fände**.

        They are formed from the **Präteritum stem** + **umlaut** where possible (a → ä, o → ö, u → ü) + the endings **-e, -est, -e, -en, -et, -en**: *kam → ich käme, wir kämen; ging → ich ginge; gab → es gäbe; wusste → ich wüsste*. Strong verbs never take *-te*.

        Two typical questions: **Was würdest du machen, wenn …?** and **Was wäre, wenn …?** In the answer, both clauses use Konjunktiv II: *Wenn ich unsichtbar wäre, **ginge** ich in die Küche von meinem Lieblingsrestaurant.*
      table: |
        Infinitive | Präteritum | Konjunktiv II (ich/er) | Example
        wissen | wusste | wüsste | Ich wüsste nicht, was ich tun sollte.
        geben | gab | gäbe | Damals gäbe es keine E-Mails.
        kommen | kam | käme | Dann käme ich jeden Tag zu spät.
        gehen | ging | ginge | Ich ginge gern ins Jahr 1920 zurück.
        müssen | musste | müsste | Du müsstest ohne Internet leben.
        dürfen | durfte | dürfte | Wenn ich nur eine Sprache sprechen dürfte …
      examples: |
        Ich wüsste gar nicht, was ich mit so viel Geld machen sollte. | I wouldn't even know what to do with so much money. | wissen → wüsste
        Hm, ich ginge gern ins Jahr 1920 zurück. Da gäbe es noch keine E-Mails! | Hmm, I'd love to go back to 1920. There'd be no emails then! | ginge, gäbe
        Aber da müsstest du ohne Internet und Waschmaschine leben. | But then you'd have to live without the internet and a washing machine. | müssen → müsstest
        Wenn ich Japanisch könnte, würde ich ein Jahr in Osaka arbeiten. | If I could speak Japanese, I'd work in Osaka for a year. | können → könnte
      tip: If you're unsure about a short form, würde + infinitive is always possible — except with sein, haben and the modal verbs, where the short forms are standard.
    dialogue:
      title: Was wäre, wenn …?
      setting: A games evening in a shared flat in Rostock. Selma, Ben and Nils take turns drawing cards with "what if" questions.
      speakers: S=Selma/f; B=Ben/m; N=Nils/m
      lines: |
        S: Okay, nächste Karte: Was würdest du machen, wenn du eine Million Euro gewinnen würdest? | Okay, next card: what would you do if you won a million euros?
        B: Ich würde sofort meinen Job kündigen und eine Weltreise machen. | I'd quit my job immediately and travel round the world.
        N: Echt? Ich wüsste gar nicht, was ich mit so viel Geld machen sollte. | Really? I wouldn't even know what to do with so much money.
        S: Ich würde einen Teil spenden und mit dem Rest ein kleines Café eröffnen. | I'd donate part of it and open a little café with the rest.
        B: Nächste Frage für Nils: Wenn du in einer anderen Zeit leben könntest, welche wäre das? | Next question for Nils: if you could live in another time, which one would it be?
        N: Hm, ich ginge gern ins Jahr 1920 zurück. Da gäbe es noch keine E-Mails! | Hmm, I'd love to go back to 1920. There'd be no emails then!
        S: Aber da müsstest du ohne Internet und Waschmaschine leben. Das wäre nichts für mich. | But you'd have to live without the internet and a washing machine. That wouldn't be for me.
        B: Okay, Selma, jetzt du: Was wäre, wenn du einen Tag unsichtbar wärst? | Okay, Selma, your turn: what if you were invisible for a day?
        S: Dann ginge ich in die Küche von meinem Lieblingsrestaurant und würde alles probieren! | Then I'd go into the kitchen of my favourite restaurant and try everything!
        N: Typisch Selma! Und du, Ben? Welche Sprache würdest du gern sofort perfekt sprechen? | Typical Selma! And you, Ben? Which language would you like to be able to speak perfectly straight away?
        B: Japanisch. Wenn ich Japanisch könnte, würde ich ein Jahr in Osaka arbeiten. | Japanese. If I could speak Japanese, I'd work in Osaka for a year.
        S: Klingt super. Aber jetzt brauchen wir Pizza – wenn ich noch länger warten müsste, würde ich verhungern! | Sounds great. But now we need pizza – if I had to wait any longer, I'd starve!
    pronunciation:
      title: "kam – käme, ging – ginge: the extra syllable"
      body: |
        The short Konjunktiv II forms of strong verbs often differ from the Präteritum only by an **umlaut** and a final **-e**: *kam – käme, gab – gäbe, ging – ginge*. Pronounce the final -e clearly as a schwa [ə] — it is the only signal in *ging – ginge*.

        The umlaut in *käme, gäbe* is a long [ɛː]; in *wüsste, müsste* the ü is short because two consonants follow. Keep the stress on the first syllable: ***KÄ**-me, **GIN**-ge, **WÜSS**-te*.
      items: |
        käme
        ginge
        wüsste
        es gäbe
        Was würdest du machen?
        Was wäre, wenn …?
    culture:
      title: Games night, German style
      body: |
        Board and card games are a big part of free time in Germany. Since 1979 a jury has chosen the *Spiel des Jahres* (game of the year), and every autumn the city of Essen hosts one of the largest games fairs in the world. A *Spieleabend* with friends — with snacks, a few rounds of a board game and sometimes a question game like *Was wäre, wenn …?* — is a classic way to spend a weekend evening.
    mistakes: |
      Wenn ich das wissen würde, würde ich es dir sagen. => Wenn ich das wüsste, würde ich es dir sagen. | Würde wissen is understood, but it sounds clumsy. With wissen, use the short form wüsste.
      Damals gibt es keine E-Mails, wenn wir 1920 leben würden. => Damals gäbe es keine E-Mails, wenn wir 1920 leben würden. | In an unreal condition the main clause needs Konjunktiv II too: es gäbe.
      Dann kämte ich jeden Tag zu spät. => Dann käme ich jeden Tag zu spät. | Strong verbs form Konjunktiv II from the Präteritum stem with an umlaut and -e, never with -te.
    task:
      title: Your "what if" cards
      mode: speaking
      body: |
        Write three "Was würdest du machen, wenn …?" or "Was wäre, wenn …?" questions on cards. Answer each one yourself in two or three sentences, using at least one short form (wüsste, gäbe, käme, ginge, müsste, könnte). Then ask a partner or the AI coach your questions and react to their answers.
    exercises: |
      fill: Ich ___ gar nicht, was ich mit so viel Geld machen sollte. (wissen) || wüsste || Wissen → wüsste (from wusste + umlaut). || @tags de.konjunktiv2
      fill: Wenn du in einer anderen Zeit leben ___, welche wäre das? (können) || könntest || Können → du könntest. || @tags de.konjunktiv2,de.modal-verbs
      fill: Im Jahr 1920 ___ es noch keine E-Mails. (geben) || gäbe || Es gibt → es gäbe (an imagined situation). || @tags de.konjunktiv2
      fill: Wenn ich wählen ___, würde ich Japanisch lernen. (müssen) || müsste || Müssen → ich müsste; the verb goes to the end of the wenn-clause. || @tags de.konjunktiv2,de.modal-verbs
      mc: What is the Konjunktiv II of "ich komme"? || *ich käme | ich kämte | ich komme || Strong verbs: Präteritum stem (kam) + umlaut + -e = käme. || @tags de.konjunktiv2
      mc: "Was ___ du machen, wenn du unsichtbar wärst?" || *würdest | wirst | wurdest || Würdest (with umlaut) = would. Wirst is the future, wurdest the past of werden. || @tags de.konjunktiv2
      rw: Rewrite with the short Konjunktiv II form :: Ich würde die Antwort nicht wissen. || Ich wüsste die Antwort nicht. || Würde wissen → wüsste. || @tags de.konjunktiv2
      tf: Ben would quit his job if he won a million euros. || true || "Ich würde sofort meinen Job kündigen und eine Weltreise machen." || @ctx dialogue
      short: What would Selma do with the money? || kw: café/cafe/kaffee/spenden/donate/spende || She would donate part of it and open a little café. || @ctx dialogue
      listen: @dialogue || Where would Selma go if she were invisible for a day? || *Into the kitchen of her favourite restaurant | To Osaka | Back to the year 1920 || "Dann ginge ich in die Küche von meinem Lieblingsrestaurant und würde alles probieren!"
      listen: Wenn ich auswandern müsste, ginge ich nach Kanada. Dort gäbe es viel Natur, und ich könnte Englisch und Französisch sprechen. || Why would the speaker choose Canada? || Because of the big cities and the weather | *Because of the nature and the two languages | Because her family lives there || "Dort gäbe es viel Natur, und ich könnte Englisch und Französisch sprechen." || @tags de.listening,de.konjunktiv2
      tr: What would you do if you were invisible? || Was würdest du machen, wenn du unsichtbar wärst? | Was würdest du tun, wenn du unsichtbar wärst? | Was würdest du machen, wenn du unsichtbar wärest? | Was würdest du tun, wenn du unsichtbar wärest? || Würdest du + infinitive; in the wenn-clause wärst goes to the end. || @tags de.konjunktiv2
      dict: Ich wüsste gar nicht, was ich mit so viel Geld machen sollte.
      ask: Answer the card: "Was würdest du machen, wenn du ein Jahr nicht arbeiten müsstest?" || kw: würde/wäre/hätte/könnte/ginge/käme/wüsste/müsste || Wenn ich ein Jahr nicht arbeiten müsste, ginge ich nach Südamerika. Ich würde Spanisch lernen und in einem Naturpark helfen.

  - title: Customs and stereotypes
    summary: Read a newcomer's column about German clichés, talk about customs and stereotypes, and express unreal wishes with ich wünschte and wenn … nur.
    minutes: 40
    skills: [reading, grammar, writing]
    tags: [de.konjunktiv2, de.opinion]
    objectives:
      - Express unreal wishes with ich wünschte, … and wenn … nur/doch …!
      - Talk about customs, clichés and your own experience
      - Say politely what is true and what isn't
    intro: |
      Germans are always punctual, serious and a little cold — or are they? In this lesson Kofi, who moved from Ghana to Stuttgart three years ago, writes about the clichés he had in his head and what he found instead. You will also learn to say what you wish were different: *Ich **wünschte**, die Züge **wären** so pünktlich wie meine Kollegen!*
    vocab: |
      das Klischee | cliché; stereotype | n | Das Klischee vom pünktlichen Deutschen kennt jeder. | Everyone knows the cliché of the punctual German. | g: n | pl: die Klischees | n: Also: das Stereotyp.
      das Vorurteil | prejudice | n | Viele Vorurteile verschwinden, wenn man Menschen kennenlernt. | Many prejudices disappear when you get to know people. | g: n | pl: die Vorurteile
      typisch | typical | adj | Was ist für dich typisch deutsch? | What do you think is typically German?
      der Brauch | custom; tradition | n | Kuchen zum eigenen Geburtstag mitzubringen ist ein deutscher Brauch. | Bringing cake on your own birthday is a German custom. | g: m | pl: die Bräuche
      die Gewohnheit | habit | n | Pünktlichkeit ist bei mir inzwischen eine Gewohnheit. | Being punctual has become a habit for me. | g: f | pl: die Gewohnheiten
      die Pünktlichkeit | punctuality | n | Bei Besprechungen ist Pünktlichkeit sehr wichtig. | Punctuality is very important for meetings. | g: f | pl: (no plural)
      die Direktheit | directness | n | An die Direktheit musste ich mich erst gewöhnen. | I had to get used to the directness first. | g: f | pl: (no plural)
      höflich | polite | adj | Bei uns würde man das viel höflicher sagen. | Where I'm from, people would say that much more politely. | n: Opposite: unhöflich. Noun: die Höflichkeit.
      kühl | cool; reserved | adj | Am Anfang fand ich die Leute etwas kühl. | At first I found people a bit reserved.
      die Freundlichkeit | friendliness | n | Die Freundlichkeit kommt langsamer, aber sie bleibt. | The friendliness comes more slowly, but it lasts. | g: f | pl: (rarely used)
      spontan | spontaneous; spontaneously | adj | Hier besucht man Freunde selten spontan. | People here rarely visit friends spontaneously. | n: Noun: die Spontaneität.
      die Wirklichkeit | reality | n | Stereotype zeigen nur einen kleinen Teil der Wirklichkeit. | Stereotypes only show a small part of reality. | g: f | pl: die Wirklichkeiten (rare)
    grammar:
      title: "Unreal wishes: Ich wünschte, … and Wenn … nur …!"
      body: |
        To wish that something were different **now**, German uses Konjunktiv II. There are two common patterns:

        - **Ich wünschte, …** + a clause with normal word order and Konjunktiv II: *Ich **wünschte**, die Züge **wären** pünktlicher.* *Ich wünschte, ich **könnte** spontan vorbeikommen.* (Wünschte is itself Konjunktiv II; it looks like the Präteritum.)
        - **Wenn … doch / nur / bloß …!** — an exclamation with the verb at the end: *Wenn ich **nur** mehr Zeit **hätte**!* The little words *doch, nur, bloß* mark it as a wish. You can also start with the verb: ***Hätte** ich **doch** mehr Zeit!*

        Compare with a **real wish** about the future, which uses the indicative: *Ich hoffe, dass der Zug pünktlich ist.* *Ich wünsche mir, dass du kommst.*
      table: |
        Pattern | Example | Meaning
        Ich wünschte, + Konjunktiv II | Ich wünschte, ich hätte einen Garten. | I wish I had a garden.
        Ich wünschte, + Konjunktiv II | Ich wünschte, die Sonne würde öfter scheinen. | I wish the sun shone more often.
        Wenn … nur/doch + verb at the end! | Wenn ich nur spontan vorbeikommen könnte! | If only I could drop by spontaneously!
        Verb first + doch/nur! | Wäre es doch schon Sommer! | If only it were summer already!
        real wish (indicative) | Ich hoffe, dass du bald kommst. | I hope you come soon.
      examples: |
        Manchmal wünschte ich, die Züge wären so pünktlich wie meine Kollegen! | Sometimes I wish the trains were as punctual as my colleagues! | ich wünschte + wären
        Wenn ich meine Freunde nur einmal ohne Termin besuchen könnte! | If only I could visit my friends just once without an appointment! | wenn … nur + könnte at the end
        Ich wünschte, ich könnte besser Schwäbisch verstehen. | I wish I could understand Swabian better. | ich wünschte + könnte
        Hätte ich doch mehr Urlaub! | If only I had more holiday! | verb first + doch
      tip: In "Ich wünschte, …" the second part keeps normal word order (verb in position 2). Only the wenn-version sends the verb to the end.
    reading:
      title: Typisch deutsch? Drei Jahre, drei Überraschungen
      text: |
        Bevor ich nach Stuttgart kam, hatte ich ein klares Bild von den Deutschen: pünktlich, ernst und ein bisschen kühl. Nach drei Jahren weiß ich: Manches davon stimmt, vieles nicht.

        Erstens: die Pünktlichkeit. Ja, meine Kolleginnen und Kollegen kommen zu Besprechungen wirklich auf die Minute. Aber die Bahn? Die hat mir gezeigt, dass auch Deutsche warten können. Manchmal wünschte ich, die Züge wären so pünktlich wie meine Kollegen!

        Zweitens: Sind die Deutschen wirklich kühl? Am Anfang dachte ich das. Im Supermarkt lächelte niemand, und mein Nachbar sagte nur „Morgen“. Heute weiß ich: Die Freundlichkeit kommt langsamer, aber sie bleibt. Derselbe Nachbar gießt jetzt meine Pflanzen, wenn ich meine Familie in Accra besuche, und lädt mich im Sommer zum Grillen ein.

        Drittens: die Direktheit. Als meine Chefin sagte: „Die Präsentation ist zu lang“, war ich zuerst schockiert. Bei uns würde man das viel höflicher sagen. Inzwischen finde ich diese Ehrlichkeit praktisch, denn man weiß immer, woran man ist.

        Und was vermisse ich? Die Sonne natürlich – und die Spontaneität. Wenn ich meine deutschen Freunde nur einmal ohne Termin besuchen könnte! Hier plant man sogar einen Kaffee zwei Wochen im Voraus.

        Mein Fazit: Klischees sind wie alte Landkarten. Sie zeigen ein bisschen von der Wirklichkeit, aber den Weg muss man selbst finden. Ich wünschte nur, mehr Menschen würden ihre alten Karten ab und zu wegwerfen.

        Kofi Asante, Stuttgart
      translation: |
        Before I came to Stuttgart, I had a clear picture of the Germans: punctual, serious and a little cold. After three years I know that some of it is true, but a lot of it isn't.

        First: punctuality. Yes, my colleagues really do arrive at meetings on the dot. But the railway? It has shown me that Germans can wait too. Sometimes I wish the trains were as punctual as my colleagues!

        Second: are Germans really cold? At first I thought so. In the supermarket nobody smiled, and my neighbour only said "Morning". Today I know that the friendliness comes more slowly, but it lasts. The same neighbour now waters my plants when I visit my family in Accra, and invites me to barbecues in the summer.

        Third: directness. When my boss said, "The presentation is too long," I was shocked at first. Where I come from, people would say that much more politely. By now I find this honesty practical, because you always know where you stand.

        And what do I miss? The sun, of course – and spontaneity. If only I could visit my German friends just once without an appointment! Here people even plan a coffee two weeks in advance.

        My conclusion: clichés are like old maps. They show a little of reality, but you have to find the way yourself. I only wish more people would throw away their old maps now and then.

        Kofi Asante, Stuttgart
    pronunciation:
      title: "Wishes and exclamations: stress on nur and doch"
      body: |
        In an exclamation like *Wenn ich **NUR** mehr Zeit hätte!*, the little word **nur**, **doch** or **bloß** carries a strong stress, and the sentence ends with a clear fall in the voice. It sounds emotional, not neutral.

        In *Ich wünschte, …* the stress falls on the important new information: *Ich wünschte, die Züge wären **PÜNKT**licher.* In *wünschte*, say the ü short and the **sch** before the **t**: [ˈvʏnʃtə].
      items: |
        ich wünschte
        die Pünktlichkeit
        die Direktheit
        Wenn ich nur mehr Zeit hätte!
        Hätte ich doch mehr Urlaub!
        Ich wünschte, die Züge wären pünktlicher.
    culture:
      title: A few German customs
      body: |
        Some customs surprise newcomers. On your **own birthday** you often bring cake for your colleagues, and many people believe it brings bad luck to congratulate someone *before* their birthday. Sunday is a **quiet day**: in many buildings you shouldn't drill or mow the lawn. At work, people may greet each other at lunchtime with *Mahlzeit!*, and at a party it's normal to bring something to drink or a salad.

        Of course, no custom is true for everyone — there are big differences between regions, generations and families. The best way to find out is to ask: *Wie macht man das hier?*
    mistakes: |
      Ich wünschte, die Züge sind pünktlicher. => Ich wünschte, die Züge wären pünktlicher. | An unreal wish needs Konjunktiv II: wären, not sind.
      Wenn ich nur mehr Zeit habe! => Wenn ich nur mehr Zeit hätte! | A wish that isn't true now needs Konjunktiv II: hätte.
      Wenn ich nur hätte mehr Zeit! => Wenn ich nur mehr Zeit hätte! | In the wenn-version, the conjugated verb goes to the end.
    task:
      title: Your column
      mode: writing
      body: |
        Write a short column (90–110 words) for a magazine for newcomers: choose one cliché about Germany or about your own country. Explain what is true and what isn't from your own experience, and finish with one or two unreal wishes (Ich wünschte, … / Wenn … nur …!).
    exercises: |
      fill: Ich wünschte, die Züge ___ so pünktlich wie meine Kollegen. (sein) || wären || An unreal wish: ich wünschte + Konjunktiv II; plural die Züge → wären. || @tags de.konjunktiv2
      fill: Wenn ich nur mehr Zeit ___! (haben) || hätte || Wenn … nur + Konjunktiv II, with the verb at the end. || @tags de.konjunktiv2,de.subordinate-clauses
      fill: Ich wünschte, ich ___ besser Schwäbisch verstehen. (können) || könnte || Ich wünschte + könnte; the infinitive verstehen goes to the end. || @tags de.konjunktiv2,de.modal-verbs
      mc: Choose the correct wish. || Ich wünschte, ich habe mehr Freunde hier. | *Ich wünschte, ich hätte mehr Freunde hier. | Ich wünschte, ich hätte mehr Freunde hier haben. || The wish is unreal, so it needs hätte; there is no second infinitive. || @tags de.konjunktiv2
      mc: "Wenn ich ___ einmal ohne Termin vorbeikommen könnte!" || *doch | aber | denn || Doch (like nur and bloß) marks a wish in an exclamation. Aber and denn don't work here. || @tags de.konjunktiv2
      rw: Turn it into a wish starting with "Ich wünschte, …" :: Ich habe keinen Garten. || Ich wünschte, ich hätte einen Garten. || The opposite of reality (keinen → einen) + Konjunktiv II: hätte. || @tags de.konjunktiv2
      rw: Turn it into a wish with "Wenn … nur …!" :: Die Sonne scheint nicht. || Wenn die Sonne nur scheinen würde! | Wenn nur die Sonne scheinen würde! | Wenn die Sonne doch scheinen würde! | Wenn die Sonne nur scheinen würde. || Wenn + nur + würde + infinitive, with würde at the end. || @tags de.konjunktiv2
      tf: Kofi thinks that all the clichés about Germans are true. || false || "Manches davon stimmt, vieles nicht." || @ctx reading
      mc: How has Kofi's relationship with his neighbour changed? || *The neighbour now waters his plants and invites him to barbecues. | The neighbour has moved away. | The neighbour no longer says hello. || "Derselbe Nachbar gießt jetzt meine Pflanzen … und lädt mich im Sommer zum Grillen ein." || @ctx reading @skill reading
      short: What does Kofi miss in Germany? || kw: sonne/sun/spontan/spontaneität/spontaneity/spontaneous || The sun — and spontaneity. || @ctx reading
      listen: In meiner Heimat isst man mit der ganzen Familie, und alle reden gleichzeitig. Hier ist es beim Essen viel ruhiger. Manchmal wünschte ich, es wäre ein bisschen lauter! || What does the speaker sometimes wish? || That meals were shorter | *That meals were a bit louder | That the family ate together more often || "Manchmal wünschte ich, es wäre ein bisschen lauter!" || @tags de.listening,de.konjunktiv2
      tr: I wish I could speak German better. || Ich wünschte, ich könnte besser Deutsch sprechen. | Ich wünschte, ich könnte Deutsch besser sprechen. | Ich wünschte, ich könnte besser Deutsch. | Ich wünschte, ich spräche besser Deutsch. || Ich wünschte + könnte + infinitive at the end. || @tags de.konjunktiv2
      dict: Ich wünschte, ich hätte mehr Zeit für meine Freunde.
      say: Wenn ich nur einmal ohne Termin vorbeikommen könnte! || If only I could drop by just once without an appointment!
      write: Write a short column (80–100 words) about a cliché. Say what is true and what isn't, and add at least one unreal wish. || min=60 || req: klischee/vorurteil/typisch | stimmt/nicht | ich wünschte/wenn … nur/wenn … doch || Man sagt, die Deutschen haben keinen Humor. Das ist ein Klischee, das nicht stimmt. Meine Kollegen in Hamburg lachen sehr viel, aber ihr Humor ist oft trocken und ironisch. Am Anfang habe ich viele Witze nicht verstanden, weil die Leute dabei ganz ernst schauen. Heute finde ich das wunderbar. Typisch deutsch ist für mich eher die Liebe zu Regeln. Manchmal wünschte ich, die Leute wären ein bisschen lockerer – zum Beispiel an einer roten Ampel um drei Uhr nachts!
