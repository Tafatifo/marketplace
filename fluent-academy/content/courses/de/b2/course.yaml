language: de
level: B2
title: "German B2 · Fluency"
description: Speak and write German with confidence and nuance — discuss identity, work, science, the environment, media, culture and public life, argue a case and handle formal situations.
hours: 120
summary: >-
  B2 learners can follow the main ideas of complex texts on concrete and abstract topics, take part in discussions
  and negotiations with native speakers without strain for either side, and write clear, detailed texts that weigh up
  different viewpoints. This course delivers around 120 hours of guided practice across 8 units, moving from personal
  identity to public debate and from spontaneous conversation to formal writing.
objectives:
  - Discuss identity, belonging and generations with accurate adjective endings and a compact nominal style
  - Negotiate and talk about work and consumption, including unreal past situations with Konjunktiv II
  - Explain developments in science, technology and medicine with the passive and its alternatives
  - Weigh up environmental policies and solutions using two-part connectors and je… desto
  - Report what others say with Konjunktiv I and evaluate news, advertising and opinion pieces critically
  - Talk about art, heritage and humour using the genitive and genitive prepositions
  - Deal with public authorities and write formal letters and complaints in an appropriate register
  - Speculate about the future, reflect on regrets and present a structured argument
canDo:
  listening:
    - Follow longer talks, interviews and podcasts in standard German, including the speaker's line of argument
    - Understand news reports and current-affairs discussions on familiar and less familiar topics
  reading:
    - Read articles, reports and commentaries on current issues and identify the writer's position and reasoning
    - Understand opinion pieces and personal essays, including attitudes that are only implied
  spokenInteraction:
    - Take part in discussions and negotiations with native speakers fluently enough that neither side has to make a special effort
    - Defend your point of view, react to counter-arguments and find a compromise
  spokenProduction:
    - Give clear, detailed descriptions and short presentations on a wide range of topics
    - Explain your view on a current issue and set out the advantages and disadvantages of different options
  writing:
    - Write clear, well-structured texts such as opinion pieces, reports and blog posts that argue for or against a position
    - Write formal letters and complaints in an appropriate register with standard conventions
grammar:
  - Adjective endings in all declension patterns; adjectives used as nouns
  - "Nominal style: nominalised infinitives, derived nouns and prepositional phrases instead of clauses"
  - Konjunktiv II past (hätte/wäre + Partizip II), with modal verbs and in als-ob comparisons
  - The passive in all tenses, with modal verbs, and the Zustandspassiv
  - Alternatives to the passive (man, sich lassen, sein + zu, adjectives in -bar)
  - Two-part connectors (zwar… aber, nicht nur… sondern auch, weder… noch, je… desto)
  - Connectors of consequence, contrast and concession (sodass, während, wohingegen, dennoch)
  - Konjunktiv I for reported speech, including past and substitute forms
  - Reporting claims with sollen, wollen, laut and zufolge
  - The genitive, genitive prepositions and the relative pronouns dessen and deren
  - Formal letters, Nominalisierung and noun–verb collocations (Funktionsverbgefüge)
  - Futur II for completed actions and assumptions about the past
  - Regrets and verb-first conditionals with Konjunktiv II past
vocabularyDomains:
  - Identity, belonging and generations
  - Multilingualism and migration
  - Work, the economy and negotiation
  - Consumption and sustainability
  - Science, technology, artificial intelligence and medicine
  - Climate policy and urban development
  - Media, advertising and argumentation
  - Art, cultural heritage and humour
  - Rights, public services and administration
  - Predictions, life lessons and presentations
assessment: A 60-minute cumulative test covering grammar, vocabulary, reading and listening from all eight units, with a formal writing task. A score of 70% or more confirms the B2 level.
units:
  - title: Identität und Gesellschaft
    theme: Identity and society
    lessons: [Identity and belonging, Generations, Living between languages]
  - title: Arbeit und Wirtschaft
    theme: Work and the economy
    lessons: [The future of work, Negotiating, Consumer society]
  - title: Wissenschaft und Technik
    theme: Science and technology
    lessons: [Innovation and ethics, Artificial intelligence, Health and medicine in the news]
  - title: Umwelt und Klima
    theme: Environment
    lessons: [Climate policy, Sustainable cities, Debating solutions]
  - title: Medien und Meinungsbildung
    theme: Media and persuasion
    lessons: [Misinformation and media literacy, Advertising and persuasion, Writing an opinion piece]
  - title: Kunst und Kultur
    theme: Arts and culture
    lessons: [Talking about art, Cultural heritage, Humour and wordplay]
  - title: Rechte, Pflichten und Behörden
    theme: Citizenship and public life
    lessons: [Rights and responsibilities, Public services, Formal complaints]
  - title: Der Blick nach vorn
    theme: Looking ahead
    lessons: [Predictions and speculation, Regrets and lessons learned, Presenting an argument]
assessmentItems: |
  fill: Sie ist in einem ___ Dorf an der Ostsee aufgewachsen. (klein) || kleinen || After einem (dative neuter) the adjective takes -en: in einem kleinen Dorf. || @tags de.adjective-endings @hint klein @obj Discuss identity, belonging and generations with accurate adjective endings and a compact nominal style
  mc: Which phrase means "when I arrived"? || *bei meiner Ankunft | bei meinem Ankunft | beim meiner Ankunft || Ankunft is feminine, so bei + dative gives bei meiner Ankunft; beim already contains the article dem. || @tags de.dative,de.vocabulary
  mc: "If we had invested earlier, we would have saved money." || *Wenn wir früher investiert hätten, hätten wir Geld gespart. | Wenn wir früher investiert haben, hätten wir Geld gespart. | Wenn wir früher investieren würden, hätten wir Geld gespart. || An unreal situation in the past needs Konjunktiv II past (hätte + participle) in both clauses. || @tags de.konjunktiv2 @obj Negotiate and talk about work and consumption, including unreal past situations with Konjunktiv II
  short: In a negotiation, how could you politely ask whether a lower price would be possible? || kw: preis/rabatt/nachlass/günstiger/entgegenkommen & wäre/könnten/würden/hätten || For example: Wäre bei diesem Preis noch etwas möglich? / Könnten Sie uns beim Preis etwas entgegenkommen? || @tags de.konjunktiv2,de.register @skill speaking
  mc: Die neue Brücke ___ im Jahr 1998 eröffnet. || *wurde | hat | ist geworden || The Präteritum passive is wurde + Partizip II. "Hat" cannot form the passive, and the Perfekt passive would be "ist … eröffnet worden". || @tags de.passive @obj Explain developments in science, technology and medicine with the passive and its alternatives
  fill: Der Impfstoff ist inzwischen in vielen Ländern zugelassen ___. || worden || In the Perfekt passive, werden appears as worden (not geworden): ist zugelassen worden. || @tags de.passive
  rw: Rewrite with "sich lassen" :: Dieses Problem kann leicht gelöst werden. || Dieses Problem lässt sich leicht lösen. || "kann + passive infinitive" can be replaced by sich lassen + infinitive: lässt sich lösen. || @tags de.passive
  mc: Je mehr Menschen das Fahrrad nehmen, ___ besser wird die Luft in der Stadt. || *desto | dann | als || Je + comparative is answered by desto (or umso) + comparative. || @tags de.connectors,de.comparatives @obj Weigh up environmental policies and solutions using two-part connectors and je… desto
  fill: Das Förderprogramm ist ___ teuer, aber es spart langfristig viel Energie. || zwar || Zwar… aber concedes one point and then introduces the stronger counterpoint. || @tags de.connectors
  mc: Which is the correct indirect speech for „Ich habe keine Zeit“, sagte die Ministerin? || *Die Ministerin sagte, sie habe keine Zeit. | Die Ministerin sagte, sie hat keine Zeit gehabt. | Die Ministerin sagte, ich habe keine Zeit. || Konjunktiv I keeps the tense of the original (present → habe) and the pronoun changes from ich to sie. || @tags de.konjunktiv1 @obj Report what others say with Konjunktiv I and evaluate news, advertising and opinion pieces critically
  listen: Die Sprecherin betonte, das Unternehmen habe die Daten seiner Kundinnen und Kunden nie weitergegeben und werde eng mit den Behörden zusammenarbeiten. || What did the spokeswoman claim? || The company sold its customers' data | *The company never passed on its customers' data | The authorities refused to cooperate || "Habe … nie weitergegeben" reports her claim that the data was never passed on; "werde … zusammenarbeiten" reports the promise to cooperate. || @tags de.konjunktiv1,de.listening
  mc: Die Ausstellung musste ___ eines Wasserschadens geschlossen werden. || *wegen | trotz | statt || Water damage is the reason for the closure, so the genitive preposition wegen fits; trotz (despite) and statt (instead of) make no sense here. || @tags de.genitive,de.prepositions @obj Talk about art, heritage and humour using the genitive and genitive prepositions
  fill: Das ist die Malerin, ___ Bilder gerade in Dresden ausgestellt werden. || deren || A possessive relative pronoun referring to a feminine noun (die Malerin) is deren ("whose"). || @tags de.genitive,de.relative-clauses
  mc: How do you open a formal letter when you don't know the recipient's name? || *Sehr geehrte Damen und Herren, | Liebe Damen und Herren, | Hallo zusammen, || Sehr geehrte Damen und Herren is the standard formal opening; liebe and hallo are for people you know. || @tags de.formal-writing @obj Deal with public authorities and write formal letters and complaints in an appropriate register
  rw: Use a noun phrase with "wegen" :: Weil die Mieten gestiegen sind, ziehen viele Familien weg. || Wegen der gestiegenen Mieten ziehen viele Familien weg. | Wegen der steigenden Mieten ziehen viele Familien weg. | Wegen steigender Mieten ziehen viele Familien weg. | Wegen des Anstiegs der Mieten ziehen viele Familien weg. || The weil-clause becomes wegen + genitive; the verb gestiegen becomes an adjective (der gestiegenen Mieten) or a noun (des Anstiegs). || @tags de.genitive,de.formal-writing
  mc: Read the notice — „Aufgrund von Bauarbeiten bleibt das Bürgerbüro vom 3. bis 7. März geschlossen. Anträge können in dieser Zeit online gestellt werden.“ What can you do that week? || Visit the office in the mornings | *Submit applications online | Collect documents at a side entrance || "Anträge können online gestellt werden" — applications can be submitted online while the office is closed. || @tags de.reading,de.passive @skill reading
  mc: "By 2035 the city will have built ten new schools." || *Bis 2035 wird die Stadt zehn neue Schulen gebaut haben. | Bis 2035 hat die Stadt zehn neue Schulen bauen werden. | Bis 2035 würde die Stadt zehn neue Schulen gebaut. || Futur II = werden + Partizip II + haben/sein, here: wird … gebaut haben. || @tags de.futur @obj Speculate about the future, reflect on regrets and present a structured argument
  fill: ___ ich doch nur früher mit dem Sparen angefangen! || Hätte / hätte || A regret about the past: Hätte (verb first) + doch/nur + participle. || @tags de.konjunktiv2
  listen: Nach Angaben der Stadt sollen die neuen Radwege bis zum Jahresende fertig sein, die Bauarbeiten am Bahnhof dauern dagegen noch zwei Jahre. || What does the city say about the cycle paths? || They are already finished | *They should be ready by the end of the year | They will take another two years || "Sollen bis zum Jahresende fertig sein" — they are expected to be ready by the end of the year; the two years refer to the station works. || @tags de.modal-verbs,de.listening
  tr: The new law was passed last year. || Das neue Gesetz wurde letztes Jahr verabschiedet. | Das neue Gesetz wurde im letzten Jahr verabschiedet. | Das neue Gesetz wurde voriges Jahr verabschiedet. | Das neue Gesetz wurde vergangenes Jahr verabschiedet. | Letztes Jahr wurde das neue Gesetz verabschiedet. | Im letzten Jahr wurde das neue Gesetz verabschiedet. | Das neue Gesetz ist letztes Jahr verabschiedet worden. | Das neue Gesetz ist im letzten Jahr verabschiedet worden. || Passive Präteritum (wurde verabschiedet) or Perfekt (ist verabschiedet worden); "to pass a law" is ein Gesetz verabschieden. || @tags de.passive
  write: Write a formal e-mail (at least 100 words) to a train company complaining about a cancelled connection — describe what happened, explain the consequences for you and say what you expect. || min=100 || req: Sehr geehrte | Mit freundlichen Grüßen | bitte/bitten/erwarte/fordere | Erstattung/erstatten/Entschädigung || Sehr geehrte Damen und Herren, am 14. Mai sollte ich mit dem ICE 578 um 7:12 Uhr von Kassel nach Frankfurt fahren. Der Zug ist jedoch ohne Ankündigung ausgefallen, und der nächste Zug hatte über eine Stunde Verspätung. Dadurch habe ich einen wichtigen Termin bei einem Kunden verpasst, der nicht verschoben werden konnte. Obwohl ich mich am Schalter erkundigt habe, konnte mir niemand eine Auskunft über alternative Verbindungen geben. Ich bitte Sie daher um die Erstattung des Fahrpreises sowie um eine Erklärung, warum die Fahrgäste nicht rechtzeitig informiert wurden. Eine Kopie meiner Fahrkarte finden Sie im Anhang. Mit freundlichen Grüßen, Samira Haddad
