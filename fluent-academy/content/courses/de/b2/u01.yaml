unit: 1
title: Identität und Gesellschaft
theme: Identity and society
description: Talk about identity, belonging and generations with accurate adjective endings, adjectives used as nouns and a more compact nominal style.
free: true
objectives:
  - Use adjective endings correctly after der-words, after ein-words and without an article
  - Compare generations using adjectives and participles as nouns (die Älteren, ein Jugendlicher, etwas Neues)
  - Talk and write about living with several languages in a compact nominal style
canDo:
  - I can explain what home and belonging mean to me, using precise descriptions.
  - I can compare the experiences and attitudes of different generations.
  - I can talk about growing up or living with more than one language.
  - I can turn time clauses into compact noun phrases such as bei meiner Ankunft or nach dem Umzug.
review: |
  fill: In unserem Viertel wohnen Menschen aus vielen ___ Ländern. (verschieden) || verschiedenen || After vielen the adjective takes the same strong ending: dative plural -en. || @tags de.adjective-endings
  fill: Ein ___ von mir lebt seit zehn Jahren in Kanada. (bekannt) || Bekannter || A nominalised adjective after ein (masculine nominative) ends in -er and is written with a capital letter. || @tags de.adjective-endings
  fill: Wir haben den Abend mit etwas ___ beendet – einem Spaziergang am Rhein. (schön) || Schönem || After etwas the adjective becomes a neuter noun with a strong ending; mit requires the dative, so -em. || @tags de.adjective-endings,de.dative
  mc: Choose the correct phrase. „Sie spricht Deutsch mit einem ___ Akzent.“ || *leichten | leichtem | leichter || After einem the dative is already shown by the article, so the adjective takes the weak ending -en. || @tags de.adjective-endings
  rw: Use nominal style (nach + noun) :: Nachdem ich die Schule gewechselt hatte, fühlte ich mich lange fremd. || Nach dem Schulwechsel fühlte ich mich lange fremd. | Nach meinem Schulwechsel fühlte ich mich lange fremd. || The clause "nachdem ich die Schule gewechselt hatte" becomes the noun phrase nach dem/meinem Schulwechsel. || @tags de.prepositions,de.writing
  tr: She grew up in a bilingual family. || Sie ist in einer zweisprachigen Familie aufgewachsen. | Sie wuchs in einer zweisprachigen Familie auf. || In einer (dative feminine) + weak ending -en; aufwachsen forms the Perfekt with sein. || @tags de.adjective-endings,de.perfekt-sein
  listen: Meine Großeltern sprechen nur Plattdeutsch. Als Kind habe ich sie kaum verstanden, aber heute bin ich stolz auf diese alte Sprache. || How does the speaker feel about Low German today? || She still can't understand it at all. | *She is proud of it. | She has never heard it spoken. || "Aber heute bin ich stolz auf diese alte Sprache." || @tags de.listening,de.adjective-endings
  listen: Die meisten Jugendlichen in unserem Verein trainieren dreimal pro Woche und helfen am Wochenende bei den Turnieren für die Kleinen. || What do the young people do at weekends? || They train three times. | *They help at tournaments for the younger children. | They play in tournaments abroad. || "… und helfen am Wochenende bei den Turnieren für die Kleinen" — die Kleinen = the little ones. || @tags de.listening,de.adjective-endings
  ask: A colleague asks you: „Was bedeutet Heimat für dich?“ Answer with at least three adjective + noun phrases. || kw: heimat/zuhause/zu hause/ort/gefühl/sprache/menschen/familie & vertraut/klein/alt/gut/eng/bestimmt/eigen/schön/groß || Für mich ist Heimat kein bestimmter Ort, sondern ein vertrautes Gefühl. Ich fühle mich da zu Hause, wo meine engen Freunde sind und wo ich meine eigene Sprache sprechen kann.
  write: Write a forum comment (70–90 words) on the question „Kann man mehr als eine Heimat haben?“ Give your opinion and an example from your own life or from someone you know. || min=60 || req: heimat | weil/denn/deshalb/obwohl/trotzdem | einem/einer/einen/meinem/meiner/meinen || Ich bin überzeugt, dass man mehr als eine Heimat haben kann. Meine Mutter ist in einem kleinen Dorf in Kroatien aufgewachsen und lebt seit dreißig Jahren in Stuttgart. Wenn sie im Sommer an die Adria fährt, sagt sie: „Ich fahre nach Hause.“ Trotzdem fühlt sie sich auch in Stuttgart zu Hause, denn hier wohnen ihre Kinder und ihre besten Freundinnen. Heimat ist für mich deshalb kein einzelner Ort, sondern ein Netz aus vertrauten Menschen, Sprachen und Erinnerungen.
lessons:
  - title: Identity and belonging
    summary: Talk about where you come from, what home means and where you feel you belong — with adjective endings after der, after ein and without an article.
    minutes: 45
    skills: [grammar, listening, speaking]
    tags: [de.adjective-endings, de.opinion]
    objectives:
      - Use all three patterns of adjective endings (after der-words, after ein-words, without an article)
      - Talk about home, roots and belonging with abstract vocabulary
      - Ask tactful questions about someone's background and react to them
    intro: |
      Questions of identity — *Where are you from? Where do you belong? What does home mean to you?* — are part of everyday conversation in a diverse society, and they call for precise description: *ein **kleines** Dorf, meine **engen** Freunde, ein **vertrautes** Gefühl*. At B1 you practised adjective endings after the definite article. Now you will master all three patterns, so that you can describe people and places fluently without stopping to think about every ending.
    vocab: |
      die Zugehörigkeit | belonging; sense of belonging | n | Im Chor habe ich zum ersten Mal ein Gefühl von Zugehörigkeit erlebt. | In the choir I experienced a sense of belonging for the first time. | g: f | pl: (no plural) | c: ein Gefühl von Zugehörigkeit; die Zugehörigkeit zu einer Gruppe
      sich zugehörig fühlen | to feel that one belongs | expr | Nach drei Jahren fühle ich mich in Leipzig wirklich zugehörig. | After three years I really feel that I belong in Leipzig.
      die Heimat | home; homeland | n | Für viele Menschen ist Heimat eher ein Gefühl als ein Ort. | For many people home is more a feeling than a place. | g: f | pl: die Heimaten (rare) | n: Has emotional overtones (landscape, dialect, childhood) that "home" or "homeland" don't fully capture.
      die Herkunft | origin; background | n | Meine Herkunft spielt bei der Arbeit kaum eine Rolle. | My background hardly plays a role at work. | g: f | pl: (no plural in this sense) | c: die soziale Herkunft; unabhängig von der Herkunft
      die Wurzel | root | n | Meine Wurzeln liegen in einem kleinen Dorf in Ostfriesland. | My roots are in a small village in East Frisia. | g: f | pl: die Wurzeln | c: seine Wurzeln kennen; Wurzeln schlagen (to put down roots)
      prägen | to shape; to leave a mark on | v | Die Jahre in Lissabon haben meinen Blick auf Europa stark geprägt. | The years in Lisbon strongly shaped the way I see Europe. | c: geprägt sein von + dat. | n: Noun: die Prägung.
      das Vorurteil | prejudice | n | Viele Vorurteile verschwinden, wenn man sich persönlich kennenlernt. | Many prejudices disappear when people get to know each other personally. | g: n | pl: die Vorurteile | c: Vorurteile gegenüber + dat.; mit Vorurteilen aufräumen
      ausgrenzen | to exclude; to marginalise | v | In der Grundschule haben mich einige Kinder ausgegrenzt, weil ich anders sprach. | At primary school some children excluded me because I spoke differently. | n: Separable. Noun: die Ausgrenzung.
      die Gemeinschaft | community | n | Die kleine Gemeinschaft im Dorf hat uns sofort aufgenommen. | The small village community welcomed us straight away. | g: f | pl: die Gemeinschaften | n: Compound: die Dorfgemeinschaft.
      vielfältig | diverse; varied | adj | Unsere Nachbarschaft ist sehr vielfältig: Hier wohnen Menschen aus über vierzig Ländern. | Our neighbourhood is very diverse: people from more than forty countries live here. | n: Noun: die Vielfalt.
      vertraut | familiar | adj | Der vertraute Geruch von frischem Brot erinnert mich an meine Kindheit. | The familiar smell of fresh bread reminds me of my childhood. | c: mit etwas vertraut sein (to be familiar with something)
      ankommen | to arrive; to settle in | v | Nach einem Jahr bin ich in der neuen Stadt endlich richtig angekommen. | After a year I have finally really settled into the new city. | n: Figurative use: to feel at home somewhere. Perfekt with sein.
    grammar:
      title: "Adjective endings: the three patterns"
      body: |
        An adjective in front of a noun always takes an ending. The guiding principle is simple: **gender and case must be signalled once.** If the article already shows them clearly, the adjective only needs a "weak" ending; if not, the adjective has to carry the signal itself.

        **1. After der, dieser, jeder, welcher, alle, beide (weak endings).** The article does the work, so the adjective takes **-e** in the five "nominative-like" slots (all nominative singular forms, plus feminine and neuter accusative singular) and **-en** everywhere else: *der alt**e** Hafen, mit dem alt**en** Hafen, die alt**en** Häuser, alle neu**en** Nachbarn.*

        **2. After ein, kein and the possessives (mixed endings).** These follow the weak pattern **except** where ein has no ending of its own: masculine nominative and neuter nominative/accusative. There the adjective takes over the signal: *ein klein**er** Ort, ein klein**es** Dorf, mein neu**es** Leben* — but *in einem klein**en** Dorf, meine eng**en** Freunde.*

        **3. No article (strong endings).** If nothing in front shows the case, the adjective takes the ending of the definite article: *mit frisch**em** Brot (dem), bei schlecht**em** Wetter (dem), gut**e** Freunde (die), mit gut**en** Freunden (den).*

        After **viele, einige, mehrere, wenige, ein paar** and numbers there is no proper article, so the adjective is strong: *viele neu**e** Kontakte, mit ein paar gut**en** Freunden.*
      table: |
        Case | after der-words (m / f / n / pl) | after ein-words (m / f / n / pl) | no article (m / f / n / pl)
        Nominative | -e / -e / -e / -en | -er / -e / -es / -en | -er / -e / -es / -e
        Accusative | -en / -e / -e / -en | -en / -e / -es / -en | -en / -e / -es / -e
        Dative | -en / -en / -en / -en | -en / -en / -en / -en | -em / -er / -em / -en
        Genitive | -en / -en / -en / -en | -en / -en / -en / -en | -en / -er / -en / -er
      examples: |
        Ich komme aus einem kleinen Dorf in der Eifel, aber mein neues Zuhause ist Köln. | I come from a small village in the Eifel, but my new home is Cologne. | einem kleinen (dative, mixed) · mein neues (neuter nominative, mixed)
        Das ist der entscheidende Punkt: Heimat entsteht durch enge Beziehungen. | That's the crucial point: home comes from close relationships. | der entscheidende (weak) · durch enge (no article, accusative plural)
        Bei schlechtem Wetter vermisse ich die portugiesische Sonne. | In bad weather I miss the Portuguese sun. | bei schlechtem (no article, dative neuter) · die portugiesische (weak)
        Mit ein paar guten Freunden fühlt man sich überall wohl. | With a few good friends you feel at ease anywhere. | ein paar is invariable, so the adjective is strong: guten
      tip: "Before choosing an ending, ask: has the article already shown gender and case? If yes, -e or -en is enough. If there is no article, or ein has no ending, the adjective has to do the job."
    dialogue:
      title: Woher kommst du – wirklich?
      setting: A neighbourhood street party in Mannheim. Jonas, who moved from a village in the Black Forest three months ago, chats with his neighbour Leyla at the drinks stand.
      speakers: J=Jonas/m; L=Leyla/f
      lines: |
        J: Ich wohne erst seit drei Monaten hier. Bist du eigentlich in Mannheim aufgewachsen? | I've only lived here for three months. Did you actually grow up in Mannheim?
        L: Ja, ich bin ein echtes Mannheimer Kind – in der Neckarstadt geboren und in der Innenstadt zur Schule gegangen. | Yes, I'm a real Mannheim kid – born in Neckarstadt and went to school in the city centre.
        J: Und deine Familie? Entschuldige, wenn die Frage zu persönlich ist. | And your family? Sorry if the question is too personal.
        L: Kein Problem. Meine Eltern sind in den Achtzigern aus einer kleinen Stadt am Schwarzen Meer gekommen. | No problem. My parents came from a small town on the Black Sea in the eighties.
        J: Fragen dich eigentlich viele Leute danach, oder bin ich da gerade ein typischer Fall? | Do a lot of people actually ask you about that, or am I a typical case right now?
        L: Ständig. Die typische Frage ist: „Und woher kommst du wirklich?“ Dabei ist Mannheim eine völlig richtige Antwort. | All the time. The typical question is: "And where are you really from?" Yet Mannheim is a perfectly correct answer.
        J: Bei mir ist es eher umgekehrt: Ich bin hier noch nicht angekommen. Mir fehlt die kleine Dorfgemeinschaft. | With me it's more the other way round: I haven't settled in here yet. I miss the small village community.
        L: Was genau vermisst du denn am meisten an deinem alten Leben im Schwarzwald? | What exactly do you miss most about your old life in the Black Forest?
        J: Im Dorf kannte jeder jeden. Hier grüßt mich im Treppenhaus kaum jemand, nicht einmal die direkten Nachbarn. | In the village everyone knew everyone. Here hardly anyone says hello to me on the stairs, not even the next-door neighbours.
        L: Gib der Stadt eine faire Chance. Mit ein paar guten Freunden fühlt man sich schnell zugehörig. | Give the city a fair chance. With a few good friends you soon feel you belong.
        J: Und was ist Heimat für dich – ein bestimmter Ort, eine Sprache oder bestimmte Menschen? | And what is home for you – a particular place, a language or particular people?
        L: Ehrlich gesagt alles zusammen: das Türkisch von meiner Oma, der Mannheimer Dialekt und der Geruch von frischem Simit. | Honestly, all of it together: my grandma's Turkish, the Mannheim dialect and the smell of fresh simit.
    pronunciation:
      title: "Hearing the endings: -en, -em, -er"
      body: |
        In fast speech the endings **-en** and **-em** are reduced, but they never disappear completely — and they carry the grammar. In *einem kleinen Dorf* the *-en* sounds like a syllabic [n̩] (*klein'n*), while *-em* closes with the lips: [m]. Listen for this difference: *mit frisch**em** Brot* (lips close) – *mit frisch**en** Brötchen* (tongue behind the teeth).

        The ending **-er** is pronounced as a short, dark [ɐ], almost like the *u* in English *but*: *ein typisch**er** Fall*, *ein bestimmt**er** Ort*. Don't pronounce a strong r here.
      items: |
        in einem kleinen Dorf
        mit frischem Simit
        ein typischer Fall
        die direkten Nachbarn
        mit ein paar guten Freunden
        ein echtes Mannheimer Kind
    mistakes: |
      Ich komme aus einem kleinem Dorf. => Ich komme aus einem kleinen Dorf. | After einem the dative is already shown by the article, so the adjective takes the weak ending -en, not -em.
      Das ist ein großes Unterschied. => Das ist ein großer Unterschied. | Unterschied is masculine. After ein (masculine nominative, no ending) the adjective has to show the gender: -er.
      Mit gute Freunde fühlt man sich zu Hause. => Mit guten Freunden fühlt man sich zu Hause. | Without an article, the adjective shows the dative plural itself (-en), and the noun adds -n in the dative plural.
    task:
      title: Where I belong
      mode: speaking
      body: |
        Talk for one to two minutes about what *Heimat* means to you: a place, people, a language, a smell or a dish. Use at least six adjective + noun combinations with different articles (der, ein, no article). Then discuss with the AI coach in the "Expressing an opinion" scenario whether home is a place or a feeling.
    exercises: |
      fill: Wir haben im Urlaub ein sehr ___ Paar aus Graz kennengelernt. (nett) || nettes || Paar is neuter; after ein in the neuter accusative the adjective shows the gender itself: -es. || @tags de.adjective-endings
      fill: Bei ___ Wetter vermisse ich den Sommer in Portugal. (schlecht) || schlechtem || No article: the adjective takes the dative ending of dem, so -em. || @tags de.adjective-endings
      fill: Sie hat ___ Kontakt zu ihrer Familie in Ghana. (eng) || engen || No article, masculine accusative (der Kontakt → den): the adjective takes -en. || @tags de.adjective-endings
      fill: Das ist ein ___ Unterschied: In meiner ___ Heimat war alles viel ruhiger. (groß ; alt) || großer ; alten || Ein + masculine nominative → großer; meiner (dative feminine) already shows the case → alten. || @tags de.adjective-endings
      mc: In Hamburg habe ich viele ___ Menschen kennengelernt. || *interessante | interessanten | interessanter || After viele there is no real article, so the adjective takes the strong ending of die in the accusative plural: -e. || @tags de.adjective-endings
      mc: Alle ___ Kolleginnen und Kollegen waren sehr freundlich zu mir. || neue | *neuen | neuer || Alle behaves like die: the adjective takes the weak plural ending -en. || @tags de.adjective-endings
      tf: Leyla's parents came to Germany in the nineties. || false || They came "in den Achtzigern" — in the eighties. || @ctx dialogue
      short: What does Jonas miss most about his life in the village? || kw: gemeinschaft/community/jeder jeden/everyone knew/kannte/knew/grüßt/greet/nachbarn/neighbours || He misses the small village community where everyone knew everyone; in Mannheim hardly anyone greets him. || @ctx dialogue
      listen: @dialogue || What annoys Leyla? || That people don't understand her dialect | *That people ask where she is "really" from | That her neighbours never say hello || "Die typische Frage ist: Und woher kommst du wirklich? Dabei ist Mannheim eine völlig richtige Antwort."
      listen: Ich habe zwei Jahre in einem winzigen Ort in Norwegen gelebt. Die Winter waren lang und dunkel, trotzdem war das für mich eine sehr glückliche Zeit. || How does the speaker describe the time in Norway? || As a hard time because of the dark winters | *As a very happy time in spite of the long winters | As a short stay in a big city || "Die Winter waren lang und dunkel, trotzdem war das für mich eine sehr glückliche Zeit." || @tags de.listening,de.adjective-endings
      tr: I have a close relationship with my grandmother. || Ich habe eine enge Beziehung zu meiner Großmutter. | Ich habe eine enge Beziehung zu meiner Oma. | Ich habe ein enges Verhältnis zu meiner Großmutter. | Ich habe ein enges Verhältnis zu meiner Oma. || Beziehung is feminine (eine enge), Verhältnis is neuter (ein enges); "with" is zu + dative here. || @tags de.adjective-endings
      dict: Heimat ist für mich kein bestimmter Ort, sondern ein vertrautes Gefühl.
      ask: A new colleague asks: „Wo fühlst du dich eigentlich zu Hause?“ Answer with at least three adjective + noun phrases. || kw: zu hause/zuhause/heimat/wohl/zugehörig & klein/groß/alt/neu/eng/gut/vertraut/bestimmt/eigen/schön || Am meisten zu Hause fühle ich mich in meiner alten Wohnung in Bremen, bei meinen engen Freunden. Aber auch in einem kleinen Café um die Ecke fühle ich mich inzwischen sehr wohl.

  - title: Generations
    summary: Compare the experiences of young and old and talk about prejudices between generations, using adjectives and participles as nouns (die Älteren, ein Jugendlicher, etwas Neues).
    minutes: 45
    skills: [grammar, listening, speaking]
    tags: [de.adjective-endings, de.opinion]
    objectives:
      - Use adjectives and participles as nouns with the correct endings
      - Use etwas, nichts, viel and alles with nominalised adjectives
      - Compare generations and respond to generalisations politely
    intro: |
      "Young people today…", "In our day…" — conversations between generations are full of generalisations. German often talks about groups of people with **adjectives used as nouns**: *die Jugendlichen, die Älteren, ein Erwachsener, die Auszubildenden*. They look like nouns but behave like adjectives, so everything you revised in the last lesson applies. In this lesson you will listen to a radio conversation between a retired shipyard engineer and a trainee nurse and learn to compare generations without falling into clichés.
    vocab: |
      der/die Jugendliche | young person; teenager | n | Viele Jugendliche engagieren sich in Vereinen. | Many young people get involved in clubs. | g: m/f | pl: die Jugendlichen | n: Adjectival noun: ein Jugendlicher, eine Jugendliche, viele Jugendliche.
      der/die Erwachsene | adult | n | Für Erwachsene kostet der Eintritt acht Euro. | Admission costs eight euros for adults. | g: m/f | pl: die Erwachsenen | n: Adjectival noun: ein Erwachsener.
      der/die Auszubildende | trainee; apprentice | n | Unsere Auszubildenden verbringen zwei Tage pro Woche in der Berufsschule. | Our trainees spend two days a week at vocational school. | g: m/f | pl: die Auszubildenden | n: Short form: der/die Azubi (pl. die Azubis).
      der/die Gleichaltrige | person of the same age; peer | n | Mit Gleichaltrigen spricht meine Tochter ganz anders als mit uns. | My daughter talks quite differently with people her own age than with us. | g: m/f | pl: die Gleichaltrigen
      der Rentner | pensioner; retiree | n | Als Rentner hat mein Vater endlich Zeit für den Garten. | As a pensioner my father finally has time for the garden. | g: m | pl: die Rentner | n: Feminine: die Rentnerin. In Rente gehen = to retire.
      die Generation | generation | n | Meine Generation ist mit dem Internet aufgewachsen. | My generation grew up with the internet. | g: f | pl: die Generationen | c: die junge/ältere Generation; über Generationen hinweg
      der Druck | pressure | n | Viele Schülerinnen und Schüler spüren großen Druck vor den Prüfungen. | Many pupils feel great pressure before exams. | g: m | pl: (no plural in this sense) | c: unter Druck stehen; Druck machen
      bezahlbar | affordable | adj | In Großstädten ist bezahlbarer Wohnraum knapp. | In big cities affordable housing is scarce. | n: From bezahlen + -bar (= can be paid).
      ungerecht | unfair | adj | Ich finde es ungerecht, alle Jugendlichen über einen Kamm zu scheren. | I think it's unfair to lump all young people together. | n: Noun: die Ungerechtigkeit. Über einen Kamm scheren = to lump together.
      die Erfahrung | experience | n | Von der Erfahrung der Älteren können wir viel lernen. | We can learn a lot from the experience of older people. | g: f | pl: die Erfahrungen | c: Erfahrungen sammeln; aus Erfahrung
      die Begegnung | encounter; meeting | n | Solche Begegnungen bauen Vorurteile ab. | Encounters like these break down prejudices. | g: f | pl: die Begegnungen | n: From begegnen + dative (to meet, come across).
      der Schichtdienst | shift work | n | Im Krankenhaus arbeitet sie im Schichtdienst. | At the hospital she works shifts. | g: m | pl: (no plural)
    grammar:
      title: "Adjectives as nouns: der Jugendliche, etwas Neues"
      body: |
        Many German words for groups of people are really **adjectives or participles used as nouns**: *jugendlich → der/die Jugendliche, erwachsen → die Erwachsenen, bekannt → ein Bekannter, verwandt → die Verwandten, angestellt → eine Angestellte, auszubildend → die Auszubildenden*. They are written with a capital letter but **keep adjective endings** — exactly the three patterns from the last lesson. So the ending changes with the article: *der Jugendliche* but *ein Jugendlich**er***; *die Erwachsen**en*** but *viele Erwachsen**e***.

        Comparatives work the same way: *die Älteren, die Jüngeren, ein Älterer.* Even *der Deutsche* follows this pattern: *ein Deutsch**er**, eine Deutsch**e***.

        Abstract ideas are expressed with **neuter** nominalised adjectives. After **etwas, nichts, viel, wenig** the ending is strong (**-es**, dative **-em**): *etwas Neu**es**, nichts Besonder**es**, viel Interessant**es**, mit etwas Glück… mit etwas Neu**em***. After **alles** it is weak (**-e**): *alles Gut**e**, alles Wichtig**e***. Superlatives can also become nouns: *das Wichtigste, das Schönste*.
      table: |
        Case | with der / die | with ein / no article
        Nominative masculine | der Jugendliche | ein Jugendlicher
        Nominative feminine | die Jugendliche | eine Jugendliche
        Accusative masculine | den Jugendlichen | einen Jugendlichen
        Nominative plural | die Jugendlichen | viele Jugendliche
        Dative plural | mit den Jugendlichen | mit vielen Jugendlichen
        Neuter (abstract) | das Neue | etwas Neues · nichts Neues
      examples: |
        Ein Bekannter von mir arbeitet seit vierzig Jahren im selben Betrieb. | An acquaintance of mine has worked in the same company for forty years. | ein + masculine nominative: -er
        Viele Erwachsene unterschätzen, wie viel Druck Jugendliche heute spüren. | Many adults underestimate how much pressure young people feel today. | no article, plural: -e
        In der Ausstellung gab es nichts Neues, aber viel Interessantes über die Achtzigerjahre. | There was nothing new in the exhibition, but a lot of interesting material about the eighties. | nichts / viel + strong -es
        Das Wichtigste ist, dass wir einander zuhören. | The most important thing is that we listen to each other. | nominalised superlative
      tip: "Imagine an invisible noun after it: der Jugendliche (Mensch), ein Jugendlicher (Mensch). The ending is the one the adjective would have before that noun."
    dialogue:
      title: Generationen im Gespräch
      setting: "A local radio studio in Rostock. In the series „Generationen im Gespräch“, presenter Sanne Holm talks to Brigitte Peters, 74, a retired shipyard engineer, and Malik Sayed, 19, a trainee nurse."
      speakers: S=Sanne Holm/f; B=Brigitte Peters/f; M=Malik Sayed/m
      lines: |
        S: Herzlich willkommen! Frau Peters, haben es die Jugendlichen heute leichter oder schwerer als Ihre Generation? | Welcome! Ms Peters, do young people have it easier or harder today than your generation did?
        B: In mancher Hinsicht leichter. Wir Älteren hatten weniger Möglichkeiten, aber dafür auch weniger Druck. | In some respects easier. We older people had fewer opportunities, but also less pressure.
        M: Das stimmt. Viele Gleichaltrige in meinem Freundeskreis haben Angst, keine bezahlbare Wohnung zu finden. | That's true. Many people my age among my friends are afraid of not finding an affordable flat.
        B: Als ich jung war, bekam fast jeder Berufsanfänger schnell eine eigene Wohnung. Das kann man sich heute kaum vorstellen. | When I was young, almost everyone starting work got their own flat quickly. You can hardly imagine that today.
        S: Herr Sayed, was ärgert Sie am meisten an den Vorurteilen gegenüber jungen Leuten? | Mr Sayed, what annoys you most about the prejudices against young people?
        M: Dass man uns oft für faul hält. Die meisten Auszubildenden, die ich kenne, arbeiten im Schichtdienst. | That people often think we're lazy. Most of the trainees I know work shifts.
        B: Das finde ich auch ungerecht. Faule und Fleißige gab es schon immer, in jeder Generation. | I think that's unfair too. There have always been lazy people and hard-working people, in every generation.
        S: Und gibt es etwas, das die beiden Generationen voneinander lernen könnten? | And is there something the two generations could learn from each other?
        M: Auf jeden Fall. Frau Peters erzählt so viel Interessantes aus ihren dreißig Jahren auf der Werft. | Definitely. Ms Peters tells so many interesting stories from her thirty years at the shipyard.
        B: Und ich habe von ihm etwas ganz Neues gelernt: Videotelefonie mit meiner Enkelin in Kanada! | And I've learnt something completely new from him: video calls with my granddaughter in Canada!
        S: Das ist doch das Schönste an solchen Begegnungen. Vielen Dank, Ihnen beiden! | That's the best thing about encounters like these. Thank you both very much!
    pronunciation:
      title: "The glottal stop: die | Älteren, ein | Erwachsener"
      body: |
        English and French often link a word ending in a consonant to a following vowel. German doesn't: before a word or stem that begins with a vowel, there is a tiny catch in the throat, the **glottal stop** [ʔ]. Say *die ʔÄlteren, ein ʔErwachsener, etwas ʔInteressantes* — not *ei-nErwachsener*.

        The glottal stop also appears inside compounds and after prefixes: *Gleichʔaltrige, verʔantwortlich, Rentnerʔalltag*. It makes German sound "clipped" to English ears, but it helps listeners hear where words begin.
      items: |
        die Älteren
        ein Erwachsener
        etwas Interessantes
        viele Auszubildende
        die Gleichaltrigen
        Wir Älteren hatten weniger Druck.
    mistakes: |
      Ein Jugendliche hat mir geholfen. => Ein Jugendlicher hat mir geholfen. | After ein (masculine nominative) the nominalised adjective needs -er, just like ein junger Mann.
      Ich habe etwas neues gelernt. => Ich habe etwas Neues gelernt. | After etwas, nichts and viel the adjective becomes a noun: capital letter and the ending -es.
      Die Erwachsene müssen besser zuhören. => Die Erwachsenen müssen besser zuhören. | After die in the plural the ending is -en.
    task:
      title: Between the generations
      mode: interaction
      body: |
        Interview someone from a different generation — a relative, a neighbour or the AI coach in the "Expressing an opinion" scenario. Ask four questions: what was easier or harder when they were your age, which prejudices they hear about their generation, what they would like to learn from the other generation and what the most important thing in life is for them. Use at least four adjectives as nouns (die Jüngeren, die Älteren, etwas Neues, das Wichtigste …).
    exercises: |
      fill: Ein ___ hat mir gestern geholfen, den Weg zum Bahnhof zu finden. (jugendlich) || Jugendlicher || After ein (masculine nominative) the adjectival noun ends in -er and is capitalised. || @tags de.adjective-endings
      fill: In meinem Abendkurs sitzen viele ___, die tagsüber arbeiten. (erwachsen) || Erwachsene || After viele (no real article) the plural ending is strong: -e. || @tags de.adjective-endings
      fill: Hast du in den Ferien etwas ___ erlebt? (spannend) || Spannendes || After etwas the adjective becomes a neuter noun with the strong ending -es. || @tags de.adjective-endings
      mc: Choose the correct sentence. || *Unser Nachbar ist ein Angestellter der Stadtwerke. | Unser Nachbar ist ein Angestellte der Stadtwerke. | Unser Nachbar ist einen Angestellten der Stadtwerke. || Sein takes the nominative; after ein (masculine) the adjectival noun ends in -er. || @tags de.adjective-endings,de.nominative
      mc: Im Fernsehen kommt heute Abend nichts ___. || *Besonderes | Besondere | Besonderen || After nichts the adjective becomes a neuter noun with the strong ending -es. || @tags de.adjective-endings
      tf: Malik thinks most trainees he knows are lazy. || false || He says the opposite: "Die meisten Auszubildenden, die ich kenne, arbeiten im Schichtdienst." || @ctx dialogue
      short: What has Ms Peters learnt from Malik? || kw: video/videotelefonie/videoanruf/telefonie || Video calls with her granddaughter in Canada. || @ctx dialogue
      listen: @dialogue || According to Ms Peters, what was easier for her generation? || Studying abroad | *Getting your own flat when you started work | Finding a job in a hospital || "Als ich jung war, bekam fast jeder Berufsanfänger schnell eine eigene Wohnung."
      listen: Seit einem Jahr wohnt bei mir eine Studentin. Sie zahlt kaum Miete, dafür kauft sie für mich ein und hilft mir im Garten. || What does the student do instead of paying normal rent? || She cooks every evening. | *She does the shopping and helps in the garden. | She teaches the speaker English. || "Dafür kauft sie für mich ein und hilft mir im Garten." || @tags de.listening
      tr: Many young people are worried about the future. || Viele junge Leute machen sich Sorgen um die Zukunft. | Viele junge Menschen machen sich Sorgen um die Zukunft. | Viele Jugendliche machen sich Sorgen um die Zukunft. | Viele junge Leute sorgen sich um die Zukunft. | Viele junge Menschen sorgen sich um die Zukunft. | Viele Jugendliche sorgen sich um die Zukunft. || After viele the adjective is strong (junge); as a noun: viele Jugendliche. "To be worried about" = sich Sorgen machen um + accusative. || @tags de.adjective-endings,de.reflexive
      dict: Die meisten Älteren in unserem Viertel sind erstaunlich aktiv.
      ask: „Was können die Jüngeren von den Älteren lernen – und umgekehrt?“ Give your opinion with at least two examples. || kw: jüngere/jüngeren/älteren/ältere/jugendliche/erwachsene/jungen/alten & lernen/zeigen/erklären/erfahrung/geduld || Die Jüngeren können von den Älteren vor allem Geduld lernen und von ihrer Erfahrung profitieren. Umgekehrt können die Jugendlichen den Älteren viel Neues zeigen, zum Beispiel, wie man online Fahrkarten kauft.

  - title: Living between languages
    summary: Read a personal essay about growing up with two languages and learn to express ideas compactly in nominal style (bei meiner Ankunft, nach dem Umzug, beim Sprechen).
    minutes: 45
    skills: [reading, grammar, writing]
    tags: [de.prepositions, de.writing]
    objectives:
      - Turn time clauses into noun phrases (als ich ankam → bei meiner Ankunft)
      - Use nominalised infinitives with beim, zum and das (beim Lesen, das ständige Wechseln)
      - Talk and write about multilingualism and your own language biography
    intro: |
      Written German loves nouns. Where spoken German says *Als ich in Görlitz ankam, …*, a newspaper or an essay often prefers *Bei meiner Ankunft in Görlitz …*. This **nominal style** (*Nominalstil*) makes texts more compact and is typical of journalism, academic writing and official letters. You will read a personal essay by a teacher who grew up with Polish and German, notice how she uses noun phrases, and learn to use them yourself — without overdoing it.
    vocab: |
      die Mehrsprachigkeit | multilingualism | n | Mehrsprachigkeit ist in vielen Familien ganz normal. | Multilingualism is completely normal in many families. | g: f | pl: (no plural) | n: Adjective: mehrsprachig.
      zweisprachig | bilingual | adj | Unsere Kinder wachsen zweisprachig auf. | Our children are growing up bilingual. | n: Noun: die Zweisprachigkeit.
      wechseln | to switch; to change | v | Mitten im Satz wechselt sie oft ins Englische. | She often switches into English in the middle of a sentence. | c: die Sprache wechseln; ins Deutsche wechseln | n: Noun: der Wechsel; nominalised infinitive: das Wechseln.
      die Ankunft | arrival | n | Bei meiner Ankunft in Wien sprach ich kaum ein Wort Deutsch. | When I arrived in Vienna I spoke hardly a word of German. | g: f | pl: die Ankünfte | n: Nominal style: bei meiner Ankunft = als ich ankam.
      der Umzug | move (to a new home) | n | Nach dem Umzug hat meine Tochter schnell Freunde gefunden. | After the move my daughter quickly made friends. | g: m | pl: die Umzüge | n: From umziehen (to move house).
      die Einschulung | starting school | n | Bei der Einschulung bekommen die Kinder in Deutschland eine Schultüte. | When they start school, children in Germany get a cone of sweets. | g: f | pl: die Einschulungen
      sich weigern | to refuse | v | Mein Sohn weigert sich, mit mir Spanisch zu sprechen. | My son refuses to speak Spanish with me. | c: sich weigern, etwas zu tun
      auffallen | to stand out; to be noticed | v | Mit meinem Akzent falle ich in Bayern sofort auf. | With my accent I stand out immediately in Bavaria. | n: Separable, Perfekt with sein. Mir ist aufgefallen, dass … = I noticed that …
      dazugehören | to belong; to be part of it | v | Als Teenager wollte ich unbedingt dazugehören. | As a teenager I desperately wanted to fit in. | n: Separable: Ich gehöre dazu.
      die Belastung | burden; strain | n | Für manche Eltern ist die zweite Sprache zu Hause eine Belastung. | For some parents the second language at home is a burden. | g: f | pl: die Belastungen
      der Reichtum | wealth; richness | n | Jede Sprache ist ein kultureller Reichtum. | Every language is a cultural treasure. | g: m | pl: die Reichtümer
      pflegen | to cultivate; to look after | v | Wir pflegen unsere Sprache durch Bücher und lange Telefonate mit der Familie. | We keep our language alive through books and long phone calls with the family. | c: eine Sprache pflegen; Kontakte pflegen
      mühsam | laborious; requiring effort | adj | Das Lesen auf Polnisch war für mich lange mühsam. | Reading in Polish was hard work for me for a long time.
    grammar:
      title: "Nominal style: from clauses to noun phrases"
      body: |
        German can express the same idea with a verb in a clause (**verbal style**) or with a noun (**nominal style**). Nominal style is more compact and more formal; it is typical of written texts.

        **1. Prepositional phrases instead of time clauses.** Many common verbs have an established noun: *ankommen → die Ankunft, umziehen → der Umzug, beginnen → der Beginn, einschulen → die Einschulung, wechseln → der Wechsel.* The conjunction becomes a preposition with the dative: **als → bei**, **nachdem → nach**, **bevor → vor**, **seit(dem) → seit**. The subject becomes a possessive: *Als ich ankam → **Bei meiner Ankunft**; Nachdem wir umgezogen waren → **Nach unserem Umzug**.*

        **2. Nominalised infinitives.** Any infinitive can become a neuter noun with a capital letter: *das Lesen, das Wechseln, das Deutschlernen.* With **beim** (= while/when doing) and **zum** (= for doing) they are very common in speech too: *Beim Telefonieren mache ich mehr Fehler. Zum Lesen brauche ich Ruhe.* An adjective in front follows the usual rules: *das ständige Wechseln.*

        **Don't overdo it.** If a real noun exists, use it: *nach dem Umzug*, not *nach dem Umziehen*. And in conversation, chains of nouns sound stiff — keep nominal style mainly for writing.
      table: |
        Verbal style | Nominal style
        Als ich in Hamburg ankam, … | Bei meiner Ankunft in Hamburg …
        Nachdem wir umgezogen waren, … | Nach unserem Umzug …
        Bevor das Studium begann, … | Vor dem Studienbeginn …
        Seit ich die Stelle gewechselt habe, … | Seit meinem Stellenwechsel …
        Wenn ich telefoniere, … | Beim Telefonieren …
        Um besser zu lesen, brauche ich Ruhe. | Zum Lesen brauche ich Ruhe.
      examples: |
        Bei meiner Einschulung sprach ich beide Sprachen fließend. | When I started school I spoke both languages fluently. | als ich eingeschult wurde → bei meiner Einschulung
        Nach dem Umzug nach Leipzig habe ich meine zweite Sprache neu entdeckt. | After moving to Leipzig I rediscovered my second language. | nachdem ich umgezogen war → nach dem Umzug
        Beim Erzählen wechseln viele Kinder ganz natürlich zwischen den Sprachen. | When telling stories, many children switch quite naturally between languages. | beim + nominalised infinitive
        Das ständige Wechseln ist kein Zeichen von Verwirrung. | Constantly switching is not a sign of confusion. | adjective + nominalised infinitive
      tip: "When you read a long German sentence full of nouns, find the noun that comes from a verb (Ankunft ← ankommen) and translate it back into a clause in your head: bei meiner Ankunft = when I arrived."
    reading:
      title: Zwei Sprachen, ein Küchentisch
      text: |
        Bei uns zu Hause gab es eine einfache Regel: Mit Mama spricht man Polnisch, mit Papa Deutsch. So hatten es meine Eltern schon vor meiner Geburt beschlossen, und sie haben sich – meistens – daran gehalten. Am Küchentisch in Görlitz entstand dadurch ein ganz eigenes Durcheinander: Ich erzählte meiner Mutter auf Polnisch von meinem Schultag und wandte mich mitten im Satz an meinen Vater, um auf Deutsch nach dem Salz zu fragen.

        Bei meiner Einschulung sprach ich beide Sprachen fließend, aber nicht gleich gut. Für das Rechnen und das Lesen war Deutsch meine Sprache, für Gefühle und Streit eher Polnisch. Meine Lehrerin machte sich damals Sorgen. Das ständige Wechseln zwischen den Sprachen würde mich nur verwirren, meinte sie. Heute weiß man, dass dieses Wechseln kein Zeichen von Verwirrung ist, sondern von sprachlicher Flexibilität.

        Schwierig wurde es erst in der Pubertät. Eine Zeit lang weigerte ich mich, auf der Straße Polnisch zu sprechen. Ich wollte nicht auffallen, ich wollte einfach dazugehören. Erst nach meinem Umzug nach Leipzig habe ich gemerkt, wie wichtig mir meine zweite Sprache eigentlich ist.

        Heute unterrichte ich Deutsch als Zweitsprache, und meine Erfahrungen helfen mir bei der Arbeit. Wenn ein Kind beim Erzählen plötzlich ins Arabische oder ins Ukrainische wechselt, unterbreche ich es nicht, sondern frage nach. Mehrsprachigkeit ist für mich keine Belastung, sondern ein Reichtum – auch wenn man ihn manchmal mühsam pflegen muss.

        Und am Küchentisch? Meine Tochter ist sieben und spricht mit mir Polnisch, mit ihrem Vater Deutsch und mit ihrer besten Freundin eine Mischung aus beidem. Ich korrigiere sie nur selten. Hauptsache, sie hört nicht auf zu sprechen.

        Katarzyna Berger, Leipzig
      translation: |
        At home we had a simple rule: you speak Polish with Mum and German with Dad. My parents had decided this even before I was born, and – most of the time – they stuck to it. At the kitchen table in Görlitz this created a very special muddle: I would tell my mother about my school day in Polish and, in the middle of the sentence, turn to my father to ask for the salt in German.

        When I started school I spoke both languages fluently, but not equally well. For arithmetic and reading, German was my language; for feelings and arguments it was more Polish. My teacher was worried at the time. Constantly switching between languages would only confuse me, she said. Today we know that this switching is not a sign of confusion but of linguistic flexibility.

        Things only became difficult in puberty. For a while I refused to speak Polish in the street. I didn't want to stand out; I simply wanted to fit in. Only after I moved to Leipzig did I notice how important my second language actually is to me.

        Today I teach German as a second language, and my experiences help me in my work. When a child suddenly switches into Arabic or Ukrainian while telling a story, I don't interrupt but ask a question. For me, multilingualism isn't a burden but a treasure – even if you sometimes have to work hard to keep it alive.

        And at the kitchen table? My daughter is seven and speaks Polish with me, German with her father and a mixture of both with her best friend. I rarely correct her. The main thing is that she doesn't stop talking.

        Katarzyna Berger, Leipzig
    pronunciation:
      title: "-ung and the ng-sound"
      body: |
        Nominal style produces many nouns in **-ung**: *die Einschulung, die Belastung, die Erfahrung, die Verwirrung*. The letters **ng** stand for one single sound [ŋ], as in English *singer* — not *finger*. There is no [g] after it: *Einschu-lung* [ˈaɪ̯nʃuːlʊŋ].

        The stress never falls on *-ung*, and it stays where it is in the verb: *er-FAH-rung*, *Be-LAS-tung*, *EIN-schu-lung*.
      items: |
        die Einschulung
        die Belastung
        die Erfahrung
        die Mehrsprachigkeit
        beim Sprechen
        Bei meiner Ankunft sprach ich kaum Deutsch.
    mistakes: |
      Bei meinem Ankunft war es kalt. => Bei meiner Ankunft war es kalt. | Ankunft is feminine (like all nouns in -kunft), so the dative possessive is meiner.
      Beim sprechen mache ich Fehler. => Beim Sprechen mache ich Fehler. | A nominalised infinitive is a noun, so it starts with a capital letter.
      Nach meinem Umziehen nach Leipzig … => Nach meinem Umzug nach Leipzig … | When an established noun exists (umziehen → der Umzug), use it; the nominalised infinitive sounds odd here.
    task:
      title: My language biography
      mode: writing
      body: |
        Write a short language biography (120–150 words) for a language-exchange website. Which languages have been part of your life, when and where did you learn them, and what role do they play today? Use at least four nominal phrases such as *bei meiner Ankunft, nach dem Umzug, seit meinem Studium, beim Lesen*.
    exercises: |
      rw: Use nominal style (bei + noun) :: Als ich in Deutschland ankam, sprach ich kaum Deutsch. || Bei meiner Ankunft in Deutschland sprach ich kaum Deutsch. | Bei meiner Ankunft sprach ich kaum Deutsch. || Als ich ankam → bei meiner Ankunft: the conjunction becomes a preposition and the subject becomes a possessive. || @tags de.prepositions,de.writing
      rw: Use nominal style (nach + noun) :: Nachdem wir umgezogen waren, haben die Kinder schnell Freunde gefunden. || Nach unserem Umzug haben die Kinder schnell Freunde gefunden. | Nach dem Umzug haben die Kinder schnell Freunde gefunden. || Nachdem wir umgezogen waren → nach unserem/dem Umzug (umziehen → der Umzug). || @tags de.prepositions,de.writing
      rw: Use beim + nominalised infinitive :: Wenn ich telefoniere, mache ich mehr Fehler. || Beim Telefonieren mache ich mehr Fehler. || Wenn ich telefoniere → beim Telefonieren (capital letter: it is a noun). || @tags de.prepositions,de.spelling
      fill: Seit meinem ___ nach Wien spreche ich jeden Tag Deutsch. (umziehen) || Umzug || The established noun from umziehen is der Umzug; seit + dative: seit meinem Umzug. || @tags de.prepositions
      tf: Katarzyna's teacher thought switching languages was a sign of flexibility. || false || The teacher thought it would confuse her; it is today's research that sees it as flexibility. || @ctx reading
      mc: Why did Katarzyna refuse to speak Polish in the street as a teenager? || Her parents had asked her not to. | *She didn't want to stand out. | She had forgotten many words. || "Ich wollte nicht auffallen, ich wollte einfach dazugehören." || @ctx reading @skill reading
      short: What does Katarzyna do when a child in her class suddenly switches into another language? || kw: unterbr/interrupt/fragt/frage/asks/question || She doesn't interrupt the child but asks a follow-up question. || @ctx reading
      listen: Bei meiner Ankunft in Zürich habe ich fast nichts verstanden, obwohl ich schon jahrelang Deutsch gelernt hatte. Erst nach ein paar Monaten habe ich mich an das Schweizerdeutsch gewöhnt. || Why did the speaker understand almost nothing at first? || She had never learnt German. | *People around her spoke Swiss German. | She arrived late at night. || "Erst nach ein paar Monaten habe ich mich an das Schweizerdeutsch gewöhnt." || @tags de.listening,de.prepositions
      tr: When speaking, I often switch into English. || Beim Sprechen wechsle ich oft ins Englische. | Beim Sprechen wechsele ich oft ins Englische. | Beim Reden wechsle ich oft ins Englische. | Beim Sprechen wechsle ich oft zum Englischen. || Beim + nominalised infinitive; ins Englische = into English (das Englische, nominalised adjective). || @tags de.prepositions,de.translation
      dict: Mehrsprachigkeit ist keine Belastung, sondern ein Reichtum.
      say: Das ständige Wechseln zwischen den Sprachen ist ganz normal. || Constantly switching between languages is completely normal.
      write: Write a short language biography (80–100 words). Mention which languages you speak, when you learnt them and what role they play today. Use at least three nominal phrases (bei …, nach …, seit …, beim …). || min=70 || req: bei/beim/nach/seit/vor | sprache/sprachen/deutsch | ich || Meine Muttersprache ist Portugiesisch, aber seit meiner Kindheit spreche ich auch Spanisch, weil meine Großeltern aus Galicien kommen. Englisch habe ich in der Schule gelernt, und nach dem Abitur habe ich ein Jahr in Irland gearbeitet. Bei meiner Ankunft in Deutschland vor drei Jahren konnte ich nur ein paar Sätze Deutsch. Heute spreche ich es bei der Arbeit jeden Tag. Beim Telefonieren bin ich noch unsicher, aber beim Lesen verstehe ich fast alles.
