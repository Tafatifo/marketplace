unit: 7
title: Rechte, Pflichten und Behörden
theme: Citizenship and public life
description: Talk about civic rights and duties, deal with public authorities and write a formal complaint — with noun–verb collocations (Funktionsverbgefüge), Nominalisierung and the conventions of formal letters.
free: false
objectives:
  - Use common noun–verb collocations of formal German (eine Entscheidung treffen, in Anspruch nehmen, zur Verfügung stehen)
  - Understand official German by turning noun phrases back into clauses — and use nominal style yourself
  - Write a formal letter of complaint with the correct layout, register, demands and deadlines
canDo:
  - I can explain the rights and duties connected with a civic role.
  - I can deal with an appointment at a public office and ask for clarification when I don't understand.
  - I can understand typical sentences in official letters and say them in everyday German.
  - I can write a firm but polite letter of complaint and set a deadline.
review: |
  fill: Wir müssen bis Freitag eine Entscheidung ___. || treffen || The fixed collocation is eine Entscheidung treffen (not machen). || @tags de.formal-writing,de.vocabulary
  fill: Das neue Gesetz tritt am ersten Januar in ___. || Kraft || In Kraft treten = to come into force. || @tags de.formal-writing,de.vocabulary
  mc: "Das kommt nicht in Frage." What does it mean? || *That's out of the question. | That's an open question. | Nobody has asked about that. || In Frage (also: infrage) kommen = to be possible; nicht in Frage kommen = to be out of the question. || @tags de.vocabulary
  rw: Use everyday German (nachdem …) :: Nach Eingang Ihres Antrags erhalten Sie eine Bestätigung. || Nachdem Ihr Antrag eingegangen ist, erhalten Sie eine Bestätigung. | Wenn Ihr Antrag eingegangen ist, erhalten Sie eine Bestätigung. || Nach + noun becomes nachdem + clause; the genitive (Ihres Antrags) becomes the subject (Ihr Antrag). || @tags de.formal-writing,de.genitive
  rw: Use nominal style (zur + noun) :: Um einen Reisepass zu beantragen, brauchen Sie ein biometrisches Foto. || Zur Beantragung eines Reisepasses brauchen Sie ein biometrisches Foto. || Um … zu + verb → zur + noun; the object (einen Reisepass) becomes a genitive (eines Reisepasses). || @tags de.formal-writing,de.genitive
  fill: Für Rückfragen stehe ich Ihnen gern zur ___. || Verfügung || Zur Verfügung stehen = to be available; a standard sentence at the end of formal letters. || @tags de.formal-writing
  mc: Which sentence is the best choice for a formal letter of complaint? || *Ich fordere Sie auf, den Schaden bis spätestens zum 30. April zu beheben. | Reparieren Sie das endlich, sonst gibt es Ärger! | Vielleicht könnten Sie irgendwann mal vorbeikommen? || A formal complaint is firm and polite and names a clear deadline. || @tags de.formal-writing,de.register
  tr: I reserve the right to reduce the rent. || Ich behalte mir eine Minderung der Miete vor. | Ich behalte mir eine Mietminderung vor. | Ich behalte mir vor, die Miete zu mindern. || Sich (dat.) etwas vorbehalten = to reserve the right to something; separable: behalte … vor. || @tags de.formal-writing,de.separable
  listen: Ab sofort ist eine Terminvereinbarung nur noch online möglich. Bei Rückfragen erreichen Sie uns telefonisch montags bis donnerstags von acht bis zwölf Uhr. || When can you phone the office with questions? || Every day from eight to twelve | *Monday to Thursday from eight to twelve | Only on Fridays || "… telefonisch montags bis donnerstags von acht bis zwölf Uhr." || @tags de.listening,de.formal-writing
  listen: Guten Tag, Frau Haddad, hier ist die Hausverwaltung. Ein Techniker kommt am Montag zwischen acht und zwölf Uhr wegen der Heizung. Für den Aufzug fehlt leider noch ein Ersatzteil. || Why can't the lift be repaired yet? || The technician is ill. | *A spare part is missing. | The landlord refuses to pay. || "Für den Aufzug fehlt leider noch ein Ersatzteil." || @tags de.listening
  ask: Sie rufen bei Ihrer Hausverwaltung an, weil seit einer Woche das warme Wasser ausgefallen ist. Beschreiben Sie das Problem und verlangen Sie höflich, aber bestimmt eine schnelle Reparatur. || kw: wasser/heizung/dusche/ausgefallen/kaputt & bitte/fordere/erwarte/möchte/könnten/müssen & bis/spätestens/schnell/sofort/umgehend || Guten Tag, hier ist Tomasz Nowak aus der Gartenstraße 8. Seit einer Woche haben wir kein warmes Wasser mehr. Ich habe das schon zweimal gemeldet. Ich bitte Sie dringend, die Reparatur bis spätestens Freitag zu veranlassen.
  write: Write a formal e-mail (90–110 words) to your city's public order office about a recurring problem in your street (noise at night, rubbish, a dangerous crossing). Describe the problem, refer to an earlier report and ask for a specific measure by a deadline. || min=80 || req: sehr geehrte | bitte/fordere/ersuche | bis/spätestens | mit freundlichen grüßen || Sehr geehrte Damen und Herren, hiermit möchte ich Sie erneut auf ein Problem in der Schillerstraße aufmerksam machen. Seit Anfang Mai werden am Glascontainer vor Hausnummer 14 regelmäßig Müllsäcke abgestellt. Trotz meiner Meldung vom 12. Mai ist bisher nichts geschehen. Inzwischen ziehen die Abfälle Ratten an, was besonders für die Kinder des benachbarten Kindergartens eine Gefahr darstellt. Ich bitte Sie daher, die Stelle bis spätestens Ende Juni regelmäßig kontrollieren und reinigen zu lassen und ein Hinweisschild aufzustellen. Für Rückfragen stehe ich Ihnen gern zur Verfügung. Mit freundlichen Grüßen Jana Petersen
lessons:
  - title: Rights and responsibilities
    summary: Listen to a new lay judge and an experienced colleague talk about rights and duties, and learn the noun–verb collocations of formal German.
    minutes: 45
    skills: [vocabulary, listening, speaking]
    tags: [de.formal-writing, de.vocabulary]
    objectives:
      - Use common Funktionsverbgefüge (eine Entscheidung treffen, zur Sprache bringen, in Frage kommen)
      - Choose the correct verb and preposition for each collocation
      - Explain the rights and duties connected with a civic role
    intro: |
      Formal German likes to say things with a noun and a "light" verb: not *entscheiden* but ***eine Entscheidung treffen***, not *nutzen* but ***in Anspruch nehmen***. These **Funktionsverbgefüge** are everywhere in law, administration and the news — and in conversations about rights and duties. You'll listen to a woman on the eve of her first day as a lay judge talking to an experienced colleague.
    vocab: |
      die Pflicht | duty; obligation | n | Wählen ist ein Recht, aber für viele auch eine Pflicht. | Voting is a right, but for many people also a duty. | g: f | pl: die Pflichten | c: Rechte und Pflichten; seine Pflicht erfüllen
      das Ehrenamt | voluntary (unpaid) position | n | Sie übt das Ehrenamt seit fünf Jahren aus. | She has held the voluntary post for five years. | g: n | pl: die Ehrenämter | n: Adjective: ehrenamtlich (on a voluntary basis).
      der Schöffe | lay judge | n | Als Schöffe entscheidet er zusammen mit Berufsrichtern über Strafen. | As a lay judge he decides on sentences together with professional judges. | g: m | pl: die Schöffen | n: Feminine: die Schöffin. N-declension: des Schöffen.
      die Verhandlung | (court) hearing; negotiation | n | Die Verhandlung beginnt um neun Uhr im Saal drei. | The hearing begins at nine o'clock in courtroom three. | g: f | pl: die Verhandlungen
      der/die Angeklagte | defendant; the accused | n | Der Angeklagte hat das Recht zu schweigen. | The defendant has the right to remain silent. | g: m/f | pl: die Angeklagten | n: Adjectival noun: ein Angeklagter, eine Angeklagte.
      das Urteil | verdict; judgement | n | Das Urteil wird am Freitag verkündet. | The verdict will be announced on Friday. | g: n | pl: die Urteile | c: ein Urteil fällen/verkünden
      das Stimmrecht | right to vote | n | Bei der Beratung haben Schöffen das volle Stimmrecht. | During deliberation lay judges have full voting rights. | g: n | pl: (no plural)
      freistellen | to release (from work) | v | Der Arbeitgeber muss Schöffen für die Sitzungen freistellen. | Employers must release lay judges for court sessions. | n: Separable. Noun: die Freistellung.
      die Entschädigung | compensation | n | Für den Verdienstausfall gibt es eine Entschädigung. | There is compensation for loss of earnings. | g: f | pl: die Entschädigungen
      in Anspruch nehmen | to make use of; to take up | expr | Viele Familien nehmen die kostenlose Beratung in Anspruch. | Many families make use of the free advice. | n: Formal for nutzen. Also: Zeit in Anspruch nehmen = to take up time.
      zur Sprache bringen | to raise; to bring up | expr | Ich werde das Problem in der nächsten Sitzung zur Sprache bringen. | I'll raise the problem at the next meeting. | n: = ansprechen. Intransitive partner: zur Sprache kommen.
      in Frage kommen | to be possible; to come into consideration | expr | Für diese Aufgabe kommen nur erfahrene Leute in Frage. | Only experienced people can be considered for this task. | n: Also spelled infrage. Nicht in Frage kommen = to be out of the question.
    grammar:
      title: "Funktionsverbgefüge: noun–verb collocations"
      body: |
        In formal German, a simple verb is often replaced by a **noun + a "light" verb** (*Funktionsverb*) such as *treffen, stellen, nehmen, bringen, kommen, stehen*. The **noun carries the meaning**; the verb just makes it work in the sentence: *entscheiden → **eine Entscheidung treffen**; beantragen → **einen Antrag stellen**; ansprechen → **zur Sprache bringen**.*

        These collocations are fixed — you can't swap the verb (*eine Entscheidung ~~machen~~*). Learn them as chunks, including the preposition and the case: *Rücksicht nehmen **auf** + acc., einen Antrag stellen **auf** + acc., Gebrauch machen **von** + dat.*

        Many come in **pairs** with an active and a passive-like meaning: *zur Verfügung **stellen** (to make available) – zur Verfügung **stehen** (to be available); zur Sprache **bringen** – zur Sprache **kommen**; in Kraft **setzen** – in Kraft **treten**.*

        **Negation:** with an article noun use *kein* (*keine Rücksicht nehmen*); with prepositional chunks use *nicht* (*nicht in Frage kommen*).
      table: |
        Funktionsverbgefüge | Simple verb | Meaning
        eine Entscheidung treffen | entscheiden | to make a decision
        einen Antrag stellen (auf) | beantragen | to apply (for)
        in Anspruch nehmen | nutzen | to make use of
        Rücksicht nehmen (auf) | berücksichtigen | to show consideration (for)
        zur Sprache bringen | ansprechen | to raise (a topic)
        zur Verfügung stehen | verfügbar sein | to be available
        in Kraft treten | gültig werden | to come into force
        in Frage kommen | möglich sein | to be possible
      examples: |
        Wir treffen Entscheidungen, die für Menschen enorme Folgen haben können. | We make decisions that can have enormous consequences for people. | eine Entscheidung treffen
        Für den Verdienstausfall kannst du eine Entschädigung in Anspruch nehmen. | You can claim compensation for your loss of earnings. | in Anspruch nehmen
        Dann musst du das sofort zur Sprache bringen. | Then you have to raise it straight away. | zur Sprache bringen
        In dem Fall kommst du für das Verfahren nicht in Frage. | In that case you can't be considered for the trial. | nicht in Frage kommen
      tip: "When you meet a new noun in an official text, look at the verb next to it and note both together: Rücksicht + nehmen, Antrag + stellen, Kraft + treten."
    dialogue:
      title: Der erste Tag als Schöffin
      setting: A café near the district court in Göppingen. Aylin Demir, 41, will serve as a lay judge for the first time tomorrow. She meets Werner Lehmann, 63, who has been a lay judge for ten years.
      speakers: A=Aylin Demir/f; W=Werner Lehmann/m
      lines: |
        A: Morgen habe ich meinen ersten Tag als Schöffin. Ehrlich gesagt nehme ich die Aufgabe sehr ernst – vielleicht zu ernst. | Tomorrow is my first day as a lay judge. To be honest, I'm taking the job very seriously – maybe too seriously.
        W: Das ist ein gutes Zeichen. Wir treffen schließlich Entscheidungen, die für Menschen enorme Folgen haben können. | That's a good sign. After all, we make decisions that can have enormous consequences for people.
        A: Stimmt es, dass meine Stimme beim Urteil genauso viel zählt wie die der Berufsrichterin? | Is it true that my vote on the verdict counts just as much as the professional judge's?
        W: Ja, wir haben das gleiche Stimmrecht. Deshalb müssen wir auch die gleiche Verantwortung übernehmen. | Yes, we have the same voting rights. That's why we also have to take on the same responsibility.
        A: Muss ich für die Sitzungen eigentlich Urlaub nehmen? Mein Chef war nicht gerade begeistert. | Do I actually have to take holiday for the sessions? My boss wasn't exactly thrilled.
        W: Nein, dein Arbeitgeber muss dich freistellen. Für den Verdienstausfall kannst du eine Entschädigung in Anspruch nehmen. | No, your employer has to release you. You can claim compensation for your loss of earnings.
        A: Gut zu wissen. Und was mache ich, wenn ich während der Verhandlung eine Frage habe? | Good to know. And what do I do if I have a question during the hearing?
        W: Du darfst Fragen stellen, am besten nach Rücksprache mit der Vorsitzenden. Viele machen davon aber nur selten Gebrauch. | You're allowed to ask questions, ideally after consulting the presiding judge. But many people rarely make use of that.
        A: Und wenn mir der Angeklagte persönlich bekannt ist? Das kann in einer Kleinstadt ja passieren. | And what if I know the defendant personally? That can happen in a small town.
        W: Dann musst du das sofort zur Sprache bringen. In dem Fall kommst du für das Verfahren nicht in Frage. | Then you have to raise it straight away. In that case you can't be considered for the trial.
        A: Danke, Werner. Ich glaube, jetzt bin ich wirklich bereit, diese Verantwortung zu übernehmen. | Thank you, Werner. I think I'm really ready now to take on this responsibility.
    pronunciation:
      title: "Consonant clusters in compounds"
      body: |
        Legal and official compounds often bring several consonants together where the parts meet: *Sti**mmr**echt* [mr], *Rü**cksp**rache* [kʃp], *Verdie**nsta**usfall* [nst], *Beru**fsr**ichterin* [fsr]. Don't insert a vowel to make them easier, and don't link across the boundary: there is a small break before a vowel (*Verdienst-ʔausfall*).

        Practise slowly, syllable by syllable, then at normal speed with the main stress on the first part of the compound.
      items: |
        das Stimmrecht
        die Rücksprache
        der Verdienstausfall
        die Berufsrichterin
        in Anspruch nehmen
        Verantwortung übernehmen
    mistakes: |
      Wir müssen bald eine Entscheidung machen. => Wir müssen bald eine Entscheidung treffen. | The fixed partner of Entscheidung is treffen.
      Ich habe einen Antrag für Elterngeld gestellt. => Ich habe einen Antrag auf Elterngeld gestellt. | Einen Antrag stellen takes auf + accusative.
      Das kommt nicht in die Frage. => Das kommt nicht in Frage. | The collocation has no article: in Frage (or infrage) kommen.
    task:
      title: Rights and duties
      mode: speaking
      body: |
        Choose a role you know: tenant, employee, parent, club member, volunteer or citizen. Explain in one to two minutes which rights and duties come with it. Use at least four Funktionsverbgefüge (*eine Entscheidung treffen, Rücksicht nehmen auf, in Anspruch nehmen, zur Verfügung stehen …*). Then discuss with the AI coach in the "Expressing an opinion" scenario whether civic duties such as serving as a lay judge should be compulsory.
    exercises: |
      fill: Wir müssen bis Ende der Woche eine Entscheidung ___. || treffen || Eine Entscheidung treffen = to make a decision. || @tags de.vocabulary,de.formal-writing
      fill: Sie hat beim Bürgeramt einen Antrag auf einen neuen Reisepass ___. || gestellt || Einen Antrag stellen; Perfekt: hat … gestellt. || @tags de.vocabulary,de.perfekt
      fill: Die neue Regelung tritt am ersten März in ___. || Kraft || In Kraft treten = to come into force. || @tags de.vocabulary,de.formal-writing
      fill: Bitte nehmen Sie ___ auf die Nachbarn und seien Sie nach zweiundzwanzig Uhr leise. || Rücksicht || Rücksicht nehmen auf + accusative = to show consideration for. || @tags de.vocabulary
      mc: Die Stadt ___ den Vereinen kostenlos Räume zur Verfügung. || *stellt | steht | macht || Zur Verfügung stellen = to make available (with an object); zur Verfügung stehen = to be available. || @tags de.vocabulary,de.formal-writing
      rw: Replace the verb with a noun–verb collocation (zur Sprache …) :: Wir haben das Problem in der Sitzung angesprochen. || Wir haben das Problem in der Sitzung zur Sprache gebracht. || Ansprechen = zur Sprache bringen. || @tags de.vocabulary,de.formal-writing
      rw: Use in Anspruch nehmen :: Viele Familien nutzen die kostenlose Beratung. || Viele Familien nehmen die kostenlose Beratung in Anspruch. || Nutzen = in Anspruch nehmen; nehmen is conjugated, in Anspruch goes to the end. || @tags de.vocabulary,de.formal-writing
      tf: Aylin has to take holiday for her work at the court. || false || "Nein, dein Arbeitgeber muss dich freistellen." || @ctx dialogue
      short: What must Aylin do if she knows the defendant personally? || kw: sprache/raise/sagen/sag/tell/mitteil/inform/meld/report || She must raise it immediately ("sofort zur Sprache bringen"); then she can't take part in the trial. || @ctx dialogue
      listen: @dialogue || What does Werner say about the lay judges' votes? || They only count if the judges disagree. | *They count just as much as the professional judge's. | Lay judges don't vote on the verdict. || "Ja, wir haben das gleiche Stimmrecht."
      listen: Die neue Regelung tritt am ersten März in Kraft. Anträge, die vorher gestellt wurden, werden noch nach den alten Regeln bearbeitet. || What happens to applications submitted before March? || They have to be submitted again. | *They are processed under the old rules. | They are rejected. || "Anträge, die vorher gestellt wurden, werden noch nach den alten Regeln bearbeitet." || @tags de.listening,de.passive
      tr: The decision has already been made. || Die Entscheidung ist schon getroffen worden. | Die Entscheidung wurde schon getroffen. | Die Entscheidung ist bereits getroffen worden. | Die Entscheidung wurde bereits getroffen. | Die Entscheidung ist schon gefallen. | Die Entscheidung ist bereits gefallen. || Passive of eine Entscheidung treffen, or the set phrase die Entscheidung ist gefallen. || @tags de.vocabulary,de.passive
      dict: Wer ein Ehrenamt übernimmt, trägt auch Verantwortung.
      ask: „Welche Pflichten sollte jeder Bürger und jede Bürgerin haben?“ Give your opinion and use at least two noun–verb collocations. || kw: verantwortung/rücksicht/entscheidung/anspruch/verfügung/frage/sprache & übernehmen/nehmen/treffen/stellen/stehen/kommen/bringen || Ich finde, jeder sollte Verantwortung für seine Nachbarschaft übernehmen und Rücksicht auf andere nehmen. Eine Pflicht zum Ehrenamt kommt für mich aber nicht in Frage, denn das muss freiwillig sein.

  - title: Public services
    summary: Register a new address at the citizens' office, understand official German and turn noun phrases back into everyday language.
    minutes: 45
    skills: [listening, reading, grammar]
    tags: [de.formal-writing, de.genitive]
    objectives:
      - Understand nominal phrases in official German (nach Eingang, zur Beantragung, bei Nichterscheinen)
      - Turn clauses into noun phrases and back again
      - Handle an appointment at a public office and ask for clarification politely
    intro: |
      *Nach Eingang Ihres Antrags … Zur Beantragung eines Passes … Bei Nichterscheinen …* Official German (*Amtsdeutsch*) packs whole clauses into nouns — a step further than the nominal style you met in Unit 1. Once you know how it works, you can decode it: *bei Nichterscheinen* simply means *wenn Sie nicht kommen*. In this lesson a man registers his new address at the citizens' office and asks the clerk to explain what she means.
    vocab: |
      das Bürgeramt | citizens' office | n | Für die Ummeldung brauchen Sie einen Termin im Bürgeramt. | You need an appointment at the citizens' office to register your new address. | g: n | pl: die Bürgerämter | n: Also: das Bürgerbüro, das Einwohnermeldeamt.
      ummelden | to register a change of address | v | Nach einem Umzug muss man sich innerhalb von zwei Wochen ummelden. | After moving house you have to register your new address within two weeks. | n: Separable. Noun: die Ummeldung. First registration: (sich) anmelden.
      der Wohnsitz | place of residence | n | Ihr Hauptwohnsitz ist jetzt in Düsseldorf. | Your main residence is now in Düsseldorf. | g: m | pl: die Wohnsitze
      der Einzug | moving in | n | Die Frist beginnt mit dem Tag des Einzugs. | The deadline starts on the day you move in. | g: m | pl: die Einzüge | n: Opposite: der Auszug.
      überschreiten | to exceed | v | Wer die Frist überschreitet, muss mit einem Bußgeld rechnen. | Anyone who misses the deadline can expect a fine. | n: Inseparable, irregular: überschritt, hat überschritten.
      das Bußgeld | fine (administrative) | n | Für Falschparken gibt es ein Bußgeld. | There's a fine for illegal parking. | g: n | pl: die Bußgelder
      die Bestätigung | confirmation | n | Ihre Vermieterin muss Ihnen den Einzug schriftlich bestätigen. Diese Bestätigung brauchen Sie für die Anmeldung. | Your landlady must confirm in writing that you have moved in. You need this confirmation to register. | g: f | pl: die Bestätigungen
      beantragen | to apply for | v | Den Parkausweis können Sie online beantragen. | You can apply for the parking permit online. | n: Noun: die Beantragung; der Antrag.
      erfolgen | to take place; to be done (formal) | v | Die Antragstellung erfolgt ausschließlich online. | Applications are made exclusively online. | n: Typical of official German: Die Zahlung erfolgt … = Sie zahlen …
      die Rückfrage | query; follow-up question | n | Bei Rückfragen rufen Sie uns bitte an. | If you have any questions, please call us. | g: f | pl: die Rückfragen
      sich wenden an | to contact; to turn to | v | Bitte wenden Sie sich an das Straßenverkehrsamt. | Please contact the road traffic office. | n: Irregular: wandte sich / wendete sich, hat sich gewandt / gewendet. An + accusative.
      ein Auge zudrücken | to turn a blind eye; to let something pass | expr | Diesmal drücke ich noch ein Auge zu. | I'll let it pass this time.
    grammar:
      title: "Nominalisierung in official German"
      body: |
        Official texts turn whole clauses into noun phrases. The pattern is always the same:

        1. The **verb becomes a noun** (often *-ung*, a nominalised infinitive or a short noun): *eingehen → der Eingang, prüfen → die Prüfung, beantragen → die Beantragung, nicht erscheinen → das Nichterscheinen.*
        2. The **conjunction becomes a preposition**: *nachdem → nach, bevor → vor, wenn/falls → bei, um … zu → zur/zum, indem → durch/unter, weil → wegen/aufgrund.*
        3. The **subject or object becomes a genitive** (or a possessive): *Ihr Antrag geht ein → nach Eingang **Ihres Antrags**; Sie beantragen einen Pass → zur Beantragung **eines Passes**.*

        To **understand** Amtsdeutsch, simply reverse the steps: *Vor Ablauf der Frist* = *bevor die Frist abläuft*. *Bei Nichterscheinen* = *wenn Sie nicht erscheinen*.

        In your own letters, a little nominal style sounds professional (*Nach Prüfung der Unterlagen …*), but too much makes texts heavy. When speaking, it is perfectly fine to ask: *Entschuldigung, könnten Sie das bitte einfacher erklären?*
      table: |
        Official German | Everyday German
        Nach Eingang Ihres Antrags … | Nachdem Ihr Antrag eingegangen ist, …
        Vor Ablauf der Frist … | Bevor die Frist abläuft, …
        Bei Rückfragen … | Wenn Sie Fragen haben, …
        Bei Nichterscheinen … | Wenn Sie nicht erscheinen, …
        Zur Beantragung eines Passes … | Um einen Pass zu beantragen, …
        Unter Vorlage Ihres Ausweises … | Indem Sie Ihren Ausweis vorlegen, …
      examples: |
        Bei Fristüberschreitung kann ein Bußgeld verhängt werden. | If the deadline is exceeded, a fine may be imposed. | bei + noun = wenn …
        Nach Prüfung der Unterlagen erhalten Sie einen Aufkleber für Ihren Ausweis. | Once the documents have been checked, you will receive a sticker for your ID card. | nach + noun = nachdem …
        Zur Beantragung eines Parkausweises wenden Sie sich bitte an das Straßenverkehrsamt. | To apply for a parking permit, please contact the road traffic office. | zur + noun = um … zu
        Die Antragstellung erfolgt ausschließlich online. | Applications can only be made online. | noun + erfolgen = passive meaning
      tip: "Decode from the preposition: bei = wenn, nach = nachdem, vor = bevor, zur = um … zu. Then turn the noun back into a verb."
    dialogue:
      title: Im Bürgeramt
      setting: A citizens' office in Düsseldorf. Milan Petrović moved within the city three weeks ago and has an appointment with Ms Kühn to register his new address.
      speakers: K=Frau Kühn/f; P=Milan Petrović/m
      lines: |
        K: Guten Morgen, Herr Petrović. Sie hatten online einen Termin zur Ummeldung Ihres Wohnsitzes gebucht, richtig? | Good morning, Mr Petrović. You booked an appointment online to register a change of address, is that right?
        P: Genau. Ich bin vor drei Wochen innerhalb von Düsseldorf umgezogen und möchte meine neue Adresse anmelden. | Exactly. I moved within Düsseldorf three weeks ago and would like to register my new address.
        K: Die Ummeldung hat innerhalb von zwei Wochen nach dem Einzug zu erfolgen. Bei Fristüberschreitung kann ein Bußgeld verhängt werden. | Registration must take place within two weeks of moving in. If the deadline is exceeded, a fine can be imposed.
        P: Entschuldigung, das habe ich nicht ganz verstanden. Heißt das, ich muss jetzt eine Strafe zahlen? | Sorry, I didn't quite understand that. Does that mean I have to pay a fine now?
        K: Keine Sorge. Ich meine nur: Wenn man die Frist überschreitet, kann es teuer werden. Bei Ihnen drücke ich ein Auge zu. | Don't worry. I just mean that if you miss the deadline, it can be expensive. I'll let it pass in your case.
        P: Vielen Dank! Hier sind mein Personalausweis und die Bestätigung meiner Vermieterin. | Thank you very much! Here are my ID card and my landlady's confirmation.
        K: Gut. Nach Prüfung der Unterlagen bekommen Sie einen Aufkleber mit der neuen Adresse für Ihren Ausweis. | Good. Once the documents have been checked, you'll get a sticker with your new address for your ID card.
        P: Noch eine Frage: Ich brauche einen Bewohnerparkausweis. Kann ich den auch hier bei Ihnen beantragen? | One more question: I need a residents' parking permit. Can I apply for that here with you too?
        K: Zur Beantragung eines Parkausweises wenden Sie sich bitte an das Straßenverkehrsamt. Die Antragstellung erfolgt dort ausschließlich online. | To apply for a parking permit, please contact the road traffic office. Applications there can only be made online.
        P: Also: Wenn ich einen Parkausweis beantragen will, muss ich das online beim Straßenverkehrsamt machen? | So: if I want to apply for a parking permit, I have to do it online with the road traffic office?
        K: Ganz genau. Bei Rückfragen erreichen Sie die Kolleginnen und Kollegen dort auch telefonisch. | Exactly. If you have questions, you can also reach the staff there by phone.
    pronunciation:
      title: "Long words, clear rhythm"
      body: |
        Official German produces very long words: *Fristüberschreitung, Antragstellung, Bewohnerparkausweis*. Split them into their parts in your head — *Frist | über | schreitung*, *Bewohner | park | ausweis* — and put the main stress on the first part, with a lighter stress on the next: ***FRIST**überschreitung, be**WOH**nerparkausweis*.

        Keep the glottal stop before vowels inside the word (*Frist-ʔüberschreitung, Park-ʔausweis*).
      items: |
        die Fristüberschreitung
        die Antragstellung
        der Bewohnerparkausweis
        das Straßenverkehrsamt
        Bei Rückfragen rufen Sie uns an.
        Könnten Sie das bitte einfacher erklären?
    culture:
      title: The duty to register
      body: |
        Everyone who lives in Germany must register their address (*Meldepflicht*) — usually within two weeks of moving in, and with a written confirmation from the landlord (*Wohnungsgeberbestätigung*). The registration certificate (*Meldebescheinigung*) is needed for many other things, such as opening a bank account; after a first registration, the tax office automatically sends a personal tax ID. In many cities, appointments at the *Bürgeramt* have to be booked online, sometimes weeks in advance.
    mistakes: |
      Zur Beantragung einen Reisepass brauchen Sie ein Foto. => Zur Beantragung eines Reisepasses brauchen Sie ein Foto. | In nominal style the object of the verb becomes a genitive attribute.
      Nach Eingang Ihr Antrag erhalten Sie eine Nachricht. => Nach Eingang Ihres Antrags erhalten Sie eine Nachricht. | The subject of the original clause also becomes a genitive: Ihres Antrags.
      Bei nicht erscheinen wird eine Gebühr fällig. => Bei Nichterscheinen wird eine Gebühr fällig. | The nominalised form is written as one word with a capital letter: das Nichterscheinen.
    task:
      title: Official German in plain words
      mode: writing
      body: |
        Find (or imagine) a letter from a public office — about a tax return, a residence permit, a library fine or a school registration. Write down five sentences in official German and rewrite each one in everyday German. Then write a short reply (60–80 words) in which you ask the office to explain one point more clearly.
    exercises: |
      rw: Rewrite in everyday German (nachdem …) :: Nach Prüfung der Unterlagen erhalten Sie einen Bescheid. || Nachdem die Unterlagen geprüft worden sind, erhalten Sie einen Bescheid. | Nachdem wir die Unterlagen geprüft haben, erhalten Sie einen Bescheid. | Nachdem die Unterlagen geprüft wurden, erhalten Sie einen Bescheid. || Nach + noun → nachdem + clause; die Prüfung → prüfen (often in the passive). || @tags de.formal-writing,de.subordinate-clauses
      rw: Use nominal style (vor + noun) :: Bevor die Frist abläuft, müssen Sie alle Unterlagen einreichen. || Vor Ablauf der Frist müssen Sie alle Unterlagen einreichen. || Bevor … abläuft → vor Ablauf; the subject die Frist becomes a genitive: der Frist. || @tags de.formal-writing,de.genitive
      rw: Use nominal style (bei + noun) :: Wenn Sie nicht erscheinen, wird eine Gebühr fällig. || Bei Nichterscheinen wird eine Gebühr fällig. || Wenn Sie nicht erscheinen → bei Nichterscheinen (one word, capital N). || @tags de.formal-writing,de.spelling
      fill: Nach ___ der Unterlagen bekommen Sie eine Nachricht. (prüfen) || Prüfung || The noun from prüfen is die Prüfung. || @tags de.formal-writing
      fill: Zur Verlängerung ___ Aufenthaltstitels benötigen Sie einen gültigen Pass. || Ihres / des || Den Aufenthaltstitel verlängern → zur Verlängerung des/Ihres Aufenthaltstitels (genitive). || @tags de.formal-writing,de.genitive
      mc: „Bei Nichterscheinen wird eine Gebühr fällig.“ What does this mean? || *If you don't turn up, you have to pay a fee. | When you arrive, you pay a fee. | If you appear in person, there is no fee. || Bei Nichterscheinen = wenn Sie nicht erscheinen. || @tags de.formal-writing,de.reading
      tf: Mr Petrović has to pay a fine for registering late. || false || "Bei Ihnen drücke ich ein Auge zu." || @ctx dialogue
      short: Where does Mr Petrović have to apply for the parking permit? || kw: straßenverkehrsamt/verkehrsamt/traffic/online || Online, with the road traffic office (Straßenverkehrsamt). || @ctx dialogue
      listen: @dialogue || What does Mr Petrović receive after his documents have been checked? || A new ID card | *A sticker with his new address for his ID card | A parking permit || "Nach Prüfung der Unterlagen bekommen Sie einen Aufkleber mit der neuen Adresse für Ihren Ausweis."
      listen: Zur Beantragung des Kindergeldes benötigen wir die Geburtsurkunde und die Steuer-Identifikationsnummer Ihres Kindes. Die Auszahlung erfolgt nach Prüfung des Antrags monatlich. || What happens after the application has been checked? || The applicant has to come in person. | *The money is paid every month. | The birth certificate is sent back. || "Die Auszahlung erfolgt nach Prüfung des Antrags monatlich." || @tags de.listening,de.formal-writing
      tr: You must register within two weeks. (formal) || Sie müssen sich innerhalb von zwei Wochen anmelden. | Sie müssen sich innerhalb von zwei Wochen ummelden. | Die Anmeldung muss innerhalb von zwei Wochen erfolgen. | Die Ummeldung muss innerhalb von zwei Wochen erfolgen. || Innerhalb von + dative; sich anmelden/ummelden, or nominal: die Anmeldung muss … erfolgen. || @tags de.formal-writing,de.prepositions
      dict: Die Antragstellung erfolgt ausschließlich online.
      say: Entschuldigung, könnten Sie das bitte noch einmal einfacher erklären? || Excuse me, could you please explain that again more simply?

  - title: Formal complaints
    summary: Read a tenant's letter of complaint and write your own formal letter with the right layout, register, demands and deadlines.
    minutes: 50
    skills: [reading, writing]
    tags: [de.formal-writing, de.register]
    objectives:
      - Lay out a formal German letter correctly (sender, recipient, date, subject line, greeting, closing, enclosures)
      - Describe a problem factually, set a deadline and name the consequences
      - Combine nominal style and noun–verb collocations in a firm but polite register
    intro: |
      A complaint only works if it is taken seriously — and in Germany that usually means a formal letter: factual, clearly structured, with a demand and a deadline. In this lesson you will read a tenant's letter to her property management company about a broken heating system and a lift that is out of service, and you will learn the phrases and conventions to write your own.
    vocab: |
      die Beschwerde | complaint | n | Ich möchte eine Beschwerde einreichen. | I would like to submit a complaint. | g: f | pl: die Beschwerden | c: sich beschweren über + acc.
      der Mangel | defect; fault | n | Der Mieter muss Mängel sofort melden. | The tenant must report defects immediately. | g: m | pl: die Mängel | n: Also: lack (der Mangel an Zeit). Die Mängelanzeige = notice of defects.
      ausfallen | to fail; to break down; to be cancelled | v | Seit dem zweiten Januar ist die Heizung ausgefallen. | The heating has been out of action since the second of January. | n: Separable, with sein. Noun: der Ausfall.
      außer Betrieb | out of order; out of service | expr | Der Aufzug ist seit Weihnachten außer Betrieb. | The lift has been out of service since Christmas.
      instand setzen | to repair; to restore | expr | Bitte lassen Sie die Heizung umgehend instand setzen. | Please have the heating repaired immediately. | n: Formal for reparieren. Also spelled in Stand setzen.
      umgehend | immediately; without delay | adv | Wir bitten um umgehende Antwort. | We request an immediate reply.
      die Mietminderung | rent reduction | n | Bei erheblichen Mängeln ist eine Mietminderung möglich. | If there are significant defects, a rent reduction is possible. | g: f | pl: die Mietminderungen | n: Verb: die Miete mindern.
      sich etwas vorbehalten | to reserve the right to something | expr | Ich behalte mir weitere Schritte vor. | I reserve the right to take further steps. | n: Separable: behalte … vor. The reflexive pronoun is dative.
      auffordern | to call on; to request formally | v | Ich fordere Sie auf, den Schaden bis zum Monatsende zu beheben. | I call on you to repair the damage by the end of the month. | n: Separable. Noun: die Aufforderung.
      rechtliche Schritte einleiten | to take legal action | expr | Andernfalls sehe ich mich gezwungen, rechtliche Schritte einzuleiten. | Otherwise I will be forced to take legal action.
      der Mieterverein | tenants' association | n | Der Mieterverein berät seine Mitglieder bei Problemen mit dem Vermieter. | The tenants' association advises its members on problems with their landlord. | g: m | pl: die Mietervereine
      die Anlage | enclosure; attachment | n | Anlagen: Kopie der E-Mail, Fotos | Enclosures: copy of the e-mail, photos | g: f | pl: die Anlagen | n: Also: installation, system (die Heizungsanlage).
    grammar:
      title: "The formal letter: structure and phrases"
      body: |
        A German formal letter follows a fixed **layout**: sender's address at the top, then the recipient's address, then **place and date** on the right (*Leipzig, 14. Januar 2026*). The **subject line** comes next, without the word *Betreff* and often in bold. After the greeting (*Sehr geehrte Damen und Herren,*) the first word is written in **lower case**. The letter ends with *Mit freundlichen Grüßen* (no comma), the signature and, if necessary, *Anlage(n)*.

        A complaint usually has five steps:
        1. **Reason:** *hiermit zeige ich Ihnen folgende Mängel an / hiermit beschwere ich mich über …*
        2. **Facts with dates:** *Seit dem 2. Januar ist … ausgefallen. Trotz meiner Meldung vom … ist bis heute keine Reparatur erfolgt.*
        3. **Demand with a deadline:** *Ich fordere Sie auf, … bis spätestens zum … zu …* or, more softly, *Ich bitte Sie, …*
        4. **Consequence:** *Sollte bis zum genannten Termin keine Reparatur erfolgen, sehe ich mich gezwungen, …* — note the verb-first *Sollte …* (= falls/wenn).
        5. **Closing:** *Für Rückfragen stehe ich Ihnen gern zur Verfügung.*

        The register combines **nominal style** (*trotz meiner Meldung, für die Dauer des Ausfalls*) with **noun–verb collocations** (*eine Reparatur erfolgt, rechtliche Schritte einleiten, sich etwas vorbehalten*). Stay factual: no exclamation marks, no emotional adjectives.
      table: |
        Part | Typical phrase
        reason | hiermit zeige ich Ihnen folgende Mängel an
        reference | Bezug nehmend auf mein Telefonat vom 2. Januar
        facts | Trotz meiner Meldung ist bis heute keine Reparatur erfolgt.
        demand | Ich fordere Sie auf, … bis spätestens zum 21. Januar zu …
        consequence | Sollte …, sehe ich mich gezwungen, rechtliche Schritte einzuleiten.
        closing | Für Rückfragen stehe ich Ihnen gern zur Verfügung. Mit freundlichen Grüßen
      examples: |
        Trotz meiner telefonischen Meldung am selben Tag ist bis heute keine Reparatur erfolgt. | Despite my telephone report on the same day, no repair has been carried out to date. | nominal style + erfolgen
        Ich fordere Sie daher auf, die Heizung bis spätestens zum 21. Januar instand setzen zu lassen. | I therefore call on you to have the heating repaired by the 21st of January at the latest. | demand with a deadline
        Für die Dauer des Heizungsausfalls behalte ich mir eine Minderung der Miete vor. | For the duration of the heating failure I reserve the right to reduce the rent. | sich etwas vorbehalten
        Sollte bis zum genannten Termin keine Reparatur erfolgen, sehe ich mich gezwungen, rechtliche Schritte einzuleiten. | Should no repair be carried out by the stated date, I will be forced to take legal action. | Sollte … = if
      tip: "Firm but polite: facts, a clear demand, a date, a consequence. The more precise your dates and references, the stronger your letter."
    reading:
      title: Mängelanzeige
      text: |
        Nina Haddad
        Lindenstraße 12
        04177 Leipzig

        Hausverwaltung Kramer
        Karl-Heine-Straße 40
        04229 Leipzig

        Leipzig, 14. Januar 2026

        Ausfall der Heizung und des Aufzugs in der Lindenstraße 12

        Sehr geehrte Damen und Herren,

        hiermit zeige ich Ihnen erneut folgende Mängel in meiner Wohnung im dritten Obergeschoss an.

        Seit dem 2. Januar ist die Heizung in meiner Wohnung vollständig ausgefallen. Trotz meiner telefonischen Meldung am selben Tag und meiner E-Mail vom 5. Januar ist bis heute keine Reparatur erfolgt. Die Raumtemperatur liegt derzeit bei etwa vierzehn Grad, sodass ein normales Wohnen nicht möglich ist.

        Hinzu kommt, dass der Aufzug seit Weihnachten außer Betrieb ist. Für meine Nachbarin im fünften Stock, die auf einen Rollator angewiesen ist, bedeutet dies, dass sie ihre Wohnung kaum noch verlassen kann.

        Ich fordere Sie daher auf, die Heizung bis spätestens zum 21. Januar instand setzen zu lassen. Für die Dauer des Heizungsausfalls behalte ich mir eine Minderung der Miete vor. Darüber hinaus bitte ich Sie um eine schriftliche Mitteilung, bis wann mit der Reparatur des Aufzugs zu rechnen ist.

        Sollte bis zum genannten Termin keine Reparatur erfolgen, sehe ich mich gezwungen, rechtliche Schritte einzuleiten und mich an den Mieterverein zu wenden.

        Für Rückfragen stehe ich Ihnen gern zur Verfügung.

        Mit freundlichen Grüßen

        Nina Haddad

        Anlagen: Kopie meiner E-Mail vom 5. Januar, Fotos des Thermometers
      translation: |
        Nina Haddad
        Lindenstraße 12
        04177 Leipzig

        Kramer Property Management
        Karl-Heine-Straße 40
        04229 Leipzig

        Leipzig, 14 January 2026

        Failure of the heating and the lift at Lindenstraße 12

        Dear Sir or Madam,

        I hereby notify you once again of the following defects in my flat on the third floor.

        Since the 2nd of January the heating in my flat has completely failed. Despite my telephone report on the same day and my e-mail of the 5th of January, no repair has been carried out to date. The room temperature is currently around fourteen degrees, so that normal living is not possible.

        In addition, the lift has been out of service since Christmas. For my neighbour on the fifth floor, who depends on a walking frame, this means that she can hardly leave her flat any more.

        I therefore call on you to have the heating repaired by the 21st of January at the latest. For the duration of the heating failure I reserve the right to reduce the rent. I also ask you to inform me in writing when the lift is expected to be repaired.

        Should no repair be carried out by the stated date, I will be forced to take legal action and to contact the tenants' association.

        I would be happy to answer any questions.

        Yours faithfully

        Nina Haddad

        Enclosures: copy of my e-mail of 5 January, photos of the thermometer
    pronunciation:
      title: "Reading dates aloud"
      body: |
        Dates are written with ordinal numbers and a full stop, and read with the ordinal ending: *am 2. Januar* = *am **zweiten** Januar*, *bis zum 21. Januar* = *bis zum **einundzwanzigsten** Januar*, *Leipzig, 14. Januar* = *Leipzig, **den vierzehnten** Januar* or *vierzehnter Januar*. After *am, vom, zum, bis zum* the ending is **-en**.

        Floors work the same way: *im 3. Obergeschoss* = *im **dritten** Obergeschoss*.
      items: |
        am zweiten Januar
        bis zum einundzwanzigsten Januar
        meine E-Mail vom fünften Januar
        im dritten Obergeschoss
        außer Betrieb
        Mit freundlichen Grüßen
    mistakes: |
      Sehr geehrte Damen und Herren, Hiermit beschwere ich mich … => Sehr geehrte Damen und Herren, hiermit beschwere ich mich … | After the comma in the greeting, the first word is written in lower case.
      Ich will, dass Sie die Heizung sofort reparieren! => Ich fordere Sie auf, die Heizung umgehend reparieren zu lassen. | In a formal complaint, use auffordern or bitten and avoid exclamation marks and ich will.
      Mit freundlichen Grüßen, Nina Haddad => Mit freundlichen Grüßen Nina Haddad | There is no comma after the closing formula.
    task:
      title: Your letter of complaint
      mode: writing
      body: |
        Write a formal letter of complaint (150–180 words) about a real or imagined problem: a cancelled train, a faulty product, a gym that keeps charging you after you cancelled, or a defect in your flat. Use the full layout, describe the facts with dates, set a deadline and name a consequence. For spoken practice, make the same complaint to the AI coach in the "Handling a travel problem" scenario.
    exercises: |
      fill: Sehr geehrte Damen und Herren, ___ beschwere ich mich über die Lärmbelästigung in unserer Straße. || hiermit || Hiermit (hereby) is the standard formal opening; lower case after the greeting. || @tags de.formal-writing,de.spelling
      mc: You want to set a firm deadline. Which sentence fits a formal complaint? || *Ich fordere Sie auf, den Schaden bis spätestens zum 30. April zu beheben. | Machen Sie das bitte irgendwann in den nächsten Wochen. | Ich will, dass das sofort passiert! || A formal complaint names a precise deadline in a firm but polite register. || @tags de.formal-writing,de.register
      fill: Für Rückfragen stehe ich Ihnen gern zur ___. || Verfügung || Zur Verfügung stehen = to be available. || @tags de.formal-writing
      fill: ___ bis zum genannten Termin keine Reparatur erfolgen, werde ich mich an den Mieterverein wenden. || Sollte || Verb-first sollte replaces falls/wenn in formal conditions. || @tags de.formal-writing,de.word-order
      rw: Make it formal (Ich bitte Sie, … zu …) :: Schicken Sie mir eine schriftliche Antwort. || Ich bitte Sie, mir eine schriftliche Antwort zu schicken. | Ich bitte Sie, mir eine schriftliche Antwort zukommen zu lassen. || Ich bitte Sie + zu-infinitive turns an order into a formal request. || @tags de.formal-writing,de.infinitive-zu
      rw: Use nominal style (trotz + genitive) :: Obwohl ich am selben Tag angerufen habe, ist nichts passiert. || Trotz meines Anrufs am selben Tag ist nichts passiert. | Trotz meines Anrufes am selben Tag ist nichts passiert. | Trotz meiner telefonischen Meldung am selben Tag ist nichts passiert. || Obwohl ich angerufen habe → trotz meines Anrufs (genitive). || @tags de.formal-writing,de.genitive
      tf: Ms Haddad had already reported the heating problem before writing this letter. || true || She phoned on the same day and sent an e-mail on 5 January: "Trotz meiner telefonischen Meldung … und meiner E-Mail vom 5. Januar …" || @ctx reading
      mc: Why does Ms Haddad mention her neighbour? || The neighbour has also stopped paying rent. | *Because of the lift, the neighbour can hardly leave her flat. | The neighbour repaired the heating. || "… die auf einen Rollator angewiesen ist … dass sie ihre Wohnung kaum noch verlassen kann." || @ctx reading @skill reading
      short: What will Ms Haddad do if nothing is repaired by the deadline? || kw: recht/legal/mieterverein/tenant/anwalt/lawyer || Take legal action and contact the tenants' association. || @ctx reading
      listen: Guten Tag, hier ist die Hausverwaltung Kramer. Wir haben Ihr Schreiben erhalten. Ein Techniker kommt am Montag zwischen acht und zwölf Uhr, um die Heizung zu reparieren. || What does the property management company promise? || A rent reduction | *A technician on Monday morning | A new lift by Monday || "Ein Techniker kommt am Montag zwischen acht und zwölf Uhr, um die Heizung zu reparieren." || @tags de.listening
      tr: I reserve the right to take further steps. || Ich behalte mir weitere Schritte vor. | Weitere Schritte behalte ich mir vor. || Sich (dat.) etwas vorbehalten; the prefix vor goes to the end. || @tags de.formal-writing,de.separable
      dict: Trotz meiner Meldung ist bis heute keine Reparatur erfolgt.
      ask: Sie rufen bei der Hausverwaltung an, weil der Aufzug seit drei Wochen außer Betrieb ist. Beschweren Sie sich höflich, aber bestimmt, und nennen Sie eine Frist. || kw: aufzug & bitte/fordere/erwarte/möchte & bis/spätestens/frist || Guten Tag, mein Name ist Haddad. Der Aufzug in der Lindenstraße 12 ist seit drei Wochen außer Betrieb. Ich bitte Sie dringend, ihn bis spätestens Ende nächster Woche reparieren zu lassen.
      write: Write a short formal complaint (90–110 words) to a gym that is still charging you after you cancelled your membership. || min=80 || req: sehr geehrte | gekündigt/kündigung | fordere/bitte | bis/spätestens | mit freundlichen grüßen || Sehr geehrte Damen und Herren, am 15. März habe ich meine Mitgliedschaft (Nr. 48211) fristgerecht zum 30. April gekündigt. Die Kündigung haben Sie mir am 18. März schriftlich bestätigt. Trotzdem wurde im Mai und im Juni erneut der Monatsbeitrag von meinem Konto abgebucht. Ich fordere Sie daher auf, mir die zu Unrecht abgebuchten Beträge von insgesamt 79,80 Euro bis spätestens zum 15. Juli zurückzuzahlen und weitere Abbuchungen zu stoppen. Sollte bis dahin keine Zahlung erfolgen, werde ich mich an die Verbraucherzentrale wenden. Eine Kopie Ihrer Bestätigung finden Sie in der Anlage. Mit freundlichen Grüßen Daniel Okoro
