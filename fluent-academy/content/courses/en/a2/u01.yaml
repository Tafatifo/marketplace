unit: 1
title: Looking back
theme: Life stories
description: Talk about last weekend, tell the main events of your life and share childhood memories with the past simple — regular and irregular verbs, was and were, did and didn't.
free: true
objectives:
  - Talk about last weekend and other recent events with regular past verbs and was/were
  - Tell the main events of your life with irregular past forms, dates and ages
  - Ask and answer questions about childhood with did and didn't
canDo:
  - I can say what I did last weekend and how it was.
  - I can tell the main events of my life with dates and ages.
  - I can ask someone about their childhood and answer their questions.
  - I can understand a short story about someone's past.
review: |
  fill: My sister ___ (study) in Leeds and then she ___ (become) a nurse. || studied ; became || Study → studied (consonant + y → ied); become is irregular: became. || @tags en.past-simple,en.past-irregular
  fill: The museum ___ closed, so we ___ (walk) along the river. || was ; walked || The museum = it → was; walk is regular → walked. || @tags en.past-simple,en.be
  fill: I moved to this city three years ___. || ago || Number + time + ago: three years ago. || @tags en.past-simple
  mc: My grandparents ___ in 1972. || *got married | get married | were marry || A finished time (1972) needs the past simple: got married. || @tags en.past-irregular
  mc: Choose the correct sentence. || I didn't saw the email. | *I didn't see the email. | I not saw the email. || After didn't, use the base form: didn't see. || @tags en.past-simple
  rw: Make a question :: You moved to Canada five years ago. || Did you move to Canada five years ago? || Did + you + base form (move). || @tags en.past-simple,en.questions
  rw: Make it negative :: I remembered her birthday. || I didn't remember her birthday. | I did not remember her birthday. || didn't + base form (remember). || @tags en.past-simple
  match: leave = left ; meet = met ; buy = bought ; find = found ; take = took || Match each verb with its irregular past form. || @tags en.past-irregular @skill vocabulary
  listen: Last summer I visited my uncle in Galway. It rained every day, but we cooked, chatted and played cards. || What was the weather like? || Sunny and hot | *Rainy | Cold and snowy || "It rained every day." || @tags en.listening,en.past-simple
  listen: I was born in Lagos, but I grew up in Houston. We moved there when I was six. || Where did the speaker grow up? || Lagos | *Houston | We don't know || The speaker was born in Lagos but grew up in Houston. || @tags en.listening,en.past-irregular
  ask: Tell a partner about a special day from your childhood — how old you were, where you were and what you did. || kw: was/were & when/old || When I was nine, we went to the zoo for my birthday. I was so happy. I saw a giraffe and we had ice cream.
  write: Write an email to a new pen pal about your life so far — where you were born, where you grew up, one big change, and what you did last weekend. || min=50 || req: was born | grew up | last weekend/on Saturday/on Sunday || Hi Lena, I was born in Porto, in Portugal, but I grew up in Montreal. My family moved there when I was five. I left home at eighteen and went to college in Ottawa. Last weekend I visited my parents and we cooked a big dinner together. Write soon! Inês
lessons:
  - title: Last weekend
    summary: Say what you did last weekend with regular past verbs, describe it with was and were, and use past time expressions.
    minutes: 40
    skills: [grammar, speaking, listening]
    tags: [en.past-simple, en.be, en.ed-endings]
    objectives:
      - Use regular past simple verbs and their spelling rules
      - Use was/were and time expressions like last night, yesterday and two days ago
      - Ask "How was your weekend?" and give a short, natural answer
    intro: |
      Every Monday, people ask the same question: **How was your weekend?** To answer it, you need the **past simple**. In this lesson you will use regular past verbs (*visited, stayed, cleaned*), the past of be (**was, were**) and time expressions like **last night** and **two days ago** — so you can tell a short story about your weekend.
    vocab: |
      visit | to go and see a person or a place | v | Last Sunday we visited my grandmother. | - | c: visit a friend; visit a museum
      stay in | to stay at home and not go out | phr v | It was cold, so we stayed in and watched TV. | - | c: stay in on Saturday night | n: The opposite is go out.
      clean up | to make a place clean and neat | phr v | I cleaned up the kitchen after breakfast. | - | c: clean up the house; clean up after a party
      relax | to rest and do nothing difficult | v | On Sunday I relaxed on the balcony with a book. | - | c: relax at home; relax by the pool
      chat | to talk in a friendly, informal way | v | I chatted with my cousin on the phone for an hour. | - | c: chat with a friend; chat online | n: Past: chatted (double t).
      invite | to ask someone to come to an event or to your home | v | We invited our new neighbors for lunch. | - | c: invite someone to a party; invite someone for dinner
      board game | a game you play on a table with pieces, like chess | n | We played board games all evening. | - | c: play a board game
      yesterday | the day before today | adv | Yesterday I walked to work. | - | c: yesterday morning; yesterday afternoon | n: Say last night, not yesterday night.
      last | the one before this one | adj | Last weekend I painted my bedroom. | - | c: last night; last week; last Saturday; last year | n: No "the": last week, not the last week.
      ago | before now (after a period of time) | adv | I started this job two months ago. | - | c: two days ago; a long time ago | n: Number + time + ago.
      exciting | making you feel happy and full of energy | adj | The soccer game was really exciting! | - | n: The opposite is boring.
      boring | not interesting | adj | The movie was boring, so we stopped watching. | - | c: a boring weekend; really boring
      That sounds fun. | a friendly reply when someone tells you about their plans or their weekend | expr | We played volleyball on the beach. — That sounds fun! | - | c: That sounds great; That sounds nice
    grammar:
      title: "Past simple: regular verbs, was and were"
      body: |
        We use the **past simple** for actions and situations that finished in the past, often with a time: *last night, yesterday, on Saturday, two days ago*.

        **Regular verbs** add **-ed**, and the form is the same for every person: *I worked, she worked, they worked.* Watch the spelling:
        - verbs ending in **e** add only **-d**: *live → lived, invite → invited*
        - consonant + **y** → **-ied**: *study → studied* — but vowel + y stays: *play → played, stay → stayed*
        - short verbs ending in one vowel + one consonant double the consonant: *stop → stopped, chat → chatted, plan → planned*

        The verb **be** has two past forms: **was** (I, he, she, it) and **were** (you, we, they). Negatives: **wasn't, weren't**. Questions put the verb first: ***Was** it fun? **Were** you tired?* Short answers: *Yes, it was. / No, we weren't.*
      table: |
        Base form | Past simple | Rule
        work | worked | add -ed
        live | lived | ends in e: add -d
        study | studied | consonant + y → -ied
        play | played | vowel + y: add -ed
        stop | stopped | double the last consonant
        be (I / he / she / it) | was / wasn't | irregular
        be (you / we / they) | were / weren't | irregular
      examples: |
        I visited my cousins last weekend. | | regular: visit → visited
        We stayed in because it was cold. | | it → was
        The movies weren't very good. | | plural → were + not
        Was your weekend relaxing? — Yes, it was. | | question: was before the subject
      tip: "Learn past time expressions as chunks: last night, last week, two days ago, yesterday morning. And remember: never \"yesterday night\" or \"the last week\"."
    dialogue:
      title: Monday morning
      setting: Monday morning at a bike repair shop in Minneapolis. Rosa and her coworker Felix are opening the shop and talking about the weekend.
      speakers: R=Rosa/f; F=Felix/m
      lines: |
        R: Hi, Felix! How was your weekend?
        F: It was great, thanks. I visited my aunt in Duluth.
        R: Oh, nice! Was the weather OK up there?
        F: No, it was really cold, so we stayed in.
        F: We cooked a big dinner and played board games all evening.
        R: That sounds fun. My weekend wasn't very exciting.
        F: Why not? What did you do?
        R: I cleaned up my apartment and washed about a hundred dishes.
        R: Then I watched two movies on the sofa.
        F: Honestly, that sounds like a perfect weekend to me!
        R: Well, it was relaxing. And on Sunday I walked by the lake.
    pronunciation:
      title: "Three sounds for -ed: walked, cleaned, visited"
      body: |
        The **-ed** ending has three pronunciations. After sounds like **k, p, s, sh, ch** it sounds like **t**: *walked* (walkt), *washed*, *watched*. After most other sounds it sounds like **d**: *cleaned, played, stayed*.

        Only after **t** or **d** do we add an extra syllable, **-id**: *visit-id, invit-id, need-id*. So *walked* has one syllable, but *visited* has three. Listen and repeat.
      items: |
        walked
        cleaned
        visited
        washed the dishes
        invited my friends
        stayed in
    culture:
      title: "\"How was your weekend?\""
      body: |
        In the US, Canada and the UK, *How was your weekend?* or *Did you do anything fun?* is a very common question on Monday at work or school. It is small talk: people expect a short, friendly answer — two or three sentences — and then they ask you the same question.

        You will hear **on the weekend** in American English and **at the weekend** in British English. Both are correct, so choose one and use it.
    mistakes: |
      I visit my aunt last weekend. => I visited my aunt last weekend. | Last weekend is a finished time, so use the past simple: visited.
      We was very tired. => We were very tired. | Use were with you, we and they, and was with I, he, she and it.
      I stayed in yesterday night. => I stayed in last night. | Say last night. Yesterday morning, yesterday afternoon and yesterday evening are fine.
    task:
      title: Monday small talk
      mode: speaking
      body: |
        A coworker asks you, "How was your weekend?" Answer in four or five sentences: say how it was (*great, relaxing, boring…*), what the weather was like and three things you did. Then ask your coworker the same question. Practice with the AI coach in the "Talking about your day" scenario.
    exercises: |
      fill: Last Saturday I ___ (clean) the whole apartment. || cleaned || Clean is a regular verb: add -ed. || @tags en.past-simple
      fill: We ___ (study) for the test all evening. || studied || Consonant + y → -ied: study → studied. || @tags en.past-simple,en.spelling
      fill: My parents ___ (chat) with the neighbors for hours. || chatted || Chat ends in vowel + consonant, so double the t: chatted. || @tags en.past-simple,en.spelling
      fill: The concert ___ amazing, but the tickets ___ very expensive. || was ; were || The concert = it → was; the tickets = they → were. || @tags en.past-simple,en.be
      mc: Choose the correct sentence. || I stayed in yesterday night. | *I stayed in last night. | I stayed in the last night. || We say last night — not yesterday night, and no "the" before last. || @tags en.past-simple,en.collocations
      mc: "How was your weekend?" Choose the best answer. || *It was great, thanks. I visited my aunt. | It is great, thanks. I visit my aunt. | It were great, thanks. I visited my aunt. || The weekend is finished, so use was and a past verb (visited). It is singular, so not were. || @tags en.past-simple,en.be
      rw: Rewrite the sentence with "last Sunday" :: I play tennis with my brother on Sundays. || I played tennis with my brother last Sunday. | Last Sunday I played tennis with my brother. || Last Sunday is a finished time, so play → played. || @tags en.past-simple
      rw: Make it negative :: The weather was warm. || The weather wasn't warm. | The weather was not warm. || Add not after was: wasn't. || @tags en.past-simple,en.be
      order: We invited our new neighbors for lunch on Sunday. || @tags en.past-simple
      tf: Felix stayed at home all weekend. || false || He visited his aunt in Duluth. They stayed in at his aunt's house because it was cold. || @ctx dialogue
      short: Where did Rosa walk on Sunday? || kw: lake || "On Sunday I walked by the lake." || @ctx dialogue
      listen: @dialogue || Why did Felix and his aunt stay in? || It was too hot. | *It was really cold. | They were very tired. || Felix says, "It was really cold, so we stayed in." || @tags en.listening
      listen: I worked late on Friday, so I was very tired. On Saturday I stayed in and relaxed. || What did the speaker do on Saturday? || Went to a party | *Stayed at home and relaxed | Worked late at the office || "On Saturday I stayed in and relaxed." The speaker worked late on Friday. || @tags en.listening,en.past-simple
      dict: We watched a movie and cooked dinner at home. || Two regular past verbs.
      ask: A coworker asks, "How was your weekend?" Answer and give two things you did. || kw: was/were & visited/stayed/cleaned/watched/played/cooked/walked/relaxed/chatted/invited/visit/stay/clean/watch/play/cook/walk/relax || It was really nice, thanks. I visited my parents on Saturday, and on Sunday I cleaned up my apartment and relaxed.
      write: Write a short message to a friend about last weekend — how it was, the weather and three things you did. || min=35 || req: weekend | was/were || Hi Jess! My weekend was lovely. On Saturday the weather was sunny, so I walked to the market and cooked lunch for my brother. In the evening we played board games. On Sunday I stayed in and relaxed. How was yours?

  - title: My life so far
    summary: Tell the main events of your life — where you were born, where you grew up, moves, studies and work — with irregular past verbs, dates and ages.
    minutes: 40
    skills: [grammar, reading, writing]
    tags: [en.past-irregular, en.past-simple, en.prepositions-time]
    objectives:
      - Use common irregular past forms (went, grew up, met, left, got)
      - Say when things happened with in + year, at + age and when I was…
      - Tell your life story in a few connected sentences
    intro: |
      When you make new friends, they often ask about your story: *Where did you grow up? Why did you move here?* Many of the verbs we need for life stories are **irregular** — *go → went, grow → grew, meet → met*. In this lesson you will learn the most useful ones and how to say **when** things happened.
    vocab: |
      be born | to come into the world as a baby | v | I was born in Seoul in 1996. | - | n: Always with was or were: I was born, they were born.
      grow up | to change from a child into an adult in a place | phr v | She grew up on a farm in Iowa. | - | c: grow up in a city; grow up with brothers | n: Past: grew up.
      move | to go and live in a different place | v | We moved to Vancouver when I was ten. | - | c: move to a city; move house (British English)
      leave | to go away from a place or a school | v | He left home at eighteen. | - | c: leave home; leave school | n: Past: left.
      college | a place where you study after high school (in American English, also a university) | n | My sister went to college in Texas. | - | c: go to college; a college student
      get a job | to start working for a company or a person | expr | I got a job in a hotel after college. | - | n: Past: got.
      meet | to see someone for the first time; to come together with someone | v | My parents met at a dance class. | - | c: meet a friend; meet someone new | n: Past: met.
      get married | to become husband and wife, or wife and wife, or husband and husband | expr | Lucas and Hugo got married last spring. | - | c: get married to someone | t: es=casarse; fr=se marier; de=heiraten; da=blive gift
      become | to start to be something | v | She became a teacher at twenty-five. | - | n: Past: became.
      begin | to start | v | I began my first job in 2019. | - | n: Past: began.
      retire | to stop working because you are older | v | My grandfather retired at sixty-five. | - | c: retire early
      hometown | the town or city where you grew up | n | My hometown is very small and quiet. | - | n: People sometimes use it for the place where they were born.
      at first | at the beginning (but later it was different) | expr | At first, life in a new country was hard. | - | n: Often used with "but then…".
    grammar:
      title: "Irregular past forms; in, at and when"
      body: |
        Many common verbs are **irregular**: they don't add -ed in the past. You need to learn them, but there's good news — like regular verbs, they have **one form for every person**: *I went, she went, they went.*

        To say **when** something happened, use:
        - **in** + a year, a month or a season: *in 2015, in May, in the summer*
        - **at** + an age: *at eighteen, at the age of twenty*
        - **when** + was/were + an age: *when I was six*
        - number + time + **ago**: *ten years ago*

        **Be born** always uses was/were: *I **was** born in 1999* (never ~~I born~~). Don't add the word *year* after a date: say *in 2015*, not ~~in 2015 year~~.
      table: |
        Base form | Past simple | Example
        go | went | I went to college in Boston.
        grow up | grew up | She grew up in Cork.
        leave | left | He left school at sixteen.
        meet | met | We met in 2012.
        get | got | They got married in May.
        have | had | I had my first job at sixteen.
        become | became | She became a doctor.
        come | came | My family came here ten years ago.
      examples: |
        I was born in Lima, but I grew up in Miami. | | was born + grew up
        My brother left home at nineteen. | | at + age
        We moved to Chicago when I was six. | | when + was + age
        She became a manager two years ago. | | ago
      tip: "Learn irregular verbs in groups that sound alike: get – got, forget – forgot; grow – grew, know – knew; meet – met, leave – left."
    dialogue:
      title: Choir break
      setting: A Tuesday evening at a community choir in Auckland, New Zealand. Two new members, Hemi and Clara, chat during the break.
      speakers: H=Hemi/m; C=Clara/f
      lines: |
        H: So, Clara, where did you grow up?
        C: I was born in Santiago, in Chile.
        C: I grew up there, and I left home at nineteen.
        H: Why did you come to New Zealand?
        C: I got a job at a hospital here in 2018.
        H: Wow. Was it hard at first?
        C: Yes, it was hard at first. But then I met Tomasz.
        H: Is he your husband?
        C: Yes! We got married three years ago.
        H: That's a great story. I'm from Auckland — I never left!
        C: Really? Not even for college?
        H: No, I went to college ten minutes from my parents' house!
    pronunciation:
      title: "Weak was and were"
      body: |
        In a normal sentence, **was** and **were** are not stressed, so they are short and weak: *I was born* sounds like "I wəz born", and *We were young* sounds like "We wə young". The vowel is a quick, relaxed **schwa** sound.

        In short answers at the end of a sentence, they are strong: *Yes, I **was**.* Listen and repeat.
      items: |
        I was born in Chile.
        We were very young.
        Where were you born?
        It was hard at first.
        Yes, I was.
    culture:
      title: "\"Where are you from?\""
      body: |
        In countries like New Zealand, Australia, Canada and the US, many people were born in one country and grew up in another. That's why people often ask *Where did you grow up?* — the answer is sometimes more interesting than *Where are you from?*

        In American English, **college** often means university: *I went to college in Ohio.* In New Zealand, Australia and the UK, some young people take a **gap year** — a year to travel or work — before they go to university.
    mistakes: |
      I born in 1999. => I was born in 1999. | Born needs was or were: I was born, we were born.
      I goed to college in Boston. => I went to college in Boston. | Go is irregular: go → went.
      I moved to Canada in 2015 year. => I moved to Canada in 2015. | Say in + the year, without the word year.
    task:
      title: My life map
      mode: writing
      body: |
        Draw a simple timeline of your life with five or six important moments: where you were born, where you grew up, school, a move, a job or studies, and an important person you met. Then write one sentence for each moment, with a date or an age. Read it to a friend, or tell your story to the AI coach in the "Introducing yourself" scenario.
    exercises: |
      fill: I ___ born in Manila in 2001. || was || Born always uses was or were: I was born. || @tags en.past-simple,en.be
      fill: My parents ___ (meet) at a dance class in 1990. || met || Meet is irregular: meet → met. || @tags en.past-irregular
      fill: She ___ (grow) up in a small town near Cork. || grew || Grow is irregular: grow → grew. || @tags en.past-irregular
      fill: We ___ (leave) Toronto and ___ (move) to Vancouver in 2019. || left ; moved || Leave is irregular (left); move is regular (moved). || @tags en.past-irregular,en.past-simple
      match: go = went ; have = had ; get = got ; become = became ; begin = began || Match each verb with its irregular past form. || @tags en.past-irregular @skill vocabulary
      mc: Choose the correct sentence. || I went to college in 2015 year. | *I went to college in 2015. | I went to college on 2015. || Use in + the year, without the word year. || @tags en.prepositions-time
      mc: When did Clara get a job in New Zealand? || In 2008 | *In 2018 | Three years ago || "I got a job at a hospital here in 2018." She got married three years ago. || @ctx dialogue @skill reading @tags en.reading
      tf: Hemi went to college in another city. || false || He went to college ten minutes from his parents' house. || @ctx dialogue
      rw: Put the sentence in the past simple :: Kai leaves school and gets a job in a bakery. || Kai left school and got a job in a bakery. || Leave → left, get → got. || @tags en.past-irregular
      order: She became a teacher when she was twenty-five. || @tags en.past-irregular
      listen: My grandmother was born in Jamaica in 1950. She moved to London when she was eighteen. || How old was the grandmother when she moved to London? || 15 | *18 | 50 || "She moved to London when she was eighteen." She was born in 1950. || @tags en.listening,en.numbers
      listen: @dialogue || When did Clara leave home? || *At nineteen | At eighteen | In 2018 || "I left home at nineteen." || @tags en.listening
      dict: I grew up in a small town and left home at eighteen.
      ask: Tell a new friend three facts about your life — where you were born, where you grew up and one big change. || kw: born & grew/grow & moved/left/went/got/began/started/met/became/came || I was born in Hanoi and I grew up there. I came to Canada in 2020 to study, and I got my first job here last year.
      write: Write a short "life so far" profile for your class website (5–6 sentences) — where you were born, where you grew up, school or college, a move or a job, and one more important moment. || min=45 || req: was born | grew up || I was born in Kraków, in Poland, in 1998. I grew up there with my two brothers. I left school at eighteen and went to college in Warsaw. In 2021 I got a job in Dublin, so I moved to Ireland. At first it was hard, but then I met some great friends at work.

  - title: Childhood memories
    summary: Ask and answer questions about childhood with did, didn't and was/were, and share a happy memory.
    minutes: 40
    skills: [grammar, listening, speaking]
    tags: [en.past-simple, en.questions, en.intonation]
    objectives:
      - Make past simple questions and negatives with did and didn't
      - Choose between did and was/were in questions
      - Ask someone about their childhood and talk about your own
    intro: |
      Childhood memories are a great topic for conversation — everybody has a favorite toy, game or summer. To ask about the past, English uses **did**: *Did you have a pet? What did you play?* In this lesson you will make past questions and negatives, and learn when to use **was/were** instead of did.
    vocab: |
      childhood | the time when you are a child | n | I had a very happy childhood. | - | c: a happy childhood; childhood memories
      kid | a child (informal) | n | When I was a kid, I loved cartoons. | - | c: as a kid; the kids
      toy | a thing that children play with | n | My favorite toy was a small wooden train. | - | c: play with a toy; a toy car
      hide-and-seek | a game: one child closes their eyes and the others hide | n | We played hide-and-seek in the park. | - | t: es=el escondite; fr=cache-cache; de=Verstecken; da=gemmeleg
      climb | to go up something using your hands and feet | v | My brother and I climbed trees every day. | - | c: climb a tree; climb a wall | n: The b is silent.
      ride | to sit on a bike or a horse and control it | v | I rode my bike to the beach. | - | c: ride a bike; ride a horse | n: Past: rode.
      scared | afraid; feeling fear | adj | I was scared of dogs as a child. | - | c: scared of the dark; scared of spiders
      shy | nervous with people you don't know | adj | She was very shy at school. | - | c: a bit shy; shy with new people
      remember | to have something in your mind from the past | v | I remember my first day at school. | - | c: remember a name; I don't remember
      miss | to feel sad because someone or something is not with you now | v | I miss my grandmother's cooking. | - | c: miss someone; miss home
      elementary school | a school for children from about 5 to 11 | n | I walked to elementary school with my sister. | - | n: British English: primary school.
      summer vacation | the long school holiday in the summer | n | We spent every summer vacation at the lake. | - | n: British English: the summer holidays.
      get into trouble | to do something wrong and then have a problem with a parent or teacher | expr | I got into trouble for drawing on the wall. | - | n: Past: got into trouble.
    grammar:
      title: "Past simple questions and negatives: did and didn't"
      body: |
        To make a past simple **question**, use **did** + subject + **base form**: *You lived in Lima.* → ***Did** you **live** in Lima?* With question words: *Where **did** you **live**? What **did** you **play**?*

        For **negatives**, use **didn't** (did not) + base form: *I **didn't like** math.* The past is already in *did*, so the main verb doesn't change: say *didn't go*, never ~~didn't went~~.

        Short answers: *Yes, I **did**. / No, I **didn't**.*

        **Be is different.** We don't use did with was/were: ***Were** you shy? **Was** it far? I **wasn't** scared.* Use was/were before adjectives (*shy, scared, happy*) and places (*at home*).
      table: |
        Positive | Negative | Question | Short answers
        I liked school. | I didn't like school. | Did you like school? | Yes, I did. / No, I didn't.
        She rode a bike. | She didn't ride a bike. | Did she ride a bike? | Yes, she did. / No, she didn't.
        We were shy. | We weren't shy. | Were you shy? | Yes, we were. / No, we weren't.
        — | — | Where did you live? | In a small town near Accra.
      examples: |
        Did you have a pet? — Yes, I did. A rabbit. | | did + base form (have)
        I didn't go to summer camp. | | didn't + go (not went)
        What did you do after school? | | question word + did
        Were you scared of the dark? — No, I wasn't. | | be: no did
      tip: "If the question has an adjective like shy or scared, start with Was or Were. If it has an action verb like play or live, start with Did."
    dialogue:
      title: The red bike
      setting: A Sunday afternoon in Halifax, Canada. Imani is visiting her dad, Victor. They are looking at an old photo album.
      speakers: I=Imani/f; V=Victor/m
      lines: |
        I: Dad, is this you? With the red bike?
        V: Yes! I was about eight. I loved that bike.
        I: Did you ride it to school?
        V: No, I didn't. School was too far away.
        I: Were you a good student?
        V: Not really. I didn't like math at all.
        I: So what did you do after school?
        V: We played hide-and-seek in the park for hours.
        I: Did Grandma let you stay out late?
        V: No way! We came home before dark every day.
        V: I still miss those long summer evenings.
    pronunciation:
      title: "Did you…? — linking and rising intonation"
      body: |
        In fast speech, **did you** often sounds like "didja": the d and the y join together. *What did you do?* sounds like "Whatdidja do?"

        In yes/no questions (*Did you…? Were you…?*) the voice usually goes **up** at the end ↗. In questions with *What, Where, Why*, the voice usually goes **down** ↘. Listen and repeat.
      items: |
        Did you like school?
        Did you have a pet?
        What did you do?
        Where did you live?
        Yes, I did.
        No, I didn't.
    culture:
      title: School years and summer vacation
      body: |
        In the US and Canada, children usually go to **elementary school**, then **middle school** (or junior high) and **high school**. In the UK, they go to **primary school** and then **secondary school**.

        The American summer vacation is long — often ten or eleven weeks — and many kids go to **summer camp** for a week or two, with sports, swimming and campfires. In the UK and Ireland, the summer holidays are usually about six to nine weeks.
    mistakes: |
      I didn't went to school by bus. => I didn't go to school by bus. | After didn't, use the base form (go), not the past form.
      Did you liked school? => Did you like school? | After did, the main verb is in the base form: like.
      Did you shy as a child? => Were you shy as a child? | With adjectives like shy, use was/were, not did.
    task:
      title: Childhood interview
      mode: interaction
      body: |
        Interview a friend, a family member or a classmate about their childhood. Prepare five questions with *Did…?*, *Were…?* and *What/Where did…?* (games, school, friends, pets, summers). Write down their answers, then tell someone one surprising thing you learned. You can also practice with the AI coach — ask it about its "childhood" and answer its questions.
    exercises: |
      fill: ___ you have a pet when you were little? — Yes, a dog. || Did || Past simple question: Did + subject + base form (have). || @tags en.past-simple,en.questions
      fill: I ___ (not / like) vegetables when I was a kid. || didn't like / did not like || Negative: didn't + base form. || @tags en.past-simple
      fill: ___ you scared of the dark? — Yes, I was. || Were || Scared is an adjective, so use were — not did. || @tags en.past-simple,en.be,en.questions
      mc: Choose the correct question. || Did you went to summer camp? | *Did you go to summer camp? | You did go to summer camp? || Did + subject + base form: Did you go…? || @tags en.past-simple,en.questions
      mc: "Did you climb trees as a kid?" — "No, I ___." || *didn't | wasn't | don't || Answer a did-question with did or didn't. Don't is for the present. || @tags en.past-simple
      rw: Make a question :: She played the piano as a child. || Did she play the piano as a child? || Did + she + base form (play). || @tags en.past-simple,en.questions
      rw: Make it negative :: We went to the beach every summer. || We didn't go to the beach every summer. | We did not go to the beach every summer. || didn't + base form: go (not went). || @tags en.past-simple
      short: Why didn't Victor ride his bike to school? || kw: far || "School was too far away." || @ctx dialogue
      tf: Victor liked math at school. || false || He says, "I didn't like math at all." || @ctx dialogue
      listen: @dialogue || What did Victor and his friends do after school? || They played soccer. | *They played hide-and-seek. | They rode bikes to the beach. || "We played hide-and-seek in the park for hours." || @tags en.listening
      listen: When I was a kid, I didn't have a computer. I read comics and played outside with my brother. || What didn't the speaker have as a child? || *A computer | Comics | A brother || "I didn't have a computer." The speaker read comics and played with a brother. || @tags en.listening,en.past-simple
      order: What did you like best about elementary school? || @tags en.questions,en.past-simple
      dict: Did you walk to school when you were little?
      ask: Ask a classmate two questions about their childhood — school, games or friends. || kw: did/were & you || Did you like elementary school? What did you play after school?
      write: Write about a happy childhood memory (4–5 sentences) — how old you were, where you were, who was with you and what you did. || min=35 || req: when I was/was/were || When I was seven, my aunt took me to the ocean for the first time. I was a bit scared of the waves at first. We built a big sandcastle and ate ice cream. I didn't want to go home! I still remember that day.
