unit: 2
title: Away from home
theme: Holidays and travel
description: Describe a holiday you remember, plan a trip with questions about distance, time and price, and tell the story of a travel problem with the past continuous and the past simple.
free: true
objectives:
  - Describe a holiday and set the scene with the past continuous
  - Ask about distances, travel times and prices to plan a trip
  - Tell the story of a travel problem with the past continuous and past simple (when, while)
canDo:
  - I can describe a holiday photo and say what was happening.
  - I can ask how far, how long and how much when I plan a trip.
  - I can explain what went wrong on a trip and what happened in the end.
  - I can understand short travel announcements and stories.
review: |
  fill: At seven a.m. the sun ___ (rise) and the birds ___ (sing). || was rising ; were singing || Background actions in progress: was/were + -ing. The sun = it → was; the birds = they → were. || @tags en.past-continuous
  fill: How long ___ it take to get to Galway by bus? || does || How long does it take…? needs does. || @tags en.questions
  fill: I ___ (lose) my passport while I ___ (shop) at the market. || lost ; was shopping || The short action (lost) is past simple; the longer action (was shopping) is past continuous. || @tags en.past-continuous,en.past-irregular
  mc: How ___ is the airport from downtown? — About twenty miles. || *far | long | much || Ask about distance with How far…? || @tags en.questions
  mc: We ___ dinner when the lights went out. || *were having | was having | are having || We → were + -ing for the action in progress. Are having is present. || @tags en.past-continuous
  rw: Join the sentences with "when" :: We were sitting on the beach. It started to rain. || We were sitting on the beach when it started to rain. | When it started to rain, we were sitting on the beach. || The background action is past continuous; when + past simple for the short action. || @tags en.past-continuous
  rw: Write the question for this answer :: The ticket costs forty dollars. || How much does the ticket cost? | How much is the ticket? || Ask about price with How much does… cost? or How much is…? || @tags en.questions
  mc: Your friend says, "Our train was canceled." What's the best reply? || *Oh no! What did you do? | That sounds fun! | Lucky you! || Bad news needs a sympathetic reaction like Oh no! || @tags en.discourse-markers
  listen: Our ferry was delayed for three hours because of the wind, so we missed dinner at the hotel. || Why was the ferry late? || The ferry broke down. | *It was very windy. | They missed dinner. || "Because of the wind." Missing dinner was the result, not the reason. || @tags en.listening
  listen: A round-trip ticket to Seattle is ninety-five dollars, and the bus takes about four hours. || How much is the ticket? || $59 | *$95 | $45 || "Ninety-five dollars" — $95. || @tags en.listening,en.numbers
  ask: Tell a friend about a holiday you remember — the place, the weather and one thing that happened. || kw: was/were & went/saw/visited/took/had/met/lost/ate/stayed/swam/got || Two years ago I went to Lisbon with my cousin. It was hot and sunny. One evening we were walking by the river when we saw a free concert.
  write: Write a short review of a trip for a travel website — where you went, how you traveled, what the place was like, and one problem you had. || min=50 || req: was/were | when/while || Last spring I took the train from London to Edinburgh with my friend. The trip took about four and a half hours and the views were lovely. The city was beautiful, but it was very windy! On the second day we were walking up to the castle when it started to rain, so we went to a museum instead. I really recommend it.
lessons:
  - title: A holiday to remember
    summary: Describe a holiday you remember and set the scene with the past continuous — the weather, the place and what people were doing.
    minutes: 40
    skills: [grammar, speaking, vocabulary]
    tags: [en.past-continuous, en.past-simple, en.vocabulary]
    objectives:
      - Form the past continuous (was/were + -ing)
      - Use it to describe the background of a scene or a photo
      - Talk about holiday activities and places
    intro: |
      A good holiday story starts with a picture: *The sun **was shining**, children **were playing** on the beach…* That background is the **past continuous**. In this lesson you will describe holiday scenes and photos, and learn useful words for trips, views and sightseeing.
    vocab: |
      go on vacation | to travel somewhere for a holiday | expr | We went on vacation to Portugal in June. | - | n: British English: go on holiday.
      trip | a journey to a place and back again | n | Our trip to Kyoto was amazing. | - | c: a day trip; a road trip; go on a trip
      go sightseeing | to visit famous places as a tourist | expr | We went sightseeing in Rome all morning. | - | n: Sightseeing is the activity: Sightseeing is tiring!
      view | what you can see from a place | n | The view from our room was beautiful. | - | c: a great view; a view of the ocean
      crowded | full of people | adj | The beach was really crowded on Saturday. | - | n: The opposite is quiet or empty.
      take photos | to make pictures with a camera or a phone | expr | I took hundreds of photos of the mountains. | - | n: Past: took. You can also say take pictures.
      souvenir | a small thing you buy to remember a place | n | I bought a mug as a souvenir. | - | c: a souvenir shop
      tour guide | a person whose job is to show a place to tourists | n | Our tour guide told us funny stories. | - | c: a local tour guide
      local | from the area where you are | adj | We ate at a small local restaurant. | - | c: local food; local people
      shine | (of the sun) to give light | v | The sun was shining all day. | - | n: Past: shone.
      hike | to go for a long walk in the mountains or the countryside | v | We hiked up the hill to see the sunset. | - | c: go hiking; a hiking trail
      island | a piece of land with water all around it | n | We took a boat to a small island. | - | n: The s is silent: "eye-land".
      unforgettable | so special that you remember it forever | adj | Swimming with dolphins was unforgettable. | - | n: un- + forget + -able.
    grammar:
      title: "Past continuous: was/were + -ing"
      body: |
        The **past continuous** is **was/were + verb-ing**. We use it for an action that was **in progress** at a time in the past: *At nine o'clock we **were having** breakfast by the pool.*

        It is perfect for **setting the scene** in a story or describing a photo — the background: *The sun **was shining**, people **were swimming**…* Then we use the **past simple** for the main events: *…and then we **saw** a dolphin!*

        Negatives: **wasn't / weren't + -ing**: *It **wasn't raining**.* Questions: ***Was** it **raining**? What **were** you **doing**?*

        Some verbs are not usually used in the continuous: *know, like, love, want, need*. Say *I knew the guide*, not ~~I was knowing the guide~~.
      table: |
        Subject | Positive | Negative | Question
        I / he / she / it | was swimming | wasn't swimming | Was she swimming?
        you / we / they | were swimming | weren't swimming | Were they swimming?
        — | — | — | What were you doing?
      examples: |
        It was a beautiful morning, and the sun was shining. | | background
        At nine o'clock we were having breakfast by the pool. | | in progress at a time
        Kids were playing in the water, and their parents were reading. | | describing a scene
        What were you doing at midnight? — We were watching the fireworks. | | question and answer
      tip: "Describe a photo in two steps: first the background with the past continuous (People were sitting…), then one event with the past simple (Then a parrot landed on my head!)."
    dialogue:
      title: Photos from Scotland
      setting: Lunchtime at a public library in San Diego. Farah is back from a trip to Scotland, and she shows her photos to her coworker Diego.
      speakers: F=Farah/f; D=Diego/m
      lines: |
        D: Welcome back! How was Scotland?
        F: Unforgettable! Look, this is the Isle of Skye.
        D: Wow, what a view! Was it cold?
        F: A little, but the sun was shining that day.
        D: Who's this man? Was he your tour guide?
        F: Yes, that's Callum. He was telling us about the old castles.
        F: And here we were hiking up a big hill.
        D: Were those people swimming in the sea? In Scotland?
        F: Yes! They were laughing, but the water was freezing.
        D: Did you buy any souvenirs?
        F: Just this scarf. And I took about five hundred photos!
    pronunciation:
      title: "Sentence stress: the SUN was SHINing"
      body: |
        In English sentences, we stress the important words — usually nouns, main verbs and adjectives — and say the small words (*was, were, the, a, of*) quickly and weakly.

        *The **SUN** was **SHIN**ing.* *We were **HIK**ing up a **HILL**.* This gives English its rhythm. Tap the table on each stressed syllable as you say the sentences. Listen and repeat.
      items: |
        The sun was shining.
        We were hiking up a hill.
        What a view!
        The water was freezing.
        They were swimming in the sea.
    culture:
      title: Vacation days
      body: |
        In the US there is no national law that gives workers paid vacation, and many people get about two weeks a year. In the UK, most full-time workers get at least 28 days a year, and these can include public holidays. That's one reason why Americans often take short trips — a long weekend at a lake or a road trip to a national park.

        Remember: Americans **go on vacation**, and British people **go on holiday**. In both countries, a **holiday** can also be a special day like New Year's Day.
    mistakes: |
      We was swimming in the sea. => We were swimming in the sea. | With we, you and they, use were.
      It was rain all day. => It was raining all day. | The past continuous needs was/were + -ing.
      I was knowing the guide. => I knew the guide. | Know is not usually used in the continuous form.
    task:
      title: Talk about a holiday photo
      mode: speaking
      body: |
        Choose a photo from a trip you remember. Describe it in five or six sentences: where you were, what the weather was like, what you and other people were doing, and one thing that happened. Record yourself in Speaking practice, or show the photo to a friend and answer their questions.
    exercises: |
      fill: The sun ___ (shine) and the birds ___ (sing). || was shining ; were singing || The sun = it → was shining; the birds = they → were singing. || @tags en.past-continuous
      fill: At nine p.m. we ___ (have) dinner on the terrace. || were having || We → were + -ing: an action in progress at nine p.m. || @tags en.past-continuous
      fill: What ___ you doing at midnight on New Year's Eve? || were || Question: were + you + -ing. || @tags en.past-continuous,en.questions
      fill: It ___ (not / rain), so we went to the beach. || wasn't raining / was not raining || Negative: wasn't + -ing. || @tags en.past-continuous
      mc: Choose the correct sentence. || We was walking on the beach. | *We were walking on the beach. | We were walk on the beach. || We → were, and the verb needs -ing. || @tags en.past-continuous
      rw: Make a question :: They were swimming in the lake. || Were they swimming in the lake? || Put were before the subject. || @tags en.past-continuous,en.questions
      rw: Put the verbs in the past continuous :: Many people sit in the square and drink coffee. || Many people were sitting in the square and drinking coffee. | Many people were sitting in the square and were drinking coffee. || People = they → were sitting, (were) drinking. Note the double t in sitting. || @tags en.past-continuous,en.spelling
      match: souvenir = a small thing you buy to remember a place ; view = what you can see from a place ; tour guide = a person who shows a place to tourists ; island = land with water all around it || Match each word with its meaning. || @tags en.vocabulary @skill vocabulary
      tf: Farah says it was very hot in Scotland. || false || She says it was a little cold, but the sun was shining. || @ctx dialogue
      short: What was Callum doing in the photo? || kw: telling/talking/explaining & castle/castles || "He was telling us about the old castles." || @ctx dialogue
      listen: @dialogue || What souvenir did Farah buy? || A mug | *A scarf | A book about castles || "Just this scarf." || @tags en.listening
      listen: It was a perfect evening. Children were playing on the sand, and a man was selling ice cream. || What was the man doing? || Playing on the sand | *Selling ice cream | Swimming in the sea || "A man was selling ice cream." The children were playing on the sand. || @tags en.listening,en.past-continuous
      dict: The sun was shining and people were swimming in the sea.
      ask: Describe a photo from a trip — where you were, what the weather was like and what people were doing. || kw: was/were & shining/raining/snowing/swimming/walking/sitting/playing/eating/hiking/having/taking/standing/smiling/laughing || This photo is from Vancouver. It was a sunny day and we were sitting by the water. My brother was taking photos and some kids were playing soccer.
      write: Write a short social media post about a holiday you remember — where you were, the weather, what people were doing, and one thing that happened. || min=35 || req: was/were || Throwback to my trip to Cape Town! It was a hot, windy day and we were hiking up Table Mountain. Lots of people were taking photos at the top. Then a little animal came and sat next to us. It was unforgettable!

  - title: Planning a trip
    summary: Plan a trip by asking about distances, travel times, tickets and prices, and choose how to travel.
    minutes: 35
    skills: [speaking, listening, vocabulary]
    tags: [en.questions, en.numbers, en.word-stress]
    objectives:
      - Ask How far…?, How long does it take…? and How much does… cost?
      - Answer with It takes…, It's about… and It costs…
      - Understand ticket and transportation words
    intro: |
      Before a trip you need answers: *How far is it? How long does it take? How much does a ticket cost?* In this lesson you will ask and answer these travel questions, talk about tickets and transportation, and make a simple plan with a friend.
    vocab: |
      plan | to decide what you are going to do | v | We're planning a trip to Ireland in May. | - | c: plan a trip; plan a route | n: Spelling: planning, planned.
      book | to arrange and pay for a ticket, a room or a table before you go | v | I booked the hotel online. | - | c: book a flight; book a room; book a table
      round-trip ticket | a ticket to go somewhere and come back | n | A round-trip ticket to Boston is eighty dollars. | - | n: British English: a return ticket.
      one-way ticket | a ticket to go somewhere but not come back | n | I only need a one-way ticket. | - | n: British English: a single ticket.
      direct | going from one place to another without stopping or changing | adj | Is there a direct flight to Sydney? | - | c: a direct flight; a direct train
      change | to get off one train or bus and get on another | v | You change trains in Montreal. | - | c: change trains; change buses
      take | to need an amount of time | v | The ferry takes ninety minutes. | - | c: It takes two hours; How long does it take?
      far | a long distance away | adj | Is the airport far from the city? | - | c: How far…?; not far; too far
      rent | to pay money to use something for a short time | v | We want to rent a car for a week. | - | c: rent a car; rent bikes
      ferry | a boat that carries people, and often cars, across water | n | We took the ferry to Vancouver Island. | - | c: take the ferry; catch the ferry
      schedule | a list of times when buses, trains or planes leave and arrive | n | Check the bus schedule before you go. | - | n: British English: timetable.
      on a budget | without much money to spend | expr | We're traveling on a budget this year. | - | c: travel on a budget; a tight budget | n: British English spells it travelling.
    grammar:
      title: "Travel questions: How far? How long? How much?"
      body: |
        To plan a trip, we use questions with **How** + a word:
        - **distance**: *How far is it from Toronto to Montreal?* — *It's about 540 kilometers.*
        - **time**: *How long does it take to get there (by train)?* — *It takes about five hours.*
        - **price**: *How much does a ticket cost?* or *How much is a ticket?* — *It costs $60. / It's $60.*
        - **times**: *What time does the bus leave / arrive?* — *At 7:15.*

        Remember the present simple question form: **does** + base form: *How much **does** it **cost**?* (not ~~How much costs it?~~). With **take**, the thing or trip is the subject: ***It takes** two hours to get there.* To talk about one person, add them after take: *It takes **me** twenty minutes to walk to work.*
      table: |
        Question | Answer
        How far is it to the beach? | It's about two miles. / It's not far.
        How long does it take by bus? | It takes about forty minutes.
        How much does a one-way ticket cost? | It costs $25. / It's $25.
        What time does the ferry leave? | It leaves at 8:30.
        Is there a direct train? | No, you change in York.
      examples: |
        How long does it take to get to the airport? — About an hour. | | how long + does + take
        It takes me ten minutes to walk to the station. | | take + person + time
        How much is a round-trip ticket to Chicago? | | how much is…?
        How far is the hotel from the beach? — It's only five minutes on foot. | | distance can be time on foot
      tip: "In the US people give distances in miles, but in Canada, Australia and New Zealand they use kilometers. (British English spells it kilometres, and the UK uses miles on road signs.)"
    dialogue:
      title: A long weekend in Quebec
      setting: An evening at Wei's apartment in Toronto. Wei and his friend Bianca are planning a long weekend in Quebec City on Wei's laptop.
      speakers: B=Bianca/f; W=Wei/m
      lines: |
        B: So, how far is Quebec City from Toronto?
        W: About eight hundred kilometers. That's a long drive.
        B: How long does it take by train?
        W: It takes about nine hours. You change in Montreal.
        B: Hmm. Is there a direct flight?
        W: Yes, it takes less than two hours.
        B: And how much does a round-trip ticket cost?
        W: Around three hundred dollars. The train is half that price.
        B: We're on a budget, so let's take the train.
        W: OK. What time does the morning train leave?
        B: At about seven. Let's book our tickets now!
    pronunciation:
      title: "Word stress in travel words"
      body: |
        Every English word with two or more syllables has one **stressed** syllable — it is louder and longer. Many travel words have the stress on the **first** syllable: ***TICK**et, **FER**ry, **BUD**get, **SCHED**ule*. But some have it on the second: *di**RECT**, va**CA**tion*.

        Americans usually say *schedule* with "sk", and many British people say it with "sh". Both are correct. Listen and repeat.
      items: |
        ticket
        ferry
        budget
        schedule
        direct
        vacation
    culture:
      title: Trains, planes and long drives
      body: |
        Distances in North America are very big, so for long trips most people drive or fly. Long-distance trains exist, for example between Toronto and Montreal, but they are often slower and are popular for the views.

        In the UK and Ireland, trains and buses connect most cities. In the UK, train tickets are often much cheaper if you book them weeks before your trip — a last-minute ticket on the same train can cost a lot more.
    mistakes: |
      How long it takes to get there? => How long does it take to get there? | Present simple questions need does + base form.
      How much costs the ticket? => How much does the ticket cost? | Use does + subject + cost, or say How much is the ticket?
      It takes two hours for go there. => It takes two hours to get there. | It takes + time + to + verb.
    task:
      title: Plan a weekend away
      mode: interaction
      body: |
        With a friend, choose a city for a weekend trip. Ask and answer at least four questions: how far it is, how long it takes by train, bus or car, how much it costs, and what time you can leave. Decide how you are going to travel. Then book a place to stay in the "Booking a hotel room" scenario with the AI coach.
    exercises: |
      fill: How long ___ it take to get to the airport? || does || How long + does + it + take…? || @tags en.questions
      fill: It ___ about forty minutes by bus. || takes || It takes + time. It = he/she/it, so add -s. || @tags en.questions,en.present-simple
      fill: How ___ is the beach from the hotel? — About two kilometers. || far || Ask about distance with How far…? || @tags en.questions
      mc: Choose the correct question. || How much costs a ticket? | *How much does a ticket cost? | How much does a ticket costs? || Does + subject + base form (cost, not costs). || @tags en.questions
      mc: You want to go to Boston and come back. Which ticket do you need? || A one-way ticket | *A round-trip ticket | A direct ticket || A round-trip ticket takes you there and back. A one-way ticket is for one direction only. || @tags en.vocabulary @skill vocabulary
      match: How far is it? = About fifty miles. ; How long does it take? = About an hour. ; How much is it? = Twenty dollars. ; What time does it leave? = At 8:15. || Match each question with its answer: distance, time, price and clock time. || @tags en.questions
      rw: Write the question for this answer :: It takes three hours to get to Dublin. || How long does it take to get to Dublin? || Ask about time with How long does it take…? || @tags en.questions
      order: What time does the ferry leave in the morning? || @tags en.questions
      tf: There is a direct train from Toronto to Quebec City. || false || Wei says, "You change in Montreal." || @ctx dialogue
      short: Why do Bianca and Wei choose the train? || kw: budget/money/price/cheap/cheaper/cost/expensive || Bianca says, "We're on a budget, so let's take the train." || @ctx dialogue
      listen: @dialogue || How long is the flight to Quebec City? || About eight hours | *Less than two hours | About nine hours || "It takes less than two hours." The train takes about nine hours. || @tags en.listening
      listen: The next bus to the airport leaves at ten fifteen. The trip takes about fifty minutes. || How long does the trip take? || Fifteen minutes | *About fifty minutes | About fifteen hours || "The trip takes about fifty minutes." 10:15 is the time the bus leaves. || @tags en.listening,en.numbers
      dict: How long does it take to get there by train?
      ask: You're at a travel agency. Ask three questions about a trip to the coast — the distance, the time and the price. || kw: how far/far & how long/long & how much/much/cost || How far is it to the coast? How long does it take by bus? How much does a round-trip ticket cost?
      write: Write a message to a friend about a trip you are planning — where you're going, how you're going to travel, how long it takes and how much it costs. || min=35 || req: going to | takes/take || Hi Marta! We're going to visit Belfast next month. We're going to take the train from Dublin. It takes about two hours, and a round-trip ticket costs about forty euros. Do you want to come with us?

  - title: When things go wrong on a trip
    summary: Tell the story of a travel problem — a delay, a lost bag, a flat tire — with the past continuous and past simple, when and while.
    minutes: 40
    skills: [grammar, listening, speaking]
    tags: [en.past-continuous, en.past-simple, en.intonation]
    objectives:
      - Use the past continuous for a background action and the past simple for an action that interrupts it
      - Join actions with when and while
      - Explain a travel problem and react to other people's stories
    intro: |
      Travel stories are often about problems: *We **were waiting** at the gate **when** they **canceled** the flight.* To tell them, we put the past continuous (the longer background action) together with the past simple (the short action). In this lesson you will tell travel stories with **when** and **while** and react with *Oh no!* and *What happened next?*
    vocab: |
      miss | to be too late for a train, bus or plane | v | We missed the last bus home. | - | c: miss a flight; miss a train
      delayed | late; leaving or arriving later than planned | adj | Our flight was delayed for three hours. | - | c: a delayed flight; badly delayed
      canceled | stopped; not happening now | adj | The ferry was canceled because of the storm. | - | n: British English spelling: cancelled.
      lose | to not be able to find something | v | I lost my sunglasses on the first day. | - | n: Past: lost. Get lost = not know where you are.
      get lost | to not know where you are or how to go somewhere | expr | We got lost in the old part of the city. | - | n: Past: got lost.
      suitcase | a big bag with a handle for your clothes when you travel | n | My suitcase didn't arrive in Rome. | - | c: pack a suitcase; carry a suitcase
      wallet | a small flat case for money and cards | n | Someone took my wallet on the subway. | - | n: Many women carry a purse, which is similar.
      steal | to take something that isn't yours | v | Someone stole my bike outside the hotel. | - | n: Past: stole.
      break down | (of a car, bus or machine) to stop working | phr v | Our rental car broke down on the highway. | - | n: Past: broke down.
      flat tire | a tire with no air in it | n | We got a flat tire near the campsite. | - | n: British English: flat tyre.
      lost and found | a place where people take things that someone lost | n | I asked at the lost and found desk. | - | n: British English: lost property.
      luckily | used to say that something good happened by chance | adv | Luckily, a kind woman found my phone. | - | n: The opposite is unfortunately.
      in the end | finally; after a lot of problems or time | expr | In the end, we took a taxi to the hotel. | - | c: in the end, everything was OK
    grammar:
      title: "Past continuous and past simple: when and while"
      body: |
        We often use the two past tenses together. The **past continuous** describes a **longer action in progress** (the background). The **past simple** describes a **short action** that happened in the middle of it and interrupted it.

        - *I **was waiting** for the bus **when** it **started** to rain.* — when + past simple
        - ***While** we **were sleeping**, someone **stole** our bikes.* — while + past continuous

        If you put the when/while part first, add a comma: *When the train stopped, we were sleeping.*

        Compare: *When the train **arrived**, we **got** on.* — two past simple verbs means one action **after** the other: first the train arrived, then we got on.
      table: |
        Longer action (past continuous) | Short action (past simple)
        I was walking to the hotel | when I lost my phone.
        We were driving to the airport | when the car broke down.
        While she was buying a coffee, | they changed the gate.
        While they were swimming, | someone took their towels.
      examples: |
        We were looking at the map when a kind man stopped to help. | | interruption with when
        While I was waiting at the gate, I fell asleep. | | while + past continuous
        When the plane landed, everybody clapped. | | two past simple actions: one after the other
      tip: "Use while with the longer action (was/were + -ing) and when with the short action (past simple). That way you'll almost always get it right."
    dialogue:
      title: The green backpack
      setting: Dublin Airport, Ireland. Ingrid is at the lost and found desk. She is talking to Patrick, who works there.
      speakers: I=Ingrid/f; P=Patrick/m
      lines: |
        I: Hi. I think I lost my backpack this morning.
        P: I'm sorry to hear that. What happened?
        I: I was waiting for my flight at gate twelve.
        I: While I was buying a coffee, they changed the gate.
        P: Oh dear. So you ran to the new gate?
        I: Yes, and I left my bag on a chair.
        P: What does it look like?
        I: It's small and green, with a yellow tag.
        P: Just a moment… Is this your bag?
        I: Yes! Oh, thank you so much!
        P: A cleaner found it while she was cleaning the area.
    pronunciation:
      title: "Reacting to a story"
      body: |
        When someone tells you a story, react with short phrases. Your voice shows your feelings, so make it move! Start **high** and go **down** for bad news: *Oh no! What a nightmare!*

        For surprise or to show interest, let your voice go **up**: *Really?* *What happened next?* Listen and repeat.
      items: |
        Oh no!
        Oh dear.
        Really?
        What a nightmare!
        That's terrible!
        What happened next?
    culture:
      title: Telling travel stories
      body: |
        "Travel disaster" stories are a favorite topic in English small talk — at work, at parties or on a long bus ride. A good story is short: set the scene, say what went wrong, and finish with what happened **in the end**.

        Listeners in English-speaking countries usually react while you talk — *Oh no! Really? And then what?* — to show that they are listening. If you stay completely quiet, the speaker may think you aren't interested.
    mistakes: |
      I was wait for the bus when it started to rain. => I was waiting for the bus when it started to rain. | The past continuous needs -ing: was waiting.
      I was walking to the hotel when I was losing my phone. => I was walking to the hotel when I lost my phone. | The short action that interrupts is past simple: lost.
      Someone stealed my wallet. => Someone stole my wallet. | Steal is irregular: steal → stole.
    task:
      title: A travel problem
      mode: interaction
      body: |
        Think of a problem on a trip — yours or someone else's: a delay, a lost bag, a wrong bus, bad weather. Tell the story in five or six sentences: what you were doing, what happened, how you felt and what happened in the end. Then practice explaining a problem with the AI coach in the "Handling a travel problem" scenario.
    exercises: |
      fill: I ___ (wait) for the bus when it ___ (start) to rain. || was waiting ; started || Longer action: was waiting. Short action that interrupts: started. || @tags en.past-continuous,en.past-simple
      fill: While we ___ (drive) to the airport, the car ___ (break) down. || were driving ; broke || While + past continuous (were driving); short action in the past simple: break → broke. || @tags en.past-continuous,en.past-irregular
      fill: They ___ (sleep) when someone ___ (steal) their bags. || were sleeping ; stole || The background action is past continuous; steal is irregular: stole. || @tags en.past-continuous,en.past-irregular
      mc: Choose the correct sentence. || I was walking to the hotel when I was losing my phone. | *I was walking to the hotel when I lost my phone. | I walked to the hotel when I was lose my phone. || The short, sudden action is past simple (lost); the longer one is past continuous (was walking). || @tags en.past-continuous
      mc: Our flight was ___, so we waited at the airport for five hours. || *delayed | direct | crowded || Delayed = late. Direct means without stops; crowded means full of people. || @tags en.vocabulary @skill vocabulary
      rw: Join the sentences with "when" :: I was having breakfast. My phone rang. || I was having breakfast when my phone rang. | When my phone rang, I was having breakfast. || The longer action is past continuous; when + past simple for the short action. || @tags en.past-continuous
      rw: Join the sentences with "while" :: We were looking at the map. A kind woman helped us. || While we were looking at the map, a kind woman helped us. | A kind woman helped us while we were looking at the map. || While goes with the longer action in the past continuous. || @tags en.past-continuous
      match: I lost my passport. = Go to your country's embassy. ; Our flight was canceled. = Ask the airline for another flight. ; We have a flat tire. = Call for help or change the wheel. ; We're lost. = Check the map on your phone. || Match each problem with a sensible solution. || @tags en.vocabulary @skill vocabulary
      tf: Ingrid left her backpack on a chair. || true || She says, "I left my bag on a chair." || @ctx dialogue
      short: What was Ingrid doing when they changed the gate? || kw: buying/bought/getting & coffee || "While I was buying a coffee, they changed the gate." || @ctx dialogue
      listen: @dialogue || Who found the backpack? || Patrick | *A cleaner | Another passenger || "A cleaner found it while she was cleaning the area." || @tags en.listening
      listen: We were driving to Cork when we got a flat tire. Luckily, a farmer stopped and helped us. || What happened? || *They got a flat tire. | They missed their flight. | They got lost in Cork. || "We got a flat tire", and a farmer helped them. || @tags en.listening,en.past-continuous
      dict: While we were sleeping, someone stole our bikes.
      ask: Tell a short story about a problem on a trip — what you were doing and what happened. || kw: was/were & when/while || I was waiting at the station in Lyon when they canceled my train. Luckily, there was a bus an hour later, so in the end I arrived for dinner.
      write: Write an email to a friend about a trip when something went wrong (5–6 sentences) — what you were doing, what happened, and what happened in the end. || min=45 || req: when/while | was/were || Hi Tom, our trip to Montreal was crazy! On the first day we were walking in the old town when it started to snow. We got lost and my phone died. While we were looking for a café, a friendly man showed us the way to our hotel. In the end, we had a great time. Love, Mia
