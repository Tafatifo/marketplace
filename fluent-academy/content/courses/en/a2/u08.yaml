unit: 8
title: "What's next?"
theme: Plans and choices
description: Talk about your plans and dreams with the first conditional, make arrangements with the present continuous, and compare options with superlatives.
free: false
objectives:
  - Talk about future plans, hopes and possible results with the first conditional
  - Make, change and confirm arrangements with the present continuous
  - Compare three or more options with superlatives and make a choice
canDo:
  - I can talk about my plans and hopes and say what will happen if…
  - I can make an arrangement with a friend and say what I'm doing this week.
  - I can compare several options and explain which one is the best for me.
  - I can understand short messages about plans and changes.
review: |
  fill: If it ___ (rain) on Saturday, we ___ (watch) a movie at home. || rains ; will watch / 'll watch || First conditional: if + present simple, will + base form. || @tags en.conditionals
  fill: I ___ (meet) Dana for lunch tomorrow at one. It's in my calendar. || am meeting / 'm meeting || A fixed arrangement: present continuous. || @tags en.present-continuous,en.future-forms
  fill: This is the ___ (cheap) phone plan, but it's not the ___ (good). || cheapest ; best || Short adjective: the + -est. Good is irregular: the best. || @tags en.comparatives
  mc: If I ___ the job, I'll move to Boston. || *get | will get | got || In the if-clause, use the present simple, not will. || @tags en.conditionals
  mc: "What are you doing on Friday evening?" || *I'm going to a concert with Leo. | I go to a concert with Leo. | I'm go to a concert with Leo. || Arrangements use the present continuous: I'm going. || @tags en.present-continuous,en.future-forms
  rw: Join the sentences with "if" :: You leave now. You'll catch the train. || If you leave now, you'll catch the train. | You'll catch the train if you leave now. | If you leave now, you will catch the train. || First conditional: if + present, will + base form. || @tags en.conditionals
  rw: Write the superlative sentence :: (Riverside Hotel / expensive / in the city) || The Riverside Hotel is the most expensive hotel in the city. | Riverside Hotel is the most expensive hotel in the city. | The Riverside Hotel is the most expensive in the city. | Riverside Hotel is the most expensive in the city. || Long adjective: the most + adjective + in + place. || @tags en.comparatives
  match: reschedule = change the time of a meeting ; afford = have enough money for something ; option = one of the things you can choose ; pros and cons = good and bad points || Match each word with its meaning. || @tags en.vocabulary @skill vocabulary
  listen: Hi, it's Mia. I'm really sorry, but I'm working late tonight, so I can't meet you at six. Are you free tomorrow instead? || What does Mia want to do? || Meet at six tonight | *Meet tomorrow | Work late with her friend || She can't meet tonight and asks, "Are you free tomorrow instead?" || @tags en.listening,en.present-continuous
  listen: The bus is the cheapest way to get to the airport, but the train is the fastest. A taxi is the most comfortable, of course. || Which is the fastest way to the airport? || The bus | *The train | A taxi || "The train is the fastest." The bus is the cheapest; a taxi is the most comfortable. || @tags en.listening,en.comparatives
  ask: Tell a friend what you're doing this weekend, and one thing you'll do if the weather is good. || kw: I'm/I am & if & will/'ll || On Saturday I'm having lunch with my aunt, and on Sunday I'm playing tennis with Ali. If the weather is good, we'll go to the beach after the game.
  write: Write an email to a friend about your plans for next year — one arrangement you've already made, one hope with "if", and the best option you're thinking about. || min=50 || req: if | will/'ll | the most/the best/the cheapest/the biggest/the nicest || Hi Jonas! Big news: I'm starting a new course in September — I already have my place. If I pass the first year, I'll look for a part-time job in a design studio. I'm also looking for a new apartment. The best option is a small studio near the university, but it's not the cheapest! Write soon, Emma
lessons:
  - title: Future plans
    summary: Talk about your plans, hopes and dreams, and what will happen if… — with the first conditional.
    minutes: 40
    skills: [grammar, speaking, writing]
    tags: [en.conditionals, en.future-forms, en.intonation]
    objectives:
      - Form the first conditional (if + present simple, will + base form)
      - Talk about plans, hopes and dreams with going to, hope to and plan to
      - Ask and answer What will you do if…?
    intro: |
      Plans depend on things that might happen: *If I pass my exams, I'll go to college. If I don't find a job, I'll travel.* In this lesson you will use the **first conditional** to talk about real possibilities in the future, and talk about your plans, hopes and dreams.
    vocab: |
      goal | something you want to achieve | n | My goal is to run a marathon. | - | c: set a goal; reach a goal
      dream | something you really want to happen in the future | n | Her dream is to open a bakery. | - | c: a dream job; follow your dream
      plan to | to intend to do something | v | We plan to move next year. | - | n: Similar: be going to.
      hope to | to want to do something and think it is possible | v | I hope to visit Japan someday. | - | n: Hope to + base form.
      decide | to choose what you are going to do after thinking | v | I decided to study nursing. | - | c: decide to do something | n: Noun: decision.
      save up | to keep money so that you can buy something later | phr v | I'm saving up for a new laptop. | - | c: save up for something
      afford | to have enough money to pay for something | v | We can't afford a car right now. | - | n: Usually with can or can't.
      get a promotion | to get a better job in the same company | expr | If I work hard, I'll get a promotion. | - | n: Past: got a promotion.
      start a business | to begin your own company | expr | My uncle started a business at fifty. | - | c: run a business; a small business
      take a year off | to stop work or studies for a year to do something different | expr | She took a year off to travel. | - | n: British English also: take a gap year.
      settle down | to start a calmer life in one place, often with a partner or family | phr v | I want to travel before I settle down. | - | n: Past: settled down.
      career | the jobs you do in your working life | n | She has a long career in medicine. | - | n: Stress: ca-REER.
      someday | at some time in the future | adv | Someday I'll write a book. | - | n: British English also: one day.
    grammar:
      title: "The first conditional: if + present, will"
      body: |
        We use the **first conditional** to talk about a **possible situation in the future** and its **result**:

        ***If** + present simple, **will** + base form*: *If I **get** a good job, I**'ll stay** here.*

        Use the **present simple** in the if-clause — **not will**: *If it **rains**…* (not ~~If it will rain~~). The negative is **don't/doesn't**: *If you **don't hurry**, you'll miss the bus.*

        The if-clause can come first (with a comma) or second (no comma): *I'll call you **if** I'm late.* In the result clause you can also use **won't**, **can** or an imperative: *If you're free, **call** me!*

        Questions: ***What will you do if** you don't get the job?*
      table: |
        if-clause (present simple) | result (will / won't + base form)
        If I pass my exams, | I'll go to college.
        If she gets the job, | she'll move to Boston.
        If we don't save money, | we won't go on vacation.
        If it rains tomorrow, | we'll stay at home.
        What will you do | if you don't get a place?
      examples: |
        If I save enough money, I'll travel to South America. | | if + present, will
        You'll be tired tomorrow if you don't go to bed. | | if second, no comma
        If he doesn't get a promotion, he'll look for a new job. | | doesn't in the if-clause
        What will you do if it's sunny on Sunday? — We'll go to the beach. | | question
      tip: "Never put will in both halves. Remember the pattern: if + now form (present), will + result."
    dialogue:
      title: After graduation
      setting: A sunny afternoon in Edinburgh, Scotland. Aisling and Ibrahim are in their final year at university. They're talking about their plans on a bench in the park.
      speakers: A=Aisling/f; I=Ibrahim/m
      lines: |
        A: So, what are you going to do after graduation?
        I: I'm not sure. If I get a good job, I'll stay here.
        A: And if you don't?
        I: Then I'll probably go back home to Manchester.
        A: I want to take a year off and travel.
        I: Really? How will you afford it?
        A: I'm saving up now. If I save enough, I'll go to South America.
        I: That sounds amazing. What's your big dream?
        A: Someday I hope to start my own business — a café.
        I: If you open a café, I'll be your first customer!
        A: Deal! And if it's successful, I'll give you free coffee.
    pronunciation:
      title: "Intonation in if-sentences"
      body: |
        In a first conditional sentence, your voice goes **up** a little at the end of the if-clause ↗ — it tells the listener "wait, there's more!" Then it goes **down** at the end of the result ↘.

        *If I get the job ↗, I'll move to Boston ↘.* Make a tiny pause at the comma. Listen and repeat.
      items: |
        If I pass, I'll celebrate.
        If it rains, we'll stay at home.
        What will you do if you don't get the job?
        If you open a café, I'll be your first customer.
        I'll call you if I'm late.
    culture:
      title: Graduation and the next step
      body: |
        In the US, high school and college graduations are big family events: students wear a **cap and gown**, and at the end many throw their caps in the air. Afterwards there are graduation parties with friends and family.

        In the UK, Ireland, Australia and New Zealand, some young people take a **gap year** — a year to work, volunteer or travel — before or after university. It's less common in the US, but more and more American students are trying it.
    mistakes: |
      If I will get the job, I'll move. => If I get the job, I'll move. | Use the present simple after if, not will.
      I'll call you if I will be late. => I'll call you if I'm late. | The if-clause uses the present simple, even when it comes second.
      If you won't hurry, you'll miss the bus. => If you don't hurry, you'll miss the bus. | The negative in the if-clause is don't/doesn't.
    task:
      title: My next five years
      mode: speaking
      body: |
        Talk for one minute about your next five years: one plan with going to, one hope with hope to, and three if-sentences (*If I…, I'll…*). Then ask a friend or the AI coach "What will you do if…?" and answer their questions. Record yourself in Speaking practice.
    exercises: |
      fill: If I ___ (pass) my exams, I'll go to college. || pass || Present simple after if. || @tags en.conditionals
      fill: If it rains tomorrow, we ___ (stay) at home. || will stay / 'll stay || Result: will + base form. || @tags en.conditionals
      fill: If she ___ (not / get) the job, she'll look for another one. || doesn't get / does not get || Negative in the if-clause: doesn't + base form. || @tags en.conditionals
      fill: What ___ you do if you don't find an apartment? || will || Question: What will you do if…? || @tags en.conditionals,en.questions
      mc: Choose the correct sentence. || If I will have time, I'll call you. | *If I have time, I'll call you. | If I have time, I call you tomorrow. || If + present simple, will + base form. || @tags en.conditionals
      rw: Join the sentences with "if" :: I save enough money. I'll travel to Peru. || If I save enough money, I'll travel to Peru. | I'll travel to Peru if I save enough money. | If I save enough money, I will travel to Peru. || If + present simple, will + base form. || @tags en.conditionals
      rw: Correct the mistake :: If he will study, he'll pass the test. || If he studies, he'll pass the test. | If he studies, he will pass the test. || No will after if: he studies. || @tags en.conditionals
      order: If you're free on Sunday, we'll go to the beach. || @tags en.conditionals
      tf: Ibrahim is sure that he will stay in Edinburgh. || false || He says, "I'm not sure. If I get a good job, I'll stay here." || @ctx dialogue
      short: What kind of business does Aisling hope to start? || kw: café/cafe/coffee || "Someday I hope to start my own business — a café." || @ctx dialogue
      listen: @dialogue || Where will Ibrahim go if he doesn't get a good job? || To South America | *Home to Manchester | To a café in Edinburgh || "Then I'll probably go back home to Manchester." || @tags en.listening,en.conditionals
      listen: If I get a promotion this year, I'll buy a car. If not, I'll take the bus for another year. || What will the speaker do without a promotion? || Buy a car | *Take the bus | Look for a new job || "If not, I'll take the bus for another year." || @tags en.listening,en.conditionals
      dict: If I find a good job, I'll stay in this city.
      ask: Tell a friend about one plan and one hope for next year. Use one if-sentence. || kw: if & will/'ll || Next year I'm going to learn to drive. I hope to visit my cousins in Canada. If I save enough money, I'll go in the summer.
      write: Write a short post for a class forum about your plans for the next two years — one plan, one hope and two if-sentences. || min=40 || req: if | will/'ll || In the next two years, I'm going to finish my nursing course. I hope to work in a children's hospital. If I pass all my exams, I'll apply for a job in Toronto. If I don't find a job there, I'll stay in my hometown and save up for a trip.

  - title: Making arrangements
    summary: Make, change and confirm arrangements with friends and colleagues — with the present continuous for the future.
    minutes: 35
    skills: [speaking, listening, grammar]
    tags: [en.present-continuous, en.future-forms, en.pronunciation]
    objectives:
      - Use the present continuous for fixed arrangements in the future
      - Ask What are you doing on…? and suggest a time and place
      - Change and confirm arrangements politely
    intro: |
      *Are you free on Saturday? — Sorry, I'm working in the morning, but I'm free in the evening.* When something is already in our calendar, we use the **present continuous** to talk about the future. In this lesson you will make arrangements, suggest times and places, and change plans politely.
    vocab: |
      be free | to have no plans at a certain time | expr | Are you free on Thursday evening? | - | n: The opposite is be busy.
      meet up | to meet a friend, usually informally | phr v | Let's meet up for coffee next week. | - | c: meet up with someone
      calendar | a page, book or app that shows the days and your plans | n | Let me check my calendar. | - | n: British English also: diary (for a personal paper calendar).
      Does … work for you? | Is this time or place OK for you? | expr | Does seven thirty work for you? | - | n: Also: Is seven thirty OK for you?
      confirm | to say that a plan is definitely happening | v | Can you confirm the time? | - | c: confirm a booking
      reschedule | to change the time or date of a plan or meeting | v | Can we reschedule our meeting to Friday? | - | n: Also: move something to another day.
      cancel | to say that a planned event won't happen | v | I'm sorry, I have to cancel dinner tonight. | - | n: US spelling: canceled. British spelling: cancelled.
      double-booked | having two plans at the same time by mistake | adj | Oh no, I'm double-booked on Monday! | - | n: Verb: double-book.
      running late | going to arrive later than planned | expr | Sorry, I'm running late. See you in ten minutes. | - | n: Very common in texts.
      pick up | to go and get someone in your car | phr v | I can pick you up at the station. | - | n: Pronoun in the middle: pick you up.
      drop off | to take someone somewhere in your car and leave them there | phr v | Can you drop me off at the gym? | - | n: Pronoun in the middle: drop me off.
      fit in | to find time for something | phr v | I'm busy, but I can fit in a quick lunch. | - | n: Also: fit someone in.
      See you then! | goodbye, when you have a plan to meet | expr | Saturday at eight? Great. See you then! | - | c: See you on Saturday; See you there
    grammar:
      title: "Present continuous for arrangements"
      body: |
        We use the **present continuous** (am/is/are + -ing) to talk about **arrangements** — future plans that are fixed: we know the time and place, and usually other people are involved. They're in our **calendar**.

        *I**'m meeting** Dana at six. We**'re having** dinner with my parents on Sunday. What **are** you **doing** this weekend?*

        Always include or understand a **future time** (*tonight, on Friday, next week, at six*) — otherwise the listener may think you mean now.

        Compare: *I**'m going to call** her.* (my intention — maybe not organized yet) — *I**'m meeting** her at three.* (it's arranged). Often both are possible.

        Don't use the present simple for arrangements: ~~I meet Dana tomorrow~~ → *I'm meeting Dana tomorrow.* (The present simple is for timetables: *The train **leaves** at 7:10.*)
      table: |
        Positive | Negative | Question
        I'm working on Saturday. | I'm not working on Sunday. | Are you working on Saturday?
        She's flying to Miami tomorrow. | She isn't flying on Friday. | Is she flying tomorrow?
        We're meeting at eight. | We aren't meeting at seven. | What time are we meeting?
      examples: |
        What are you doing on Friday night? — I'm going to a concert. | | asking about arrangements
        I'm having lunch with Sam tomorrow, so I can't meet you. | | arrangement + reason
        Are you doing anything this weekend? — No, I'm free. | | question with anything
        We're not driving — we're taking the train. | | negative arrangement
      tip: "When you can't accept an invitation, the present continuous gives a perfect, polite reason: I'd love to, but I'm visiting my grandparents that weekend."
    dialogue:
      title: Saturday night
      setting: A Wednesday evening in San Antonio, Texas. Zainab calls her friend Rory to make plans for the weekend.
      speakers: Z=Zainab/f; R=Rory/m
      lines: |
        Z: Hi, Rory! Are you free this weekend?
        R: Hmm, I'm working on Saturday morning. What's up?
        Z: My cousin's band is playing at a café on Saturday night.
        R: Oh, nice! What time are they starting?
        Z: At eight. Do you want to come?
        R: Sure! I'm having dinner with my parents at six, but that's OK.
        Z: Great. Let's meet at the café at a quarter to eight.
        R: Does seven thirty work for you? I want a good seat!
        Z: Perfect. And on Sunday I'm going hiking with Ana. Want to join?
        R: I'd love to, but I'm helping my brother move.
        Z: No problem. See you on Saturday, then!
    pronunciation:
      title: "What are you doing? → \"Whatcha doing?\""
      body: |
        In fast, informal speech, **What are you…** often sounds like "Whatcha…" or "Whaddaya…": *What are you doing on Friday?* → "Whatcha DOing on FRIday?" **Are you** becomes "ə-yə".

        In answers, **I'm** and **we're** are short, and the stress goes on the activity and the time: *I'm **MEET**ing **DA**na at **SIX**.* Listen and repeat.
      items: |
        What are you doing on Friday?
        I'm meeting Dana at six.
        Are you free on Sunday?
        Does seven work for you?
        We're having lunch at noon.
        See you then!
    culture:
      title: "\"Let's get coffee sometime!\""
      body: |
        In the US and the UK, people often say friendly things like *Let's get coffee sometime!* or *We should hang out!* These are nice, but they are not always real plans. To make a real arrangement, suggest a **day and a time**: *Are you free on Thursday at five?*

        Many people plan their free time days or even weeks ahead and check their calendar before they say yes. If you need to cancel, tell the other person as early as possible and suggest a new time — *Can we reschedule?*
    mistakes: |
      What do you do on Saturday? (asking about plans) => What are you doing on Saturday? | For arrangements, use the present continuous. What do you do on Saturdays? asks about habits.
      I meet my dentist tomorrow at ten. => I'm seeing my dentist tomorrow at ten. | An arrangement uses the present continuous, not the present simple.
      Are you free in Saturday? => Are you free on Saturday? | Use on with days: on Saturday, on Monday morning.
    task:
      title: Find a time
      mode: interaction
      body: |
        Write your real calendar for next week (or invent one). Then, with a partner or the AI coach in the "Making weekend plans" scenario, try to find a time to meet: ask *What are you doing on…?*, explain what you're doing at different times, suggest a time and place, and confirm the arrangement.
    exercises: |
      fill: What ___ you doing on Friday night? || are || Arrangement question: are + you + -ing. || @tags en.present-continuous,en.questions
      fill: I can't come at six. I ___ (have) dinner with my parents. || am having / 'm having || A fixed arrangement: present continuous. || @tags en.present-continuous,en.future-forms
      fill: We ___ (not / drive) to the wedding. We're taking the train. || aren't driving / are not driving / 're not driving || Negative arrangement: aren't + -ing. || @tags en.present-continuous
      mc: "Are you free tomorrow afternoon?" — "Sorry, ___ my brother move." || *I'm helping | I help | I'm help || Explain an arrangement with the present continuous: I'm helping. || @tags en.present-continuous,en.future-forms
      mc: You will arrive ten minutes after the planned time. What do you text? || *Sorry, I'm running late! | Sorry, I'm double-booked! | Sorry, I have to cancel! || Running late = arriving later than planned. Double-booked and cancel mean you aren't coming. || @tags en.vocabulary @skill vocabulary
      rw: Make a question about Saturday :: (you / do / anything / on Saturday) || Are you doing anything on Saturday? || Present continuous question for arrangements. || @tags en.present-continuous,en.questions
      rw: Correct the mistake :: I meet Leo at the station tomorrow at nine. || I'm meeting Leo at the station tomorrow at nine. | I am meeting Leo at the station tomorrow at nine. || A fixed arrangement: present continuous. || @tags en.present-continuous,en.future-forms
      match: reschedule = change the time of a plan ; cancel = say that a plan won't happen ; confirm = say that a plan is definitely happening ; double-booked = having two plans at the same time || Match each word with its meaning. || @tags en.vocabulary @skill vocabulary
      tf: Rory is working on Saturday night. || false || He's working on Saturday morning. In the evening he's having dinner with his parents and then going to the café. || @ctx dialogue
      short: What is Zainab doing on Sunday? || kw: hiking/hike || "On Sunday I'm going hiking with Ana." || @ctx dialogue
      listen: @dialogue || What time do Zainab and Rory decide to meet? || *At seven thirty | At a quarter to eight | At eight || Rory asks, "Does seven thirty work for you?" and Zainab says, "Perfect." || @tags en.listening
      listen: Hi Ken, it's Julia. I'm sorry, but I'm flying to Denver on Thursday, so I can't make our meeting. Can we reschedule to next Monday? || Why can't Julia come to the meeting? || She's sick. | *She's flying to Denver. | She's double-booked with another meeting. || "I'm flying to Denver on Thursday." || @tags en.listening,en.present-continuous
      dict: I'm having lunch with my sister on Friday.
      ask: A friend asks, "Are you free this weekend?" Say what you're doing on Saturday and suggest a time to meet on Sunday. || kw: I'm/I am & sunday & free/meet/how about/does/work || On Saturday I'm working all day, but I'm free on Sunday. How about lunch at one? Does that work for you?
      write: Write a text message to change an arrangement — say what you can't do, why (an arrangement), and suggest a new day and time. || min=25 || req: sorry | I'm/I am || Hi Ben, sorry, but I can't play tennis on Thursday — I'm working late. Are you free on Saturday morning? Does ten work for you? Let me know!

  - title: Comparing options
    summary: Compare three or more options — places, products, plans — with superlatives, and explain your choice.
    minutes: 40
    skills: [grammar, reading, speaking]
    tags: [en.comparatives, en.opinion, en.th]
    objectives:
      - Form superlatives with the -est, the most and irregular forms
      - Compare three or more options and give reasons for a choice
      - Understand reviews and ratings
    intro: |
      When you choose a restaurant, a phone plan or a place to stay, you often compare more than two options: *This one is **the cheapest**, that one has **the best** reviews, and the third is **the most convenient**.* In this lesson you will use **superlatives** to compare options and explain your choice.
    vocab: |
      option | one of the things you can choose | n | We have three options for dinner. | - | c: the best option; a cheap option
      choice | the act of choosing; something you choose | n | You made a good choice. | - | c: make a choice; have a choice | n: Verb: choose (past: chose).
      convenient | easy for you; it fits your plans | adj | The bus stop is very convenient. | - | n: The opposite is inconvenient.
      affordable | not too expensive | adj | We want an affordable hotel near the center. | - | n: From afford.
      value for money | good quality for the price you pay | expr | The set menu is great value for money. | - | n: Also: good value.
      review | an opinion that someone writes about a product, place or service | n | The hotel has great reviews online. | - | c: read reviews; write a review
      rating | a score, for example from one to five stars | n | The restaurant has a rating of 4.8. | - | c: a five-star rating
      pros and cons | the good points and the bad points | expr | Let's think about the pros and cons. | - | n: Pro = for; con = against.
      prefer | to like one thing more than another | v | I prefer the train to the bus. | - | c: prefer A to B | n: Past: preferred.
      worth it | good enough for the money, time or work that it needs | expr | It's expensive, but it's worth it. | - | c: (not) worth the money
      popular | liked by a lot of people | adj | It's the most popular café in town. | - | n: Superlative: the most popular.
      deal | a good price for something | n | Two tickets for $30 is a good deal. | - | c: a good deal; a great deal
      compare | to look at two or more things to see how they are different | v | Let's compare the prices. | - | c: compare A with B
    grammar:
      title: "Superlatives: the cheapest, the most convenient, the best"
      body: |
        We use **superlatives** to compare **three or more** things and say which one is at the top or the bottom: *It's **the cheapest** of the three.*

        - Short adjectives: **the + -est**: *cheap → the cheapest, nice → the nicest, big → the biggest, easy → the easiest*
        - Long adjectives: **the most + adjective**: *the most expensive, the most convenient*
        - Irregular: *good → **the best**, bad → **the worst**, far → **the farthest** / **the furthest***

        Use **in** + a place or group: *the best café **in** town, the oldest student **in** the class*. Use **of** + a number or period: *the cheapest **of** the three, the best day **of** the year*. **One of the** + superlative + plural: *one of the best restaurants*.

        Superlatives often go with the present perfect: *It's the best meal **I've ever had**.*
      table: |
        Adjective | Comparative | Superlative
        cheap | cheaper | the cheapest
        big | bigger | the biggest
        easy | easier | the easiest
        convenient | more convenient | the most convenient
        good | better | the best
        bad | worse | the worst
        far | farther | the farthest
      examples: |
        Luigi's is the cheapest, but it's also the smallest. | | the + -est
        The Harbor Grill is the most expensive restaurant of the three. | | the most + long adjective
        It's one of the most popular places in town. | | one of the + plural
        This is the best coffee I've ever had. | | superlative + present perfect
      tip: "Two things? Use the comparative (cheaper than). Three or more? Use the superlative (the cheapest). And always use the before a superlative."
    dialogue:
      title: The team dinner
      setting: An office in Portland, Maine. Nkechi and Paul are choosing a restaurant for their team's end-of-year dinner. They're looking at three options on Nkechi's laptop.
      speakers: N=Nkechi/f; P=Paul/m
      lines: |
        N: OK, we have three options for the team dinner.
        P: Which one is the cheapest?
        N: Luigi's. It's the cheapest, but it's also the smallest.
        P: Hmm. We're twenty people. What about the Thai place?
        N: It has the best reviews. The food is amazing.
        P: But it's the farthest from the office, right?
        N: Yes, it's about forty minutes by bus.
        P: And the third one, the Harbor Grill?
        N: It's the most expensive, but it's the most convenient.
        P: Is it worth the money?
        N: I think so. It has the biggest room and the best view.
        P: OK, let's book the Harbor Grill. It's the best option.
    pronunciation:
      title: "The two sounds of the"
      body: |
        Before a **consonant sound**, **the** is weak: "thə" — *thə best, thə most, thə cheapest*. Before a **vowel sound**, many speakers say "thee": *thee easiest, thee oldest*.

        Put your tongue between your teeth for **th**. And don't stress *the*: stress the adjective — *the **CHEAP**est, the **BEST** option*. Listen and repeat.
      items: |
        the cheapest
        the best option
        the most expensive
        the easiest
        the oldest restaurant
        one of the best
    culture:
      title: Reviews and word of mouth
      body: |
        Many people check **online reviews** and **star ratings** before they choose a restaurant, a hotel or even a plumber. A rating of 4.5 out of 5 or more is usually very good — but it's smart to read a few of the reviews, not just look at the stars.

        **Word of mouth** — recommendations from friends, family and neighbors — is still very important. If you're new somewhere, just ask a local: *What's the best place for pizza around here?* People are usually happy to help.
    mistakes: |
      It's the most cheap option. => It's the cheapest option. | Short adjectives take -est, not most.
      She's the better student in the class. => She's the best student in the class. | For three or more, use the superlative: the best.
      It's the biggest room of the hotel. => It's the biggest room in the hotel. | Use in + a place: in the hotel, in town.
    task:
      title: Help me choose
      mode: speaking
      body: |
        Choose something you really need to decide — a phone, a gym, a vacation, a course — and find three options. Compare them with at least four superlatives (*the cheapest, the most convenient, the best reviews…*), talk about the pros and cons, and explain your choice. Present it to a friend or practice with the AI coach in the "Expressing an opinion" scenario.
    exercises: |
      fill: Luigi's is the ___ (cheap) restaurant of the three. || cheapest || Short adjective: the + -est. || @tags en.comparatives
      fill: This is the ___ (convenient) hotel for the conference. || most convenient || Long adjective: the most + adjective. || @tags en.comparatives
      fill: It was the ___ (bad) movie I've ever seen! || worst || Bad is irregular: bad – worse – the worst. || @tags en.comparatives
      fill: Mount Denali is the ___ (high) mountain in North America. || highest || Short adjective: the + -est. || @tags en.comparatives
      mc: Choose the correct sentence. || It's the most cheap option. | *It's the cheapest option. | It's the cheaper option of the three. || Three options + short adjective → the cheapest. || @tags en.comparatives
      mc: This is one of the ___ in the city. || best café | *best cafés | better cafés || One of the + superlative + plural noun. || @tags en.comparatives
      rw: Write one superlative sentence :: (the Thai place / good reviews / of the three restaurants) || The Thai place has the best reviews of the three restaurants. | The Thai place has the best reviews of the three. || Good → the best. || @tags en.comparatives
      match: affordable = not too expensive ; value for money = good quality for the price ; rating = a score, for example out of five stars ; pros and cons = good and bad points || Match each word with its meaning. || @tags en.vocabulary @skill vocabulary
      tf: The Thai restaurant is the closest to the office. || false || It's the farthest — about forty minutes by bus. || @ctx dialogue
      short: Why don't they choose Luigi's? || kw: small/smallest/room/twenty || It's the cheapest, but it's also the smallest, and they are twenty people. || @ctx dialogue
      listen: @dialogue || Which restaurant has the biggest room? || Luigi's | The Thai place | *The Harbor Grill || "It has the biggest room and the best view." || @tags en.listening,en.comparatives
      listen: Of the three gyms, Northside Gym is the cheapest and Lakeview Gym is the closest, but City Gym has the longest opening hours. || Which gym is the closest? || Northside Gym | *Lakeview Gym | City Gym || "Lakeview Gym is the closest." Northside Gym is the cheapest. || @tags en.listening,en.comparatives
      dict: It's the most expensive option, but it's the best.
      ask: Compare three places to eat in your town and say which one is the best for a birthday dinner. || kw: the & most/best/cheapest/nicest/biggest/closest/worst/most expensive/most popular || The pizza place is the cheapest, and the sushi restaurant is the most popular. But the Lebanese restaurant has the best food and the nicest garden, so it's the best for a birthday dinner.
      write: You're helping a friend choose a place to stay for a weekend. Write a message comparing three options (price, location, reviews) and recommend one. || min=40 || req: the most/the best/the cheapest/the closest | best/recommend/choose || Hi Tara! I looked at three places. The hostel is the cheapest, but it has the worst reviews. The Ocean Hotel is the most expensive, but it's the closest to the beach. The B&B on Hill Street has the best reviews and it's good value for money, so I think it's the best option. What do you think?
