language: en
level: B1
title: "English B1 · Independence"
description: Become an independent user of English — tell stories and anecdotes, handle interviews, emails and meetings, give advice, follow the news, solve problems, discuss the environment, health and culture, and talk about imaginary situations.
monolingual: true
hours: 120
summary: >-
  B1 learners can understand the main points of clear standard input on familiar matters met at work, school and in
  leisure time. They can deal with most situations likely to arise while traveling, produce simple connected text on
  topics that are familiar or of personal interest, and describe experiences, events, hopes and plans, giving brief
  reasons and explanations for opinions. This course delivers around 120 hours of guided practice across 8 units,
  taught entirely in English.
objectives:
  - Describe people's character and tell an anecdote with a clear beginning, middle and end
  - Talk about your work experience in an interview and write formal and semi-formal emails
  - Explain rules and obligations, compare ways of learning and give useful advice
  - Follow and retell news stories and report what other people said and asked
  - Compare places to live, describe green habits and propose solutions to local problems
  - Discuss stress, food culture and fitness, defining people, things and places precisely
  - Review a film, series, book or album and retell a story in the past
  - Discuss responsible travel, imaginary situations, customs and wishes
canDo:
  listening:
    - Understand the main points of conversations, interviews and radio-style reports on familiar topics when people speak clearly
    - Follow a story or a set of instructions and catch the speaker's opinion and reasons
  reading:
    - Understand news stories, blog posts, reviews and personal and work emails about familiar subjects
    - Find and compare the main ideas and important details in a text of up to about 500 words
  spokenInteraction:
    - Take part in conversations on familiar topics, agree and disagree politely and give reasons
    - Deal with most practical situations — an interview, a meeting, a tech problem or a complaint — without preparation
  spokenProduction:
    - Tell an anecdote or retell the plot of a book or film, describing your reactions
    - Explain a problem, compare options and give a short, prepared argument for a solution
  writing:
    - Write formal and informal emails that ask for information, apologize, explain or recommend
    - Write a short connected text — a review, a story, an opinion or a proposal — with linking words
grammar:
  - Narrative tenses (past simple and past continuous) with time linkers (as, just as, as soon as, suddenly)
  - used to and would for past habits and states
  - Present perfect continuous, and present perfect simple or continuous
  - Formal and informal register in emails; connectors (however, although, so, therefore, as a result, in addition)
  - Modals of obligation and permission (must, have to, mustn't, don't have to, be allowed to, had to)
  - Modals of advice (should, ought to, had better) and other ways to advise
  - Gerund or infinitive after verbs and prepositions; gerunds as subjects
  - Past perfect with by the time, already, before and after
  - Reported speech — statements, questions and requests (say, tell, ask)
  - The passive in the present simple and past simple, with and without by
  - First conditional with if, unless, as soon as and when
  - Defining relative clauses (who, which, that, where, whose; leaving out the pronoun)
  - Non-defining relative clauses, and which referring to a whole clause
  - Second conditional; wish + past simple and could
vocabularyDomains:
  - Personality, friendship and relationships
  - Jobs, interviews, emails, meetings and career changes
  - School systems, learning strategies and advice
  - News, social media, devices and tech problems
  - Cities, the countryside, recycling and local issues
  - Stress, wellbeing, food culture and fitness
  - Films, series, books and music
  - Responsible travel, dilemmas, customs and cultural differences
assessment: A 60-minute cumulative test covering grammar, vocabulary, listening and reading from all eight units, with a short review or email to write. A score of 70% or more confirms the B1 level.
units:
  - title: Getting along
    theme: People and relationships
    lessons: ["Personality and character", "Friendship and disagreements", "Telling an anecdote"]
  - title: Working life
    theme: Work and careers
    lessons: ["The job interview", "Emails and meetings", "Changing careers"]
  - title: Learning for life
    theme: Education and learning
    lessons: ["School memories and systems", "How we learn languages", "Giving advice"]
  - title: Staying connected
    theme: Media and technology
    lessons: ["News and how we follow it", "Digital life", "Solving a tech problem"]
  - title: Where we live
    theme: City and environment
    lessons: ["City or countryside?", "Green habits", "Proposing solutions"]
  - title: Body and mind
    theme: Health and lifestyle
    lessons: ["Stress and wellbeing", "Food culture", "Sport and fitness"]
  - title: Stories and screens
    theme: Culture and entertainment
    lessons: ["Reviewing a film or series", "Books and music", "Recommending and retelling a story"]
  - title: A world of difference
    theme: Society and travel
    lessons: ["Traveling responsibly", "What would you do if…?", "Customs and stereotypes"]
assessmentItems: |
  fill: When I was a teenager, I ___ (use) to spend hours on the phone with my best friend. || used || Past habit: used to + base form. After did/didn't the form is use to, but in a positive sentence it is used to. || @tags en.used-to @obj Describe people's character and tell an anecdote with a clear beginning, middle and end
  mc: Choose the best sentence to start an anecdote. || *I was waiting for the bus when a man asked me for directions. | I waited for the bus when a man was asking me for directions. | I was waiting for the bus when a man was asked me for directions. || The longer background action takes the past continuous (was waiting); the short event that interrupts it takes the past simple (asked). || @tags en.past-continuous,en.past-simple
  fill: I ___ (work) in customer service for six years, so I know how to deal with difficult calls. || have been working / 've been working / have worked / 've worked || An action that started in the past and continues now: present perfect continuous (or simple with work, which is a long-term state here). || @tags en.present-perfect-continuous @obj Talk about your work experience in an interview and write formal and semi-formal emails
  mc: The salary is lower. ___, the job is closer to home and the hours are better. || *However | Although | Because || However starts a new sentence and introduces a contrast. Although must join two clauses in one sentence; because gives a reason. || @tags en.connectors
  mc: Which sentence is the best way to end a formal email? || See you soon! | *I look forward to hearing from you. | Write back quick, OK? || I look forward to hearing from you is the standard formal closing. The other two are informal. || @tags en.formal-writing,en.register
  mc: At our school it wasn't necessary to wear a uniform. In other words, we ___ wear one. || mustn't | *didn't have to | weren't allowed to || Didn't have to = it wasn't necessary. Mustn't and weren't allowed to mean it was forbidden. || @tags en.modal-verbs @obj Explain rules and obligations, compare ways of learning and give useful advice
  fill: I've decided ___ (take) an evening class, and I'm really looking forward to ___ (start). || to take ; starting || Decide + to-infinitive; look forward to + -ing (to is a preposition here). || @tags en.gerund-infinitive
  fill: By the time we got to the stadium, the match ___ already ___ (start). || had ; started || Past perfect (had + past participle) for the earlier of two past actions. || @tags en.past-perfect @obj Follow and retell news stories and report what other people said and asked
  rw: Report what Leo said :: "I'm working from home today." || Leo said that he was working from home that day. | Leo said he was working from home that day. | Leo said that he was working from home today. | Leo said he was working from home today. || Am working → was working; I → he; today → that day (or today if it is still the same day). || @tags en.reported-speech
  mc: The technician asked me ___. || *whether I had restarted the router | had I restarted the router | did I restart the router || A reported yes/no question uses if or whether and normal word order (subject + verb), with no question mark. || @tags en.reported-speech
  rw: Rewrite in the passive :: A local artist painted the mural in 2019. || The mural was painted by a local artist in 2019. | The mural was painted in 2019 by a local artist. || Past simple passive: was + past participle (painted); the doer goes after by. || @tags en.passive @obj Compare places to live, describe green habits and propose solutions to local problems
  mc: We won't solve the parking problem ___ we improve the bus service. || if | *unless | as soon as || Unless = if not: we won't solve it if we don't improve the buses. || @tags en.conditionals
  fill: A nutritionist is a person ___ gives advice about food and health. || who / that || Use who or that for people in a defining relative clause. || @tags en.relative-clauses @obj Discuss stress, food culture and fitness, defining people, things and places precisely
  mc: Which sentence is correct? || This is the gym where I go to every week. | *This is the gym I go to every week. | This is the gym which I go every week. || The relative pronoun can be left out when it is the object: the gym (that/which) I go to. Where already means "to which", so where … to is wrong. || @tags en.relative-clauses
  mc: Which sentence is correct? || My sister, that lives in Perth, is a musician. | *My sister, who lives in Perth, is a musician. | My sister who, lives in Perth, is a musician. || Non-defining relative clauses go between commas and never use that. || @tags en.relative-clauses @obj Review a film, series, book or album and retell a story in the past
  fill: If I ___ (have) more vacation time, I ___ (take) the train across Canada. || had ; would take / 'd take || Second conditional: if + past simple, would + base form, for an imaginary situation. || @tags en.conditionals @obj Discuss responsible travel, imaginary situations, customs and wishes
  fill: I don't speak Portuguese, and I really wish I ___ (speak) it. || spoke / could speak || Wish + past simple (or could) for a present situation you would like to be different. || @tags en.wishes
  listen: Just as I was leaving the house, my phone rang. It was my brother, and he told me he had just gotten engaged. || Why did the brother call? || *To share some good news | To ask for a lift | To say he was ill || He told the speaker he had just gotten engaged — good news. || @tags en.listening,en.past-perfect
  listen: The series, which is set in a small fishing village, starts slowly, but by the third episode I was completely hooked. || What does the speaker think of the series? || It's boring from start to finish. | *It gets very exciting after a slow start. | It's too short. || "Starts slowly, but… I was completely hooked" — the speaker loved it after a slow beginning. || @tags en.listening,en.relative-clauses
  listen: If I were you, I'd book the night train. It's cheaper than a hotel, and you'd wake up in Vienna. || What does the speaker advise? || Flying to Vienna | Staying in a hotel | *Taking the night train || "If I were you, I'd book the night train." || @tags en.listening,en.conditionals
  short: Read the notice: "From 1 March, food waste will be collected every Tuesday. Please use the brown bin and do not put plastic bags in it." What mustn't you put in the brown bin? || kw: plastic/bag/bags || The notice says "do not put plastic bags in it." || @skill reading @tags en.reading,en.passive
  write: Write a short review (60–90 words) of a film, series or book you enjoyed. Say what it is about, what you liked, and who you would recommend it to. Use at least one relative clause. || min=60 || req: who/which/where/whose/that | recommend/worth/should || I recently watched "The Long Road", a series which follows two sisters who cross Australia by car after their father's death. The story, which is told through flashbacks, is moving but also very funny. The acting is excellent, especially in the final episode, where the sisters finally talk about the past. It's slow at times, but it's definitely worth watching. I'd recommend it to anyone who enjoys family dramas.
