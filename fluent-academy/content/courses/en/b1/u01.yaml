unit: 1
title: Getting along
theme: People and relationships
description: Describe people's personality and how they have changed with used to, talk about friendships, arguments and making up with would and phrasal verbs, and tell a lively anecdote with the past simple and past continuous.
free: true
objectives:
  - Describe someone's personality with precise adjectives and say how people have changed with used to
  - Talk about friendship, disagreements and making up, and describe past habits with would and used to
  - Tell an anecdote that sets the scene, builds to a main event and keeps the listener interested
canDo:
  - I can describe the personality of people I know and give examples to support what I say.
  - I can say how my life and my personality used to be different.
  - I can talk about a disagreement with a friend, apologize and explain how we made up.
  - I can tell a short anecdote in the past and react naturally to someone else's story.
review: |
  fill: I ___ (not / like) spicy food, but now I eat it almost every day. || didn't use to like / did not use to like / never used to like || A past state that has changed: didn't use to + base form (no -d after didn't). || @tags en.used-to
  mc: Which sentence is correct? || We would have a dog called Biscuit. | *We used to have a dog called Biscuit. | We use to have a dog called Biscuit. || Have (own) is a state, so would is not possible; in a positive sentence the form is used to. || @tags en.used-to
  mc: "He never changes his mind, even when he knows he's wrong." He's ___. || generous | *stubborn | sensitive || Stubborn people refuse to change their opinion. Generous = happy to give; sensitive = easily hurt. || @tags en.vocabulary @skill vocabulary
  fill: Sorry I ___ you down last night — I fell asleep on the sofa and didn't hear my phone. || let || Let someone down = disappoint them. The past of let is let. || @tags en.phrasal-verbs
  fill: I ___ (read) on the train when a man ___ (sit) down on my sandwich. || was reading ; sat || Background action in progress: past continuous; the short event that interrupts it: past simple (sit → sat). || @tags en.past-continuous,en.past-irregular
  rw: Join the sentences with "as soon as" :: I got home. Then I immediately called my sister. || As soon as I got home, I called my sister. | As soon as I got home I called my sister. | I called my sister as soon as I got home. || As soon as = immediately after. It can start the sentence (with a comma) or go in the middle. || @tags en.connectors,en.past-simple
  mc: Your friend says, "And then I realized the man next to me was my old math teacher!" Choose the best reaction. || *No way! What did you say to him? | That's not what I meant. | I see your point, but I don't agree. || No way! shows surprise, and the question invites the speaker to continue. The other two phrases are for misunderstandings and disagreements. || @tags en.discourse-markers
  listen: When I was younger, I used to be really bossy with my little brother. These days we get along really well, and he's one of my best friends. || How does the speaker get along with their brother now? || *Very well | Badly — they argue a lot | They don't speak anymore || "These days we get along really well." The bossy behavior was in the past (used to). || @tags en.listening,en.used-to
  listen: I was waiting at the bus stop in front of my office when I noticed I was wearing two different shoes. I wanted the ground to swallow me up! || How did the speaker feel? || Relieved | *Embarrassed | Bored || Wanting the ground to swallow you up is a way of saying you feel extremely embarrassed. || @tags en.listening,en.past-continuous
  ask: Describe a close friend — what they're like, how you met and how your friendship has changed over the years. || kw: he's/she's/they're/he is/she is/they are & met & used to/would/now/these days || My closest friend is Ines. She's really reliable and a bit stubborn. We met at swimming lessons when we were eight. We used to see each other every day, but now she lives in Madrid, so we keep in touch with long phone calls.
  write: Write an email (70–90 words) to a friend you have lost touch with. Remind them of something you used to do together, say how you've changed and suggest meeting up. || min=60 || req: used to/would | now/these days | meet/see you/get together || Hi Tomás, I found a photo of us at summer camp yesterday and it made me smile. Do you remember how we used to stay up all night telling ghost stories? You were always the brave one! I've changed a lot since then. I used to be so shy, but now I teach a dance class twice a week. I'd love to catch up. Are you free for a coffee next weekend? Write soon, Hana
lessons:
  - title: Personality and character
    summary: Describe personality with precise adjectives and examples, soften criticism politely, and say how people have changed with used to and didn't use to.
    minutes: 45
    skills: [vocabulary, grammar, speaking]
    tags: [en.used-to, en.vocabulary, en.word-stress]
    objectives:
      - Describe personality with adjectives and support them with examples
      - Talk about past states and habits with used to, didn't use to and Did you use to…?
      - Explain how someone has changed, softening negative descriptions
    intro: |
      "What's she like?" is one of the most common questions in English — we ask it about new colleagues, a friend's partner or a cousin we haven't seen for years. A good answer goes beyond *nice* and *friendly*. In this lesson you will learn precise personality adjectives, ways to sound kind when you describe someone's faults, and **used to** to compare how people were in the past with how they are now.
    vocab: |
      personality | the type of person you are — how you think, feel and behave | n | Her personality is very different from her twin sister's. | - | c: a strong personality; a big personality
      outgoing | friendly and happy to meet and talk to new people | adj | My aunt is very outgoing — she chats with everyone on the bus. | - | n: The opposite is shy or reserved.
      reliable | someone you can trust to do what they promise | adj | Ask Nadia to organize the trip; she's really reliable. | - | c: a reliable friend; completely reliable | n: The opposite is unreliable.
      stubborn | not willing to change your opinion or plans, even when you should | adj | My grandfather is too stubborn to ask for directions. | - | c: as stubborn as a mule (idiom)
      easygoing | relaxed and not easily worried or annoyed | adj | Our coach was easygoing about mistakes but strict about being on time. | - | n: Also written easy-going.
      generous | happy to give money, time or help to other people | adj | Leila is so generous with her time — she tutors kids for free. | - | c: generous with money; a generous offer
      moody | often changing from happy to angry or sad without warning | adj | He's a bit moody in the mornings until he's had breakfast. | - | n: Informal.
      confident | sure of yourself and your abilities | adj | You need to feel confident to speak in front of a big audience. | - | c: feel confident; confident about something | n: The noun is confidence.
      sensitive | easily upset by what people say; also, aware of other people's feelings | adj | Be careful what you say — Marco is quite sensitive about his height. | - | n: Don't confuse it with sensible (practical and reasonable).
      bossy | always telling other people what to do | adj | My older sister was really bossy when we were kids. | - | n: Informal and negative.
      hard-working | putting a lot of effort into your work or studies | adj | Our new intern is incredibly hard-working. | - | c: extremely hard-working
      get along (with) | to have a friendly relationship with someone | phr v | I get along really well with my roommate's parents. | - | n: British English also: get on (with).
      take after | to be similar to an older family member in character or looks | phr v | Kai takes after his mother — they're both very calm in a crisis. | - | n: Used for parents, grandparents and other older relatives.
    grammar:
      title: "used to for past habits and states"
      body: |
        We use **used to** + base form for things that were true or happened regularly in the past but are **not true now**. It is perfect for comparing then and now: *I **used to be** shy, but now I'm quite outgoing.*

        - It works for **states** (be, have, live, like, know): *We **used to live** above a bakery.*
        - It also works for **repeated actions**: *My dad **used to cook** every Sunday.*
        - It is **not** used for one single event, or with an exact number of times or length of time: say *I visited Rome three times* and *I lived in Lima for six years* (not ~~used to visit… three times~~).

        Negatives and questions use **did** + **use to** (no -d, because did already shows the past): *I **didn't use to** like coffee. **Did** you **use to** have long hair?*

        There is **no present form**. For present habits, use the present simple, often with *usually*: *I usually walk to work* (not ~~I use to walk~~). In speech, *use to* and *used to* sound exactly the same: "yoos-tə".
      table: |
        Form | Example | Note
        Positive | She used to be very quiet. | used to + base form
        Negative | I didn't use to like parties. | didn't + use to (no -d)
        Question | Did you use to play an instrument? | Did + subject + use to
        Short answers | Yes, I did. / No, I didn't. | like the past simple
        Present habit | I usually get up early. | present simple, not "use to"
      examples: |
        I used to be really shy, but now I love meeting new people. | | a state that has changed
        My grandmother used to tell us stories every night. | | a repeated action
        We didn't use to get along, but now we're close friends. | | negative: didn't use to
        Did you use to argue with your brother? — All the time! | | question: Did… use to…?
      tip: "Test it by adding \"but not anymore\": I used to play the guitar (but not anymore). If that makes sense, used to is a good choice."
    dialogue:
      title: Not the same person
      setting: An engagement party in Vancouver, Canada. Mira meets Joel, an old school friend, and they talk about Mira's brother Theo, who is getting married next spring.
      speakers: M=Mira/f; J=Joel/m
      lines: |
        M: Joel! I haven't seen you since graduation. You look exactly the same!
        J: Ha, thanks! But your brother looks so different. Is that really Theo?
        M: I know! He used to have long hair and wear the same black hoodie every day.
        J: And he was so shy. He didn't use to say a word in class.
        M: Well, he's much more outgoing now. He talks to everyone at work.
        J: What does he do these days? Is he still into computers?
        M: No, he's a nurse now. He's amazingly calm and reliable in a crisis.
        J: That's great. Did he use to want to be a nurse?
        M: Not at all! He used to say hospitals made him nervous.
        J: People really change, I guess. And what's his fiancée like?
        M: Ana? She's lovely — very generous and easygoing. She can be a bit stubborn, though.
        J: Then they're a perfect match. Theo was the most stubborn person I knew!
    pronunciation:
      title: Word stress in personality adjectives
      body: |
        Most two- and three-syllable personality adjectives are stressed on the **first** syllable: **GEN**erous, **CON**fident, **SEN**sitive, **STUB**born, **MOOD**y. The other syllables are short and weak, often with a schwa: *GEN-ə-rəs*.

        Some important words break the pattern: re**LI**able (stress on the second syllable) and easy**GO**ing (main stress on GO). Also notice *used to*: it sounds like "yoos-tə", with an **s** sound, not a z. Listen and repeat.
      items: |
        generous
        confident
        sensitive
        reliable
        easygoing
        I used to be shy.
    culture:
      title: "Being kind about people's faults"
      body: |
        English speakers often soften negative descriptions, especially when they talk about friends, family or colleagues. Instead of *He's lazy*, people say *He's not very hard-working* or *He can be a bit lazy*. Words like **a bit**, **quite**, **not very** and **can be** make criticism sound fair and friendly.

        Notice the difference between three similar questions: *What's he like?* asks about personality, *What does he look like?* asks about appearance, and *What does he like?* asks about his interests.
    mistakes: |
      I use to walk to work these days. => I usually walk to work these days. | Used to is only for the past. For a present habit, use the present simple, often with usually.
      Did you used to live here? => Did you use to live here? | After did, use the base form: use to (no -d).
      She's very sensible — she cries at every sad movie. => She's very sensitive — she cries at every sad movie. | Sensitive means easily affected by feelings; sensible means practical and reasonable.
    task:
      title: Then and now
      mode: speaking
      body: |
        Choose someone who has changed a lot — a friend, a family member or yourself. Prepare one minute about them: what they used to be like, what they didn't use to do, and what they are like now, with one example for each adjective. Use softeners (*a bit, not very, can be*) for any negative points. Then practice with the AI coach in the "Discussing hobbies" scenario, comparing the hobbies you used to have with the ones you have now.
    exercises: |
      fill: When I was little, I ___ (be) scared of dogs, but now I have two. || used to be || A past state that is no longer true: used to + base form. || @tags en.used-to
      fill: We ___ (not / get along) at school, but now we're very close. || didn't use to get along / did not use to get along / never used to get along || Negative: didn't + use to (no -d) + base form. || @tags en.used-to
      rw: Make a question with "use to" :: You lived in the countryside as a child. || Did you use to live in the countryside as a child? || Question: Did + subject + use to + base form. || @tags en.used-to,en.questions
      mc: Choose the correct sentence about the present. || I use to go to the gym after work these days. | *I usually go to the gym after work these days. | I'm used to go to the gym after work these days. || There is no present form of used to. For present habits, use the present simple with usually. || @tags en.used-to,en.frequency
      mc: Which sentence is NOT correct? || My uncle used to work as a taxi driver. | *I used to visit Rome three times. | We used to have a cat called Pepper. || Don't use used to with an exact number of times. Say "I visited Rome three times." || @tags en.used-to
      match: shy = outgoing ; mean = generous ; lazy = hard-working ; stubborn = flexible ; rude = polite || Each adjective is matched with its opposite. || @hint Match each adjective with its opposite. @skill vocabulary @tags en.vocabulary
      mc: Your friend's new boss never relaxes and tells everyone what to do all day. Which description is the kindest? || He's terrible. | *He can be a bit bossy. | He's the bossiest man in the world. || Can be + a bit softens a criticism and sounds fair. The other two are strong and unkind. || @tags en.vocabulary @skill vocabulary
      tf: Theo used to talk a lot in class. || false || Joel says Theo was shy: "He didn't use to say a word in class." || @ctx dialogue
      short: What is Theo's job now? || kw: nurse || Mira says, "He's a nurse now." || @ctx dialogue
      listen: @dialogue || How does Mira describe Ana's less positive side? || She's a bit moody. | *She can be a bit stubborn. | She's quite bossy. || "She can be a bit stubborn, though." || @tags en.listening
      listen: My cousin Dara used to be really moody as a teenager, but these days she's the most easygoing person in our family. || How has Dara changed? || She has become more stubborn. | *She's much calmer and more relaxed now. | She's still very moody. || She used to be moody, but now she's "the most easygoing person" — calm and relaxed. || @tags en.listening,en.used-to
      order: She didn't use to like big parties. || @tags en.used-to
      dict: My grandfather used to tell us funny stories every Sunday. || used to + base form
      ask: A friend asks, "So what's your best friend like?" Describe their personality and give an example. || kw: really/very/quite/a bit/so/can be & because/for example/always/never/when || She's really generous and easygoing. For example, she always helps me when I move apartments, and she never gets angry when I'm late.
      write: Write a paragraph (60–80 words) about how you have changed since you were a teenager. Use used to and didn't use to at least once each. || min=50 || req: used to | didn't use to/did not use to/never used to || When I was a teenager, I used to be quite moody, and I didn't use to talk to my parents much. I used to spend hours playing video games in my room. I didn't use to like reading at all. Now I'm much more easygoing, and I call my parents every week. I still play games sometimes, but these days I usually read before bed.

  - title: Friendship and disagreements
    summary: Talk about friendships, arguments and making up with phrasal verbs, choose between would, used to and the past simple, and apologize sincerely.
    minutes: 45
    skills: [vocabulary, grammar, listening]
    tags: [en.used-to, en.phrasal-verbs, en.pronunciation]
    objectives:
      - Use phrasal verbs and expressions for relationships (fall out, make up, let someone down, drift apart)
      - Choose between would, used to and the past simple to talk about the past
      - Apologize, accept an apology and disagree politely
    intro: |
      Every friendship has its ups and downs — a forgotten birthday, a careless comment, a friend who moves away. English has many **phrasal verbs** for these moments: we *fall out*, *make up* and sometimes *drift apart*. In this lesson you will learn them, practice apologizing and disagreeing without starting a fight, and use **would** — not only used to — to remember the things you did together.
    vocab: |
      fall out (with) | to have an argument with someone and stop being friendly | phr v | Jo and I fell out over a silly joke. | - | c: fall out with someone; fall out over something | n: Past: fell out.
      make up | to become friends again after an argument | phr v | They had a huge argument, but they made up the next day. | - | c: kiss and make up (idiom); make up with someone
      let (someone) down | to disappoint someone by not doing what you promised | phr v | I promised to help him move, and then I let him down. | - | n: The past of let is let.
      look up to | to admire and respect someone | phr v | I've always looked up to my older cousin. | - | n: The opposite is look down on.
      keep in touch | to continue to call or write to someone who doesn't live near you | expr | We keep in touch with video calls every month. | - | c: stay in touch; lose touch
      drift apart | to slowly become less close to someone | phr v | After college, we slowly drifted apart. | -
      argument | an angry discussion between people who disagree | n | We had an argument about money. | - | c: have an argument; start an argument | n: Spelling: no e after the u.
      apologize | to say you are sorry for something you did | v | She apologized for forgetting my birthday. | - | c: apologize to someone for something | n: British spelling: apologise.
      trust | to believe that someone is honest and won't hurt you | v | I trust her completely. | - | c: trust someone with a secret | n: Also a noun: Trust is the most important thing in a friendship.
      point of view | your way of thinking about a situation | n | I understand your point of view, but I don't agree. | - | c: from my point of view; see someone's point of view
      hold a grudge | to stay angry with someone for a long time about something they did | expr | My aunt never holds a grudge — she forgives people quickly. | - | c: hold a grudge against someone
      close | having a strong, warm relationship | adj | My sister and I are very close; we talk every day. | - | c: a close friend; close to someone | n: In this meaning it ends with an s sound, not z.
      That's not what I meant. | a phrase to correct a misunderstanding | expr | Sorry, that's not what I meant. I wasn't criticizing you. | -
    grammar:
      title: "would, used to or the past simple?"
      body: |
        When we remember **repeated actions** in the past, we can use **would** + base form as well as **used to**: *Every summer we **would** go camping by the lake.* Would is very common in memories and storytelling, often after the topic has been introduced with used to.

        But would has a limit:
        - **would** is only for **repeated actions**: *We**'d** talk for hours.*
        - **used to** works for repeated actions **and** past **states** (be, have, live, like, know, believe): *We **used to be** best friends* (not ~~We would be best friends~~).
        - For a **single event**, or an action at a specific time, use the **past simple**: *We **fell out** in 2019.*

        The past simple can also describe repeated actions, especially with a time expression (*We walked to school every day*), but it doesn't show as clearly that the habit has stopped. Don't confuse this *would* with the *would* in *I would like…*. The short form **'d** is the same for both.
      table: |
        Meaning | used to | would | past simple
        Repeated action, now finished | We used to walk to school. | We'd walk to school. | We walked to school every day.
        Past state, now finished | She used to live next door. | ✗ | She lived next door for years.
        One event | ✗ | ✗ | We met in 2015.
      examples: |
        When we were kids, Sam and I would spend every weekend at the beach. | | would: repeated action
        We used to be inseparable. | | used to: state (be)
        Then, one summer, we fell out over a girl in our class. | | past simple: one event
        We'd argue about everything, but we always made up quickly. | | 'd = would
      tip: "If the verb describes a state (be, have, know, like, live), you can't use would. Choose used to or the past simple."
    dialogue:
      title: The missed dinner
      setting: A Saturday morning at a café in Cork, Ireland. Aoife meets her friend Kwame. Last Friday, Kwame missed her birthday dinner without telling her.
      speakers: A=Aoife/f; K=Kwame/m
      lines: |
        A: Thanks for coming. Honestly, I almost didn't text you back.
        K: I know, and I deserve that. I'm really sorry about Friday.
        A: I booked a table for eight people, and you didn't even call.
        K: You're right. I let you down. My phone died at work, but that's no excuse.
        A: It isn't just Friday, Kwame. You cancel all the time these days.
        K: That's fair. Work has been crazy, but I should make more time for you.
        A: We used to see each other every week. Do you remember?
        K: Of course. We'd meet at the market every Sunday and talk for hours.
        A: Exactly. I don't want us to drift apart like other friends do.
        K: Me neither. Let me take you out for a birthday dinner this week.
        A: OK, apology accepted. But you're paying — and please don't be late!
        K: Deal. And I'll charge my phone before I leave the house!
    pronunciation:
      title: Linking in phrasal verbs
      body: |
        In natural speech, a word that ends in a **consonant** links smoothly to a next word that starts with a **vowel**: *fell out* sounds like "fe-lout", and *made up* sounds like "may-dup". This is why phrasal verbs can be hard to hear — the two words become one.

        Practice saying each phrase as if it were a single word, keeping the stress on the particle (out, up, down): *We fell OUT. We made UP.* Listen and repeat.
      items: |
        We fell out.
        They made up.
        I let him down.
        We kept in touch.
        I look up to her.
        We drifted apart.
    culture:
      title: Disagreeing without arguing
      body: |
        In English, direct phrases like *You're wrong* or *That's stupid* can sound aggressive, even between friends. People usually soften disagreement: *I see your point, but…*, *I'm not sure I agree*, *Maybe, but don't you think…?* Starting with a small agreement before you disagree helps the conversation stay friendly.

        When you apologize, a short explanation is fine, but a long list of excuses can sound insincere. *I'm really sorry. That was my fault* often works better than five reasons why it wasn't.
    mistakes: |
      We would be best friends at school. => We used to be best friends at school. | Would is only for repeated actions. For a state (be), use used to.
      I fell out my best friend. => I fell out with my best friend. | Fall out needs with before the person.
      I apologized him for being late. => I apologized to him for being late. | Apologize to someone for something.
    task:
      title: Making it up to a friend
      mode: interaction
      body: |
        Role-play with a partner: you forgot to go to a friend's important event (a concert, a graduation, a birthday). Call them, apologize, give a short honest explanation and suggest a way to make it up to them. Your partner is upset at first and disagrees with your excuses. Then practice agreeing and disagreeing politely with the AI coach in the "Expressing an opinion" scenario.
    exercises: |
      fill: Every summer, my cousins and I ___ build a treehouse in Grandma's yard. || would / used to || A repeated past action: would or used to + base form. || @tags en.used-to
      mc: Choose the correct sentence. || We would live in the same building. | *We used to live in the same building. | We would to live in the same building. || Live is a state verb, so would is not possible here. Use used to. || @tags en.used-to
      mc: "Kim and I ___ in 2018, and we haven't spoken since." || used to fall out | would fall out | *fell out || A single event at a specific time takes the past simple. || @tags en.past-simple,en.phrasal-verbs
      fill: I'm sorry I ___ you down. I promised to come and I didn't. || let || Let someone down = disappoint them. The past of let is let. || @tags en.phrasal-verbs
      fill: We had a big argument, but we made ___ the next morning. || up || Make up = become friends again after an argument. || @tags en.phrasal-verbs
      match: keep in touch = You call your friend in Canada every month. ; drift apart = You see an old friend less and less, for no clear reason. ; hold a grudge = You're still angry about something that happened ten years ago. ; make up = After the argument, you hug and say sorry. ; let someone down = You forget to pick up your friend at the airport. || Each expression is matched with the situation it describes. || @hint Match each expression with a situation. @skill vocabulary @tags en.phrasal-verbs
      rw: Rewrite with "would" :: Every Friday, my dad used to make pizza for the whole family. || Every Friday, my dad would make pizza for the whole family. | Every Friday my dad would make pizza for the whole family. | My dad would make pizza for the whole family every Friday. || Making pizza is a repeated action, so would is possible. || @tags en.used-to
      tf: Kwame called Aoife on Friday to say he couldn't come. || false || Aoife says, "You didn't even call." His phone died at work. || @ctx dialogue
      short: Where did Aoife and Kwame use to meet on Sundays? || kw: market || Kwame says, "We'd meet at the market every Sunday." || @ctx dialogue
      listen: @dialogue || How does the conversation end? || Aoife refuses to see Kwame again. | *Aoife accepts the apology and they plan a dinner. | Kwame asks Aoife to pay for dinner. || "OK, apology accepted. But you're paying" — Kwame will take her out for a birthday dinner. || @tags en.listening
      listen: My best friend and I fell out over money years ago. She apologized last month, and now we have lunch together every Friday. || What is true about the two friends now? || *They're friends again. | They still don't speak to each other. | They argue about money every Friday. || She apologized, and now they have lunch every Friday — they've made up. || @tags en.listening,en.phrasal-verbs
      order: I understand your point of view, but I don't agree. || @tags en.opinion
      dict: We'd talk on the phone for hours every night. || would for repeated actions
      ask: Tell a friend about a time you fell out with someone and how you made up. || kw: fell out/argued/had an argument/had a fight & made up/apologized/said sorry/talked || When I was at university, I fell out with my roommate because I never cleaned the kitchen. We didn't speak for a week. In the end, I apologized, we made a cleaning plan and we made up.
      write: Write a short apology message (50–70 words) to a friend you let down. Explain what happened, say sorry and suggest how to make it up to them. || min=40 || req: sorry | let you down/apologize/apologise/my fault || Hi Priya, I'm really sorry I missed your gallery opening last night. I know how important it was for you, and I let you down. I fell asleep after my night shift and didn't wake up until ten. That's no excuse. Can I take you out for lunch on Saturday? I'd love to hear all about it. Love, Sam

  - title: Telling an anecdote
    summary: Tell a short, lively story about something that happened to you, using the past continuous for the background and the past simple for the events, with linkers like as soon as and just as.
    minutes: 45
    skills: [speaking, grammar, listening]
    tags: [en.past-continuous, en.past-simple, en.discourse-markers]
    objectives:
      - Set the scene with the past continuous and move the story on with the past simple
      - Control the timing of a story with linkers (just as, as soon as, suddenly, in the end)
      - Start an anecdote, keep it going and react to other people's stories
    intro: |
      An anecdote is a short, true story about something funny, strange or embarrassing that happened to you — the kind of story people tell over dinner or during a coffee break. Good storytellers set the scene, build up to the main event and finish with a surprise or a feeling. In this lesson you will combine the **past continuous** and **past simple**, use linkers that control the timing, and learn phrases to start a story and react to one.
    vocab: |
      You'll never guess what happened. | a phrase to start an interesting or surprising story | expr | You'll never guess what happened on my way to work! | -
      So there I was… | a phrase that puts the listener in the middle of the scene | expr | So there I was, standing in the rain with no keys and no phone. | - | n: Informal and very common in spoken stories.
      just as | at exactly the same moment as | conj | Just as I was leaving, the phone rang. | -
      as soon as | immediately after | conj | As soon as I saw her face, I knew something was wrong. | -
      suddenly | quickly and when you don't expect it | adv | Suddenly, all the lights in the building went out. | - | c: all of a sudden
      it turned out (that) | finally, the truth was (that) | expr | It turned out that the "stranger" at the party was my new boss. | - | n: Used to reveal a surprise near the end of a story.
      in the end | finally, after a lot of things happened | expr | In the end, we took a taxi and arrived just in time. | - | n: Don't confuse it with at the end of (the movie, the street).
      embarrassed | feeling silly or uncomfortable because of what other people think | adj | I was so embarrassed when I called my teacher "Mom." | - | c: feel embarrassed; embarrassed about something | n: Spelling: double r and double s.
      relieved | happy because something bad didn't happen or is finally over | adj | We were really relieved when the plane landed safely. | -
      realize | to suddenly understand or notice something | v | At the station, I realized my wallet wasn't in my bag. | - | n: British spelling: realise.
      recognize | to know who someone is because you have seen them before | v | I didn't recognize him with a beard. | - | n: British spelling: recognise.
      No way! | an informal reaction that shows great surprise | expr | "Then the singer sat down at our table." — "No way!" | - | c: You're kidding!; Seriously?
      What happened next? | a question that asks someone to continue a story | expr | "The door was locked from the inside." — "Oh no! What happened next?" | -
    grammar:
      title: "Narrative tenses: background and events"
      body: |
        Most stories need two past tenses working together.

        - The **past continuous** (was/were + -ing) describes the **background** — what was in progress when the story started: *It **was raining**, and I **was waiting** for the bus.*
        - The **past simple** moves the story forward with the **main events**, usually in the order they happened: *A car **stopped**, the window **opened** and a woman **called** my name.*

        You already know *when* and *while*. These linkers help you control the timing more precisely:
        - **just as** — at exactly the same moment: ***Just as** I was sitting down, my phone rang.*
        - **as soon as** — immediately after: ***As soon as** I heard her voice, I recognized her.*
        - **suddenly**, **then**, **after that**, **in the end** — order and surprise.

        Remember that state verbs (know, want, believe, need, like) are not normally used in the continuous: *I **knew** something was wrong* (not ~~I was knowing~~).
      table: |
        Job in the story | Tense | Example
        Set the scene | past continuous | The sun was shining and people were having lunch outside.
        Main events | past simple | A dog ran across the square and jumped into the fountain.
        Interrupted action | past continuous + past simple | I was taking a photo when it splashed me.
        The exact same moment | just as + past continuous | Just as I was leaving, the owner arrived.
      examples: |
        We were driving through the mountains when the car started to make a strange noise. | | background + event
        As soon as we stopped, smoke came out of the engine. | | as soon as = immediately after
        Just as I was calling for help, a farmer drove past on his tractor. | | just as = at that exact moment
        In the end, he pulled our car to the next village. | | in the end = finally
      tip: "Start with one or two background sentences in the past continuous, then switch to the past simple for the action. Too much past continuous makes a story feel slow."
    dialogue:
      title: The wrong wedding
      setting: Lunch break at a design studio in Wellington, New Zealand. Rangi tells his coworker Elif about something embarrassing that happened to him on Saturday.
      speakers: R=Rangi/m; E=Elif/f
      lines: |
        R: You'll never guess what happened to me on Saturday.
        E: Go on, tell me. Was it at the wedding you were going to?
        R: Yes! I was driving to the hotel, and it was raining really hard.
        R: I saw balloons and people in suits outside, so I parked and ran in.
        E: And? What was the problem?
        R: Well, a band was playing and people were dancing, but I didn't recognize anyone.
        E: Oh no. Don't tell me it was somebody else's wedding!
        R: Exactly! Just as I was reaching for a piece of cake, the bride walked over.
        E: No way! What did you say to her?
        R: I said congratulations, and she asked me how I knew her husband!
        E: That's so embarrassing! So where was your friend's wedding?
        R: It turned out it was at the hotel next door. I arrived just in time.
    pronunciation:
      title: "Showing surprise: No way! Seriously?"
      body: |
        When you react to a story, your voice does as much work as your words. To sound surprised and interested, start **high** and use a big fall or rise: *No WAY!* (high, then falling), *Se-RI-ous-ly?* (rising at the end).

        If you say these phrases on one flat note, they sound bored or even sarcastic. Exaggerate a little — it sounds natural in English. Listen and repeat.
      items: |
        No way!
        Seriously?
        You're kidding!
        Oh no!
        What happened next?
        That's so embarrassing!
    culture:
      title: Listening is part of the story
      body: |
        In English-speaking countries, a good anecdote is usually short — about a minute — and the listener is expected to take part. Small reactions like *Really?*, *Oh no!* and *Then what?* show you are interested. They are not rude interruptions; silence can actually make the speaker think you are bored.

        Many English speakers, especially in the UK, Ireland, Australia and New Zealand, love stories in which the speaker laughs at themselves. Telling a story about your own embarrassing mistake is a friendly way to connect with people.
    mistakes: |
      I was knowing that something was wrong. => I knew that something was wrong. | Know is a state verb, so it isn't normally used in the continuous.
      At the end, we found the keys in my coat pocket. => In the end, we found the keys in my coat pocket. | In the end means finally. At the end needs of: at the end of the day.
      I was so embarrassing when I fell over. => I was so embarrassed when I fell over. | -ed adjectives describe how you feel; -ing adjectives describe the thing that causes the feeling.
    task:
      title: Your one-minute anecdote
      mode: speaking
      body: |
        Think of something funny, surprising or embarrassing that really happened to you. Plan it in four parts: the background (two sentences in the past continuous), three or four main events (past simple), the surprise (*It turned out that…*) and how you felt in the end. Tell it in about one minute, then tell it to the AI coach in the "Talking about your day" scenario and react to the coach's questions.
    exercises: |
      fill: I ___ (walk) through the park when I ___ (see) an old friend from school. || was walking ; saw || Background action in progress: past continuous. The event that interrupts it: past simple (see → saw). || @tags en.past-continuous,en.past-irregular
      fill: Just as we ___ (sit) down to eat, the fire alarm went off. || were sitting || Just as + past continuous for the action in progress at that exact moment. || @tags en.past-continuous
      mc: "___ I opened the door, the cat ran out into the street." || *As soon as | While | During || As soon as = immediately after. While needs a longer action in progress, and during is followed by a noun (during the night). || @tags en.connectors
      mc: Choose the correct sentence. || I was knowing the answer, but I was too shy to say it. | *I knew the answer, but I was too shy to say it. | I was know the answer, but I was too shy to say it. || Know is a state verb, so use the past simple: I knew. || @tags en.past-simple,en.past-continuous
      mc: "I forgot my lines in the school play, and everyone laughed. I felt so ___." || embarrassing | *embarrassed | relieved || -ed adjectives describe feelings. Relieved means happy that something bad is over, which doesn't fit. || @tags en.vocabulary @skill vocabulary
      rw: Join the sentences with "while" :: I was cooking dinner. The power went off. || The power went off while I was cooking dinner. | While I was cooking dinner, the power went off. | While I was cooking dinner the power went off. || While + past continuous for the longer background action. || @tags en.past-continuous,en.connectors
      order: As soon as the train stopped, everyone rushed to the doors. || @tags en.connectors,en.past-simple
      tf: Rangi went into the wrong hotel. || true || The wedding was in a different place: "It turned out it was at the hotel next door." || @ctx dialogue
      short: Who walked over to Rangi when he was reaching for some cake? || kw: bride || "Just as I was reaching for a piece of cake, the bride walked over." || @ctx dialogue
      listen: @dialogue || How did Rangi finally get to his friend's wedding? || *It was next door, and he arrived just in time. | He drove to another town and arrived late. | He never got there. || "It turned out it was at the hotel next door. I arrived just in time." || @tags en.listening
      listen: I was jogging along the beach when I found a wallet in the sand. As soon as I opened it, I saw a photo of my neighbor! || Whose wallet was it? || The speaker's | *The speaker's neighbor's | A tourist's || The speaker saw a photo of their neighbor inside the wallet. || @tags en.listening,en.past-continuous
      dict: Just as I was leaving the house, it started to rain. || just as + past continuous
      ask: Your friend says, "And then I realized I was on the wrong train!" React with surprise and ask them to continue. || kw: no way/really/seriously/oh no/you're kidding/you are kidding & what happened/what did you do/then what || No way! What did you do?
      write: Write an anecdote (80–100 words) about something surprising, funny or embarrassing that happened to you. Set the scene, tell the main events and say how it ended. || min=70 || req: when/while/just as/as soon as | in the end/it turned out/finally/eventually || Last winter I was traveling home from Montreal. It was snowing heavily, and everyone at the airport was tired. Just as I was falling asleep at the gate, I heard my name. I jumped up and ran to the desk, sure that I was late for my flight. It turned out that the airline wanted to move me to business class because the plane was full! I was so relieved — and I slept all the way home.
