unit: 4
title: Staying connected
theme: Media and technology
description: Follow and retell news stories with the past perfect, report what people said about their digital lives, and solve a tech problem by phone — then report the questions and instructions you heard.
objectives:
  - Use the past perfect to show which past event happened first, especially in news stories
  - Report statements with say and tell, changing tenses, pronouns and time words
  - Explain a tech problem and report questions, requests and instructions
canDo:
  - I can understand a short news story and retell it in my own words.
  - I can report what someone told me about their habits or experiences.
  - I can describe a problem with a device and follow instructions to solve it.
  - I can report the questions and instructions someone gave me.
review: |
  fill: When we got to the cinema, the movie ___ already ___ (start). || had ; started || Past perfect: the movie started before we arrived. || @tags en.past-perfect
  mc: Which sentence means that the guests left BEFORE Amir arrived? || When Amir arrived, the guests left. | *When Amir arrived, the guests had left. | When Amir was arriving, the guests left. || Had left shows that the guests' leaving happened first. || @tags en.past-perfect
  rw: Join the sentences with "because" :: I didn't recognize her. She cut her hair very short. || I didn't recognize her because she had cut her hair very short. | I didn't recognize her because she'd cut her hair very short. || The haircut happened first, so use the past perfect: had cut. || @tags en.past-perfect,en.connectors
  rw: Report what Ines said :: "I'm working from home today." || Ines said she was working from home that day. | Ines said that she was working from home that day. || Am working → was working; I → she; today → that day. || @tags en.reported-speech
  fill: My brother ___ me that he had lost his phone again. || told || Tell + person: he told me… || @tags en.reported-speech
  rw: Report the question :: "Do you use social media every day?" (She asked me…) || She asked me if I used social media every day. | She asked me whether I used social media every day. || Yes/no question: if/whether + statement word order; use → used. || @tags en.reported-speech,en.questions
  mc: Choose the correct sentence. || He told me don't share the link. | *He told me not to share the link. | He told me to not sharing the link. || Reported negative instructions: tell someone not to + base form. || @tags en.reported-speech
  listen: By the time I finally found the right platform, my train had already left, so I had to wait an hour for the next one. || Why did the speaker wait an hour? || The train was late. | *They missed their train. | The station was closed. || "My train had already left" — it left before the speaker got to the platform. || @tags en.listening,en.past-perfect
  listen: The technician asked me when the problem had started. I told her it had started after the update, so she told me to install the update again. || What did the technician tell the speaker to do? || *Install the update again | Buy a new phone | Wait until the next day || "She told me to install the update again." || @tags en.listening,en.reported-speech
  ask: Tell a friend about a news story you read or heard recently. Say what had happened and what people said about it. || kw: had/'d & said/told/according to || I read about a man who had lost his wedding ring on a beach. Twenty years later, a child found it with a metal detector. The man said he had never stopped hoping.
  write: Write a short email (60–80 words) to a colleague who missed a meeting. Report two things people said and one thing your manager asked you to do. || min=50 || req: said/told | asked | to || Hi Lucas, you missed a good meeting this morning! Sanjay said that the new website was almost ready, and Mia told us the client had loved the designs. Our manager asked if anyone could test the website this week, so I said we would do it together. She asked me to send her our comments by Friday. Can we meet tomorrow at ten? Thanks, Rosa
lessons:
  - title: News and how we follow it
    summary: Read a short news story, use the past perfect to show which past event happened first, and talk about where you get your news.
    minutes: 45
    skills: [reading, grammar, writing]
    tags: [en.past-perfect, en.reading, en.pronunciation]
    objectives:
      - Use the past perfect (had + past participle) for the earlier of two past events
      - Use by the time, already, before and never… before with the past perfect
      - Understand the structure and vocabulary of a news story
    intro: |
      News stories often jump back in time: something surprising happens today, and then the writer explains what **had happened** before. In this lesson you will read a local news story about a very late library book, learn the **past perfect**, and talk about how you follow the news — on paper, on the radio or on your phone.
    vocab: |
      headline | the title of a news story, printed in large letters | n | I usually just read the headlines on my phone. | - | c: hit the headlines; a front-page headline
      article | a piece of writing in a newspaper, magazine or on a website | n | I read an interesting article about sleep this morning. | - | c: a newspaper article; an online article
      journalist | a person whose job is to find out and report the news | n | The journalist interviewed people in the street. | -
      source | the person, place or document that information comes from | n | Always check the source before you share a story. | - | c: a reliable source; a news source
      trustworthy | able to be trusted | adj | It's hard to know which websites are trustworthy. | -
      breaking news | very new information about an important event that is happening now | n | We interrupt this program with breaking news. | -
      follow | to keep yourself informed about something | v | I follow the news on the radio while I cook. | - | c: follow the news; follow a story closely
      go missing | to disappear or be lost | expr | My grandfather's watch went missing years ago. | -
      turn up | to appear or be found, often unexpectedly | phr v | My keys finally turned up in the fridge! | -
      by the time | not later than the moment when something happened | conj | By the time the police arrived, the thief had disappeared. | - | n: Often used with the past perfect.
      already | before now, or before a particular time — often earlier than expected | adv | When I got to the station, the train had already left. | - | n: It goes between had and the past participle.
      attic | the room or space under the roof of a house | n | We keep our old photos in boxes in the attic. | -
    grammar:
      title: "The past perfect"
      body: |
        Use the **past perfect** (had + past participle) to show that one past action happened **before** another past action or before a time in the past: *When I arrived, the film **had** already **started**.* First the film started; then I arrived.

        Compare: *When I arrived, the film started.* This means I arrived and then the film started.

        The past perfect is common with **by the time**, **already**, **before**, **after**, **because** and **never… before**: *She **had never flown** before.* The form is the same for every person. The negative is **hadn't**, and questions start with **Had**: *Had you heard the news?* In speech, *had* is often shortened to **'d**: *I'd forgotten my password.*

        You don't need the past perfect when the order is already clear and you tell events in the order they happened: *I finished my homework and then I went out.*
      table: |
        Form | Example
        Positive | She had borrowed the book in 1974.
        Short form | I'd forgotten my password.
        Negative | They hadn't heard the news.
        Question | Had you ever seen anything like it?
        With by the time | By the time we got there, everyone had left.
      examples: |
        When we got to the cinema, the movie had already started. | | first the movie started
        The library had stopped charging late fees, so she didn't owe anything. | | an earlier situation explains a later one
        I had never read a news story like that before. | | never… before
        By the time the firefighters arrived, the neighbors had put out the fire. | | by the time
      tip: "Imagine a timeline. When you are telling a story in the past and need to jump back to an earlier moment, use had + past participle."
    reading:
      title: A book comes home — 52 years late
      text: |
        MILLBROOK, Vermont — Staff at Millbrook Public Library got a surprise on Monday morning when a small package arrived from Spain.

        Inside the package were a 1960s travel guide to Europe, a handwritten letter and a check for $100. The book had been missing since 1974.

        The letter came from Margaret Ellis, 73, who grew up in Millbrook. She explained that she had borrowed the book in the summer of 1974, just before she left for a year of study in Madrid. "I had planned to return it when I came back," she wrote, "but I fell in love with the city, and I never came home."

        Ms. Ellis found the book last month while she was clearing out her attic. "As soon as I saw the library stamp, I felt terrible," she said in a phone interview. "I'd carried that book across an ocean and through fifty years of my life, and I had completely forgotten that it wasn't mine."

        Librarian Tom Becker said that nothing like this had ever happened in his thirty years at the library. "By the time I finished reading the letter, my whole team had gathered around my desk," he said. "Everyone was smiling."

        The library had stopped charging late fees in 2021, so Ms. Ellis did not owe any money. Mr. Becker said the library would use her $100 to buy new travel books. The old guide, with Ms. Ellis's notes still in the margins, now sits in a glass case near the front door.
    pronunciation:
      title: "Hearing the 'd in I'd, she'd, they'd"
      body: |
        In speech, **had** in the past perfect is usually shortened to **'d**, which is very hard to hear: *I'd forgotten* sounds almost like "I forgotten". Listen for the **past participle** (*forgotten, left, gone*) — it tells you that it's the past perfect.

        Practice saying the 'd clearly but quickly, joined to the pronoun: "I'd", "she'd", "they'd". Listen and repeat.
      items: |
        I'd forgotten my keys.
        She'd already left.
        They'd never met before.
        We'd missed the start.
        Had you heard the news?
    culture:
      title: How people follow the news
      body: |
        Many people in English-speaking countries now get their news mainly from their phones — through news apps, social media and podcasts — and fewer people buy a printed newspaper. Local papers, which report on schools, sports and town events, have closed in many towns.

        Headlines have their own grammar: they often use the **present simple** for past events and leave out small words like *the* and *a*: *Woman returns library book after 52 years.* Always read the whole article — a headline is designed to make you click, not to tell the full story.
    mistakes: |
      When I arrived, the train already left. => When I arrived, the train had already left. | The train left before I arrived, so use the past perfect.
      I had went to bed when you called. => I had gone to bed when you called. | The past perfect is had + past participle (gone), not the past simple (went).
      By the time we arrived, the party finished. => By the time we arrived, the party had finished. | By the time usually needs the past perfect for the earlier action.
    task:
      title: Local news
      mode: writing
      body: |
        Write a short news story (80–100 words) about an unusual event in your town — real or imaginary. Give it a headline in the present simple. Say what happened, then jump back to explain what had happened before, using at least two past perfect verbs and *by the time* or *already*. Read it to a friend and ask them to retell it in their own words.
    exercises: |
      mc: Where did the package come from? || Vermont | *Spain | Portugal || "A small package arrived from Spain." Millbrook, where the library is, is in Vermont. || @ctx reading @tags en.reading
      tf: Margaret Ellis had to pay a large late fee. || false || "The library had stopped charging late fees in 2021, so Ms. Ellis did not owe any money." || @ctx reading
      short: Why didn't Margaret return the book after her year in Madrid? || kw: stayed/never came/fell in love/didn't come/did not come || "I fell in love with the city, and I never came home." || @ctx reading
      fill: When I got to the station, my train ___ already ___ (leave). || had ; left || The train left first: had + already + past participle (left). || @tags en.past-perfect
      fill: By the time the police arrived, the thief ___ (disappear). || had disappeared / 'd disappeared || By the time + past simple, then the past perfect for the earlier action. || @tags en.past-perfect
      mc: Choose the correct sentence. || I had never saw such a strange headline before. | *I had never seen such a strange headline before. | I have never seen such a strange headline before last week. || Past perfect: had + past participle (seen). || @tags en.past-perfect,en.past-irregular
      mc: "Mia was upset because someone ___ her bike." || has stolen | *had stolen | was stealing || The theft happened before Mia was upset, so use the past perfect. || @tags en.past-perfect
      rw: Join the sentences with "because" :: I didn't recognize him. He grew a beard. || I didn't recognize him because he had grown a beard. | I didn't recognize him because he'd grown a beard. || The beard came first, so use the past perfect: had grown. || @tags en.past-perfect,en.connectors
      order: By the time I read the article, everyone had already shared it. || @tags en.past-perfect
      listen: When I turned on the radio, the interview had already finished, so I listened to it online later. || Why did the speaker listen to the interview online? || *They had missed it on the radio. | Their radio was broken. | The interview was only available online. || "The interview had already finished" when they turned on the radio. || @tags en.listening,en.past-perfect
      dict: She had borrowed the book before she moved abroad. || had + past participle
      ask: Tell a friend about a time you arrived somewhere too late. What had already happened when you got there? || kw: had/'d & by the time/when/already || Last year I went to a concert, but my bus was late. By the time I got there, the band had already played my favorite song!
      write: Write a short news story (70–90 words) with a headline about an unusual event. Use the past perfect at least twice. || min=60 || req: had | by the time/already/before/never || Cat returns home after three years. A family in Halifax got a surprise on Sunday when their cat, Pumpkin, walked through the kitchen door. Pumpkin had gone missing in 2023, and the family had already put up hundreds of posters. By the time they moved house last year, they had stopped hoping. A neighbor had recognized Pumpkin from an old poster and brought her to the new house.

  - title: Digital life
    summary: Talk about phone and internet habits, and report what people said with say, tell and changes of tense, pronouns and time words.
    minutes: 45
    skills: [grammar, listening, speaking]
    tags: [en.reported-speech, en.past-perfect, en.pronunciation]
    objectives:
      - Report statements with say and tell
      - Change tenses, pronouns and time words in reported speech
      - Talk about screen time, social media and digital habits
    intro: |
      How many hours a day do you spend on your phone? Most of us share and repeat what other people tell us about their digital habits — *My sister said she had deleted all her apps!* In this lesson you will learn the language of digital life and how to **report what someone said**, changing the tense, the pronouns and the time words.
    vocab: |
      scroll | to move up or down a screen to see more | v | I scrolled through my feed for an hour last night. | - | c: scroll through; scroll down
      screen time | the amount of time you spend looking at a phone, computer or TV | n | My screen time went up a lot last month. | -
      notification | a message on your phone that tells you something new has happened | n | I turned off all my notifications. | - | c: turn off notifications; get a notification
      feed | the list of new posts you see on a social media app | n | My feed is full of cooking videos. | -
      post | to put a message, photo or video online | v | She posts photos of her garden every day. | - | n: Also a noun: a post.
      share | to send something to other people online | v | Don't share a story before you check it. | -
      delete | to remove something from a computer or phone | v | I deleted three apps yesterday. | -
      addicted (to) | unable to stop doing or using something | adj | I think I'm addicted to my phone. | -
      digital detox | a period when you don't use your phone, computer or social media | n | I'm doing a digital detox this weekend. | -
      keep up with | to stay informed about someone or something | phr v | I use social media to keep up with friends abroad. | -
      go viral | to spread very quickly online | expr | Her video went viral overnight. | -
      anxious | worried and nervous | adj | Checking the news all day makes me anxious. | -
    grammar:
      title: "Reported speech: statements"
      body: |
        When we report what someone said, the speaking happened in the past, so we usually move the verb **one step back** (this is called backshift):
        - present simple → past simple: "I feel anxious." → *He said he **felt** anxious.*
        - present continuous → past continuous: "I'm sleeping better." → *He said he **was sleeping** better.*
        - present perfect and past simple → past perfect: "I've deleted my apps." → *He told me he **had deleted** his apps.*
        - **will → would**, **can → could**: "I'll call you." → *She said she **would** call me.*

        Change **pronouns** and **time and place words** too: *today → that day, tomorrow → the next day, yesterday → the day before, here → there.*

        **Say** or **tell**? *Say (that)* + clause: *She said (that) she was tired.* *Tell* + **person** + (that): *She told **me** (that) she was tired.* That is often left out. If something is still true now, you don't have to backshift: *He said he lives in Chicago.*
      table: |
        Direct speech | Reported speech
        "I'm tired." | She said she was tired.
        "I'm working from home." | He said he was working from home.
        "I've deleted my apps." | He told me he had deleted his apps.
        "I'll call you tomorrow." | She said she would call me the next day.
        "I can't come." | He said he couldn't come.
      examples: |
        "I spend four hours a day online." → She said she spent four hours a day online. | | present simple → past simple
        "I've turned off my notifications." → Sam told me he'd turned off his notifications. | | present perfect → past perfect
        "We'll post the photos tomorrow." → They said they would post the photos the next day. | | will → would; tomorrow → the next day
        "I can't live without my phone." → My cousin said she couldn't live without her phone. | | can → could
      tip: "Say something, tell someone: She said hello. She told me a secret. Never say \"said me\"."
    dialogue:
      title: The kitchen challenge
      setting: A weekday evening in the kitchen of a shared apartment in Chicago. Zara tells her roommate Matteo about a colleague who has stopped using social media.
      speakers: Z=Zara/f; M=Matteo/m
      lines: |
        M: You look happy. Did something good happen at work?
        Z: Kind of. My colleague Ben told me he'd deleted all his social media apps.
        M: Really? He's always on his phone. Why did he do that?
        Z: He said he was spending four hours a day scrolling, and he felt anxious.
        M: Four hours! That's half a working day. So how does he feel now?
        Z: He told me he was sleeping much better and reading books again.
        M: Good for him. But doesn't he miss all his friends' updates?
        Z: He said that his real friends would call him if they had news.
        M: Fair point. Let me check my screen time… Oh no. Six hours yesterday!
        Z: Ha! I said exactly the same thing when I saw mine.
        M: OK, let's try a challenge. No phones in the kitchen for a week.
        Z: Deal. But last month you told me you couldn't live without your phone!
    pronunciation:
      title: Stress in reported speech
      body: |
        In reported speech, the reporting words (*he said, she told me*) are usually quick and unstressed. The stress goes on the **new information**: *He said he'd DELETED them. She told me she was MOVING.*

        Notice that **said** is pronounced "sed" — it doesn't rhyme with *paid*. Listen and repeat.
      items: |
        He said he was tired.
        She told me she'd deleted it.
        They said they couldn't come.
        He told me he'd call.
        She said her video went viral.
    culture:
      title: Phones at the table
      body: |
        In many English-speaking homes and workplaces, looking at your phone during a meal, a meeting or a conversation can seem rude. If you have to answer a call, people usually apologize first: *Sorry, do you mind if I take this? It's my mom.*

        "Digital detox" weekends, phone-free bedrooms and screen-time limits have become popular ways to reduce stress, and many schools have introduced rules about phones in class.
    mistakes: |
      He said me that he was tired. => He told me that he was tired. | Use tell + person. Say is not followed directly by a person.
      She told that she had deleted her account. => She said that she had deleted her account. | Tell needs a person after it: She told me that…
      He said he will call me the next day. => He said he would call me the next day. | In reported speech, will usually changes to would.
    task:
      title: Screen-time survey
      mode: speaking
      body: |
        Ask three people about their phone and internet habits: *How much time do you spend online? Which app do you use most? Have you ever tried a digital detox?* Write down their answers, then report them to someone else: *Ana said she spent three hours a day online. She told me she had never tried a digital detox.* Then discuss whether social media is good or bad for us with the AI coach in the "Expressing an opinion" scenario.
    exercises: |
      rw: Report what Ben said :: "I feel anxious." || Ben said he felt anxious. | Ben said that he felt anxious. || Present simple → past simple; I → he. || @tags en.reported-speech
      rw: Report what Sara said :: "I've turned off my notifications." || Sara said she had turned off her notifications. | Sara said that she had turned off her notifications. | Sara said she'd turned off her notifications. | Sara said that she'd turned off her notifications. || Present perfect → past perfect; I → she, my → her. || @tags en.reported-speech,en.past-perfect
      rw: Report what Tom said, starting with "Tom told me" :: "I'll send you the link tomorrow." || Tom told me he would send me the link the next day. | Tom told me that he would send me the link the next day. | Tom told me he'd send me the link the next day. | Tom told me he would send me the link the following day. | Tom told me that he would send me the link the following day. || Will → would; you → me; tomorrow → the next day. || @tags en.reported-speech
      fill: She ___ me that she was addicted to her phone. || told || Tell + person (me). || @tags en.reported-speech
      fill: He ___ that he couldn't live without the internet. || said || Say + (that) + clause, with no person after it. || @tags en.reported-speech
      mc: "I can't find my charger," said Leo. → Leo said he ___ find his charger. || can't | *couldn't | hasn't || In reported speech, can usually changes to could. || @tags en.reported-speech
      mc: Choose the correct sentence. || She said me she was busy. | *She told me she was busy. | She told she was busy. || Tell + person; say has no person after it. || @tags en.reported-speech
      tf: Ben still spends four hours a day scrolling. || false || He said he was spending four hours a day scrolling — before he deleted his apps. Now he is sleeping better and reading. || @ctx dialogue
      short: How much screen time did Matteo have yesterday? || kw: six/6 || "Six hours yesterday!" || @ctx dialogue
      listen: @dialogue || What challenge do Zara and Matteo agree to try? || *No phones in the kitchen for a week | Deleting all their apps | No internet for a month || "No phones in the kitchen for a week." — "Deal." || @tags en.listening
      listen: My sister told me she'd stopped using social media in January. She said she felt calmer, but she missed seeing photos of her friends' kids. || What does the sister miss? || Watching videos | *Seeing photos of her friends' children | Posting photos of her own trips || "She missed seeing photos of her friends' kids." || @tags en.listening,en.reported-speech
      dict: He told me he had deleted all his social media apps. || tell + person
      ask: Report something a friend or family member told you recently about their phone or internet habits. || kw: said/told || My brother told me he had started leaving his phone at home on Sundays. He said he felt much more relaxed and that he talked to people more.
      write: Write a short message (50–70 words) to a friend reporting what three people said in a survey about their screen time. || min=40 || req: said | told || Hi Jo! I did a quick survey at work today. Malik said he spent five hours a day on his phone. Amy told me she had deleted her social media apps last year, and she said she didn't miss them. And our boss said he only used his phone for calls! Who do you think is telling the truth?

  - title: Solving a tech problem
    summary: Describe a problem with a device, follow a technician's instructions, and report questions, requests and instructions with ask, tell, if and whether.
    minutes: 45
    skills: [listening, grammar, speaking]
    tags: [en.reported-speech, en.questions, en.word-stress]
    objectives:
      - Describe common problems with devices and apps
      - Report questions with question words, if and whether
      - Report requests and instructions with ask/tell + person + (not) to
    intro: |
      Sooner or later, every device lets us down: a laptop that won't connect, an app that crashes, a password you can't remember. In this lesson you will learn the words you need to explain a tech problem, listen to a call to an IT helpdesk, and learn to **report questions and instructions** — *He asked me if I had restarted it. He told me to press the key.*
    vocab: |
      connect (to) | to join a device to a network or to another device | v | My laptop won't connect to the Wi-Fi. | - | c: connect to the internet; connect a printer
      restart | to turn a device off and on again | v | Try restarting your phone first. | - | n: Also: reboot (more technical).
      crash | (of a computer or app) to stop working suddenly | v | The app crashed while I was paying. | -
      freeze | (of a screen) to stop moving or responding | v | My screen froze in the middle of the video call. | - | n: Past: froze.
      error message | a message on a screen that says something has gone wrong | n | I keep getting the same error message. | -
      install | to put a new program or app on a device | v | I installed the new version last night. | -
      password | a secret word or set of characters you use to open an account | n | I've forgotten my password again! | - | c: a strong password; change your password
      reset | to make something go back to how it was at the start, or to create a new password | v | You can reset your password by email. | - | n: Past: reset.
      charger | a device that puts electricity into a battery | n | Can I borrow your phone charger? | -
      back up | to make a copy of files in case the originals are lost | phr v | Always back up your photos. | - | n: The noun is a backup.
      by accident | without meaning to | expr | I deleted the file by accident. | -
      work out | to find the answer to a problem by thinking about it | phr v | We finally worked out what the problem was. | -
    grammar:
      title: "Reported questions and requests"
      body: |
        Reported questions use **statement word order** (subject + verb), no *do/does/did* and no question mark. The tenses move back as in reported statements.

        - **Wh- questions** keep the question word: "When did the problem start?" → *He asked me **when the problem had started**.* "Where are you?" → *She asked **where I was**.*
        - **Yes/no questions** use **if** or **whether**: "Have you restarted it?" → *He asked **if / whether I had restarted** it.*

        **Requests and instructions** use **ask / tell + person + to + base form**. For negative instructions, use **not to**:
        - "Could you press the key?" → *He **asked me to press** the key.*
        - "Don't open the attachment." → *She **told me not to open** the attachment.*

        *Ask* is for polite requests; *tell* is for instructions and orders.
      table: |
        Direct | Reported
        "When did it start?" | He asked me when it had started.
        "Do you see an error message?" | He asked if I saw an error message.
        "Have you restarted it?" | She asked whether I had restarted it.
        "Could you press the key?" | He asked me to press the key.
        "Don't click the link." | She told me not to click the link.
      examples: |
        "What's your username?" → She asked me what my username was. | | statement word order
        "Is your laptop charged?" → He asked if my laptop was charged. | | yes/no question: if
        "Please send me a screenshot." → She asked me to send her a screenshot. | | request: ask + person + to
        "Don't turn it off." → He told me not to turn it off. | | instruction: tell + person + not to
      tip: "In a reported question, the question is over — so there is no question mark and no do/did: She asked where I lived."
    dialogue:
      title: No networks found
      setting: A Monday morning at a small architecture firm in Bristol, England. Mei Lin's laptop won't connect to the Wi-Fi, so she calls Connor at the IT helpdesk.
      speakers: C=Connor/m; M=Mei Lin/f
      lines: |
        C: IT support, Connor speaking. How can I help?
        M: Hi, it's Mei Lin from accounts. My laptop won't connect to the Wi-Fi.
        C: OK. Can you tell me when the problem started?
        M: This morning. It was working perfectly on Friday afternoon.
        C: Right. Have you tried turning it off and on again?
        M: Yes, twice. My phone connects fine, but the laptop says "No networks found."
        C: Maybe the Wi-Fi is switched off. Is there a key with an antenna symbol?
        M: Let me look… Yes, there's one above the number keys.
        C: Great. Could you press it and tell me what happens?
        M: Wow, it's connected! I probably pressed it by accident on Friday.
        C: That happens a lot. Call me again if it stops working.
    pronunciation:
      title: Stress in compound nouns
      body: |
        Many tech words are **compound nouns** — two words together. In most compound nouns, the stress is on the **first** part: **PASS**word, **LAP**top, **KEY**board, **SCREEN**shot, **ER**ror message, **PHONE** charger.

        Getting the stress right makes these words much easier to understand on the phone. Listen and repeat.
      items: |
        password
        laptop
        keyboard
        screenshot
        error message
        phone charger
    culture:
      title: Helpdesk English
      body: |
        *Have you tried turning it off and on again?* is such a common question from tech support that it has become a joke in English-speaking offices. Technicians often say *Bear with me* (please wait a moment) while they check something, and *Can you see…?* or *What does it say on the screen?* to guide you.

        On the phone, it's completely normal to ask the technician to slow down: *Sorry, could you repeat that?* or *Could you spell that for me, please?*
    mistakes: |
      He asked me what did I want. => He asked me what I wanted. | Reported questions use statement word order and no did.
      She asked me did I restart the laptop. => She asked me if I had restarted the laptop. | Use if or whether for reported yes/no questions.
      He told me don't click the link. => He told me not to click the link. | Reported negative instructions: tell someone not to + base form.
    task:
      title: Report the problem
      mode: writing
      body: |
        Think of a real tech problem you have had (or invent one). Write an email (80–100 words) to a colleague or friend explaining what went wrong, what the technician or support chat **asked** you, what they **told** you to do, and whether it worked. Use at least two reported questions and two reported instructions.
    exercises: |
      rw: Report the question, starting with "The technician asked me" :: "Where are you calling from?" || The technician asked me where I was calling from. || Statement word order (I was calling); present continuous → past continuous. || @tags en.reported-speech,en.questions
      rw: Report the question, starting with "She asked me" :: "Have you backed up your files?" || She asked me if I had backed up my files. | She asked me whether I had backed up my files. | She asked me if I'd backed up my files. | She asked me whether I'd backed up my files. || Yes/no question: if/whether; present perfect → past perfect. || @tags en.reported-speech,en.past-perfect
      rw: Report the request, starting with "He asked me" :: "Could you send me a screenshot?" || He asked me to send him a screenshot. || Request: ask + person + to + base form; me → him. || @tags en.reported-speech,en.requests
      rw: Report the instruction, starting with "She told me" :: "Don't install any new apps." || She told me not to install any new apps. || Negative instruction: tell + person + not to + base form. || @tags en.reported-speech
      mc: Choose the correct reported question. || He asked me what was my password. | *He asked me what my password was. | He asked me what is my password? || Reported questions use statement word order (my password was) and no question mark. || @tags en.reported-speech,en.questions
      fill: Connor asked Mei ___ she had tried restarting her laptop. || if / whether || Reported yes/no questions use if or whether. || @tags en.reported-speech
      mc: "When did the screen freeze?" → She asked me when the screen ___. || freezes | *had frozen | did freeze || Past simple → past perfect, with statement word order and no did. || @tags en.reported-speech,en.past-perfect
      tf: Mei's phone couldn't connect to the Wi-Fi either. || false || "My phone connects fine, but the laptop says 'No networks found.'" || @ctx dialogue
      short: What message did Mei's laptop show? || kw: no networks/no network || The laptop said "No networks found." || @ctx dialogue
      listen: @dialogue || What solved the problem? || *Pressing the Wi-Fi key | Restarting the laptop | Installing an update || Connor asked Mei to press the key with the antenna symbol, and the laptop connected. || @tags en.listening
      listen: The technician asked me if I'd backed up my files. I told him I hadn't, so he told me to do it before he reset the laptop. || What did the technician tell the speaker to do? || *Back up their files | Buy a new laptop | Change their password || "He told me to do it" — to back up the files — before he reset the laptop. || @tags en.listening,en.reported-speech
      dict: She asked me to restart the computer and wait five minutes. || ask + person + to
      ask: Your laptop has frozen just before an important video call. Call a friend who is good with computers: explain the problem and ask them two questions. || kw: frozen/froze/freeze/crashed/won't/doesn't/isn't working & should/can/could/do you/what/how || Hi, it's me. My laptop has frozen and I have a video call in ten minutes! Nothing happens when I press the keys. What should I do? Can I just turn it off, or will I lose my files?
      write: Write an email (60–80 words) to your manager about a tech problem. Report what IT support asked you and what they told you to do. || min=50 || req: asked/told | if/whether/to || Dear Ms. Grant, my laptop crashed three times this morning, so I called IT support. The technician asked me when the problem had started and whether I had installed anything new. He told me to back up my files and asked me to bring the laptop to his office this afternoon. I'm using a colleague's computer until then. Best regards, Paulo
