unit: 5
title: Where we live
theme: City and environment
description: Compare life in the city and the countryside with the present simple passive, talk about green habits and the history of things with the past simple passive, and propose solutions to local problems with the first conditional.
objectives:
  - Describe places, services and processes with the present simple passive
  - Talk about green habits and the history of objects and places with the past simple passive
  - Propose solutions and discuss their results with if, unless, as long as, as soon as and when
canDo:
  - I can compare living in a city and in the countryside, giving reasons.
  - I can describe how things are done in my town and where products come from.
  - I can talk about my green habits and explain when and how something was made or started.
  - I can propose a solution to a local problem and react to other people's ideas.
review: |
  fill: The village shop ___ (run) by volunteers, and it's closed on Sundays. || is run || Present simple passive: is + past participle (run). || @tags en.passive
  rw: Rewrite in the passive :: They collect our recycling every Thursday. || Our recycling is collected every Thursday. || The object (our recycling) becomes the subject; we don't need "by them". || @tags en.passive
  fill: The bridge ___ (build) in 1932 and ___ (repair) last year. || was built ; was repaired || Past simple passive: was + past participle. || @tags en.passive
  mc: "This sweater ___ by my grandmother." || *was knitted | knitted | is knitting || The sweater didn't do the action, so use the passive: was knitted. || @tags en.passive
  rw: Make a question in the past passive :: the photo / take / where || Where was the photo taken? || Question word + was + subject + past participle. || @tags en.passive,en.questions
  mc: "We won't finish the park on time ___ we get more volunteers." || if | *unless | as long as || Unless = if not: we won't finish if we don't get more volunteers. || @tags en.conditionals
  fill: I'll send you the plans as soon as I ___ (get) home. || get || After as soon as, use the present simple for the future. || @tags en.conditionals
  mc: Which phrase introduces a proposal? || That's a fair point. | *I suggest we | Unfortunately, || I suggest (that) we + base form is used to propose an idea. || @tags en.suggestions
  listen: In our city, all food waste is collected separately and turned into energy. It's then used to heat several public swimming pools. || What is the energy from food waste used for? || *Heating swimming pools | Running buses | Lighting the streets || "It's then used to heat several public swimming pools." || @tags en.listening,en.passive
  listen: If the council agrees, the market will move to the main square in May. As long as the weather is good, it'll stay open until ten at night. || When will the market stay open until ten? || Every day from May | *When the weather is good | Only on Saturdays || "As long as the weather is good" means only if the weather is good. || @tags en.listening,en.conditionals
  ask: Propose one change that would make your street or neighborhood greener, and say what will happen if people do it. || kw: suggest/how about/why don't we/we could/what about/should & if/unless/as long as/as soon as/will || I suggest we plant trees along our street. If we plant them this year, the street will be cooler in a few summers, and there'll be more birds.
  write: Write a short post (70–90 words) for your neighborhood website describing a local place — what it is used for, when it was built or started, and one problem you would like to solve. || min=60 || req: is/are | was/were | if/unless/as long as/as soon as || The Green Street community center was built in 1975, and it was renovated last year. Today it is used for yoga classes, a homework club and a market on Saturdays. The café is run by volunteers, and all the cakes are made locally. The only problem is the parking lot, which is always full. I suggest we ask the council for bike racks. If more people cycle, there will be space for everyone.
lessons:
  - title: City or countryside?
    summary: Read a blog about moving from a big city to a small village, compare the two ways of life, and describe places and services with the present simple passive.
    minutes: 45
    skills: [reading, grammar, speaking]
    tags: [en.passive, en.reading, en.schwa]
    objectives:
      - Form and use the present simple passive (am/is/are + past participle)
      - Decide when to include by + the doer
      - Compare the advantages and disadvantages of city and country life
    intro: |
      City or countryside? Many people dream of a quiet life surrounded by fields — until they find out that the bus comes four times a day. In this lesson you will read a blog post by someone who made the move, compare the two lifestyles, and learn the **present simple passive** to describe how things are done in a place: *The shop **is run** by volunteers.*
    vocab: |
      surrounded by | with something all around | adj | The village is surrounded by forests and farms. | -
      countryside | land outside towns and cities, with fields, farms and forests | n | We often go walking in the countryside on Sundays. | - | n: Uncountable, usually with the: the countryside.
      commute | to travel regularly between home and work or school | v | I commute two hours a day by train. | - | n: Also a noun: a long commute.
      rent | the money you pay every month to live in a place you don't own | n | The rent downtown is very high. | - | c: pay the rent; high rent
      crowded | full of people | adj | The subway is always crowded at rush hour. | -
      peaceful | quiet and calm | adj | The garden is very peaceful in the early morning. | -
      isolated | far from other places, people or services | adj | Their farmhouse is quite isolated — the nearest store is a long drive away. | -
      run | to manage or organize a business, service or activity | v | The café is run by two sisters. | - | n: Irregular: run – ran – run.
      facilities | buildings, equipment or services for a particular purpose | n | The town has excellent sports facilities. | - | n: Usually plural.
      public transportation | buses, trains and subways that everyone can use | n | Public transportation here is cheap and frequent. | - | n: British English: public transport.
      nightlife | places to go and things to do in the evening, like bars, clubs and concerts | n | The city has amazing nightlife. | -
      get around | to travel from place to place | phr v | It's easy to get around by bike in this town. | -
    grammar:
      title: "The passive: present simple"
      body: |
        Form the **present simple passive** with **am / is / are + past participle**. The object of an active sentence becomes the subject of the passive sentence:
        *Volunteers **run** the shop.* → *The shop **is run** by volunteers.*

        We use the passive when the action, or the thing it affects, is more important than **who** does it — or when we don't know or don't care who does it. It is very common when we describe places, services, processes and rules: *Breakfast **is served** from seven to ten. Our waste **is collected** every two weeks.*

        Add **by + the doer** only when it is important or interesting: *Most of the vegetables **are grown by local farmers**.* If *by people* or *by them* tells us nothing, leave it out: *English **is spoken** here.*

        Negatives use **isn't / aren't**; questions start with **Is / Are**: *Is bread delivered on Sundays?* Verbs without an object, like *happen*, *arrive* or *live*, can't be passive.
      table: |
        Active | Passive
        Volunteers run the shop. | The shop is run by volunteers.
        They collect our waste every two weeks. | Our waste is collected every two weeks.
        Farmers grow most of the vegetables nearby. | Most of the vegetables are grown nearby.
        Do they deliver bread here? | Is bread delivered here?
        They don't allow dogs in the café. | Dogs aren't allowed in the café.
      examples: |
        The village is surrounded by hills. | | is + past participle
        The village hall is used for yoga, films and a monthly market. | | describing a place
        Bread is delivered twice a week from the next town. | | the doer is not important
        Are the buses replaced by anything on Sundays? | | question
      tip: "If \"by someone\", \"by people\" or \"by them\" tells the listener nothing new, leave it out."
    reading:
      title: From the city to the hills
      text: |
        Two years ago, my partner Dev and I left our tiny apartment in Manchester and moved to a village in the hills of north Wales. Our friends thought we were crazy. Here's what we've learned so far.

        The village is small — about four hundred people live here — and it is surrounded by farms and forests. Life is slower. The only shop is run by volunteers, and it's closed on Sundays. Bread is delivered from a bakery in the next town twice a week, and most of the vegetables in the shop are grown on farms nearby.

        Getting around is the hardest part. There are only four buses a day, so most journeys here are made by car, which isn't very green. Our waste is collected just once every two weeks, so we've learned to recycle and compost almost everything.

        What do we miss? Movie theaters, late-night food and being able to walk everywhere. What don't we miss? The noise, the traffic and paying half our salaries in rent. Here, the air is clean, you can see the stars at night, and everyone says hello in the street.

        The village hall is used for everything: yoga on Mondays, a film club on Fridays and a market once a month. People often ask us if we feel lonely. Honestly? Sometimes, especially in winter. But the community is warm, and new people are always invited to the Friday film club.

        Will we stay forever? We don't know. But for now, the hills feel like home.
    pronunciation:
      title: "Weak is and are in passive sentences"
      body: |
        In passive sentences, **is** and **are** are usually unstressed. *Is* often becomes a short **z** sound joined to the word before: *The shop's run by volunteers.* *Are* becomes a quick schwa: *Vegetables ə grown nearby.*

        The stress goes on the past participle and the important nouns: *The SHOP is RUN by VOLunteers.* Listen and repeat.
      items: |
        The shop is run by volunteers.
        Bread is delivered twice a week.
        The village is surrounded by farms.
        Most vegetables are grown nearby.
        Dogs aren't allowed in the café.
    culture:
      title: Leaving the big city
      body: |
        Since working from home became more common, some people in the UK, the US and Canada have moved from big cities to smaller towns and villages, where houses are cheaper and there's more space. Others choose the **suburbs** — residential areas on the edge of a city — to have a yard and still be close to work.

        In many British villages, the **village hall** and the **pub** are the center of community life, hosting everything from quiz nights to birthday parties and local meetings.
    mistakes: |
      The shop is runned by volunteers. => The shop is run by volunteers. | Run is irregular: run – ran – run.
      The bread delivered every morning. => The bread is delivered every morning. | The present passive needs is/are + past participle.
      English is spoken by people in Canada. => English is spoken in Canada. | Leave out by + doer when it tells us nothing new.
    task:
      title: City or countryside?
      mode: speaking
      body: |
        Prepare a one-minute comparison of life in a big city and in the countryside. Give two advantages and two disadvantages of each, and say which you prefer and why. Use at least three present passive verbs (*is run, are grown, is used, is collected*). Then discuss the question with the AI coach in the "Expressing an opinion" scenario.
    exercises: |
      mc: Who runs the village shop? || *Volunteers | Dev and the writer | A bakery in the next town || "The only shop is run by volunteers." The bread comes from a bakery in the next town. || @ctx reading @tags en.reading
      tf: There is a bus to town every hour. || false || "There are only four buses a day." || @ctx reading
      short: Name one thing the village hall is used for. || kw: yoga/film/market || "The village hall is used for everything: yoga on Mondays, a film club on Fridays and a market once a month." || @ctx reading
      fill: The village shop ___ (run) by volunteers. || is run || Present passive: is + past participle (run). || @tags en.passive
      fill: Most of our vegetables ___ (grow) on farms nearby. || are grown || Plural subject: are + past participle (grown). || @tags en.passive
      rw: Rewrite in the passive :: They collect our recycling every Monday. || Our recycling is collected every Monday. || We don't need "by them" because it tells us nothing new. || @tags en.passive
      rw: Make it negative :: Dogs are allowed in the park. || Dogs aren't allowed in the park. | Dogs are not allowed in the park. || Negative: aren't + past participle. || @tags en.passive
      mc: Choose the correct sentence. || This cheese is make in the mountains. | *This cheese is made in the mountains. | This cheese made in the mountains. || Present passive: is + past participle (made). || @tags en.passive
      mc: Which is the most natural sentence? || Rice is grown by people in this region. | *Rice is grown in this region. | People are grown rice in this region. || By people tells us nothing new, so leave it out. The third sentence is not correct. || @tags en.passive
      listen: In my town, the streets are cleaned every night, and the buses are free for anyone over sixty-five. || Who can use the buses for free? || Children under twelve | *People over sixty-five | Everybody at night || "The buses are free for anyone over sixty-five." || @tags en.listening,en.passive
      dict: The village is surrounded by farms and forests. || present passive
      ask: A friend asks, "Do you prefer the city or the countryside?" Answer and give two reasons. || kw: prefer/like/love/rather/better & because/as/since || I prefer the city because I don't have a car, and public transportation is excellent. I also love the nightlife — there's always a concert or a new restaurant to try.
      write: Describe your town or neighborhood for a visitors' website (60–80 words). Use the present passive at least twice. || min=50 || req: is/are | made/built/used/run/known/grown/held/served/surrounded/visited/found/called/sold || My hometown, Aveiro, is known as the "Venice of Portugal" because it is surrounded by canals. Colorful boats called moliceiros are used to take tourists around the town. Sweet eggs and sugar are used to make the local dessert, ovos moles, which is sold in almost every café. A big fish market is held near the canal every morning. It's small, but it's beautiful.

  - title: Green habits
    summary: Talk about recycling, repairing and reusing things, and tell the history of objects and places with the past simple passive.
    minutes: 45
    skills: [grammar, listening, vocabulary]
    tags: [en.passive, en.phrasal-verbs, en.pronunciation]
    objectives:
      - Form and use the past simple passive (was/were + past participle)
      - Ask passive questions (When was it built?) and use passive phrasal verbs
      - Describe green habits and their benefits
    intro: |
      Every day we decide what to throw away, what to recycle and what to repair. In this lesson you will visit a repair café, learn vocabulary for green habits, and use the **past simple passive** to tell the story of things: when they **were made**, who they **were given** by, and how they **were saved** from the trash.
    vocab: |
      recycle | to treat used things so that their materials can be used again | v | We recycle all our glass and paper. | - | n: The noun is recycling.
      throw away | to put something in the trash because you don't want it | phr v | Don't throw that box away — I can use it. | - | n: Past participle: thrown away.
      repair | to fix something that is broken | v | My neighbor repairs old radios as a hobby. | - | n: Also a noun: The repairs took a week.
      donate | to give something to help a person or an organization | v | She donated her old laptop to a school. | -
      reuse | to use something again | v | I reuse glass jars to store rice and pasta. | -
      waste | things that people no longer want or need | n | We produce far too much food waste. | - | c: food waste; plastic waste | n: Also a verb: Don't waste water.
      single-use | made to be used once and then thrown away | adj | The city has banned single-use plastic bags. | -
      secondhand | already owned or used by someone else | adj | Most of my furniture is secondhand. | - | n: Also written second-hand.
      carbon footprint | the amount of carbon dioxide that your activities produce | n | Flying less can reduce your carbon footprint. | -
      compost | to turn food and garden waste into soil | v | We compost our vegetable peelings. | -
      environmentally friendly | not harmful to the environment | adj | Cycling is an environmentally friendly way to get to work. | - | n: Also: eco-friendly.
      set up | to start a business, group or organization | phr v | My aunt set up a community garden in 2020. | - | n: Irregular: set – set – set.
    grammar:
      title: "The passive: past simple"
      body: |
        Form the **past simple passive** with **was / were + past participle**: *My lamp **was made** in the 1980s. The tools **were donated** by local people.*

        We use it to talk about the history of objects, buildings and organizations (*The bridge was built in 1932*), in news stories (*Three hikers were rescued yesterday*), and whenever the doer is unknown or not important.

        - Add **by + doer** when it is new or important information: *The café **was set up by a group of neighbors**.*
        - Questions: *When **was** the café **started**? **Were** the tools **donated**?*
        - Negatives: *It **wasn't thrown** away.*
        - **Phrasal verbs keep their particle** in the passive: *They threw it away* → *It **was thrown away**.*
      table: |
        Active (past) | Passive (past)
        Neighbors set up the café in 2019. | The café was set up by neighbors in 2019.
        People donated the tools. | The tools were donated.
        Someone damaged the wire. | The wire was damaged.
        When did they build the bridge? | When was the bridge built?
        They didn't throw it away. | It wasn't thrown away.
      examples: |
        This table was made from an old door. | | was + past participle
        Over six hundred things were repaired here last year. | | plural: were
        The garden was created by students from the local school. | | by + doer: new information
        Where was this photo taken? | | question
      tip: "Keep the particle of phrasal verbs in the passive: They threw it away → It was thrown away."
    dialogue:
      title: The repair café
      setting: A Saturday morning at a repair café in a public library in Ottawa, Canada. Beatriz has brought an old lamp. Walter, a retired electrician, volunteers there.
      speakers: B=Beatriz/f; W=Walter/m
      lines: |
        B: Hi. Is this the repair café? My lamp stopped working last week.
        W: Welcome! Yes, take a seat. Did you buy it recently?
        B: No, it was given to me by my grandmother. It's about forty years old.
        W: They don't make them like this anymore. Let's have a look.
        B: This place is amazing. When was the repair café started?
        W: It was set up in 2019 by a small group of neighbors.
        B: And were all these tools donated by local people?
        W: Most of them, yes. Last year over six hundred things were repaired here.
        B: Six hundred! So that's six hundred things that weren't thrown away.
        W: Exactly. Ah, here's the problem — the wire inside was damaged.
        B: Can you fix it? I'd hate to throw it away.
        W: Of course. Give me ten minutes, and it'll be as good as new.
    pronunciation:
      title: "Past participles: done, thrown, broken"
      body: |
        Many irregular past participles contain one of two vowel sounds. Some have the short sound in *cup*: **done, run, won, come**. Others have the long sound in *go*: **thrown, broken, chosen, stolen, spoken**.

        In passive sentences, the participle carries the stress, while *was* and *were* stay weak: *It was THROWN aWAY.* Listen and repeat.
      items: |
        It was done.
        It was thrown away.
        It was broken.
        My bike was stolen.
        It was run by volunteers.
    culture:
      title: Repair cafés and secondhand shopping
      body: |
        The first repair café opened in Amsterdam in 2009. Today there are thousands around the world, where volunteers fix clothes, bikes, toys and electronics for free while people chat over coffee.

        Secondhand shopping is also popular. In the US and Canada, people buy used clothes and furniture at **thrift stores** and **yard sales**; in the UK and Ireland, **charity shops** sell donated items to raise money for good causes.
    mistakes: |
      The café was setted up in 2019. => The café was set up in 2019. | Set is irregular: set – set – set.
      This lamp was gave to me by my grandmother. => This lamp was given to me by my grandmother. | The passive uses the past participle (given), not the past simple (gave).
      When was built the bridge? => When was the bridge built? | Passive questions: question word + was/were + subject + past participle.
    task:
      title: The story of an object
      mode: speaking
      body: |
        Choose an object that is special to you — a piece of furniture, a bike, a piece of jewelry, a gift. Tell its story in one minute: where and when it was made, how it was bought or who it was given by, and whether it was ever repaired. Use at least four past passive verbs. Then tell a friend one green habit you'd like to start this month.
    exercises: |
      fill: The repair café ___ (set up) in 2019. || was set up || Past passive of a phrasal verb: was + set up. || @tags en.passive,en.phrasal-verbs
      fill: Over six hundred things ___ (repair) here last year. || were repaired || Plural subject: were + past participle. || @tags en.passive
      rw: Rewrite in the passive :: Someone stole my bike last night. || My bike was stolen last night. || We don't know who did it, so we leave out the doer. || @tags en.passive
      rw: Rewrite in the passive, keeping the doer :: A local artist painted this mural. || This mural was painted by a local artist. || By + doer, because the artist is important information. || @tags en.passive
      rw: Make a question in the past passive :: the bridge / build / when || When was the bridge built? || Question word + was + subject + past participle. || @tags en.passive,en.questions
      mc: "This old radio ___ in Germany in the 1960s." || *was made | made | is making || The radio didn't make anything: it was made. || @tags en.passive
      match: Repair your old lamp = It isn't thrown away. ; Buy secondhand clothes = Fewer new clothes are produced. ; Cycle to work = Less fuel is burned. ; Compost your vegetable peelings = They're turned into soil. ; Refill your water bottle = No plastic bottle is bought. || Each green habit is matched with its result. || @hint Match each green habit with its result. @tags en.passive @skill vocabulary
      tf: Beatriz's lamp was a gift from her grandmother. || true || "It was given to me by my grandmother." || @ctx dialogue
      short: In what year was the repair café started? || kw: 2019 || "It was set up in 2019 by a small group of neighbors." || @ctx dialogue
      listen: @dialogue || What was wrong with the lamp? || *A wire inside was damaged. | The bulb was broken. | It was too old to repair. || "Here's the problem — the wire inside was damaged." || @tags en.listening
      listen: Our community garden was created on an old parking lot. All the vegetables are given to the food bank every Friday. || What was the garden before? || A park | *A parking lot | A school playground || "Our community garden was created on an old parking lot." || @tags en.listening,en.passive
      dict: The tools were donated by people in the neighborhood. || past passive + by
      ask: Tell a friend about one green habit you have and one you would like to start. || kw: recycle/reuse/repair/compost/secondhand/bike/cycle/walk/bottle/bag & want to/would like to/'d like to/going to/plan to/hope to || I always take my own bag when I go shopping. I'd like to start composting, but I need to find a small compost bin for my balcony.
      write: Write the story of an object you own (60–80 words) — where it was made, how it was bought or who it was given by, and what happened to it. Use the past passive at least three times. || min=50 || req: was/were | made/given/bought/built/found/repaired/painted/sent/designed || My favorite chair was made in Denmark in the 1960s. It was bought by my grandparents when they got married. When they moved to a smaller apartment, it was given to my mother, and then to me. Last year one of the legs was broken by my dog, but it was repaired at a repair café for free. Now it's as good as new.

  - title: Proposing solutions
    summary: Discuss local problems, propose solutions and talk about their results with the first conditional and unless, as long as, as soon as and when.
    minutes: 45
    skills: [speaking, grammar, listening]
    tags: [en.conditionals, en.suggestions, en.pronunciation]
    objectives:
      - Use the first conditional with if, unless, as long as, as soon as and when
      - Propose ideas (I suggest we…, How about…?, We could…) and respond to them
      - Discuss the benefits and problems of a plan
    intro: |
      Traffic, noise, litter, no green spaces — every town has problems, and the people who live there often have the best ideas to solve them. In this lesson you will follow a community meeting, learn to **propose** solutions politely, and use the **first conditional** with *unless*, *as long as*, *as soon as* and *when* to explain what will happen.
    vocab: |
      propose | to suggest a plan or idea for people to discuss | v | I'd like to propose a new bike lane on Main Street. | - | n: The noun is proposal.
      solution | a way of solving a problem | n | We need a solution that works for everyone. | - | c: find a solution; a long-term solution
      council | the group of elected people who run a town or city | n | The city council is responsible for parks and roads. | - | c: city council; local council
      traffic | the cars, buses and trucks on the road | n | There's always heavy traffic at rush hour. | - | c: heavy traffic; a traffic jam
      pedestrian | a person who is walking, not driving | n | This street is only for pedestrians on weekends. | -
      bike lane | a part of a road that only bicycles can use | n | The new bike lane goes all the way to the station. | - | n: British English: cycle lane.
      trial | a test of something for a short time, to see if it works | n | The city is running a six-month trial of free buses. | - | c: a trial period; run a trial
      vote | to make an official choice, for example by raising your hand | v | We'll vote on the proposal next month. | - | c: vote for; vote against
      pollution | damage to air, water or land caused by harmful substances | n | Air pollution is worst near busy roads. | - | c: air pollution; noise pollution
      volunteer | someone who does work without being paid | n | The walking bus is run by parent volunteers. | -
      That's a fair point. | a phrase that accepts that someone's argument is reasonable | expr | "Stores need customers who drive." — "That's a fair point." | -
      benefit | an advantage or good result | n | One benefit of the plan is cleaner air. | - | n: Also a verb: The plan will benefit everyone.
    grammar:
      title: "First conditional: if, unless, as long as, as soon as, when"
      body: |
        You know the **first conditional**: *if* + present simple, *will* + base form, for a possible future situation and its result: *If we plant trees, the street **will be** cooler.* Other words can introduce the condition:

        - **unless** = if… not: *Customers **won't come unless** they can park* (= if they can't park).
        - **as long as** = only if: *It'll work **as long as** we have enough volunteers.*
        - **as soon as** = immediately when: *We'll start **as soon as** the council agrees.*
        - **when** — for something we are **sure** will happen. Compare: *I'll ask them **when** I see them* (I'm sure I'll see them) and *I'll ask them **if** I see them* (maybe I won't).

        After all these words, use the **present simple**, not will: *as soon as it **arrives*** (not ~~will arrive~~). The condition can come first (with a comma) or second.

        To **propose** an idea: *I suggest (that) we + base form*, *How about + -ing?*, *Why don't we…?*, *We could…*
      table: |
        Word | Meaning | Example
        if | a possible condition | If we close the street, it will be safer.
        unless | if not | We won't solve it unless we work together.
        as long as | only if | It'll work as long as people use it.
        as soon as | immediately when | We'll start as soon as we get the money.
        when | sure to happen | I'll call you when I get home.
      examples: |
        If we don't do something soon, a child will get hurt. | | if + negative
        Unless the buses are cheaper, people won't use them. | | unless = if not
        The trial will continue as long as it reduces traffic. | | as long as = only if
        I suggest we start a walking bus. How about asking the parents first? | | proposals
      tip: "Never use will after if, unless, as long as, as soon as or when in these sentences: If it rains tomorrow… (not If it will rain)."
    dialogue:
      title: Traffic outside the school
      setting: A community meeting in the hall of a primary school in Hamilton, Ontario. Carmen is leading the meeting. Pete, a parent, and Yasmin, who owns a shop on the street, are discussing the traffic.
      speakers: C=Carmen/f; P=Pete/m; Y=Yasmin/f
      lines: |
        C: OK, everyone, let's begin. Tonight's topic is the traffic outside the school.
        P: It's dangerous. If we don't do something soon, a child will get hurt.
        Y: I agree, but what exactly do you suggest?
        P: I suggest we close the street to cars from eight to nine.
        Y: My customers won't come unless they can park near the shop.
        C: That's a fair point. Is there a solution that works for everyone?
        Y: How about a walking bus? Volunteers walk groups of kids to school.
        P: I love that idea. As long as we have enough volunteers, it'll work.
        C: We could start a trial as soon as the council agrees.
        Y: And if fewer parents drive, there'll be more parking for my customers!
        P: Exactly. I'll ask the other parents when I see them on Monday.
        C: Great. I'll write to the council tomorrow, and we'll vote next month.
    pronunciation:
      title: "Contracted will: it'll, there'll, we'll"
      body: |
        In the result part of a conditional, **will** is usually contracted: *it'll* ("IT-əl"), *there'll* ("THAIR-əl"), *we'll*, *they'll*. **Won't** rhymes with *don't* — be careful not to say *want*.

        In sentences with *unless* or *as long as*, pause slightly at the comma: *As long as we have volunteers, | it'll work.* Listen and repeat.
      items: |
        It'll work.
        There'll be more parking.
        We'll vote next month.
        They won't come.
        As long as we have volunteers, it'll work.
    culture:
      title: Getting involved locally
      body: |
        In the US, Canada and the UK, residents can usually attend **council meetings** or **town hall meetings**, sign **petitions**, and write to their local representative about problems like traffic, parks or trash collection. Many changes — a new crosswalk, a bike lane, a weekend market — start with a small group of neighbors.

        A **walking bus** is a group of children who walk to school together with adult volunteers, following a fixed route with "stops" — just like a bus. Schools in several countries use them to reduce traffic and keep children active.
    mistakes: |
      If we will plant more trees, the street will be cooler. => If we plant more trees, the street will be cooler. | Use the present simple after if.
      Unless we don't act now, it will be too late. => Unless we act now, it will be too late. | Unless already means if not, so don't add another not.
      I suggest to close the street. => I suggest closing the street. | Suggest is followed by -ing or a that-clause (I suggest we close…), not to + infinitive.
    task:
      title: Your proposal
      mode: interaction
      body: |
        Choose a problem in your town or neighborhood (traffic, noise, litter, no places for teenagers…). Prepare a one-minute proposal: describe the problem, suggest a solution and explain its results with *if, unless, as long as* and *as soon as*. A partner plays a neighbor who disagrees; answer their objections politely (*That's a fair point, but…*). Then present your idea to the AI coach in the "Expressing an opinion" scenario.
    exercises: |
      fill: If we ___ (plant) more trees, the street ___ (be) cooler in summer. || plant ; will be / 'll be || First conditional: if + present simple, will + base form. || @tags en.conditionals
      mc: "The plan won't work ___ enough people volunteer." || if | *unless | as soon as || Unless = if not: the plan won't work if people don't volunteer. || @tags en.conditionals
      fill: We'll start the trial as soon as the council ___ (agree). || agrees || After as soon as, use the present simple (he/she/it + -s). || @tags en.conditionals
      rw: Rewrite with "unless" :: If we don't reduce traffic, pollution will get worse. || Unless we reduce traffic, pollution will get worse. | Pollution will get worse unless we reduce traffic. || Unless replaces if… not, so the verb becomes positive. || @tags en.conditionals
      rw: Rewrite with "as long as" :: The walking bus will work only if parents help. || The walking bus will work as long as parents help. | As long as parents help, the walking bus will work. || As long as = only if. || @tags en.conditionals
      mc: Which sentence is a proposal? || *I suggest we close the street from eight to nine. | The street is closed from eight to nine. | Was the street closed from eight to nine? || I suggest (that) we + base form proposes an idea. || @tags en.suggestions
      fill: How about ___ (start) a walking bus? || starting || How about + -ing? || @tags en.suggestions,en.gerund-infinitive
      mc: "I'll call you ___ I get to the station — my train arrives at six." || if | *when | unless || The speaker is sure they will get to the station, so use when. || @tags en.conditionals
      tf: Yasmin is worried about her customers. || true || "My customers won't come unless they can park near the shop." || @ctx dialogue
      short: Who is going to write to the council? || kw: Carmen || Carmen says, "I'll write to the council tomorrow." || @ctx dialogue
      listen: @dialogue || What will happen next month? || *They will vote on the plan. | The street will close. | The walking bus will stop. || "We'll vote next month." || @tags en.listening
      listen: The new bike lane will open as soon as the work is finished, probably in June. Unless there's a lot of rain, it'll be ready on time. || When will the bike lane probably open? || *In June | In July | Next week || "As soon as the work is finished, probably in June." || @tags en.listening,en.conditionals
      dict: Unless we work together, nothing will change. || unless = if not
      ask: Propose a solution to a problem in your town (traffic, noise, litter…) and say what will happen if people accept it. || kw: suggest/how about/why don't we/we could/what about & if/unless/as long as/as soon as/when || There's too much litter in our park. I suggest we put more trash cans near the playground. If we do that, the park will be cleaner, as long as people use them!
      write: Write a short email (70–90 words) to your local council proposing a solution to a problem in your area. Explain the results with at least two conditional sentences. || min=60 || req: suggest/propose/how about/we could | if/unless/as long as/as soon as | will/'ll/won't || Dear Council Members, I am writing about the dangerous crossing on Elm Road. Cars drive very fast there, and many children cross it on their way to school. I suggest adding a pedestrian crossing with lights. If you install it this summer, it will be ready for the new school year. Unless something is done soon, I'm afraid someone will get hurt. Kind regards, Daniel Osei
