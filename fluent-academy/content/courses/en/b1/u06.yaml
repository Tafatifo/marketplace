unit: 6
title: Body and mind
theme: Health and lifestyle
description: Talk about stress and wellbeing, food culture, and sport and fitness, using defining relative clauses to say exactly which person, thing or place you mean — with who, which, that, where and whose, and without a pronoun.
objectives:
  - Use defining relative clauses with who, which and that to describe people and things precisely
  - Use where and whose, and leave out the relative pronoun when it is the object
  - Put prepositions at the end of relative clauses (the gym I go to) when talking about sport and fitness
canDo:
  - I can talk about stress and explain what helps me cope with it.
  - I can describe a dish, a market or a restaurant and the people connected with it.
  - I can talk about the sports and activities I do, where I do them and who I do them with.
  - I can define words and explain things clearly when I don't know the exact word.
review: |
  fill: A nutritionist is someone ___ gives advice about healthy eating. || who / that || Who or that for people, as the subject of the relative clause. || @tags en.relative-clauses
  mc: Choose the correct sentence. || I use an app what tracks my sleep. | *I use an app that tracks my sleep. | I use an app who tracks my sleep. || Use that or which for things. What is not a relative pronoun here, and who is for people. || @tags en.relative-clauses
  fill: That's the restaurant ___ we had our first date. || where || Use where for places (= in which). || @tags en.relative-clauses
  rw: Join the sentences with "whose" :: I have a friend. Her father is an Olympic swimmer. || I have a friend whose father is an Olympic swimmer. || Whose replaces her: whose father. || @tags en.relative-clauses
  rw: Join the sentences without a relative pronoun :: This is the recipe. My uncle gave it to me. || This is the recipe my uncle gave me. | This is the recipe my uncle gave to me. || The pronoun is the object (my uncle gave it), so you can leave it out — and don't repeat it. || @tags en.relative-clauses
  mc: Choose the correct sentence. || That's the gym where I go to. | *That's the gym I go to. | That's the gym which I go. || Use (that) + preposition at the end: the gym (that) I go to. Where … to is wrong, and go needs to. || @tags en.relative-clauses
  mc: In which sentence can you leave out the relative pronoun? || The woman who runs the café is from Lima. | *The cake that she made was delicious. | The man who lives upstairs is a chef. || You can leave out the pronoun when it is the object (she made the cake). When it's the subject (who runs, who lives), it must stay. || @tags en.relative-clauses
  listen: The thing that helps me most when I'm stressed is cooking. I put on some music and make a recipe that my mom taught me. || What helps the speaker when they're stressed? || Going for a run | *Cooking a family recipe | Talking to their mom on the phone || "The thing that helps me most… is cooking." || @tags en.listening,en.relative-clauses
  listen: The yoga studio I go to is above a bakery, so every class ends with the smell of fresh bread. The teacher, Ana, is someone who never stops smiling. || Where is the yoga studio? || Next to a park | *Above a bakery | Inside a gym || "The yoga studio I go to is above a bakery." || @tags en.listening,en.relative-clauses
  ask: Describe a person who has helped you live a healthier life — what they do and how they help you. || kw: who/that & help/helps/helped/taught/encourage/encourages || My cousin Leo is someone who has helped me a lot. He's a personal trainer, and he made me a plan that I can do at home in twenty minutes.
  write: Write a short paragraph (60–80 words) about a place where you go to relax or exercise. Use at least three relative clauses (who, which, that, where or whose). || min=50 || req: who/that/which | where/whose/that || There's a small park near my apartment where I go running every morning. The path that goes around the lake is exactly three kilometers. I often see an old man whose dog always runs next to me for a few meters. On Sundays there's a free yoga class which is taught by a volunteer. It's the place I go to when I need to switch off.
lessons:
  - title: Stress and wellbeing
    summary: Talk about stress, burnout and ways to relax, and describe people and things precisely with defining relative clauses (who, which, that).
    minutes: 45
    skills: [vocabulary, grammar, speaking]
    tags: [en.relative-clauses, en.health, en.th]
    objectives:
      - Use defining relative clauses with who, which and that
      - Describe people and things with phrases like "someone who…" and "something that…"
      - Talk about stress and the things that help you cope
    intro: |
      Deadlines, traffic, bills, noisy neighbors — stress is part of modern life, and talking about it is the first step to dealing with it. In this lesson you will learn words for stress and wellbeing, and use **defining relative clauses** to explain exactly what you mean: *I need **something that** helps me switch off. She's **the kind of person who** never takes a break.*
    vocab: |
      stressed (out) | feeling very worried and tense because of problems or work | adj | I'm completely stressed out about my exams. | - | n: Stressed out is informal.
      overwhelmed | feeling that you have too much to deal with | adj | I felt overwhelmed in my first month at the new job. | -
      burnout | extreme tiredness caused by working too hard for too long | n | She took three months off work because of burnout. | - | n: Adjective: burned out.
      switch off | to stop thinking about work or problems and relax | phr v | I find it hard to switch off after work. | -
      unwind | to relax after a period of work or stress | v | Reading helps me unwind before bed. | - | n: Past: unwound.
      cope (with) | to deal successfully with a difficult situation | v | How do you cope with stress at work? | -
      take a break | to stop working for a short time | expr | Let's take a ten-minute break. | -
      work-life balance | the right amount of time for your job and for your personal life | n | My new job has a much better work-life balance. | -
      wellbeing | the state of feeling healthy, comfortable and happy | n | Exercise is good for your mental wellbeing. | - | n: Also written well-being.
      breathe | to take air into your body and let it out again | v | Breathe in slowly through your nose. | - | n: The noun is breath, with a short e sound.
      mental health | the health of your mind and emotions | n | Talking to friends is good for your mental health. | -
      get enough sleep | to sleep for the number of hours your body needs | expr | If you don't get enough sleep, it's hard to concentrate. | -
    grammar:
      title: "Defining relative clauses: who, which, that"
      body: |
        A **defining relative clause** gives essential information about a noun: it tells us **which** person or thing we mean. Without it, the sentence is unclear or incomplete: *She's the colleague **who organized the yoga class**.*

        - Use **who** or **that** for **people**: *a friend who/that really listens*
        - Use **which** or **that** for **things** and animals: *an app which/that reminds me to drink water*
        - **That** is very common in conversation for both people and things.

        Defining relative clauses have **no commas**. The relative pronoun replaces *he, she, it* or *they*, so **don't repeat** them: *the app that reminds me* (not ~~the app that it reminds me~~).

        These phrases are very useful for describing people and things: *the kind of person who…, someone who…, something that…, anything that…*
      table: |
        Noun | Pronoun | Example
        a person | who / that | A therapist is someone who helps people with emotional problems.
        a thing | which / that | I need something that helps me sleep.
        an animal | which / that | Dogs are animals that need a lot of exercise.
        anything / something | that (not what) | Is there anything that helps you relax?
      examples: |
        I'm the kind of person who works through lunch. | | who for people
        I go to a class which starts at six, after work. | | which for things
        The teacher is a woman that used to be a lawyer. | | that for people (informal)
        Is there anything that helps you switch off? | | anything that
      tip: "If you're not sure, use that — it works for people and things in defining clauses. But never use what to mean that: the book that I read, not the book what I read."
    dialogue:
      title: Working through lunch
      setting: Lunchtime in the break room of an insurance office in Baltimore. Andrés notices that his colleague Ruby looks exhausted.
      speakers: A=Andrés/m; R=Ruby/f
      lines: |
        A: You look exhausted, Ruby. Is everything OK?
        R: Not really. I'm completely stressed out — I have three deadlines this week.
        A: I know the feeling. Do you take any breaks during the day?
        R: Not usually. I'm the kind of person who works through lunch.
        A: That's the worst thing you can do! Your brain needs a rest.
        R: I know. Is there anything that helps you switch off?
        A: I use an app that reminds me to stand up and breathe every hour.
        R: Really? And does it actually make a difference?
        A: It does. And I go to a yoga class which starts at six, after work.
        R: I've never done yoga. I'm not someone who can sit still for long.
        A: The teacher is a woman who used to be a lawyer, so she understands stress!
        R: OK, you've convinced me. Can I come with you on Thursday?
    pronunciation:
      title: "Breath and breathe: the two th sounds"
      body: |
        English has two **th** sounds. In **breath**, **think** and **health**, the th is soft and has no voice — just air between your tongue and teeth. In **breathe**, **this** and **that**, the th is voiced — your throat vibrates.

        Notice the vowels too: *breath* has a short e ("breth"), but *breathe* has a long ee ("breeth"). Listen and repeat.
      items: |
        breath
        breathe
        Take a deep breath.
        Breathe in slowly.
        mental health
        something that helps
    culture:
      title: Talking about mental health
      body: |
        In many English-speaking countries, people now talk more openly about stress and mental health than in the past. Many employers offer wellbeing programs, and some people take a **mental health day** — a day off work to rest when they feel overwhelmed.

        Still, the everyday question *How are you?* usually expects a short answer like *Fine, thanks* or *Not bad*. With close friends, it's fine to be honest: *To be honest, I'm a bit stressed at the moment.*
    mistakes: |
      She's the teacher which helped me. => She's the teacher who helped me. | Use who or that for people, not which.
      I use an app what reminds me to drink water. => I use an app that reminds me to drink water. | What is not used as a relative pronoun here. Use that or which.
      The man who he lives next door is a doctor. => The man who lives next door is a doctor. | Don't repeat the subject (he) after who.
    task:
      title: My stress busters
      mode: speaking
      body: |
        Prepare a one-minute talk about how you deal with stress. Describe three things — a person, a place and an activity — that help you, using relative clauses: *My sister is someone who…, There's a park near my house which…, Swimming is something that…*. Then tell the AI coach about a stressful day and what helped you in the "Talking about your day" scenario.
    exercises: |
      fill: A therapist is a person ___ helps people with emotional problems. || who / that || Use who or that for people. || @tags en.relative-clauses
      fill: I need an app ___ tells me when to take a break. || that / which || Use that or which for things. || @tags en.relative-clauses
      mc: Choose the correct sentence. || She's the colleague which organized the class. | *She's the colleague who organized the class. | She's the colleague what organized the class. || Who (or that) for people. Which is for things, and what can't be used here. || @tags en.relative-clauses
      mc: Choose the correct sentence. || The man who he teaches yoga is very calm. | *The man who teaches yoga is very calm. | The man teaches yoga who is very calm. || Who replaces he, so don't repeat the subject, and the clause goes straight after the noun. || @tags en.relative-clauses
      rw: Join the sentences with "who" :: I have a friend. She runs marathons. || I have a friend who runs marathons. | I have a friend that runs marathons. || Who replaces she. || @tags en.relative-clauses
      rw: Join the sentences with "which" or "that" :: This is the class. It starts at six. || This is the class which starts at six. | This is the class that starts at six. || Which/that replaces it. || @tags en.relative-clauses
      match: a pharmacist = a person who prepares and sells medicine ; a pillow = a thing that you put your head on in bed ; a gym = a place which has machines for exercise ; a counselor = a person who listens to your problems and gives advice ; an alarm clock = a thing that wakes you up || Each word is matched with a definition that uses a relative clause. || @hint Match each word with its definition. @tags en.relative-clauses @skill vocabulary
      tf: Ruby usually takes a long lunch break. || false || "I'm the kind of person who works through lunch." || @ctx dialogue
      short: What does Andrés's app remind him to do? || kw: stand/breathe || "An app that reminds me to stand up and breathe every hour." || @ctx dialogue
      listen: @dialogue || What did the yoga teacher do before? || *She was a lawyer. | She was a doctor. | She worked with Ruby. || "The teacher is a woman who used to be a lawyer." || @tags en.listening
      listen: The thing that helps me most is a walk at lunchtime. I go with a colleague who has the same problem with stress. || Who does the speaker walk with? || *A colleague | A doctor | Their dog || "I go with a colleague who has the same problem with stress." || @tags en.listening,en.relative-clauses
      dict: I'm not someone who can sit still for long. || someone who…
      ask: Describe something or someone that helps you cope with stress. || kw: who/that/which & help/helps/relax/calm/switch off/unwind || My best friend is someone who always makes me laugh. When I'm stressed, I call her, or I listen to music that relaxes me.
      write: Write a short post (60–80 words) for a student website with tips for people who feel stressed. Use at least three relative clauses. || min=50 || req: who/that/which || If you're someone who feels stressed before exams, here are three tips. First, find a place that is quiet and only use it for studying. Second, talk to a friend who understands, or to a counselor at the student center. Finally, do something that has nothing to do with studying every day — a walk, a game or a TV show which makes you laugh. And get enough sleep!

  - title: Food culture
    summary: Read about a busy city market and the people who cook there, and use where, whose and relative clauses without a pronoun to talk about food, places and people.
    minutes: 45
    skills: [reading, grammar, writing]
    tags: [en.relative-clauses, en.reading, en.pronunciation]
    objectives:
      - Use where for places and whose for possession
      - Leave out the relative pronoun when it is the object of the clause
      - Describe dishes, recipes and food traditions
    intro: |
      Food tells us stories about families, journeys and cities. In this lesson you will read about a covered market where cooks from many different backgrounds sell their food, and learn more ways to build relative clauses: **where** for places, **whose** for possession, and clauses with **no pronoun at all** — *the recipe she uses, the meals we remember*.
    vocab: |
      stall | a table or small shop in a market | n | Her stall sells fresh fruit and juice. | - | c: a market stall; a food stall
      recipe | a set of instructions for cooking a dish | n | Can you give me the recipe for this soup? | - | n: Three syllables: RES-ih-pee.
      dish | food prepared in a particular way as part of a meal | n | Jollof rice is a popular dish in West Africa. | - | c: a national dish; a main dish
      ingredient | one of the foods you use to make a dish | n | The secret ingredient is fresh ginger. | -
      homemade | made at home, not in a factory or a shop | adj | Nothing beats homemade bread. | -
      sell out | to sell all of something, so that there is none left | phr v | The rye bread usually sells out by eleven. | -
      spicy | with a strong, hot flavor | adj | This curry is too spicy for me. | - | n: Also: hot. The opposite is mild.
      taste | to have a particular flavor | v | The soup tastes of lemon and garlic. | - | n: Also a noun: a sweet taste.
      street food | food sold from stalls or trucks in the street | n | Street food is often cheap and delicious. | -
      vegetarian | a person who doesn't eat meat or fish | n | My brother has been a vegetarian for ten years. | - | n: Also an adjective: a vegetarian dish.
      portion | the amount of food for one person | n | The portions in this restaurant are huge. | -
      flavor | the taste of a food or drink | n | I love the smoky flavor of this sauce. | - | n: British spelling: flavour.
    grammar:
      title: "Relative clauses: where, whose, and no pronoun"
      body: |
        - Use **where** for **places**: *the market **where** I have lunch* (= the market in which I have lunch).
        - Use **whose** for **possession**. It replaces *his, her, its* or *their*: *a woman **whose** family came from Ghana* (= her family came from Ghana).

        **Leaving out the pronoun.** When *who, which* or *that* is the **object** of the relative clause — when it is followed by a new subject and a verb — you can leave it out. In conversation, people usually do: *the recipe **(that) she uses**, the people **(who) I met***.

        When the pronoun is the **subject** of the clause — followed directly by a verb — you **must** keep it: *the baker **who gets up** at three.*

        Compare: *the market **where** I shop* / *the market **(that)** I love* / *the market **(that)** I go **to***.
      table: |
        Pronoun | Use | Example
        where | places | This is the market where I buy my bread.
        whose | possession | She's the chef whose restaurant won a prize.
        (that / which / who) as object | can be left out | The dish (that) my dad makes is amazing.
        who / that / which as subject | must stay | I know a chef who works there.
      examples: |
        It's the place where I learned to love food. | | where for a place
        Next to her is a bakery whose bread sells out by eleven. | | whose for possession
        The recipe she uses is the one her grandmother taught her. | | no pronoun: object
        The meals we remember are usually the ones we share. | | no pronoun: object
      tip: "Look at what comes after the pronoun. If it's a new subject (I, she, my dad…), you can leave the pronoun out: the soup (that) I made."
    reading:
      title: Lunch at Halden Street Market
      text: |
        Every Saturday, I have lunch at Halden Street Market, an old covered market in the city where I grew up. It's the place where I learned that food is more than something you eat. It's a story.

        The first stall I always visit belongs to Amara, a woman whose family came from Ghana in the 1980s. She sells jollof rice, and the recipe she uses is the one her grandmother taught her. "People argue about jollof," she told me, laughing. "Every family thinks theirs is the best."

        Next to her is a Polish bakery whose rye bread sells out by eleven o'clock. The baker, Tomasz, gets up at three every morning. "The bread my customers love takes eighteen hours to make," he says. "You can't hurry it."

        Further along, there's a small counter where two brothers make Vietnamese sandwiches called bánh mì. The bread they use comes from Tomasz's bakery — a perfect example of how the market works. Everyone here buys from everyone else.

        What I love most is the long table in the middle of the market, where strangers sit together and share their food. Last week I sat next to a retired teacher whose son had just opened a taco stand, and a student who was trying jollof for the first time. We talked for an hour.

        In a world where many of us eat lunch alone at our desks, the market reminds me of something important: the meals we remember are usually the ones we share.
    pronunciation:
      title: Tricky food words
      body: |
        Some food words have fewer syllables than their spelling suggests. **Vegetable** usually has three: "VEJ-tə-bəl". **Chocolate** has two: "CHOK-lət". **Recipe** has three: "RES-ih-pee" (it doesn't rhyme with *ripe*).

        Others have silent letters: the **l** in **salmon** is silent ("SAM-ən"). And be careful with **dessert** (stress on the second syllable: dih-ZURT) — **desert** (DEZ-ərt) is a dry, sandy place! Listen and repeat.
      items: |
        vegetable
        chocolate
        recipe
        salmon
        dessert
        ingredient
    culture:
      title: Eating out
      body: |
        In the US and Canada, restaurant portions are often large, and it's completely normal to ask for a **box** to take your leftovers home. Tipping is expected in restaurants: usually 15 to 20 percent of the bill. In the UK and Ireland, tips of about 10 to 12.5 percent are common, and many restaurants add a service charge to the bill.

        In parts of northern England and Scotland, the evening meal is often called **tea**, while in other places it's **dinner** — so an invitation for tea at six may mean a full meal!
    mistakes: |
      This is the restaurant where I told you about. => This is the restaurant (that) I told you about. | Where already means "in which". When the preposition (about) is at the end, use that or no pronoun.
      She's the chef who her restaurant won a prize. => She's the chef whose restaurant won a prize. | Use whose for possession, not who + her.
      The cake that I made it was delicious. => The cake that I made was delicious. | Don't repeat the object (it) in the relative clause.
    task:
      title: A dish with a story
      mode: writing
      body: |
        Write 80–100 words about a dish that is important to you or your family. Say where you first ate it, who makes it best, what the ingredients are and when you eat it. Use **where**, **whose** and at least one relative clause without a pronoun (*the soup my father makes*). Then read it aloud to a friend and ask about a dish from their family.
    exercises: |
      mc: Where did Amara's family come from? || *Ghana | Poland | Vietnam || "Amara, a woman whose family came from Ghana in the 1980s." || @ctx reading @tags en.reading
      tf: Tomasz's bread is ready in less than an hour. || false || "The bread my customers love takes eighteen hours to make." || @ctx reading
      short: Where do the two brothers get the bread for their sandwiches? || kw: Tomasz/bakery/Polish || "The bread they use comes from Tomasz's bakery." || @ctx reading
      fill: This is the market ___ I buy my vegetables. || where || Use where for places. || @tags en.relative-clauses
      fill: Amara is the woman ___ jollof rice is famous in the market. || whose || Whose for possession: her jollof rice → whose jollof rice. || @tags en.relative-clauses
      mc: In which sentence can you leave out "that"? || The baker that gets up at three is Tomasz. | *The bread that Tomasz bakes sells out quickly. | The stall that sells jollof is in the corner. || Only when that is the object (Tomasz bakes the bread). When it's the subject (that gets up, that sells), it must stay. || @tags en.relative-clauses
      rw: Join the sentences with "whose" :: I met a chef. Her restaurant serves only vegetarian food. || I met a chef whose restaurant serves only vegetarian food. || Whose replaces her. || @tags en.relative-clauses
      rw: Join the sentences without a relative pronoun :: This is the soup. My grandmother used to make it. || This is the soup my grandmother used to make. || The pronoun is the object (she made it), so you can leave it out. Don't repeat it. || @tags en.relative-clauses
      mc: Choose the correct sentence. || That's the café where we met there. | *That's the café where we met. | That's the café which we met. || Where already means "in which", so don't add there. Which needs a preposition (which we met in). || @tags en.relative-clauses
      listen: The restaurant we went to last night is run by a couple whose daughter is a famous chef in Paris. || Who is famous? || The couple | *The couple's daughter | The waiter || "A couple whose daughter is a famous chef" — their daughter is the famous one. || @tags en.listening,en.relative-clauses
      dict: The meals we remember are the ones we share. || no relative pronoun
      ask: Describe a dish from your country or family — what's in it, who makes it and when you eat it. || kw: that/which/where/whose/who/made/makes & eat/cook/ingredients/with || The dish my family eats every New Year is a fish soup that my grandfather makes. It has potatoes, tomatoes and lots of garlic. We eat it at his house, where the whole family meets.
      write: Write a short review (60–80 words) of a market, café or restaurant you like. Use where, whose and at least one relative clause without a pronoun. || min=50 || req: where/whose | that/which/who/I/we || Café Ruta is a tiny place near the station where I have breakfast on Fridays. It's run by a couple whose son bakes all the bread. The pastries they sell are amazing, especially the cardamom buns. The coffee I always order is strong and cheap. It's the kind of café where people stay and talk for hours.

  - title: Sport and fitness
    summary: Talk about the sports and activities you do, where you do them and who you do them with, using relative clauses with prepositions at the end.
    minutes: 45
    skills: [speaking, grammar, listening]
    tags: [en.relative-clauses, en.phrasal-verbs, en.schwa]
    objectives:
      - Put prepositions at the end of relative clauses (the coach I train with)
      - Decide when the relative pronoun is necessary
      - Talk about getting fit, taking up a sport and avoiding injuries
    intro: |
      Some people love the gym, others prefer a team, a dance class or a long walk. In this lesson you will talk about sport and fitness, and practice a very natural feature of spoken English: relative clauses that end with a **preposition** — *the gym I go **to**, the people I play **with**, the club I belong **to***.
    vocab: |
      get in shape | to become fit and healthy | expr | I want to get in shape before the summer. | - | c: be in shape; be out of shape
      work out | to do physical exercise, especially at a gym | phr v | I work out three times a week. | - | n: The noun is a workout.
      warm up | to do gentle exercise to prepare your body for sport | phr v | Always warm up before you run. | -
      stretch | to make your arms, legs or body as long as possible | v | Stretch your legs after the game. | -
      injury | damage to the body, for example in an accident or while playing sport | n | She missed the season because of a knee injury. | - | n: Verb: injure; adjective: injured.
      take up | to start a new hobby or activity | phr v | I took up swimming last year. | -
      coach | a person who trains a sports team or player | n | Our coach is strict but very encouraging. | -
      equipment | the things you need for a particular activity | n | You don't need much equipment to start running. | - | n: Uncountable: not "equipments".
      session | a period of time spent doing a particular activity | n | Each training session lasts an hour. | -
      fit | healthy and strong, especially because of exercise | adj | My grandma is fitter than I am! | - | n: The noun is fitness.
      sore | painful, especially after exercise or because of an injury | adj | My legs are really sore after yesterday's run. | -
      membership | the right to belong to a club or group, usually paid for | n | A gym membership costs about forty dollars a month. | -
    grammar:
      title: "Relative clauses with prepositions"
      body: |
        Many verbs and adjectives go with a preposition: *go **to**, train **with**, belong **to**, talk **about**, be good **at***. In a relative clause, everyday English puts the preposition at the **end** of the clause, and usually **leaves out** the relative pronoun:

        - *I go to the gym.* → *the gym **(that) I go to***
        - *I train with the coach.* → *the coach **(who) I train with***
        - *You told me about the app.* → *the app **(that) you told me about***

        A very formal style puts the preposition before *which* or *whom* (*the club to which I belong*), but this is rare in conversation.

        **Where** already contains the idea of a preposition, so don't add one: *the pool **where** I swim* or *the pool **(that)** I swim **in*** — not ~~the pool where I swim in~~.

        Remember: if the pronoun is the **subject** of the clause, you must keep it: *the player **who won** the match.*
      table: |
        Full sentence | Relative clause
        I belong to a running club. | the running club I belong to
        I play tennis with these people. | the people I play tennis with
        You told me about an app. | the app you told me about
        I swim in this pool. | the pool I swim in / the pool where I swim
      examples: |
        Is this the gym you joined? | | no pronoun
        The coach I train with is really patient. | | preposition at the end
        The gym I pay for is just too boring. | | pay for
        There's a beginners' class that starts at seven. | | subject: that must stay
      tip: "Don't drop the preposition: the friend I go running with (not the friend I go running). It belongs to the verb."
    dialogue:
      title: Come along on Thursday
      setting: A Monday evening outside an indoor climbing gym in Christchurch, New Zealand. Hina is walking past when she sees her old friend Luca coming out.
      speakers: H=Hina/f; L=Luca/m
      lines: |
        H: Luca! I didn't know you came here. Is this the gym you joined?
        L: Yes, I've been coming for three months. It's the best decision I've made all year.
        H: What made you start climbing? You used to hate sports.
        L: My doctor told me I needed an activity I would actually enjoy.
        H: And this is it? Isn't it really hard on your arms?
        L: At first, yes. But the coach I train with is really patient.
        H: Is that the guy you were talking to at the front desk?
        L: That's him. He's the one who taught me how to fall safely.
        H: I really need to get in shape. The gym I pay for is just too boring.
        L: Come along on Thursday! There's a beginners' class that starts at seven.
        H: Do I need special shoes, or can I wear the ones I run in?
        L: They'll lend you shoes for your first session. Just bring water and a towel.
    pronunciation:
      title: "Strong prepositions at the end"
      body: |
        In the middle of a sentence, small words like **to**, **for**, **at** and **of** are usually weak, with a schwa: *I go tə the gym.* But when a preposition comes at the **end** of a clause or sentence, it uses its **strong** form: *the gym I go TO* ("too"), *the app you told me aBOUT*.

        So the same word can sound different depending on where it is. Listen and repeat.
      items: |
        the gym I go to
        the coach I train with
        the club I belong to
        Who are you talking to?
        What are you looking for?
    culture:
      title: Sport for everyone
      body: |
        In the US, school and college sports are a big part of life, and high school football or basketball games can attract the whole town. In the UK, Ireland, Australia and New Zealand, many people play for local clubs — soccer, rugby, cricket, netball — that welcome players of all ages and levels.

        Free community runs in parks on Saturday mornings have also become popular in many countries. Nobody cares how fast you are: walkers, runners and people with strollers all take part.
    mistakes: |
      This is the gym where I go to every day. => This is the gym I go to every day. | Where already includes the idea of "to". Use where with no preposition, or (that) + preposition at the end.
      He's the coach I train. => He's the coach I train with. | The verb is train with someone, so keep the preposition at the end.
      I need some new equipments. => I need some new equipment. | Equipment is uncountable.
    task:
      title: Try my sport
      mode: interaction
      body: |
        Persuade a friend to try a sport or activity you do (or would like to take up). Describe the place you go to, the people you do it with, the equipment you need and what you like about it, using at least three relative clauses. Then talk about your favorite sport with the AI coach in the "Discussing hobbies" scenario.
    exercises: |
      fill: That's the running club I belong ___. || to || Belong to: the preposition stays at the end of the clause. || @tags en.relative-clauses
      fill: The coach I train ___ used to be a professional climber. || with || Train with someone: the preposition goes at the end. || @tags en.relative-clauses
      mc: Choose the correct sentence. || This is the pool where I swim in. | *This is the pool I swim in. | This is the pool which I swim. || Where + in is wrong, and which needs the preposition: which I swim in. || @tags en.relative-clauses
      rw: Join the sentences without a relative pronoun :: This is the team. I play for it. || This is the team I play for. || The team I play for: leave out the pronoun and don't repeat it. || @tags en.relative-clauses
      rw: Join the sentences, with the preposition at the end :: She's the friend. I go running with her. || She's the friend I go running with. | She's the friend who I go running with. | She's the friend that I go running with. || Go running with someone: the preposition goes at the end; her is not repeated. || @tags en.relative-clauses
      mc: "Is this the app ___ you told me about?" || *that | where | what || That (or no pronoun) for a thing. Where is for places, and what can't be used here. || @tags en.relative-clauses
      mc: In which sentence is the relative pronoun necessary? || The racket that I bought was cheap. | *The player who won the match is only seventeen. | The park that we run in is lovely. || Who is the subject of won, so it must stay. In the other two, the pronoun is the object and can be left out. || @tags en.relative-clauses
      tf: Luca has always loved sports. || false || Hina says, "You used to hate sports." || @ctx dialogue
      short: What does Hina need to bring to her first session? || kw: water/towel || "Just bring water and a towel." || @ctx dialogue
      listen: @dialogue || What did the coach teach Luca? || *How to fall safely | How to stretch properly | How to choose shoes || "He's the one who taught me how to fall safely." || @tags en.listening
      listen: The reason I took up swimming was an injury. My knee was too sore for running, so my doctor suggested the pool near my office. || Why did the speaker start swimming? || *Because of a knee injury | To meet new people | Because running was boring || "The reason I took up swimming was an injury." || @tags en.listening,en.relative-clauses
      dict: The coach I train with is really patient. || preposition at the end
      ask: Tell a friend about a sport or activity you do, or want to take up. Say where you do it and who you do it with. || kw: with/at/in/to & play/do/go/train/run/swim/work out/take up || I play basketball with some people from work. The court we play on is behind the library, and we meet every Tuesday after work.
      write: Write a message (60–80 words) inviting a friend to try your sport or class. Describe the place, the people and what to bring, using at least two relative clauses. || min=50 || req: that/who/which/where/I | bring/come/join || Hi Marta! Do you want to try the dance class I go to on Wednesdays? It's in a studio near the station that has huge mirrors and great music. The teacher is a woman who used to dance professionally, and the people I dance with are really friendly. You don't need any special equipment — just bring comfortable shoes and some water. See you there?
