unit: 8
title: A world of difference
theme: Society and travel
description: Talk about traveling responsibly and imagine alternatives with the second conditional, discuss dilemmas with "What would you do if…?", and talk about customs, stereotypes and things you would like to change with wish.
objectives:
  - Imagine unreal or unlikely situations and their results with the second conditional
  - Ask and answer "What would you do if…?" questions, using would, could and might
  - Talk about customs and stereotypes, and express wishes about the present with wish + past simple and could
canDo:
  - I can compare ways of traveling and explain how tourists can travel more responsibly.
  - I can discuss imaginary situations and dilemmas and explain what I would do.
  - I can talk about customs and stereotypes carefully and fairly.
  - I can say what I would like to be different in my life or my town.
review: |
  fill: If we ___ (live) near the mountains, we ___ (go) hiking every weekend. || lived ; would go / 'd go || Second conditional: if + past simple, would + base form, for an imaginary situation. || @tags en.conditionals
  mc: Choose the correct sentence. || If I would have more time, I would learn Japanese. | *If I had more time, I would learn Japanese. | If I had more time, I will learn Japanese. || Past simple in the if-clause, would in the result. Never would in the if-clause. || @tags en.conditionals
  mc: Which sentence describes an imaginary situation? || If it's sunny tomorrow, we'll go to the beach. | *If I were a millionaire, I'd buy an island. | When the train arrives, I'll call you. || If + past (were) + would shows an unreal situation. The other two are real possibilities. || @tags en.conditionals
  fill: What ___ you do if you ___ (miss) the last train home? || would ; missed || Second conditional question: What would you do if + past simple? || @tags en.conditionals,en.questions
  mc: Your friend can't decide whether to accept a job abroad. You give advice: || If I am you, I'll accept it. | *If I were you, I'd accept it. | If I were you, I accept it. || If I were you, I'd… is the standard phrase for advice. || @tags en.conditionals
  fill: I don't have a car. I wish I ___ (have) one. || had || Wish + past simple for a present situation you'd like to change. || @tags en.wishes
  rw: Write a wish :: I can't swim. || I wish I could swim. || Can → could after wish. || @tags en.wishes
  mc: Your cousin is getting married tomorrow. What do you say? || I wish you are very happy! | *I hope you'll be very happy! | I wish you were very happy! || For good wishes about the future, use hope. Wish + past is for situations you'd like to change. || @tags en.wishes
  listen: If I could live anywhere, I'd choose a small town by the sea. I'd swim every morning, and I'd probably work from home. || Where would the speaker like to live? || In a big city | *In a small town by the sea | In the mountains || "If I could live anywhere, I'd choose a small town by the sea." || @tags en.listening,en.conditionals
  listen: I love my new life in Montreal, but I wish my French were better. I also wish the winters weren't so long! || What does the speaker wish? || *That their French was better | That they lived in Paris | That the summers were longer || "I wish my French were better." || @tags en.listening,en.wishes
  ask: Answer this question: "If you could change one thing about the way people travel, what would it be?" || kw: would/'d/I would/I'd & if/because || If I could change one thing, I'd make train tickets much cheaper than flights. Then more people would take the train, and there would be less pollution.
  write: Write a short paragraph (70–90 words) about a custom from your country that visitors often find surprising. Explain it, say what visitors sometimes assume, and add one wish. || min=60 || req: custom/tradition/usually/always | wish || In Spain, people usually have dinner very late — often at nine or ten in the evening. Visitors sometimes assume that restaurants are empty because the food is bad, but really they're just early! Lunch is the main meal, and many people eat it at around two. I love this custom, but I wish shops stayed open later in small towns. And sometimes I wish I could have dinner at seven without people looking surprised!
lessons:
  - title: Traveling responsibly
    summary: Compare ways of traveling and talk about the effects of tourism, imagining alternatives with the second conditional.
    minutes: 45
    skills: [grammar, speaking, listening]
    tags: [en.conditionals, en.vocabulary, en.pronunciation]
    objectives:
      - Form and use the second conditional (if + past simple, would + base form)
      - Choose between the first and second conditional
      - Discuss the effects of tourism and ways to travel more responsibly
    intro: |
      Cheap flights, crowded city centers, rising rents — tourism brings money to many places, but it also brings problems. In this lesson you will talk about **responsible travel** and use the **second conditional** to imagine different choices: *If we **took** the train, our carbon footprint **would** be much smaller.*
    vocab: |
      responsible | thinking carefully about the effects of your actions on others | adj | Responsible tourists respect local customs. | - | c: responsible travel; responsible tourism
      overtourism | a situation in which too many tourists visit a place and damage it | n | Some cities are fighting overtourism by limiting cruise ships. | -
      local | a person who lives in a particular place | n | Ask the locals where to eat. | - | n: Also an adjective: local food, local shops.
      accommodation | a place to stay, such as a hotel or an apartment | n | We found cheap accommodation near the beach. | - | n: Uncountable in British English; Americans often say accommodations.
      off the beaten track | far from the places where most tourists go | expr | We stayed in a village off the beaten track. | - | n: American English also: off the beaten path.
      souvenir | something you buy or keep to remember a place | n | I always buy a small souvenir from a local artist. | -
      cost a fortune | to be very expensive | expr | The hotel cost a fortune, but the view was amazing. | -
      compromise | an agreement in which each person accepts less than they wanted | n | We reached a compromise: train there, plane back. | -
      sightseeing | visiting famous or interesting places as a tourist | n | We did some sightseeing in the morning. | - | c: go sightseeing | n: Uncountable.
      crowds | large numbers of people together in one place | n | We went early to avoid the crowds. | -
      emissions | gases sent into the air, for example by cars and planes | n | Trains produce far fewer emissions than planes. | -
      guesthouse | a small hotel, often run by a family | n | We stayed in a lovely guesthouse run by a retired couple. | -
    grammar:
      title: "The second conditional"
      body: |
        Use **if + past simple, would + base form** for situations that are **imaginary, unlikely or impossible** in the present or the future: *If we **took** the train, it **would take** two days.* We're not sure we will take it — we're imagining.

        The past form here does **not** mean past time; it shows that the situation is unreal. Compare:
        - **First conditional** — a real, likely situation: *If we **eat** at local places, the money **will stay** in the community.*
        - **Second conditional** — an imaginary or unlikely situation: *If everyone **stopped** flying, many airports **would close**.*

        *Would* is often shortened to **'d**; the negative is **wouldn't**. You can use **could** (= would be able to) in the result: *If I had a car, I **could** visit you more often.*

        **If I were you, I'd…** is a very common way to give advice. With *I, he, she* and *it*, **were** is the standard form in this conditional. The if-clause can come first (with a comma) or second.
      table: |
        Type | Form | Example
        First conditional (real) | if + present, will + base form | If it's sunny, we'll walk.
        Second conditional (imaginary) | if + past simple, would + base form | If I had more time, I'd travel by train.
        Second conditional (ability) | if + past simple, could + base form | If we had a car, we could visit the lakes.
        Advice | If I were you, I'd… | If I were you, I'd book early.
      examples: |
        If we took the train, our carbon footprint would be much smaller. | | imaginary choice
        If the hotel weren't so expensive, we'd stay there. | | were for an unreal situation
        If we stay with a local family, we'll learn more about the culture. | | first conditional: a real plan
        If I were you, I'd avoid the city center in August. | | advice
      tip: "Never use would in the if-clause: If I had more money… (not If I would have more money…)."
    dialogue:
      title: Train or plane?
      setting: A Tuesday evening at a café in London. Freya and Noah are planning a ten-day vacation in Lisbon in August.
      speakers: F=Freya/f; N=Noah/m
      lines: |
        F: So, Lisbon in August! Have you booked the flights yet?
        N: Not yet. I was wondering — what if we went by train instead?
        F: By train? From London? That would take two days!
        N: I know. But if we took the train, our carbon footprint would be much smaller.
        F: True, but it would cost a fortune. Flights are so cheap right now.
        N: If we stopped in Paris and Madrid, the journey would be part of the vacation.
        F: Hmm. That actually sounds fun. But I only have ten days off.
        N: If we had more time, I'd take the train both ways.
        F: OK, let's compromise: train there, plane back?
        N: Deal. And let's stay in a guesthouse, not one of those huge hotels.
        F: Good idea. If we eat at small local places, the money will stay in the community.
        N: Exactly. I'll look for train tickets tonight.
    pronunciation:
      title: "'d for would: I'd, we'd, it'd"
      body: |
        In the second conditional, **would** is usually shortened to **'d**, which is short and quiet: *I'd take the train* ("Ide take"), *we'd save money*. **It'd** has two syllables: "IT-əd". **Wouldn't** sounds like "WOOD-ənt".

        Listen carefully: *I take the train* (a habit) and *I'd take the train* (imaginary) sound very similar — the 'd makes the difference. Listen and repeat.
      items: |
        I'd take the train.
        It'd take two days.
        We'd save money.
        It wouldn't be cheap.
        If I were you, I'd go.
    culture:
      title: Being a responsible visitor
      body: |
        In many national parks in the US and Canada, visitors are asked to follow the **Leave No Trace** principles: take all your trash home, stay on the paths and don't feed wild animals. Some popular cities now charge a **tourist tax** or limit the number of visitors on busy days.

        Small choices make a difference: staying in locally owned guesthouses, eating where the locals eat, traveling outside the busiest months, and learning a few words of the local language — even just *hello* and *thank you*.
    mistakes: |
      If I would have more money, I would travel more. => If I had more money, I would travel more. | Don't use would in the if-clause. Use the past simple.
      If we took the train, it will take two days. => If we took the train, it would take two days. | In the second conditional, the result uses would, not will.
      We did a lot of sightseeings. => We did a lot of sightseeing. | Sightseeing is uncountable.
    task:
      title: The responsible trip
      mode: interaction
      body: |
        With a partner, plan a five-day trip to a city or region you would both like to visit. Compare two ways of getting there and two types of accommodation, using the second conditional (*If we took…, it would…*) and the first conditional for your real plan (*If we stay…, we'll…*). Agree on a compromise. Then plan a responsible weekend trip with the AI coach in the "Making weekend plans" scenario.
    exercises: |
      fill: If we ___ (take) the train, it ___ (take) almost two days. || took ; would take / 'd take || Second conditional: if + past simple, would + base form. || @tags en.conditionals
      fill: If I ___ (have) more vacation days, I'd travel more slowly. || had || Imaginary present situation: if + past simple. || @tags en.conditionals
      mc: Choose the correct sentence. || If I would have more money, I would buy an electric car. | *If I had more money, I would buy an electric car. | If I had more money, I will buy an electric car. || Past simple in the if-clause and would in the result. || @tags en.conditionals
      mc: Which sentence describes an imaginary situation? || If it rains tomorrow, we'll visit the museum. | *If everyone stopped flying, many airports would close. | When we arrive, we'll call you. || If + past + would describes an unlikely, imaginary situation. || @tags en.conditionals
      mc: Your friend can't decide where to stay. You give advice: || If I am you, I'll stay in a guesthouse. | *If I were you, I'd stay in a guesthouse. | If I were you, I stay in a guesthouse. || The fixed phrase for advice is If I were you, I'd… || @tags en.conditionals
      rw: Rewrite as a second conditional :: We don't live near the coast, so we don't go to the beach often. || If we lived near the coast, we would go to the beach more often. | If we lived near the coast, we'd go to the beach more often. | If we lived near the coast, we would go to the beach often. | If we lived near the coast, we'd go to the beach often. || Present reality → past simple in the if-clause, would in the result. || @tags en.conditionals
      rw: Rewrite as a second conditional :: The hotel is too expensive, so we won't stay there. || If the hotel wasn't so expensive, we would stay there. | If the hotel weren't so expensive, we would stay there. | If the hotel wasn't so expensive, we'd stay there. | If the hotel weren't so expensive, we'd stay there. | If the hotel wasn't too expensive, we would stay there. | If the hotel weren't too expensive, we would stay there. || Change the facts to their opposite: is too expensive → wasn't/weren't so expensive; won't stay → would stay. || @tags en.conditionals
      tf: Freya wants to travel by train both ways. || false || Noah would like to take the train both ways; Freya suggests the compromise: train there, plane back. || @ctx dialogue
      short: How many days off does Freya have? || kw: ten/10 || "I only have ten days off." || @ctx dialogue
      listen: @dialogue || What compromise do Freya and Noah agree on? || *Train there, plane back | Plane there, train back | Plane both ways || "OK, let's compromise: train there, plane back?" — "Deal." || @tags en.listening
      listen: If I could change one thing about tourism in my town, I'd limit the number of cruise ships. When three ships arrive on the same day, the streets are so crowded you can't move. || What would the speaker change? || *The number of cruise ships | The price of hotels | The opening hours of shops || "I'd limit the number of cruise ships." || @tags en.listening,en.conditionals
      dict: If we took the train, our carbon footprint would be smaller. || second conditional
      ask: A friend asks, "If you could travel anywhere next year, where would you go, and how would you get there?" Answer. || kw: would/'d/I would/I'd & because/so/by train/by plane/by bus/by car/by bike || If I could go anywhere, I'd go to Vietnam. I'd fly there, but then I'd travel by train and bus from north to south, and I'd stay in small guesthouses.
      write: Write a short paragraph (60–80 words) answering this question: "How would you change tourism in your town, or in a place you love?" || min=50 || req: if | would/'d/could || My hometown, Dubrovnik, is beautiful, but in summer the old town is too crowded. If I could change one thing, I'd limit the number of cruise ships to one a day. I would also encourage tourists to visit in spring or autumn. If there were fewer visitors at the same time, locals would enjoy their city again, and tourists would have a much better experience.

  - title: What would you do if…?
    summary: Ask and answer questions about imaginary situations and dilemmas with would, could and might, and give advice with If I were you…
    minutes: 45
    skills: [speaking, grammar, listening]
    tags: [en.conditionals, en.questions, en.pronunciation]
    objectives:
      - Ask "What would you do if…?" and "Would you…?" questions and give short answers
      - Use could and might in second conditional sentences
      - Discuss dilemmas and explain your choices
    intro: |
      *What would you do if you found a wallet full of money?* Questions about imaginary situations are a favorite game on long journeys, at parties and in job interviews — and they say a lot about people. In this lesson you will ask and answer **"What would you do if…?"** questions, use **could** and **might**, and explain the choices you would make in difficult situations.
    vocab: |
      dilemma | a situation in which you have to make a difficult choice | n | Should I tell her or not? It's a real dilemma. | - | c: face a dilemma; a moral dilemma
      honest | always telling the truth | adj | To be honest, I didn't like the movie. | - | n: The h is silent.
      pretend | to behave as if something is true when it isn't | v | I pretended to like the present. | - | n: Followed by to + infinitive.
      reward | money or a prize that you get for doing something good | n | The owner offered a reward for the lost dog. | -
      hand in | to give something to a person in authority | phr v | I handed the wallet in at the police station. | -
      give away | to give something to someone without asking for money | phr v | She gave away all her old books. | -
      tell the truth | to say what really happened or what you really think | expr | It's always better to tell the truth. | -
      hurt someone's feelings | to make someone feel sad or upset | expr | I didn't want to hurt her feelings. | -
      risk | the possibility that something bad will happen | n | Is it worth the risk? | - | c: take a risk
      obviously | in a way that is easy to see or understand | adv | Obviously, I'd call the police. | -
      awkward | embarrassing and uncomfortable | adj | There was an awkward silence after his joke. | -
      pay back | to return money that you borrowed | phr v | I'll pay you back tomorrow, I promise. | -
    grammar:
      title: "Second conditional: questions, could and might"
      body: |
        To ask about imaginary situations, use **What would you do if + past simple?** or **Would you… if…?**: *What **would** you **do** if you **found** a wallet? **Would** you **tell** her if you **saw** him?*

        Short answers use **would**: *Yes, I would. / No, I wouldn't.*

        - **could** in the if-clause = if it were possible: *If you **could** live anywhere, where **would** you live?*
        - **could** in the result = would be able to: *If I had a car, I **could** drive you.*
        - **might** in the result = maybe would (you're not sure): *I **might** keep ten dollars as a reward.*

        Compare a real possibility and an imaginary one: *What **will** you do if it **rains** tomorrow?* (it might really rain) / *What **would** you do if you **won** a free trip?* (unlikely).

        For advice in a dilemma, use **If I were you, I'd…**: *If I were you, I'd tell her the truth.*
      table: |
        Function | Example
        Wh- question | What would you do if you lost your passport?
        Yes/no question | Would you tell her if you saw him?
        Imaginary possibility | If you could meet anyone, who would it be?
        Not sure | I might call the police. / I think I'd…
        Short answers | Yes, I would. / No, I wouldn't.
        Advice | If I were you, I'd tell her the truth.
      examples: |
        What would you do if you found a wallet with a thousand dollars in it? | | what would you do if…
        If you could have any job in the world, what would it be? | | could in the if-clause
        I might keep ten dollars as a reward. | | might = maybe would
        Would you tell a friend if you hated their haircut? — No, I wouldn't. | | short answer
      tip: "In both the question and the answer, the if-clause uses the past and the other clause uses would (or could, or might) — never would in both clauses."
    dialogue:
      title: The road trip game
      setting: A long drive through the desert from Los Angeles to Las Vegas. Jade, Tariq and Bea are bored, so they start a game of imaginary questions.
      speakers: J=Jade/f; T=Tariq/m; B=Bea/f
      lines: |
        J: OK, I'm bored. Let's play "What would you do?" Tariq, you go first.
        T: Fine. What would you do if you found a wallet with a thousand dollars in it?
        B: I'd take it to the police, obviously. Wouldn't you?
        T: Of course! Well… I might keep ten dollars as a reward.
        J: Tariq! My turn. If you could have any job in the world, what would it be?
        B: I'd be a wildlife photographer. I'd spend months in the Arctic.
        T: I'd be a chef on a cruise ship. Free travel and great food!
        J: Bea, your turn. Ask us something difficult.
        B: What would you do if a friend gave you a present that you really hated?
        J: I'd pretend to love it and then give it away later.
        T: I wouldn't! If I were you, I'd tell them the truth — nicely.
        B: Honestly? If I said that to my aunt, she'd never speak to me again!
    pronunciation:
      title: "Would you…? Linking in questions"
      body: |
        In fast speech, **would you** sounds like "WOOD-ja": the d and the y join together, just like *did you* ("didja"). **What would you do?** sounds like "Wha-wood-ja DO?", with the stress on *do*.

        In short answers, *would* and *wouldn't* are strong: *Yes, I WOULD. No, I WOULDn't.* Listen and repeat.
      items: |
        What would you do?
        Would you tell her?
        Where would you go?
        Yes, I would.
        No, I wouldn't.
        If I were you, I'd tell her.
    culture:
      title: White lies and "Would you rather…?"
      body: |
        Many English speakers think small **white lies** are kind, not dishonest — for example, saying *I love it!* about a present you don't like, or *I'd love to, but I'm busy* to avoid an invitation. Other people prefer to be direct. It depends on the person, the relationship and the situation.

        *Would you rather…?* is a popular game at parties and on long journeys: *Would you rather live without music or without movies?* Notice the grammar: **would rather** + base form, with no *to*.
    mistakes: |
      What would you do if you would find a wallet? => What would you do if you found a wallet? | Don't use would in the if-clause. Use the past simple.
      If I could to choose, I'd live by the sea. => If I could choose, I'd live by the sea. | Could is followed by the base form, without to.
      I'd pretend liking it. => I'd pretend to like it. | Pretend is followed by to + infinitive.
    task:
      title: Dilemma cards
      mode: interaction
      body: |
        Write three dilemma questions on cards (*What would you do if…? Would you… if…?*). Ask a partner, and for each answer ask a follow-up question: *Why?* or *What if nobody saw you?*. Then answer their questions, using *would*, *might* and *If I were you, I'd…*. Finally, discuss one dilemma in depth with the AI coach in the "Expressing an opinion" scenario.
    exercises: |
      fill: What ___ you do if you ___ (lose) your passport abroad? || would ; lost || What would you do if + past simple? || @tags en.conditionals,en.questions
      fill: If you ___ (can) live anywhere in the world, where would you live? || could || Can → could in an imaginary if-clause. || @tags en.conditionals
      mc: "Would you tell your friend the truth?" — "No, I ___." || won't | *wouldn't | didn't || Answer a would-question with would or wouldn't. || @tags en.conditionals
      mc: Choose the correct question. || What would you do if you would see a fire? | *What would you do if you saw a fire? | What will you do if you saw a fire? || Past simple in the if-clause, would in the question. || @tags en.conditionals,en.questions
      rw: Make a second conditional question :: you / win a trip around the world / where / go first || If you won a trip around the world, where would you go first? | Where would you go first if you won a trip around the world? || If + past simple; question: where would you + base form. || @tags en.conditionals,en.questions
      mc: You're not sure what you would do in a situation. Which answer shows this? || *I might call the police. | I will call the police. | I called the police. || Might = maybe would; it shows you aren't sure. || @tags en.conditionals
      match: What would you do if you found a wallet? = I'd hand it in at the police station. ; Would you tell a friend if you hated their haircut? = No, I wouldn't. I don't want to hurt their feelings. ; If you could meet anyone from history, who would it be? = I'd love to meet Marie Curie. ; What would you do if you missed your flight? = I'd ask the airline for a seat on the next one. ; Where would you live if you could choose? = Somewhere by the sea, probably. || Each question is matched with the answer that fits it. || @hint Match each question with its answer. @tags en.conditionals @skill speaking
      tf: Bea would take the wallet to the police. || true || "I'd take it to the police, obviously." || @ctx dialogue
      short: What job would Tariq like to have? || kw: chef/cook || "I'd be a chef on a cruise ship." || @ctx dialogue
      listen: @dialogue || What would Jade do with a present she really hated? || *Pretend to love it and give it away later | Tell her friend the truth | Take it back to the store || "I'd pretend to love it and then give it away later." || @tags en.listening
      listen: If I saw someone cheating in an exam, I don't think I'd tell the teacher. I might talk to the student afterwards, though. || What might the speaker do? || Tell the teacher | *Talk to the student later | Ignore it and say nothing ever || "I might talk to the student afterwards." || @tags en.listening,en.conditionals
      dict: What would you do if you found a lot of money in the street? || what would you do if…
      ask: Answer this question: "What would you do if you were invisible for a day?" Give two or three ideas. || kw: I'd/I would/I might/I could/would/might || If I were invisible for a day, I'd go backstage at a big concert. I might also sit in on a meeting at a famous company, just to see what really happens there.
      write: Write your answer (60–80 words) to this question: "If you could change one thing about your life, what would it be, and why?" || min=50 || req: if | would/'d/could/might || If I could change one thing about my life, I'd live closer to my family. At the moment they're six hours away by train, so I only see them three times a year. If we lived in the same city, I could have lunch with my grandmother every Sunday, and my kids would grow up with their cousins. I might even learn to cook my mother's recipes!

  - title: Customs and stereotypes
    summary: Read about a newcomer's experience of a new culture, talk about customs and stereotypes carefully, and express wishes about the present with wish + past simple and could.
    minutes: 45
    skills: [reading, grammar, writing]
    tags: [en.wishes, en.reading, en.pronunciation]
    objectives:
      - Use wish + past simple and wish + could for present situations you'd like to change
      - Distinguish between wish and hope
      - Talk about customs and stereotypes fairly, without generalizing
    intro: |
      Every culture has its customs — and every culture is the subject of stereotypes. Living in another country teaches you which stereotypes are partly true, which are completely wrong, and which customs are important to learn. In this lesson you will read about a British woman's first years in Finland, talk about customs carefully, and use **wish** to talk about things you would like to be different: *I **wish** I **spoke** better Finnish.*
    vocab: |
      stereotype | a fixed, often unfair idea that many people have about a group | n | It's a stereotype that everyone in Finland is quiet. | - | c: a common stereotype; challenge a stereotype
      custom | a traditional way of doing something in a society | n | Taking your shoes off indoors is an important custom in Finland. | - | n: Don't confuse it with customs, the place at a border where bags are checked.
      small talk | polite conversation about unimportant things | n | I'm not very good at small talk. | - | c: make small talk
      generalize | to say that something is true of all the members of a group | v | It's dangerous to generalize about a whole country. | - | n: British spelling: generalise.
      assume | to think that something is true without checking | v | People often assume I'm American because of my accent. | -
      punctual | arriving or doing something at the agreed time | adj | Please be punctual — the tour leaves at nine. | -
      open-minded | willing to accept different ideas and ways of life | adj | Traveling makes you more open-minded. | -
      culture shock | a feeling of confusion when you start living in a new culture | n | I had real culture shock in my first month. | -
      reputation | the opinion that people have about someone or something | n | The city has a reputation for being expensive. | - | c: have a reputation for
      fit in | to be accepted as part of a group | phr v | It took me a year to really fit in at work. | -
      to be fair | a phrase you use before you say something that balances what you just said | expr | The food was expensive. To be fair, it was delicious. | -
      get used to | to become familiar with something new, so that it isn't strange anymore | expr | I'm slowly getting used to the dark winters. | - | n: Followed by a noun or -ing: get used to driving on the left.
    grammar:
      title: "wish + past simple and could"
      body: |
        Use **wish + past simple** to talk about a **present** situation that you would like to be different — something that is **not** true now: *I **wish** I **spoke** better Finnish.* (I don't speak it well.) *I wish the sun **didn't set** so early.* (It sets early.)

        - With *be*, **were** is common, especially in writing: *I wish I **were** more patient.* (*Was* is also common in speech.)
        - Use **wish + could** for abilities and possibilities: *I wish I **could** explain it to them.* (I can't.)
        - Like the second conditional, the past form refers to the **present** — it shows that the situation is unreal.
        - Don't use the present or *will* after wish: ~~I wish I speak~~.

        **Wish or hope?** For good wishes and hopes about the **future**, use **hope**: *I **hope** you have a great trip* (not ~~I wish you have~~). **If only…** is a stronger, more emotional way to express a wish: *If only I had more time!*
      table: |
        Reality now | Wish
        I don't speak Finnish well. | I wish I spoke better Finnish.
        I can't follow conversations at parties. | I wish I could follow them.
        The sun sets at half past three. | I wish the sun didn't set so early.
        I'm not very patient. | I wish I were more patient.
        A hope for the future | I hope you enjoy your trip. (not wish)
      examples: |
        I wish I spoke the language better. | | wish + past simple
        I wish I could stay longer, but I have to go back on Monday. | | wish + could
        I wish people didn't assume that "quiet" means "cold." | | negative wish
        I hope you fit in quickly at your new school! | | hope for the future
      tip: "Wish looks one step back, like the second conditional: present reality → past form after wish."
    reading:
      title: Silence is golden
      text: |
        Before I moved from Bristol to Helsinki for work three years ago, everyone gave me the same warning: "Finns don't talk." My friends imagined that I would spend my winters in total silence, surrounded by people who never smiled.

        The reality was more interesting. It's true that many Finns don't enjoy small talk. People rarely chat with strangers at the bus stop, and in my first few months I found the silence in the office kitchen almost painful. Back home, a quiet moment is something you fill — with a comment about the weather, a joke, anything. Here, silence is comfortable. People speak when they have something to say.

        Once I understood that, I started to like it. My Finnish colleagues are warm, funny and incredibly honest. When they invite you to their home, they mean it. And when they say, "Let's have coffee sometime," they actually put it in the calendar!

        Some customs took longer to learn. You always take your shoes off when you go into someone's home, and you should be punctual — five minutes late is late. The sauna isn't just a place to relax; it's where friends, families and even colleagues have some of their best conversations.

        Of course, stereotypes work both ways. My neighbors were sure that I drank tea all day and talked about the weather constantly. To be fair, they weren't completely wrong.

        Do I have any regrets? Only a few. I wish I spoke better Finnish — it's a beautiful but very difficult language, and I still can't follow conversations at parties. I wish I could explain to people back home that "quiet" doesn't mean "cold." And on dark January afternoons, I sometimes wish the sun didn't set at half past three.

        But stereotypes are only the first page of the story. If you stay long enough, you get to read the rest.
    pronunciation:
      title: Sentence stress with wish
      body: |
        In sentences with **wish**, we usually stress *wish* and the word that shows what we'd like to change: *I WISH I spoke better FINnish. I wish it wasn't so DARK.* The words in between are quick and weak.

        **If only** is said with strong emotion: the voice starts high on *only* and falls: *If ONly I had more TIME!* Listen and repeat.
      items: |
        I wish I spoke Finnish.
        I wish I could stay longer.
        I wish it wasn't so dark.
        I wish I were more patient.
        If only I had more time!
    culture:
      title: Talking about cultures fairly
      body: |
        When you talk about another culture — or your own — avoid sentences that begin *All [people] are…* or *[People] never…*. Softer language sounds fairer and more accurate: *In my experience…, Many people…, People there tend to…, It's quite common to…*

        If you aren't sure about a custom, it's always fine to ask: *Should I take my shoes off? Is it OK to call you by your first name?* Most people are happy to explain, and asking shows respect.
    mistakes: |
      I wish I speak better Finnish. => I wish I spoke better Finnish. | For a present situation, use wish + past simple.
      I wish I can stay longer. => I wish I could stay longer. | Use could, not can, after wish.
      I wish you have a great trip! => I hope you have a great trip! | For good wishes about the future, use hope (or simply "Have a great trip!").
    task:
      title: What I wish people knew
      mode: writing
      body: |
        Write 80–100 words about your country, region or city for an international student website. Describe one stereotype and explain how true it is, describe one custom visitors should know about, and finish with two wishes (*I wish people knew…, I wish visitors could…*). Use soft language (*many people, in my experience*) instead of generalizations.
    exercises: |
      mc: What warning did the writer's friends give her before she moved? || *That Finns don't talk | That Helsinki is very expensive | That Finnish food is strange || "Everyone gave me the same warning: 'Finns don't talk.'" || @ctx reading @tags en.reading
      tf: The writer still finds the silence in the office painful. || false || She found it painful in her first few months, but "once I understood that, I started to like it." || @ctx reading
      short: What should you always do when you go into someone's home in Finland? || kw: shoes || "You always take your shoes off when you go into someone's home." || @ctx reading
      fill: I don't speak Finnish well. I wish I ___ (speak) it better. || spoke / could speak || Wish + past simple (or could) for a present situation you want to change. || @tags en.wishes
      fill: I can't follow conversations at parties. I wish I ___ follow them. || could || Can → could after wish. || @tags en.wishes
      mc: Choose the correct sentence. || I wish I can stay longer. | *I wish I could stay longer. | I wish I will stay longer. || After wish, use could (not can or will). || @tags en.wishes
      rw: Write a wish :: I'm not very patient. || I wish I were more patient. | I wish I was more patient. || Present reality → wish + past (were/was). || @tags en.wishes
      rw: Write a wish :: It's so dark in the afternoon. || I wish it wasn't so dark in the afternoon. | I wish it weren't so dark in the afternoon. || Present reality → wish + negative past (wasn't/weren't). || @tags en.wishes
      mc: Your friend is leaving for a trip tomorrow. What do you say? || I wish you have a great trip! | *I hope you have a great trip! | I wish you had a great trip! || For a hope about the future, use hope. || @tags en.wishes
      listen: I love living in Dublin, but I wish the rent wasn't so high. I also wish I could see my family more often — they live in Lagos. || What does the speaker wish? || *That the rent were lower | That they lived in Lagos | That they spoke Irish || "I wish the rent wasn't so high" — they'd like it to be lower. || @tags en.listening,en.wishes
      dict: I wish I could explain that quiet doesn't mean cold. || wish + could
      ask: Talk about one stereotype about your country or city. Is it true? Answer fairly, with an example. || kw: people think/stereotype/assume/people say/reputation & true/not true/in my experience/actually/to be fair/many || People often think that everyone in Brazil loves soccer. In my experience, that's partly true — many people watch the big games. To be fair, though, my sister has never watched a match in her life!
      write: Write a short text (80–100 words) for an international student website about your country or city. Describe one stereotype, one custom visitors should know, and two wishes. || min=70 || req: wish | stereotype/people think/assume/reputation | custom/always/should/usually || People often assume that everyone in Canada is extremely polite. In my experience, that's mostly true — we say "sorry" all the time, even when it isn't our fault! One custom visitors should know is that we usually take our shoes off when we go into someone's home. I wish more visitors came in the fall, when the colors are incredible. And I wish people knew that we don't all live near the snow — Toronto summers are hot!
