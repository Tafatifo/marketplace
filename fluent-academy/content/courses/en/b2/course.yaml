language: en
level: B2
title: "English B2 · Fluency"
description: Speak and write with fluency and precision — speculate and hedge, negotiate, discuss science, the environment and the media, report and evaluate other people's views, talk about art and humor, handle formal complaints and present a well-structured argument.
monolingual: true
hours: 150
summary: >-
  B2 learners can understand the main ideas of complex texts on both concrete and abstract topics, including technical
  discussions in their field. They can interact with a degree of fluency and spontaneity that makes regular conversation
  with expert speakers quite possible without strain for either side, and they can produce clear, detailed text on a
  wide range of subjects, explaining a viewpoint and giving the advantages and disadvantages of various options. This
  course delivers around 150 hours of guided practice across 8 units, taught entirely in English.
objectives:
  - Speculate about people and past events and express nuance and degrees of certainty when discussing identity
  - Imagine different pasts and their consequences, and negotiate terms at work and as a consumer
  - Discuss innovation, artificial intelligence and medical news using a full range of passive structures
  - Debate environmental policies and urban solutions, linking cause, consequence and contrast clearly
  - Evaluate news and advertising, report what sources claimed and write a persuasive opinion piece
  - Describe and interpret art, heritage and humor with participle clauses, inversion and emphasis
  - Discuss rights, public services and complaints in an appropriate formal register
  - Make predictions, reflect on regrets and present a structured argument to an audience
canDo:
  listening:
    - Follow extended speech, discussions and radio-style features on familiar and abstract topics, even when the structure is not clearly signposted
    - Identify a speaker's attitude, degree of certainty and implied meaning as well as the main points
  reading:
    - Read articles, opinion pieces and reports about contemporary issues in which writers take particular stances
    - Recognize persuasive techniques, evaluate sources and follow the line of argument in a text of up to about 800 words
  spokenInteraction:
    - Take an active part in discussions and negotiations, accounting for and sustaining your views and responding to counterarguments
    - Deal with formal situations — public services, complaints, meetings — using an appropriate register
  spokenProduction:
    - Give clear, detailed descriptions and presentations, developing an argument with relevant supporting points
    - Speculate about causes and consequences and explain the advantages and disadvantages of different options
  writing:
    - Write an essay, opinion piece or report that develops an argument, gives reasons and weighs alternatives
    - Write formal letters and complaints that are clear, polite and firm, adapting style to the reader
grammar:
  - Modals of deduction about the present (must, might, may, could, can't), including continuous forms
  - Modals of deduction about the past (must have, might have, can't have, couldn't have + past participle)
  - Hedging and nuance (seem to, appear to, tend to, be likely to; adverbs of certainty; softeners)
  - Third conditional for imagined past situations and their results
  - Conditional language for negotiating (provided that, as long as, on condition that, supposing, unless)
  - Mixed conditionals (a past cause with a present result, and a present state with a past result)
  - The passive in all tenses, including continuous, perfect and modal passives
  - Impersonal passive structures (It is believed that…, X is said to be / to have been…)
  - have and get something done
  - Linking words of contrast (despite, in spite of, even though, whereas, nevertheless)
  - Linking words of cause and consequence (due to, owing to, as a result of, consequently, so/such… that)
  - Cleft sentences (What we need is…, It was … that…, The reason why… is…)
  - Advanced reported speech (optional backshift, reporting modals, time and place references)
  - Reporting verbs and their patterns (urge someone to, deny -ing, accuse someone of, insist on, claim to)
  - Reporting and evaluating views in an argument (argue, acknowledge, point out; It has been argued that…)
  - Participle clauses (present, past and perfect participles)
  - Inversion after negative and limiting adverbials (Never have I…, Not only…, Only when…, No sooner…)
  - Emphasis with emphatic do, so/such… that and inversion with so
  - Formal language of rights and obligations (be entitled to, be required to, be prohibited from)
  - Nominalization in formal English
  - Criticizing past actions (should have, ought to have, was supposed to, wasn't meant to)
  - Future continuous and future perfect
  - wish and if only for past regrets; wish + would for annoying habits
  - Other future expressions (be set to, be bound to, be due to, be on the verge of)
vocabularyDomains:
  - Identity, belonging, generations and bilingualism
  - Work, automation, negotiation and consumer habits
  - Innovation, ethics, artificial intelligence and medical research
  - Climate policy, urban planning and environmental debate
  - News, misinformation, advertising and opinion writing
  - Art, cultural heritage, humor and wordplay
  - Rights, civic duties, public services and complaints
  - Predictions, regrets, lessons learned and presentation language
assessment: A 75-minute cumulative test covering grammar, vocabulary, listening and reading from all eight units, with an opinion paragraph to write. A score of 70% or more confirms the B2 level.
units:
  - title: Who we are
    theme: Identity and society
    lessons: ["Identity and belonging", "Generations", "Living between languages"]
  - title: Making a living
    theme: Work and the economy
    lessons: ["The future of work", "Negotiating", "Consumer society"]
  - title: Progress and its price
    theme: Science and technology
    lessons: ["Innovation and ethics", "Artificial intelligence", "Health and medicine in the news"]
  - title: A planet under pressure
    theme: Environment
    lessons: ["Climate policy", "Sustainable cities", "Debating solutions"]
  - title: Reading between the lines
    theme: Media and persuasion
    lessons: ["Misinformation and media literacy", "Advertising and persuasion", "Writing an opinion piece"]
  - title: The art of expression
    theme: Arts and culture
    lessons: ["Talking about art", "Cultural heritage", "Humor and wordplay"]
  - title: The common good
    theme: Citizenship and public life
    lessons: ["Rights and responsibilities", "Public services", "Formal complaints"]
  - title: What lies ahead
    theme: Looking ahead
    lessons: ["Predictions and speculation", "Regrets and lessons learned", "Presenting an argument"]
assessmentItems: |
  mc: Your colleague has been yawning all morning and keeps rubbing her eyes. What is the most logical conclusion? || She can't be tired. | *She must be exhausted. | She must have been exhausted. || The evidence is in the present and points strongly one way, so must + base form. Can't be says the opposite; must have been refers to the past. || @tags en.modals-deduction @obj Speculate about people and past events and express nuance and degrees of certainty when discussing identity
  fill: The front door was unlocked when I got home. My son ___ (forget) to lock it when he left this morning. || must have forgotten / must've forgotten || A confident conclusion about a past action: must have + past participle. || @tags en.modals-deduction
  fill: If the company ___ (not / invest) in training, half of its staff ___ (lose) their jobs when the factory was automated. || hadn't invested / had not invested ; would have lost / 'd have lost || Third conditional: if + past perfect, would have + past participle, for an imagined past. || @tags en.conditionals @obj Imagine different pasts and their consequences, and negotiate terms at work and as a consumer
  mc: I'm happy to sign a two-year contract ___ you include free maintenance. || unless | *provided that | in case || Provided that = only if this condition is met. Unless means if not, and in case means as a precaution. || @tags en.conditionals
  mc: Which sentence is a mixed conditional? || If I had saved more, I would have bought the flat. | *If I had saved more last year, I wouldn't be so worried about money now. | If I save more, I'll buy a flat. || A past condition (had saved last year) with a present result (wouldn't be… now) is a mixed conditional. The others are third and first conditionals. || @tags en.mixed-conditionals
  rw: Rewrite in the passive, without mentioning who did it :: Researchers have tested the new vaccine on two thousand volunteers. || The new vaccine has been tested on two thousand volunteers. || Present perfect passive: has been + past participle. The agent (researchers) is obvious, so it is left out. || @tags en.passive @obj Discuss innovation, artificial intelligence and medical news using a full range of passive structures
  fill: I'm not going to fix the roof myself — I'm going to ___ it ___ by a professional. || have ; repaired / fixed / done || have + object + past participle: someone else does the job for you. || @tags en.causative
  mc: ___ the heavy rain, thousands of people joined the march for cleaner air. || Although | *Despite | However || Despite is followed by a noun phrase (the heavy rain). Although needs a full clause, and however can't join a phrase to a clause like this. || @tags en.connectors @obj Debate environmental policies and urban solutions, linking cause, consequence and contrast clearly
  rw: Rewrite as a cleft sentence beginning "What" :: We need more frequent buses, not more car parks. || What we need is more frequent buses, not more car parks. || What + clause + is + the focus. This puts emphasis on the thing we need. || @tags en.connectors,en.register
  rw: Report the statement with "denied" :: "I didn't edit the photo," the journalist said. || The journalist denied editing the photo. | The journalist denied having edited the photo. | The journalist denied that she had edited the photo. | The journalist denied that he had edited the photo. || Deny + -ing (or having + past participle), or deny + that-clause with backshift. || @tags en.reported-speech @obj Evaluate news and advertising, report what sources claimed and write a persuasive opinion piece
  mc: The ad ___ customers to "act now before it's too late." || suggested | *urged | denied || Urge + someone + to-infinitive = strongly encourage. Suggest is not followed by someone + to, and deny means say something is not true. || @tags en.reported-speech
  mc: Choose the correct sentence. || Never I have seen such a moving performance. | *Never have I seen such a moving performance. | Never have I saw such a moving performance. || After a negative adverbial at the start, invert the auxiliary and subject (have I) and keep the past participle (seen). || @tags en.adverbs,en.register @obj Describe and interpret art, heritage and humor with participle clauses, inversion and emphasis
  fill: ___ (build) in the twelfth century, the cathedral is the oldest building in the city. || Built || A past participle clause has a passive meaning: the cathedral was built. || @tags en.verb-forms,en.passive
  mc: Which phrase is the most appropriate in a formal letter to a city council? || I want to know why the pool's shut. | *I would be grateful if you could explain the reasons for the closure of the pool. | Tell me why you shut the pool. || Formal register uses indirect, polite structures (I would be grateful if…) and nouns such as closure. || @tags en.register,en.formal-writing @obj Discuss rights, public services and complaints in an appropriate formal register
  fill: By the time this course ends, I ___ (finish) my degree and started my new job. || will have finished / 'll have finished || Future perfect: will have + past participle for an action completed before a point in the future. || @tags en.future-continuous-perfect @obj Make predictions, reflect on regrets and present a structured argument to an audience
  fill: I wish I ___ (listen) to my grandmother's advice when I was younger. || had listened / 'd listened || Wish + past perfect for a regret about the past. || @tags en.wishes
  listen: I can't be certain, of course, but judging by the photos, the house must have been built in the late eighteen hundreds. || How sure is the speaker about when the house was built? || Completely certain — they have documents. | *Fairly sure, based on evidence. | They have no idea at all. || "I can't be certain" plus "must have been" shows a confident deduction based on the photos, not a known fact. || @tags en.listening,en.modals-deduction
  listen: Rents in the city center have risen sharply. As a result, many young families have moved to the suburbs, which in turn has increased traffic on the ring road. || What is the final consequence described? || Rents have gone up. | Families have moved to the suburbs. | *There is more traffic on the ring road. || Rising rents → families move → more traffic. "In turn" introduces the final consequence. || @tags en.listening,en.connectors
  listen: This time next week, I'll be lying on a beach in Crete. And by the end of the month, I'll have spent every penny I saved! || What will the speaker be doing next week? || Saving money | *Relaxing on holiday | Working in Crete || "I'll be lying on a beach" — future continuous for an action in progress at a future time. || @tags en.listening,en.future-continuous-perfect
  short: Read the notice: "Owing to essential maintenance, the library will be closed from 3 to 7 June. Books due during this period may be returned without penalty on 8 June." Why will the library be closed? || kw: maintenance/repair/repairs/work || "Owing to essential maintenance" gives the reason. Owing to = because of. || @skill reading @tags en.reading,en.connectors
  write: Write an opinion paragraph (100–130 words) answering the question "Should cities ban cars from their centers?" Give your view, one argument against it and your response, and a conclusion. || min=90 || req: although/despite/while/whereas/however/nevertheless | because/due to/as a result/therefore/consequently | in conclusion/overall/on balance/all in all || In my view, cities should gradually ban private cars from their centers. The main reason is that traffic is responsible for much of the noise and air pollution that make urban life unhealthy. As a result, pedestrian zones tend to be calmer and safer, and local shops often benefit from the extra foot traffic. It has been argued that a ban would be unfair to people with reduced mobility or those who live far from public transport. Although this is a serious concern, it could be addressed with exemptions and better park-and-ride services. On balance, the benefits for health and quality of life clearly outweigh the inconvenience, provided that the changes are introduced step by step.
