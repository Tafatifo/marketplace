unit: 2
title: Making a living
theme: Work and the economy
description: Discuss how automation and new ways of working are changing jobs, imagine different pasts with the third conditional, negotiate terms with conditional language, and talk about consumer habits and their consequences with mixed conditionals.
free: true
objectives:
  - Discuss the future of work and imagine how the past could have been different with the third conditional
  - Negotiate prices, deadlines and conditions using provided that, as long as, on condition that and unless
  - Talk about consumer habits and connect past choices with present results using mixed conditionals
canDo:
  - I can discuss how technology and automation are changing jobs and skills.
  - I can talk about turning points in my studies or career and imagine what might have happened instead.
  - I can negotiate a price or a deadline, make conditional offers and reach a compromise.
  - I can talk about what I buy and why, and explain how past decisions affect my life now.
review: |
  fill: If the town ___ (not / build) the new rail link, the factory ___ (close) years ago. || hadn't built / had not built ; would have closed / 'd have closed || Third conditional: if + past perfect, would have + past participle. || @tags en.conditionals
  fill: If I ___ (take) that job in Singapore, I ___ (live) on the other side of the world now. || had taken / 'd taken ; would be living / 'd be living / would live || Mixed conditional: a past condition (had taken) with a present result (would be living now). || @tags en.mixed-conditionals
  mc: We'll extend your contract ___ you agree to work two days a week in the office. || unless | *provided that | in case || Provided that = only if. Unless means if not, and in case means as a precaution. || @tags en.conditionals
  rw: Rewrite with "unless" :: If you don't confirm the order by noon, we can't guarantee delivery. || Unless you confirm the order by noon, we can't guarantee delivery. | We can't guarantee delivery unless you confirm the order by noon. | Unless you confirm the order by noon, we cannot guarantee delivery. || Unless = if not, so the verb after unless is positive. || @tags en.conditionals
  fill: We'll accept the price on condition ___ you cover the cost of shipping. || that || The full expression is on condition that + clause. || @tags en.conditionals
  mc: "If I weren't so impatient, I wouldn't have paid for express delivery." Which is true? || *The speaker is impatient and paid for express delivery. | The speaker is patient and didn't pay for express delivery. | The speaker was impatient in the past but isn't now. || A present characteristic (weren't so impatient) explains a past action (wouldn't have paid). Reality is the opposite of each clause. || @tags en.mixed-conditionals
  mc: After the warehouse was automated, forty workers lost their jobs. They were made ___. || *redundant | retrained | promoted || Be made redundant = lose your job because it is no longer needed. || @tags en.vocabulary @skill vocabulary
  listen: If I hadn't taken that evening course in data analysis, I'd never have been offered this job. It changed everything. || Why did the speaker get the job? || *Because they had taken an evening course | Because a friend recommended them | Because they had worked there before || "If I hadn't taken that evening course… I'd never have been offered this job." || @tags en.listening,en.conditionals
  listen: I'm happy to lower the price by ten percent, as long as you order at least five hundred units. || When will the price be lower? || In all cases | *Only if the order is five hundred units or more | Only if the order is under five hundred units || As long as = only if this condition is met: an order of at least five hundred units. || @tags en.listening,en.conditionals
  order: I would have applied if I had seen the advert in time. || @tags en.conditionals
  ask: You want to rent a flat advertised for one thousand two hundred a month. Make a counteroffer with a condition, and politely respond when the landlord refuses. || kw: provided/providing/as long as/on condition/if/supposing/what if & would/could/willing/meet halfway/compromise || Would you be willing to accept one thousand one hundred a month, provided that I sign a two-year lease? … I understand. What if we met halfway at one thousand one hundred and fifty, and I paid three months in advance?
  write: Write a paragraph (90–110 words) about a decision that changed your working life or studies. Use one third conditional and one mixed conditional. || min=80 || req: if I had/if I hadn't/if I'd/had I | would have/wouldn't have/I'd have | would be/wouldn't be/I'd be/would live/wouldn't live/would have/wouldn't know || Five years ago, I was offered a place to study law, but I chose a two-year course in software development instead. My parents were worried, but it was the right decision for me. If I had studied law, I would have spent years doing something I didn't enjoy. And if I hadn't taken the coding course, I wouldn't be working for a company that builds apps for hospitals today. Of course, I sometimes wonder what kind of lawyer I would have been. But I'm proud of my work now, and I'm still learning something new every week.
lessons:
  - title: The future of work
    summary: Discuss automation, retraining and new ways of working, and imagine how the past could have been different with the third conditional.
    minutes: 50
    skills: [vocabulary, grammar, speaking]
    tags: [en.conditionals, en.vocabulary, en.schwa]
    objectives:
      - Talk about automation, job security and new skills with precise vocabulary
      - Use the third conditional to talk about imagined past situations and their results
      - Explain how a turning point changed your studies or career
    intro: |
      Robots in warehouses, software that writes reports, colleagues who work from three different countries: work is changing fast, and most people will need to learn new skills several times in their careers. Talking about these changes often means looking back at turning points — *What if I hadn't taken that course?* In this lesson you will learn vocabulary for the changing world of work and use the **third conditional** to imagine how the past could have been different.
    vocab: |
      automation | the use of machines and computers to do work that people used to do | n | Automation has changed almost every job in the factory. | - | c: increased automation | n: Verb: automate.
      be made redundant | to lose your job because your employer no longer needs it to be done | expr | Two hundred staff were made redundant when the plant closed. | - | n: Mainly British; American English often uses be laid off.
      retrain | to learn new skills so that you can do a different job | v | She retrained as a nurse after twenty years in banking. | - | c: retrain as…
      upskill | to learn extra skills, especially for your current job | v | The company is upskilling its drivers to work with electric vehicles. | - | n: Noun: upskilling.
      workforce | all the people who work in a company, industry or country | n | Half of the workforce now works from home at least once a week. | -
      job security | the likelihood that you will keep your job for a long time | n phr | Many young people value job security more than a high salary. | -
      gig economy | a way of working in which people are paid for short jobs instead of having a permanent contract | n phr | Delivery riders are part of the gig economy. | -
      transferable skills | abilities, such as communication or planning, that are useful in many different jobs | n phr | Teaching gave me lots of transferable skills, like public speaking. | -
      lifelong learning | continuing to learn and study throughout your life | n phr | Lifelong learning is no longer optional in most careers. | -
      take over | to start doing something that someone or something else did before | phr v | Software has taken over many of the tasks that clerks used to do. | - | c: take over from someone
      phase out | to stop using something gradually, over a period of time | phr v | The bank is phasing out paper statements. | -
      career path | the series of jobs and positions that someone has during their working life | n phr | Her career path has been anything but straight. | -
      turning point | a time when an important change happens | n | Losing that job was a turning point in my life. | -
    grammar:
      title: The third conditional
      body: |
        We use the **third conditional** to imagine a **different past**: something that did not happen, and the result it would have had. Both halves are about the past, and both are the opposite of reality.

        - **If + past perfect**, **would have + past participle**: *If the company **hadn't offered** retraining, I **would have left**.* (Reality: it offered retraining, so I stayed.)
        - Use **could have** or **might have** in the result for ability or possibility: *If I'd known about the course, I **could have signed up**.*
        - The clauses can change order. Use a comma only when the if-clause comes first: *I would have applied **if** I had seen the advert.*

        **Never** use *would* in the if-clause: *If I **had** known* (not ~~If I would have known~~).

        In speech, both *had* and *would* contract to **'d**, so listen to the verb that follows: *If I**'d** known* (had + past participle), *I**'d** have told you* (would + have).
      table: |
        Reality | Third conditional | Note
        I didn't see the advert, so I didn't apply. | If I had seen the advert, I would have applied. | both clauses past
        She learned to code, so she got the job. | If she hadn't learned to code, she wouldn't have got the job. | negatives reverse reality
        We didn't know, so we couldn't help. | If we'd known, we could have helped. | could have = ability
        They retrained, so maybe they kept their jobs. | If they hadn't retrained, they might have lost their jobs. | might have = possibility
      examples: |
        If the factory hadn't been automated, it would have closed years ago. | | if + past perfect, would have + past participle
        I wouldn't have become a teacher if I hadn't volunteered at a summer camp. | | result clause first, no comma
        If she'd stayed in banking, she might have become a manager by now. | | might have = a possible result
        If we'd started earlier, we could have finished on time. | | 'd = had; could have = ability
      tip: |
        Check the meaning: if both the condition and the result are finished and unchangeable, you need the third conditional.
    dialogue:
      title: Two years with the robots
      setting: The break room of a large warehouse near Rotterdam, in the Netherlands. Two years ago, robots took over most of the lifting and sorting. Sanne and Omar, who both retrained as robot technicians, are on their coffee break.
      speakers: S=Sanne/f; O=Omar/m
      lines: |
        S: Can you believe it's been two years since the robots arrived? I was sure we'd all be out of work by now.
        O: Honestly, if the company hadn't offered the retraining program, I would have left the same week.
        S: Me too. If I hadn't learned to program the machines, I'd probably have ended up stacking shelves somewhere else.
        O: Do you remember Pieter? He refused to take the course, and he was made redundant six months later.
        S: It's a shame. If he'd given it a chance, he might have kept his job.
        O: Maybe. But he'd been lifting boxes here for thirty years. He might not have enjoyed staring at screens all day.
        S: True. Still, the work is far less physical now. My back would have given up years ago if I'd kept lifting boxes.
        O: And the pay is better. I wouldn't have been promoted if I hadn't picked up those new skills.
        S: What worries me is the next wave. People say software will take over planning and scheduling too.
        O: Then we'll have to upskill again. Lifelong learning isn't optional anymore, is it?
        S: No. If someone had told me that at school, I would have laughed at them.
        O: And if someone had told me I'd end up teaching robots, I'd have laughed even harder!
    pronunciation:
      title: Contractions in the third conditional
      body: |
        In natural speech, the third conditional is full of weak forms. *Had* becomes **'d**, and *would have* becomes "wʊdəv" or even "əd-əv": *If I'd known, I'd have told you* sounds like "if-aid-NOWN, aid-əv-TOLD-you".

        The stressed words are the past participles and any negatives: *If she HADN'T LEFT, we WOULDN'T have MET.* Practice the rhythm: short, weak function words and strong content words. Listen and repeat.
      items: |
        If I'd known, I'd have told you.
        I would have left.
        If he'd given it a chance
        I wouldn't have been promoted.
        She might have kept her job.
        We could have finished on time.
    mistakes: |
      If I would have known about the course, I would have applied. => If I had known about the course, I would have applied. | Don't use would in the if-clause. Use the past perfect.
      If she had studied harder, she would passed the exam. => If she had studied harder, she would have passed the exam. | The result clause needs would have + past participle.
      I would have went to the meeting if they had invited me. => I would have gone to the meeting if they had invited me. | After would have, use the past participle (gone), not the past simple.
    task:
      title: A turning point
      mode: speaking
      body: |
        Think of a turning point in your studies or working life: a course you took, a job you accepted or refused, a person you met. Prepare a two-minute talk explaining what happened and imagining what would have happened if things had gone differently. Use at least three third conditional sentences. Then practice explaining your career decisions to the AI coach in the "Preparing for a job interview" scenario.
    exercises: |
      fill: If the company ___ (not / offer) retraining, many workers ___ (lose) their jobs. || hadn't offered / had not offered ; would have lost / 'd have lost || Third conditional: if + past perfect, would have + past participle. || @tags en.conditionals
      fill: I ___ (apply) for the job if I ___ (know) about it earlier. || would have applied / 'd have applied ; had known / 'd known || The result clause can come first: would have + past participle … if + past perfect. || @tags en.conditionals
      mc: Choose the correct sentence. || If I would have seen the ad, I would have applied. | *If I had seen the ad, I would have applied. | If I had saw the ad, I would have applied. || If + past perfect (had seen). Would is never used in the if-clause, and saw is the past simple, not the past participle. || @tags en.conditionals
      mc: "If I'd known about the strike, I'd have taken the train." What does the first 'd mean? || would | *had | did || In the if-clause, 'd + past participle (known) = had. The second 'd, before have, = would. || @tags en.conditionals
      rw: Write a third conditional sentence :: The factory closed, so hundreds of people lost their jobs. || If the factory hadn't closed, hundreds of people wouldn't have lost their jobs. | Hundreds of people wouldn't have lost their jobs if the factory hadn't closed. || Reverse reality: closed → hadn't closed; lost → wouldn't have lost. || @tags en.conditionals
      rw: Write a third conditional sentence :: We finished the project on time only because the whole team worked all weekend. || If the whole team hadn't worked all weekend, we wouldn't have finished the project on time. | We wouldn't have finished the project on time if the whole team hadn't worked all weekend. | If the team hadn't worked all weekend, we wouldn't have finished the project on time. || Both facts are in the past and both are reversed. || @tags en.conditionals
      match: lifelong = learning ; job = security ; transferable = skills ; gig = economy ; turning = point || Common collocations: lifelong learning, job security, transferable skills, gig economy, turning point. || @hint Match the words to make common expressions. @skill vocabulary @tags en.collocations
      tf: Pieter took the retraining course but lost his job anyway. || false || Omar says Pieter "refused to take the course." || @ctx dialogue
      short: Why does Sanne say her job is better for her health now? || kw: physical/lift/lifting/boxes/back || The work is "far less physical"; her back would have given up if she'd kept lifting boxes. || @ctx dialogue
      listen: @dialogue || What does Omar think they will need to do in the future? || Look for jobs in another warehouse | *Learn new skills again | Teach Pieter to use the robots || "Then we'll have to upskill again. Lifelong learning isn't optional anymore." || @tags en.listening
      listen: If I hadn't been made redundant, I would never have started my own bakery. Losing that job was the best thing that ever happened to me. || How does the speaker feel about losing her job now? || *Grateful — it led to something better | Still angry with her old employer | Worried about her new business || "Losing that job was the best thing that ever happened to me." || @tags en.listening,en.conditionals
      order: If I had known about the course, I would have signed up. || @tags en.conditionals
      dict: She wouldn't have been promoted if she hadn't learned those new skills. || third conditional with a passive result
      ask: A colleague asks, "What would have happened if you had chosen a different subject or career?" Answer with at least two third conditional sentences. || kw: if I had/if I hadn't/if I'd & would have/wouldn't have/I'd have/might have/could have || If I had studied engineering like my father wanted, I would have earned more at the beginning. But I wouldn't have met my best friends, and I might have been quite unhappy, because I've always loved working with people.
      write: Write a paragraph (80–100 words) about how technology has changed a job you know well. Imagine what would have happened if the change hadn't come. Use at least two third conditional sentences. || min=70 || req: if/had | would have/wouldn't have/might have/could have/'d have || My aunt has worked in a travel agency for twenty-five years. When online booking became popular, most of her customers disappeared, and the agency nearly closed. If she hadn't specialized in complicated trips, such as tours for people with disabilities, she would have lost her job. If the internet hadn't arrived, she might have spent her whole career selling simple beach holidays. Instead, she learned new skills, built a website and now advises clients from all over the country. She says the crisis was a turning point.

  - title: Negotiating
    summary: Negotiate prices, deadlines and conditions politely and firmly, using provided that, as long as, on condition that, supposing and unless, and reach a compromise.
    minutes: 50
    skills: [speaking, grammar, listening]
    tags: [en.conditionals, en.register, en.intonation]
    objectives:
      - Make conditional offers with provided that, as long as, on condition that and unless
      - Make tentative proposals with supposing, what if and would you be willing to…?
      - Bargain politely, make concessions and reach a compromise
    intro: |
      Whether you are agreeing a fee with a client, a salary with an employer or a rent with a landlord, negotiating in English requires two things: clear conditions and a polite tone. Good negotiators rarely say *no*; they say *yes, provided that…* In this lesson you will learn the **conditional language of negotiation** and the phrases that keep a discussion friendly while you protect your interests.
    vocab: |
      negotiate | to discuss something formally in order to reach an agreement | v | We negotiated a lower rent in exchange for a longer lease. | - | c: negotiate a deal; negotiate with someone | n: Noun: negotiation.
      compromise | an agreement in which each side accepts less than it wanted | n | After two hours, we reached a compromise. | - | c: reach a compromise; make a compromise | n: Also a verb.
      meet (someone) halfway | to accept part of what the other person wants so that you can agree | expr | They wanted ten percent and we offered five, so we met them halfway. | -
      budget | the amount of money that is available for something | n | The project is already over budget. | - | c: a tight budget; within budget; over budget
      fee | an amount of money that you pay for a professional service | n | Her fee for the logo design was very reasonable. | - | c: charge a fee; a flat fee
      deposit | part of a total payment that you make in advance | n | We paid a deposit of twenty percent when we signed the contract. | - | c: pay a deposit; a non-refundable deposit
      terms | the conditions of an agreement or contract | n pl | Please read the terms carefully before you sign. | - | c: payment terms; terms and conditions; on good terms
      counteroffer | an offer that you make in reply to someone else's offer | n | The buyer rejected our price and made a counteroffer. | - | n: Also spelled counter-offer.
      non-negotiable | not able to be changed by discussion | adj | The deadline is non-negotiable, I'm afraid. | -
      drive a hard bargain | to negotiate very firmly so that you get what you want | expr | You drive a hard bargain, but I accept. | -
      concession | something that you agree to give up in order to reach an agreement | n | We'll make one concession: free delivery. | - | c: make a concession
      win-win | good for everyone involved | adj | A longer deadline and a lower fee is a win-win solution. | - | c: a win-win situation
      figure | an amount of money, expressed as a number | n | Do you have a figure in mind? | - | c: a ballpark figure (rough estimate)
    grammar:
      title: Conditional language for negotiating
      body: |
        Negotiators use conditional linkers to make an offer **depend on** something. These linkers are followed by the **present** when the offer is real, even if the meaning is future.

        - **provided (that) / providing (that)** — only if: *I'll accept, **provided that** you pay a deposit.*
        - **as long as / so long as** — only if (a little less formal): *Eight weeks is fine, **as long as** the first designs are ready in March.*
        - **on condition that** — formal and strict: *We'll sign **on condition that** the price includes revisions.*
        - **unless** — if not: *We can't start **unless** we receive a deposit.* Don't add another negative after unless.

        To make a **tentative proposal** that the other person can easily refuse, use the past after **supposing / suppose / what if**, or a second conditional: ***Supposing we reduced** the order, could you lower the price? **What if we gave** you more time? **Would you be willing to** lower the fee **if** we extended the deadline?* The past form makes the idea sound hypothetical and less pushy.
      table: |
        Linker | Meaning | Example
        provided (that) | only if | We'll deliver free, provided that you order fifty boxes.
        as long as | only if | You can pay later, as long as you sign today.
        on condition that | only if (formal) | We agree on condition that the price is fixed for a year.
        unless | if not | The offer expires unless you accept by Friday.
        supposing / what if + past | a hypothetical idea | What if we split the cost?
      examples: |
        I could lower my fee, provided that I have eight weeks instead of five. | | provided that + present
        The rent stays the same as long as you sign a two-year lease. | | as long as + present
        Unless the changes are major, revisions are included. | | unless = if … not
        Supposing we ordered twice as many, would you offer a discount? | | supposing + past: a tentative proposal
      tip: |
        Don't use will after these linkers for a future condition: "provided that you pay" (not "provided that you will pay").
    dialogue:
      title: Six designs, eight weeks
      setting: A video call. Yasmin, a freelance designer in Manchester, England, is negotiating with Daniel, the owner of a small tea company in Edinburgh, Scotland, about designing packaging for six new teas.
      speakers: Y=Yasmin/f; D=Daniel/m
      lines: |
        D: Thanks for the proposal, Yasmin. We love your ideas, but to be honest, the fee is a bit beyond our budget.
        Y: I understand. Could you tell me roughly what figure you had in mind?
        D: We were hoping to stay under four thousand pounds, including all six packaging designs.
        Y: That would be difficult for six designs. Supposing we reduced the number to four?
        D: I'm afraid we really need all six. Would you be willing to lower your fee if we gave you more time?
        Y: I could come down to four and a half thousand, provided that I have eight weeks instead of five.
        D: Eight weeks is fine, as long as the first two designs are ready for the trade fair in March.
        Y: That shouldn't be a problem. I'd also need a deposit of half the fee before I start.
        D: We'd agree to that on condition that the price includes two rounds of revisions.
        Y: Two rounds are fine — unless you ask for major changes, which I'd charge separately.
        D: That seems fair. Could we meet halfway on the fee and say four thousand two hundred and fifty?
        Y: You drive a hard bargain, Daniel! All right, it's a deal. Send me the contract and I'll sign it.
    pronunciation:
      title: Sounding tentative and polite
      body: |
        In negotiations, intonation shows whether you are making a firm demand or a flexible suggestion. Tentative proposals usually **rise** at the end or use a **fall-rise**, which invites the other person to respond: *Supposing we reduced the number to ↗four?*

        Firm limits **fall** clearly at the end: *I'm afraid the deadline is ↘non-negotiable.* A flat or falling tone on a proposal can sound like an ultimatum. Listen and repeat, paying attention to where your voice goes up and down.
      items: |
        Supposing we reduced the number?
        What if we split the difference?
        Would you be willing to lower the fee?
        Provided that I have eight weeks.
        I'm afraid that's non-negotiable.
        You've got a deal.
    culture:
      title: Direct or indirect?
      body: |
        Negotiating styles vary across English-speaking business cultures. British negotiators often soften demands (*We were hoping for something a little lower*) and use understatement, while many American negotiators are more direct about figures. Both value politeness and dislike aggressive pressure.

        A common approach is to separate the people from the problem: be warm and friendly with the person, and firm about the terms.
    mistakes: |
      We'll sign provided that you will deliver by March. => We'll sign provided that you deliver by March. | After provided that, as long as and unless, use the present for a future condition.
      Unless you don't pay a deposit, I can't start. => Unless you pay a deposit, I can't start. | Unless already means "if not", so the verb after it is positive.
      We agree on condition you to include two revisions. => We agree on condition that you include two revisions. | On condition that is followed by a full clause (subject + verb).
    task:
      title: Strike a deal
      mode: interaction
      body: |
        Role-play a negotiation with a partner. Choose one situation: a freelancer and a client agreeing a fee and deadline, a tenant and a landlord discussing rent and repairs, or two colleagues sharing an unpopular task. Before you start, decide your ideal outcome, your limit and one concession you are willing to make. Use at least four conditional linkers and reach a compromise. Then practice negotiating a project budget with the AI coach in the "Taking part in a business meeting" scenario.
    exercises: |
      fill: I'll accept your offer ___ you include free delivery. || provided / providing / provided that / providing that / as long as / so long as / on condition that / if || Provided (that), as long as and on condition that all mean "only if". || @tags en.conditionals
      fill: I won't sign the contract ___ the payment terms change. (= if they don't change) || unless || Unless = if not. || @tags en.conditionals
      mc: Which request is the most tentative and polite? || We want a bigger discount. | *Would you be willing to offer a discount if we ordered more? | Give us a discount, or we'll go elsewhere. || Would you be willing to… if…? is a hypothetical proposal that sounds flexible. The others sound like demands or threats. || @tags en.conditionals,en.register
      mc: "Supposing we ___ the order, could you lower the price?" || *doubled | will double | would double || Supposing + past simple makes a hypothetical proposal. Will and would aren't used after supposing. || @tags en.conditionals
      rw: Rewrite with "unless" :: If you don't sign by Friday, the offer will expire. || Unless you sign by Friday, the offer will expire. | The offer will expire unless you sign by Friday. || Unless = if not, so the verb becomes positive: sign. || @tags en.conditionals
      rw: Rewrite with "as long as" :: We'll agree to the price, but only if you deliver by June. || We'll agree to the price as long as you deliver by June. | As long as you deliver by June, we'll agree to the price. | We will agree to the price as long as you deliver by June. || As long as = only if, followed by the present. || @tags en.conditionals
      match: Could you tell me what figure you had in mind? = asking for the other side's position ; Supposing we reduced the order? = making a hypothetical proposal ; I'm afraid that's non-negotiable. = refusing to compromise ; Let's meet halfway. = suggesting a compromise ; You've got a deal. = accepting the terms || Each phrase is matched with its function in a negotiation. || @hint Match each phrase with what it does. @skill speaking @tags en.register
      tf: Yasmin agrees to design only four packages. || false || Daniel says, "we really need all six," and the final deal is for six designs. || @ctx dialogue
      short: What does Daniel need to have ready for the trade fair in March? || kw: two/first & design/designs || "As long as the first two designs are ready for the trade fair in March." || @ctx dialogue
      listen: @dialogue || What final fee do Yasmin and Daniel agree on? || Four thousand pounds | *Four thousand two hundred and fifty pounds | Four and a half thousand pounds || Daniel suggests meeting halfway at four thousand two hundred and fifty, and Yasmin accepts. || @tags en.listening
      listen: We can offer you the flat for eleven hundred a month, as long as you sign a two-year lease. Otherwise, it's twelve hundred. || What happens if the tenant only signs for one year? || *The rent is higher. | The rent is lower. | They can't rent the flat. || The lower rent depends on a two-year lease; otherwise the rent is twelve hundred. || @tags en.listening,en.conditionals
      order: I could lower the price provided that you pay in advance. || @tags en.conditionals
      dict: We'd be willing to compromise on the deadline, but the budget is non-negotiable. || would be willing to…
      ask: You want to buy a secondhand sofa advertised for four hundred dollars. Make a counteroffer with a condition, then respond when the seller says no. || kw: provided/providing/as long as/on condition/if/supposing/what if & would/could/willing/meet halfway/compromise/offer || Would you take three hundred, provided that I collect it myself this weekend? … OK, I understand. What if we met halfway at three hundred and fifty, and I paid in cash today?
      write: Write an email (90–110 words) to a supplier or a landlord. Thank them for their offer, explain which terms you can't accept and make a conditional counteroffer. || min=80 || req: provided/providing/as long as/on condition that/unless | would/could || Dear Ms. Patel, Thank you for your quote for the office furniture. We are very happy with the designs, but unfortunately the total price is above our budget. Would you be willing to offer a ten percent discount, provided that we order all forty chairs at once? We would also be able to pay half of the cost in advance, as long as delivery is guaranteed by the end of May. Unless the delivery date is confirmed, we would need to look at other options. I look forward to hearing from you. Kind regards, Tom Abebe

  - title: Consumer society
    summary: Talk about shopping habits, impulse buying and throwaway culture, and connect past choices with present results using mixed conditionals.
    minutes: 50
    skills: [vocabulary, grammar, writing]
    tags: [en.mixed-conditionals, en.conditionals, en.vocabulary]
    objectives:
      - Talk about consumer habits, advertising pressure and ethical shopping
      - Use mixed conditionals to connect a past condition with a present result
      - Use mixed conditionals to explain past actions with present characteristics
    intro: |
      We buy more things than any previous generation — and throw more away. Talking about consumer habits often means connecting the past and the present: *If I hadn't bought that car, I'd have more money now.* In this lesson you will learn vocabulary for shopping, waste and ethical choices, and use **mixed conditionals**, which combine the second and third conditionals to link different times.
    vocab: |
      consumerism | a way of life in which buying things is considered very important | n | Some people celebrate the holidays without consumerism, by making gifts. | - | n: Consumer = a person who buys goods or services.
      impulse buy | something you buy suddenly, without planning to | n phr | The hat was an impulse buy — I've never worn it. | - | n: Also: buy something on impulse.
      fast fashion | cheap, fashionable clothes that are produced quickly and often thrown away soon | n phr | Fast fashion creates huge amounts of textile waste. | -
      secondhand | already owned or used by someone else | adj | All the furniture in our flat is secondhand. | - | n: Also spelled second-hand.
      throwaway culture | a society in which people throw things away instead of repairing or reusing them | n phr | Cheap electronics feed our throwaway culture. | -
      subscription | money you pay regularly to receive a service or product | n | I forgot to cancel my free trial, and now I'm paying for a subscription. | - | c: cancel a subscription; a monthly subscription
      splash out (on) | to spend a lot of money on something, especially something you don't need | phr v | We splashed out on a fancy dinner for our anniversary. | - | n: Informal, mainly British.
      materialistic | believing that money and possessions are the most important things in life | adj | I don't think wanting a nice home makes you materialistic. | -
      ethical | morally right, especially in how products are made or sold | adj | They only buy from ethical brands that pay workers fairly. | - | c: ethical shopping; an ethical choice
      durable | able to last a long time without breaking | adj | It's more expensive, but it's far more durable. | -
      cut back on | to reduce the amount of something that you use or buy | phr v | I'm trying to cut back on takeaways. | -
      wasteful | using more of something than necessary | adj | Buying bottled water when tap water is safe seems wasteful to me. | -
      miss out (on) | to lose the chance to do or have something good | phr v | Ads try to make you feel you're missing out. | - | n: FOMO = fear of missing out (informal).
    grammar:
      title: Mixed conditionals
      body: |
        A **mixed conditional** combines two different times in one imagined situation. There are two common patterns.

        **1. Past condition → present result.** A past action (that didn't happen) would change the present. Use **if + past perfect**, then **would + base form**: *If I **hadn't spent** so much last year, I **would have** more savings now.* (Reality: I spent a lot, so I don't have much now.)

        **2. Present situation → past result.** A permanent quality or present fact explains a past action. Use **if + past simple**, then **would have + past participle**: *If I **weren't** so impulsive, I **wouldn't have bought** that jacket.* (Reality: I am impulsive, so I bought it.)

        Time expressions such as *now*, *today*, *last year* and *yesterday* make the times clear. As in the second conditional, *were* is common for all persons in the if-clause (*If she were…*), although *was* is also used in everyday speech.

        You can also use **could** or **might** in the result: *If I'd learned to sew, I **could** repair my own clothes now.*
      table: |
        Pattern | If-clause | Result | Example
        Past → present | had + past participle | would + base form | If I had saved, I would be richer now.
        Present → past | past simple | would have + past participle | If I were more careful, I wouldn't have lost my wallet.
        (Compare) third | had + past participle | would have + past participle | If I had saved, I would have bought a car.
        (Compare) second | past simple | would + base form | If I were richer, I would buy a car.
      examples: |
        If I hadn't canceled those subscriptions, I would still be paying for them. | | past → present (would + be + -ing)
        If she weren't so careful with money, she wouldn't have saved enough for a deposit. | | present → past
        We'd have more space now if we hadn't bought so much furniture. | | result clause first
        If I'd read the reviews, I wouldn't own such a useless gadget. | | 'd = had
      tip: |
        Ask two questions: When is the condition? When is the result? If the answers are different times, you need a mixed conditional.
    dialogue:
      title: The no-buy year
      setting: A shared flat in Dublin, Ireland. Grace, a nurse, is seven months into a "no-buy year" — she has promised herself not to buy anything new except essentials. Her flatmate Malik has just opened another delivery.
      speakers: G=Grace/f; M=Malik/m
      lines: |
        G: Another parcel? That's the third one this week, Malik. What did you buy this time?
        M: A smart water bottle that reminds you to drink. If I weren't so forgetful, I wouldn't have bought it.
        G: To be fair, if I hadn't started my no-buy year, I'd have a wardrobe full of clothes I never wear.
        M: How long have you been doing it now? It sounds exhausting.
        G: Seven months. Honestly, I'd be a lot poorer now if I hadn't stopped shopping online every evening.
        M: I admire that, but I'd find it really hard. All those ads make me feel I'm missing out.
        G: That's exactly what they're designed to do. They're very good at turning wants into needs.
        M: Fair enough. If I weren't such an easy target, I wouldn't have signed up for four streaming services either.
        G: Four! If you'd canceled two of them last year, you'd have enough money for a weekend away now.
        M: All right, you've convinced me. I'll cancel two tonight, and maybe I'll sell the bottle online.
        G: Why not just use it? Buying something and getting rid of it straight away is wasteful too.
        M: Good point. I'll keep it — and next time, I'll read the reviews before I click "buy."
    pronunciation:
      title: "Weak forms: I'd be, I'd have, wouldn't have"
      body: |
        In mixed conditionals, the contracted forms often run together. *I would be* becomes "aid-bee", and *I wouldn't have* becomes "ai-WUD-ənt-əv", with stress on the negative.

        Compare the two patterns by their rhythm: *I'd BE RICHer NOW* (present result) and *I WOULDn't have BOUGHT it* (past result). The extra weak syllable "əv" is the signal of the past. Listen and repeat.
      items: |
        I'd be a lot poorer now.
        I wouldn't have bought it.
        If I weren't so forgetful
        If I hadn't started
        You'd have enough money.
        I'd still be paying for it.
    mistakes: |
      If I didn't buy that car last year, I would have more money now. => If I hadn't bought that car last year, I would have more money now. | The condition is in the past (last year), so use the past perfect.
      If I hadn't spent all my savings, I would have been rich now. => If I hadn't spent all my savings, I would be rich now. | The result is in the present (now), so use would + base form.
      If I would be less impulsive, I wouldn't have bought it. => If I were less impulsive, I wouldn't have bought it. | Don't use would in the if-clause. Use the past simple (were).
    task:
      title: Buyer's remorse
      mode: writing
      body: |
        Write a short blog post (120–150 words) called "The best and worst things I ever bought." Describe one purchase you're glad you made and one you regret, and explain how your life would be different now. Use at least two mixed conditionals. Then practice returning an item you regret buying with the AI coach in the "Returning an item in a shop" scenario.
    exercises: |
      fill: If I ___ (not / spend) so much on clothes last year, I ___ (have) enough money for a holiday now. || hadn't spent / had not spent ; would have / 'd have || Past condition (last year) → present result (now): if + past perfect, would + base form. || @tags en.mixed-conditionals
      fill: If she ___ (be) less impulsive, she ___ (not / buy) that expensive coffee machine. || were / was ; wouldn't have bought / would not have bought || Present characteristic → past action: if + past simple, would have + past participle. || @tags en.mixed-conditionals
      mc: Which sentence connects a past action with a present result? || If I had saved more, I would have bought it. | *If I had saved more, I would own a flat now. | If I saved more, I would buy a flat. || If + past perfect (past) with would + base form (now) is a mixed conditional. The others are a third and a second conditional. || @tags en.mixed-conditionals
      mc: "If Ravi weren't so trusting, he wouldn't have believed the advert." What do we know? || *Ravi is a trusting person, and he believed the advert. | Ravi isn't trusting, and he didn't believe the advert. | Ravi was trusting in the past, but he isn't now. || Reverse each clause: he is trusting (present), so he believed the advert (past). || @tags en.mixed-conditionals
      fill: If we hadn't moved to the countryside, we ___ (still / pay) a fortune in rent. || would still be paying / 'd still be paying || A past action (hadn't moved) with a present result in progress: would + still + be + -ing. || @tags en.mixed-conditionals
      rw: Combine into one mixed conditional sentence :: I didn't read the reviews. Now I own a useless gadget. || If I had read the reviews, I wouldn't own a useless gadget. | If I had read the reviews, I wouldn't own a useless gadget now. | If I'd read the reviews, I wouldn't own a useless gadget. | If I'd read the reviews, I wouldn't own a useless gadget now. | I wouldn't own a useless gadget if I had read the reviews. || Past condition → if + past perfect; present result → would + base form. || @tags en.mixed-conditionals
      rw: Combine into one mixed conditional sentence :: I'm not good at saying no. That's why I bought the extended warranty. || If I were good at saying no, I wouldn't have bought the extended warranty. | If I was good at saying no, I wouldn't have bought the extended warranty. | I wouldn't have bought the extended warranty if I were good at saying no. | I wouldn't have bought the extended warranty if I was good at saying no. || Present quality → if + past simple; past action → would have + past participle. || @tags en.mixed-conditionals
      match: splash out = on a designer coat ; cut back = on takeaways ; impulse = buy ; fast = fashion ; throwaway = culture || Common expressions: splash out on, cut back on, impulse buy, fast fashion, throwaway culture. || @hint Match the words to make common expressions. @skill vocabulary @tags en.collocations
      tf: Grace has been on her no-buy year for seven months. || true || Grace says, "Seven months." || @ctx dialogue
      short: How many streaming services has Malik signed up for? || kw: four/4 || Malik says he signed up for "four streaming services." || @ctx dialogue
      listen: @dialogue || What does Malik decide to do with the water bottle? || Sell it online | Give it to Grace | *Keep it and use it || After Grace's comment, Malik says, "I'll keep it." || @tags en.listening
      listen: If I hadn't bought a secondhand car, I'd still be paying off a loan. It isn't pretty, but it gets me to work. || Why is the speaker glad they bought this car? || *They don't have a loan to pay off now. | It looks very nice. | It was brand new and reliable. || "If I hadn't bought a secondhand car, I'd still be paying off a loan." || @tags en.listening,en.mixed-conditionals
      order: If I weren't so impatient, I wouldn't have paid for express delivery. || @tags en.mixed-conditionals
      dict: We would have more space now if we hadn't bought so much furniture. || mixed conditional: past → present
      ask: Think of something you bought that you regret, or that you're glad you bought. How would your life be different now if you hadn't bought it? || kw: if I had/if I hadn't/if I'd & would/wouldn't/I'd || If I hadn't bought my bike three years ago, I'd still be taking two buses to work every day. I'd also be less fit, and I'd probably spend much more on transport.
      write: Write a paragraph (100–120 words) about a change in your shopping habits. Use at least two mixed conditionals. || min=90 || req: if/had/hadn't/were/weren't | would/wouldn't/I'd || Two years ago, I realized that I was buying clothes almost every week, mostly on impulse. Since then, I've bought nearly everything secondhand. If I hadn't changed my habits, I would have a wardrobe full of things I never wear, and I'd have much less money in the bank. I'm also more creative now: if I hadn't started mending my own clothes, I wouldn't know how to use a sewing machine. Of course, I'm not perfect. If I weren't so easily tempted by sales, I wouldn't have bought three pairs of boots last winter. Still, I feel more in control.
