      mc: Which concern do some critics raise? || The tests are too slow. | *The scheme could make waiting lists longer. | Only people under forty can take part. || Critics warn of "longer waiting lists if large numbers of people are referred for further tests." || @ctx reading @skill reading @tags en.reading
      fill: I can't read the menu without my glasses anymore. I need to ___ my eyes ___. || have / get ; tested / checked / examined || have/get + object + past participle: an optician will do it. || @tags en.causative
      fill: I ___ my wallet ___ (steal) in the hospital car park yesterday. || had / got ; stolen || have/get + object + past participle can describe something unpleasant that someone did to you. || @tags en.causative
      rw: Rewrite using "have" :: A dentist is going to remove two of my teeth next week. || I'm going to have two of my teeth removed next week. | I'm going to have two teeth removed next week. | I'm having two of my teeth removed next week. | I'm having two teeth removed next week. | I am going to have two of my teeth removed next week. | I am having two of my teeth removed next week. || have + object (two teeth) + past participle (removed). || @tags en.causative
      rw: Rewrite using "get" :: A nurse vaccinated me before my trip to Ghana. || I got vaccinated before my trip to Ghana. | I got myself vaccinated before my trip to Ghana. | I got vaccinated by a nurse before my trip to Ghana. || Get + past participle (got vaccinated) describes something done to you. || @tags en.causative
      mc: In which sentence did someone else do the action? || I cut my hair yesterday. | *I had my hair cut yesterday. | I had cut my hair before the party. || Had + object + past participle = someone else did it. "I had cut my hair" is the past perfect: I did it myself. || @tags en.causative,en.past-perfect
      mc: "That cough has lasted three weeks. You should get it ___." || *checked out | check out | to check out || Get + object + past participle: get it checked out. || @tags en.causative
      listen: I finally got my hearing tested last month. It turns out I don't need a hearing aid at all — I just needed to have my ears cleaned! || What was the cause of the speaker's hearing problem? || They needed a hearing aid. | *Their ears needed cleaning. | They had an ear infection. || "I don't need a hearing aid at all — I just needed to have my ears cleaned!" || @tags en.listening,en.causative
      order: You should have your blood pressure checked every year. || @tags en.causative
      dict: Many people don't know they have high blood pressure because it rarely causes symptoms. || rarely + present simple
      ask: A friend tells you they've had headaches every day for two weeks. Give advice using have/get something done. || kw: should/ought to/why don't you/I'd/I would/you need to & have/get & checked/tested/examined/looked at/seen || You should get that checked out. Why don't you have your eyes tested? Headaches are sometimes caused by needing glasses. And I'd get your blood pressure checked at the pharmacy too.
      write: Write a short news report (90–110 words) about a health service or scheme in your town, real or imagined. Say what is offered, what people can have done and what one person said about it. || min=80 || req: have/has/had/get/got & checked/tested/done/measured/examined/vaccinated | said/says/explained/according to || A new mobile health unit has started visiting villages in our region every Tuesday. Residents can have their eyes tested, get their blood sugar measured and have vaccinations done without traveling to the city hospital. The service was introduced after a study found that many older people were missing check-ups because of the long journey. "I had my eyes tested for the first time in six years," said Marta Lis, a seventy-two-year-old farmer. "Now I've got new glasses, and I can read the newspaper again." Organizers hope to add dental checks next year.
