unit: 6
title: The art of expression
theme: Arts and culture
description: Describe and interpret works of art, read about how a community saved a disappearing tradition, and talk about what makes things funny, using participle clauses, inversion after negative adverbials and emphatic structures.
free: false
objectives:
  - Describe and interpret works of art concisely using participle clauses
  - Discuss how cultural heritage is lost, preserved and revived, using inversion for emphasis
  - Talk about humor and wordplay, and add emphasis with emphatic do and inversion with so and such
canDo:
  - I can describe a painting, sculpture or installation and explain what it makes me feel.
  - I can understand a feature article about cultural heritage and discuss how traditions can be protected.
  - I can explain why a joke is funny, or why it falls flat, and recognize puns, sarcasm and irony.
  - I can write descriptive and persuasive texts in a more sophisticated style.
review: |
  fill: ___ (carve) from a single block of stone, the statue took eleven years to complete. || Carved || A past participle clause has a passive meaning: the statue was carved. || @tags en.verb-forms,en.passive
  fill: ___ (live) in Paris for twenty years, the artist spoke French like a native. || Having lived || Having + past participle shows an action that happened before the main one (and continued up to that time). || @tags en.verb-forms
  mc: Which sentence is correct? || Walking into the museum, the paintings impressed me. | *Walking into the museum, I was impressed by the paintings. | Walked into the museum, I was impressed by the paintings. || The subject of the main clause (I) must be the person doing the walking. || @tags en.verb-forms
  rw: Rewrite beginning "Never before" :: The town had never received so many visitors. || Never before had the town received so many visitors. || Negative adverbial + auxiliary + subject + verb. || @tags en.adverbs,en.register
  rw: Rewrite beginning "Not only" :: The workshop restored the old looms and also trained twenty apprentices. || Not only did the workshop restore the old looms, but it also trained twenty apprentices. | Not only did the workshop restore the old looms but it also trained twenty apprentices. | Not only did the workshop restore the old looms, but it trained twenty apprentices too. || Not only + did + subject + base form…, but (also)… || @tags en.adverbs,en.register
  fill: Only when the theater closed ___ people realize how much they had loved it. || did || After Only when + clause, the main clause is inverted: did + subject + base form. || @tags en.adverbs,en.register
  fill: I know it doesn't look like it, but I ___ enjoy the concert last night! || did || Emphatic did + base form contradicts what someone thinks. || @tags en.verb-forms
  mc: So funny ___ that the audience couldn't stop laughing. || the film was | *was the film | did the film || After so + adjective at the start, invert be and the subject: so funny was the film. || @tags en.adverbs,en.register
  listen: Having been closed for almost a century, the old bathhouse reopened last spring, restored to look exactly as it did in eighteen ninety. || What happened last spring? || The bathhouse closed. | *The bathhouse reopened after restoration. | The bathhouse was demolished. || "The old bathhouse reopened last spring, restored to look exactly as it did in eighteen ninety." || @tags en.listening,en.verb-forms
  listen: The joke only works in English, because "a light meal" can mean food that isn't heavy or a meal that weighs very little. || Why does the joke only work in English? || It's about a British custom. | *It depends on a phrase with two meanings. | It uses a famous person's name. || It's a play on words: the phrase has two meanings in English. || @tags en.listening,en.vocabulary
  ask: Describe a work of art, a building or a performance that impressed you. Explain what it looks or sounds like and how it made you feel, using at least two participle clauses. || kw: painted/built/made/designed/written/created/having/standing/looking/sitting/seen/located/known & feel/felt/moving/striking/beautiful/impressed/powerful || Built in the twelfth century, the cathedral in my town looks enormous from the square. Standing inside it, you feel very small, because the ceiling seems to disappear into the dark. Having visited it many times, I still find the colors of the windows incredibly moving, especially in the evening light.
  write: Write a paragraph (100–120 words) for a tourist website about a cultural tradition or heritage site in your region. Use at least two participle clauses and one inversion. || min=90 || req: built/made/founded/painted/known/located/having/held/celebrated/dating | never/not only/rarely/only when/only after/seldom/little/no sooner || Held every August since the fourteenth century, the Lantern Festival is the highlight of our town's year. Made by hand from paper and bamboo, more than a thousand lanterns are carried through the old streets on the last night. Not only do the lanterns light up the river, but they also carry wishes written by local children. Having almost disappeared in the nineteen seventies, the festival was revived by a group of teachers, and it now attracts visitors from all over the country. Rarely will you see the town so crowded — or so beautiful. Arrive early to find a place by the bridge.
lessons:
  - title: Talking about art
    summary: Describe and interpret paintings, sculptures and installations, and express your reactions, using participle clauses to give information concisely.
    minutes: 50
    skills: [vocabulary, grammar, speaking]
    tags: [en.verb-forms, en.vocabulary, en.word-stress]
    objectives:
      - Describe and interpret art with precise vocabulary
      - Use present, past and perfect participle clauses
      - Shorten relative clauses with participles (the man sitting…, a painting stolen in…)
    intro: |
      "I don't know much about art, but I know what I like." Many people feel this way — but describing *why* you like something is a skill you can learn. Gallery guides, critics and reviews use **participle clauses** to pack a lot of information into one elegant sentence: *Painted in just three days, the work…* In this lesson you will learn the vocabulary of art and use participle clauses to describe and interpret what you see.
    vocab: |
      abstract | showing shapes, colors and lines instead of real people or things | adj | I prefer abstract art to portraits. | - | n: Opposite: figurative.
      contemporary | belonging to the present time | adj | The museum specializes in contemporary art. | -
      exhibition | a public show of paintings, objects or photographs | n | The exhibition runs until the end of March. | - | c: a solo exhibition; hold/put on an exhibition
      installation | a work of art made of several objects or materials arranged in a space | n | The installation fills an entire room with hanging threads. | -
      masterpiece | an extremely good work of art, or the best work of an artist | n | Many critics consider it her masterpiece. | -
      canvas | strong cloth that artists paint on, or the painting itself | n | The canvas is almost four meters wide. | - | c: oil on canvas
      brushstroke | a mark made by a paintbrush on a surface | n | You can see every brushstroke if you stand close. | -
      evoke | to bring a memory, feeling or image into your mind | v | The colors evoke a hot summer afternoon. | -
      interpret | to explain or decide what the meaning of something is | v | The painting can be interpreted in many ways. | - | n: Noun: interpretation.
      provocative | intended to make people angry or to make them think and argue | adj | Her early work was deliberately provocative. | -
      striking | very noticeable or attractive in an unusual way | adj | There's a striking contrast between the dark background and the bright figure. | -
      moving | making you feel strong emotions, especially sadness or sympathy | adj | It's a deeply moving portrait of the artist's mother. | - | c: deeply moving
      subtle | not obvious; small but important | adj | There's a subtle change of color from left to right. | -
    grammar:
      title: Participle clauses
      body: |
        A **participle clause** replaces a longer clause with a participle. It makes descriptions shorter and more elegant, and it is very common in written English.

        - **Present participle (-ing)** — an active meaning, often at the same time as the main verb: ***Sitting** close to it, you feel surrounded by color.* (= When you sit close to it…)
        - **Past participle** — a **passive** meaning: ***Painted** with dozens of thin layers, the blue seems to change.* (= Because it is painted…)
        - **Perfect participle (having + past participle)** — an action that happened **before** the main one: ***Having trained** as an architect, she thinks about space.*
        - **Negative**: put *not* first: ***Not knowing** what it meant, I invented my own story.*

        Participles can also shorten **relative clauses**: *the man (who is) **sitting** on the floor*, *a painting (that was) **stolen** in 1911*.

        The subject of the participle must be the **same** as the subject of the main clause. *~~Walking into the room, the paintings amazed me~~* is wrong, because the paintings weren't walking.
      table: |
        Type | Example | Meaning
        Present participle | Standing in front of it, I felt tiny. | When I stood…
        Past participle | Seen from below, it looks enormous. | When it is seen…
        Perfect participle | Having seen the original, I was disappointed by the copy. | After I had seen…
        Negative | Not knowing the title, I guessed. | Because I didn't know…
        Reduced relative | The woman wearing the red coat is the artist. | who is wearing
      examples: |
        Painted in just three days, the portrait is now worth millions. | | past participle: passive meaning
        Born in Budapest, she moved to Glasgow in her twenties. | | past participle with born
        Having trained as an architect, she's more interested in space than in stories. | | perfect participle: earlier action
        Who's that man sitting on the floor in front of it? | | reduced relative clause
      tip: |
        To check a participle clause, ask "Who or what is doing this?" The answer must be the subject of the main clause.
    dialogue:
      title: Just blue squares?
      setting: A gallery of contemporary art in Glasgow, Scotland. Aisha, an art student, has brought her uncle Bernard to see a large abstract painting by Ines Varga, a fictional artist that everyone in the city is talking about.
      speakers: A=Aisha/f; B=Bernard/m
      lines: |
        B: So this is the famous one? Honestly, Aisha, it looks like a few blue squares painted by a child.
        A: Look closer. Painted with dozens of thin layers, the blue changes depending on where you stand.
        B: Hmm. You're right — it's almost purple from here. Who's the artist?
        A: A woman called Ines Varga. Born in Budapest, she moved to Glasgow in her twenties and has lived here ever since.
        B: And what's it supposed to mean? There's no title, just a number.
        A: She refuses to explain her work. Having trained as an architect, she's more interested in space and light than in stories.
        B: That explains the empty walls around it, I suppose. Wait — who's that man sitting on the floor in front of it?
        A: He's probably doing exactly what she wants. Sitting close to it, you feel completely surrounded by the color.
        B: Let me try… All right, I admit it. Seen from down here, it's actually quite moving.
        A: See? Not knowing what it means is part of the experience. You bring your own meaning to it.
        B: Maybe. But having paid twenty pounds for a ticket, I'd still like a little explanation!
        A: Then let's go to the talk at three. Organized by the gallery, it's free for visitors.
    pronunciation:
      title: Word stress in art vocabulary
      body: |
        Art vocabulary includes many long words where the stress is easy to misplace. Notice: con**TEM**porary, exhi**BI**tion, insta**LLA**tion, pro**VO**cative, in**TER**pret, **MAS**terpiece.

        Words ending in **-tion** are always stressed on the syllable before the ending. And in **contemporary**, the middle syllables are very weak: "kən-TEM-pə-rə-ree." Listen and repeat.
      items: |
        contemporary
        exhibition
        installation
        provocative
        interpret
        masterpiece
    mistakes: |
      Walking into the gallery, the paintings amazed me. => Walking into the gallery, I was amazed by the paintings. | The subject of the main clause must be the one doing the action in the participle clause.
      Painting in 1889, the picture shows a starry night. => Painted in 1889, the picture shows a starry night. | The picture was painted (passive meaning), so use the past participle.
      Having finish the course, she opened a studio. => Having finished the course, she opened a studio. | The perfect participle is having + past participle (finished).
    task:
      title: Be the guide
      mode: speaking
      body: |
        Choose a work of art you love (a painting, a sculpture, a building, a photograph or a street mural). Prepare a ninety-second "audio guide" for visitors: who made it and when, what it shows, what techniques or materials were used, how it can be interpreted and how it makes you feel. Use at least four participle clauses. Then talk about your favorite artists and why you like them with the AI coach in the "Discussing hobbies" scenario.
    exercises: |
      fill: ___ (paint) in just three days, the portrait is now worth millions. || Painted || The portrait was painted: a passive meaning, so use the past participle. || @tags en.verb-forms,en.passive
      fill: ___ (study) architecture first, she sees every painting as a space. || Having studied || Having + past participle for an action that came before the main one. || @tags en.verb-forms
      mc: Which sentence is correct? || Walking through the gallery, the colors amazed us. | *Walking through the gallery, we were amazed by the colors. | Walked through the gallery, we were amazed by the colors. || The subject (we) must be the one walking, and walking is active, so use -ing. || @tags en.verb-forms
      mc: ___ the original in Madrid, I found the copy disappointing. || *Having seen | Seen | Having been seen || Having seen = after I had seen. Seen and having been seen are passive and would mean that I was seen. || @tags en.verb-forms
      rw: Join the sentences with a participle clause :: The statue was carved from a single block of marble. It weighs six tons. || Carved from a single block of marble, the statue weighs six tons. | The statue, carved from a single block of marble, weighs six tons. || The statue was carved (passive), so start with the past participle. || @tags en.verb-forms,en.passive
      rw: Rewrite with a participle clause :: Because she didn't know what the painting meant, she invented her own story. || Not knowing what the painting meant, she invented her own story. || Negative participle clause: not + -ing. || @tags en.verb-forms
      rw: Shorten the relative clause :: The paintings that are displayed in this room were all stolen in the 1990s. || The paintings displayed in this room were all stolen in the 1990s. || That are displayed → displayed (a past participle with passive meaning). || @tags en.verb-forms,en.relative-clauses
      match: abstract = art ; oil = on canvas ; work = of art ; bold = brushstrokes ; solo = exhibition || Common collocations: abstract art, oil on canvas, a work of art, bold brushstrokes, a solo exhibition. || @hint Match the words to make common expressions. @skill vocabulary @tags en.collocations
      tf: Ines Varga trained as an architect. || true || Aisha says, "Having trained as an architect, she's more interested in space and light." || @ctx dialogue
      short: Where is Bernard when he finally finds the painting moving? || kw: floor/down/ground/sitting || He sits on the floor like the other man: "Seen from down here, it's actually quite moving." || @ctx dialogue
      listen: @dialogue || What do Aisha and Bernard decide to do next? || Buy a print of the painting | Leave the gallery | *Go to a free talk at three o'clock || "Let's go to the talk at three. Organized by the gallery, it's free for visitors." || @tags en.listening
      listen: Painted when the artist was over eighty, these late works are full of energy, using brighter colors than anything she had produced before. || What is surprising about the artist's late works? || They're darker and sadder. | *They're brighter and more energetic than her earlier work. | They were painted by her students. || "Full of energy, using brighter colors than anything she had produced before." || @tags en.listening,en.verb-forms
      dict: Seen from a distance, the painting looks almost like a photograph. || past participle clause
      ask: Describe a painting, photo or sculpture you like. Say what it shows and how it makes you feel, using at least two participle clauses. || kw: painted/taken/made/created/carved/having/standing/looking/sitting/seen/known/showing/wearing & feel/moving/striking/beautiful/calm/sad/powerful/evoke/evokes || My favorite photo shows my grandparents dancing at their wedding. Taken in black and white, it looks very old-fashioned. Looking at it, I always feel happy, because they're laughing so much. Having seen it hundreds of times, I still notice new details.
      write: Write a description (90–110 words) of a work of art for an exhibition guide. Use at least three participle clauses. || min=80 || req: painted/made/created/built/carved/designed/born/known/seen | having/-ing/standing/showing/using/looking/sitting/wearing || Painted in 1937, this large canvas shows a busy market in Lagos. Using bright yellows and deep blues, the artist captures the heat and noise of a Saturday morning. In the center, a woman wearing a green headscarf is laughing as she sells mangoes. Having grown up near the market, the artist knew many of the people she painted, and their faces are full of personality. Seen from a distance, the crowd seems to move. Look closely at the bottom corner: hidden among the baskets is a tiny self-portrait of the artist as a child.

  - title: Cultural heritage
    summary: Read a feature article about a village that saved a disappearing craft, discuss how heritage can be protected, and add emphasis in formal writing with inversion after negative and limiting adverbials.
    minutes: 55
    skills: [reading, grammar, writing]
    tags: [en.adverbs, en.register, en.reading]
    objectives:
      - Understand a feature article about the loss and revival of a tradition
      - Use inversion after negative adverbials (Never before…, Rarely…, Little…, Under no circumstances…)
      - Use inversion with Not only…, Only when… and No sooner… than…
    intro: |
      Heritage isn't only castles and cathedrals. It's also songs, recipes, crafts and festivals — what experts call **intangible heritage** — and these can disappear within a single generation. In this lesson you will read a feature about a village that nearly lost its weaving tradition, and learn **inversion**, a formal structure that writers and speakers use to add drama and emphasis: *Never before had the village seen so many visitors.*
    vocab: |
      intangible heritage | traditions, skills, music and knowledge that are passed on, rather than buildings or objects | n phr | The festival is recognized as part of the country's intangible heritage. | -
      craft | an activity that involves making things skillfully with your hands | n | Basket weaving is a traditional craft in the region. | - | c: a traditional craft; arts and crafts
      preserve | to keep something in its original state or in good condition | v | The town has worked hard to preserve its old buildings. | - | n: Noun: preservation.
      revive | to make something popular or active again | v | A group of young musicians revived the old songs. | - | n: Noun: revival.
      die out | to become less common and then disappear completely | phr v | The local dialect is slowly dying out. | -
      apprentice | someone who works for an expert to learn their skill | n | She started as an apprentice in a carpentry workshop. | - | n: Noun: apprenticeship.
      archive | a collection of historical records or documents, or the place where they are kept | n | The recordings are kept in a digital archive. | -
      artisan | a person who makes things skillfully by hand | n | Local artisans sell their work at the Saturday market. | -
      authentic | real and true, not a copy | adj | It's hard to find authentic souvenirs in the old town. | - | n: Noun: authenticity.
      commercialize | to use something to make money, often in a way that spoils it | v | Some people feel the festival has become too commercialized. | - | n: British spelling: commercialise.
      workshop | a room or building where things are made or repaired by hand | n | The weavers meet in an old workshop by the river. | - | n: Also: a meeting for learning a skill.
      frozen in time | not changing at all over a long period | expr | The village seems frozen in time. | -
    grammar:
      title: Inversion after negative and limiting adverbials
      body: |
        In formal or dramatic English, some negative or limiting expressions can go at the **start** of a sentence for emphasis. When they do, the **auxiliary comes before the subject**, as in a question: *I had **never** seen such skill.* → ***Never had I seen** such skill.*

        - If there is no auxiliary, use **do / does / did**: *She little knew…* → ***Little did she know**…*
        - Common expressions: **never (before), rarely, seldom, little, at no time, under no circumstances, on no account**.
        - **Not only** + inversion…, **but (also)**…: ***Not only were** the techniques complex, **but** the weavers had never explained them.*
        - **No sooner** + past perfect inversion… **than**…, and **Hardly / Scarcely**… **when**…: ***No sooner had she posted** the photos **than** messages arrived.*
        - With **Only when / Only after / Not until** + clause, the inversion is in the **main** clause: ***Only when** my grandmother became ill **did I realize**…*

        Inversion is typical of writing, speeches and storytelling. In everyday conversation, the normal word order is more natural.
      table: |
        Normal order | With inversion
        Traditions rarely disappear overnight. | Rarely do traditions disappear overnight.
        She didn't know what was coming. | Little did she know what was coming.
        The patterns will never be sold to factories. | Under no circumstances will the patterns be sold to factories.
        As soon as she posted it, messages arrived. | No sooner had she posted it than messages arrived.
        I only realized when she became ill. | Only when she became ill did I realize.
      examples: |
        Rarely does a tradition disappear overnight. | | rarely + does + subject
        Little did she know that she would spend two years learning a single pattern. | | little + did + subject
        Not only were the techniques complex, but the weavers had never had to explain them. | | not only + were + subject, but…
        No sooner had she posted the photos than messages began to arrive. | | no sooner + had + subject + past participle… than
      tip: |
        Use inversion sparingly — once or twice in a text is elegant; in every paragraph it sounds theatrical.
    reading:
      title: Threads of memory
      text: |
        For more than four hundred years, the women of Santa Lúcia, a small village in the mountains of northern Portugal, wove blankets in a pattern found nowhere else in the world. Each blanket took months to complete, and the designs, which were never written down, were passed from mother to daughter. By the early twenty-tens, however, only three weavers were still working, and the youngest of them was seventy-eight.

        Rarely does a tradition disappear overnight. In Santa Lúcia, it faded slowly, as young people left for jobs in the cities and cheap factory-made blankets filled the markets. "Nobody thought of it as heritage," says Rita Fonseca, who grew up in the village. "It was just something our grandmothers did. Only when my grandmother became ill did I realize that the patterns would die with her."

        Fonseca, then a twenty-six-year-old graphic designer, moved back to the village and asked the three remaining weavers to teach her. Little did she know that she would spend the next two years learning a single pattern. "Not only were the techniques incredibly complex," she says, "but the weavers themselves had never had to explain them. They just knew."

        No sooner had she posted photos of her first blanket online than messages began to arrive from all over the world. Designers wanted to collaborate, museums asked to borrow pieces, and — most importantly — young people from the region asked to learn. Today, the village workshop has fourteen apprentices, and the patterns have finally been recorded, stitch by stitch, in a digital archive.

        Not everyone is enthusiastic. Some older residents worry that the blankets are becoming expensive souvenirs for tourists instead of objects for everyday use. Others feel uncomfortable seeing their family designs printed on cushions sold in city boutiques. Under no circumstances, the workshop insists, will the original patterns be sold to factories, and every blanket is still made entirely by hand.

        The debate reflects a question faced by heritage projects everywhere: how can a tradition be protected without being frozen in time? Seldom is the answer simple. A craft that never changes may survive only in museums, while one that changes too much may lose what made it special.

        For Fonseca, the answer lies in people rather than objects. "A blanket in a glass case is beautiful," she says. "But a tradition is only alive while someone is still learning it." In Santa Lúcia, at least for now, someone is.
    pronunciation:
      title: Rhythm and emphasis in inverted sentences
      body: |
        Inversion is used for emphasis, so the **negative adverbial** at the start is strongly stressed, and it is often followed by a tiny pause: ***NEV**er | had I SEEN such skill.* ***LIT**tle did she KNOW…*

        In *Not only… but…* sentences, stress both **not ON**ly and **BUT**, so the listener hears the two parts of the structure. Listen and repeat.
      items: |
        Never before had I seen such skill.
        Rarely does a tradition disappear overnight.
        Little did she know.
        Not only were the techniques complex
        No sooner had she posted the photos
        Under no circumstances will they be sold.
    mistakes: |
      Never I have seen such beautiful work. => Never have I seen such beautiful work. | After a negative adverbial at the start, put the auxiliary before the subject.
      Only when she retired she realized what she had lost. => Only when she retired did she realize what she had lost. | After Only when + clause, invert the main clause: did + subject + base form.
      No sooner had we arrived when the music started. => No sooner had we arrived than the music started. | No sooner is followed by than. (Hardly and scarcely are followed by when.)
    task:
      title: Save a tradition
      mode: writing
      body: |
        Write a short feature (180–220 words) for a culture magazine about a tradition, craft, festival or dialect from your region that is disappearing or has been revived. Explain what it is, why it was in danger, what has been done and what people think about it. Use at least two inversions and two participle clauses. Then talk about a festival or tradition you love with the AI coach in the "Discussing hobbies" scenario.
    exercises: |
      mc: Why did the weaving tradition nearly disappear? || The government banned it. | *Young people moved away, and cheap factory blankets replaced handmade ones. | The weavers refused to teach anyone. || It "faded slowly, as young people left for jobs in the cities and cheap factory-made blankets filled the markets." || @ctx reading @skill reading @tags en.reading
      tf: Rita learned several different patterns in her first two years. || false || She spent "the next two years learning a single pattern." || @ctx reading @tags en.reading
      short: How many apprentices does the village workshop have today? || kw: fourteen/14 || "Today, the village workshop has fourteen apprentices." || @ctx reading @tags en.reading
      mc: What worries some older residents? || The patterns have been forgotten. | *The blankets are becoming expensive souvenirs instead of everyday objects. | Young people are not interested in weaving. || They "worry that the blankets are becoming expensive souvenirs for tourists instead of objects for everyday use." || @ctx reading @skill reading @tags en.reading
      fill: Never before ___ the village ___ (receive) so many visitors. || had ; received || Never before + had + subject + past participle. || @tags en.adverbs,en.register
      fill: Not only ___ she learn the patterns, but she also recorded every one of them. || did || Not only + did + subject + base form, when there is no other auxiliary. || @tags en.adverbs,en.register
      rw: Rewrite beginning "Rarely" :: Old crafts rarely survive without young apprentices. || Rarely do old crafts survive without young apprentices. || Rarely + do + subject + base form. || @tags en.adverbs,en.register
      rw: Rewrite beginning "No sooner" :: As soon as the museum opened, the queues began. || No sooner had the museum opened than the queues began. || No sooner + had + subject + past participle + than + past simple. || @tags en.adverbs,en.register
      rw: Rewrite beginning "Under no circumstances" :: Visitors must never touch the original blankets. || Under no circumstances must visitors touch the original blankets. | Under no circumstances should visitors touch the original blankets. | Under no circumstances may visitors touch the original blankets. || Under no circumstances + modal + subject + verb. The negative is already in the adverbial, so don't add never or not. || @tags en.adverbs,en.register
      mc: Choose the correct sentence. || Little she knew what was coming. | *Little did she know what was coming. | Little did she knew what was coming. || Little + did + subject + base form (know). || @tags en.adverbs,en.register
      listen: Not only has the old theater been beautifully restored, but it now hosts free concerts every weekend. || What has happened to the old theater? || *It has been restored and now hosts concerts. | It has been sold to a private company. | It is going to be demolished. || "Not only has the old theater been beautifully restored, but it now hosts free concerts every weekend." || @tags en.listening,en.adverbs
      order: Only when my grandmother became ill did I realize what we could lose. || @tags en.adverbs,en.register
      dict: Seldom is the answer to such a question simple. || seldom + is + subject
      ask: Talk about a tradition, craft or festival in your country that has died out, survived or been revived. Explain why, and say whether you think it should be preserved. || kw: preserve/revive/revived/die out/died out/dying out/survive/survived/protect & tradition/heritage/craft/festival/custom || In my region, there's a tradition of singing in the fields during the harvest, but it almost died out when farming became mechanized. A few years ago, a local choir revived the songs and recorded the last singers who still knew them. I think it should be preserved, because it's part of our identity.
      write: Write a paragraph (100–120 words) for a heritage website about a place or tradition that has been saved. Use at least two different inversions. || min=90 || req: never/rarely/seldom/little/not only/only when/only after/no sooner/under no circumstances | did/had/has/have/was/were/is/are/do/does/will || Built in 1850, the old covered market was almost demolished in the nineteen eighties. Only when local residents organized a petition did the council change its plans. Not only was the building saved, but it was also carefully restored, using the original iron and glass. Today, more than forty independent traders sell food, flowers and crafts there. Rarely does a single building bring so much life to a neighborhood: on Saturday mornings, it is full of families, students and tourists. Under no circumstances, the city has promised, will the market be sold to private developers. Visit early, before the best bread is gone.

  - title: Humor and wordplay
    summary: Talk about what makes things funny, recognize puns, sarcasm and irony, and add emphasis with emphatic do and inversion with so and such.
    minutes: 50
    skills: [listening, speaking, grammar]
    tags: [en.verb-forms, en.adverbs, en.intonation]
    objectives:
      - Talk about humor, jokes and wordplay with precise vocabulary
      - Use emphatic do/does/did to contradict, insist or confirm
      - Use inversion with so and such for dramatic or humorous emphasis
    intro: |
      Understanding humor is one of the last steps to real fluency. Jokes depend on double meanings, timing, tone of voice and shared culture — and a joke explained is rarely funny! In this lesson you will learn to talk about different kinds of humor and wordplay, and two ways of adding **emphasis**: emphatic **do** (*I **did** warn you!*) and **inversion with so and such** (*So nervous was I that…*), which English speakers sometimes use in a deliberately dramatic way for comic effect.
    vocab: |
      pun | a joke that uses a word or phrase with two meanings, or words that sound the same | n | "I'm reading a book about anti-gravity — I can't put it down" is a pun. | - | c: make a pun; a terrible pun
      punchline | the last part of a joke, which makes it funny | n | He laughed before he got to the punchline. | - | c: deliver the punchline
      play on words | a clever or funny use of a word with more than one meaning | n phr | The title of the play is a play on words. | -
      sarcastic | saying the opposite of what you mean, in order to criticize or make fun of someone | adj | "Oh, brilliant," she said in a sarcastic voice. | - | n: Noun: sarcasm.
      ironic | strange or funny because it is the opposite of what you expect | adj | It's ironic that the fire station burned down. | - | n: Noun: irony.
      deadpan | pretending to be completely serious while saying something funny | adj | Her deadpan delivery makes every joke funnier. | -
      self-deprecating | making fun of yourself in a modest way | adj | His self-deprecating humor makes him very likable. | -
      witty | clever and funny in the way you use words | adj | She sent a witty reply that made everyone laugh. | - | n: Noun: wit.
      tongue-in-cheek | said or done as a joke, although it seems serious | adj | The article was written in a tongue-in-cheek style. | -
      crack a joke | to tell a joke | expr | He cracked a joke to break the tension. | -
      get (a joke) | to understand why a joke is funny | v | I didn't get the joke until someone explained it. | -
      fall flat | to fail to make people laugh or be interested | phr v | My best joke fell completely flat. | -
      open mic | an event where anyone can perform, especially comedy or music | n phr | She tried stand-up for the first time at an open mic. | - | n: Also: open-mic night.
    grammar:
      title: "Emphasis: emphatic do and inversion with so and such"
      body: |
        **Emphatic do.** In positive sentences in the present simple and past simple, we can add **do / does / did** + **base form** to add emphasis. It is strongly stressed in speech.
        - to **contradict**: *You think I forgot, but I **did** send a card!*
        - to **insist** or **confirm**: *I **did** warn you it would be a disaster.*
        - to make a polite imperative warmer: ***Do** sit down.*
        - to contrast with a negative: *I don't laugh much, but I **do** enjoy comedy.*

        **Inversion with so and such.** You know *It was so quiet that…* and *It was such a quiet night that…* For extra drama, the *so* or *such* phrase can go first, followed by inversion:
        - **So + adjective/adverb + auxiliary/be + subject + that…**: ***So nervous was I that** I forgot the punchline.*
        - **Such + be + noun phrase + that…**: ***Such was the silence that** I could hear the barman drying glasses.*

        These inverted forms are formal and literary. In conversation, people often use them **jokingly**, because the grand style contrasts with a small, everyday situation.
      table: |
        Structure | Normal | Emphatic
        do / does / did + base form | I warned you. | I did warn you!
        present simple | She likes your jokes. | She does like your jokes.
        So + adjective + inversion | I was so nervous that I forgot. | So nervous was I that I forgot.
        So + adverb + inversion | It went so well that they asked me back. | So well did it go that they asked me back.
        Such + be + noun | The silence was such that… | Such was the silence that…
      examples: |
        I did warn you it would be a disaster! | | emphatic did: insisting
        People did laugh at the pun about the dentist. | | emphatic did: contradicting
        So nervous was I that I nearly cut half my set. | | so + adjective + inversion
        Such was the silence that I could hear the barman drying glasses. | | such + be + noun phrase
      tip: |
        After emphatic do, always use the base form: "I did warn you" (not "I did warned you").
    dialogue:
      title: First night at the open mic
      setting: A small comedy club in Chicago, Illinois. Dev has just performed stand-up comedy for the first time at an open-mic night. His friend Carmen was in the audience.
      speakers: C=Carmen/f; D=Dev/m
      lines: |
        C: Dev! You did it! How does it feel to have survived your first open-mic night?
        D: Terrifying. I did warn you it would be a disaster. Did you hear the silence after my first joke?
        C: Such was the silence that I could hear the bartender drying glasses.
        D: Thanks. Very supportive. Now be honest — did anybody actually laugh?
        C: People did laugh at the pun about the dentist. "Looking down in the mouth" — I loved that one.
        D: That's the one I almost cut! So nervous was I before the show that I nearly cut half my set.
        C: The problem wasn't the jokes, though. You do tend to rush the punchlines when you're nervous.
        D: I know. And the sarcastic bit about my landlord just sounded mean.
        C: Sarcasm is tricky. Self-deprecating jokes work much better — people love it when you laugh at yourself.
        D: Like the story about my driving test? That did get the biggest laugh of the night.
        C: Exactly. And so well did it go that the host asked whether you'd come back next month.
        D: Seriously? Then I'd better start writing. And this time I'll slow down — I really will.
    pronunciation:
      title: Stressing emphatic do
      body: |
        Normally, *do* and *did* are weak and unstressed. When they are **emphatic**, they carry the strongest stress in the sentence, often with a high fall: *I DID warn you! She DOES like you.* This is what tells the listener that you are contradicting or insisting.

        Tone of voice is also the key to **sarcasm**: a flat or exaggerated intonation on a positive word (*Oh, GREAT*) shows that you mean the opposite. Listen and repeat.
      items: |
        I did warn you!
        People did laugh.
        You do tend to rush.
        She does like your jokes.
        So nervous was I.
        Oh, great.
    mistakes: |
      I did warned you it would be a disaster. => I did warn you it would be a disaster. | After emphatic did, use the base form.
      So funny the show was that we cried with laughter. => So funny was the show that we cried with laughter. | When so + adjective comes first, invert the verb and subject.
      Such the noise was that we left early. => Such was the noise that we left early. | Such + be + subject (the noise) + that.
    task:
      title: Tell it with timing
      mode: speaking
      body: |
        Prepare a short, self-deprecating funny story (one to two minutes) about something embarrassing that happened to you. Build up to a clear punchline, use at least one emphatic do and one so/such inversion for comic effect, and practice your timing: pause before the punchline. Then tell your story to the AI coach in the "Talking about your day" scenario and ask the coach to react.
    exercises: |
      fill: I know you think I forgot, but I ___ send you a birthday card — it must have got lost in the post! || did || Emphatic did + base form contradicts what the other person believes. || @tags en.verb-forms
      fill: So popular ___ the show that three extra nights were added. || was || So + adjective + be + subject + that… || @tags en.adverbs,en.register
      rw: Add emphasis with do, does or did :: I enjoyed the show, even though I didn't laugh much. || I did enjoy the show, even though I didn't laugh much. || Emphatic did + base form (enjoy) contrasts with the negative idea. || @tags en.verb-forms
      rw: Rewrite beginning "So" :: The comedian was so funny that people were crying with laughter. || So funny was the comedian that people were crying with laughter. || So + adjective + was + subject + that… || @tags en.adverbs,en.register
      rw: Rewrite beginning "Such" :: The demand for tickets was so great that the website crashed. || Such was the demand for tickets that the website crashed. || Such + was + noun phrase + that… || @tags en.adverbs,en.register
      mc: Choose the correct sentence. || So nervous I was that I forgot my lines. | *So nervous was I that I forgot my lines. | So was I nervous that I forgot my lines. || So + adjective + verb + subject: so nervous was I. || @tags en.adverbs,en.register
      mc: Which of these is a pun? || *"I used to be a banker, but I lost interest." | "My boss is so strict that he times our coffee breaks." | "I'm not lazy — I'm just very relaxed." || Interest has two meanings: money a bank pays, and the feeling of wanting to know more. The other two are jokes, but not wordplay. || @tags en.vocabulary @skill vocabulary
      match: I'm on a seafood diet — I see food and I eat it. = a pun ; "Oh great, another Monday," she said, rolling her eyes. = sarcasm ; I'm so bad at sport that the ball avoids me. = self-deprecating humor ; He told the whole ridiculous story without smiling once. = deadpan delivery || Each example is matched with the type of humor it shows. || @hint Match each example with the type of humor. @skill vocabulary @tags en.vocabulary
      tf: Nobody in the audience laughed at Dev's jokes. || false || Carmen says, "People did laugh at the pun about the dentist," and the driving test story got the biggest laugh. || @ctx dialogue
      short: Which of Dev's jokes was a pun? || kw: dentist/mouth || "The pun about the dentist. 'Looking down in the mouth.'" || @ctx dialogue
      listen: @dialogue || What did the host ask Dev? || To shorten his set | *Whether he would come back next month | To stop telling sarcastic jokes || "The host asked whether you'd come back next month." || @tags en.listening
      listen: The joke falls flat in translation, because in English the word "bark" means both the sound a dog makes and the outside of a tree. || Why doesn't the joke work in other languages? || It's too long. | *It depends on an English word with two meanings. | It's about a famous English dog. || The joke is a pun on "bark," which has two meanings only in English. || @tags en.listening,en.vocabulary
      dict: Such was the silence that you could have heard a pin drop. || such + be + noun phrase
      ask: Your friend says, "You never laugh at my jokes!" Respond, contradicting them with emphatic do and explaining what kind of humor you prefer. || kw: do/did/does & laugh/funny/humor/jokes/puns/sarcasm/sarcastic/self-deprecating || That's not true — I do laugh at your jokes! I did laugh at the one about your cat yesterday. I just don't like sarcastic humor very much. I prefer puns and self-deprecating stories.
      write: Write a short review (90–110 words) of a comedy show, film or series you have seen. Describe its humor and use at least one emphatic do and one so/such inversion. || min=80 || req: do/does/did | so/such || I wasn't expecting much from "The Night Shift," a new comedy series about a team of hospital cleaners, but I did enjoy it. The humor is mostly deadpan: the characters say the most ridiculous things with completely serious faces. So well written are the dialogues that I watched the first episode twice to catch all the wordplay. Some sarcastic jokes do fall flat, especially in the later episodes, and one character is more annoying than funny. Still, such is the warmth of the cast that you forgive the weaker moments. If you like gentle, clever comedy, it's definitely worth watching.
