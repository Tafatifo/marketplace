unit: 8
title: What lies ahead
theme: Looking ahead
description: Make predictions about your own life and the world with the future continuous and future perfect, reflect on regrets and the lessons you have learned with wish, if only and regret, and present a well-structured argument about the future using expressions such as be set to, be due to and be bound to.
free: false
objectives:
  - Make predictions and speculate about the future with the future continuous and future perfect
  - Talk about regrets and lessons learned with wish, if only, wish + would and regret
  - Structure and deliver a persuasive presentation, using signposting and future expressions
canDo:
  - I can describe where I will be and what I will have achieved at different points in the future.
  - I can speculate about how the world will have changed in twenty or thirty years.
  - I can talk honestly about regrets, explain what I have learned and give advice to others.
  - I can give a structured presentation that makes a case, deals with objections and ends with a clear proposal.
review: |
  fill: Don't call me at ten tomorrow — I ___ (sit) my final exam then. || will be sitting / 'll be sitting || Future continuous: an action in progress at a specific future time. || @tags en.future-continuous-perfect
  fill: By the time you read this letter, I ___ (leave) for Canada. || will have left / 'll have left || Future perfect: an action completed before a future moment. || @tags en.future-continuous-perfect
  fill: Next March, my parents ___ (live) in this house for forty years. || will have been living / 'll have been living / will have lived / 'll have lived || Future perfect continuous (or simple) for the length of an activity up to a future point. || @tags en.future-continuous-perfect
  fill: I wish I ___ (not / lend) him my car. He crashed it the next day. || hadn't lent / had not lent || Wish + past perfect for a regret about the past. || @tags en.wishes
  mc: Which sentence complains about someone's annoying habit? || I wish you had told me. | *I wish you wouldn't leave your socks on the floor. | I wish you were here. || Wish + would / wouldn't expresses irritation and a desire for someone's behavior to change. || @tags en.wishes
  rw: Rewrite using "regret" :: I wish I hadn't sold my grandfather's watch. || I regret selling my grandfather's watch. | I regret having sold my grandfather's watch. || Regret + -ing (or having + past participle) for something you did and are sorry about. || @tags en.wishes,en.gerund-infinitive
  mc: The new hospital ___ open next spring, according to the official schedule. || is bound to | *is due to | is on the verge of || Be due to = scheduled or expected at a particular time. Bound to means certain, and on the verge of is followed by -ing or a noun. || @tags en.future-forms
  rw: Rewrite using "be bound to" :: I'm certain that the tickets will sell out quickly. || The tickets are bound to sell out quickly. || Be bound to + base form = it is certain to happen. || @tags en.future-forms
  listen: In ten years' time, I'll probably be running my own business, and I hope I'll have paid off my student loan. || What does the speaker hope to have done in ten years? || Started university | *Paid off a student loan | Sold their business || "I hope I'll have paid off my student loan." || @tags en.listening,en.future-continuous-perfect
  listen: If only I'd learned to swim as a child. Now I'm forty, and I still feel nervous every time we go to the beach. || What does the speaker regret? || Going to the beach too often | *Not learning to swim when they were young | Moving away from the coast || "If only I'd learned to swim as a child." || @tags en.listening,en.wishes
  ask: A younger friend asks, "What's the biggest lesson you've learned so far, and is there anything you wish you'd done differently?" Answer honestly. || kw: wish I had/wish I'd/wish I hadn't/if only/regret/should have & learned/learnt/lesson/realized/now I know || The biggest lesson I've learned is that it's fine to ask for help. I wish I'd realized that at university, because I struggled alone for months. I also regret not spending more time with my grandparents. Now I call my parents every week.
  write: Write a letter (110–130 words) to yourself, to be opened in ten years. Describe what you will be doing and what you will have achieved by then, and mention one regret you hope you won't have. || min=100 || req: will be/I'll be/you'll be | will have/I'll have/you'll have | wish/if only/regret || Dear future me, By the time you read this, you'll have been living in Montreal for almost ten years, and I hope you'll have finally become fluent in French. I imagine you'll be working as an architect, designing schools or libraries, and maybe you'll be living in a house with a garden. I hope you'll have traveled to Japan, as we've always planned. Most of all, I hope you won't be saying "I wish I had been braver." Right now, I'm about to start my first job, and I'm nervous. If you can, remember this feeling and be proud of how far we've come. Love, your younger self
lessons:
  - title: Predictions and speculation
    summary: Make predictions about your own future and the world's, and describe actions in progress and completed by a future time with the future continuous, future perfect and future perfect continuous.
    minutes: 50
    skills: [vocabulary, grammar, speaking]
    tags: [en.future-continuous-perfect, en.future-forms, en.schwa]
    objectives:
      - Talk about forecasts, trends and the long-term future with precise vocabulary
      - Use the future continuous for actions in progress at a future time
      - Use the future perfect (simple and continuous) for actions completed or continuing up to a future time
    intro: |
      Where will you be in twenty years? What will have changed? Predicting the future is always risky — but talking about it is one of the most natural things we do, from career plans to science fiction. In this lesson you will learn vocabulary for forecasts and trends and two future forms that let you look at the future from a specific point: the **future continuous** (*I'll be working*) and the **future perfect** (*I'll have finished*).
    vocab: |
      forecast | a statement about what is likely to happen in the future, based on information | n | The latest forecast says the population will keep growing. | - | c: an economic forecast; a weather forecast | n: Also a verb.
      foresee | to know or guess that something will happen in the future | v | Nobody could have foreseen the success of the app. | - | n: Past: foresaw, foreseen.
      speculate | to guess about something without having all the facts | v | It's too early to speculate about the results. | - | n: Noun: speculation.
      inevitable | certain to happen and impossible to avoid | adj | Some changes are inevitable. | -
      trend | a general direction in which something is developing or changing | n | There's a growing trend toward working from home. | - | c: a current trend; follow a trend
      emerging | new and starting to develop or become important | adj | Emerging technologies will create new kinds of jobs. | -
      unforeseen | not expected or planned for | adj | The project was delayed by unforeseen problems. | - | c: unforeseen circumstances
      in the long run | after a long period of time; eventually | expr | Learning a language takes time, but it pays off in the long run. | -
      in (twenty) years' time | at a point twenty years from now | expr | In twenty years' time, this will all look very old-fashioned. | - | n: Note the apostrophe after years.
      by then | before or at that time in the future | expr | The party starts at eight. By then, I'll have finished work. | -
      time capsule | a container of objects from the present that is buried or hidden and opened many years later | n phr | We buried a time capsule in the school garden. | -
      far-fetched | very unlikely to be true or to happen | adj | Holiday homes on the moon seem a bit far-fetched. | -
      obsolete | no longer used because something newer exists | adj | Fax machines are almost obsolete. | -
    grammar:
      title: Future continuous and future perfect
      body: |
        These two forms look at the future from a **specific point in time**.

        **Future continuous — will be + -ing**
        - an action **in progress** at a future moment: *This time next year, I**'ll be working** as a doctor.*
        - something that will happen as part of the normal course of events: *I**'ll be seeing** Tom at work tomorrow, so I can give him the message.*
        - a polite question about someone's plans: ***Will** you **be using** the car tonight?*

        **Future perfect — will have + past participle**
        - an action **completed before** a future moment, often with **by**, **by then** or **by the time**: *By then, cars **will have become** fully electric.*
        - After *by the time*, use the **present simple**, not will: *By the time we **open** it, …*

        **Future perfect continuous — will have been + -ing**
        - how **long** an activity will have continued at a future point: *When we open it, we**'ll have been** out of school for twenty years. In June, she**'ll have been teaching** here for a decade.*

        Add *probably*, *definitely* or *certainly* after *will*: *We'll **probably** be living in cities.* In the negative, they go before *won't*: *We **probably won't** have finished.*
      table: |
        Form | Structure | Example
        Future continuous | will be + -ing | This time tomorrow, I'll be flying to Lima.
        Future perfect | will have + past participle | By 2040, we'll have built the new line.
        Future perfect continuous | will have been + -ing | Next year, I'll have been working here for ten years.
        Polite question | Will you be + -ing? | Will you be joining us for dinner?
        By the time + present | by the time + present simple | By the time you arrive, we'll have eaten.
      examples: |
        I'll be working as a doctor somewhere rural. | | future continuous: in progress in the future
        By then, half the jobs our parents do will have disappeared. | | future perfect: completed before then
        When we open it, we'll have been out of school for twenty years. | | future perfect with a length of time
        In twenty years' time, we'll be standing here laughing at our predictions. | | future continuous: a scene in the future
      tip: |
        Draw a timeline. If you are standing at a future point and looking at an action in progress, use will be + -ing. If you are looking back at a finished action, use will have + past participle.
    dialogue:
      title: Letters to the future
      setting: A secondary school in Brisbane, Australia. Zara and Nikhil, two final-year students, are writing letters to their future selves for a time capsule that the class will open in twenty years.
      speakers: Z=Zara/f; N=Nikhil/m
      lines: |
        Z: The time capsule goes into the ground tomorrow. Have you finished your letter to your future self?
        N: Almost. It's strange to think that when we open it, we'll have been out of school for twenty years.
        Z: I've written that by then I'll have finished medical school, and I'll be working as a doctor somewhere rural.
        N: That sounds like you. I honestly have no idea what I'll be doing. Maybe something that doesn't exist yet.
        Z: Like what? Designing holiday homes on the moon?
        N: Why not? By then, people will probably be taking short trips into space, the way they take cruises now.
        Z: That sounds a bit far-fetched. I think most of us will still be worrying about rent and traffic, just like today.
        N: Fair point. But surely cars will have become fully electric by then, and most of them will be driving themselves.
        Z: Probably. And I bet half the jobs our parents do will have disappeared.
        N: Which is why I'm not making any firm predictions. What else did you put in the box?
        Z: A photo of our class, today's newspaper and my old phone. By then, it'll look like an antique.
        N: And in twenty years' time, we'll be standing here laughing at how wrong we were about everything.
    pronunciation:
      title: "Weak forms: I'll be, I'll have, will have been"
      body: |
        In fast speech, the future continuous and future perfect are full of weak forms. *I will be* becomes "ail-bee", *I will have* becomes "ail-əv", and *will have been* becomes "wil-əv-bin" or even "əl-əv-bin".

        The stress falls on the main verb and the time expression: *By THEN, I'll have FINished.* *This time next YEAR, I'll be WORKing.* Listen and repeat.
      items: |
        I'll be working as a doctor.
        I'll have finished by then.
        We'll have been out of school for twenty years.
        Will you be using the car tonight?
        By the time we open it
        It'll look like an antique.
    mistakes: |
      This time tomorrow, I will lie on a beach. => This time tomorrow, I will be lying on a beach. | For an action in progress at a future moment, use the future continuous.
      By the time she will arrive, we'll have eaten. => By the time she arrives, we'll have eaten. | After by the time (and other time conjunctions), use the present simple, not will.
      Next year I will be working here for ten years. => Next year I will have been working here for ten years. | For the length of an activity up to a future point, use the future perfect continuous.
    task:
      title: My future timeline
      mode: speaking
      body: |
        Draw a timeline with three points: one year, five years and twenty years from now. For each point, prepare two sentences about your life (what you'll be doing and what you'll have done) and one prediction about the world. Present your timeline in two minutes, using the future continuous, the future perfect and at least one hedge (probably, I doubt, it's likely that). Then talk about your plans and predictions with the AI coach in the "Making weekend plans" scenario, extending them to your long-term plans.
    exercises: |
      fill: This time next week, I ___ (fly) to Lima. || will be flying / 'll be flying || Future continuous: an action in progress at a future moment. || @tags en.future-continuous-perfect
      fill: By the end of the year, the company ___ (open) three new offices. || will have opened / 'll have opened || Future perfect: completed before a future point (by the end of the year). || @tags en.future-continuous-perfect
      fill: In June, she ___ (teach) at this school for twenty years. || will have been teaching / 'll have been teaching || Future perfect continuous: the length of an activity up to a future point. || @tags en.future-continuous-perfect
      fill: By the time you ___ (get) here, we'll have finished dinner. || get || After by the time, use the present simple for the future. || @tags en.future-continuous-perfect,en.future-forms
      mc: Don't call me at eight — I ___ my driving test then. || *'ll be taking | 'll have taken | take || An action in progress at a specific future time: future continuous. || @tags en.future-continuous-perfect
      rw: Rewrite using the future perfect and "by 2030" :: The builders will finish the bridge before 2030. || The builders will have finished the bridge by 2030. | By 2030, the builders will have finished the bridge. | The bridge will have been finished by 2030. || Will have + past participle with by + a future time. || @tags en.future-continuous-perfect
      rw: Rewrite using the future continuous :: At this time tomorrow, I'll be in the middle of my exam. || At this time tomorrow, I'll be taking my exam. | At this time tomorrow, I'll be doing my exam. | At this time tomorrow, I'll be sitting my exam. | I'll be taking my exam at this time tomorrow. | I'll be doing my exam at this time tomorrow. | I'll be sitting my exam at this time tomorrow. || In the middle of = in progress, so use will be + -ing. || @tags en.future-continuous-perfect
      match: make = a prediction ; long-term = forecast ; emerging = technologies ; future = generations ; current = trends || Common collocations: make a prediction, a long-term forecast, emerging technologies, future generations, current trends. || @hint Match the words to make common expressions. @skill vocabulary @tags en.collocations
      tf: Zara expects to be working as a doctor in a big city. || false || She says she'll be working as a doctor "somewhere rural." || @ctx dialogue
      short: According to Zara, what will her old phone look like in twenty years? || kw: antique/old || "By then, it'll look like an antique." || @ctx dialogue
      listen: @dialogue || What does Nikhil think they'll be doing when they open the capsule? || Comparing their salaries | *Laughing at how wrong their predictions were | Burying a new time capsule || "We'll be standing here laughing at how wrong we were about everything." || @tags en.listening
      listen: By twenty-fifty, around two-thirds of the world's population will be living in cities, and many of today's jobs will have changed beyond recognition. || According to the speaker, where will most people be living by twenty-fifty? || *In cities | In the countryside | In space || "Around two-thirds of the world's population will be living in cities." || @tags en.listening,en.future-continuous-perfect
      dict: By the time we open the capsule, we'll have been out of school for twenty years. || future perfect continuous
      ask: A friend asks, "Where do you think you'll be in ten years, and what will you have done by then?" Answer with at least one future continuous and one future perfect. || kw: will be/I'll be/I will be & will have/I'll have/I will have || In ten years, I'll probably be living abroad, maybe in Lisbon, and I'll be working for an international company. By then, I'll have finished my master's degree, and I hope I'll have learned Portuguese.
      write: Write a paragraph (100–120 words) predicting how one area of life (work, transport, education or health) will have changed in twenty-five years. Use the future continuous and the future perfect at least twice each. || min=90 || req: will be/'ll be/won't be & ing | will have/'ll have/won't have || In twenty-five years' time, I think education will have changed more than most people expect. Most students will still be going to school, but they won't be sitting in rows listening to one teacher. Instead, they'll be working in small groups on real projects, with AI tutors helping them at their own speed. By then, textbooks will probably have disappeared, and exams will have become far less important. Teachers will be spending more time on coaching and well-being and less on marking. Of course, some things won't have changed: children will still be losing their homework and laughing with their friends at lunchtime.

  - title: Regrets and lessons learned
    summary: Talk about regrets and the lessons life has taught you, and express wishes about the past and annoyance about the present with wish, if only, wish + would and regret.
    minutes: 50
    skills: [listening, grammar, speaking]
    tags: [en.wishes, en.gerund-infinitive, en.intonation]
    objectives:
      - Talk about regrets, missed opportunities and lessons learned
      - Use wish and if only + past perfect for regrets about the past
      - Use wish + would for annoying habits and regret + -ing / not + -ing
    intro: |
      Everyone has regrets — a chance they didn't take, words they wish they hadn't said. Talking about them openly, and about what they have taught us, is part of mature conversation. In this lesson you will build on *I wish + past simple* from B1 and learn to express **regrets about the past** (*I wish I had…*, *If only I hadn't…*), **irritation** about other people's behavior (*I wish you'd stop…*) and the patterns of the verb **regret**.
    vocab: |
      regret | to feel sorry or sad about something you did or didn't do | v | I regret not learning to swim as a child. | - | c: deeply regret; have no regrets | n: Also a noun: I have no regrets.
      hindsight | the understanding of a situation that you only have after it has happened | n | With hindsight, I should have taken the job. | - | c: with hindsight; in hindsight
      learn the hard way | to learn something through an unpleasant experience | expr | I learned the hard way that you should always back up your files. | -
      missed opportunity | a chance that you didn't take | n phr | Not visiting my aunt in Japan was a missed opportunity. | -
      second chance | another opportunity to do something after failing the first time | n phr | Everyone deserves a second chance. | -
      take the plunge | to finally do something important or risky after thinking about it | expr | She took the plunge and moved to Berlin. | -
      play it safe | to avoid risks | expr | I played it safe and stayed in my old job. | -
      turn down | to refuse an offer or request | phr v | He turned down a place at a top university. | -
      dwell on | to keep thinking or talking about something unpleasant | phr v | Don't dwell on your mistakes — learn from them. | -
      come to terms with | to accept a sad or difficult situation | expr | It took her years to come to terms with leaving her country. | -
      shoot down | to reject someone's idea or suggestion in an unkind way | phr v | Every time I suggest something, my manager shoots it down. | - | n: Informal.
      give up | to stop doing something that you used to do regularly | phr v | I gave up the violin when I was ten. | -
    grammar:
      title: "wish, if only and regret"
      body: |
        **Present situations (review).** *wish / if only* + **past simple** for a present situation you would like to be different: *I wish I **had** more time. If only I **knew** the answer.* (*Were* is common for all persons: *I wish I **were** braver.*)

        **Regrets about the past.** *wish / if only* + **past perfect**: *I wish I **had traveled** more. If only I **hadn't listened** to them.* **If only** is stronger and more emotional than *I wish*.

        **Annoyance and wanting change.** *wish* + **someone/something + would** + base form, for behavior that irritates you and that you want to change: *I wish my manager **would listen** to ideas. I wish you**'d stop** saying that.* Don't use *wish… would* about yourself or about states: say *I wish I **could** stop* or *I wish I **were** taller* (not ~~I wish I would be taller~~).

        **regret.** **regret + -ing** (or *having* + past participle) for something you did; **regret not + -ing** for something you didn't do: *I regret **giving up** the piano. I regret **not traveling**.* (*Regret to* + say/inform/tell is a formal way to give bad news: *We regret to inform you…*)
      table: |
        Meaning | Structure | Example
        present situation | wish + past simple | I wish I lived nearer.
        past regret | wish / if only + past perfect | I wish I'd traveled more.
        annoying habit | wish + someone + would | I wish you'd stop interrupting.
        something you did | regret + -ing | I regret leaving so early.
        something you didn't do | regret not + -ing | I regret not saying goodbye.
      examples: |
        I wish I had traveled more when I was young. | | wish + past perfect: past regret
        If only I'd been a bit braver. | | if only + past perfect: stronger feeling
        I wish my manager would listen to ideas instead of shooting them down. | | wish + would: annoyance
        I regret giving up the piano. | | regret + -ing
      tip: |
        Check the time: a regret about now → past simple; a regret about the past → past perfect; irritation about someone's behavior → would.
    dialogue:
      title: Next year never came
      setting: A café in San Antonio, Texas. Kai, who is twenty-five and has just left his first job, is having coffee with his grandmother Lourdes, who is seventy-four.
      speakers: K=Kai/m; L=Lourdes/f
      lines: |
        K: Grandma, do you ever wish you'd done things differently? I keep thinking I made the wrong choice leaving my job.
        L: Of course. I wish I had traveled more when I was young. I always said I'd go next year, and next year never came.
        K: Why didn't you go, if you wanted to travel so much?
        L: Money, children, fear… If only I'd been a bit braver. But I don't regret having your mother — not for a second.
        K: I regret giving up the piano. I wish I hadn't listened to my friends when they said it was boring.
        L: You were twelve! Everyone makes decisions like that at twelve. You could always start again, you know.
        K: Maybe. As for my job, I wish my manager would listen to ideas instead of shooting them down. That's why I left.
        L: Then you did the right thing. In my experience, we regret the things we didn't do more than the things we did.
        K: Is that the biggest lesson you've learned?
        L: That, and to stop worrying about what other people think. I wish someone had told me that at your age.
        K: Then I'll tell you something too. I wish you'd stop saying you're too old to travel.
        L: Ha! Fair enough. If you book the tickets, I'll pack my bag. Where shall we go?
    pronunciation:
      title: Intonation for regret and annoyance
      body: |
        Regrets are usually said with a **falling, slightly lower** tone and a strong stress on the key word: *I WISH I'd been BRAVer.* *If ONly I hadn't LIStened.* *If only* is often lengthened for emotional effect: "If O-o-nly…"

        *Wish + would* for annoyance often has a strong stress on **would** or on the main verb, with a sharper fall: *I wish you'd STOP saying that!* Listen and repeat.
      items: |
        I wish I'd traveled more.
        If only I'd been braver.
        I regret giving up the piano.
        I wish you'd stop saying that.
        I wish someone had told me.
        I have no regrets.
    mistakes: |
      I wish I didn't say that at the meeting yesterday. => I wish I hadn't said that at the meeting yesterday. | For a regret about the past, use wish + past perfect.
      I wish I would be taller. => I wish I were taller. | Wish + would is for other people's behavior. For a state, use wish + past simple (were).
      I regret to not go to university. => I regret not going to university. | Use regret not + -ing for something you didn't do.
    task:
      title: Dear younger me
      mode: writing
      body: |
        Write a letter (150–180 words) to yourself at age fifteen. Mention two things you wish you had done differently, one thing you're glad you did and the most important lesson you have learned since then. Use wish/if only + past perfect, regret + -ing and at least one piece of advice. Then talk about a decision you regret — or don't — with the AI coach in the "Expressing an opinion" scenario.
    exercises: |
      fill: I wish I ___ (study) harder at school. || had studied / 'd studied || Wish + past perfect for a regret about the past. || @tags en.wishes
      fill: If only we ___ (not / sell) the house — prices have doubled since then. || hadn't sold / had not sold || If only + past perfect for a strong regret about the past. || @tags en.wishes
      fill: I wish my neighbors ___ (stop) playing loud music at two in the morning. || would stop / 'd stop || Wish + someone + would for behavior that annoys you. || @tags en.wishes
      mc: Which sentence expresses annoyance about someone's behavior? || I wish you had come to the party. | *I wish you would stop interrupting me. | I wish you were here. || Wish + would expresses irritation and a wish for change. The others are a past regret and a present wish. || @tags en.wishes
      mc: Choose the correct sentence. || I wish I would be more patient. | *I wish I were more patient. | I wish I am more patient. || For a state, use wish + past simple (were). Wish + would isn't used about yourself. || @tags en.wishes
      rw: Rewrite starting "I wish" :: I'm sorry I didn't take that photography course. || I wish I had taken that photography course. | I wish I'd taken that photography course. || A past regret: wish + past perfect. The negative fact (didn't take) becomes positive. || @tags en.wishes
      rw: Rewrite starting "If only" :: It's a pity I lost touch with my school friends. || If only I hadn't lost touch with my school friends. | If only I had not lost touch with my school friends. || If only + past perfect; the positive fact (lost touch) becomes negative. || @tags en.wishes
      rw: Rewrite using "regret" :: I wish I hadn't shouted at him. || I regret shouting at him. | I regret having shouted at him. || Regret + -ing (or having + past participle) for something you did. || @tags en.wishes,en.gerund-infinitive
      match: missed = opportunity ; second = chance ; learn = the hard way ; take = the plunge ; play it = safe || Common expressions: a missed opportunity, a second chance, learn the hard way, take the plunge, play it safe. || @hint Match the words to make common expressions. @skill vocabulary @tags en.collocations
      tf: Lourdes regrets having children. || false || "I don't regret having your mother — not for a second." || @ctx dialogue
      short: Why did Kai leave his job? || kw: manager/boss & listen/ideas || "I wish my manager would listen to ideas instead of shooting them down. That's why I left." || @ctx dialogue
      listen: @dialogue || What does Lourdes agree to do at the end? || Start piano lessons | *Travel with Kai if he books the tickets | Help Kai find a new job || "If you book the tickets, I'll pack my bag." || @tags en.listening
      dict: I wish someone had told me that when I was your age. || wish + past perfect
      ask: A friend asks, "Is there anything you regret, and what did it teach you?" Answer with at least two different structures. || kw: wish I had/wish I'd/wish I hadn't/if only/regret & learned/learnt/lesson/taught/realized || I regret not studying abroad when I had the chance. I wish I'd been less worried about money, because I could have found a scholarship. It taught me to take the plunge when an opportunity comes along, instead of always playing it safe.
      write: Write a paragraph (100–120 words) about a decision you regret, or don't regret. Explain what happened, how you feel now and what you have learned. Use wish or if only + past perfect and regret + -ing. || min=90 || req: wish/if only | had/hadn't/'d | regret || When I was nineteen, I turned down a summer job in a hotel in Scotland because I was scared of living alone. My best friend went instead, and she came back full of stories, much more confident and able to speak English much better than me. I really wish I had taken the plunge. If only I hadn't listened to my fears! For a long time, I dwelled on it, but now I see it differently. I don't regret staying at home completely, because I spent that summer with my grandfather, who died the following year. Still, I learned the hard way that playing it safe has its own costs.

  - title: Presenting an argument
    summary: Analyze a persuasive talk about designing cities for an aging population, structure a presentation with signposting, and talk about the future with be set to, be due to, be about to, be bound to and be on the verge of.
    minutes: 55
    skills: [reading, speaking, grammar]
    tags: [en.future-forms, en.opinion, en.intonation]
    objectives:
      - Follow the structure of a persuasive talk and identify its key techniques
      - Use signposting language to open, organize and conclude a presentation
      - Talk about the future with be set to, be due to, be about to, be bound to and be on the verge of
    intro: |
      A good presentation is an argument with a map: the audience always knows where they are, where they're going and why it matters. In this final lesson you will read the transcript of a short talk at a community forum, analyze how the speaker organizes and supports the argument, and learn **signposting** phrases and **future expressions** — *be set to*, *be due to*, *be bound to* — that make predictions and plans sound precise and confident.
    vocab: |
      aging population | a population in which the proportion of older people is growing | n phr | Many countries are dealing with an aging population. | - | n: British spelling: ageing.
      make the case for | to give arguments in support of something | expr | She made a strong case for a four-day week. | -
      outline | to give the main facts or ideas about something, without the details | v | Let me briefly outline the plan. | - | n: Also a noun: an outline.
      pressing | needing to be dealt with immediately | adj | Housing is the most pressing issue in the city. | - | c: a pressing need; a pressing issue
      priority | something that is more important than other things and needs attention first | n | Safety is our top priority. | - | c: a top priority; give priority to
      address | to deal with a problem or question | v | The plan doesn't address the problem of parking. | - | c: address an issue; address a concern
      commit to | to promise to do something or to support something | phr v | The council has committed to building five hundred new homes. | - | n: Noun: commitment.
      walkable | close enough or safe enough to walk around easily | adj | We want every neighborhood to be walkable. | -
      step-free | without steps, so that people in wheelchairs or with strollers can enter easily | adj | Only half of the stations are step-free. | -
      loneliness | the unhappy feeling of being alone and having nobody to talk to | n | Loneliness can be as harmful to health as smoking. | -
      to sum up | used to introduce a short summary at the end of a talk or text | expr | To sum up, the benefits outweigh the costs. | - | n: Also: to summarize, in conclusion.
      take (something) on board | to understand and accept an idea or suggestion | expr | Thank you — we'll take your comments on board. | -
    grammar:
      title: Other ways to talk about the future
      body: |
        Besides *will*, *going to* and the future continuous and perfect, English has a group of expressions with **be** that make predictions and plans more precise. They are common in news reports, presentations and formal writing.

        - **be set to** + base form — very likely, or already planned (common in the news): *The number of people over eighty **is set to** triple.*
        - **be due to** + base form — scheduled or expected at a particular time: *The new tram line **is due to** open in two years.*
        - **be about to** + base form — will happen very soon: *The project **is about to** enter its final stage.*
        - **be on the verge / point of** + noun or -ing — very close to happening: *We **are on the verge of** a historic change.*
        - **be bound to** + base form — certain to happen, in the speaker's opinion: *If we wait, costs **are bound to** rise.*
        - **be (un)likely to** + base form — probable or improbable (from Unit 1): *Their health **is likely to** get worse.*

        Notice that *due to* + base form (scheduled) is different from *due to* + noun (because of): *The train is **due to arrive** at six* vs *It was late **due to** the snow.*
      table: |
        Expression | Meaning | Example
        be set to + base form | likely / planned | Prices are set to rise next year.
        be due to + base form | scheduled | The report is due to be published on Friday.
        be about to + base form | very soon | Hurry up — the film is about to start.
        be on the verge of + noun/-ing | very close to | They're on the verge of a breakthrough.
        be bound to + base form | certain | It's bound to rain on the day of the picnic.
      examples: |
        In our own city, one in four residents is set to be over sixty-five within twenty years. | | be set to: a forecast
        Our new tram line is due to open in two years. | | be due to: scheduled
        If we wait, the cost is bound to be much higher. | | be bound to: certain
        We are on the verge of a historic change in the age of our population. | | on the verge of + noun
      tip: |
        In a presentation, use these expressions to sound precise, but be careful with bound to: it shows strong certainty, so only use it when you are confident.
    reading:
      title: Cities for every age
      text: |
        Good evening, everyone. I'd like to begin with a simple question: how old will you be in twenty-five years? For many of us in this room, the answer is "over seventy." And we won't be alone. Worldwide, the number of people aged eighty or over is expected to roughly triple by twenty-fifty. In our own city, one in four residents is set to be over sixty-five within the next two decades.

        Tonight, I want to make the case that we need to start designing our streets, homes and services for that future now — not when it arrives. Let me give you three reasons.

        Firstly, it is cheaper. Building a step-free station costs far less than rebuilding an old one later. Our new tram line is due to open in two years, and it is about to enter its final design stage. If we add level boarding, benches and clear signs now, the extra cost is small. If we wait, it is bound to be much higher.

        Secondly, a city that works for older people works for everyone. Wider sidewalks help parents with strollers. Public restrooms help delivery drivers and tourists. Benches every few hundred meters help anyone carrying heavy shopping. Designing for age is not a favor to one group; it is simply good design.

        Thirdly, loneliness. Many older residents tell us that they stop going out not because they are unwell, but because the journey has become stressful: busy crossings, broken sidewalks, nowhere to rest. When people stop going out, they lose contact with friends and neighbors, and their health is likely to get worse. Small changes can keep people connected for years longer.

        Now, some of you may be thinking: with so many pressing problems, is this really a priority? It's a fair question. Our budget is limited, and housing and climate are urgent issues too. But these goals are not in competition. A walkable neighborhood with local shops, parks and good public transport is greener, healthier and better for every generation.

        So what am I asking for? Three things. First, that every new public project includes an age-friendly checklist. Second, that residents over seventy are invited to test new designs before they are built. And third, that the council commits to reviewing progress every two years.

        To sum up: we are on the verge of a historic change in the age of our population. We can see it coming, which means we can prepare for it. In twenty-five years' time, I hope we will look back and say that we planned well — for our parents, for ourselves and for our children. Thank you.
    pronunciation:
      title: Pausing and stress in presentations
      body: |
        Confident presenters **pause** after signposting phrases and before key points, and they stress the words that carry the structure: *FIRSTly | it is CHEAPer.* *So what am I ASKing for? | THREE things.*

        Rhetorical questions usually end with a **fall**, not a rise, because the speaker is about to answer them. Speak a little more slowly than in conversation — what feels slow to you sounds clear to your audience. Listen and repeat.
      items: |
        Let me give you three reasons.
        Firstly, it is cheaper.
        So what am I asking for?
        Some of you may be thinking…
        To sum up
        It is bound to be much higher.
    mistakes: |
      The new station is due to opening next year. => The new station is due to open next year. | Be due to (scheduled) is followed by a base form.
      We are on the verge to find a solution. => We are on the verge of finding a solution. | Be on the verge of is followed by a noun or -ing.
      Prices are bound rising if we wait. => Prices are bound to rise if we wait. | Be bound to is followed by a base form.
    task:
      title: Make your case
      mode: speaking
      body: |
        Prepare a three-minute presentation for a community forum, making the case for one change in your town or workplace (for example, a four-day week, a car-free school street, a repair café or a new night bus). Open with a question or a striking fact, give three reasons with signposting, deal with one objection, make a clear proposal and finish with a memorable conclusion. Use at least three future expressions (be set to, be due to, be bound to…). Then present your argument and answer questions from the AI coach in the "Taking part in a business meeting" scenario.
    exercises: |
      mc: What is the speaker's main argument? || Older people should move to the countryside. | *The city should start designing for an older population now. | The tram line should be canceled to save money. || "We need to start designing our streets, homes and services for that future now — not when it arrives." || @ctx reading @skill reading @tags en.reading
      tf: The new tram line has already opened. || false || It "is due to open in two years" and is about to enter its final design stage. || @ctx reading @tags en.reading
      short: How many reasons does the speaker give for her argument? || kw: three/3 || "Let me give you three reasons": cost, design for everyone, and loneliness. || @ctx reading @tags en.reading
      mc: How does the speaker respond to the objection that this isn't a priority? || She says the budget is unlimited. | *She argues that age-friendly design and other goals support each other. | She says housing and climate are not important. || "These goals are not in competition. A walkable neighborhood… is greener, healthier and better for every generation." || @ctx reading @skill reading @tags en.reading
      fill: The new tram line is ___ to open in two years, according to the official schedule. || due || Be due to + base form = scheduled. || @tags en.future-forms
      fill: If we wait, the cost is ___ to be much higher — I'm certain of it. || bound || Be bound to + base form = certain to happen. || @tags en.future-forms
      mc: The city's population ___ to reach two million by 2040, according to the latest forecasts. || *is set | is about | is on the verge || Be set to = very likely, according to plans or forecasts. Be about to is for the immediate future, and on the verge needs of. || @tags en.future-forms
      rw: Rewrite using "be on the verge of" :: Scientists are very close to discovering a new treatment. || Scientists are on the verge of discovering a new treatment. || Be on the verge of + -ing = very close to doing something. || @tags en.future-forms
      rw: Rewrite using "be bound to" :: I'm sure there will be questions about the cost. || There are bound to be questions about the cost. || There + be bound to + be = it is certain that there will be. || @tags en.future-forms
      match: I'd like to begin with a question. = opening the talk ; Let me give you three reasons. = previewing the structure ; Some of you may be thinking… = anticipating an objection ; So what am I asking for? = introducing the proposal ; To sum up… = concluding || Each signposting phrase is matched with its function in a presentation. || @hint Match each phrase with its function. @skill speaking @tags en.opinion
      listen: The report is due to be published on Friday, and it's bound to cause controversy, because it recommends closing two of the city's hospitals. || Why will the report be controversial? || It is going to be published late. | *It recommends closing two hospitals. | It was written by a famous politician. || "It's bound to cause controversy, because it recommends closing two of the city's hospitals." || @tags en.listening,en.future-forms
      order: We are on the verge of a historic change. || @tags en.future-forms
      dict: The number of people over eighty is set to triple. || be set to + base form
      ask: Give the opening of a short presentation making the case for a change in your town or workplace. Start with a question or a fact, state your position and preview your reasons. || kw: I'd like to/let me/I want to/today I'm going to & first/firstly/three reasons/two reasons & set to/due to/bound to/likely to/about to/on the verge of || Good morning, everyone. How many of you drove to work today? In our office, more than half of us did, and car park fees are set to double next year. I'd like to make the case for a company bike scheme. Let me give you three reasons: cost, health and the environment.
      write: Write the conclusion (100–120 words) of a presentation arguing for a change in your town, school or workplace. Summarize your reasons, repeat your proposal and end with a memorable final sentence. Use at least two future expressions. || min=90 || req: to sum up/in conclusion/to summarize/so | set to/due to/bound to/likely to/about to/on the verge of || To sum up, a car-free street outside our school would make the morning journey safer, healthier and calmer for everyone. Traffic around the gates is set to increase when the new houses are finished next year, and without action, an accident is bound to happen sooner or later. What I'm asking for is simple: a six-month trial, closing the street to cars for thirty minutes at the start and end of each school day. The council is due to review its road safety plan in March, so now is the moment to act. Let's give our children a street to walk on, not just a road to cross. Thank you.
