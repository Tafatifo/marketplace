      fill: ¿___ está el ascensor? (where) || Dónde || Where = dónde, with an accent. || @tags es.question-words
      fill: ¿___ es su número de pasaporte? (what) || Cuál || To ask for a piece of information with ser, use cuál. || @tags es.question-words
      mc: Which question asks "why"? || ¿Cuándo? | *¿Por qué? | ¿Porque? || ¿Por qué? (two words, accent) = why; porque = because; cuándo = when. || @tags es.question-words
      mc: The receptionist asks "¿Para cuántas noches?". She wants to know… || *how many nights you're staying | what time you're arriving | how many people are coming || Noches = nights; cuántas = how many. || @tags es.question-words
      match: ¿dónde? = where? ; ¿cuándo? = when? ; ¿quién? = who? ; ¿cómo? = how? ; ¿por qué? = why? || Dónde where · cuándo when · quién who · cómo how · por qué why. || @tags es.question-words
      mc: How much is the room? || €19 a night | *€90 a night, with breakfast | €90 for two nights || "Noventa euros por noche, con desayuno." || @ctx dialogue @skill reading @tags es.reading
      tf: Kim is booking three nights. || false || From Friday the 12th to Sunday the 14th is two nights: "Dos noches, entonces." || @ctx dialogue
      rw: Ask the question for this answer :: El desayuno es de siete a diez. || ¿A qué hora es el desayuno? | ¿Cuándo es el desayuno? || Ask about a time with ¿A qué hora…? or ¿Cuándo…? || @tags es.question-words
      tr: I'd like to book a single room for two nights. || Quería reservar una habitación individual para dos noches. | Quisiera reservar una habitación individual para dos noches. | Quiero reservar una habitación individual para dos noches. || Quería/quisiera + reservar; single room = habitación individual. || @tags es.ordering
      tr: Is breakfast included? || ¿El desayuno está incluido? | ¿Está incluido el desayuno? | ¿Incluye el desayuno? || Incluido agrees with desayuno (masculine); use estar. || @tags es.questions
      listen: Su habitación es la veintitrés, en la segunda planta. El ascensor está a la izquierda. || Which floor is the room on? || The first | *The second | The third || "En la segunda planta" — on the second floor. Veintitrés is the room number. || @tags es.numbers
      dict: Tengo una reserva a nombre de Pablo Ortega.
