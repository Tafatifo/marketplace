language: es
level: A2
title: "Spanish A2 · Everyday life"
description: Talk about your past, your health, your work and your home, deal with everyday services, celebrate with friends and make plans — in natural, everyday Spanish.
hours: 90
summary: >-
  A2 learners can understand sentences and frequently used expressions about areas of immediate relevance —
  personal and family history, health, work, housing, shopping and local services — and can communicate in simple,
  routine tasks that need a direct exchange of information. This course builds on Spanish A1 with the past tenses,
  advice and obligation, comparisons, object pronouns and the future, across around 90 hours of guided practice
  in 8 units.
objectives:
  - Talk about past events, experiences and your life story with the preterite and the present perfect
  - Describe a holiday, plan a trip and sort out common travel problems
  - Explain symptoms, understand medical advice and talk about healthy habits
  - Talk about your studies, your work experience and past habits with the imperfect
  - Compare flats, neighbourhoods and other options, and talk about home life
  - Deal with banks, post offices, shops and phone calls using object pronouns
  - Invite people, accept and decline politely, and give good wishes at celebrations
  - Talk about future plans, make arrangements and set conditions
canDo:
  listening:
    - Understand the main point of short, clear messages and announcements about everyday matters
    - Follow a simple conversation about past events, plans or problems when people speak clearly
  reading:
    - Find specific information in everyday texts such as adverts, timetables, leaflets and notices
    - Understand short personal emails and messages about past events and plans
  spokenInteraction:
    - Handle short social exchanges and routine transactions at a doctor's, a bank, a shop or a hotel
    - Make and respond to invitations, suggestions and arrangements
  spokenProduction:
    - Describe your background, your studies or job, past experiences and future plans in a series of simple sentences
  writing:
    - Write short, simple notes, messages and personal emails about past events and plans
    - Write a simple description of an experience, a place or a person
grammar:
  - "Pretérito indefinido: regular verbs and spelling changes (llegué, empecé, leyó)"
  - "Pretérito indefinido: irregular verbs (ser/ir, estar, tener, hacer, poder, venir…) and -ir stem changes (pidió, durmió)"
  - Pretérito perfecto (he hablado), irregular past participles, and perfecto vs indefinido in Spain
  - doler and other health expressions (me duele, tengo fiebre, estoy resfriado)
  - Affirmative imperative (tú and usted) for advice and instructions
  - Obligation and advice with tener que, hay que and deber
  - Pretérito imperfecto for past habits and descriptions
  - desde, hace and desde hace
  - Comparatives (más/menos… que, tan… como, tanto como, mejor/peor, mayor/menor)
  - por and para (introduction)
  - Direct and indirect object pronouns and their position
  - Simple future (regular and irregular verbs)
  - Conditional for polite requests and invitations (¿podrías…?, me gustaría)
  - Si + present for real conditions
  - Superlatives (el/la más…, -ísimo)
vocabularyDomains:
  - Past events and life stages
  - Holidays, transport and travel problems
  - The body, symptoms and the pharmacy
  - Studies, jobs and applications
  - Housing, furniture and household chores
  - Banks, post offices, shops and phone calls
  - Festivals, parties, gifts and good wishes
  - Plans, arrangements and choices
assessment: A 45-minute cumulative test covering vocabulary, grammar, listening and reading tasks from all eight units, with a short writing task. A score of 70% or more confirms the A2 level.
units:
  - title: Historias de vida
    theme: Life stories
    lessons: ["Last weekend", "My life so far", "Childhood memories"]
  - title: Vacaciones y viajes
    theme: Holidays and travel
    lessons: ["A holiday to remember", "Planning a trip", "When things go wrong on a trip"]
  - title: La salud y el cuerpo
    theme: Health and the body
    lessons: ["Aches and pains", "At the doctor's and the pharmacy", "Healthy habits"]
  - title: Trabajo y estudios
    theme: Work and studies
    lessons: ["My studies", "A day at work", "Applying for a job"]
  - title: Mi casa, mi barrio
    theme: Home and housing
    lessons: ["Finding a flat", "Furniture and chores", "Neighbours and community"]
  - title: Trámites y recados
    theme: Services and errands
    lessons: ["At the bank and the post office", "Returns and exchanges", "Phone calls and messages"]
  - title: Fiestas y tradiciones
    theme: Celebrations and traditions
    lessons: ["Festivals and holidays", "Invitations and parties", "Gifts and good wishes"]
  - title: Planes y decisiones
    theme: Plans and choices
    lessons: ["Future plans", "Making arrangements", "Comparing options"]
assessmentItems: |
  fill: Ayer Marta ___ (trabajar) hasta las nueve de la noche. || trabajó || Ayer points to a finished past action: preterite, él/ella form trabajó (with an accent). || @tags es.preterite @obj Talk about past events, experiences and your life story with the preterite and the present perfect
  short: In Spanish, how do you ask a friend what they did last weekend? || kw: hiciste & fin de semana/finde || ¿Qué hiciste el fin de semana pasado? — hacer is irregular in the preterite: hice, hiciste, hizo… || @tags es.preterite-irregular,es.questions
  fill: El verano pasado ___ (ir, nosotros) a Galicia en tren. || fuimos || Ir is irregular in the preterite: fui, fuiste, fue, fuimos, fuisteis, fueron. || @tags es.preterite-irregular @obj Describe a holiday, plan a trip and sort out common travel problems
  tr: I have never been to Mexico. || Nunca he estado en México. | No he estado nunca en México. | Nunca he ido a México. | No he ido nunca a México. || Life experience with nunca uses the present perfect: he estado / he ido. || @tags es.present-perfect
  fill: A Pablo le ___ mucho los pies después de la excursión. || duelen || Doler works like gustar: the verb agrees with what hurts — los pies (plural) → duelen. || @tags es.doler @obj Explain symptoms, understand medical advice and talk about healthy habits
  mc: The doctor (who uses usted) tells you to drink plenty of water. She says: || *Beba mucha agua. | Bebe mucha agua. | Bebo mucha agua. || The usted imperative of -er verbs ends in -a: beba. Bebe is the tú form; bebo is the present (I drink). || @tags es.imperative
  fill: Cuando era pequeña, ___ (vivir, yo) en un pueblo cerca de Teruel. || vivía || Past habits and situations use the imperfect: -er/-ir verbs take -ía → vivía. || @tags es.imperfect @obj Talk about your studies, your work experience and past habits with the imperfect
  mc: Trabajo en este hospital ___ 2019. || *desde | hace | desde hace || Desde + a starting point (a year, a date); desde hace + a length of time (desde hace cinco años). || @tags es.desde-hace
  tf: Read the advert — «Se busca camarero o camarera con experiencia. Horario de lunes a viernes, de 16:00 a 23:00.» The job is in the mornings. || false || The hours are 16:00–23:00: afternoons and evenings, Monday to Friday. || @skill reading @tags es.reading
  fill: Este piso cuesta 900 euros y el otro, 700. Este es ___ caro ___ el otro. || más ; que || 900 is more than 700: más + adjective + que. || @tags es.comparatives @obj Compare flats, neighbourhoods and other options, and talk about home life
  mc: Este regalo es ___ ti. ¡Feliz cumpleaños! || *para | por || Para marks the person who receives something: es para ti. || @tags es.por-para
  rw: Replace the noun with a pronoun :: Compro el pan en la panadería. || Lo compro en la panadería. || El pan is masculine singular, so the direct object pronoun is lo, placed before the verb. || @tags es.object-pronouns @obj Deal with banks, post offices, shops and phone calls using object pronouns
  fill: ¿Qué ___ vas a regalar a tu madre? || le || A tu madre is the indirect object (to whom?), so the pronoun is le. || @tags es.object-pronouns
  fill: El año que viene ___ (celebrar, nosotros) la boda en Sevilla. || celebraremos || Future of regular verbs: infinitive + ending (-emos for nosotros): celebraremos. || @tags es.future @obj Invite people, accept and decline politely, and give good wishes at celebrations
  mc: Which request is the most polite? || *¿Podría cerrar la ventana, por favor? | Cierra la ventana. | ¿Cerrar la ventana? || The conditional (podría) softens a request; a bare imperative or infinitive sounds abrupt. || @tags es.conditional,es.register
  mc: Your friend tells you it's her birthday today. You say: || *¡Felicidades! | ¡Buen viaje! | ¡Que aproveche! || ¡Felicidades! (or ¡Feliz cumpleaños!) is for birthdays; ¡Buen viaje! is for a journey and ¡Que aproveche! for a meal. || @skill vocabulary @tags es.vocabulary
  mc: Si mañana ___ sol, iremos a la playa. || *hace | hará | hacía || In a real condition, si takes the present (si hace sol) and the result goes in the future (iremos). || @tags es.si-clauses @obj Talk about future plans, make arrangements and set conditions
  fill: El Mulhacén es la montaña ___ alta de la Península Ibérica. || más || Superlative: el/la + más + adjective + de. At 3,479 m it is the highest peak on the peninsula. || @tags es.comparatives
  listen: Hola, soy Lucía. He perdido el tren de las cinco, así que llegaré a las ocho. ¡Hasta luego! || When will Lucía arrive? || At five | *At eight | At seven || She missed the five o'clock train (el tren de las cinco) and says llegaré a las ocho. || @tags es.listening,es.future
  listen: Tome una pastilla cada ocho horas, después de comer, y beba mucha agua. || How often should the patient take a pill? || *Every eight hours | Every two hours | Once a day || Cada ocho horas = every eight hours. || @tags es.listening,es.imperative
  listen: Tenemos dos pisos. El del centro cuesta ochocientos euros al mes y el de las afueras, seiscientos cincuenta. || How much does the flat outside the centre cost? || €800 a month | *€650 a month | €600 a month || Las afueras = the outskirts: seiscientos cincuenta (650) euros. || @tags es.listening,es.numbers
  write: Write an email to a Spanish-speaking friend about your last holiday — where you went, what you did and one problem you had — and say what you will do next summer. || min=50 || req: fui/fuimos | el verano que viene/el próximo verano/el año que viene/voy a/vamos a/iré/iremos || ¡Hola, Carmen! ¿Qué tal? En agosto fui a Asturias con mi hermano. Estuvimos diez días en un pueblo cerca del mar. Comimos muy bien, visitamos Oviedo e hicimos muchas rutas por la montaña. El último día perdimos el autobús y tuvimos que coger un taxi. ¡Fue carísimo! El verano que viene iremos a Andalucía. ¿Y tú? ¿Qué hiciste en vacaciones? Un abrazo, Tom
