  rw: Attach the pronouns to the command :: Me lo explicas. (make it an affirmative tú command) || Explícamelo. || Affirmative commands take pronouns at the end, with a written accent to keep the stress: explícamelo. || @tags es.object-pronouns,es.imperative
  tr: I'm going to give it to her tomorrow. (the present: el regalo) || Se lo voy a dar mañana. | Voy a dárselo mañana. | Mañana se lo voy a dar. | Mañana voy a dárselo. || Le → se before lo; the pronouns go before voy or are attached to dar (dárselo). || @tags es.object-pronouns
