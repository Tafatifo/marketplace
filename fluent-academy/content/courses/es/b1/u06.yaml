unit: 6
title: Salud y estilo de vida
theme: Health and lifestyle
description: Talk about stress and wellbeing, food culture and sport — describing what people do in general with impersonal se, and handling things at the table and the gym with double object pronouns.
objectives:
  - Describe habits and give general recommendations with impersonal se
  - Offer, ask for and pass things with double object pronouns (te lo, se la)
  - Place pronouns with infinitives, gerunds and commands (explícamelo, voy a explicártelo)
canDo:
  - I can explain how people in my country deal with stress and sleep.
  - I can share a recipe and talk about meals and food customs.
  - I can ask for, offer and pass things at the table naturally.
  - I can understand and give instructions at the gym or a sports class.
review: |
  fill: En mi país ___ (comer) muy pronto, a las doce o las doce y media. || se come || Impersonal se + third-person singular talks about people in general. || @tags es.passive
  fill: Para dormir mejor, ___ (aconsejar) no mirar el móvil antes de acostarse. || se aconseja || With an infinitive, impersonal se takes a singular verb: se aconseja. || @tags es.passive
  mc: Choose the correct sentence. || Se recomienda descansos cada hora. | *Se recomiendan descansos cada hora. | Se recomiendas descansos cada hora. || With a plural noun, the verb agrees: se recomiendan descansos. || @tags es.passive
  fill: —¿Le has devuelto el libro de recetas a tu tía? —Sí, ya ___ he devuelto. || se lo || Le becomes se before lo: se lo. || @tags es.object-pronouns
  fill: —¿Nos enseñas las fotos de la boda? —Claro, ahora ___ enseño. || os las || Indirect pronoun first (os), then direct (las, for las fotos). || @tags es.object-pronouns
