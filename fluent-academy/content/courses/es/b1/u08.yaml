unit: 8
title: Sociedad y viajes
theme: Society and travel
description: Talk about responsible tourism, imagine what you would do in hypothetical situations, and discuss customs and stereotypes — with the imperfect subjunctive and si + imperfect subjunctive + conditional.
objectives:
  - Form the imperfect subjunctive of regular and irregular verbs
  - Talk about hypothetical situations with si + imperfect subjunctive + conditional
  - Contrast real conditions (si + present) with imaginary ones, and use como si
canDo:
  - I can suggest ways to travel more responsibly and say what would happen if we did.
  - I can say what I would do in imaginary situations and ask others the same.
  - I can distinguish real possibilities from hypothetical ones when I speak.
  - I can discuss stereotypes about my country and others politely.
review: |
  fill: Si ___ (viajar, nosotros) en tren, contaminaríamos mucho menos. || viajáramos / viajásemos || Si + imperfect subjunctive for an imaginary situation. Nosotros has a written accent: viajáramos. || @tags es.si-clauses,es.imperfect-subjunctive
  fill: Si me tocara la lotería, ___ (dar, yo) la vuelta al mundo. || daría || The result of a hypothetical condition takes the conditional. || @tags es.si-clauses,es.conditional
  fill: Si ___ (poder, yo) vivir en otro país, me iría a Chile. || pudiera / pudiese || Poder → pudieron → pudiera. || @tags es.imperfect-subjunctive
  mc: Choose the correct sentence. || Si tendría tiempo, haría un curso de cocina. | *Si tuviera tiempo, haría un curso de cocina. | Si tuviera tiempo, hago un curso de cocina. || Never use the conditional after si: si tuviera…, haría… || @tags es.si-clauses
  mc: Which sentence describes a real, likely plan? || Si fuera a Sevilla, vería la catedral. | *Si voy a Sevilla, veré la catedral. | Si iría a Sevilla, vería la catedral. || Real condition: si + present, then future or present. || @tags es.si-clauses
  fill: Mi tío habla de Inglaterra como si siempre ___ (llover). || lloviera / lloviese || Como si is always followed by the imperfect subjunctive. || @tags es.imperfect-subjunctive
  rw: Make it hypothetical :: Si tengo vacaciones en mayo, iré a Lisboa. || Si tuviera vacaciones en mayo, iría a Lisboa. | Si tuviese vacaciones en mayo, iría a Lisboa. || Si + imperfect subjunctive (tuviera) + conditional (iría). || @tags es.si-clauses,es.imperfect-subjunctive
  tr: If I were you, I would travel in the low season. || Si yo fuera tú, viajaría en temporada baja. | Si fuera tú, viajaría en temporada baja. | Yo que tú, viajaría en temporada baja. | Si yo fuese tú, viajaría en temporada baja. | Yo en tu lugar viajaría en temporada baja. || Si yo fuera tú (or yo que tú) + conditional. || @tags es.si-clauses
  listen: Si los turistas respetaran más los horarios de descanso, los vecinos del centro no estarían tan enfadados. || What would make the residents less angry? || *Tourists respecting rest hours | Fewer hotels in the centre | Cheaper rents || «Si los turistas respetaran más los horarios de descanso…» || @tags es.listening,es.si-clauses
  listen: Si pudiera volver a tener veinte años, me iría un año de Erasmus a Italia. || What would the speaker do? || Study in Spain | *Spend a year in Italy on Erasmus | Learn Italian at home || «Me iría un año de Erasmus a Italia.» || @tags es.listening,es.si-clauses
  ask: A friend asks «¿Qué harías si pudieras viajar a cualquier lugar del mundo?». Answer with two ideas. || kw: si pudiera/si pudiese & iría/viajaría/visitaría/me quedaría/haría || Si pudiera viajar a cualquier lugar, iría a Patagonia. Haría senderismo por los glaciares y me quedaría en casas de familias del lugar.
  write: Write a short text (70–90 words) for a travel forum: describe a stereotype about your country, say what is true and what isn't, and say what would change if more people visited it. || min=60 || req: si | sería/habría/conocería/vería/cambiaría/descubriría || Mucha gente piensa que en Irlanda siempre llueve y que todos bebemos cerveza. Es verdad que llueve bastante, pero también hay días preciosos de sol. Y muchos irlandeses no beben alcohol. Si más personas visitaran el oeste del país, descubrirían paisajes increíbles y una cultura musical muy rica. Además, si viajaran fuera del verano, verían un país mucho más tranquilo y auténtico.
lessons:
  - title: Travelling responsibly
    summary: Discuss the effects of tourism and suggest ways to travel more responsibly, imagining the results with si + imperfect subjunctive + conditional.
    minutes: 45
    skills: [reading, grammar, writing]
    tags: [es.imperfect-subjunctive, es.si-clauses]
    objectives:
      - Talk about the effects of tourism and responsible travel
      - Form the imperfect subjunctive from the ellos form of the indefinido
      - Imagine results with si + imperfect subjunctive + conditional
    intro: |
      Spain is one of the most visited countries in the world, and tourism brings both jobs and problems. To discuss possible changes — *What would happen if we all travelled in the low season?* — Spanish uses a new tense, the **imperfect subjunctive**, together with the conditional: *Si **viajáramos** en temporada baja, los destinos no **estarían** tan llenos.*
    vocab: |
      el destino | destination | n | Mallorca es un destino muy popular en verano. | Mallorca is a very popular summer destination. | g: m
      la temporada baja | low season; off-season | n | En temporada baja los hoteles son mucho más baratos. | In the low season hotels are much cheaper. | g: f | n: The opposite is la temporada alta.
      saturado | overcrowded; saturated | adj | En agosto la playa está saturada. | In August the beach is overcrowded.
      el alojamiento | accommodation | n | El alojamiento es lo más caro del viaje. | Accommodation is the most expensive part of the trip. | g: m
      la casa rural | country guesthouse; rural cottage | n | Pasamos el puente en una casa rural en Asturias. | We spent the long weekend in a country cottage in Asturias. | g: f
      el impuesto turístico | tourist tax | n | El hotel cobra un impuesto turístico por noche. | The hotel charges a tourist tax per night. | g: m
      sostenible | sustainable | adj | Queremos hacer un turismo más sostenible. | We want to practise more sustainable tourism.
      el patrimonio | heritage | n | El casco antiguo es patrimonio de la humanidad. | The old town is a World Heritage site. | g: m
      la artesanía | crafts; handicrafts | n | Compré artesanía local en el mercado. | I bought local crafts at the market. | g: f
      el trayecto | journey; trip (from A to B) | n | El trayecto en tren dura dos horas y media. | The train journey takes two and a half hours. | g: m
      respetar | to respect | v | Hay que respetar el descanso de los vecinos. | You have to respect the residents' rest.
      salir ganando | to come out ahead; to benefit | expr | Con este cambio, todos salimos ganando. | With this change, we all benefit.
    grammar:
      title: "The imperfect subjunctive: si viajáramos…"
      body: |
        To form the **imperfect subjunctive**, take the **ellos** form of the indefinido, remove **-ron** and add **-ra, -ras, -ra, -ramos, -rais, -ran**. The nosotros form always has a written accent.
        *viajaron → viaja**ra**, viaja**ras**, viaja**ra**, viajá**ramos**, viaja**rais**, viaja**ran***

        Because it comes from the indefinido, all irregular preterites carry over: *tuvieron → **tuviera***, *fueron → **fuera*** (ser and ir), *hicieron → **hiciera***, *pudieron → **pudiera***, *dijeron → **dijera***, *estuvieron → **estuviera***, *eligieron → **eligiera***.

        There is a second set of endings in **-se** (*viajase, tuviese, fuese*). Both are correct and mean the same; *-ra* is more common in speech.

        Its key use at B1 is in **hypotheses** about the present or future — situations that are unlikely or imaginary: **si + imperfect subjunctive, conditional**: *Si **viajáramos** en tren, **contaminaríamos** menos.* The si-clause can also come second: *Contaminaríamos menos si viajáramos en tren.* Never put the conditional after **si**.
      table: |
        Infinitive | ellos (indefinido) | Imperfect subjunctive (yo) | nosotros
        viajar | viajaron | viajara | viajáramos
        elegir | eligieron | eligiera | eligiéramos
        tener | tuvieron | tuviera | tuviéramos
        ser / ir | fueron | fuera | fuéramos
        hacer | hicieron | hiciera | hiciéramos
        poder | pudieron | pudiera | pudiéramos
      examples: |
        Si viajáramos en temporada baja, pagaríamos menos. | If we travelled in the low season, we would pay less. | si + imperfect subjunctive, conditional
        Si eligiéramos el tren, contaminaríamos mucho menos. | If we chose the train, we would pollute much less. | elegir → eligieron → eligiéramos
        El dinero se quedaría en la zona si nos alojáramos en casas rurales. | The money would stay in the area if we stayed in rural guesthouses. | si-clause second
        Si todos fueran más respetuosos, los vecinos estarían más contentos. | If everyone were more respectful, the residents would be happier. | ser → fueran
      tip: "Learn the ellos indefinido forms well (tuvieron, pudieron, hicieron): once you know them, the imperfect subjunctive is easy."
    reading:
      title: ¿Y si viajáramos de otra manera?
      text: |
        España es uno de los países más visitados del mundo. El turismo crea empleo y riqueza, pero en algunos lugares también provoca problemas: calles llenas, alquileres cada vez más caros para los vecinos y playas y montañas que sufren el paso de miles de personas cada día.

        Por eso cada vez se habla más de turismo responsable. ¿Qué pasaría si todos cambiáramos un poco nuestra forma de viajar? Para empezar, si viajáramos en temporada baja, los destinos más famosos no estarían tan saturados y nosotros pagaríamos menos. Si eligiéramos el tren en lugar del avión para los trayectos cortos, contaminaríamos mucho menos. Y si nos alojáramos en pensiones o casas rurales de familias del lugar, el dinero se quedaría en la zona.

        También hay pequeños gestos que marcan la diferencia: comer en restaurantes de barrio, comprar artesanía local, respetar los horarios de descanso de los vecinos o no salir de los senderos señalizados en los parques naturales.

        Algunas comunidades, como Cataluña y las Islas Baleares, ya cobran un impuesto turístico por cada noche de hotel para financiar la protección del medio ambiente y del patrimonio. Hay quien piensa que es injusto; otros creen que, si todos los destinos lo cobraran, el turismo sería más sostenible.

        Al final, viajar de forma responsable no significa viajar menos, sino viajar mejor. Si cada viajero pensara un poco en el lugar que visita, todos saldríamos ganando.
      translation: |
        Spain is one of the most visited countries in the world. Tourism creates jobs and wealth, but in some places it also causes problems: crowded streets, rents that are more and more expensive for residents, and beaches and mountains that suffer from thousands of people passing through every day.

        That's why people talk more and more about responsible tourism. What would happen if we all changed the way we travel a little? To begin with, if we travelled in the low season, the most famous destinations wouldn't be so overcrowded and we would pay less. If we chose the train instead of the plane for short journeys, we would pollute much less. And if we stayed in guesthouses or rural cottages run by local families, the money would stay in the area.

        There are also small gestures that make a difference: eating in neighbourhood restaurants, buying local crafts, respecting residents' rest hours, or not leaving the marked paths in nature parks.

        Some regions, such as Catalonia and the Balearic Islands, already charge a tourist tax for every night in a hotel to fund the protection of the environment and heritage. Some people think it's unfair; others believe that, if every destination charged it, tourism would be more sustainable.

        In the end, travelling responsibly doesn't mean travelling less, but travelling better. If every traveller thought a little about the place they visit, we would all benefit.
    pronunciation:
      title: "viajara or viajará?"
      body: |
        The imperfect subjunctive **viajara** is stressed on the second-to-last syllable: *via-**ja**-ra*. The future **viajará** is stressed on the last syllable and has a written accent: *via-ja-**rá***. The meaning changes completely: *si viajara* (if I travelled) / *viajará* (he will travel). In the nosotros form the stress moves back and the accent is written: *via-**já**-ra-mos*, *tu-**vié**-ra-mos*.
      items: |
        viajara
        viajará
        viajáramos
        tuviéramos
        fuera
        pudiera
    culture:
      title: Tourism in Spain
      body: |
        Spain is regularly among the two most visited countries in the world, and tourism is one of the main pillars of its economy. In very popular places — parts of Barcelona, Palma, Málaga or the Canary Islands — residents complain about crowds and about flats being turned into holiday rentals, which pushes up rents.

        Catalonia and the Balearic Islands charge a **tourist tax** per night, and many towns are trying to spread visitors throughout the year and towards less-known inland areas, where a weekend in a **casa rural** is a very Spanish way to travel.
    mistakes: |
      Si viajaríamos en tren, contaminaríamos menos. => Si viajáramos en tren, contaminaríamos menos. | Never use the conditional after si: use the imperfect subjunctive.
      Si tendría más vacaciones, viajaría más. => Si tuviera más vacaciones, viajaría más. | Tener → tuvieron → tuviera.
      Si fuéramos en temporada baja, pagamos menos. => Si fuéramos en temporada baja, pagaríamos menos. | The result of a hypothetical condition takes the conditional.
    task:
      title: Tips for responsible visitors
      mode: writing
      body: |
        Write a short guide (90–120 words) for visitors to your town or region. Describe one problem that tourism causes there, and give at least four ideas of the type *Si los visitantes…, …* (si + imperfect subjunctive + conditional), plus one direct piece of advice (*te recomiendo que…*).
    exercises: |
      mc: According to the article, what would happen if we travelled in the low season? || *Destinations would be less crowded and we would pay less. | Hotels would close for the winter. | Trains would be more expensive. || «Los destinos más famosos no estarían tan saturados y nosotros pagaríamos menos.» || @ctx reading @tags es.reading
      tf: All Spanish regions charge a tourist tax. || false || Only some regions, «como Cataluña y las Islas Baleares», charge it. || @ctx reading @tags es.reading
      short: Which means of transport does the article recommend for short journeys? || kw: tren/train || «Si eligiéramos el tren en lugar del avión para los trayectos cortos…» || @ctx reading @tags es.reading
      fill: Si ___ (viajar, nosotros) en temporada baja, pagaríamos menos. || viajáramos / viajásemos || Si + imperfect subjunctive. Nosotros has a written accent. || @tags es.imperfect-subjunctive,es.si-clauses
      fill: Si los turistas ___ (respetar) más los horarios, los vecinos estarían más contentos. || respetaran / respetasen || Respetaron → respetaran. || @tags es.imperfect-subjunctive
      fill: Si ___ (tener, yo) más vacaciones, haría el Camino de Santiago entero. || tuviera / tuviese || Tener → tuvieron → tuviera. || @tags es.imperfect-subjunctive
      fill: Si eligiéramos el tren, ___ (contaminar, nosotros) mucho menos. || contaminaríamos || The result clause takes the conditional. || @tags es.si-clauses,es.conditional
      mc: Choose the correct sentence. || Si viajaríamos en tren, contaminaríamos menos. | *Si viajáramos en tren, contaminaríamos menos. | Si viajáramos en tren, contaminamos menos. || Si + imperfect subjunctive, then the conditional. || @tags es.si-clauses
      mc: «Prefiero viajar en temporada baja» means… || *I prefer to travel in the off-season. | I prefer to travel at low tide. | I prefer to travel on a low budget. || La temporada baja = the low season, when there are fewer tourists. || @skill vocabulary @tags es.vocabulary
      rw: Make it hypothetical, starting with "Si fuéramos…" :: Si vamos en agosto, habrá mucha gente. || Si fuéramos en agosto, habría mucha gente. | Si fuésemos en agosto, habría mucha gente. || Ir → fueron → fuéramos; the future habrá becomes the conditional habría. || @tags es.si-clauses,es.imperfect-subjunctive
      tr: If everyone travelled less by plane, we would pollute less. || Si todos viajáramos menos en avión, contaminaríamos menos. | Si todo el mundo viajara menos en avión, contaminaríamos menos. | Si todos viajásemos menos en avión, contaminaríamos menos. | Si todo el mundo viajase menos en avión, contaminaríamos menos. || Si + imperfect subjunctive + conditional. Todo el mundo takes a singular verb. || @tags es.si-clauses
      listen: Si los hoteles del centro pagaran más impuestos, el ayuntamiento podría arreglar las calles del casco antiguo. || What could the council do? || Build more hotels | *Repair the streets of the old town | Lower taxes for residents || «El ayuntamiento podría arreglar las calles del casco antiguo.» || @tags es.listening,es.si-clauses
      dict: Si viajáramos en temporada baja, todo sería más barato.
      say: Si eligiéramos el tren, contaminaríamos mucho menos. || If we chose the train, we would pollute much less.

  - title: "What would you do if…?"
    summary: Imagine what you would do in hypothetical situations and ask others, with ¿qué harías si…? and si + imperfect subjunctive + conditional.
    minutes: 45
    skills: [speaking, listening, grammar]
    tags: [es.si-clauses, es.imperfect-subjunctive, es.conditional]
    objectives:
      - Ask and answer ¿Qué harías si…? questions
      - Use irregular imperfect subjunctives (pudiera, supiera, fuera, tuviera)
      - Give advice with si yo fuera tú
    intro: |
      *¿Qué harías si te tocara la lotería?* is a classic question on long car journeys and at dinner with friends. Imagining is fun — and it is the perfect way to practise **si + imperfect subjunctive + conditional** with all its irregular forms. In this lesson, three friends on a road trip play the "What would you do if…?" game.
    vocab: |
      tocar la lotería | to win the lottery | expr | Si me tocara la lotería, me compraría una casa en la playa. | If I won the lottery, I'd buy a house on the beach. | n: Works like gustar: me toca, le tocó.
      dar la vuelta al mundo | to go round the world | expr | Mi sueño es dar la vuelta al mundo en velero. | My dream is to sail round the world.
      el huerto | vegetable garden; allotment | n | Mis padres tienen un huerto con tomates y pimientos. | My parents have a vegetable garden with tomatoes and peppers. | g: m
      el refugio de animales | animal shelter | n | Los sábados ayudo en un refugio de animales. | On Saturdays I help at an animal shelter. | g: m
      te toca | it's your turn | expr | Venga, te toca. ¿Qué eliges? | Come on, it's your turn. What do you choose? | n: Me toca, nos toca, le toca…
      cualquier | any (at all) | adj | Podrías vivir en cualquier ciudad del mundo. | You could live in any city in the world. | n: Before a noun: cualquier país; after it: un país cualquiera.
      la grúa | tow truck; crane | n | Tuvimos que llamar a la grúa en mitad de la autopista. | We had to call the tow truck in the middle of the motorway. | g: f
      la autopista | motorway; highway | n | Por la autopista llegamos en tres horas. | On the motorway we'll get there in three hours. | g: f
      quedarse sin gasolina | to run out of petrol | expr | Nos quedamos sin gasolina a diez kilómetros del pueblo. | We ran out of petrol ten kilometres from the village.
      atreverse a | to dare to | v | No me atrevería a saltar en paracaídas. | I wouldn't dare to go skydiving.
      en mi lugar | in my place; if you were me | expr | ¿Qué harías tú en mi lugar? | What would you do in my place?
      ¡ni lo digas! | don't even say it! | expr | ¿Que llueva el día de la boda? ¡Ni lo digas! | Rain on the wedding day? Don't even say it!
    grammar:
      title: "¿Qué harías si…? Hypotheses with si"
      body: |
        To talk about a situation that is **unlikely or imaginary** now or in the future, use **si + imperfect subjunctive** for the condition and the **conditional** for the result:
        *Si me **tocara** la lotería, **dejaría** el trabajo.* *Si **pudiera** elegir, **viviría** en Japón.*

        To ask, use **¿Qué harías si…?** (tú), **¿Qué haría usted si…?** or **¿Qué haríais si…?** (vosotros).

        You will need the most common irregular forms:
        - *poder → **pudiera***, *saber → **supiera***, *querer → **quisiera***, *poner → **pusiera***
        - *ser / ir → **fuera***, *estar → **estuviera***, *tener → **tuviera***, *venir → **viniera***
        - *hacer → **hiciera***, *decir → **dijera***, *dormir → **durmiera***, *pedir → **pidiera***

        **Si yo fuera tú** + conditional is another way to give advice, like *yo que tú* from Unit 2: *Si yo fuera tú, aceptaría la oferta.*
      table: |
        Condition (si + imperfect subjunctive) | Result (conditional)
        Si me tocara la lotería, | dejaría el trabajo.
        Si pudiera vivir en otro país, | viviría en Japón.
        Si no trabajara, | me aburriría muchísimo.
        Si supiera bailar tango, | me iría a Argentina.
        Si yo fuera tú, | aceptaría la oferta.
      examples: |
        ¿Qué harías si pudieras vivir en cualquier país? | What would you do if you could live in any country? | question
        Si supiera cocinar, abriría un restaurante pequeño. | If I knew how to cook, I would open a small restaurant. | saber → supiera
        Si no tuviéramos que trabajar mañana, nos quedaríamos más. | If we didn't have to work tomorrow, we would stay longer. | negative condition
        Si yo fuera tú, no me atrevería a viajar solo por la selva. | If I were you, I wouldn't dare travel alone through the jungle. | advice
      tip: "Practise in pairs: one person says only the si-clause (Si fuera invisible…) and the other completes it with a conditional."
    dialogue:
      title: Un juego en el coche
      setting: Three friends are driving from Bilbao to Galicia for a long weekend. Leire is driving; to pass the time, Marcos and Yolanda start a game of "What would you do if…?".
      speakers: L=Leire/f; M=Marcos/m; Y=Yolanda/f
      lines: |
        L: Venga, juguemos a algo. ¿Qué haríais si os tocara la lotería? | Come on, let's play something. What would you do if you won the lottery?
        M: Fácil: dejaría el trabajo y me iría a dar la vuelta al mundo. | Easy: I'd quit my job and go round the world.
        Y: ¿De verdad? Yo no lo dejaría. Si no trabajara, me aburriría muchísimo. | Really? I wouldn't quit. If I didn't work, I'd be terribly bored.
        L: Pues yo me compraría una casa con huerto y montaría un refugio de animales. | Well, I'd buy a house with a vegetable garden and set up an animal shelter.
        M: ¡Qué bonito! Bueno, te toca, Yolanda. Pregúntanos algo. | How lovely! Right, your turn, Yolanda. Ask us something.
        Y: A ver… ¿Qué haríais si pudierais vivir en cualquier país del mundo? | Let's see… What would you do if you could live in any country in the world?
        M: Si pudiera elegir, viviría en Japón. Siempre he querido aprender japonés. | If I could choose, I'd live in Japan. I've always wanted to learn Japanese.
        L: Yo no me iría de España. Si viviera fuera, echaría muchísimo de menos a mi familia. | I wouldn't leave Spain. If I lived abroad, I'd miss my family terribly.
        Y: Yo me iría a Argentina. Si supiera bailar tango, ya estaría allí. | I'd go to Argentina. If I knew how to dance the tango, I'd already be there.
        M: Última pregunta: ¿qué haríais si el coche se parara ahora mismo en la autopista? | Last question: what would you do if the car stopped right now on the motorway?
        L: Pues llamaríamos a la grúa y, mientras tanto, seguiríamos jugando. | Well, we'd call the tow truck and, in the meantime, we'd keep playing.
        Y: ¡Ni lo digas! Mira el indicador: casi no queda gasolina. | Don't even say it! Look at the gauge: there's hardly any petrol left.
    pronunciation:
      title: "The melody of hypotheses"
      body: |
        A hypothesis has two halves. The **si-clause** ends with the voice rising slightly, as if you were leaving the sentence open: *Si me tocara la lotería…* ↗. The **result** falls at the end, closing the idea: *…dejaría el trabajo* ↘. In questions like *¿Qué harías si…?*, the stress falls clearly on **ha-RÍ-as**. Practise the two halves separately, then together.
      items: |
        Si me tocara la lotería…
        …dejaría el trabajo.
        ¿Qué harías si…?
        Si pudiera elegir…
        Si yo fuera tú…
        ¡Ni lo digas!
    culture:
      title: El Gordo and Spanish lottery dreams
      body: |
        Every year on **22 December**, Spain watches the Christmas lottery draw, popularly called **El Gordo** (the fat one). Children from the San Ildefonso school in Madrid sing the winning numbers and prizes on live TV for hours, and many people listen at work or in bars.

        Tickets are very often shared: families, groups of friends, colleagues and even the regulars of a neighbourhood bar buy the same number together, so when a number wins, a whole town can celebrate at once. No wonder *¿Qué harías si te tocara el Gordo?* is a typical December conversation.
    mistakes: |
      Si me tocaría la lotería, me compraría una casa. => Si me tocara la lotería, me compraría una casa. | After si, use the imperfect subjunctive, not the conditional.
      Si tuviera tiempo, viajo más. => Si tuviera tiempo, viajaría más. | The result of a hypothetical condition takes the conditional.
      Si sabría bailar tango, me iría a Argentina. => Si supiera bailar tango, me iría a Argentina. | Saber → supieron → supiera.
    task:
      title: The "What would you do if…?" game
      mode: interaction
      body: |
        Write five ¿Qué harías si…? questions (a lottery win, a year off, being invisible for a day, living in another century, meeting your favourite artist). Ask a partner and answer their questions with at least two conditionals each. Then, in the "Handling a travel problem" scenario with the AI coach, deal with a problem on a trip and say what you would do if it got worse.
    exercises: |
      fill: Si me ___ (tocar) la lotería, dejaría de trabajar. || tocara / tocase || Si + imperfect subjunctive: tocaron → tocara. || @tags es.imperfect-subjunctive
      fill: ¿Qué ___ (hacer, tú) si pudieras vivir en cualquier país? || harías || The result is in the conditional: hacer → haría, harías. || @tags es.conditional,es.si-clauses
      fill: Si ___ (saber, yo) hablar japonés, me iría a vivir a Tokio. || supiera / supiese || Saber → supieron → supiera. || @tags es.imperfect-subjunctive
      fill: Si no ___ (tener, nosotros) que trabajar mañana, nos quedaríamos más tiempo. || tuviéramos / tuviésemos || Tener → tuvieron → tuviéramos (written accent). || @tags es.imperfect-subjunctive
      mc: Choose the correct sentence. || Si sería rico, viajaría por todo el mundo. | *Si fuera rico, viajaría por todo el mundo. | Si fuera rico, viajo por todo el mundo. || Si + imperfect subjunctive (fuera) + conditional (viajaría). || @tags es.si-clauses
      mc: In a game, «Te toca» means… || *It's your turn. | You've won. | It touches you. || Tocar a alguien = to be someone's turn: te toca, me toca. || @skill vocabulary @tags es.vocabulary
      tf: Yolanda would stop working if she won the lottery. || false || «Yo no lo dejaría. Si no trabajara, me aburriría muchísimo.» || @ctx dialogue
      short: Where would Marcos live if he could choose? || kw: Japón/Japan || «Si pudiera elegir, viviría en Japón.» || @ctx dialogue
      rw: Make it hypothetical :: Si tengo tiempo, aprenderé a tocar la guitarra. || Si tuviera tiempo, aprendería a tocar la guitarra. | Si tuviese tiempo, aprendería a tocar la guitarra. || Real → hypothetical: tengo → tuviera, aprenderé → aprendería. || @tags es.si-clauses,es.imperfect-subjunctive
      tr: What would you do if you were me? || ¿Qué harías si fueras yo? | ¿Qué harías tú si fueras yo? | ¿Qué harías en mi lugar? | ¿Qué haría usted si fuera yo? | ¿Qué harías si fueses yo? || ¿Qué harías si fueras yo? or ¿Qué harías en mi lugar? || @tags es.si-clauses
      listen: Si pudiera volver a tener veinte años, estudiaría Música en lugar de Económicas. || What would the speaker study? || Economics | *Music | Medicine || «Estudiaría Música en lugar de Económicas.» || @tags es.listening,es.si-clauses
      listen: @dialogue || What would Leire do if she won the lottery? || Go round the world | *Buy a house with a vegetable garden and set up an animal shelter | Keep working as before || «Me compraría una casa con huerto y montaría un refugio de animales.» || @tags es.listening
      dict: Si pudiera elegir, viviría cerca del mar.
      ask: Answer the question «¿Qué harías si tuvieras un año libre?» with two ideas. || kw: haría/viajaría/aprendería/viviría/iría/estudiaría/trabajaría/dedicaría/pasaría || Si tuviera un año libre, viajaría por Sudamérica en autobús y aprendería a hacer surf en Perú. También pasaría unos meses trabajando en una granja ecológica.

  - title: Customs and stereotypes
    summary: Discuss customs and stereotypes, contrasting real conditions (si + present) with hypothetical ones (si + imperfect subjunctive), and use como si.
    minutes: 45
    skills: [speaking, listening, grammar]
    tags: [es.si-clauses, es.imperfect-subjunctive]
    objectives:
      - Talk about customs, clichés and stereotypes respectfully
      - Choose between si + present (real) and si + imperfect subjunctive (hypothetical)
      - Use como si + imperfect subjunctive
    intro: |
      Siestas, flamenco, dinner at midnight: every country has its clichés. Talking about them is a great way to compare cultures — as long as we remember that every person is different. In this lesson you will also learn to choose between a **real** condition (*Si vienes a Granada, te llevo a ver flamenco*) and an **imaginary** one (*Si durmiera la siesta todos los días, llegaría tarde*), and to say *como si…* (as if).
    vocab: |
      el tópico | cliché; stereotype | n | Es un tópico que en España siempre hace sol. | It's a cliché that it's always sunny in Spain. | g: m | n: False friend: a topic is un tema.
      el estereotipo | stereotype | n | Las películas repiten muchos estereotipos. | Films repeat a lot of stereotypes. | g: m
      el prejuicio | prejudice | n | Viajar ayuda a perder prejuicios. | Travelling helps you lose your prejudices. | g: m
      la costumbre | custom; habit | n | Dar dos besos es una costumbre muy española. | Giving two kisses is a very Spanish custom. | g: f | c: tener la costumbre de; por costumbre
      generalizar | to generalise | v | No se puede generalizar: cada persona es distinta. | You can't generalise: every person is different.
      acostumbrarse a | to get used to | v | Me costó acostumbrarme a cenar tan tarde. | It took me a while to get used to having dinner so late.
      chocar | to surprise; to shock | v | Me chocó que la gente hablara tan alto en los bares. | It surprised me that people spoke so loudly in bars. | n: Works like gustar: me chocó.
      tener algo de verdad | to have some truth in it | expr | Todos los tópicos tienen algo de verdad. | All clichés have some truth in them.
      la puntualidad | punctuality | n | En mi país la puntualidad es muy importante. | In my country punctuality is very important. | g: f
      el extranjero / la extranjera | foreigner | n | Los extranjeros a veces no entienden nuestros horarios. | Foreigners sometimes don't understand our timetables. | g: m/f | n: En el extranjero = abroad.
      dormir la siesta | to have a nap (after lunch) | expr | Los domingos duermo la siesta después de comer. | On Sundays I have a nap after lunch.
      brindar por | to toast; to drink to | v | ¡Brindemos por los nuevos amigos! | Let's drink to new friends!
    grammar:
      title: "Real or hypothetical? si + present / si + imperfect subjunctive"
      body: |
        Spanish distinguishes clearly between conditions you see as **real or likely** and conditions that are **imaginary, unlikely or contrary to the facts**:

        - **Real / likely**: *si* + **present** → present, future or imperative: *Si **vienes** a Granada, te **llevo** a ver flamenco. Si **cenas** a las diez, **eres** normal aquí.*
        - **Hypothetical / unreal**: *si* + **imperfect subjunctive** → **conditional**: *Si **durmiera** la siesta todos los días, **llegaría** tarde al trabajo* (but I don't).

        The choice depends on how **you** see the situation: *Si **tengo** tiempo, iré* (it's possible) / *Si **tuviera** tiempo, iría* (I don't think I will have time).

        **Como si** (as if) is always followed by the imperfect subjunctive, even when you talk about the present: *Hablan de los españoles **como si** todos **bailáramos** flamenco.*

        Remember: neither the future nor the conditional can follow *si* in conditions.
      table: |
        Type | si-clause | Main clause | Example
        real / likely | present | present, future, imperative | Si vienes a Granada, te llevo a ver flamenco.
        hypothetical | imperfect subjunctive | conditional | Si durmiera la siesta, llegaría tarde.
        como si | imperfect subjunctive | — | Hablan como si todos bailáramos flamenco.
      examples: |
        Si visitas Andalucía en mayo, verás muchas fiestas en la calle. | If you visit Andalusia in May, you'll see lots of street festivals. | real
        Si todos los españoles durmieran la siesta, las tiendas cerrarían por la tarde. | If all Spaniards had a siesta, shops would close in the afternoon. | hypothetical
        Si conoces a la gente, ves que cada persona es distinta. | If you get to know people, you see that each person is different. | real, general truth
        Me miró como si yo fuera un extraterrestre. | He looked at me as if I were an alien. | como si
      tip: "Ask yourself: do I think this could really happen? Yes → si + present. No, it's imaginary → si + imperfect subjunctive."
    dialogue:
      title: Tópicos en el piso compartido
      setting: A shared flat in Granada on a Friday evening. Rocío, from Granada, has dinner with her flatmates Chiara, from Milan, and Tom, from Manchester. The conversation turns to stereotypes.
      speakers: C=Chiara/f; R=Rocío/f; T=Tom/m
      lines: |
        C: Mis amigos de Milán creen que en España todo el mundo duerme la siesta. | My friends in Milan think that everyone in Spain has a siesta.
        R: ¡Ojalá! Si durmiera la siesta todos los días, llegaría tarde al trabajo. | I wish! If I had a siesta every day, I'd be late for work.
        T: En Mánchester me preguntan si aquí la gente cena a medianoche. | In Manchester people ask me whether people here have dinner at midnight.
        R: Bueno, eso tiene algo de verdad. Si cenas a las diez, aquí eres normal. | Well, there's some truth in that. If you have dinner at ten, you're normal here.
        C: Y hablan de los españoles como si todos bailarais flamenco todos los días. | And they talk about Spaniards as if you all danced flamenco every day.
        R: Pues yo soy de Granada y no sé bailar flamenco. ¡Ni sevillanas! | Well, I'm from Granada and I can't dance flamenco. Not even sevillanas!
        T: A mí me pasa algo parecido. Todos piensan que en Mánchester solo hablamos de fútbol. | Something similar happens to me. Everyone thinks that in Manchester we only talk about football.
        C: ¿Y los italianos? Si fuéramos como en las películas, gritaríamos todo el día. | And Italians? If we were like in the films, we'd shout all day.
        R: ¡Ja, ja! Bueno, todos los tópicos tienen algo de verdad, ¿no? | Ha ha! Well, all clichés have some truth in them, don't they?
        T: Sí, pero si conoces a la gente, ves que cada persona es distinta. | Yes, but if you get to know people, you see that each person is different.
        C: Exacto. Si todo el mundo viajara más, habría muchos menos prejuicios. | Exactly. If everyone travelled more, there would be far fewer prejudices.
        R: Pues brindemos por eso. ¡Y si queréis, el domingo os llevo a ver flamenco auténtico! | Then let's drink to that. And if you like, on Sunday I'll take you to see real flamenco!
    pronunciation:
      title: "Accents of Spanish: seseo and the soft s"
      body: |
        In most of Spain, *z* and *c* before e/i sound like English *th* [θ]: *gracias* [ˈɡɾaθjas]. In much of Andalusia, in the Canary Islands and in all of Latin America they sound like **s** — this is called **seseo**: *gracias* [ˈɡɾasjas], *cerveza* [seɾˈβesa]. In Andalusia and the Canaries, and in many Caribbean countries, an **s** at the end of a syllable is often softened to a breath [h] or disappears: *las dos* [lah ˈðoh]. All of these are correct native accents — don't let them surprise you.
      items: |
        gracias
        cerveza
        los españoles
        las dos
        Granada
        ¿Qué hora es?
    culture:
      title: Siestas, flamenco and real life
      body: |
        The **siesta** is one of the best-known clichés about Spain, but most people with a full-time job don't sleep after lunch on working days. A siesta is more common at weekends, on holiday, in summer heat or among retired people. Late timetables, on the other hand, are very real: dinner at 9 or 10 p.m. is completely normal.

        **Flamenco** comes from Andalusia and is on UNESCO's list of the Intangible Cultural Heritage of Humanity, but in other regions people may have their own music and dances, like the Galician *muiñeira* or the Aragonese *jota*. Spain is a very diverse country, with several co-official languages and very different regional customs.
    mistakes: |
      Si vienes a Granada, te llevaría a ver flamenco. => Si vienes a Granada, te llevo / te llevaré a ver flamenco. | A real condition (si + present) is followed by the present or the future, not the conditional.
      Hablan como si todos bailamos flamenco. => Hablan como si todos bailáramos flamenco. | Como si is always followed by the imperfect subjunctive.
      Si todos viajarían más, habría menos prejuicios. => Si todos viajaran más, habría menos prejuicios. | After si, use the imperfect subjunctive, never the conditional.
    task:
      title: Clichés about my country
      mode: speaking
      body: |
        Talk for 1–2 minutes about two stereotypes of your country or city: where they come from, what is true and what isn't. Use at least one real condition (*si vienes a…, verás…*), two hypothetical ones (*si todos… fueran…, …*) and one *como si*. Then discuss the question "Do clichés help or harm?" in the "Expressing an opinion" scenario with the AI coach.
    exercises: |
      fill: Si ___ (venir, tú) a Granada en mayo, te llevo a ver las Cruces de Mayo. || vienes || A real, likely plan: si + present. || @tags es.si-clauses
      fill: Si todos los españoles ___ (dormir) la siesta, las tiendas cerrarían por la tarde. || durmieran / durmiesen || Imaginary situation: si + imperfect subjunctive. Dormir → durmieron → durmieran. || @tags es.si-clauses,es.imperfect-subjunctive
      fill: Mi vecino habla de los italianos como si todos ___ (ser) cocineros. || fueran / fuesen || Como si + imperfect subjunctive. Ser → fueron → fueran. || @tags es.imperfect-subjunctive
      fill: Si conoces a la gente de verdad, ___ (ver, tú) que cada persona es distinta. || ves / verás || A real condition or general truth: si + present → present or future. || @tags es.si-clauses
      mc: Choose the correct sentence. || Si vienes mañana, te llevaría al museo. | *Si vienes mañana, te llevo al museo. | Si vinieras mañana, te llevo al museo. || Real condition: si + present + present. Don't mix it with the conditional. || @tags es.si-clauses
      mc: «Eso es un tópico» means… || *That's a cliché. | That's a topic for discussion. | That's typical food. || Un tópico = a cliché. A topic is un tema. || @skill vocabulary @tags es.vocabulary
      tf: Rocío knows how to dance flamenco. || false || «Yo soy de Granada y no sé bailar flamenco.» || @ctx dialogue
      short: According to Chiara, what would happen if everyone travelled more? || kw: prejuicios/prejudice/prejudices || «Si todo el mundo viajara más, habría muchos menos prejuicios.» || @ctx dialogue
      rw: Change it into an imaginary situation :: Si viajo más, conoceré otras culturas. || Si viajara más, conocería otras culturas. | Si viajase más, conocería otras culturas. || Si + imperfect subjunctive (viajara) + conditional (conocería). || @tags es.si-clauses,es.imperfect-subjunctive
      tr: They talk as if all Spaniards had a siesta. || Hablan como si todos los españoles durmieran la siesta. | Hablan como si todos los españoles durmiesen la siesta. | Hablan como si todos los españoles hicieran la siesta. || Como si + imperfect subjunctive: durmieran. || @tags es.imperfect-subjunctive
      listen: Cuando llegué a España, me chocó que la gente cenara tan tarde. Ahora, si ceno antes de las nueve, tengo hambre a medianoche. || What surprised the speaker at first? || *How late people had dinner | How loudly people spoke | How early shops closed || «Me chocó que la gente cenara tan tarde.» || @tags es.listening
      listen: @dialogue || What does Rocío offer to do on Sunday? || *Take her flatmates to see real flamenco | Cook a typical dinner | Teach them to dance sevillanas || «El domingo os llevo a ver flamenco auténtico.» || @tags es.listening
      dict: Algunos tópicos tienen algo de verdad, pero cada persona es distinta.
      ask: A Spanish friend asks about a stereotype of your country. Say whether it is true and what would happen if it were completely true. || kw: si & sería/habría/tendría/haría/estaría/podría/viviríamos/comeríamos || Dicen que en Alemania todo el mundo es muy puntual. Es bastante verdad, pero no siempre. Si todos fuéramos tan puntuales, los trenes nunca llegarían tarde… ¡y eso no es verdad!
