language: es
level: B2
title: "Spanish B2 · Fluency"
description: Speak and write Spanish with nuance and precision — discuss identity, work, science, the environment, the media, art and public life, negotiate and argue a case, report what others said, write formal complaints and opinion pieces, and talk about regrets and the future.
hours: 120
summary: >-
  B2 learners can understand the main ideas of complex texts on both concrete and abstract topics, interact with
  a degree of fluency and spontaneity that makes regular conversation with native speakers comfortable for both
  sides, and produce clear, detailed text on a wide range of subjects, explaining a viewpoint and giving the
  advantages and disadvantages of different options. This course builds on B1 with the tools of nuance — the
  subjunctive of doubt and concession, the conditional perfect, the passive, connectors of cause and consequence,
  reported speech in the past, el cual and cuyo, the perfect and pluperfect subjunctive and the future perfect —
  in peninsular Spanish, with Latin American usage pointed out along the way.
objectives:
  - Express doubt, probability and concession on questions of identity and belonging with the subjunctive (dudo que, puede que, aunque)
  - Discuss work and the economy, negotiate conditions and judge past decisions with the conditional perfect
  - Explain scientific and technological developments with the passive (ser + participio) and the pasiva refleja
  - Discuss climate policy and sustainable cities, linking causes and consequences with a wide range of connectors
  - Report what other people said in the past and analyse news, advertising and opinion pieces
  - Describe works of art and cultural heritage with formal relative pronouns (el cual, cuyo) and enjoy humour and wordplay
  - Discuss rights and public services and write formal letters and complaints, using the perfect subjunctive
  - Speculate about the future with the future perfect, express regrets with si + pluscuamperfecto de subjuntivo and present a structured argument
canDo:
  listening:
    - Understand extended speech, interviews, radio reports and discussions on abstract or specialised topics in standard Spanish
    - Follow the line of argument in a debate or a presentation and recognise the speaker's attitude and degree of certainty
  reading:
    - Read articles, opinion columns, reports and formal letters, and identify the writer's point of view and how it is argued
    - Understand personal essays and literary-style texts, including irony and implied meaning in familiar contexts
  spokenInteraction:
    - Take an active part in discussions and negotiations, conceding points, setting conditions and defending a position
    - Deal effectively with public services and officials, and complain or claim a right politely but firmly
  spokenProduction:
    - Give clear, detailed descriptions and presentations on a wide range of subjects, with supporting examples
    - Develop an argument, weigh up the pros and cons of different options and speculate about causes and consequences
  writing:
    - Write a formal letter of complaint or request with the right structure, formulas and register
    - Write an opinion piece or essay that develops an argument, reports other people's views and reaches a conclusion
grammar:
  - "Subjunctive of doubt and probability: dudo que, no está claro que, puede que; quizás and tal vez with either mood; a lo mejor + indicative"
  - "Concession: aunque + indicative or subjunctive, a pesar de que, por mucho que; pase lo que pase, sea como sea; no es que… sino que"
  - "Conditional perfect (habría hecho) for unrealised past hypotheses; debería / podría / tendría que + haber + participle for criticism"
  - "Conditions in negotiation: siempre que, siempre y cuando, con tal de que, a condición de que, en caso de que + subjunctive"
  - "Passive with ser + participle and the agent with por; estar + participle for results"
  - "Pasiva refleja (se fabrican, se han desarrollado) and its difference from impersonal se; passive tenses and fronted objects in news style"
  - "Connectors of cause: ya que, puesto que, dado que, debido a, a causa de, como (at the start of the sentence)"
  - "Connectors of consequence: por lo tanto, por consiguiente, de modo que, de ahí que + subjunctive, tan / tanto… que"
  - "Argumentation: no porque + subjunctive, sino porque + indicative; si bien, mientras que, en cambio"
  - "Reported speech in the past: tense shifts (es → era, ha sido → había sido, será → sería) and changes to time references"
  - "Reporting verbs (asegurar, negar, prometer, advertir) and reported requests with pedir / recomendar que + imperfect subjunctive"
  - "Relative pronouns el cual, la cual, lo cual and cuyo / cuya; generic relatives (quien, el que)"
  - "Perfect subjunctive (haya hecho) after emotion and doubt, and in time clauses (cuando hayas terminado)"
  - "Formal letters and complaints: structure, set formulas and register"
  - "Future perfect (habré terminado) for actions completed by a point in the future and for conjecture about the recent past"
  - "Si + pluscuamperfecto de subjuntivo + conditional perfect for regrets; ojalá + pluperfect subjunctive; mixed conditionals"
vocabularyDomains:
  - Identity, belonging, generations and bilingualism
  - The labour market, negotiation and consumption
  - Science, ethics, artificial intelligence and health
  - Climate, sustainability and urban planning
  - News, misinformation, advertising and argumentation
  - Art, cultural heritage, humour and wordplay
  - Rights, public services, administration and complaints
  - The future, life choices and public speaking
assessment: A 75-minute cumulative test covering grammar, vocabulary, listening and reading from all eight units, with a formal writing task. A score of 70% or more confirms the B2 level.
units:
  - title: Identidad y sociedad
    theme: Identity and society
    lessons: [Identity and belonging, Generations, Living between languages]
  - title: Trabajo y economía
    theme: Work and the economy
    lessons: [The future of work, Negotiating, Consumer society]
  - title: Ciencia y tecnología
    theme: Science and technology
    lessons: [Innovation and ethics, Artificial intelligence, Health and medicine in the news]
  - title: Medio ambiente
    theme: Environment
    lessons: [Climate policy, Sustainable cities, Debating solutions]
  - title: Medios y persuasión
    theme: Media and persuasion
    lessons: [Misinformation and media literacy, Advertising and persuasion, Writing an opinion piece]
  - title: Arte y cultura
    theme: Arts and culture
    lessons: [Talking about art, Cultural heritage, Humour and wordplay]
  - title: Ciudadanía y vida pública
    theme: Citizenship and public life
    lessons: [Rights and responsibilities, Public services, Formal complaints]
  - title: Mirando al futuro
    theme: Looking ahead
    lessons: [Predictions and speculation, Regrets and lessons learned, Presenting an argument]
assessmentItems: |
  mc: Choose the correct sentence. || Dudo que mi hermano vuelve a vivir en España. | *Dudo que mi hermano vuelva a vivir en España. | Dudo de mi hermano vuelva a vivir en España. || Dudar que expresses doubt, so the verb that follows is in the subjunctive: vuelva. || @tags es.subjunctive-triggers @obj Express doubt, probability and concession on questions of identity and belonging with the subjunctive (dudo que, puede que, aunque)
  fill: Aunque mañana ___ (llover), la reunión de antiguos alumnos se celebrará en el jardín. || llueva || A possibility in the future ("even if it rains") takes aunque + subjunctive. || @tags es.subjunctive-triggers,es.connectors
  fill: Con un poco más de experiencia, ___ (conseguir, yo) aquel puesto, pero entonces acababa de terminar la carrera. || habría conseguido / hubiera conseguido || An unrealised past possibility takes the conditional perfect: habría conseguido. Hubiera conseguido is also correct here. || @tags es.conditional @obj Discuss work and the economy, negotiate conditions and judge past decisions with the conditional perfect
  mc: Le hacemos un descuento del diez por ciento ___ firme el contrato antes del viernes. || porque | *siempre que | aunque || Siempre que + subjunctive sets a condition ("provided that"). Porque would need the indicative, and aunque makes no sense here. || @tags es.subjunctive-triggers
  fill: La vacuna ___ (desarrollar — passive with ser, indefinido) por un equipo internacional de investigadores. || fue desarrollada || Passive with ser: fue + participle, which agrees with the subject: la vacuna → desarrollada. || @tags es.passive @obj Explain scientific and technological developments with the passive (ser + participio) and the pasiva refleja
  mc: En este laboratorio ___ nuevos materiales para baterías. || se desarrolla | *se desarrollan | son desarrollan || In the pasiva refleja the verb agrees with the plural subject: se desarrollan nuevos materiales. || @tags es.passive
  mc: ___ el transporte público es ahora más barato, cada vez más gente deja el coche en casa. || Por lo tanto | *Como | De ahí que || Como at the start of a sentence introduces a cause. Por lo tanto and de ahí que introduce consequences. || @tags es.connectors @obj Discuss climate policy and sustainable cities, linking causes and consequences with a wide range of connectors
  fill: Ha llovido muy poco este invierno; de ahí que los embalses ___ (estar) medio vacíos. || estén || De ahí que introduces a consequence and is always followed by the subjunctive. || @tags es.connectors,es.subjunctive-triggers
  rw: Report what the museum director said, starting with «La directora dijo que…» :: «La exposición abrirá el lunes y será gratuita.» || La directora dijo que la exposición abriría el lunes y sería gratuita. | La directora dijo que la exposición abriría el lunes y que sería gratuita. || With a past reporting verb, the future becomes the conditional: abrirá → abriría, será → sería. || @tags es.reported-speech @obj Report what other people said in the past and analyse news, advertising and opinion pieces
  mc: La presentadora nos pidió que ___ al número que aparecía en pantalla. || llamamos | llamemos | *llamáramos || Pedir que in the past is followed by the imperfect subjunctive: llamáramos (or llamásemos). || @tags es.reported-speech,es.imperfect-subjunctive
  fill: Es un pintor ___ obras se exponen en museos de todo el mundo. || cuyas || Cuyo agrees with the thing possessed, not with the owner: obras → cuyas. || @tags es.relative-pronouns @obj Describe works of art and cultural heritage with formal relative pronouns (el cual, cuyo) and enjoy humour and wordplay
  mc: El crítico llegó tarde a la inauguración, ___ molestó bastante a la artista. || *lo cual | el cual | cuyo || The pronoun refers to the whole previous idea (that he arrived late), so you need the neuter lo cual. || @tags es.relative-pronouns
  fill: Me alegra mucho que por fin ___ (abrir, ellos) la nueva biblioteca del barrio. || hayan abierto || An emotion about a completed action takes the perfect subjunctive: hayan abierto. || @tags es.subjunctive-triggers @obj Discuss rights and public services and write formal letters and complaints, using the perfect subjunctive
  mc: Which closing is appropriate for a formal letter of complaint? || Un abrazo muy fuerte, | *Atentamente, | ¡Hasta pronto!, || Atentamente is the standard closing for formal letters. The other two are for friends and family. || @tags es.formal-writing
  fill: Dentro de cinco años ya ___ (terminar, yo) la carrera y estaré trabajando. || habré terminado || An action completed before a point in the future takes the future perfect: habré terminado. || @tags es.future @obj Speculate about the future with the future perfect, express regrets with si + pluscuamperfecto de subjuntivo and present a structured argument
  fill: Si ___ (saber, yo) que el examen era tan fácil, no me habría puesto tan nerviosa. || hubiera sabido / hubiese sabido || An impossible condition about the past takes si + pluperfect subjunctive: hubiera (or hubiese) sabido. || @tags es.si-clauses,es.imperfect-subjunctive
  listen: Ayer la directora nos aseguró que la nueva sede estaría lista en primavera, pero dudo mucho que lo consigan. || What does the speaker doubt? || That the director was at the meeting | *That the new offices will be ready in spring | That they will move in summer || «Dudo mucho que lo consigan» refers to the promise that the new offices would be ready in spring. || @tags es.listening,es.reported-speech
  listen: Como el tráfico se ha reducido tanto en el centro, ahora se respira mucho mejor y han abierto un montón de terrazas. || Why is the air better in the centre? || More trees have been planted | *There is much less traffic | It has rained a lot || Como introduces the cause: el tráfico se ha reducido tanto. || @tags es.listening,es.connectors
  listen: Si hubiera aceptado aquel trabajo en Lima, ahora estaría viviendo en Perú y no aquí, contigo. || Did the speaker accept the job in Lima? || Yes, and now lives in Peru | *No, and stayed where they are now | Yes, but came back after a year || Si hubiera aceptado describes something that did not happen: the speaker is still «aquí, contigo». || @tags es.listening,es.si-clauses
  tr: Whatever happens, I'll support you. || Pase lo que pase, te apoyaré. | Pase lo que pase, yo te apoyaré. | Pase lo que pase, te voy a apoyar. | Pase lo que pase, voy a apoyarte. || The fixed concessive formula pase lo que pase repeats the verb in the subjunctive. || @tags es.subjunctive
  short: A colleague sent a report full of mistakes. Using the conditional + haber, tell him he should have checked the figures (comprobar los datos). || Deberías haber comprobado los datos | Tendrías que haber comprobado los datos | Podrías haber comprobado los datos | Deberías haber comprobado los datos antes || Criticism of a past action: debería / tendría que / podría + haber + participle. || @tags es.conditional
  write: Write a formal letter of complaint (100–130 words) to a train company. A long delay made you miss an important appointment. Explain what happened, say what you would have done if you had been informed in time, and request compensation. || min=100 || req: estimado/estimada/estimados/señores | me dirijo/le escribo/les escribo | lamento que/me parece inaceptable que/es inadmisible que | habría/hubiera | atentamente/quedo a la espera || Estimados señores: Me dirijo a ustedes para presentar una reclamación por el retraso del tren Madrid-Valencia del pasado 3 de marzo. El tren salió con dos horas de retraso y nadie informó a los pasajeros de la causa. Como consecuencia, perdí una entrevista de trabajo muy importante. Si me hubieran avisado a tiempo, habría cogido el autobús de las ocho y habría llegado sin problemas. Lamento que una empresa como la suya no haya previsto un sistema de avisos por mensaje. Por todo ello, les solicito el reembolso íntegro del billete y una compensación por los perjuicios ocasionados. Quedo a la espera de su respuesta. Atentamente, Marta Ibáñez Soler
