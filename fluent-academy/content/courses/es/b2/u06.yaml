unit: 6
title: Arte y cultura
theme: Arts and culture
description: Talk about works of art and your reactions to them, read about how a community saved part of its cultural heritage, and enjoy jokes and wordplay — using the formal relative pronouns cuyo and el cual, lo cual, and generic relatives with the subjunctive.
objectives:
  - Describe works of art and artists with cuyo / cuya / cuyos / cuyas
  - Use el cual, la cual, los cuales and lo cual in formal texts, especially after prepositions
  - Use generic relatives (quien, el que) and relative clauses with the subjunctive to talk about humour
canDo:
  - I can describe a work of art, its author and the feelings it provokes.
  - I can understand and write a formal text about cultural heritage.
  - I can explain a joke or a play on words in Spanish.
  - I can say what kind of person or thing I am looking for, using the subjunctive.
review: |
  fill: Frida Kahlo es una pintora ___ autorretratos son famosos en todo el mundo. || cuyos || Cuyo agrees with what is possessed: autorretratos is masculine plural, so cuyos. || @tags es.relative-pronouns
  mc: Choose the correct sentence. || Visitamos un pueblo cuyo las casas son blancas. | *Visitamos un pueblo cuyas casas son blancas. | Visitamos un pueblo que sus casas son blancas. || Cuyas agrees with casas and is never followed by an article. «Que sus» is not standard. || @tags es.relative-pronouns
  fill: Son unas montañas a través de ___ cuales pasaban los pastores con sus rebaños. || las || Montañas is feminine plural, so the pronoun is las cuales: a través de las cuales. || @tags es.relative-pronouns
  mc: La obra se retrasó dos años, ___ encareció mucho el proyecto. || el cual | *lo cual | cuyo || The pronoun refers to the whole previous idea (the delay), so you need the neuter lo cual. || @tags es.relative-pronouns
  mc: Which sentence is NOT correct? || Esta es la plaza en la que nos conocimos. | Esta es la plaza en la cual nos conocimos. | *Esta es la plaza la cual nos conocimos. || Without a preposition, a defining clause uses que: la plaza que… With en, both en la que and en la cual are correct. || @tags es.relative-pronouns
  fill: Necesito un guía que ___ (hablar) inglés y alemán para la visita del sábado. || hable || The guide is not a specific known person, so the relative clause takes the subjunctive. || @tags es.relative-pronouns,es.subjunctive-triggers
  fill: El que ___ (adivinar) el título del cuadro gana una entrada para el museo. || adivine || A generic relative about an unknown future person takes the subjunctive: el que adivine. || @tags es.relative-pronouns,es.subjunctive
  tr: It's a city whose old town is a World Heritage Site. || Es una ciudad cuyo casco antiguo es Patrimonio de la Humanidad. | Es una ciudad cuyo casco histórico es Patrimonio de la Humanidad. | Es una ciudad cuyo centro histórico es Patrimonio de la Humanidad. | Es una ciudad cuyo casco viejo es Patrimonio de la Humanidad. || Cuyo agrees with casco / centro (masculine singular). || @tags es.relative-pronouns
  listen: El museo, cuyo edificio diseñó un arquitecto canadiense, cambió por completo la imagen de la ciudad. || What does the speaker say about the museum? || *It changed the image of the city completely. | It was designed by a local architect. | It is going to close. || «Cambió por completo la imagen de la ciudad.» The architect was Canadian. || @tags es.listening,es.relative-pronouns
  listen: No conozco a nadie que cuente los chistes tan mal como mi padre, pero siempre consigue que nos riamos. || What does the speaker say about their father? || He tells jokes very well. | *He tells jokes badly, but makes them laugh anyway. | He never tells jokes. || «No conozco a nadie que cuente los chistes tan mal… pero siempre consigue que nos riamos.» || @tags es.listening,es.subjunctive-triggers
  ask: Recommend a place of cultural heritage you know — a monument, a museum, a festival or a tradition. Say what it is, why it is special and what visitors should know. || kw: cuyo/cuya/cuyos/cuyas/el cual/la cual/los cuales/lo cual/en el que/en la que & es/está/se puede || Te recomiendo la Alhambra de Granada, cuyos jardines son preciosos en primavera. Es un conjunto de palacios desde el cual se ve toda la ciudad. Hay que comprar la entrada con mucha antelación, lo cual a veces es complicado, pero merece muchísimo la pena.
  write: Write a short review (90–110 words) of an exhibition, a concert or a show you have seen. Describe what you saw and how it made you feel. || min=80 || req: cuyo/cuya/cuyos/cuyas | lo cual/el cual/la cual/los cuales/las cuales/lo que | me transmitió/me provocó/me impresionó/me emocionó/me pareció || El sábado fui a una exposición de una fotógrafa argentina cuyas imágenes muestran la vida en los pueblos de la Patagonia. Las fotos, la mayoría de las cuales son en blanco y negro, transmiten una mezcla de soledad y belleza. Lo que más me impresionó fue una serie sobre una escuela con solo tres alumnos. La sala era pequeña, lo cual hacía que la experiencia fuera muy íntima. Me emocionó especialmente el último retrato, en el cual una niña mira el horizonte. Sin duda, una exposición que recomiendo.
lessons:
  - title: Talking about art
    summary: Describe works of art and your reactions to them, and add information about artists and works with cuyo, cuya, cuyos and cuyas.
    minutes: 50
    skills: [vocabulary, grammar, speaking]
    tags: [es.relative-pronouns]
    objectives:
      - Describe paintings, sculptures and installations with precise vocabulary
      - Express your reaction to a work of art (me transmite, me provoca, me impresiona)
      - Use cuyo / cuya / cuyos / cuyas with the correct agreement
    intro: |
      "My six-year-old nephew could do that!" Every museum visit can turn into a debate. To talk about art at B2 you need vocabulary for what you see and for what you feel — and a way to add information elegantly about artists and their works. **Cuyo** ("whose") does exactly that: *una artista cuyas obras se exponen en medio mundo.*
    vocab: |
      la obra de arte | work of art | n | Para mí, una obra de arte tiene que transmitir algo. | For me, a work of art has to convey something. | g: f | n: La obra also means a play or building works.
      el cuadro | painting | n | En esta sala están los cuadros más famosos del museo. | The museum's most famous paintings are in this room. | g: m | n: Also: la pintura.
      la instalación | installation | n | La instalación ocupa toda la sala principal. | The installation takes up the whole main room. | g: f
      la cartela | label (next to a work of art) | n | Mira la cartela: ahí pone el título y el año. | Look at the label: it gives the title and the year. | g: f
      el arte contemporáneo | contemporary art | n | El arte contemporáneo no deja indiferente a nadie. | Contemporary art leaves nobody indifferent. | g: m | n: El arte is masculine in the singular; las artes is feminine in the plural: las bellas artes.
      figurativo | figurative | adj | Yo soy más de pintura figurativa, de la que cuenta una historia. | I'm more into figurative painting, the kind that tells a story.
      abstracto | abstract | adj | Sus últimos cuadros son completamente abstractos. | Her latest paintings are completely abstract.
      transmitir | to convey; to communicate | v | Este cuadro me transmite mucha paz. | This painting conveys a lot of peace to me.
      provocar | to provoke; to cause (a feeling) | v | La obra me provoca una mezcla de belleza y angustia. | The work gives me a mixture of beauty and anguish.
      impresionar | to impress; to strike | v | Me impresionó el tamaño de la escultura. | The size of the sculpture struck me. | n: Works like gustar: me impresiona, me impresionaron.
      de cerca | up close; close up | expr | De cerca, el cuadro gana mucho. | Up close, the painting looks much better. | n: The opposite is de lejos.
      la pincelada | brushstroke | n | Fíjate en las pinceladas: son rapidísimas. | Look at the brushstrokes: they're incredibly fast. | g: f
    grammar:
      title: "Cuyo, cuya, cuyos, cuyas"
      body: |
        **Cuyo** means "whose" and links a person or thing to something that belongs to it: *Es una artista. Sus obras se exponen en medio mundo.* → *Es una artista **cuyas obras** se exponen en medio mundo.*

        - **Agreement**: *cuyo* agrees in gender and number with the **thing possessed**, not with the owner: *un pintor **cuya** obra…, una pintora **cuyos** cuadros…*
        - **No article** after *cuyo*: ~~cuyos los cuadros~~ → *cuyos cuadros*.
        - **With prepositions**, the preposition goes first: *la artista **en cuyo** taller trabajé*, *el museo **a cuya** directora conocí*.

        *Cuyo* is typical of written and formal Spanish. In conversation many speakers avoid it with other structures (*una artista que expone en medio mundo*). What you should avoid is **"que su"**, which is considered incorrect: ~~el pintor que su obra está aquí~~ → *el pintor cuya obra está aquí*.

        Don't confuse *cuyo* with the question word **¿de quién?**: *¿De quién es este cuadro?* (Whose painting is this?) — never ~~¿Cuyo es?~~
      table: |
        Thing possessed | Form | Example
        masculine singular | cuyo | Es un museo cuyo edificio es una obra de arte.
        feminine singular | cuya | Es un pintor cuya obra cambió el arte.
        masculine plural | cuyos | Es una pintora cuyos cuadros están en el Prado.
        feminine plural | cuyas | Es una artista cuyas obras se exponen en medio mundo.
        with a preposition | en cuyo, a cuya… | Es la artista en cuyo taller trabajé.
      examples: |
        Es una artista mexicana cuyas obras se exponen en medio mundo. | She's a Mexican artist whose works are exhibited all over the world. | cuyas agrees with obras
        Sorolla, cuyas playas llenas de luz son famosas, nació en Valencia. | Sorolla, whose light-filled beaches are famous, was born in Valencia.
        Es la instalación cuyo montaje duró tres semanas. | It's the installation whose assembly took three weeks. | cuyo agrees with montaje
        Conocí a un escultor en cuyo estudio había esculturas por todas partes. | I met a sculptor in whose studio there were sculptures everywhere. | preposition + cuyo
      tip: "To choose the form, look to the right of cuyo, not to the left: it agrees with the noun that follows it."
    dialogue:
      title: «Esto lo hace mi sobrino»
      setting: A contemporary art exhibition at a cultural centre in Madrid. Sonia loves contemporary art; her friend Gonzalo is not convinced.
      speakers: G=Gonzalo/m; S=Sonia/f
      lines: |
        G: Sonia, te lo digo con cariño: esto lo podría hacer mi sobrino de seis años. | Sonia, I'm saying this with love: my six-year-old nephew could do this.
        S: Eso dice todo el mundo delante del arte contemporáneo. Mira la cartela: es una artista mexicana cuyas obras se exponen en medio mundo. | That's what everybody says in front of contemporary art. Look at the label: she's a Mexican artist whose works are exhibited all over the world.
        G: Ya, pero son bolsas de plástico pegadas en una pared. ¿Qué tienen de especial? | Sure, but they're plastic bags stuck on a wall. What's so special about them?
        S: Fíjate en los colores. Las recogió con los vecinos de un pueblo de Oaxaca cuya playa estaba llena de basura. | Look at the colours. She collected them with the people of a village in Oaxaca whose beach was full of rubbish.
        G: Vale, la idea me gusta. Pero, para mí, una obra de arte tiene que transmitir algo sin necesidad de explicaciones. | OK, I like the idea. But for me, a work of art has to convey something without needing explanations.
        S: ¿Y esta no te transmite nada? A mí me provoca una mezcla de belleza y angustia. | And this one doesn't convey anything to you? It gives me a mixture of beauty and anguish.
        G: Bueno, el azul de aquella pieza grande sí me impresiona. ¿Cómo se titula? | Well, the blue in that big piece does strike me. What's it called?
        S: «Marea». Es la instalación cuyo montaje duró tres semanas, según el folleto. | "Tide". It's the installation that took three weeks to put up, according to the leaflet.
        G: Te reconozco que de cerca gana mucho. Aun así, yo soy más de cuadros figurativos, de los que cuentan una historia. | I admit it looks much better up close. Even so, I'm more into figurative paintings, the ones that tell a story.
        S: Pues el mes que viene hay una exposición de Sorolla, cuyas playas seguro que te encantan. | Well, next month there's a Sorolla exhibition — I'm sure you'll love his beaches.
        G: Eso ya es otra cosa. ¡Me apunto! Y después te invito a un café para que me sigas explicando lo de las bolsas. | Now that's something else. Count me in! And afterwards I'll buy you a coffee so you can keep explaining the bag thing to me.
    pronunciation:
      title: "México, Oaxaca: an x that sounds like j"
      body: |
        In some place names from Mexico, the letter **x** keeps an old spelling and is pronounced like Spanish **j** [x]: *México, mexicano, Oaxaca* [wa-HA-ka], *Xalapa*. The same happens with *Texas* in Spanish. Writing *Méjico* is possible, but *México* is the form preferred in Mexico and recommended by the Real Academia.

        In ordinary words, **x** is [ks]: *texto, éxito*. Compare the two sounds.
      items: |
        México
        una artista mexicana
        Oaxaca
        Xalapa
        el texto
        el éxito
    culture:
      title: "The Paseo del Arte"
      body: |
        Three of Spain's best-known museums are within walking distance of each other in Madrid, along the so-called **Paseo del Arte**: the **Prado** (Velázquez, Goya, El Greco and great European painters), the **Reina Sofía** (twentieth-century and contemporary art, including Picasso's *Guernica*) and the **Thyssen-Bornemisza**. The Prado offers free entry during the last hours of the day, and queues form well before.

        Joaquín Sorolla, the Valencian painter of light-filled beaches, has his own museum in Madrid: the house where he lived and worked, with its garden.
    mistakes: |
      Es la artista cuyo obras vimos ayer. => Es la artista cuyas obras vimos ayer. | Cuyo agrees with the thing possessed (obras), not with the owner.
      Es un pintor cuyos los cuadros me encantan. => Es un pintor cuyos cuadros me encantan. | Cuyo is never followed by an article.
      El escultor que su obra está aquí es chileno. => El escultor cuya obra está aquí es chileno. | «Que su» is not standard; use cuyo / cuya.
    task:
      title: A work I love
      mode: speaking
      body: |
        Choose a work of art you love or hate: a painting, a sculpture, a building, a street mural or an installation. In about two minutes, describe it (what it shows, colours, size, technique), say who made it and what it makes you feel. Use *cuyo / cuya* at least twice and three expressions for reactions (*me transmite, me provoca, me impresiona*). Then chat about your cultural tastes in the "Discussing hobbies" scenario with the AI coach.
    exercises: |
      fill: Sorolla es un pintor ___ cuadros están llenos de luz. || cuyos || Cuadros is masculine plural, so cuyos. || @tags es.relative-pronouns
      fill: Conocimos a una escultora ___ obra principal está en Bilbao. || cuya || Obra is feminine singular, so cuya. || @tags es.relative-pronouns
      mc: Choose the correct sentence. || Es la artista cuyo obras vimos ayer. | *Es la artista cuyas obras vimos ayer. | Es la artista que sus obras vimos ayer. || Cuyas agrees with obras. «Que sus» is not standard. || @tags es.relative-pronouns
      mc: Es un barrio ___ calles están llenas de murales. || *cuyas | cuyos | que sus || Calles is feminine plural, so cuyas. || @tags es.relative-pronouns
      mc: Sonia says «Mira la cartela». What should Gonzalo look at? || *The small label next to the work | The exhibition ticket | The frame of the painting || La cartela gives the title, the author, the year and the materials. || @skill vocabulary @tags es.vocabulary
      mc: «De cerca gana mucho» means: || *It looks much better up close. | It wins a lot of prizes. | It earns a lot of money. || Ganar here means "to improve", and de cerca = up close. || @skill vocabulary @tags es.vocabulary
      tf: Gonzalo prefers figurative paintings that tell a story. || true || He says «yo soy más de cuadros figurativos, de los que cuentan una historia». || @ctx dialogue
      short: Where did the artist get the plastic bags? || kw: playa/beach/Oaxaca/pueblo/village/vecinos/people || From a beach in Oaxaca, which she cleaned with the people of the village. || @ctx dialogue
      rw: Join the sentences with cuyo :: Este es el pintor. Sus cuadros están en el Prado. || Este es el pintor cuyos cuadros están en el Prado. || Cuyos replaces sus and agrees with cuadros. || @tags es.relative-pronouns,es.join
      tr: She's an artist whose work makes you think. || Es una artista cuya obra te hace pensar. | Es una artista cuya obra hace pensar. | Es una artista cuyas obras te hacen pensar. | Es una artista cuyas obras hacen pensar. || Cuya agrees with obra (or cuyas with obras). || @tags es.relative-pronouns
      listen: El museo, cuyo edificio se inauguró hace diez años, ha recibido este año más visitantes que nunca. || What happened this year? || *The museum had more visitors than ever. | The museum moved to a new building. | The museum closed for renovation. || «Ha recibido este año más visitantes que nunca.» || @tags es.listening,es.relative-pronouns
      listen: @dialogue || What does Sonia suggest for next month? || *A Sorolla exhibition | A contemporary art workshop | A trip to Oaxaca || «El mes que viene hay una exposición de Sorolla.» || @tags es.listening
      dict: Visitamos un pueblo cuyas casas están pintadas de azul. || cuyas casas = whose houses
      ask: Describe a work of art you like — who made it, what it shows and what it makes you feel. || kw: cuyo/cuya/cuyos/cuyas/que & me transmite/me provoca/me impresiona/me gusta/me encanta/me emociona || Me encanta «Las meninas», de Velázquez, un pintor cuya técnica todavía sorprende a los expertos. Muestra a la infanta Margarita rodeada de sus damas, y el propio pintor aparece trabajando. Me impresiona cómo juega con los espejos y con la mirada del espectador. Siempre que voy al Prado, me quedo un buen rato delante.

  - title: Cultural heritage
    summary: Read about how a community saved its whistled language, and use el cual, la cual, los cuales and lo cual in formal texts.
    minutes: 50
    skills: [reading, writing, grammar]
    tags: [es.relative-pronouns]
    objectives:
      - Understand a formal text about tangible and intangible heritage
      - Use preposition + el cual / la cual / los cuales / las cuales in formal writing
      - Comment on a whole idea with lo cual, and distinguish it from lo que
    intro: |
      Cultural heritage is not only cathedrals and palaces: it is also festivals, crafts and ways of speaking. On La Gomera, in the Canary Islands, people still communicate by whistling. The text in this lesson tells how that tradition almost disappeared — and it is written in the formal style of cultural guides and articles, full of **el cual** and **lo cual**.
    vocab: |
      el patrimonio | heritage | n | El patrimonio cultural incluye fiestas, músicas y oficios. | Cultural heritage includes festivals, music and crafts. | g: m | c: patrimonio cultural; Patrimonio de la Humanidad
      inmaterial | intangible | adj | El flamenco forma parte del patrimonio inmaterial. | Flamenco is part of intangible heritage. | n: Same form for masculine and feminine.
      declarar | to declare; to designate | v | La UNESCO declaró el casco antiguo Patrimonio de la Humanidad. | UNESCO designated the old town a World Heritage Site.
      el oficio | trade; craft | n | Los oficios tradicionales están desapareciendo. | Traditional crafts are disappearing. | g: m
      el barranco | ravine; gorge | n | Los pastores se llamaban de un barranco a otro. | The shepherds called to each other from one ravine to another. | g: m
      silbar | to whistle | v | En La Gomera hay niños que saben silbar frases enteras. | On La Gomera there are children who can whistle whole sentences. | n: Noun: el silbido. A person who whistles: el silbador / la silbadora.
      el pastor | shepherd | n | El silbo lo usaban sobre todo los pastores. | The silbo was used mainly by shepherds. | g: m | n: Feminine: la pastora. Also "pastor" (minister).
      atribuir | to attribute | v | Su origen se atribuye a los primeros habitantes de las islas. | Its origin is attributed to the first inhabitants of the islands. | n: Like construir: atribuyo, atribuyó.
      a raíz de | as a result of; following | expr | A raíz de aquella decisión, el silbo volvió a las aulas. | Following that decision, the silbo returned to the classrooms.
      la vitrina | display case | n | El patrimonio no es solo lo que se guarda en una vitrina. | Heritage isn't just what is kept in a display case. | g: f
      mantener vivo | to keep alive | expr | Los vecinos lucharon para mantener viva la tradición. | The local people fought to keep the tradition alive. | n: Vivo agrees: mantener viva la tradición.
      conservar | to preserve; to keep | v | Es difícil conservar una tradición sin jóvenes. | It's hard to preserve a tradition without young people.
    grammar:
      title: "El cual, la cual, lo cual"
      body: |
        **El cual / la cual / los cuales / las cuales** are formal relative pronouns. They agree with the noun they refer to and are used mainly in **written and formal Spanish**:

        - **After prepositions**, especially long ones: *a través de los cuales, gracias a la cual, según el cual, frente al cual, a partir del cual*. With short prepositions (*en, con, de, por*), *el que* is just as correct and more common in speech: *la plaza en la cual / en la que nos conocimos*.
        - **In non-defining clauses** (between commas), to make it clear which noun you mean: *La hermana de Pablo, **la cual** vive en Lima, es arqueóloga* (the sister lives in Lima).
        - **Not** in a defining clause without a preposition: ~~el libro el cual leí~~ → *el libro **que** leí*.

        **Lo cual** (neuter) refers to a **whole previous idea**, not to a noun: *Muchos jóvenes emigraron, **lo cual** dejó la isla casi sin silbadores.* Here *lo que* is also possible. But only *lo que* can mean "what": *Esto es **lo que** quiero* — never ~~lo cual quiero~~.

        Common formal combinations: *a raíz de lo cual* (as a result of which), *por lo cual* (for which reason), *con lo cual* (so, as a result — also colloquial).
      table: |
        Use | Example | Note
        long preposition + el cual | valles profundos, a través de los cuales no era fácil viajar | agrees with valles
        short preposition + el cual / el que | la decisión con la cual / con la que se reconocía… | both correct
        between commas, for clarity | La hermana de Pablo, la cual vive en Lima… | refers to la hermana
        lo cual + a whole idea | Llegó tarde, lo cual molestó a todos. | = lo que
        lo que = "what" | Esto es lo que quiero. | lo cual is impossible here
      examples: |
        Es un terreno lleno de valles profundos, a través de los cuales no era fácil viajar. | It's a landscape full of deep valleys, through which it wasn't easy to travel. | long preposition
        Muchos jóvenes emigraron, lo cual dejó a la isla casi sin silbadores. | Many young people emigrated, which left the island with almost no whistlers. | lo cual = a whole idea
        Fue una decisión con la cual se reconocía el trabajo de toda la comunidad. | It was a decision that recognised the work of the whole community. | preposition + la cual
        El silbo se hizo obligatorio en los colegios, a raíz de lo cual muchos niños lo aprendieron. | The silbo became compulsory in schools, as a result of which many children learned it. | fixed formal combination
      tip: "In conversation, el que after a preposition is perfectly fine. Save el cual for writing, presentations and formal speech — and use it to sound precise, not pompous."
    reading:
      title: Un idioma que se silba
      text: |
        Cuando pensamos en el patrimonio cultural, solemos imaginar catedrales, palacios o ciudades amuralladas. España, uno de los países con más bienes declarados Patrimonio de la Humanidad por la UNESCO, tiene muchos ejemplos de ese patrimonio de piedra. Pero existe otro patrimonio, el llamado inmaterial, que no se puede tocar: fiestas, músicas, oficios o maneras de hablar. Uno de los más sorprendentes se encuentra en La Gomera, una pequeña isla del archipiélago canario.

        Allí, durante siglos, los pastores se comunicaban de un barranco a otro mediante el silbo gomero, un lenguaje silbado que reproduce los sonidos del español. El silbo, cuyo origen se atribuye a los primeros habitantes de las islas, permite enviar mensajes a varios kilómetros de distancia, algo muy útil en un terreno lleno de montañas y valles profundos, a través de los cuales no era fácil viajar.

        A mediados del siglo veinte, con la llegada de las carreteras y del teléfono, el silbo empezó a desaparecer. Muchos jóvenes emigraron, lo cual dejó a la isla casi sin silbadores. Fue entonces cuando un grupo de vecinos y maestros decidió actuar. Gracias a su esfuerzo, el silbo se convirtió en asignatura obligatoria en los colegios de la isla a finales de los años noventa, a raíz de lo cual varias generaciones han vuelto a aprenderlo.

        En dos mil nueve, la UNESCO lo incluyó en su lista del Patrimonio Cultural Inmaterial de la Humanidad, una decisión con la cual se reconocía no solo su valor histórico, sino también el trabajo de toda una comunidad para mantenerlo vivo.

        Hoy los visitantes pueden escuchar demostraciones en algunos restaurantes y miradores, lo cual ha abierto un pequeño debate: ¿es una forma de difundirlo o de convertirlo en un espectáculo para turistas? Los silbadores más veteranos lo tienen claro. Para ellos, el patrimonio no es lo que se guarda en una vitrina, sino lo que se sigue usando. Y mientras haya un niño que silbe para llamar a su madre, el silbo seguirá vivo.
      translation: |
        When we think of cultural heritage, we tend to imagine cathedrals, palaces or walled cities. Spain, one of the countries with the most sites designated World Heritage by UNESCO, has many examples of this heritage in stone. But there is another kind of heritage, known as intangible, which cannot be touched: festivals, music, crafts or ways of speaking. One of the most surprising examples is found on La Gomera, a small island in the Canary archipelago.

        There, for centuries, shepherds communicated from one ravine to another by means of the silbo gomero, a whistled language that reproduces the sounds of Spanish. The silbo, whose origin is attributed to the first inhabitants of the islands, makes it possible to send messages several kilometres away, something very useful in a landscape full of mountains and deep valleys, through which it was not easy to travel.

        In the mid-twentieth century, with the arrival of roads and the telephone, the silbo began to disappear. Many young people emigrated, which left the island with almost no whistlers. It was then that a group of local people and teachers decided to act. Thanks to their efforts, the silbo became a compulsory subject in the island's schools at the end of the nineties, as a result of which several generations have learned it again.

        In two thousand nine, UNESCO included it in its list of the Intangible Cultural Heritage of Humanity, a decision which recognised not only its historical value, but also the work of a whole community to keep it alive.

        Today visitors can hear demonstrations in some restaurants and viewpoints, which has opened a small debate: is it a way of spreading it or of turning it into a show for tourists? The most experienced whistlers are clear about it. For them, heritage is not what is kept in a display case, but what is still used. And as long as there is a child who whistles to call their mother, the silbo will stay alive.
    pronunciation:
      title: "Breath groups in formal sentences"
      body: |
        Formal sentences with *el cual* or *lo cual* are long, and reading them in one breath sounds unnatural. Divide them into **breath groups** — short chunks of meaning — with a tiny pause between them: *Muchos jóvenes emigraron | lo cual dejó a la isla | casi sin silbadores.* The relative pronoun usually starts a new group.

        Inside each group, link the words smoothly and stress only the key words.
      items: |
        a través de los cuales
        gracias a la cual
        lo cual dejó a la isla casi sin silbadores
        Patrimonio de la Humanidad
        el silbo gomero
        a raíz de lo cual
    culture:
      title: "Living heritage in Spain and Latin America"
      body: |
        UNESCO's list of intangible heritage includes many traditions from the Spanish-speaking world: **flamenco** and the Catalan human towers, the **castells**, from Spain; the **Día de Muertos** from Mexico; and the **tango**, shared by Argentina and Uruguay. Each inscription recognises not only the tradition but also the community that keeps it alive.

        Spain also has a strong tradition of local festivals declared of tourist or cultural interest, from Valencia's **Fallas** to the medieval mystery play of Elche, the **Misteri d'Elx**.
    mistakes: |
      Es el libro el cual leí ayer. => Es el libro que leí ayer. | In a defining clause without a preposition, use que, not el cual.
      Llegó tarde, el cual molestó a todos. => Llegó tarde, lo cual molestó a todos. | To refer to a whole idea, use the neuter lo cual (or lo que).
      No entiendo lo cual dices. => No entiendo lo que dices. | Only lo que can mean "what"; lo cual always refers back to a previous idea.
    task:
      title: A heritage worth saving
      mode: writing
      body: |
        A cultural website is looking for short texts about traditions or places that deserve protection. Write 120–150 words about one from your country or region: what it is, its history, the risks it faces and what is being done to keep it alive. Use at least two prepositions + *el cual / la cual*, one *lo cual* and one *cuyo / cuya*, in a formal register.
    exercises: |
      mc: What is the silbo gomero? || *A whistled language that reproduces Spanish | A traditional shepherd's dance | A musical instrument from the Canary Islands || «Un lenguaje silbado que reproduce los sonidos del español.» || @ctx reading @tags es.reading
      tf: The silbo began to disappear when roads and telephones arrived on the island. || true || «Con la llegada de las carreteras y del teléfono, el silbo empezó a desaparecer.» || @ctx reading @tags es.reading
      short: What happened in the island's schools at the end of the nineties? || kw: asignatura/obligatoria/compulsory/subject/colegios/schools/taught/enseña || The silbo became a compulsory subject. || @ctx reading @tags es.reading
      mc: What debate does the text mention? || Whether the silbo really comes from La Gomera | *Whether demonstrations for tourists spread the silbo or turn it into a show | Whether the silbo should be taught in schools || «¿Es una forma de difundirlo o de convertirlo en un espectáculo para turistas?» || @ctx reading @tags es.reading
      fill: Es un valle profundo a través del ___ no pasaba ninguna carretera. || cual || Valle is masculine singular: a través del cual (de + el = del). || @tags es.relative-pronouns
      fill: Muchos jóvenes se fueron de la isla, ___ preocupó mucho a los mayores. || lo cual / lo que || The pronoun refers to the whole idea (young people leaving), so it is neuter: lo cual or lo que. || @tags es.relative-pronouns
      fill: Fue una decisión gracias a ___ cual el silbo es hoy conocido en todo el mundo. || la || Decisión is feminine singular: gracias a la cual. || @tags es.relative-pronouns
      mc: Choose the correct sentence. || Es la catedral la cual visitamos ayer. | *Es la catedral que visitamos ayer. | Es la catedral lo cual visitamos ayer. || There is no preposition and no comma, so the relative pronoun is que. || @tags es.relative-pronouns
      mc: «La hermana de Pablo, la cual vive en Lima, es arqueóloga.» Who lives in Lima? || Pablo | *Pablo's sister | Both of them || La cual is feminine, so it can only refer to la hermana. || @tags es.relative-pronouns
      rw: Join the sentences with por + el cual :: Este es el puente. Los peregrinos cruzaban el río por este puente. || Este es el puente por el cual los peregrinos cruzaban el río. | Este es el puente por el cual cruzaban el río los peregrinos. | Este es el puente por el que los peregrinos cruzaban el río. || The preposition goes before the pronoun: por el cual (or por el que). || @tags es.relative-pronouns,es.join
      tr: The tradition almost disappeared, which worried the whole village. || La tradición casi desapareció, lo cual preocupó a todo el pueblo. | La tradición casi desapareció, lo que preocupó a todo el pueblo. | La tradición estuvo a punto de desaparecer, lo cual preocupó a todo el pueblo. | La tradición estuvo a punto de desaparecer, lo que preocupó a todo el pueblo. || "Which" refers to the whole idea, so use lo cual or lo que. || @tags es.relative-pronouns
      listen: La catedral, cuya construcción duró casi tres siglos, mezcla elementos góticos y renacentistas. || How long did it take to build the cathedral? || Almost thirty years | *Almost three centuries | Three years || «Cuya construcción duró casi tres siglos.» || @tags es.listening,es.relative-pronouns
      listen: Los vecinos restauraron el antiguo molino, gracias a lo cual ahora el pueblo recibe visitas de colegios de toda la provincia. || What is the result of restoring the mill? || *Schools from all over the province visit the village. | The mill produces flour again. | The village has a new hotel. || Gracias a lo cual introduces the result: visitas de colegios de toda la provincia. || @tags es.listening,es.relative-pronouns
      dict: El patrimonio no es lo que se guarda en una vitrina, sino lo que se sigue usando. || lo que = what
      say: Fue una decisión con la cual se reconocía el trabajo de toda la comunidad. || It was a decision that recognised the work of the whole community.

  - title: Humour and wordplay
    summary: Explain jokes, puns and funny language mistakes, and use generic relatives and relative clauses with the subjunctive (busco a alguien que…, el que llegue tarde…).
    minutes: 50
    skills: [listening, speaking, grammar]
    tags: [es.relative-pronouns, es.subjunctive-triggers]
    objectives:
      - Understand and explain jokes and plays on words, including ser / estar contrasts
      - Use the subjunctive in relative clauses when the person or thing is unknown or doesn't exist
      - Use generic relatives (quien, el que) in sayings and rules
    intro: |
      Understanding a joke in another language is a real sign of fluency — and explaining one is even harder. Much Spanish humour plays on words with two meanings, like *ser listo* and *estar listo*. In this lesson an exchange student asks for help with a joke and tells the story of a very embarrassing mistake. You will also learn how relative clauses take the subjunctive when we don't know who or what we mean.
    vocab: |
      el chiste | joke | n | Mi compañero de piso contó un chiste y todos se rieron menos yo. | My flatmate told a joke and everyone laughed except me. | g: m | c: contar un chiste
      el juego de palabras | pun; play on words | n | Es un juego de palabras con ser y estar. | It's a play on words with ser and estar. | g: m
      el doble sentido | double meaning | n | Muchos chistes se basan en el doble sentido de una palabra. | Many jokes are based on the double meaning of a word. | g: m
      gastar una broma | to play a joke (on someone) | expr | Le gastamos una broma el día de los Inocentes. | We played a joke on him on the twenty-eighth of December. | n: Una broma is a practical joke or a teasing remark; un chiste is a joke you tell.
      tener gracia | to be funny | expr | Ese chiste no tiene ninguna gracia. | That joke isn't funny at all. | n: Hacer gracia works like gustar: no me hace gracia.
      la ironía | irony | n | No te enfades, lo decía con ironía. | Don't get angry, I was being ironic. | g: f | n: Adjective: irónico.
      reírse de | to laugh at | v | No me río de ti, me río contigo. | I'm not laughing at you, I'm laughing with you. | n: Present: me río, te ríes, se ríe.
      partirse de risa | to split your sides laughing | expr | Nos partimos de risa con sus historias. | We were in stitches over his stories. | n: Colloquial. Also: me parto.
      pillar | to get (a joke); to catch | v | No pillo el chiste, ¿me lo explicas? | I don't get the joke — can you explain it? | n: Colloquial in Spain.
      el humor negro | black humour; dark humour | n | El humor negro no le gusta a todo el mundo. | Not everybody likes dark humour. | g: m
      el falso amigo | false friend (word) | n | «Embarazada» es el falso amigo más famoso del español. | "Embarazada" is the most famous false friend in Spanish. | g: m
      la carcajada | burst of laughter; guffaw | n | Soltó una carcajada que se oyó en toda la sala. | She let out a guffaw that could be heard all over the room. | g: f
    grammar:
      title: "Relative clauses with the subjunctive"
      body: |
        A relative clause takes the **indicative** when the person or thing is **known and exists**, and the **subjunctive** when it is **unknown, hypothetical or doesn't exist**:

        - *Tengo un amigo que **cuenta** chistes buenísimos.* (I know him)
        - *Busco a alguien que me **explique** este chiste.* (anyone — I don't know who)
        - *No hay nadie que **entienda** mis bromas.* (such a person doesn't exist)

        **Generic relatives** have no noun before them: **quien**, **el que / la que / los que** mean "whoever, people who". With the indicative they state a general truth or refer to real people; with the subjunctive they refer to whoever does something in the future:

        - *Los que **vinieron** se rieron mucho.* (the people who came)
        - ***El que llegue** tarde paga el postre.* (whoever arrives late — we don't know who yet)
        - *Quien **quiera** venir, que venga.* (whoever wants to come)

        Many Spanish sayings use generic **quien** or **el que**: *Quien ríe el último ríe mejor. El que avisa no es traidor* (you've been warned). *Quien calla, otorga* (silence means consent).
      table: |
        Situation | Mood | Example
        known, existing person or thing | indicative | Tengo una amiga que hace unas imitaciones geniales.
        unknown or any person or thing | subjunctive | Busco un libro que me haga reír.
        doesn't exist / denied | subjunctive | No hay nada que me haga más gracia.
        generic, general truth | indicative | Quien ríe el último ríe mejor.
        generic, future or hypothetical | subjunctive | El que pierda invita a las cañas.
      examples: |
        Necesito a alguien que me explique un chiste. | I need someone to explain a joke to me. | unknown person: subjunctive
        Intenté hacer una broma en clase y no hubo nadie que se riera. | I tried to make a joke in class and nobody laughed. | non-existent: imperfect subjunctive
        Mi abuelo es un hombre que se ríe de todo. | My grandfather is a man who laughs at everything. | known person: indicative
        El que se ría de mí invita a las cañas. | Whoever laughs at me buys the beers. | generic, future: subjunctive
      tip: "Before choosing the mood, ask: could I point to this person or thing? If yes, indicative. If it's 'anyone', 'nobody' or 'whoever', subjunctive."
    dialogue:
      title: «Listo es, pero vestido todavía no»
      setting: A café in Granada. Lukas, a German Erasmus student, meets his language-exchange partner Nuria and asks her to explain a joke his flatmate told the night before.
      speakers: L=Lukas/m; N=Nuria/f
      lines: |
        L: Nuria, necesito a alguien que me explique un chiste. Mi compañero de piso lo contó ayer y todos se rieron menos yo. | Nuria, I need someone to explain a joke to me. My flatmate told it yesterday and everyone laughed except me.
        N: A ver, cuéntamelo. Aunque te advierto que un chiste explicado pierde toda la gracia. | Go on, tell me. Although I warn you, a joke that's explained loses all its humour.
        L: Uno pregunta: «¿Está listo tu hermano?». Y el otro contesta: «Listo es, pero vestido todavía no». | One guy asks: "Is your brother ready?" And the other answers: "Clever he is, but dressed he isn't yet."
        N: ¡Ja! Es un juego de palabras con ser y estar. Estar listo es estar preparado, y ser listo es ser inteligente. | Ha! It's a play on words with ser and estar. Estar listo means to be ready, and ser listo means to be clever.
        L: ¡Ah, claro! O sea, que el hermano es muy inteligente, pero todavía no está preparado para salir. ¡Qué bueno! | Oh, of course! So the brother is very clever, but he isn't ready to go out yet. That's a good one!
        N: Exacto. Con ser y estar hay un montón de chistes: no es lo mismo ser rico que estar rico, ni ser malo que estar malo. | Exactly. There are loads of jokes with ser and estar: being rich isn't the same as being tasty, and being bad isn't the same as being ill.
        L: Pues yo intenté hacer una broma en clase la semana pasada y no hubo nadie que se riera. Silencio total. | Well, I tried to make a joke in class last week and nobody laughed. Total silence.
        N: ¿Por qué? ¿Qué dijiste? | Why? What did you say?
        L: Llegué tarde y, para disculparme, dije que estaba muy embarazado. Quería decir que me daba vergüenza. | I arrived late and, to apologise, I said I was very "pregnant". I meant that I was embarrassed.
        N: ¡Ay, Lukas! Embarazado significa que esperas un bebé. Ahora entiendo el silencio… y seguro que alguna risa contenida. | Oh, Lukas! Embarazado means you're expecting a baby. Now I understand the silence… and I bet there was some stifled laughter.
        L: Pues la próxima vez, el que se ría de mí invita a las cañas. | Well, next time, whoever laughs at me buys the beers.
        N: Trato hecho. Pero quien ríe el último ríe mejor, y tú ya tienes una anécdota buenísima para contar. | Deal. But he who laughs last laughs best, and you've already got a great story to tell.
    pronunciation:
      title: "Reacting to a joke"
      body: |
        When someone tells you a joke, your reaction matters. Exclamations with *qué* start high and fall: *¡Qué bueno! ↘* If you don't get it, a rising question invites an explanation: *¿Me lo explicas? ↗*

        Notice the stress in *carcajada* (car-ca-**ja**-da) and the written accent in *ríe* and *río*: the **í** is stressed and forms its own syllable: ***rí**-e*, ***rí**-o*.
      items: |
        ¡Qué bueno!
        ¡Me parto!
        No lo pillo.
        ¿Me lo explicas?
        Quien ríe el último ríe mejor.
        Soltó una carcajada.
    culture:
      title: "Retranca, chirigotas and albures"
      body: |
        Every Spanish-speaking region has its own humour. In Galicia, **la retranca** is a dry, ironic way of speaking in which you never quite know whether the speaker is serious. In Cádiz, the carnival **chirigotas** are groups who sing witty, satirical songs full of wordplay about the year's events. In Mexico, the **albur** is a quick-fire game of double meanings, often cheeky, in which two speakers try to outwit each other.

        On **28 December**, the *Día de los Santos Inocentes*, people in Spain and Latin America play practical jokes on each other — and the media publish fake news stories, a bit like April Fool's Day.
    mistakes: |
      Busco a alguien que sabe contar chistes. => Busco a alguien que sepa contar chistes. | The person is unknown (anyone), so the relative clause takes the subjunctive.
      No hay nadie que entiende sus chistes. => No hay nadie que entienda sus chistes. | After no hay nadie que, the person doesn't exist: subjunctive.
      Estoy muy embarazado por el error. => Me da mucha vergüenza el error. | Embarazado/a means "pregnant". "Embarrassed" is avergonzado/a, or me da vergüenza.
    task:
      title: Lost in translation
      mode: interaction
      body: |
        Tell a partner about a funny language mistake you (or someone you know) made, or a joke that only works in one language. Explain why it is funny. Your partner reacts and asks questions. Use at least two relative clauses with the subjunctive (*busco a alguien que…, no hay nadie que…*) and one generic relative (*el que…, quien…*). Then, in the "Ordering at a café or restaurant" scenario with the AI coach, comment on the food and drinks using ser and estar correctly (*está riquísimo, es un poco caro, está frío*).
    exercises: |
      fill: Busco a alguien que me ___ (explicar) los chistes de mi compañero de piso. || explique || The person is unknown (anyone), so the relative clause takes the subjunctive. || @tags es.relative-pronouns,es.subjunctive-triggers
      fill: No hay nadie en clase que ___ (entender) mis bromas. || entienda || After no hay nadie que, the person doesn't exist: subjunctive. Entender is stem-changing: entienda. || @tags es.relative-pronouns,es.subjunctive-triggers
      fill: El que ___ (llegar) tarde a la cena paga el postre. || llegue || A generic relative about a future, unknown person takes the subjunctive. Note the spelling: llegue. || @tags es.relative-pronouns,es.subjunctive
      mc: «Quien ríe el último ríe mejor» means… || *don't celebrate too early: the final winner enjoys it most. | people who laugh last don't understand jokes. | laughing is good for your health. || It's a saying with generic quien: whoever laughs last laughs best. || @tags es.relative-pronouns
      mc: «¿Está listo tu hermano? —Listo es, pero vestido todavía no.» The joke plays on… || *ser listo (clever) and estar listo (ready). | listo as a nickname. | the difference between listo and vestido. || Estar listo = to be ready; ser listo = to be clever. || @tags es.ser-estar
      mc: Your friend says «No pillo el chiste». She means: || *She doesn't get the joke. | She can't find the joke. | She doesn't like the joke. || Pillar (colloquial) = to get, to understand. || @skill vocabulary @tags es.vocabulary
      tf: Lukas laughed at his flatmate's joke. || false || «Todos se rieron menos yo.» || @ctx dialogue
      short: What did Lukas want to say when he said «estaba muy embarazado»? || kw: vergüenza/avergonzado/embarrassed/ashamed/sorry || He meant that he was embarrassed: «me daba vergüenza». || @ctx dialogue
      rw: Rewrite with «El que…» + subjunctive :: Si alguien se ríe de mí, invita a las cañas. || El que se ría de mí invita a las cañas. | Quien se ría de mí invita a las cañas. | El que se ría de mí, invita a las cañas. || A generic relative about a future, unknown person takes the subjunctive: se ría. || @tags es.relative-pronouns,es.subjunctive
      tr: I'm looking for a comedian who makes people laugh without offending anyone. || Busco un humorista que haga reír sin ofender a nadie. | Busco a un humorista que haga reír sin ofender a nadie. | Busco una humorista que haga reír sin ofender a nadie. | Busco a una humorista que haga reír sin ofender a nadie. | Busco un cómico que haga reír sin ofender a nadie. | Busco a un cómico que haga reír sin ofender a nadie. || The comedian is not a specific person, so the relative clause takes the subjunctive: haga. || @tags es.relative-pronouns,es.subjunctive-triggers
      listen: En mi pueblo hay un señor que cuenta los chistes con tanta seriedad que la gente se parte de risa antes de que llegue el final. || Why do people laugh before the end of his jokes? || *Because he tells them so seriously | Because they've heard them before | Because he laughs first || «Cuenta los chistes con tanta seriedad que la gente se parte de risa.» || @tags es.listening
      listen: @dialogue || What does Nuria warn Lukas about before he tells the joke? || *An explained joke loses all its humour. | The joke might be rude. | She doesn't like jokes. || «Un chiste explicado pierde toda la gracia.» || @tags es.listening
      dict: No hay nadie que se ría tanto como mi abuela cuando cuenta un chiste. || no hay nadie que + subjunctive
      ask: Tell a friend about a funny mistake you made in a foreign language, and say what you meant to say. || kw: dije/quería decir/significa/significaba & que || Una vez, en un restaurante de Lisboa, quise pedir la cuenta y pedí «a conta» con tan mala pronunciación que el camarero me trajo una cerveza. Me dio tanta vergüenza que no dije nada y me la bebí. Desde entonces, siempre pido la cuenta por gestos.
