unit: 8
title: Mirando al futuro
theme: Looking ahead
description: Make predictions and speculate about what has happened, talk about regrets and the lessons life has taught you, and present a structured argument — using the future perfect, si + pluperfect subjunctive with the conditional perfect, mixed conditionals and the language of presentations.
objectives:
  - Make predictions about completed future actions and speculate about the recent past with the future perfect
  - Express regrets and imagine a different past with si + pluscuamperfecto de subjuntivo, ojalá and mixed conditionals
  - Present a structured argument, using signposting and all three types of conditional sentence
canDo:
  - I can predict what will have happened by a point in the future.
  - I can make guesses about what has probably happened.
  - I can talk about decisions I regret and the lessons I have learned.
  - I can give a structured presentation, defend a proposal and answer an objection.
review: |
  fill: Para dos mil cincuenta, los coches autónomos ya ___ (sustituir) a muchos taxis. || habrán sustituido || An action completed before a point in the future takes the future perfect. || @tags es.future
  mc: —Ana no contesta al móvil. —___ sin batería. || Se ha quedado | *Se habrá quedado | Se habría quedado || A guess about something that has probably just happened takes the future perfect: se habrá quedado. || @tags es.future
  mc: —¿Dónde está Pablo? —No sé, ___ en el gimnasio. || *estará | habrá estado | estaría || A guess about the present takes the simple future: estará = he's probably at the gym. || @tags es.future
  fill: Si ___ (reservar, nosotros) con más antelación, habríamos conseguido un hotel más barato. || hubiéramos reservado / hubiésemos reservado || An impossible past condition: si + pluperfect subjunctive. || @tags es.si-clauses,es.imperfect-subjunctive
  mc: Si me hubieras avisado, ___ a buscarte al aeropuerto. || iría | *habría ido | había ido || A past condition with a past result: conditional perfect. || @tags es.si-clauses,es.conditional
  fill: Si no me hubiera mudado a Barcelona, ahora no ___ (hablar, yo) catalán. || hablaría || Mixed conditional: a past condition with a present result takes the simple conditional. || @tags es.si-clauses,es.conditional
  fill: Ojalá ___ (conocer, yo) esta ciudad antes: es preciosa. || hubiera conocido / hubiese conocido || Ojalá + pluperfect subjunctive expresses a regret about the past. || @tags es.si-clauses,es.imperfect-subjunctive
  rw: Rewrite with «De haberlo sabido…» :: Si lo hubiera sabido, no habría venido. || De haberlo sabido, no habría venido. | De haberlo sabido, no hubiera venido. || De + compound infinitive (haber + participle) can replace a si-clause about the past. || @tags es.si-clauses
  tr: If we had left earlier, we wouldn't have missed the train. || Si hubiéramos salido antes, no habríamos perdido el tren. | Si hubiésemos salido antes, no habríamos perdido el tren. | Si hubiéramos salido antes, no hubiéramos perdido el tren. | Si hubiéramos salido más temprano, no habríamos perdido el tren. | Si hubiésemos salido antes, no hubiéramos perdido el tren. || Si + pluperfect subjunctive, then the conditional perfect (or hubiéramos + participle). || @tags es.si-clauses
  listen: Si hubiera hecho caso a mi abuela, habría aprendido a coser. Ahora tengo que llevar toda la ropa a arreglar. || What does the speaker regret? || *Not learning to sew from their grandmother | Throwing away their clothes | Not visiting their grandmother || «Si hubiera hecho caso a mi abuela, habría aprendido a coser.» || @tags es.listening,es.si-clauses
  listen: Para cuando termine la reunión, ya habrán cerrado las tiendas, así que compraré el regalo mañana. || Why will the speaker buy the present tomorrow? || *Because the shops will have closed by the end of the meeting | Because the meeting has been cancelled | Because the present isn't ready || «Ya habrán cerrado las tiendas.» || @tags es.listening,es.future
  ask: Tell a friend about a decision you regret — or one you are glad you made — and what you would have done differently. || kw: si hubiera/si hubiese/si no hubiera/si no hubiese/ojalá & habría/hubiera/estaría/sería || Hace diez años me ofrecieron un trabajo en Edimburgo y dije que no. Si lo hubiera aceptado, habría aprendido inglés de verdad y ahora quizás estaría viviendo allí. Pero, si me hubiera ido, no habría conocido a mi pareja. Así que, al final, no me arrepiento.
  write: Write a short letter to yourself in ten years (90–110 words). Say what you will have done by then, one thing you hope you won't regret, and one lesson you have already learned. || min=80 || req: habré/habrás/habremos/habrá | si/ojalá | he aprendido/ahora sé/si algo me ha enseñado || Querida yo del futuro: Cuando leas esta carta, ya habrás cumplido cuarenta años y, con un poco de suerte, habrás terminado por fin el doctorado. Espero que te hayas animado a vivir unos meses en México, como siempre has querido. Si no lo has hecho, ¡no esperes más! Ojalá no te arrepientas de haber dejado el trabajo en el banco; yo, hoy, estoy segura de que fue la decisión correcta. Si algo me ha enseñado este año es que el miedo casi nunca es un buen consejero. Cuídate mucho y sigue riéndote de todo. Un abrazo, Lola
lessons:
  - title: Predictions and speculation
    summary: Make predictions about what will have happened by a point in the future, and speculate about the present and the recent past with the future and the future perfect.
    minutes: 50
    skills: [vocabulary, grammar, speaking]
    tags: [es.future]
    objectives:
      - Make predictions about the world, your town and your own life
      - Form the future perfect and use it for actions completed before a point in the future
      - Make guesses about the present (estará) and the recent past (se habrá perdido)
    intro: |
      What will the world be like in twenty-five years? And why is your friend late? Both questions need a special use of the future. The **future perfect** (*habré terminado, habrá cambiado*) describes what will be completed by a point in the future — and, surprisingly, it is also the most natural way in Spanish to guess what has *probably* just happened: *Se habrá perdido.*
    vocab: |
      la predicción | prediction | n | Cada uno escribió tres predicciones para la cápsula del tiempo. | Each person wrote three predictions for the time capsule. | g: f
      prever | to foresee; to forecast | v | Los expertos prevén que las ciudades crecerán mucho. | Experts foresee that cities will grow a lot. | n: Conjugated like ver: prevé, prevén; participle previsto.
      para entonces | by then | expr | Para entonces habremos dejado de usar el coche privado. | By then we'll have stopped using private cars.
      dentro de | in (a period of time from now) | expr | Abrirán la cápsula dentro de veinticinco años. | They'll open the capsule in twenty-five years. | n: Not en: dentro de dos años = in two years' time.
      generalizarse | to become widespread | v | El teletrabajo se ha generalizado en muchos sectores. | Remote working has become widespread in many sectors.
      apostar a que | to bet that | expr | Apuesto a que Raúl llega tarde otra vez. | I bet Raúl arrives late again. | n: o → ue: apuesto, apuestas.
      la cápsula del tiempo | time capsule | n | Enterramos una cápsula del tiempo en el patio del colegio. | We buried a time capsule in the school playground. | g: f
      la tendencia | trend; tendency | n | La tendencia es que cada vez vivamos más años. | The trend is for us to live longer and longer. | g: f
      pesimista | pessimistic | adj | Yo soy más pesimista que tú con el clima. | I'm more pessimistic than you about the climate. | n: Same form for masculine and feminine, like optimista.
      el pronóstico | forecast; prognosis | n | El pronóstico para este invierno es de mucha lluvia. | The forecast for this winter is for a lot of rain. | g: m
      como mucho | at most | expr | Como mucho, habremos cambiado los coches de gasolina por eléctricos. | At most, we'll have swapped petrol cars for electric ones. | n: The opposite is como mínimo (at least).
      cumplir un sueño | to fulfil a dream | expr | Espero haber cumplido mi sueño de abrir una librería. | I hope I'll have fulfilled my dream of opening a bookshop.
    grammar:
      title: "The future perfect: habré terminado, se habrá perdido"
      body: |
        The **future perfect** is formed with the **future of haber** + **past participle**: *habré, habrás, habrá, habremos, habréis, habrán* + *terminado, hecho, vuelto…*

        **1. An action completed before a point in the future.** It often appears with *para* + time, *dentro de*, *para entonces*, *cuando* + subjunctive: *Para dos mil cincuenta **habremos dejado** de usar gasolina. Cuando abran la cápsula, **me habré jubilado**.*

        **2. A guess about the recent past.** Spanish uses the future tenses to express probability:

        - **future** = probably, now: *—¿Dónde está Raúl? —**Estará** en la puerta* (he's probably at the door).
        - **future perfect** = probably, just now / recently: *—¿Por qué no ha llegado? —**Se habrá perdido*** (he's probably got lost).

        This is very common in conversation and sounds much more natural than always using *probablemente*. Questions with the future perfect express wondering: *¿Qué le **habrá pasado**?* (I wonder what's happened to him.)

        Don't confuse it with the **conditional perfect** (*habría*, Unit 2), which describes what *would have* happened.
      table: |
        Use | Structure | Example
        completed by a future point | future perfect | Para entonces, habremos cambiado de trabajo.
        guess about now | future | Estará en la biblioteca.
        guess about the recent past | future perfect | Se habrá quedado dormido.
        wondering | ¿future perfect? | ¿Qué le habrá pasado?
        unrealised past (Unit 2) | conditional perfect | Con más tiempo, lo habría terminado.
      examples: |
        Para entonces habremos dejado de usar el coche privado en las ciudades. | By then we'll have stopped using private cars in cities. | completed by a future point
        Cuando abran la cápsula, yo ya me habré jubilado. | When they open the capsule, I'll already have retired. | with cuando + subjunctive
        Raúl no ha llegado todavía. Se habrá perdido, como siempre. | Raúl hasn't arrived yet. He's probably got lost, as usual. | guess about the recent past
        ¿Qué excusa se habrá inventado esta vez? | I wonder what excuse he's come up with this time. | wondering
      tip: "Want to sound natural when you guess? Replace 'probablemente ha + participle' with the future perfect: probablemente ha salido → habrá salido."
    dialogue:
      title: La cápsula del tiempo
      setting: A secondary school in Logroño is celebrating its fiftieth anniversary. Former classmates Ainhoa and Mateo are writing predictions to put in a time capsule that will be opened in twenty-five years.
      speakers: M=Mateo/m; A=Ainhoa/f
      lines: |
        M: Aquí dice que tenemos que escribir cómo creemos que será el mundo cuando abran la cápsula, dentro de veinticinco años. | It says here we have to write what we think the world will be like when they open the capsule, in twenty-five years.
        A: Uf, qué difícil. Yo pondría que para entonces habremos dejado de usar el coche privado en las ciudades. | Phew, that's hard. I'd put that by then we'll have stopped using private cars in cities.
        M: ¿Tú crees? Yo soy más pesimista. Como mucho, habremos cambiado los coches de gasolina por eléctricos. | Do you think so? I'm more pessimistic. At most, we'll have swapped petrol cars for electric ones.
        A: Bueno, pon las dos cosas. ¿Y qué más? ¿El trabajo? | All right, put both. What else? Work?
        M: Apuesto a que la semana de cuatro días se habrá generalizado. Y las máquinas habrán transformado muchísimos trabajos. | I bet the four-day week will have become widespread. And machines will have transformed lots of jobs.
        A: Eso seguro. Por cierto, ¿has visto a Raúl? Dijo que vendría a las seis y ya son casi las siete. | That's for sure. By the way, have you seen Raúl? He said he'd come at six and it's almost seven.
        M: Se habrá perdido, como siempre. O se habrá quedado charlando con alguien en la puerta. | He's probably got lost, as usual. Or he's stayed chatting with someone at the entrance.
        A: O no se habrá acordado. Ya sabes cómo es… Bueno, sigamos. ¿Y nosotros? ¿Dónde estaremos? | Or he's forgotten. You know what he's like… Anyway, let's carry on. And us? Where will we be?
        M: Yo, con un poco de suerte, ya me habré jubilado y estaré viviendo en un pueblo de la sierra. | Me, with a bit of luck, I'll have retired and I'll be living in a village in the mountains.
        A: Pues yo espero haber cumplido mi sueño de toda la vida: abrir mi propia librería. | Well, I hope I'll have fulfilled my lifelong dream: opening my own bookshop.
        M: Me encanta. Lo apunto: «Ainhoa habrá abierto la librería más bonita de La Rioja». | I love it. I'll write it down: "Ainhoa will have opened the loveliest bookshop in La Rioja."
        A: ¡Mira, por ahí viene Raúl! A ver qué excusa se habrá inventado esta vez. | Look, here comes Raúl! Let's see what excuse he's come up with this time.
    pronunciation:
      title: "Future endings: habré, habrá, habrán"
      body: |
        All forms of the future are stressed on the ending, and most carry a written accent: *ha-**bré**, ha-**brás**, ha-**brá**, ha-**bréis**, ha-**brán*** — only *habremos* has no accent (ha-**bre**-mos). Don't move the stress back to the first syllable: *habrá* [a-BRA] is "will have", while *había* [a-BI-a] is "had".

        In questions of wondering, the voice rises slightly and then falls: *¿Qué le habrá pasado?*
      items: |
        habré terminado
        habremos dejado
        se habrá perdido
        me habré jubilado
        habrán cambiado
        ¿Qué le habrá pasado?
    mistakes: |
      Para dos mil cuarenta habremos dejar el coche. => Para dos mil cuarenta habremos dejado el coche. | The future perfect is haber + participle (dejado), not the infinitive.
      Luis no contesta; estaría durmiendo. => Luis no contesta; estará durmiendo. | For a guess about the present, use the future (estará). Estaría would be a guess about a moment in the past.
      Dentro de diez años habré tenido cuarenta años. => Dentro de diez años tendré cuarenta años. | For a state at a future point, use the simple future; the future perfect is for actions completed before that point.
    task:
      title: Twenty-five years from now
      mode: speaking
      body: |
        Prepare a two-minute talk with your predictions for twenty-five years from now: your town, the way we work, technology, and your own life. Use at least five verbs in the future perfect (*para entonces habremos…, ya habré…*) and justify each prediction. Then, in the "Making weekend plans" scenario with the AI coach, imagine a friend hasn't answered your messages about the weekend: speculate about why (*no habrá visto el mensaje, estará trabajando…*) and make a plan anyway.
    exercises: |
      fill: Para dos mil cuarenta, la mayoría de las ciudades ___ (prohibir) los coches de gasolina en el centro. || habrán prohibido || An action completed before a point in the future: future perfect. || @tags es.future
      fill: Cuando vuelvas de Australia, nosotros ya ___ (mudarse) a la casa nueva. || nos habremos mudado || Completed before your return: future perfect, with the reflexive pronoun before haber. || @tags es.future,es.reflexive
      fill: Luis no contesta al teléfono. ___ (quedarse) sin batería. || Se habrá quedado || A guess about something that has probably just happened: future perfect. || @tags es.future
      fill: —¿Dónde está Marta? —No sé, ___ (estar) en la biblioteca, como siempre. || estará || A guess about the present: simple future. || @tags es.future
      mc: «¿Por qué no ha venido Raúl? —Se habrá perdido.» The speaker… || knows that Raúl is lost. | *supposes that Raúl has probably got lost. | says that Raúl will get lost. || The future perfect here expresses a guess about the recent past. || @tags es.future
      mc: «Como mucho, tardaremos una hora» means… || *we'll take an hour at most. | we'll take at least an hour. | we'll take more than an hour. || Como mucho = at most; como mínimo = at least. || @skill vocabulary @tags es.vocabulary
      tf: Mateo is more optimistic than Ainhoa about the future of cars. || false || He says «Yo soy más pesimista». || @ctx dialogue
      short: What is Ainhoa's lifelong dream? || kw: librería/bookshop/bookstore/libros/books || Opening her own bookshop. || @ctx dialogue
      rw: Express it as a guess with the future perfect :: Probablemente se ha quedado dormida. || Se habrá quedado dormida. || Probablemente + pretérito perfecto can be replaced by the future perfect. || @tags es.future
      tr: By then, we will have changed the way we work. || Para entonces, habremos cambiado la forma de trabajar. | Para entonces habremos cambiado la forma de trabajar. | Para entonces, habremos cambiado nuestra forma de trabajar. | Para entonces, habremos cambiado la manera de trabajar. | Para entonces, habremos cambiado nuestra manera de trabajar. || Para entonces + future perfect for something completed by that time. || @tags es.future
      listen: Son las diez y Carmen todavía no ha llegado. Habrá encontrado tráfico en la autopista, porque ella nunca llega tarde. || What does the speaker think? || Carmen has forgotten the meeting. | *Carmen has probably run into traffic. | Carmen is always late. || «Habrá encontrado tráfico» is a guess; the speaker adds that she is never late. || @tags es.listening,es.future
      listen: @dialogue || What does Mateo hope to be doing in twenty-five years? || *Living in a mountain village, retired | Running a bookshop | Working four days a week || «Ya me habré jubilado y estaré viviendo en un pueblo de la sierra.» || @tags es.listening
      dict: Dentro de veinticinco años, el mundo habrá cambiado más de lo que imaginamos. || habrá cambiado = will have changed
      ask: Make three predictions about your life or your town in twenty years, and say how sure you are. || kw: habré/habremos/habrá/habrán & para entonces/dentro de/creo que/seguro que/apuesto || Dentro de veinte años, creo que habré cambiado de profesión al menos una vez. Apuesto a que mi ciudad habrá peatonalizado todo el centro, porque ya han empezado. Y, con un poco de suerte, para entonces habremos encontrado una solución para los precios de la vivienda, aunque no estoy muy seguro.

  - title: Regrets and lessons learned
    summary: Talk about decisions you regret and lessons life has taught you, using si + pluperfect subjunctive, the conditional perfect, mixed conditionals and ojalá.
    minutes: 50
    skills: [grammar, listening, speaking]
    tags: [es.si-clauses, es.imperfect-subjunctive, es.conditional]
    objectives:
      - Imagine a different past with si + pluscuamperfecto de subjuntivo + conditional perfect
      - Connect a past condition with a present result (mixed conditionals)
      - Express regrets with ojalá + pluperfect subjunctive and share lessons learned
    intro: |
      "If I had studied music…" Talking about regrets means imagining a past that never happened. At B1 you learned *si tuviera…, haría…* for the present. Now you will complete the system with **si + pluperfect subjunctive**: *Si hubiera podido elegir, habría estudiado Música.* You will also connect past and present (*si no hubiera estudiado Derecho, no estarías aquí*) and say what life has taught you.
    vocab: |
      arrepentirse de | to regret | v | No me arrepiento de nada. | I don't regret anything. | n: e → ie: me arrepiento. Also with an infinitive: arrepentirse de haber dicho algo.
      el arrepentimiento | regret | n | Con los años, el arrepentimiento se convierte en experiencia. | Over the years, regret turns into experience. | g: m
      hacer caso a | to listen to; to take notice of | expr | Ojalá le hubiera hecho caso a mi madre. | I wish I'd listened to my mother.
      llevar la contraria | to contradict; to go against | expr | No me atreví a llevarles la contraria a mis padres. | I didn't dare go against my parents.
      la valentía | courage; bravery | n | Ojalá hubiera tenido tu valentía a tu edad. | I wish I'd had your courage at your age. | g: f
      tener arreglo | to be fixable; to have a solution | expr | Si algo me ha enseñado la vida es que casi todo tiene arreglo. | If life has taught me anything, it's that almost everything can be fixed.
      sacar una lección | to learn a lesson (from something) | expr | De aquel fracaso saqué una lección muy importante. | I learned a very important lesson from that failure. | n: Also: aprender la lección.
      dar el paso | to take the plunge; to take the step | expr | Tardé años en dar el paso y cambiar de trabajo. | It took me years to take the plunge and change jobs.
      volver atrás | to go back (in time) | expr | Si pudiera volver atrás, haría lo mismo. | If I could go back, I'd do the same.
      la oportunidad perdida | missed opportunity | n | Aquel viaje fue una oportunidad perdida. | That trip was a missed opportunity. | g: f
      mayor de edad | of age; an adult (legally) | expr | Ya eras mayor de edad: podías decidir. | You were already an adult: you could decide. | n: In Spain, from eighteen. The opposite: menor de edad.
      ilusionar | to excite; to fill with hope | v | Elige lo que te ilusione de verdad. | Choose what really excites you. | n: Works like gustar: me ilusiona. Hacerse ilusiones = to get your hopes up.
    grammar:
      title: "Regrets: si hubiera…, habría…"
      body: |
        To imagine a **past that didn't happen**, use **si + pluperfect subjunctive** (*hubiera / hubiese* + participle) in the condition and the **conditional perfect** (*habría* + participle) in the result: ***Si** mis padres no **hubieran insistido**, **habría ido** al conservatorio.* In the result clause you will also often hear *hubiera* + participle: *…**hubiera ido** al conservatorio.* Never use the conditional after *si*: ~~si habría sabido~~.

        **Mixed conditionals** connect different times:

        - past condition → **present** result: si + pluperfect subjunctive + **simple conditional**: *Si no hubiera estudiado Derecho, ahora no **estarías** aquí.*
        - present condition → **past** result: si + imperfect subjunctive + **conditional perfect**: *Si **fuera** más valiente, **habría estudiado** Música.*

        **Ojalá + pluperfect subjunctive** = "I wish I had…": *Ojalá **hubiera tenido** tu valentía.*

        **De + compound infinitive** is a short, elegant alternative to a si-clause: ***De haberlo sabido**, habría empezado antes* = Si lo hubiera sabido…

        To share what you have learned: *Si algo me ha enseñado la vida es que… / He aprendido que… / Ahora sé que…*
      table: |
        Type | Condition | Result | Example
        real (A2) | si + present | present / future | Si tengo tiempo, te llamo.
        hypothetical (B1) | si + imperfect subjunctive | conditional | Si tuviera tiempo, te llamaría.
        impossible past | si + pluperfect subjunctive | conditional perfect | Si hubiera tenido tiempo, te habría llamado.
        mixed: past → present | si + pluperfect subjunctive | conditional | Si hubiera aceptado, ahora viviría en Lima.
        regret | ojalá + pluperfect subjunctive | — | Ojalá hubiera ido.
      examples: |
        Si mis padres no hubieran insistido tanto, habría ido al conservatorio. | If my parents hadn't insisted so much, I would have gone to the conservatoire. | impossible past
        Si no hubiera estudiado Derecho, no habría conocido a tu madre. | If I hadn't studied law, I wouldn't have met your mother.
        Si hubiera sido músico, quizás ahora estaría harto de la música. | If I'd been a musician, maybe I'd be fed up with music now. | mixed: past → present
        Ojalá hubiera tenido tu valentía a tu edad. | I wish I'd had your courage at your age. | regret
      tip: "Remember the chain: si + hubiera + participle, then habría + participle. If the result is about now, drop the haber: si hubiera…, ahora estaría."
    dialogue:
      title: Lo que habría hecho distinto
      setting: A kitchen in Cáceres, late at night. Carlota, who is eighteen, has to choose her degree tomorrow and can't decide. Her father, Rafael, keeps her company.
      speakers: C=Carlota/f; R=Rafael/m
      lines: |
        C: Papá, ¿tú qué habrías estudiado si hubieras podido elegir libremente? | Dad, what would you have studied if you'd been able to choose freely?
        R: Música, sin duda. Si mis padres no hubieran insistido tanto, habría ido al conservatorio de Madrid. | Music, no doubt about it. If my parents hadn't insisted so much, I would have gone to the conservatoire in Madrid.
        C: ¿Y por qué les hiciste caso? Ya eras mayor de edad. | And why did you listen to them? You were already an adult.
        R: Porque en aquella época no me atreví a llevarles la contraria. Ojalá hubiera tenido tu valentía. | Because back then I didn't dare go against them. I wish I'd had your courage.
        C: ¿Te arrepientes de haber estudiado Derecho? | Do you regret studying law?
        R: A veces sí, no te voy a engañar. Pero, si no hubiera estudiado Derecho, no habría conocido a tu madre en la facultad. | Sometimes, yes, I'm not going to lie to you. But if I hadn't studied law, I wouldn't have met your mother at university.
        C: Y yo no estaría aquí, claro. Visto así, menos mal que les hiciste caso. | And I wouldn't be here, of course. Put like that, it's a good thing you listened to them.
        R: ¡Exacto! Además, si hubiera sido músico, quizás ahora estaría harto de la música. Nunca se sabe. | Exactly! Besides, if I'd been a musician, maybe I'd be fed up with music now. You never know.
        C: Pues yo tengo miedo de equivocarme. ¿Y si elijo Bellas Artes y dentro de diez años me arrepiento? | Well, I'm afraid of making a mistake. What if I choose Fine Arts and in ten years I regret it?
        R: Mira, si algo me ha enseñado la vida es que casi todo tiene arreglo. Yo empecé a tocar en un grupo a los cincuenta. | Look, if life has taught me anything, it's that almost everything can be fixed. I started playing in a band at fifty.
        C: Es verdad, y os va genial. De haberlo sabido, ¿habrías empezado mucho antes? | That's true, and it's going really well for you. If you'd known, would you have started much earlier?
        R: Sin duda. Esa es mi lección: no esperes treinta años para hacer lo que te gusta. Elige lo que te ilusione. | Definitely. That's my lesson: don't wait thirty years to do what you love. Choose what excites you.
    pronunciation:
      title: "hubiera, habría: keeping them apart"
      body: |
        In conditional sentences about the past, two similar forms follow each other: ***hu**-bie-ra* in the si-clause and *ha-**brí**-a* in the result. Notice the different stress: *hu-**bie**-ra* (on *bie*) and *ha-**brí**-a* (on *brí*). In both, the **b** is soft and the **h** is silent.

        Practise the full chain slowly, with a slight rise before the comma and a fall at the end: *Si lo hubiera sabido ↗, | te habría llamado ↘.*
      items: |
        si lo hubiera sabido
        si me hubieras hecho caso
        ojalá hubiera ido
        habría ido al conservatorio
        de haberlo sabido
        no habría conocido a tu madre
    culture:
      title: "Choosing a degree in Spain"
      body: |
        At the end of secondary school, students in Spain take a university entrance exam, still popularly known as **la selectividad**. Their final mark, combined with their school grades, decides which degrees they can enter: each degree has a **nota de corte**, a minimum mark that changes every year depending on demand. Music is studied at a **conservatorio**, and art at a faculty of **Bellas Artes**.

        Many Spaniards change direction later in life — returning to study, retraining or turning a hobby into a profession — and expressions such as *nunca es tarde* (it's never too late) are part of everyday conversation.
    mistakes: |
      Si habría sabido la verdad, te lo habría dicho. => Si hubiera sabido la verdad, te lo habría dicho. | Never use the conditional after si; use the pluperfect subjunctive.
      Si hubiera estudiado más, aprobaría el examen de ayer. => Si hubiera estudiado más, habría aprobado el examen de ayer. | The result is also in the past, so use the conditional perfect.
      Ojalá había ido a la fiesta. => Ojalá hubiera ido a la fiesta. | Ojalá is always followed by the subjunctive; for a past regret, the pluperfect subjunctive.
    task:
      title: A letter to my younger self
      mode: writing
      body: |
        Write a letter (120–150 words) to yourself at eighteen. Tell your younger self about one decision you regret and one you are glad you made, what would have happened otherwise, and the most important lesson you have learned. Use at least three sentences with *si + hubiera…, habría…*, one mixed conditional (*si hubiera…, ahora…*) and one *ojalá hubiera…* Then practise in the "Preparing for a job interview" scenario with the AI coach, answering the question *¿Qué habría hecho de otra manera en su último trabajo o en sus estudios?*
    exercises: |
      fill: Si ___ (salir, nosotros) antes de casa, no habríamos perdido el tren. || hubiéramos salido / hubiésemos salido || An impossible past condition: si + pluperfect subjunctive. || @tags es.si-clauses,es.imperfect-subjunctive
      fill: Si no hubiera aceptado aquel trabajo en Valencia, ahora ___ (vivir, yo) en Bilbao. || viviría || Mixed conditional: the result is about the present (ahora), so use the simple conditional. || @tags es.si-clauses,es.conditional
      fill: Ojalá ___ (estudiar, yo) idiomas de pequeño. || hubiera estudiado / hubiese estudiado || Ojalá + pluperfect subjunctive for a regret about the past. || @tags es.si-clauses,es.imperfect-subjunctive
      mc: Choose the correct sentence. || Si habría sabido la verdad, no habría dicho nada. | *Si hubiera sabido la verdad, no habría dicho nada. | Si sabría la verdad, no habría dicho nada. || After si, use the pluperfect subjunctive, never the conditional. || @tags es.si-clauses
      mc: «Si no hubiera estudiado Derecho, no habría conocido a tu madre.» Did Rafael study law? || *Yes | No | We can't tell || The si-clause describes the opposite of what happened: he did study law, and he did meet her. || @tags es.si-clauses
      mc: «De joven, le llevaba la contraria a todo el mundo» means he… || *always contradicted everybody. | always agreed with everybody. | always carried things for everybody. || Llevar la contraria = to contradict, to go against. || @skill vocabulary @tags es.vocabulary
      tf: Rafael's parents wanted him to study music. || false || They insisted that he study law; he wanted to study music. || @ctx dialogue
      short: According to Rafael, what has life taught him? || kw: arreglo/solución/fixed/fix/solution/remedy || «Casi todo tiene arreglo» — almost everything can be fixed. || @ctx dialogue
      rw: Rewrite as a regret, starting with «Si…» :: No estudié para el examen y suspendí. || Si hubiera estudiado para el examen, no habría suspendido. | Si hubiese estudiado para el examen, no habría suspendido. | Si hubiera estudiado para el examen, no hubiera suspendido. | Si hubiera estudiado para el examen, habría aprobado. | Si hubiese estudiado para el examen, habría aprobado. || Si + pluperfect subjunctive + conditional perfect describes the opposite of what happened. || @tags es.si-clauses
      tr: I wish I had listened to my parents. || Ojalá hubiera escuchado a mis padres. | Ojalá hubiese escuchado a mis padres. | Ojalá les hubiera hecho caso a mis padres. | Ojalá hubiera hecho caso a mis padres. | Ojalá les hubiese hecho caso a mis padres. | Ojalá hubiese hecho caso a mis padres. || Ojalá + pluperfect subjunctive: "I wish I had…". || @tags es.si-clauses,es.imperfect-subjunctive
      listen: Si hubiera sabido que iban a cancelar el concierto, no habría venido desde Sevilla solo para verlo. || What happened? || *The concert was cancelled after the speaker had travelled from Seville. | The speaker decided not to go to the concert. | The concert was moved to Seville. || The speaker didn't know, came from Seville and the concert was cancelled. || @tags es.listening,es.si-clauses
      listen: @dialogue || When did Rafael start playing in a band? || At eighteen | *At fifty | When he was at the conservatoire || «Yo empecé a tocar en un grupo a los cincuenta.» || @tags es.listening
      dict: De haberlo sabido, habría reservado el hotel con más antelación. || de haberlo sabido = if I had known
      say: Si pudiera volver atrás, me habría atrevido a dar el paso mucho antes. || If I could go back, I would have dared to take the plunge much earlier.

  - title: Presenting an argument
    summary: Read the transcript of a short talk, learn how to structure and signpost a presentation, and combine real, hypothetical and impossible conditions to defend a proposal.
    minutes: 50
    skills: [reading, speaking, grammar]
    tags: [es.si-clauses, es.connectors, es.opinion]
    objectives:
      - Understand the structure of a persuasive presentation
      - Signpost a talk (en primer lugar, pasemos ahora a, ahora bien, en conclusión)
      - Use all three types of conditional sentence to defend a proposal and answer objections
    intro: |
      The final step of B2 is to bring everything together in a presentation: a clear structure, data, examples, an objection answered and a memorable conclusion. In this lesson you will read the transcript of a short talk defending cities designed for all ages. Notice how the speaker guides the audience and how she uses three kinds of *si*: what is real, what is imaginable and what can no longer be changed.
    vocab: |
      la intervención | talk; speech; contribution | n | Mi intervención tiene tres partes. | My talk has three parts. | g: f | n: In a meeting or debate: each person's turn to speak.
      la objeción | objection | n | Ahora responderé a una objeción que escucho a menudo. | Now I'll answer an objection I often hear. | g: f
      la esperanza de vida | life expectancy | n | España tiene una de las esperanzas de vida más altas del mundo. | Spain has one of the highest life expectancies in the world. | g: f
      la autonomía | independence; autonomy | n | Un banco a la sombra puede devolverle la autonomía a una persona mayor. | A shaded bench can give an older person their independence back. | g: f | n: Also an autonomous community in Spain.
      legítimo | legitimate; fair | adj | Es una pregunta legítima. | It's a fair question.
      la inversión | investment | n | No se trata de un gasto, sino de una inversión. | It's not an expense, but an investment. | g: f
      el gasto | expense; spending | n | El gasto en sanidad aumentará en los próximos años. | Health spending will increase in the coming years. | g: m
      ahora bien | having said that; however | expr | Ahora bien, sé lo que algunos están pensando. | Having said that, I know what some of you are thinking. | n: Introduces an objection or a limit; typical of speeches and essays.
      pongamos por caso | let's take, for example | expr | Pongamos por caso el ascensor. | Let's take the lift as an example.
      dicho de otro modo | in other words | expr | Dicho de otro modo, la pregunta no es si, sino cuándo. | In other words, the question isn't if, but when. | n: Also: dicho de otra manera, es decir, en otras palabras.
      en conclusión | in conclusion | expr | En conclusión, una ciudad para mayores es una ciudad para todos. | In conclusion, a city for older people is a city for everyone.
      agradecer | to appreciate; to be grateful for | v | El banco que necesita un abuelo también lo agradece una madre embarazada. | The bench a grandfather needs is also appreciated by a pregnant mother. | n: Irregular yo form: agradezco.
    grammar:
      title: "Presenting an argument: signposts and conditions"
      body: |
        **Signposting** helps your audience follow you. Announce the structure (*Mi intervención tiene tres partes*), mark each step (*En primer lugar… A continuación… Pasemos ahora a… Para terminar…*), give examples (*Pongamos por caso…*), rephrase (*Dicho de otro modo… / Es decir…*), introduce an objection (*Ahora bien… / Sé lo que algunos están pensando…*) and conclude (*En conclusión… / Para concluir…*).

        **Three kinds of condition** let you argue at different levels of reality:

        - **Real** — what will happen if we act: *si* + present → present, future or imperative: ***Si empezamos** hoy, dentro de veinte años **habremos construido** algo mejor.*
        - **Hypothetical** — an imaginable situation: *si* + imperfect subjunctive → conditional: ***Si** cada calle **tuviera** un banco, miles de vecinos **recuperarían** su autonomía.*
        - **Impossible past** — what we can no longer change, often to show the cost of not acting: *si* + pluperfect subjunctive → conditional perfect or conditional: ***Si hubiéramos pensado** en esto hace treinta años, hoy no **habría** tantas personas atrapadas en casa.*

        Choosing the type is a rhetorical decision: the real condition sounds confident and practical; the hypothetical invites the audience to imagine; the impossible past creates a sense of urgency.
      table: |
        Function | Signposts
        Structure | Mi intervención tiene tres partes. · En primer lugar… · A continuación… · Para terminar…
        Moving on | Pasemos ahora a… · Empecemos por…
        Example | Pongamos por caso… · Por ejemplo…
        Rephrasing | Dicho de otro modo… · Es decir…
        Objection | Ahora bien… · Sé lo que algunos están pensando…
        Conclusion | En conclusión… · Para concluir… · Muchas gracias por su atención.
      examples: |
        Si diseñamos las ciudades pensando en los mayores, las diseñaremos para todo el mundo. | If we design cities with older people in mind, we will be designing them for everyone. | real condition
        Si cada calle tuviera un banco a la sombra, miles de vecinos recuperarían su autonomía. | If every street had a shaded bench, thousands of residents would regain their independence. | hypothetical
        Si hubiéramos pensado en esto hace treinta años, hoy no habría tantas personas atrapadas en casa. | If we had thought about this thirty years ago, there wouldn't be so many people trapped at home today. | impossible past, present result
        Ahora bien, ¿quién va a pagar todo esto? | Having said that, who is going to pay for all this? | introducing an objection
      tip: "Plan your talk on one card: three signposts, one example, one objection with ahora bien, and one sentence for the conclusion. Then add one condition of each type."
    reading:
      title: Una ciudad para todas las edades
      text: |
        Buenas tardes a todos y gracias por invitarme. Hoy quiero defender una idea muy sencilla: si diseñamos las ciudades pensando en las personas mayores, las estaremos diseñando para todo el mundo.

        Mi intervención tiene tres partes. En primer lugar, explicaré por qué este tema es urgente. A continuación, presentaré tres propuestas concretas. Y, para terminar, responderé a una objeción que escucho a menudo.

        Empecemos por los datos. España es uno de los países con mayor esperanza de vida del mundo y, según las proyecciones, a mediados de siglo casi uno de cada tres habitantes tendrá más de sesenta y cinco años. Dicho de otro modo: para entonces, nuestras ciudades se habrán convertido en ciudades de mayores, lo queramos o no. La pregunta no es si debemos adaptarlas, sino cómo y cuándo.

        Pasemos ahora a las propuestas. La primera: bancos y sombra. Puede parecer poca cosa, pero muchas personas mayores dejan de salir de casa porque no tienen dónde descansar. Si cada calle tuviera un banco a la sombra cada cien metros, miles de vecinos recuperarían su autonomía. La segunda: semáforos que den más tiempo para cruzar. Y la tercera: ascensores en los edificios antiguos. Si hubiéramos pensado en esto hace treinta años, hoy no habría tantas personas atrapadas en un cuarto piso sin ascensor.

        Ahora bien, sé lo que algunos están pensando: «¿Y quién va a pagar todo esto?». Es una pregunta legítima. Pero pongamos por caso el ascensor. Una persona que puede salir de casa camina, compra en el barrio, ve a sus amigos y, por lo tanto, necesita menos atención médica y menos ayuda a domicilio. Es decir, no se trata de un gasto, sino de una inversión.

        Y no solo para los mayores. El banco que necesita un abuelo también lo agradece una mujer embarazada; el ascensor que necesita una vecina de ochenta años lo usa también quien va con un carrito o con muletas.

        En conclusión, una ciudad pensada para los mayores no es una ciudad triste ni lenta: es una ciudad más amable. Si empezamos hoy, dentro de veinte años habremos construido algo de lo que nos sentiremos orgullosos. Muchas gracias.
      translation: |
        Good afternoon, everyone, and thank you for inviting me. Today I want to defend a very simple idea: if we design cities with older people in mind, we will be designing them for everyone.

        My talk has three parts. First, I will explain why this issue is urgent. Then I will present three specific proposals. And, finally, I will answer an objection I often hear.

        Let's start with the data. Spain is one of the countries with the highest life expectancy in the world and, according to projections, by the middle of the century almost one in three inhabitants will be over sixty-five. In other words: by then, our cities will have become cities of older people, whether we like it or not. The question is not whether we should adapt them, but how and when.

        Let's move on to the proposals. The first: benches and shade. It may seem a small thing, but many older people stop going out because they have nowhere to rest. If every street had a shaded bench every hundred metres, thousands of residents would regain their independence. The second: traffic lights that give more time to cross. And the third: lifts in old buildings. If we had thought about this thirty years ago, there wouldn't be so many people trapped today on a fourth floor without a lift.

        Having said that, I know what some of you are thinking: "And who is going to pay for all this?" It's a fair question. But let's take the lift as an example. A person who can leave home walks, shops in the neighbourhood, sees their friends and, therefore, needs less medical care and less home help. In other words, it isn't an expense, but an investment.

        And not only for older people. The bench a grandfather needs is also appreciated by a pregnant woman; the lift an eighty-year-old neighbour needs is also used by people with a pushchair or on crutches.

        In conclusion, a city designed for older people is not a sad or slow city: it is a kinder city. If we start today, in twenty years we will have built something we will be proud of. Thank you very much.
    pronunciation:
      title: "Signposts and pauses in a talk"
      body: |
        In a presentation, signposts are spoken a little more slowly and followed by a clear pause, so the audience can follow the structure: *En primer lugar, | …* Raise your voice slightly on the signpost and lower it for the content that follows.

        For the conclusion, slow down, stress the key words and let your voice fall clearly at the end — then pause before *Muchas gracias*.
      items: |
        Mi intervención tiene tres partes.
        En primer lugar,
        Pasemos ahora a las propuestas.
        Ahora bien,
        Dicho de otro modo,
        Muchas gracias por su atención.
    mistakes: |
      Si tendríamos más bancos, saldría más gente. => Si tuviéramos más bancos, saldría más gente. | Never use the conditional after si: use the imperfect subjunctive.
      Si reducimos el tráfico, la ciudad sería más tranquila. => Si reducimos el tráfico, la ciudad será más tranquila. | A real condition (si + present) is followed by the present, future or imperative; the conditional goes with si + imperfect subjunctive.
      En primero lugar, voy a hablar de los datos. => En primer lugar, voy a hablar de los datos. | Primero becomes primer before a masculine singular noun.
    task:
      title: Defend your proposal
      mode: speaking
      body: |
        Prepare a three-minute presentation defending one proposal for the future of your town, school or workplace. Announce the structure, give data or an example, answer one objection with *ahora bien* and finish with a clear conclusion. Use at least one real condition, one hypothetical condition and one impossible past condition, plus one future perfect (*dentro de diez años habremos…*). Then present it in the "Taking part in a business meeting" scenario with the AI coach and answer its questions.
    exercises: |
      mc: What is the speaker's main idea? || *Cities designed for older people are better for everyone. | Older people should move to quieter villages. | Cities should build more hospitals. || «Si diseñamos las ciudades pensando en las personas mayores, las estaremos diseñando para todo el mundo.» || @ctx reading @tags es.reading
      tf: According to the speaker, almost one in three inhabitants will be over sixty-five by the middle of the century. || true || «A mediados de siglo casi uno de cada tres habitantes tendrá más de sesenta y cinco años.» || @ctx reading @tags es.reading
      short: Name one of the speaker's three proposals. || kw: bancos/benches/bench/sombra/shade/semáforos/traffic lights/ascensores/ascensor/lifts/lift/elevators || Benches with shade, traffic lights with more time to cross, and lifts in old buildings. || @ctx reading @tags es.reading
      mc: How does the speaker answer the objection about the cost? || The government will pay for everything. | *It's an investment, because people who can go out need less care. | The cost is very small. || «No se trata de un gasto, sino de una inversión.» || @ctx reading @tags es.reading
      fill: Si cada calle ___ (tener) un banco a la sombra, más vecinos saldrían a pasear. || tuviera / tuviese || A hypothetical condition followed by the conditional (saldrían): si + imperfect subjunctive. || @tags es.si-clauses,es.imperfect-subjunctive
      fill: Si reducimos el tráfico en el centro, la ciudad ___ (ser) más tranquila. || será || A real condition (si + present) is followed by the future. || @tags es.si-clauses,es.future
      fill: Si ___ (instalar, ellos) ascensores hace treinta años, hoy no habría tantas personas atrapadas en casa. || hubieran instalado / hubiesen instalado || An impossible past condition: si + pluperfect subjunctive, here with a present result (habría). || @tags es.si-clauses,es.imperfect-subjunctive
      mc: Which expression introduces an objection in a presentation? || En primer lugar | *Ahora bien | Muchas gracias || Ahora bien (having said that) introduces an objection or a limit. || @tags es.connectors
      mc: «Dicho de otro modo» means… || *in other words. | on the other hand. | to finish. || Dicho de otro modo = dicho de otra manera = es decir. || @skill vocabulary @tags es.vocabulary
      rw: Change it into an impossible past condition, starting with «Si hubiéramos empezado hace diez años…» :: Si empezamos hoy, lo conseguiremos. || Si hubiéramos empezado hace diez años, lo habríamos conseguido. | Si hubiéramos empezado hace diez años, ya lo habríamos conseguido. | Si hubiéramos empezado hace diez años, lo hubiéramos conseguido. | Si hubiéramos empezado hace diez años, ya lo hubiéramos conseguido. || An impossible past condition: si + pluperfect subjunctive + conditional perfect. || @tags es.si-clauses
      tr: In other words, it isn't an expense but an investment. || Dicho de otro modo, no es un gasto, sino una inversión. | Es decir, no es un gasto, sino una inversión. | Dicho de otra manera, no es un gasto, sino una inversión. | En otras palabras, no es un gasto, sino una inversión. | Dicho de otro modo, no se trata de un gasto, sino de una inversión. || No es…, sino… corrects the first idea; dicho de otro modo rephrases. || @tags es.connectors
      listen: Mi intervención tiene dos partes: primero analizaré los datos de este año y, a continuación, propondré tres medidas para el próximo. || What will the speaker do in the second part? || *Propose three measures for next year | Analyse this year's data | Answer the audience's questions || «A continuación, propondré tres medidas para el próximo.» || @tags es.listening,es.connectors
      listen: Si hubiéramos invertido antes en el tren, hoy no tendríamos tantos camiones en las carreteras. || What does the speaker regret? || *Not investing in the railway earlier | Investing too much in roads | Buying too many lorries || «Si hubiéramos invertido antes en el tren…» describes what didn't happen. || @tags es.listening,es.si-clauses
      dict: Si empezamos hoy, dentro de veinte años habremos construido una ciudad más amable. || habremos construido = will have built
      say: Ahora bien, sé lo que algunos de ustedes están pensando. || Having said that, I know what some of you are thinking.
