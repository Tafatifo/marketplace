  - title: Changing careers
    summary: Talk about a career change and explain its causes and consequences with comme, puisque, grâce à, à cause de and donc.
    minutes: 45
    skills: [listening, speaking, grammar]
    tags: [fr.connectors, fr.conditionnel]
    objectives:
      - Understand someone's story of a career change
      - Explain causes and consequences with comme, parce que, puisque, grâce à, à cause de and donc
      - Say what you would advise someone who wants to change careers
    intro: |
      More and more people change careers in the middle of their working lives — *la reconversion professionnelle* is a big topic in France. Telling this kind of story means explaining **why** (*comme je ne voyais plus mes enfants…*), **what helped** (*grâce à une formation*) and **what made it hard** (*à cause du loyer*). These connectors make your explanations clear and natural.
    vocab: |
      la reconversion | career change | n | Sa reconversion a pris deux ans. | Her career change took two years. | g: f | n: In full: la reconversion professionnelle.
      se reconvertir | to retrain; to change careers | v | Il s'est reconverti dans la boulangerie. | He retrained as a baker. | c: se reconvertir dans + field
      un bilan de compétences | a skills assessment | n | J'ai fait un bilan de compétences avec une conseillère. | I did a skills assessment with an adviser. | g: m
      une formation | a training course | n | Elle suit une formation de développeuse web. | She's doing a web-developer training course. | c: suivre une formation; une formation en ligne | g: f
      se lancer | to take the plunge; to get started | v | J'avais peur, mais je me suis lancé. | I was scared, but I took the plunge.
      trouver sa voie | to find one's path | expr | Elle a mis du temps à trouver sa voie. | It took her a while to find her path.
      être son propre patron | to be one's own boss | expr | Depuis deux ans, je suis mon propre patron. | For two years I've been my own boss.
      se renseigner | to find out; to make enquiries | v | Renseignez-vous bien avant de démissionner. | Find out everything you can before you resign. | c: se renseigner sur quelque chose
      un atelier | a workshop | n | Il a ouvert un atelier de réparation de vélos. | He opened a bike-repair workshop. | g: m
      un métier manuel | a manual trade | n | Les métiers manuels attirent de plus en plus de jeunes. | Manual trades attract more and more young people. | g: m
      hésiter à | to hesitate to | v | N'hésitez pas à demander conseil. | Don't hesitate to ask for advice.
      regretter | to regret | v | Je ne regrette pas du tout mon choix. | I don't regret my choice at all.
      un auditeur | a listener | n | Merci à nos auditeurs pour leurs messages ! | Thanks to our listeners for their messages! | g: m | n: Feminine: une auditrice.
    grammar:
      title: Explaining causes and consequences
      body: |
        French has several ways to explain **why**, and each has its place.

        - **parce que** + clause: the neutral answer to *pourquoi ?* — *J'ai démissionné parce que je voulais voir mes enfants.*
        - **comme** + clause, **at the start** of the sentence: *Comme je passais ma vie sur la route, j'ai démissionné.*
        - **puisque** + clause: a cause that is obvious or already known: *Puisque je suis mon propre patron, je choisis mes horaires.*
        - **car** + clause: more formal or written; never at the start of a sentence.
        - **grâce à** + noun for a **positive** cause, **à cause de** + noun for a **negative** one: *grâce à une formation*, *à cause du loyer*. Remember the contractions: *à cause du / des*, *grâce au / aux*.

        For the **consequence**, use *donc*, *alors*, *c'est pour ça que* (spoken) or *c'est pourquoi* (more formal). To put a cause in focus, say *C'est grâce à… que…*: *C'est grâce à ma conseillère que j'ai trouvé ma voie.*
      table: |
        Meaning | Connector | Followed by | Example
        cause | parce que | a clause | Je suis parti parce que j'étais fatigué.
        cause at the start | comme | a clause | Comme il pleuvait, on est restés.
        known cause | puisque | a clause | Puisque tu es là, aide-moi !
        positive cause | grâce à | a noun | J'ai trouvé ce poste grâce à une amie.
        negative cause | à cause de | a noun | On est en retard à cause des travaux.
        consequence | donc, alors, c'est pour ça que | a clause | J'aime bricoler, donc j'ai choisi ce métier.
      examples: |
        Comme j'étais toujours fatigué, j'ai décidé de changer de vie. | As I was always tired, I decided to change my life. | comme at the start
        Elle a trouvé un emploi grâce à son stage. | She found a job thanks to her internship. | positive cause
        Le projet a pris du retard à cause du budget. | The project fell behind because of the budget. | negative cause
        Je voulais travailler dehors, c'est pour ça que je suis devenue jardinière. | I wanted to work outdoors; that's why I became a gardener. | consequence
      tip: "Grâce à and à cause de are followed by a noun; parce que, comme and puisque by a full clause with a verb."
    dialogue:
      title: Nouvelle vie
      setting: A podcast about career changes. The host, Élodie, interviews Karim, a former sales representative who now runs a bike workshop in Grenoble.
      speakers: E=Élodie/f; K=Karim/m
      lines: |
        E: Bienvenue dans « Nouvelle vie ». Karim, vous avez été commercial pendant douze ans. Pourquoi tout quitter ? | Welcome to "New Life". Karim, you were a sales rep for twelve years. Why give it all up?
        K: Comme je passais ma vie sur la route, je ne voyais presque plus mes enfants. | As I spent my life on the road, I hardly saw my children any more.
        E: Et vous saviez déjà quel métier vous vouliez faire ? | And did you already know what job you wanted to do?
        K: Pas du tout. C'est grâce à un bilan de compétences que j'ai trouvé ma voie. | Not at all. It was thanks to a skills assessment that I found my path.
        E: Et pourquoi la réparation de vélos ? | And why bike repair?
        K: Je répare des vélos depuis l'adolescence, donc c'était une évidence pour moi. | I've been repairing bikes since I was a teenager, so it was obvious for me.
        E: Ça n'a pas été trop difficile, financièrement ? | Wasn't it too hard, financially?
        K: Si, la première année a été dure, à cause du loyer de l'atelier et des travaux. | Yes, the first year was hard, because of the workshop rent and the renovation work.
        E: Vous ne regrettez rien ? | You don't regret anything?
        K: Non ! Puisque je suis mon propre patron, je rentre tous les soirs à dix-huit heures. | No! Since I'm my own boss, I'm home every evening at six.
        E: Quel conseil donneriez-vous à nos auditeurs qui hésitent à se lancer ? | What advice would you give our listeners who are hesitating to take the plunge?
        K: Je leur dirais de bien se renseigner, mais surtout de ne pas avoir peur. | I'd tell them to find out as much as they can, but above all not to be afraid.
    pronunciation:
      title: Connectors in fast speech
      body: |
        In everyday speech, connectors are often shortened. *Parce que* can sound like [pas.kə] or even [pask]; *c'est pour ça que* becomes [sɛ.puʁ.sak]. *Puisque* is [pɥis.kə]: the same glide [ɥ] as in *huit*.

        *Donc* is usually pronounced with its final [k] — [dɔ̃k] — especially at the start of a sentence or when you stress the consequence. In *grâce à*, link the two words smoothly: [ɡʁɑ.sa].
      items: |
        parce que
        puisque
        à cause de
        grâce à
        donc
        c'est pour ça que
    culture:
      title: La reconversion en France
      body: |
        Changing careers is common in France, and there are tools to help. A *bilan de compétences* is a series of sessions with a professional adviser to analyse your skills, motivations and options. Every worker also has a *compte personnel de formation* (CPF), a training account credited every year, which can pay for courses or a skills assessment.

        Many adults who move into manual trades — baker, carpenter, florist, bike mechanic — prepare a *CAP*, a vocational diploma that can be taken in a year or less by adults.
    mistakes: |
      Car je passais ma vie sur la route, j'ai démissionné. => Comme je passais ma vie sur la route, j'ai démissionné. | Car can't start a sentence; at the beginning, use comme.
      J'ai trouvé ce poste à cause d'une amie. => J'ai trouvé ce poste grâce à une amie. | For a positive result, use grâce à; à cause de is for a negative cause.
      On est en retard à cause de le train. => On est en retard à cause du train. | De + le contracts to du.
    task:
      title: My career change
      mode: speaking
      body: |
        Tell the story of a career change — your own, someone you know, or an imaginary one — as if you were a guest on the podcast. Say what the person did before, why they changed (*comme, parce que, grâce à, à cause de*), how it went, and what advice you would give (*je leur dirais de…*). Speak for one to two minutes, then practise explaining your choices to a recruiter in the "Preparing for a job interview" scenario.
    exercises: |
      fill: ___ il pleuvait, nous avons annulé la sortie. || Comme || At the start of the sentence, comme introduces the cause. || @tags fr.connectors
      fill: J'ai trouvé ce stage ___ mon ancien professeur. || grâce à || A positive cause + noun: grâce à. || @tags fr.connectors
      fill: Nous sommes arrivés en retard ___ la neige. || à cause de || A negative cause + noun: à cause de (de + la stays de la). || @tags fr.connectors
      mc: "___ tu connais bien la ville, tu peux nous guider !" || *Puisque | Car | Grâce à || Puisque gives a cause both people know. Car can't start a sentence; grâce à needs a noun. || @tags fr.connectors
      mc: Which connector introduces a consequence? || parce que | *c'est pour ça que | comme || C'est pour ça que = that's why. The other two introduce a cause. || @tags fr.connectors
      tf: When Karim left his job, he already knew what he wanted to do. || false || "Pas du tout." He found his path thanks to a skills assessment. || @ctx dialogue
      short: Why did Karim want to stop working as a sales rep? || kw: route/road/enfant/children/kids/travel || "Comme je passais ma vie sur la route, je ne voyais presque plus mes enfants." || @ctx dialogue
      listen: @dialogue || What made Karim's first year difficult? || *The workshop rent and the renovation work | Not having enough customers | Problems with his skills assessment || "À cause du loyer de l'atelier et des travaux." || @tags fr.listening
      listen: Grâce à une formation en ligne, j'ai pu préparer ma reconversion sans quitter mon emploi tout de suite. || What helped the speaker? || *An online training course | A new manager | A loan from the bank || "Grâce à une formation en ligne…" || @tags fr.listening,fr.connectors
      rw: Join the sentences with "parce que" :: J'ai quitté mon poste. Je voulais vivre à la campagne. || J'ai quitté mon poste parce que je voulais vivre à la campagne. || Parce que + a full clause gives the reason. || @tags fr.connectors
      rw: Start the sentence with "Comme" :: Je travaillais trop, donc j'étais toujours fatigué. || Comme je travaillais trop, j'étais toujours fatigué. || With comme at the start, you no longer need donc. || @tags fr.connectors
      tr: I changed careers because I wanted to work with my hands. || J'ai changé de métier parce que je voulais travailler avec mes mains. | Je me suis reconverti parce que je voulais travailler avec mes mains. | Je me suis reconvertie parce que je voulais travailler avec mes mains. || Parce que + clause; the wish in the past is in the imparfait (je voulais). || @tags fr.connectors,fr.imparfait-vs-pc
      dict: Puisque je suis mon propre patron, je choisis mes horaires. || puisque
      ask: Explain why you chose your job or your studies, using at least two connectors of cause or consequence. || kw: parce que/comme/puisque/grâce à/à cause de/car & donc/alors/c'est pour ça que/du coup/c'est pourquoi || J'ai choisi l'informatique parce que j'adorais les jeux vidéo. Comme j'étais bon en maths, c'était logique, donc je suis devenu développeur.
