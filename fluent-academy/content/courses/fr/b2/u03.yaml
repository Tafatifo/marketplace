  - title: Health and medicine in the news
    summary: Read health news briefs and use nominalisation to understand headlines and write in a concise, formal style.
    minutes: 45
    skills: [reading, vocabulary, writing]
    tags: [fr.vocabulary, fr.passive]
    objectives:
      - Understand short health news items and their headlines
      - Form nouns from verbs and adjectives (-tion, -ment, -age, -ure, -ité and nouns without a suffix)
      - Turn a sentence into a headline, moving the subject into a complement with de
    intro: |
      *Hausse des cas de grippe*, *Ouverture d'un centre de santé*, *Pénurie de médicaments* — French headlines are made of nouns rather than verbs. This **nominal style** is also typical of reports, formal letters and exam essays. Understanding how nouns are built from verbs and adjectives will help you read the news faster and write more concisely.
    vocab: |
      une épidémie | an epidemic | n | Le pic de l'épidémie est attendu fin janvier. | The peak of the epidemic is expected at the end of January. | g: f
      un pic | a peak | n | On observe un pic de consultations en hiver. | There's a peak in consultations in winter. | g: m
      un médecin généraliste | a GP; a family doctor | n | Mon médecin généraliste part à la retraite. | My GP is retiring. | g: m | n: Informally: un généraliste.
      le dépistage | screening | n | Le dépistage précoce sauve des vies. | Early screening saves lives. | g: m | n: Dépister = to screen for; un test de dépistage.
      une pénurie | a shortage | n | La pénurie de médecins touche de nombreuses régions. | The shortage of doctors affects many regions. | g: f
      une rupture de stock | a stock shortage | n | Ce médicament est en rupture de stock. | This medicine is out of stock. | g: f
      un désert médical | an area with too few doctors | n | Le village se trouve en plein désert médical. | The village is in an area with almost no doctors. | g: m
      un essai clinique | a clinical trial | n | L'essai clinique a duré trois ans. | The clinical trial lasted three years. | g: m
      prometteur | promising | adj | Les premiers résultats sont prometteurs. | The first results are promising. | n: Feminine: prometteuse.
      la résistance aux antibiotiques | antibiotic resistance | n | La résistance aux antibiotiques inquiète les médecins. | Antibiotic resistance worries doctors. | g: f
      la mise au point | development (of a product) | n | La mise au point du vaccin a pris dix ans. | The development of the vaccine took ten years. | g: f | n: From mettre au point = to develop, to perfect.
      la hausse | rise; increase | n | On note une hausse des consultations. | There's a rise in consultations. | g: f | n: The opposite is la baisse. Both are formed without a suffix.
    grammar:
      title: "Nominalisation: from verbs and adjectives to nouns"
      body: |
        Headlines, reports and formal writing often replace a verb or an adjective with a **noun**: *Les cas de grippe augmentent* → ***Augmentation** des cas de grippe*. The sentence becomes shorter, more abstract and more formal.

        Common patterns:
        - **-tion / -sion** (feminine): *augmenter → l'augmentation, décider → la décision*
        - **-ment** (masculine): *lancer → le lancement, renforcer → le renforcement*
        - **-age** (masculine): *dépister → le dépistage, laver → le lavage*
        - **-ure** (feminine): *ouvrir → l'ouverture, fermer → la fermeture*
        - **no suffix**: *hausser → la hausse, baisser → la baisse, reculer → le recul, découvrir → la découverte*
        - adjective → noun in **-ité, -eur, -esse**: *efficace → l'efficacité, long → la longueur, faible → la faiblesse*

        When you nominalise, the subject or object of the verb becomes a complement with **de**: *On a découvert une molécule* → *la découverte **d'**une molécule*. Adverbs become adjectives: *augmenter nettement* → *une **nette** augmentation*. Learn each noun with its gender: the suffix helps, but there are exceptions.
      table: |
        Verb or adjective | Noun | Headline
        augmenter | l'augmentation (f) | Augmentation des prix de l'énergie
        lancer | le lancement (m) | Lancement d'une campagne de dépistage
        ouvrir | l'ouverture (f) | Ouverture d'un centre de santé
        baisser | la baisse (f) | Baisse du nombre de fumeurs
        découvrir | la découverte (f) | Découverte d'une nouvelle molécule
        efficace | l'efficacité (f) | Efficacité du traitement confirmée
      examples: |
        Le nombre de médecins recule. → Recul du nombre de médecins. | The number of doctors is falling. → Fall in the number of doctors. | no suffix
        On a fermé la maternité. → Fermeture de la maternité. | The maternity unit was closed. → Closure of the maternity unit. | -ure
        On vaccine rapidement les personnes âgées. → La vaccination rapide des personnes âgées. | Older people are vaccinated quickly. → The rapid vaccination of older people. | adverb → adjective
      tip: "Nouns in -age are masculine, except a handful you should learn: la page, la plage, la cage, l'image, la nage, la rage."
    reading:
      title: La santé en bref
      text: |
        Hausse des cas de grippe dans le Grand Est
        Depuis deux semaines, les médecins généralistes de la région constatent une nette augmentation des consultations pour syndrome grippal. Le pic de l'épidémie serait attendu d'ici la fin du mois. Les autorités sanitaires rappellent l'importance de la vaccination des personnes âgées et de quelques gestes simples : lavage des mains, aération des pièces, port du masque en cas de symptômes.

        Ouverture d'un centre de santé dans la Creuse
        Après trois ans sans médecin, les habitants de ce village peuvent de nouveau consulter près de chez eux. L'ouverture du centre, financé par la commune et la région, a été rendue possible grâce au recrutement de deux médecins salariés. Une infirmière assure également des visites à domicile.

        Pénurie de médicaments : vers un renforcement des stocks ?
        Depuis plusieurs hivers, les pharmacies font face à des ruptures de stock de médicaments courants, notamment d'antibiotiques pour enfants. Pour limiter ces pénuries, les fabricants pourraient être obligés de constituer des stocks plus importants. Le retour en Europe d'une partie de la production est également envisagé.

        Découverte prometteuse contre la résistance aux antibiotiques
        Une équipe de chercheurs a identifié une molécule capable de détruire certaines bactéries résistantes. Les premiers résultats, obtenus sur des souris, ont été publiés cette semaine. Prudence toutefois : la mise au point d'un traitement pour l'être humain pourrait prendre une dizaine d'années, et l'efficacité de la molécule devra être confirmée par des essais cliniques.
      translation: |
        Rise in flu cases in the Grand Est
        For the past two weeks, GPs in the region have seen a clear increase in consultations for flu-like illness. The peak of the epidemic is reportedly expected by the end of the month. The health authorities stress the importance of vaccinating older people and of a few simple measures: washing your hands, airing rooms and wearing a mask if you have symptoms.

        A health centre opens in the Creuse
        After three years without a doctor, the residents of this village can once again see a doctor close to home. The opening of the centre, funded by the municipality and the region, was made possible by the recruitment of two salaried doctors. A nurse also makes home visits.

        Medicine shortages: towards bigger stocks?
        For several winters, pharmacies have been facing shortages of common medicines, especially antibiotics for children. To limit these shortages, manufacturers could be required to build up larger stocks. Bringing part of the production back to Europe is also being considered.

        A promising discovery against antibiotic resistance
        A team of researchers has identified a molecule capable of destroying certain resistant bacteria. The first results, obtained in mice, were published this week. Caution, however: developing a treatment for humans could take around ten years, and the molecule's effectiveness will have to be confirmed by clinical trials.
    pronunciation:
      title: "-tion, -sion, -stion"
      body: |
        The ending **-tion** is pronounced [sjɔ̃]: *augmentation* [oɡ.mɑ̃.ta.sjɔ̃], *vaccination* [vak.si.na.sjɔ̃]. After a vowel, **-sion** is [zjɔ̃]: *décision* [de.si.zjɔ̃]; after a consonant it is [sjɔ̃]: *pension*. But after **s**, *-tion* keeps a real [t]: *question* [kɛs.tjɔ̃], *gestion* [ʒɛs.tjɔ̃].

        In *épidémie* [e.pi.de.mi], every vowel is a short, clear syllable: don't reduce any of them.
      items: |
        l'augmentation
        la vaccination
        la décision
        la question
        la gestion
        l'épidémie
    culture:
      title: Le médecin traitant
      body: |
        In France, every adult is encouraged to declare a *médecin traitant*, usually a GP, who coordinates their care: consultations are better reimbursed by the *Assurance maladie* when patients go through this doctor first. In rural areas and some suburbs, finding a médecin traitant has become difficult, and towns increasingly open *centres de santé* with salaried doctors to attract young practitioners.
    mistakes: |
      Augmentation de les cas de grippe. => Augmentation des cas de grippe. | De + les always contracts to des.
      Le découverte d'une molécule. => La découverte d'une molécule. | Découverte is feminine; nouns formed from a feminine participle keep the -e.
      L'ouvrement du centre. => L'ouverture du centre. | The noun from ouvrir is l'ouverture (-ure), not a -ment noun.
    task:
      title: Health news from your town
      mode: writing
      body: |
        Write four nominalised headlines about health in your town or region (an opening, a closure, a rise or fall, a campaign), then develop one of them into a short news brief (about 80 words). Use at least one passive and one journalistic conditional, as in the reading.
    exercises: |
      fill: Les prix des médicaments baissent. → ___ des prix des médicaments. || Baisse / La baisse / Une baisse || Baisser → la baisse, a noun formed without a suffix. || @tags fr.vocabulary
      fill: On lance une campagne de vaccination. → ___ d'une campagne de vaccination. || Lancement / Le lancement || Lancer → le lancement (-ment, masculine). || @tags fr.vocabulary
      fill: On ferme les urgences la nuit. → ___ des urgences la nuit. || Fermeture / La fermeture || Fermer → la fermeture (-ure, feminine). || @tags fr.vocabulary
      mc: Which headline is correct? || Découvert d'un nouveau traitement | *Découverte d'un nouveau traitement | Découvrement d'un nouveau traitement || The noun from découvrir is la découverte. Découvert is the masculine participle (or an overdraft). || @tags fr.vocabulary
      mc: The noun formed from "efficace" is… || l'efficacement | *l'efficacité | l'efficaceur || Adjective → noun in -ité: efficace → l'efficacité. Efficacement is an adverb. || @tags fr.vocabulary
      mc: Why can the villagers in the Creuse see a doctor again? || *Two salaried doctors were recruited | A new hospital was built | Pharmacists can now give consultations || "Grâce au recrutement de deux médecins salariés." || @ctx reading @tags fr.reading
      tf: The new molecule has already been tested on humans. || false || The first results were "obtenus sur des souris" — in mice. || @ctx reading
      short: Which medicines are mentioned as being in short supply? || kw: antibiotique/antibiotiques/antibiotic/antibiotics || "Notamment d'antibiotiques pour enfants." || @ctx reading
      listen: Baisse du nombre de fumeurs, mais hausse inquiétante de la consommation de sucre chez les adolescents. || What is worrying, according to this headline? || *The rise in teenagers' sugar consumption | The fall in the number of smokers | The rise in smoking among teenagers || "Hausse inquiétante de la consommation de sucre chez les adolescents." || @tags fr.listening,fr.vocabulary
      rw: Turn the sentence into a headline :: Les médecins généralistes partent massivement à la retraite. || Départ massif des médecins généralistes à la retraite. | Départs massifs des médecins généralistes à la retraite. | Départ massif à la retraite des médecins généralistes. | Départs massifs à la retraite des médecins généralistes. || Partir → le départ; the adverb massivement becomes the adjective massif; the subject becomes a complement with de. || @tags fr.vocabulary
      tr: Opening of a new health centre in the town centre || Ouverture d'un nouveau centre de santé dans le centre-ville | Ouverture d'un nouveau centre de santé en centre-ville | Ouverture d'un nouveau centre de santé au centre-ville || Ouvrir → l'ouverture; no article at the start of a headline. || @tags fr.vocabulary
      dict: La mise au point d'un traitement pourrait prendre une dizaine d'années. || la mise au point
      say: Hausse des cas de grippe : le pic de l'épidémie serait attendu fin janvier. || Rise in flu cases: the peak of the epidemic is reportedly expected at the end of January.
