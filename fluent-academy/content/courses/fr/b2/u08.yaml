unit: 8
title: Et demain ?
theme: Looking ahead
description: Speculate about the future, look back on regrets and lessons learned, and give a structured oral presentation, using the futur antérieur, si + plus-que-parfait + conditionnel passé and the signposts of public speaking.
free: false
objectives:
  - Use the futur antérieur for completed future actions, after quand and dès que, and for probability
  - Express regrets and imagine a different past with si + plus-que-parfait + conditionnel passé
  - Structure and deliver an oral presentation with clear signposts
canDo:
  - I can speculate about what will have changed in my life and in the world in twenty years.
  - I can talk about a decision I regret, or don't regret, and imagine what would have happened otherwise.
  - I can draw lessons from past experiences.
  - I can give a structured presentation on a debated question and answer questions about it.
review: |
  fill: D'ici la fin de l'année, nous ___ (terminer) les travaux. || aurons terminé || An action completed before a point in the future: futur antérieur, nous aurons terminé. || @tags fr.futur-simple
  fill: Dès que vous ___ (recevoir) le code, vous pourrez vous connecter. || aurez reçu || After dès que, an action completed before the main future action: futur antérieur. || @tags fr.futur-simple
  mc: "Il ne répond pas ? Il ___ son téléphone au bureau." || *aura oublié | aurait oublié | oubliera || The futur antérieur expresses a probability about the past: he must have forgotten. || @tags fr.futur-simple
  fill: Si j'___ (partir) plus tôt, je n'aurais pas raté le train. || étais parti / étais partie || Imaginary past: si + plus-que-parfait; partir takes être. || @tags fr.si-clauses,fr.plus-que-parfait
  mc: "Si elle avait fait des études de médecine, elle ___ médecin aujourd'hui." || aurait été | *serait | sera || Past condition, present result (aujourd'hui): conditionnel présent, elle serait. || @tags fr.si-clauses,fr.conditionnel
  mc: Which sentence is correct? || Si j'aurais su, je serais venue. | *Si j'avais su, je serais venue. | Si j'avais su, je viendrais hier. || Never use the conditional after si; a past result needs the conditionnel passé (je serais venue). || @tags fr.si-clauses
  rw: Express the regret with "si" :: Je ne t'ai pas écouté, alors je me suis perdu. || Si je t'avais écouté, je ne me serais pas perdu. | Si je t'avais écoutée, je ne me serais pas perdu. | Si je t'avais écouté, je ne me serais pas perdue. | Si je t'avais écoutée, je ne me serais pas perdue. || Si + plus-que-parfait (je t'avais écouté), conditionnel passé (je ne me serais pas perdu). || @tags fr.si-clauses,fr.conditionnel-passe
  tr: Without your help, I would never have finished. || Sans ton aide, je n'aurais jamais fini. | Sans votre aide, je n'aurais jamais fini. | Sans ton aide, je n'aurais jamais terminé. | Sans votre aide, je n'aurais jamais terminé. || Sans + noun followed by the conditionnel passé imagines a different past. || @tags fr.conditionnel-passe
