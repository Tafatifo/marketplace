# Placement check: 7 items per level. A level is passed with 5/7 or more.
# English is monolingual: every item is in English.
A1: |
  mc: Tom ___ to work by bus every day. || *goes | go | is go || With he/she/it, the present simple adds -s: Tom goes. "Is go" is not a correct form. || @skill grammar
  mc: Is there ___ milk in the fridge? || *any | many | an || Milk is uncountable, and questions normally use any. Many is for countable nouns, and an goes with one countable thing. || @skill grammar
  mc: Look! It ___ outside. Take an umbrella. || *is raining | rains | rain || For something happening right now, use the present continuous: it is raining. || @skill grammar
  mc: "___ you swim?" — "Yes, I can." || *Can | Do | Are || The short answer "Yes, I can" goes with a question that starts with can. || @skill grammar
  mc: ___ apples do you need for the cake? || *How many | How much | How || Apples are countable, so we ask how many. How much is for uncountable nouns (how much sugar). || @skill grammar
  fill: There ___ two supermarkets on my street. || are || Use there are with a plural noun (two supermarkets) and there is with a singular noun. || @hint be
  listen: I'm going to visit my grandmother on Saturday. She lives in Chicago. || What is the speaker's plan? || *To visit their grandmother on Saturday | To move to Chicago on Saturday | To call their grandmother today || "I'm going to visit my grandmother on Saturday." Going to + verb talks about plans.
A2: |
  fill: Last summer we ___ to Mexico for two weeks. || went || Go is irregular: the past simple is went. || @hint go
  mc: At eight o'clock last night I ___ dinner, so I didn't answer the phone. || *was cooking | am cooking | have cooked || An action in progress at a moment in the past uses the past continuous: I was cooking. "Last night" rules out the present and the present perfect. || @skill grammar
  mc: Have you ever ___ sushi? || *eaten | ate | eat || The present perfect is have + past participle: Have you ever eaten…? || @skill grammar
  mc: I've lived in this town ___ 2015. || *since | for | ago || Since + a point in time (since 2015); for + a period of time (for ten years). Ago goes with the past simple. || @skill grammar
  mc: My new phone is ___ than my old one. || *cheaper | more cheap | cheapest || Short adjectives form the comparative with -er + than: cheaper than. Cheapest is the superlative. || @skill grammar
  mc: "Is that your brother?" — "Yes. Do you want to meet ___?" || *him | he | his || After a verb, use an object pronoun: meet him. || @skill grammar
  listen: If it rains tomorrow, we'll stay at home and watch a movie. || What will they do if it rains? || *Stay at home and watch a movie | Go to the movies | Go for a walk anyway || "If it rains, we'll stay at home and watch a movie." First conditional: if + present, will + verb.
B1: |
  mc: When I was a child, I ___ climb trees in the park every weekend. || *used to | use to | was used to || Used to + verb describes past habits. "Was used to" means "was accustomed to" and is followed by -ing. || @skill grammar
  mc: When we got to the station, the train ___, so we took a taxi. || *had already left | has already left | is already leaving || The past perfect (had + past participle) shows that one past action happened before another. || @skill grammar
  mc: How long ___ English? || *have you been learning | are you learning | do you learn || For an activity that started in the past and continues now, use the present perfect continuous with how long. || @skill grammar
  mc: I'm thinking about ___ my job. || *changing | to change | change || After a preposition (about), use the -ing form of the verb. || @skill grammar
  mc: This bridge ___ in 1932. || *was built | built | was build || The past simple passive is was/were + past participle: was built. The bridge did not build anything itself. || @skill grammar
  fill: If I ___ more free time, I would learn to play the piano. || had || Second conditional for an imaginary situation: if + past simple (had), would + verb. || @hint have
  listen: My sister told me that she was moving to Denver because she had found a new job. || Why is the speaker's sister moving to Denver? || *She has found a new job | She wants to live near her family | She has lost her job || "She had found a new job." In reported speech, the tenses move back (have found → had found).
B2: |
  mc: The streets are wet. It ___ rained during the night. || *must have | can't have | must || Must have + past participle is a logical deduction about the past. "Can't have" contradicts the evidence, and "must rained" is not a correct form. || @skill grammar
  mc: If she had left home earlier, she ___ the train. || *wouldn't have missed | wouldn't miss | didn't miss || Third conditional for an unreal past: if + past perfect, would have + past participle. || @skill grammar
  mc: ___ the heavy rain, the game went ahead as planned. || *Despite | Although | Because of || Despite is followed by a noun phrase. Although needs a full clause (although it rained), and because of gives the wrong meaning. || @skill grammar
  mc: Not only ___ late, but he also forgot the tickets. || *did he arrive | he arrived | arrived he || After a negative expression at the start of a sentence (not only), use question word order: did he arrive. || @skill grammar
  mc: My manager ___ me to apply for the job. || *encouraged | suggested | said || Encourage + person + to-infinitive. Suggest and say cannot be followed by "me to…" (she suggested that I apply). || @skill grammar
  fill: By this time next year, I ___ my degree. || will have finished || The future perfect (will have + past participle) describes something that will be complete before a point in the future. || @hint finish
  listen: I really regret turning down that job in San Diego. If I had accepted it, I'd be living by the beach now. || What does the speaker say? || *They turned down a job and now regret it | They moved to San Diego for a new job | They are about to accept a job in San Diego || "I regret turning down that job… If I had accepted it, I'd be living by the beach now." A mixed conditional: a past choice with a present result.
