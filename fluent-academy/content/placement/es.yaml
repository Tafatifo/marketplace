# Placement check: 7 items per level. A level is passed with 5/7 or more.
A1: |
  mc: Yo ___ de Valencia. || *soy | estoy | tengo || Origin is expressed with ser: soy de… || @skill grammar
  mc: Mi hermana ___ veinte años. || *tiene | es | está || Spanish uses tener for age: tiene veinte años. || @skill grammar
  mc: Perdone, ¿dónde ___ el museo? || *está | hay | tiene || To ask where a specific place is, use estar. Hay introduces something not mentioned before (¿Hay un museo por aquí?). || @skill grammar
  mc: A mí me ___ mucho las películas de miedo. || *gustan | gusta | gusto || With gustar, the verb agrees with the thing you like: las películas → gustan. || @skill grammar
  mc: Which question uses the formal "you" (usted)? || *¿Cómo se llama usted? | ¿Cómo te llamas? | ¿Cómo llamas? || With usted, the verb is in the third person: ¿Cómo se llama usted? ¿Cómo te llamas? is informal (tú), and ¿Cómo llamas? is missing the reflexive pronoun. || @skill vocabulary
  fill: Los domingos me ___ a las diez. || levanto || Levantarse in the yo form is me levanto. || @hint levantarse
  listen: Mañana voy a ir a la playa con mis amigos. || What is the speaker going to do tomorrow? || *Go to the beach with friends | Go to the mountains with friends | Stay at home with family || "Voy a ir a la playa con mis amigos." Ir a + infinitive talks about plans.
A2: |
  fill: Ayer ___ con mi madre por teléfono. || hablé || Regular -ar verbs in the pretérito indefinido: yo hablé (with an accent on the é). || @hint hablar (yo)
  mc: El verano pasado ___ a Portugal. || *fuimos | vamos | iremos || A finished period in the past (el verano pasado) takes the pretérito indefinido: fuimos, from ir. || @skill grammar
  mc: Cuando era pequeño, ___ al fútbol todos los días. || *jugaba | jugué | juego || Habits in the past use the pretérito imperfecto: jugaba. || @skill grammar
  mc: Me ___ la cabeza. || *duele | duelen | dolor || Doler works like gustar: the verb agrees with the body part (la cabeza → duele). || @skill grammar
  mc: "¿Has visto a Marta?" — "Sí, ___ vi ayer." || *la | le | lo || Marta is a feminine direct object, so the pronoun is la: la vi. || @skill grammar
  mc: Madrid es ___ grande que Sevilla. || *más | tan | muy || Comparisons of inequality use más… que. Tan is used with como (tan grande como). || @skill grammar
  listen: Si mañana hace buen tiempo, iremos a la sierra a caminar. || What will they do if the weather is good tomorrow? || *Go walking in the mountains | Go to the beach | Stay at home || "Iremos a la sierra a caminar." La sierra means the mountains; si + present is followed by the future.
B1: |
  mc: Espero que ___ un buen viaje. || *tengas | tienes | tendrás || Esperar que (expressing a wish) is followed by the present subjunctive: que tengas. || @skill grammar
  mc: Si tuviera más tiempo, ___ a tocar la guitarra. || *aprendería | aprendo | aprenderé || Si + imperfect subjunctive (tuviera) is followed by the conditional: aprendería. || @skill grammar
  mc: "¿Le has dado el libro a Pablo?" — "Sí, ya ___ he dado." || *se lo | le lo | lo le || When le and lo come together, le becomes se and goes first: se lo he dado. || @skill grammar
  mc: En España ___ cena bastante tarde. || *se | le | lo || Impersonal se + a third-person verb means "people in general": se cena tarde. || @skill grammar
  mc: Me encanta ___ has cocinado. || *lo que | que | cual || Lo que means "what / the thing that" when there is no noun before it. || @skill grammar
  fill: Cuando llegamos a la estación, el tren ya se ___ ido. || había || The pluperfect (había + participle) describes an action that happened before another past action. || @hint haber
  listen: Te recomiendo que reserves mesa con antelación, porque los fines de semana el restaurante siempre está lleno. || Why does the speaker recommend booking in advance? || *The restaurant is always full at weekends | The restaurant closes early at weekends | It is cheaper to book in advance || "Los fines de semana el restaurante siempre está lleno." Recomendar que is followed by the subjunctive (reserves).
B2: |
  mc: Si me lo hubieras dicho antes, te ___. || *habría ayudado | ayudaré | había ayudado || Si + pluperfect subjunctive is followed by the conditional perfect: te habría ayudado (te hubiera ayudado is also correct). || @skill grammar
  mc: Es posible que Ana ya ___ llegado a casa. || *haya | ha | había || Es posible que requires the subjunctive; for a completed action, use the perfect subjunctive: haya llegado. || @skill grammar
  mc: El puente ___ en 1910 por un ingeniero vasco. || *fue construido | fue construida | ha construido || The passive is ser + participle, and the participle agrees with the subject: el puente → construido. || @skill grammar
  mc: La escritora, ___ novela ganó el premio, dará una charla mañana. || *cuya | cuyo | la cual || Cuyo/cuya agrees with the noun that follows it (novela → cuya), not with the owner. || @skill grammar
  mc: Llovió toda la noche; ___, varias carreteras estaban cortadas por la mañana. || *por consiguiente | sin embargo | a pesar de || Por consiguiente introduces a consequence. Sin embargo expresses contrast, and a pesar de must be followed by a noun or an infinitive. || @skill grammar
  fill: Para junio ya ___ la carrera. || habré terminado || The future perfect (habré + participle) describes something that will be finished by a point in the future. || @hint terminar (yo)
  listen: Me comentó que no había podido venir porque su hija se había puesto enferma. || Why couldn't the person come? || *Their daughter had fallen ill | They had fallen ill themselves | They had forgotten about it || "Su hija se había puesto enferma." Reported speech about the past uses the pluperfect.
