- slug: fire-dage-paa-moen
  kind: reading
  title: Fire dage på Møn
  topic: Holidays and travel
  summary: A short holiday on the island of Møn — white cliffs, fossils, a rainy day, lost car keys and a sky full of stars.
  free: false
  text: |
    Sidste sommer holdt vi fire dages ferie på Møn. Vi var fire: min kæreste Jonas, hans to børn og mig. Vi kørte fra København om fredagen, og efter halvanden time var vi fremme ved campingpladsen. Vi havde lejet en lille hytte tæt på skoven.

    Den første dag gik vi til Møns Klint. Klinten er hvid og op til 128 meter høj, og udsigten over havet var fantastisk. Vi gik ned ad de mange trapper til stranden, og børnene ledte efter fossiler. Freja fandt en lille forstening, og hun var meget stolt.

    Om lørdagen regnede det hele dagen. Vi blev i hytten, spillede kort og lavede pandekager. Det var faktisk ret hyggeligt.

    Om søndagen cyklede vi til Stege, den lille hovedby på øen. Vi spiste is på havnen og så den gamle byport.

    Men så gik det galt. Da vi kom tilbage til hytten, kunne Jonas ikke finde bilnøglerne! Vi ledte overalt. Til sidst ringede vi til campingpladsens kontor. En venlig dame sagde: "Har I mistet nogle nøgler? En familie har lige afleveret nogle her." Jonas tabte dem ved isbutikken, og familien fandt dem på jorden.

    Om aftenen sad vi udenfor og så stjernerne. Møn er et af de bedste steder i Danmark at se stjerner, fordi der er meget mørkt om natten. Det var en ferie, vi aldrig glemmer.
  translation: |
    Last summer we had a four-day holiday on Møn. There were four of us: my partner Jonas, his two children and me. We drove from Copenhagen on Friday, and after an hour and a half we arrived at the campsite. We had rented a small cabin near the woods.

    On the first day we walked to Møns Klint. The cliff is white and up to 128 metres high, and the view over the sea was fantastic. We walked down the many steps to the beach, and the children looked for fossils. Freja found a small fossil, and she was very proud.

    On Saturday it rained all day. We stayed in the cabin, played cards and made pancakes. It was actually quite cosy.

    On Sunday we cycled to Stege, the little main town on the island. We ate ice cream at the harbour and saw the old town gate.

    But then things went wrong. When we got back to the cabin, Jonas couldn't find the car keys! We looked everywhere. In the end we called the campsite office. A friendly lady said: "Have you lost some keys? A family has just handed some in here." Jonas had dropped them by the ice-cream shop, and the family had found them on the ground.

    In the evening we sat outside and looked at the stars. Møn is one of the best places in Denmark to see stars, because it's very dark at night. It was a holiday we'll never forget.
  glossary: |
    være fremme | to arrive (at your destination)
    en hytte | a cabin
    Møns Klint | the white chalk cliffs on Møn
    lede efter | to look for | past: ledte
    en forstening | a fossil
    stolt | proud
    det gik galt | things went wrong | gå galt = go wrong
    aflevere | to hand in
    tabe | to drop; to lose | past: tabte
  questions: |
    mc: How did they get to Møn? || *By car | By train | By ferry || "Vi kørte fra København om fredagen."
    tf: It rained on Saturday. || true || "Om lørdagen regnede det hele dagen."
    short: What did Freja find on the beach? || kw: fossil/forstening/fossil || "Freja fandt en lille forstening" — a small fossil.
    fill: Om søndagen cyklede de til ___. || Stege || "Om søndagen cyklede vi til Stege."
    mc: Where were the car keys in the end? || In the cabin | *At the campsite office | In the car || A family handed them in at the campsite office.
    mc: Why is Møn a good place to see stars? || It's very high | *It's very dark at night | It's close to Copenhagen || "Fordi der er meget mørkt om natten."

- slug: naar-du-bliver-syg
  kind: reading
  title: Når du bliver syg i Danmark
  topic: Health and the body
  summary: A short guide for newcomers — your GP, the health card, the out-of-hours service, the pharmacy and calling in sick.
  free: false
  text: |
    Alle, der bor i Danmark, har en egen læge. Du kan se navnet på din læge på dit gule sundhedskort. Det er gratis at gå til lægen.

    Hvis du bliver syg, skal du ringe til lægehuset. Mange lægehuse har telefontid om morgenen, for eksempel fra klokken otte til ni. Du kan også tit bestille en tid på nettet. Hvis det ikke haster, får du måske en tid om et par dage.

    Om aftenen, om natten og i weekenden er lægehuset lukket. Så skal du ringe til lægevagten. I Region Hovedstaden ringer du til 1813. Ring altid 112, hvis der er sket en ulykke, eller hvis nogen er meget syg.

    Medicin køber du på apoteket. Hvis du får en recept, kommer den elektronisk til apoteket, og du viser bare dit sundhedskort. Du betaler selv en del af prisen. Smertestillende tabletter og medicin mod forkølelse kan du købe uden recept — i håndkøb.

    Er du syg, og kan du ikke gå på arbejde? Så skal du ringe til din chef tidligt om morgenen på den første sygedag. Ved kort sygdom behøver du som regel ikke en lægeerklæring.

    Gode råd, når du er forkølet: Bliv hjemme, drik meget vand og te, og sov så meget som muligt. Gå til lægen, hvis du har høj feber i mere end tre dage, eller hvis du har det meget dårligt.
  translation: |
    Everyone who lives in Denmark has their own GP. You can see the name of your doctor on your yellow health card. It's free to see the doctor.

    If you fall ill, you should phone the surgery. Many surgeries have phone hours in the morning, for example from eight to nine. You can often book an appointment online too. If it isn't urgent, you might get an appointment in a couple of days.

    In the evening, at night and at weekends the surgery is closed. Then you call the out-of-hours service. In the Capital Region you call 1813. Always call 112 if there has been an accident, or if someone is very ill.

    You buy medicine at the pharmacy. If you get a prescription, it goes electronically to the pharmacy, and you just show your health card. You pay part of the price yourself. Painkillers and medicine for colds can be bought without a prescription — over the counter.

    Are you ill, and can't you go to work? Then you must call your manager early in the morning on the first day of illness. For a short illness you usually don't need a doctor's note.

    Good advice when you have a cold: stay at home, drink lots of water and tea, and sleep as much as possible. See a doctor if you have a high temperature for more than three days, or if you feel very ill.
  glossary: |
    egen læge | your own GP | everyone has one
    et sundhedskort | a health card | the yellow card with your CPR number
    telefontid | phone hours
    det haster | it's urgent
    lægevagten | the out-of-hours doctor service
    en ulykke | an accident
    en recept | a prescription
    i håndkøb | over the counter | without a prescription
    en lægeerklæring | a doctor's note
  questions: |
    tf: It costs money to see your GP. || false || "Det er gratis at gå til lægen."
    mc: When do many surgeries have phone hours? || *In the morning | At lunchtime | In the evening || "Mange lægehuse har telefontid om morgenen."
    short: Which number do you call if there has been an accident? || kw: 112 || "Ring altid 112, hvis der er sket en ulykke."
    mc: What do you show at the pharmacy? || A paper prescription | *Your health card | Your passport || "Du viser bare dit sundhedskort."
    fill: Når du er forkølet, skal du drikke meget vand og ___. || te || "Drik meget vand og te."
    tf: For a short illness you usually need a doctor's note for your manager. || false || "Ved kort sygdom behøver du som regel ikke en lægeerklæring."

- slug: mit-studiejob
  kind: reading
  title: Mit studiejob
  topic: Work and studies
  summary: Marwa, a nursing student in Odense, describes her studies, her part-time job in a supermarket and her plans.
  free: false
  text: |
    Jeg hedder Marwa, og jeg er 23 år. Jeg læser til sygeplejerske i Odense, og jeg er på tredje semester. Jeg har boet i Odense i to år, men jeg er vokset op i Vejle.

    Uddannelsen er spændende, men den er også hård. Vi har forelæsninger om formiddagen, og om eftermiddagen arbejder vi tit i grupper. Hvert semester skal vi i praktik på et hospital eller i hjemmeplejen. Lige nu er jeg i praktik på et stort hospital.

    Ved siden af studiet har jeg et studiejob i et supermarked. Jeg arbejder tolv timer om ugen, mest om aftenen og i weekenden. Jeg har valgt det job, fordi jeg har brug for pengene. SU'en hjælper, men huslejen i Odense er ikke billig. Jeg kan også godt lide jobbet, fordi mine kolleger er søde, og fordi jeg aldrig keder mig.

    Det kan være svært at få tid til det hele. Når vi har eksamen, arbejder jeg ikke så meget. Min chef siger, at det er helt i orden, fordi studiet er vigtigst.

    Mine forældre synes, at jeg arbejder for meget. Men jeg tror, at jeg lærer meget af jobbet — for eksempel at tale med mange forskellige mennesker. Det bliver nyttigt, når jeg bliver sygeplejerske. Om halvandet år er jeg færdig, og jeg håber, at jeg kan få et job på en børneafdeling.
  translation: |
    My name is Marwa, and I'm 23. I'm studying to be a nurse in Odense, and I'm in my third semester. I've lived in Odense for two years, but I grew up in Vejle.

    The programme is exciting, but it's also hard. We have lectures in the morning, and in the afternoon we often work in groups. Every semester we have a work placement at a hospital or in home care. Right now I'm on a placement at a big hospital.

    Alongside my studies I have a part-time job in a supermarket. I work twelve hours a week, mostly in the evenings and at weekends. I chose that job because I need the money. The study grant helps, but the rent in Odense isn't cheap. I also like the job because my colleagues are nice and because I'm never bored.

    It can be hard to find time for everything. When we have exams, I don't work so much. My manager says that's absolutely fine, because my studies are the most important thing.

    My parents think I work too much. But I think I learn a lot from the job — for example, how to talk to lots of different people. That will be useful when I become a nurse. In a year and a half I'll be finished, and I hope I can get a job on a children's ward.
  glossary: |
