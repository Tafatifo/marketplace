- slug: sankthans-ved-fjorden
  kind: reading
  title: Sankthans ved fjorden
  topic: Celebrations and traditions
  summary: A newcomer describes their first Midsummer Eve in Denmark — a picnic by the fjord, a bonfire with a witch and the midsummer song.
  free: false
  text: |
    Sidste år fejrede jeg sankthans for første gang. Min kollega Birthe inviterede mig til en fest ved fjorden i Vejle. Jeg vidste ikke rigtig, hvad jeg skulle forvente.

    Vi mødtes på en lille strand klokken otte om aftenen. Der var mange mennesker: familier med børn, ældre par og unge med guitarer. Alle havde tæpper og madkurve med, og vi satte os i græsset og spiste sammen. Det var stadig lyst, fordi solen går sent ned i juni.

    Klokken ti tændte en mand det store bål. Øverst på bålet sad en heks lavet af gammelt tøj og halm. Birthe forklarede, at man sender heksen til Bloksbjerg i Tyskland. Det er en meget gammel tradition.

    Så begyndte alle at synge midsommervisen. Jeg kunne ikke teksten, men Birthe gav mig et sanghæfte, og jeg sang med på omkvædet.

    Jeg syntes, det var rigtig smukt. Flammerne, sangen og det lyse aftenlys over vandet — det glemmer jeg aldrig. Børnene legede ved vandet, og de voksne snakkede og hyggede sig til midnat.

    Til sidst sagde Birthe: "Nu er du næsten dansker!" Jeg glæder mig allerede til næste sankthansaften. Måske tager jeg min egen guitar med.
  translation: |
    Last year I celebrated Midsummer for the first time. My colleague Birthe invited me to a party by the fjord in Vejle. I didn't really know what to expect.

    We met on a small beach at eight in the evening. There were lots of people: families with children, older couples and young people with guitars. Everyone had brought blankets and picnic baskets, and we sat down on the grass and ate together. It was still light, because the sun sets late in June.

    At ten o'clock a man lit the big bonfire. At the top of the bonfire sat a witch made of old clothes and straw. Birthe explained that you send the witch to Bloksbjerg in Germany. It's a very old tradition.

    Then everyone started singing the midsummer song. I didn't know the words, but Birthe gave me a songbook, and I sang along with the chorus.

    I thought it was really beautiful. The flames, the song and the bright evening light over the water — I'll never forget it. The children played by the water, and the adults chatted and had a lovely time until midnight.

    In the end Birthe said: "Now you're almost a Dane!" I'm already looking forward to next Midsummer Eve. Maybe I'll bring my own guitar.
  glossary: |
    sankthans | Midsummer | sankthansaften is 23 June
    forvente | to expect
    en madkurv | a picnic basket
    sætte sig | to sit down | reflexive: vi satte os
    et bål | a bonfire
    en heks | a witch
    halm | straw
    et sanghæfte | a songbook
    et omkvæd | a chorus; a refrain
    hygge sig | to have a nice, cosy time | reflexive
  questions: |
