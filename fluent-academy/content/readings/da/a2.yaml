- slug: i-pakkeshoppen
  kind: listening
  title: I pakkeshoppen
  topic: Services and errands
  summary: Elif collects a parcel at a parcel shop and sends another one to her brother in Hamburg.
  free: true
  speakers: R=Rune/m; E=Elif/f
  text: |
    R: Hej, næste! Hvad kan jeg hjælpe med?
    E: Hej. Jeg skal hente en pakke. Jeg har fået en sms.
    R: Fint. Må jeg se koden og noget ID?
    E: Ja. Koden er syv, tre, fem, et. Og her er mit kørekort.
    R: Tak. Et øjeblik… Her er den. Den er ret tung!
    E: Ja, det er bøger fra min mor. Tak.
    R: Var der andet?
    E: Ja, jeg vil også gerne sende den her pakke til Tyskland.
    R: Okay. Lad mig lige veje den. Den vejer to kilo.
    R: Skal vi levere den til en adresse eller til en pakkeshop?
    E: Til en adresse. Min bror bor i Hamborg.
    E: Hvad koster det, og hvornår kommer den frem?
    R: Det koster 210 kroner, og den er fremme om tre til fem dage.
    E: Det er fint. Kan jeg betale med kort?
    R: Ja, selvfølgelig. Vil du have en kvittering?
    E: Ja tak. Så kan jeg følge pakken på nettet.
    R: Nummeret står her på kvitteringen. Hav en god dag!
    E: Tak, i lige måde!
  translation: |
    Rune: Hi, next please! What can I help you with?
    Elif: Hi. I need to collect a parcel. I've had a text.
    Rune: Fine. May I see the code and some ID?
    Elif: Yes. The code is seven, three, five, one. And here's my driving licence.
    Rune: Thanks. Just a moment… Here it is. It's quite heavy!
    Elif: Yes, it's books from my mum. Thanks.
    Rune: Anything else?
    Elif: Yes, I'd also like to send this parcel to Germany.
    Rune: Okay. Let me just weigh it. It weighs two kilos.
    Rune: Shall we deliver it to an address or to a parcel shop?
    Elif: To an address. My brother lives in Hamburg.
    Elif: How much does it cost, and when will it arrive?
    Rune: It costs 210 kroner, and it'll be there in three to five days.
    Elif: That's fine. Can I pay by card?
    Rune: Yes, of course. Would you like a receipt?
    Elif: Yes, please. Then I can track the parcel online.
    Rune: The number is here on the receipt. Have a nice day!
    Elif: Thanks, you too!
  glossary: |
    næste! | next, please!
    hente | to collect
    en kode | a code
    tung | heavy
    veje | to weigh
    levere | to deliver
    være fremme | to arrive
