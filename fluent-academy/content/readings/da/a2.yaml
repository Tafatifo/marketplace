- slug: mit-liv-i-tre-byer
  kind: reading
  title: Mit liv i tre byer
  topic: Life stories
  summary: Rosa, who grew up in Porto, tells the story of her life so far — her studies, her move to Aarhus and her new life in Svendborg.
  free: true
  text: |
    Jeg hedder Rosa Mendes, og jeg er født i 1991 i Porto i Portugal. Jeg voksede op i en lejlighed tæt på floden sammen med mine forældre og min lillebror. Som barn plejede jeg at spille fodbold på gaden hver eftermiddag, og om søndagen spiste vi altid frokost hos min bedstemor.

    I 2010 begyndte jeg at studere biologi på universitetet i Porto. Det var fem gode år. Bagefter fik jeg et job i et laboratorium, men lønnen var lav, og jeg drømte om at prøve noget nyt.

    For ti år siden flyttede jeg til Aarhus. Først arbejdede jeg på en café, og om aftenen lærte jeg dansk på en sprogskole. Det var hårdt! Danskerne talte hurtigt, og jeg forstod næsten ingenting. Men jeg mødte mange søde mennesker, og efter et år fik jeg et job på universitetet.

    I Aarhus mødte jeg også min mand, Anders. Han er lærer. I 2019 fik vi en datter, og to år senere flyttede vi til Svendborg, fordi Anders fik et nyt job her.

    Nu bor vi i et gammelt rækkehus med en lille have. Jeg arbejder for kommunen med natur og miljø. Jeg savner tit solen og maden i Porto, men jeg elsker havet og de små øer her. Om sommeren sejler vi tit til Tåsinge eller Ærø.
  translation: |
    My name is Rosa Mendes, and I was born in 1991 in Porto in Portugal. I grew up in a flat near the river with my parents and my little brother. As a child I used to play football in the street every afternoon, and on Sundays we always had lunch at my grandmother's.

    In 2010 I started studying biology at the university in Porto. Those were five good years. Afterwards I got a job in a laboratory, but the pay was low, and I dreamed of trying something new.

    Ten years ago I moved to Aarhus. At first I worked in a café, and in the evenings I learned Danish at a language school. It was hard! The Danes spoke fast, and I understood almost nothing. But I met a lot of kind people, and after a year I got a job at the university.

    In Aarhus I also met my husband, Anders. He's a teacher. In 2019 we had a daughter, and two years later we moved to Svendborg because Anders got a new job here.

    Now we live in an old terraced house with a small garden. I work for the local council on nature and the environment. I often miss the sun and the food in Porto, but I love the sea and the small islands here. In summer we often sail to Tåsinge or Ærø.
  glossary: |
