- slug: nyt-fra-gaarden
  kind: reading
  title: Nyt fra gården
  topic: Home and housing
  summary: The residents' newsletter for an apartment block — a summer party, a bigger bike room, new washing machines, waste sorting and new neighbours.
  free: false
  text: |
    Kære beboere i Ewaldsgade 4–8

    Sommeren er her, og der sker mange ting i vores gård. Her er de vigtigste nyheder.

    Sommerfest: Lørdag den 21. juni holder vi sommerfest i gården fra klokken 15. Der er grill, musik og en hoppeborg til børnene. Tag gerne en salat eller en kage med. Vi håber, at mange får lyst til at komme. Det er den bedste måde at møde naboerne på.

    Ny cykelkælder: Den gamle cykelkælder var alt for lille. Nu har vi fået en ny og større cykelkælder under nummer 6. Der er plads til 80 cykler, og lyset er meget bedre. Husk at fjerne gamle cykler fra gården inden den 1. juli. Vi fjerner cykler uden navn efter den dato.

    Vaskeriet: Mange har spurgt efter flere tider i vaskeriet. Fra august har vi to nye vaskemaskiner, så det bliver lettere at få en tid. Husk at booke på listen, og tøm maskinen, når du er færdig.

    Affald: Vi sorterer nu affald i ti forskellige spande. De nye containere står ved porten. Husk at folde papkasser, så der er plads til mere.

    Velkommen: Vi siger velkommen til tre nye familier i opgang 4 og 8. Vi glæder os til at lære jer at kende!

    Har du spørgsmål eller gode idéer? Skriv til bestyrelsen, eller kom til næste beboermøde tirsdag den 9. september klokken 19 i fælleshuset.

    Mange hilsner
    Bestyrelsen
  translation: |
    Dear residents of Ewaldsgade 4–8

    Summer is here, and a lot is happening in our courtyard. Here is the most important news.

    Summer party: On Saturday 21 June we're having a summer party in the courtyard from 3 p.m. There will be a barbecue, music and a bouncy castle for the children. Please bring a salad or a cake. We hope lots of you will feel like coming. It's the best way to meet the neighbours.

    New bike room: The old bike room was far too small. Now we have a new, bigger bike room under number 6. There's room for 80 bikes, and the lighting is much better. Remember to remove old bikes from the courtyard before 1 July. We'll remove bikes without a name after that date.

    The laundry room: Many of you have asked for more slots in the laundry room. From August we'll have two new washing machines, so it will be easier to get a time. Remember to book on the list, and empty the machine when you've finished.

    Rubbish: We now sort our rubbish into ten different bins. The new containers are by the gate. Remember to fold cardboard boxes so there's room for more.

    Welcome: We'd like to welcome three new families in stairwells 4 and 8. We look forward to getting to know you!

    Do you have questions or good ideas? Write to the board, or come to the next residents' meeting on Tuesday 9 September at 7 p.m. in the common house.

    Best wishes
    The board
  glossary: |
