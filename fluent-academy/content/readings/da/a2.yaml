- slug: en-tid-hos-laegen
  kind: listening
  title: En tid hos lægen
  topic: Health and the body
  summary: Pavel calls his doctor's surgery after falling off his bike and gets an appointment the same day.
  free: false
  speakers: H=Henriette/f; P=Pavel/m
  text: |
    H: Lægehuset Østergade, det er Henriette.
    P: Godmorgen. Det er Pavel Novak. Jeg vil gerne bestille en tid.
    H: Ja. Hvad drejer det sig om?
    P: Jeg er faldet på cyklen, og nu har jeg ondt i håndleddet.
    H: Hvornår skete det?
    P: I søndags. Det var glat på vejen.
    H: Er det blevet værre siden?
    P: Ja, desværre. Det er meget hævet, og jeg kan ikke bruge hånden ordentligt.
    H: Kan du bevæge fingrene?
    P: Ja, men det gør ondt.
    H: Okay. Lægen har en ledig tid i dag klokken kvart over elleve. Kan du komme der?
    P: Ja, det passer fint. Jeg tager en taxa.
    H: Godt. Husk dit sundhedskort. Og læg is på håndleddet, indtil du kommer.
    P: Det gør jeg. Skal jeg tage noget mod smerterne?
    H: Du kan tage almindelige smertestillende tabletter. Men spørg lægen, når du er her.
    P: Tusind tak for hjælpen.
    H: Selv tak. Vi ses klokken kvart over elleve.
  translation: |
    Henriette: Østergade Surgery, Henriette speaking.
    Pavel: Good morning. This is Pavel Novak. I'd like to book an appointment.
    Henriette: Yes. What is it about?
    Pavel: I've fallen off my bike, and now my wrist hurts.
    Henriette: When did it happen?
    Pavel: Last Sunday. The road was slippery.
    Henriette: Has it got worse since then?
    Pavel: Yes, unfortunately. It's very swollen, and I can't use my hand properly.
    Henriette: Can you move your fingers?
    Pavel: Yes, but it hurts.
    Henriette: Okay. The doctor has a free appointment today at a quarter past eleven. Can you come then?
    Pavel: Yes, that's fine. I'll take a taxi.
    Henriette: Good. Remember your health card. And put ice on your wrist until you come.
    Pavel: I will. Should I take something for the pain?
    Henriette: You can take ordinary painkillers. But ask the doctor when you're here.
    Pavel: Thank you very much for your help.
    Henriette: You're welcome. See you at a quarter past eleven.
  glossary: |
    håndleddet | the wrist
    glat | slippery
    er det blevet værre? | has it got worse? | perfect with er
    hævet | swollen
    ordentligt | properly
    bevæge | to move
    en ledig tid | a free appointment
    indtil | until
    smertestillende | painkilling
  questions: |
    mc: Why is Pavel calling? || He has a sore throat | *He has hurt his wrist | He needs a new prescription || "Jeg er faldet på cyklen, og nu har jeg ondt i håndleddet."
    tf: The accident happened this morning. || false || It happened "i søndags" — last Sunday.
    short: What time is Pavel's appointment? || kw: 11.15/11:15/kvart over elleve/quarter past eleven || "Klokken kvart over elleve."
    mc: What should he put on his wrist? || A bandage | *Ice | Some cream || "Læg is på håndleddet, indtil du kommer."
    fill: Henriette siger: "Husk dit ___." || sundhedskort || "Husk dit sundhedskort."
    mc: How will Pavel get to the surgery? || By bike | *By taxi | By bus || "Jeg tager en taxa."

- slug: hvor-skal-vi-hen-i-sommerferien
  kind: listening
  title: Hvor skal vi hen i sommerferien?
  topic: Plans and choices
  summary: Julie and Rashid compare three summer-holiday options — Skagen, Bornholm and Berlin — and make a plan with an "if".
  free: false
  speakers: J=Julie/f; R=Rashid/m
  text: |
    J: Rashid, vi skal snart bestille sommerferien. Hvad har du lyst til?
    R: Jeg har fundet tre muligheder: Skagen, Bornholm eller en uge i Berlin.
    J: Hvad er billigst?
    R: Skagen er billigst, fordi vi kan køre derop i vores egen bil.
    J: Og Bornholm?
    R: Bornholm er dyrest. Færgen og sommerhuset koster næsten 9.000 kroner i alt.
    J: Hm. Og Berlin?
    R: Hvis vi flyver, tager det kun en time. Men toget er bedst for miljøet.
    J: Jeg vil helst være ved vandet. Børnene elsker stranden.
    R: Så er Skagen eller Bornholm bedst.
    J: Hvad med vejret? Hvis det regner hele ugen, keder børnene sig.
    R: Det ved man aldrig. Men Bornholm har tit flest solskinstimer.
    J: Okay. Hvis vi kan finde et billigere sommerhus, vælger vi Bornholm.
    R: Fint. Og hvis det er for dyrt, tager vi til Skagen.
    J: Det er en aftale. Skal vi kigge på nettet i aften?
    R: Ja, når børnene sover.
  translation: |
    Julie: Rashid, we need to book the summer holiday soon. What would you like to do?
    Rashid: I've found three options: Skagen, Bornholm or a week in Berlin.
    Julie: Which is cheapest?
    Rashid: Skagen is cheapest, because we can drive up there in our own car.
    Julie: And Bornholm?
    Rashid: Bornholm is most expensive. The ferry and the summer house cost almost 9,000 kroner in total.
    Julie: Hmm. And Berlin?
    Rashid: If we fly, it only takes an hour. But the train is best for the environment.
    Julie: I'd rather be by the water. The children love the beach.
    Rashid: Then Skagen or Bornholm is best.
    Julie: What about the weather? If it rains all week, the children will be bored.
    Rashid: You never know. But Bornholm often has the most hours of sunshine.
    Julie: Okay. If we can find a cheaper summer house, we'll choose Bornholm.
    Rashid: Fine. And if it's too expensive, we'll go to Skagen.
    Julie: It's a deal. Shall we have a look online this evening?
    Rashid: Yes, when the children are asleep.
  glossary: |
    have lyst til | to feel like; to want
    derop | up there
    i alt | in total
    helst | preferably; would rather | the superlative of gerne
    kede sig | to be bored | reflexive
    solskinstimer | hours of sunshine
    et sommerhus | a holiday cottage
    kigge | to look
  questions: |
    mc: Which option is the cheapest? || Bornholm | *Skagen | Berlin || "Skagen er billigst, fordi vi kan køre derop i vores egen bil."
    short: How much do the ferry and the summer house on Bornholm cost? || kw: 9.000/9000/ni tusind/nine thousand || "Næsten 9.000 kroner i alt."
    tf: Julie would rather be by the water. || true || "Jeg vil helst være ved vandet."
    mc: What does Rashid say about the weather on Bornholm? || It's always warm | *It often has the most hours of sunshine | It never rains || "Bornholm har tit flest solskinstimer."
    fill: Hvis sommerhuset på Bornholm er for dyrt, tager de til ___. || Skagen || "Og hvis det er for dyrt, tager vi til Skagen."
    mc: When will they look online? || Tomorrow morning | *This evening, when the children are asleep | At the weekend || "Skal vi kigge på nettet i aften? – Ja, når børnene sover."

- slug: toget-er-aflyst
  kind: listening
  title: Toget er aflyst
  topic: Holidays and travel
  summary: At Fredericia station, Malte's train to Copenhagen is cancelled. A member of staff explains the replacement bus and his rights.
  free: false
  speakers: M=Malte/m; C=Charlotte/f
  text: |
    M: Undskyld, toget til København står som aflyst. Hvad sker der?
    C: Der er desværre problemer med strømmen på strækningen.
    M: Jeg skal være i København klokken fire. Jeg har et vigtigt møde.
    C: Det næste tog kører klokken halv tre, men det er meget fyldt.
    M: Halv tre? Så kommer jeg alt for sent. Er der en anden løsning?
    C: Der kører en togbus til Odense om ti minutter. Derfra kan du tage toget videre.
    M: Hvor lang tid tager det?
    C: Cirka en time og et kvarter ekstra. Måske når du det.
    M: Okay, så tager jeg bussen. Kan jeg bruge min billet?
    C: Ja, din billet gælder også i togbussen.
    M: Og kan jeg få nogle af pengene tilbage?
    C: Ja, hvis du kommer mere end en time for sent, kan du søge om penge tilbage på nettet. Gem din billet.
    M: Tak. Hvor holder bussen?
    C: Foran stationen, ved stoppested C. Skynd dig!
    M: Tusind tak for hjælpen!
  translation: |
    Malte: Excuse me, the train to Copenhagen is shown as cancelled. What's happening?
    Charlotte: Unfortunately there are problems with the power on the line.
    Malte: I have to be in Copenhagen at four. I have an important meeting.
    Charlotte: The next train leaves at half past two, but it's very full.
    Malte: Half past two? Then I'll be far too late. Is there another solution?
    Charlotte: There's a replacement bus to Odense in ten minutes. From there you can take the train onwards.
    Malte: How long does it take?
    Charlotte: About an hour and a quarter extra. Maybe you'll make it.
    Malte: Okay, then I'll take the bus. Can I use my ticket?
    Charlotte: Yes, your ticket is also valid on the replacement bus.
    Malte: And can I get some of my money back?
    Charlotte: Yes, if you arrive more than an hour late, you can apply for money back online. Keep your ticket.
    Malte: Thanks. Where does the bus stop?
    Charlotte: In front of the station, at stop C. Hurry up!
    Malte: Thanks very much for your help!
  glossary: |
    står som aflyst | is shown as cancelled
    strømmen | the power; the electricity
    strækningen | the line; the stretch of track
    fyldt | full; crowded
    en togbus | a replacement bus
    videre | onwards; on
    gælde | to be valid
    søge om | to apply for
    et stoppested | a (bus) stop
  questions: |
    mc: Why is the train cancelled? || There's a storm | *There are power problems on the line | There are too few passengers || "Der er desværre problemer med strømmen på strækningen."
    tf: Malte has to be in Copenhagen at four o'clock. || true || "Jeg skal være i København klokken fire."
    short: Where does the replacement bus go? || kw: Odense || "Der kører en togbus til Odense om ti minutter."
    mc: Can Malte use his ticket on the bus? || *Yes | No, he needs a new ticket | Only if he pays extra || "Din billet gælder også i togbussen."
    fill: Bussen holder ved stoppested ___. || C || "Foran stationen, ved stoppested C."
    mc: When can he apply for money back? || *If he arrives more than an hour late | Only with a receipt from the bus | Never || "Hvis du kommer mere end en time for sent, kan du søge om penge tilbage."
