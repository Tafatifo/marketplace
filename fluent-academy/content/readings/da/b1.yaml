- slug: venner-paa-tvaers
  kind: reading
  title: Venner på tværs af generationer
  topic: People and relationships
  summary: A student of 24 and a widow of 81 met through a volunteer project — and became real friends.
  free: true
  text: |
    Hver torsdag klokken fire ringer Mikkel Holm, 24, på døren hos Else Kristensen, 81, i en lejlighed på Frederiksberg. Han har en pose wienerbrød med, og hun har altid kaffen klar. De har kendt hinanden i to år, og i dag kalder de sig selv for gode venner.

    De mødtes gennem et projekt, som en frivillig forening startede for at mindske ensomhed blandt ældre. Mikkel læste psykologi og ville gerne lave noget frivilligt ved siden af studiet. "Jeg troede, at jeg skulle hjælpe en gammel dame med at handle ind," siger han og griner. "Men Else har hjulpet mig mindst lige så meget."

    Else blev enke for seks år siden. Hendes to børn bor i Jylland, og hun ser dem kun et par gange om året. "Der var dage, hvor jeg ikke talte med et eneste menneske," fortæller hun. "Det var hårdt. Nu glæder jeg mig hele ugen til torsdag."

    De taler om alt mellem himmel og jord: om bøger, om kærlighed og om, hvordan København har forandret sig. Else har lært Mikkel at spille kortspillet whist, og Mikkel har vist hende, hvordan man laver et videoopkald til børnebørnene. Da Mikkel blev uvenner med sin kæreste sidste vinter, var det Else, der gav ham det bedste råd: "Lyt mere, end du taler."

    Ifølge foreningen findes der over 400 venskaber som Elses og Mikkels i hele landet, og flere og flere unge melder sig som frivillige. Mange af dem fortæller, at de selv har savnet kontakt med ældre mennesker, fordi deres egne bedsteforældre bor langt væk.

    Er der da aldrig uenigheder? "Jo da," siger Else. "Han synes, at min kaffe er alt for stærk. Men det er det eneste, vi skændes om."
  translation: |
    Every Thursday at four o'clock, Mikkel Holm, 24, rings the doorbell at Else Kristensen's flat in Frederiksberg. Else is 81. He brings a bag of Danish pastries, and she always has the coffee ready. They have known each other for two years, and today they call themselves good friends.

    They met through a project that a volunteer association started to reduce loneliness among older people. Mikkel was studying psychology and wanted to do some voluntary work alongside his studies. "I thought I was going to help an old lady with her shopping," he says and laughs. "But Else has helped me at least as much."

    Else was widowed six years ago. Her two children live in Jutland, and she only sees them a couple of times a year. "There were days when I didn't speak to a single person," she says. "It was hard. Now I look forward to Thursday all week."

    They talk about everything under the sun: about books, about love and about how Copenhagen has changed. Else has taught Mikkel to play the card game whist, and Mikkel has shown her how to make a video call to her grandchildren. When Mikkel fell out with his girlfriend last winter, it was Else who gave him the best advice: "Listen more than you talk."

    According to the association, there are over 400 friendships like Else and Mikkel's across the country, and more and more young people are signing up as volunteers. Many of them say that they themselves have missed contact with older people, because their own grandparents live far away.

    So do they never disagree? "Oh yes," says Else. "He thinks my coffee is far too strong. But that's the only thing we argue about."
