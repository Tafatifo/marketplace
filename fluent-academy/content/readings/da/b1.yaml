- slug: hygge-mere-end-stearinlys
  kind: reading
  title: Hygge – mere end stearinlys
  topic: Health and lifestyle
  summary: What does hygge really mean to Danes, why does it matter for wellbeing — and why can it be hard for newcomers to be part of it?
  free: false
  text: |
    I de senere år er det danske ord hygge blevet kendt i hele verden. Der er skrevet bøger om det på mange sprog, og i udlandet bruges det til at sælge alt fra tæpper til te. Men hvad betyder det egentlig for danskerne selv?

    "For mig er hygge, når jeg sidder med min familie om søndagen og spiller brætspil," siger Søren, 44, fra Herning. Hans datter, Alma, er uenig: "Hygge er, når jeg ser film med mine veninder, og vi har slik og tæpper." Hendes far griner. "Måske er det det samme," siger han.

    Forskere har prøvet at forklare, hvorfor hygge er så vigtig i Danmark. En del af forklaringen er klimaet. Vinteren er lang og mørk, og derfor bruger danskerne meget tid indendørs. De tænder stearinlys – Danmark er et af de lande i Europa, der bruger flest stearinlys – og de inviterer venner hjem i stedet for at gå ud.

    Men hygge handler mindst lige så meget om mennesker som om ting. Man kan godt hygge sig på en campingplads i regnvejr eller ved et bål i skoven. Det vigtigste er, at man føler sig tryg, og at ingen behøver at præstere noget. Man slapper af, taler stille sammen og lader telefonen ligge.

    Mange psykologer mener, at hygge kan være godt for trivslen. Når man er sammen med andre uden stress og krav, falder skuldrene ned. Men hygge har også en bagside. Nogle tilflyttere fortæller, at det kan være svært at blive inviteret ind i danskernes hygge, fordi den ofte foregår i små, faste grupper.

    Søren kender godt problemet. Da hans nye kollega fra Indien flyttede til Herning, inviterede han hende med til familiens fredagshygge. "Hun havde boet her i et år og var aldrig blevet inviteret hjem til nogen," siger han. "Det var en øjenåbner for mig."

    Kollegaen kommer nu hver anden fredag – og hun tager altid sine egne indiske snacks med.
  translation: |
    In recent years the Danish word hygge has become known all over the world. Books have been written about it in many languages, and abroad it is used to sell everything from blankets to tea. But what does it actually mean to the Danes themselves?

    "For me, hygge is when I sit with my family on Sundays and play board games," says Søren, 44, from Herning. His daughter, Alma, disagrees: "Hygge is when I watch films with my friends and we have sweets and blankets." Her father laughs. "Maybe it's the same thing," he says.

    Researchers have tried to explain why hygge is so important in Denmark. Part of the explanation is the climate. Winter is long and dark, so Danes spend a lot of time indoors. They light candles – Denmark is one of the countries in Europe that uses the most candles – and they invite friends home instead of going out.

    But hygge is at least as much about people as about things. You can have hygge at a campsite in the rain or by a campfire in the woods. The most important thing is that you feel safe and that nobody has to perform. You relax, talk quietly together and leave your phone alone.

    Many psychologists believe that hygge can be good for wellbeing. When you are with others without stress and demands, your shoulders drop. But hygge also has a downside. Some newcomers say that it can be hard to be invited into Danish hygge, because it often takes place in small, closed groups.

    Søren knows the problem well. When his new colleague from India moved to Herning, he invited her to the family's Friday hygge. "She had lived here for a year and had never been invited to anyone's home," he says. "It was an eye-opener for me."

    The colleague now comes every other Friday – and she always brings her own Indian snacks.
  glossary: |
    et stearinlys | a candle
    et brætspil | a board game
    indendørs | indoors
    hygge sig | to have a cosy time; to enjoy oneself | reflexive
    præstere | to perform; to achieve something
    et krav | a demand
    skuldrene falder ned | you relax | literally "the shoulders drop"
    en bagside | a downside | literally "a back side"
    en øjenåbner | an eye-opener
  questions: |
    mc: What is hygge for Alma? || *Watching films with her friends | Playing board games with her family | Going to a café || "Hygge er, når jeg ser film med mine veninder, og vi har slik og tæpper."
    tf: According to the text, hygge is only about candles and blankets. || false || "Hygge handler mindst lige så meget om mennesker som om ting."
    short: Give one reason why hygge is important in Denmark, according to the text. || kw: vinter/vinteren/winter/mørk/dark/klima/klimaet/climate/indendørs/indoors || The long, dark winter: Danes spend a lot of time indoors.
    fill: Det vigtigste er, at man føler sig ___. || tryg || "Det vigtigste er, at man føler sig tryg."
    mc: What was an eye-opener for Søren? || *His colleague had never been invited to anyone's home | His daughter didn't like board games | Candles are expensive in India || "Hun havde boet her i et år og var aldrig blevet inviteret hjem til nogen."
    tf: Søren's colleague brings her own snacks to the Friday hygge. || true || "Hun tager altid sine egne indiske snacks med."

- slug: da-mor-blev-forfatter
  kind: reading
  title: Da mor blev forfatter
  topic: Culture and entertainment
  summary: Mia tells the story of how her mother started writing a novel after she retired — and got it published at 68.
  free: false
  text: |
    Min mor, Birthe, har altid elsket bøger. Da jeg var barn, læste hun højt for mig hver aften, og når bøgerne slap op, fandt hun på sine egne historier. Men i 35 år arbejdede hun som bogholder på en fabrik i Randers, og hun havde aldrig tid til at skrive.

    Så gik hun på pension. Først nød hun friheden: Hun gik lange ture, passede sine børnebørn og meldte sig ind i en læseklub på biblioteket. Men efter et halvt år kedede hun sig. En aften fortalte hun mig, at hun havde fået en idé til en roman.

    "Den handler om en pige, der vokser op på en gård i 1960'erne," sagde hun. "Hun drømmer om at blive pilot, men alle siger, at det er umuligt for en pige." Jeg kunne godt høre, at der var meget af mor selv i historien.

    Hun gik i gang samme vinter. Hver morgen satte hun sig ved spisebordet med en kop kaffe og skrev i tre timer. Nogle dage skrev hun ti sider, andre dage kun én. Flere gange ville hun give op. "Det er noget vrøvl," sagde hun og slettede hele kapitler. Men min far opmuntrede hende, og hun holdt ikke op.

    Efter to år var bogen færdig. Hun sendte den til otte forlag, og syv af dem sagde nej. Hun var ved at opgive drømmen, da hun en dag fik en mail fra et lille forlag i Aarhus: De ville gerne udgive hendes roman.

    Bogen udkom sidste efterår, da mor var 68. Den blev ikke en bestseller, men den fik flotte anmeldelser i lokalavisen, og biblioteket har måttet købe ti ekstra eksemplarer, fordi så mange vil låne den.

    I dag er mor i gang med sin anden bog. Når jeg spørger, hvorfor hun ikke begyndte før, svarer hun: "Jeg var ikke klar før. Man skal have levet lidt, før man har noget at fortælle."

    Mia, 41
  translation: |
    My mother, Birthe, has always loved books. When I was a child, she read aloud to me every evening, and when we ran out of books, she made up her own stories. But for 35 years she worked as a bookkeeper at a factory in Randers, and she never had time to write.

    Then she retired. At first she enjoyed her freedom: she went for long walks, looked after her grandchildren and joined a book club at the library. But after six months she was bored. One evening she told me that she had had an idea for a novel.

    "It's about a girl who grows up on a farm in the 1960s," she said. "She dreams of becoming a pilot, but everyone says it's impossible for a girl." I could tell that there was a lot of Mum herself in the story.

    She got started that same winter. Every morning she sat down at the dining table with a cup of coffee and wrote for three hours. Some days she wrote ten pages, other days only one. Several times she wanted to give up. "It's rubbish," she said, and deleted whole chapters. But my father encouraged her, and she didn't stop.

    After two years the book was finished. She sent it to eight publishers, and seven of them said no. She was about to give up her dream when one day she got an email from a small publisher in Aarhus: they wanted to publish her novel.

    The book came out last autumn, when Mum was 68. It didn't become a bestseller, but it got excellent reviews in the local paper, and the library has had to buy ten extra copies because so many people want to borrow it.

    Today Mum is working on her second book. When I ask her why she didn't start earlier, she answers: "I wasn't ready before. You have to have lived a little before you have something to tell."

    Mia, 41
  glossary: |
    slippe op | to run out
    finde på | to make up; to invent | a particle verb
    en bogholder | a bookkeeper
    gå på pension | to retire
    gå i gang | to get started
    vrøvl | nonsense; rubbish
    opmuntre | to encourage
    være ved at | to be about to
    et forlag | a publisher
    et eksemplar | a copy (of a book)
  questions: |
    mc: What was Birthe's job before she retired? || *A bookkeeper at a factory | A librarian | A teacher || "I 35 år arbejdede hun som bogholder på en fabrik i Randers."
    tf: The first publisher she contacted accepted the book. || false || "Hun sendte den til otte forlag, og syv af dem sagde nej."
    short: What is Birthe's novel about? || kw: pige/girl/pilot/gård/farm || A girl who grows up on a farm in the 1960s and dreams of becoming a pilot.
    fill: Bogen ___ sidste efterår, da mor var 68. || udkom || Udkomme (come out) has the past udkom.
    mc: Why has the library bought extra copies? || *Many people want to borrow it | The first copies were damaged | Birthe gave a talk there || "Fordi så mange vil låne den."
    short: Why didn't Birthe start writing earlier, according to her? || kw: klar/ready/levet/lived/live || She wasn't ready: "Man skal have levet lidt, før man har noget at fortælle."

- slug: en-mistaenkelig-sms
  kind: listening
  title: En mistænkelig sms
  topic: Media and technology
  summary: Erna has received a strange text message about a parcel. She calls her grandson Anton, who helps her work out whether it is a scam.
  free: true
  speakers: E=Erna/f; A=Anton/m
  text: |
    E: Anton, det er farmor. Har du tid et øjeblik? Jeg har fået en mærkelig sms.
    A: Hej farmor. Selvfølgelig. Hvad står der i den?
    E: Der står, at min pakke ikke kan leveres, og at jeg skal betale tyve kroner via et link.
    A: Har du bestilt en pakke for nylig?
    E: Nej, det er netop det. Jeg har ikke bestilt noget i flere måneder.
    A: Så er det helt sikkert svindel. Har du trykket på linket?
    E: Ja, desværre. Jeg havde allerede trykket på det, før jeg kom i tanke om, at jeg ikke ventede noget.
    A: Okay, ingen panik. Skrev du dine kortoplysninger, eller brugte du MitID?
    E: Nej. Siden bad om mit kortnummer, men så blev jeg i tvivl og lukkede den.
    A: Godt gået! Så er der ikke sket noget. Men slet beskeden, og bloker nummeret. Ved du, hvordan man gør?
    E: Nej. Kan du forklare mig, hvor jeg skal trykke?
    A: Åbn beskeden, og tryk på de tre prikker øverst i hjørnet. Så står der "bloker".
    E: Nu har jeg gjort det. Men hvordan kan jeg vide, om en besked er ægte?
    A: Banker og myndigheder beder dig aldrig om at oplyse koder i en sms. Og hvis du er i tvivl, så ring til mig – eller til banken.
    E: Det vil jeg huske. Min veninde Inge blev snydt sidste år. Hun havde givet sin kode til en mand, der sagde, at han ringede fra banken.
    A: Det sker desværre for mange. Svindlerne er blevet meget dygtige.
    E: Tak, skat. Hvad skulle jeg gøre uden dig?
    A: Det var så lidt. Og farmor – du må altid gerne ringe, også selvom det bare er en lille ting.
  translation: |
    Erna: Anton, it's Grandma. Have you got a moment? I've had a strange text message.
    Anton: Hi Grandma. Of course. What does it say?
    Erna: It says that my parcel can't be delivered and that I have to pay twenty kroner via a link.
    Anton: Have you ordered a parcel recently?
    Erna: No, that's just it. I haven't ordered anything for months.
    Anton: Then it's definitely a scam. Did you tap the link?
    Erna: Yes, unfortunately. I had already tapped it before I remembered that I wasn't expecting anything.
    Anton: OK, don't panic. Did you type in your card details, or did you use MitID?
    Erna: No. The page asked for my card number, but then I had my doubts and closed it.
    Anton: Well done! Then nothing has happened. But delete the message and block the number. Do you know how to do it?
    Erna: No. Can you tell me where to tap?
    Anton: Open the message and tap the three dots at the top in the corner. Then it says "block".
    Erna: Now I've done it. But how can I know whether a message is genuine?
    Anton: Banks and the authorities never ask you to give codes in a text message. And if you're in doubt, call me – or the bank.
    Erna: I'll remember that. My friend Inge was cheated last year. She had given her code to a man who said he was calling from the bank.
    Anton: Unfortunately that happens to lots of people. The scammers have become very clever.
    Erna: Thank you, darling. What would I do without you?
    Anton: You're welcome. And Grandma – you can always call, even if it's just a little thing.
  glossary: |
    mistænkelig | suspicious
    svindel | fraud; a scam
    trykke på | to tap; to press
    komme i tanke om | to suddenly remember; to realise
    kortoplysninger | card details
    være i tvivl | to be unsure; to have doubts
    blokere | to block | imperative: bloker
    blive snydt | to be cheated
  questions: |
    mc: What did the text message ask Erna to do? || *Pay twenty kroner via a link | Call her bank | Collect a parcel at the post office || "Jeg skal betale tyve kroner via et link."
    tf: Erna had ordered a parcel recently. || false || "Jeg har ikke bestilt noget i flere måneder."
    short: What did Erna do when the page asked for her card number? || kw: lukkede/closed/close/stoppede/stopped || "Så blev jeg i tvivl og lukkede den."
    fill: Jeg havde allerede trykket på det, før jeg kom i ___ om, at jeg ikke ventede noget. || tanke || Komme i tanke om = to suddenly remember.
    mc: What does Anton say banks never do? || *Ask for codes in a text message | Send letters | Call their customers || "Banker og myndigheder beder dig aldrig om at oplyse koder i en sms."
    tf: Erna's friend Inge was cheated last year. || true || "Min veninde Inge blev snydt sidste år."

- slug: interrail-efter-studenten
  kind: listening
  title: Interrail efter studenten
  topic: Society and travel
  summary: Two friends about to finish upper secondary school imagine a three-week train trip around Europe — and how they could afford it.
  free: false
  speakers: S=Sofia/f; L=Lukas/m
  text: |
    S: Lukas, har du tænkt over, hvad du skal lave i sommer, når vi er blevet studenter?
    L: Ikke rigtigt. Jeg skal arbejde i supermarkedet i juli, men august er fri.
    S: Hvad med at tage på interrail i tre uger? Vi kunne starte i Berlin og slutte i Rom.
    L: Det lyder fedt. Men hvis jeg tog af sted i tre uger, ville jeg ikke have nogen penge tilbage til efteråret.
    S: Det behøver ikke at være dyrt. Hvis vi sov på vandrehjem og lavede vores egen mad, kunne vi klare os for meget lidt.
    L: Hm. Og hvis vi tog nattog, kunne vi spare nogle overnatninger.
    S: Præcis! Min fætter gjorde det sidste år. Han sagde, at det var den bedste ferie i hans liv.
    L: Hvor var han henne?
    S: Han tog til Prag, Wien og Budapest og videre til Kroatien, hvor han sejlede rundt mellem øerne.
    L: Hvis jeg kunne vælge, ville jeg også se Kroatien. Men jeg ville helst ikke sidde i toget hele tiden.
    S: Det gør man heller ikke. Vi kunne blive to eller tre dage hvert sted.
    L: Og hvis det regnede hele tiden?
    S: Så ville vi gå på museum. Der er nok at se i alle de byer.
    L: Og hvad med min mor? Hun bliver altid bekymret, når jeg rejser.
    S: Hvis du sendte hende en besked hver aften, ville hun nok slappe af.
    L: Ha, ja. Og hvis jeg lånte min storebrors store rygsæk, ville jeg ikke behøve at købe en ny.
    S: Så er vi enige? Skal vi se på billetter i weekenden?
    L: Okay, lad os gøre det. Jeg ville ønske, at sommeren var her allerede!
  translation: |
    Sofia: Lukas, have you thought about what you're doing this summer, when we've graduated?
    Lukas: Not really. I'm working at the supermarket in July, but August is free.
    Sofia: How about going interrailing for three weeks? We could start in Berlin and finish in Rome.
    Lukas: That sounds great. But if I went away for three weeks, I wouldn't have any money left for the autumn.
    Sofia: It doesn't have to be expensive. If we slept in youth hostels and made our own food, we could get by on very little.
    Lukas: Hm. And if we took night trains, we could save on a few nights' accommodation.
    Sofia: Exactly! My cousin did it last year. He said it was the best holiday of his life.
    Lukas: Where did he go?
    Sofia: He went to Prague, Vienna and Budapest and on to Croatia, where he sailed around between the islands.
    Lukas: If I could choose, I'd like to see Croatia too. But I'd rather not sit on the train all the time.
    Sofia: You don't. We could stay two or three days in each place.
    Lukas: And if it rained the whole time?
    Sofia: Then we'd go to museums. There's plenty to see in all those cities.
    Lukas: And what about my mum? She always gets worried when I travel.
    Sofia: If you sent her a message every evening, she'd probably relax.
    Lukas: Ha, yes. And if I borrowed my big brother's large backpack, I wouldn't need to buy a new one.
    Sofia: So we agree? Shall we look at tickets at the weekend?
    Lukas: OK, let's do it. I wish summer was here already!
  glossary: |
    blive student | to graduate from upper secondary school
    tage på interrail | to go interrailing | travelling around Europe by train on one pass
    fedt | great; cool | informal
    et vandrehjem | a youth hostel
    klare sig | to get by; to manage
    en fætter | a (male) cousin | a female cousin is en kusine
    sejle rundt | to sail around
    være enige | to agree
  questions: |
    mc: Where would the trip start and finish? || *Start in Berlin and finish in Rome | Start in Prague and finish in Croatia | Start in Rome and finish in Berlin || "Vi kunne starte i Berlin og slutte i Rom."
    tf: Lukas is working at the supermarket in August. || false || He works in July: "Jeg skal arbejde i supermarkedet i juli, men august er fri."
    short: How could they save money, according to Sofia? || kw: vandrehjem/hostel/hostels/mad/food/cook || By sleeping in youth hostels and making their own food.
    fill: Og hvis vi tog nattog, ___ vi spare nogle overnatninger. || kunne || Hvis + past, then kunne + infinitive: kunne vi spare.
    mc: Why is Lukas thinking about his mother? || *She always worries when he travels | She needs his help in August | She doesn't like Croatia || "Hun bliver altid bekymret, når jeg rejser."
    tf: Sofia's cousin thought it was the best holiday of his life. || true || "Han sagde, at det var den bedste ferie i hans liv."

- slug: moedet-om-den-nye-app
  kind: listening
  title: Mødet om den nye app
  topic: Work and careers
  summary: A project team meets to discuss delays, a user test and a small celebration — following the agenda from status to "eventuelt".
  free: false
  speakers: H=Hanne/f; O=Omar/m; L=Lise/f
  text: |
    H: Godmorgen, alle sammen. Skal vi gå i gang? Første punkt på dagsordenen er status på den nye app.
    O: Ja. Vi er næsten færdige med testversionen, men vi er lidt forsinkede.
    H: Hvor meget er I forsinkede?
    O: Omkring to uger. Vi fandt flere fejl i betalingssystemet, og derfor måtte vi lave en del om.
    L: Må jeg spørge, om det påvirker lanceringen den 1. oktober?
    O: Det håber jeg ikke. Hvis vi får hjælp fra en ekstra udvikler, kan vi stadig nå det.
    H: Okay. Lise, kan du undersøge, om vi kan låne en udvikler fra afdelingen i Kolding?
    L: Ja, det gør jeg gerne. Jeg vender tilbage i morgen.
    H: Tak. Næste punkt er brugertesten. Hvordan gik den i sidste uge?
    L: Generelt godt. Tolv brugere testede appen, og de fleste syntes, at den var nem at bruge. Men flere havde problemer med at finde deres kvitteringer.
    O: Det kan vi godt løse. Vi kunne flytte knappen op på forsiden.
    H: Godt forslag. Er alle enige?
    L: Ja, men jeg foreslår, at vi tester det igen, før vi beslutter noget.
    H: Fint, så gør vi det. Selvom tiden er knap, er det vigtigt, at appen virker for alle.
    O: Helt enig.
    H: Godt. Omar, kan du sende en ny tidsplan til alle senest fredag?
    O: Ja, det kan jeg godt. Så kan vi se, om vi stadig kan nå den 1. oktober.
    H: Så har vi kun eventuelt tilbage. Er der noget?
    L: Kun at der er kage i kantinen i dag, fordi Omar har fødselsdag!
    O: Ha, tak. I er alle sammen velkomne.
    H: Tillykke, Omar. Jeg sender referatet ud i eftermiddag. Tak for i dag.
  translation: |
    Hanne: Good morning, everyone. Shall we get started? The first item on the agenda is the status of the new app.
    Omar: Yes. We've almost finished the test version, but we're a bit behind schedule.
    Hanne: How far behind are you?
    Omar: About two weeks. We found several errors in the payment system, so we had to redo quite a lot.
    Lise: May I ask whether that affects the launch on 1 October?
    Omar: I hope not. If we get help from an extra developer, we can still make it.
    Hanne: OK. Lise, can you find out whether we can borrow a developer from the Kolding department?
    Lise: Yes, I'd be happy to. I'll get back to you tomorrow.
    Hanne: Thanks. The next item is the user test. How did it go last week?
    Lise: Well, on the whole. Twelve users tested the app, and most of them thought it was easy to use. But several had problems finding their receipts.
    Omar: We can solve that. We could move the button up to the front page.
    Hanne: Good suggestion. Does everyone agree?
    Lise: Yes, but I suggest that we test it again before we decide anything.
    Hanne: Fine, let's do that. Even though time is short, it's important that the app works for everyone.
    Omar: I completely agree.
    Hanne: Good. Omar, can you send a new schedule to everyone by Friday at the latest?
    Omar: Yes, I can. Then we can see whether we can still make 1 October.
    Hanne: Then we only have any other business left. Is there anything?
    Lise: Only that there's cake in the canteen today, because it's Omar's birthday!
    Omar: Ha, thanks. You're all welcome.
    Hanne: Happy birthday, Omar. I'll send out the minutes this afternoon. Thanks for today.
  glossary: |
    gå i gang | to get started
    forsinket | delayed; behind schedule
    påvirke | to affect
    en lancering | a launch
    en udvikler | a developer | from udvikle (to develop)
    en kvittering | a receipt
    knap | short; scarce | tiden er knap = time is short
    eventuelt | any other business | the last item on a Danish agenda
  questions: |
    mc: Why is the team behind schedule? || *They found errors in the payment system | A developer is ill | The users didn't like the app || "Vi fandt flere fejl i betalingssystemet, og derfor måtte vi lave en del om."
    tf: Lise will ask the Kolding department about borrowing a developer. || true || "Lise, kan du undersøge, om vi kan låne en udvikler fra afdelingen i Kolding?" — "Ja, det gør jeg gerne."
    short: What problem did several users have? || kw: kvittering/kvitteringer/kvitteringerne/receipt/receipts || They had problems finding their receipts.
    fill: Hvis vi får hjælp fra en ekstra udvikler, ___ vi stadig nå det. || kan || A real condition: hvis + present, kan + infinitive.
    mc: Why is there cake in the canteen? || *It's Omar's birthday | The app is finished | Hanne is leaving || "Fordi Omar har fødselsdag!"
    tf: They decide to move the button without testing it again. || false || Lise suggests testing it again first, and Hanne agrees: "Fint, så gør vi det."

- slug: hos-studievejlederen
  kind: listening
  title: Hos studievejlederen
  topic: Education and learning
  summary: Ahmad, a student at upper secondary school, has no idea what to study next. The school's careers counsellor gives him some advice.
  free: false
  speakers: V=Vivi/f; A=Ahmad/m
  text: |
    V: Kom indenfor, Ahmad. Du skrev, at du gerne ville tale om din fremtid?
    A: Ja. Jeg skal vælge uddannelse næste år, og jeg har ingen anelse om, hvad jeg vil.
    V: Det er helt normalt. Hvad drømte du om, da du var yngre?
    A: Jeg ville være læge, da jeg var lille. Men mine karakterer i kemi er ikke så gode.
    V: Hvad interesserer dig mest nu?
    A: Jeg kan godt lide at arbejde med mennesker, og jeg er god til at forklare ting. Jeg hjælper tit min lillebror med hans lektier.
    V: Har du overvejet at blive lærer eller pædagog? Eller måske sygeplejerske?
    A: Lærer, måske. Men jeg ved ikke, om jeg kan klare at stå foran en klasse.
    V: Du kunne prøve det af. Vi har et samarbejde med to folkeskoler, hvor man kan være hjælpelærer i en uge.
    A: Det lyder godt. Skulle jeg også tage et sabbatår?
    V: Det kommer an på dig. Et sabbatår kan være en god idé, hvis du bruger det fornuftigt, for eksempel til at arbejde eller rejse.
    A: Mine forældre synes, at jeg burde starte med det samme.
    V: Det forstår jeg godt. Men det er din beslutning. Du burde tale med dem om, hvad du selv har lyst til.
    A: Ja. Hvad skal jeg gøre nu?
    V: Du skulle prøve at tage til åbent hus på et par uddannelser i foråret. Og du kunne tale med nogle studerende om, hvordan hverdagen er.
    A: Okay. Kan vi mødes igen efter jul?
    V: Selvfølgelig. Send mig en mail, så finder vi en tid.
    A: Tak for hjælpen. Det har været rigtig godt at tale om det.
    V: Det var så lidt. Og husk: Du behøver ikke at vide alt nu.
  translation: |
    Vivi: Come in, Ahmad. You wrote that you'd like to talk about your future?
    Ahmad: Yes. I have to choose what to study next year, and I have no idea what I want.
    Vivi: That's completely normal. What did you dream of when you were younger?
    Ahmad: I wanted to be a doctor when I was little. But my grades in chemistry aren't very good.
    Vivi: What interests you most now?
    Ahmad: I like working with people, and I'm good at explaining things. I often help my little brother with his homework.
    Vivi: Have you thought about becoming a teacher or a childcare worker? Or maybe a nurse?
    Ahmad: A teacher, maybe. But I don't know whether I can cope with standing in front of a class.
    Vivi: You could try it out. We work with two primary schools where you can be a teaching assistant for a week.
    Ahmad: That sounds good. Should I also take a gap year?
    Vivi: That depends on you. A gap year can be a good idea if you use it sensibly, for example to work or travel.
    Ahmad: My parents think I ought to start straight away.
    Vivi: I understand that. But it's your decision. You ought to talk to them about what you yourself want to do.
    Ahmad: Yes. What should I do now?
    Vivi: You should try going to open days at a couple of programmes in the spring. And you could talk to some students about what everyday life is like.
    Ahmad: OK. Can we meet again after Christmas?
    Vivi: Of course. Send me an email, and we'll find a time.
    Ahmad: Thanks for your help. It's been really good to talk about it.
    Vivi: You're welcome. And remember: you don't need to know everything now.
  glossary: |
    en studievejleder | a study and careers counsellor
    ingen anelse | no idea
    overveje | to consider
    en pædagog | a childcare worker; a social educator
    prøve noget af | to try something out
    en hjælpelærer | a teaching assistant
    et sabbatår | a gap year
    fornuftigt | sensibly
    åbent hus | an open day
  questions: |
    mc: What did Ahmad want to be when he was little? || *A doctor | A teacher | A pilot || "Jeg ville være læge, da jeg var lille."
    tf: Ahmad's grades in chemistry are very good. || false || "Mine karakterer i kemi er ikke så gode."
    short: How could Ahmad try out teaching? || kw: hjælpelærer/assistant/uge/week/folkeskole/folkeskoler/school || By being a teaching assistant at a primary school for a week.
    fill: Mine forældre synes, at jeg ___ starte med det samme. || burde || Burde = ought to: soft advice with the past form of bør.
    mc: What does Vivi suggest he does in the spring? || *Go to open days for a few programmes | Start a gap year | Change schools || "Du skulle prøve at tage til åbent hus på et par uddannelser i foråret."
    tf: They agree to meet again after Christmas. || true || "Kan vi mødes igen efter jul?" — "Selvfølgelig."
