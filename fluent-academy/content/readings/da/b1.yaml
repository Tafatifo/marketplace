- slug: fire-dage-om-ugen
  kind: reading
  title: Fire dage om ugen
  topic: Work and careers
  summary: A small engineering company in Aarhus tried a four-day working week. One year later, the staff look back.
  free: false
  text: |
    For et år siden besluttede et lille ingeniørfirma i Aarhus at prøve noget nyt: Alle medarbejdere skulle kun arbejde fire dage om ugen, men de skulle have den samme løn. Mange var skeptiske. Kunne man virkelig nå det samme arbejde på kortere tid?

    "Vi havde svært ved at finde nye medarbejdere," forklarer direktør Anne Lund. "Derfor ville vi gøre noget, der gjorde os mere attraktive." Firmaet fjernede lange møder, og medarbejderne aftalte faste timer, hvor ingen måtte forstyrre hinanden. Om fredagen svarede ingen på mails.

    Et år senere er resultaterne gode. Firmaet har fået flere opgaver end før, og der er færre sygedage. Selvom de fleste arbejder mere intenst fra mandag til torsdag, er de mindre stressede.

    Projektleder Kasper Nørgaard bruger sin fredag på at hente sine børn tidligt og på at træne. "Før havde jeg altid dårlig samvittighed over for familien," siger han. "Nu har jeg overskud, når jeg kommer hjem."

    Men ikke alle er lige begejstrede. Ingeniør Fatima Rahimi savner den rolige fredag, hvor man kunne nå de små opgaver. "Dagene er blevet lange og travle, og det passer ikke alle," siger hun. "Alligevel ville jeg ikke gå tilbage til fem dage."

    Kunderne har også måttet vænne sig til den nye ordning. Hvis en kunde ringer en fredag, får han eller hun en besked om, at der svares mandag morgen. "Kun få har klaget," siger Anne Lund. "De fleste synes faktisk, at det er en god idé."

    Kan modellen bruges alle steder? Næppe. På et hospital eller i en børnehave skal der være folk på arbejde hver dag. Men flere danske virksomheder har allerede vist interesse for at prøve.
  translation: |
    A year ago, a small engineering company in Aarhus decided to try something new: all employees would only work four days a week, but they would get the same salary. Many were sceptical. Could you really get the same work done in less time?

    "We were finding it hard to recruit new employees," explains the managing director, Anne Lund. "That's why we wanted to do something that made us more attractive." The company got rid of long meetings, and the staff agreed on fixed hours when nobody was allowed to disturb each other. On Fridays, nobody answered emails.

    A year later the results are good. The company has more work than before, and there are fewer sick days. Although most people work more intensively from Monday to Thursday, they are less stressed.

    Project manager Kasper Nørgaard spends his Friday picking up his children early and working out. "Before, I always felt guilty about my family," he says. "Now I have energy to spare when I get home."

    But not everyone is equally enthusiastic. Engineer Fatima Rahimi misses the quiet Friday, when you could get the small tasks done. "The days have become long and busy, and that doesn't suit everyone," she says. "Still, I wouldn't go back to five days."

    The customers have also had to get used to the new arrangement. If a customer calls on a Friday, they get a message saying that calls will be answered on Monday morning. "Only a few have complained," says Anne Lund. "Most actually think it's a good idea."

    Can the model be used everywhere? Hardly. In a hospital or a nursery, people have to be at work every day. But several Danish companies have already shown an interest in trying it.
  glossary: |
    skeptisk | sceptical
    attraktiv | attractive | here: an attractive place to work
    en sygedag | a sick day
    intenst | intensively
    have overskud | to have energy to spare | a very common Danish expression
