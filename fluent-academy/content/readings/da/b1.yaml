- slug: havnen-hvor-man-kan-bade
  kind: reading
  title: Havnen, hvor man kan bade
  topic: City and environment
  summary: Copenhagen's harbour was once full of factories and pollution. Today people swim in it — but the city still faces new challenges.
  free: false
  text: |
    En varm sommerdag ved Islands Brygge i København ligner et billede fra en sydlandsk badeby. Hundredvis af mennesker ligger på græsset, børn hopper i vandet, og en gruppe kolleger tager en dukkert i frokostpausen. Men for 30 år siden var det utænkeligt at bade her.

    Dengang var havnen fuld af skibe, fabrikker og forurening. Når det regnede kraftigt, løb spildevand fra byens kloakker direkte ud i vandet. Fiskene forsvandt, og vandet lugtede.

    I 1990'erne besluttede kommunen at gøre noget. Kloaksystemet blev bygget om, og i dag opbevares regnvand og spildevand i store bassiner under jorden, indtil det kan renses. Samtidig flyttede industrien væk fra havnen, og langs vandet kom der nye boliger, kontorer og parker.

    I 2002 åbnede det første havnebad. I dag er der flere havnebade i København, og også byer som Aarhus og Odense har fået steder, hvor man kan bade i havnen.

    Vandet kontrolleres hele sommeren. Efter meget kraftig regn kan der stadig løbe spildevand ud, og så lukkes badene i et par dage. På kommunens hjemmeside kan man se, om vandet er rent.

    Mange ser havnen som et eksempel på, at en by kan blive både grønnere og sjovere at bo i. "Jeg bader her hver morgen fra maj til oktober," fortæller Lene Pedersen, 58, der bor på Islands Brygge. "Det er det bedste ved at bo i byen – man har jo havet lige uden for døren."

    Men ikke alle problemer er løst. Med flere skybrud kommer der mere vand, end kloakkerne kan klare. Byen arbejder derfor på nye løsninger: grønne tage, parker, der kan opsuge regnvand, og veje, som kan lede vandet ud i havnen.
  translation: |
    A hot summer's day at Islands Brygge in Copenhagen looks like a picture from a southern seaside resort. Hundreds of people lie on the grass, children jump into the water, and a group of colleagues take a dip in their lunch break. But 30 years ago it was unthinkable to swim here.

    Back then the harbour was full of ships, factories and pollution. When it rained heavily, wastewater from the city's sewers ran straight into the water. The fish disappeared, and the water smelled.

    In the 1990s the municipality decided to do something. The sewer system was rebuilt, and today rainwater and wastewater are stored in large underground tanks until they can be treated. At the same time, industry moved away from the harbour, and new homes, offices and parks appeared along the water.

    In 2002 the first harbour bath opened. Today there are several harbour baths in Copenhagen, and cities such as Aarhus and Odense have also got places where you can swim in the harbour.

    The water is checked all summer. After very heavy rain, wastewater can still run out, and then the baths are closed for a couple of days. On the municipality's website you can see whether the water is clean.

    Many people see the harbour as an example of how a city can become both greener and more fun to live in. "I swim here every morning from May to October," says Lene Pedersen, 58, who lives at Islands Brygge. "It's the best thing about living in the city – you've got the sea right outside your door."

    But not all the problems have been solved. With more cloudbursts, more water comes than the sewers can handle. The city is therefore working on new solutions: green roofs, parks that can soak up rainwater, and roads that can lead the water out into the harbour.
