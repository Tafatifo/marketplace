    tf: According to the text, the model would be easy to use in hospitals. || false || "Næppe. På et hospital … skal der være folk på arbejde hver dag."

- slug: et-aar-paa-efterskole
  kind: reading
  title: Et år på efterskole
  topic: Education and learning
  summary: Noah, 15, writes to his grandmother about his year at a boarding school in West Jutland — the rules, the lessons and the friendships.
  free: false
  text: |
    Kære farmor

    Nu er der kun tre uger tilbage af mit år på efterskolen, og jeg kan næsten ikke forstå, hvor hurtigt tiden er gået. Du spurgte i dit sidste brev, hvordan det har været. Her er svaret.

    Da jeg kom hertil i august, var jeg ret nervøs. Jeg kendte ingen, og jeg skulle dele værelse med en dreng fra Bornholm, som jeg aldrig havde mødt. Den første uge ville jeg bare hjem. Men så begyndte vi at spille fodbold om aftenen, og efter et par uger var Viktor min bedste ven.

    Der er mange regler her. Vi skal stå op klokken syv, og vi skal gøre rent på gangen hver fredag. Vi må ikke have mobilen med i timerne, og om aftenen skal vi aflevere den klokken ti. I starten syntes jeg, det var strengt, men nu er jeg glad for det. Jeg sover meget bedre, og vi snakker meget mere sammen.

    Undervisningen er anderledes end i folkeskolen. Lærerne bor på skolen, og man kan altid gå til dem, hvis der er noget. Om formiddagen har vi almindelige fag som dansk, matematik og engelsk, men om eftermiddagen har jeg valgfag. Jeg valgte musik og friluftsliv, og i marts var vi en uge i Norge, hvor vi skulle sove i telt i sneen. Det var det koldeste, jeg nogensinde har prøvet!

    Det bedste har været fællesskabet. Vi spiser sammen, synger sammen hver morgen og hjælper hinanden med lektierne. Jeg har lært at lave mad til hundrede mennesker – og at vaske mit eget tøj. Det bliver mor glad for!

    Efter sommerferien skal jeg begynde i gymnasiet i Aarhus. Jeg glæder mig, men jeg kommer til at savne alle her.

    Mange kærlige hilsner
    Noah

    PS: Mor siger, at du gerne må komme til afslutningsfesten den 21. juni. Kan du det?
  translation: |
    Dear Grandma

    Now there are only three weeks left of my year at boarding school, and I can hardly believe how quickly the time has gone. In your last letter you asked how it has been. Here is the answer.

    When I arrived in August, I was quite nervous. I didn't know anyone, and I had to share a room with a boy from Bornholm whom I had never met. The first week I just wanted to go home. But then we started playing football in the evenings, and after a couple of weeks Viktor was my best friend.

    There are lots of rules here. We have to get up at seven, and we have to clean the corridor every Friday. We aren't allowed to have our phones in class, and in the evening we have to hand them in at ten. At first I thought it was strict, but now I'm glad about it. I sleep much better, and we talk to each other a lot more.

    The teaching is different from the folkeskole. The teachers live at the school, and you can always go to them if something is wrong. In the mornings we have ordinary subjects like Danish, maths and English, but in the afternoons I have electives. I chose music and outdoor life, and in March we spent a week in Norway, where we had to sleep in tents in the snow. It was the coldest thing I've ever tried!

    The best thing has been the community. We eat together, sing together every morning and help each other with homework. I've learned to cook for a hundred people – and to wash my own clothes. Mum will be pleased about that!

    After the summer holidays I'm starting upper secondary school in Aarhus. I'm looking forward to it, but I'm going to miss everyone here.

    Lots of love
    Noah

    PS: Mum says you're very welcome to come to the end-of-year party on 21 June. Can you make it?
  glossary: |
    en efterskole | a boarding school for teenagers | usually for 9th or 10th grade
    dele værelse | to share a room
    gøre rent | to clean
    aflevere | to hand in
    et valgfag | an elective subject
    friluftsliv | outdoor life | hiking, camping and canoeing
    et telt | a tent
    et fællesskab | a community; togetherness
    en afslutningsfest | an end-of-year party
  questions: |
