- slug: naar-havet-kommer-taettere-paa
  kind: reading
  title: Når havet kommer tættere på
  topic: Environment
  summary: An explainer about rising sea levels and the three options for Danish coastal towns — protect, adapt or retreat — and who should pay.
  free: false
  text: |
    Når havet kommer tættere på

    Langs de danske kyster er havet steget med omkring tyve centimeter i løbet af det seneste århundrede, og ifølge klimaforskerne vil det fortsætte med at stige. Hvor meget afhænger af, hvor hurtigt verden får reduceret udledningen af drivhusgasser. Samtidig ventes stormfloderne at blive kraftigere. For de mange danske byer, der ligger ud til vandet, er spørgsmålet derfor ikke, om der skal gøres noget, men hvad.

    Grundlæggende har kystbyerne tre muligheder. Den første er at beskytte sig med diger, mure og sluser, der holder vandet ude. Det er den mest udbredte løsning, og den har den fordel, at byen kan blive, hvor den er. Til gengæld er den dyr, og et dige skal vedligeholdes og forhøjes i takt med, at havet stiger.

    Den anden mulighed er at tilpasse byen, så den kan tåle at blive oversvømmet en gang imellem. Nye huse kan bygges højere, eller med parkering i stueetagen og boliger på etagerne ovenover. Parker og pladser kan indrettes, så de kan rumme vand under en stormflod og tørre ud bagefter. Denne løsning kræver, at man planlægger på lang sigt, idet det tager årtier at omdanne en hel bydel.

    Den tredje og mest kontroversielle mulighed er at trække sig tilbage fra de mest udsatte områder. Det kan betyde, at sommerhuse eller enkelte bebyggelser på lang sigt må opgives. "Det er et ømt punkt, fordi det handler om folks hjem og minder," siger en kystplanlægger fra en af de udsatte kommuner. "Men vi skylder de næste generationer at være ærlige om, hvad der kan betale sig at beskytte."

    I praksis kombinerer de fleste kommuner løsningerne. Som udgangspunkt er det de grundejere, der får gavn af kystbeskyttelsen, der skal betale for den, men staten og kommunerne kan give tilskud. Det skaber en vanskelig balance mellem den enkeltes ansvar og fællesskabets.

    Flere steder er man også begyndt at se på naturbaserede løsninger. Strandenge, sandrevler og klitter kan dæmpe bølgerne og samtidig give plads til dyr og planter. De er ikke tilstrækkelige alene, men de kan supplere de traditionelle diger og gøre kysten mere robust.

    Uanset hvilken løsning der vælges, er én ting sikker: Jo længere man venter, desto dyrere bliver det. "Det billigste dige er det, der bliver bygget i god tid," som en ingeniør tørt udtrykker det.
  translation: |
    When the sea comes closer

    Along the Danish coasts the sea has risen by about twenty centimetres over the last century, and according to climate scientists it will continue to rise. How much depends on how quickly the world manages to reduce greenhouse gas emissions. At the same time, storm surges are expected to become more powerful. For the many Danish towns that face the water, the question is therefore not whether something must be done, but what.

    Basically, coastal towns have three options. The first is to protect themselves with dikes, walls and sluices that keep the water out. This is the most common solution, and it has the advantage that the town can stay where it is. On the other hand, it is expensive, and a dike must be maintained and raised as the sea rises.

    The second option is to adapt the town so that it can cope with being flooded now and then. New buildings can be built higher, or with parking on the ground floor and homes on the floors above. Parks and squares can be designed so that they can hold water during a storm surge and dry out afterwards. This solution requires long-term planning, since it takes decades to transform a whole district.

    The third and most controversial option is to withdraw from the most exposed areas. This may mean that summer houses or individual settlements have to be given up in the long run. "It's a sore point, because it's about people's homes and memories," says a coastal planner from one of the exposed municipalities. "But we owe it to the next generations to be honest about what is worth protecting."

    In practice, most municipalities combine the solutions. As a rule, it is the landowners who benefit from coastal protection who must pay for it, but the state and the municipalities can give subsidies. This creates a difficult balance between the responsibility of the individual and that of the community.

    In several places people have also begun to look at nature-based solutions. Salt marshes, sandbars and dunes can dampen the waves and at the same time make room for animals and plants. They are not sufficient on their own, but they can supplement the traditional dikes and make the coast more resilient.

    Whichever solution is chosen, one thing is certain: the longer you wait, the more expensive it gets. "The cheapest dike is the one that's built in good time," as one engineer drily puts it.
  glossary: |
    en stormflod | a storm surge
    et dige | a dike; a sea wall
    en sluse | a sluice; a lock
    i takt med, at | as; in step with
    udsat | exposed; vulnerable
    opgive | to give up; to abandon | irregular: opgav, har opgivet
    et ømt punkt | a sore point
    en grundejer | a landowner; a property owner
    en klit | a dune
    dæmpe | to dampen; to reduce
