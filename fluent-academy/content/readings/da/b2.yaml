- slug: fem-spoergsmaal-der-afsloerer-en-falsk-nyhed
  kind: reading
  title: Fem spørgsmål, der afslører en falsk nyhed
  topic: Media and persuasion
  summary: A practical guide to spotting fake news with five questions — about the sender, the source, the date, your own feelings and what other media say.
  free: false
  text: |
    Fem spørgsmål, der afslører en falsk nyhed

    Vi bliver hver dag bombarderet med nyheder, opslag og videoer, og de fleste af os har på et tidspunkt delt noget, der viste sig at være forkert. Falske nyheder spreder sig ofte hurtigere end sande, fordi de er skrevet til at vække stærke følelser. Men med fem enkle spørgsmål kan du blive langt bedre til at gennemskue dem.

    Det første spørgsmål er: Hvem står bag? Undersøg, hvem der har skrevet eller delt indholdet. Er det et kendt medie med en ansvarshavende redaktør, en myndighed eller en anonym profil, der blev oprettet i sidste uge? Mangler der et navn og en adresse, bør alarmklokkerne ringe.

    Det andet spørgsmål er: Hvad er kilden? En troværdig artikel henviser til kilder, som du selv kan tjekke – en rapport, en undersøgelse eller en navngiven ekspert. Står der bare "forskere siger" eller "det har længe været kendt", er det et faresignal. Prøv at finde den oprindelige kilde, og læs, hvad der faktisk står.

    Det tredje spørgsmål er: Hvornår er det fra? Gamle historier dukker ofte op igen, som om de var nye. Et billede fra en oversvømmelse for ti år siden kan pludselig blive delt som bevis på noget, der skete i går. Tjek datoen, og søg efter billedet på nettet for at se, hvor det først blev brugt.

    Det fjerde spørgsmål er: Hvad gør det ved dig? Hvis en overskrift gør dig rasende eller bange, så stop op. Netop de stærke følelser får os til at dele uden at tænke. Spørg dig selv, om formålet er at informere dig – eller at få dig til at klikke, købe eller dele.

    Det femte spørgsmål er: Hvad siger andre? Hvis en historie er sand og vigtig, bliver den som regel bragt af flere uafhængige medier. Findes den kun ét sted, eller siger andre kilder det modsatte, bør du vente med at dele den. Der findes også faktatjekkere, som undersøger påstande, der går viralt.

    Det er ikke kun ældre mennesker, der falder for falske nyheder. Undersøgelser viser, at alle aldersgrupper kan blive snydt, især når en historie bekræfter det, man i forvejen tror. Derfor handler kildekritik i lige så høj grad om at være kritisk over for sig selv som over for andre.

    Og hvis du alligevel kommer til at dele noget forkert? Så slet opslaget, og skriv, at oplysningerne var forkerte. Det er ikke pinligt at indrømme en fejl – det er en del af at være en ansvarlig borger på nettet.
  translation: |
    Five questions that expose fake news

    Every day we are bombarded with news, posts and videos, and most of us have at some point shared something that turned out to be wrong. Fake news often spreads faster than true news because it is written to stir up strong feelings. But with five simple questions you can get much better at seeing through it.

    The first question is: who is behind it? Find out who has written or shared the content. Is it a well-known media outlet with an editor-in-chief, an authority, or an anonymous profile that was created last week? If there is no name and address, alarm bells should ring.

    The second question is: what is the source? A reliable article refers to sources that you can check yourself – a report, a study or a named expert. If it just says "researchers say" or "it has long been known", that's a warning sign. Try to find the original source and read what it actually says.

    The third question is: when is it from? Old stories often turn up again as if they were new. A picture of a flood ten years ago can suddenly be shared as proof of something that happened yesterday. Check the date, and search for the picture online to see where it was first used.

    The fourth question is: what does it do to you? If a headline makes you furious or frightened, stop and think. It is precisely strong feelings that make us share without thinking. Ask yourself whether the purpose is to inform you – or to make you click, buy or share.

    The fifth question is: what do others say? If a story is true and important, it will usually be reported by several independent media outlets. If it can only be found in one place, or other sources say the opposite, you should wait before sharing it. There are also fact-checkers who examine claims that go viral.

    It isn't only older people who fall for fake news. Studies show that all age groups can be fooled, especially when a story confirms what they already believe. That's why source criticism is just as much about being critical of yourself as of others.

    And what if you share something false anyway? Then delete the post and write that the information was wrong. It isn't embarrassing to admit a mistake – it's part of being a responsible citizen online.
