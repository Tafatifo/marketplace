- slug: koeb-nu-betal-senere
  kind: reading
  title: Køb nu – betal senere
  topic: Work and the economy
  summary: A consumer article about split payments online — why young people use them, what can go wrong and how experts recommend keeping control of your money.
  free: false
  text: |
    Køb nu – betal senere

    Det ser så nemt ud. Du har fundet en jakke på nettet til tolv hundrede kroner, og ved kassen får du tilbudt at dele betalingen op i fire rater uden renter. Et enkelt klik, og jakken er på vej. Den første rate bliver trukket med det samme, de næste tre i løbet af de følgende måneder.

    Betalingsformen, som på engelsk kaldes "buy now, pay later", er blevet populær, især blandt unge. Ifølge forbrugereksperter skyldes det, at den føles mindre som at låne penge end et traditionelt lån. Men det er netop dét, der kan være problemet.

    "Mange unge er ikke klar over, at de faktisk optager en kredit, når de deler betalingen op," siger en rådgiver fra en forbrugerorganisation. "Det er nemt at miste overblikket, hvis man har fem-seks små betalinger kørende på samme tid. Og glemmer man at betale til tiden, kan der hurtigt komme gebyrer oven i."

    Sanne, der er toogtyve og studerer i Odense, kender problemet. "Det startede med et par sneakers. Så kom en ny telefon og en weekendtur med veninderne. Hver betaling var lille, så jeg tænkte ikke over det. Men en måned opdagede jeg, at næsten halvdelen af min SU gik til afdrag." Havde hun lagt alle betalingerne sammen fra starten, var hun aldrig havnet der, siger hun i dag.

    Kritikerne peger på, at betalingsformen gør det for let at købe ting, man ikke har råd til, og at den appellerer til impulskøb. Butikkerne har derimod en klar interesse i ordningen: Når kunderne kan dele betalingen op, køber de i gennemsnit for flere penge.

    Fortalerne fremhæver omvendt, at ordningen kan være en fordel, hvis man bruger den fornuftigt. Har man brug for en ny vaskemaskine, og har man styr på sin økonomi, kan det være bedre at dele betalingen op uden renter end at tage et dyrt lån.

    Eksperterne er enige om, at nøglen er overblik. De anbefaler, at man lægger et budget for hver måned, at man aldrig har mere end én opdelt betaling ad gangen, og at man spørger sig selv, om man ville have købt varen, hvis man skulle betale det hele med det samme. Er svaret nej, er det et tegn på, at man bør lade være.

    Sanne har nu fjernet betalingsløsningen fra sin telefon og lagt et budget i et regneark. "Det er ikke særlig sjovt," indrømmer hun, "men det er rart at vide, hvor pengene bliver af."
  translation: |
    Buy now – pay later

    It looks so easy. You've found a jacket online for twelve hundred kroner, and at the checkout you're offered the option of splitting the payment into four interest-free instalments. One click, and the jacket is on its way. The first instalment is taken straight away, the next three over the following months.

    The payment method, which in English is called "buy now, pay later", has become popular, especially among young people. According to consumer experts, this is because it feels less like borrowing money than a traditional loan. But that is exactly what can be the problem.

    "Many young people don't realise that they're actually taking out credit when they split the payment," says an adviser from a consumer organisation. "It's easy to lose track if you have five or six small payments running at the same time. And if you forget to pay on time, fees can quickly be added on top."

    Sanne, who is twenty-two and studies in Odense, knows the problem. "It started with a pair of trainers. Then came a new phone and a weekend trip with my friends. Each payment was small, so I didn't think about it. But one month I discovered that almost half of my student grant went on repayments." Had she added up all the payments from the start, she would never have ended up there, she says today.

    Critics point out that the payment method makes it too easy to buy things you can't afford and that it encourages impulse buying. The shops, on the other hand, have a clear interest in the scheme: when customers can split the payment, they spend more money on average.

    Supporters, by contrast, stress that the scheme can be an advantage if you use it sensibly. If you need a new washing machine and you have your finances under control, it may be better to split the payment without interest than to take out an expensive loan.

    The experts agree that the key is keeping track. They recommend setting a budget for each month, never having more than one split payment at a time, and asking yourself whether you would have bought the item if you had to pay for it all at once. If the answer is no, it's a sign that you should leave it.

    Sanne has now removed the payment service from her phone and set up a budget in a spreadsheet. "It isn't much fun," she admits, "but it's nice to know where the money goes."
  glossary: |
    en rate | an instalment
    en rente | (an) interest | uden renter = interest-free
    optage en kredit | to take out credit | also: optage et lån
    et overblik | an overview | miste overblikket = lose track
    et gebyr | a fee; a charge
    SU | the Danish state education grant | Statens Uddannelsesstøtte
    et afdrag | a repayment
    en fortaler | a supporter; an advocate
    have styr på | to have under control
    lade være | to refrain; not do it
  questions: |
    mc: According to consumer experts, why is "buy now, pay later" popular with young people? || *It feels less like borrowing money | It is always the cheapest option | Banks recommend it || "…den føles mindre som at låne penge end et traditionelt lån."
    tf: Sanne discovered that almost half of her student grant went on repayments. || true || "…næsten halvdelen af min SU gik til afdrag."
    short: Why do shops like the scheme? || kw: flere penge/more money/spend more/køber for mere/buy more || "Når kunderne kan dele betalingen op, køber de i gennemsnit for flere penge."
    fill: Eksperterne er enige om, at nøglen er ___. || overblik || "Eksperterne er enige om, at nøglen er overblik."
    mc: Which question should you ask yourself, according to the experts? || *Would I have bought it if I had to pay for it all now? | Is it in the sale? | Do my friends have one? || "…om man ville have købt varen, hvis man skulle betale det hele med det samme."
    tf: The experts recommend having several split payments at the same time. || false || They recommend "aldrig … mere end én opdelt betaling ad gangen".

- slug: naar-computeren-laeser-roentgenbilledet
  kind: reading
  title: Når computeren læser røntgenbilledet
  topic: Science and technology
  summary: A report from a hospital X-ray department where artificial intelligence sorts the images first — faster answers for patients, but new questions about training, responsibility and data.
  free: false
  text: |
    Når computeren læser røntgenbilledet

    På røntgenafdelingen på et mellemstort sygehus i Midtjylland bliver der hver dag taget hundredvis af billeder af brækkede arme, lunger og knæ. Tidligere skulle hvert eneste billede gennemgås af en radiolog, og ventetiden på et svar kunne være flere dage. I dag bliver billederne først analyseret af et program med kunstig intelligens.

    "Programmet er blevet trænet på millioner af billeder, og det er utrolig godt til at finde små brud, som et menneske kan overse på en travl dag," forklarer overlæge Anders Vinther. "Men det er stadig en læge, der stiller diagnosen. Computeren er en kollega, ikke en chef."

    Programmet sorterer billederne i tre grupper: dem, der helt sikkert er normale, dem, der helt sikkert viser et brud, og dem, hvor programmet er i tvivl. Billederne i den sidste gruppe bliver prioriteret af lægerne. Dermed bliver der frigjort tid til de svære sager, og patienterne får hurtigere svar.

    Ifølge en evaluering af ordningen er ventetiden på svar faldet fra gennemsnitligt to dage til under fire timer. Samtidig er antallet af oversete brud faldet. Alligevel er ikke alle begejstrede. Nogle radiologer frygter, at de unge læger ikke længere lærer at læse billeder ordentligt, hvis maskinen altid kigger med først. "Det er en reel risiko," indrømmer Anders Vinther. "Derfor skal alle nye læger stadig gennemgå et vist antal billeder uden hjælp fra programmet."

    Der er også etiske spørgsmål. Hvem har ansvaret, hvis computeren tager fejl, og en patient bliver sendt hjem med et overset brud? Og hvad sker der med de mange data, som programmet bliver trænet på? Ifølge sygehusets ledelse bliver alle billeder anonymiseret, før de bliver brugt, og de forlader aldrig regionens servere. Patienterne bliver desuden informeret om, at kunstig intelligens indgår i vurderingen af deres billeder.

    Spørger man patienterne, er de fleste positive. "Jeg var mest glad for, at jeg ikke skulle vente i tre dage på at vide, om min søn havde brækket armen," siger Louise Kragh, der var på skadestuen med sin elleveårige søn i sidste måned. "Men jeg er også glad for, at der stadig sidder et menneske og kigger på det."

    Eksperterne forventer, at kunstig intelligens inden for de næste ti år vil være blevet en fast del af mange afdelinger på danske sygehuse. Spørgsmålet er ikke længere, om teknologien skal bruges, men hvordan.
  translation: |
    When the computer reads the X-ray

    In the X-ray department of a medium-sized hospital in central Jutland, hundreds of images of broken arms, lungs and knees are taken every day. In the past, every single image had to be examined by a radiologist, and the wait for an answer could be several days. Today the images are first analysed by an artificial intelligence program.

    "The program has been trained on millions of images, and it's incredibly good at finding small fractures that a human might overlook on a busy day," explains consultant Anders Vinther. "But it's still a doctor who makes the diagnosis. The computer is a colleague, not a boss."

    The program sorts the images into three groups: those that are definitely normal, those that definitely show a fracture, and those where the program is in doubt. The images in the last group are prioritised by the doctors. This frees up time for the difficult cases, and patients get faster answers.

    According to an evaluation of the scheme, the waiting time for an answer has fallen from an average of two days to under four hours. At the same time, the number of overlooked fractures has fallen. Even so, not everyone is enthusiastic. Some radiologists fear that young doctors will no longer learn to read images properly if the machine always looks first. "That's a real risk," admits Anders Vinther. "That's why all new doctors must still go through a certain number of images without help from the program."

    There are ethical questions too. Who is responsible if the computer makes a mistake and a patient is sent home with an overlooked fracture? And what happens to the huge amounts of data that the program is trained on? According to the hospital's management, all images are anonymised before they are used, and they never leave the region's servers. Patients are also informed that artificial intelligence is part of the assessment of their images.

    If you ask the patients, most are positive. "I was mostly glad that I didn't have to wait three days to find out whether my son had broken his arm," says Louise Kragh, who was in A&E with her eleven-year-old son last month. "But I'm also glad that there's still a human being looking at it."

    The experts expect that within the next ten years artificial intelligence will have become a permanent part of many departments in Danish hospitals. The question is no longer whether the technology should be used, but how.
