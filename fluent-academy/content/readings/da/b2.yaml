- slug: danmark-om-tyve-aar
  kind: listening
  title: Danmark om tyve år
  topic: Looking ahead
  summary: A futurologist speculates on a radio show about work, transport, housing and climate twenty years from now — and admits how often predictions go wrong.
  free: false
  speakers: H=Henriette/f; F=Frederik/m
  text: |
    H: Velkommen til Fremtidsfredag. I dag skal vi kigge tyve år frem sammen med fremtidsforsker Frederik Lund. Velkommen.
    F: Tak. Jeg skal nok prøve ikke at love for meget.
    H: Det er klogt. Men lad os starte med arbejdslivet. Hvordan vil vores arbejdsdag se ud om tyve år?
    F: Jeg tror, at kunstig intelligens til den tid vil have overtaget mange af de rutineprægede opgaver på kontorerne. Til gengæld vil der formentlig mangle hænder i sundhedsvæsenet og i håndværksfagene.
    H: Så det er bedre at blive elektriker end bogholder?
    F: Det er nok lidt for enkelt sagt. Men det er sandsynligt, at mange vil skifte fag flere gange i løbet af deres arbejdsliv.
    H: Hvad med transporten? Kører vi stadig selv bil?
    F: Næppe så meget som i dag. De fleste biler vil være elbiler, og i de store byer vil man sandsynligvis have indført områder helt uden privatbiler.
    H: Mange af vores lyttere bor på landet. Hvad betyder det for dem?
    F: Det er et godt spørgsmål. Hvis der ikke bliver investeret i kollektiv transport, risikerer vi, at afstanden mellem by og land bliver større.
    H: Lad os tale om boliger. Hvordan kommer vi til at bo?
    F: Befolkningen bliver ældre, så jeg tror, at flere vil bo i fællesskaber på tværs af generationer. Om tyve år vil mange parcelhuskvarterer være blevet bygget om.
    H: Nu siger du "vil" meget. Hvor sikker er du egentlig?
    F: Ikke særlig. Fremtidsforskere tager tit fejl. For tyve år siden var der kun få, der forudså, hvor stor en rolle smartphonen ville få i vores liv.
    H: Hvad er så det, du er mest sikker på?
    F: At klimaet vil præge næsten alle beslutninger. Havet vil være steget yderligere, og vi vil have været nødt til at beskytte mange af vores kystbyer.
    H: Er du optimist eller pessimist?
    F: Forsigtig optimist. Danmark har tidligere klaret store omstillinger — fra landbrugsland til industriland og fra kul til vind. Det kan vi også gøre igen.
    H: Og hvad tror du, lytterne vil tænke, hvis de hører det her afsnit om tyve år?
    F: De vil sikkert grine af, hvor meget vi tog fejl. Det må de meget gerne.
    H: Tak, Frederik. Vi ses igen om tyve år.
  translation: |
    Henriette: Welcome to Future Friday. Today we're looking twenty years ahead with futurologist Frederik Lund. Welcome.
    Frederik: Thank you. I'll try not to promise too much.
    Henriette: That's wise. But let's start with working life. What will our working day look like in twenty years?
    Frederik: I think that by then artificial intelligence will have taken over many of the routine tasks in offices. On the other hand, there will probably be a shortage of hands in the health service and in the skilled trades.
    Henriette: So it's better to become an electrician than a bookkeeper?
    Frederik: That's probably putting it a bit too simply. But it's likely that many people will change careers several times during their working lives.
    Henriette: What about transport? Will we still drive our own cars?
    Frederik: Hardly as much as today. Most cars will be electric, and the big cities will probably have introduced areas with no private cars at all.
    Henriette: Many of our listeners live in the countryside. What does that mean for them?
    Frederik: That's a good question. If there isn't investment in public transport, we risk the gap between town and country getting bigger.
    Henriette: Let's talk about housing. How are we going to live?
    Frederik: The population is getting older, so I think more people will live in communities across generations. In twenty years many suburbs of detached houses will have been rebuilt.
    Henriette: You say "will" a lot. How sure are you, actually?
    Frederik: Not very. Futurologists are often wrong. Twenty years ago only a few people foresaw how big a role the smartphone would play in our lives.
    Henriette: So what are you most sure about?
    Frederik: That the climate will shape almost every decision. The sea will have risen further, and we will have had to protect many of our coastal towns.
    Henriette: Are you an optimist or a pessimist?
    Frederik: A cautious optimist. Denmark has managed big transitions before — from an agricultural country to an industrial one, and from coal to wind. We can do it again.
    Henriette: And what do you think listeners will think if they hear this episode in twenty years?
    Frederik: They'll probably laugh at how wrong we were. They're very welcome to.
    Henriette: Thank you, Frederik. See you again in twenty years.
  glossary: |
    en fremtidsforsker | a futurologist
    rutinepræget | routine
    et håndværksfag | a skilled trade
    kollektiv transport | public transport
    på tværs af | across
    bygge om | to rebuild; to convert
    forudse | to foresee | irregular: forudså, har forudset
    præge | to shape; to leave its mark on
    en omstilling | a transition
    tage fejl | to be wrong
  questions: |
    mc: What does Frederik think artificial intelligence will have taken over? || *Routine office tasks | The health service | The skilled trades || "…kunstig intelligens til den tid vil have overtaget mange af de rutineprægede opgaver på kontorerne."
    tf: Frederik is completely sure about his predictions. || false || "Ikke særlig. Fremtidsforskere tager tit fejl."
    short: What is Frederik most sure about? || kw: klima/climate || "At klimaet vil præge næsten alle beslutninger."
    mc: Which risk does he mention for people in the countryside? || *A bigger gap between town and country | Higher house prices | Losing internet access || "…risikerer vi, at afstanden mellem by og land bliver større."
    fill: Frederik kalder sig selv en forsigtig ___. || optimist || "Forsigtig optimist."
    tf: Frederik thinks future listeners will laugh at how wrong they were. || true || "De vil sikkert grine af, hvor meget vi tog fejl."
