- slug: tre-generationer-under-samme-tag
  kind: reading
  title: Tre generationer under samme tag
  topic: Identity and society
  summary: A feature article about an intergenerational co-housing community near Aarhus, where pensioners, young families and children share meals, help and disagreements.
  free: true
  text: |
    Tre generationer under samme tag

    Da Lise og Henrik Juhl fyldte halvfjerds, solgte de deres parcelhus i Silkeborg. "Huset var alt for stort til os to, og vi havde ikke lyst til at sidde alene i en lejlighed," fortæller Lise. I dag bor de i et generationsbofællesskab uden for Aarhus sammen med enogfyrre andre beboere – fra den yngste på otte måneder til den ældste på femogfirs.

    Bofællesskabet består af fireogtyve boliger af forskellig størrelse omkring et stort fælleshus. Hver familie har sin egen lejlighed med køkken og bad, men fire aftener om ugen spiser beboerne sammen i fælleshuset. Madlavningen går på skift, så alle laver mad cirka én gang om måneden.

    "Det var faktisk børnene, der fik os til at flytte hertil," siger Mads Nielsen, som er seksogtredive og far til to. "Vi bor langt fra vores egne forældre, og vi savnede, at børnene havde ældre mennesker omkring sig." Nu har hans døtre fået det, de selv kalder "bonusbedsteforældre". Lise læser højt for dem om tirsdagen, og Henrik har lært dem at spille skak.

    Fællesskabet går begge veje. Da Henrik sidste vinter brækkede hoften, var det naboerne, der handlede ind og kørte ham til genoptræning. "Hvis vi havde boet i vores gamle hus, havde vi været nødt til at bede vores søn om at tage fri fra arbejde," siger Lise.

    Generationsbofællesskaber er blevet populære i Danmark de seneste år, og mange steder er der lange ventelister. Ifølge forskere hænger det sammen med, at flere ældre lever længere og er raske, samtidig med at mange børnefamilier føler sig pressede i hverdagen. Ensomhed er desuden et voksende problem blandt både ældre og unge.

    Det er dog ikke altid nemt at bo så tæt. Beboerne holder fællesmøde en gang om måneden, og her kan diskussionerne blive livlige. "Vi er jo ikke enige om alt," griner Mads. "Skal der være stille i fælleshuset efter klokken ni? Må hunde komme med til fællesspisning? Den slags tager tid at blive enige om." Reglen er, at alle skal høres, og at beslutningerne træffes i fællesskab.

    For Lise handler det om mere end praktisk hjælp. "Når man bliver ældre, risikerer man at blive usynlig. Her bliver jeg spurgt til råds, og jeg kan stadig gøre en forskel for nogen." Hun holder en pause. "Og så lærer jeg noget af de unge. I sidste uge viste en tolvårig mig, hvordan man laver en podcast. Det havde jeg aldrig troet, jeg skulle prøve."
  translation: |
    Three generations under one roof

    When Lise and Henrik Juhl turned seventy, they sold their detached house in Silkeborg. "The house was far too big for the two of us, and we didn't want to sit alone in a flat," says Lise. Today they live in an intergenerational co-housing community outside Aarhus together with forty-one other residents – from the youngest, aged eight months, to the oldest, aged eighty-five.

    The community consists of twenty-four homes of different sizes around a large common house. Each family has its own flat with a kitchen and bathroom, but four evenings a week the residents eat together in the common house. Cooking is done in turns, so everyone cooks about once a month.

    "It was actually the children who made us move here," says Mads Nielsen, who is thirty-six and a father of two. "We live a long way from our own parents, and we missed our children having older people around them." Now his daughters have what they themselves call "bonus grandparents". Lise reads aloud to them on Tuesdays, and Henrik has taught them to play chess.

    The community works both ways. When Henrik broke his hip last winter, it was the neighbours who did his shopping and drove him to rehabilitation. "If we had lived in our old house, we would have had to ask our son to take time off work," says Lise.

    Intergenerational co-housing has become popular in Denmark in recent years, and in many places there are long waiting lists. According to researchers, this is because more older people live longer and stay healthy, while many families with children feel under pressure in their everyday lives. Loneliness is also a growing problem among both old and young people.

    It isn't always easy to live so closely, though. The residents hold a joint meeting once a month, and the discussions can get lively. "We don't agree on everything, of course," laughs Mads. "Should the common house be quiet after nine o'clock? Can dogs come to communal dinners? Things like that take time to agree on." The rule is that everyone must be heard and that decisions are made together.

    For Lise it is about more than practical help. "When you get older, you risk becoming invisible. Here I'm asked for advice, and I can still make a difference for someone." She pauses. "And I learn something from the young ones. Last week a twelve-year-old showed me how to make a podcast. I never thought I'd try that."
  glossary: |
    et generationsbofællesskab | an intergenerational co-housing community | young and old live in separate homes but share a common house
    et parcelhus | a detached house | typical of Danish suburbs
    et fælleshus | a common house
    på skift | in turns
    en bonusbedsteforælder | a "bonus" grandparent | not related by blood
    en genoptræning | rehabilitation; physiotherapy after illness
    en ensomhed | loneliness
    træffe en beslutning | to make a decision | passive: beslutningen træffes
    spørge nogen til råds | to ask someone for advice
    usynlig | invisible
