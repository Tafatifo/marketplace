- slug: lyset-i-skagen
  kind: reading
  title: Lyset i Skagen
  topic: Arts and culture
  summary: Why a group of painters gathered in Skagen in the late 1800s — the light, the wish to paint real life, Anna Ancher's special place, and the museum they founded.
  free: false
  text: |
    Lyset i Skagen

    Helt oppe på Danmarks nordspids ligger Skagen, hvor Skagerrak og Kattegat mødes ved Grenen. I slutningen af 1800-tallet blev den lille fiskerby et samlingssted for en gruppe kunstnere, der i dag er kendt som Skagensmalerne. Hvad var det, der trak dem herop – så langt fra hovedstadens akademi og saloner?

    Svaret er først og fremmest lyset. Fordi Skagen er omgivet af hav på tre sider, får byen et særligt klart lys, der kastes tilbage fra vandet og det hvide sand. Om sommeren bliver aftenerne lange, og i den såkaldte blå time efter solnedgang flyder himmel og hav sammen i blålige nuancer. Malerne ville fange netop dette lys, og de malede ofte udendørs i stedet for i et atelier.

    Samtidig ønskede de at skildre virkeligheden, som den var. Hvor tidligere generationer havde malet idealiserede landskaber og historiske scener, malede Skagensmalerne fiskere, der trak både op på stranden, og kvinder, der arbejdede i køkkenet. Michael Ancher blev især kendt for sine dramatiske billeder af fiskere og redningsmænd, mens P.S. Krøyer malede lyse sommerscener med elegant klædte mennesker på stranden.

    Anna Ancher indtager en særlig plads i gruppen. Hun var den eneste af de kendte malere, der var født i Skagen, og hun voksede op på Brøndums Hotel, hvor hendes forældre var værter for de besøgende kunstnere. Hun giftede sig med Michael Ancher og fortsatte med at male, selvom det var usædvanligt for en gift kvinde på den tid. Hendes billeder af stuer, hvor sollyset falder ind gennem vinduet, regnes i dag blandt de fineste i dansk kunst.

    Kunstnerne arbejdede ikke kun – de festede også. På Brøndums Hotel mødtes de til lange middage med sang, taler og diskussioner om kunst, og flere af festerne blev selv motiver i malerierne. Mange af gæsterne kom fra Norge og Sverige, så kunstnerkolonien var et skandinavisk fællesskab.

    I 1908 grundlagde kunstnerne og deres venner Skagens Museum, så værkerne kunne blive i byen. I dag besøges museet hvert år af mange tusinde gæster, og Skagen er blevet et af Danmarks mest populære turistmål. Men den, der står ved Grenen en stille sommeraften, kan stadig opleve det lys, som for over hundrede år siden fik en gruppe unge kunstnere til at slå sig ned i en lille fiskerby på toppen af Jylland.
  translation: |
    The light in Skagen

    At the very northern tip of Denmark lies Skagen, where the Skagerrak and the Kattegat meet at Grenen. In the late 1800s the small fishing town became a meeting place for a group of artists who are known today as the Skagen Painters. What was it that drew them up here – so far from the capital's academy and salons?

    The answer is, above all, the light. Because Skagen is surrounded by sea on three sides, the town gets a particularly clear light that is reflected from the water and the white sand. In summer the evenings are long, and in the so-called blue hour after sunset, sky and sea merge in bluish shades. The painters wanted to capture precisely this light, and they often painted outdoors instead of in a studio.

    At the same time, they wanted to depict reality as it was. Where earlier generations had painted idealised landscapes and historical scenes, the Skagen Painters painted fishermen pulling boats up onto the beach and women working in the kitchen. Michael Ancher became known in particular for his dramatic pictures of fishermen and lifeboatmen, while P.S. Krøyer painted bright summer scenes with elegantly dressed people on the beach.

    Anna Ancher holds a special place in the group. She was the only one of the well-known painters who was born in Skagen, and she grew up at Brøndums Hotel, where her parents were hosts to the visiting artists. She married Michael Ancher and continued to paint, even though that was unusual for a married woman at the time. Her pictures of living rooms where sunlight falls in through the window are today counted among the finest in Danish art.

    The artists didn't only work – they partied too. At Brøndums Hotel they met for long dinners with songs, speeches and discussions about art, and several of the parties themselves became subjects of the paintings. Many of the guests came from Norway and Sweden, so the artists' colony was a Scandinavian community.

    In 1908 the artists and their friends founded Skagens Museum so that the works could stay in the town. Today the museum is visited by many thousands of guests every year, and Skagen has become one of Denmark's most popular tourist destinations. But anyone who stands at Grenen on a quiet summer evening can still experience the light that, more than a hundred years ago, made a group of young artists settle in a small fishing town at the top of Jutland.
  glossary: |
    et samlingssted | a meeting place
    et atelier | a studio (of an artist)
    skildre | to depict; to portray
    idealiseret | idealised
    en redningsmand | a lifeboatman; a rescuer
    en vært | a host
    indtage en særlig plads | to hold a special place
    usædvanlig | unusual
    grundlægge | to found | irregular: grundlagde, har grundlagt
    slå sig ned | to settle
  questions: |
    mc: What drew the artists to Skagen above all? || *The light | Cheap houses | The academy || "Svaret er først og fremmest lyset."
    tf: Anna Ancher was born in Copenhagen. || false || "Hun var den eneste af de kendte malere, der var født i Skagen."
    short: What did Michael Ancher become known for? || kw: fiskere/fishermen/redningsmænd/lifeboat/rescue || "…dramatiske billeder af fiskere og redningsmænd."
    fill: Skagens Museum blev grundlagt i ___. || 1908 || "I 1908 grundlagde kunstnerne og deres venner Skagens Museum."
    mc: Why was it remarkable that Anna Ancher kept painting? || *It was unusual for a married woman at the time | She painted only at night | She had never had lessons || "…selvom det var usædvanligt for en gift kvinde på den tid."
    tf: All the artists in the colony were Danish. || false || "Mange af gæsterne kom fra Norge og Sverige."

- slug: tilbuddet-paa-det-nye-koekken
  kind: listening
  title: Tilbuddet på det nye køkken
  topic: Work and the economy
  summary: Maja negotiates the price of a new kitchen with Kim, a carpenter — cutting costs, setting conditions and agreeing on payment.
  free: true
  speakers: K=Kim/m; M=Maja/f
  text: |
    K: Goddag, Maja. Jeg har regnet på køkkenet, og jeg har tilbuddet med her.
    M: Tak, fordi du kom forbi. Jeg må indrømme, at jeg er lidt nervøs for prisen.
    K: Det forstår jeg godt. Samlet set lander det på hundrede og tyve tusind kroner inklusive moms.
    M: Hundrede og tyve tusind? Det er en del mere, end vi havde regnet med.
    K: Ja, men så er alt med: nye skabe, bordplade, montering og bortskaffelse af det gamle køkken.
    M: Jeg havde egentlig håbet på at komme ned omkring de hundrede tusind. Er der noget, vi kan skære fra?
    K: Vi kunne beholde de gamle hvidevarer. Køleskabet og ovnen er jo kun et par år gamle.
    M: Det er en god idé. Hvor meget ville det spare?
    K: Omkring otte tusind, fordi jeg så ikke skal bestille og tilslutte nye.
    M: Og bordpladen? Ville det være muligt at vælge en billigere type end massiv eg?
    K: Det kan sagtens lade sig gøre. En laminatplade koster cirka det halve, men den holder ikke helt så længe.
    M: Hvis vi vælger laminat, kan vi så stadig få en nedfældet vask?
    K: Ja, det kan vi godt. Så er vi nede på omkring hundrede og fem tusind.
    M: Det er tættere på. Hvad med selve arbejdet? Kunne I gøre det billigere, hvis vi selv river det gamle køkken ned?
    K: Det kunne vi godt, forudsat at det er gjort, inden vi kommer. Ellers bliver vi forsinket på andre opgaver.
    M: Min bror er tømrer, så det klarer vi på en weekend. Hvor meget sparer vi så?
    K: Lad os sige fire tusind. Så lander vi på hundrede og et tusind.
    M: Kan vi ikke runde ned til hundrede tusind? Så har vi en aftale i dag.
    K: Hm. Hvis du kan leve med, at vi først starter i uge ti, kan jeg godt gå med til det.
    M: Uge ti er fint. Vi skal alligevel ikke have gæster før til påske.
    K: Så har vi en aftale. Jeg sender et nyt tilbud på mail i aften med alle ændringerne.
    M: Perfekt. Og betalingen — skal vi betale noget på forhånd?
    K: Vi tager en tredjedel, når materialerne bliver leveret, og resten, når køkkenet er færdigt og godkendt.
    M: Det lyder rimeligt. Hvad sker der, hvis der opstår problemer undervejs, for eksempel med rørene?
    K: Så ringer jeg til dig, før vi gør noget. Du får aldrig en regning for ekstraarbejde, du ikke har sagt ja til.
    M: Det er rart at høre. Havde jeg vidst, at det var så nemt at forhandle med dig, havde jeg ringet for et år siden.
    K: Ha, det tager jeg som en kompliment. Vi ses i uge ti.
  translation: |
    Kim: Hello, Maja. I've worked out the figures for the kitchen, and I've brought the quote with me.
    Maja: Thanks for coming by. I have to admit I'm a bit nervous about the price.
    Kim: I understand. All in all, it comes to a hundred and twenty thousand kroner including VAT.
    Maja: A hundred and twenty thousand? That's quite a bit more than we'd expected.
    Kim: Yes, but then everything's included: new cupboards, worktop, fitting and disposal of the old kitchen.
    Maja: I'd actually hoped to get down to around a hundred thousand. Is there anything we can cut?
    Kim: We could keep the old appliances. The fridge and the oven are only a couple of years old, after all.
    Maja: That's a good idea. How much would that save?
    Kim: About eight thousand, because then I don't have to order and connect new ones.
    Maja: And the worktop? Would it be possible to choose a cheaper type than solid oak?
    Kim: That's no problem. A laminate worktop costs about half, but it doesn't last quite as long.
    Maja: If we choose laminate, can we still have an undermounted sink?
    Kim: Yes, we can. Then we're down to about a hundred and five thousand.
    Maja: That's closer. What about the work itself? Could you do it more cheaply if we tear out the old kitchen ourselves?
    Kim: We could, provided it's done before we arrive. Otherwise we'll be delayed on other jobs.
    Maja: My brother is a carpenter, so we'll manage it in a weekend. How much do we save then?
    Kim: Let's say four thousand. Then we land at a hundred and one thousand.
    Maja: Can't we round it down to a hundred thousand? Then we have a deal today.
    Kim: Hm. If you can live with us not starting until week ten, I can agree to that.
    Maja: Week ten is fine. We're not having guests until Easter anyway.
    Kim: Then we have a deal. I'll email you a new quote this evening with all the changes.
    Maja: Perfect. And the payment — do we need to pay anything in advance?
    Kim: We take a third when the materials are delivered, and the rest when the kitchen is finished and approved.
    Maja: That sounds reasonable. What happens if problems come up along the way, with the pipes for example?
    Kim: Then I'll call you before we do anything. You'll never get a bill for extra work you haven't agreed to.
    Maja: That's good to hear. Had I known it was so easy to negotiate with you, I'd have called a year ago.
    Kim: Ha, I'll take that as a compliment. See you in week ten.
  glossary: |
    et tilbud | a quote; an offer
    moms | VAT
    bortskaffelse | disposal
    hvidevarer | household appliances | fridges, ovens, washing machines
    en bordplade | a worktop
    tilslutte | to connect
    rive ned | to tear out; to pull down
    runde ned | to round down
    undervejs | along the way
    en regning | a bill
  questions: |
    mc: What was the first price Kim gave? || *120,000 kroner | 100,000 kroner | 105,000 kroner || "…det lander på hundrede og tyve tusind kroner inklusive moms."
    tf: Maja agrees to keep the old fridge and oven. || true || She answers "Det er en god idé." to keeping the old appliances.
    short: Who will tear out the old kitchen? || kw: bror/brother || "Min bror er tømrer, så det klarer vi på en weekend."
    mc: What does Maja accept in return for the round price of 100,000 kroner? || *A start in week ten | Paying everything in advance | An oak worktop || "Hvis du kan leve med, at vi først starter i uge ti, kan jeg godt gå med til det."
    fill: De betaler en ___, når materialerne bliver leveret. || tredjedel || "Vi tager en tredjedel, når materialerne bliver leveret."
    tf: Kim can charge for extra work without asking Maja first. || false || "Du får aldrig en regning for ekstraarbejde, du ikke har sagt ja til."

- slug: kan-vi-spise-os-til-et-bedre-klima
  kind: listening
  title: Kan vi spise os til et bedre klima?
  topic: Environment
  summary: A radio interview with a food researcher about the climate footprint of what we eat — meat, local tomatoes, food waste and what dinner might look like in twenty years.
  free: false
  speakers: R=Rasmus/m; N=Nadia/f
  text: |
    R: Velkommen til Klimaminuttet. I studiet har jeg Nadia Bak, der forsker i fødevarer og klima. Velkommen, Nadia.
    N: Tak, Rasmus. Det er dejligt at være her.
    R: Lad os starte med det store spørgsmål: Hvor stor en del af vores klimaaftryk kommer egentlig fra maden?
    N: For en gennemsnitlig dansker er det omkring en fjerdedel. Så maden betyder faktisk ret meget.
    R: Og hvad er den vigtigste ændring, man kan lave i sin egen hverdag?
    N: Det er at spise mindre kød fra drøvtyggere, altså okse og lam. De udleder metan, som er en meget kraftig drivhusgas.
    R: Så det er ikke nødvendigt at blive vegetar?
    N: Nej, slet ikke. Hvis alle danskere halverede deres forbrug af oksekød, ville det gøre en større forskel, end hvis nogle få blev vegetarer.
    R: Mange lyttere skriver til os, at det er dyrt at spise grønt. Er det rigtigt?
    N: Det kommer an på, hvad man køber. Bønner, linser og kål er nogle af de billigste fødevarer, der findes. Til gengæld kan færdigretter med plantebaseret kød være ret dyre.
    R: Hvad med lokale varer? Er det ikke altid bedre at købe danske tomater end spanske?
    N: Ikke nødvendigvis. Transporten udgør kun en lille del af klimaaftrykket. Tomater fra et opvarmet drivhus i Danmark kan faktisk have et større aftryk end tomater, der er dyrket på friland i Spanien.
    R: Det vil nok overraske mange. Hvad med madspild?
    N: Det er et af de nemmeste steder at starte. Danske husstande smider stadig en hel del spiselig mad ud hvert år. Hvis man planlægger sine indkøb og bruger sine rester, sparer man både penge og udledninger.
    R: Du har selv børn. Hvordan gør I derhjemme?
    N: Vi har to kødfri dage om ugen, og børnene får lov til at vælge en ny grøntsag hver uge. Det har gjort dem langt mere nysgerrige.
    R: Og hvad siger de til det?
    N: De protesterede lidt i starten. Men nu er det dem, der minder mig om, at det er torsdag, og at der ikke skal være kød på bordet.
    R: Til sidst: Tror du, at vi spiser helt anderledes om tyve år?
    N: Ja, det tror jeg. Jeg tror ikke, at kødet forsvinder, men til den tid vil det være blevet mere et festmåltid end hverdagsmad.
    R: Tak, fordi du kom, Nadia.
    N: Selv tak.
  translation: |
    Rasmus: Welcome to Climate Minute. In the studio I have Nadia Bak, who researches food and climate. Welcome, Nadia.
    Nadia: Thank you, Rasmus. It's lovely to be here.
    Rasmus: Let's start with the big question: how much of our climate footprint actually comes from food?
    Nadia: For an average Dane it's about a quarter. So food actually matters quite a lot.
    Rasmus: And what is the most important change you can make in your own everyday life?
    Nadia: Eating less meat from ruminants, that is, beef and lamb. They emit methane, which is a very powerful greenhouse gas.
    Rasmus: So it isn't necessary to become a vegetarian?
    Nadia: No, not at all. If all Danes halved their consumption of beef, it would make a bigger difference than if a few people became vegetarians.
    Rasmus: Many listeners write to us that it's expensive to eat green. Is that true?
    Nadia: It depends on what you buy. Beans, lentils and cabbage are some of the cheapest foods there are. On the other hand, ready meals with plant-based meat can be quite expensive.
    Rasmus: What about local produce? Isn't it always better to buy Danish tomatoes than Spanish ones?
    Nadia: Not necessarily. Transport makes up only a small part of the climate footprint. Tomatoes from a heated greenhouse in Denmark can actually have a bigger footprint than tomatoes grown outdoors in Spain.
    Rasmus: That will probably surprise many people. What about food waste?
    Nadia: That's one of the easiest places to start. Danish households still throw away a good deal of edible food every year. If you plan your shopping and use your leftovers, you save both money and emissions.
    Rasmus: You have children yourself. What do you do at home?
    Nadia: We have two meat-free days a week, and the children get to choose a new vegetable every week. It has made them much more curious.
    Rasmus: And what do they say about it?
    Nadia: They protested a bit at first. But now they're the ones who remind me that it's Thursday and that there shouldn't be meat on the table.
    Rasmus: Finally: do you think we'll eat completely differently in twenty years?
    Nadia: Yes, I do. I don't think meat will disappear, but by then it will have become more of a festive meal than everyday food.
    Rasmus: Thank you for coming, Nadia.
    Nadia: You're welcome.
  glossary: |
    et klimaaftryk | a climate footprint
    en drøvtygger | a ruminant | cows, sheep, goats
    metan | methane
    halvere | to halve
    en færdigret | a ready meal
    på friland | outdoors; in open fields
    et drivhus | a greenhouse
    madspild | food waste
    en husstand | a household
    en rest | a leftover
  questions: |
    mc: According to Nadia, how much of an average Dane's climate footprint comes from food? || *About a quarter | About half | Almost nothing || "For en gennemsnitlig dansker er det omkring en fjerdedel."
    tf: Nadia says that everybody must become vegetarian. || false || "Nej, slet ikke." Halving beef consumption would matter more.
    short: Name one cheap plant food that Nadia mentions. || kw: bønner/beans/linser/lentils/kål/cabbage || "Bønner, linser og kål er nogle af de billigste fødevarer."
    mc: Why can Danish tomatoes have a bigger footprint than Spanish ones? || *They are grown in heated greenhouses | They travel further | They are sold in plastic || "Tomater fra et opvarmet drivhus i Danmark kan faktisk have et større aftryk…"
    fill: Nadias familie har to ___ dage om ugen. || kødfri || "Vi har to kødfri dage om ugen."
    tf: Nadia thinks meat will disappear completely within twenty years. || false || "Jeg tror ikke, at kødet forsvinder."

- slug: domsmand-for-foerste-gang
  kind: listening
  title: Domsmand for første gang
  topic: Citizenship and public life
  summary: In a podcast about citizenship, a bus driver from Odense describes being selected as a lay judge — the letter, the first case, the responsibility and what he learned.
  free: false
  speakers: P=Pia/f; T=Thomas/m
  text: |
    P: Velkommen til Borgerlyd, podcasten om at være borger i Danmark. I dag har jeg besøg af Thomas, der er buschauffør i Odense — og domsmand.
    T: Hej, Pia. Tak for invitationen.
    P: Thomas, hvordan blev du egentlig domsmand?
    T: Jeg fik et brev fra kommunen, hvor der stod, at jeg var blevet udtaget. Først troede jeg, det var en fejl.
    P: Kunne du have sagt nej?
    T: Det er en borgerpligt, så man kan kun blive fritaget, hvis man har en god grund. Og jeg havde faktisk lyst til at prøve det.
    P: Hvordan var den første dag i retten?
    T: Jeg var ret nervøs. Vi var to domsmænd og en dommer, og sagen handlede om et indbrud i et sommerhus.
    P: Hvor tit bliver man egentlig indkaldt?
    T: Man står på listen i fire år, og jeg er blevet indkaldt tre eller fire gange om året. Det er til at overskue.
    P: Hvad havde du på den første dag? Er der regler for påklædning?
    T: Nej, men jeg tog en pæn skjorte på. Det føltes rigtigt, når man skal være med til at afgøre andre menneskers fremtid.
    P: Hvad var din rolle helt konkret?
    T: Vi lyttede til anklageren, forsvareren, den tiltalte og vidnerne. Bagefter trak vi os tilbage og drøftede sagen med dommeren.
    P: Har domsmændene lige så meget at sige som dommeren?
    T: Ja, faktisk. Vi stemmer både om skyldsspørgsmålet og om straffen, og vores stemmer tæller lige så meget som dommerens.
    P: Det er et stort ansvar. Var det svært?
    T: Ja. Dommeren forklarede reglerne grundigt, men det var os, der skulle vurdere, om vi troede på vidnerne. Jeg lå vågen hele den nat.
    P: Må du fortælle, hvad I besluttede?
    T: Dommen er offentlig, men det, vi sagde til hinanden under drøftelserne, har jeg tavshedspligt om. Det skal man respektere.
    P: Hvad har du lært af det?
    T: At retssystemet er mere menneskeligt, end jeg troede. Dommeren lyttede virkelig til os, og vi var tre meget forskellige mennesker med forskellige erfaringer.
    P: Hvad sagde din arbejdsgiver til, at du skulle have fri?
    T: Ingen problemer. Arbejdsgiveren har ikke lov til at nægte én fri, og jeg får et vederlag for hver retsdag.
    P: Ville du anbefale andre at sige ja?
    T: Helt klart. Hvis jeg ikke havde prøvet det, ville jeg aldrig have forstået, hvor meget almindelige borgere betyder i retssystemet.
    P: Tak, Thomas. Og til jer, der lytter: I næste uge handler det om, hvordan man stemmer til kommunalvalg.
  translation: |
    Pia: Welcome to Borgerlyd, the podcast about being a citizen in Denmark. Today I'm joined by Thomas, who is a bus driver in Odense — and a lay judge.
    Thomas: Hi, Pia. Thanks for having me.
    Pia: Thomas, how did you actually become a lay judge?
    Thomas: I got a letter from the municipality saying that I had been selected. At first I thought it was a mistake.
    Pia: Could you have said no?
    Thomas: It's a civic duty, so you can only be exempted if you have a good reason. And I actually wanted to try it.
    Pia: What was the first day in court like?
    Thomas: I was quite nervous. There were two lay judges and one judge, and the case was about a burglary in a summer house.
    Pia: How often are you actually called in?
    Thomas: You're on the list for four years, and I've been called in three or four times a year. It's manageable.
    Pia: What did you wear on the first day? Are there rules about what to wear?
    Thomas: No, but I put on a smart shirt. It felt right when you're helping to decide other people's future.
    Pia: What was your role, exactly?
    Thomas: We listened to the prosecutor, the defence lawyer, the defendant and the witnesses. Afterwards we withdrew and discussed the case with the judge.
    Pia: Do the lay judges have as much say as the judge?
    Thomas: Yes, actually. We vote both on the question of guilt and on the sentence, and our votes count just as much as the judge's.
    Pia: That's a big responsibility. Was it difficult?
    Thomas: Yes. The judge explained the rules thoroughly, but it was us who had to decide whether we believed the witnesses. I lay awake all that night.
    Pia: Are you allowed to say what you decided?
    Thomas: The verdict is public, but what we said to each other during the discussions is confidential. You have to respect that.
    Pia: What have you learned from it?
    Thomas: That the legal system is more human than I thought. The judge really listened to us, and we were three very different people with different experiences.
    Pia: What did your employer say about you needing time off?
    Thomas: No problem. Employers aren't allowed to refuse you time off, and I get a fee for every day in court.
    Pia: Would you recommend others to say yes?
    Thomas: Definitely. If I hadn't tried it, I would never have understood how much ordinary citizens matter in the legal system.
    Pia: Thank you, Thomas. And to all of you listening: next week is about how to vote in local elections.
