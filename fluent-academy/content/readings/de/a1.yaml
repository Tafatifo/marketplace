- slug: im-schuhgeschaeft
  kind: listening
  title: Im Schuhgeschäft
  topic: Shopping
  summary: Julia buys a pair of trainers — she asks for her size and another colour, tries them on and pays.
  free: false
  speakers: V=Der Verkäufer/m; J=Julia/f
  text: |
    V: Guten Tag! Kann ich Ihnen helfen?
    J: Ja, bitte. Ich suche Sportschuhe.
    V: Welche Größe haben Sie?
    J: Größe neununddreißig.
    V: Wie finden Sie diese Schuhe hier?
    J: Hm, die Farbe ist nicht so schön. Haben Sie die Schuhe auch in Blau?
    V: Ja, Moment… Hier, in Blau und in Größe neununddreißig.
    J: Danke. Kann ich die Schuhe anprobieren?
    V: Natürlich.
    J: Oh, sie sind ein bisschen zu klein.
    V: Hier ist Größe vierzig.
    J: Ja, die passen gut! Wie viel kosten sie?
    V: Neunundfünfzig Euro neunzig. Sie sind heute im Angebot.
    J: Super, dann nehme ich die Schuhe. Kann ich mit Karte bezahlen?
    V: Ja, gern. Die Kasse ist dort vorne.
  translation: |
    Sales assistant: Hello! Can I help you?
    Julia: Yes, please. I'm looking for trainers.
    Sales assistant: What size are you?
    Julia: Size thirty-nine.
    Sales assistant: What do you think of these shoes here?
    Julia: Hm, the colour isn't so nice. Do you have the shoes in blue too?
    Sales assistant: Yes, one moment… Here, in blue and in size thirty-nine.
    Julia: Thanks. Can I try the shoes on?
    Sales assistant: Of course.
    Julia: Oh, they're a bit too small.
    Sales assistant: Here's size forty.
    Julia: Yes, these fit well! How much are they?
    Sales assistant: Fifty-nine euros ninety. They're on special offer today.
    Julia: Great, then I'll take the shoes. Can I pay by card?
    Sales assistant: Yes, of course. The till is over there at the front.
