  free: false
  speakers: R=Rosa/f; I=Der Mitarbeiter/m
  text: |
    R: Entschuldigung, wann fährt der nächste Zug nach Heidelberg?
    I: Um elf Uhr zwanzig, von Gleis acht.
    R: Muss ich umsteigen?
    I: Ja, Sie müssen in Mannheim umsteigen.
    R: Und wann komme ich in Heidelberg an?
    I: Um zwölf Uhr fünf.
    R: Danke. Wo kann ich eine Fahrkarte kaufen?
    I: Am Automaten dort drüben.
    R: Und gibt es hier ein Café? Ich habe noch Zeit.
    I: Ja. Gehen Sie hier geradeaus und dann rechts. Das Café ist neben der Apotheke.
    R: Vielen Dank!
    I: Gern. Gute Reise!
  translation: |
    Rosa: Excuse me, when does the next train to Heidelberg leave?
    Staff member: At 11:20, from platform eight.
    Rosa: Do I have to change?
    Staff member: Yes, you have to change in Mannheim.
    Rosa: And when do I arrive in Heidelberg?
    Staff member: At 12:05.
    Rosa: Thanks. Where can I buy a ticket?
    Staff member: At the machine over there.
    Rosa: And is there a café here? I still have time.
    Staff member: Yes. Go straight on here and then right. The café is next to the pharmacy.
    Rosa: Thank you very much!
    Staff member: You're welcome. Have a good trip!
  glossary: |
    der nächste Zug | the next train
    das Gleis | platform; track
    umsteigen | to change (trains) | Separable: Ich steige in Mannheim um.
    ankommen | to arrive | Separable: Ich komme um zwölf an.
    der Automat | (ticket) machine
    dort drüben | over there
    neben | next to
    Gute Reise! | Have a good trip!
  questions: |
    mc: Which platform does the train leave from? || 4 | *8 | 18 || "Um elf Uhr zwanzig, von Gleis acht."
    fill: Rosa muss in ___ umsteigen. || Mannheim || "Ja, Sie müssen in Mannheim umsteigen."
    mc: When does Rosa arrive in Heidelberg? || 11:20 | *12:05 | 12:50 || "Um zwölf Uhr fünf" = 12:05. The train leaves at 11:20.
    tf: Rosa can buy a ticket at a machine. || true || "Am Automaten dort drüben."
    short: Where is the café? || kw: apotheke/pharmacy/rechts/right || "Gehen Sie hier geradeaus und dann rechts. Das Café ist neben der Apotheke."
