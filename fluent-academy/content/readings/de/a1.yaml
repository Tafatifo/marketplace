- slug: postkarte-aus-hamburg
  kind: reading
  title: Eine Postkarte aus Hamburg
  topic: Free time, weather and travel
  summary: Mia writes a postcard to her grandparents about her short trip to Hamburg — where she is staying, the weather and what she is doing.
  free: false
  text: |
    Liebe Oma, lieber Opa,

    viele Grüße aus Hamburg! Ich bin mit Leon hier, wir bleiben bis Sonntag. Wir wohnen in einer Jugendherberge am Hafen. Das Zimmer ist klein, aber das Frühstück ist super.

    Das Wetter ist typisch für Hamburg: Am Morgen regnet es oft, aber am Nachmittag scheint manchmal die Sonne. Es sind nur fünfzehn Grad und es ist sehr windig!

    Hamburg ist toll. Wir fahren viel mit der U-Bahn und mit dem Schiff. Leon kauft jeden Tag ein Fischbrötchen. Ich esse keinen Fisch, aber die Franzbrötchen hier sind sehr lecker!

    Am Sonntag wollen wir sehr früh aufstehen, denn dann ist Fischmarkt. Am Nachmittag müssen wir leider schon zurückfahren.

    Bis bald!
    Eure Mia
  translation: |
    Dear Grandma, dear Grandpa,

    greetings from Hamburg! I'm here with Leon; we're staying until Sunday. We're staying in a youth hostel by the harbour. The room is small, but the breakfast is great.

    The weather is typical for Hamburg: in the morning it often rains, but in the afternoon the sun sometimes shines. It's only fifteen degrees and it's very windy!

    Hamburg is great. We travel a lot by underground and by boat. Leon buys a fish roll every day. I don't eat fish, but the Franzbrötchen here are delicious!

    On Sunday we want to get up very early, because that's when the fish market is on. In the afternoon, unfortunately, we already have to go back.

    See you soon!
    Love, Mia
  glossary: |
    die Jugendherberge | youth hostel
    der Hafen | harbour; port
    windig | windy
    das Schiff | ship; boat | In Hamburg, harbour ferries are part of public transport.
    das Fischbrötchen | fish roll | A bread roll with fish — a typical snack in northern Germany.
    das Franzbrötchen | cinnamon pastry | A sweet speciality from Hamburg.
    denn | because
    der Fischmarkt | fish market | Hamburg's famous market takes place early on Sunday mornings.
    zurückfahren | to travel back | Separable: Wir fahren am Sonntag zurück.
  questions: |
    mc: Where are Mia and Leon staying? || In a hotel in the centre | *In a youth hostel by the harbour | At their grandparents' house || "Wir wohnen in einer Jugendherberge am Hafen."
    fill: Es sind nur ___ Grad. || fünfzehn / fuenfzehn / 15 || "Es sind nur fünfzehn Grad und es ist sehr windig!"
    tf: Leon buys a fish roll every day. || true || "Leon kauft jeden Tag ein Fischbrötchen."
    mc: Why do they want to get up very early on Sunday? || *To go to the fish market | To catch an early train | To have breakfast at the hostel || "Am Sonntag wollen wir sehr früh aufstehen, denn dann ist Fischmarkt."
    short: How do Mia and Leon get around in Hamburg? || kw: u-bahn/underground/subway/schiff/ship/boat/ferry || "Wir fahren viel mit der U-Bahn und mit dem Schiff."

- slug: der-erste-tag-im-kurs
  kind: listening
  title: Der erste Tag im Deutschkurs
  topic: Greetings and introductions
  summary: On the first morning of a German course in Mainz, the teacher welcomes two new students and asks them about themselves.
  free: true
  speakers: S=Frau Schröder/f; M=Marco/m; Y=Yuki/f
  text: |
    S: Guten Morgen und herzlich willkommen im Deutschkurs!
    S: Ich heiße Anna Schröder. Ich bin Ihre Lehrerin.
    S: Und wie heißen Sie?
    M: Guten Morgen! Ich heiße Marco Bianchi.
    S: Woher kommen Sie, Herr Bianchi?
    M: Ich komme aus Italien, aus Turin.
    S: Und wo wohnen Sie jetzt?
    M: Jetzt wohne ich hier in Mainz.
    S: Danke. Und Sie?
    Y: Hallo! Mein Name ist Yuki Tanaka.
    Y: Ich bin Studentin und komme aus Japan.
    S: Wie schreibt man Tanaka?
    Y: T – A – N – A – K – A.
    S: Danke! Und welche Sprachen sprechen Sie?
    Y: Japanisch, Englisch und ein bisschen Deutsch.
    S: Sehr gut! Dann fangen wir an.
  translation: |
    Ms Schröder: Good morning and welcome to the German course!
    Ms Schröder: My name is Anna Schröder. I'm your teacher.
    Ms Schröder: And what's your name?
    Marco: Good morning! My name is Marco Bianchi.
    Ms Schröder: Where do you come from, Mr Bianchi?
    Marco: I come from Italy, from Turin.
    Ms Schröder: And where do you live now?
    Marco: Now I live here in Mainz.
    Ms Schröder: Thank you. And you?
    Yuki: Hello! My name is Yuki Tanaka.
    Yuki: I'm a student and I come from Japan.
    Ms Schröder: How do you spell Tanaka?
    Yuki: T – A – N – A – K – A.
    Ms Schröder: Thank you! And which languages do you speak?
    Yuki: Japanese, English and a little German.
    Ms Schröder: Very good! Then let's begin.
  glossary: |
