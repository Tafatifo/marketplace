- slug: was-machen-wir-am-wochenende
  kind: listening
  title: Was machen wir am Wochenende?
  topic: Free time and weather
  summary: Two flatmates check the weather forecast and change their weekend plans.
  free: false
  speakers: N=Nils/m; S=Selin/f
  text: |
    N: Selin, hast du am Samstag Zeit?
    S: Ja, warum?
    N: Ich möchte wandern. Kommst du mit?
    S: Hm, wie ist das Wetter am Samstag?
    N: Am Samstag regnet es leider. Es sind nur zehn Grad.
    S: Dann wandern wir nicht! Ich mag Regen nicht.
    N: Und am Sonntag? Am Sonntag ist es sonnig und warm.
    S: Am Vormittag treffe ich meine Schwester. Aber am Nachmittag habe ich Zeit.
    N: Super! Dann fahren wir mit dem Rad an den See. Wir können schwimmen!
    S: Gute Idee! Und am Samstag?
    N: Am Samstag sehen wir zu Hause einen Film. Ich koche!
    S: Perfekt. Und ich mache einen Kuchen.
  translation: |
    Nils: Selin, are you free on Saturday?
    Selin: Yes, why?
    Nils: I'd like to go hiking. Are you coming along?
    Selin: Hm, what's the weather like on Saturday?
    Nils: Unfortunately it's going to rain on Saturday. It'll only be ten degrees.
    Selin: Then we won't go hiking! I don't like rain.
    Nils: And on Sunday? On Sunday it's going to be sunny and warm.
    Selin: In the morning I'm meeting my sister. But in the afternoon I'm free.
    Nils: Great! Then we'll cycle to the lake. We can go swimming!
    Selin: Good idea! And on Saturday?
    Nils: On Saturday we'll watch a film at home. I'll cook!
    Selin: Perfect. And I'll make a cake.
  glossary: |
    warum | why
    wandern | to hike; to go hiking
    der Regen | rain | Verb: es regnet.
    der Vormittag | (late) morning | Am Vormittag = in the morning, before lunch.
    der Nachmittag | afternoon
    der See | lake | Careful: die See means the sea.
    Gute Idee! | Good idea!
    zu Hause | at home
  questions: |
    mc: Why don't they go hiking on Saturday? || Selin has to work. | *It's going to rain. | Nils is ill. || "Am Samstag regnet es leider. Es sind nur zehn Grad."
    tf: On Sunday it will be sunny and warm. || true || "Am Sonntag ist es sonnig und warm."
    mc: What will they do on Sunday afternoon? || Go hiking | *Cycle to the lake and swim | Watch a film at home || "Dann fahren wir mit dem Rad an den See. Wir können schwimmen!"
    fill: Am Samstag sind es nur ___ Grad. || zehn / 10 || "Es sind nur zehn Grad."
    short: What will Selin make on Saturday? || kw: kuchen/cake || "Und ich mache einen Kuchen."

- slug: am-bahnhof
