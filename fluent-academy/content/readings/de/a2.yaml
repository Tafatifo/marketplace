- slug: silvester-in-deutschland
  kind: reading
  title: Silvester in Deutschland
  topic: Celebrations and traditions
  summary: Read how people in Germany celebrate New Year's Eve — from raclette and a cult TV sketch to fireworks and good resolutions.
  free: false
  text: |
    Der 31. Dezember heißt in Deutschland Silvester. An diesem Abend treffen sich viele Menschen mit Freunden oder mit der Familie. Manche feiern eine große Party, andere machen es sich zu Hause gemütlich.

    Ein beliebtes Essen an Silvester ist Raclette oder Fondue. Alle sitzen lange am Tisch, essen zusammen und reden über das alte Jahr. Viele Familien sehen auch jedes Jahr denselben Sketch im Fernsehen: „Dinner for One“. Der Sketch ist aus Großbritannien und auf Englisch, aber in Großbritannien kennen ihn nur wenige Leute. In Deutschland ist er seit Jahrzehnten Kult.

    Früher haben viele Menschen an Silvester Blei gegossen: Man hat ein kleines Stück Blei heiß gemacht und dann in kaltes Wasser gegeben. Die Form hat die Zukunft gezeigt. Blei ist aber giftig, und seit 2018 kann man es dafür nicht mehr kaufen. Heute nehmen die Leute Wachs.

    Um Mitternacht zählen alle laut von zehn bis null. Dann wünschen sich alle „Frohes neues Jahr!“ oder „Prost Neujahr!“, man umarmt sich, und draußen gibt es Feuerwerk. Viele Leute finden das Feuerwerk toll, andere ärgern sich über den Lärm und den Müll. Der 1. Januar ist ein Feiertag – und die meisten Menschen schlafen lange.

    Und was wünschen sich die Deutschen für das neue Jahr? Viele machen gute Vorsätze: mehr Sport, gesünder essen, weniger Stress. Ob sie das schaffen? Wir werden sehen!
  translation: |
    In Germany, 31 December is called Silvester. On this evening many people meet up with friends or family. Some have a big party, others make themselves comfortable at home.

    A popular meal on New Year's Eve is raclette or fondue. Everyone sits at the table for a long time, eats together and talks about the old year. Many families also watch the same sketch on TV every year: "Dinner for One". The sketch is from Great Britain and in English, but in Great Britain only a few people know it. In Germany it has been a cult classic for decades.

    In the past, many people poured lead on New Year's Eve: you heated a small piece of lead and then dropped it into cold water. The shape showed the future. But lead is poisonous, and since 2018 you can no longer buy it for this. Today people use wax.

    At midnight everyone counts down loudly from ten to zero. Then everyone wishes each other "Happy New Year!", people hug, and outside there are fireworks. Many people love the fireworks; others are annoyed by the noise and the rubbish. 1 January is a public holiday – and most people sleep in.

    And what do Germans wish for in the new year? Many make good resolutions: more sport, healthier eating, less stress. Will they manage it? We'll see!
  glossary: |
    es sich gemütlich machen | to make yourself comfortable
    beliebt | popular
    der Sketch | comedy sketch
    der Kult | cult classic | Das ist Kult! = It's a cult classic!
    das Blei | lead (the metal) | Blei gießen = to pour molten lead
    giftig | poisonous
    das Wachs | wax
    umarmen | to hug
    sich ärgern über | to be annoyed about
    der Vorsatz | resolution | gute Vorsätze = New Year's resolutions
  questions: |
    mc: What is "Dinner for One"? || A traditional New Year's meal | *A comedy sketch that many Germans watch every year | A party game with lead || "Viele Familien sehen auch jedes Jahr denselben Sketch im Fernsehen."
    tf: "Dinner for One" is very well known in Great Britain. || false || "In Großbritannien kennen ihn nur wenige Leute."
