- slug: gesund-durch-den-winter
  kind: reading
  title: Gesund durch den Winter
  topic: Health and the body
  summary: Read six simple tips from a family doctor for staying healthy and in a good mood in winter.
  free: false
  text: |
    Gesund durch den Winter – sechs einfache Tipps

    Im Winter sind viele Menschen müde, schlecht gelaunt und oft erkältet. Das muss nicht sein! Die Hausärztin Dr. Miriam Osei erklärt, was hilft.

    1. Geh jeden Tag nach draußen. Auch bei Kälte ist eine halbe Stunde Tageslicht gut für deine Laune und deinen Schlaf.

    2. Trink genug. Im Winter haben wir oft keinen Durst, aber der Körper braucht auch jetzt etwa anderthalb bis zwei Liter am Tag. Warmer Tee ist perfekt.

    3. Iss bunt. Obst und Gemüse haben viele Vitamine. Probier doch mal Wintergemüse wie Grünkohl oder Rote Bete!

    4. Wasch dir oft die Hände. So kommen Viren nicht so leicht in deinen Körper.

    5. Beweg dich regelmäßig. Du musst nicht jeden Tag joggen. Nimm die Treppe, fahr mit dem Rad zur Arbeit oder tanz zu Hause zu deiner Lieblingsmusik.

    6. Schlaf genug. Sieben bis acht Stunden sind ideal. Leg das Handy eine Stunde vor dem Schlafen weg.

    Und wenn du doch krank bist? „Bleib zu Hause und ruh dich aus“, sagt Dr. Osei. „Mit Fieber soll man nicht zur Arbeit gehen. Und wenn das Fieber nach drei Tagen nicht weg ist, geh bitte zum Arzt.“
  translation: |
    Healthy through the winter – six simple tips

    In winter many people are tired, in a bad mood and often have a cold. It doesn't have to be like that! The family doctor Dr Miriam Osei explains what helps.

    1. Go outside every day. Even when it's cold, half an hour of daylight is good for your mood and your sleep.

    2. Drink enough. In winter we often aren't thirsty, but the body still needs about one and a half to two litres a day. Warm tea is perfect.

    3. Eat colourfully. Fruit and vegetables have lots of vitamins. Why not try winter vegetables like kale or beetroot!

    4. Wash your hands often. That way viruses don't get into your body so easily.

    5. Move regularly. You don't have to go jogging every day. Take the stairs, cycle to work or dance at home to your favourite music.

    6. Get enough sleep. Seven to eight hours is ideal. Put your phone away an hour before you go to sleep.

    And if you do get ill? "Stay at home and rest," says Dr Osei. "You shouldn't go to work with a temperature. And if the fever hasn't gone after three days, please go to the doctor."
  glossary: |
    schlecht gelaunt | in a bad mood | die Laune = mood
    draußen | outside
    das Tageslicht | daylight
    der Durst | thirst | Durst haben = to be thirsty
    bunt | colourful
    der Grünkohl | kale | a typical winter vegetable in northern Germany
    sich bewegen | to move; to get some exercise | du-imperative: Beweg dich!
    weglegen | to put away | separable: Leg das Handy weg!
    sich ausruhen | to rest | du-imperative: Ruh dich aus!
  questions: |
    mc: How long should you be outside every day? || Ten minutes | *Half an hour | Two hours || "Eine halbe Stunde Tageslicht ist gut für deine Laune."
    tf: According to the article, you have to go jogging every day. || false || "Du musst nicht jeden Tag joggen."
    short: How many hours of sleep are ideal? || kw: sieben/acht/7/8/seven/eight || "Sieben bis acht Stunden sind ideal."
    fill: ___ dir oft die Hände! (waschen) || Wasch / Wasche || The du-imperative of waschen: du wäschst → Wasch! (no umlaut).
    mc: What should you do if the fever hasn't gone after three days? || *Go to the doctor | Drink more tea | Go back to work || "… geh bitte zum Arzt."

- slug: aushilfe-gesucht
  kind: reading
  title: Aushilfe gesucht!
  topic: Work and studies
  summary: Read a job advert from a bicycle workshop and find out the tasks, requirements and benefits.
  free: false
  text: |
    Aushilfe gesucht!

    Wir sind eine kleine Fahrradwerkstatt mit Laden in der Innenstadt von Oldenburg. Seit 2015 reparieren wir Fahrräder aller Art und verkaufen neue und gebrauchte Räder. Für unser Team suchen wir ab 1. April eine Aushilfe (m/w/d) in Teilzeit.

    Ihre Aufgaben:
    – Sie beraten Kundinnen und Kunden im Laden.
    – Sie nehmen Reparaturen an und vereinbaren Termine.
    – Sie helfen bei kleinen Reparaturen, zum Beispiel bei einem platten Reifen.

    Das wünschen wir uns:
    – Sie fahren gern Rad und wissen ein bisschen über Technik.
    – Sie sind freundlich, zuverlässig und arbeiten gern im Team.
    – Sie sprechen gut Deutsch; Englischkenntnisse sind ein Plus.
    – Erfahrung im Verkauf ist schön, aber nicht nötig.

    Das bieten wir:
    – 15 Stunden pro Woche, auch am Samstag
    – 15 Euro pro Stunde
    – ein nettes Team und Kaffee, so viel Sie wollen
    – 30 Prozent Rabatt auf alles im Laden

    Interessiert? Dann schicken Sie uns bis zum 15. März eine kurze Bewerbung mit Lebenslauf per E-Mail. Wir freuen uns auf Sie!
  translation: |
    Part-time helper wanted!

    We are a small bicycle workshop with a shop in the centre of Oldenburg. Since 2015 we have been repairing all kinds of bicycles and selling new and second-hand bikes. For our team we are looking for a part-time helper (m/f/d) from 1 April.

    Your tasks:
    – You advise customers in the shop.
    – You take in repairs and make appointments.
    – You help with small repairs, for example a flat tyre.

    What we'd like:
    – You like cycling and know a little about technology.
    – You are friendly, reliable and like working in a team.
    – You speak good German; English skills are a plus.
    – Sales experience is nice, but not necessary.

    What we offer:
    – 15 hours a week, including Saturdays
    – 15 euros an hour
    – a nice team and as much coffee as you want
    – 30 percent off everything in the shop

    Interested? Then send us a short application with your CV by email by 15 March. We look forward to hearing from you!
