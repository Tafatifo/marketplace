- slug: eine-woche-auf-hiddensee
  kind: reading
  title: Eine Woche auf Hiddensee
  topic: Holidays and travel
  summary: Read Hanna's holiday email from a small car-free island in the Baltic Sea — with a journey that didn't go to plan.
  free: false
  text: |
    Liebe Johanna,

    viele Grüße von der Ostsee! Seit Samstag bin ich mit Paul auf Hiddensee, einer kleinen Insel neben Rügen.

    Die Reise war ein kleines Abenteuer. Zuerst hatte unser Zug nach Stralsund eine Stunde Verspätung, und wir haben die Fähre um vier Uhr verpasst. Zum Glück gibt es am Abend noch eine Fähre, und um acht sind wir endlich angekommen.

    Auf Hiddensee gibt es keine Autos! Alle fahren Fahrrad oder gehen zu Fuß. Wir haben eine kleine Ferienwohnung in Vitte gemietet. Sie ist nicht modern, aber sie hat einen Garten, und das Meer ist nur fünf Minuten entfernt.

    Am Sonntag sind wir zum Leuchtturm im Norden gewandert. Der Weg war lang, aber die Aussicht war fantastisch. Gestern hatten wir leider Regen. Wir sind im Café geblieben, haben Kuchen gegessen und Karten gespielt. Heute scheint wieder die Sonne, und ich bin heute Morgen schon im Meer geschwommen. Das Wasser war ganz schön kalt – nur 17 Grad!

    Am Freitag fahren wir zurück nach Leipzig. Warst du schon mal auf Hiddensee? Ich glaube, die Insel ist perfekt für dich, weil du so gern wanderst.

    Liebe Grüße und bis bald,
    Hanna
  translation: |
    Dear Johanna,

    greetings from the Baltic Sea! Since Saturday I've been on Hiddensee with Paul – a small island next to Rügen.

    The journey was a little adventure. First our train to Stralsund was an hour late, and we missed the four o'clock ferry. Luckily there's another ferry in the evening, and at eight we finally arrived.

    There are no cars on Hiddensee! Everyone cycles or walks. We've rented a small holiday flat in Vitte. It isn't modern, but it has a garden, and the sea is only five minutes away.

    On Sunday we hiked to the lighthouse in the north. The path was long, but the view was fantastic. Yesterday, unfortunately, it rained. We stayed in a café, ate cake and played cards. Today the sun is shining again, and I already went swimming in the sea this morning. The water was pretty cold – only 17 degrees!

    On Friday we're going back to Leipzig. Have you ever been to Hiddensee? I think the island is perfect for you, because you love hiking so much.

    Love and see you soon,
    Hanna
