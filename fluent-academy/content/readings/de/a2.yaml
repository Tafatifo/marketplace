- slug: liebe-nachbarinnen-und-nachbarn
  kind: reading
  title: Liebe Nachbarinnen und Nachbarn
  topic: Home and housing
  summary: Read a notice in the stairwell of a block of flats about a courtyard clean-up day and some house rules.
  free: false
  text: |
    Liebe Nachbarinnen und Nachbarn,

    der Frühling ist da, aber unser Hof sieht leider nicht schön aus: Überall liegen Blätter, die Bänke sind schmutzig, und neben den Mülltonnen stehen alte Kartons.

    Wir laden Sie und euch deshalb herzlich zum Hofputz ein – am Samstag, den 12. April, von 10 bis 13 Uhr.

    Wir putzen zusammen die Bänke, bringen den Müll weg und pflanzen neue Blumen in die Beete. Die Hausverwaltung bezahlt die Pflanzen und die Erde. Bitte bringen Sie Handschuhe mit, wenn Sie welche haben. Für Kinder gibt es eine Malecke, und mittags grillen wir zusammen. Jeder bringt etwas mit: einen Salat, Brot oder Getränke.

    Noch drei Bitten an alle:

    1. Stellen Sie Ihre Fahrräder bitte in den Fahrradkeller und nicht ins Treppenhaus. Sonst ist es im Treppenhaus zu eng, besonders mit einem Kinderwagen.
    2. Trennen Sie bitte den Müll. Kartons gehören in die blaue Tonne – aber bitte klein machen!
    3. Ab 22 Uhr ist Ruhezeit. Bitte denken Sie an Ihre Nachbarn.

    Neu im Erdgeschoss: Neben der Haustür steht jetzt ein Tauschregal. Sie können dort Bücher, Spiele oder Geschirr hinstellen und sich etwas mitnehmen.

    Wir freuen uns auf einen schönen Samstag!
    Ihre Nachbarn Selma Aydın und Jakob Brandl (2. Stock)
  translation: |
    Dear neighbours,

    spring is here, but unfortunately our courtyard doesn't look nice: there are leaves everywhere, the benches are dirty, and there are old cardboard boxes next to the bins.

    So we warmly invite you to a courtyard clean-up – on Saturday, 12 April, from 10 a.m. to 1 p.m.

    Together we'll clean the benches, take the rubbish away and plant new flowers in the flower beds. The property management is paying for the plants and the soil. Please bring gloves if you have some. There will be a painting corner for children, and at lunchtime we'll have a barbecue together. Everyone brings something: a salad, bread or drinks.

    Three more requests to everyone:

    1. Please put your bikes in the bike cellar and not in the stairwell. Otherwise the stairwell gets too narrow, especially with a pram.
    2. Please separate your rubbish. Cardboard boxes go in the blue bin – but please flatten them!
    3. Quiet hours start at 10 p.m. Please think of your neighbours.

    New on the ground floor: there is now a swap shelf next to the front door. You can put books, games or dishes there and take something for yourself.

    We're looking forward to a lovely Saturday!
    Your neighbours Selma Aydın and Jakob Brandl (2nd floor)
  glossary: |
    der Hofputz | courtyard clean-up | putzen = to clean
    das Blatt | leaf | plural: die Blätter
    die Bank | bench | plural: die Bänke (a bank for money: die Banken)
    das Beet | flower bed | plural: die Beete
    die Erde | soil; earth
    die Handschuhe | gloves | usually plural
    der Kinderwagen | pram; pushchair
    das Tauschregal | swap shelf | tauschen = to swap
    die Bitte | request | plural: die Bitten
