    mc: Why don't some people like the fireworks? || *Because of the noise and the rubbish | Because they are too expensive | Because they start too late || "… andere ärgern sich über den Lärm und den Müll."
    tf: 1 January is a public holiday in Germany. || true || "Der 1. Januar ist ein Feiertag."

- slug: in-der-apotheke
  kind: listening
  title: In der Apotheke
  topic: Health and the body
  summary: Listen to a customer with a cough and a sore throat asking a pharmacist for advice.
  free: true
  speakers: A=Die Apothekerin/f; K=Herr Lindqvist/m
  text: |
    A: Guten Tag! Was kann ich für Sie tun?
    K: Guten Tag. Ich habe seit gestern Halsschmerzen und Husten. Haben Sie etwas dagegen?
    A: Haben Sie auch Fieber?
    K: Nein, Fieber habe ich nicht. Aber ich bin sehr müde.
    A: Dann empfehle ich Ihnen diese Lutschtabletten für den Hals und einen Hustensaft.
    K: Wie oft soll ich den Saft nehmen?
    A: Dreimal täglich einen Löffel, immer nach dem Essen. Die Tabletten können Sie alle drei Stunden nehmen, aber nicht mehr als sechs am Tag.
    K: Gut. Kann ich den Saft auch abends nehmen? Ich schlafe nachts so schlecht, weil ich immer husten muss.
    A: Ja, natürlich. Und trinken Sie viel, zum Beispiel warmen Tee mit Honig. Schlafen Sie genug und gehen Sie heute nicht zum Sport.
    K: Und wenn es nicht besser wird?
    A: Wenn Sie nach drei, vier Tagen noch Husten haben oder Fieber bekommen, gehen Sie bitte zum Arzt.
    K: Okay, mache ich. Was kostet das zusammen?
    A: Das macht 14 Euro 80. Brauchen Sie eine Tüte?
    K: Nein danke, ich habe einen Rucksack dabei. Auf Wiedersehen!
    A: Auf Wiedersehen und gute Besserung!
  translation: |
    Pharmacist: Hello! What can I do for you?
    Customer: Hello. I've had a sore throat and a cough since yesterday. Do you have anything for it?
    Pharmacist: Do you have a temperature as well?
    Customer: No, I don't have a temperature. But I'm very tired.
    Pharmacist: Then I recommend these throat lozenges and a cough syrup.
    Customer: How often should I take the syrup?
    Pharmacist: One spoonful three times a day, always after meals. You can take the lozenges every three hours, but no more than six a day.
    Customer: Fine. Can I take the syrup in the evening too? I sleep so badly at night because I keep coughing.
    Pharmacist: Yes, of course. And drink a lot, for example warm tea with honey. Get enough sleep and don't go to sport today.
    Customer: And if it doesn't get better?
    Pharmacist: If you still have a cough after three or four days, or if you get a temperature, please go to the doctor.
    Customer: Okay, I will. How much is that altogether?
    Pharmacist: That's 14 euros 80. Do you need a bag?
    Customer: No, thanks, I've got a rucksack with me. Goodbye!
    Pharmacist: Goodbye and get well soon!
  glossary: |
    dagegen | for it; against it | Haben Sie etwas dagegen? = Do you have anything for it?
    empfehlen | to recommend | ich empfehle Ihnen…
    die Lutschtablette | lozenge | lutschen = to suck
    der Löffel | spoon; spoonful
    alle drei Stunden | every three hours
    husten | to cough | der Husten = cough
    die Tüte | (carrier) bag
    Gute Besserung! | Get well soon!
  questions: |
    mc: What are the customer's symptoms? || A temperature and a headache | *A sore throat and a cough | Stomach ache and tiredness || "Ich habe seit gestern Halsschmerzen und Husten."
    tf: The customer has a temperature. || false || "Nein, Fieber habe ich nicht."
    fill: Den Hustensaft soll er dreimal täglich nach dem ___ nehmen. || Essen || "Dreimal täglich einen Löffel, immer nach dem Essen."
    short: How many lozenges can he take a day at most? || kw: sechs/6/six || "… aber nicht mehr als sechs am Tag."
    mc: When should he go to the doctor? || Tomorrow morning | *If he still has a cough after three or four days, or gets a temperature | Only if he can't sleep || "Wenn Sie nach drei, vier Tagen noch Husten haben oder Fieber bekommen, gehen Sie bitte zum Arzt."

- slug: anruf-wegen-der-wohnung
  kind: listening
  title: Anruf wegen der Wohnung
  topic: Home and housing
  summary: Listen to a phone call about a flat advert — size, floor, rent, deposit and a viewing appointment.
  free: false
  speakers: V=Frau Wagner/f; M=Herr Diallo/m
  text: |
    V: Wagner, guten Tag.
    M: Guten Tag, Frau Wagner. Mein Name ist Amadou Diallo. Ich rufe wegen der Wohnung in der Gartenstraße an. Ist sie noch frei?
    V: Ja, die ist noch frei. Die Wohnung hat zwei Zimmer, Küche und Bad, insgesamt 58 Quadratmeter.
    M: Und in welchem Stock liegt sie?
    V: Im dritten Stock. Es gibt leider keinen Aufzug, aber dafür ist die Wohnung sehr hell und ruhig. Das Schlafzimmer geht zum Hof.
    M: Das klingt gut. Wie hoch ist die Miete?
    V: Die Kaltmiete ist 620 Euro, dazu kommen 150 Euro Nebenkosten.
    M: Also 770 Euro warm. Und wie hoch ist die Kaution?
    V: Zwei Monatsmieten, also 1240 Euro.
    M: Gibt es eine Küche?
    V: Ja, eine Einbauküche mit Herd und Kühlschrank. Die Wohnung ist kleiner als die Wohnung im Erdgeschoss, aber auch billiger.
    M: Wann kann ich die Wohnung ansehen?
    V: Am Donnerstag um 18 Uhr ist eine Besichtigung. Passt Ihnen das?
    M: Ja, das passt mir gut. Vielen Dank!
    V: Gern. Dann bis Donnerstag, Herr Diallo. Auf Wiederhören!
  translation: |
    Ms Wagner: Wagner, hello.
    Mr Diallo: Hello, Ms Wagner. My name is Amadou Diallo. I'm calling about the flat in Gartenstraße. Is it still available?
    Ms Wagner: Yes, it's still available. The flat has two rooms, a kitchen and a bathroom, 58 square metres in total.
    Mr Diallo: And which floor is it on?
    Ms Wagner: On the third floor. Unfortunately there's no lift, but on the plus side the flat is very bright and quiet. The bedroom faces the courtyard.
    Mr Diallo: That sounds good. How much is the rent?
    Ms Wagner: The basic rent is 620 euros, plus 150 euros for additional costs.
    Mr Diallo: So 770 euros including bills. And how much is the deposit?
    Ms Wagner: Two months' rent, so 1,240 euros.
    Mr Diallo: Is there a kitchen?
    Ms Wagner: Yes, a fitted kitchen with a cooker and a fridge. The flat is smaller than the one on the ground floor, but also cheaper.
    Mr Diallo: When can I see the flat?
    Ms Wagner: There's a viewing on Thursday at 6 p.m. Does that suit you?
    Mr Diallo: Yes, that suits me fine. Thank you very much!
    Ms Wagner: You're welcome. See you on Thursday, then, Mr Diallo. Goodbye!
  glossary: |
    wegen | because of; about | Ich rufe wegen der Wohnung an. = I'm calling about the flat.
    insgesamt | in total
    der Aufzug | lift; elevator
    dafür | on the other hand; on the plus side
    zum Hof gehen | to face the courtyard
    die Kaltmiete | rent without heating and other costs
    die Einbauküche | fitted kitchen
    ansehen | to look at; to view | separable: Ich sehe die Wohnung an.
  questions: |
    mc: How big is the flat? || 85 square metres | *58 square metres | 50 square metres || "… insgesamt 58 Quadratmeter."
    tf: The building has a lift. || false || "Es gibt leider keinen Aufzug."
    fill: Die Kaltmiete ist 620 Euro, und die ___ sind 150 Euro. || Nebenkosten || "… dazu kommen 150 Euro Nebenkosten."
    short: When is the viewing? || kw: donnerstag/thursday & 18/sechs/six/6 || "Am Donnerstag um 18 Uhr ist eine Besichtigung."
    mc: How does this flat compare with the one on the ground floor? || It's bigger and more expensive. | *It's smaller but cheaper. | It's darker but quieter. || "Die Wohnung ist kleiner als die Wohnung im Erdgeschoss, aber auch billiger."

- slug: ein-konto-eroeffnen
  kind: listening
  title: Ein Konto eröffnen
  topic: Services and errands
  summary: Listen to a newcomer opening a current account at a bank — documents, costs, the card and the app.
  free: false
  speakers: S=Frau Schröder/f; K=Herr Sato/m
  text: |
    S: Guten Tag, Herr Sato. Bitte nehmen Sie Platz. Wie kann ich Ihnen helfen?
    K: Guten Tag. Ich wohne seit zwei Wochen in Darmstadt und möchte ein Girokonto eröffnen.
    S: Sehr gern. Haben Sie Ihren Pass und Ihre Meldebescheinigung dabei?
    K: Ja, hier, bitte. Was kostet das Konto?
    S: Wenn Ihr Gehalt jeden Monat auf das Konto kommt, ist es kostenlos. Sonst kostet es vier Euro im Monat.
    K: Mein Gehalt kommt ab nächstem Monat. Bekomme ich auch eine Karte?
    S: Ja, wir schicken Ihnen die Karte in einer Woche per Post. Die PIN bekommen Sie in einem zweiten Brief.
    K: Und kann ich mit der Karte überall Geld abheben?
    S: An unseren eigenen Geldautomaten ist es kostenlos. An anderen Automaten kann es etwas kosten.
    K: Okay. Gibt es auch eine App für das Onlinebanking?
    S: Ja. Ich erkläre Ihnen die App gleich.
    K: Super. Muss ich noch etwas unterschreiben?
    S: Ja, hier und hier, bitte. So, fertig! Willkommen bei uns, Herr Sato.
    K: Vielen Dank für Ihre Hilfe!
  translation: |
    Ms Schröder: Hello, Mr Sato. Please take a seat. How can I help you?
    Mr Sato: Hello. I've been living in Darmstadt for two weeks, and I'd like to open a current account.
    Ms Schröder: Certainly. Do you have your passport and your certificate of registration with you?
    Mr Sato: Yes, here you are. How much does the account cost?
    Ms Schröder: If your salary is paid into the account every month, it's free. Otherwise it costs four euros a month.
    Mr Sato: My salary will come from next month. Do I get a card as well?
    Ms Schröder: Yes, we'll send you the card by post in a week. You'll get the PIN in a second letter.
    Mr Sato: And can I withdraw money everywhere with the card?
    Ms Schröder: It's free at our own cash machines. At other machines it may cost something.
    Mr Sato: Okay. Is there an app for online banking too?
    Ms Schröder: Yes. I'll explain the app to you in a moment.
    Mr Sato: Great. Do I need to sign anything else?
    Ms Schröder: Yes, here and here, please. There, done! Welcome to our bank, Mr Sato.
    Mr Sato: Thank you very much for your help!
  glossary: |
    das Girokonto | current account
    die Meldebescheinigung | certificate of registration (proof of address)
    das Gehalt | salary
    kostenlos | free (of charge)
    sonst | otherwise
    die PIN | PIN (number)
    überall | everywhere
    unterschreiben | to sign | inseparable: hat unterschrieben
  questions: |
    mc: Why is Herr Sato at the bank? || To transfer money to Japan | *To open a current account | To change his address || "Ich … möchte ein Girokonto eröffnen."
    tf: The account is always free. || false || It's free only if his salary is paid into it; otherwise it costs four euros a month.
    fill: Die Bank schickt ihm die Karte in einer ___. || Woche || "Wir schicken Ihnen die Karte in einer Woche per Post."
    short: How will he receive his PIN? || kw: brief/letter/post/mail || "Die PIN bekommen Sie in einem zweiten Brief."
    mc: Where can he withdraw money for free? || At all cash machines | *At the bank's own cash machines | Only at the counter || "An unseren eigenen Geldautomaten ist es kostenlos."

- slug: wer-kommt-mit
  kind: listening
  title: Wer kommt mit?
  topic: Plans and choices
  summary: Listen to three friends comparing plans for a long weekend and agreeing on a plan A and a plan B.
  free: false
  speakers: N=Nora/f; D=David/m; E=Elif/f
  text: |
    N: Also, wir haben drei Ideen für das lange Wochenende im Juni. Was machen wir?
    D: Ich bin für das Musikfestival in Leipzig. Da spielen meine Lieblingsbands!
    E: Das Festival ist aber am teuersten. Das Ticket kostet 120 Euro.
    N: Stimmt. Am billigsten ist Camping am See. Wir brauchen nur ein Zelt und ein bisschen Essen.
    D: Und wenn es regnet? Dann sitzen wir drei Tage im nassen Zelt.
    E: Die dritte Idee ist ein Städtetrip nach Prag. Mit dem Bus ist man in fünf Stunden da.
    N: Prag finde ich am schönsten. Aber das Hotel ist teurer als der Campingplatz.
    D: Was ist für euch am wichtigsten?
    E: Für mich das Geld. Ich habe im Moment nicht viel.
    N: Und ich möchte mich einfach mal entspannen.
    D: Okay, dann mache ich einen Vorschlag: Wenn das Wetter gut ist, fahren wir an den See. Wenn es regnet, fahren wir spontan nach Prag.
    E: Und das Festival?
    D: Das Festival mache ich nächstes Jahr. Dann werde ich mehr Geld haben – hoffentlich!
    N: Super, abgemacht! Ich sehe mir am Donnerstag den Wetterbericht an und sage euch Bescheid.
  translation: |
    Nora: So, we have three ideas for the long weekend in June. What shall we do?
    David: I'm for the music festival in Leipzig. My favourite bands are playing there!
    Elif: But the festival is the most expensive. The ticket costs 120 euros.
    Nora: True. The cheapest is camping by the lake. We only need a tent and a bit of food.
    David: And if it rains? Then we'll sit in a wet tent for three days.
    Elif: The third idea is a city break to Prague. By bus you're there in five hours.
    Nora: I think Prague is the most beautiful. But the hotel is more expensive than the campsite.
    David: What's most important for you?
    Elif: For me, money. I don't have much at the moment.
    Nora: And I'd simply like to relax for once.
    David: Okay, then I'll make a suggestion: if the weather is good, we'll go to the lake. If it rains, we'll go to Prague on the spur of the moment.
    Elif: And the festival?
    David: I'll do the festival next year. Then I'll have more money – hopefully!
    Nora: Great, deal! I'll check the weather forecast on Thursday and let you know.
  glossary: |
    das lange Wochenende | long weekend
    die Lieblingsband | favourite band
    das Zelt | tent | plural: die Zelte
    nass | wet
    der Städtetrip | city break
    sich entspannen | to relax
    spontan | on the spur of the moment
    hoffentlich | hopefully
    abgemacht! | agreed!; deal!
    der Wetterbericht | weather forecast
  questions: |
    mc: Which option is the most expensive? || Camping by the lake | *The music festival | The city trip to Prague || "Das Festival ist aber am teuersten."
    tf: For Elif, money is the most important thing. || true || "Für mich das Geld. Ich habe im Moment nicht viel."
    fill: Wenn das Wetter gut ___, fahren sie an den See. || ist || In a wenn-clause the verb goes to the end: wenn das Wetter gut ist.
    short: What will they do if it rains? || kw: prag/prague || "Wenn es regnet, fahren wir spontan nach Prag."
    mc: When will Nora check the weather forecast? || On Monday | *On Thursday | On Saturday morning || "Ich sehe mir am Donnerstag den Wetterbericht an."
