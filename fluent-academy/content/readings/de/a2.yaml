- slug: drei-staedte-ein-leben
  kind: reading
  title: Drei Städte, ein Leben
  topic: Life stories
  summary: Read a blog post in which Nikolai tells the story of his life so far — from Bulgaria to Halle.
  free: true
  text: |
    Hallo zusammen!

    Ich heiße Nikolai, bin 34 Jahre alt und schreibe heute über mein Leben – für alle, die auch neu in Deutschland sind.

    Ich bin in Plovdiv in Bulgarien geboren. Dort habe ich meine Kindheit verbracht. Als Kind habe ich jeden Nachmittag mit meinem Bruder Fußball gespielt, und im Sommer haben wir bei unseren Großeltern auf dem Land gewohnt. Nach der Schule habe ich in Sofia Informatik studiert. Das Studium war nicht leicht, aber ich habe dort viele Freunde gefunden und meine Frau Mila kennengelernt.

    2017 haben wir zusammen eine große Entscheidung getroffen: Wir sind nach Deutschland gezogen. Zuerst haben wir zwei Jahre in Stuttgart gewohnt. Ich habe bei einer Softwarefirma gearbeitet, und Mila hat jeden Abend einen Deutschkurs besucht. Die ersten Monate waren schwer. Wir hatten nur wenige Freunde, und ich hatte oft Heimweh.

    2019 sind wir dann nach Halle gezogen, weil ich hier eine bessere Stelle bekommen habe. Unsere Tochter Ana ist hier geboren. Heute spreche ich ziemlich gut Deutsch, aber am Telefon habe ich manchmal noch Probleme.

    Was habe ich gelernt? Man braucht Geduld – und gute Nachbarn! Unsere Nachbarin, Frau Lehmann, hat uns am Anfang sehr geholfen.

    Wie ist eure Geschichte? Schreibt mir in den Kommentaren!

    Nikolai
  translation: |
    Hello everyone!

    My name is Nikolai, I'm 34 years old, and today I'm writing about my life – for everyone who is also new in Germany.

    I was born in Plovdiv in Bulgaria. I spent my childhood there. As a child I played football with my brother every afternoon, and in the summer we stayed with our grandparents in the countryside. After school I studied computer science in Sofia. The course wasn't easy, but I found lots of friends there and met my wife, Mila.

    In 2017 we made a big decision together: we moved to Germany. First we lived in Stuttgart for two years. I worked for a software company, and Mila went to a German course every evening. The first months were hard. We had only a few friends, and I was often homesick.

    In 2019 we moved to Halle, because I got a better job here. Our daughter Ana was born here. Today I speak quite good German, but on the phone I still sometimes have problems.

    What have I learned? You need patience – and good neighbours! Our neighbour, Mrs Lehmann, helped us a lot at the beginning.

    What's your story? Write to me in the comments!

    Nikolai
  glossary: |
