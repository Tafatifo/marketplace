    tf: Malte and Pavel became friends after an argument during a football match. || true || Pavel fouled Malte, both got a yellow card, and afterwards Pavel apologised.
    short: How much younger than Ursula is Marisol? || kw: 30/dreißig/thirty || "Sie ist dreißig Jahre jünger als ich."
    fill: Wichtig sind Menschen, ___ man vertrauen kann. || denen || Vertrauen takes the dative; the dative plural relative pronoun is denen.
    tf: Ursula went to the language café to improve her German. || false || Ursula wanted to learn Spanish; Marisol wanted to improve her German.
    mc: What do all three friendships have in common? || They began at work. | *They began by chance. | The friends are the same age. || "Keine dieser Freundschaften war geplant. Sie begannen zufällig."

- slug: vier-tage-woche
  kind: reading
  title: Vier Tage arbeiten, drei Tage frei
  topic: Work and careers
  summary: Read a report about a carpentry company in Bremen that introduced a four-day week — and what the boss and the employees think of it.
  free: false
  text: |
    Freitagmorgen, neun Uhr, in einer Tischlerei in Bremen: Die Werkstatt ist leer, die Maschinen stehen still. Niemand ist krank, niemand hat Urlaub. Bei der Firma „Holzwerk Nord“ ist der Freitag einfach frei – seit über einem Jahr.

    „Wir hatten ein großes Problem“, erzählt die Chefin Svenja Kröger. „Wir haben jahrelang Fachkräfte gesucht, aber kaum Bewerbungen bekommen. Deshalb wollten wir etwas Neues ausprobieren.“ Heute arbeiten die 25 Mitarbeiterinnen und Mitarbeiter von Montag bis Donnerstag jeweils neun Stunden. Das Gehalt ist gleich geblieben.

    Das Ergebnis hat selbst die Chefin überrascht: Im ersten Jahr kamen fast dreimal so viele Bewerbungen wie vorher, und es gab deutlich weniger Krankentage. „Die Leute sind am Montag einfach erholter“, sagt Kröger. Auch die Qualität der Arbeit ist nicht schlechter geworden – im Gegenteil: Es gibt weniger Fehler, weil die Leute konzentrierter sind.

    Auch die Mitarbeitenden sind meistens zufrieden. Petra Lindemann, 58, arbeitet in der Buchhaltung. „Freitags kümmere ich mich um meine Enkel. Das ist für mich unbezahlbar.“ Der Auszubildende Jonas, 19, nutzt den freien Tag für Sport und Freunde. „Ich würde nie wieder fünf Tage arbeiten wollen“, sagt er und lacht.

    Es gibt aber auch kritische Stimmen. Tischler Ahmet Yıldız findet die langen Tage anstrengend: „Nach neun Stunden in der Werkstatt bin ich total kaputt. Trotzdem möchte ich den freien Freitag nicht mehr hergeben.“

    Und die Kunden? „Für Notfälle haben wir am Freitag ein Telefon, das immer besetzt ist“, erklärt Kröger. „Bisher hat sich noch niemand beschwert.“

    Ist die Vier-Tage-Woche ein Modell für alle? In einem Krankenhaus oder einem Supermarkt wäre das viel schwieriger, gibt Kröger zu. „Aber wenn es möglich ist, sollte man es zumindest ausprobieren.“
  translation: |
    Friday morning, nine o'clock, in a carpentry workshop in Bremen: the workshop is empty, the machines are silent. Nobody is ill, nobody is on holiday. At the company "Holzwerk Nord", Friday is simply a day off – and has been for over a year.

    "We had a big problem," says the boss, Svenja Kröger. "For years we looked for skilled workers but hardly got any applications. So we wanted to try something new." Today the 25 employees work nine hours a day from Monday to Thursday. Their salary has stayed the same.

    The result surprised even the boss: in the first year almost three times as many applications came in as before, and there were clearly fewer sick days. "People are simply more rested on Monday," says Kröger. The quality of the work hasn't got worse either – on the contrary: there are fewer mistakes because people are more focused.

    The employees are mostly happy too. Petra Lindemann, 58, works in accounting. "On Fridays I look after my grandchildren. For me that's priceless." The trainee Jonas, 19, uses his day off for sport and friends. "I'd never want to work five days again," he says, laughing.

    But there are also critical voices. The carpenter Ahmet Yıldız finds the long days tiring: "After nine hours in the workshop I'm completely worn out. Still, I wouldn't want to give up my free Friday."

    And the customers? "For emergencies we have a phone on Fridays that is always staffed," explains Kröger. "So far nobody has complained."

    Is the four-day week a model for everyone? In a hospital or a supermarket it would be much more difficult, Kröger admits. "But if it's possible, you should at least try it."
