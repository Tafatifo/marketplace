    mc: Which problem does the text mention? || *Ripe strawberries sometimes disappear. | The city wants the area back. | Nobody comes to the garden in summer. || "Manchmal verschwinden die reifen Erdbeeren, bevor jemand sie ernten kann."
    tf: People from over twenty countries garden together. || true || "Seit vier Jahren gärtnern hier Menschen aus über zwanzig Ländern zusammen."

- slug: nimm-ein-buch
  kind: reading
  title: Nimm ein Buch, bring ein Buch
  topic: Culture and entertainment
  summary: Read about open bookcases in German towns — how they work, who looks after them and what people find in them.
  free: false
  text: |
    Er sieht aus wie eine alte Telefonzelle, aber drinnen gibt es kein Telefon, sondern Hunderte Bücher. Der offene Bücherschrank am Marktplatz ist rund um die Uhr geöffnet, und das System ist ganz einfach: Man nimmt ein Buch, das einen interessiert, und bringt ein anderes, das man nicht mehr braucht. Geld spielt keine Rolle.

    Offene Bücherschränke gibt es inzwischen in vielen deutschen Städten und Dörfern – manchmal in alten Telefonzellen, manchmal in Holzschränken an Bushaltestellen oder sogar in alten Baumstämmen. Meistens kümmern sich Ehrenamtliche um die Schränke: Sie sortieren die Bücher, räumen auf und nehmen kaputte Bücher heraus.

    Eine von ihnen ist Renate Kühn, eine pensionierte Bibliothekarin, der ihr „Bücherhäuschen“ sehr am Herzen liegt. „Jeden Morgen schaue ich vorbei“, erzählt sie. „Man findet hier alles: Krimis, Kochbücher, Kinderbücher, sogar Romane auf Arabisch oder Polnisch.“ Am meisten freut sie sich über die kleinen Notizen, die Leserinnen und Leser manchmal in die Bücher legen: „Bei diesem Buch habe ich geweint. Viel Spaß damit!“

    Für viele Menschen ist der Schrank auch ein Ort, an dem sie mit anderen ins Gespräch kommen. Der Student Amir, für den neue Bücher oft zu teuer sind, kommt jede Woche. „Letzten Monat habe ich hier einen alten Reiseführer über Marokko gefunden, in dem jemand mit der Hand Tipps notiert hatte. Das war wie ein Brief von einer fremden Person.“

    Nicht alles funktioniert perfekt: Manche Leute stellen alte Zeitschriften oder Lexika in den Schrank, die niemand mehr lesen möchte. Trotzdem ist die Idee ein großer Erfolg. Und was ist das Schönste, was Renate Kühn hier erlebt hat? „Ein kleiner Junge hat sein Lieblingsbuch hineingestellt und gesagt: Jetzt kann es noch jemand lieben.“
  translation: |
    It looks like an old phone box, but inside there's no phone – instead there are hundreds of books. The open bookcase on the market square is open around the clock, and the system is very simple: you take a book that interests you and bring another one that you no longer need. Money doesn't matter.

    There are now open bookcases in many German towns and villages – sometimes in old phone boxes, sometimes in wooden cabinets at bus stops or even in old tree trunks. Usually volunteers look after the bookcases: they sort the books, tidy up and take out damaged books.

    One of them is Renate Kühn, a retired librarian whose "little book house" is very close to her heart. "I drop by every morning," she says. "You can find everything here: crime novels, cookbooks, children's books, even novels in Arabic or Polish." What she loves most are the little notes that readers sometimes leave in the books: "I cried at this book. Enjoy it!"

    For many people the bookcase is also a place where they get talking to others. The student Amir, for whom new books are often too expensive, comes every week. "Last month I found an old travel guide to Morocco here, in which someone had written tips by hand. It was like a letter from a stranger."

    Not everything works perfectly: some people put old magazines or encyclopedias in the bookcase that nobody wants to read any more. Still, the idea is a great success. And what is the nicest thing Renate Kühn has experienced here? "A little boy put his favourite book in and said: Now somebody else can love it."
  glossary: |
    die Telefonzelle | phone box | plural: die Telefonzellen
    rund um die Uhr | around the clock
    der Baumstamm | tree trunk | plural: die Baumstämme
    die Ehrenamtlichen | volunteers | singular: der/die Ehrenamtliche
    die Bibliothekarin | librarian | masculine: der Bibliothekar
    am Herzen liegen | to be close to someone's heart | takes the dative: es liegt mir am Herzen
    der Reiseführer | travel guide (book or person) | plural: die Reiseführer
    das Lexikon | encyclopedia | plural: die Lexika
    der Erfolg | success | plural: die Erfolge
  questions: |
    mc: How does an open bookcase work? || You pay one euro per book. | *You take a book and bring another one. | You borrow a book for two weeks. || "Man nimmt ein Buch, das einen interessiert, und bringt ein anderes."
    tf: Volunteers usually look after the bookcases. || true || "Meistens kümmern sich Ehrenamtliche um die Schränke."
    fill: Renate Kühn ist eine Bibliothekarin, ___ ihr Bücherhäuschen sehr am Herzen liegt. || der || Am Herzen liegen takes the dative; die Bibliothekarin is feminine → der.
    short: What did Amir find in the bookcase last month? || kw: reiseführer/travel guide/guidebook/guide book/marokko/morocco || An old travel guide to Morocco with handwritten tips in it.
    mc: Which problem with the bookcases does the text mention? || The books often get wet. | *Some people leave old magazines nobody wants. | There are too few books. || "Manche Leute stellen alte Zeitschriften oder Lexika in den Schrank, die niemand mehr lesen möchte."
    fill: Was ist das Schönste, ___ Renate Kühn hier erlebt hat? || was || After a superlative used as a noun (das Schönste), the relative pronoun is was.

- slug: gut-schlafen-trotz-stress
  kind: listening
  title: Gut schlafen trotz Stress
  topic: Health and lifestyle
  summary: Listen to a radio interview with a sleep researcher about why stress keeps us awake and what helps us sleep better.
  free: true
  speakers: M=Die Moderatorin/f; D=Dr. Aydın/m
  text: |
    M: Guten Morgen und willkommen bei „Gesund im Alltag“. Heute geht es um ein Thema, das sehr viele Menschen betrifft: den Schlaf. Bei mir im Studio ist der Schlafforscher Dr. Tarek Aydın. Guten Morgen!
    D: Guten Morgen, und danke für die Einladung.
    M: Herr Aydın, viele Menschen schlafen schlecht, wenn sie gestresst sind. Woran liegt das eigentlich?
    D: Unter Stress produziert der Körper mehr Hormone, die uns wach halten. Früher war das sinnvoll, wenn Gefahr drohte. Heute ärgern wir uns über E-Mails, und der Körper reagiert genauso.
    M: Wie viel Schlaf braucht ein Erwachsener denn?
    D: Die meisten Erwachsenen brauchen zwischen sieben und neun Stunden. Aber es gibt große Unterschiede. Wichtiger als die genaue Zahl ist, dass man sich am Morgen erholt fühlt.
    M: Was raten Sie Menschen, die abends nicht abschalten können?
    D: Man sollte eine Stunde vor dem Schlafen kein Handy und keinen Laptop mehr benutzen. Das helle Licht vom Bildschirm sagt dem Gehirn: Es ist noch Tag.
    M: Das fällt vielen sicher schwer.
    D: Ja, deshalb empfehle ich ein kleines Abendritual: ein Buch lesen, einen Tee trinken, ein paar Minuten auf den Atem achten. Wichtig ist, dass man es jeden Abend macht.
    M: Und was ist, wenn man nachts aufwacht und an die Arbeit denkt?
    D: Dann hilft es, die Gedanken aufzuschreiben. Ich lege immer einen Zettel neben das Bett. Wenn die Sorgen auf dem Papier stehen, kann der Kopf loslassen.
    M: Viele Leute trinken abends ein Glas Wein, um besser einzuschlafen. Ist das eine gute Idee?
    D: Leider nicht. Man schläft vielleicht schneller ein, aber der Schlaf wird schlechter, und man wacht öfter auf.
    M: Und Sport? Hilft Bewegung?
    D: Auf jeden Fall! Wer sich tagsüber bewegt, schläft nachts besser. Nur sehr intensiven Sport sollte man nicht direkt vor dem Schlafengehen machen.
    M: Herr Aydın, vielen Dank für die vielen Tipps. Und Ihnen, liebe Hörerinnen und Hörer: gute Nacht – äh, natürlich: guten Morgen!
  translation: |
    Presenter: Good morning and welcome to "Healthy in Everyday Life". Today's topic affects a great many people: sleep. With me in the studio is the sleep researcher Dr Tarek Aydın. Good morning!
    Dr Aydın: Good morning, and thank you for inviting me.
    Presenter: Dr Aydın, many people sleep badly when they're stressed. Why is that, actually?
    Dr Aydın: Under stress the body produces more hormones that keep us awake. In the past that made sense when there was danger. Today we get annoyed about emails, and the body reacts in exactly the same way.
    Presenter: So how much sleep does an adult need?
    Dr Aydın: Most adults need between seven and nine hours. But there are big differences. More important than the exact number is that you feel rested in the morning.
    Presenter: What do you advise people who can't switch off in the evening?
    Dr Aydın: You shouldn't use your phone or laptop for an hour before you go to sleep. The bright light from the screen tells the brain: it's still daytime.
    Presenter: I'm sure many people find that hard.
    Dr Aydın: Yes, that's why I recommend a little evening routine: reading a book, drinking a cup of tea, paying attention to your breathing for a few minutes. What matters is that you do it every evening.
    Presenter: And what if you wake up at night and think about work?
    Dr Aydın: Then it helps to write your thoughts down. I always keep a piece of paper next to the bed. When your worries are on paper, your head can let go.
    Presenter: Lots of people drink a glass of wine in the evening to fall asleep more easily. Is that a good idea?
    Dr Aydın: Unfortunately not. You may fall asleep faster, but your sleep gets worse and you wake up more often.
    Presenter: And sport? Does exercise help?
    Dr Aydın: Definitely! People who move during the day sleep better at night. You just shouldn't do very intensive sport right before going to bed.
    Presenter: Dr Aydın, thank you very much for all these tips. And to you, dear listeners: good night – er, of course: good morning!
  glossary: |
    der Schlafforscher | sleep researcher | feminine: die Schlafforscherin
    betreffen | to affect; to concern | irregular: betraf, hat betroffen
    Woran liegt das? | What's the reason for that? | liegen an + dative = to be due to
    die Gefahr | danger | Gefahr droht = there is a threat of danger
    das Gehirn | brain
    das Abendritual | evening routine
    der Zettel | slip of paper; note
    loslassen | to let go | separable: ließ … los
    einschlafen | to fall asleep | separable, with sein: ist eingeschlafen
  questions: |
    mc: According to Dr Aydın, how much sleep do most adults need? || Five to six hours | *Seven to nine hours | At least ten hours || "Die meisten Erwachsenen brauchen zwischen sieben und neun Stunden."
    mc: Why shouldn't you use your phone just before sleeping? || Phones make the bedroom too warm. | *The bright light tells the brain it is still day. | The noise of messages wakes you up. || "Das helle Licht vom Bildschirm sagt dem Gehirn: Es ist noch Tag."
    short: What does Dr Aydın keep next to his bed? || kw: zettel/paper/note/notiz || A piece of paper (ein Zettel) to write down his thoughts.
    tf: Dr Aydın says that a glass of wine in the evening improves your sleep. || false || You may fall asleep faster, but your sleep gets worse and you wake up more often.
    fill: Wer sich tagsüber bewegt, ___ nachts besser. (schlafen) || schläft || Schlafen has a vowel change in the er-form: er schläft.
    tf: He recommends intensive sport right before going to bed. || false || "Nur sehr intensiven Sport sollte man nicht direkt vor dem Schlafengehen machen."

- slug: mit-dem-nachtzug-nach-wien
  kind: listening
  title: Mit dem Nachtzug nach Wien
  topic: Society and travel
  summary: Listen to two friends deciding whether to fly to Vienna or take the night train — and what would happen if things went wrong.
  free: false
  speakers: P=Paula/f; E=Erik/m
  text: |
    P: Erik, hast du dir schon überlegt, wie wir im Juni nach Wien fahren?
    E: Ehrlich gesagt nicht. Wenn es nach mir ginge, würden wir einfach fliegen. Das dauert nur eine Stunde.
    P: Plus die Fahrt zum Flughafen, das Warten und die Sicherheitskontrolle. Ich hätte eine andere Idee: den Nachtzug.
    E: Den Nachtzug? Ich habe noch nie in einem Zug geschlafen. Ist das nicht furchtbar unbequem?
    P: Gar nicht. Wenn wir ein Abteil im Liegewagen buchen würden, hätten wir sogar eine richtige Matratze. Wir fahren abends in Hamburg los und sind morgens um neun in Wien.
    E: Hm. Und was kostet das?
    P: Wenn wir jetzt buchen, ungefähr hundertzwanzig Euro pro Person. Im Schlafwagen wäre es noch teurer.
    E: Das ist mehr als der Flug.
    P: Stimmt, aber wir sparen eine Hotelnacht. Und das Frühstück ist im Preis enthalten.
    E: Okay, das ist ein Argument. Aber was wäre, wenn der Zug Verspätung hätte? Am ersten Tag wollten wir doch ins Museum.
    P: Dann gingen wir eben am Nachmittag ins Museum. Wir haben ja fünf Tage Zeit.
    E: Und was machen wir den ganzen Abend im Zug? Das sind ja fast zwölf Stunden.
    P: Wir könnten Karten spielen, lesen oder einfach aus dem Fenster schauen. Das wäre doch mal etwas anderes als Handy und Laptop.
    E: Und wenn ich nicht schlafen kann? Du weißt doch, ich wache schon auf, wenn ein Hund bellt.
    P: Dann nimmst du deine Ohrstöpsel mit. Ich wünschte, du wärst ein bisschen abenteuerlustiger!
    E: Na gut, du hast gewonnen. Aber wenn es mir nicht gefällt, fliegen wir zurück.
    P: Abgemacht! Ich buche heute Abend. Und du kümmerst dich um das Museum, ja?
    E: Mach ich. Ich schaue gleich, ob man die Tickets online kaufen kann.
  translation: |
    Paula: Erik, have you thought yet about how we're going to get to Vienna in June?
    Erik: To be honest, no. If it were up to me, we'd just fly. It only takes an hour.
    Paula: Plus getting to the airport, waiting and the security check. I've got another idea: the night train.
    Erik: The night train? I've never slept on a train. Isn't it terribly uncomfortable?
    Paula: Not at all. If we booked a compartment in the couchette car, we'd even have a proper mattress. We leave Hamburg in the evening and arrive in Vienna at nine in the morning.
    Erik: Hmm. And how much does it cost?
    Paula: If we book now, about a hundred and twenty euros per person. In the sleeping car it would be even more expensive.
    Erik: That's more than the flight.
    Paula: True, but we save a night in a hotel. And breakfast is included in the price.
    Erik: Okay, that's a good point. But what if the train were late? We wanted to go to the museum on the first day.
    Paula: Then we'd just go to the museum in the afternoon. We've got five days, after all.
    Erik: And what are we going to do on the train all evening? That's almost twelve hours.
    Paula: We could play cards, read or just look out of the window. That would make a change from phones and laptops.
    Erik: And what if I can't sleep? You know I wake up as soon as a dog barks.
    Paula: Then take your earplugs. I wish you were a bit more adventurous!
    Erik: All right, you win. But if I don't like it, we're flying back.
    Paula: Deal! I'll book this evening. And you'll take care of the museum, okay?
    Erik: Will do. I'll check right away whether you can buy the tickets online.
  glossary: |
    sich etwas überlegen | to think about something; to consider | dative reflexive: ich überlege mir …
    wenn es nach mir ginge | if it were up to me
    die Sicherheitskontrolle | security check
    das Abteil | compartment (on a train)
    der Liegewagen | couchette car | der Schlafwagen = sleeping car
    enthalten | included | im Preis enthalten = included in the price
    die Ohrstöpsel | earplugs | singular: der Ohrstöpsel
    abenteuerlustig | adventurous
    Abgemacht! | Deal! Agreed!
  questions: |
    mc: How would Erik prefer to travel at the beginning? || *By plane | By car | By bus || "Wenn es nach mir ginge, würden wir einfach fliegen."
    tf: The night train leaves Hamburg in the morning. || false || They leave in the evening and arrive in Vienna at nine in the morning.
    short: Why is the night train not really more expensive, according to Paula? || kw: hotel/hotelnacht/frühstück/breakfast || They save a night in a hotel, and breakfast is included.
    fill: Ich wünschte, du ___ ein bisschen abenteuerlustiger! || wärst / wärest || An unreal wish: ich wünschte + Konjunktiv II of sein (du wärst).
    mc: What will Erik take care of? || Booking the train | *The museum tickets | Buying earplugs for Paula || "Und du kümmerst dich um das Museum, ja?" – "Mach ich."
    tf: Erik says that if he doesn't like the night train, they will fly back. || true || "Aber wenn es mir nicht gefällt, fliegen wir zurück."

- slug: was-machen-wir-am-samstag
  kind: listening
  title: Was machen wir am Samstag?
  topic: Culture and entertainment
  summary: Listen to two friends choosing between a play, a jazz concert and a film for Saturday evening — and finding a plan that suits them both.
  free: false
  speakers: T=Tamara/f; J=Jonte/m
  text: |
    T: Jonte, hast du am Samstagabend schon etwas vor?
    J: Noch nicht. Hast du eine Idee?
    T: Im Stadttheater läuft das neue Stück, über das gerade alle reden. Es geht um eine Familie, die nach dreißig Jahren ihr altes Haus verkaufen muss.
    J: Klingt ein bisschen traurig. Ich hätte eher Lust auf Musik. Im Jazzkeller spielt eine Band, von der mir meine Schwester vorgeschwärmt hat.
    T: Jazz? Ehrlich gesagt ist das nicht so meine Musik. Das letzte Konzert, bei dem ich war, war furchtbar laut.
    J: Das war doch Rock, oder? Diese Band ist ganz anders: ruhig, mit Klavier und einer Sängerin, die eine wunderbare Stimme hat.
    T: Hm. Und wie wäre es mit Kino? Der Film, den ich dir letzte Woche empfohlen habe, läuft noch.
    J: Der Krimi aus Schweden? Den habe ich schon gesehen. Mein Kollege, dem ich bei Filmen immer glaube, fand ihn auch toll.
    T: Und der Film, von dem du neulich so geschwärmt hast? Den wolltest du doch unbedingt sehen.
    J: Der läuft leider erst ab nächster Woche. Den schauen wir uns dann zusammen an.
    T: Schade. Okay, ich mache dir einen Vorschlag: Das Theaterstück beginnt um sieben und ist um halb zehn zu Ende.
    J: Und das Konzert fängt erst um zehn an! Der Jazzkeller ist nur fünf Minuten vom Theater entfernt.
    T: Perfekt. Dann machen wir einfach beides: erst Theater, dann Jazz.
    J: Super Idee. Und danach gehen wir noch in die kleine Bar, in der wir uns damals kennengelernt haben?
    T: Wenn wir dann noch nicht zu müde sind! Ich kaufe die Theaterkarten, und du kümmerst dich um das Konzert.
    J: Abgemacht. Ich schreibe auch meiner Schwester, ob sie mitkommen will – die Band ist ja ihre Entdeckung.
  translation: |
    Tamara: Jonte, have you got any plans for Saturday evening yet?
    Jonte: Not yet. Have you got an idea?
    Tamara: The new play that everyone's talking about is on at the city theatre. It's about a family who have to sell their old house after thirty years.
    Jonte: Sounds a bit sad. I'd rather go for music. A band my sister has been raving about is playing at the jazz club.
    Tamara: Jazz? To be honest, that's not really my kind of music. The last concert I went to was terribly loud.
    Jonte: That was rock, wasn't it? This band is completely different: quiet, with a piano and a singer who has a wonderful voice.
    Tamara: Hmm. And how about the cinema? The film I recommended to you last week is still on.
    Jonte: The Swedish crime film? I've already seen it. My colleague, whom I always trust when it comes to films, thought it was great too.
    Tamara: And the film you were raving about the other day? You really wanted to see that one.
    Jonte: Unfortunately it doesn't start until next week. We'll watch it together then.
    Tamara: Pity. Okay, here's a suggestion: the play starts at seven and finishes at half past nine.
    Jonte: And the concert doesn't start until ten! The jazz club is only five minutes from the theatre.
    Tamara: Perfect. Then we'll just do both: first the theatre, then jazz.
    Jonte: Great idea. And afterwards shall we go to the little bar where we first met?
    Tamara: If we're not too tired by then! I'll buy the theatre tickets, and you take care of the concert.
    Jonte: Deal. I'll also ask my sister whether she wants to come – the band is her discovery, after all.
  glossary: |
    das Stück | play (in the theatre) | also: das Theaterstück
    vorschwärmen | to rave about something to someone | jemandem von etwas vorschwärmen
    der Jazzkeller | jazz club (often in a cellar)
    das Klavier | piano
    zu Ende sein | to be over; to finish
    beides | both (things)
    damals | back then; at that time
    die Entdeckung | discovery
  questions: |
    mc: What is the play about? || A Swedish detective | *A family who have to sell their old house | A jazz singer and her band || "Es geht um eine Familie, die nach dreißig Jahren ihr altes Haus verkaufen muss."
    tf: Jonte has already seen the Swedish crime film. || true || "Der Krimi aus Schweden? Den habe ich schon gesehen."
    fill: Im Jazzkeller spielt eine Band, von ___ mir meine Schwester vorgeschwärmt hat. || der || Von + dative; die Band is feminine → von der.
    short: What time does the concert start? || kw: zehn/10/ten/22 || "Das Konzert fängt erst um zehn an!"
    mc: What do they decide to do in the end? || Go to the cinema | *Go to the theatre first and then to the concert | Stay at home and watch a film || "Dann machen wir einfach beides: erst Theater, dann Jazz."
    tf: Tamara is going to buy the concert tickets. || false || Tamara buys the theatre tickets; Jonte takes care of the concert.

- slug: anruf-aus-der-personalabteilung
  kind: listening
  title: Ein Anruf aus der Personalabteilung
  topic: Work and careers
  summary: Listen to a phone call in which a company invites an applicant to a second interview and explains what will happen.
  free: false
  speakers: W=Frau Weber/f; O=Herr Osei/m
  text: |
    W: Guten Tag, hier spricht Sandra Weber von der Firma Lichtblick Solar in Freiburg. Spreche ich mit Herrn Osei?
    O: Ja, am Apparat. Guten Tag, Frau Weber!
    W: Herr Osei, vielen Dank noch einmal für das Gespräch letzte Woche. Unser Team war sehr beeindruckt. Wir würden Sie gern zu einem zweiten Gespräch einladen.
    O: Das freut mich sehr! Wann würde es Ihnen denn passen?
    W: Wir hätten zwei Termine zur Auswahl: Dienstag, den zwölften, um zehn Uhr oder Donnerstag, den vierzehnten, um vierzehn Uhr.
    O: Am Dienstag habe ich leider einen wichtigen Termin bei meinem jetzigen Arbeitgeber. Wäre der Donnerstag möglich?
    W: Ja, natürlich. Dann notiere ich Donnerstag, vierzehn Uhr. Diesmal wäre auch unser Geschäftsführer dabei, Herr Brenner.
    O: Gut zu wissen. Darf ich fragen, wie das zweite Gespräch abläuft?
    W: Gern. Sie würden zuerst eine kurze Präsentation halten, ungefähr zehn Minuten, über ein Projekt aus Ihrer bisherigen Arbeit. Danach sprechen wir über Details wie das Gehalt und den Starttermin.
    O: Und wie lange dauert das Gespräch ungefähr?
    W: Ich würde mit etwa anderthalb Stunden rechnen. Danach würde Ihnen eine Kollegin gern noch kurz unsere Produktion zeigen.
    O: Verstehe. Könnten Sie mir die Informationen vielleicht noch einmal per E-Mail schicken?
    W: Selbstverständlich. Sie bekommen heute noch eine Bestätigung mit allen Details. Haben Sie sonst noch Fragen?
    O: Ja, eine noch: Wäre es möglich, die Präsentation von meinem eigenen Laptop zu zeigen?
    W: Kein Problem, im Besprechungsraum gibt es einen Beamer. Bringen Sie am besten auch einen USB-Stick mit, falls das Kabel nicht passt.
    O: Mache ich. Gibt es bei Ihnen Parkplätze für Besucher?
    W: Ja, direkt vor dem Eingang. Aber unser Büro ist auch nur zehn Minuten vom Bahnhof entfernt.
    O: Prima, dann komme ich mit der Bahn. Vielen Dank, Frau Weber. Dann bis Donnerstag!
    W: Bis Donnerstag, Herr Osei. Auf Wiederhören!
  translation: |
    Ms Weber: Hello, this is Sandra Weber from the company Lichtblick Solar in Freiburg. Am I speaking to Mr Osei?
    Mr Osei: Yes, speaking. Hello, Ms Weber!
    Ms Weber: Mr Osei, thank you again for the interview last week. Our team was very impressed. We would like to invite you to a second interview.
    Mr Osei: I'm very pleased to hear that! When would suit you?
    Ms Weber: We have two dates to choose from: Tuesday the twelfth at ten o'clock or Thursday the fourteenth at two p.m.
    Mr Osei: Unfortunately I have an important appointment with my current employer on Tuesday. Would Thursday be possible?
    Ms Weber: Yes, of course. Then I'll put down Thursday, two p.m. This time our managing director, Mr Brenner, would also be there.
    Mr Osei: Good to know. May I ask how the second interview will go?
    Ms Weber: Of course. First you would give a short presentation, about ten minutes, on a project from your work so far. After that we'll talk about details such as the salary and the start date.
    Mr Osei: And roughly how long will the interview take?
    Ms Weber: I'd expect about an hour and a half. Afterwards a colleague would like to show you our production area briefly.
    Mr Osei: I see. Could you perhaps send me the information again by email?
    Ms Weber: Of course. You'll receive a confirmation with all the details today. Do you have any other questions?
    Mr Osei: Yes, one more: would it be possible to show the presentation from my own laptop?
    Ms Weber: No problem, there's a projector in the meeting room. Best to bring a USB stick as well, in case the cable doesn't fit.
    Mr Osei: Will do. Is there visitor parking at your company?
    Ms Weber: Yes, right in front of the entrance. But our office is also only ten minutes from the station.
    Mr Osei: Great, then I'll come by train. Thank you very much, Ms Weber. See you on Thursday, then!
    Ms Weber: See you on Thursday, Mr Osei. Goodbye!
  glossary: |
    die Personalabteilung | HR department; personnel department
    am Apparat | speaking (on the phone)
    beeindruckt | impressed
    zur Auswahl | to choose from
    der Geschäftsführer | managing director | feminine: die Geschäftsführerin
    ablaufen | to go; to proceed | Wie läuft das ab? = How does it work?
    bisherig | previous; so far
    die Bestätigung | confirmation
    der Beamer | (video) projector | a false friend: not a car!
    Auf Wiederhören! | Goodbye! (on the phone)
  questions: |
    mc: Why does Frau Weber call Herr Osei? || To offer him the job | *To invite him to a second interview | To cancel his interview || "Wir würden Sie gern zu einem zweiten Gespräch einladen."
