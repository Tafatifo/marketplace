    schimpfen | to complain loudly; to swear | also: to tell someone off
    der Schiedsrichter | referee | feminine: die Schiedsrichterin
    das Sprachcafé | language café | a meeting place for language exchange
    gemeinsam | together; in common | etwas gemeinsam haben = to have something in common
    zufällig | by chance | noun: der Zufall
  questions: |
