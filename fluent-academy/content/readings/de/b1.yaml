- slug: freunde-fuers-leben
  kind: reading
  title: Freunde fürs Leben?
  topic: People and relationships
  summary: Read how three people from Dortmund, Greifswald and Bamberg met their best friends — on a night shift, in a football match and in a language café.
  free: true
  text: |
    Wie haben Sie Ihre beste Freundin oder Ihren besten Freund kennengelernt? Wir haben drei Menschen gefragt.

    Jana, 52, Pflegerin in Dortmund: „Ich habe Gül vor dreißig Jahren in der Ausbildung kennengelernt. Wir hatten beide Nachtdienst auf derselben Station. In einer Nacht, in der wirklich alles schiefging, saßen wir um vier Uhr morgens zusammen in der Teeküche und lachten plötzlich wie verrückt. Seitdem sind wir unzertrennlich. Gül ist ein Mensch, der immer ehrlich ist – auch wenn es manchmal wehtut.“

    Malte, 27, Student in Greifswald: „Meinen besten Freund Pavel habe ich beim Fußball kennengelernt – eigentlich im Streit. Er foulte mich, ich schimpfte laut, und der Schiedsrichter zeigte uns beiden die Gelbe Karte. Nach dem Spiel kam Pavel zu mir und entschuldigte sich. Wir tranken zusammen etwas und merkten schnell, dass wir denselben Humor haben. Heute wohnen wir in einer WG, und gestritten haben wir seitdem nur noch über den Putzplan.“

    Ursula, 78, Rentnerin in Bamberg: „Meine beste Freundin heißt Marisol, und sie ist dreißig Jahre jünger als ich. Wir trafen uns vor fünf Jahren in einem Sprachcafé, wo ich Spanisch lernen wollte. Marisol kommt aus Valencia und wollte ihr Deutsch verbessern. Zuerst trafen wir uns nur zum Üben, aber bald kochten wir zusammen, gingen ins Kino und fuhren sogar gemeinsam nach Spanien. Viele Leute denken, dass Freundschaft eine Frage des Alters ist. Das stimmt nicht. Wichtig sind Menschen, denen man vertrauen kann.“

    Drei Geschichten, drei ganz verschiedene Wege – aber eines haben alle gemeinsam: Keine dieser Freundschaften war geplant. Sie begannen zufällig, in einem Moment, den niemand erwartet hatte.
  translation: |
    How did you meet your best friend? We asked three people.

    Jana, 52, a nurse in Dortmund: "I met Gül thirty years ago during our training. We were both on night shift on the same ward. One night, when absolutely everything went wrong, we were sitting together in the staff kitchen at four in the morning and suddenly started laughing like mad. We've been inseparable ever since. Gül is someone who is always honest – even when it hurts sometimes."

    Malte, 27, a student in Greifswald: "I met my best friend Pavel at football – actually during an argument. He fouled me, I swore loudly, and the referee showed us both a yellow card. After the match Pavel came over and apologised. We had a drink together and soon realised that we have the same sense of humour. Today we share a flat, and since then we've only argued about the cleaning rota."

    Ursula, 78, a pensioner in Bamberg: "My best friend is called Marisol, and she is thirty years younger than me. We met five years ago in a language café where I wanted to learn Spanish. Marisol is from Valencia and wanted to improve her German. At first we only met to practise, but soon we were cooking together, going to the cinema and even travelling to Spain together. Many people think friendship is a question of age. That isn't true. What matters are people you can trust."

    Three stories, three very different paths – but they all have one thing in common: none of these friendships was planned. They began by chance, at a moment that nobody had expected.
