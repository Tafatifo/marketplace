    tf: Gerhard thinks it is never too late to start something new. || true || "Es ist nie zu spät, etwas Neues anzufangen."

- slug: das-digital-cafe
  kind: reading
  title: Das Digital-Café im Dorf
  topic: Media and technology
  summary: Read how teenagers and pensioners meet every Wednesday in a village hall to solve problems with smartphones and tablets.
  free: false
  text: |
    Jeden Mittwochnachmittag ist im Gemeindehaus von Mühlbach viel los. An langen Tischen sitzen ältere Menschen mit Tablets und Smartphones, daneben Jugendliche, die geduldig erklären. Das „Digital-Café“ gibt es seit zwei Jahren – und es ist ein Treffpunkt für das ganze Dorf geworden.

    Die Idee hatte Hannelore Schmitt, 74. „Nachdem die Bankfiliale im Dorf geschlossen hatte, wusste ich nicht, wie ich meine Überweisungen machen sollte“, erzählt sie. „Meine Kinder wohnen weit weg, und ich wollte sie nicht ständig anrufen.“ Sie fragte an der Schule im Nachbarort, ob Schülerinnen und Schüler helfen könnten. Zwölf Jugendliche meldeten sich sofort.

    Heute kommen jede Woche etwa zwanzig Seniorinnen und Senioren. Die Fragen sind ganz unterschiedlich: Wie schreibe ich eine Nachricht an meine Enkelin? Wie erkenne ich, ob eine E-Mail gefährlich ist? Wo finde ich den Busfahrplan? Der 16-jährige Emil erklärt gerade, wie man ein Foto verschickt. „Am Anfang war ich unsicher, ob ich das gut kann“, sagt er. „Aber eigentlich braucht man vor allem Geduld. Wenn jemand etwas zum fünften Mal fragt, erklärt man es eben zum fünften Mal.“

    Das Café hilft nicht nur den Älteren. Viele Jugendliche hatten vorher kaum Kontakt zu alten Menschen gehabt. „Herr Becker hat mir erzählt, wie er als Junge auf dem Bauernhof gearbeitet hat“, sagt die 15-jährige Lina. „Das war spannender als jeder Film.“

    Und Hannelore Schmitt? Sie macht ihre Bankgeschäfte jetzt online und schickt jeden Abend Fotos aus ihrem Garten an die Familie. Inzwischen hilft sie sogar selbst mit und zeigt Neulingen, wie ein Videoanruf funktioniert. „Früher hatte ich Angst vor dem Internet“, sagt sie und lacht. „Heute frage ich mich, wie ich ohne leben konnte.“
  translation: |
    Every Wednesday afternoon the community hall in Mühlbach is busy. Older people with tablets and smartphones sit at long tables, next to teenagers who patiently explain things. The "Digital Café" has existed for two years – and it has become a meeting place for the whole village.

    The idea came from Hannelore Schmitt, 74. "After the bank branch in the village had closed, I didn't know how to make my bank transfers," she says. "My children live far away, and I didn't want to keep calling them." She asked at the school in the neighbouring village whether pupils could help. Twelve teenagers volunteered immediately.

    Today about twenty older people come every week. Their questions are very varied: How do I write a message to my granddaughter? How can I tell whether an email is dangerous? Where do I find the bus timetable? Sixteen-year-old Emil is explaining how to send a photo. "At first I wasn't sure whether I'd be good at it," he says. "But really, what you need most is patience. If someone asks something for the fifth time, you simply explain it for the fifth time."

    The café doesn't only help the older people. Many of the teenagers had hardly had any contact with old people before. "Mr Becker told me how he worked on a farm as a boy," says fifteen-year-old Lina. "That was more exciting than any film."

    And Hannelore Schmitt? She now does her banking online and sends photos from her garden to her family every evening. By now she even helps out herself and shows newcomers how a video call works. "I used to be afraid of the internet," she says, laughing. "Today I wonder how I lived without it."
