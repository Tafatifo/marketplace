    tf: Hannelore is still afraid of the internet. || false || "Früher hatte ich Angst vor dem Internet" — today she does her banking online.

- slug: garten-auf-dem-parkplatz
  kind: reading
  title: Ein Garten auf dem Parkplatz
  topic: City and environment
  summary: Read about a community garden in Leipzig that neighbours built on an old car park — with raised beds, solar power and a big meal every Saturday.
  free: false
  text: |
    Wo früher Autos standen, wachsen heute Tomaten, Bohnen und Sonnenblumen. Der Gemeinschaftsgarten „Grüne Insel“ liegt auf einem ehemaligen Parkplatz im Leipziger Westen. Seit vier Jahren gärtnern hier Menschen aus über zwanzig Ländern zusammen.

    Angefangen hat alles mit einer kleinen Gruppe von Nachbarinnen und Nachbarn. Der alte Parkplatz hinter dem Supermarkt war jahrelang leer, weil der Supermarkt einen neuen, größeren Parkplatz gebaut hatte. „Die graue Fläche war einfach hässlich“, erinnert sich Mitgründerin Doreen Paulsen. „Wir haben die Stadt gefragt, ob wir sie nutzen dürfen.“ Nach vielen Gesprächen bekam die Gruppe die Erlaubnis.

    Obwohl man auf Asphalt nichts pflanzen kann, fand die Gruppe eine Lösung: Hochbeete aus alten Holzkisten und große Säcke mit Erde. Heute stehen auf der großen Fläche über hundert Beete. Den Strom für die kleine Wasserpumpe liefert eine Solaranlage auf dem Dach vom Gartenhäuschen. Regenwasser sammeln die Gärtnerinnen und Gärtner in großen Tonnen, damit sie im Sommer weniger Leitungswasser brauchen.

    Jeden Samstag ist Gartentag. Dann arbeiten alle gemeinsam, und danach gibt es ein großes Essen mit dem frischen Gemüse. Wer kein Gemüse mag, bringt einfach einen Kuchen mit. Yusuf Demir, 63, kommt fast jeden Tag. „Obwohl ich in einer kleinen Wohnung im vierten Stock wohne, habe ich jetzt einen Garten“, sagt er stolz. Die zehnjährige Mia liebt die kleinen Kürbisse, die sie selbst gepflanzt hat.

    Natürlich gibt es auch Probleme. Im heißen Sommer muss man fast jeden Abend gießen, und manchmal verschwinden die reifen Erdbeeren, bevor jemand sie ernten kann. Trotzdem wollen alle weitermachen. „Der Garten ist mehr als Gemüse“, sagt Doreen Paulsen. „Hier lernen sich Menschen kennen, die sich sonst nie treffen würden.“
  translation: |
    Where cars used to stand, tomatoes, beans and sunflowers grow today. The community garden "Green Island" is on a former car park in the west of Leipzig. For four years people from over twenty countries have been gardening here together.

    It all started with a small group of neighbours. The old car park behind the supermarket had been empty for years because the supermarket had built a new, bigger car park. "The grey area was simply ugly," remembers co-founder Doreen Paulsen. "We asked the city whether we could use it." After many conversations the group got permission.

    Although you can't plant anything on asphalt, the group found a solution: raised beds made from old wooden crates and big sacks of soil. Today there are over a hundred beds on the large area. The electricity for the small water pump comes from solar panels on the roof of the garden shed. The gardeners collect rainwater in big barrels so that they need less tap water in summer.

    Every Saturday is garden day. Then everyone works together, and afterwards there's a big meal with the fresh vegetables. Anyone who doesn't like vegetables simply brings a cake. Yusuf Demir, 63, comes almost every day. "Although I live in a small flat on the fourth floor, I now have a garden," he says proudly. Ten-year-old Mia loves the little pumpkins she planted herself.

    Of course, there are problems too. In the hot summer you have to water almost every evening, and sometimes the ripe strawberries disappear before anyone can pick them. Still, everyone wants to carry on. "The garden is more than vegetables," says Doreen Paulsen. "Here people get to know each other who would otherwise never meet."
  glossary: |
    ehemalig | former
    gärtnern | to garden
    die Erlaubnis | permission | plural: die Erlaubnisse
    das Beet | (vegetable or flower) bed | plural: die Beete; das Hochbeet = raised bed
    die Erde | soil; earth
    die Solaranlage | solar panels; solar installation
    der Kürbis | pumpkin | plural: die Kürbisse
    reif | ripe
    ernten | to harvest; to pick | noun: die Ernte
  questions: |
