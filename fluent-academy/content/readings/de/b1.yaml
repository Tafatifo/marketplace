- slug: mit-68-in-den-hoersaal
  kind: reading
  title: Mit 68 zurück in den Hörsaal
  topic: Education and learning
  summary: Read about Gerhard, a retired bus driver who now attends history lectures at the university of Tübingen as a guest student.
  free: false
  text: |
    Montag, zehn Uhr, Hörsaal 9: Zweihundert Studierende warten auf die Vorlesung „Geschichte des Mittelalters“. In der dritten Reihe sitzt ein Mann mit grauen Haaren und einem dicken Notizbuch. Gerhard Wolff ist 68 Jahre alt – und seit zwei Semestern Gasthörer an der Universität Tübingen.

    „Als junger Mann hatte ich keine Möglichkeit zu studieren“, erzählt er. „Meine Eltern hatten wenig Geld, deshalb habe ich mit sechzehn eine Ausbildung angefangen.“ Über vierzig Jahre lang fuhr er Bus in Reutlingen. „Ich habe immer davon geträumt, Geschichte zu studieren. Als ich in Rente ging, habe ich beschlossen, es endlich zu versuchen.“

    Als Gasthörer braucht man kein Abitur. Man bezahlt eine Gebühr pro Semester und darf viele Vorlesungen besuchen. Prüfungen schreiben Gasthörer normalerweise nicht, und einen Abschluss bekommen sie auch nicht. „Das ist mir egal“, sagt Wolff. „Ich lerne, um die Welt besser zu verstehen, nicht für eine Note.“ Viele Universitäten bieten außerdem spezielle Führungen, Kurse und Vorträge für ältere Menschen an.

    Am Anfang war es nicht leicht. „Es war ungewohnt, wieder stundenlang still zu sitzen und zuzuhören. Und die jungen Leute schreiben alles auf dem Laptop mit – ich mit dem Kuli.“ Inzwischen hat er sogar eine Lerngruppe: Drei Studentinnen erklären ihm, wie die Online-Bibliothek funktioniert, und er erzählt ihnen dafür, wie das Leben in den Sechzigerjahren war. Nächstes Semester möchte er sogar ein Seminar besuchen, in dem man selbst ein Referat halten muss.

    Was würde er anderen Seniorinnen und Senioren raten? „Man sollte keine Angst haben, Fragen zu stellen. Und man sollte nicht denken, dass man zu alt ist. Es ist nie zu spät, etwas Neues anzufangen.“
  translation: |
    Monday, ten o'clock, lecture hall 9: two hundred students are waiting for the lecture "History of the Middle Ages". In the third row sits a man with grey hair and a thick notebook. Gerhard Wolff is 68 years old – and for two semesters he has been a guest student at the University of Tübingen.

    "As a young man I had no opportunity to study," he says. "My parents had little money, so I started an apprenticeship at sixteen." For over forty years he drove a bus in Reutlingen. "I always dreamed of studying history. When I retired, I decided to finally give it a try."

    As a guest student you don't need the Abitur. You pay a fee per semester and may attend many lectures. Guest students don't usually sit exams, and they don't get a degree either. "I don't care," says Wolff. "I'm learning to understand the world better, not for a mark." Many universities also offer special tours, courses and talks for older people.

    At first it wasn't easy. "It felt strange to sit still and listen for hours again. And the young people type everything on their laptops – I write with a biro." By now he even has a study group: three students explain to him how the online library works, and in return he tells them what life was like in the sixties. Next semester he even wants to attend a seminar in which you have to give a presentation yourself.

    What would he advise other older people? "You shouldn't be afraid to ask questions. And you shouldn't think that you're too old. It's never too late to start something new."
