- slug: leihen-statt-kaufen
  kind: reading
  title: Leihen statt kaufen
  topic: Work and the economy
  summary: Read a report about a "library of things" in Kassel, where members borrow drills, tents and sewing machines instead of buying them.
  free: false
  text: |
    Im Erdgeschoss eines ehemaligen Ladens in der Kasseler Nordstadt stehen Regale voller Dinge, die man nicht jeden Tag braucht: Bohrmaschinen, Zelte, Nähmaschinen, ein Raclette-Grill, eine Leiter, sogar ein Kinderwagen. Was wie ein gut sortierter Baumarkt aussieht, ist eine „Bibliothek der Dinge“. Wer Mitglied ist, kann sich hier Gegenstände ausleihen – so einfach wie Bücher in der Stadtbibliothek.

    Die Idee ist nicht neu, aber sie verbreitet sich. In vielen deutschen Städten gibt es inzwischen sogenannte Leihläden, die meist von Vereinen getragen und von Ehrenamtlichen betrieben werden. Die Mitgliedschaft kostet in Kassel zwanzig Euro im Jahr; wer wenig verdient, zahlt weniger.

    „Eine Bohrmaschine soll in ihrem ganzen Leben nur wenige Minuten benutzt werden“, sagt Greta Lindholm, die den Laden vor drei Jahren mitgegründet hat. Ob diese oft zitierte Zahl stimmt, weiß sie selbst nicht genau. „Aber das Prinzip ist richtig. Warum sollen zwanzig Haushalte in einem Haus zwanzig Bohrmaschinen besitzen, wenn eine reicht?“

    Die Gegenstände stammen fast alle aus Spenden. Bevor sie verliehen werden, prüft ein Team aus Freiwilligen, ob sie sicher funktionieren. Elektrische Geräte werden regelmäßig getestet, kaputte Teile wenn möglich repariert. Wer etwas ausleiht, trägt sich in eine Liste ein und bringt es innerhalb einer Woche zurück.

    Für viele Mitglieder geht es nicht nur ums Geld. Jakob Ferreira, Student und Vater einer kleinen Tochter, leiht sich regelmäßig Werkzeug und Campingausrüstung aus. „Unsere Wohnung hat zweiundvierzig Quadratmeter. Ich habe einfach keinen Platz für ein Zelt, das ich zweimal im Jahr brauche“, sagt er. Andere schätzen die Begegnungen: Im Laden trifft man Nachbarn, tauscht Tipps aus und bekommt manchmal gleich eine Einführung in die Bedienung einer Stichsäge.

    Ganz ohne Probleme läuft das Projekt allerdings nicht. Der Raum ist zu klein, die Miete steigt, und es fehlt an Freiwilligen, die bereit sind, regelmäßig Schichten zu übernehmen. Außerdem kommen manche Gegenstände beschädigt zurück, ohne dass jemand etwas sagt.

    Trotzdem ist Greta Lindholm optimistisch. Die Stadt hat angekündigt, das Projekt im nächsten Jahr mit einem Zuschuss zu unterstützen, und eine Gesamtschule möchte gemeinsam mit ihren Schülerinnen und Schülern eine kleine Reparaturwerkstatt einrichten. „Wir wollen niemandem das Kaufen verbieten“, sagt sie. „Aber jedes Ding, das geteilt wird, muss nicht neu produziert werden.“
  translation: |
    On the ground floor of a former shop in Kassel's Nordstadt district there are shelves full of things you don't need every day: drills, tents, sewing machines, a raclette grill, a ladder, even a pram. What looks like a well-stocked DIY store is a "library of things". Members can borrow items here – as easily as books from the public library.

    The idea isn't new, but it is spreading. In many German cities there are now so-called lending shops, which are usually run by associations and staffed by volunteers. Membership in Kassel costs twenty euros a year; people on low incomes pay less.

    "A drill is supposed to be used for only a few minutes in its whole lifetime," says Greta Lindholm, who co-founded the shop three years ago. She doesn't know exactly whether this often-quoted figure is true. "But the principle is right. Why should twenty households in one building own twenty drills when one is enough?"

    Almost all the items come from donations. Before they are lent out, a team of volunteers checks that they work safely. Electrical devices are tested regularly and broken parts are repaired where possible. Anyone who borrows something signs a list and brings it back within a week.

    For many members it isn't just about money. Jakob Ferreira, a student and the father of a little daughter, regularly borrows tools and camping equipment. "Our flat is forty-two square metres. I simply have no room for a tent I need twice a year," he says. Others value the encounters: in the shop you meet neighbours, swap tips and sometimes get an introduction to using a jigsaw on the spot.

    The project isn't entirely without problems, though. The room is too small, the rent is rising, and there is a shortage of volunteers willing to take on regular shifts. Some items also come back damaged without anyone saying anything.

    Even so, Greta Lindholm is optimistic. The city has announced that it will support the project with a grant next year, and a comprehensive school wants to set up a small repair workshop together with its pupils. "We don't want to stop anyone from buying things," she says. "But every thing that is shared doesn't have to be newly produced."
  glossary: |
    ausleihen | to borrow; to lend | sich etwas ausleihen = to borrow
    der Leihladen | lending shop | Also: die Bibliothek der Dinge
    der Gegenstand | object; item | pl. die Gegenstände
    die Spende | donation | Verb: spenden
    verleihen | to lend out | Also: to award (einen Preis verleihen)
    die Ausrüstung | equipment; gear | die Campingausrüstung
    die Stichsäge | jigsaw
    der Zuschuss | grant; subsidy | einen Zuschuss bekommen
  questions: |
    mc: How much does membership cost in Kassel? || Nothing at all | *Twenty euros a year, less for people on low incomes | Twenty euros a month || "Die Mitgliedschaft kostet in Kassel zwanzig Euro im Jahr; wer wenig verdient, zahlt weniger."
    tf: Greta Lindholm is sure that a drill is only used for a few minutes in its lifetime. || false || "Ob diese oft zitierte Zahl stimmt, weiß sie selbst nicht genau."
