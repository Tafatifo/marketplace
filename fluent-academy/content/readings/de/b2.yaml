- slug: wenn-der-melder-piept
  kind: reading
  title: Wenn der Melder piept
  topic: Citizenship and public life
  summary: Read a portrait of a volunteer firefighter in a village — and learn about the rights, duties and problems of Germany's volunteer fire brigades.
  free: false
  text: |
    Es ist kurz nach drei Uhr nachts, als der kleine Funkmelder auf Kerstin Yilmaz' Nachttisch zu piepen beginnt. Vier Minuten später sitzt die achtunddreißigjährige Bankkauffrau im Feuerwehrauto, vierzehn Minuten später steht sie mit Atemschutzmaske vor einem brennenden Schuppen am Ortsrand. Bezahlt wird sie dafür nicht. Kerstin Yilmaz ist Mitglied der Freiwilligen Feuerwehr in einem Dorf im Westerwald, und wie bei den meisten Feuerwehren in Deutschland besteht ihr ganzes Team aus Ehrenamtlichen.

    Tatsächlich gibt es Berufsfeuerwehren fast nur in größeren Städten. Im übrigen Land sind es Freiwillige, die bei Bränden, Unfällen und Unwettern als Erste vor Ort sind. Ohne sie würde der Brandschutz in weiten Teilen des Landes zusammenbrechen. Die Gemeinden sind gesetzlich verpflichtet, für eine funktionierende Feuerwehr zu sorgen, und stellen Fahrzeuge, Ausrüstung und Gerätehäuser zur Verfügung.

    Auch für die Freiwilligen selbst bringt das Ehrenamt Rechte und Pflichten mit sich. Wer zu einem Einsatz gerufen wird, darf seinen Arbeitsplatz verlassen; der Arbeitgeber muss ihn freistellen und bekommt den Lohnausfall in der Regel von der Gemeinde erstattet. Im Gegenzug verpflichten sich die Mitglieder, regelmäßig an Übungen teilzunehmen und Lehrgänge zu besuchen – von der Grundausbildung bis zum Atemschutz.

    Das größte Problem vieler Wehren ist inzwischen die Tagesverfügbarkeit. Früher arbeiteten die meisten Mitglieder im Ort, heute pendeln viele in die nächste Stadt. „Nachts und am Wochenende sind wir gut aufgestellt“, sagt Wehrführer Bernd Kaiser. „Aber an einem Dienstagvormittag kann es passieren, dass nur drei Leute kommen.“ Einige Gemeinden versuchen deshalb, Beschäftigte des Bauhofs oder der Verwaltung für die Feuerwehr zu gewinnen, weil sie tagsüber vor Ort sind.

    Gleichzeitig hat sich die Feuerwehr verändert. Vor dreißig Jahren war sie in vielen Dörfern ein reiner Männerverein; heute wächst der Anteil der Frauen, auch wenn sie noch deutlich in der Minderheit sind. Viele Wehren haben eine Jugendfeuerwehr, in der Kinder und Jugendliche spielerisch lernen, wie man einen Schlauch ausrollt oder einen Notruf absetzt. Für die Zukunft der Feuerwehr ist diese Nachwuchsarbeit entscheidend.

    Warum tut sich Kerstin Yilmaz das an – die kurzen Nächte, die Übungen am Freitagabend, die Bilder von Unfällen, die man nicht so schnell vergisst? Sie überlegt kurz. „Weil ich weiß, dass sonst niemand kommt“, sagt sie dann. „Und weil man in keinem anderen Verein so schnell lernt, sich hundertprozentig auf andere zu verlassen.“
  translation: |
    It is just after three in the morning when the small pager on Kerstin Yilmaz's bedside table starts to beep. Four minutes later the thirty-eight-year-old bank clerk is sitting in the fire engine; fourteen minutes later she is standing in a breathing mask in front of a burning shed on the edge of the village. She isn't paid for this. Kerstin Yilmaz is a member of the volunteer fire brigade in a village in the Westerwald, and, as with most fire brigades in Germany, her whole team consists of volunteers.

    In fact, professional fire services exist almost only in larger cities. In the rest of the country it is volunteers who are first on the scene at fires, accidents and storms. Without them, fire protection would collapse in large parts of the country. Local councils are legally obliged to ensure a functioning fire brigade and provide vehicles, equipment and fire stations.

    For the volunteers themselves, too, the role brings rights and duties. Anyone called out on a mission may leave their workplace; the employer must release them and is usually reimbursed by the local council for the lost wages. In return, members commit to taking part in exercises regularly and attending training courses – from basic training to the use of breathing apparatus.

    The biggest problem for many brigades now is availability during the day. In the past most members worked in the village; today many commute to the nearest town. "At night and at weekends we're well staffed," says brigade leader Bernd Kaiser. "But on a Tuesday morning it can happen that only three people turn up." Some councils therefore try to recruit staff from the municipal works depot or the administration for the fire brigade, because they are on site during the day.

    At the same time, the fire brigade has changed. Thirty years ago it was an all-male club in many villages; today the proportion of women is growing, even if they are still clearly in the minority. Many brigades have a youth fire brigade, where children and teenagers learn through play how to roll out a hose or make an emergency call. This work with young recruits is crucial for the future of the fire brigade.

    Why does Kerstin Yilmaz put herself through it – the short nights, the exercises on Friday evenings, the images of accidents that you don't forget quickly? She thinks for a moment. "Because I know that otherwise nobody will come," she then says. "And because in no other club do you learn so quickly to rely one hundred per cent on others."
  glossary: |
    der Funkmelder | (radio) pager | Informal: der Piepser
    der Einsatz | mission; call-out; operation | pl. die Einsätze
    der Brandschutz | fire protection
    freistellen | to release (from work) | Separable
    erstatten | to reimburse | Noun: die Erstattung
    der Lehrgang | training course | pl. die Lehrgänge
    der Nachwuchs | young recruits; the next generation
    sich etwas antun | to put oneself through something | Warum tust du dir das an?
  questions: |
    mc: According to the text, who protects most of Germany against fires? || Professional fire services | *Volunteer fire brigades | Private security companies || "Im übrigen Land sind es Freiwillige, die … als Erste vor Ort sind."
    tf: Kerstin Yilmaz is paid for each mission. || false || "Bezahlt wird sie dafür nicht."
    short: Why is it difficult to find enough firefighters during the day? || kw: pendeln/pendel/commute/stadt/town/city/arbeit/work || Many members now work in the nearest town and commute, so they aren't in the village during the day.
    fill: Der Arbeitgeber muss sie ___ und bekommt den Lohnausfall in der Regel erstattet. || freistellen || "… der Arbeitgeber muss ihn freistellen und bekommt den Lohnausfall in der Regel von der Gemeinde erstattet."
    mc: Why does Kerstin Yilmaz do this work? || Because it is well paid | *Because otherwise nobody would come, and she learns to rely on others | Because her employer expects it || "Weil ich weiß, dass sonst niemand kommt … sich hundertprozentig auf andere zu verlassen."

- slug: faktencheck-im-radio
  kind: listening
  title: Faktencheck im Radio
  topic: Media and persuasion
  summary: Listen to a radio interview with a fact-checker who explains how to tell whether a viral photo is genuine.
  free: true
  speakers: M=Lukas Brenner/m; F=Selin Kaya/f
  text: |
    M: Guten Abend und willkommen bei „Netz und Wirklichkeit“. Mein Gast heute ist Selin Kaya, sie arbeitet seit sechs Jahren als Faktencheckerin. Frau Kaya, wie viele falsche Bilder landen eigentlich pro Woche auf Ihrem Tisch?
    F: Das ist schwer zu sagen, weil wir nur einen Bruchteil überprüfen können. Aber es sind jede Woche Dutzende, bei großen Ereignissen auch Hunderte.
    M: Viele Hörerinnen und Hörer fragen sich: Woran erkenne ich, ob ein Foto echt ist?
    F: Zuerst sollte man sich fragen, wie man selbst reagiert. Wenn ein Bild einen sofort wütend oder ängstlich macht, ist das ein Warnsignal. Falschmeldungen sind oft genau darauf ausgelegt.
    M: Und dann? Was ist der erste praktische Schritt?
    F: Die umgekehrte Bildersuche. Man lädt das Foto bei einer Suchmaschine hoch und sieht, wo es schon früher aufgetaucht ist. Sehr oft stellt sich heraus, dass ein angeblich aktuelles Bild Jahre alt ist oder aus einem ganz anderen Land stammt.
    M: Können Sie ein Beispiel nennen?
    F: Letzten Winter kursierte ein Foto, das angeblich überflutete Straßen in Dresden zeigte. In Wirklichkeit war es bei einem Hochwasser in Italien aufgenommen worden – das konnte man an den Straßenschildern erkennen.
    M: Details spielen also eine große Rolle.
    F: Unbedingt. Schilder, Autokennzeichen, das Wetter, der Stand der Sonne – all das kann verraten, wann und wo ein Foto entstanden ist. Wir vergleichen solche Hinweise zum Beispiel mit Wetterdaten oder mit Satellitenbildern.
    M: Inzwischen gibt es auch Bilder, die komplett von künstlicher Intelligenz erzeugt werden. Erkennt man die überhaupt noch?
    F: Immer schwerer. Früher hatten solche Bilder oft Fehler, zum Beispiel Hände mit sechs Fingern oder unleserliche Schrift. Die Programme werden aber ständig besser. Deshalb ist die Frage nach der Quelle heute noch wichtiger als die Frage nach dem Bild selbst.
    M: Was meinen Sie damit genau?
    F: Wer hat das Bild zuerst veröffentlicht? Ist das ein bekannter Fotograf, eine Nachrichtenagentur oder ein anonymer Account, der vor zwei Wochen erstellt wurde? Wenn niemand sagen kann, woher ein Bild stammt, sollte man es auf keinen Fall weiterverbreiten.
    M: Viele Menschen teilen solche Bilder ja nicht aus böser Absicht, sondern weil sie andere warnen wollen.
    F: Genau, und das ist das Tückische. Die meisten, die Falschmeldungen weiterleiten, meinen es gut. Mein wichtigster Rat lautet deshalb: Erst prüfen, dann teilen. Und wenn man keine Zeit zum Prüfen hat, dann eben gar nicht teilen.
    M: Frau Kaya, vielen Dank für das Gespräch.
  translation: |
    Presenter: Good evening and welcome to "Net and Reality". My guest today is Selin Kaya, who has worked as a fact-checker for six years. Ms Kaya, how many fake pictures actually land on your desk each week?
    Selin Kaya: That's hard to say, because we can only check a fraction of them. But it's dozens every week, and hundreds when there are big events.
    Presenter: Many listeners ask themselves: how can I tell whether a photo is genuine?
    Selin Kaya: First you should ask yourself how you are reacting. If a picture immediately makes you angry or afraid, that's a warning sign. False reports are often designed to do exactly that.
    Presenter: And then? What's the first practical step?
    Selin Kaya: A reverse image search. You upload the photo to a search engine and see where it has appeared before. Very often it turns out that a supposedly current picture is years old or comes from a completely different country.
    Presenter: Can you give an example?
    Selin Kaya: Last winter a photo was circulating that supposedly showed flooded streets in Dresden. In reality it had been taken during a flood in Italy – you could tell from the street signs.
    Presenter: So details play a big role.
    Selin Kaya: Absolutely. Signs, number plates, the weather, the position of the sun – all of that can reveal when and where a photo was taken. We compare clues like these with weather data or satellite images, for example.
    Presenter: Nowadays there are also pictures that are generated entirely by artificial intelligence. Can you still recognise them at all?
    Selin Kaya: It's getting harder and harder. Such pictures used to have frequent mistakes, for example hands with six fingers or illegible writing. But the programs are constantly improving. That's why the question of the source is even more important today than the question about the picture itself.
    Presenter: What exactly do you mean by that?
    Selin Kaya: Who published the picture first? Is it a well-known photographer, a news agency or an anonymous account that was created two weeks ago? If nobody can say where a picture comes from, you should certainly not spread it any further.
    Presenter: Many people don't share pictures like these out of malice, of course, but because they want to warn others.
    Selin Kaya: Exactly, and that's what makes it tricky. Most people who forward false reports mean well. So my most important advice is: check first, then share. And if you don't have time to check, then just don't share at all.
    Presenter: Ms Kaya, thank you very much for talking to us.
  glossary: |
    der Bruchteil | fraction
    das Warnsignal | warning sign
    ausgelegt sein auf | to be designed for
    die umgekehrte Bildersuche | reverse image search
    auftauchen | to appear; to turn up | Separable, with sein
    kursieren | to circulate
    verraten | to reveal; to give away | Irregular: verriet, hat verraten
    tückisch | tricky; treacherous | das Tückische = the tricky thing
    weiterverbreiten | to spread further
  questions: |
    mc: According to Selin Kaya, what is a warning sign? || A photo with very bright colours | *A picture that immediately makes you angry or afraid | A photo shared by a news agency || "Wenn ein Bild einen sofort wütend oder ängstlich macht, ist das ein Warnsignal."
    tf: The photo of the flooded streets was really taken in Dresden. || false || "In Wirklichkeit war es bei einem Hochwasser in Italien aufgenommen worden."
    short: What is the first practical step to check a photo? || kw: bildersuche/image search/reverse/suchmaschine/search engine || A reverse image search with a search engine.
    fill: Mein wichtigster Rat lautet deshalb: Erst prüfen, dann ___. || teilen || "Erst prüfen, dann teilen."
    mc: Why is the source becoming even more important than the picture itself? || Because photographers are often anonymous | *Because AI-generated images are getting harder to recognise | Because search engines no longer work || "Die Programme werden aber ständig besser. Deshalb ist die Frage nach der Quelle heute noch wichtiger …"

- slug: verhandlung-um-den-laden
  kind: listening
  title: Verhandlung um den Laden
  topic: Work and the economy
  summary: Listen to a young business founder negotiating the rent for an empty shop with its owner — and reaching a compromise.
  free: false
  speakers: V=Herr Okonkwo/m; J=Johanna Reiter/f
  text: |
    V: Frau Reiter, schön, dass Sie noch einmal vorbeikommen. Haben Sie sich den Laden in Ruhe angesehen?
    J: Ja, und ich bin wirklich begeistert. Die Lage ist ideal für meine Fahrradwerkstatt mit kleinem Café.
    V: Das freut mich. Hier laufen jeden Tag viele Studierende vorbei, und der nächste Fahrradladen ist mehr als zwei Kilometer entfernt.
    J: Genau deshalb habe ich mich sofort in den Laden verliebt. Allerdings habe ich noch Fragen zur Miete.
    V: Das dachte ich mir. Wie gesagt, ich hatte an tausendvierhundert Euro im Monat gedacht, plus Nebenkosten.
    J: Ehrlich gesagt hätte ich mit etwas weniger gerechnet. Der Laden steht seit über einem Jahr leer, und es muss einiges renoviert werden – der Boden, die Elektrik, die Wände.
    V: Das stimmt schon. Hätte ich vorher gewusst, wie lange die Suche dauert, hätte ich wahrscheinlich selbst renoviert. Was schwebt Ihnen denn vor?
    J: Ich könnte mir elfhundert Euro vorstellen. Dafür würde ich die Renovierung innen komplett selbst übernehmen und bezahlen.
    V: Elfhundert ist mir zu wenig. Die Fenster müssen ohnehin erneuert werden, und das kostet mich allein schon einen fünfstelligen Betrag.
    J: Das verstehe ich. Wie wäre es mit einer Staffelmiete? In den ersten beiden Jahren zahle ich weniger, solange das Geschäft noch aufgebaut wird, danach steigt die Miete.
    V: Darüber lässt sich reden. Was hätten Sie sich konkret vorgestellt?
    J: Zwölfhundert Euro in den ersten zwei Jahren und danach dreizehnhundertfünfzig.
    V: Hm. Unter einer Bedingung: Der Vertrag läuft mindestens fünf Jahre. Ich möchte nicht in zwei Jahren schon wieder jemanden suchen müssen.
    J: Fünf Jahre sind für mich in Ordnung, das war ohnehin mein Plan. Und wie sieht es mit der Kaution aus?
    V: Drei Monatsmieten, wie üblich.
    J: Wäre es möglich, die Kaution in drei Raten zu zahlen? Am Anfang habe ich durch die Renovierung hohe Ausgaben.
    V: Na gut, damit komme ich Ihnen gern entgegen. Also: Sie renovieren innen auf eigene Kosten, ich kümmere mich um die Fenster. Zwölfhundert Euro für zwei Jahre, danach dreizehnhundertfünfzig, Laufzeit fünf Jahre, Kaution in drei Raten.
    J: Genau so. Könnten Sie mir das bis Ende der Woche schriftlich schicken? Dann lasse ich den Vertrag noch von meiner Steuerberaterin prüfen.
    V: Mache ich. Und ich freue mich schon auf den ersten Kaffee in Ihrem Café.
    J: Der geht natürlich aufs Haus!
  translation: |
    Mr Okonkwo: Ms Reiter, nice of you to come by again. Have you had a good look at the shop?
    Johanna Reiter: Yes, and I'm really delighted. The location is ideal for my bicycle workshop with a small café.
    Mr Okonkwo: I'm glad. Lots of students walk past here every day, and the nearest bike shop is more than two kilometres away.
    Johanna Reiter: That's exactly why I fell in love with the shop straight away. But I still have some questions about the rent.
    Mr Okonkwo: I thought so. As I said, I had in mind fourteen hundred euros a month, plus service charges.
    Johanna Reiter: To be honest, I'd expected a bit less. The shop has been empty for over a year, and quite a lot needs renovating – the floor, the wiring, the walls.
    Mr Okonkwo: That's true. If I'd known how long the search would take, I'd probably have renovated it myself. What do you have in mind?
    Johanna Reiter: I could imagine eleven hundred euros. In return I would take on and pay for the whole interior renovation myself.
    Mr Okonkwo: Eleven hundred is too little for me. The windows need replacing anyway, and that alone will cost me a five-figure sum.
    Johanna Reiter: I understand. How about a graduated rent? In the first two years I pay less while the business is still being built up, and then the rent goes up.
    Mr Okonkwo: We can talk about that. What exactly did you have in mind?
    Johanna Reiter: Twelve hundred euros for the first two years and thirteen hundred and fifty after that.
    Mr Okonkwo: Hm. On one condition: the lease runs for at least five years. I don't want to have to look for someone again in two years' time.
    Johanna Reiter: Five years is fine for me; that was my plan anyway. And what about the deposit?
    Mr Okonkwo: Three months' rent, as usual.
    Johanna Reiter: Would it be possible to pay the deposit in three instalments? At the beginning I'll have high expenses because of the renovation.
    Mr Okonkwo: All right, I'm happy to meet you halfway on that. So: you renovate the interior at your own expense, I take care of the windows. Twelve hundred euros for two years, then thirteen hundred and fifty, a term of five years, and the deposit in three instalments.
    Johanna Reiter: Exactly. Could you send me that in writing by the end of the week? Then I'll have my tax adviser check the contract.
    Mr Okonkwo: Will do. And I'm already looking forward to the first coffee in your café.
    Johanna Reiter: That one's on the house, of course!
  glossary: |
    die Nebenkosten | service charges; additional costs | Plural only
    leer stehen | to be empty (of a building)
    vorschweben | to have in mind | Was schwebt Ihnen vor?
    ein fünfstelliger Betrag | a five-figure sum
    die Staffelmiete | graduated rent (rising in agreed steps)
    die Bedingung | condition | unter einer Bedingung
    die Laufzeit | term; duration (of a contract)
    die Kaution | deposit
    aufs Haus gehen | to be on the house
  questions: |
    mc: What does Johanna offer in return for a lower rent? || To sign a ten-year lease | *To do and pay for the interior renovation herself | To replace the windows || "Dafür würde ich die Renovierung innen komplett selbst übernehmen und bezahlen."
    tf: The owner accepts a rent of eleven hundred euros a month. || false || "Elfhundert ist mir zu wenig."
    fill: In den ersten zwei Jahren zahlt Johanna ___ Euro im Monat. || zwölfhundert / 1200 / eintausendzweihundert || "Zwölfhundert Euro in den ersten zwei Jahren und danach dreizehnhundertfünfzig."
