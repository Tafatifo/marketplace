- slug: sprechstunde-schlaf
  kind: listening
  title: "Sprechstunde: Schlafen wir zu wenig?"
  topic: Science and technology
  summary: Listen to a radio health programme in which a sleep researcher explains a headline about sleep and answers a listener's question.
  free: false
  speakers: M=Nina Albers/f; S=Prof. Kwame Asante/m; A=Herr Ludwig/m
  text: |
    M: Willkommen zur Gesundheitssprechstunde. Unser Thema heute: Schlaf. Bei mir im Studio ist der Schlafforscher Professor Kwame Asante. Herr Asante, diese Woche stand in vielen Zeitungen: „Wer weniger als sechs Stunden schläft, lebt kürzer.“ Stimmt das?
    S: So einfach ist es leider nicht. Die Schlagzeile bezieht sich auf eine Beobachtungsstudie. Dabei wurden mehrere Tausend Menschen über viele Jahre befragt. Es zeigte sich ein Zusammenhang: Wer sehr wenig schlief, hatte im Durchschnitt ein höheres Risiko für bestimmte Krankheiten.
    M: Aber ein Zusammenhang ist noch kein Beweis, oder?
    S: Genau. Ob der kurze Schlaf die Ursache ist, lässt sich mit so einer Studie nicht beweisen. Es könnte auch umgekehrt sein: Menschen, die bereits krank sind, schlafen oft schlechter. Oder beides hat eine dritte Ursache, zum Beispiel Stress oder Schichtarbeit.
    M: Wir haben einen Anrufer in der Leitung. Herr Ludwig aus Gera, Ihre Frage bitte.
    A: Guten Tag. Ich arbeite unter der Woche sehr viel und komme oft nur auf fünf Stunden Schlaf. Am Wochenende schlafe ich dafür bis mittags. Kann ich den Schlaf so nachholen?
    S: Zum Teil. Nach ein oder zwei kurzen Nächten kann der Körper einiges ausgleichen. Wenn Sie aber dauerhaft zu wenig schlafen, ist das am Wochenende nicht vollständig nachzuholen. Außerdem bringt das lange Ausschlafen Ihren Rhythmus durcheinander, sodass Sie am Sonntagabend schlecht einschlafen.
    A: Genau das passiert mir jede Woche!
    S: Das kennen viele. Das Wichtigste ist ein möglichst regelmäßiger Rhythmus. Gehen Sie, wenn es geht, jeden Tag ungefähr zur gleichen Zeit ins Bett und stehen Sie zur gleichen Zeit auf – auch am Wochenende.
    M: Wie viel Schlaf braucht ein Erwachsener denn eigentlich?
    S: Die meisten Fachgesellschaften empfehlen für Erwachsene sieben bis neun Stunden. Es gibt aber individuelle Unterschiede. Ein guter Hinweis ist, ob man tagsüber fit ist, ohne literweise Kaffee zu trinken.
    A: Da bin ich wohl kein gutes Beispiel. Was kann ich konkret tun?
    S: Kleine Schritte helfen schon. Trinken Sie ab dem frühen Nachmittag keinen Kaffee mehr, legen Sie das Handy eine halbe Stunde vor dem Schlafen weg, und halten Sie das Schlafzimmer kühl und dunkel. Und wenn Sie trotz allem dauerhaft schlecht schlafen, sollten Sie das ärztlich abklären lassen.
    A: Vielen Dank, das probiere ich aus.
    M: Herr Asante, zum Schluss: Wie sollten wir solche Schlagzeilen lesen?
    S: Mit Interesse, aber auch mit Vorsicht. Fragen Sie sich immer: Was wurde eigentlich untersucht, und wie? Eine einzelne Studie ist selten die ganze Wahrheit.
  translation: |
    Presenter: Welcome to the health surgery. Our topic today: sleep. With me in the studio is the sleep researcher Professor Kwame Asante. Professor Asante, this week many newspapers wrote: "People who sleep less than six hours live shorter lives." Is that true?
    Prof. Asante: Unfortunately it's not that simple. The headline refers to an observational study. Several thousand people were surveyed over many years. A correlation emerged: people who slept very little had, on average, a higher risk of certain illnesses.
    Presenter: But a correlation isn't proof yet, is it?
    Prof. Asante: Exactly. Whether short sleep is the cause can't be proven with a study like that. It could also be the other way round: people who are already ill often sleep worse. Or both have a third cause, for example stress or shift work.
    Presenter: We have a caller on the line. Mr Ludwig from Gera, your question, please.
    Mr Ludwig: Hello. I work a great deal during the week and often only get five hours' sleep. At the weekend I sleep until midday to make up for it. Can I catch up on sleep like that?
    Prof. Asante: Partly. After one or two short nights the body can make up for quite a lot. But if you sleep too little all the time, you can't fully catch up at the weekend. Also, sleeping in late disrupts your rhythm, so you have trouble falling asleep on Sunday evening.
    Mr Ludwig: That's exactly what happens to me every week!
    Prof. Asante: Lots of people know that. The most important thing is as regular a rhythm as possible. If you can, go to bed at roughly the same time every day and get up at the same time – at the weekend too.
    Presenter: How much sleep does an adult actually need?
    Prof. Asante: Most professional societies recommend seven to nine hours for adults. But there are individual differences. A good indication is whether you feel fit during the day without drinking litres of coffee.
    Mr Ludwig: I'm probably not a good example there. What can I actually do?
    Prof. Asante: Small steps already help. Stop drinking coffee from early afternoon, put your phone away half an hour before going to sleep, and keep the bedroom cool and dark. And if you still sleep badly all the time, you should have it checked by a doctor.
    Mr Ludwig: Thank you very much, I'll try that.
    Presenter: Professor Asante, finally: how should we read headlines like these?
    Prof. Asante: With interest, but also with caution. Always ask yourself: what was actually investigated, and how? A single study is rarely the whole truth.
  glossary: |
    die Schlagzeile | headline
    die Beobachtungsstudie | observational study
    der Zusammenhang | connection; correlation
    in der Leitung sein | to be on the line (phone)
    nachholen | to catch up on; to make up for | Separable
    ausschlafen | to sleep in; to have a lie-in | Separable
    durcheinanderbringen | to mix up; to disrupt | Separable
    ärztlich abklären lassen | to have something checked by a doctor
  questions: |
    mc: What kind of study is the headline based on? || A laboratory experiment with mice | *An observational study in which people were surveyed over many years | A study with only a few participants || "Die Schlagzeile bezieht sich auf eine Beobachtungsstudie. Dabei wurden mehrere Tausend Menschen über viele Jahre befragt."
    tf: According to Professor Asante, the study proves that short sleep causes illness. || false || "Ob der kurze Schlaf die Ursache ist, lässt sich mit so einer Studie nicht beweisen."
    short: What is the most important advice for Mr Ludwig? || kw: regelmäßig/regular/rhythmus/rhythm/gleiche zeit/same time || A regular rhythm: going to bed and getting up at about the same time every day, also at weekends.
    fill: Die meisten Fachgesellschaften empfehlen für Erwachsene sieben bis ___ Stunden. || neun / 9 || "… empfehlen für Erwachsene sieben bis neun Stunden."
    mc: Why is sleeping until midday at the weekend a problem? || It makes him put on weight. | *It disrupts his rhythm, so he can't fall asleep on Sunday evening. | It is bad for his back. || "… bringt das lange Ausschlafen Ihren Rhythmus durcheinander, sodass Sie am Sonntagabend schlecht einschlafen."

- slug: zehn-jahre-danach
  kind: listening
  title: Zehn Jahre danach
  topic: Looking ahead
  summary: Listen to two old friends meeting ten years after university, talking about the paths they took, what they regret and what they have learned.
  free: false
  speakers: C=Carla/f; B=Benedikt/m
  text: |
    C: Benedikt! Zehn Jahre, und du siehst fast genauso aus wie bei der Abschlussfeier.
    B: Und du bist charmant wie immer. Erzähl, wie ist das Leben in Lissabon?
    C: Schön, aber anders, als ich es mir damals vorgestellt hatte. Ich wollte ja eigentlich nur ein Jahr bleiben.
    B: Und dann hast du dich verliebt – in die Stadt oder in jemanden?
    C: In beides. Aber mal ehrlich: Hätte ich gewusst, wie schwer es ist, als Architektin in einem anderen Land Fuß zu fassen, wäre ich vielleicht nicht so spontan gegangen.
    B: Bereust du es?
    C: Nein. Ich hätte nur früher Portugiesisch lernen sollen. Die ersten zwei Jahre habe ich mich so durchgeschlagen, ohne die Hälfte der Gespräche im Büro zu verstehen. Und du? Du wolltest doch damals unbedingt Medizin studieren.
    B: Stimmt. Dann ist mein Vater krank geworden, und jemand musste die Bäckerei übernehmen. Ich dachte, es sei nur für ein paar Monate.
    C: Und daraus sind zehn Jahre geworden.
    B: Genau. Am Anfang habe ich mir oft vorgeworfen, dass ich meinen Traum aufgegeben habe. Wäre ich damals an die Uni gegangen, wäre ich heute vielleicht Kinderarzt.
    C: Und heute?
    B: Heute sehe ich das gelassener. Wir haben die Bäckerei umgebaut, backen mit Getreide aus der Region und bilden jedes Jahr zwei junge Leute aus. Das hätte ich mit dreiundzwanzig nie für möglich gehalten.
    C: Das klingt, als hättest du deinen Platz gefunden.
    B: Ich glaube schon. Weißt du eigentlich, was aus Mira geworden ist? Sie wollte doch auch kommen.
    C: Sie hat mir vorhin geschrieben, dass sie im Stau steht. Sie wird wieder viel zu spät losgefahren sein.
    B: Manche Dinge ändern sich eben nie. Schon damals hat sie jede Hausarbeit auf den letzten Drücker abgegeben.
    C: Und trotzdem hatte sie immer die besten Noten. Vielleicht sollten wir uns daran ein Beispiel nehmen.
    B: Lieber nicht. Aber sag mal: Was hast du in den zehn Jahren gelernt, Carla, wenn du es in einem Satz sagen müsstest?
    C: Dass man nicht jede Entscheidung perfekt treffen muss. Man muss nur bereit sein, etwas daraus zu machen.
    B: Darauf trinken wir. Und in zehn Jahren treffen wir uns wieder – bis dahin wirst du hoffentlich perfekt Portugiesisch gelernt haben.
    C: Und du wirst die beste Bäckerei Süddeutschlands aufgebaut haben.
  translation: |
    Carla: Benedikt! Ten years, and you look almost exactly the same as at the graduation party.
    Benedikt: And you're as charming as ever. Tell me, what's life like in Lisbon?
    Carla: Lovely, but different from how I imagined it back then. I actually only wanted to stay for a year.
    Benedikt: And then you fell in love – with the city or with someone?
    Carla: Both. But honestly: if I'd known how hard it is to get established as an architect in another country, I might not have gone so spontaneously.
    Benedikt: Do you regret it?
    Carla: No. I just should have learned Portuguese earlier. For the first two years I just muddled through without understanding half the conversations at the office. And you? You were absolutely determined to study medicine back then.
    Benedikt: That's right. Then my father fell ill, and someone had to take over the bakery. I thought it would only be for a few months.
    Carla: And that turned into ten years.
    Benedikt: Exactly. At first I often blamed myself for giving up my dream. If I'd gone to university back then, I might be a paediatrician today.
    Carla: And now?
    Benedikt: Now I'm more relaxed about it. We've rebuilt the bakery, we bake with grain from the region and we train two young people every year. At twenty-three I'd never have thought that possible.
    Carla: That sounds as if you've found your place.
    Benedikt: I think so. Do you actually know what's become of Mira? She was going to come too.
    Carla: She texted me a little while ago that she's stuck in traffic. She'll have set off far too late again.
    Benedikt: Some things never change. Even back then she handed in every essay at the last minute.
    Carla: And she still always got the best marks. Maybe we should take a leaf out of her book.
    Benedikt: Better not. But tell me: what have you learned in these ten years, Carla, if you had to say it in one sentence?
    Carla: That you don't have to make every decision perfectly. You just have to be prepared to make something of it.
    Benedikt: Let's drink to that. And in ten years we'll meet again – by then you'll hopefully have learned perfect Portuguese.
    Carla: And you'll have built up the best bakery in southern Germany.
  glossary: |
    die Abschlussfeier | graduation party
    Fuß fassen | to get established; to gain a foothold
    sich durchschlagen | to muddle through; to get by | Separable
    sich (dat.) etwas vorwerfen | to blame oneself for something
    gelassen | relaxed; calm
    für möglich halten | to consider possible
    im Stau stehen | to be stuck in traffic
    auf den letzten Drücker | at the last minute | informal
    etwas aus etwas machen | to make something of something
  questions: |
    mc: How long did Carla originally want to stay in Lisbon? || A few weeks | *One year | Ten years || "Ich wollte ja eigentlich nur ein Jahr bleiben."
    tf: Benedikt studied medicine after school. || false || His father fell ill and he took over the bakery instead.
    short: What should Carla have done earlier, in her opinion? || kw: portugiesisch/portuguese || Learned Portuguese.
    fill: Wäre ich damals an die Uni gegangen, wäre ich heute vielleicht ___. || Kinderarzt || "Wäre ich damals an die Uni gegangen, wäre ich heute vielleicht Kinderarzt."
    mc: Why is Mira late, according to Carla? || She forgot the date. | *She probably set off much too late and is stuck in traffic. | Her train was cancelled. || "Sie hat mir vorhin geschrieben, dass sie im Stau steht. Sie wird wieder viel zu spät losgefahren sein."
