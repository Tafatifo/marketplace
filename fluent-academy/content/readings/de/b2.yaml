- slug: heimat-im-plural
  kind: reading
  title: Heimat im Plural
  topic: Identity and society
  summary: Read a personal essay by a woman who grew up between Vietnamese and German culture in Rostock and explains why home, for her, has a plural.
  free: true
  text: |
    Wenn mich jemand fragt, wo meine Heimat ist, muss ich lachen – nicht, weil die Frage dumm wäre, sondern weil die ehrliche Antwort zu lang für ein kurzes Gespräch ist.

    Meine Eltern kamen Ende der Achtzigerjahre als Vertragsarbeiter aus Vietnam in die DDR, nach Rostock. Ich wurde dort geboren, wenige Monate bevor die Mauer fiel. Meine Kindheit war von zwei Welten geprägt, die sich nur am Küchentisch begegneten: draußen der raue Wind von der Ostsee, Plattdeutsch beim Bäcker und Fischbrötchen am Hafen; drinnen der Duft von Pho, die Stimmen aus Hanoi am Telefon und strenge Regeln für das Lernen.

    Lange habe ich geglaubt, ich müsse mich entscheiden. In der Schule wollte ich deutscher sein als alle anderen, in den Ferien bei meinen Verwandten in Vietnam fühlte ich mich dagegen wie eine Touristin mit gutem Wortschatz. Meine Cousinen lachten über meinen Akzent, meine Mitschüler in Rostock fragten, ob ich auch Kartoffeln mit Stäbchen esse.

    Erst während meines Studiums in Leipzig habe ich begriffen, dass Heimat kein Entweder-oder sein muss. Ein Professor sprach in einem Seminar von „Heimat im Plural“, und plötzlich hatte ich ein Wort für etwas, das ich seit Jahren fühlte. Heimat kann ein Ort sein, aber auch eine Sprache, ein Geschmack oder eine Gruppe von Menschen, denen man nichts erklären muss.

    Heute habe ich mehrere solcher Heimaten. Da ist Rostock, wo meine Eltern noch immer ihr kleines Restaurant am Stadthafen betreiben. Da ist Hanoi, wo ich die engen Gassen der Altstadt inzwischen besser kenne als manche Straßen in Leipzig. Und da ist meine Wohngemeinschaft in Leipzig, in der ein Brasilianer, eine Schwäbin und ich jeden Sonntag gemeinsam kochen – meistens zu scharf für die Schwäbin.

    Natürlich ist dieses Leben nicht immer bequem. Wer mehrere Heimaten hat, vermisst auch immer irgendetwas. Wenn ich in Vietnam bin, fehlt mir das Graubrot; wenn ich in Deutschland bin, fehlen mir die Garküchen an jeder Ecke und der Lärm der Mopeds. Aber ich habe aufgehört, dieses Gefühl als Mangel zu betrachten. Es ist eher ein Zeichen dafür, dass ich an mehreren Orten Wurzeln geschlagen habe.

    Wenn mich also das nächste Mal jemand fragt, wo meine Heimat ist, werde ich vielleicht einfach zurückfragen: „Hast du Zeit für einen Kaffee? Dann erzähle ich es dir.“

    Minh Anh Tran
  translation: |
    When someone asks me where home is, I have to laugh – not because the question is stupid, but because the honest answer is too long for a short conversation.

    My parents came from Vietnam to the GDR, to Rostock, as contract workers at the end of the eighties. I was born there a few months before the Wall came down. My childhood was shaped by two worlds that only met at the kitchen table: outside, the rough wind from the Baltic, Low German at the baker's and fish rolls at the harbour; inside, the smell of pho, the voices from Hanoi on the phone and strict rules about studying.

    For a long time I believed I had to choose. At school I wanted to be more German than everyone else, whereas on holiday with my relatives in Vietnam I felt like a tourist with a good vocabulary. My cousins laughed at my accent; my classmates in Rostock asked whether I ate potatoes with chopsticks too.

    It was only while studying in Leipzig that I understood that home doesn't have to be either-or. In a seminar a professor talked about "home in the plural", and suddenly I had a word for something I had felt for years. Home can be a place, but also a language, a taste or a group of people to whom you don't have to explain anything.

    Today I have several homes like that. There's Rostock, where my parents still run their small restaurant at the city harbour. There's Hanoi, where I now know the narrow lanes of the old town better than some streets in Leipzig. And there's my flat-share in Leipzig, where a Brazilian, a woman from Swabia and I cook together every Sunday – usually too spicy for the Swabian.

    Of course, this life isn't always comfortable. If you have several homes, you are always missing something. When I'm in Vietnam, I miss grey bread; when I'm in Germany, I miss the food stalls on every corner and the noise of the mopeds. But I've stopped seeing this feeling as a lack. It's more a sign that I have put down roots in several places.

    So the next time someone asks me where home is, I might simply ask back: "Have you got time for a coffee? Then I'll tell you."

    Minh Anh Tran
  glossary: |
    der Vertragsarbeiter | contract worker | Workers recruited by the GDR from countries such as Vietnam and Mozambique
    prägen | to shape | Meine Kindheit war von zwei Welten geprägt.
    sich begegnen | to meet (by chance) | Die beiden Welten begegneten sich am Küchentisch.
    begreifen | to understand; to grasp | Irregular: begriff, hat begriffen
    das Entweder-oder | either-or (choice) | Nominalised conjunction
    betreiben | to run (a business) | ein Restaurant betreiben
    die Garküche | street food stall | Small kitchen selling cooked food
    Wurzeln schlagen | to put down roots
  questions: |
    mc: Where was the author born? || *In Rostock | In Hanoi | In Leipzig || "Meine Eltern kamen … in die DDR, nach Rostock. Ich wurde dort geboren."
    tf: On holiday in Vietnam, the author felt completely at home as a teenager. || false || She felt "wie eine Touristin mit gutem Wortschatz" – like a tourist with a good vocabulary.
    short: When did the author realise that home doesn't have to be either-or? || kw: studium/studies/studying/university/uni/leipzig/seminar || While she was studying in Leipzig, during a seminar.
