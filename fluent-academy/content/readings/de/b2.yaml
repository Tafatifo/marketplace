    fill: Wer etwas ausleiht, bringt es innerhalb einer ___ zurück. || Woche || "… und bringt es innerhalb einer Woche zurück."
    mc: Which problem does the project have? || Nobody wants to borrow anything. | *There aren't enough volunteers for regular shifts. | The city wants to close it. || "… es fehlt an Freiwilligen, die bereit sind, regelmäßig Schichten zu übernehmen."

- slug: wissenschaft-zum-mitmachen
  kind: reading
  title: Wissenschaft zum Mitmachen
  topic: Science and technology
  summary: Read about citizen science — volunteers who count insects and measure air quality — and the questions it raises about reliable data.
  free: false
  text: |
    Jeden Morgen um sieben Uhr geht Renate Albrecht mit einer Tasse Kaffee in ihren Garten am Stadtrand von Bamberg, setzt sich auf die Bank neben dem Apfelbaum und zählt. Zehn Minuten lang notiert die pensionierte Lehrerin jedes Insekt, das sich auf ihren Blumen niederlässt: Wildbienen, Schwebfliegen, Hummeln, Schmetterlinge. Ihre Ergebnisse lädt sie anschließend auf eine Internetplattform hoch, wo sie von Forschenden ausgewertet werden.

    Renate Albrecht ist eine von Zehntausenden Menschen in Deutschland, die sich an sogenannten Citizen-Science-Projekten beteiligen. Auf Deutsch spricht man auch von Bürgerwissenschaft. Die Idee: Laien sammeln Daten, die Fachleute allein niemals erheben könnten – über Vögel und Insekten, über die Qualität von Flüssen, über Lärm und Luftverschmutzung in der eigenen Straße. Manche Projekte laufen über eine App, bei anderen werden kleine Messgeräte an Balkonen oder Fenstern befestigt.

    Für die Wissenschaft ist das ein großer Gewinn. „Wir könnten niemals so viele Orte gleichzeitig beobachten“, erklärt die Biologin Dr. Sanna Koivisto, die ein Projekt zur Insektenvielfalt leitet. „Je mehr Menschen mitmachen, desto genauer wird unser Bild davon, wie sich die Natur verändert.“ Daten aus solchen Projekten sind bereits in zahlreichen Fachzeitschriften veröffentlicht worden.

    Doch es gibt auch kritische Fragen. Wie zuverlässig sind Daten, die von Laien gesammelt werden? Nicht jede Hobbyforscherin kann eine seltene Wildbiene von einer gewöhnlichen unterscheiden. Die Projekte arbeiten deshalb mit klaren Anleitungen, Fotos zur Bestimmung und Online-Schulungen. Ungewöhnliche Meldungen werden von Fachleuten überprüft, bevor sie in die Auswertung eingehen. Außerdem lassen sich viele kleine Fehler durch die große Menge an Daten statistisch ausgleichen.

    Ein weiterer Kritikpunkt betrifft die Verteilung: Die meisten Freiwilligen sind gut gebildet, eher älter und leben in Städten oder deren Umgebung. Ländliche Regionen und ärmere Stadtviertel sind in den Daten oft unterrepräsentiert. Mehrere Projekte versuchen deshalb gezielt, Schulen und Jugendgruppen zu gewinnen.

    Für Renate Albrecht hat das Zählen ihren Blick auf den eigenen Garten verändert. „Früher habe ich einfach gemäht, wann es mir gepasst hat“, sagt sie. „Heute lasse ich eine Ecke wild wachsen, weil ich gesehen habe, wie viele Insekten sich dort aufhalten.“ Inzwischen hat sie sogar ihre Nachbarn überzeugt mitzumachen, und im Winter zählt sie zusätzlich die Vögel am Futterhäuschen. Wissenschaft, sagt sie, sei für sie nichts mehr, was nur in Laboren stattfinde. „Sie beginnt vor meiner Haustür.“
  translation: |
    Every morning at seven o'clock Renate Albrecht goes into her garden on the outskirts of Bamberg with a cup of coffee, sits down on the bench next to the apple tree and counts. For ten minutes the retired teacher notes every insect that lands on her flowers: wild bees, hoverflies, bumblebees, butterflies. She then uploads her results to an online platform, where they are analysed by researchers.

    Renate Albrecht is one of tens of thousands of people in Germany who take part in so-called citizen science projects. In German it is also called Bürgerwissenschaft. The idea: laypeople collect data that experts alone could never gather – about birds and insects, about the quality of rivers, about noise and air pollution in their own street. Some projects run through an app; in others, small measuring devices are attached to balconies or windows.

    For science this is a big gain. "We could never observe so many places at the same time," explains the biologist Dr Sanna Koivisto, who leads a project on insect diversity. "The more people take part, the more precise our picture of how nature is changing." Data from such projects have already been published in numerous scientific journals.

    But there are also critical questions. How reliable are data collected by laypeople? Not every amateur researcher can tell a rare wild bee from a common one. The projects therefore work with clear instructions, photos for identification and online training. Unusual reports are checked by experts before they are included in the analysis. In addition, many small errors can be balanced out statistically by the large amount of data.

    Another criticism concerns distribution: most volunteers are well educated, rather older and live in cities or their surroundings. Rural regions and poorer neighbourhoods are often under-represented in the data. Several projects are therefore making a targeted effort to win over schools and youth groups.

    For Renate Albrecht, counting has changed the way she sees her own garden. "I used to just mow whenever it suited me," she says. "Now I let one corner grow wild, because I've seen how many insects spend time there." She has even persuaded her neighbours to join in, and in winter she also counts the birds at the bird feeder. Science, she says, is no longer something that only takes place in laboratories. "It starts on my doorstep."
  glossary: |
    sich niederlassen | to land; to settle | Ein Schmetterling lässt sich auf der Blume nieder.
    auswerten | to analyse; to evaluate | Noun: die Auswertung
    sich beteiligen an | to take part in | an + dative
    Daten erheben | to collect data | formal
    die Anleitung | instructions; guide
    ausgleichen | to balance out; to compensate for
    unterrepräsentiert | under-represented
    mähen | to mow | den Rasen mähen
  questions: |
    mc: What does Renate Albrecht do every morning? || She waters all her flowers. | *She counts the insects in her garden for ten minutes. | She photographs birds for a newspaper. || "Zehn Minuten lang notiert die pensionierte Lehrerin jedes Insekt …"
