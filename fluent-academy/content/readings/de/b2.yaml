- slug: pfeifen-baelge-und-geduld
  kind: reading
  title: Pfeifen, Bälge und viel Geduld
  topic: Arts and culture
  summary: Visit an organ builder's workshop and learn why organ building in Germany is part of UNESCO's intangible cultural heritage — and what threatens it.
  free: false
  text: |
    In der Werkstatt von Hannah Brückner riecht es nach Holz, Leim und heißem Metall. Auf einer langen Werkbank liegen Dutzende Orgelpfeifen in allen Größen – manche kürzer als ein Bleistift, andere so lang wie ein Mensch. „Eine mittelgroße Kirchenorgel hat zwischen tausend und dreitausend Pfeifen“, erklärt die Orgelbaumeisterin. „Jede einzelne muss von Hand gestimmt werden.“ Den nötigen Wind liefern große Bälge, die früher von Hand oder mit den Füßen betrieben wurden und heute meist elektrisch gefüllt werden.

    Orgelbau ist eines der ältesten Handwerke Europas, und Deutschland hat eine besonders reiche Tradition. Im siebzehnten und achtzehnten Jahrhundert bauten Meister wie Arp Schnitger im Norden oder Gottfried Silbermann in Sachsen Instrumente, die zum Teil bis heute gespielt werden. Wegen dieser langen Tradition hat die UNESCO den Orgelbau und die Orgelmusik in Deutschland im Jahr 2017 in die Liste des immateriellen Kulturerbes der Menschheit aufgenommen.

    Immateriell – das bedeutet: Geschützt wird nicht ein bestimmtes Gebäude, sondern Wissen und Können, das von Generation zu Generation weitergegeben wird. Genau darin liegt die Herausforderung. Die Ausbildung zum Orgelbauer dauert dreieinhalb Jahre, und wer später eine eigene Werkstatt führen will, braucht viel Erfahrung. „Man lernt nie aus“, sagt Brückner. „Jede Orgel ist ein Einzelstück, das für einen bestimmten Raum gebaut wird. Die Akustik einer Dorfkirche ist eine ganz andere als die eines Konzertsaals.“

    Der größte Teil ihrer Arbeit sind allerdings keine Neubauten, sondern Restaurierungen. Viele historische Orgeln haben Kriege, Feuchtigkeit und gut gemeinte, aber missglückte Modernisierungen überstanden. Trotz ihres Alters lassen sie sich oft wieder spielbar machen – vorausgesetzt, man geht mit großer Geduld vor. Bei der Restaurierung einer Orgel aus dem Jahr 1742 hat Brückners Team zwei Jahre lang jedes Teil dokumentiert, bevor überhaupt ein einziges Brett ersetzt wurde.

    Finanziert werden solche Projekte meist von Kirchengemeinden, Stiftungen und Fördervereinen. Doch angesichts sinkender Mitgliederzahlen fällt es vielen Gemeinden schwer, das Geld aufzubringen. Manche Kirchen werden geschlossen, und ihre Orgeln stehen plötzlich ohne Zuhause da. Einige wurden bereits ins Ausland verkauft.

    Dennoch blickt Hannah Brückner optimistisch in die Zukunft. Immer mehr Konzerthäuser und Musikhochschulen interessieren sich für neue Instrumente, und bei offenen Werkstatttagen stehen junge Leute Schlange, um einmal selbst eine Pfeife zum Klingen zu bringen. „Eine Orgel ist ein Instrument, dessen Klang man im ganzen Körper spürt“, sagt sie. „Wer das einmal erlebt hat, versteht, warum es sich lohnt, dieses Handwerk zu bewahren.“
  translation: |
    Hannah Brückner's workshop smells of wood, glue and hot metal. On a long workbench lie dozens of organ pipes of all sizes – some shorter than a pencil, others as long as a person. "A medium-sized church organ has between one and three thousand pipes," explains the master organ builder. "Every single one has to be tuned by hand." The necessary wind is supplied by large bellows, which used to be worked by hand or foot and are now mostly filled electrically.

    Organ building is one of the oldest crafts in Europe, and Germany has a particularly rich tradition. In the seventeenth and eighteenth centuries, masters such as Arp Schnitger in the north and Gottfried Silbermann in Saxony built instruments, some of which are still played today. Because of this long tradition, UNESCO added organ building and organ music in Germany to the list of the Intangible Cultural Heritage of Humanity in 2017.

    Intangible means that what is protected is not a particular building but knowledge and skill passed on from generation to generation. That is precisely the challenge. Training as an organ builder takes three and a half years, and anyone who wants to run their own workshop later needs a lot of experience. "You never stop learning," says Brückner. "Every organ is a one-off built for a particular space. The acoustics of a village church are quite different from those of a concert hall."

    Most of her work, however, is not new instruments but restorations. Many historic organs have survived wars, damp and well-meant but unsuccessful modernisations. Despite their age, they can often be made playable again – provided you proceed with great patience. When restoring an organ from 1742, Brückner's team spent two years documenting every part before a single board was replaced.

    Such projects are mostly financed by parishes, foundations and supporters' associations. But with membership numbers falling, many parishes find it hard to raise the money. Some churches are being closed, and their organs are suddenly left without a home. Some have already been sold abroad.

    Even so, Hannah Brückner looks to the future with optimism. More and more concert halls and music academies are interested in new instruments, and on open workshop days young people queue up to make a pipe sound for themselves. "An organ is an instrument whose sound you feel in your whole body," she says. "Anyone who has experienced that understands why it's worth preserving this craft."
  glossary: |
    die Pfeife | pipe (of an organ); whistle | pl. die Pfeifen
    der Balg | bellows | pl. die Bälge
    der Leim | glue
    stimmen | to tune (an instrument) | Also: to be right (Das stimmt.)
    das immaterielle Kulturerbe | intangible cultural heritage
    das Einzelstück | one-off; unique piece
    überstehen | to survive; to get through | Inseparable: hat überstanden
    der Förderverein | supporters' association
  questions: |
    mc: How many pipes does a medium-sized church organ have? || About a hundred | *Between one and three thousand | More than ten thousand || "Eine mittelgroße Kirchenorgel hat zwischen tausend und dreitausend Pfeifen."
