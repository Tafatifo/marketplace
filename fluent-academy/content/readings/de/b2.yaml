    fill: Je mehr Menschen mitmachen, desto ___ wird unser Bild davon, wie sich die Natur verändert. || genauer || "Je mehr Menschen mitmachen, desto genauer wird unser Bild …"
    mc: Which places are often under-represented in the data? || City centres and parks | *Rural regions and poorer neighbourhoods | Schools and universities || "Ländliche Regionen und ärmere Stadtviertel sind in den Daten oft unterrepräsentiert."

- slug: die-stadt-als-schwamm
  kind: reading
  title: Die Stadt als Schwamm
  topic: Environment
  summary: Read an explainer on the "sponge city" — how cities can store rainwater to cope with both heavy rain and heat, and why the idea is hard to put into practice.
  free: false
  text: |
    Wenn im Sommer ein heftiges Gewitter über eine deutsche Großstadt zieht, passiert oft dasselbe: Innerhalb weniger Minuten stehen Straßen und Unterführungen unter Wasser, Keller laufen voll, und die Kanalisation kann die Wassermassen nicht mehr aufnehmen. Wenige Wochen später ist es dagegen so trocken, dass Stadtbäume vertrocknen und die Hitze zwischen den Häusern kaum auszuhalten ist. Beide Probleme haben dieselbe Ursache: Städte sind zu großen Teilen versiegelt. Asphalt und Beton lassen kein Wasser in den Boden.

    Hier setzt das Konzept der Schwammstadt an. Die Idee, die vor allem durch Projekte in China bekannt geworden ist, klingt einfach: Eine Stadt soll Regenwasser wie ein Schwamm aufnehmen, speichern und bei Hitze langsam wieder abgeben – statt es so schnell wie möglich in die Kanalisation zu leiten.

    Wie das funktioniert, lässt sich an vielen Beispielen zeigen. Begrünte Dächer halten einen Teil des Regens zurück und kühlen gleichzeitig die Gebäude. Parkplätze werden entsiegelt und mit Rasengittersteinen gebaut, durch die das Wasser versickern kann. In Parks entstehen Mulden, die bei Starkregen kurzzeitig überflutet werden dürfen. Und unter neuen Straßenbäumen werden große Hohlräume angelegt, in denen sich Wasser sammelt, sodass die Bäume auch lange Trockenphasen überstehen.

    Ein Vorbild für viele Planerinnen und Planer ist Kopenhagen. Nach einem verheerenden Starkregen im Jahr 2011, der enorme Schäden verursacht hatte, entwickelte die dänische Hauptstadt einen umfassenden Plan: Straßen werden so umgebaut, dass sie bei Extremwetter das Wasser gezielt in Parks und ins Hafenbecken leiten. Auch in Deutschland gibt es inzwischen Neubauviertel, die nach dem Schwammstadt-Prinzip geplant wurden.

    Allerdings ist der Umbau bestehender Städte schwieriger als der Bau neuer Viertel. Unter vielen Straßen liegen Leitungen für Strom, Gas, Wasser und Internet, sodass für große Wasserspeicher kaum Platz ist. Außerdem kostet die Umgestaltung viel Geld, und die Erfolge sind oft erst nach Jahren sichtbar. Kritiker bemängeln zudem, dass Fördermittel häufig nur in Pilotprojekte fließen, während der normale Straßenbau weitergeht wie bisher.

    Fachleute sind sich dennoch weitgehend einig: Je mehr Flächen entsiegelt und begrünt werden, desto besser sind Städte auf Hitze und Starkregen vorbereitet. Das Schwammstadt-Prinzip ist zwar keine schnelle Lösung, aber es verbindet zwei Ziele, die sonst oft gegeneinander ausgespielt werden: mehr Schutz vor Überschwemmungen und mehr Lebensqualität für die Menschen, die in der Stadt wohnen.
  translation: |
    When a violent thunderstorm passes over a large German city in summer, the same thing often happens: within a few minutes streets and underpasses are under water, cellars flood and the sewer system can no longer take in the masses of water. A few weeks later, by contrast, it is so dry that city trees dry out and the heat between the buildings is almost unbearable. Both problems have the same cause: large parts of cities are sealed. Asphalt and concrete let no water into the ground.

    This is where the concept of the sponge city comes in. The idea, which became known mainly through projects in China, sounds simple: a city should absorb rainwater like a sponge, store it and release it slowly when it is hot – instead of channelling it into the sewers as quickly as possible.

    How this works can be shown with many examples. Green roofs hold back some of the rain and cool the buildings at the same time. Car parks are unsealed and built with grass pavers through which water can seep away. In parks, hollows are created that may be flooded for a short time during heavy rain. And under new street trees, large cavities are built in which water collects, so that the trees survive long dry spells too.

    A model for many planners is Copenhagen. After a devastating cloudburst in 2011 that had caused enormous damage, the Danish capital developed a comprehensive plan: streets are being rebuilt so that in extreme weather they channel the water into parks and the harbour basin. In Germany too there are now new districts that were planned according to the sponge-city principle.

    However, converting existing cities is harder than building new districts. Under many streets there are pipes and cables for electricity, gas, water and the internet, so there is hardly any room for large water reservoirs. Redesigning also costs a lot of money, and the results often only become visible after years. Critics also complain that funding often only goes into pilot projects while ordinary road building carries on as before.

    Nevertheless, experts largely agree: the more surfaces are unsealed and planted, the better prepared cities are for heat and heavy rain. The sponge-city principle is not a quick solution, but it combines two goals that are otherwise often played off against each other: more protection from flooding and a better quality of life for the people who live in the city.
  glossary: |
    versiegelt | sealed (with asphalt or concrete) | Opposite: entsiegelt
    die Kanalisation | sewer system
    aufnehmen | to absorb; to take in | Separable
    versickern | to seep away (into the ground)
    die Mulde | hollow; depression (in the ground)
    der Hohlraum | cavity; hollow space | pl. die Hohlräume
    verheerend | devastating
    gegeneinander ausspielen | to play off against each other
  questions: |
