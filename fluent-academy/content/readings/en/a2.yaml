    tf: The money from the dinner will help the local food bank. || true || "All the money is going to help the local food bank."

- slug: at-the-pharmacy
  kind: listening
  title: At the pharmacy
  topic: Health and the body
  summary: A man with a bad cold asks a pharmacist for help. Listen for his symptoms and the instructions for his medicine.
  free: true
  speakers: P=Hannah/f; C=Dmitri/m
  text: |
    P: Hi there. How can I help you today?
    C: Hi. I have a terrible cold. My nose is running, and I have a sore throat.
    P: Oh, I'm sorry. Do you have a fever too?
    C: I don't think so. But I have a headache, and I'm really tired.
    P: When did it start?
    C: Two days ago. I have to work tomorrow, so I need something strong.
    P: Well, no medicine can stop a cold. But these tablets will help with the headache and the sore throat.
    C: How often should I take them?
    P: Take one tablet every four hours. But don't take more than six in one day.
    C: OK. Should I take them with food?
    P: Yes, it's better with food. And you should drink lots of water and rest.
    C: Can I take them with my allergy medicine?
    P: What do you take?
    C: Just one small pill every morning.
    P: Can I see the box? … Yes, that's fine. You can take them together.
    C: Great. And what about honey for my throat?
    P: Hot water with honey and lemon is great. If you don't feel better in a week, you should see your doctor.
    C: Thanks a lot. How much is that?
    P: That's eight dollars and fifty cents, please.
  glossary: |
    my nose is running | liquid is coming out of my nose
    sore throat | a pain in your throat
    tablet | a small, hard piece of medicine | also: pill
    How often…? | a question about how many times
    allergy | when your body reacts badly to something, like cats or nuts
    lemon | a yellow fruit with a sour taste
    feel better | stop feeling ill
  questions: |
    mc: What's the man's problem? || *He has a bad cold. | He hurt his back. | He has a stomachache. || "I have a terrible cold."
    tf: The man has a high fever. || false || When the pharmacist asks about a fever, he says, "I don't think so."
    fill: He should take one tablet every ___ hours. || four / 4 || "Take one tablet every four hours."
    short: What does the pharmacist say is good for his throat? || kw: honey/lemon/hot water || "Hot water with honey and lemon is great."
    mc: When should he see his doctor? || Tomorrow morning | *If he doesn't feel better in a week | Before he takes the tablets || "If you don't feel better in a week, you should see your doctor."
    mc: How much does he pay? || *$8.50 | $18.50 | $8.15 || "Eight dollars and fifty cents" = $8.50.

- slug: returning-a-jacket
  kind: listening
  title: Returning a jacket
  topic: Services and errands
  summary: Hamza takes a jacket with a broken zipper back to a store. Listen for what he wants and what the store can do.
  speakers: S=Kayla/f; M=Hamza/m
  text: |
    S: Hi! Can I help you?
    M: Yes, please. I bought this jacket here on Saturday, but there's a problem with it.
    S: Oh no. What's wrong with it?
    M: The zipper is broken. Look — it doesn't close.
    S: You're right. I'm sorry about that. Do you have the receipt?
    M: Yes, here it is. I paid by card.
    S: Thanks. Would you like a refund, or do you want to exchange it?
    M: I really like the jacket, so I'd like to exchange it.
    S: No problem. Let me check… I'm afraid we don't have it in black anymore. We only have green or gray.
    M: Oh. Could I try the gray one?
    S: Of course. Here you are. The fitting room is over there.
    M: Thanks… Hmm, it's a little tight. Do you have it in a large?
    S: Just a moment… Yes, here's a large in gray.
    M: Perfect. This one fits me much better.
    S: Great. Is there anything else I can help you with?
    M: Yes, actually. These gloves were a gift, but they're too small for me. Can I return them? I don't have a receipt.
    S: I'm sorry, we can't give you a refund without a receipt, but we can give you store credit.
    M: That's fine. Thank you for your help!
  glossary: |
    zipper | metal or plastic teeth that close a jacket or a bag | British English: zip
    receipt | the paper that shows what you bought and paid
    refund | money you get back when you return something
    exchange | give something back and get a different one
    fitting room | a small room in a store where you try on clothes
    tight | too small for your body
    store credit | money you can only spend in the same store
  questions: |
    mc: What's wrong with the jacket? || It's too expensive. | *The zipper is broken. | It's the wrong color. || "The zipper is broken. Look — it doesn't close."
    tf: Hamza wants a refund for the jacket. || false || He likes the jacket, so he wants to exchange it.
    fill: In the end, Hamza takes a large jacket in ___. || gray / grey || "Here's a large in gray." — "Perfect."
    short: Why can't Hamza get a refund for the gloves? || kw: receipt || He doesn't have a receipt.
    mc: What does the store give him for the gloves? || Cash | *Store credit | A new pair of gloves || "We can give you store credit."

- slug: a-birthday-invitation
  kind: listening
  title: A birthday invitation
  topic: Celebrations and traditions
  summary: Jade calls her friend Oscar to invite him to her mother's sixtieth birthday party. Listen for the details of the party.
  speakers: J=Jade/f; O=Oscar/m
  text: |
    J: Hi, Oscar! It's Jade. Do you have a minute?
    O: Sure. What's up?
    J: My mom turns sixty next month, and we're going to have a party for her.
    J: It's going to be at my parents' house on Saturday the fourteenth. Would you like to come?
    O: I'd love to! What time does it start?
    J: At seven. We're going to have dinner in the garden, and then there'll be music and dancing.
    O: That sounds great. Can I bring anything?
    J: Oh, you don't have to bring anything.
    O: Come on, I want to help. I'll make my chocolate cake.
    J: Really? Mom loves your chocolate cake! Thank you.
    O: What should I get her as a present?
    J: Don't worry about a present. A card is perfect. She just wants all her friends to be there.
    O: OK. Is it a surprise party?
    J: No, she knows about it. She's already thinking about what to wear!
    O: Ha! And will your brother come from London?
    J: Yes, he's going to fly in on Friday. I think Mom will cry when she sees him.
    O: I'm sure she will. OK, Saturday the fourteenth at seven. I'll be there.
    J: Great. See you then!
  glossary: |
    turn (sixty) | become a certain age
    Would you like to…? | a polite way to invite someone
    I'd love to! | yes, I really want to
    Can I bring anything? | a polite offer to help
    Come on | said when you want someone to agree with you | informal
    surprise party | a party that the person it's for doesn't know about
    fly in | arrive by plane
    See you then! | goodbye, when you have a plan to meet
  questions: |
