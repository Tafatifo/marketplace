    tf: Jade thinks her mom will cry when she sees her brother. || true || "I think Mom will cry when she sees him."

- slug: which-evening-class
  kind: listening
  title: Which evening class?
  topic: Plans and choices
  summary: Keisha compares three evening classes with her friend Finn. Listen for the prices, the reviews and her final choice.
  speakers: K=Keisha/f; F=Finn/m
