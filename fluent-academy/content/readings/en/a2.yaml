- slug: my-grandmothers-journey
  kind: reading
  title: My grandmother's journey
  topic: Life stories
  summary: At her grandmother's eightieth birthday party, a young woman hears the story of her life — from a village in Trinidad to a hospital in Toronto.
  free: true
  text: |
    Last month, my grandmother Gloria turned eighty, and our whole family had a big party for her. At the party, I asked her about her life. Here is her story.

    Gloria was born in 1946 in a small village in Trinidad. Her parents were farmers, and she had four brothers. She didn't have many toys when she was a child, but she loved school, and she walked five kilometers there every day.

    When she was nineteen, she got a job as a nurse in Port of Spain, the capital. Then, in 1968, she saw an ad for nurses in Toronto, and she decided to go. "I was scared," she told me. "I didn't know anyone, and I didn't have a winter coat!" Her first winter in Canada was very hard. It snowed in October, and she stayed inside on her days off.

    But then she met my grandfather, Henry, at the hospital. He was a doctor from Jamaica. They got married in 1971 and had three children. My mother was their third child.

    Gloria worked as a nurse for thirty-five years, and she retired in 2006. Now she lives in a small apartment near us. She still cooks for the family every Sunday, and she still doesn't like winter!

    At the end of the party, I asked her, "Did you ever want to go back?" She smiled. "Sometimes. But my family is here. This is home now."
  glossary: |
    turn (eighty) | become a certain age
    village | a very small town in the countryside
    capital | the most important city in a country, where the government is
    ad | a notice that tells people about a job or sells something | short for advertisement
    decide | choose what to do after thinking
    scared | afraid
    days off | days when you don't go to work
    retire | stop working because you are older
  questions: |
    mc: Where was Gloria born? || In Toronto | *In Trinidad | In Jamaica || "Gloria was born in 1946 in a small village in Trinidad." Henry was from Jamaica.
    tf: Gloria knew a lot of people in Toronto when she arrived. || false || She says, "I didn't know anyone."
    short: What was Gloria's job? || kw: nurse || She worked as a nurse in Port of Spain and then in Toronto.
    fill: Gloria met her husband at the ___. || hospital || "Then she met my grandfather, Henry, at the hospital."
    mc: Why was her first winter in Canada hard? || *It was cold and snowy, and she didn't have a winter coat. | She didn't have a job. | She lost her apartment. || It snowed in October, and she didn't have a winter coat.
    tf: Gloria still works at the hospital. || false || She retired in 2006.

- slug: the-wrong-train
  kind: reading
  title: The wrong train
  topic: Holidays and travel
  summary: A travel blog post about a trip to Scotland, a wrong train, a friendly stranger and a perfect day in a small village.
  text: |
    Last spring, my friend Rania and I went on a trip to Scotland. We wanted to see the Highlands, so we booked a train from Edinburgh to Inverness. It was a beautiful morning. The sun was shining, and we were drinking coffee at the station and talking about our plans.

    At ten o'clock, we got on the train. While we were looking out of the window, a man with a big dog sat down next to us. He was very friendly, and he told us about his village by the sea. After an hour, Rania looked at the map on her phone. "That's strange," she said. "Inverness is north, but we're going west."

    We were on the wrong train! It was going to Glasgow, not Inverness. We felt really silly, but the man with the dog just laughed. "Don't worry," he said. "Get off at the next station and take a train back. Or come and see my village. It's beautiful, and the fish and chips are amazing."

    We decided to follow him. His village was small and quiet, with colorful houses and a little harbor. We walked on the beach, ate fish and chips and watched the boats. It wasn't in our plans, but it was a perfect day.

    The next morning, we took a train to Inverness — the right one this time. But when people ask me about Scotland, I always tell them about that little village by the sea.
  glossary: |
    the Highlands | the mountain area in the north of Scotland
    book | arrange and pay for a ticket before you travel
    get on | go into a train, bus or plane | opposite: get off
    strange | unusual and surprising
    silly | a bit stupid, in a funny way
    laugh | make the sound people make when something is funny
    follow | go behind someone
    harbor | a place by the sea where boats stay | British English: harbour
  questions: |
    mc: Where did the writer and Rania want to go? || Glasgow | *Inverness | Edinburgh || They booked a train from Edinburgh to Inverness.
    fill: While they were looking out of the window, a man with a big ___ sat down next to them. || dog || "A man with a big dog sat down next to us."
    short: How did Rania know they were on the wrong train? || kw: map/phone/west/north/direction || She looked at the map on her phone: Inverness is north, but the train was going west.
    tf: The man with the dog was angry. || false || He was very friendly and he laughed.
    mc: What did they do in the village? || *They walked on the beach and ate fish and chips. | They visited a castle. | They went to a museum. || "We walked on the beach, ate fish and chips and watched the boats."
    tf: They arrived in Inverness the next day. || true || "The next morning, we took a train to Inverness."

- slug: small-changes-big-difference
  kind: reading
  title: Small changes, big difference
  topic: Health and the body
  summary: A magazine article about an accountant who changed three small habits — and his advice for other people.
  text: |
    Desmond Clarke is a 42-year-old accountant from Leeds. Two years ago, he wasn't very healthy. "I sat at my desk for nine hours a day," he says. "I skipped breakfast, I ate junk food for lunch, and I only slept five or six hours. I always felt tired, and my back hurt every day."

    Then his doctor gave him some advice. "She said, 'You don't have to join a gym or run marathons. But you have to move more, and you should sleep at least seven hours.'"

    Desmond made three small changes. First, he started to walk to work. It takes him twenty-five minutes. Second, he stopped looking at his phone in bed, and now he goes to sleep at ten thirty. Third, he takes a short break every hour. "I stand up, stretch my back and drink a glass of water," he says.

    The changes were small, but the results were big. "After a month, my back didn't hurt anymore. I had more energy, and I wasn't stressed all the time."

    Desmond's advice for other people is simple. "Don't try to change everything at once. Choose one habit and do it every day for a few weeks. When it's easy, choose another one. And you shouldn't feel bad if you skip a day. Just start again the next morning."
  glossary: |
    accountant | a person whose job is to work with a company's money and numbers
    skip | not do or not have something you usually do
    junk food | fast food that isn't healthy
    advice | words that tell you what you should do | uncountable: some advice, not an advice
    marathon | a running race of about 42 kilometers
    stretch | make your body long to relax your muscles
    result | what happens because of something
    energy | the strength to be active without feeling tired
    at once | at the same time
  questions: |
    mc: What was one of Desmond's problems two years ago? || *His back hurt every day. | He walked too much. | He slept ten hours a night. || "My back hurt every day." He only slept five or six hours.
    tf: The doctor told Desmond to join a gym. || false || She said, "You don't have to join a gym or run marathons."
    short: How long does it take Desmond to walk to work? || kw: 25/twenty-five/twenty five || "It takes him twenty-five minutes."
    fill: Every hour, Desmond stands up, stretches and drinks a glass of ___. || water || "I stand up, stretch my back and drink a glass of water."
    mc: What is Desmond's advice? || Change all your habits at once. | *Choose one habit and do it every day. | Never skip a day. || "Choose one habit and do it every day for a few weeks."
    tf: After a month, Desmond had more energy. || true || "I had more energy, and I wasn't stressed all the time."

- slug: life-on-the-night-shift
  kind: reading
  title: Life on the night shift
  topic: Work and studies
  summary: A profile of Teresa, a chemistry graduate who became a baker and has worked the night shift for six years.
  text: |
    At ten o'clock at night, when most people in Montreal are going to bed, Teresa Nwosu is starting her working day. Teresa is a baker, and she has worked the night shift at a busy bakery downtown for six years.

    Teresa didn't plan to be a baker. She studied chemistry at college and graduated in 2015. After college, she worked in a laboratory for three years. "The job was OK, but I didn't love it," she says. "I've always loved cooking, so I took a baking course in the evenings. On the first day, I knew this was my job!"

    Now Teresa is in charge of a team of four bakers. Every night, they make more than two thousand croissants, a thousand loaves of bread and hundreds of cakes. Her shift ends at six in the morning, when the first customers arrive.

    Has she ever wanted to change to a day job? "Never," she laughs. "The bakery is quiet at night, and my team is great. We've worked together since the bakery opened, so we're like a family."

    There are some problems, of course. Teresa sleeps from eight in the morning until three in the afternoon, and she has missed a lot of parties and family dinners. "My friends have learned to have lunch with me, not dinner!" she says.

    Her advice for young people? "Your first job doesn't have to be your last job. If you really love something, try it."
  glossary: |
    baker | a person whose job is to make bread and cakes
    night shift | a period of work at night
    chemistry | the science of what things are made of
    laboratory | a room or building where scientists work | short form: lab
    take a course | go to a series of classes
    be in charge of | be responsible for people or work
    loaf | bread baked in one piece | plural: loaves
    miss | not be at an event
  questions: |
    mc: What did Teresa study at college? || Baking | *Chemistry | Business || "She studied chemistry at college."
    tf: Teresa worked in a laboratory before she became a baker. || true || "After college, she worked in a laboratory for three years."
    short: How long has Teresa worked at the bakery? || kw: six/6 || "She has worked the night shift at a busy bakery downtown for six years."
    fill: Teresa's shift ends at ___ in the morning. || six / 6 || "Her shift ends at six in the morning."
    mc: Why does Teresa like working at night? || The pay is higher. | *The bakery is quiet and her team is great. | She doesn't like her friends. || "The bakery is quiet at night, and my team is great."
    tf: Teresa often has dinner with her friends. || false || "My friends have learned to have lunch with me, not dinner!"

- slug: rooms-for-rent
  kind: reading
  title: Rooms and apartments for rent
  topic: Home and housing
  summary: Three ads from a bulletin board near a university — a studio, a room in a shared house and a two-bedroom apartment.
  text: |
    1. Sunny studio near the university
    A small but bright studio on the fourth floor, five minutes from the main campus. There's a kitchen area, a desk and a lot of storage. The building is quiet, and there's a laundry room in the basement. $950 a month, bills included. No pets, no smoking. Available from September 1.

    2. Room in a friendly shared house
    We're three nurses, and we're looking for a fourth housemate. Your room is big and furnished, with a double bed and a large closet. We share the kitchen, two bathrooms and a garden with a few fruit trees. We take turns with the chores — there's a chore chart on the fridge! $700 a month plus bills (about $80). It's twenty minutes from downtown by bus. Cats welcome.

    3. Two-bedroom apartment, Riverside
    A modern apartment with two bedrooms, a big living room and a balcony with a view of the river. It's newer and more spacious than most apartments in the area, but it isn't as close to the university — it's about thirty minutes by bus. There's parking for one car. $1,600 a month, utilities extra. Perfect for two roommates. Deposit: one month's rent.

    Interested? Call or text the numbers on the tabs below, or knock on the door of apartment 1B and ask for Mr. Osei.
