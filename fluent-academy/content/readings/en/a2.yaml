- slug: winter-lights-festival
  kind: reading
  title: The Winter Lights Festival
  topic: Celebrations and traditions
  summary: A visitor guide to a small town's winter festival — the parade, the market, fireworks, skating and tips for visitors.
  text: |
    Welcome to the 25th Millbrook Winter Lights Festival! Every December, our small town celebrates the long, dark nights of winter with lights, music and food. Here's what you can expect this year.

    Friday: The festival begins at 6 p.m. with the Lantern Parade. Hundreds of children are going to walk from the school to the town square with lanterns that they made in class. At 7 p.m., the mayor will turn on the lights on the big tree.

    Saturday: The Winter Market will be open from 10 a.m. to 9 p.m. More than fifty local stalls will sell hot drinks, gifts, cheese and homemade cakes. In the afternoon, there will be free music on the main stage. In the evening, don't miss the fireworks over the lake at 8 p.m.

    Sunday: Bring the family to the ice rink in Central Park. Skating is free for children under twelve. The festival ends with a big community dinner in the town hall at 5 p.m. Tickets are $10, and all the money is going to help the local food bank.

    Tips for visitors:
    It will probably be very cold, so wear a warm coat, a hat and gloves. The town center will be crowded, especially on Saturday evening, so we recommend the free shuttle bus from the train station. Parking will be difficult, so leave your car at home if you can.

    We hope you'll love it. See you there!
  glossary: |
    lantern | a light inside a box of paper or glass that you can carry
    mayor | the elected leader of a town or city
    stall | a table or small shop at a market
    homemade | made at home, not in a factory
    ice rink | a place with ice where people skate
    food bank | a place that gives free food to people who need it
    shuttle bus | a bus that goes back and forth between two places
    gloves | clothes that keep your hands warm
  questions: |
    mc: When will the mayor turn on the lights on the big tree? || *On Friday at 7 p.m. | On Saturday at 8 p.m. | On Sunday at 5 p.m. || "At 7 p.m., the mayor will turn on the lights on the big tree" — on Friday.
    tf: The fireworks are on Sunday. || false || The fireworks are on Saturday evening at 8 p.m.
