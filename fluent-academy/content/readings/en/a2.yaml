    K: It's three hundred, and it's the closest to my apartment. I can walk there in five minutes.
    F: What do the reviews say?
    K: Pottery has the best reviews. People say the teacher is really funny.
    F: What about Spanish?
    K: The reviews are OK. But if I learn Spanish, I'll be able to talk to my neighbors.
    F: That's true. When do the classes start?
    K: Pottery starts on September tenth. Spanish starts a week later.
    F: Well, I'm meeting my cousin on Wednesdays this fall, but I'm free on Tuesdays. If you choose a Tuesday class, I'll come with you!
    K: Really? Pottery is on Tuesdays! OK, that's the best option, then.
    F: Great. Let's sign up tonight.
