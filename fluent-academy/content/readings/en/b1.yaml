- slug: the-phone-free-school
  kind: listening
  title: The phone-free school
  topic: Media and technology
  summary: On a local radio show, a high school principal explains why his school banned phones during the day, and what happened next.
  free: true
  speakers: H=Lena/f; P=Martin/m
  text: |
    H: Good morning, and welcome to City Talk. My guest today is Martin Reyes, the principal of Westbrook High School, which banned phones during the school day last September. Martin, thanks for coming in.
    P: Thanks for having me.
    H: So, why did you decide to ban phones?
    P: Well, our teachers had been complaining for years. Students were checking their phones in every class, and at lunchtime the cafeteria was completely silent. Everyone was just looking at a screen.
    H: How does the ban actually work?
    P: When students arrive in the morning, they put their phones in a locker, and they get them back at three o'clock. If parents need to contact their kids, they call the school office.
    H: I imagine the students weren't very happy about that.
    P: No, not at first! In the first week, a lot of students told me they felt anxious without their phones. One girl said she didn't know what to do with her hands.
    H: And now?
    P: Now it's very different. The cafeteria is noisy again, which I love. Students are playing cards, chatting, even reading. And our teachers say that students concentrate much better in class.
    H: What about the parents? Were they worried?
    P: Some were. A few parents asked me whether their children would be safe without a phone. We explained that the office is always open, and that seemed to help.
    H: Has the ban had any effect on grades?
    P: It's too early to say for sure, but our test results this spring were the best we've had in five years.
    H: Would you recommend the idea to other schools?
    P: Yes, but I'd say: talk to parents and students first, and explain why you're doing it. If people understand the reasons, they're much more likely to accept the rules.
    H: Martin Reyes, thank you very much.
    P: My pleasure.
  glossary: |
    principal | the person in charge of a school | British English: head teacher
    ban | say officially that something is not allowed
    cafeteria | a room in a school where students buy and eat meals
    concentrate | give all your attention to something
    grades | the letters or numbers that show how good students' work is
    It's too early to say. | We can't know yet.
    likely | probably going to happen
  questions: |
    mc: When do students get their phones back? || At lunchtime | *At three o'clock | At the end of the week || "They get them back at three o'clock."
    tf: All the students were happy about the ban from the start. || false || "In the first week, a lot of students told me they felt anxious without their phones."
    short: How can parents contact their children during the school day? || kw: office/call the school || "If parents need to contact their kids, they call the school office."
    fill: The principal says the cafeteria is ___ again, which he loves. || noisy || "The cafeteria is noisy again, which I love."
    mc: What is the principal's advice for other schools? || *Talk to parents and students first. | Ban phones without explaining why. | Let students keep their phones in class. || "Talk to parents and students first, and explain why you're doing it."
    tf: The school's test results this spring were the best in five years. || true || "Our test results this spring were the best we've had in five years."

- slug: choosing-a-movie
  kind: listening
  title: Choosing a movie
  topic: Culture and entertainment
  summary: It's Friday movie night, and two roommates can't agree — a slow award-winning drama, a predictable comedy or a scary thriller?
  speakers: A=Amaya/f; S=Sami/m
  text: |
    S: OK, it's movie night. What are we watching?
    A: How about "The Quiet Year"? It's the one that won the big prize at the festival last month.
    S: Isn't that the really long drama about a farmer?
    A: It's two hours and forty minutes, actually. It's about a farmer in Iceland who stops speaking after his wife leaves him.
    S: That sounds a bit depressing for a Friday night.
    A: The reviews say it's beautiful. The director, who also wrote the script, spent five years making it.
    S: I'm sure it's brilliant, but I'm exhausted. I want something light. What about "Double Booking"?
    A: The comedy about the two wedding planners? My sister saw it. She said the plot was really predictable.
    S: Predictable is fine! I don't want to think tonight.
    A: Hmm. What else is on? Oh, "Night Signal", the new thriller, is available too. It's set on a space station.
    S: Is that the one with Lara Quinn, whose last film was terrible?
    A: She's actually really good in this one. Jonas watched it on Wednesday, and he told me he couldn't sleep afterwards.
    S: Then definitely not! I need to sleep tonight.
    A: OK, so no drama and no thriller. Fine, we'll watch your comedy. But I'm choosing the snacks.
    S: Deal. And next Friday, we'll watch your farmer movie. I promise.
    A: You said that last week about the documentary!
    S: That's true. OK, I'll put it in the calendar right now. Happy?
    A: Very.
