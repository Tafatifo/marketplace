    tf: The writer remembers exactly what she said to Nadia. || false || "I can't even remember exactly what."
    short: For how many years did the two friends not speak? || kw: eleven/11 || "We didn't speak for eleven years."
    fill: The writer recognized Nadia in the station because of her ___. || laugh || "I heard someone laugh behind me. I knew that laugh immediately."
    mc: How did Nadia feel after the argument? || *She was angry for a week, and then she missed her friend. | She was angry for eleven years. | She was never angry. || "I was angry for about a week. After that, I just missed you."
    tf: The two friends now live in the same city. || false || "We live in different states."

- slug: the-four-day-week
  kind: reading
  title: The four-day week
  topic: Work and careers
  summary: A small marketing agency tries working four days a week for the same salary. Six months later, what has changed — and what hasn't worked?
  text: |
    Six months ago, Fernhill Design, a small marketing agency in Leeds with twenty-two employees, made a bold decision: everyone would work four days a week, for the same salary. Since January, the office has been closed on Fridays.

    "At first, I was worried," says the company's founder, Grace Mensah. "Our clients expect fast answers, and I thought we would lose business." To prepare, the team changed the way they work. Meetings now last a maximum of thirty minutes, and staff check their emails only three times a day. In addition, every Monday the team agrees on a short list of priorities for the week.

    The results have surprised everyone. Although the team works one day less, they have completed more projects than in the same period last year. Sick days have fallen by almost half. "I've been sleeping much better since we started," says designer Tom Halloran. "On Fridays I do the shopping and the cleaning, so the weekend is really free. As a result, I come back on Monday with a lot more energy."

    However, the change hasn't been easy for everyone. Some clients complained at first that nobody answered the phone on Fridays, so now one person is on call each week. A few employees also say that the four working days feel more intense. "There's no time to chat with colleagues anymore," says account manager Priya Das. "I miss that."

    Fernhill isn't alone. Companies in several countries have been testing shorter working weeks, and many of them have decided to keep them. Experts say that a four-day week doesn't work for every job — hospitals, schools and stores need staff every day — but for many office jobs, it can be a real option.

    For Grace Mensah, the decision is now easy. "We're keeping it," she says. "Our team is happier, and our clients are happy too. Honestly, I can't imagine going back."
  glossary: |
    bold | brave and willing to take risks
    founder | the person who started a company or organization
    priorities | the most important things, which you should do first
    sick days | days when you don't go to work because you are ill
    on call | ready to work if someone needs you
    intense | needing a lot of energy and concentration
    option | something that you can choose
  questions: |
