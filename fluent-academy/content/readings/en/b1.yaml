- slug: the-cooking-class
  kind: listening
  title: The cooking class
  topic: Health and lifestyle
  summary: At a community cooking class called "Grandma's Kitchen", Henrik shares the fish soup his grandmother used to make — and the one rule she never broke.
  speakers: J=Joy/f; H=Henrik/m
  text: |
    J: Welcome, everyone! Tonight's class is called "Grandma's Kitchen." Each of you has brought a recipe that someone in your family used to make. Henrik, do you want to start?
    H: Sure. This is a fish soup my grandmother made every Friday when I was a kid. She grew up in a fishing village in the north of Sweden.
    J: Lovely. What's in it?
    H: Potatoes, leeks, cream, dill and whatever fish was fresh that day. My grandmother, who never measured anything, always said, "A little of this, a little of that."
    J: Ha! That's the hardest kind of recipe. So how did you work out the amounts?
    H: My aunt, whose house was next door to Grandma's, remembered most of it. We tested the soup four times last month.
    J: And did it taste the same?
    H: Almost. The fourth one was very close. But something was still missing.
    J: That often happens. Sometimes the ingredient that's missing is a person.
    H: That's true. It's not the same without her stories.
    J: OK, let's get started. Where did you buy the fish?
