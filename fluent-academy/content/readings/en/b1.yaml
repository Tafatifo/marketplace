- slug: the-friend-i-almost-lost
  kind: reading
  title: The friend I almost lost
  topic: People and relationships
  summary: Two best friends fall out at eighteen and don't speak for eleven years — until a laugh in a train station brings them back together.
  free: true
  text: |
    When I was fourteen, my best friend was a girl called Nadia. We used to walk to school together every morning, and we would spend every weekend at her house, where her mother made the best cheese pies in the neighborhood. We shared everything: clothes, secrets, even a bike.

    Then, in our last year of high school, we fell out. It started with something small. Nadia had won a place at a university in another city, and I hadn't. Instead of congratulating her, I said something unkind — I can't even remember exactly what. She looked at me for a long moment, picked up her bag and left. We didn't speak for eleven years.

    For a long time, I told myself that it was her fault. She was stubborn, I thought, and she never forgave anyone. But the truth was simpler and more uncomfortable: I was jealous, and I was too proud to apologize.

    Last spring, I was waiting for a train in Chicago when I heard someone laugh behind me. I knew that laugh immediately. I turned around, and there she was, holding a coffee and a very large suitcase. For a second, neither of us said anything. Then she smiled and said, "You still have that terrible green scarf."

    We both missed our trains. We sat in the station café for three hours and talked about everything that had happened since school: jobs, moves, her two children, my divorce, her mother's illness. At one point, I finally apologized. "I'm sorry about what I said," I told her. "I was jealous." She shook her head. "I was angry for about a week," she said. "After that, I just missed you."

    Now we talk every Sunday. We live in different states, but we're as close as we used to be — maybe closer. I've learned two things from Nadia. First, an argument doesn't have to be the end of a friendship. And second, never wait eleven years to say sorry.
  glossary: |
    fall out | stop being friends after an argument
    congratulate | tell someone that you are happy about their success
    jealous | unhappy because someone has something that you want
    proud | (here) not willing to say that you were wrong | Proud can also be positive: proud of your children.
    apologize | say that you are sorry | British spelling: apologise
    divorce | the legal end of a marriage
    as close as we used to be | as good friends as we were in the past
  questions: |
