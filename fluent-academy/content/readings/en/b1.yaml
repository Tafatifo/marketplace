- slug: in-praise-of-doing-nothing
  kind: reading
  title: In praise of doing nothing
  topic: Health and lifestyle
  summary: In a culture that loves being busy, an article explains why doing absolutely nothing can be good for your mind — and how to try it.
  text: |
    Think about the last time you did absolutely nothing. Not scrolling through your phone, not listening to a podcast, not "relaxing" with a TV series — just sitting, looking out of a window and letting your mind wander. For many of us, it's hard to remember.

    We live in a culture that celebrates being busy. People who are always rushing are often seen as successful, and free time is something that we try to fill. Even our hobbies have become goals: the run that has to be faster, the reading list that has to be longer. But some psychologists believe that the moments when we do nothing are exactly the moments that we need most.

    When your brain isn't focused on a task, it doesn't switch off. Instead, it starts making connections between ideas, memories and experiences. This is why so many people get their best ideas in the shower, on a walk or just before they fall asleep. A mind that is allowed to wander is often a mind that solves problems.

    Doing nothing can also help us recover from stress. People who take short breaks without screens during the day often say that they feel calmer and concentrate better afterwards. Some studies suggest that even a few minutes of quiet can improve your mood.

    Of course, doing nothing is harder than it sounds. The first few minutes can feel uncomfortable, even boring. That's completely normal. If you want to try, choose a place where you won't be disturbed — a park bench, a balcony or a quiet corner of your home. Leave your phone in another room. Start with five minutes, and slowly make it longer. Don't judge the thoughts that come into your head; just notice them.

    The Dutch even have a word for it: niksen, which means doing nothing on purpose. So the next time someone asks what you did at the weekend, try answering, "Nothing at all." Then smile. You might be the most productive person in the room.
  glossary: |
    let your mind wander | allow your thoughts to move freely from one thing to another
    celebrate | (here) think that something is very good and praise it
    rush | move or do things very quickly
    psychologist | a scientist who studies the mind and how people behave
    recover | get better after an illness or a difficult time
    mood | the way you feel at a particular time
    disturb | interrupt someone who is doing something
    on purpose | because you want to, not by accident
  questions: |
    mc: According to the article, when do many people get their best ideas? || *In the shower or on a walk | In long meetings | While they scroll on their phones || "So many people get their best ideas in the shower, on a walk or just before they fall asleep."
    tf: The writer says that doing nothing is easy for most people. || false || "Doing nothing is harder than it sounds."
    short: What does the Dutch word "niksen" mean? || kw: nothing || "Niksen, which means doing nothing on purpose."
    fill: The article suggests starting with ___ minutes and slowly making it longer. || five / 5 || "Start with five minutes, and slowly make it longer."
    mc: What should you do with your phone when you try doing nothing? || *Leave it in another room | Turn off the sound | Use a relaxation app || "Leave your phone in another room."

- slug: four-days-across-canada
  kind: reading
  title: Four days across Canada
  topic: Society and travel
  summary: A traveler takes the slow train from Toronto to Vancouver and discovers forests, prairies, mountains — and the pleasure of talking to strangers.
  text: |
    Last October, I did something that many of my friends thought was crazy: I took the train from Toronto to Vancouver. The flight takes about five hours. The train takes four days.

    I'd been thinking about the trip for years. I had flown across Canada many times for work, but I had never really seen the country — just clouds and an airport at each end. So when I finally had two weeks of vacation, I booked a small sleeping cabin and packed three books, a notebook and some warm socks.

    The first day was all forests and lakes, thousands of them, shining in the fall sunshine. On the second day, we crossed the prairies, which were so flat and empty that I could see storms coming from hours away. In the dining car, passengers sat together at shared tables, so every meal was a conversation with strangers: a retired farmer from Saskatchewan, two students from Germany, a nurse who was going to meet her new grandson. By the third day, we were greeting each other like old friends.

    Then came the Rocky Mountains. I was sitting in the observation car, which had a glass roof, when the train came out of a tunnel, and suddenly there they were — huge, snowy and silent. Nobody spoke for a full minute.

    Was it the cheapest or the fastest choice? Definitely not. My sleeping cabin cost more than three flights, and I spent four days of my vacation on the journey. If I had to choose only on price, I'd fly. But travel isn't only about arriving. If more of us traveled slowly, I think we would see our countries — and each other — a little differently.

    I'm already planning my next slow journey. I just wish trains in North America were a little faster, and a lot cheaper.
  glossary: |
    sleeping cabin | a small private room on a train, with a bed
    prairies | large, flat areas of grassland in central North America
    dining car | the part of a train where meals are served
    observation car | a train car with large windows for looking at the view
    tunnel | a passage through a mountain or under the ground
    greet | say hello to someone
    journey | traveling from one place to another, especially over a long distance
  questions: |
