    tf: Dolores had studied several foreign languages before. || false || "Dolores had never studied a foreign language."
    short: What does Dolores write every evening? || kw: diary/journal || "She also began writing a short diary in Korean every evening."
    fill: Her teacher told her to stop trying to be perfect and to try to be ___. || curious || "Stop trying to be perfect. Try to be curious."
    mc: How did cooking shows help Dolores? || *She picked up everyday vocabulary. | She learned the alphabet. | She found a new teacher. || Cooking shows "helped her pick up everyday vocabulary."
    tf: In Busan, Dolores needed help to translate recipes. || false || "I didn't need anyone to translate a single recipe."

- slug: the-street-without-cars
  kind: reading
  title: The street without cars
  topic: City and environment
  summary: Every summer Sunday, one residential street closes to cars. Read how the idea started, what problems it caused and how the neighborhood changed.
  text: |
    For most of the year, Linden Street looks like any other street: parked cars on both sides, a few trees and a lot of traffic at school time. But every Sunday from May to September, something unusual happens. At eight in the morning, the street is closed to cars, and by ten it is full of children on bikes, neighbors drinking coffee on folding chairs and an old piano that is pushed out of someone's garage.

    The idea was proposed in 2022 by Marisol Vega, a teacher who has lived on the street for twenty years. "Our kids were growing up without ever playing outside," she says. "I thought, if we close the street for just one day a week, maybe people will come out of their houses." She collected signatures from almost every home, and the plan was approved by the city council the following spring.

    Not everyone was enthusiastic. Some residents were worried that they wouldn't be able to use their cars, and the owners of a café on the corner said they would lose customers. To solve these problems, a few changes were made. Residents who need to drive are allowed to leave slowly, with a volunteer walking in front of the car, and the closed section now ends before the café.

    Three summers later, the results are clear. According to a survey, most residents now know at least ten neighbors by name, compared with three before. The corner café, which was against the plan at first, now has its busiest day on Sundays. And last year, the idea was copied by four other streets in the city.

    "It isn't a revolution," Marisol says. "It's just a street. But when people slow down and say hello, a neighborhood changes."

    The council has promised that the program will continue as long as residents support it. Next year, the organizers hope to add a monthly repair stall and a book exchange — if they find enough volunteers.
  glossary: |
    folding chair | a chair that you can fold flat to carry it
    garage | a building or room where you keep a car
    signature | your name, written by you in your own way
    approve | officially agree to a plan
    enthusiastic | showing a lot of excitement and interest
    resident | a person who lives in a particular place
    survey | a set of questions that many people answer
    revolution | a very big, sudden change
  questions: |
