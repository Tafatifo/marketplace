    tf: The employees earn less money since the change. || false || They work four days "for the same salary."
    short: How often do staff check their emails now? || kw: three/3 || "Staff check their emails only three times a day."
    fill: Sick days have fallen by almost ___. || half || "Sick days have fallen by almost half."
    mc: Why does Priya Das miss the old system? || *There's no time to chat with colleagues. | She has to work on Fridays. | She earns less money. || "There's no time to chat with colleagues anymore. I miss that."
    tf: According to experts, a four-day week works for every type of job. || false || "A four-day week doesn't work for every job — hospitals, schools and stores need staff every day."

- slug: never-too-late-to-learn
  kind: reading
  title: Never too late to learn
  topic: Education and learning
  summary: A retired bus driver starts learning Korean at sixty-nine. Three years later, she shares what worked, what didn't and her advice for older learners.
  text: |
    When Dolores Brennan retired from her job as a bus driver in Boston, she decided to do something that surprised her whole family: she started learning Korean. She was sixty-nine.

    "My granddaughter had married a wonderful man from Busan," she explains, "and I wanted to talk to his parents without needing an interpreter at every family dinner."

    At first, it wasn't easy. Dolores had never studied a foreign language, and she found the new alphabet terrifying. "I kept mixing up the letters. After two weeks, I almost gave up." Then her teacher at the community center gave her some advice that she still remembers: "Stop trying to be perfect. Try to be curious."

    Dolores changed her approach. Instead of memorizing long lists of words, she started watching Korean cooking shows, which helped her pick up everyday vocabulary. She also began writing a short diary in Korean every evening — just three or four sentences about her day. "Nobody reads it, so I'm allowed to make as many mistakes as I want," she laughs.

    Three years later, she can hold a simple conversation, read restaurant menus and, most importantly, chat with her granddaughter's in-laws on video calls. Last spring, she traveled to Busan and spent two weeks with them. "We cooked together every day, and I didn't need anyone to translate a single recipe," she says proudly.

    Research suggests that older learners often have some advantages. They are usually good at organizing their study time, and they know how they learn best. What they sometimes lack is confidence.

    So what is Dolores's advice for people who want to start a language later in life? "You don't have to be young, and you don't have to be talented. You just have to keep going. And you should choose something you love — food, music, family. That's what keeps you going on the difficult days."
  glossary: |
    retire | stop working, usually because of your age
    interpreter | a person whose job is to translate what people say
    mix up | confuse one thing with another
    curious | wanting to know or learn about something
    approach | a way of doing something
    in-laws | the family of your husband or wife | Here: the parents of her granddaughter's husband.
    hold a conversation | have a conversation, keeping it going
    lack | not have enough of something
  questions: |
