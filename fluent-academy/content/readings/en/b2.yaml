- slug: at-the-crossroads
  kind: listening
  title: At the crossroads
  topic: Looking ahead
  summary: An accountant has been offered a place on a carpentry course and must decide by Friday. His friend shares a regret of her own and helps him find a middle way.
  speakers: E=Efua/f; J=Jonas/m
  text: |
    E: You've been quiet all evening, Jonas. Is everything OK?
    J: I've been offered a place on a carpentry course. It starts in September, and I have to decide by Friday.
    E: Carpentry? But you've been an accountant for twelve years.
    J: Exactly. And if I don't do it now, I'll still be sitting at the same desk in twenty years' time, wishing I'd tried.
    E: So what's stopping you?
    J: Money, mostly. The course lasts eighteen months. By the time I've finished, I'll have spent most of my savings.
    E: How much would you be earning as a carpenter, compared with now?
    J: Less at first, definitely. Apprentices don't earn much. But experienced carpenters who run their own business can do quite well, especially in the city.
    E: Have you worked out whether you could earn a living afterward?
    J: I've spoken to a few carpenters. Demand is set to grow, apparently, because so many older craftspeople are about to retire.
    E: That's encouraging. And what does Sara think?
    J: She's supportive, but she's worried. We're due to move into a bigger flat next year, and that's bound to cost more.
    E: I understand. Can I tell you something? When I was offered a job in Lagos, I turned it down because it felt too risky. I've always regretted not going.
    J: I didn't know that.
    E: I don't dwell on it, but sometimes I think, if only I'd taken the plunge. Anyway, I'm not saying you should quit tomorrow. Could you do the course part-time?
    J: There's an evening version, but it takes three years.
    E: Three years sounds like a long time, but you'd keep your salary. And by the time you finish, you'll have built up a few clients, too.
    J: That's true. I'd be exhausted, though. I'd be working all day and sawing wood all night.
    E: Maybe. But you'd be exhausted doing something you actually care about.
    E: And think about it this way: in five years' time, which would you regret more — trying and failing, or never trying at all?
    J: Never trying. Definitely.
    E: Well, there's your answer.
    J: You might be right. I'll talk to Sara tonight, and I'll call the college first thing tomorrow.
  glossary: |
    carpentry | the skill or work of making things from wood
    earn a living | to make enough money to pay for the things you need
    craftspeople | people who make things skillfully with their hands
    supportive | giving help and encouragement
    turn down | to refuse an offer
    take the plunge | to finally do something risky or important after thinking about it
    first thing | very early, before doing anything else
  questions: |
    mc: What has Jonas been offered? || *A place on a carpentry course | A job as an accountant in Lagos | A bigger flat || "I've been offered a place on a carpentry course."
    tf: Jonas has worked as an accountant for twelve years. || true || "You've been an accountant for twelve years."
    short: Why is demand for carpenters set to grow, according to Jonas? || kw: retire/retiring/retirement/older || "So many older craftspeople are about to retire."
    mc: What does Efua regret? || *Turning down a job in Lagos | Training as an accountant | Moving into a bigger flat || "When I was offered a job in Lagos, I turned it down… I've always regretted not going."
    fill: The evening version of the course takes ___ years. || three / 3 || "There's an evening version, but it takes three years."
    tf: At the end, Jonas decides to quit his job immediately. || false || He decides to talk to Sara and call the college; Efua suggested the part-time course.

- slug: the-sleep-headline
  kind: listening
  title: The sleep headline
  topic: Science and technology
  summary: A health podcast asks a sleep scientist whether later school start times really make teenagers "smarter," and what the research actually shows.
  speakers: H=Olivia/f; S=Rahul/m
  text: |
    H: This week, one headline caught a lot of attention: "Late starts make teenagers smarter." Rahul, is that what the research actually shows?
    S: Not quite. Headlines like that tend to exaggerate. What has been found, in a number of studies, is that when schools start later, teenagers get more sleep — in some cases around half an hour more each night.
    H: Why does that matter so much for teenagers in particular?
    S: During adolescence, the body clock shifts. Teenagers are biologically programmed to fall asleep later, so asking them to be in class at eight is a bit like asking adults to start work at six.
    H: And the "smarter" part of the headline?
    S: Some studies have reported better attendance and slightly better grades after start times were moved. But it's difficult to prove that sleep alone caused the improvement. Other changes may have been introduced at the same time.
    H: So the claim isn't false, but it's oversimplified?
    S: Exactly. "Smarter" is the wrong word. "Better rested" would be more accurate.
    H: How much sleep do teenagers actually need?
    S: Most guidelines recommend between eight and ten hours a night. Many teenagers get far less than that on school nights and then try to catch up at weekends, which doesn't fully make up for it.
    H: Several listeners have asked how scientists actually measure sleep in studies like these.
    S: Often, students wear a small device on their wrist that records movement. In more detailed studies, participants have their brain activity monitored overnight in a sleep lab.
    H: Are there any downsides to later starts?
    S: There can be practical ones. Buses have to be rescheduled, after-school sports finish later, and parents' working hours don't always fit. Those problems are real, and they've been the main reason why some schools haven't made the change.
    H: If a parent is listening and is worried about their teenager's sleep, what would you suggest?
    S: Keep phones out of the bedroom at night if possible, and keep wake-up times fairly regular, even at weekends. Getting some daylight in the morning helps the body clock, too. And if a teenager is exhausted despite sleeping enough, it's worth getting them checked by a doctor.
    H: Rahul Menon, thank you very much.
    S: Thanks for having me.
  glossary: |
    adolescence | the period of life when a child develops into an adult
    body clock | the natural system that controls when you feel sleepy and awake
    attendance | how often someone is present at school or work
    oversimplified | made to seem simpler than it really is
    well rested | having had enough sleep
    downside | a disadvantage
    reschedule | to change the time of a planned event
  questions: |
    mc: What does Dr. Menon think of the headline? || *It exaggerates what the research shows. | It's completely accurate. | It describes a different study. || "Headlines like that tend to exaggerate."
    tf: According to Dr. Menon, teenagers' body clocks make them fall asleep later. || true || "Teenagers are biologically programmed to fall asleep later."
    short: What do students often wear to measure their sleep? || kw: device/wrist/band/tracker || "Students wear a small device on their wrist that records movement."
    mc: Why is it hard to prove that sleep alone improved students' grades? || *Other changes may have happened at the same time. | No grades were recorded. | The students didn't sleep any longer. || "Other changes may have been introduced at the same time."
    fill: In more detailed studies, participants have their brain activity ___ overnight in a sleep lab. || monitored / recorded / measured || "Participants have their brain activity monitored overnight in a sleep lab."
    tf: Dr. Menon says there are no practical problems with later start times. || false || He mentions buses, after-school sports and parents' working hours.
