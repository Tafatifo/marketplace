- slug: neither-here-nor-there
  kind: reading
  title: Neither here nor there
  topic: Identity and society
  summary: A school counselor who grew up in four countries explains what it means to be a "third culture kid" — the strengths, the hidden costs and what parents can do.
  free: true
  text: |
    Ask Leila Haddad where she is from, and she will smile and ask how much time you have. Born in Beirut to a Lebanese father and a Danish mother, she spent her childhood in Nairobi, her teenage years in Singapore and her twenties in Toronto, where she now works as a school counselor. "When people ask where home is," she says, "I usually say 'wherever my books are.'"

    Leila is what researchers call a third culture kid: someone who spent a significant part of their childhood outside their parents' culture. The term was first used by American sociologists in the nineteen fifties to describe the children of diplomats, missionaries and military families. Today, with millions of families moving abroad for work, the group is far larger and far more varied.

    Third culture kids tend to share certain strengths. Having moved so often, many are remarkably adaptable. They are often multilingual, quick to notice cultural differences and comfortable with people from very different backgrounds. International employers frequently value exactly these skills.

    But the experience also has a cost, and it can take years to recognize it. Many adults who grew up this way describe a feeling of rootlessness: they seem to belong everywhere and nowhere. Leila remembers returning to Lebanon at eighteen, expecting to feel at home, only to find that her cousins considered her a foreigner. "My Arabic was fine, but I didn't know the songs, the jokes or the TV shows," she says. "I must have looked Lebanese, but I certainly didn't sound it."

    Another common experience is unresolved grief. Every move means saying goodbye — to friends, to schools, to a favorite café or the view from a bedroom window. Because these losses are rarely seen as serious, children are seldom given time to mourn them. Some researchers suggest that this may explain why many third culture kids find it hard to form deep friendships as adults: if you expect to leave, it can seem safer not to get too close.

    The good news is that awareness has grown considerably. International schools increasingly run "leaving programs" that help children say goodbye properly, and online communities connect adults who share the same background. For many, simply discovering that there is a name for their experience is a relief.

    In her work, Leila now helps students through the same transitions she once went through. Her advice to parents is practical. "Don't promise that the next place will feel just like home — it won't. Let your children be sad about what they're leaving. And give them something that travels with them: a tradition, a language, a family ritual. Roots don't have to be in the ground. They can be in the things you do together."

    Asked whether she would raise her own children the same way, she pauses. "Probably, yes," she says. "I might move less often. But I wouldn't give up what it taught me — that there are many ways to be at home in the world."
  glossary: |
    third culture kid | someone who spent much of their childhood outside their parents' culture
    adaptable | able to change easily to suit new situations
    rootlessness | the feeling of not belonging to any particular place
    unresolved grief | sadness about a loss that has never been fully dealt with
    mourn | to feel and show sadness after a loss | Often used about death, but also about other losses.
    transition | a change from one situation to another
    ritual | something done regularly in the same way, often with special meaning
  questions: |
    mc: What is a "third culture kid"? || *Someone who spent much of their childhood outside their parents' culture | A child whose parents come from three different countries | A child who speaks three languages fluently || "Someone who spent a significant part of their childhood outside their parents' culture."
    tf: The term "third culture kid" was first used in the twenty-first century. || false || It "was first used by American sociologists in the nineteen fifties."
    short: How did Leila's cousins see her when she returned to Lebanon at eighteen? || kw: foreigner/foreign/outsider || "Her cousins considered her a foreigner."
    mc: According to some researchers, why might third culture kids find deep friendships difficult? || *They may avoid getting close because they expect to leave. | They don't speak any language well enough. | Their parents don't allow them to make friends. || "If you expect to leave, it can seem safer not to get too close."
    fill: Leila tells parents to give children something that ___ with them, such as a tradition or a language. || travels / goes / moves || "Give them something that travels with them: a tradition, a language, a family ritual."
    tf: Leila says she would definitely not raise her own children abroad. || false || She says "Probably, yes," although she might move less often.

- slug: the-secondhand-boom
  kind: reading
  title: The secondhand boom
  topic: Work and the economy
  summary: Buying and selling used goods has gone mainstream, and repair cafés are spreading. Is this the end of throwaway culture, or just a new way to shop?
  text: |
    Ten years ago, Marta Lindqvist would not have been seen dead in secondhand clothes. "I associated them with not having enough money," the twenty-nine-year-old accountant admits. Today, almost everything she wears was owned by someone else first, and she sells the clothes she no longer wants through an app on her phone. "If I hadn't started buying secondhand, I'd have a wardrobe full of things I never wear — and a lot less money in the bank."

    Marta is part of a quiet revolution. The resale market — clothes, furniture, electronics and even toys sold from one consumer to another — has grown rapidly in recent years, and some analysts predict that secondhand clothing could one day rival fast fashion in size. Online platforms have made it easy to buy and sell in minutes, and the stigma that once surrounded used goods has largely disappeared, especially among younger shoppers.

    The reasons are partly financial. With rents and food prices rising in many countries, buying a nearly new coat for a third of the original price is an obvious choice. But for many buyers, the motivation is environmental. The fashion industry is responsible for a significant share of global carbon emissions and water pollution, and extending the life of a garment by even a few months can reduce its environmental impact considerably.

    Not everyone is convinced that the boom is entirely positive, however. Some critics point out that easy resale can encourage people to buy even more, simply because they know they can sell things again. "If you buy ten dresses because you can resell nine of them, you haven't really changed your habits," says Dr. Anil Rao, who researches consumer behavior. "You've just found a new way to shop." Others worry that professional resellers buy up the cheapest items in charity shops, leaving less for people who genuinely depend on them.

    Alongside the resale market, another trend is growing: repair. In cities across Europe and North America, volunteer-run "repair cafés" invite people to bring broken toasters, lamps and bicycles and fix them with the help of experts. In some places, governments have introduced "right to repair" rules, which require manufacturers to make spare parts available for longer.

    For economists, these trends raise an interesting question. Economies have traditionally measured success by how much is produced and sold. If people buy fewer new things and keep them longer, sales of new goods may fall — even if people's quality of life improves. Some businesses are already adapting by offering repairs, rentals or buy-back schemes alongside their new products.

    Marta, for her part, has no plans to go back. "I still love clothes," she says. "I just love them for longer now."
  glossary: |
    would not be seen dead in | would never wear or use something (informal and strong)
    resale | selling something that you bought earlier, usually used
    stigma | a feeling of shame or disapproval connected with something
    garment | a piece of clothing | Formal; common in business and news texts.
    reseller | someone who buys things in order to sell them again for a profit
    charity shop | a shop that sells donated goods to raise money for a charity | American English: thrift store
    spare parts | new pieces used to replace broken parts of a machine
    buy-back scheme | an arrangement in which a company buys its products back from customers
  questions: |
    mc: Why didn't Marta buy secondhand clothes ten years ago? || *She connected them with being poor. | They were too expensive for her. | She couldn't find any online. || "I associated them with not having enough money."
    tf: According to the article, the stigma around used goods has grown stronger. || false || The stigma "has largely disappeared, especially among younger shoppers."
    short: What do repair cafés help people do? || kw: fix/repair/mend || They invite people to bring broken items "and fix them with the help of experts."
    mc: What is Dr. Rao's main criticism of the resale boom? || *It can allow people to keep buying too much. | Secondhand clothes are low quality. | Repair cafés take customers from shops. || "If you buy ten dresses because you can resell nine of them, you haven't really changed your habits."
    fill: "Right to repair" rules require manufacturers to make spare ___ available for longer. || parts || "Which require manufacturers to make spare parts available for longer."
    tf: The article suggests that sales of new goods could fall even if people's quality of life improves. || true || "Sales of new goods may fall — even if people's quality of life improves."

- slug: when-the-algorithm-decides
  kind: reading
  title: When the algorithm decides
  topic: Science and technology
  summary: More and more job applications are screened by software. Can an algorithm be fairer than a human recruiter — or does it simply repeat the mistakes of the past?
  text: |
    When Jordan Ellis applied for forty jobs in two months and received forty automatic rejections, he began to suspect that no human had ever read his applications. He was probably right. A growing number of large employers now use software to screen job applications, and many candidates are rejected before a person even sees their name.

    Supporters of these systems argue that they make hiring faster and, potentially, fairer. A popular job advert can attract thousands of applications, and human recruiters, it is often pointed out, have biases of their own. People tend to favor candidates who remind them of themselves — who went to the same university, share the same hobbies or have similar names. An algorithm, the argument goes, does not care about any of that.

    The problem is that an algorithm learns from data, and data reflects the past. If a company has mostly hired one type of person over the last twenty years, a system trained on those decisions is likely to learn that this type of person is what "success" looks like. In one widely reported case, an experimental recruitment tool developed by a large technology company was found to give lower scores to applications that included the word "women's," as in "women's chess club." The tool was reportedly abandoned before it was used to make real decisions, but the case became a warning for the whole industry.

    Bias can also creep in through less obvious routes. Gaps in a CV, for example, may be treated as a negative signal, even though they are often caused by illness, caring for children or relatives, or unemployment during a recession. Video interviews analyzed by software raise further questions: can a machine fairly judge the facial expressions or speech of candidates with disabilities, or of people from cultures where eye contact is used differently?

    Regulators are beginning to respond. In some places, employers are now required to tell candidates when automated tools are being used, and independent audits of hiring software have been introduced to check for discrimination. Researchers are also developing methods to test algorithms for bias before they are put into use.

    Few experts believe that the answer is to ban these tools completely. Used carefully, they can help employers look beyond the usual universities and networks and find talented people who might otherwise have been overlooked. But that requires transparency: candidates should know how they are being assessed, and humans should remain responsible for the final decision.

    Jordan eventually found a job — through a friend who passed his CV directly to a manager. "It's ironic," he says. "Everyone talks about technology making things fairer, and in the end I got hired the old-fashioned way: because somebody knew somebody."
  glossary: |
    screen | to check applications or people in order to decide which ones to consider
    recruiter | someone whose job is finding and choosing new employees
    creep in | to gradually appear without being noticed
    CV | a document that lists your education and work experience | American English: résumé
    audit | an official examination to check that something is correct or fair
    discrimination | treating a person or group unfairly because of who they are
    overlook | to fail to notice or consider someone or something
    the old-fashioned way | using traditional methods instead of modern ones
  questions: |
    mc: What did Jordan suspect about his job applications? || *No person had read them. | They contained spelling mistakes. | They had been sent to the wrong companies. || "He began to suspect that no human had ever read his applications."
    tf: According to supporters of the software, human recruiters are free of bias. || false || Supporters point out that human recruiters "have biases of their own."
    short: Which word in applications did the experimental recruitment tool react negatively to? || kw: women's/women || It gave lower scores to applications that included the word "women's."
    mc: Why can gaps in a CV be an unfair signal? || *They often have good reasons, such as illness or caring for relatives. | Employers never read that part of a CV. | Algorithms can't read dates. || Gaps "are often caused by illness, caring for children or relatives, or unemployment during a recession."
    fill: In some places, independent ___ of hiring software have been introduced to check for discrimination. || audits || "Independent audits of hiring software have been introduced to check for discrimination."
    tf: Jordan got his job through a personal contact. || true || "Through a friend who passed his CV directly to a manager."

- slug: cities-that-drink-the-rain
  kind: reading
  title: Cities that drink the rain
  topic: Environment
  summary: As storms become heavier, some cities are trying to work with rainwater instead of against it. What is a "sponge city," and can it really prevent floods?
  text: |
    Every summer, it seems, the same images appear on the news: streets turned into rivers, cars floating in underpasses, basements full of water. As the climate warms, heavy rainstorms are becoming more frequent and more intense in many parts of the world. Yet the cities hit hardest are often not the ones with the most rain, but the ones with the most concrete.

    The reason is simple. In a natural landscape, much of the rain that falls soaks into the ground, where it is absorbed by soil and plants. In a modern city, by contrast, roads, roofs and parking lots are almost entirely waterproof. As a result, rainwater has nowhere to go except into drains, and when the drains are overwhelmed, it floods the streets.

    For most of the twentieth century, the solution was to build bigger pipes and higher walls. The idea behind the "sponge city" is the opposite: instead of moving water away as fast as possible, cities should hold on to it, slow it down and let it soak in. The term became widely known after China launched a national program in twenty-fifteen, but similar ideas have been used in cities from Copenhagen to Melbourne.

    What does a sponge city look like? It might include parks designed to flood safely, turning into temporary lakes during a storm and drying out afterward. It might involve green roofs covered in plants, which absorb rain and keep buildings cooler. Sidewalks can be made of permeable materials that let water pass through, and streets can be lined with planted channels, sometimes called rain gardens, that collect the runoff from the road.

    The benefits go beyond flood protection. Because the water is stored rather than wasted, it can be used to water parks during dry periods. Plants and open water cool the air, which matters in cities that are getting hotter. And many residents simply enjoy living near more green space.

    There are limitations, though. Sponge features work well for frequent, moderate storms, but they cannot absorb the most extreme downpours on their own, so traditional drainage is still needed. Retrofitting existing neighborhoods is expensive and disruptive, and green infrastructure needs regular maintenance, which is often underfunded once the ribbon has been cut. Critics also point out that some projects have been more about appearance than performance.

    Despite these challenges, many planners believe that the approach represents a fundamental change in thinking. For a century, cities treated rain as waste to be removed as quickly as possible. Now, many are learning to treat it as a resource. Whether they can make that change quickly enough is another question.
  glossary: |
    underpass | a road or path that goes under another road or a railway
    soak into | (of a liquid) to go gradually into something
    overwhelmed | (of a system) given more than it can deal with
    permeable | allowing liquid to pass through
    runoff | rainwater that flows over the ground instead of soaking into it
    downpour | a sudden, heavy fall of rain
    retrofit | to add new features to an older building or area
    cut the ribbon | to officially open a new building or project
  questions: |
    mc: According to the article, which cities are often hit hardest by flooding? || *Those with the most concrete | Those with the most rain | Those closest to the sea || "The cities hit hardest are often not the ones with the most rain, but the ones with the most concrete."
    tf: The aim of a sponge city is to move rainwater away as fast as possible. || false || "Instead of moving water away as fast as possible, cities should hold on to it, slow it down and let it soak in."
    short: Apart from absorbing rain, what do green roofs do for buildings? || kw: cool/cooler/cooling || Green roofs "absorb rain and keep buildings cooler."
    fill: Streets can be lined with planted channels, sometimes called rain ___. || gardens || "Planted channels, sometimes called rain gardens."
    mc: What is one limitation of sponge features? || *They cannot deal with the most extreme storms on their own. | They only work in China. | They make cities hotter. || "They cannot absorb the most extreme downpours on their own, so traditional drainage is still needed."
    tf: The article says that green infrastructure needs no maintenance once it is built. || false || It "needs regular maintenance, which is often underfunded."

- slug: spotting-a-fake
  kind: reading
  title: Spotting a fake
  topic: Arts and culture
  summary: Forgeries hang in respected collections around the world. How do experts uncover them — and why can science prove a painting is fake but rarely that it is genuine?
  text: |
    Every year, paintings worth millions are sold, exhibited and admired — and some of them are fakes. Experts disagree about how many, but few doubt that forgeries hang in respected collections around the world. How, then, are they found?

    The first line of defense is provenance: the documented history of a work's ownership. A genuine painting usually leaves a trail of sales receipts, exhibition catalogs, letters and photographs. Gaps in that trail are not proof of forgery — records are lost in wars, fires and house moves — but they make experts cautious. Clever forgers know this, which is why some have gone as far as inventing entire histories, complete with fake labels on the back of the canvas.

    The second line is the expert eye. Specialists who have spent decades studying a single artist learn to recognize the way that artist painted a hand, built up a shadow or signed a name. Rarely can a forger imitate every habit at once. Yet the eye can be fooled. Some famous forgeries of the twentieth century were accepted as genuine by leading experts, partly because the experts wanted them to be real.

    That is why, increasingly, the final word belongs to science. Viewed under ultraviolet light, areas of later retouching often appear darker than the original paint, revealing repairs or additions. X-rays can show what lies beneath the surface: an earlier composition, a change of mind or, in some cases, a completely different painting, reused by a forger to obtain an old canvas.

    Chemical analysis of pigments is particularly powerful, because many pigments have known dates of invention. Titanium white, for example, did not become widely available as an artists' paint until the twentieth century. Found in a painting supposedly made in the sixteen hundreds, it is a clear sign that something is wrong — unless it belongs to a later restoration. For paintings on wooden panels, the growth rings of the wood can be compared with historical records to estimate when the tree was cut down. And radiocarbon dating can show whether a canvas was made after the middle of the twentieth century, when nuclear weapons tests changed the amount of a particular form of carbon in the atmosphere.

    Not only are these methods becoming more accurate, but they are also becoming cheaper and less destructive, often needing a sample smaller than a grain of sand. Even so, science has its limits. A test can prove that a painting is not what it claims to be, but it can rarely prove beyond doubt that a work is genuine. A skilled forger using old materials may pass every test.

    In the end, authenticating a painting is a little like solving a crime: no single clue is enough, but together, documents, expert judgment and laboratory evidence can build a convincing case. And the stakes are high. No collector who has paid a fortune for a masterpiece wants to discover that it was painted last year.
  glossary: |
    forgery | a copy of a work of art, document or signature made to deceive people
    provenance | the record of who has owned a work of art since it was made
    authenticate | to prove that something is genuine
    retouching | small changes made to a painting or photograph after it was finished
    pigment | a substance that gives paint its color
    composition | the way the parts of a picture are arranged
    restoration | work done to repair a painting or building and return it to its original state
    the stakes are high | a lot can be won or lost
  questions: |
    mc: What is provenance? || *The documented history of who has owned a work | The chemical makeup of the paint | The personal style of an artist || "Provenance: the documented history of a work's ownership."
    tf: Gaps in a painting's history always prove that it is a forgery. || false || "Gaps in that trail are not proof of forgery."
    short: What can X-rays reveal about a painting? || kw: beneath/under/underneath/below/earlier/hidden || "X-rays can show what lies beneath the surface," such as an earlier composition.
    fill: Titanium white did not become widely available as an artists' paint until the ___ century. || twentieth / 20th || "Did not become widely available as an artists' paint until the twentieth century."
    mc: What, according to the article, can science rarely do? || *Prove beyond doubt that a painting is genuine | Show that a painting is not what it claims to be | Analyze very small samples || "It can rarely prove beyond doubt that a work is genuine."
    tf: Modern tests often need only a very tiny sample of paint. || true || They often need "a sample smaller than a grain of sand."

- slug: democracy-by-lottery
  kind: reading
  title: Democracy by lottery
  topic: Citizenship and public life
  summary: Citizens' assemblies bring together randomly selected members of the public to study a difficult question and make recommendations. How do they work, and do they make a difference?
  text: |
    Imagine receiving a letter that says you have been randomly selected to help decide a difficult public question. You will spend several weekends listening to experts, discussing evidence with ninety-nine strangers and, finally, voting on recommendations that will be sent to the government. Your travel and accommodation will be paid for. You are not required to accept — but would you?

    This is how a citizens' assembly works, and over the past two decades, assemblies like this have been used by national governments, regions and cities around the world. The idea is surprisingly old. In ancient Athens, many public officials were chosen by lottery rather than by election, partly because lotteries were considered harder to manipulate.

    A modern assembly usually brings together between fifty and one hundred and fifty people. Members are not chosen completely at random. Invitations are sent to thousands of households, and from those who reply, a final group is selected so that it reflects the population in terms of age, gender, region, education and other factors. The aim is a "mini-public": a small group that looks like the country or city as a whole.

    Supporters argue that assemblies offer something that ordinary politics struggles to provide: time to think. Members are given balanced information, hear from people with opposing views and discuss the issues in small groups led by trained facilitators. Because they do not need to win elections or raise money, they are free to change their minds. Many participants report that the experience changed how they see people who disagree with them. "I came in sure that I was right," one member of a regional assembly on transport told researchers. "I left understanding why other people saw it differently."

    Critics raise several concerns. Assemblies are expensive and slow, and their recommendations are usually not binding: governments can accept them, change them or ignore them entirely. If recommendations are repeatedly ignored, it is argued, participants and the public may become more cynical, not less. Others question whether a small group of randomly selected people, however representative, should have so much influence over decisions that affect millions. The way a question is framed, and which experts are invited, can also shape the outcome.

    Most researchers see assemblies not as a replacement for elected parliaments, but as a complement to them — a tool that is particularly useful for long-term or complex issues on which politicians find it hard to agree. Their success seems to depend heavily on design: a clear question, enough time, independent organization and a firm commitment from the government to respond publicly to every recommendation.

    So, would you accept the invitation? Many people say they would. In practice, however, only a small fraction of those invited reply to the letter. Perhaps that is the real test of the idea: not whether ordinary people can make good decisions, but whether enough of them are willing to give up their weekends to try.
  glossary: |
    lottery | a way of choosing people or things by chance
    mini-public | a small group of people chosen to represent the wider population
    facilitator | someone who helps a group discuss an issue and reach decisions
    binding | that must be followed, usually because of a law or agreement
    representative | typical of a larger group
    frame (a question) | to express a question in a particular way, which can influence the answer
    complement | something that adds to and improves something else | Don't confuse it with compliment (praise).
  questions: |
    mc: How were many public officials chosen in ancient Athens? || *By lottery | By election | By the richest families || "Many public officials were chosen by lottery rather than by election."
    tf: Assembly members are picked completely at random, with no attempt to reflect the population. || false || A final group "is selected so that it reflects the population in terms of age, gender, region, education and other factors."
    short: Who leads the small-group discussions in an assembly? || kw: facilitator/facilitators || The discussions are "led by trained facilitators."
    mc: What is one criticism of citizens' assemblies? || *Governments can ignore their recommendations. | Members are paid very high salaries. | They meet only once, for one hour. || "Their recommendations are usually not binding: governments can accept them, change them or ignore them entirely."
    fill: Most researchers see assemblies as a ___ to elected parliaments, not a replacement. || complement || "Not as a replacement for elected parliaments, but as a complement to them."
    tf: According to the article, only a small fraction of the people invited actually reply. || true || "Only a small fraction of those invited reply to the letter."

- slug: is-that-photo-real
  kind: listening
  title: Is that photo real?
  topic: Media and persuasion
  summary: On a radio technology show, a researcher explains how to check whether a viral photo is genuine, and why believing nothing is not the answer either.
  free: true
  speakers: H=Noor/f; G=Callum/m
  text: |
    H: Welcome back to Tech Talk. With me is Callum Reid, who researches image manipulation at a university in Glasgow. Callum, a listener emailed us this week. She saw a photo of a shark swimming down a flooded highway and shared it before realizing it might be fake. How common is that?
    G: Extremely common. That particular image, or versions of it, has appeared after almost every major flood for over a decade. And every time, someone claims that it was taken that very morning.
    H: So how can ordinary people tell whether a photo is genuine?
    G: The first thing I'd suggest is a reverse image search. You upload the picture, and the search engine shows you where else it has appeared. If it was online five years ago, it obviously wasn't taken yesterday.
    H: That sounds simple. What about photos that have been edited, or created from scratch?
    G: Look for details that don't make sense: shadows falling in different directions, text on signs that's blurred or meaningless, hands with too many fingers. AI-generated images used to be easy to spot because of things like that, but they're improving fast.
    H: Which makes me wonder whether we'll be able to tell at all in a few years' time.
    G: Honestly, I think spotting fakes by eye is bound to become harder. That's why many experts are urging news organizations and camera makers to attach verified information to genuine photos — a kind of digital signature that shows where and when a picture was taken.
    H: Some listeners have told us they've simply stopped trusting anything they see online. Is that a sensible reaction?
    G: I understand it, but I'd warn people against going too far. If you believe nothing, you'll ignore real warnings too, and in a genuine emergency, that can be dangerous. What we need is healthy skepticism, not cynicism.
    H: So, what's your advice for our listener with the shark photo?
    G: Don't feel bad — she's in very good company. Next time, pause before sharing. Ask who posted it first and whether a reliable source has reported the same thing. And if it seems too extraordinary to be true, it probably is.
    H: Callum Reid, thank you for joining us.
    G: My pleasure.
  glossary: |
    image manipulation | changing a photo, often to deceive people
    reverse image search | a search that uses a picture instead of words to find where it appears online
    from scratch | from the beginning, without using anything that already exists
    spot | to notice or recognize something, especially when it is difficult
    digital signature | electronic information that proves who created something and when
    skepticism | an attitude of doubting claims until there is evidence | British spelling: scepticism
    in good company | in the same situation as many other people, including respected ones
  questions: |
    mc: What did the listener do with the shark photo? || *She shared it before realizing it might be fake. | She reported it to the police. | She took it herself during a flood. || "She… shared it before realizing it might be fake."
    tf: According to Callum, the shark photo was taken during last week's flood. || false || The image "has appeared after almost every major flood for over a decade."
    short: What kind of search does Callum suggest first? || kw: reverse & image/search || "The first thing I'd suggest is a reverse image search."
    mc: Why does Callum think spotting fakes by eye will become harder? || *AI-generated images are improving fast. | People are spending less time online. | Cameras are getting worse. || "AI-generated images used to be easy to spot… but they're improving fast."
    fill: Experts are urging camera makers to attach a kind of digital ___ to genuine photos. || signature || "A kind of digital signature that shows where and when a picture was taken."
    tf: Callum recommends that people stop trusting all images online. || false || He warns "against going too far" and recommends "healthy skepticism, not cynicism."

- slug: asking-for-a-raise
  kind: listening
  title: Asking for a raise
  topic: Work and the economy
  summary: Before her annual review, a product designer practices asking for a raise with her former manager, who gives her some tough but useful advice.
  speakers: A=Aditi/f; M=Mateo/m
  text: |
    M: So, Aditi, your review is on Thursday. Have you decided what you're going to ask for?
    A: I'm thinking of asking for a ten percent raise. I've taken on two extra projects since my last review.
    M: Good. Do you have evidence? Numbers are far more persuasive than telling them how hard you've worked.
    A: I do. The app redesign I led increased sign-ups by thirty percent. If I hadn't pushed for user testing, we would have launched the old version.
    M: Then start with that. Open with the results, not the request. What will you say if your manager tells you there's no budget?
    A: Honestly, that's what I'm dreading. Last year I just said "OK" and left the room.
    M: This time, have a plan B. You could accept a smaller raise now, provided that your salary is reviewed again in six months.
    A: Or extra training. I'd really like to do a course in data visualization.
    M: Good idea. Training usually costs the company less than a raise, so it's easier for them to say yes. But don't offer it too early — let them make the first counteroffer.
    M: Exactly. Supposing they really can't offer more money, what would you accept instead?
    A: A training budget, or one remote day a week. As long as I get one of those, I'd be happy.
    M: That's a strong position. And one more thing: don't fill the silence. After you name your figure, stop talking.
    A: That's going to be hard! I always end up apologizing for asking.
    M: Everyone does at first. If I'd known that when I was your age, I'd have earned a lot more in my twenties.
    A: OK, let's practice. You be my manager. "I'd like to discuss my salary, if that's all right."
    M: "Of course. But I should tell you that budgets are very tight this year."
    A: "I understand. However, since my last review, the redesign I led has increased sign-ups by thirty percent. On that basis, I'd like to propose a ten percent increase."
    M: Perfect. Now, silence… See? It's uncomfortable, but it works.
    A: It really is uncomfortable. But I think I can do it.
    M: Just remember: the worst they can say is no. And even then, you'll have shown them that you know your value.
