- slug: cuide-su-espalda
  kind: reading
  title: Cuide su espalda
  topic: Health and the body
  summary: A leaflet from a health centre gives practical advice for preventing back pain at work, at home and through exercise.
  text: |
    CENTRO DE SALUD LAS ACACIAS

    Cuide su espalda: consejos para todos los días

    ¿Le duele la espalda? No es el único: el dolor de espalda es uno de los problemas de salud más frecuentes. Muchas veces la causa son malos hábitos que podemos cambiar.

    En el trabajo
    - Si trabaja sentado, levántese y camine un poco cada hora.
    - Ponga la pantalla del ordenador a la altura de los ojos.
    - Siéntese bien: la espalda recta y los pies en el suelo.

    En casa
    - Para levantar algo pesado, doble las rodillas, no la espalda.
    - Duerma de lado o boca arriba, con una almohada no muy alta.
    - Lleve la compra en dos bolsas, una en cada mano.

    Ejercicio
    Hay que moverse todos los días. Camine al menos treinta minutos, nade o haga yoga o pilates. Antes de hacer deporte, caliente bien.

    ¿Cuándo tiene que ir al médico?
    Pida cita si el dolor dura más de dos semanas, si también le duele la pierna o si tiene fiebre. Si el dolor es muy fuerte, vaya a urgencias.

    Recuerde: su espalda le acompañará toda la vida. ¡Cuídela!
  translation: |
    LAS ACACIAS HEALTH CENTRE

    Look after your back: everyday advice

    Does your back hurt? You're not the only one: back pain is one of the most common health problems. Often the cause is bad habits that we can change.

    At work
    - If you work sitting down, get up and walk around a little every hour.
    - Put your computer screen at eye level.
    - Sit properly: back straight and feet on the floor.

    At home
    - To lift something heavy, bend your knees, not your back.
    - Sleep on your side or on your back, with a pillow that isn't too high.
    - Carry your shopping in two bags, one in each hand.

    Exercise
    You have to move every day. Walk for at least thirty minutes, swim, or do yoga or Pilates. Before doing sport, warm up well.

    When should you see a doctor?
    Make an appointment if the pain lasts more than two weeks, if your leg hurts too, or if you have a temperature. If the pain is very bad, go to A&E.

    Remember: your back will be with you all your life. Look after it!
  glossary: |
    cuide | look after (usted) | from cuidar; ¡cuídela! = look after it
    frecuente | common; frequent
    levántese | get up (usted) | from levantarse
    la pantalla | screen
    pesado / pesada | heavy
    doblar | to bend
    boca arriba | on your back | de lado = on your side
    la almohada | pillow
    calentar | to warm up | e → ie: caliente (usted imperative)
    urgencias | A&E; emergency department
  questions: |
    mc: How often should you get up if you work sitting down? || Every two hours | *Every hour | Every thirty minutes || "Levántese y camine un poco cada hora."
    tf: To lift something heavy, you should bend your back. || false || "Doble las rodillas, no la espalda."
    fill: Ponga la pantalla del ordenador a la altura de los ___. || ojos || At eye level: a la altura de los ojos.
    short: Name one type of exercise that the leaflet recommends. || kw: caminar/walk/walking/nadar/swim/swimming/yoga/pilates || "Camine al menos treinta minutos, nade o haga yoga o pilates."
    mc: When should you go to A&E? || If the pain lasts a week | *If the pain is very strong | If you work sitting down || "Si el dolor es muy fuerte, vaya a urgencias."

- slug: mi-primer-trabajo
  kind: reading
  title: Mi primer trabajo
  topic: Work and studies
  summary: In a magazine column, chef Nekane Arrieta remembers her first job at a neighbourhood bakery at sixteen — and the boss who taught her to make bread.
  text: |
    MI PRIMER TRABAJO — Nekane Arrieta, cocinera

    Tengo un restaurante en San Sebastián desde hace doce años, pero mi primer trabajo fue muy diferente.

    Tenía dieciséis años y quería dinero para el verano, así que empecé a trabajar en la panadería de mi barrio. Entraba a las cinco de la mañana. Hacía mucho calor cerca del horno y al principio todo era difícil: me quemaba los dedos, llegaba tarde, se me caían las bandejas… Mi jefe, Patxi, era serio, pero muy paciente. Me enseñó a hacer pan, cruasanes y tartas.

    Lo que más me gustaba era el olor del pan a las siete, cuando abríamos la tienda y llegaban los primeros clientes. Muchos eran vecinos mayores que venían todos los días y me contaban historias del barrio.

    Trabajé allí tres veranos. Después estudié cocina en una escuela de hostelería y trabajé en restaurantes de Bilbao, Lyon y Londres.

    Hace doce años volví a casa y abrí mi propio restaurante. Hoy tenemos un equipo de quince personas y hacemos nuestro propio pan cada mañana. Cuando lo saco del horno, siempre pienso en Patxi.
  translation: |
    MY FIRST JOB — Nekane Arrieta, chef

    I've had a restaurant in San Sebastián for twelve years, but my first job was very different.

    I was sixteen and I wanted money for the summer, so I started working at the bakery in my neighbourhood. I started at five in the morning. It was very hot near the oven and at first everything was hard: I burnt my fingers, I arrived late, I dropped the trays… My boss, Patxi, was serious, but very patient. He taught me to make bread, croissants and cakes.

    What I liked most was the smell of the bread at seven, when we opened the shop and the first customers arrived. Many of them were elderly neighbours who came every day and told me stories about the neighbourhood.

    I worked there for three summers. Then I studied cookery at a catering school and worked in restaurants in Bilbao, Lyon and London.

    Twelve years ago I came back home and opened my own restaurant. Today we have a team of fifteen people and we make our own bread every morning. When I take it out of the oven, I always think of Patxi.
  glossary: |
    entrar a trabajar | to start work | entraba a las cinco = I started at five
    el horno | oven
    quemarse | to burn yourself | me quemaba los dedos = I used to burn my fingers
    se me caían las bandejas | I used to drop the trays | literally "the trays fell from me"
    paciente | patient
    lo que más me gustaba | what I liked most
    el olor | smell
    la escuela de hostelería | catering school
    propio / propia | own | mi propio restaurante = my own restaurant
    sacar del horno | to take out of the oven
  questions: |
