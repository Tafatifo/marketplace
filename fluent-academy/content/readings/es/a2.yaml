- slug: mi-abuela-remedios
  kind: reading
  title: Mi abuela Remedios
  topic: Life stories
  summary: Lucía tells the life story of her grandmother, from a village in Jaén to a shop in Barcelona — and back to school at sixty-seven.
  free: true
  text: |
    Mi abuela Remedios nació en 1941 en un pueblo pequeño de Jaén. Sus padres tenían olivos y ella empezó a trabajar en el campo a los doce años. No pudo ir mucho al colegio, pero aprendió a leer con su hermano mayor, por las noches, en la cocina.

    A los veinte años se mudó a Barcelona con su hermana. Allí encontró trabajo en una fábrica de tejidos y conoció a mi abuelo, Andreu, en un baile. Se casaron en 1965 y tuvieron tres hijos. Mi madre es la pequeña.

    En 1980 mis abuelos abrieron una tienda de ultramarinos en el barrio de Gràcia. Trabajaron allí casi treinta años. Mi abuela siempre dice que fueron los mejores años de su vida, porque conoció a todo el barrio.

    Se jubiló en 2006, y ese mismo año hizo algo increíble: volvió a estudiar. Terminó la educación secundaria para adultos a los sesenta y siete años y después hizo un curso de informática. ¡Ahora me manda mensajes llenos de emoticonos!

    Cuando cumplió ochenta años, viajamos todos juntos a su pueblo. Fue un día muy bonito: visitamos su antigua casa, comimos en la plaza con sus primos y mi abuela nos enseñó el río donde se bañaba de pequeña.
  translation: |
    My grandmother Remedios was born in 1941 in a small village in Jaén. Her parents had olive trees and she started working in the fields at the age of twelve. She couldn't go to school much, but she learned to read with her older brother, at night, in the kitchen.

    At twenty she moved to Barcelona with her sister. There she found work in a textile factory and met my grandfather, Andreu, at a dance. They got married in 1965 and had three children. My mother is the youngest.

    In 1980 my grandparents opened a grocer's shop in the Gràcia neighbourhood. They worked there for almost thirty years. My grandmother always says those were the best years of her life, because she got to know the whole neighbourhood.

    She retired in 2006, and that same year she did something incredible: she went back to studying. She finished secondary education for adults at sixty-seven and then did a computer course. Now she sends me messages full of emojis!

    When she turned eighty, we all travelled together to her village. It was a lovely day: we visited her old house, had lunch in the square with her cousins, and my grandmother showed us the river where she used to swim as a child.
  glossary: |
    el olivo | olive tree | Jaén is the world's biggest olive-oil producing province
    la fábrica de tejidos | textile factory
    el baile | dance (event)
    la pequeña | the youngest (daughter) | el pequeño / la pequeña of the family
    la tienda de ultramarinos | grocer's shop | an old-fashioned word; today: tienda de alimentación
    jubilarse | to retire
    volver a + infinitive | to do something again | volvió a estudiar = she went back to studying
    la informática | computing; IT
    antiguo / antigua | old; former | before a noun it often means "former": su antigua casa
  questions: |
    mc: Where did Remedios meet her husband? || In the factory | *At a dance | In the shop || "Conoció a mi abuelo, Andreu, en un baile."
    tf: Remedios went to school for many years as a child. || false || "No pudo ir mucho al colegio" — she learned to read with her brother.
    fill: Remedios ___ a Barcelona a los veinte años. || se mudó || "A los veinte años se mudó a Barcelona con su hermana."
    mc: How long did the grandparents work in their shop? || *Almost thirty years | About twenty years | Twelve years || "Trabajaron allí casi treinta años."
    short: What did Remedios do the year she retired? || kw: estudiar/estudió/study/studied/school/secundaria || She went back to studying and finished secondary education for adults.

- slug: cuatro-dias-en-cadiz
  kind: reading
  title: Cuatro días en Cádiz
  topic: Holidays and travel
  summary: A travel blogger writes on the train home about four days in Cádiz — sunsets, fried fish, the famous wind and a lost phone.
  text: |
    Esta semana he estado en Cádiz con mi amiga Celia y hoy, en el tren de vuelta, os cuento el viaje.

    Llegamos el jueves por la tarde. Dejamos las maletas en un apartamento pequeño del centro y fuimos directamente a la playa de la Caleta para ver la puesta de sol. ¡Qué maravilla!

    El viernes hicimos una ruta a pie por el casco antiguo. Subimos a la Torre Tavira para ver toda la ciudad desde arriba y comimos pescado frito en un bar del mercado. Por la noche quisimos ir a un espectáculo de flamenco, pero no había entradas.

    El sábado alquilamos unas bicis y fuimos hasta la playa de Cortadura. Hizo muchísimo viento —en Cádiz el levante es famoso— y volvimos con arena en todas partes.

    Ayer tuvimos un pequeño problema: Celia perdió el móvil en el autobús. Fuimos a la estación y, por suerte, el conductor lo tenía. ¡Qué alivio!

    Esta mañana hemos desayunado churros, hemos comprado unos recuerdos y hemos cogido el tren de las doce. Cádiz tiene playas preciosas, gente muy simpática y una luz especial. ¡Volveré, seguro!
  translation: |
    This week I've been in Cádiz with my friend Celia, and today, on the train home, I'm telling you about the trip.

    We arrived on Thursday afternoon. We left our cases in a small apartment in the centre and went straight to La Caleta beach to watch the sunset. How wonderful!

    On Friday we did a walking tour of the old town. We went up the Torre Tavira to see the whole city from above and had fried fish in a bar in the market. In the evening we wanted to go to a flamenco show, but there were no tickets left.

    On Saturday we hired bikes and rode to Cortadura beach. It was extremely windy — the east wind, the levante, is famous in Cádiz — and we came back with sand everywhere.

    Yesterday we had a small problem: Celia lost her phone on the bus. We went to the bus station and, luckily, the driver had it. What a relief!

    This morning we had churros for breakfast, bought some souvenirs and caught the twelve o'clock train. Cádiz has beautiful beaches, very friendly people and a special light. I'll definitely be back!
  glossary: |
    os cuento | I'll tell you (all) | from contar (o → ue)
    la puesta de sol | sunset
    el casco antiguo | old town
    el pescado frito | fried fish | a speciality of Cádiz
    no había entradas | there were no tickets left | había = imperfect of hay
    el levante | east wind | a strong wind typical of Cádiz
    la arena | sand
    por suerte | luckily
    los recuerdos | souvenirs | also "memories"
    coger el tren | to catch the train | Spain; in Latin America: tomar el tren
