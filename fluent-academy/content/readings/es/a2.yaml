    mc: In which city did Nekane NOT work? || Lyon | London | *Madrid || She worked in Bilbao, Lyon and London.

- slug: del-centro-a-las-afueras
  kind: reading
  title: Del centro a las afueras
  topic: Home and housing
  summary: A year after moving from the centre of Zaragoza to the outskirts, a blogger compares the old flat and neighbourhood with the new ones.
  text: |
    Hace un año mi pareja y yo dejamos nuestro piso del centro de Zaragoza y nos mudamos a un barrio de las afueras. Muchos amigos nos preguntan: «¿Estáis contentos?». Esta es mi respuesta.

    El piso nuevo es más grande que el antiguo: tiene noventa metros cuadrados y una terraza. Además, es más barato: pagamos cien euros menos al mes. También es más luminoso, porque es exterior y está en un séptimo.

    El barrio es mucho más tranquilo. Por la noche no hay tanto ruido como en el centro y hay más zonas verdes: tenemos un parque enorme al lado de casa. Los vecinos son igual de amables que antes, pero aquí nos conocemos más, porque hay menos gente.

    Pero no todo es mejor. Aquí hay menos bares, menos cines y menos tiendas pequeñas. Para ir al trabajo tardo cuarenta minutos en autobús; antes iba andando en diez. Y los fines de semana salgo menos que antes, porque volver a casa por la noche es más complicado.

    ¿Mi conclusión? Ahora vivo mejor, pero echo de menos el centro. Por eso, los sábados cogemos el autobús y comemos en nuestro bar favorito, cerca de la plaza del Pilar.
  translation: |
    A year ago my partner and I left our flat in the centre of Zaragoza and moved to a neighbourhood on the outskirts. Lots of friends ask us: "Are you happy?" This is my answer.

    The new flat is bigger than the old one: it's ninety square metres and has a terrace. What's more, it's cheaper: we pay a hundred euros less a month. It's also brighter, because it faces the street and it's on the seventh floor.

    The neighbourhood is much quieter. At night there isn't as much noise as in the centre, and there are more green spaces: we have a huge park next to our building. The neighbours are as friendly as before, but here we know each other better, because there are fewer people.

    But not everything is better. Here there are fewer bars, fewer cinemas and fewer small shops. To get to work it takes me forty minutes by bus; before, I used to walk there in ten. And at weekends I go out less than before, because getting home at night is more complicated.

    My conclusion? Now I live better, but I miss the centre. That's why on Saturdays we take the bus and have lunch at our favourite bar, near the Plaza del Pilar.
  glossary: |
    las afueras | the outskirts
    un séptimo | a seventh-floor flat
    igual de … que | as … as | igual de amables que = as friendly as
    tardar | to take (time) | tardo cuarenta minutos = it takes me forty minutes
    andando | on foot
    complicado / complicada | difficult; complicated
    echar de menos | to miss | In Latin America: extrañar
    por eso | that's why
  questions: |
    mc: How much less do they pay for the new flat? || *A hundred euros a month | Ninety euros a month | Forty euros a month || "Pagamos cien euros menos al mes."
    tf: There is more noise at night in the new neighbourhood. || false || "Por la noche no hay tanto ruido como en el centro."
    fill: En el barrio nuevo hay ___ bares que en el centro. || menos || "Aquí hay menos bares, menos cines y menos tiendas pequeñas."
    short: How long does the writer's journey to work take now? || kw: cuarenta/40/forty || "Para ir al trabajo tardo cuarenta minutos en autobús."
    mc: What do they do on Saturdays? || They go to the park | *They have lunch in the centre | They stay at home || "Los sábados cogemos el autobús y comemos en nuestro bar favorito."

- slug: la-noche-de-reyes
  kind: reading
  title: La noche de Reyes
  topic: Celebrations and traditions
  summary: How Spanish families celebrate the Three Kings on 5 and 6 January — the parade, the shoes, the presents and the roscón with its two surprises.
  text: |
    En España, para muchos niños el día más esperado del invierno no es el 25 de diciembre, sino el 6 de enero: el Día de Reyes.

    Según la tradición, los tres Reyes Magos —Melchor, Gaspar y Baltasar— viajan desde Oriente y llegan la noche del 5 de enero con regalos para todos los niños. Unas semanas antes, los niños les escriben una carta con sus deseos.

    La tarde del 5 hay cabalgatas en casi todas las ciudades y pueblos: los Reyes desfilan en carrozas por las calles y tiran caramelos al público. Después, los niños se van pronto a la cama. Antes de dormir, dejan sus zapatos en el salón y, a veces, un poco de leche y turrón para los Reyes y agua para los camellos.

    Por la mañana, ¡sorpresa! Al lado de los zapatos hay regalos. Los niños que se portan mal reciben carbón… pero es carbón dulce, de azúcar.

    El 6 de enero es festivo. Muchas familias desayunan juntas el roscón de Reyes, un dulce redondo con fruta escarchada. Dentro del roscón hay dos sorpresas: una figurita y un haba. La persona que encuentra la figurita será el rey o la reina del día; la que encuentra el haba tendrá que pagar el roscón el año que viene.
  translation: |
    In Spain, for many children the most eagerly awaited day of the winter isn't 25 December, but 6 January: Three Kings' Day.

    According to tradition, the three Wise Men — Melchior, Caspar and Balthazar — travel from the East and arrive on the night of 5 January with presents for all the children. A few weeks before, children write them a letter with their wishes.

    On the evening of the 5th there are parades in almost every town and village: the Kings ride along the streets on floats and throw sweets to the crowd. Afterwards, the children go to bed early. Before they go to sleep, they leave their shoes in the living room and sometimes a little milk and nougat for the Kings and water for the camels.

    In the morning — surprise! Next to the shoes there are presents. Children who have behaved badly get coal… but it's sweet coal, made of sugar.

    6 January is a public holiday. Many families have roscón de Reyes for breakfast together: a ring-shaped cake with candied fruit. Inside the roscón there are two surprises: a little figure and a dried bean. The person who finds the figure will be king or queen for the day; the one who finds the bean will have to pay for the roscón next year.
  glossary: |
    los Reyes Magos | the Three Kings; the Three Wise Men
    la cabalgata | (Three Kings') parade
    la carroza | float (in a parade)
    tirar | to throw
    los caramelos | sweets
    el turrón | nougat | a traditional Christmas sweet
    portarse mal | to behave badly
    el carbón | coal
    la fruta escarchada | candied fruit
    el haba | broad bean | feminine noun that takes el: el haba, las habas
  questions: |
    mc: When do the Three Kings bring the presents? || On 25 December | *On the night of 5 January | On 6 December || "Llegan la noche del 5 de enero con regalos para todos los niños."
    tf: Children leave their shoes in the living room. || true || "Dejan sus zapatos en el salón."
    fill: Los niños que se portan mal reciben ___. || carbón || "Reciben carbón… pero es carbón dulce, de azúcar."
    short: What do many families have for breakfast on 6 January? || kw: roscón || "Muchas familias desayunan juntas el roscón de Reyes."
    mc: What happens to the person who finds the bean? || They become king or queen for the day | *They pay for next year's roscón | They get an extra present || "La que encuentra el haba tendrá que pagar el roscón el año que viene."

- slug: un-paquete-que-no-llega
  kind: listening
  title: Un paquete que no llega
  topic: Services and errands
  summary: Mireia calls an online bookshop because her order hasn't arrived. The customer service agent finds the problem and sorts it out.
  free: true
  speakers: J=Julián/m; M=Mireia/f
  text: |
    J: Librería Página Doce, atención al cliente. Le atiende Julián. ¿En qué puedo ayudarle?
    M: Buenos días. Llamo porque hice un pedido hace diez días y todavía no lo he recibido.
    J: Vaya, lo siento. ¿Me dice el número de pedido, por favor?
    M: Sí, es el cuatro, siete, dos, uno, nueve.
    J: Un momento… Sí, aquí está. Tres libros, ¿verdad?
    M: Eso es. Los necesito para un regalo de cumpleaños el sábado.
    J: Pues el paquete salió del almacén el lunes, pero el repartidor no la encontró en casa.
    M: ¿Cómo? Yo trabajo desde casa. No he salido en toda la semana.
    J: Entiendo. A veces hay errores con la dirección. ¿Me confirma su dirección?
    M: Calle del Olmo, número quince, tercero B, en Salamanca.
    J: Ah, aquí pone tercero D. Ese es el problema. Lo cambio ahora mismo.
    M: ¿Y cuándo llegará?
    J: Si lo enviamos hoy, le llegará mañana por la tarde. Y le devolvemos los gastos de envío.
    M: Perfecto, muchas gracias. ¿Me pueden avisar por mensaje?
    J: Claro. Le mandamos un mensaje con el número de seguimiento.
    M: Muy bien. Gracias, Julián. Adiós.
  translation: |
    J: Página Doce Bookshop, customer service. Julián speaking. How can I help you?
    M: Good morning. I'm calling because I placed an order ten days ago and I still haven't received it.
    J: Oh dear, I'm sorry. Could you give me the order number, please?
    M: Yes, it's 4-7-2-1-9.
    J: One moment… Yes, here it is. Three books, right?
    M: That's right. I need them for a birthday present on Saturday.
    J: Well, the parcel left the warehouse on Monday, but the delivery driver didn't find you at home.
    M: What? I work from home. I haven't been out all week.
    J: I understand. Sometimes there are mistakes with the address. Could you confirm your address?
    M: Calle del Olmo, number fifteen, third floor B, in Salamanca.
    J: Ah, here it says third floor D. That's the problem. I'll change it right now.
    M: And when will it arrive?
    J: If we send it today, it'll reach you tomorrow afternoon. And we'll refund the delivery costs.
    M: Perfect, thank you very much. Can you let me know by text message?
    J: Of course. We'll send you a message with the tracking number.
    M: Very good. Thanks, Julián. Goodbye.
  glossary: |
    atención al cliente | customer service
    le atiende… | … speaking (on the phone) | literally "… is attending to you"
    el pedido | order
    el almacén | warehouse
    el repartidor / la repartidora | delivery driver
    aquí pone | here it says
    los gastos de envío | delivery costs
    el número de seguimiento | tracking number
  questions: |
    mc: Why hasn't Mireia received her order? || The books were out of stock | *The address had the wrong letter | She wasn't at home || The shop had "tercero D" instead of "tercero B".
    tf: Mireia ordered three books. || true || "Tres libros, ¿verdad?" — "Eso es."
    fill: El repartidor no ___ encontró en casa. || la || Mireia (usted, a woman) is the direct object: la.
    short: When will the parcel arrive? || kw: mañana/tomorrow || "Le llegará mañana por la tarde."
    mc: What will the shop give back to Mireia? || The price of the books | *The delivery costs | A gift voucher || "Le devolvemos los gastos de envío."

- slug: una-entrevista-por-telefono
  kind: listening
  title: Una entrevista por teléfono
  topic: Work and studies
  summary: Lourdes, from a summer camp, calls Hamid about his application to be a camp leader and asks about his studies and experience.
  speakers: L=Lourdes/f; H=Hamid/m
  text: |
    L: ¿Hamid Ziani? Hola, soy Lourdes, del campamento Los Pinos.
    H: Sí, soy yo. ¡Buenos días!
    L: Buenos días. Le llamo por su solicitud para monitor de verano. ¿Tiene unos minutos?
    H: Sí, claro. Dígame.
    L: En su currículum pone que estudia Magisterio. ¿En qué curso está?
    H: Estoy en tercero. Quiero ser maestro de primaria.
    L: Muy bien. ¿Ha trabajado antes con niños?
    H: Sí. El verano pasado trabajé dos meses en un campamento en Huesca. Organizaba juegos y excursiones para niños de ocho a doce años.
    L: ¿Y qué era lo más difícil?
    H: Al principio, la hora de dormir. ¡Nunca querían acostarse!
    L: Ja, ja, es normal. ¿Habla inglés? Este año vienen niños de Irlanda.
    H: Sí, tengo un B2. Y también hablo árabe.
    L: Perfecto. El puesto es del uno al treinta y uno de julio, y hay que dormir en el campamento.
    H: No hay problema. ¿El alojamiento y la comida están incluidos?
    L: Sí, y el sueldo es de novecientos euros al mes. ¿Podría venir el jueves a una entrevista con el director?
    H: Sí, el jueves me viene bien. ¿A qué hora?
    L: A las diez. Le mando la dirección por correo electrónico.
  translation: |
    L: Hamid Ziani? Hello, this is Lourdes, from Los Pinos summer camp.
    H: Yes, speaking. Good morning!
    L: Good morning. I'm calling about your application to be a summer camp leader. Have you got a few minutes?
    H: Yes, of course. Go ahead.
    L: Your CV says you're studying primary teaching. Which year are you in?
    H: I'm in my third year. I want to be a primary school teacher.
    L: Very good. Have you worked with children before?
    H: Yes. Last summer I worked for two months at a camp in Huesca. I organised games and trips for children aged eight to twelve.
    L: And what was the hardest thing?
    H: At first, bedtime. They never wanted to go to bed!
    L: Ha ha, that's normal. Do you speak English? This year there are children coming from Ireland.
    H: Yes, I've got a B2. And I speak Arabic too.
    L: Perfect. The job is from the first to the thirty-first of July, and you have to sleep at the camp.
    H: No problem. Are accommodation and meals included?
    L: Yes, and the pay is nine hundred euros a month. Could you come for an interview with the director on Thursday?
    H: Yes, Thursday suits me. What time?
    L: At ten. I'll send you the address by email.
  glossary: |
    el campamento | summer camp
    el monitor / la monitora | (camp) leader; instructor
    la solicitud | application
    Magisterio | primary teacher training (degree) | Spain
    ¿en qué curso está? | which year are you in?
    lo más difícil | the hardest thing
    acostarse | to go to bed | o → ue: se acuestan
    el alojamiento | accommodation
    me viene bien | it suits me
  questions: |
    mc: What is Hamid studying? || Medicine | *Primary teaching | English || "Estudia Magisterio… Quiero ser maestro de primaria."
    tf: Hamid has never worked with children. || false || Last summer he worked for two months at a camp in Huesca.
    fill: El verano pasado Hamid ___ dos meses en un campamento. (trabajar) || trabajó || A finished period in the past: preterite, él form trabajó.
    short: What was the hardest thing at his last camp? || kw: dormir/acostarse/sleep/bed/bedtime || "La hora de dormir. ¡Nunca querían acostarse!"
    mc: What will happen on Thursday? || Hamid will start work | *Hamid will have an interview with the director | The children from Ireland will arrive || "¿Podría venir el jueves a una entrevista con el director?"

- slug: vienes-en-nochevieja
  kind: listening
  title: ¿Vienes en Nochevieja?
  topic: Celebrations and traditions
  summary: Carla invites Mauro to a New Year's Eve dinner with friends. They talk about the grapes, who will bring what and the party afterwards.
  speakers: C=Carla/f; M=Mauro/m
  text: |
    C: ¡Hola, Mauro! ¿Qué tal? Oye, ¿qué haces en Nochevieja?
    M: Pues todavía no lo sé. ¿Por qué?
    C: Haremos una cena en mi casa con unos amigos. ¿Te gustaría venir?
    M: ¡Me encantaría! ¿Cuántos seremos?
    C: Ocho, más o menos. Cenaremos a las nueve y media y después veremos las campanadas en la tele.
    M: ¿Y tomaremos las uvas?
    C: ¡Claro! Yo compraré las uvas. ¿Podrías traer el cava?
    M: Sin problema. ¿Llevo también algo de postre?
    C: No, mi madre nos hará turrón casero. ¡Está buenísimo!
    M: ¡Qué bien! ¿Y después de cenar?
    C: A la una saldremos a una fiesta en el centro. Habrá música hasta las seis.
    M: Uf, ¿hasta las seis? El día uno tengo una comida familiar a las dos…
    C: Bueno, si estás cansado, puedes volver a casa antes.
    M: Vale. Entonces nos vemos el treinta y uno a las nueve.
    C: ¡Perfecto! Y ponte algo rojo: dicen que da buena suerte.
  translation: |
    C: Hi, Mauro! How are things? Listen, what are you doing on New Year's Eve?
    M: Well, I don't know yet. Why?
    C: We're having a dinner at my place with some friends. Would you like to come?
    M: I'd love to! How many of us will there be?
    C: Eight, more or less. We'll have dinner at half past nine and then watch the midnight chimes on TV.
    M: And will we have the grapes?
    C: Of course! I'll buy the grapes. Could you bring the cava?
    M: No problem. Shall I bring some dessert too?
    C: No, my mum will make us some homemade nougat. It's delicious!
    M: Great! And after dinner?
    C: At one we'll go out to a party in the centre. There'll be music until six.
    M: Phew, until six? On the first I've got a family lunch at two…
    C: Well, if you're tired, you can go home earlier.
    M: OK. So see you on the thirty-first at nine.
    C: Perfect! And wear something red: they say it brings good luck.
  glossary: |
    la Nochevieja | New Year's Eve
    las campanadas | the (midnight) chimes | broadcast live from the Puerta del Sol in Madrid
    las uvas | grapes | people eat twelve grapes, one with each chime
    el cava | Spanish sparkling wine
    casero / casera | homemade
    ¿cuántos seremos? | how many of us will there be?
    ponte | put on; wear (tú) | from ponerse
    dar buena suerte | to bring good luck
  questions: |
    mc: What will Mauro bring? || The grapes | *The cava | A dessert || "¿Podrías traer el cava?" — "Sin problema."
    tf: The dinner will start at half past nine. || true || "Cenaremos a las nueve y media."
    fill: A la una los amigos ___ a una fiesta en el centro. (salir) || saldrán || Salir has an irregular future stem: saldr- + án.
    short: Who will make the nougat? || kw: madre/mother/mum/mom || "Mi madre nos hará turrón casero."
    mc: Why might Mauro go home early? || He has to work | *He has a family lunch on the first | He doesn't like parties || "El día uno tengo una comida familiar a las dos."

- slug: playa-o-montana
  kind: listening
  title: ¿Playa o montaña?
  topic: Plans and choices
  summary: Noelia and Hugo compare three options for a long weekend in May and choose the best one, with a plan B in case of bad weather.
  speakers: N=Noelia/f; H=Hugo/m
  text: |
    N: Hugo, ¿ya has mirado sitios para el puente de mayo?
    H: Sí, tengo tres opciones: Cabo de Gata, los Pirineos o Lisboa.
    N: ¿Cuál es la más barata?
    H: Cabo de Gata. Hay un apartamento por sesenta euros la noche, y podemos ir en coche.
    N: ¿Y los Pirineos?
    H: Una casa rural preciosa, pero es la opción más cara: ciento veinte euros la noche.
    N: ¡Carísima! ¿Y Lisboa?
    H: El hotel es barato, pero los vuelos están carísimos en mayo.
    N: Entonces, Cabo de Gata. Tiene las playas más bonitas de Almería.
    H: Sí, pero ¿y si hace mal tiempo?
    N: En mayo, en Almería, casi nunca llueve.
    H: Bueno. Si hace frío para bañarnos, haremos senderismo por el parque natural.
    N: Perfecto. ¿Reservas tú el apartamento?
    H: Vale. Si lo reservo hoy, nos hacen un descuento del diez por ciento.
    N: ¡Pues resérvalo ya! Yo miraré restaurantes.
    H: ¡Hecho! Va a ser el mejor puente del año.
  translation: |
    N: Hugo, have you looked at places for the May long weekend yet?
    H: Yes, I've got three options: Cabo de Gata, the Pyrenees or Lisbon.
    N: Which is the cheapest?
    H: Cabo de Gata. There's an apartment for sixty euros a night, and we can drive there.
    N: And the Pyrenees?
    H: A beautiful country cottage, but it's the most expensive option: a hundred and twenty euros a night.
    N: Really expensive! And Lisbon?
    H: The hotel is cheap, but the flights are really expensive in May.
    N: Then Cabo de Gata. It has the most beautiful beaches in Almería.
    H: Yes, but what if the weather's bad?
    N: In May, in Almería, it hardly ever rains.
    H: OK. If it's too cold to swim, we'll go hiking in the nature reserve.
    N: Perfect. Will you book the apartment?
    H: OK. If I book it today, they'll give us a ten per cent discount.
    N: Well, book it now, then! I'll look at restaurants.
    H: Deal! It's going to be the best long weekend of the year.
  glossary: |
    el puente | long weekend
    la opción | option
    carísimo / carísima | really expensive
    casi nunca | hardly ever
    bañarse | to swim (in the sea or a pool)
    el parque natural | nature reserve
    el descuento | discount
    resérvalo | book it (tú) | imperative + lo
    ¡hecho! | deal!
  questions: |
    mc: Which option is the most expensive? || Cabo de Gata | *The Pyrenees | Lisbon || The country cottage in the Pyrenees costs 120 euros a night: "es la opción más cara".
    tf: The flights to Lisbon are cheap in May. || false || "Los vuelos están carísimos en mayo."
    fill: Si hace frío para bañarse, Noelia y Hugo ___ senderismo. (hacer) || harán || Hacer has an irregular future stem: har- + án.
    short: What discount will they get if Hugo books today? || kw: diez/10/ten || "Nos hacen un descuento del diez por ciento."
    mc: What will Noelia do? || Book the apartment | *Look for restaurants | Hire a car || "Yo miraré restaurantes."
