- slug: mi-companera-de-piso-tiene-78-anos
  kind: reading
  title: Mi compañera de piso tiene 78 años
  topic: People and relationships
  summary: Iván, a student in Madrid, tells how he came to share a flat with Carmen, a retired teacher, through an intergenerational housing programme — and how she became like a grandmother to him.
  free: true
  text: |
    Cuando llegué a Madrid para hacer un máster, no podía pagar los alquileres del centro. Una compañera de clase me habló de un programa de la universidad que ponía en contacto a estudiantes con personas mayores que vivían solas. La idea era sencilla: el estudiante no paga alquiler y, a cambio, le hace compañía a la persona mayor por las tardes y por las noches.

    Así conocí a Carmen, una viuda de setenta y ocho años que había sido profesora de francés durante cuarenta años. El primer día los dos estábamos un poco nerviosos. Ella me enseñó la casa, me explicó sus normas —nada de fiestas y la cena a las nueve— y me preguntó si sabía jugar al dominó. Le dije que no. «Pues vas a aprender», me contestó.

    Al principio pensaba que iba a ser una experiencia un poco aburrida, pero me equivocaba. Carmen es una mujer muy abierta, curiosa y con un sentido del humor increíble. Por las noches cenamos juntos y me cuenta historias de cuando vivía en Lyon, de sus alumnos y de su marido, con quien viajó por medio mundo. Yo le enseño a hacer videollamadas con su nieta, que vive en Toronto, y le explico las series que vemos juntos.

    También hemos tenido algún malentendido. Una noche llegué a las dos de la mañana sin avisar y ella me estaba esperando despierta, muy preocupada. Discutimos un poco, pero al día siguiente le pedí perdón y desde entonces siempre le mando un mensaje si voy a llegar tarde.

    Ya llevo dos años viviendo con ella. Terminé el máster el verano pasado y encontré trabajo en Madrid, pero no me he mudado. Mis amigos no lo entienden, pero para mí Carmen ya no es una compañera de piso: es como una abuela. Y, por cierto, ahora le gano casi siempre al dominó.

    Iván, 27 años
  translation: |
    When I arrived in Madrid to do a master's degree, I couldn't afford the rents in the centre. A classmate told me about a university programme that put students in touch with older people who lived alone. The idea was simple: the student doesn't pay rent and, in exchange, keeps the older person company in the afternoons and evenings.

    That's how I met Carmen, a seventy-eight-year-old widow who had been a French teacher for forty years. On the first day we were both a bit nervous. She showed me the flat, explained her rules — no parties and dinner at nine — and asked me if I knew how to play dominoes. I said no. "Well, you're going to learn," she answered.

    At first I thought it was going to be a rather boring experience, but I was wrong. Carmen is a very open, curious woman with an incredible sense of humour. In the evenings we have dinner together and she tells me stories about when she lived in Lyon, about her students and about her husband, with whom she travelled half the world. I teach her how to make video calls to her granddaughter, who lives in Toronto, and I explain the series we watch together.

    We've also had the odd misunderstanding. One night I came home at two in the morning without letting her know, and she was waiting up for me, very worried. We argued a little, but the next day I apologised, and since then I always send her a message if I'm going to be late.

    I've been living with her for two years now. I finished my master's last summer and found a job in Madrid, but I haven't moved out. My friends don't understand it, but for me Carmen is no longer a flatmate: she's like a grandmother. And, by the way, now I almost always beat her at dominoes.

    Iván, 27
  glossary: |
    poner en contacto | to put in touch
    a cambio | in exchange
    hacer compañía | to keep (someone) company | le hace compañía a la persona mayor
    la viuda / el viudo | widow / widower
    las normas | rules
    equivocarse | to be wrong; to make a mistake | me equivocaba = I was wrong
    sin avisar | without letting someone know
    esperar despierto | to wait up
    ganar (a alguien) | to beat (someone) | le gano al dominó = I beat her at dominoes
  questions: |
    mc: Why did Iván join the university programme? || *He couldn't afford the rents in the centre. | He wanted to learn French. | His family asked him to look after Carmen. || «No podía pagar los alquileres del centro.» In exchange for company, students don't pay rent.
    tf: Carmen used to be a French teacher. || true || «Había sido profesora de francés durante cuarenta años.»
    short: What does Iván teach Carmen to do? || kw: videollamada/videollamadas/video call/video calls || He teaches her to make video calls to her granddaughter in Toronto.
    fill: Iván lleva ___ años viviendo con Carmen. || dos / 2 || «Ya llevo dos años viviendo con ella.»
    mc: What happened the night Iván came home at two in the morning? || Carmen had locked the door. | *Carmen was waiting up, worried, and they argued a little. | Carmen asked him to move out. || «Ella me estaba esperando despierta, muy preocupada. Discutimos un poco.»
    tf: Iván moved out after finishing his master's degree. || false || «Encontré trabajo en Madrid, pero no me he mudado.»

- slug: trabajar-cuatro-dias-a-la-semana
  kind: reading
  title: Trabajar cuatro días a la semana
  topic: Work and careers
  summary: A small design company in Valencia tries a four-day working week with the same pay. The director and two employees explain how they organised it and what has changed.
  text: |
    Hace un año, una pequeña empresa de diseño gráfico de Valencia, con doce trabajadores, decidió hacer un experimento: trabajar de lunes a jueves, con el mismo sueldo y sin hacer más horas cada día. «Al principio teníamos mucho miedo», reconoce su directora, Amparo Llopis. «Pensábamos que perderíamos clientes o que no terminaríamos los proyectos a tiempo. Sin embargo, ocurrió lo contrario.»

    Para conseguirlo, la empresa cambió su forma de organizarse. Las reuniones, que antes duraban una hora, ahora no pueden durar más de veinte minutos. Además, el equipo usa un calendario compartido y por las mañanas hay dos horas «sin interrupciones», en las que nadie contesta correos ni mensajes. «Nos dimos cuenta de que perdíamos muchísimo tiempo», explica Amparo.

    Los resultados, según la empresa, han sido muy positivos. Los empleados están menos estresados, hay menos bajas por enfermedad y la productividad no ha bajado. Marcos, diseñador de treinta y cuatro años, cuenta que ahora dedica los viernes a su hija pequeña y a hacer deporte. «Antes llegaba al fin de semana agotado. Ahora el lunes vuelvo con muchas más ganas.»

    No todo es perfecto, claro. Algunos clientes se quejaban al principio porque no podían llamar los viernes, así que la empresa organizó un turno: cada viernes, una persona del equipo está disponible por teléfono para las urgencias y descansa otro día de la semana. Y Lucía, la responsable de administración, admite que los jueves por la tarde a veces hay demasiada presión para terminarlo todo.

    Por ahora, la empresa no piensa volver atrás. En España se habla cada vez más de este modelo, y algunas empresas y administraciones ya lo están probando. Amparo lo tiene claro: «Si una empresa pequeña como la nuestra puede hacerlo, otras también podrían. Lo importante no es cuántas horas pasas en la oficina, sino lo que haces con ellas.»
  translation: |
    A year ago, a small graphic design company in Valencia with twelve employees decided to try an experiment: working from Monday to Thursday, on the same salary and without working longer hours each day. "At first we were very scared," admits its director, Amparo Llopis. "We thought we would lose clients or that we wouldn't finish projects on time. However, the opposite happened."

    To achieve it, the company changed the way it was organised. Meetings, which used to last an hour, now can't last more than twenty minutes. The team also uses a shared calendar, and every morning there are two hours "without interruptions", during which nobody answers emails or messages. "We realised that we were wasting a huge amount of time," explains Amparo.

    The results, according to the company, have been very positive. The employees are less stressed, there is less sick leave and productivity hasn't fallen. Marcos, a 34-year-old designer, says that he now spends Fridays with his little daughter and doing sport. "I used to reach the weekend exhausted. Now I come back on Monday with much more enthusiasm."

    Not everything is perfect, of course. Some clients complained at first because they couldn't call on Fridays, so the company set up a rota: every Friday, one person from the team is available by phone for emergencies and takes another day of the week off. And Lucía, the head of administration, admits that on Thursday afternoons there is sometimes too much pressure to finish everything.

    For now, the company has no plans to go back. In Spain people talk more and more about this model, and some companies and public administrations are already trying it. Amparo is clear about it: "If a small company like ours can do it, others could too. What matters isn't how many hours you spend in the office, but what you do with them."
  glossary: |
    con el mismo sueldo | on the same salary
    reconocer | to admit
    ocurrió lo contrario | the opposite happened
    la interrupción | interruption
    la baja (por enfermedad) | sick leave | estar de baja = to be on sick leave
    las ganas | enthusiasm; desire | con muchas más ganas
    quejarse | to complain
    el turno | rota; shift
    volver atrás | to go back (to how things were)
  questions: |
    mc: What did the company change to make the four-day week possible? || It hired more designers. | *It shortened meetings and created two hours without interruptions every morning. | It asked clients to call only on Mondays. || Meetings now last no more than twenty minutes, and there are two hours a day without emails or messages.
    tf: The employees work longer hours from Monday to Thursday. || false || They work «sin hacer más horas cada día».
    short: What does Marcos do on Fridays now? || kw: hija/daughter/deporte/sport || «Ahora dedica los viernes a su hija pequeña y a hacer deporte.»
    fill: Las reuniones ahora no pueden durar más de ___ minutos. || veinte / 20 || «Ahora no pueden durar más de veinte minutos.»
    mc: How did the company solve the problem with clients on Fridays? || *One person takes turns being available by phone for emergencies. | The office opens on Friday mornings. | Clients can send emails, but nobody answers them. || «Cada viernes, una persona del equipo está disponible por teléfono para las urgencias.»
    tf: Lucía says that Thursday afternoons can be stressful. || true || «Los jueves por la tarde a veces hay demasiada presión para terminarlo todo.»

- slug: aprendi-euskera-a-los-cuarenta
  kind: reading
  title: Aprendí euskera a los cuarenta
  topic: Education and learning
  summary: Fátima, a nurse from Granada who moved to Vitoria-Gasteiz, explains why she started learning Basque at forty, what helped her and the advice she gives to adult learners.
  text: |
    Me llamo Fátima, nací en Granada y hace seis años me mudé a Vitoria-Gasteiz por trabajo. Soy enfermera, y en el hospital muchos pacientes mayores, sobre todo los que venían de los pueblos, se sentían más cómodos hablando en euskera. Yo no entendía ni una palabra, y eso me hacía sentir muy lejos de ellos.

    Así que, con cuarenta años, me apunté a un euskaltegi, un centro de enseñanza de euskera para adultos. No voy a mentir: los primeros meses fueron durísimos. El euskera no se parece nada al español, ni al inglés, ni al francés que había estudiado en el instituto. La gramática me parecía un rompecabezas y, cuando intentaba hablar, me quedaba en blanco.

    Lo que más me ayudó fue mi profesora, Miren. Desde el primer día nos pidió que no tuviéramos miedo a equivocarnos y que habláramos en euskera fuera de clase, por ejemplo, para pedir un café en el bar. También me apunté a un programa de voluntarios que pone en contacto a personas que quieren practicar con hablantes nativos. Una vez a la semana paseaba con Josune, una jubilada que me corregía con mucha paciencia y me enseñaba palabras de su pueblo.

    Ahora, seis años después, tengo un nivel intermedio. No lo hablo perfectamente, pero puedo mantener una conversación con mis pacientes, y su cara cuando les hablo en su lengua lo dice todo.

    Si alguien me pregunta qué le aconsejo, siempre le digo tres cosas. Primero, que no espere a tener un nivel perfecto para empezar a hablar. Segundo, que busque una razón personal para aprender, porque la motivación es lo más importante. Y tercero, que no se compare con los niños: ellos aprenden de una manera y los adultos, de otra. Lo nuestro es más lento, pero también más consciente.
  translation: |
    My name is Fátima, I was born in Granada and six years ago I moved to Vitoria-Gasteiz for work. I'm a nurse, and at the hospital many older patients, especially those who came from the villages, felt more comfortable speaking Basque. I didn't understand a word, and that made me feel very far away from them.

    So, at forty, I signed up at a euskaltegi, a Basque language school for adults. I'm not going to lie: the first months were really hard. Basque is nothing like Spanish, or English, or the French I had studied at school. The grammar seemed like a puzzle to me and, when I tried to speak, my mind went blank.

    What helped me most was my teacher, Miren. From the first day she asked us not to be afraid of making mistakes and to speak Basque outside class, for example to order a coffee in a bar. I also signed up for a volunteer programme that puts people who want to practise in touch with native speakers. Once a week I went for walks with Josune, a retired woman who corrected me very patiently and taught me words from her village.

    Now, six years later, I have an intermediate level. I don't speak it perfectly, but I can hold a conversation with my patients, and their faces when I speak to them in their language say it all.

    If someone asks me what I advise, I always tell them three things. First, not to wait until their level is perfect to start speaking. Second, to find a personal reason to learn, because motivation is the most important thing. And third, not to compare themselves with children: they learn in one way and adults in another. Our way is slower, but also more conscious.
  glossary: |
    el euskera | Basque (language) | co-official in the Basque Country and in parts of Navarre
    el euskaltegi | Basque language school for adults | a Basque word used in Spanish
    apuntarse a | to sign up for
    parecerse a | to be like; to resemble | no se parece nada al español
    el rompecabezas | puzzle; jigsaw
    quedarse en blanco | to go blank
    el voluntario / la voluntaria | volunteer
    mantener una conversación | to hold a conversation
    consciente | conscious; deliberate
  questions: |
    mc: Why did Fátima decide to learn Basque? || She needed it to get a job as a nurse. | *She wanted to communicate better with older patients. | Her children were learning it at school. || Many older patients «se sentían más cómodos hablando en euskera», and she felt far away from them.
    tf: Fátima found the first months easy. || false || «Los primeros meses fueron durísimos.»
    short: What is a euskaltegi? || kw: adultos/adults/adult || «Un centro de enseñanza de euskera para adultos.»
    fill: Una vez a la semana, Fátima paseaba con ___, una jubilada. || Josune || «Paseaba con Josune, una jubilada que me corregía con mucha paciencia.»
    mc: Which piece of advice does Fátima NOT give? || Don't wait until your level is perfect to start speaking. | Find a personal reason to learn. | *Study all the grammar before you start speaking. || Her three tips: don't wait for a perfect level, find a personal reason and don't compare yourself with children.

- slug: nos-fuimos-al-pueblo
  kind: reading
  title: Nos fuimos al pueblo
  topic: City and environment
  summary: Daniel and Sonia left a small flat in Madrid for a village of 120 people in Teruel. They talk about what they have gained, the drawbacks of rural life and their worries for the village school.
  text: |
    Hace tres años, Daniel y Sonia vivían en un piso de cincuenta metros cuadrados en Madrid. Él trabajaba como programador y ella era traductora; los dos pasaban el día delante del ordenador y casi dos horas al día en el metro. «Teníamos buenos sueldos, pero no teníamos vida», recuerda Sonia.

    Durante la pandemia empezaron a teletrabajar y se dieron cuenta de que ya no necesitaban vivir en la ciudad. Después de buscar durante meses, encontraron una casa antigua en un pueblo de Teruel de ciento veinte habitantes. La compraron por el precio de dos años de alquiler en Madrid y la reformaron poco a poco.

    Hoy tienen una hija de dos años, un huerto y tres gallinas. «Lo que más valoro es el tiempo», explica Daniel. «Antes perdía dos horas en el transporte; ahora, cuando termino de trabajar, salgo a pasear por el monte con mi hija.» Los vecinos, la mayoría personas mayores, los recibieron con los brazos abiertos. «Al principio nos miraban con curiosidad, como si fuéramos de otro planeta», se ríe Sonia, «pero enseguida empezaron a traernos tomates y a invitarnos a las fiestas.»

    Sin embargo, la vida en el pueblo también tiene sus inconvenientes. El médico solo pasa consulta dos días a la semana, la tienda más cercana está a quince kilómetros y en invierno hace muchísimo frío. Además, la conexión a internet no siempre funciona bien. «Un día se fue la luz justo en medio de una reunión importante con un cliente de Londres. Tuve que terminarla desde el bar, que tiene un generador», cuenta Daniel.

    Lo que más les preocupa ahora es la escuela. En el pueblo solo quedan cuatro niños y, si no llegan más familias, la escuela podría cerrar. Por eso Sonia y Daniel animan a otros jóvenes a seguir su ejemplo: «No es el paraíso, pero si nos preguntan si volveríamos a Madrid, la respuesta es no.»
  translation: |
    Three years ago, Daniel and Sonia lived in a fifty-square-metre flat in Madrid. He worked as a programmer and she was a translator; they both spent the day in front of the computer and almost two hours a day on the metro. "We had good salaries, but we didn't have a life," Sonia remembers.

    During the pandemic they started working remotely and realised that they no longer needed to live in the city. After searching for months, they found an old house in a village of a hundred and twenty inhabitants in Teruel. They bought it for the price of two years' rent in Madrid and renovated it little by little.

    Today they have a two-year-old daughter, a vegetable garden and three hens. "What I value most is time," explains Daniel. "Before, I lost two hours on public transport; now, when I finish work, I go for a walk in the hills with my daughter." The neighbours, mostly older people, welcomed them with open arms. "At first they looked at us with curiosity, as if we were from another planet," laughs Sonia, "but they soon started bringing us tomatoes and inviting us to the village festivals."

    However, village life also has its drawbacks. The doctor only sees patients two days a week, the nearest shop is fifteen kilometres away and in winter it's extremely cold. The internet connection doesn't always work well either. "One day there was a power cut right in the middle of an important meeting with a client in London. I had to finish it from the bar, which has a generator," says Daniel.

    What worries them most now is the school. There are only four children left in the village and, if no more families arrive, the school could close. That's why Sonia and Daniel encourage other young people to follow their example: "It's not paradise, but if people ask us whether we would go back to Madrid, the answer is no."
  glossary: |
    teletrabajar | to work remotely
    reformar | to renovate (a building)
    la gallina | hen
    el monte | hills; woodland
    con los brazos abiertos | with open arms
    el inconveniente | drawback; disadvantage
    pasar consulta | to see patients (of a doctor)
    irse la luz | to have a power cut | se fue la luz
    animar a | to encourage (someone) to
  questions: |
    mc: Why did Daniel and Sonia leave Madrid? || They both lost their jobs. | *They realised they could work remotely and wanted a different life. | Their families lived in Teruel. || During the pandemic they started working remotely and realised they no longer needed to live in the city.
    tf: The neighbours were unfriendly at first. || false || They looked at them with curiosity, but soon brought them tomatoes and invited them to the festivals.
    short: What does Daniel value most about village life? || kw: tiempo/time || «Lo que más valoro es el tiempo.»
    fill: En el pueblo solo quedan ___ niños. || cuatro / 4 || «En el pueblo solo quedan cuatro niños.»
    mc: Which of these is NOT mentioned as a drawback of village life? || The doctor only comes two days a week. | The internet connection doesn't always work. | *There is too much traffic noise. || The text mentions the doctor, the distant shop, the cold and the internet — not traffic.

- slug: el-menu-del-dia
  kind: reading
  title: El menú del día, una institución
  topic: Health and lifestyle
  summary: An article about the Spanish menú del día — what it includes, where it comes from, how it varies by region and what nutritionists say about it.
  text: |
    Son las dos y media de la tarde en cualquier ciudad española. Los bares y restaurantes se llenan de trabajadores, estudiantes y jubilados que buscan lo mismo: un menú del día. Por un precio fijo, que suele estar entre los doce y los dieciséis euros, se puede comer un primer plato, un segundo, postre o café, pan y una bebida. Muchas personas lo consideran una de las mejores costumbres del país.

    El menú del día tiene su origen en los años sesenta. Según se cuenta, el Gobierno de la época obligó a los restaurantes a ofrecer un «menú turístico» a un precio económico para los visitantes que empezaban a llegar a España. Con el tiempo, el menú dejó de ser cosa de turistas y se convirtió en la comida diaria de millones de trabajadores.

    Un buen menú refleja la cocina de cada región. En Galicia es fácil encontrar caldo gallego o pulpo; en Castilla, legumbres como las lentejas o los garbanzos; en Andalucía, gazpacho o salmorejo en verano. Normalmente, el primer plato es más ligero —una ensalada, una sopa, unas verduras— y el segundo es de carne o de pescado. Y casi siempre se puede elegir entre tres o cuatro opciones.

    Los nutricionistas destacan que, si se elige bien, el menú del día puede ser una comida muy equilibrada, típica de la dieta mediterránea. El problema, según ellos, es que muchas veces se come demasiado deprisa, en menos de media hora, y con mucho pan, vino y postres dulces. «Lo ideal sería pedir fruta de postre y tomarse el tiempo necesario para comer tranquilos», aconseja la dietista Rosa Martín.

    En los últimos años, con la subida de los precios, algunos bares han subido el menú o han dejado de ofrecerlo. Aun así, sigue siendo una institución. Como dice un camarero de Bilbao: «Aquí la gente no viene solo a comer. Viene a charlar, a desconectar del trabajo y a sentirse como en casa.»
  translation: |
    It's half past two in the afternoon in any Spanish city. Bars and restaurants fill up with workers, students and retired people who are all looking for the same thing: a menú del día. For a fixed price, which is usually between twelve and sixteen euros, you can have a first course, a second course, dessert or coffee, bread and a drink. Many people consider it one of the best customs in the country.

    The menú del día goes back to the sixties. The story goes that the government of the time obliged restaurants to offer a cheap "tourist menu" for the visitors who were starting to arrive in Spain. Over time, the menu stopped being something for tourists and became the daily lunch of millions of workers.

    A good menu reflects the cooking of each region. In Galicia it's easy to find Galician broth or octopus; in Castile, pulses such as lentils or chickpeas; in Andalusia, gazpacho or salmorejo in summer. Normally the first course is lighter — a salad, a soup, some vegetables — and the second course is meat or fish. And you can almost always choose between three or four options.

    Nutritionists point out that, if you choose well, the menú del día can be a very balanced meal, typical of the Mediterranean diet. The problem, according to them, is that people often eat too quickly, in less than half an hour, and with a lot of bread, wine and sweet desserts. "The ideal thing would be to order fruit for dessert and take the time you need to eat calmly," advises the dietitian Rosa Martín.

    In recent years, with rising prices, some bars have put up the price of the menu or stopped offering it. Even so, it's still an institution. As a waiter in Bilbao says: "People don't come here just to eat. They come to chat, to switch off from work and to feel at home."
  glossary: |
    el precio fijo | fixed price
    el primer plato / el segundo plato | first course / main course
    tener su origen en | to originate in; to go back to
    dejar de ser | to stop being
    convertirse en | to become
    las legumbres | pulses (lentils, chickpeas, beans)
    ligero | light (food)
    equilibrado | balanced
    deprisa | quickly; in a hurry
    aun así | even so
  questions: |
    mc: What does a typical menú del día include? || Only a main course and a drink | *A first course, a second course, dessert or coffee, bread and a drink | Three courses but no drink || «Un primer plato, un segundo, postre o café, pan y una bebida.»
    tf: The menú del día was originally created for tourists. || true || In the sixties, restaurants had to offer a cheap «menú turístico» for visitors.
    short: According to nutritionists, what is the main problem with the menú del día? || kw: deprisa/rápido/rapido/quickly/fast/quick/hurry || «Muchas veces se come demasiado deprisa, en menos de media hora.»
    fill: El precio del menú suele estar entre los doce y los ___ euros. || dieciséis / 16 || «Suele estar entre los doce y los dieciséis euros.»
    mc: What does the dietitian recommend? || *Choosing fruit for dessert and eating calmly | Skipping the first course | Drinking only water || «Lo ideal sería pedir fruta de postre y tomarse el tiempo necesario para comer tranquilos.»

- slug: ochocientos-kilometros-a-pie
  kind: reading
  title: Ochocientos kilómetros a pie
  topic: Society and travel
  summary: Hannah, from Hamburg, describes walking the whole Camino de Santiago — the advice she received, life in the pilgrims' hostels, travelling responsibly and the hardest moments.
  text: |
    El año pasado cumplí un sueño que tenía desde hacía mucho tiempo: hice el Camino de Santiago entero, desde Saint-Jean-Pied-de-Port, en Francia, hasta Santiago de Compostela. Fueron casi ochocientos kilómetros a pie en treinta y cinco días.

    Antes de salir, todo el mundo me daba consejos. Mi hermana quería que llevara una mochila pequeña; mi médico me recomendó que comprara buenas botas y que las usara antes del viaje. Tenían razón: los peregrinos que llevaban demasiado peso o calzado nuevo sufrían muchísimo con las ampollas.

    Lo que más me sorprendió fue la gente. Cada noche dormía en un albergue diferente, en habitaciones con veinte o treinta camas, y compartía la cena con personas de todo el mundo: una jubilada coreana, un estudiante de Brasil, una pareja de Sevilla que hacía el Camino por tercera vez… Aunque muchas veces no hablábamos la misma lengua, siempre nos entendíamos.

    También aprendí mucho sobre cómo viajar de forma responsable. En los pueblos pequeños, el Camino es una fuente de vida: hay bares, tiendas y albergues que existen gracias a los peregrinos. Por eso intentaba comprar en las tiendas locales y respetar el descanso de los vecinos, que no siempre están contentos con el ruido de los grupos que pasan a las seis de la mañana. Y, por supuesto, nunca dejaba basura en el camino.

    Hubo días muy duros. En Castilla, la meseta parecía no terminar nunca, y en Galicia llovió durante una semana entera. Más de una vez pensé en abandonar. Pero cuando por fin llegué a la plaza del Obradoiro y vi la catedral, me puse a llorar como una niña.

    Si alguien me preguntara si lo volvería a hacer, le diría que sí, sin dudarlo. Si tuviera tiempo, mañana mismo me pondría las botas otra vez.

    Hannah, 34 años, Hamburgo
  translation: |
    Last year I fulfilled a dream I'd had for a long time: I walked the whole Camino de Santiago, from Saint-Jean-Pied-de-Port, in France, to Santiago de Compostela. It was almost eight hundred kilometres on foot in thirty-five days.

    Before I set off, everyone gave me advice. My sister wanted me to take a small backpack; my doctor recommended that I buy good boots and wear them before the trip. They were right: the pilgrims who carried too much weight or wore new shoes suffered terribly with blisters.

    What surprised me most was the people. Every night I slept in a different hostel, in rooms with twenty or thirty beds, and shared dinner with people from all over the world: a retired Korean woman, a student from Brazil, a couple from Seville who were doing the Camino for the third time… Although we often didn't speak the same language, we always understood each other.

    I also learnt a lot about how to travel responsibly. In small villages, the Camino is a lifeline: there are bars, shops and hostels that exist thanks to the pilgrims. That's why I tried to buy in local shops and respect the residents' rest — they aren't always happy about the noise of the groups that pass by at six in the morning. And, of course, I never left rubbish on the path.

    There were some very hard days. In Castile, the plateau seemed never to end, and in Galicia it rained for a whole week. More than once I thought about giving up. But when I finally reached the Plaza del Obradoiro and saw the cathedral, I started crying like a little girl.

    If someone asked me whether I would do it again, I would say yes, without hesitation. If I had the time, I would put my boots on again tomorrow.

    Hannah, 34, Hamburg
  glossary: |
    cumplir un sueño | to fulfil a dream
    el peregrino / la peregrina | pilgrim
    el calzado | footwear
    la ampolla | blister
    el albergue | (pilgrims') hostel
    una fuente de vida | a lifeline; a source of life
    la meseta | plateau | the high central plain of Spain
    abandonar | to give up; to quit
    ponerse a + infinitive | to start (doing something) | me puse a llorar
    sin dudarlo | without hesitation
  questions: |
    mc: How long did Hannah's Camino take? || Twenty days | *Thirty-five days | Three months || «Casi ochocientos kilómetros a pie en treinta y cinco días.»
    tf: Hannah's doctor advised her to wear her new boots before the trip. || true || «Me recomendó que comprara buenas botas y que las usara antes del viaje.»
    short: Where did Hannah sleep each night? || kw: albergue/albergues/hostel/hostels || «Cada noche dormía en un albergue diferente.»
    fill: En Galicia llovió durante una ___ entera. || semana || «En Galicia llovió durante una semana entera.»
    mc: What did Hannah do to travel responsibly? || She only stayed in hotels. | *She bought in local shops and respected the residents' rest. | She walked only at night. || «Intentaba comprar en las tiendas locales y respetar el descanso de los vecinos.»
    tf: Hannah never thought about giving up. || false || «Más de una vez pensé en abandonar.»

- slug: cuantas-horas-delante-de-la-pantalla
  kind: listening
  title: ¿Cuántas horas pasas delante de la pantalla?
  topic: Media and technology
  summary: On a radio phone-in about screen time, Gonzalo worries about his teenage son, and Inma explains the "no phones" rule her family introduced.
  free: true
  speakers: C=Celia/f; G=Gonzalo/m; I=Inma/f
  text: |
    C: Buenas tardes y bienvenidos a «La tarde en casa». Hoy hablamos del tiempo que pasamos delante de las pantallas. Tenemos la primera llamada. ¿Hola?
    G: Hola, Celia. Me llamo Gonzalo y llamo desde Burgos.
    C: Hola, Gonzalo. Cuéntanos, ¿cuántas horas pasas tú con el móvil?
    G: Pues la verdad es que muchas. El otro día miré el tiempo de pantalla y casi me caigo de la silla: seis horas al día.
    C: ¡Seis horas! ¿Y en qué las pasas?
    G: Sobre todo en redes sociales y viendo vídeos. Pero lo que me preocupa de verdad no soy yo, sino mi hijo.
    C: ¿Cuántos años tiene?
    G: Catorce. Antes de tener móvil, jugaba al baloncesto y quedaba con sus amigos en el parque. Ahora se pasa la tarde encerrado en su habitación.
    C: ¿Y habéis hablado con él?
    G: Sí, muchas veces, pero dice que todos sus amigos hacen lo mismo y que nosotros también estamos todo el día con el móvil. Y en eso tiene razón.
    C: Es un problema muy común. Muchas gracias, Gonzalo. Tenemos otra llamada. Hola, ¿con quién hablo?
    I: Hola, soy Inma, de Huelva. Quería contar lo que hicimos en mi casa, por si a Gonzalo le sirve.
    C: Adelante, Inma.
    I: Hace un año pusimos una norma: durante las comidas y después de las diez de la noche, nadie usa el móvil. Ni los niños ni los adultos.
    C: ¿Y funcionó?
    I: Al principio fue un desastre. Mi hija se enfadaba muchísimo y mi marido siempre tenía una excusa del trabajo. Pero al cabo de un mes, todos nos habíamos acostumbrado.
    C: ¿Y qué ha cambiado desde entonces?
    I: Hablamos mucho más durante la cena y dormimos mejor. Además, los sábados por la mañana hacemos algo juntos sin pantallas: una excursión, un juego de mesa…
    C: Me parece una idea estupenda. ¿Le recomiendas algo más a Gonzalo?
    I: Sí, que dé ejemplo. Si los padres no dejamos el móvil, es imposible pedírselo a los hijos.
    C: Muy buen consejo. Gracias, Inma. Seguimos después de la publicidad.
  translation: |
    C: Good afternoon and welcome to "Afternoon at Home". Today we're talking about the time we spend in front of screens. We have our first call. Hello?
    G: Hello, Celia. My name's Gonzalo and I'm calling from Burgos.
    C: Hello, Gonzalo. Tell us, how many hours do you spend on your phone?
    G: Well, to be honest, a lot. The other day I looked at my screen time and I nearly fell off my chair: six hours a day.
    C: Six hours! And what do you spend them on?
    G: Mainly social media and watching videos. But what really worries me isn't me, it's my son.
    C: How old is he?
    G: Fourteen. Before he had a phone, he played basketball and met his friends in the park. Now he spends the afternoon shut away in his room.
    C: And have you talked to him?
    G: Yes, many times, but he says all his friends do the same and that we're also on our phones all day. And he's right about that.
    C: It's a very common problem. Thank you very much, Gonzalo. We have another call. Hello, who am I speaking to?
    I: Hello, I'm Inma, from Huelva. I wanted to tell you what we did at home, in case it's useful for Gonzalo.
    C: Go ahead, Inma.
    I: A year ago we set a rule: during meals and after ten at night, nobody uses their phone. Not the children, not the adults.
    C: And did it work?
    I: At first it was a disaster. My daughter got really angry and my husband always had an excuse about work. But after a month, we had all got used to it.
    C: And what has changed since then?
    I: We talk much more at dinner and we sleep better. And on Saturday mornings we do something together without screens: a trip, a board game…
    C: That sounds like a great idea. Do you have any other advice for Gonzalo?
    I: Yes, to set an example. If we parents don't put our phones down, it's impossible to ask our children to do it.
    C: Very good advice. Thank you, Inma. We'll be back after the adverts.
  glossary: |
    el tiempo de pantalla | screen time
    casi me caigo de la silla | I nearly fell off my chair
    encerrado | shut away; shut in
    por si le sirve | in case it's useful to him
    poner una norma | to set a rule
    acostumbrarse a | to get used to
    el juego de mesa | board game
    dar ejemplo | to set an example
    la publicidad | adverts; advertising
  questions: |
    mc: How many hours a day does Gonzalo spend on his phone? || Four | *Six | Ten || «Casi me caigo de la silla: seis horas al día.»
    tf: Gonzalo's son still plays basketball every afternoon. || false || He used to play basketball; now he spends the afternoon shut away in his room.
    short: When does nobody use their phone in Inma's house? || kw: comidas/comida/meals/meal/cena/dinner/diez/10/ten/noche/night || «Durante las comidas y después de las diez de la noche.»
    fill: Al cabo de un ___, toda la familia de Inma se había acostumbrado a la norma. || mes || «Al cabo de un mes, todos nos habíamos acostumbrado.»
    mc: What is Inma's main advice for Gonzalo? || *To set an example himself | To take his son's phone away | To sign his son up for basketball again || «Que dé ejemplo. Si los padres no dejamos el móvil, es imposible pedírselo a los hijos.»

- slug: que-vemos-esta-noche
  kind: listening
  title: ¿Qué vemos esta noche?
  topic: Culture and entertainment
  summary: Alba and Jaime can't agree whether to watch an Argentinian film or carry on with a detective series — until they find a compromise.
  speakers: A=Alba/f; J=Jaime/m
  text: |
    A: Jaime, ¿vemos algo esta noche? Me apetece una peli.
    J: Vale. ¿Qué te apetece? ¿Algo de risa o algo más serio?
    A: No sé… Mi compañera me recomendó una película argentina que se estrenó hace poco. Va de dos hermanos que heredan un hotel en la Patagonia.
    J: Uf, suena un poco lenta, ¿no? ¿Quién sale?
    A: No conozco a los actores, pero dice que el guion es buenísimo. Lo que más le gustó fue el humor, que es muy negro.
    J: Bueno, puede estar bien. Aunque yo prefería seguir con la serie de detectives que empezamos la semana pasada.
    A: ¿Cuál? ¿La de la inspectora de Cádiz? Si solo vimos un capítulo y te dormiste a los veinte minutos.
    J: Ya, pero porque estaba agotado. La serie me gustó.
    A: Pues a mí no me convenció mucho. Los diálogos me parecieron muy poco naturales.
    J: Hombre, el primer capítulo siempre es más flojo. Mi hermano dice que a partir del tercero no puedes parar.
    A: Eso dicen de todas las series. ¿Cuántas temporadas tiene?
    J: Cuatro. Y la última se estrenó el mes pasado.
    A: ¿Cuatro temporadas? ¡Pero si no tenemos tiempo ni para ver una película entera!
    J: Ja, ja. Tienes razón. Venga, hagamos una cosa: hoy vemos tu película y el fin de semana le damos otra oportunidad a la serie.
    A: Me parece justo. Pero si a los veinte minutos te duermes, la quito y me voy a leer.
    J: Trato hecho. ¿La ponemos en versión original?
    A: Claro, es en español. Bueno, en español de Argentina. Si no entendemos algo, ponemos subtítulos.
    J: Perfecto. Preparo unas palomitas y empezamos.
    A: ¡Y no mires el móvil durante la peli, que te conozco!
  translation: |
    A: Jaime, shall we watch something tonight? I feel like a film.
    J: OK. What do you feel like? Something funny or something more serious?
    A: I don't know… My colleague recommended an Argentinian film that came out recently. It's about two brothers who inherit a hotel in Patagonia.
    J: Hmm, it sounds a bit slow, doesn't it? Who's in it?
    A: I don't know the actors, but she says the script is brilliant. What she liked most was the humour, which is very dark.
    J: Well, it could be good. Although I'd rather carry on with the detective series we started last week.
    A: Which one? The one with the inspector from Cádiz? But we only watched one episode and you fell asleep after twenty minutes.
    J: Yes, but because I was exhausted. I liked the series.
    A: Well, it didn't really convince me. I thought the dialogue was really unnatural.
    J: Come on, the first episode is always weaker. My brother says that from the third one on you can't stop.
    A: That's what they say about every series. How many seasons does it have?
    J: Four. And the last one came out last month.
    A: Four seasons? But we don't even have time to watch a whole film!
    J: Ha ha. You're right. Come on, let's do this: tonight we watch your film and at the weekend we give the series another chance.
    A: That seems fair. But if you fall asleep after twenty minutes, I'll turn it off and go and read.
    J: It's a deal. Shall we watch it in the original version?
    A: Of course, it's in Spanish. Well, Argentinian Spanish. If we don't understand something, we'll put subtitles on.
    J: Perfect. I'll make some popcorn and we'll start.
    A: And don't look at your phone during the film — I know you!
  glossary: |
    apetecer | to feel like | works like gustar: me apetece una peli
    algo de risa | something funny
    heredar | to inherit
    el humor negro | dark humour
    flojo | weak; not very good
    dar otra oportunidad | to give another chance
    me parece justo | that seems fair
    trato hecho | it's a deal
    las palomitas | popcorn
  questions: |
    mc: What is the Argentinian film about? || *Two brothers who inherit a hotel in Patagonia | A detective from Cádiz | A couple who move to Buenos Aires || «Va de dos hermanos que heredan un hotel en la Patagonia.»
    tf: Alba loved the detective series. || false || «A mí no me convenció mucho. Los diálogos me parecieron muy poco naturales.»
    short: How many seasons does the detective series have? || kw: cuatro/4/four || «Cuatro. Y la última se estrenó el mes pasado.»
    fill: Según el hermano de Jaime, a partir del ___ capítulo no puedes parar. || tercero / tercer / 3 || «A partir del tercero no puedes parar.»
    mc: What do Alba and Jaime decide? || *To watch the film tonight and give the series another chance at the weekend | To watch the whole series this weekend | To go to the cinema instead || «Hoy vemos tu película y el fin de semana le damos otra oportunidad a la serie.»

- slug: antes-de-la-carrera-popular
  kind: listening
  title: Antes de la carrera popular
  topic: Health and lifestyle
  summary: Just before a 10 km fun run, experienced runner Eva helps her friend Nacho with his race number and gives him advice for his first race.
  speakers: E=Eva/f; N=Nacho/m
  text: |
    N: ¡Eva! Por fin te encuentro. Hay muchísima gente. ¿Ya has recogido el dorsal?
    E: Sí, me lo dieron ayer en el polideportivo. ¿Y tú?
    N: Yo lo recogí esta mañana. Mira, aquí lo llevo. ¿Me ayudas a ponérmelo? No sé dónde se pone.
    E: Trae. Se pone delante, en la camiseta, con estos cuatro imperdibles. Ya está.
    N: Gracias. Oye, estoy un poco nervioso. Es mi primera carrera de diez kilómetros.
    E: Es normal. ¿Cuánto tiempo llevas entrenando?
    N: Unos tres meses. Empecé corriendo dos kilómetros y ahora hago ocho sin parar.
    E: ¡Eso está muy bien! Entonces no te preocupes. Lo importante hoy es no salir demasiado rápido.
    N: ¿Qué quieres decir?
    E: Que mucha gente se emociona al principio, corre muy deprisa los primeros kilómetros y luego no puede más. Te recomiendo que empieces despacio y que vayas a tu ritmo.
    N: Vale. ¿Y el agua? ¿Llevo la botella?
    E: No hace falta. Hay puestos de agua en el kilómetro cinco y en la meta. Si tienes sed, bebe un poco ahora, pero no demasiado.
    N: ¿Y tú? ¿Cuántas carreras has hecho ya?
    E: Uf, no sé, unas veinte. El año pasado incluso corrí la media maratón de Valencia.
    N: ¡Qué máquina! ¿Y qué tiempo quieres hacer hoy?
    E: Si todo va bien, me gustaría bajar de cincuenta minutos. Pero hace mucho calor, así que ya veremos.
    N: Yo me conformo con terminar. Si llego a la meta sin andar, me invito a unas cañas.
    E: ¡Pues te invito yo! Y después hay que estirar, ¿eh? Si no, mañana tendrás unas agujetas horribles.
    N: Vale, vale. ¡Mira, ya nos llaman a la salida!
    E: Venga, ¡mucha suerte! Nos vemos en la meta.
  translation: |
    N: Eva! I've found you at last. There are loads of people. Have you picked up your race number yet?
    E: Yes, they gave it to me yesterday at the sports centre. And you?
    N: I picked mine up this morning. Look, I've got it here. Can you help me put it on? I don't know where it goes.
    E: Give it here. It goes on the front, on your T-shirt, with these four safety pins. There you go.
    N: Thanks. Listen, I'm a bit nervous. It's my first ten-kilometre race.
    E: That's normal. How long have you been training?
    N: About three months. I started running two kilometres and now I do eight without stopping.
    E: That's really good! Then don't worry. The important thing today is not to start too fast.
    N: What do you mean?
    E: That lots of people get excited at the beginning, run really fast for the first few kilometres and then can't go on. I recommend you start slowly and go at your own pace.
    N: OK. And water? Shall I take my bottle?
    E: There's no need. There are water stations at kilometre five and at the finish. If you're thirsty, drink a little now, but not too much.
    N: And you? How many races have you done?
    E: Oh, I don't know, about twenty. Last year I even ran the Valencia half marathon.
    N: You machine! And what time do you want to do today?
    E: If everything goes well, I'd like to finish in under fifty minutes. But it's very hot, so we'll see.
    N: I'll settle for finishing. If I get to the finish without walking, I'll treat myself to a few beers.
    E: Then I'll buy them for you! And afterwards you have to stretch, OK? If not, tomorrow you'll be horribly stiff.
    N: OK, OK. Look, they're calling us to the start!
    E: Come on, good luck! See you at the finish.
  glossary: |
    el dorsal | race number; bib
    el imperdible | safety pin
    la carrera popular | fun run; popular race
    a tu ritmo | at your own pace
    no poder más | to be unable to go on
    el puesto de agua | water station
    la meta | finish line
    la media maratón | half marathon
    conformarse con | to settle for; to be happy with
    la caña | small glass of draught beer | Spain
  questions: |
    mc: How long has Nacho been training? || About a month | *About three months | About a year || «Unos tres meses. Empecé corriendo dos kilómetros y ahora hago ocho sin parar.»
    tf: Eva recommends starting the race fast. || false || «Te recomiendo que empieces despacio y que vayas a tu ritmo.»
    short: Where are the water stations? || kw: cinco/5/five/meta/finish || «Hay puestos de agua en el kilómetro cinco y en la meta.»
    fill: Si todo va bien, Eva quiere bajar de ___ minutos. || cincuenta / 50 || «Me gustaría bajar de cincuenta minutos.»
    mc: According to Eva, what will happen if Nacho doesn't stretch after the race? || *He will have very sore muscles the next day. | He won't be allowed to run again. | He will have blisters. || «Si no, mañana tendrás unas agujetas horribles.»

- slug: en-la-oficina-de-turismo
  kind: listening
  title: En la oficina de turismo
  topic: Society and travel
  summary: Kai asks at the tourist office in Cangas de Onís how to visit the Lakes of Covadonga, and the employee explains the bus, the best route and how to visit responsibly.
  speakers: T=Teresa/f; K=Kai/m
  text: |
    K: Buenos días. Quería información para visitar los Lagos de Covadonga mañana.
    T: Buenos días. ¿Piensa ir en coche?
    K: Sí, he alquilado uno en Oviedo. ¿Hay algún problema?
    T: Pues en esta época del año no se puede subir en coche particular hasta los lagos. Es para proteger el parque y evitar atascos. Tiene que dejar el coche aquí, en Cangas de Onís, y coger el autobús.
    K: Ah, no lo sabía. ¿Y cada cuánto sale el autobús?
    T: Cada veinte minutos, desde las ocho y media de la mañana. Le recomiendo que coja uno de los primeros, porque a partir de las once hay muchísima gente.
    K: Perfecto. ¿Y qué ruta me aconseja? Me gusta caminar, pero no soy un experto.
    T: Hay una ruta circular de unos cinco kilómetros que pasa por los dos lagos. Es fácil y las vistas son preciosas, si no hay niebla, claro.
    K: ¿Y qué tiempo va a hacer mañana?
    T: Según la previsión, por la mañana estará despejado, pero por la tarde puede llover. Si yo fuera usted, saldría temprano y llevaría un chubasquero.
    K: Muy bien. ¿Hay algún sitio para comer allí arriba?
    T: Hay un par de restaurantes, pero le aconsejo que lleve agua y algo de comida. Y, por favor, no deje basura en el camino ni dé de comer a los animales.
    K: Por supuesto. Otra pregunta: me gustaría probar el queso de la zona. ¿Dónde puedo comprarlo?
    T: El domingo por la mañana hay mercado aquí en Cangas. Allí venden los productores directamente: queso, miel, sidra… Así el dinero se queda en los pueblos.
    K: ¡Qué bien! Entonces iré el domingo por la mañana.
    T: Muy buena idea. Aquí tiene un mapa de la ruta y el horario del autobús.
    K: Muchísimas gracias. Ha sido muy amable.
    T: De nada. ¡Que disfrute de la visita!
  translation: |
    K: Good morning. I'd like some information about visiting the Lakes of Covadonga tomorrow.
    T: Good morning. Are you planning to go by car?
    K: Yes, I've rented one in Oviedo. Is there a problem?
    T: Well, at this time of year you can't drive up to the lakes in a private car. It's to protect the park and avoid traffic jams. You have to leave your car here, in Cangas de Onís, and take the bus.
    K: Oh, I didn't know that. And how often does the bus leave?
    T: Every twenty minutes, from half past eight in the morning. I recommend you take one of the first ones, because from eleven o'clock on there are lots of people.
    K: Perfect. And which route do you recommend? I like walking, but I'm not an expert.
    T: There's a circular route of about five kilometres that goes past both lakes. It's easy and the views are beautiful — if there's no fog, of course.
    K: And what's the weather going to be like tomorrow?
    T: According to the forecast, it will be clear in the morning, but it may rain in the afternoon. If I were you, I'd set off early and take a raincoat.
    K: Very good. Is there anywhere to eat up there?
    T: There are a couple of restaurants, but I advise you to take water and some food. And please don't leave any rubbish on the path or feed the animals.
    K: Of course. Another question: I'd like to try the local cheese. Where can I buy it?
    T: On Sunday morning there's a market here in Cangas. The producers sell directly there: cheese, honey, cider… That way the money stays in the villages.
    K: Great! Then I'll go on Sunday morning.
    T: Very good idea. Here's a map of the route and the bus timetable.
    K: Thank you very much. You've been very kind.
    T: You're welcome. Enjoy your visit!
  glossary: |
    el coche particular | private car
    evitar | to avoid
    ¿cada cuánto? | how often?
    la ruta circular | circular route; loop
    la previsión (del tiempo) | (weather) forecast
    despejado | clear (sky)
    el chubasquero | (light) raincoat
    dar de comer a | to feed
    el productor / la productora | producer
    la sidra | cider | typical of Asturias
  questions: |
    mc: Why can't Kai drive up to the lakes? || The road is closed for repairs. | *Private cars aren't allowed at this time of year, to protect the park and avoid traffic jams. | His rental car isn't allowed in national parks. || «Es para proteger el parque y evitar atascos.»
    tf: The bus to the lakes leaves every hour. || false || «Cada veinte minutos, desde las ocho y media de la mañana.»
    short: What weather is forecast for the afternoon? || kw: llover/lluvia/llueve/rain || «Por la tarde puede llover.»
    fill: La ruta circular tiene unos ___ kilómetros. || cinco / 5 || «Hay una ruta circular de unos cinco kilómetros.»
    mc: Where can Kai buy local cheese? || *At the Sunday market in Cangas de Onís | At the restaurants by the lakes | At the tourist office || «El domingo por la mañana hay mercado aquí en Cangas.»
