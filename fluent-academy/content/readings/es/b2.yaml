- slug: dos-apellidos-y-una-historia
  kind: reading
  title: Dos apellidos y una historia
  topic: Identity and society
  summary: Marta explains the Spanish system of two surnames, why she and her partner put her rare Basque surname first for their son, and what surnames say about identity.
  free: true
  text: |
    Me llamo Marta Iturbe Sánchez y, como casi todos los españoles, tengo dos apellidos: el primero de mi padre y el primero de mi madre. A mis amigos ingleses les sorprende muchísimo. «¿Y cuál es el de verdad?», me preguntan. La respuesta es que los dos. En España una mujer no pierde sus apellidos al casarse, y los hijos llevan siempre un apellido de cada progenitor.

    Durante siglos, sin embargo, el orden estaba decidido de antemano: primero el del padre y después el de la madre. Desde hace unos años, la ley permite que las familias elijan el orden y, si los padres no se ponen de acuerdo, ya no se impone automáticamente el paterno. Puede parecer un detalle sin importancia, pero no lo es. Como el primer apellido es el que suele transmitirse a la siguiente generación, el orden decide qué apellidos sobreviven y cuáles desaparecen.

    Cuando nació mi hijo, mi pareja y yo tuvimos una larga conversación. Mi apellido, Iturbe, es vasco y bastante poco común; el suyo, García, es el más frecuente de España. «Si ponemos García primero, dentro de dos generaciones nadie se acordará de los Iturbe», le dije medio en broma. Él se rió, pero entendió lo que quería decir. Al final decidimos que nuestro hijo se llamaría Unai Iturbe García. Hay quien piensa que es una cuestión de igualdad; para nosotros fue, sobre todo, una cuestión de memoria.

    Mi abuela, que vivió toda su vida en un caserío cerca de Durango, sonrió cuando se lo contamos. No dijo nada, pero aquel día sacó del armario una caja con fotos y documentos antiguos en los que el apellido Iturbe aparece una y otra vez, escrito a mano, desde el siglo dieciocho. Dudo que mi hijo entienda hoy lo que significa, pero quizás algún día le interese saber de dónde viene.

    En Latinoamérica el sistema es parecido, aunque en algunos países, como Argentina, mucha gente usa un solo apellido en la vida diaria. En España, en cambio, los dos aparecen en todos los documentos oficiales, desde el carné de identidad hasta el título universitario. Por eso, cuando en un formulario extranjero solo hay una casilla para el apellido, muchos españoles no saben qué hacer: ¿los escriben juntos, con un guion, o renuncian a uno de ellos?

    Yo siempre escribo los dos. Al fin y al cabo, son las dos mitades de mi historia.
  translation: |
    My name is Marta Iturbe Sánchez and, like almost all Spaniards, I have two surnames: my father's first surname and my mother's first surname. My English friends find this very surprising. "So which one is the real one?" they ask me. The answer is both. In Spain a woman doesn't lose her surnames when she marries, and children always have one surname from each parent.

    For centuries, however, the order was decided in advance: first the father's and then the mother's. For some years now, the law has allowed families to choose the order and, if the parents don't agree, the father's surname is no longer imposed automatically. It may seem an unimportant detail, but it isn't. Since the first surname is usually the one passed on to the next generation, the order decides which surnames survive and which disappear.

    When my son was born, my partner and I had a long conversation. My surname, Iturbe, is Basque and quite rare; his, García, is the most common in Spain. "If we put García first, in two generations nobody will remember the Iturbes," I told him, half-jokingly. He laughed, but he understood what I meant. In the end we decided that our son would be called Unai Iturbe García. Some people think it's a question of equality; for us it was, above all, a question of memory.

    My grandmother, who lived all her life in a farmhouse near Durango, smiled when we told her. She didn't say anything, but that day she took a box of old photos and documents out of the wardrobe in which the surname Iturbe appears again and again, handwritten, from the eighteenth century onwards. I doubt my son understands today what it means, but perhaps one day he'll be interested in knowing where he comes from.

    In Latin America the system is similar, although in some countries, such as Argentina, many people use only one surname in everyday life. In Spain, on the other hand, both appear on all official documents, from the identity card to the university degree certificate. That's why, when a foreign form has only one box for the surname, many Spaniards don't know what to do: do they write them together, with a hyphen, or give one of them up?

    I always write both. After all, they are the two halves of my story.
  glossary: |
    el apellido | surname
    el progenitor | parent | formal and legal language
    de antemano | in advance; beforehand
    transmitirse | to be passed on
    medio en broma | half-jokingly
    el caserío | traditional Basque farmhouse
    la casilla | box (on a form)
    el guion | hyphen | also "script"
    al fin y al cabo | after all
  questions: |
    mc: Why did Marta and her partner put her surname first? || Because the law requires the mother's surname first | *Because her rare Basque surname might otherwise disappear | Because her partner didn't like his surname || «Si ponemos García primero, dentro de dos generaciones nadie se acordará de los Iturbe.»
    tf: In Spain, women traditionally lose their surnames when they marry. || false || «En España una mujer no pierde sus apellidos al casarse.»
    short: What did Marta's grandmother take out of the wardrobe? || kw: caja/box/fotos/photos/documentos/documents || A box of old photos and documents in which the surname Iturbe appears.
    fill: Si los padres no se ponen de acuerdo, ya no ___ impone automáticamente el apellido paterno. || se || Impersonal / passive se: se impone = it is imposed.
    mc: What problem do many Spaniards have with foreign forms? || *There is only one box for the surname. | They have to write their mother's maiden name. | The forms ask for three surnames. || «Cuando en un formulario extranjero solo hay una casilla para el apellido…»

- slug: aqui-no-se-tira-nada
  kind: reading
  title: Aquí no se tira nada
  topic: Work and the economy
  summary: A report on a monthly repair café in a Valencia neighbourhood, where volunteers teach residents to fix their own appliances, clothes and bikes — and why it has become about much more than repairs.
  text: |
    El primer sábado de cada mes, el local de la asociación de vecinos de un barrio de Valencia se llena de objetos rotos: tostadoras que no tuestan, lámparas que no se encienden, pantalones sin botones, bicicletas con los frenos gastados. Es el café de reparación del barrio, una iniciativa que empezó hace cuatro años con tres voluntarios y una caja de herramientas, y que hoy reúne a más de cincuenta personas cada mes.

    La idea es sencilla: nadie repara nada por ti, sino contigo. «Si te lo arreglo yo, la próxima vez vuelves a traerlo. Si aprendes a hacerlo, ya no me necesitas», explica Vicente, un electricista jubilado de setenta y un años que coordina la mesa de aparatos eléctricos. A su lado, una estudiante de Ingeniería ayuda a un vecino a abrir un secador de pelo. Al cabo de diez minutos descubren el problema: un cable suelto. El arreglo ha costado cero euros.

    Los organizadores aseguran que, en el último año, se han reparado más de seiscientos objetos que, de otro modo, habrían acabado en la basura. Pero el objetivo no es solo ahorrar dinero. «Vivimos en una sociedad en la que es más barato comprar algo nuevo que arreglarlo, y eso tiene un coste enorme para el planeta», afirma Amparo, una de las fundadoras. Según ella, muchos aparatos están diseñados para durar poco, lo cual obliga a los consumidores a sustituirlos cada pocos años.

    No todo tiene arreglo, claro. Algunos fabricantes no venden piezas de repuesto, o usan tornillos especiales que impiden abrir el aparato. «Eso nos indigna», reconoce Vicente. «Hace cuarenta años, una lavadora te duraba veinte años. Ahora, con suerte, diez.» En los últimos años la Unión Europea ha aprobado normas que obligan a los fabricantes de algunos electrodomésticos a ofrecer piezas durante más tiempo, aunque los voluntarios creen que todavía queda mucho por hacer.

    Más allá de los arreglos, el café se ha convertido en un punto de encuentro. Hay quien viene sin nada roto, solo por la conversación y por el bizcocho que trae cada mes una vecina. Algunos jóvenes han aprendido a coser gracias a las señoras de la mesa de costura, y varias personas mayores han perdido el miedo a los ordenadores gracias a los estudiantes.

    «Al principio pensábamos que esto iba de aparatos», resume Amparo. «Ahora sabemos que va de personas.»
  translation: |
    On the first Saturday of every month, the premises of a residents' association in a Valencia neighbourhood fill up with broken objects: toasters that don't toast, lamps that won't switch on, trousers without buttons, bikes with worn-out brakes. It's the neighbourhood repair café, an initiative that started four years ago with three volunteers and a toolbox, and that now brings together more than fifty people every month.

    The idea is simple: nobody repairs anything for you, but with you. "If I fix it for you, next time you'll bring it back again. If you learn how to do it, you won't need me any more," explains Vicente, a seventy-one-year-old retired electrician who coordinates the electrical appliances table. Next to him, an engineering student is helping a neighbour open a hairdryer. Ten minutes later they discover the problem: a loose cable. The repair has cost nothing.

    The organisers say that in the last year more than six hundred objects have been repaired that would otherwise have ended up in the rubbish. But the aim isn't just to save money. "We live in a society where it's cheaper to buy something new than to fix it, and that has an enormous cost for the planet," says Amparo, one of the founders. According to her, many appliances are designed not to last long, which forces consumers to replace them every few years.

    Not everything can be fixed, of course. Some manufacturers don't sell spare parts, or they use special screws that make it impossible to open the appliance. "That makes us furious," admits Vicente. "Forty years ago, a washing machine lasted you twenty years. Now, with luck, ten." In recent years the European Union has passed rules that require manufacturers of some household appliances to offer spare parts for longer, although the volunteers think there is still a lot to do.

    Beyond the repairs, the café has become a meeting place. Some people come with nothing broken, just for the conversation and the sponge cake a neighbour brings every month. Some young people have learned to sew thanks to the ladies at the sewing table, and several older people have lost their fear of computers thanks to the students.

    "At first we thought this was about appliances," Amparo sums up. "Now we know it's about people."
  glossary: |
    el café de reparación | repair café
    la tostadora | toaster
    los frenos | brakes
    suelto | loose
    la pieza de repuesto | spare part
    el tornillo | screw
    el electrodoméstico | household appliance
    ir de | to be about | colloquial: esto va de personas
    el bizcocho | sponge cake
  questions: |
    mc: What is the main rule of the repair café? || Volunteers repair objects for free while you wait. | *People repair their objects together with the volunteers. | Only electrical appliances are accepted. || «Nadie repara nada por ti, sino contigo.»
    tf: The hairdryer had a loose cable. || true || «Al cabo de diez minutos descubren el problema: un cable suelto.»
    short: How many objects have been repaired in the last year? || kw: seiscientos/600/six hundred || More than six hundred.
    fill: Según Amparo, muchos aparatos están diseñados para durar poco, ___ obliga a los consumidores a sustituirlos. || lo cual / lo que || The pronoun refers to the whole previous idea, so it is neuter: lo cual or lo que.
    mc: According to Amparo, what is the café really about? || Appliances | Saving money | *People || «Ahora sabemos que va de personas.»

- slug: ciencia-desde-el-balcon
  kind: reading
  title: Ciencia desde el balcón
  topic: Science and technology
  summary: Thousands of volunteers across Spain count birds, measure light pollution and photograph mosquitoes with their phones. How citizen science works, what it has achieved and what its limits are.
  text: |
    Cada primavera, miles de personas en toda España salen al balcón, al parque o al campo con una libreta o una aplicación en el móvil y se ponen a contar pájaros. No son ornitólogos profesionales: son profesores, jubilados, estudiantes o familias con niños. Todos forman parte de lo que se conoce como ciencia ciudadana, una forma de investigación en la que los datos son recogidos por voluntarios y analizados después por científicos.

    La idea no es nueva. Durante más de un siglo, los aficionados a las aves han anotado lo que veían. Lo que ha cambiado es la tecnología. Hoy, gracias a los teléfonos inteligentes, una observación puede ser registrada con foto, fecha y ubicación exacta en cuestión de segundos. Así se han creado enormes bases de datos que ningún equipo de investigación podría reunir por sí solo.

    Los resultados son sorprendentes. Gracias a estas observaciones se ha comprobado, por ejemplo, que algunas aves migratorias llegan a la península cada vez antes, probablemente debido al aumento de las temperaturas. En otros proyectos, los voluntarios miden con el móvil el brillo del cielo nocturno, lo cual ha permitido elaborar mapas de contaminación lumínica de muchas ciudades. Y en algunos programas de salud pública, los ciudadanos fotografían mosquitos para ayudar a detectar a tiempo la llegada de especies invasoras.

    Ahora bien, la ciencia ciudadana también tiene límites. Los datos recogidos por aficionados pueden contener errores: un pájaro mal identificado, una foto borrosa, una ubicación equivocada. Por eso cada observación es revisada por expertos o comparada automáticamente con otras antes de ser utilizada. Además, los voluntarios tienden a concentrarse en las zonas donde viven, de modo que algunas regiones rurales quedan poco estudiadas.

    Aun así, los investigadores coinciden en que el balance es muy positivo. «Si hubiéramos tenido que pagar a un técnico por cada una de estas observaciones, el proyecto habría sido imposible», reconoce una bióloga que coordina un programa de seguimiento de mariposas. Y hay un beneficio que no aparece en las estadísticas: quien participa aprende a mirar. «Mis hijos ya no ven pájaros», cuenta un padre de Albacete. «Ven gorriones, vencejos, golondrinas… y quieren saber por qué cada año hay menos.»

    Quizás ese sea el mayor éxito de la ciencia ciudadana: convertir a los vecinos en cómplices del conocimiento.
  translation: |
    Every spring, thousands of people all over Spain go out onto their balconies, into the park or into the countryside with a notebook or an app on their phone and start counting birds. They aren't professional ornithologists: they are teachers, retired people, students or families with children. They are all part of what is known as citizen science, a form of research in which data are collected by volunteers and then analysed by scientists.

    The idea isn't new. For more than a century, bird enthusiasts have noted down what they saw. What has changed is the technology. Today, thanks to smartphones, an observation can be recorded with a photo, the date and the exact location in a matter of seconds. In this way, enormous databases have been created that no research team could gather on its own.

    The results are surprising. Thanks to these observations it has been shown, for example, that some migratory birds are arriving on the peninsula earlier and earlier, probably due to rising temperatures. In other projects, volunteers use their phones to measure the brightness of the night sky, which has made it possible to draw up light-pollution maps of many cities. And in some public health programmes, citizens photograph mosquitoes to help detect the arrival of invasive species in time.

    Having said that, citizen science also has its limits. Data collected by amateurs may contain errors: a wrongly identified bird, a blurred photo, an incorrect location. That's why each observation is reviewed by experts or automatically compared with others before being used. Besides, volunteers tend to concentrate on the areas where they live, so some rural regions remain under-studied.

    Even so, researchers agree that the overall result is very positive. "If we had had to pay a technician for each of these observations, the project would have been impossible," admits a biologist who coordinates a butterfly-monitoring programme. And there is a benefit that doesn't appear in the statistics: those who take part learn to look. "My children don't see birds any more," says a father from Albacete. "They see sparrows, swifts, swallows… and they want to know why there are fewer every year."

    Perhaps that is the greatest success of citizen science: turning ordinary people into partners in knowledge.
  glossary: |
    la libreta | notebook
    el aficionado | enthusiast; amateur
    la ubicación | location
    la contaminación lumínica | light pollution
    borroso | blurred
    el balance | overall result; assessment | not "balance" in the sense of equilibrium
    el gorrión | sparrow
    el vencejo | swift (bird)
    la golondrina | swallow (bird)
    el cómplice | accomplice; partner | here used positively
  questions: |
    mc: Who collects the data in citizen science? || Professional ornithologists | *Volunteers, whose data scientists then analyse | Only university students || «Los datos son recogidos por voluntarios y analizados después por científicos.»
    tf: Some migratory birds are arriving later every year. || false || They are arriving earlier: «llegan a la península cada vez antes».
    short: Why is each observation reviewed before it is used? || kw: errores/error/errors/mistakes/mal/wrong/borrosa/blurred || Because amateurs' data may contain mistakes.
    fill: Cada observación ___ revisada por expertos antes de ser utilizada. || es || Passive with ser in the present: es revisada.
    mc: What benefit does the father from Albacete mention? || His children earn money from the project. | *His children have learned to look at birds and name them. | His children want to become biologists. || «Ven gorriones, vencejos, golondrinas… y quieren saber por qué cada año hay menos.»

- slug: rebanos-contra-el-fuego
  kind: reading
  title: Rebaños contra el fuego
  topic: Environment
  summary: In southern Spain, shepherds are paid to graze firebreaks. A report on how goats and sheep help prevent forest fires — and why the future of the forests depends on the future of the villages.
  text: |
    Son las ocho de la mañana y Manuel ya lleva dos horas en el monte con sus seiscientas cabras. No es un pastor cualquiera: forma parte de un programa que, desde hace unos veinte años, paga a ganaderos de Andalucía para que sus animales pasten en los cortafuegos, las franjas de terreno sin árboles que sirven para frenar el avance de un incendio. «Mis cabras hacen el trabajo de una desbrozadora, pero sin gasolina y sin ruido», bromea.

    La idea responde a un problema que preocupa cada vez más a los expertos. Durante siglos, el monte mediterráneo estuvo lleno de gente: pastores, leñadores, carboneros, agricultores. Todos ellos, sin saberlo, mantenían limpio el bosque. Con el éxodo rural de la segunda mitad del siglo veinte, muchos pueblos se vaciaron y la vegetación creció sin control. Como consecuencia, hoy hay mucho más material que puede arder. Si a eso le sumamos veranos más largos y más calurosos debido al cambio climático, el resultado son incendios más grandes y más difíciles de apagar.

    «El fuego se apaga en invierno», repiten los técnicos forestales. Quieren decir que la clave no está solo en tener más aviones y más bomberos en agosto, sino en cuidar el territorio durante todo el año. Y ahí el pastoreo tiene una ventaja enorme: es barato, es constante y, además, mantiene vivo un oficio que estaba desapareciendo.

    Los resultados son prometedores. Según los responsables del programa, las zonas donde pastan los rebaños acumulan mucha menos vegetación seca, de modo que, si se produce un incendio, los bomberos tienen más posibilidades de controlarlo. Otras comunidades autónomas y otros países mediterráneos han empezado a copiar la iniciativa.

    Sin embargo, no todo es tan sencillo. Ser pastor es un trabajo duro, solitario y mal pagado, de ahí que cada vez haya menos jóvenes dispuestos a dedicarse a ello. Manuel tiene cincuenta y ocho años y no sabe quién se hará cargo de las cabras cuando se jubile. «Mi hijo es informático en Málaga. Lo entiendo, ¿eh? Yo, a su edad, también me habría ido si hubiera podido.»

    Para muchos expertos, el futuro de los bosques depende, en buena parte, del futuro de los pueblos. Por mucho que mejoren los medios de extinción, sin gente que viva y trabaje en el monte será muy difícil protegerlo. Y eso, más que una cuestión ambiental, es una cuestión social.
  translation: |
    It's eight in the morning and Manuel has already been out on the hills for two hours with his six hundred goats. He isn't just any shepherd: he is part of a programme that, for about twenty years, has paid livestock farmers in Andalusia to let their animals graze the firebreaks, the strips of land without trees that serve to stop a fire from spreading. "My goats do the work of a brush cutter, but without petrol and without noise," he jokes.

    The idea responds to a problem that worries experts more and more. For centuries, the Mediterranean hills were full of people: shepherds, woodcutters, charcoal burners, farmers. All of them, without knowing it, kept the woodland clean. With the rural exodus of the second half of the twentieth century, many villages emptied and the vegetation grew out of control. As a result, there is now much more material that can burn. If we add longer, hotter summers due to climate change, the result is bigger fires that are harder to put out.

    "Fires are put out in winter," forestry experts keep saying. They mean that the key lies not only in having more planes and more firefighters in August, but in looking after the land all year round. And here grazing has a huge advantage: it's cheap, it's constant and, what's more, it keeps alive a trade that was disappearing.

    The results are promising. According to those in charge of the programme, the areas where the flocks graze accumulate much less dry vegetation, so that, if a fire breaks out, firefighters have a better chance of controlling it. Other autonomous communities and other Mediterranean countries have started to copy the initiative.

    However, it isn't all so simple. Being a shepherd is hard, lonely and badly paid work, which is why fewer and fewer young people are willing to do it. Manuel is fifty-eight and doesn't know who will take over the goats when he retires. "My son works in IT in Málaga. I understand, you know? At his age, I would have left too if I could have."

    For many experts, the future of the forests depends to a large extent on the future of the villages. However much firefighting resources improve, without people living and working on the land it will be very difficult to protect it. And that, more than an environmental question, is a social one.
  glossary: |
    el rebaño | flock; herd
    el monte | woodland; uncultivated hills
    pastar | to graze
    el cortafuegos | firebreak | the plural is the same: los cortafuegos
    la desbrozadora | brush cutter
    el leñador | woodcutter
    el éxodo rural | rural exodus
    arder | to burn
    el pastoreo | herding; grazing
    los medios de extinción | firefighting resources
  questions: |
    mc: What do Manuel's goats do? || They produce milk for the programme. | *They graze the firebreaks and reduce the vegetation. | They help the firefighters in summer. || The programme pays farmers «para que sus animales pasten en los cortafuegos».
    tf: According to the text, the depopulation of villages has increased the amount of vegetation that can burn. || true || «Muchos pueblos se vaciaron y la vegetación creció sin control.»
    short: What do the forestry experts mean by «El fuego se apaga en invierno»? || kw: todo el año/all year/all year round/prevenir/prevention/prevent/cuidar/look after/invierno/winter || That fires are prevented by looking after the land all year, not only by fighting them in summer.
    fill: Ser pastor es un trabajo duro y mal pagado, de ahí que cada vez ___ (haber) menos jóvenes pastores. || haya || De ahí que is always followed by the subjunctive.
    mc: Who will take over Manuel's goats when he retires? || His son | A young neighbour | *He doesn't know || «No sabe quién se hará cargo de las cabras cuando se jubile.»

- slug: el-pueblo-de-los-murales
  kind: reading
  title: El pueblo de los murales
  topic: Arts and culture
  summary: How a village of two hundred people in Zamora turned its walls into an open-air museum, thanks to an illustrator whose family had emigrated — and the debate it has opened among the residents.
  text: |
    Hace diez años, en Villarejo de la Sierra, un pueblo de doscientos habitantes en la provincia de Zamora, solo quedaba un bar, y estaba a punto de cerrar. Hoy, los fines de semana, sus calles se llenan de visitantes que pasean con el móvil en la mano, fotografiando fachadas. El motivo: más de sesenta murales pintados por artistas de todo el mundo en las paredes de casas, corrales y hasta en el antiguo depósito de agua.

    Todo empezó por casualidad. Lucía Prieto, una ilustradora cuya familia había emigrado del pueblo a Bilbao en los años sesenta, volvió un verano para arreglar la casa de sus abuelos. «La fachada estaba hecha un desastre, así que le pregunté a mi tía si podía pintar algo», recuerda. Pintó a una mujer mayor tejiendo, inspirada en su abuela. Al verlo, un vecino le pidió que pintara también su pared. Al año siguiente vinieron cinco artistas amigos suyos y, al otro, veinte.

    Hoy el festival se celebra cada mes de septiembre. Los artistas no cobran: el pueblo les ofrece alojamiento en casas particulares y comida en la plaza, lo cual ha creado una relación muy especial entre pintores y vecinos. Cada mural se pinta con el permiso del propietario, que a menudo propone el tema. Así, en una pared aparece un rebaño de ovejas que recuerda a los antiguos pastores; en otra, el retrato de la maestra que dio clase en el pueblo durante cuarenta años.

    El éxito, sin embargo, ha abierto un debate. Algunos vecinos están encantados: el bar ya no cierra, se ha abierto una casa rural y dos familias jóvenes se han mudado al pueblo. Otros se quejan de que ciertos días hay demasiados coches y de que algunos visitantes se asoman a las ventanas sin pedir permiso. «No es que estemos en contra del arte, sino que queremos seguir viviendo tranquilos», explica Teodoro, de ochenta y dos años.

    También hay quien se pregunta qué pasará con los murales cuando el sol y la lluvia los vayan borrando. ¿Deben restaurarse o hay que dejar que desaparezcan, como cualquier obra efímera? Lucía lo tiene claro: «El arte urbano está vivo; envejece con las paredes, igual que nosotros».

    De momento, en Villarejo nadie quiere volver atrás. Como dice la dueña del bar: «Antes la gente pasaba por aquí sin parar. Ahora, por lo menos, nos miran».
  translation: |
    Ten years ago, in Villarejo de la Sierra, a village of two hundred inhabitants in the province of Zamora, there was only one bar left, and it was about to close. Today, at weekends, its streets fill up with visitors who stroll around phone in hand, photographing façades. The reason: more than sixty murals painted by artists from all over the world on the walls of houses, farmyards and even the old water tower.

    It all started by chance. Lucía Prieto, an illustrator whose family had emigrated from the village to Bilbao in the sixties, came back one summer to do up her grandparents' house. "The façade was a real mess, so I asked my aunt if I could paint something," she remembers. She painted an elderly woman knitting, inspired by her grandmother. When he saw it, a neighbour asked her to paint his wall too. The following year five artist friends of hers came, and the year after that, twenty.

    Today the festival is held every September. The artists aren't paid: the village offers them accommodation in private houses and meals in the square, which has created a very special relationship between painters and residents. Each mural is painted with the owner's permission, and the owner often suggests the subject. So on one wall there is a flock of sheep that recalls the shepherds of the past; on another, the portrait of the teacher who taught in the village for forty years.

    Success, however, has opened a debate. Some residents are delighted: the bar no longer closes, a rural guesthouse has opened and two young families have moved to the village. Others complain that on some days there are too many cars and that some visitors peer through the windows without asking permission. "It's not that we're against art, it's that we want to carry on living in peace," explains Teodoro, who is eighty-two.

    Some people also wonder what will happen to the murals as the sun and the rain gradually wear them away. Should they be restored, or should they be allowed to disappear, like any ephemeral work? Lucía is clear about it: "Street art is alive; it grows old with the walls, just like us."

    For now, nobody in Villarejo wants to go back. As the owner of the bar says: "People used to drive through here without stopping. Now, at least, they look at us."
  glossary: |
    la fachada | façade; front of a building
    el corral | farmyard; pen
    el depósito de agua | water tower
    estar hecho un desastre | to be a mess
    tejer | to knit
    la casa rural | rural guesthouse
    asomarse a | to peer into; to lean out of
    efímero | ephemeral; short-lived
    borrar | to erase; to wear away
  questions: |
    mc: How did the project start? || The town council organised a festival. | *An illustrator painted a mural on her grandparents' house. | A group of artists bought houses in the village. || Lucía painted the façade of her grandparents' house, and then a neighbour asked her to paint his wall.
    tf: The village pays the artists to paint the murals. || false || «Los artistas no cobran»: they get accommodation and meals.
    short: What does Teodoro want? || kw: tranquilos/tranquilo/tranquilidad/peace/quiet/calm || To carry on living in peace: «queremos seguir viviendo tranquilos».
    fill: Lucía Prieto es una ilustradora ___ familia había emigrado a Bilbao. || cuya || Cuya agrees with familia (feminine singular).
    mc: What does Lucía think should happen to the murals as they fade? || *They can grow old with the walls, like people. | They must be restored every year. | They should be replaced by new ones. || «El arte urbano está vivo; envejece con las paredes, igual que nosotros.»

- slug: tu-decides-en-que-se-gasta
  kind: reading
  title: Tú decides en qué se gasta
  topic: Citizenship and public life
  summary: A town council lets its residents decide how to spend part of the budget. A local news report explains how participatory budgets work, what they have achieved and why some residents are not satisfied.
  text: |
    Un parque infantil cubierto para los días de lluvia, más bancos en el paseo del río, un rocódromo para los adolescentes y un servicio de acompañamiento para personas mayores que viven solas. Son algunos de los proyectos que se han hecho realidad en los últimos años en nuestra ciudad, y tienen algo en común: no los decidió el ayuntamiento, sino los propios vecinos.

    Desde hace seis años, una parte del presupuesto municipal —este año, casi dos millones de euros— se reparte mediante los llamados presupuestos participativos. El proceso tiene varias fases. Primero, cualquier persona empadronada mayor de dieciséis años puede presentar propuestas, ya sea por internet o en los centros cívicos. Después, los técnicos municipales comprueban que cada propuesta sea viable y que su coste no supere el límite establecido. Finalmente, los vecinos votan las que prefieren, y las más votadas se incluyen en el presupuesto del año siguiente.

    Quienes defienden el sistema aseguran que acerca la administración a la ciudadanía. «Nadie conoce mejor un barrio que la gente que vive en él», afirma la concejala responsable del programa. Además, según el ayuntamiento, la participación ha crecido cada año, especialmente entre los jóvenes, que este año han presentado más de un tercio de las propuestas.

    Sin embargo, no todo el mundo está satisfecho. Algunas asociaciones vecinales se quejan de que los barrios con más recursos y más tiempo libre consiguen más votos, mientras que los barrios más humildes, que quizá necesitarían más inversión, participan menos. Otros critican los plazos. «Votamos un proyecto hace dos años y todavía no se ha empezado la obra», lamenta Rosario, presidenta de una asociación de vecinos del barrio norte. «Me parece bien que nos pregunten, pero lo importante es que luego se cumpla.»

    Los expertos en participación ciudadana coinciden en que los presupuestos participativos no sustituyen a la gestión municipal, pero pueden complementarla. Para que funcionen, señalan, hacen falta tres condiciones: información clara, plazos realistas y un esfuerzo especial por llegar a quienes normalmente no participan.

    El plazo para presentar propuestas de este año termina el treinta de noviembre. Si usted tiene una idea para mejorar su barrio, quizás sea el momento de presentarla. Como dice Rosario, con una mezcla de ironía y esperanza: «Si no participas, luego no te quejes».
  translation: |
    A covered playground for rainy days, more benches along the riverside walk, a climbing wall for teenagers and a companionship service for older people who live alone. These are some of the projects that have become reality in our city in recent years, and they have something in common: they weren't decided by the council, but by the residents themselves.

    For six years now, part of the municipal budget — this year, almost two million euros — has been shared out through what are known as participatory budgets. The process has several stages. First, anyone registered as a resident and over sixteen can submit proposals, either online or at the community centres. Then the council's technical staff check that each proposal is feasible and that its cost does not exceed the set limit. Finally, residents vote for the ones they prefer, and those with the most votes are included in the following year's budget.

    Supporters of the system say it brings the administration closer to citizens. "Nobody knows a neighbourhood better than the people who live in it," says the councillor in charge of the programme. Moreover, according to the council, participation has grown every year, especially among young people, who this year submitted more than a third of the proposals.

    However, not everyone is satisfied. Some residents' associations complain that neighbourhoods with more resources and more free time get more votes, while poorer neighbourhoods, which might need more investment, take part less. Others criticise the timescales. "We voted for a project two years ago and the work still hasn't started," complains Rosario, chair of a residents' association in the northern district. "I think it's good that they ask us, but what matters is that it's actually carried out afterwards."

    Experts in citizen participation agree that participatory budgets don't replace the council's management, but they can complement it. For them to work, they point out, three conditions are needed: clear information, realistic deadlines and a special effort to reach those who don't normally take part.

    The deadline for submitting this year's proposals is the thirtieth of November. If you have an idea to improve your neighbourhood, perhaps now is the time to put it forward. As Rosario says, with a mixture of irony and hope: "If you don't take part, don't complain later."
  glossary: |
    el presupuesto participativo | participatory budget
    el rocódromo | climbing wall
    repartir | to share out; to distribute
    viable | feasible; viable
    el centro cívico | community centre
    la concejala | (female) councillor | masculine: el concejal
    humilde | modest; low-income
    la obra | building work
    complementar | to complement
  questions: |
    mc: Who can submit proposals? || Only members of residents' associations | *Any registered resident over sixteen | Only the council's technical staff || «Cualquier persona empadronada mayor de dieciséis años puede presentar propuestas.»
    tf: Young people submitted more than a third of this year's proposals. || true || «Este año han presentado más de un tercio de las propuestas.»
    short: What is Rosario's complaint? || kw: obra/work/works/empezado/started/start/plazos/delay/delays/años/years || The project they voted for two years ago still hasn't been started.
    fill: Me parece bien que nos ___ (preguntar, ellos), pero lo importante es que luego se cumpla. || pregunten || Me parece bien que evaluates something, so it takes the subjunctive.
    mc: According to the experts, which of these is a condition for participatory budgets to work? || More money each year | *Realistic deadlines | Fewer proposals || The three conditions are clear information, realistic deadlines and reaching people who don't usually take part.

- slug: de-donde-sacas-las-noticias
  kind: listening
  title: ¿De dónde sacas las noticias?
  topic: Media and persuasion
  summary: On a radio programme, a secondary-school teacher and a sixteen-year-old student talk about how teenagers get their news, a hoax that went viral at their school and the habits that help to spot misinformation.
  speakers: R=Raquel/f; A=Álvaro/m; I=Irene/f
  text: |
    R: Buenas tardes. Hoy hablamos de cómo se informan los adolescentes. Nos acompañan Álvaro Gil, profesor de Lengua en un instituto de Zaragoza, e Irene, una de sus alumnas, de dieciséis años. Bienvenidos.
    A: Gracias por invitarnos.
    I: Hola, buenas tardes.
    R: Irene, empiezo por ti. ¿Dónde lees las noticias?
    I: Pues la verdad es que casi nunca las leo. Las veo. Me entero de casi todo por vídeos cortos en el móvil.
    R: ¿Y te fías de lo que ves?
    I: Antes sí, bastante. Pero el año pasado me pasó algo que me hizo cambiar. Vi un vídeo que decía que iban a cerrar todos los institutos de la ciudad una semana por una plaga de chinches. Se lo mandé a todo mi grupo de clase.
    R: ¿Y era falso?
    I: Totalmente. Al día siguiente, el profesor Gil nos explicó en clase que el vídeo era de otra ciudad y de hacía tres años. Me dio muchísima vergüenza.
    A: Bueno, no fue culpa suya. Ese vídeo lo compartieron también cientos de adultos. Lo que hicimos fue aprovecharlo: dedicamos dos semanas a analizar cómo se había difundido.
    R: ¿Y qué descubrieron?
    A: Que casi nadie había comprobado la fecha ni la fuente. Y que el vídeo tenía todo lo necesario para hacerse viral: música dramática, un titular alarmante y la frase «compártelo antes de que lo borren».
    R: Álvaro, ¿cree que los jóvenes se informan peor que sus padres?
    A: No necesariamente. Es verdad que leen menos periódicos, pero también es cierto que muchos adultos se creen cualquier cosa que les llega por mensajería. El problema no es la edad, sino la falta de hábitos para verificar.
    R: ¿Y qué hábitos enseñan en clase?
    A: Tres preguntas muy sencillas: ¿quién lo dice?, ¿cuándo lo dijo? y ¿quién más lo cuenta? Si una noticia importante solo aparece en una cuenta desconocida, hay que sospechar.
    I: Ahora, cuando algo me parece muy exagerado, lo busco en dos o tres medios antes de compartirlo. Y si no lo encuentro, no lo comparto.
    R: ¿Y tus amigos hacen lo mismo?
    I: Algunos sí. Otros me dicen que soy una pesada. Pero, desde lo de las chinches, cuando dudan de algo, me lo preguntan a mí.
    R: ¡Te has convertido en la verificadora del grupo!
    I: Más o menos. Hasta mi madre me pide que le mire las cosas antes de reenviarlas.
    R: Pues ahí lo tienen: a veces son los hijos los que educan a los padres. Muchas gracias a los dos.
    A: Gracias a vosotros.
  translation: |
    R: Good afternoon. Today we're talking about how teenagers get their news. With us are Álvaro Gil, a Spanish language teacher at a secondary school in Zaragoza, and Irene, one of his students, who is sixteen. Welcome.
    A: Thank you for inviting us.
    I: Hello, good afternoon.
    R: Irene, I'll start with you. Where do you read the news?
    I: Well, the truth is I hardly ever read it. I watch it. I find out about almost everything through short videos on my phone.
    R: And do you trust what you see?
    I: I used to, quite a lot. But last year something happened that made me change. I saw a video saying they were going to close all the secondary schools in the city for a week because of a bedbug infestation. I sent it to my whole class group.
    R: And was it false?
    I: Completely. The next day, Mr Gil explained to us in class that the video was from another city and from three years before. I was so embarrassed.
    A: Well, it wasn't her fault. Hundreds of adults shared that video too. What we did was make the most of it: we spent two weeks analysing how it had spread.
    R: And what did you find out?
    A: That hardly anyone had checked the date or the source. And that the video had everything it needed to go viral: dramatic music, an alarming headline and the line "share it before they delete it".
    R: Álvaro, do you think young people are less well informed than their parents?
    A: Not necessarily. It's true they read fewer newspapers, but it's also true that many adults believe anything that reaches them on messaging apps. The problem isn't age, but a lack of checking habits.
    R: And what habits do you teach in class?
    A: Three very simple questions: who's saying it? When did they say it? And who else is reporting it? If an important piece of news only appears on an unknown account, you should be suspicious.
    I: Now, when something seems very exaggerated to me, I look for it in two or three media outlets before sharing it. And if I can't find it, I don't share it.
    R: And do your friends do the same?
    I: Some do. Others tell me I'm a pain. But since the bedbug thing, when they're not sure about something, they ask me.
    R: You've become the group's fact-checker!
    I: More or less. Even my mother asks me to check things for her before she forwards them.
    R: Well, there you have it: sometimes it's the children who educate the parents. Thank you both very much.
    A: Thank you.
  glossary: |
    fiarse de | to trust
    enterarse de | to find out about; to hear about
    la plaga | infestation; plague
    la chinche | bedbug
    difundirse | to spread
    alarmante | alarming
    la mensajería | messaging (apps)
    sospechar | to be suspicious; to suspect
    ser un pesado / una pesada | to be a pain | colloquial
  questions: |
    mc: How does Irene usually find out about the news? || From newspapers | *Through short videos on her phone | From the radio || «Me entero de casi todo por vídeos cortos en el móvil.»
    tf: The video about the schools was recent and was about Zaragoza. || false || «El vídeo era de otra ciudad y de hacía tres años.»
    short: Name one of the three questions Álvaro teaches his students. || kw: quién/who/cuándo/when/quién más/who else || ¿Quién lo dice?, ¿cuándo lo dijo? and ¿quién más lo cuenta?
    fill: El profesor nos explicó que el vídeo ___ (ser) de otra ciudad. || era || With a past reporting verb, the present becomes the imperfect: era.
    mc: What has changed among Irene's friends? || They have all stopped using social media. | *They ask her when they're not sure about something. | They make their own news videos. || «Cuando dudan de algo, me lo preguntan a mí.»

- slug: cien-anos-y-ninguna-prisa
  kind: listening
  title: Cien años y ninguna prisa
  topic: Looking ahead
  summary: A local radio presenter interviews Concha, who has just turned a hundred, about her childhood without electricity, what she regrets, what life has taught her and how she imagines the future.
  free: true
  speakers: J=Jorge/m; C=Concha/f
  text: |
    J: Hoy tenemos en el estudio a una invitada muy especial. Doña Concha Mendoza cumplió cien años el martes. Muchas felicidades, doña Concha.
    C: Gracias, hijo. Y llámame Concha, que con lo de «doña» me haces todavía más vieja.
    J: De acuerdo, Concha. Cien años… ¿Cómo se siente?
    C: Pues como a los ochenta, pero con más nietos. Tengo once nietos y cuatro bisnietos. Y la cabeza, gracias a Dios, me funciona bien. Las piernas ya son otra cosa.
    J: Usted nació en un pueblo de Ávila, ¿verdad?
    C: Sí, en una casa sin luz eléctrica ni agua corriente. Íbamos a por agua a la fuente con un cántaro. Si alguien me hubiera dicho entonces que algún día hablaría con mi nieta de Canadá a través de una pantalla, le habría dicho que estaba loco.
    J: ¿Fue a la escuela?
    C: Muy poco. A los diez años ya cuidaba de mis hermanos pequeños. Esa es mi espina clavada: si hubiera podido estudiar, me habría gustado ser maestra. Aprendí a leer bien de mayor, con más de cuarenta años, en una escuela de adultos.
    J: ¿Y se arrepiente de algo más?
    C: De haberme preocupado tanto. Me pasé media vida preocupada por cosas que luego no pasaron. Si pudiera volver atrás, me reiría más y bailaría más, que me encantaba.
    J: Es un buen consejo. ¿Y qué es lo mejor que le ha dado la vida?
    C: La gente. Mi marido, que en paz descanse, mis hijos, mis vecinas… Si algo he aprendido es que la felicidad está en las cosas pequeñas: un café con una amiga, una conversación en la puerta de casa.
    J: Usted ha visto cambiar muchísimo el mundo. ¿Cómo se imagina el futuro?
    C: Ay, hijo, no lo sé. Mis bisnietos dicen que dentro de veinte años los coches irán solos y que los robots habrán sustituido a media humanidad. Yo no creo que un robot sepa hacer unas buenas croquetas.
    J: Seguro que no como las suyas.
    C: Lo que sí espero es que para entonces hayamos aprendido a cuidar mejor el planeta y a escucharnos un poco más.
    J: ¿Tiene algún plan para este año?
    C: Claro que sí. Quiero ir a ver el mar a Cádiz con mi nieta. No lo he visto desde hace treinta años. Y a mi edad, hijo, no hay que dejar nada para mañana.
    J: Pues que se cumpla. Muchísimas gracias, Concha, y feliz cumpleaños.
    C: Gracias a ti. Y a los que nos escuchan: ¡bailad más!
  translation: |
    J: Today we have a very special guest in the studio. Doña Concha Mendoza turned a hundred on Tuesday. Happy birthday, Doña Concha.
    C: Thank you, dear. And call me Concha — all that "doña" business makes me feel even older.
    J: All right, Concha. A hundred years… How do you feel?
    C: Well, the same as at eighty, but with more grandchildren. I have eleven grandchildren and four great-grandchildren. And my head, thank God, works fine. My legs are another matter.
    J: You were born in a village in Ávila, weren't you?
    C: Yes, in a house with no electricity or running water. We used to fetch water from the fountain with a clay pitcher. If anyone had told me then that one day I'd talk to my granddaughter in Canada through a screen, I'd have told them they were mad.
    J: Did you go to school?
    C: Very little. At ten I was already looking after my younger brothers and sisters. That's my lingering regret: if I had been able to study, I would have liked to be a teacher. I learned to read properly as an adult, when I was over forty, at an adult school.
    J: And do you regret anything else?
    C: Worrying so much. I spent half my life worrying about things that never happened. If I could go back, I'd laugh more and dance more — I loved it.
    J: That's good advice. And what's the best thing life has given you?
    C: People. My husband, may he rest in peace, my children, my neighbours… If there's one thing I've learned, it's that happiness is in the little things: a coffee with a friend, a chat on the doorstep.
    J: You've seen the world change enormously. How do you imagine the future?
    C: Oh, dear, I don't know. My great-grandchildren say that in twenty years cars will drive themselves and robots will have replaced half of humanity. I don't think a robot will know how to make good croquettes.
    J: Certainly not like yours.
    C: What I do hope is that by then we'll have learned to take better care of the planet and to listen to each other a bit more.
    J: Do you have any plans for this year?
    C: Of course I do. I want to go and see the sea in Cádiz with my granddaughter. I haven't seen it for thirty years. And at my age, dear, you mustn't put anything off until tomorrow.
    J: Then I hope it comes true. Thank you very much, Concha, and happy birthday.
    C: Thank you. And to everyone listening: dance more!
  glossary: |
    el bisnieto / la bisnieta | great-grandchild
    el agua corriente | running water | el agua is feminine: el agua fría
    el cántaro | clay pitcher; jug
    la espina clavada | lingering regret | literally "a thorn stuck in you"
    que en paz descanse | may he / she rest in peace
    la escuela de adultos | adult school
    dejar algo para mañana | to put something off
    hijo / hija | dear (affectionate form of address) | used by older people to younger ones
  questions: |
    mc: What would Concha have liked to be? || A doctor | *A teacher | A dancer || «Si hubiera podido estudiar, me habría gustado ser maestra.»
    tf: Concha learned to read well as a child. || false || She learned to read properly after forty, at an adult school.
    short: Apart from not studying, what does Concha regret? || kw: preocupado/preocupada/preocuparse/worry/worried/worrying || Worrying so much about things that never happened.
    fill: Espero que para entonces ___ (aprender, nosotros) a cuidar mejor el planeta. || hayamos aprendido || A hope about something completed by a future point: perfect subjunctive.
    mc: What is Concha's plan for this year? || *To see the sea in Cádiz with her granddaughter | To visit her granddaughter in Canada | To learn to use a computer || «Quiero ir a ver el mar a Cádiz con mi nieta.»

- slug: hablemos-del-sueldo
  kind: listening
  title: Hablemos del sueldo
  topic: Work and the economy
  summary: Sofía, from the human resources department of an engineering firm in Seville, calls Kwame to offer him a job. He negotiates his salary, remote working and his start date.
  speakers: S=Sofía/f; K=Kwame/m
  text: |
    S: ¿Kwame Mensah? Buenos días, soy Sofía Ortega, de Recursos Humanos de Ingeniería del Sur. ¿Tiene un momento?
    K: Sí, claro. Buenos días, Sofía.
    S: Le llamo con buenas noticias. Al equipo le encantó su entrevista y nos gustaría ofrecerle el puesto de ingeniero de proyectos.
    K: ¡Qué alegría! Muchísimas gracias. ¿Podría contarme las condiciones?
    S: Por supuesto. Sería un contrato indefinido, con un periodo de prueba de seis meses. El sueldo es de treinta y ocho mil euros brutos al año, en catorce pagas.
    K: Entiendo. Le agradezco mucho la oferta, de verdad. Sin embargo, sinceramente, esperaba algo más. En mi empresa actual cobro treinta y seis mil, y este puesto tiene bastante más responsabilidad.
    S: Lo comprendo. ¿En qué cifra estaba pensando?
    K: Me sentiría cómodo con cuarenta y dos mil.
    S: Uf, eso se sale de la banda salarial del puesto. Podría consultarlo, pero le adelanto que difícilmente pasaríamos de cuarenta.
    K: Cuarenta podría estar bien, siempre que hubiera cierta flexibilidad en otros aspectos.
    S: ¿Por ejemplo?
    K: El teletrabajo. En la entrevista me dijeron que la empresa permitía dos días a la semana. ¿Sería posible que fueran tres?
    S: Eso depende del jefe de equipo, pero sé que algunas personas del departamento ya teletrabajan tres días. No creo que sea un problema, a condición de que esté en la oficina cuando haya reuniones con clientes.
    K: Por supuesto. Y otra cosa: la fecha de incorporación. Ustedes querían que empezara el día uno, ¿no?
    S: Así es.
    K: El problema es que en mi contrato actual tengo que avisar con un mes de antelación. Si me hubieran llamado la semana pasada, habría podido empezar el uno sin problema, pero ahora sería imposible.
    S: Entonces, ¿le vendría bien el día quince?
    K: El quince sería perfecto.
    S: Muy bien. Resumo: hablaré con dirección para proponer cuarenta mil euros, tres días de teletrabajo y la incorporación el día quince. En cuanto tenga una respuesta, le mando la oferta por escrito.
    K: Perfecto. Muchas gracias por su flexibilidad, Sofía.
    S: A usted. Esperamos que, si todo sale bien, pronto forme parte del equipo.
  translation: |
    S: Kwame Mensah? Good morning, this is Sofía Ortega from Human Resources at Ingeniería del Sur. Do you have a moment?
    K: Yes, of course. Good morning, Sofía.
    S: I'm calling with good news. The team loved your interview and we'd like to offer you the position of project engineer.
    K: That's wonderful! Thank you so much. Could you tell me the conditions?
    S: Of course. It would be a permanent contract, with a six-month probation period. The salary is thirty-eight thousand euros gross a year, paid in fourteen instalments.
    K: I see. I really appreciate the offer, honestly. However, to be frank, I was expecting a bit more. At my current company I earn thirty-six thousand, and this position has quite a lot more responsibility.
    S: I understand. What figure did you have in mind?
    K: I'd feel comfortable with forty-two thousand.
    S: Oof, that's outside the salary band for the position. I could check, but I'll tell you now that we'd be unlikely to go above forty.
    K: Forty could be fine, provided there was some flexibility in other areas.
    S: For example?
    K: Remote working. In the interview I was told the company allowed two days a week. Would it be possible to make it three?
    S: That depends on the team leader, but I know some people in the department already work from home three days a week. I don't think it'll be a problem, on condition that you're in the office when there are meetings with clients.
    K: Of course. And another thing: the start date. You wanted me to start on the first, didn't you?
    S: That's right.
    K: The problem is that under my current contract I have to give a month's notice. If you had called me last week, I could have started on the first with no problem, but now it would be impossible.
    S: So would the fifteenth suit you?
    K: The fifteenth would be perfect.
    S: Very good. To sum up: I'll talk to management to propose forty thousand euros, three days of remote working and a start date on the fifteenth. As soon as I have an answer, I'll send you the offer in writing.
    K: Perfect. Thank you very much for your flexibility, Sofía.
    S: Thank you. We hope that, if everything goes well, you'll soon be part of the team.
  glossary: |
    bruto | gross (salary) | the opposite is neto (net)
    las pagas | salary payments | in Spain often fourteen: twelve months plus extra payments in summer and at Christmas
    el periodo de prueba | probation period
    la banda salarial | salary band
    adelantar | to tell in advance | le adelanto que… = I can tell you now that…
    la fecha de incorporación | start date
    avisar con antelación | to give notice
    venir bien | to suit; to be convenient
  questions: |
    mc: What salary does Kwame ask for at first? || Thirty-six thousand euros | Forty thousand euros | *Forty-two thousand euros || «Me sentiría cómodo con cuarenta y dos mil.»
