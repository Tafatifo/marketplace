    la sanidad | health care; health system
    la radiografía | X-ray
    el escáner | scan; scanner
    sospechoso | suspicious
    la lista de espera | waiting list
    el consentimiento | (informed) consent
    anonimizar | to anonymise
    el sesgo | bias
    por muy… que + subjunctive | however… | por muy buena que sea = however good it may be
