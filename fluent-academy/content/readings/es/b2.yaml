- slug: la-ia-llega-a-la-consulta
  kind: listening
  title: La inteligencia artificial llega a la consulta
  topic: Science and technology
  summary: On a science podcast, a radiologist from a Madrid hospital explains how artificial intelligence is used to analyse medical images, what its advantages are, and why a doctor must always have the last word.
  speakers: O=Óliver/m; A=Amina/f
  text: |
    O: Bienvenidos a «Ciencia para todos». Hoy hablamos de inteligencia artificial en la sanidad con la doctora Amina Haddad, radióloga en un hospital de Madrid. Doctora, ¿cómo se usa la inteligencia artificial en su servicio?
    A: Sobre todo para analizar imágenes: radiografías, escáneres, mamografías. Se utiliza un programa que revisa cada imagen y marca las zonas que podrían ser sospechosas.
    O: ¿Y quién toma la decisión final? ¿La máquina?
    A: No, nunca. Cada informe es revisado y firmado por un radiólogo. El programa es como un compañero muy rápido que nunca se cansa, pero que también se equivoca.
    O: ¿Se equivoca mucho?
    A: Menos de lo que la gente cree, pero más de lo que dicen algunos anuncios. A veces marca como sospechosas cosas que son normales. Por eso es fundamental que siempre haya una persona detrás.
    O: ¿Y qué ventajas han notado desde que empezaron a usarlo?
    A: La principal es el tiempo. Antes, un estudio complicado podía tardar días en ser revisado. Ahora los casos urgentes se detectan antes y pasan al principio de la lista. En algunos hospitales, gracias a estos sistemas, se han reducido bastante las listas de espera para ciertas pruebas.
    O: Mucha gente teme que la inteligencia artificial acabe sustituyendo a los médicos. ¿Usted qué opina?
    A: Dudo mucho que eso pase, al menos en mi especialidad. Lo que sí creo es que los radiólogos que usen estas herramientas sustituirán a los que no las usen. Es una herramienta, como lo fue en su día el ordenador.
    O: ¿Y los pacientes? ¿Saben que su imagen la ha revisado un programa?
    A: Deberían saberlo, y en nuestro hospital se informa en el consentimiento. Además, los datos se anonimizan antes de ser utilizados para entrenar los sistemas. La privacidad es una preocupación muy legítima.
    O: Hablemos de los sesgos. ¿Pueden ser injustos estos programas?
    A: Sí, si se entrenan con datos de un solo tipo de población. Si un sistema solo ha visto imágenes de pacientes de un país o de un grupo de edad, puede fallar con otros. Por eso se exige que los datos sean variados y que los resultados se revisen constantemente.
    O: Para terminar, ¿qué le diría a un estudiante de Medicina que tiene miedo de la inteligencia artificial?
    A: Que no tenga miedo, que la estudie. Y que no olvide que, por muy buena que sea una máquina, el paciente necesita a alguien que le mire a los ojos y le explique lo que le pasa.
    O: Muchas gracias, doctora Haddad.
    A: Gracias a vosotros.
  translation: |
    O: Welcome to "Science for Everyone". Today we're talking about artificial intelligence in health care with Dr Amina Haddad, a radiologist at a hospital in Madrid. Doctor, how is artificial intelligence used in your department?
    A: Mainly to analyse images: X-rays, scans, mammograms. We use a program that checks each image and marks the areas that might be suspicious.
    O: And who makes the final decision? The machine?
    A: No, never. Every report is checked and signed by a radiologist. The program is like a very fast colleague who never gets tired, but who also makes mistakes.
    O: Does it make a lot of mistakes?
    A: Fewer than people think, but more than some adverts say. Sometimes it marks normal things as suspicious. That's why it's essential that there's always a person behind it.
    O: And what advantages have you noticed since you started using it?
    A: The main one is time. Before, a complicated scan could take days to be reviewed. Now urgent cases are detected sooner and go to the top of the list. In some hospitals, thanks to these systems, waiting lists for certain tests have been reduced considerably.
    O: Many people fear that artificial intelligence will end up replacing doctors. What do you think?
    A: I very much doubt that will happen, at least in my specialty. What I do believe is that radiologists who use these tools will replace those who don't. It's a tool, as the computer was in its day.
    O: And the patients? Do they know that their image has been checked by a program?
    A: They should know, and in our hospital they are told in the consent form. Besides, the data are anonymised before being used to train the systems. Privacy is a very legitimate concern.
    O: Let's talk about bias. Can these programs be unfair?
    A: Yes, if they are trained on data from only one type of population. If a system has only seen images of patients from one country or one age group, it can fail with others. That's why the data are required to be varied and the results to be checked constantly.
    O: To finish, what would you say to a medical student who is afraid of artificial intelligence?
    A: Not to be afraid, but to study it. And not to forget that, however good a machine may be, the patient needs someone who looks them in the eye and explains what is happening to them.
    O: Thank you very much, Dr Haddad.
    A: Thank you.
