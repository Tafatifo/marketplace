    tf: Manon thinks the two-room flat is good for Inès's bike. || false || It's on the fourth floor with no lift: "ce n'est pas idéal !"

- slug: la-fete-des-lumieres
  kind: reading
  title: La fête des Lumières
  topic: Celebrations and traditions
  summary: Read a short guide to Lyon's Festival of Lights — its history, what you will see and some practical advice.
  free: false
  text: |
    Chaque année, autour du 8 décembre, Lyon devient la capitale de la lumière. Pendant quatre soirs, des artistes du monde entier transforment les monuments, les places et les parcs de la ville avec des projections, des couleurs et de la musique. Plus d'un million de visiteurs viennent les admirer.

    Une tradition de 1852

    L'histoire commence en 1852. La ville voulait inaugurer une statue de la Vierge Marie sur la colline de Fourvière. Le jour de la cérémonie, le 8 décembre, il a fait très mauvais et les organisateurs ont annulé une partie de la fête. Mais le soir, le ciel est devenu clair et les Lyonnais ont mis des bougies à leurs fenêtres pour fêter l'événement quand même.

    Les lumignons

    Aujourd'hui encore, beaucoup de familles lyonnaises mettent de petites bougies dans des verres, les lumignons, sur le bord de leurs fenêtres le 8 décembre. Si vous vous promenez dans les vieux quartiers ce soir-là, vous en verrez partout.

    Nos conseils

    Il y a énormément de monde : prenez les transports en commun et n'utilisez pas la voiture. Habillez-vous chaudement, car il fait souvent froid en décembre. Les spectacles sont gratuits, mais certains sites sont très demandés : arrivez tôt ! Et goûtez le vin chaud et les marrons grillés vendus dans les rues.

    Le programme complet sera disponible sur le site de la ville en novembre.
  translation: |
    Every year, around 8 December, Lyon becomes the capital of light. For four evenings, artists from all over the world transform the city's monuments, squares and parks with projections, colours and music. More than a million visitors come to admire them.

    A tradition from 1852

    The story begins in 1852. The city wanted to unveil a statue of the Virgin Mary on Fourvière hill. On the day of the ceremony, 8 December, the weather was very bad and the organisers cancelled part of the celebrations. But in the evening, the sky cleared and the people of Lyon put candles in their windows to celebrate the event anyway.

    The lumignons

    Even today, many Lyon families put small candles in glasses, called lumignons, on their windowsills on 8 December. If you walk around the old districts that evening, you'll see them everywhere.

    Our advice

    It is extremely crowded: take public transport and don't use your car. Wrap up warm, as it's often cold in December. The shows are free, but some sites are very popular: arrive early! And taste the mulled wine and roasted chestnuts sold in the streets.

    The full programme will be available on the city's website in November.
  glossary: |
    la lumière | light
    une projection | a projection (of images onto a building)
    inaugurer | to unveil; to open officially
    la colline | the hill
    quand même | anyway; all the same
    un lumignon | a small candle in a glass | typical of Lyon
    le bord de la fenêtre | the windowsill
    s'habiller chaudement | to wrap up warm
    les marrons grillés | roasted chestnuts
    gratuit | free (of charge)
  questions: |
