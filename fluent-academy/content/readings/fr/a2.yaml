    animaux acceptés | pets allowed
    le meilleur choix | the best choice | superlative of bon
    une visite | a viewing
  questions: |
    mc: Which flat has a garden? || Advert 1 | *Advert 2 | Advert 3 || Advert 2: "au rez-de-chaussée, avec un petit jardin".
    tf: In advert 2, the service charges are included in the rent. || false || "850 € + 60 € de charges" — the charges are extra.
