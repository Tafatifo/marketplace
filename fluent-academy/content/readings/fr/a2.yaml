- slug: trois-villes-une-vie
  kind: reading
  title: Trois villes, une vie
  topic: Life stories
  summary: Read a blog post in which a retired nurse looks back on the three cities of her life.
  free: true
  text: |
    Je m'appelle Odile, j'ai soixante-sept ans et, l'année dernière, j'ai pris ma retraite. Ma petite-fille m'a dit : « Mamie, écris ton histoire sur un blog ! » Alors voilà.

    Je suis née à Brest, en Bretagne. Quand j'étais petite, j'habitais près du port et je regardais les bateaux tous les jours. À dix-huit ans, j'ai eu mon bac et j'ai quitté la Bretagne pour faire des études d'infirmière à Paris.

    Paris, c'est la ville de ma jeunesse. J'ai partagé un petit appartement avec deux amies, j'ai travaillé de nuit à l'hôpital et j'ai découvert les musées, le cinéma, les cafés. C'est aussi à Paris que j'ai rencontré Ahmed, mon mari.

    En 1985, nous avons eu notre premier enfant et nous avons décidé de changer de vie. Ahmed a trouvé un poste à Montpellier et nous avons acheté une maison avec un jardin. J'ai travaillé trente ans dans une clinique de la ville. Nos trois enfants ont grandi au soleil !

    Aujourd'hui, j'ai enfin le temps. J'ai appris à nager — oui, à soixante-six ans ! — et j'ai fait mon premier voyage en Asie. Je n'ai jamais regretté mes choix.

    Et vous, quelles sont les villes de votre vie ?
  translation: |
    My name is Odile, I'm sixty-seven and I retired last year. My granddaughter said to me: "Grandma, write your story on a blog!" So here it is.

    I was born in Brest, in Brittany. When I was little, I lived near the harbour and I watched the boats every day. At eighteen, I passed my bac and I left Brittany to study nursing in Paris.

    Paris is the city of my youth. I shared a small flat with two friends, I worked nights at the hospital and I discovered museums, the cinema, cafés. It was also in Paris that I met Ahmed, my husband.

    In 1985 we had our first child and we decided to change our lives. Ahmed found a job in Montpellier and we bought a house with a garden. I worked for thirty years in a clinic in the city. Our three children grew up in the sun!

    Today, I finally have time. I learned to swim — yes, at sixty-six! — and I went on my first trip to Asia. I have never regretted my choices.

    And you, what are the cities of your life?
  glossary: |
    prendre sa retraite | to retire | j'ai pris ma retraite
    je suis née | I was born | naître takes être: née for a woman
    quitter | to leave (a place, a person) | always with a direct object: quitter la Bretagne
    la jeunesse | youth | ma jeunesse = when I was young
    partager | to share | j'ai partagé un appartement
    découvrir | to discover | participle: découvert
    changer de vie | to change your life | changer de + noun, without an article
    grandir | to grow up | participle: grandi
    regretter | to regret | je n'ai jamais regretté
  questions: |
    mc: Where did Odile grow up? || Paris | *Brest | Montpellier || "Je suis née à Brest… j'habitais près du port." She moved to Paris at eighteen.
    tf: Odile studied nursing in Montpellier. || false || She left Brittany "pour faire des études d'infirmière à Paris".
    short: Where did Odile meet her husband? || kw: Paris || "C'est aussi à Paris que j'ai rencontré Ahmed, mon mari."
    fill: En 1985, Odile et Ahmed ___ (avoir) leur premier enfant. || ont eu || The participle of avoir is eu: ils ont eu.
    mc: What has Odile done since she retired? || *She has learned to swim and travelled to Asia | She has moved back to Brittany | She has started working in a clinic || "J'ai appris à nager… et j'ai fait mon premier voyage en Asie."
    tf: Odile regrets leaving Brittany. || false || "Je n'ai jamais regretté mes choix."

- slug: des-vacances-pas-comme-prevu
  kind: reading
  title: Des vacances pas comme prévu
  topic: Holidays and travel
  summary: Read a travel blog post about a trip to Corsica where nothing went as planned — and how it ended well.
  free: false
  text: |
    L'été dernier, avec mon ami Théo, nous avons décidé de partir en Corse. Nous avons tout organisé : les billets de bateau, la voiture de location, trois nuits dans un camping près de Porto-Vecchio. Tout était parfait… sur le papier.

    Le jour du départ, nous sommes arrivés au port de Marseille avec une heure d'avance. Mais il y avait une grève et notre bateau n'est pas parti ! Nous avons attendu toute la journée. Finalement, nous sommes partis le lendemain matin, très fatigués.

    À Ajaccio, deuxième problème : l'agence de location n'avait plus notre réservation. Heureusement, l'employée a été très gentille et elle a trouvé une autre voiture — plus petite, mais moins chère.

    Nous sommes enfin arrivés au camping à minuit. Et là, surprise : il a commencé à pleuvoir. Il a plu pendant deux jours ! Théo a dit : « On rentre ? » Moi, j'ai dit non.

    Et j'ai eu raison. Le troisième jour, le soleil est revenu. Nous avons nagé dans une eau transparente, nous sommes montés dans les montagnes et nous avons mangé le meilleur fromage de notre vie chez un berger. Un soir, des voisins du camping nous ont invités à dîner. Nous sommes restés une semaine de plus !

    Ma conclusion ? En voyage, les problèmes font partie de l'aventure. Et souvent, ils deviennent les meilleurs souvenirs.
  translation: |
    Last summer, my friend Théo and I decided to go to Corsica. We organised everything: the boat tickets, the rental car, three nights at a campsite near Porto-Vecchio. Everything was perfect… on paper.

    On the day we left, we arrived at the port in Marseille an hour early. But there was a strike and our boat didn't leave! We waited all day. In the end, we left the next morning, very tired.

    In Ajaccio, problem number two: the rental agency no longer had our booking. Fortunately, the employee was very kind and she found another car — smaller, but cheaper.

    We finally arrived at the campsite at midnight. And then, surprise: it started to rain. It rained for two days! Théo said: "Shall we go home?" I said no.

    And I was right. On the third day, the sun came back. We swam in crystal-clear water, we went up into the mountains and we ate the best cheese of our lives at a shepherd's. One evening, some neighbours from the campsite invited us to dinner. We stayed an extra week!

    My conclusion? When you travel, problems are part of the adventure. And they often become the best memories.
  glossary: |
    la voiture de location | the rental car
    sur le papier | on paper; in theory
    avec une heure d'avance | an hour early | en avance = early
    le lendemain | the next day
    il a plu | it rained | passé composé of pleuvoir
    avoir raison | to be right | opposite: avoir tort
    un berger | a shepherd
    faire partie de | to be part of
    une semaine de plus | an extra week
  questions: |
    mc: Why didn't the boat leave on the first day? || There was a storm | *There was a strike | They arrived too late || "Il y avait une grève et notre bateau n'est pas parti !" They arrived an hour early.
    tf: The rental agency had no car for them. || false || The agency had lost the booking, but the employee found another car.
    short: How long did it rain? || kw: deux/2/two || "Il a plu pendant deux jours !"
    fill: Le troisième jour, le soleil est ___ (revenir). || revenu || Revenir takes être; le soleil is masculine singular: revenu.
    tf: The writer wanted to go home when it rained. || false || Théo suggested going home ("On rentre ?"), but the writer said no.
    mc: How did the holiday end? || They went home early | *They stayed an extra week | They moved to a hotel || "Nous sommes restés une semaine de plus !"

- slug: j-ai-change-de-metier
  kind: reading
  title: J'ai changé de métier
  topic: Work and studies
  summary: Read a magazine interview with a former accountant who became a baker at the age of 38.
  free: false
  text: |
    Témoignage — Bastien, 41 ans, boulanger à Angers

    « Pendant douze ans, j'ai été comptable dans une grande entreprise. Je travaillais dans un bureau, devant un ordinateur, de huit heures à dix-neuf heures. Le salaire était bon, mes collègues étaient sympas, mais je n'étais pas heureux. Le dimanche soir, j'avais toujours mal au ventre.

    Un jour, en 2023, j'ai fait un stage d'un week-end dans une boulangerie, juste pour le plaisir. Le boulanger m'a montré comment faire le pain. Quand j'ai sorti ma première baguette du four, j'ai compris : c'était ça, mon métier !

    Ça n'a pas été facile. J'ai démissionné et j'ai repris des études pendant un an pour avoir mon CAP de boulanger. J'avais trente-huit ans et j'étais le plus âgé de la classe ! Ma femme m'a beaucoup aidé : elle travaillait, et moi, je m'occupais des enfants le soir.

    Depuis deux ans, j'ai ma propre boulangerie dans le centre d'Angers. Je me lève à trois heures et demie du matin, je travaille six jours sur sept et je gagne moins d'argent qu'avant. Mais je suis beaucoup plus heureux. Les clients me disent bonjour avec le sourire, et le dimanche soir, je n'ai plus mal au ventre !

    Mon conseil ? Si vous rêvez de changer de métier, essayez d'abord avec un stage. Vous verrez vite si c'est pour vous. »
  translation: |
    Personal account — Bastien, 41, baker in Angers

    "For twelve years, I was an accountant in a big company. I worked in an office, in front of a computer, from eight in the morning until seven in the evening. The pay was good and my colleagues were nice, but I wasn't happy. On Sunday evenings, I always had a stomach ache.

    One day, in 2023, I did a weekend course in a bakery, just for fun. The baker showed me how to make bread. When I took my first baguette out of the oven, I understood: this was my trade!

    It wasn't easy. I resigned and went back to studying for a year to get my vocational diploma in baking. I was thirty-eight and I was the oldest in the class! My wife helped me a lot: she was working, and I looked after the children in the evenings.

    For two years now I've had my own bakery in the centre of Angers. I get up at half past three in the morning, I work six days a week and I earn less money than before. But I'm much happier. The customers say hello with a smile, and on Sunday evenings I no longer have a stomach ache!

    My advice? If you dream of changing careers, try it first with a short placement. You'll soon see if it's for you."
  glossary: |
    un témoignage | a personal account; a testimony
    un comptable | an accountant | feminine: une comptable
    le four | the oven
    le métier | the job; the trade | changer de métier = to change careers
    démissionner | to resign
    reprendre des études | to go back to studying
    le CAP | a vocational diploma | certificat d'aptitude professionnelle
    le plus âgé | the oldest | superlative of âgé
    sa propre boulangerie | his own bakery | propre before the noun = own
    un conseil | a piece of advice
  questions: |
    mc: What was Bastien's problem in his old job? || The pay was low | His colleagues weren't nice | *He wasn't happy || "Le salaire était bon, mes collègues étaient sympas, mais je n'étais pas heureux."
    tf: Bastien discovered baking during a weekend course in a bakery. || true || "J'ai fait un stage d'un week-end dans une boulangerie, juste pour le plaisir."
    short: How old was Bastien when he went back to studying? || kw: 38/trente-huit/thirty-eight || "J'avais trente-huit ans et j'étais le plus âgé de la classe !"
    fill: Depuis deux ans, Bastien ___ (avoir) sa propre boulangerie. || a || Depuis + something still true takes the present: il a.
    mc: Which statement about his new life is true? || He earns more money than before | *He starts work very early | He works five days a week || He gets up at 3:30 a.m. and works six days a week, for less money.
    tf: Bastien advises people to try a placement before changing careers. || true || "Essayez d'abord avec un stage."

- slug: trois-appartements-a-louer
  kind: reading
  title: Trois appartements à louer
  topic: Home and housing
  summary: Read three flat adverts in Nantes and an email comparing them, then work out which flat is the best choice.
  free: false
  text: |
    Annonce 1 — Centre-ville. T2 de 38 m² au 4e étage sans ascenseur. Salon lumineux, une chambre, cuisine équipée. Proche du tram et des commerces. 780 € par mois, charges comprises. Libre le 1er septembre.

    Annonce 2 — Quartier Chantenay. T3 de 62 m² au rez-de-chaussée, avec un petit jardin. Deux chambres, cuisine séparée, cave. Quartier calme, bus à cinq minutes. 850 € + 60 € de charges. Animaux acceptés.

    Annonce 3 — Île de Nantes. Studio meublé de 25 m² au 2e étage avec ascenseur. Neuf, très moderne, balcon. À deux pas de l'université. 620 € charges comprises.

    Salut Inès,

    J'ai lu tes annonces. Voilà mon avis ! Le studio est le moins cher et le plus moderne, mais il est vraiment trop petit pour nous deux. En plus, il est meublé : on ne pourra pas prendre nos meubles.

    Le T2 du centre est plus pratique pour aller au travail, mais il est au quatrième étage sans ascenseur… Avec ton vélo, ce n'est pas idéal !

    À mon avis, le T3 est le meilleur choix. Il est plus grand que les deux autres, il y a un jardin pour Biscotte (notre chat !) et le quartier est plus calme. D'accord, c'est le plus cher, mais avec deux salaires, ça va.

    Si tu es d'accord, j'appelle l'agence demain pour organiser une visite.

    Bisous,
    Manon
  translation: |
    Advert 1 — City centre. Two-room flat of 38 m² on the 4th floor, no lift. Bright living room, one bedroom, fitted kitchen. Close to the tram and the shops. €780 a month, service charges included. Available from 1 September.

    Advert 2 — Chantenay area. Three-room flat of 62 m² on the ground floor, with a small garden. Two bedrooms, separate kitchen, cellar. Quiet area, bus five minutes away. €850 + €60 service charges. Pets allowed.

    Advert 3 — Île de Nantes. Furnished studio of 25 m² on the 2nd floor with a lift. New, very modern, balcony. A stone's throw from the university. €620, service charges included.

    Hi Inès,

    I've read your adverts. Here's what I think! The studio is the cheapest and the most modern, but it's really too small for the two of us. Also, it's furnished: we won't be able to bring our furniture.

    The two-room flat in the centre is more convenient for getting to work, but it's on the fourth floor with no lift… With your bike, that's not ideal!

    In my opinion, the three-room flat is the best choice. It's bigger than the other two, there's a garden for Biscotte (our cat!) and the area is quieter. OK, it's the most expensive, but with two salaries, it's fine.

    If you agree, I'll call the agency tomorrow to arrange a viewing.

    Love,
    Manon
  glossary: |
    T2 / T3 | flat with two / three main rooms | the kitchen and bathroom are not counted
    au rez-de-chaussée | on the ground floor
    charges comprises | service charges included | often abbreviated CC
    une cave | a cellar | storage space in the basement
    à deux pas de | a stone's throw from; very close to
