    fill: Si vous vous promenez dans les vieux quartiers, vous ___ verrez partout. || en || En replaces des lumignons: vous en verrez.
    mc: What does the guide advise? || *Use public transport | Come by car | Book a ticket for every show || "Prenez les transports en commun et n'utilisez pas la voiture." The shows are free.
    tf: You have to pay to see the shows. || false || "Les spectacles sont gratuits."

- slug: ou-partir-cet-ete
  kind: reading
  title: Où partir cet été ?
  topic: Plans and choices
  summary: Read a travel forum post and the replies comparing destinations for a family summer holiday.
  free: false
  text: |
    Forum « Voyager en famille »

    Message de Karima, le 12 mars
    Bonjour à tous ! Cet été, nous partirons dix jours avec nos deux enfants (8 et 12 ans). Notre budget n'est pas énorme et nous voulons éviter l'avion. Nous hésitons entre trois destinations : la côte basque, les Alpes ou l'Alsace. Quelle est la meilleure option, à votre avis ? Merci d'avance !

    Réponse de Paul_83
    Bonjour Karima ! Nous sommes allés dans les Alpes l'été dernier et c'était génial. C'est la destination la plus calme des trois, et la moins chère si vous louez un gîte. Les enfants adoreront les randonnées et les lacs. Seul inconvénient : s'il pleut, il y a moins d'activités.

    Réponse de Lucie.B
    À mon avis, la côte basque est la plus belle région de France ! Les plages sont magnifiques et vos enfants pourront apprendre à surfer. Mais attention : en août, c'est la période la plus chère et il y a beaucoup de monde. Si vous partez en juillet, ce sera plus facile de trouver un logement.

    Réponse de Karima
    Merci beaucoup pour vos conseils ! Mon fils veut absolument faire du surf, mais ma fille préfère la montagne… Finalement, nous ferons les deux : cinq jours au Pays basque en juillet, puis cinq jours dans les Alpes. Nous ferons le trajet en voiture, c'est le plus pratique avec les enfants. Je vous raconterai !
  translation: |
    "Travelling as a family" forum

    Message from Karima, 12 March
    Hello everyone! This summer we're going away for ten days with our two children (aged 8 and 12). Our budget isn't huge and we want to avoid flying. We can't decide between three destinations: the Basque coast, the Alps or Alsace. Which is the best option, in your opinion? Thanks in advance!

    Reply from Paul_83
    Hello Karima! We went to the Alps last summer and it was great. It's the quietest of the three destinations, and the cheapest if you rent a holiday cottage. The children will love the hikes and the lakes. The only drawback: if it rains, there are fewer activities.

    Reply from Lucie.B
    In my opinion, the Basque coast is the most beautiful region in France! The beaches are magnificent and your children will be able to learn to surf. But be careful: August is the most expensive period and it's very crowded. If you go in July, it will be easier to find accommodation.

    Reply from Karima
    Thank you very much for your advice! My son really wants to go surfing, but my daughter prefers the mountains… In the end, we'll do both: five days in the Basque Country in July, then five days in the Alps. We'll drive — it's the most practical with children. I'll tell you all about it!
  glossary: |
    éviter | to avoid
    hésiter entre | to be unable to decide between
    un gîte | a holiday cottage
    une randonnée | a hike; a long walk
    un inconvénient | a drawback
    il y a beaucoup de monde | it's very crowded
    un logement | accommodation; a place to stay
    le trajet | the journey
    je vous raconterai | I'll tell you about it | futur simple of raconter
  questions: |
    mc: Which destination does Karima's family not choose in the end? || The Basque coast | The Alps | *Alsace || They will spend five days in the Basque Country and five days in the Alps.
    tf: Paul thinks the Alps are the cheapest option if you rent a cottage. || true || "La moins chère si vous louez un gîte."
    short: According to Lucie, what is the problem with the Basque coast in August? || kw: cher/chère/expensive/monde/crowded/busy || "En août, c'est la période la plus chère et il y a beaucoup de monde."
    fill: Si vous partez en juillet, ce ___ (être) plus facile de trouver un logement. || sera || Si + présent, then the futur in the main clause: ce sera.
    mc: Why does the family choose two destinations? || It's cheaper | *The children want different things | They have three weeks of holiday || The son wants to surf and the daughter prefers the mountains.
    tf: Karima's family will travel by plane. || false || They want to avoid flying and will drive: "Nous ferons le trajet en voiture."

- slug: une-reservation-perdue
  kind: listening
  title: Une réservation perdue
  topic: Holidays and travel
  summary: Listen to a traveller at a hotel reception in Bordeaux — the receptionist can't find her booking.
  free: true
  speakers: R=Le réceptionniste/m; C=Mme Camara/f
  text: |
    R: Bonsoir, madame. Bienvenue à l'hôtel du Port.
    C: Bonsoir. J'ai réservé une chambre pour trois nuits, au nom de Camara.
    R: Camara… Je regarde… Désolé, madame, je ne trouve pas votre réservation.
    C: Comment ça ? J'ai réservé sur votre site il y a deux semaines !
    R: Vous avez reçu un e-mail de confirmation ?
    C: Oui, le jour même. Regardez, il est sur mon téléphone.
    R: Ah oui, je vois. Le problème, c'est que vous avez réservé du 12 au 15 juin, pas du 12 au 15 mai.
    C: Oh non ! Je me suis trompée de mois ! Vous avez une chambre libre ce soir ?
    R: Ce soir, l'hôtel est presque complet. Il nous reste une chambre double, mais elle est plus chère : cent dix euros la nuit.
    C: Plus chère que ma réservation ?
    R: Oui, votre chambre simple était à quatre-vingt-cinq euros.
    C: Bon, je la prends. Je suis trop fatiguée pour chercher un autre hôtel.
    R: Très bien. Et votre réservation de juin, je l'annule ?
    C: Oui, s'il vous plaît. Je n'ai pas besoin de deux réservations !
    R: C'est fait. Voici votre clé : chambre vingt-quatre, au deuxième étage. Le petit-déjeuner est servi de sept heures à dix heures.
    C: Merci beaucoup, monsieur. Bonne soirée !
  translation: |
    Receptionist: Good evening, madam. Welcome to the Hôtel du Port.
    Mrs Camara: Good evening. I've booked a room for three nights, in the name of Camara.
    Receptionist: Camara… Let me look… Sorry, madam, I can't find your booking.
    Mrs Camara: What do you mean? I booked on your website two weeks ago!
    Receptionist: Did you receive a confirmation email?
    Mrs Camara: Yes, the same day. Look, it's on my phone.
    Receptionist: Ah yes, I see. The problem is that you booked from 12 to 15 June, not from 12 to 15 May.
    Mrs Camara: Oh no! I got the wrong month! Do you have a room available tonight?
    Receptionist: Tonight the hotel is almost full. We have one double room left, but it's more expensive: a hundred and ten euros a night.
    Mrs Camara: More expensive than my booking?
    Receptionist: Yes, your single room was eighty-five euros.
    Mrs Camara: Well, I'll take it. I'm too tired to look for another hotel.
    Receptionist: Very good. And your booking for June — shall I cancel it?
    Mrs Camara: Yes, please. I don't need two bookings!
    Receptionist: Done. Here's your key: room twenty-four, on the second floor. Breakfast is served from seven to ten.
    Mrs Camara: Thank you very much. Good evening!
  glossary: |
    au nom de | in the name of
    le jour même | the same day
    se tromper de | to get the wrong… | je me suis trompée de mois
    complet | full; fully booked
    il nous reste | we have … left
    une chambre simple / double | a single / double room
    annuler | to cancel
    le petit-déjeuner est servi | breakfast is served
  questions: |
    mc: What was the problem with Mme Camara's booking? || She booked another hotel | *She booked for June instead of May | She never received a confirmation || "Vous avez réservé du 12 au 15 juin, pas du 12 au 15 mai."
    tf: Mme Camara booked her room two weeks ago. || true || "J'ai réservé sur votre site il y a deux semaines !"
    short: How much does the double room cost per night? || kw: 110/cent dix || "Cent dix euros la nuit." Her single room was 85 euros.
    mc: What does Mme Camara decide to do? || Look for another hotel | *Take the double room tonight | Come back in June || "Bon, je la prends. Je suis trop fatiguée pour chercher un autre hôtel."
    fill: Mme Camara s'est ___ (tromper) de mois. || trompée || Reflexive verb → être; Mme Camara is a woman, so trompée.
    tf: The receptionist cancels the June booking. || true || "Et votre réservation de juin, je l'annule ? — Oui, s'il vous plaît."

- slug: a-la-pharmacie
  kind: listening
  title: À la pharmacie
  topic: Health and the body
  summary: Listen to a customer asking a pharmacist for advice about a sore throat and a cough.
  free: false
  speakers: P=La pharmacienne/f; Y=Yanis/m
  text: |
    P: Bonjour, monsieur. Qu'est-ce qu'il vous faut ?
    Y: Bonjour, madame. J'ai très mal à la gorge depuis hier soir, et je tousse beaucoup.
    P: Vous avez de la fièvre ?
    Y: Non, je ne crois pas. Mais je suis fatigué et j'ai un peu mal à la tête.
    P: Vous êtes allergique à certains médicaments ?
    Y: Oui, à l'aspirine.
    P: D'accord. Alors, voici des pastilles pour la gorge. Prenez-en une toutes les trois heures, mais pas plus de six par jour.
    Y: Et pour la toux ?
    P: Voici un sirop. Prenez une cuillère le matin et une le soir, après le repas.
    Y: Je peux le prendre avant de dormir ?
    P: Oui, une heure avant de vous coucher, c'est parfait. Et surtout, buvez beaucoup d'eau et reposez-vous.
    Y: Est-ce que je dois aller chez le médecin ?
    P: Si vous avez de la fièvre ou si vous avez encore mal dans trois jours, oui, il faut consulter.
    Y: Très bien. Ça fait combien ?
    P: Les pastilles, c'est six euros, et le sirop, huit euros cinquante. Donc quatorze euros cinquante.
    Y: Voilà. Merci beaucoup, madame !
    P: Je vous en prie. Bon rétablissement !
  translation: |
    Pharmacist: Hello, sir. What can I get you?
    Yanis: Hello. I've had a very sore throat since last night, and I'm coughing a lot.
    Pharmacist: Do you have a temperature?
    Yanis: No, I don't think so. But I'm tired and I have a slight headache.
    Pharmacist: Are you allergic to any medicines?
    Yanis: Yes, to aspirin.
    Pharmacist: All right. Then here are some throat lozenges. Take one every three hours, but no more than six a day.
    Yanis: And for the cough?
    Pharmacist: Here's a syrup. Take one spoonful in the morning and one in the evening, after your meal.
    Yanis: Can I take it before going to sleep?
    Pharmacist: Yes, an hour before you go to bed is perfect. And above all, drink lots of water and get some rest.
    Yanis: Do I need to see a doctor?
    Pharmacist: If you have a temperature, or if it still hurts in three days, yes, you should see a doctor.
    Yanis: Very good. How much is that?
    Pharmacist: The lozenges are six euros, and the syrup is eight euros fifty. So fourteen euros fifty.
    Yanis: Here you are. Thank you very much!
    Pharmacist: You're welcome. Get well soon!
  glossary: |
    qu'est-ce qu'il vous faut ? | what do you need? what can I get you?
    depuis hier soir | since last night
    des pastilles | throat lozenges
    prenez-en une | take one (of them) | en + imperative
    toutes les trois heures | every three hours
    la toux | the cough | the verb is tousser
    consulter | to see a doctor
    ça fait combien ? | how much is that?
    bon rétablissement ! | get well soon!
  questions: |
    mc: What symptoms does Yanis have? || *A sore throat, a cough and a slight headache | A temperature and a stomach ache | Backache and a cough || "J'ai très mal à la gorge… je tousse beaucoup… j'ai un peu mal à la tête." He has no temperature.
    tf: Yanis is allergic to aspirin. || true || "Vous êtes allergique à certains médicaments ? — Oui, à l'aspirine."
    short: What is the maximum number of lozenges Yanis can take per day? || kw: six/6 || "Pas plus de six par jour."
    mc: When should Yanis see a doctor? || Tomorrow morning | *If he has a temperature or it still hurts in three days | Only if the syrup doesn't work tonight || "Si vous avez de la fièvre ou si vous avez encore mal dans trois jours, oui, il faut consulter."
    fill: Prenez-___ une toutes les trois heures. || en || En replaces des pastilles; in the affirmative imperative, it comes after the verb: prenez-en une.
    short: How much does Yanis pay in total? || kw: 14/quatorze || "Donc quatorze euros cinquante" — €14.50.

- slug: un-colis-qui-n-arrive-pas
  kind: listening
  title: Un colis qui n'arrive pas
  topic: Services and errands
  summary: Listen to a phone call to an online shop's customer service about a parcel that hasn't arrived.
  free: false
  speakers: A=Amandine/f; T=Thomas/m
  text: |
    A: Service client, Amandine à l'appareil, bonjour !
    T: Bonjour, madame. J'ai commandé une cafetière sur votre site il y a dix jours, et je ne l'ai pas encore reçue.
    A: Je suis désolée. Vous avez votre numéro de commande ?
    T: Oui : quatre, cinq, huit, deux, un.
    A: Merci… Alors, votre colis est parti de notre entrepôt le trois mars. Le transporteur l'a livré le six.
    T: Livré ? Mais je n'ai rien reçu !
    A: D'après le transporteur, il l'a laissé au point relais, à la boulangerie de votre rue.
    T: Ah bon ? Mais personne ne m'a prévenu !
    A: Normalement, vous avez reçu un texto. Vous pouvez vérifier ?
    T: Attendez… Ah oui, je vois le message. Je ne l'ai pas lu, désolé !
    A: Ce n'est pas grave. Mais attention, le point relais garde les colis pendant quatorze jours.
    T: D'accord, j'y vais cet après-midi. Et si la cafetière ne marche pas, je peux la renvoyer ?
    A: Bien sûr. Vous avez trente jours pour la renvoyer, et le retour est gratuit.
    T: Parfait. Merci beaucoup, madame !
    A: Je vous en prie. Bonne journée, monsieur !
  translation: |
    Amandine: Customer service, Amandine speaking, good morning!
    Thomas: Hello. I ordered a coffee maker on your website ten days ago, and I still haven't received it.
    Amandine: I'm sorry. Do you have your order number?
    Thomas: Yes: four, five, eight, two, one.
    Amandine: Thank you… Right, your parcel left our warehouse on the third of March. The delivery company delivered it on the sixth.
    Thomas: Delivered? But I haven't received anything!
    Amandine: According to the delivery company, they left it at the pick-up point, at the bakery in your street.
    Thomas: Really? But nobody told me!
    Amandine: You should have received a text message. Can you check?
    Thomas: Wait… Oh yes, I can see the message. I didn't read it, sorry!
    Amandine: Never mind. But be careful, the pick-up point keeps parcels for fourteen days.
    Thomas: OK, I'll go there this afternoon. And if the coffee maker doesn't work, can I send it back?
    Amandine: Of course. You have thirty days to send it back, and returns are free.
    Thomas: Perfect. Thank you very much!
    Amandine: You're welcome. Have a nice day!
  glossary: |
    à l'appareil | speaking (on the phone)
    une commande | an order | commander = to order
    un entrepôt | a warehouse
    le transporteur | the delivery company; the carrier
    un point relais | a parcel pick-up point | often in a local shop
    d'après | according to
    prévenir | to let someone know
    renvoyer | to send back
    gratuit | free (of charge)
  questions: |
    mc: What did Thomas order? || *A coffee maker | A kettle | A lamp || "J'ai commandé une cafetière."
    tf: The parcel never left the warehouse. || false || It left the warehouse on 3 March and was delivered on 6 March.
    short: Where is Thomas's parcel? || kw: boulangerie/bakery/relais/pick-up || "Au point relais, à la boulangerie de votre rue."
    mc: Why didn't Thomas know where his parcel was? || The shop didn't send a message | *He didn't read the text message | The bakery was closed || "Je vois le message. Je ne l'ai pas lu, désolé !"
    fill: Le point relais garde les colis pendant ___ jours. || quatorze / 14 || "Le point relais garde les colis pendant quatorze jours."
    tf: Thomas can send the coffee maker back within thirty days. || true || "Vous avez trente jours pour la renvoyer, et le retour est gratuit."

- slug: on-se-retrouve-ou
  kind: listening
  title: On se retrouve où ?
  topic: Plans and choices
  summary: Listen to two friends organising a Saturday in Lyon and planning what to do if things change.
  free: false
  speakers: E=Emma/f; R=Rémi/m
  text: |
    E: Allô, Rémi ? C'est Emma. Tu es toujours d'accord pour samedi ?
    R: Oui, bien sûr ! On fait quoi, finalement ?
    E: J'ai trois idées : le marché de la Croix-Rousse, le musée des Confluences ou une balade au parc de la Tête d'Or.
    R: Le parc, c'est le plus agréable s'il fait beau. Mais la météo annonce de la pluie.
    E: Alors, s'il pleut, on ira au musée. À mon avis, c'est le plus intéressant des trois.
    R: D'accord. Et le matin, on pourrait aller au marché. Il y a les meilleurs fromages de Lyon !
    E: Bonne idée. On se retrouve à quelle heure ?
    R: À dix heures, devant la station de métro Croix-Rousse. Ça te va ?
    E: Ça marche. Mais si je suis en retard, ne m'attends pas : je te rejoindrai au marché.
    R: Pas de problème. Tu viendras avec Julia ?
    E: Peut-être. Si elle finit son travail à temps, elle nous retrouvera pour le déjeuner.
    R: Super. Je réserverai une table au restaurant, au cas où.
    E: Parfait ! À samedi, alors !
  translation: |
    Emma: Hello, Rémi? It's Emma. Are you still OK for Saturday?
    Rémi: Yes, of course! So what are we doing in the end?
    Emma: I've got three ideas: the Croix-Rousse market, the Musée des Confluences or a walk in the Parc de la Tête d'Or.
    Rémi: The park is the nicest if the weather's good. But the forecast says rain.
    Emma: Then if it rains, we'll go to the museum. In my opinion, it's the most interesting of the three.
    Rémi: OK. And in the morning, we could go to the market. It has the best cheeses in Lyon!
    Emma: Good idea. What time shall we meet?
    Rémi: At ten, in front of the Croix-Rousse metro station. Is that OK for you?
    Emma: Deal. But if I'm late, don't wait for me: I'll meet you at the market.
    Rémi: No problem. Will you come with Julia?
    Emma: Maybe. If she finishes work in time, she'll meet us for lunch.
    Rémi: Great. I'll book a table at a restaurant, just in case.
    Emma: Perfect! See you on Saturday, then!
  glossary: |
    une balade | a walk; a stroll | faire une balade
    la météo | the weather forecast
    annoncer | to forecast; to announce
    à mon avis | in my opinion
    ça te va ? | is that OK for you?
    rejoindre | to join; to meet up with | futur: je te rejoindrai
    à temps | in time
    au cas où | just in case
  questions: |
    mc: What will Emma and Rémi do if it rains? || Stay at home | *Go to the museum | Go to the park anyway || "S'il pleut, on ira au musée."
    tf: They will meet at the market at 10 a.m. || false || They will meet at ten "devant la station de métro Croix-Rousse".
    short: What does Rémi say about the market? || kw: fromage/fromages/cheese/cheeses || "Il y a les meilleurs fromages de Lyon !"
    mc: What should Rémi do if Emma is late? || Call her | Wait for her at the station | *Go to the market without her || "Si je suis en retard, ne m'attends pas : je te rejoindrai au marché."
    fill: Si Julia finit son travail à temps, elle ___ (retrouver) Emma et Rémi pour le déjeuner. || retrouvera || Si + présent, then the futur: elle retrouvera.
    tf: Rémi will book a table at a restaurant. || true || "Je réserverai une table au restaurant, au cas où."
