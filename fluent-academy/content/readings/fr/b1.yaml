- slug: vingt-ans-d-amitie
  kind: reading
  title: Vingt ans d'amitié
  topic: People and relationships
  summary: Read a blog post in which a woman tells how a long friendship survived its first big argument.
  free: true
  text: |
    J'ai rencontré Élodie le jour de mon entrée en sixième. J'étais la nouvelle de la classe, je ne connaissais personne et j'étais terriblement timide. Elle s'est assise à côté de moi et elle m'a demandé si j'aimais les chats. C'est tout. Depuis ce jour, nous ne nous sommes plus quittées.

    Élodie, c'est une fille franche, qui rit fort et qui se fâche vite, mais qui oublie aussi vite. Moi, je suis plutôt réservée et un peu susceptible. Pendant des années, nos différences ne posaient aucun problème : au contraire, nous étions complémentaires.

    Puis, il y a cinq ans, nous nous sommes disputées pour la première fois, vraiment. Élodie se mariait, et elle m'avait demandé d'être son témoin. Une semaine avant le mariage, j'ai appris que je devais partir en mission au Canada pour mon travail, exactement à cette date. J'ai essayé de changer, mais c'était impossible. Quand je le lui ai dit, elle s'est mise en colère. Elle pensait que je n'avais pas vraiment essayé. Moi, je trouvais qu'elle était injuste. Nous ne nous sommes pas parlé pendant huit mois.

    C'est sa grand-mère, une dame que j'adorais, qui nous a réconciliées. Un jour, elle m'a invitée à prendre le thé chez elle. Quand je suis arrivée, Élodie était là, dans le salon. Nous étions toutes les deux très gênées. Puis sa grand-mère a sorti un vieil album photo de nos vacances d'adolescentes, et nous avons éclaté de rire. Ce jour-là, nous nous sommes expliquées, et nous nous sommes excusées toutes les deux.

    Aujourd'hui, Élodie habite à Marseille et moi à Nantes, mais nous nous appelons chaque dimanche. J'ai compris une chose : une vraie amitié, ce n'est pas une amitié sans disputes. C'est une amitié qui survit aux disputes.

    Camille
  translation: |
    I met Élodie on my first day at secondary school. I was the new girl in the class, I didn't know anyone and I was terribly shy. She sat down next to me and asked me if I liked cats. That's all. Since that day, we've been inseparable.

    Élodie is a frank person, who laughs loudly and gets angry quickly, but who forgets just as quickly. I'm rather reserved and a bit touchy. For years, our differences were no problem at all: on the contrary, we complemented each other.

    Then, five years ago, we had our first real argument. Élodie was getting married, and she had asked me to be her witness. A week before the wedding, I found out that I had to go on a work assignment to Canada, on exactly that date. I tried to change it, but it was impossible. When I told her, she got angry. She thought I hadn't really tried. I thought she was being unfair. We didn't speak to each other for eight months.

    It was her grandmother, a lady I adored, who brought us back together. One day, she invited me round for tea. When I arrived, Élodie was there, in the living room. We were both very embarrassed. Then her grandmother brought out an old photo album from our teenage holidays, and we burst out laughing. That day, we talked things through, and we both apologised.

    Today Élodie lives in Marseille and I live in Nantes, but we call each other every Sunday. I've understood one thing: a real friendship isn't a friendship without arguments. It's a friendship that survives arguments.

    Camille
  glossary: |
    l'entrée en sixième | starting secondary school | the first year of collège, at about 11
    ne plus se quitter | to be inseparable from then on
    complémentaire | complementary
    un témoin | a witness | at a French wedding, close friends sign the register as witnesses
    partir en mission | to go on a work assignment
    se mettre en colère | to get angry
    gêné | embarrassed; awkward | feminine: gênée
    éclater de rire | to burst out laughing
    survivre à | to survive (something) | survivre aux disputes
  questions: |
    mc: How did Camille and Élodie meet? || At university | *On their first day at secondary school | At a wedding || "Le jour de mon entrée en sixième" — the first year of collège.
    tf: Camille was Élodie's witness at her wedding. || false || She had to go to Canada for work on the date of the wedding.
    short: For how long did they not speak to each other? || kw: huit/8/eight || "Nous ne nous sommes pas parlé pendant huit mois."
    mc: Who helped them make up? || *Élodie's grandmother | Élodie's husband | Camille's colleague || "C'est sa grand-mère… qui nous a réconciliées."
    fill: Aujourd'hui, elles s'appellent chaque ___. || dimanche || "Nous nous appelons chaque dimanche."
    tf: For Camille, a real friendship is one without arguments. || false || "Ce n'est pas une amitié sans disputes. C'est une amitié qui survit aux disputes."

- slug: la-reunion-du-lundi
  kind: listening
  title: La réunion du lundi
  topic: Work and careers
  summary: Listen to a team meeting in which three colleagues plan their company's open day and share out the tasks.
  free: true
  speakers: N=Nadia/f; L=Léo/m; S=Sarah/f
  text: |
    N: Bonjour à tous, merci d'être là. Aujourd'hui, nous devons organiser la journée portes ouvertes du 15 juin.
    L: Le 15 juin ? Ce n'est pas un peu tôt ? Nous n'avons pas encore reçu les nouveaux catalogues.
    N: Je sais, mais la date est déjà fixée. Par conséquent, il faudrait commander les catalogues cette semaine. Léo, tu pourrais t'en occuper ?
    L: D'accord, je m'en occupe. Cependant, je ne suis pas sûr que l'imprimeur puisse les livrer en dix jours.
    S: Si c'est trop juste, on pourrait aussi préparer une version numérique. Les visiteurs la consulteraient sur une tablette.
    N: Bonne idée, Sarah. De plus, ce serait moins cher. Ensuite, il faut penser à l'accueil. Combien de personnes attendons-nous ?
    S: L'année dernière, nous avions eu environ deux cents visiteurs. Cette année, il y en aura sûrement plus, car nous avons fait beaucoup de publicité.
    N: Alors, il faudrait au moins quatre personnes à l'accueil. Sarah, tu pourrais faire un planning et l'envoyer à toute l'équipe ?
    S: Oui, je vous l'envoie d'ici mercredi.
    L: Et pour le repas ? On commande des plateaux, comme l'année dernière ?
    N: Non, les plateaux étaient chers et ils n'étaient pas très bons. Je propose qu'on demande au traiteur du quartier. Il fait des buffets avec des produits locaux.
    L: Très bien. Je l'appellerai demain matin pour avoir un devis.
    N: Parfait. Je récapitule : Léo s'occupe des catalogues et du traiteur, Sarah prépare le planning et la version numérique, et moi, je contacte les journalistes. On refait le point lundi prochain. Merci à tous !
  translation: |
    Nadia: Hello everyone, thanks for being here. Today we need to organise the open day on 15 June.
    Léo: 15 June? Isn't that a bit early? We haven't received the new catalogues yet.
    Nadia: I know, but the date has already been set. So we would need to order the catalogues this week. Léo, could you take care of it?
    Léo: OK, I'll take care of it. However, I'm not sure the printer can deliver them in ten days.
    Sarah: If it's too tight, we could also prepare a digital version. Visitors would look at it on a tablet.
    Nadia: Good idea, Sarah. And it would be cheaper. Next, we have to think about welcoming people. How many are we expecting?
    Sarah: Last year we had about two hundred visitors. This year there will surely be more, because we've done a lot of advertising.
    Nadia: Then we would need at least four people on the welcome desk. Sarah, could you make a rota and send it to the whole team?
    Sarah: Yes, I'll send it to you by Wednesday.
    Léo: And what about the food? Shall we order meal trays, like last year?
    Nadia: No, the trays were expensive and they weren't very good. I suggest we ask the local caterer. He does buffets with local produce.
    Léo: Very good. I'll call him tomorrow morning to get a quote.
    Nadia: Perfect. To sum up: Léo is in charge of the catalogues and the caterer, Sarah is preparing the rota and the digital version, and I'm contacting the journalists. We'll review things again next Monday. Thanks, everyone!
  glossary: |
    une journée portes ouvertes | an open day
    fixer une date | to set a date
    s'occuper de | to take care of | je m'en occupe = I'll take care of it
    un imprimeur | a printer (the company or person) | une imprimante = a printer (the machine)
    trop juste | too tight (for time)
    un planning | a schedule; a rota | pronounced [pla.niŋ]
    un traiteur | a caterer
    un devis | a quote; an estimate | demander un devis
    récapituler | to sum up | informal: faire un récap
  questions: |
    mc: When is the open day? || 5 June | *15 June | 25 June || "La journée portes ouvertes du 15 juin."
    tf: Léo is sure that the printer can deliver the catalogues in ten days. || false || "Je ne suis pas sûr que l'imprimeur puisse les livrer en dix jours."
    short: What does Sarah suggest in case the catalogues arrive late? || kw: numérique/digital/tablette/tablet/online || A digital version that visitors could look at on a tablet.
    mc: Why don't they want to order meal trays again? || *They were expensive and not very good. | The caterer has closed. | The visitors didn't like them. || "Les plateaux étaient chers et ils n'étaient pas très bons."
    fill: Nadia va contacter les ___. || journalistes || "Moi, je contacte les journalistes."
    mc: How many visitors came last year? || About fifty | *About two hundred | About four hundred || "Nous avions eu environ deux cents visiteurs."

- slug: retour-sur-les-bancs-de-l-ecole
  kind: reading
  title: Retour sur les bancs de l'école
  topic: Education and learning
  summary: Read the testimony of a care assistant who became a nurse at the age of 52 after going back to school.
  free: false
  text: |
    À cinquante-deux ans, Fatoumata Keïta a obtenu son diplôme d'infirmière. Elle raconte son parcours.

    « J'ai quitté l'école à dix-sept ans. À l'époque, mes parents avaient besoin d'argent et j'ai commencé à travailler dans un supermarché. Plus tard, je suis devenue aide-soignante dans un hôpital de Lille. J'aimais beaucoup mon métier, mais j'avais toujours un regret : je n'avais pas fait d'études.

    Un jour, une infirmière de mon service m'a dit : "Tu connais déjà tout le travail, il faut que tu deviennes infirmière !" J'ai ri. Je pensais que c'était trop tard. Mais l'idée est restée dans ma tête. Mon mari et mes enfants m'ont encouragée, et l'hôpital a accepté de financer ma formation.

    Les débuts ont été difficiles. J'étais la plus âgée de la promotion : certains étudiants avaient l'âge de mon fils ! Je n'avais pas ouvert un livre de biologie depuis trente ans, et je ne savais pas utiliser la plateforme en ligne de l'école. Le soir, je révisais à la table de la cuisine pendant que ma fille faisait ses devoirs à côté de moi. Nous nous aidions mutuellement : elle m'expliquait l'informatique, et moi, je l'aidais en anglais.

    Ce qui m'a sauvée, c'est mon expérience. En stage, je savais déjà parler aux patients et travailler en équipe. Les jeunes venaient me demander conseil, et ça me donnait confiance.

    Aujourd'hui, je suis infirmière dans le service où j'ai travaillé pendant quinze ans comme aide-soignante. Quand quelqu'un hésite à reprendre ses études, je lui dis : il vaut mieux essayer que regretter. Il faut que vous soyez patient avec vous-même, que vous demandiez de l'aide et que vous gardiez votre objectif en tête. L'âge n'est pas un obstacle : c'est souvent une force. »
  translation: |
    At fifty-two, Fatoumata Keïta has obtained her nursing diploma. She tells her story.

    "I left school at seventeen. At the time, my parents needed money and I started working in a supermarket. Later I became a care assistant in a hospital in Lille. I really liked my job, but I always had one regret: I hadn't studied.

    One day, a nurse on my ward said to me: 'You already know the whole job, you have to become a nurse!' I laughed. I thought it was too late. But the idea stayed in my head. My husband and my children encouraged me, and the hospital agreed to pay for my training.

    The beginning was hard. I was the oldest in my year: some students were my son's age! I hadn't opened a biology book for thirty years, and I didn't know how to use the school's online platform. In the evenings, I revised at the kitchen table while my daughter did her homework next to me. We helped each other: she explained computers to me, and I helped her with English.

    What saved me was my experience. On placements, I already knew how to talk to patients and work in a team. The young ones came to ask me for advice, and that gave me confidence.

    Today I'm a nurse on the ward where I worked for fifteen years as a care assistant. When someone is hesitating about going back to studying, I tell them: it's better to try than to regret it. You have to be patient with yourself, ask for help and keep your goal in mind. Age isn't an obstacle: it's often a strength."
  glossary: |
    reprendre ses études | to go back to studying
    une aide-soignante | a care assistant; a nursing assistant | masculine: un aide-soignant
    un service | a hospital ward or department | also: a service, a favour
    financer | to fund; to pay for
    la promotion | the year group (in higher education) | informal: la promo
    s'aider mutuellement | to help each other
    un stage | a work placement | en stage = on placement
    garder en tête | to keep in mind
    une force | a strength
  questions: |
    mc: Why did Fatoumata leave school at seventeen? || She had failed her exams. | *Her parents needed money. | She wanted to travel. || "Mes parents avaient besoin d'argent."
    tf: When a nurse told her to become a nurse, Fatoumata immediately believed it was possible. || false || She laughed: she thought it was too late.
    short: Who paid for her training? || kw: hôpital/hospital || "L'hôpital a accepté de financer ma formation."
    mc: How did Fatoumata and her daughter help each other? || *Her daughter explained computers; Fatoumata helped her with English. | They revised biology together. | Her daughter cooked while she studied. || "Elle m'expliquait l'informatique, et moi, je l'aidais en anglais."
    fill: Pour Fatoumata, l'âge n'est pas un obstacle, c'est souvent une ___. || force || "L'âge n'est pas un obstacle : c'est souvent une force."
    tf: Today she works as a nurse on the ward where she used to be a care assistant. || true || "Je suis infirmière dans le service où j'ai travaillé pendant quinze ans comme aide-soignante."

- slug: quarante-huit-heures-sans-internet
  kind: reading
  title: Quarante-huit heures sans internet
  topic: Media and technology
  summary: Read a local news story about a small town that lost its internet connection for two days — and what happened next.
  free: false
  text: |
    Mardi dernier, à neuf heures et quart, les quatre mille habitants de Val-Fleury, une petite ville du Jura, ont perdu internet. Une pelleteuse qui travaillait sur un chantier avait coupé un câble important. Pendant deux jours, plus de connexion : ni à la maison, ni dans les commerces, ni à la mairie.

    « Au début, j'ai cru que ma box était en panne », raconte Hélène, 38 ans, graphiste en télétravail. « J'avais redémarré trois fois avant de comprendre que tout le quartier était touché. » Comme beaucoup d'habitants, elle est allée travailler à la médiathèque de la ville voisine, qui avait encore du réseau.

    À la boulangerie, la situation était plus compliquée. « Les clients ne pouvaient plus payer par carte », explique le boulanger, Rachid Amrani. « Heureusement, j'avais gardé un vieux carnet. J'ai noté les noms, et tout le monde est revenu payer le lendemain ! »

    La mairie, elle, a dû s'adapter. Elle a installé un panneau d'affichage sur la place pour informer les habitants. On pouvait y lire que les techniciens travaillaient jour et nuit et que la connexion reviendrait jeudi.

    Mais la panne a aussi eu des effets inattendus. Les enfants ont joué dehors, des voisins qui ne s'étaient jamais parlé ont discuté sur le trottoir, et le café de la place n'avait jamais eu autant de monde. « Les gens venaient chercher des nouvelles, et ils restaient pour bavarder », s'amuse la patronne.

    Jeudi à midi, internet est revenu. Hélène avoue qu'elle était soulagée. « Mais je me suis rendu compte que je ne savais plus vivre sans écran. Depuis, j'ai décidé de passer une soirée par semaine sans téléphone. » Le café de la place, lui, espère que ses nouveaux clients reviendront… même avec le wifi.
  translation: |
    Last Tuesday, at a quarter past nine, the four thousand residents of Val-Fleury, a small town in the Jura, lost the internet. A digger working on a building site had cut an important cable. For two days there was no connection: not at home, not in the shops, not at the town hall.

    "At first I thought my router had broken down," says Hélène, 38, a graphic designer who works from home. "I had restarted it three times before I understood that the whole neighbourhood was affected." Like many residents, she went to work at the library in the next town, which still had a network.

    At the bakery, the situation was more complicated. "Customers couldn't pay by card any more," explains the baker, Rachid Amrani. "Luckily, I had kept an old notebook. I wrote down the names, and everyone came back to pay the next day!"

    The town hall had to adapt too. It put up a notice board on the square to keep residents informed. You could read on it that the technicians were working day and night and that the connection would be back on Thursday.

    But the outage also had unexpected effects. Children played outside, neighbours who had never spoken to each other chatted on the pavement, and the café on the square had never been so busy. "People came for news, and they stayed to chat," says the owner with a smile.

    On Thursday at noon, the internet came back. Hélène admits she was relieved. "But I realised that I didn't know how to live without a screen any more. Since then, I've decided to spend one evening a week without my phone." As for the café on the square, it hopes its new customers will come back… even with wifi.
  glossary: |
    une pelleteuse | a digger; an excavator
    un chantier | a building site; roadworks
    une box | an internet router | informal; from the boxes supplied by internet providers
    être touché | to be affected
    le réseau | the network; signal
    un panneau d'affichage | a notice board
    inattendu | unexpected
    bavarder | to chat
    être soulagé | to be relieved | feminine: soulagée
    se rendre compte | to realise | je me suis rendu compte (no agreement)
  questions: |
    mc: What caused the outage? || A storm | *A digger cut a cable on a building site. | A computer virus || "Une pelleteuse qui travaillait sur un chantier avait coupé un câble important."
    tf: At first, Hélène thought the problem was only with her own router. || true || "Au début, j'ai cru que ma box était en panne."
    short: How did the baker manage when customers couldn't pay by card? || kw: carnet/notebook/noms/names/lendemain/next day || He wrote the customers' names in an old notebook, and they came back to pay the next day.
    mc: How did the town hall keep residents informed? || By email | *With a notice board on the square | On local radio || "Elle a installé un panneau d'affichage sur la place."
    fill: Internet est revenu jeudi à ___. || midi || "Jeudi à midi, internet est revenu."
    tf: Since the outage, Hélène spends one evening a week without her phone. || true || "J'ai décidé de passer une soirée par semaine sans téléphone."

- slug: un-jardin-sur-le-toit
  kind: listening
  title: Un jardin sur le toit
  topic: City and environment
  summary: Listen to two neighbours discussing a project to create a garden on the roof of their building.
  free: false
  speakers: C=Claire/f; O=Omar/m
  text: |
    C: Bonjour, Omar ! Vous avez vu l'affiche dans le hall ? Le syndic propose de créer un jardin sur le toit de l'immeuble.
    O: Oui, je l'ai lue ce matin. Franchement, je trouve que c'est une excellente idée.
    C: Moi aussi, mais j'ai peur que ça coûte trop cher. Il faudrait que tous les propriétaires soient d'accord.
    O: D'après l'affiche, la mairie paierait la moitié des travaux. En végétalisant les toits, la ville veut lutter contre la chaleur en été.
    C: C'est vrai que l'été dernier, on ne pouvait pas dormir dans les appartements du dernier étage. Il faisait trente-cinq degrés la nuit !
    O: Exactement. Et en plantant des légumes, on pourrait aussi faire des économies. Moi, je rêve de cultiver mes propres tomates.
    C: Ha ! Je ne savais pas que vous aimiez jardiner.
    O: J'ai grandi à la campagne, au Maroc. Mon grand-père avait un grand potager, et je l'aidais en rentrant de l'école.
    C: Alors vous pourriez nous donner des conseils ! Moi, je ne sais même pas faire pousser du basilic.
    O: Avec plaisir. Et je suis sûr que les enfants de l'immeuble adoreraient participer.
    C: Oui, mais je ne voudrais pas que le toit devienne un terrain de jeu dangereux. Il faudrait installer des barrières solides.
    O: Bien sûr. On pourrait en parler à la réunion des propriétaires, jeudi soir. Vous y allez ?
    C: Oui, j'y serai. Je propose qu'on prépare quelques questions ensemble avant, pour être sûrs de ne rien oublier.
    O: Très bonne idée. Passez chez moi mercredi, je ferai du thé à la menthe… avec la menthe de mon balcon !
  translation: |
    Claire: Hello, Omar! Have you seen the poster in the entrance hall? The managing agent is proposing to create a garden on the roof of the building.
    Omar: Yes, I read it this morning. Honestly, I think it's an excellent idea.
    Claire: So do I, but I'm afraid it will cost too much. All the owners would have to agree.
    Omar: According to the poster, the town hall would pay half of the work. By putting plants on roofs, the city wants to fight the heat in summer.
    Claire: It's true that last summer, nobody could sleep in the top-floor flats. It was thirty-five degrees at night!
    Omar: Exactly. And by growing vegetables, we could save money too. I dream of growing my own tomatoes.
    Claire: Ha! I didn't know you liked gardening.
    Omar: I grew up in the countryside, in Morocco. My grandfather had a big vegetable garden, and I used to help him when I came home from school.
    Claire: Then you could give us some advice! I don't even know how to grow basil.
    Omar: With pleasure. And I'm sure the children in the building would love to take part.
    Claire: Yes, but I wouldn't want the roof to become a dangerous playground. We would need to put up strong fences.
    Omar: Of course. We could talk about it at the owners' meeting on Thursday evening. Are you going?
    Claire: Yes, I'll be there. I suggest we prepare a few questions together beforehand, to be sure we don't forget anything.
    Omar: Very good idea. Come round to my place on Wednesday, I'll make mint tea… with the mint from my balcony!
  glossary: |
    le syndic | the building's managing agent
    végétaliser | to green (a roof, a street) | la végétalisation
    lutter contre | to fight against
    le dernier étage | the top floor
    un potager | a vegetable garden
    faire pousser | to grow (plants)
    un terrain de jeu | a playground; a play area
    une barrière | a fence; a barrier
    la réunion des propriétaires | the owners' meeting | formally: l'assemblée générale de copropriété
  questions: |
    mc: What does the building's managing agent propose? || A new car park | *A garden on the roof | Solar panels || "Créer un jardin sur le toit de l'immeuble."
    tf: Claire is worried about the cost of the project. || true || "J'ai peur que ça coûte trop cher."
    short: According to the poster, who would pay half of the work? || kw: mairie/town hall/city/ville/council || "La mairie paierait la moitié des travaux."
    mc: Where did Omar learn to garden? || In Bordeaux | *At his grandfather's, in Morocco | At school || "Mon grand-père avait un grand potager, et je l'aidais en rentrant de l'école."
    fill: Claire voudrait installer des ___ solides sur le toit. || barrières || "Il faudrait installer des barrières solides."
    mc: When is the owners' meeting? || Wednesday evening | *Thursday evening | Friday evening || "À la réunion des propriétaires, jeudi soir." They will meet on Wednesday to prepare.

- slug: a-table
  kind: reading
  title: À table !
  topic: Health and lifestyle
  summary: Read an article about French mealtimes — what makes them special and how they are changing.
  free: false
  text: |
    En France, on ne plaisante pas avec les repas. Selon une étude internationale, les Français passent plus de deux heures par jour à manger et à boire, l'un des chiffres les plus élevés parmi les pays riches. Mais d'où vient cet attachement aux repas, et est-ce qu'il résiste au rythme de la vie moderne ?

    D'abord, les horaires sont assez réguliers : la plupart des Français déjeunent entre midi et quatorze heures et dînent vers vingt heures. Entre les repas, on grignote moins que dans d'autres pays, même si les habitudes changent. Pour les enfants, il existe un repas à part : le goûter, vers seize heures trente, souvent une tartine ou un fruit. Beaucoup d'adultes s'en souviennent avec nostalgie !

    Ensuite, le repas est un moment social. On mange rarement seul devant son écran — en tout cas, on essaie. Le dimanche, de nombreuses familles se retrouvent pour un long déjeuner qui peut durer tout l'après-midi. Et avant le dîner, entre amis, il y a l'apéritif, ou l'apéro, avec des boissons et quelque chose à grignoter. Si on vous y invite, apportez une bouteille ou un dessert : vos hôtes vous en seront reconnaissants.

    Mais tout n'est pas si simple. Avec des pauses déjeuner plus courtes, beaucoup de salariés mangent un sandwich en vingt minutes, parfois devant leur ordinateur. Les plats tout prêts et la livraison à domicile ont aussi gagné du terrain, surtout chez les jeunes. Les médecins s'en inquiètent, car manger vite et seul, c'est souvent manger moins bien.

    Alors, la tradition est-elle en danger ? Pas forcément. Les marchés restent très fréquentés, les cours de cuisine sont à la mode et beaucoup de jeunes parents veulent transmettre le goût du « fait maison ». Le repas à la française change, mais les Français y restent profondément attachés.
  translation: |
    In France, meals are taken seriously. According to an international study, the French spend more than two hours a day eating and drinking, one of the highest figures among rich countries. But where does this attachment to meals come from, and can it survive the pace of modern life?

    First, mealtimes are fairly regular: most French people have lunch between noon and two and dinner around eight. Between meals, people snack less than in other countries, even if habits are changing. For children, there is a separate meal: le goûter, at around half past four, often a slice of bread with butter or jam, or a piece of fruit. Many adults remember it with nostalgia!

    Next, a meal is a social moment. People rarely eat alone in front of a screen — or at least, they try not to. On Sundays, many families get together for a long lunch that can last all afternoon. And before dinner, among friends, there's the apéritif, or apéro, with drinks and something to nibble. If you're invited to one, bring a bottle or a dessert: your hosts will be grateful.

    But it's not all that simple. With shorter lunch breaks, many employees eat a sandwich in twenty minutes, sometimes in front of their computer. Ready meals and home delivery have also gained ground, especially among young people. Doctors are worried about it, because eating quickly and alone often means eating less well.

    So is the tradition in danger? Not necessarily. Markets are still very busy, cookery classes are fashionable and many young parents want to pass on a taste for home-made food. The French meal is changing, but the French remain deeply attached to it.
  glossary: |
    on ne plaisante pas avec… | … is taken very seriously | literally: you don't joke about…
    grignoter | to snack; to nibble
    le goûter | the afternoon snack | for children, at about 4.30 p.m.
    une tartine | a slice of bread with butter, jam or spread
    l'apéro | pre-dinner drinks and nibbles | short for l'apéritif
    un hôte | a host | can also mean a guest
    reconnaissant | grateful | feminine: reconnaissante
    les plats tout prêts | ready meals
    gagner du terrain | to gain ground
    être attaché à | to be attached to | y être attaché = to be attached to it
  questions: |
    mc: When do most French people have lunch, according to the article? || Between 11 a.m. and noon | *Between noon and 2 p.m. | After 2 p.m. || "La plupart des Français déjeunent entre midi et quatorze heures."
    tf: Le goûter is a meal for adults at work. || false || It's a separate meal for children, at around 4.30 p.m.
    short: What should you bring if you're invited to an apéro? || kw: bouteille/bottle/dessert || "Apportez une bouteille ou un dessert."
    mc: Why are doctors worried? || *Eating quickly and alone often means eating less well. | People eat too many vegetables. | Markets are closing. || "Manger vite et seul, c'est souvent manger moins bien."
    fill: Les ___ restent très fréquentés. || marchés || "Les marchés restent très fréquentés."
    tf: According to the article, the French meal tradition is disappearing completely. || false || "Pas forcément." The meal is changing, but the French remain deeply attached to it.

- slug: au-club-de-course
  kind: listening
  title: Au club de course
  topic: Health and lifestyle
  summary: Listen to a new member's first evening at a running club, where the coach explains how the sessions work.
  free: false
  speakers: B=Bastien/m; E=Emma/f
  text: |
    B: Bonsoir ! Vous êtes nouvelle ? Je suis Bastien, l'entraîneur du club.
    E: Bonsoir, je m'appelle Emma. Je me suis inscrite en ligne la semaine dernière, mais je n'ai jamais couru en club.
    B: Pas de problème, vous êtes au bon endroit. Vous courez depuis longtemps ?
    E: Depuis six mois, à peu près. J'en fais deux fois par semaine, toute seule, le long du canal.
    B: Très bien. Et pourquoi est-ce que vous avez voulu rejoindre un club ?
    E: Je voudrais progresser, et seule, j'ai du mal à rester motivée. Mon médecin me l'a conseillé aussi, pour mon dos.
    B: Vous avez apporté votre certificat médical ?
    E: Oui, je l'ai. Je vous le donne maintenant ?
    B: Donnez-le-moi à la fin de la séance. On commence toujours par un échauffement de quinze minutes. Ne le sautez jamais, c'est important.
    E: D'accord. Et ensuite ?
    B: Ce soir, on fait du fractionné : une minute vite, une minute lentement, dix fois. Si c'est trop dur, ralentissez. Personne ne vous jugera.
    E: Du fractionné ? J'en ai entendu parler, mais je n'en ai jamais fait.
    B: Vous verrez, c'est très efficace. Et vos chaussures, elles sont adaptées à la course ?
    E: Je crois. Je les ai achetées dans un magasin de sport, et le vendeur me les a recommandées.
    B: Parfait. Dernière chose : le dimanche matin, il y a une sortie longue dans la forêt. Venez avec nous, c'est le meilleur moment de la semaine !
    E: Avec plaisir. Je ne connais personne ici, c'est une bonne occasion de rencontrer les autres.
    B: Allez, rejoignez le groupe. On y va !
  translation: |
    Bastien: Good evening! Are you new? I'm Bastien, the club's coach.
    Emma: Good evening, my name's Emma. I signed up online last week, but I've never run with a club.
    Bastien: No problem, you're in the right place. Have you been running for long?
    Emma: For about six months. I go twice a week, on my own, along the canal.
    Bastien: Very good. And why did you want to join a club?
    Emma: I'd like to improve, and on my own I find it hard to stay motivated. My doctor recommended it too, for my back.
    Bastien: Have you brought your medical certificate?
    Emma: Yes, I've got it. Shall I give it to you now?
    Bastien: Give it to me at the end of the session. We always start with a fifteen-minute warm-up. Never skip it, it's important.
    Emma: OK. And then?
    Bastien: Tonight we're doing intervals: one minute fast, one minute slow, ten times. If it's too hard, slow down. Nobody will judge you.
    Emma: Intervals? I've heard of them, but I've never done any.
    Bastien: You'll see, it's very effective. And your shoes — are they suitable for running?
    Emma: I think so. I bought them in a sports shop, and the shop assistant recommended them to me.
    Bastien: Perfect. One last thing: on Sunday mornings there's a long run in the forest. Come with us, it's the best moment of the week!
    Emma: With pleasure. I don't know anyone here, it's a good chance to meet the others.
    Bastien: Right, join the group. Let's go!
  glossary: |
    un entraîneur | a coach; a trainer | feminine: une entraîneuse
    rejoindre | to join
    avoir du mal à | to find it hard to
    un certificat médical | a medical certificate | often required to join a sports club
    un échauffement | a warm-up
    sauter | to skip | also: to jump
    le fractionné | interval training
    ralentir | to slow down
    une sortie longue | a long run
  questions: |
    mc: How long has Emma been running? || Two months | *About six months | Two years || "Depuis six mois, à peu près."
    tf: Emma has already done interval training. || false || "J'en ai entendu parler, mais je n'en ai jamais fait."
    short: Why did Emma's doctor recommend running? || kw: dos/back || "Mon médecin me l'a conseillé aussi, pour mon dos."
    mc: When should Emma give the coach her medical certificate? || *At the end of the session | Before the warm-up | On Sunday morning || "Donnez-le-moi à la fin de la séance."
    fill: Le dimanche matin, il y a une sortie longue dans la ___. || forêt || "Une sortie longue dans la forêt."
    mc: Who recommended Emma's shoes? || Her doctor | *A shop assistant | Bastien || "Le vendeur me les a recommandées."

- slug: le-parapluie-jaune
  kind: reading
  title: Le parapluie jaune
  topic: Culture and entertainment
  summary: Read a short story about a rainy morning, a yellow umbrella and an unexpected meeting at a Lyon market.
  free: false
  text: |
    Ce matin-là, il pleuvait sur Lyon depuis des heures. Lucie attendait le tram avec son vieux parapluie jaune, celui que sa grand-mère lui avait offert pour ses dix-huit ans. Elle était en retard, comme d'habitude, et elle pensait à la réunion qui l'attendait au bureau.

    Le tram est arrivé, plein à craquer. Lucie est montée, a refermé son parapluie et s'est serrée contre la vitre. À l'arrêt suivant, un homme d'une soixantaine d'années est entré. Il était trempé et il avait l'air perdu. Il regardait le plan des lignes sans rien comprendre. Lucie lui a demandé s'il avait besoin d'aide. Il lui a répondu, avec un fort accent italien, qu'il cherchait l'hôpital où sa fille venait d'accoucher.

    Lucie lui a expliqué où il fallait descendre. Puis, sans vraiment réfléchir, elle lui a tendu son parapluie. « Prenez-le, il pleut encore beaucoup. » L'homme a hésité, puis il l'a accepté avec un grand sourire. Il est descendu deux arrêts plus loin, et Lucie l'a regardé s'éloigner sous la tache jaune du parapluie.

    Elle est arrivée au bureau mouillée et en retard : la réunion avait déjà commencé. Mais, curieusement, elle est restée de bonne humeur toute la journée.

    Trois mois plus tard, un samedi, elle se promenait au marché de la Croix-Rousse quand elle a aperçu quelque chose de jaune. C'était son parapluie ! Il était accroché au stand d'un marchand de fruits et légumes. Derrière le stand, le vieil homme du tram l'a reconnue tout de suite. « Signorina ! Je vous ai cherchée partout ! » Il lui a présenté sa fille, et un bébé qui dormait dans une poussette. La petite s'appelait Lucia.

    Giuseppe a voulu lui rendre le parapluie, mais Lucie a refusé : « Gardez-le pour Lucia. Il porte bonheur. » Depuis ce jour, Lucie fait ses courses chaque samedi au stand de Giuseppe. Et quand il pleut, le parapluie jaune est toujours là, accroché au-dessus des tomates.
  translation: |
    That morning, it had been raining on Lyon for hours. Lucie was waiting for the tram with her old yellow umbrella, the one her grandmother had given her for her eighteenth birthday. She was late, as usual, and she was thinking about the meeting waiting for her at the office.

    The tram arrived, packed full. Lucie got on, closed her umbrella and squeezed against the window. At the next stop, a man of about sixty got on. He was soaked and looked lost. He was staring at the network map without understanding anything. Lucie asked him if he needed help. He answered, with a strong Italian accent, that he was looking for the hospital where his daughter had just given birth.

    Lucie explained where he needed to get off. Then, without really thinking, she held out her umbrella to him. "Take it, it's still raining hard." The man hesitated, then accepted it with a big smile. He got off two stops later, and Lucie watched him walk away under the yellow patch of the umbrella.

    She arrived at the office wet and late: the meeting had already started. But, strangely, she stayed in a good mood all day.

    Three months later, one Saturday, she was walking around the Croix-Rousse market when she spotted something yellow. It was her umbrella! It was hanging on a fruit and vegetable stall. Behind the stall, the old man from the tram recognised her immediately. "Signorina! I've been looking for you everywhere!" He introduced her to his daughter, and to a baby asleep in a pushchair. The little girl's name was Lucia.

    Giuseppe wanted to give the umbrella back, but Lucie refused: "Keep it for Lucia. It brings good luck." Since that day, Lucie has done her shopping every Saturday at Giuseppe's stall. And when it rains, the yellow umbrella is always there, hanging above the tomatoes.
  glossary: |
    plein à craquer | packed; full to bursting
    se serrer contre | to squeeze up against
    accoucher | to give birth
    tendre | to hold out; to hand (something to someone)
    s'éloigner | to move away
    une tache | a spot; a patch (of colour) | also: a stain
    mouillé | wet | feminine: mouillée
    accroché | hanging; hooked | feminine: accrochée
    une poussette | a pushchair; a stroller
    porter bonheur | to bring good luck
  questions: |
    mc: Who had given Lucie the yellow umbrella? || Her mother | *Her grandmother | A colleague || "Celui que sa grand-mère lui avait offert pour ses dix-huit ans."
    tf: The man on the tram was going to the hospital because his daughter had just had a baby. || true || "Il cherchait l'hôpital où sa fille venait d'accoucher."
    short: Why did Lucie give the man her umbrella? || kw: pleu/rain/trempé/wet/soaked || It was still raining hard, and he was soaked.
    mc: Where did Lucie see her umbrella again? || On the tram | *On a market stall | At the hospital || "Il était accroché au stand d'un marchand de fruits et légumes."
    fill: La petite fille de la fille de Giuseppe s'appelait ___. || Lucia || "La petite s'appelait Lucia."
    tf: At the end, Lucie takes her umbrella back. || false || She refuses: "Gardez-le pour Lucia. Il porte bonheur."

- slug: lettre-de-lille
  kind: reading
  title: Lettre de Lille
  topic: Society and travel
  summary: Read a letter from a Spanish exchange student in Lille about culture shocks, customs and stereotypes.
  free: false
  text: |
    Lille, le 12 février

    Chère Carmen,

    Ça fait déjà cinq mois que je suis à Lille, et je t'écris enfin en français, comme promis ! Tu me demandes si je suis heureuse ici : oui, vraiment, même si le ciel est souvent gris.

    Au début, j'ai vécu quelques petits chocs culturels. Le premier, c'était l'heure du dîner. Le premier soir, ma colocataire m'a annoncé que le repas était prêt… à dix-neuf heures trente ! À Séville, à cette heure-là, on n'a même pas fini le goûter. Maintenant, je m'y suis habituée, mais j'ai toujours faim vers vingt-trois heures.

    Le deuxième choc, c'est le « bonjour ». Ici, quand on entre dans une boulangerie ou dans une salle d'attente, il faut dire bonjour à tout le monde. Un jour, j'ai oublié, et la boulangère m'a regardée comme si j'étais très mal élevée ! Depuis, je dis bonjour même dans l'ascenseur.

    Et puis il y a les clichés. Mes amis français pensent que les Espagnols font la fête toute la nuit et ne travaillent jamais. Je leur réponds que si c'était vrai, l'Espagne ne fonctionnerait pas ! Moi aussi, j'avais des préjugés : je croyais que les gens du Nord étaient froids. En réalité, les Lillois sont d'une gentillesse incroyable. Ma voisine m'a invitée à un repas de famille dès la deuxième semaine, et on s'est fait la bise comme si on se connaissait depuis toujours.

    Si tu venais me voir au printemps, je te ferais découvrir le Vieux-Lille et ses estaminets. Je t'emmènerais aussi à la braderie… non, attends, elle a lieu en septembre ! Alors, viens deux fois !

    Je t'embrasse très fort,
    Nuria
  translation: |
    Lille, 12 February

    Dear Carmen,

    I've already been in Lille for five months, and I'm finally writing to you in French, as promised! You ask me if I'm happy here: yes, really, even if the sky is often grey.

    At first I had a few little culture shocks. The first was dinner time. On the first evening, my flatmate told me dinner was ready… at half past seven! In Seville, at that time, we haven't even finished our afternoon snack. Now I've got used to it, but I'm always hungry around eleven at night.

    The second shock is the "bonjour". Here, when you walk into a bakery or a waiting room, you have to say hello to everyone. One day I forgot, and the baker looked at me as if I were very rude! Since then, I say hello even in the lift.

    And then there are the clichés. My French friends think that Spanish people party all night and never work. I tell them that if that were true, Spain wouldn't function! I had prejudices too: I thought people from the north were cold. In fact, the people of Lille are incredibly kind. My neighbour invited me to a family meal in my second week, and we kissed on the cheek as if we had known each other forever.

    If you came to see me in the spring, I'd show you Old Lille and its estaminets. I'd also take you to the braderie… no, wait, it takes place in September! So come twice!

    Lots of love,
    Nuria
  glossary: |
    un choc culturel | a culture shock
    une colocataire | a flatmate | informal: une coloc
    mal élevé | rude; badly brought up | feminine: mal élevée
    un préjugé | a prejudice; a preconception
    d'une gentillesse incroyable | incredibly kind
    dès | from; as early as | dès la deuxième semaine
    un estaminet | a traditional café-restaurant in northern France
    la braderie | a huge street market and flea market | Lille's braderie takes place in early September
    je t'embrasse | lots of love (end of a letter) | informal
  questions: |
    mc: What was Nuria's first culture shock? || The weather | *The early dinner time | The price of food || "Le premier, c'était l'heure du dîner."
    tf: Nuria still often forgets to say bonjour when she enters a shop. || false || Since the incident at the bakery, she says bonjour even in the lift.
    short: What do Nuria's French friends think about Spanish people? || kw: fête/party/parties/travaill/work || They think Spanish people party all night and never work.
    mc: What did Nuria think about people from the north before she arrived? || *That they were cold | That they were very funny | That they ate late || "Je croyais que les gens du Nord étaient froids."
    fill: La braderie de Lille a lieu en ___. || septembre || "Elle a lieu en septembre."
    tf: Nuria's neighbour invited her to a family meal in her second week. || true || "Ma voisine m'a invitée à un repas de famille dès la deuxième semaine."

- slug: et-si-on-partait-en-train
  kind: listening
  title: Et si on partait en train ?
  topic: Society and travel
  summary: Listen to a couple weighing up the plane and the train for a long weekend in Barcelona.
  free: false
  speakers: A=Amandine/f; J=Julien/m
  text: |
    A: Tu as regardé les billets d'avion pour Barcelone ? On avait dit qu'on réservait ce soir.
    J: Oui, mais j'ai une autre idée. Et si on y allait en train ?
    A: En train ? Ça prendrait combien de temps ?
    J: Environ six heures et demie depuis Paris, et c'est direct. L'avion, c'est une heure et demie, mais si on comptait le trajet jusqu'à l'aéroport et l'attente, on arriverait presque à la même heure.
    A: Hum… Ce serait plus cher, non ?
    J: Pas forcément. Si on réservait maintenant, on trouverait des billets à un prix correct. Et on n'aurait pas besoin de payer les bagages en plus.
    A: C'est vrai. Et puis, je culpabilise toujours un peu quand je prends l'avion pour un week-end.
    J: Moi aussi. Et dans le train, on pourrait lire, regarder le paysage, jouer aux cartes…
    A: Ou travailler ! Si je finissais mon rapport dans le train, je serais vraiment en vacances en arrivant.
    J: Exactement. Et si on passait une nuit à Montpellier sur le chemin ? On visiterait la ville et on repartirait le lendemain matin.
    A: Ce serait sympa, mais on n'a que cinq jours. Si on s'arrêtait en route, il nous resterait seulement trois jours à Barcelone.
    J: Alors, on s'arrête au retour ? Comme ça, les vacances dureraient un peu plus longtemps.
    A: D'accord, je suis convaincue. Mais à une condition : c'est toi qui réserves les billets, et c'est moi qui choisis les restaurants !
    J: Marché conclu !
  translation: |
    Amandine: Have you looked at the plane tickets to Barcelona? We said we'd book this evening.
    Julien: Yes, but I've got another idea. How about going by train?
    Amandine: By train? How long would it take?
    Julien: About six and a half hours from Paris, and it's direct. The plane takes an hour and a half, but if you counted the journey to the airport and the waiting, we'd arrive at almost the same time.
    Amandine: Hmm… It would be more expensive, wouldn't it?
    Julien: Not necessarily. If we booked now, we'd find tickets at a reasonable price. And we wouldn't have to pay extra for luggage.
    Amandine: That's true. And I always feel a bit guilty when I fly for a weekend.
    Julien: Me too. And on the train we could read, look at the scenery, play cards…
    Amandine: Or work! If I finished my report on the train, I'd really be on holiday when we arrived.
    Julien: Exactly. And how about spending a night in Montpellier on the way? We'd visit the town and set off again the next morning.
    Amandine: That would be nice, but we've only got five days. If we stopped on the way, we'd only have three days left in Barcelona.
    Julien: So shall we stop on the way back? That way, the holiday would last a little longer.
    Amandine: OK, I'm convinced. But on one condition: you book the tickets, and I choose the restaurants!
    Julien: It's a deal!
  glossary: |
    réserver | to book
    direct | direct (with no change) | un train direct
    compter | to count; to include
    l'attente | the wait | une salle d'attente = a waiting room
    les bagages | luggage
    culpabiliser | to feel guilty
    le paysage | the landscape; the scenery
    en route | on the way | also: sur le chemin
    convaincu | convinced | feminine: convaincue
    marché conclu ! | it's a deal!
  questions: |
    mc: Where do Amandine and Julien want to go? || Montpellier | *Barcelona | Madrid || "Les billets d'avion pour Barcelone."
    tf: According to Julien, the train journey from Paris takes about an hour and a half. || false || About six and a half hours; it's the flight that takes an hour and a half.
    short: What would Amandine like to do on the train? || kw: rapport/report/travailler/work || "Si je finissais mon rapport dans le train, je serais vraiment en vacances en arrivant."
    mc: Why doesn't Amandine want to stop in Montpellier on the way there? || *They would only have three days left in Barcelona. | It's too expensive. | She doesn't like Montpellier. || "Il nous resterait seulement trois jours à Barcelone."
    fill: C'est Julien qui réserve les billets, et c'est Amandine qui choisit les ___. || restaurants || "C'est moi qui choisis les restaurants !"
    mc: When will they stop in Montpellier? || On the way there | *On the way back | They won't stop at all || "Alors, on s'arrête au retour ?" — Amandine agrees.
