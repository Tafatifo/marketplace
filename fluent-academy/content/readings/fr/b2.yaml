- slug: le-prenom-de-ma-fille
  kind: reading
  title: Le prénom de ma fille
  topic: Identity and society
  summary: Read a personal column in which a mother tells how she and her partner chose a first name that works in both their languages and families.
  free: true
  text: |
    Quand j'ai appris que j'étais enceinte, je pensais que le plus difficile serait l'accouchement. Je me trompais : le plus difficile, ça a été de choisir un prénom.

    Mon compagnon, Minh, est né à Hô Chi Minh-Ville et il est arrivé en France à dix ans. Moi, je suis née à Angers, dans une famille où l'on s'appelle Jean, Marie ou Philippe depuis des générations. Nous voulions un prénom qui fonctionne dans nos deux langues, qui soit facile à prononcer pour nos deux familles et qui ne fasse pas sourire à l'école. Autant dire une mission impossible.

    Nous avons d'abord fait des listes. Minh proposait des prénoms vietnamiens magnifiques, mais je doutais que mes grands-parents arrivent à les prononcer correctement. Je proposais des prénoms français classiques, mais sa mère trouvait qu'ils ne voulaient rien dire. Car en vietnamien, un prénom a presque toujours un sens : une fleur, une qualité, un souhait pour l'enfant.

    Les avis de la famille n'ont rien arrangé. Ma grand-mère voulait absolument « un prénom de saint ». Mon beau-père, lui, nous a rappelé qu'il fallait aussi penser au deuxième prénom, celui qu'on donne en l'honneur des ancêtres. Et ma meilleure amie m'a conseillé d'éviter tout prénom à la mode, de peur que notre fille se retrouve avec trois camarades portant le même nom dans sa classe.

    Bien que nous ayons hésité pendant des mois, la solution est venue d'un détail. Un soir, Minh m'a expliqué que « Lan » signifiait « orchidée » en vietnamien. Le mot était court, doux, facile à dire à Angers comme à Hô Chi Minh-Ville. Il nous a semblé que c'était le seul prénom qui puisse réunir nos deux histoires. Nous avons ajouté un deuxième prénom, Jeanne, comme mon arrière-grand-mère.

    Aujourd'hui, Lan a six ans. Elle trouve tout à fait normal d'avoir deux prénoms venus de deux pays différents, et elle explique fièrement à ses camarades ce que veut dire le premier. Quand on lui demande d'où elle vient, elle répond simplement : « De chez moi. » Je ne suis pas sûre qu'il existe une meilleure réponse.
  translation: |
    When I found out I was pregnant, I thought the hardest part would be giving birth. I was wrong: the hardest part was choosing a first name.

    My partner, Minh, was born in Ho Chi Minh City and came to France when he was ten. I was born in Angers, into a family where people have been called Jean, Marie or Philippe for generations. We wanted a name that would work in both our languages, that would be easy to pronounce for both our families and that wouldn't make people smile at school. A mission impossible, in other words.

    First we made lists. Minh suggested beautiful Vietnamese names, but I doubted my grandparents would manage to pronounce them correctly. I suggested classic French names, but his mother felt they didn't mean anything. Because in Vietnamese, a first name almost always has a meaning: a flower, a quality, a wish for the child.

    The family's opinions didn't help. My grandmother absolutely wanted "a saint's name". My father-in-law reminded us that we also had to think about the middle name, the one given in honour of the ancestors. And my best friend advised me to avoid any fashionable name, for fear that our daughter would end up with three classmates with the same name.

    Although we hesitated for months, the solution came from a detail. One evening, Minh explained that "Lan" meant "orchid" in Vietnamese. The word was short, soft, easy to say in Angers as well as in Ho Chi Minh City. It seemed to us that it was the only name that could bring our two stories together. We added a middle name, Jeanne, after my great-grandmother.

    Today Lan is six. She finds it perfectly normal to have two names that come from two different countries, and she proudly explains to her classmates what the first one means. When people ask her where she comes from, she simply answers: "From home." I'm not sure there is a better answer.
  glossary: |
    enceinte | pregnant | an adjective used only in the feminine
    l'accouchement | childbirth; delivery
    un compagnon | a partner | feminine: une compagne
    autant dire | in other words; you might as well say
    un beau-père | a father-in-law; a stepfather | here, Minh's father
    un prénom à la mode | a fashionable first name
    un ancêtre | an ancestor
    réunir | to bring together; to unite
  questions: |
    mc: Where was Minh born? || In Angers | *In Ho Chi Minh City | In Hanoi || "Minh est né à Hô Chi Minh-Ville et il est arrivé en France à dix ans."
    tf: The narrator thought her grandparents would easily pronounce Vietnamese names. || false || "Je doutais que mes grands-parents arrivent à les prononcer correctement."
    short: What does "Lan" mean in Vietnamese? || kw: orchidée/orchid || "« Lan » signifiait « orchidée » en vietnamien."
    mc: Why did the narrator's best friend advise against a fashionable name? || *So that the girl wouldn't have several classmates with the same name | Because fashionable names are hard to spell | Because the grandparents disliked them || "De peur que notre fille se retrouve avec trois camarades portant le même nom."
    fill: Le deuxième prénom de Lan est ___, comme l'arrière-grand-mère de sa mère. || Jeanne || "Nous avons ajouté un deuxième prénom, Jeanne, comme mon arrière-grand-mère."
    tf: In Vietnamese, a first name almost always has a meaning. || true || "En vietnamien, un prénom a presque toujours un sens."

- slug: au-vide-grenier
  kind: listening
  title: Au vide-grenier
  topic: Work and the economy
  summary: Listen to a buyer and a seller bargaining over a vintage lamp, two cups and an old cookbook at a village car-boot sale.
  free: true
  speakers: L=Léandre/m; J=Josiane/f
  text: |
    L: Bonjour madame. Elle est à combien, cette lampe ?
    J: Bonjour ! Celle-là, je la vends trente euros. C'est une lampe des années soixante, et elle fonctionne parfaitement.
    L: Trente euros… Elle est belle, mais j'avoue que j'aurais préféré un prix un peu plus doux. L'abat-jour est taché, là, sur le côté.
    J: Ah oui, je ne l'avais pas vu. Bon, je pourrais vous la faire à vingt-cinq.
    L: Et si je vous prends aussi les deux tasses à café, vous me feriez un prix pour l'ensemble ?
    J: Les tasses, c'est cinq euros chacune. Pour le tout, disons trente-deux euros.
    L: J'aurais plutôt pensé à vingt-cinq pour le tout. Vous savez, je viens d'emménager, et je meuble mon appartement avec un tout petit budget.
    J: Vingt-cinq, ce serait vraiment trop peu. Mon mari aurait même voulu garder cette lampe ! Il ne voulait pas que je la vende.
    L: Je comprends. Alors je vous propose vingt-huit euros, à condition que vous me laissiez aussi ce vieux livre de cuisine.
    J: Ce livre-là ? Il appartenait à ma mère… Mais bon, à quoi ça sert qu'il reste dans un carton ?
    L: Il date de quand, ce livre ?
    J: De 1958, je crois. Il y a même des notes écrites à la main dans la marge. D'accord, je vous le laisse, à condition que vous en preniez soin.
    L: Promis, je cuisinerai ses recettes. Est-ce que vous prenez la carte bancaire ?
    J: Ah non, ici c'est uniquement en liquide. Il y a un distributeur à côté de la boulangerie, si vous voulez.
    L: Pas besoin, j'ai ce qu'il faut. Voilà trente euros.
    J: Et voilà votre monnaie : deux euros. Attendez, je vous emballe la lampe dans du papier journal, sinon elle risque de se casser.
    L: Merci beaucoup. Vous êtes là tous les ans ?
    J: Tous les ans, le premier dimanche de mai. J'aurais dû arriver plus tôt ce matin pour faire un tour moi aussi : à sept heures, les meilleures affaires des autres stands étaient déjà parties !
    L: Alors à l'année prochaine. Et dites à votre mari que sa lampe sera entre de bonnes mains.
    J: Je n'y manquerai pas. Bonne journée, et bonne installation !
  translation: |
    Léandre: Hello, madam. How much is this lamp?
    Josiane: Hello! That one I'm selling for thirty euros. It's a lamp from the sixties, and it works perfectly.
    Léandre: Thirty euros… It's lovely, but I must admit I'd have preferred a slightly gentler price. The lampshade is stained, there, on the side.
    Josiane: Oh yes, I hadn't noticed. Well, I could let you have it for twenty-five.
    Léandre: And if I also take the two coffee cups, would you give me a price for the lot?
    Josiane: The cups are five euros each. For everything, let's say thirty-two euros.
    Léandre: I was thinking more of twenty-five for everything. You see, I've just moved in, and I'm furnishing my flat on a very small budget.
    Josiane: Twenty-five would really be too little. My husband would even have liked to keep that lamp! He didn't want me to sell it.
    Léandre: I understand. Then I'll offer you twenty-eight euros, provided you also let me have that old cookbook.
    Josiane: That book? It belonged to my mother… But still, what's the point of it staying in a box?
    Léandre: How old is the book?
    Josiane: From 1958, I think. There are even handwritten notes in the margin. All right, you can have it, provided you take care of it.
    Léandre: I promise, I'll cook her recipes. Do you take cards?
    Josiane: Oh no, here it's cash only. There's a cash machine next to the bakery, if you like.
    Léandre: No need, I've got enough. Here's thirty euros.
    Josiane: And here's your change: two euros. Wait, I'll wrap the lamp in newspaper for you, otherwise it might break.
    Léandre: Thank you very much. Are you here every year?
    Josiane: Every year, on the first Sunday in May. I should have come earlier this morning to have a look round myself: at seven o'clock, the best bargains on the other stalls had already gone!
    Léandre: See you next year, then. And tell your husband his lamp will be in good hands.
    Josiane: I certainly will. Have a nice day, and good luck settling in!
  glossary: |
    un vide-grenier | a car-boot sale; a flea market | literally "attic-emptier"
    un prix plus doux | a lower price | informal
    un abat-jour | a lampshade | plural: des abat-jour
    faire un prix | to give a discount
    pour l'ensemble / pour le tout | for everything together
    emménager | to move in
    en liquide | in cash
    la monnaie | change (money)
    être entre de bonnes mains | to be in good hands
  questions: |
    mc: What was the starting price of the lamp? || Twenty-five euros | *Thirty euros | Thirty-two euros || "Celle-là, je la vends trente euros."
    tf: Josiane had noticed the stain on the lampshade before Léandre mentioned it. || false || "Ah oui, je ne l'avais pas vu."
    short: What extra item does Léandre ask for to agree on twenty-eight euros? || kw: livre/book/cookbook/cuisine/recettes || "À condition que vous me laissiez aussi ce vieux livre de cuisine."
    mc: How does Léandre pay? || By card | *In cash | By bank transfer || "Ici c'est uniquement en liquide… — Pas besoin, j'ai ce qu'il faut."
    fill: Le vide-grenier a lieu tous les ans le premier dimanche de ___. || mai || "Tous les ans, le premier dimanche de mai."
    mc: What does Josiane regret? || *Not arriving early enough to look round the other stalls | Selling her husband's lamp | Not accepting cards || "J'aurais dû arriver plus tôt… les meilleures affaires des autres stands étaient déjà parties !"

- slug: le-bureau-au-bout-du-chemin
  kind: reading
  title: Le bureau au bout du chemin
  topic: Work and the economy
  summary: Read a report on a coworking space that has opened in a former village school in the Ardèche, and on what it has changed for the village.
  free: false
  text: |
    Dans ce village ardéchois de quatre cents habitants, l'ancienne école était fermée depuis quinze ans. Aujourd'hui, ses deux salles de classe accueillent un espace de travail partagé : une douzaine de bureaux, une connexion à très haut débit, une cuisine commune et une vue imprenable sur les châtaigniers.

    « Au début, personne n'y croyait, raconte Mathieu Ferrer, l'un des fondateurs. Les habitants se demandaient qui viendrait travailler ici. » Ils sont aujourd'hui une vingtaine à se partager les lieux : une traductrice, deux développeurs, un architecte, une comptable, mais aussi des salariés d'entreprises lyonnaises ou parisiennes qui ne se rendent au siège qu'une ou deux fois par mois.

    Parmi eux, Laura, 34 ans, cheffe de projet dans une banque. « Avant, je passais trois heures par jour dans les transports. Si on m'avait dit que je travaillerais un jour face à la montagne, je ne l'aurais pas cru. Avec le recul, j'aurais dû partir bien plus tôt. »

    Pour la commune, l'arrivée de ces nouveaux habitants a eu des effets concrets. L'épicerie, qui menaçait de fermer, a retrouvé des clients ; une classe a même rouvert dans l'école primaire du village voisin. Le maire parle d'un « second souffle ».

    Tout n'est pas rose pour autant. Certains habitants de longue date craignent une hausse des prix de l'immobilier, et l'intégration ne se fait pas toujours naturellement. « Il ne suffit pas d'avoir une bonne connexion, il faut aussi participer à la vie du village », reconnaît Mathieu, qui a rejoint le comité des fêtes. D'autres soulignent que ce modèle reste réservé à certains métiers : on ne peut pas réparer une voiture ou soigner un patient à distance.

    Les économistes restent prudents. Selon eux, le phénomène serait réel mais limité : la plupart des télétravailleurs qui quittent les grandes villes choisissent des villes moyennes bien desservies par le train plutôt que des villages isolés. Reste que, dans ce coin d'Ardèche, l'ancienne école a retrouvé ses élèves. Ils ont simplement trente ans de plus, et ils apportent leur ordinateur au lieu de leur cartable.
  translation: |
    In this Ardèche village of four hundred inhabitants, the old school had been closed for fifteen years. Today its two classrooms house a coworking space: a dozen desks, a high-speed broadband connection, a shared kitchen and an unobstructed view of the chestnut trees.

    "At first, nobody believed in it," says Mathieu Ferrer, one of the founders. "The residents wondered who would come and work here." Today around twenty people share the space: a translator, two developers, an architect, an accountant, but also employees of companies based in Lyon or Paris who only go to head office once or twice a month.

    Among them is Laura, 34, a project manager at a bank. "Before, I spent three hours a day commuting. If someone had told me I would one day work facing the mountains, I wouldn't have believed it. With hindsight, I should have left much sooner."

    For the municipality, the arrival of these new residents has had concrete effects. The grocery shop, which was in danger of closing, has won back customers; a class has even reopened in the primary school of the neighbouring village. The mayor talks of a "new lease of life".

    It's not all rosy, though. Some long-standing residents fear a rise in property prices, and integration doesn't always happen naturally. "It's not enough to have a good connection; you also have to take part in village life," admits Mathieu, who has joined the events committee. Others point out that this model remains limited to certain jobs: you can't repair a car or treat a patient remotely.

    Economists remain cautious. According to them, the phenomenon is real but limited: most remote workers who leave the big cities choose medium-sized towns with good train connections rather than isolated villages. The fact remains that in this corner of the Ardèche, the old school has got its pupils back. They're simply thirty years older, and they bring their laptops instead of their school bags.
  glossary: |
    un espace de travail partagé | a coworking space | also: un espace de coworking
    le très haut débit | high-speed broadband
    une vue imprenable | an unobstructed view | literally "a view that can't be taken away"
    un châtaignier | a chestnut tree | typical of the Ardèche
    le siège | head office
    un second souffle | a new lease of life | literally "a second breath"
    tout n'est pas rose | it's not all rosy
    le comité des fêtes | the village events committee
    bien desservi | well served by public transport
  questions: |
    mc: What was the building before it became a coworking space? || A post office | *A school | A grocery shop || "L'ancienne école était fermée depuis quinze ans."
    short: How long did Laura spend commuting every day before? || kw: trois/3/three || "Je passais trois heures par jour dans les transports."
    tf: The village grocery shop has closed down. || false || It "menaçait de fermer", but it "a retrouvé des clients".
    mc: What do some long-standing residents fear? || *A rise in property prices | More traffic in the village | The closure of the coworking space || "Certains habitants de longue date craignent une hausse des prix de l'immobilier."
    fill: Selon les économistes, la plupart des télétravailleurs choisissent des villes ___ bien desservies par le train. || moyennes || "Des villes moyennes bien desservies par le train plutôt que des villages isolés."
    tf: Mathieu thinks a good internet connection is enough to fit into village life. || false || "Il ne suffit pas d'avoir une bonne connexion, il faut aussi participer à la vie du village."

- slug: des-milliers-de-scientifiques-amateurs
  kind: reading
  title: Des milliers de scientifiques amateurs
  topic: Science and technology
  summary: Read an article about citizen science — volunteers who count birds, photograph butterflies or classify galaxies to help researchers.
  free: false
  text: |
    Un samedi matin de janvier, Hélène, 67 ans, s'installe près de la fenêtre de sa cuisine avec une tasse de café, un carnet et une paire de jumelles. Pendant une heure, elle va compter tous les oiseaux qui se posent dans son jardin : mésanges, rouges-gorges, moineaux, merles. Ses observations seront ensuite envoyées sur un site internet, où elles seront analysées par des chercheurs.

    Hélène fait partie des dizaines de milliers de Français qui participent à des programmes de sciences participatives. Le principe est simple : des citoyens sans formation scientifique collectent des données que les chercheurs n'auraient jamais pu réunir seuls. Car aucun laboratoire ne dispose d'assez de personnel pour observer en même temps des milliers de jardins, de parcs et de balcons.

    Les oiseaux ne sont pas les seuls concernés. Selon les programmes, les volontaires photographient des papillons, signalent des hérissons, mesurent la qualité de l'eau des rivières ou notent la date de floraison des arbres. Certains projets se font même depuis un canapé : on peut, par exemple, aider à classer des milliers d'images de galaxies prises par des télescopes.

    Ces données ont déjà permis des avancées importantes. Grâce aux observations accumulées pendant des années, le déclin de certaines espèces d'oiseaux communs a pu être mesuré avec précision. Le déplacement vers le nord de plusieurs espèces, lié au réchauffement climatique, a également été mis en évidence.

    Les scientifiques reconnaissent toutefois les limites de la méthode. Les débutants se trompent parfois d'espèce, et les jardins observés ne sont pas répartis de façon équilibrée sur le territoire. C'est pourquoi les protocoles sont très précis : même heure, même durée, même lieu. Les données douteuses sont vérifiées, et les erreurs isolées se perdent dans la masse.

    Pour Hélène, l'intérêt dépasse la science. « Depuis que je compte les oiseaux, je les regarde autrement. Avant, je voyais "des oiseaux". Aujourd'hui, je reconnais le chant du rouge-gorge et je m'inquiète quand les hirondelles arrivent en retard. » Elle a même convaincu ses petits-enfants de participer avec elle. La transmission, dit-elle, est peut-être le plus beau résultat de l'expérience.
  translation: |
    One Saturday morning in January, Hélène, 67, settles down by her kitchen window with a cup of coffee, a notebook and a pair of binoculars. For an hour she will count all the birds that land in her garden: tits, robins, sparrows, blackbirds. Her observations will then be sent to a website, where they will be analysed by researchers.

    Hélène is one of tens of thousands of people in France who take part in citizen science programmes. The principle is simple: citizens with no scientific training collect data that researchers could never have gathered on their own. No laboratory has enough staff to observe thousands of gardens, parks and balconies at the same time.

    Birds are not the only ones concerned. Depending on the programme, volunteers photograph butterflies, report hedgehogs, measure the water quality of rivers or note when trees come into flower. Some projects can even be done from the sofa: you can, for example, help classify thousands of images of galaxies taken by telescopes.

    This data has already made important progress possible. Thanks to observations accumulated over years, the decline of certain common bird species has been measured precisely. The northward shift of several species, linked to global warming, has also been demonstrated.

    Scientists nevertheless recognise the limits of the method. Beginners sometimes get the species wrong, and the gardens observed are not evenly spread across the country. That's why the protocols are very precise: same time, same duration, same place. Doubtful data is checked, and isolated mistakes get lost in the mass.

    For Hélène, the interest goes beyond science. "Since I've been counting birds, I look at them differently. Before, I saw 'birds'. Now I recognise the robin's song and I worry when the swallows arrive late." She has even persuaded her grandchildren to take part with her. Passing it on, she says, may be the best result of the experience.
  glossary: |
    des jumelles | binoculars | always plural
    une mésange | a tit (small bird)
    un rouge-gorge | a robin | plural: des rouges-gorges
    les sciences participatives | citizen science
    un hérisson | a hedgehog
    la floraison | flowering; blossoming
    mettre en évidence | to show; to demonstrate
    un protocole | a protocol; a set procedure
    une hirondelle | a swallow
  questions: |
    mc: How long does Hélène spend counting the birds? || Ten minutes | *One hour | The whole morning || "Pendant une heure, elle va compter tous les oiseaux."
    tf: Volunteers in citizen science programmes need scientific training. || false || "Des citoyens sans formation scientifique collectent des données."
    short: Name one other thing that volunteers observe or measure, apart from birds. || kw: papillons/butterflies/hérissons/hedgehogs/eau/water/rivières/rivers/floraison/flowering/flowers/arbres/trees/galaxies || Butterflies, hedgehogs, river water quality, trees flowering or galaxies.
    mc: Why are the protocols so precise? || *To limit errors and make the data comparable | Because the law requires it | To save the volunteers' time || "Même heure, même durée, même lieu" — so that the data can be compared and checked.
    fill: Le déplacement de plusieurs espèces vers le ___ est lié au réchauffement climatique. || nord || "Le déplacement vers le nord de plusieurs espèces, lié au réchauffement climatique."
    tf: Hélène's grandchildren take part with her. || true || "Elle a même convaincu ses petits-enfants de participer avec elle."

- slug: l-immeuble-doit-il-etre-renove
  kind: listening
  title: L'immeuble doit-il être rénové ?
  topic: Environment
  summary: Listen to a residents' meeting where three co-owners debate an expensive energy renovation of their 1960s building.
  free: false
  speakers: B=Mme Bertin/f; R=Rémi/m; O=M. Oliveira/m
  text: |
    B: Bonsoir à tous. Le point principal de ce soir, c'est l'isolation de l'immeuble. Comme vous le savez, notre bâtiment date de 1965 et il consomme énormément d'énergie.
    R: C'est pourquoi nos factures de chauffage ont presque doublé en trois ans. L'hiver dernier, il faisait si froid dans mon salon que je portais un pull en permanence.
    O: Je ne dis pas le contraire. Mais le devis s'élève à huit cent mille euros pour quarante appartements. Ça fait vingt mille euros par logement, ce n'est pas rien !
    B: C'est vrai. Néanmoins, une grande partie des travaux pourrait être financée par des aides publiques, à condition que le projet soit voté avant la fin de l'année.
    O: Des aides, d'accord, mais beaucoup d'entre nous sont retraités. Même avec les aides, certains n'auront pas les moyens de payer.
    R: Justement, on peut étaler les paiements sur plusieurs années. Et une fois les travaux terminés, les factures baisseront, si bien qu'une partie de l'investissement sera remboursée.
    O: Vous dites ça, mais les économies sont toujours plus faibles que prévu. Mon beau-frère a fait isoler sa maison, et ses factures n'ont baissé que de quinze pour cent.
    B: Chaque bâtiment est différent. Dans notre cas, l'étude prévoit une baisse d'environ quarante pour cent, du fait de la très mauvaise isolation actuelle des murs et des fenêtres.
    R: Et il n'y a pas que l'argent. Contrairement à ce qu'on pense, une bonne isolation protège aussi de la chaleur en été. En juillet, mon appartement est un véritable four.
    O: Admettons. Mais pendant les travaux, on aura des échafaudages devant les fenêtres pendant combien de temps ?
    B: Environ huit mois, d'après l'entreprise. Ce sera contraignant, c'est certain. En revanche, la valeur des appartements devrait augmenter.
    O: La valeur, ça m'est égal, je ne compte pas vendre. Ce qui m'inquiète, c'est le montant à payer chaque mois.
    R: Alors pourquoi ne pas demander d'autres devis ? Plutôt que de rejeter le projet, on pourrait comparer plusieurs entreprises.
    B: C'est une bonne idée. Je propose qu'on demande deux autres devis et qu'on organise une réunion d'information avec un conseiller en rénovation énergétique.
    O: Ça me paraît raisonnable. Faute d'informations précises, je ne voterai pas ce soir, mais je ne suis pas fermé à la discussion.
    B: Très bien. Nous voterons donc lors de l'assemblée générale de novembre. Merci à tous pour ce débat constructif.
  translation: |
    Mme Bertin: Good evening, everyone. The main item tonight is the insulation of the building. As you know, our building dates from 1965 and it uses an enormous amount of energy.
    Rémi: That's why our heating bills have almost doubled in three years. Last winter it was so cold in my living room that I wore a jumper all the time.
    M. Oliveira: I'm not saying otherwise. But the quote comes to eight hundred thousand euros for forty flats. That's twenty thousand euros per flat — that's not nothing!
    Mme Bertin: That's true. Nevertheless, a large part of the work could be funded by public grants, provided the project is voted through before the end of the year.
    M. Oliveira: Grants, fine, but many of us are retired. Even with the grants, some won't be able to afford it.
    Rémi: Exactly, we can spread the payments over several years. And once the work is finished, the bills will go down, so part of the investment will pay for itself.
    M. Oliveira: So you say, but the savings are always smaller than expected. My brother-in-law had his house insulated, and his bills only went down by fifteen per cent.
    Mme Bertin: Every building is different. In our case, the study forecasts a drop of around forty per cent, because the walls and windows are so badly insulated at the moment.
    Rémi: And it's not just about money. Contrary to what people think, good insulation also protects you from the heat in summer. In July my flat is a real oven.
    M. Oliveira: Granted. But during the work, how long will we have scaffolding in front of our windows?
    Mme Bertin: About eight months, according to the company. It will be inconvenient, that's for sure. On the other hand, the value of the flats should go up.
    M. Oliveira: The value doesn't matter to me, I don't intend to sell. What worries me is the amount to pay each month.
    Rémi: Then why not ask for other quotes? Rather than rejecting the project, we could compare several companies.
    Mme Bertin: That's a good idea. I propose that we ask for two more quotes and organise an information meeting with an energy renovation adviser.
    M. Oliveira: That seems reasonable to me. Without precise information I won't vote tonight, but I'm open to discussion.
    Mme Bertin: Very well. So we'll vote at the general meeting in November. Thank you all for this constructive debate.
  glossary: |
