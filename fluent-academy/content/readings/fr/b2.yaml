    short: How much would the work cost per flat? || kw: vingt mille/20 000/20000/20,000/twenty thousand || "Ça fait vingt mille euros par logement."
    tf: According to the study, the heating bills could fall by about forty per cent. || true || "L'étude prévoit une baisse d'environ quarante pour cent."
    mc: What worries M. Oliveira most? || *The amount he would have to pay each month | The fall in the value of the flats | The noise of the work || "Ce qui m'inquiète, c'est le montant à payer chaque mois."
    fill: Les échafaudages resteraient environ ___ mois devant les fenêtres. || huit || "Environ huit mois, d'après l'entreprise."
