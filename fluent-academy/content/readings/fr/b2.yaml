- slug: cinq-reflexes-avant-de-partager
  kind: reading
  title: Cinq réflexes avant de partager
  topic: Media and persuasion
  summary: Read a practical guide to five habits that help you avoid spreading false information online.
  free: false
  text: |
    Une photo spectaculaire, un titre qui fait peur, une citation qui indigne : chaque jour, des contenus trompeurs circulent sur les réseaux sociaux. La plupart des gens qui les partagent ne cherchent pas à mentir ; ils ont simplement été emportés par l'émotion. Voici cinq réflexes simples pour éviter de relayer une fausse information.

    Premier réflexe : vérifier la source. Qui a publié l'information ? Un média connu, un organisme officiel, un compte anonyme créé la semaine dernière ? Un nom qui ressemble à celui d'un grand journal n'en est pas forcément un : certains sites imitent l'apparence de médias réputés.

    Deuxième réflexe : regarder la date. Beaucoup d'« infos » qui circulent sont vraies… mais anciennes. Une inondation d'il y a dix ans peut être présentée comme si elle avait eu lieu hier. Un article qui annonçait qu'un projet serait lancé « la semaine prochaine » date peut-être de plusieurs années.

    Troisième réflexe : remonter à l'image d'origine. Une photo peut être sortie de son contexte, recadrée ou modifiée. Une recherche d'image inversée permet souvent de retrouver où et quand elle a été publiée pour la première fois. Méfiez-vous aussi des images trop parfaites : certaines ont été entièrement générées par une intelligence artificielle.

    Quatrième réflexe : lire au-delà du titre. Les titres sont écrits pour attirer les clics. Il arrive qu'un article affirmant que « le chocolat fait maigrir » précise, au cinquième paragraphe, que l'étude n'a porté que sur douze personnes.

    Cinquième réflexe : s'interroger sur ses propres émotions. Si un contenu vous met en colère ou vous fait très peur, prenez une minute avant de le partager. C'est précisément l'effet que recherchent ceux qui fabriquent de fausses informations, car l'émotion se partage plus vite que la réflexion.

    Aucun de ces réflexes n'est infaillible, et personne n'est à l'abri d'une erreur : les journalistes eux-mêmes se font parfois piéger. Mais si chacun prenait l'habitude de vérifier avant de partager, la désinformation circulerait beaucoup moins vite. Et si vous vous êtes trompé, le meilleur réflexe reste de le reconnaître : supprimer la publication et prévenir les personnes qui l'ont vue.
  translation: |
    A spectacular photo, a frightening headline, an outrageous quote: every day, misleading content circulates on social media. Most people who share it are not trying to lie; they have simply been carried away by emotion. Here are five simple habits to avoid passing on false information.

    First habit: check the source. Who published the information? A well-known news outlet, an official body, an anonymous account created last week? A name that looks like that of a major newspaper isn't necessarily one: some sites imitate the appearance of reputable media.

    Second habit: look at the date. A lot of the "news" that circulates is true… but old. A flood from ten years ago can be presented as if it had happened yesterday. An article announcing that a project would be launched "next week" may be several years old.

    Third habit: trace the original image. A photo can be taken out of context, cropped or altered. A reverse image search often lets you find out where and when it was first published. Also be wary of images that are too perfect: some have been entirely generated by artificial intelligence.

    Fourth habit: read beyond the headline. Headlines are written to attract clicks. It sometimes happens that an article claiming that "chocolate makes you lose weight" explains in the fifth paragraph that the study involved only twelve people.

    Fifth habit: question your own emotions. If a piece of content makes you angry or very frightened, take a minute before sharing it. That is precisely the effect sought by those who manufacture false information, because emotion spreads faster than reflection.

    None of these habits is foolproof, and nobody is safe from making a mistake: journalists themselves sometimes get caught out. But if everyone got into the habit of checking before sharing, disinformation would spread much more slowly. And if you have made a mistake, the best reflex is still to admit it: delete the post and warn the people who saw it.
  glossary: |
    indigner | to outrage | s'indigner = to be outraged
    emporté par | carried away by
    relayer | to pass on; to relay
    réputé | reputable; well-known
    recadrer | to crop (a photo)
    une recherche d'image inversée | a reverse image search
    attirer les clics | to attract clicks
    infaillible | foolproof; infallible
    être à l'abri de | to be safe from
  questions: |
    mc: According to the text, why do most people share false information? || They want to deceive others | *They are carried away by emotion | They are paid to share it || "Ils ont simplement été emportés par l'émotion."
    tf: According to the text, old news stories that circulate are always false. || false || "Beaucoup d'« infos » qui circulent sont vraies… mais anciennes."
    short: What can a reverse image search help you find out? || kw: où/quand/where/when/origine/original/première fois/first || "Où et quand elle a été publiée pour la première fois."
    mc: In the chocolate example, what does the article reveal in the fifth paragraph? || *The study involved only twelve people | Chocolate is bad for your health | The study never existed || "L'étude n'a porté que sur douze personnes."
    fill: L'émotion se partage plus vite que la ___. || réflexion || "Car l'émotion se partage plus vite que la réflexion."
    tf: The author says that journalists never get caught out. || false || "Les journalistes eux-mêmes se font parfois piéger."

- slug: au-chevet-des-tableaux
  kind: reading
  title: Au chevet des tableaux
  topic: Arts and culture
  summary: Read a portrait of a painting restorer who spends months bringing an eighteenth-century portrait back to life.
  free: false
  text: |
    Dans l'atelier où travaille Agathe Morin, il règne un silence presque religieux. Sur un grand chevalet repose un portrait du XVIIIᵉ siècle, au centre duquel une jeune femme en robe bleue semble attendre quelque chose. Agathe est restauratrice de tableaux. Depuis vingt ans, elle soigne des œuvres abîmées par le temps, l'humidité ou des restaurations maladroites.

    « Les gens imaginent souvent qu'on repeint les tableaux, explique-t-elle. C'est exactement ce que nous évitons. Notre règle, c'est d'intervenir le moins possible, et de manière réversible : tout ce que je fais aujourd'hui doit pouvoir être défait dans cinquante ans. »

    Avant de toucher l'œuvre, Agathe l'examine pendant des jours. Elle utilise une lampe à ultraviolets, sous laquelle les retouches anciennes apparaissent comme des taches sombres, et des radiographies grâce auxquelles on découvre parfois un autre tableau caché sous le premier. « Sur ce portrait, j'ai trouvé une première version du visage, que le peintre avait modifiée. C'est le genre de découverte pour laquelle on fait ce métier. »

    Vient ensuite le nettoyage. Avec un coton fixé au bout d'une fine baguette de bois, elle retire millimètre par millimètre le vernis jauni, derrière lequel les couleurs d'origine réapparaissent. Le bleu de la robe, que tout le monde croyait vert, retrouve peu à peu son éclat. Ce travail, au cours duquel la moindre erreur pourrait être irréversible, demande une patience extraordinaire : il faudra six mois pour ce seul tableau.

    Le métier exige une double formation, scientifique et artistique. Agathe a étudié la chimie avant d'entrer dans une école de restauration, à laquelle on accède par un concours très sélectif. « Il faut connaître les pigments, les solvants, mais aussi l'histoire de l'art. Sans cela, on risque de trahir l'œuvre. »

    Ce qu'elle préfère ? Le moment où elle rend le tableau au musée. « Je l'ai vu de plus près que n'importe qui, pendant des mois. Ensuite, il retourne sur son mur, et des milliers de visiteurs passent devant sans savoir tout ce qu'il a traversé. C'est un peu comme dire au revoir à quelqu'un qu'on a soigné. »
  translation: |
    In the studio where Agathe Morin works, there is an almost religious silence. On a large easel stands an eighteenth-century portrait, at the centre of which a young woman in a blue dress seems to be waiting for something. Agathe is a painting restorer. For twenty years she has been caring for works damaged by time, damp or clumsy restorations.

    "People often imagine that we repaint pictures," she explains. "That's exactly what we avoid. Our rule is to intervene as little as possible, and in a reversible way: everything I do today must be able to be undone in fifty years."

    Before touching the work, Agathe examines it for days. She uses an ultraviolet lamp, under which old retouches appear as dark patches, and X-rays, thanks to which another painting is sometimes discovered hidden beneath the first. "On this portrait, I found an earlier version of the face, which the painter had changed. That's the kind of discovery you do this job for."

    Then comes the cleaning. With cotton wool fixed to the end of a thin wooden stick, she removes the yellowed varnish millimetre by millimetre, behind which the original colours reappear. The blue of the dress, which everyone thought was green, is gradually getting its brilliance back. This work, during which the slightest mistake could be irreversible, requires extraordinary patience: this one painting will take six months.

    The job requires dual training, scientific and artistic. Agathe studied chemistry before entering a restoration school, which you get into through a very selective competitive exam. "You need to know about pigments and solvents, but also about art history. Without that, you risk betraying the work."

    What does she like best? The moment when she gives the painting back to the museum. "I've seen it more closely than anyone else, for months. Then it goes back on its wall, and thousands of visitors walk past without knowing everything it has been through. It's a bit like saying goodbye to someone you've looked after."
  glossary: |
    au chevet de | at the bedside of | normally used for patients; here figurative
    un chevalet | an easel
    abîmé | damaged
    réversible | reversible | the opposite is irréversible
    une retouche | a retouch; a touch-up
    une radiographie | an X-ray
    le vernis | varnish
    un éclat | brilliance; radiance
    trahir | to betray
  questions: |
    mc: What is Agathe's main rule? || *To intervene as little as possible, in a reversible way | To repaint the damaged parts | To work as fast as possible || "Notre règle, c'est d'intervenir le moins possible, et de manière réversible."
    tf: Under ultraviolet light, old retouches appear as dark patches. || true || "Une lampe à ultraviolets, sous laquelle les retouches anciennes apparaissent comme des taches sombres."
    short: How long will the restoration of this portrait take? || kw: six/6 || "Il faudra six mois pour ce seul tableau."
    mc: What did Agathe discover on this portrait? || *An earlier version of the face | The painter's hidden signature | A second portrait on the back || "J'ai trouvé une première version du visage, que le peintre avait modifiée."
    fill: On entre dans une école de restauration par un ___ très sélectif. || concours || "Une école de restauration, à laquelle on accède par un concours très sélectif."
    tf: Everyone had always known the dress was blue. || false || "Le bleu de la robe, que tout le monde croyait vert…"

- slug: une-facture-d-eau-trop-salee
  kind: listening
  title: Une facture d'eau trop salée
  topic: Citizenship and public life
  summary: Listen to a customer calling the municipal water service about a bill five times higher than usual, and to the solution they agree on.
  free: false
  speakers: A=Arnaud/m; H=Hélène Marchand/f
  text: |
    A: Service clients de la régie des eaux, Arnaud à votre écoute. Que puis-je faire pour vous ?
    H: Bonjour monsieur. Je vous appelle au sujet de ma dernière facture d'eau. Elle s'élève à six cent quarante euros, alors que je paie habituellement autour de cent vingt euros par semestre.
    A: Je comprends votre surprise. Pourriez-vous me donner votre numéro de contrat, s'il vous plaît ?
    H: Bien sûr, c'est le 730914. Je dois vous dire que je suis assez mécontente. J'ai déjà envoyé un courriel il y a trois semaines, et je m'étonne que personne ne m'ait répondu.
    A: Je suis désolé que vous n'ayez pas eu de réponse. Je vois effectivement votre message dans notre système. Il semble qu'il n'ait pas encore été traité.
    H: Il semble… Bon. Est-ce que vous voyez d'où vient le problème ?
    A: D'après nos relevés, votre consommation aurait été multipliée par cinq. Est-il possible que vous ayez eu une fuite ?
    H: C'est justement ce que je me suis demandé. J'ai fait venir un plombier la semaine dernière, et il n'a trouvé aucune fuite. Il pense que le compteur est défectueux.
    A: Dans ce cas, nous pouvons envoyer un technicien pour vérifier le compteur. Si le défaut est confirmé, la facture sera recalculée sur la base de votre consommation habituelle.
    H: Très bien. Et en attendant, est-ce que je dois payer les six cent quarante euros ?
    A: Non. Je vais suspendre le prélèvement jusqu'à ce que le technicien soit passé. Vous ne serez pas prélevée ce mois-ci.
    H: C'est déjà un soulagement. Quand le technicien peut-il venir ?
    A: J'ai une disponibilité jeudi prochain, entre huit heures et midi. Est-ce que cela vous conviendrait ?
    H: Je travaille le jeudi matin, mais je m'arrangerai pour que mon fils soit à la maison. Il faudra qu'il ait accès au compteur, je suppose ?
    A: Oui, il se trouve normalement dans le regard, devant votre portail. Pensez à dégager l'accès avant la visite, si possible.
    H: D'accord. Et je voudrais une confirmation écrite de tout ce que vous venez de me dire.
    A: Bien sûr. Vous recevrez un courriel de confirmation dans l'heure, avec la date du rendez-vous et la suspension du prélèvement.
    H: Parfait. Je vous remercie, monsieur. J'aurais préféré ne pas avoir à appeler, mais je suis contente que nous ayons trouvé une solution.
    A: Je vous en prie, madame. Encore désolé pour ce désagrément, et bonne fin de journée.
  translation: |
    Arnaud: Water services customer department, Arnaud speaking. What can I do for you?
    Hélène Marchand: Good afternoon. I'm calling about my latest water bill. It comes to six hundred and forty euros, whereas I usually pay around a hundred and twenty euros every six months.
    Arnaud: I understand your surprise. Could you give me your contract number, please?
    Hélène Marchand: Of course, it's 730914. I must tell you that I'm rather unhappy. I already sent an email three weeks ago, and I'm surprised nobody has answered me.
    Arnaud: I'm sorry you haven't had a reply. I can indeed see your message in our system. It seems it hasn't been dealt with yet.
    Hélène Marchand: It seems… Well. Can you see where the problem comes from?
    Arnaud: According to our readings, your consumption has apparently been multiplied by five. Is it possible that you've had a leak?
    Hélène Marchand: That's exactly what I wondered. I had a plumber come round last week, and he didn't find any leak. He thinks the meter is faulty.
    Arnaud: In that case, we can send a technician to check the meter. If the fault is confirmed, the bill will be recalculated on the basis of your usual consumption.
    Hélène Marchand: Very good. And in the meantime, do I have to pay the six hundred and forty euros?
    Arnaud: No. I'm going to suspend the direct debit until the technician has been. You won't be debited this month.
    Hélène Marchand: That's already a relief. When can the technician come?
    Arnaud: I have a slot next Thursday, between eight o'clock and noon. Would that suit you?
    Hélène Marchand: I work on Thursday mornings, but I'll arrange for my son to be at home. He'll need to have access to the meter, I suppose?
    Arnaud: Yes, it's normally in the inspection chamber in front of your gate. Please remember to clear access to it before the visit, if possible.
    Hélène Marchand: All right. And I'd like written confirmation of everything you've just told me.
    Arnaud: Of course. You'll receive a confirmation email within the hour, with the date of the appointment and the suspension of the direct debit.
    Hélène Marchand: Perfect. Thank you. I'd rather not have had to call, but I'm glad we've found a solution.
    Arnaud: You're welcome, madam. Sorry again for the inconvenience, and have a good rest of the day.
  glossary: |
    une facture salée | a steep bill | informal: salé = salty, here very expensive
    la régie des eaux | the municipal water service
    un semestre | a six-month period
    un relevé | a meter reading
    une fuite | a leak
    un compteur | a meter
    défectueux | faulty | feminine: défectueuse
    un prélèvement | a direct debit | être prélevé = to be debited
    un regard | an inspection chamber | also: a look
    un désagrément | an inconvenience
  questions: |
    mc: How much is Hélène's latest bill? || A hundred and twenty euros | *Six hundred and forty euros | Seven hundred and thirty euros || "Elle s'élève à six cent quarante euros."
    tf: Hélène's first email had already received a reply. || false || "Je m'étonne que personne ne m'ait répondu."
    short: According to the plumber, what is causing the problem? || kw: compteur/meter/défectueux/faulty || "Il pense que le compteur est défectueux."
    mc: What will happen to the direct debit? || *It will be suspended until the technician has been | It will be doubled next month | It will be cancelled for a year || "Je vais suspendre le prélèvement jusqu'à ce que le technicien soit passé."
    fill: Le technicien peut passer jeudi prochain, entre huit heures et ___. || midi || "J'ai une disponibilité jeudi prochain, entre huit heures et midi."
    mc: Who will be at home for the technician's visit? || *Hélène's son | Hélène herself | The plumber || "Je m'arrangerai pour que mon fils soit à la maison."

- slug: rire-en-deux-langues
  kind: listening
  title: Rire en deux langues
  topic: Arts and culture
  summary: Listen to a radio interview with a comedian who builds her shows on growing up between two cultures and on playing with languages.
  free: false
  speakers: F=Florian/m; S=Samira/f
  text: |
    F: Bonsoir Samira, et merci d'être avec nous. Votre nouveau spectacle s'appelle « Entre deux chaises ». Pourquoi ce titre ?
    S: Parce que c'est exactement là que je suis assise depuis toujours ! Je suis née à Roubaix, mes parents viennent de Kabylie, et j'ai longtemps eu l'impression de n'appartenir ni à un côté ni à l'autre.
    F: Et aujourd'hui, vous en riez sur scène.
    S: Oui, c'est la meilleure thérapie que je connaisse. Bien que mon père n'ait jamais vraiment compris mon métier, il vient à tous mes spectacles. Il rit toujours au mauvais moment, mais il rit !
    F: Vous jouez beaucoup avec la langue. Il y a ce passage où vous mélangez le français, le kabyle et le ch'ti…
    S: C'est le passage auquel je tiens le plus. Le public ne comprend pas tous les mots, mais il comprend la situation : une grand-mère, une mère et une fille qui essaient de se mettre d'accord sur une recette.
    F: L'humour, c'est universel, alors ?
    S: Pas tout à fait. Les situations sont universelles, mais les jeux de mots, eux, ne se traduisent presque jamais. Quand j'ai joué à Montréal, j'ai dû réécrire la moitié des blagues, parce que les références n'étaient pas les mêmes.
    F: Quelle blague a eu le moins de succès au Québec ?
    S: Une blague sur les numéros des départements. En France, tout le monde sait que le 59, c'est le Nord. À Montréal, personne ne voyait ce qui était drôle !
    F: Certains humoristes disent qu'on ne peut plus rire de tout. Qu'en pensez-vous ?
    S: Je pense qu'on peut rire de beaucoup de choses, mais pas avec n'importe qui, ni de n'importe quelle manière. Mon arme principale, c'est l'autodérision. Si je me moque d'abord de moi-même, le public accepte que je me moque un peu de lui ensuite.
    F: Vous avez commencé dans un petit café-théâtre de Lille. Vous imaginiez une telle carrière ?
    S: Pas du tout. Si on m'avait dit il y a dix ans que je jouerais un jour dans une grande salle parisienne, j'aurais éclaté de rire.
    F: Et la suite ?
    S: J'aimerais écrire un spectacle en deux langues, pour qu'on puisse le jouer en France et en Algérie. D'ici deux ans, j'espère que je l'aurai terminé… si mes parents arrêtent de me donner des idées !
    F: Merci, Samira. « Entre deux chaises », c'est à voir à partir du 12 mars.
  translation: |
    Florian: Good evening, Samira, and thank you for being with us. Your new show is called "Entre deux chaises" ("Between two chairs"). Why that title?
    Samira: Because that's exactly where I've always been sitting! I was born in Roubaix, my parents come from Kabylia, and for a long time I felt I didn't belong to either side.
    Florian: And today you laugh about it on stage.
    Samira: Yes, it's the best therapy I know. Although my father has never really understood my job, he comes to all my shows. He always laughs at the wrong moment, but he laughs!
    Florian: You play a lot with language. There's that part where you mix French, Kabyle and the Ch'ti dialect…
    Samira: That's the part I care about most. The audience doesn't understand every word, but they understand the situation: a grandmother, a mother and a daughter trying to agree on a recipe.
    Florian: So humour is universal?
    Samira: Not quite. The situations are universal, but puns almost never translate. When I performed in Montreal, I had to rewrite half the jokes, because the references weren't the same.
    Florian: Which joke went down worst in Quebec?
    Samira: A joke about the numbers of the French départements. In France, everyone knows that 59 is the Nord. In Montreal, nobody could see what was funny!
    Florian: Some comedians say you can't laugh about everything any more. What do you think?
    Samira: I think you can laugh about a lot of things, but not with just anyone, or in just any way. My main weapon is self-mockery. If I make fun of myself first, the audience accepts that I then make fun of them a little.
    Florian: You started in a small comedy café in Lille. Did you imagine a career like this?
    Samira: Not at all. If someone had told me ten years ago that I'd one day play in a big Paris venue, I'd have burst out laughing.
    Florian: And what's next?
    Samira: I'd like to write a show in two languages, so that it can be performed in France and in Algeria. In two years' time, I hope I'll have finished it… if my parents stop giving me ideas!
    Florian: Thank you, Samira. "Entre deux chaises" — on from 12 March.
  glossary: |
    être assis entre deux chaises | to be caught between two worlds | literally "to sit between two chairs"
    la Kabylie | Kabylia | a region in northern Algeria; its language is le kabyle
    le ch'ti | the dialect of the Nord region | also refers to the people of the Nord
    tenir à | to care about; to value
    une référence | a cultural reference
    se moquer de | to make fun of
    un café-théâtre | a small comedy venue
    éclater de rire | to burst out laughing
  questions: |
    mc: Where was Samira born? || In Kabylia | *In Roubaix | In Montreal || "Je suis née à Roubaix, mes parents viennent de Kabylie."
    tf: Samira's father doesn't come to her shows. || false || "Il vient à tous mes spectacles. Il rit toujours au mauvais moment, mais il rit !"
    short: Which part of the show does Samira care about most? || kw: langues/languages/mélange/mix/mixes/recette/recipe/grand-mère/grandmother || The part where she mixes French, Kabyle and Ch'ti, about three women agreeing on a recipe.
    mc: What did she have to do before performing in Montreal? || *Rewrite half of her jokes | Translate her show into English | Shorten her show by half || "J'ai dû réécrire la moitié des blagues."
    fill: Selon Samira, son arme principale, c'est l'___. || autodérision || "Mon arme principale, c'est l'autodérision."
    mc: What is her next project? || *A show in two languages for France and Algeria | A film about her family | A book of her best jokes || "J'aimerais écrire un spectacle en deux langues, pour qu'on puisse le jouer en France et en Algérie."

- slug: l-an-2000-vu-de-1970
  kind: reading
  title: L'an 2000 vu de 1970
  topic: Looking ahead
  summary: Read an essay on what people in 1970 imagined the year 2000 would look like, why forecasts so often go wrong, and what future readers may think of us.
  free: false
  text: |
    En 1970, beaucoup de magazines aimaient imaginer le monde de l'an 2000. On y voyait des voitures volantes, des villes sous des dômes de verre, des robots qui faisaient le ménage et des familles en vacances sur la Lune. « D'ici l'an 2000, on aura vaincu la plupart des maladies et la semaine de travail aura été réduite de moitié », promettait-on.

    Relire ces prédictions aujourd'hui fait sourire. Les voitures ne volent toujours pas, et personne n'a passé ses vacances sur la Lune. Pourtant, les futurologues de l'époque n'avaient pas tout faux. Certains avaient prévu que les ordinateurs entreraient dans les foyers et que l'on pourrait se parler en se voyant à distance. Ce qu'ils n'avaient pas imaginé, en revanche, c'est que ces ordinateurs tiendraient dans une poche, et que nous passerions des heures chaque jour à regarder un petit écran.

    Pourquoi se trompe-t-on si souvent ? D'abord parce qu'on imagine l'avenir à partir du présent. En 1970, la conquête spatiale fascinait le public : si les premiers pas sur la Lune n'avaient pas eu lieu un an plus tôt, on aurait sans doute beaucoup moins parlé de vacances dans l'espace. Ensuite, parce que les innovations les plus importantes sont souvent invisibles au départ. Presque personne n'avait prévu que le plus grand changement viendrait d'un réseau reliant des ordinateurs entre eux.

    Enfin, on surestime souvent ce qui va changer en dix ans, et l'on sous-estime ce qui changera en cinquante. Les transformations profondes — la place des femmes dans le monde du travail, l'allongement de l'espérance de vie, la prise de conscience écologique — se font lentement, presque sans bruit, et elles font rarement la une des magazines.

    Que retiendront de nous les lecteurs de 2070 ? Ils souriront peut-être de nos voitures autonomes ou de nos robots conversationnels. Ils se demanderont aussi, sans doute, pourquoi nous n'avons pas agi plus vite face au réchauffement climatique. D'ici là, nous aurons peut-être appris une leçon simple : l'avenir ne se prédit pas, il se prépare.
  translation: |
    In 1970, many magazines liked to imagine the world of the year 2000. They showed flying cars, cities under glass domes, robots doing the housework and families on holiday on the Moon. "By the year 2000, we will have defeated most diseases and the working week will have been cut by half," people promised.

    Rereading these predictions today makes you smile. Cars still don't fly, and nobody has spent their holidays on the Moon. And yet the futurologists of the time weren't completely wrong. Some had predicted that computers would come into people's homes and that we would be able to talk to each other while seeing each other at a distance. What they hadn't imagined, on the other hand, was that these computers would fit in a pocket, and that we would spend hours every day looking at a small screen.

    Why do we get it wrong so often? First, because we imagine the future on the basis of the present. In 1970, space exploration fascinated the public: if the first steps on the Moon hadn't taken place a year earlier, there would probably have been much less talk of holidays in space. Second, because the most important innovations are often invisible at first. Almost nobody had foreseen that the biggest change would come from a network linking computers together.

    Finally, we often overestimate what will change in ten years and underestimate what will change in fifty. Deep transformations — the place of women in the world of work, longer life expectancy, environmental awareness — happen slowly, almost silently, and they rarely make the front page of magazines.

    What will the readers of 2070 remember about us? They may smile at our self-driving cars or our chatbots. They will probably also wonder why we didn't act faster against global warming. By then, we may have learnt a simple lesson: the future can't be predicted; it has to be prepared for.
