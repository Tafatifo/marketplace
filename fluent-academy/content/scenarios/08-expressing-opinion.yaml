slug: expressing-opinion
title: Expressing an opinion
description: Discuss a topical question — remote work — giving and justifying your view and responding to counter-arguments.
category: opinion
levels: B1-B2
order: 8
goals:
  - State your opinion clearly
  - Support it with at least two reasons or examples
  - Respond to a counter-argument
  - Reach a nuanced conclusion
roles:
  tutor: a friend who enjoys a good debate
  learner: yourself
languages:
  fr:
    opener: Dis-moi, tu penses que le télétravail, c'est une bonne chose ? | Tell me, do you think remote work is a good thing?
    focus: [fr.subjonctif, fr.opinion, fr.discourse-markers]
    vocab: |
      à mon avis / selon moi | in my opinion
      d'un côté… de l'autre… | on the one hand… on the other…
      je ne pense pas que… (+ subj.) | I don't think that…
      c'est vrai, mais… | that's true, but…
      tout dépend de… | it all depends on…
    script: |
      Intéressant. Tu peux me donner un exemple concret ? | Interesting. Can you give me a concrete example? | Give an example from your experience | kw: par exemple/moi/quand/j'ai
      Mais tu ne crois pas qu'on se sent isolé quand on travaille seul chez soi ? | But don't you think people feel isolated working alone at home? | Respond to the counter-argument | kw: c'est vrai/mais/pas forcément/je ne pense pas
      Et pour les entreprises, c'est avantageux, à ton avis ? | And for companies, is it advantageous, in your opinion? | Give your view on employers | kw: entreprises/avantage/coûts/productivité/à mon avis
      Alors, finalement, tu dirais quoi : plutôt pour ou plutôt contre ? | So, in the end, what would you say: rather for or against? | Give a nuanced conclusion | kw: finalement/tout dépend/plutôt/en conclusion
  es:
    opener: Oye, ¿tú crees que el teletrabajo es algo positivo? | Hey, do you think remote work is a positive thing?
    focus: [es.subjunctive, es.opinion, es.discourse-markers]
    vocab: |
      en mi opinión / para mí | in my opinion
      por un lado… por otro… | on the one hand… on the other…
      no creo que… (+ subj.) | I don't think that…
      es verdad, pero… | that's true, but…
      depende de… | it depends on…
    script: |
      Interesante. ¿Me puedes dar un ejemplo concreto? | Interesting. Can you give me a concrete example? | Give an example | kw: por ejemplo/yo/cuando/he
      Pero, ¿no crees que la gente se siente aislada trabajando sola en casa? | But don't you think people feel isolated working alone at home? | Respond to the counter-argument | kw: es verdad/pero/no creo/no siempre
      ¿Y para las empresas es ventajoso, según tú? | And is it beneficial for companies, in your view? | Give your view on employers | kw: empresas/ventaja/costes/productividad/creo
      Entonces, al final, ¿estás más a favor o en contra? | So, in the end, are you more for or against? | Give a nuanced conclusion | kw: al final/depende/más bien/en conclusión
  de:
    opener: Sag mal, findest du Homeoffice eigentlich gut? | Tell me, do you actually think working from home is good?
    focus: [de.subordinate-clauses, de.opinion, de.discourse-markers]
    vocab: |
      meiner Meinung nach | in my opinion
      einerseits… andererseits… | on the one hand… on the other…
      ich glaube nicht, dass… | I don't believe that…
      das stimmt, aber… | that's true, but…
      es kommt darauf an, … | it depends …
    script: |
      Interessant. Kannst du mir ein konkretes Beispiel geben? | Interesting. Can you give me a concrete example? | Give an example | kw: zum beispiel/ich/wenn/als
      Aber glaubst du nicht, dass man sich allein zu Hause isoliert fühlt? | But don't you think people feel isolated alone at home? | Respond to the counter-argument | kw: das stimmt/aber/nicht unbedingt/glaube nicht
      Und für Unternehmen – ist das deiner Meinung nach ein Vorteil? | And for companies — is it an advantage, in your opinion? | Give your view on employers | kw: unternehmen/vorteil/kosten/meiner meinung
      Also, unterm Strich: eher dafür oder eher dagegen? | So, all things considered: rather for or against? | Give a nuanced conclusion | kw: insgesamt/kommt darauf an/eher/unterm strich
  en:
    opener: So, do you think working from home is a good thing? | -
    focus: [en.opinion, en.discourse-markers]
    vocab: |
      as far as I'm concerned | in my opinion
      on the one hand… on the other hand… | presenting both sides
      I'm not convinced that… | polite disagreement
      that's a fair point, but… | conceding and countering
      it really depends on… | nuancing a view
    script: |
      Interesting. Can you give me a concrete example? | - | Give an example from your experience | kw: for example/for instance/when/I
      But don't you think people end up feeling isolated at home? | - | Respond to the counter-argument | kw: fair point/but/not necessarily/I'm not
      And for companies — is it actually a good deal, in your view? | - | Give your view on employers | kw: companies/costs/productivity/advantage/think
      So, all things considered, are you more for or against it? | - | Give a nuanced conclusion | kw: overall/depends/on balance/all in all
